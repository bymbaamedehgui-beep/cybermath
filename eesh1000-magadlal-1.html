<script>
/* ЭЕШ 1000 — Магадлал, статистик-1 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Статистик: дундаж, стандарт хазайлт, квартил; олонлог; комбинаторик.
   Эх: 1.56, 1.29, 1.3, 4.4, 1.30, 1.89, 2.91, 2.92, 1.51, 1.66, 2.82, 2.83, 2.69, 2.70, 2.84, 2.85, 2.86, 1.35, 4.100 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 1.56 */
var e1_56 = (function () {
// 56. n элементтэй өгөгдлийн арифметик дундаж m ба Σ(x−c) = S өгөгдсөн → n.
//     Σ(x−c) = Σx − n·c = n·m − n·c = n(m − c) ⇒ n = S/(m − c).
var p56_D = [0.5, 1.5, 2.5, 3.5, 0.25, 0.75, 1.25, 0.2, 0.4, 0.6, 0.8, 1.2, 1.6, 2.4, 1, 2];
function p56() {
  var c = pick([5, 10, 10, 10, 15, 20, 25, 30, 40, 50]), d = pick(p56_D) * (rnd(0, 3) ? 1 : -1), n = rnd(6, 40);
  var m = +(c + d).toFixed(6), S = +(d * n).toFixed(6);
  if (S !== Math.round(S) || m <= 0 || Math.abs(S) < 4) return null;
  var sum = '\\sum(x-' + c + ')';
  // Бодолт (гар бичмэл): x̄ = Σx/n; Σ(x−c) = Σx − cn = S ⇒ Σx = cn + S; (cn + S)/n = m ⇒ |m − c|·n = |S|.
  var ad = Math.abs(d), aS = Math.abs(S), sx = c + 'n' + sgn(S);
  var fin = ad === 1 ? 'n=' + aS : dec(ad) + 'n=' + aS + '\\Rightarrow n=\\dfrac{' + aS + '}{' + dec(ad) + '}=' + n;
  var sol = [
    'Арифметик дундаж $\\bar x=\\dfrac{\\sum x}{n}=' + dec(m) + '$.',
    'Элемент бүрээс $' + c + '$-' + suf(c, 'ыг') + ' хассан тул $$' + sum + '=\\sum x-' + c + 'n=' + S + '\\Rightarrow\\sum x=' + sx + '$$',
    'Үүнийг дунджийн томьёонд орлуулбал $$\\dfrac{' + sx + '}{n}=' + dec(m) + '\\Rightarrow ' + sx + '=' + dec(m) + 'n\\Rightarrow ' + fin + '$$'
  ];
  return {
    q: '$n$ ширхэг элементтэй өгөгдлийн арифметик дундаж $' + dec(m) + '$ ба $' + sum + '=' + S + '$ бол $n$-ийн утгыг олоорой.'
      + '<div style="font-size:.92em;font-style:italic;margin-top:3px">(Энд $' + sum + '$ гэдэг нь өгөгдлийн элемент бүрээс '
      + sfx(c, 'ыг') + ' хасаж, хооронд нь нэмсэн нийлбэрийг илэрхийлнэ.)</div>',
    a: '$n=' + n + '$',
    wk: 22,
    s: sol,
    t: { c: c, m: m, S: S }
  };
}
return p56;
})();

/* 1.29 */
var e1_29 = (function () {
// 29. Шоо хаях туршилтын давтамжийн хүснэгт, нэг давтамж x; арифметик дундаж M өгөгдсөн → x
//     (эх: 5, x, 2, 8, 6, 1; M = 3.4 → x = 3). M — 1 (заримдаа 2) аравтын оронтой, M ≠ j (x цор ганц).
function p29() {
  var F = [1, 2, 3, 4, 5, 6].map(function () { return rnd(1, 9); }), j = rnd(1, 6), x = rnd(1, 9), S = 0, N = 0;
  F[j - 1] = x;
  F.forEach(function (f, i) { S += f * (i + 1); N += f; });
  if (N < 15 || S === j * N) return null;
  if ((10 * S) % N !== 0 && !((100 * S) % N === 0 && rnd(0, 3) === 0)) return null;
  var M = S / N, row = ['Давтамж'].concat(F.map(function (f, i) { return i === j - 1 ? '$x$' : f; }));
  // Бодолт (гар бичмэл): дундаж = Σ(тоо·давтамж) / Σ давтамж → x-ийн шугаман тэгшитгэл.
  var S0 = S - j * x, N0 = N - x, MN = +(M * N0).toFixed(6);
  var cf = +Math.abs(M - j).toFixed(6), rh = +Math.abs(S0 - MN).toFixed(6);
  var num = F.map(function (f, i) { return (i + 1) + '\\cdot ' + (i === j - 1 ? 'x' : f); }).join('+');
  var den = F.map(function (f, i) { return i === j - 1 ? 'x' : f; }).join('+');
  return {
    q: 'Шоо хаях туршилтын үр дүнг хүснэгтэд үзүүлжээ. Хэрэв нийт буусан тоонуудын арифметик дундаж ' + dec(M) + ' бол $x$-ийг ол.',
    a: '$x=' + x + '$', fig: tbl([['Тоо', 1, 2, 3, 4, 5, 6], row]), wk: 26,
    s: [
      'Арифметик дундгийн томьёогоор $$\\dfrac{' + num + '}{' + den + '}=' + dec(M) + '.$$',
      'Эндээс $' + S0 + tm(j, 'x') + '=' + dec(M) + '\\cdot(' + N0 + '+x)$, өөрөөр хэлбэл $' + S0 + tm(j, 'x') + '=' + dec(MN) + '+' + dec(M) + 'x$.',
      'Иймд $' + (cf === 1 ? '' : tm(cf, 'x', true) + '=' + dec(rh) + '\\Rightarrow ') + 'x=' + x + '$.'
    ],
    t: { F: F, j: j }
  };
}
return p29;
})();

/* 1.3 */
var e1_3 = (function () {
// 3. Хоёр багийн 5 + 5 тоглогчийн онооны Σx, Σx², Σy, Σy² → нийт 10 тоглогчийн стандарт хазайлт.
//    σ² = Q/10 − (S/10)², S = Σx + Σy, Q = Σx² + Σy². Жинхэнэ оноонуудыг (0..12) үүсгэж,
//    10Q − S² = k² (бүтэн квадрат) байхаар шүүнэ → σ = k/10 (яг аравтын бутархай).
function p3() {
  for (var it = 0; it < 3000; it++) {
    var X = [], Y = [], i, sx = 0, sx2 = 0, sy = 0, sy2 = 0;
    for (i = 0; i < 5; i++) { X.push(rnd(0, 12)); Y.push(rnd(0, 12)); }
    for (i = 0; i < 5; i++) { sx += X[i]; sx2 += X[i] * X[i]; sy += Y[i]; sy2 += Y[i] * Y[i]; }
    var S = sx + sy, Q = sx2 + sy2, D = 10 * Q - S * S, k = Math.round(Math.sqrt(D));
    if (k * k !== D || k < 12 || k > 48) continue;
    if (sx === sy && sx2 === sy2) continue;
    // Бодолт (гар бичмэл): D = E(X²) − (E(X))², σ = √D; E(X) = (Σx + Σy)/10, E(X²) = (Σx² + Σy²)/10.
    var EX = dec(S / 10), EX2 = dec(Q / 10), Dv = dec(k * k / 100);
    return {
      q: 'Сагсан бөмбөгийн нэг багийн 5 тоглогчийн эхний үед авсан онооны нийлбэр $\\sum x=' + sx + '$, квадратуудын нийлбэр $\\sum x^2=' + sx2
        + '$ байв. Нөгөө багийн 5 тоглогчийн онооны нийлбэр $\\sum y=' + sy + '$, квадратуудын нийлбэр $\\sum y^2=' + sy2
        + '$ байв. Энэ 10 тоглогчийн эхний үед авсан онооны стандарт хазайлтыг олоорой.',
      a: '$\\sigma=' + dec(k / 10) + '$',
      wk: 30,
      s: [
        '$x_1,\\ x_2,\\ \\ldots,\\ x_n$ өгөгдлийн дундаж $E(X)=\\overline{x}=\\dfrac{x_1+x_2+\\ldots+x_n}{n}$, дисперс $$D=\\dfrac{(x_1-\\overline{x})^2+\\ldots+(x_n-\\overline{x})^2}{n}=\\dfrac{x_1^2+\\ldots+x_n^2}{n}-\\left(\\dfrac{x_1+\\ldots+x_n}{n}\\right)^2,$$'
          + ' өөрөөр хэлбэл $D=E(X^2)-\\big(E(X)\\big)^2$, стандарт хазайлт $\\sigma=\\sqrt{D}$.',
        'Нийт 10 тоглогчийн хувьд $$\\begin{aligned}E(X)&=\\dfrac{\\sum x+\\sum y}{10}=\\dfrac{' + sx + '+' + sy + '}{10}=' + EX + ',\\\\'
          + 'E(X^2)&=\\dfrac{\\sum x^2+\\sum y^2}{10}=\\dfrac{' + sx2 + '+' + sy2 + '}{10}=' + EX2 + '.\\end{aligned}$$',
        '$$D=E(X^2)-\\big(E(X)\\big)^2=' + EX2 + '-' + EX + '^2=' + Dv + '.$$',
        'Иймд $\\sigma=\\sqrt{D}=\\sqrt{' + Dv + '}=' + dec(k / 10) + '$.'
      ],
      t: { X: X, Y: Y }
    };
  }
  return null;
}
return p3;
})();

/* 4.4 */
var e4_4 = (function () {
// 4. n тамирчны нас x: σ² = Σx²/n − x̄²  ⇒  Σx² = n(σ² + x̄²).  x̄, σ бүхэл (бодит нас: x̄ 15–32, σ ≤ x̄/4).
//    Голдуу Σx² ба σ өгч дундаж насыг (x̄ = √(Σx²/n − σ²)), заримдаа Σx² ба x̄ өгч стандарт хазайлтыг асууна.
function p4() {
  var n = pick([4, 5, 5, 5, 6, 8, 10]), mu = rnd(15, 32), sg = rnd(1, 6), ask = rnd(1, 10) <= 7 ? 'm' : 's';
  if (sg * 4 > mu) return null;
  var S2 = n * (sg * sg + mu * mu);
  if (n === 5 && mu === 16 && sg === 3) return null;   // эх тоо тогтмол хувилбар болохгүй
  var cond = ask === 'm' ? 'стандарт хазайлт нь ' + sg + ' бол тэдгээрийн дундаж насыг олоорой.'
    : 'дундаж нас нь ' + mu + ' бол тэдний насны стандарт хазайлтыг олоорой.';
  return {
    q: 'Нэгэн багийн ' + n + ' тамирчнаас судалгаа авчээ. Тэдний насны тоог $x$-ээр тэмдэглэе. Хэрэв $\\sum x^2=' + S2 + '$, ' + cond,
    a: ask === 'm' ? '$\\overline{x}=' + mu + '$' : '$\\sigma=' + sg + '$',
    wk: 24,
    t: { n: n, mu: mu, sg: sg, ask: ask }
  };
}
return p4;
})();

/* 1.30 */
var e1_30 = (function () {
// 30. Хуримтлагдсан давтамжийн муруй (огив), n = 4k − 1: Q1 = k-р утга, Q3 = 3k-р утга → IQR = x(3k) − x(k)
//     (эх: n = 27 → Q1 = 33, Q3 = 69, IQR = 36). Зангилаа бүр торын цэг дээр (x — 3-ын үржвэр, y — бүхэл),
//     муруй — монотон сплайн; эхээс бусад зангилаа бүрт тэнхлэг хүртэл тасархай зураас (квартилиудыг ялгахгүй).
function p30() {
  var n = pick([23, 27, 27, 31, 35, 39]), k = (n + 1) / 4, pool = [], y, t;
  var ia = rnd(4, 8), ya = rnd(1, 3), i1 = ia + rnd(2, 5), nm = rnd(1, 2);
  for (y = k + 2; y <= 3 * k - 2; y++) pool.push(y);
  var ym = shuffle(pool).slice(0, nm).sort(function (a, b) { return a - b; });
  if (nm === 2 && ym[1] - ym[0] < 2) return null;
  var K = [[0, 0], [3 * ia, ya], [3 * i1, k]], ii = i1;
  ym.forEach(function (yy) { ii += rnd(1, 5); K.push([3 * ii, yy]); });
  var i3 = ii + rnd(1, 5), ib = i3 + rnd(2, 6), imax = rnd(28, 30);
  if (ib >= imax) return null;
  K.push([3 * i3, 3 * k], [3 * ib, n - rnd(1, 2)], [3 * imax, n]);
  for (t = 1; t < K.length; t++) { var s = (K[t][1] - K[t - 1][1]) / ((K[t][0] - K[t - 1][0]) / 3); if (s < 0.15 || s > 4) return null; }
  var S = spline(K), X1 = 3 * i1, X3 = 3 * i3, VX = 96, VY = n + 3, cy = Math.min(9.5, Math.max(6.8, 260 / VY));
  var f = Fig({ free: true, w: 320, h: 52 + VY * cy, view: [0, VX, 0, VY], padL: 46, padR: 16, padT: 12, padB: 40 });
  f.grid({ x: 3, y: 1 }, { c: '#c4c4c4', w: 0.6 });
  K.slice(1).forEach(function (p) { f.seg([0, p[1]], p, { dash: '6 4', w: 1.3 }).seg(p, [p[0], 0], { dash: '6 4', w: 1.3 }); });
  f.curve(S, 0, K[K.length - 1][0], { w: 2.2 }, 500);
  f.axes({ x: false, y: false, o: false });
  var yt = [];
  for (y = 5; y <= n - 2; y += 5) yt.push(y);
  yt.push(n);
  f.ticks([15, 30, 45, 60, 75, 90], yt, { size: 11 });
  f.text([VX / 2, 0], 'Хугацаа', { plain: true, pos: 's', off: 21, size: 12 });
  f.text([0, VY / 2], 'Хуримтлагдсан давтамж', { plain: true, pos: 'w', off: 27, size: 11.5, anchor: 'middle', rot: -90 });
  // Бодолт (гар бичмэл): Q₁ = (n+1)/4-р, Q₃ = 3(n+1)/4-р утга; графикаас хугацааг уншина.
  return {
    q: 'Зурагт өгөгдсөн хуримтлагдсан давтамжийн график ашиглан квартил хоорондын далайцыг ол.',
    a: '$IQR=Q_3-Q_1=' + X3 + '-' + X1 + '=' + (X3 - X1) + '$', fig: f.svg(), wk: 30,
    s: [
      'Хуримтлагдсан давтамжийн хамгийн их утга $n=' + n + '$ нь нийт өгөгдлийн тоо. Эрэмбэлсэн өгөгдлийн $Q_1$ нь $' + k + '$-р, $Q_3$ нь $' + 3 * k + '$-р утга:'
        + ' $$\\dfrac{n+1}{4}=\\dfrac{' + n + '+1}{4}=' + k + ',\\qquad \\dfrac{3(n+1)}{4}=\\dfrac{3\\cdot ' + (n + 1) + '}{4}=' + 3 * k + '.$$',
      'Босоо тэнхлэгийн $' + k + '$ ба $' + 3 * k + '$ утгаас хэвтээ шулуун татаж, муруйтай огтлолцсон цэгээс хэвтээ тэнхлэгт буулгавал $$Q_1=' + X1 + ',\\qquad Q_3=' + X3 + '.$$',
      'Иймд $IQR=Q_3-Q_1=' + X3 + '-' + X1 + '=' + (X3 - X1) + '$.'
    ],
    t: { n: n, K: K }
  };
}
return p30;
})();

/* 1.89 */
var e1_89 = (function () {
// 89. Бүлэглэсэн давтамжийн хүснэгт → интервалын дундаж утгаар арифметик дундаж.
//     Интервал бүр сондгой тооны бүхэл утгатай (1–5, 6–8, 9–11 …) тул дундаж утга нь бүхэл; x̄ = Σ f·m / N.
//     N = Σ f ∈ [20; 40] (текстэд), x̄ нь ≤ 2 оронтой аравтын бутархай (100·Σ f·m нь N-д хуваагдана).
function p89() {
  var k = pick([3, 3, 3, 4]), lo = rnd(1, 5), iv = [], fq = [], N = 0, S = 0, i;
  for (i = 0; i < k; i++) {
    var w = pick([3, 3, 5, 5, 7]), hi = lo + w - 1, f = rnd(2, 13);
    iv.push([lo, hi]); fq.push(f); N += f; S += f * (lo + hi) / 2; lo = hi + 1;
  }
  if (N < 20 || N > 40 || (100 * S) % N !== 0) return null;
  if ((N === 20 || N === 25) && rnd(0, 2)) return null;      // 20, 25 хэт олон гарахаас сэргийлнэ
  var head = ['Хугацаа (<i>минут</i>)'], row = ['Давтамж'];
  iv.forEach(function (r, j) { head.push(r[0] + '–' + r[1]); row.push(fq[j]); });
  // Бодолт (гар бичмэл): интервалын дундаж m = (a + b)/2 → x̄ = Σ m·f / Σ f
  var mids = iv.map(function (r) { return (r[0] + r[1]) / 2; });
  return {
    q: N + ' сурагч нэгэн геометрийн бодлого боджээ. Тэдний зарцуулсан хугацааг бүлэглэсэн давтамжийн хүснэгтээр харуулав. '
      + 'Сурагчдын уг бодлогыг бодсон хугацааны арифметик дунджийг, интервалын дунджийг нь ашиглан тооцоолоорой.',
    a: '$\\bar{x}=' + dec(S / N) + '$ минут',
    fig: tbl([head, row]), wk: 26,
    s: [
      'Интервал бүрийн дундаж: ' + iv.map(function (r, j) { return '$\\dfrac{' + r[0] + '+' + r[1] + '}{2}=' + mids[j] + '$'; }).join(', ') + '.',
      'Интервалын дунджуудыг давтамжаар нь үржүүлж нэмээд, давтамжийн нийлбэрт (сурагчдын тоонд) хуваавал'
        + ' $$\\bar{x}=\\dfrac{' + mids.map(function (m, j) { return m + '\\cdot ' + fq[j]; }).join('+') + '}{' + fq.join('+') + '}'
        + '=\\dfrac{' + S + '}{' + N + '}=' + dec(S / N) + '\\text{ минут}.$$'
    ],
    t: { iv: iv, fq: fq, N: N }
  };
}
return p89;
})();

/* 2.91 */
var e2_91 = (function () {
// 91. Тоогүй 9×9 тор дээр 7 дэлгүүр (А–Ж): x — савалгааны жин, y — үнэ (нүдээр). 1 кг-ийн үнэ = y/x; хоёр дэлгүүрийн
//   1 кг-ийн үнийн харьцаа тэнхлэгийн масштабаас хамаарахгүй тул нүд тоолж шийднэ (эх: А 3, Б 3, В 15/8, Г 1, Д 5/7, Е 1, Ж 3/4).
//   Дүгнэлт: «X ба Y дэлгүүрийн 1 кг-ийн үнэ ижил», «X дэлгүүрийн 1 кг-ийн үнэ Y дэлгүүрийнхээс k дахин хямд/өндөр»
//   (k ∈ 1.5, 2, 2.5, 3, 3.5, 4, 5, 6). 4 нь үнэн, 1 нь худал: ойролцоо харьцаа (эх шиг 1.4 ↔ 1.5), «ижил» мэт ойролцоо
//   (харьцаа ≤ 4/3), эсвэл чиглэл эсрэг. 5 дүгнэлтэд 7 дэлгүүр бүгд орно. Эхийн «үнэ»-ийг «1 кг-ийн үнэ» гэж тодотгов.
//   Цэг бүхэл (заримдаа нэг нь y-ээр хагас нүдэнд, эхийн В шиг) торын цэг дээр; шошгыг давхцалгүй байрлуулна.
var p91_N = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Ж'];
var p91_W = { 'А': 0.78, 'Б': 0.64, 'В': 0.62, 'Г': 0.56, 'Д': 0.78, 'Е': 0.57, 'Ж': 1.0 };   // үсгийн өргөн / font-size (Segoe UI getBBox + нөөц)
var p91_K = [[3, 2], [2, 1], [5, 2], [3, 1], [7, 2], [4, 1], [5, 1], [6, 1]];
var p91_U = 20, p91_SZ = 13, p91_OFF = 5, p91_R = 2.8;
function p91_fr(n, d) { var g = gcd(n, d); return [n / g, d / g]; }
function p91_num(R) { var v = R[0] / R[1]; return Math.abs(v * 100 - Math.round(v * 100)) < 1e-9 ? dec(v) : frs(R[0], R[1]); }   // хариуны мөрөнд жижиг бутархай (frac)
function p91_inK(R) { return p91_K.some(function (k) { return k[0] === R[0] && k[1] === R[1]; }); }
// Шошгын хайрцаг (торын px, дэлгэцийн y доош) — Fig.text-ийн байрлалын дүрмээр (numeric pos)

  ['Болд', 'Болдоос', 'Болдтой'], ['Тулга', 'Тулгаас', 'Тулгатай'], ['Бат', 'Батаас', 'Баттай'], ['Дорж', 'Доржоос', 'Доржтой'],
  ['Сүх', 'Сүхээс', 'Сүхтэй'], ['Энх', 'Энхээс', 'Энхтэй'], ['Мөнх', 'Мөнхөөс', 'Мөнхтэй'], ['Төмөр', 'Төмөрөөс', 'Төмөртэй'],
  ['Ганаа', 'Ганаагаас', 'Ганаатай'], ['Сараа', 'Сараагаас', 'Сараатай'], ['Анар', 'Анараас', 'Анартай'], ['Цэцэг', 'Цэцэгээс', 'Цэцэгтэй'],
  ['Нараа', 'Нараагаас', 'Нараатай'], ['Оюу', 'Оюугаас', 'Оюутай'], ['Золбоо', 'Золбоогоос', 'Золбоотой'], ['Дулмаа', 'Дулмаагаас', 'Дулмаатай']

  else if (T <= 75) { q = X[0] + ' ' + Y[2] + ' зэрэгцэж зогссон байх'; a = '2\\cdot ' + (n - 1) + '!' + (n <= 8 ? '=' + 2 * p85_f(n - 1) : ''); }

}
return p85;
})();

/* 2.86 */
var e2_86 = (function () {
// 86. Дэд олонлогийн тоо.  Эх: 2n+1 элементтэй олонлогийн n-ээс олон элементтэй дэд олонлог → 2^{2n} = 4^n (тэгш хэм: k ↔ m−k).
//     Хувилбарууд: эх (тэмдэгтээр); m = 2t+1 (5…11): t-ээс олон / (t+1)-ээс цөөн → 2^{m−1};  яг k → C_m^k;
//     k-аас цөөнгүй / k-аас олон → C_m^j-ийн нийлбэр (≤ 4 гишүүн).
function p86_C(n, k) { var r = 1; for (var i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
function p86_sum(m, lo) {   // Σ_{j=lo..m} C_m^j
  var terms = [], v = 0;

function p86() {
  var T = rnd(1, 100), m, q, a;

/* 1.35 */
var e1_35 = (function () {
// 35. Бичлэгт нь d цифр яг k удаа орсон (тэгш / сондгой / 5-д хуваагддаг) гурван оронтой тоо хэд вэ?
//     Нэгжийн цифр u (нөхцөлөөр) бүрд: (зуут 1–9, аравт 0–9) хосод d яг (k − [u = d]) удаа орох тоог нэмнэ.

  var d = rnd(0, 9), k = rnd(1, 4) === 4 ? 2 : 1, pr = rnd(0, 5);

  var hd = d >= 1 ? 1 : 0, hn = 9 - hd;           // зуутын оронд d байх / байхгүй сонголт
  var ways = [hn * 9, hd * 9 + hn * 1, hd * 1];  // (зуут, аравт)-д d яг 0, 1, 2 удаа

  U.forEach(function (u) { var need = k - (u === d ? 1 : 0); if (need >= 0 && need <= 2) N += ways[need]; });
  if (N < 4) return null;
  // Бодолт (гар бичмэл): d цифр аль оронд (зуут, аравт, нэгж) орсноор ангилж, бусад оронд d-ээс ялгаатай цифрийн сонголтыг үржүүлнэ.

  var pats = k === 1 ? [[0], [1], [2]] : [[0, 1], [0, 2], [1, 2]], lines = [], sum = [];

    a: '$' + N + '$',

      '$' + d + '$ цифр аль оронд орсноор ангилъя. ' + (k === 1 ? '$a$, $b$' : '$a$') + ' нь $' + d + '$-' + suf(d, 'аас') + ' ялгаатай цифр бөгөөд зуутын оронд $' + ch[0] + '$ ('
        + (d ? '$0$ ба $' + d + '$-' + suf(d, 'аас') + ' бусад' : '$0$-ээс бусад') + '), аравтын оронд $' + ch[1] + '$, нэгжийн оронд $' + ch[2] + '$ ($' + Ud + '$) янзаар орно.',

/* 4.100 */
var e4_100 = (function () {
// 100. Тойрог дээрх n₁ + n₂ цэгийн аль ч гурав нь нэг шулуун дээр орохгүй ⇒ k оройг сонгох бүрд нэг гүдгэр k өнцөгт.
//      «Яг j орой нь (өнгө)»: C(n_өнгө, j)·C(n_нөгөө, k − j);  «ядаж j»: Σ_{i ≥ j} C(n_өнгө, i)·C(n_нөгөө, k − i).
//      Өнгө, тоо, өнцөгтийн төрөл (3–6), нөхцөл санамсаргүй.
