<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат олон гишүүнт бутархай хураах — 16 бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .guide{background:#f6f2ff;border:1px solid #e2d6ff;border-radius:12px;padding:10px 16px;margin-bottom:14px;font-size:12px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:9px 4px 10px;border-bottom:1px dashed #efeaff}
  .qh{display:flex;gap:8px;align-items:center}.qn{font-weight:800;color:var(--purple);min-width:24px}.qm{font-size:14.5px}
  .bl{margin:14px 0 2px 30px;border-bottom:1.4px solid #b9accf;height:1.05em}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;font-size:12px}.ans-grid .a{display:flex;gap:6px;align-items:center}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(lo,hi){var v=0;while(v===0)v=rnd(lo,hi);return v;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function poly2(c1,c0){var s='x^{2}';if(c1!==0)s+=(c1>0?' + ':' - ')+(Math.abs(c1)===1?'':Math.abs(c1))+'x';if(c0!==0)s+=(c0>0?' + ':' - ')+Math.abs(c0);return s;}
function bin(c){return 'x'+(c>0?'+'+c:c<0?'-'+(-c):'');}
function dfr(t,b){return '\\dfrac{'+t+'}{'+b+'}';}
var FORMS=[
  function(){ // (x+p)(x+q)/((x+p)(x+r))
    var p=nz(-6,6),q=nz(-6,6),r=nz(-6,6); if(q===r)return null;
    return {q:dfr(poly2(p+q,p*q),poly2(p+r,p*r)), a:dfr(bin(q),bin(r))};},
  function(){ // (x²−a²)/((x+a)(x+r))
    var a=rnd(2,6),r=nz(-6,6); if(r===-a)return null;
    return {q:dfr(poly2(0,-a*a),poly2(a+r,a*r)), a:dfr(bin(-a),bin(r))};},
  function(){ // ((x+p)(x+q))/(x²−q²)
    var p=nz(-6,6),q=rnd(2,6); if(p===-q)return null;
    return {q:dfr(poly2(p+q,p*q),poly2(0,-q*q)), a:dfr(bin(p),bin(-q))};}
];
function build(){
  var N=16, order=[]; for(var i=0;i<N;i++)order.push(i%FORMS.length);
  for(var s=order.length-1;s>0;s--){var j=rnd(0,s);var t=order[s];order[s]=order[j];order[j]=t;}
  var probs='',answs='',ITEMS=[],idx=0;
  while(ITEMS.length<N){
    var it=FORMS[order[idx%order.length]]();idx++; if(!it)continue;
    var n=ITEMS.length+1;
    probs+='<div class="q"><div class="qh"><span class="qn">'+n+'.</span><span class="qm">$'+it.q+'=$</span></div><div class="bl"></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>$'+it.a+'$</span></div>';
    ITEMS.push({q:it.q+'=',a:it.a});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадрат олон гишүүнт бутархай хураах</h1><div class="sub">Хүртвэр, хуваарь хоёулаа квадрат — задлаад нийтлэг хаалтыг хорого · 16 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="guide"><b>Жишээ:</b> $\\dfrac{x^{2}+5x+6}{x^{2}+x-6}=\\dfrac{(x+2)(x+3)}{(x-2)(x+3)}=\\dfrac{x+2}{x-2}$ &nbsp;·&nbsp; $x^{2}+(p+q)x+pq=(x+p)(x+q)$, &nbsp; $x^{2}-a^{2}=(x-a)(x+a)$</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=ITEMS; window.WS_TITLE='Квадрат олон гишүүнт бутархай хураах';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=5"></script>
</body>
</html>
