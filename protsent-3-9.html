<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Процент-3 (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:6px 0 9px;border-left:4px solid var(--purple2);padding-left:9px}
  .prob{break-inside:avoid;page-break-inside:avoid;margin-bottom:10px}
  .pq{font-size:13px;margin-bottom:5px}.pn{font-weight:800;color:var(--purple);margin-right:6px}
  .pw{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:17mm}
  .sols-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.sols-page h2{font-size:16px;color:#5a32d6;margin-bottom:12px}
  .sol{break-inside:avoid;page-break-inside:avoid;margin-bottom:11px;padding-bottom:8px;border-bottom:1px dashed #ece7fb}
  .sol .sq{font-size:12px;color:#42395e;margin-bottom:4px}.sol .sn{font-weight:800;color:var(--purple);margin-right:6px}
  .step{font-size:13px;margin:3px 0 3px 20px;color:#241a3d}
  .res{font-size:13px;font-weight:800;color:var(--green);margin:4px 0 0 20px}
  #solutions{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.sols-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="ss" onchange="toggleSol()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleSol(){var el=document.getElementById('solutions');if(el)el.style.display=document.getElementById('ss').checked?'block':'none';}
function step(t){return '<div class="step">'+t+'</div>';}
function res(t){return '<div class="res">Хариу: '+t+'</div>';}
var CC=[10,20,25,40,50,60,75,80];
// A) Концентрацийг ол
function gConc(){var M=rnd(2,40)*20,c=pick(CC),s=M*c/100;
  return {q:'$'+M+'$ г уусмалд $'+s+'$ г давс уусан бол уусмалын концентраци хэдэн хувь вэ?',
    sol:step('$\\dfrac{'+s+'}{'+M+'}\\times100='+c+'\\%$')+res('$'+c+'\\%$')};}
// B) Давсны хэмжээг ол
function gAmount(){var M=rnd(2,40)*20,c=pick(CC),s=M*c/100;
  return {q:'$'+M+'$ г $'+c+'\\%$-ийн давсны уусмалд хэдэн грамм давс байгаа вэ?',
    sol:step('$'+M+'\\times\\dfrac{'+c+'}{100}='+s+'$')+res('$'+s+'$ г давс')};}
// C) Хоёр уусмал холих
function gMix(){var M1=rnd(1,15)*20,M2=rnd(1,15)*20,c1=pick(CC),c2=pick(CC);if(c1===c2)return null;
  var s1=M1*c1/100,s2=M2*c2/100,tot=M1+M2,nc=(s1+s2)/tot*100;
  if(Math.abs(nc-Math.round(nc))>1e-9)return null;nc=Math.round(nc);
  return {q:'$'+M1+'$ г $'+c1+'\\%$ ба $'+M2+'$ г $'+c2+'\\%$-ийн давсны уусмал хольжээ. Үүссэн уусмалын концентраци хэдэн хувь вэ?',
    sol:step('1-р уусмал дахь давс: $'+M1+'\\times\\dfrac{'+c1+'}{100}='+s1+'$ г')+step('2-р уусмал дахь давс: $'+M2+'\\times\\dfrac{'+c2+'}{100}='+s2+'$ г')+step('Нийт давс: $'+s1+'+'+s2+'='+(s1+s2)+'$ г; нийт уусмал: $'+M1+'+'+M2+'='+tot+'$ г')+step('Концентраци: $\\dfrac{'+(s1+s2)+'}{'+tot+'}\\times100='+nc+'\\%$')+res('$'+nc+'\\%$')};}
// D) Ус нэмэх (шингэлэх)
function gDil(){var M=rnd(1,10)*20,c=pick(CC),s=M*c/100;
  var cand=CC.filter(function(nc){return nc<c&&(s*100)%nc===0&&s*100/nc>M;});
  if(!cand.length)return null;var nc=pick(cand),nm=s*100/nc,W=nm-M;
  return {q:'$'+M+'$ г $'+c+'\\%$-ийн давсны уусмалд $'+W+'$ г ус нэмэв. Уусмалын концентраци хэдэн хувь болох вэ?',
    sol:step('Давсны хэмжээ хэвээр: $'+M+'\\times\\dfrac{'+c+'}{100}='+s+'$ г')+step('Шинэ уусмал: $'+M+'+'+W+'='+nm+'$ г')+step('Концентраци: $\\dfrac{'+s+'}{'+nm+'}\\times100='+nc+'\\%$')+res('$'+nc+'\\%$')};}
// E) Хоёр хайлш хайлуулах (зэс)
function gAlloy(){var M1=rnd(1,15)*20,M2=rnd(1,15)*20,c1=pick(CC),c2=pick(CC);if(c1===c2)return null;
  var s1=M1*c1/100,s2=M2*c2/100,tot=M1+M2,nc=(s1+s2)/tot*100;
  if(Math.abs(nc-Math.round(nc))>1e-9)return null;nc=Math.round(nc);
  return {q:'$'+M1+'$ кг $'+c1+'\\%$ зэс агуулсан хайлш ба $'+M2+'$ кг $'+c2+'\\%$ зэс агуулсан хайлшийг хайлуулав. Шинэ хайлш хэдэн хувийн зэстэй болох вэ?',
    sol:step('1-р хайлш дахь зэс: $'+M1+'\\times\\dfrac{'+c1+'}{100}='+s1+'$ кг')+step('2-р хайлш дахь зэс: $'+M2+'\\times\\dfrac{'+c2+'}{100}='+s2+'$ кг')+step('Нийт зэс: $'+(s1+s2)+'$ кг, нийт хайлш: $'+tot+'$ кг')+step('Зэсийн хувь: $\\dfrac{'+(s1+s2)+'}{'+tot+'}\\times100='+nc+'\\%$')+res('$'+nc+'\\%$')};}
// F) Цэвэр бодис нэмэх
function gAddSalt(){var M=rnd(1,10)*20,c=pick(CC),sub=M*c/100;var cand=CC.filter(function(nc){return nc>c&&Math.abs(M*(nc-c)/(100-nc)-Math.round(M*(nc-c)/(100-nc)))<1e-9&&M*(nc-c)/(100-nc)>0;});
  if(!cand.length)return null;var nc=pick(cand),s=M*(nc-c)/(100-nc);
  return {q:'$'+M+'$ г $'+c+'\\%$-ийн давсны уусмалд $'+s+'$ г цэвэр давс нэмэв. Уусмалын концентраци хэдэн хувь болох вэ?',
    sol:step('Одоогийн давс: $'+M+'\\times\\dfrac{'+c+'}{100}='+sub+'$ г')+step('Шинэ давс: $'+sub+'+'+s+'='+(sub+s)+'$ г; шинэ уусмал: $'+M+'+'+s+'='+(M+s)+'$ г')+step('Концентраци: $\\dfrac{'+(sub+s)+'}{'+(M+s)+'}\\times100='+nc+'\\%$')+res('$'+nc+'\\%$')};}
// G) Хэдэн грамм ус нэмэх вэ?
function gHowWater(){var M=rnd(1,10)*20,c=pick(CC),sub=M*c/100;var cand=CC.filter(function(nc){return nc<c&&(M*(c-nc))%nc===0&&M*(c-nc)/nc>0;});
  if(!cand.length)return null;var nc=pick(cand),W=M*(c-nc)/nc,nm=M+W;
  return {q:'$'+M+'$ г $'+c+'\\%$-ийн давсны уусмалыг $'+nc+'\\%$ болгохын тулд хэдэн грамм ус нэмэх вэ?',
    sol:step('Давс хэвээр: $'+M+'\\times\\dfrac{'+c+'}{100}='+sub+'$ г')+step('Шаардагдах уусмал: $'+sub+'\\times\\dfrac{100}{'+nc+'}='+nm+'$ г')+step('Нэмэх ус: $'+nm+'-'+M+'='+W+'$ г')+res('$'+W+'$ г ус')};}
// H) Хэдэн грамм давс нэмэх вэ?
function gHowSalt(){var M=rnd(1,10)*20,c=pick(CC),sub=M*c/100;var cand=CC.filter(function(nc){return nc>c&&Math.abs(M*(nc-c)/(100-nc)-Math.round(M*(nc-c)/(100-nc)))<1e-9&&M*(nc-c)/(100-nc)>0;});
  if(!cand.length)return null;var nc=pick(cand),s=M*(nc-c)/(100-nc);
  return {q:'$'+M+'$ г $'+c+'\\%$-ийн давсны уусмалыг $'+nc+'\\%$ болгохын тулд хэдэн грамм цэвэр давс нэмэх вэ?',
    sol:step('Одоогийн давс: $'+M+'\\times\\dfrac{'+c+'}{100}='+sub+'$ г')+step('Нэмэх давсыг $x$ гэвэл $\\dfrac{'+sub+'+x}{'+M+'+x}=\\dfrac{'+nc+'}{100}$')+step('Эндээс $x='+s+'$ г')+res('$'+s+'$ г давс')};}
function build(){
  var probs=[],seen={};
  function add(fn,cnt){var c=0,tr=0;while(c<cnt&&tr<400){tr++;var f=fn();if(!f||seen[f.q])continue;seen[f.q]=1;probs.push(f);c++;}}
  add(gConc,1);add(gAmount,1);add(gMix,1);add(gAlloy,1);add(gDil,1);add(gAddSalt,1);add(gHowWater,1);add(gHowSalt,1);
  var pHtml=probs.map(function(p,i){return '<div class="prob"><div class="pq"><span class="pn">'+(i+1)+'.</span>'+p.q+'</div><div class="pw"></div></div>';}).join('');
  var sHtml=probs.map(function(p,i){return '<div class="sol"><div class="sq"><span class="sn">'+(i+1)+'.</span>'+p.q+'</div>'+p.sol+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Процент — уусмал ба концентраци</h1><div class="sub">Концентраци · бодисын хэмжээ · уусмал/хайлш холих · ус нэмэх · бодис нэмэх · хэдэн г нэмэх · 9-р анги · 2.1</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Концентраци $=\\dfrac{\\text{цэвэр бодис}}{\\text{уусмал}}\\times100\\ \\%$ &nbsp;·&nbsp; Ус нэмэхэд цэвэр бодисын хэмжээ өөрчлөгдөхгүй, зөвхөн уусмал нэмэгдэнэ.</div>'
    +'<div class="task">Бодлогуудыг бод. (Бодолтоо доор бич)</div>'+pHtml
    +'<div class="sols-page" id="solutions"><h2>Бодолт ба хариу</h2>'+sHtml+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Процент-3';
  toggleSol();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=38"></script>
</body>
</html>
