<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Рационал илтгэгчтэй алгебрын илэрхийлэл — Түвшин 1 (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.cols3{grid-template-columns:repeat(3,1fr);gap:8px 16px}
  /* Бодолттой үед: trim хийсний дараа 2 багана болгож нягт багцлана (эхний багана нэгээр илүү) */
  .grid.packed{display:flex;gap:20px;align-items:flex-start}
  .grid.packed .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:11px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:15px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.sm{height:14mm}.work.md{height:19mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var LAB=['а','б','в','г','д','е','ё','ж','з','и','й','к','л','м','н','о','п','р','с','т'];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function frac(p,q){if(q<0){p=-p;q=-q;}var g=gcd(Math.abs(p),q)||1;return {p:p/g,q:q/g};}
function addf(a,b){return frac(a.p*b.q+b.p*a.q,a.q*b.q);}
function eqf(a,b){return a.p===b.p&&a.q===b.q;}
function fv(f){return f.p/f.q;}
function ftx(f){if(f.q===1)return ''+f.p;return (f.p<0?'-':'')+'\\tfrac{'+Math.abs(f.p)+'}{'+f.q+'}';}
// рационал илтгэгчийг язгуураар бичнэ: 1/2→√, 1/3→∛, 3/2→v√v гэх мэт
function vp(v,f){if(f.p===0)return '1';var neg=f.p<0,p=Math.abs(f.p),q=f.q,body;
  if(q===1){body=(p===1)?v:(v+'^{'+p+'}');}
  else{var whole=Math.floor(p/q),rem=p-whole*q,inside=(rem===1)?v:(v+'^{'+rem+'}'),radp=(q===2)?('\\sqrt{'+inside+'}'):('\\sqrt['+q+']{'+inside+'}');body=(whole===0)?radp:((whole===1)?(v+radp):(v+'^{'+whole+'}'+radp));}
  return neg?('\\dfrac{1}{'+body+'}'):body;}
function rexpP(){var q=pick([1,2,2,3]);var p=nz(1,q===1?3:5);return frac(p,q);}
// нэг гишүүн: c·v^{e} (c бүхэл, тэмдэг гадуур). '1' бол зөвхөн c
function termTex(c,v,e){var ac=Math.abs(c),s=vp(v,e);if(s==='1')return ''+ac;return (ac===1?'':''+ac)+s;}
function exprTerms(terms,v){var out='';terms.forEach(function(t,i){var tx=termTex(t.c,v,t.e);if(i===0)out+=(t.c<0?'-':'')+tx;else out+=(t.c<0?' - ':' + ')+tx;});return out||'0';}
function evalTerms(terms,v,val){return terms.reduce(function(s,t){return s+t.c*Math.pow(val,fv(t.e));},0);}
function rv(){return 1.25+Math.random()*3.2;}

// 1) Ижил гишүүдийг эмхэтгэ (нэг хувьсагч)
function gCombine(){
  var v=pick(['x','y','a','b','m','c']),nPow=pick([1,2,2]),pows=[];
  var tr=0;while(pows.length<nPow&&tr++<40){var e=rexpP();if(!pows.some(function(x){return eqf(x,e);}))pows.push(e);}
  if(pows.length<nPow)return null;
  var parts=[],ans=[];
  pows.forEach(function(e){var nt=pick([2,2,3]),cs=[],sum=0;for(var i=0;i<nt;i++){var c=nz(-5,5);cs.push(c);sum+=c;}if(sum===0){cs[0]+=1;sum+=1;}cs.forEach(function(c){parts.push({c:c,e:e});});if(sum!==0)ans.push({c:sum,e:e});});
  shuffle(parts);
  if(parts.length<3)return null;
  for(var t=0;t<4;t++){var val=rv();if(Math.abs(evalTerms(parts,v,val)-evalTerms(ans,v,val))>1e-7*Math.max(1,Math.abs(evalTerms(parts,v,val))))return null;}
  return {q:exprTerms(parts,v),a:exprTerms(ans,v)||'0',ok:true};
}
// 2) Хаалтыг задла: c0·v^{p}·( сумма )
function gDistribute(){
  var v=pick(['x','y','a','b','m','c']),p=rexpP(),c0=pick([1,1,2,3]),ni=pick([2,2,3]),inner=[];
  for(var i=0;i<ni;i++){if(pick([0,0,1]))inner.push({k:nz(-4,4)});else inner.push({e:rexpP()});}
  if(!inner.some(function(t){return t.e;}))inner[0]={e:rexpP()};
  // q tex
  var innerTerms=inner.map(function(t){return t.e?{c:1,e:t.e}:{c:t.k,e:frac(0,1)};});
  var qInner=exprTerms(innerTerms,v);
  var coefTex=(c0===1?'':''+c0)+vp(v,p);
  var q=coefTex+'\\left('+qInner+'\\right)';
  // answer: distribute
  var ans=inner.map(function(t){return t.e?{c:c0,e:addf(p,t.e)}:{c:c0*t.k,e:p};});
  // combine like (p+e could coincide with p if k-term)
  var merged=[];ans.forEach(function(t){var m=merged.filter(function(x){return eqf(x.e,t.e);})[0];if(m)m.c+=t.c;else merged.push({c:t.c,e:t.e});});
  merged=merged.filter(function(t){return t.c!==0;});
  var qEval=function(val){return c0*Math.pow(val,fv(p))*innerTerms.reduce(function(s,t){return s+t.c*Math.pow(val,fv(t.e));},0);};
  for(var t2=0;t2<4;t2++){var val=rv();if(Math.abs(qEval(val)-evalTerms(merged,v,val))>1e-6*Math.max(1,Math.abs(qEval(val))))return null;}
  return {q:q,a:exprTerms(merged,v)||'0',ok:true};
}
// 3) Товчилсон үржвэрийн томьёо: (v^p - k)(v^p + k)=v^{2p}-k²,  (v^p ± k)²
function gProduct(){
  var v=pick(['x','y','a','b','c','m']),p=frac(1,pick([2,2,3])),k=nz(2,7),mode=pick(['diffsq','sq','sq']);
  var e2=frac(2*p.p,p.q);
  if(mode==='diffsq'){
    var q='\\left('+vp(v,p)+' - '+k+'\\right)\\left('+vp(v,p)+' + '+k+'\\right)';
    var a=vp(v,e2)+' - '+(k*k);
    var qf=function(x){return (Math.pow(x,fv(p))-k)*(Math.pow(x,fv(p))+k);},af=function(x){return Math.pow(x,fv(e2))-k*k;};
    for(var t=0;t<4;t++){var x=rv();if(Math.abs(qf(x)-af(x))>1e-6*Math.max(1,Math.abs(qf(x))))return null;}
    return {q:q,a:a,ok:true};
  }
  var s=pick([1,-1]);
  var q2='\\left('+vp(v,p)+(s<0?' - ':' + ')+k+'\\right)^{2}';
  var cross=2*k;
  var a2=vp(v,e2)+(s<0?' - ':' + ')+cross+vp(v,p)+' + '+(k*k);
  var qf2=function(x){return Math.pow(Math.pow(x,fv(p))+s*k,2);},af2=function(x){return Math.pow(x,fv(e2))+s*cross*Math.pow(x,fv(p))+k*k;};
  for(var t2=0;t2<4;t2++){var x2=rv();if(Math.abs(qf2(x2)-af2(x2))>1e-6*Math.max(1,Math.abs(qf2(x2))))return null;}
  return {q:q2,a:a2,ok:true};
}
function gen(fn){for(var t=0;t<250;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var qs=sheet.querySelectorAll('.grid .q');for(var i=0;i<qs.length;i++){var el=qs[i].querySelector('.ql');if(el)el.textContent=(LAB[i]||('#'+(i+1)))+')';}var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var e2=as[j].querySelector('.an');if(e2)e2.textContent=(LAB[j]||('#'+(j+1)))+')';}}
function trimToFitBalanced(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<300){var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>4){bestN=n;best=s;}}if(best<0)break;var qs=grids[best].querySelectorAll('.q'),last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function packColumns(sheet){
  [].forEach.call(sheet.querySelectorAll('.grid'),function(g){
    if(g.classList.contains('packed'))return;
    var qs=[].slice.call(g.children).filter(function(c){return c.classList&&c.classList.contains('q');});
    if(qs.length<2)return;
    var half=Math.ceil(qs.length/2),c1=document.createElement('div'),c2=document.createElement('div');
    c1.className='col';c2.className='col';
    qs.forEach(function(q,i){(i<half?c1:c2).appendChild(q);});
    g.appendChild(c1);g.appendChild(c2);g.classList.add('packed');
  });
}
function build(){
  var WORK=!!window.WS_WORK;
  var S=[[],[],[]],seen={};window.__PROB=[];
  function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<1500){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;S[idx].push(f);c++;}}
  var per=WORK?13:18;
  fill(0,gCombine,per);fill(1,gDistribute,per);fill(2,gProduct,per);
  var gcls=WORK?'':' cols3',K=0;
  function block(arr,cls,sec){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'" data-sec="'+sec+'"><div class="qeq"><span class="ql"></span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work '+cls+'"></div>':'')+'</div>';}).join('');}
  var b1=block(S[0],'sm',1),b2=block(S[1],'sm',2),b3=block(S[2],'md',3);
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>$'+p.f.a+'$</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Рационал илтгэгчтэй алгебрын илэрхийлэл — Түвшин 1</h1><div class="sub">Ижил гишүүд эмхэтгэх · хаалт задлах · товчилсон үржвэр · 3.1 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$x^{m}\\cdot x^{n}=x^{m+n}$ &nbsp;·&nbsp; $(a-b)(a+b)=a^{2}-b^{2}$ &nbsp;·&nbsp; $(a\\pm b)^{2}=a^{2}\\pm2ab+b^{2}$ &nbsp;·&nbsp; $x>0$</div>'
    +'<div class="task">1. Ижил гишүүдийг эмхэтгэж хялбарчил.</div>'
    +'<div class="grid'+gcls+'" data-sec="1">'+b1+'</div>'
    +'<div class="task">2. Хаалтыг задалж хялбарчил.</div>'
    +'<div class="grid'+gcls+'" data-sec="2">'+b2+'</div>'
    +'<div class="task">3. Товчилсон үржвэрийн томьёо ашиглан хялбарчил.</div>'
    +'<div class="grid'+gcls+'" data-sec="3">'+b3+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Рационал илтгэгчтэй алгебрын илэрхийлэл — Түвшин 1 (10-р анги)';
  relabel(document.getElementById('sheet'));
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFitBalanced(document.getElementById('sheet'),1035);}catch(e){}
  if(WORK)try{packColumns(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=35"></script>
</body>
</html>
