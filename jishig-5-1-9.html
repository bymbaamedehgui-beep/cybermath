<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V бүлэг — Жишиг даалгавар 1 (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .q{break-inside:avoid;page-break-inside:avoid;margin-bottom:11px}
  .qh{display:flex;gap:8px;align-items:baseline}.qn{font-weight:800;color:var(--purple);font-size:14px;min-width:22px}.qm{font-size:13.5px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:14mm;margin-top:5px}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:10px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 22px}
  .grid.gg{gap:12px 18px}.gfig{padding-left:26px;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:26px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}

function s(a){return a<0?'-'+(-a):'+'+a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
function fracStr(n,d){var sg=(n<0)!==(d<0);n=Math.abs(n);d=Math.abs(d);var g=gcd(n,d);n/=g;d/=g;if(d===1)return (sg?'-':'')+n;return (sg?'-':'')+'\\dfrac{'+n+'}{'+d+'}';}
function linN(d,c){var t=(d===1?'n':d===-1?'-n':d+'n');if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
function recSeq(a1,next,n){var out=[a1],cur=a1;for(var k=1;k<n;k++){cur=next(cur,k);out.push(cur);}return out.join(',\\ ')+',\\ \\dots';}
function axby(a,b){var xt=(a===1?'x':a===-1?'-x':a+'x');var yt=(b>0?'+':'-')+(Math.abs(b)===1?'':Math.abs(b))+'y';return xt+yt;}
function kxb(k,b){var t;if(k===0)t='';else t=(k===1?'x':k===-1?'-x':k+'x');if(b>0)t+=(t?'+':'')+b;else if(b<0)t+='-'+(-b);else if(t==='')t='0';return t;}
function invLin(a,b){var den=Math.abs(a),neg=a<0,num;if(!neg)num='x'+(b>0?'-'+b:b<0?'+'+(-b):'');else num='-x'+(b>0?'+'+b:b<0?'-'+(-b):'');if(den===1)return num;return '\\dfrac{'+num+'}{'+den+'}';}
function quadStr(b,c){var t='x^2';if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
function seqStr(fn,n){var out=[];for(var k=1;k<=n;k++)out.push(fn(k));return out.join(',\\ ')+',\\ \\dots';}
// ── Дараалал ──
function oj_seqterm(){var t=pick(['arith','quad','geom']);
  if(t==='arith'){var a1=nz(-5,9),d=nz(-5,6);return {stem:'Ерөнхий гишүүний томьёог бич: $'+seqStr(function(k){return a1+(k-1)*d;},5)+'$',a:'$a_n='+linN(d,a1-d)+'$'};}
  if(t==='quad'){var c=rnd(-2,5);return {stem:'Ерөнхий гишүүний томьёог бич: $'+seqStr(function(k){return k*k+c;},5)+'$',a:'$a_n=n^2'+(c>0?'+'+c:c<0?'-'+(-c):'')+'$'};}
  var a1=pick([1,2,3]),r=pick([2,3]);return {stem:'Ерөнхий гишүүний томьёог бич: $'+seqStr(function(k){return a1*Math.pow(r,k-1);},4)+'$',a:'$a_n='+(a1===1?'':a1+'\\cdot ')+r+'^{n-1}$'};}
function oj_seqval(){var d=nz(-5,6),c=nz(-9,9);return {stem:'$a_n='+linN(d,c)+'$ бол эхний 5 гишүүнийг ол.',a:'$'+seqStr(function(k){return d*k+c;},5)+'$'};}
function oj_recur(){var t=pick(['add','mul']);if(t==='add'){var a1=nz(-4,8),d=nz(-4,5);return {stem:'$a_1='+a1+',\\ a_{n+1}=a_n'+s(d)+'$ бол эхний 5 гишүүнийг ол.',a:'$'+recSeq(a1,function(c){return c+d;},5)+'$'};}
  var a1=pick([1,2,3]),r=pick([2,3]);return {stem:'$a_1='+a1+',\\ a_{n+1}='+r+'a_n$ бол эхний 5 гишүүнийг ол.',a:'$'+recSeq(a1,function(c){return r*c;},5)+'$'};}
// ── Шулуун ──
function oj_slope(){var a=nz(-6,6),b=nz(-5,5),c=nz(-9,9);return {stem:'$'+axby(a,b)+'='+c+'$ шулууны налалтыг ол.',a:'$k='+fracStr(-a,b)+'$'};}
function oj_slope2(){for(var t=0;t<50;t++){var x1=nz(-6,6),x2=nz(-6,6);if(x1===x2)continue;var y1=nz(-6,6),y2=nz(-6,6);return {stem:'$A('+x1+';'+y1+'),\\ B('+x2+';'+y2+')$ дайрсан шулууны налалтыг ол.',a:'$k='+fracStr(y2-y1,x2-x1)+'$'};}return null;}
function oj_lineeq(){var k=nz(-4,4),x0=nz(-5,5),y0=nz(-6,6),b=y0-k*x0;return {stem:'Налалт $'+k+'$, $('+x0+';'+y0+')$ цэгээр дайрах шулууны тэгшитгэлийг бич.',a:'$y='+kxb(k,b)+'$'};}
function oj_inverse(){var a=nz(-5,5),b=nz(-9,9);return {stem:'$f(x)='+kxb(a,b)+'$-ийн урвуу функцийг ол.',a:'$f^{-1}(x)='+invLin(a,b)+'$'};}
// ── Квадрат ──
function oj_quadroots(){for(var t=0;t<200;t++){var r1=nz(-6,6),r2=nz(-6,6);if(r1===r2)continue;var b=-(r1+r2),c=r1*r2,lo=Math.min(r1,r2),hi=Math.max(r1,r2);return {stem:'Тэгшитгэлийг бод: $'+quadStr(b,c)+'=0$',a:'$x_1='+lo+',\\ x_2='+hi+'$'};}return null;}
function oj_quadvertex(){var xv=nz(-4,4),m=nz(-6,6),b=-2*xv,c=xv*xv+m;return {stem:'$y='+quadStr(b,c)+'$ параболын орой ба хамгийн бага утгыг ол.',a:'орой $('+xv+';\\ '+m+')$, $y_{min}='+m+'$'};}
// ── График байгуулах координатын хавтгай ──
function labeledGrid(x0,x1,y0,y1){var u=11,mL=22,mT=10,PW=(x1-x0)*u,PH=(y1-y0)*u,g='';
  function px(x){return mL+(x-x0)*u;}function py(y){return mT+(y1-y)*u;}
  var W=mL+PW+8,H=mT+PH+16;
  for(var i=Math.ceil(x0);i<=Math.floor(x1);i++)g+='<line x1="'+px(i).toFixed(1)+'" y1="'+mT+'" x2="'+px(i).toFixed(1)+'" y2="'+(mT+PH)+'" stroke="#ede9fa" stroke-width="0.5"/>';
  for(var j=Math.ceil(y0);j<=Math.floor(y1);j++)g+='<line x1="'+mL+'" y1="'+py(j).toFixed(1)+'" x2="'+(mL+PW)+'" y2="'+py(j).toFixed(1)+'" stroke="#ede9fa" stroke-width="0.5"/>';
  var axY=py(0),axX=px(0);
  g+='<line x1="'+mL+'" y1="'+axY.toFixed(1)+'" x2="'+(mL+PW)+'" y2="'+axY.toFixed(1)+'" stroke="#555" stroke-width="1"/><line x1="'+axX.toFixed(1)+'" y1="'+mT+'" x2="'+axX.toFixed(1)+'" y2="'+(mT+PH)+'" stroke="#555" stroke-width="1"/>';
  for(var t2=Math.ceil(x0);t2<=Math.floor(x1);t2++){if(t2===0||t2%2!==0)continue;g+='<text x="'+(px(t2)-3).toFixed(1)+'" y="'+(axY+9).toFixed(1)+'" font-size="7.5" fill="#8a80b0">'+t2+'</text>';}
  var yStep=(y1-y0>13)?2:1;for(var s2=Math.ceil(y0);s2<=Math.floor(y1);s2++){if(s2===0||s2%yStep!==0)continue;g+='<text x="'+(axX-13).toFixed(1)+'" y="'+(py(s2)+3).toFixed(1)+'" font-size="7.5" fill="#8a80b0">'+s2+'</text>';}
  g+='<text x="'+(axX+3).toFixed(1)+'" y="'+(mT+7)+'" font-size="9" fill="#555" font-weight="700">y</text><text x="'+(mL+PW-6)+'" y="'+(axY-3).toFixed(1)+'" font-size="9" fill="#555" font-weight="700">x</text>';
  return '<svg width="'+W.toFixed(0)+'" height="'+H.toFixed(0)+'" viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" style="flex-shrink:0">'+g+'</svg>';}
function og_line(){var k=pick([1,2,-1,-2,3,-3]),b=nz(-4,4);return {stem:'$y='+kxb(k,b)+'$ функцийн графикийг байгуул.',grid:labeledGrid(-6,6,-6,6),a:'Цэгүүд: $(0;'+b+'),\\ (1;'+(k+b)+')$; налалт $'+k+'$'};}
function og_parab(){for(var t=0;t<200;t++){var r1=nz(-3,2),r2=nz(-3,2);if(r1===r2)continue;if(((r1+r2)&1)!==0)continue;var b=-(r1+r2),c=r1*r2,xv=(r1+r2)/2,m=-(r1-r2)*(r1-r2)/4;
  return {stem:'$y='+quadStr(b,c)+'$ параболыг байгуул.',grid:labeledGrid(-6,6,Math.min(m-1,0),m+10),a:'орой $('+xv+';'+m+')$, язгуур $'+Math.min(r1,r2)+',\\ '+Math.max(r1,r2)+'$'};}return null;}

var GENS=[oj_seqterm,oj_seqval,oj_recur,oj_slope,oj_slope2,oj_lineeq,oj_inverse,oj_quadroots,oj_quadvertex,oj_slope];
var GRAPHS=[og_line,og_line,og_parab,og_line,og_parab,og_line];
function gen(fn){for(var t=0;t<250;t++){var g=fn();if(g)return g;}return null;}
function build(){window.__POOL=GENS.map(function(fn){return gen(fn);});window.__GPOOL=GRAPHS.map(function(fn){return gen(fn);});layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=GENS.map(function(fn){return gen(fn);}));var G=window.__GPOOL||(window.__GPOOL=GRAPHS.map(function(fn){return gen(fn);}));
  var body=S.map(function(f,i){if(!f)return '';return '<div class="q"><div class="qh"><span class="qn">'+(i+1)+'.</span><span class="qm">'+f.stem+'</span></div>'+(WK?'<div class="wk"></div>':'')+'</div>';}).join('');
  var gbody=G.map(function(f,i){if(!f)return '';return '<div class="q"><div class="qh"><span class="qn">'+(i+1)+'.</span><span class="qm">'+f.stem+'</span></div><div class="gfig">'+f.grid+'</div></div>';}).join('');
  var ak=S.map(function(f,i){if(!f)return '';return '<div class="a"><span class="an">'+(i+1)+')</span><span>'+f.a+'</span></div>';}).join('');
  var gak=G.map(function(f,i){if(!f)return '';return '<div class="a"><span class="an">'+(i+1)+')</span><span>'+f.a+'</span></div>';}).join('');
  document.getElementById('sheet').innerHTML='<div class="head"><h1>V бүлэг — Жишиг даалгавар 1</h1><div class="sub">Дараалал · рекуррент · шулууны налалт · урвуу функц · квадрат тэгшитгэл · парабол · график · 9-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="task">I. Бод.</div><div class="grid">'+body+'</div>'
    +'<div class="task">II. Функцийн графикийг координатын хавтгайд байгуул.</div><div class="grid gg">'+gbody+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ak+'</div><div style="margin:8px 0 4px;font-weight:800;color:#5a32d6">График хэсэг:</div><div class="ans-grid">'+gak+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='V бүлэг — Жишиг даалгавар 1 (9-р анги)';toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
