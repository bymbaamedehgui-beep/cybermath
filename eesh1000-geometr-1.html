/* ЭЕШ 1000 — Геометр-1 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Координатын геометр, гурвалжин, параллелограмм, ромб, трапец.
   Эх: 1.44, 3.99, 1.33, 4.92, 1.74, 1.6, 1.88, 2.96, 4.94, 4.69, 4.89, 4.26, 4.34, 4.51, 4.101, 4.49, 4.64, 4.88, 4.84, 4.60 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 1.44 */
var e1_44 = (function () {
// 44. (a, b√c) цэгээс координатын эх хүртэлх зай: √(a² + b²c) — хялбарчилсан язгуураар.
function p44() {
  var a = nz(-6, 6), b = nz(-4, 4), c = pick([2, 2, 3, 3, 5, 6, 7]);
  var d2 = a * a + b * b * c, S = surd(d2);
  if (d2 > 120) return null;
  var p1 = String(a), p2 = rt(b, c), sw = rnd(1, 4) === 1;
  // Бодолт (гар бичмэл): |OA| = √(x² + y²) → язгуурыг хялбарчилна
  var q1 = par(a) + '^2', q2 = '(' + p2 + ')^2', v1 = a * a, v2 = b * b * c;
  return {
    q: '$(' + (sw ? p2 + ',\\,' + p1 : p1 + ',\\,' + p2) + ')$ цэгээс координатын эх хүртэлх зайг ол.',
    a: '$' + S.tex + '$',
    wk: 18,
    s: [
      'Өгөгдсөн цэгийг $A$ гэвэл координатын эх $O$ хүртэлх зай $|OA|=\\sqrt{x^2+y^2}$ тул $$|OA|=\\sqrt{' + (sw ? q2 + '+' + q1 : q1 + '+' + q2) + '}=\\sqrt{'
        + (sw ? v2 + '+' + v1 : v1 + '+' + v2) + '}=\\sqrt{' + d2 + '}' + (S.k > 1 ? '=' + S.tex : '') + '.$$'
    ],
    t: { a: a, b: b, c: c }
  };
}
return p44;
})();

/* 3.99 */
var e3_99 = (function () {
// 99. AB хэрчмийн дундаж цэг M: M = (A + B)/2 ⇒ B = 2M − A (заримдаа A-г олно: A = 2M − B).
//     Цэгийн бичлэг эх шиг таслалтай: A(x, y).
function p99() {
  var A = [rnd(-8, 9), rnd(-8, 9)], M = [rnd(-7, 7), rnd(-7, 7)], B = [2 * M[0] - A[0], 2 * M[1] - A[1]];
  if (A[0] === M[0] || A[1] === M[1]) return null;                         // AB тэнхлэгт параллель биш (хэт энгийн)
  if (Math.abs(B[0]) > 15 || Math.abs(B[1]) > 15) return null;
  if ([A[0], A[1], M[0], M[1], B[0], B[1]].filter(function (x) { return !x; }).length > 1) return null;
  var findA = rnd(1, 5) === 1, G = findA ? B : A, X = findA ? A : B, gn = findA ? 'B' : 'A', xn = findA ? 'A' : 'B';
  var c = function (p) { return '(' + p[0] + ',\\,' + p[1] + ')'; };
  return {
    q: '$AB$ хэрчмийн дундаж цэг нь $M$ болно. Хэрэв $' + gn + c(G) + '$, $M' + c(M) + '$ бол $' + xn + '$ цэгийн координатыг олоорой.',
    a: '$' + xn + c(X) + '$',
    wk: 20,
    t: { A: A, B: B, M: M, findA: findA }
  };
}
return p99;
})();

/* 1.33 */
var e1_33 = (function () {
// 33. √2 нэгжээр: A = N − (u,v), B = N + (u,v); AB-д перпендикуляр, N-ийг дайрсан шулуун дээр
//     C = N + t·(p,q), (p,q) = (−v,u)/gcd(u,v) → NC = |t|·√(2(p²+q²)) хялбарчилсан
//     (эх: A(0, 2√2), B(6√2, 8√2), C(m, 9√2) → NC = 8). C-ийн ординат өгөгдөнө (q ≠ 0 тул m цор ганц).
function p33_c(P) { return '(' + rt(P[0], 2) + ',\\,' + rt(P[1], 2) + ')'; }
function p33() {
  var N = [rnd(-2, 5), rnd(-2, 6)], u = nz(-4, 4), v = rnd(0, 1) ? (rnd(0, 1) ? u : -u) : nz(-4, 4);
  var g = gcd(u, v), p = -v / g, q = u / g, t = nz(-4, 4);
  var A = [N[0] - u, N[1] - v], B = [N[0] + u, N[1] + v], C = [N[0] + t * p, N[1] + t * q];
  if ([A[0], A[1], B[0], B[1], C[0], C[1]].some(function (z) { return Math.abs(z) > 9; })) return null;
  var s = surd(2 * (p * p + q * q)), NC = rt(Math.abs(t) * s.k, s.r);
  if (Math.abs(t) * s.k > 12) return null;
  // Бодолт (гар бичмэл): N — дундаж цэг; k₁ = Δy/Δx, k₂ = −1/k₁; l: y = k₂x + b (N-ийг дайрна) → b; C ∈ l → m; |NC| = √(Δx² + Δy²).
  // Бүх координат √2-ын үржвэр: k₂ = −u/v, b = (v·N_y + u·N_x)/v · √2, m = C_x·√2.
  var bn = v * N[1] + u * N[0], dx = C[0] - N[0], dy = C[1] - N[1], k2 = tm([-u, v], 'x', true), bt = bn ? (bn * v > 0 ? '+' : '') + p33_r(bn, v) : '';
  return {
    q: '$A' + p33_c(A) + ',\\ B' + p33_c(B) + '$ цэгүүд дээр төгсгөлтэй хэрчмийн дундаж цэг $N$-ийг дайрсан $AB$ хэрчимд перпендикуляр шулуун дээр $C(m,\\,'
      + rt(C[1], 2) + ')$ цэг оршдог бол $NC$ хэрчмийн уртыг ол.',
    a: '$NC=' + NC + '$', wk: 32,
    s: [
      '$AB$ хэрчмийн дундаж цэг: $$N\\left(\\dfrac{' + p33_s(A[0], B[0]) + '}{2},\\,\\dfrac{' + p33_s(A[1], B[1]) + '}{2}\\right)=N' + p33_c(N) + '.$$',
      '$AB$ шулууны налалт $k_1$, түүнд перпендикуляр $l$ шулууны налалт $k_2$: $$k_1=\\dfrac{y_B-y_A}{x_B-x_A}=\\dfrac{' + p33_d(B[1], A[1]) + '}{' + p33_d(B[0], A[0]) + '}='
        + fr(v, u) + ',\\qquad k_2=-\\dfrac{1}{k_1}=' + fr(-u, v) + '.$$',
      '$l:\\ y=' + k2 + '+b$ шулуун $N$-ийг дайрна: $' + (N[0] ? rt(N[1], 2) + '=' + p33_r(-u * N[0], v) + '+b\\Rightarrow ' : '') + 'b=' + p33_r(bn, v)
        + '$. Иймд $l:\\ y=' + k2 + bt + '$.',
      '$C(m,\\,' + rt(C[1], 2) + ')\\in l$: $' + rt(C[1], 2) + '=' + tm([-u, v], 'm', true) + bt + '\\Rightarrow m=' + rt(C[0], 2) + '$, $C' + p33_c(C) + '$.',
      '$$|NC|=\\sqrt{(\\Delta x)^2+(\\Delta y)^2}=\\sqrt{\\left(' + rt(dx, 2) + '\\right)^2+\\left(' + rt(dy, 2) + '\\right)^2}=\\sqrt{' + 2 * (dx * dx + dy * dy) + '}' + (s.k === 1 && s.r > 1 && Math.abs(t) === 1 ? '' : '=' + NC) + '.$$'
    ],
    t: { A: A, B: B, Cy: C[1] }

}
// (n/d)·√2 хялбарчилсан: 8√2, −√2, 7√2/2, 0
function p33_r(n, d) {
  var g = gcd(n, d); n /= g; d /= g;
  if (d < 0) { n = -n; d = -d; }
  if (d === 1) return rt(n, 2);
  return (n < 0 ? '-' : '') + '\\dfrac{' + rt(Math.abs(n), 2) + '}{' + d + '}';
}
// x_A + x_B бичлэг (√2-оор): 0+6√2, −2√2+(−4√2) …
function p33_s(a, b) { return b === 0 ? rt(a, 2) : rt(a, 2) + (b < 0 ? '+(' + rt(b, 2) + ')' : '+' + rt(b, 2)); }
// x_B − x_A бичлэг: 6√2−0 → 6√2; 8√2−(−2√2)
function p33_d(b, a) { return a === 0 ? rt(b, 2) : rt(b, 2) + '-' + (a < 0 ? '(' + rt(a, 2) + ')' : rt(a, 2)); }
return p33;
})();

/* 4.92 */
var e4_92 = (function () {
// 92. Гурвалжны дундаж шугам: хоёр талын дундаж цэгийг холбосон хэрчим нь гурав дахь талтайгаа параллель бөгөөд түүний
//     хагастай тэнцүү ⇒ урт = |XY|/2 = √(Δx² + Δy²)/2 (хялбарчилсан язгуур/бутархай). Өгөгдсөн хоёр орой: A, B (голдуу), A, C эсвэл B, C.
var p92_V = [['A', 'B', '$AC$ болон $CB$'], ['A', 'C', '$AB$ болон $BC$'], ['B', 'C', '$AB$ болон $AC$']];
function p92() {
  var V = rnd(1, 10) <= 6 ? p92_V[0] : pick(p92_V), ev = rnd(1, 10) <= 6;
  var dx = ev ? 2 * rnd(-4, 4) : rnd(-8, 8), dy = ev ? 2 * rnd(-4, 4) : rnd(-8, 8);
  if (!dx || !dy) return null;                                        // тэнхлэгтэй параллель — хэт хялбар
  var x1 = rnd(-7, 7), y1 = rnd(-7, 7), x2 = x1 + dx, y2 = y1 + dy;
  if (Math.abs(x2) > 9 || Math.abs(y2) > 9) return null;
  var s = surd(dx * dx + dy * dy), L = s.r === 1 ? fr(s.k, 2) : s.k % 2 ? '\\dfrac{' + rt(s.k, s.r) + '}{2}' : rt(s.k / 2, s.r);

/* 1.74 */
var e1_74 = (function () {
// 74. y = mx + c шулуунтай перпендикуляр, координатын эх (эсвэл M(x₀; y₀) цэг)-ийг дайрсан шулуун:
//     налалт k = −1/m, y = k(x − x₀) + y₀. m = mp/mq; x₀ нь mp-ийн үржвэр → чөлөөт гишүүн бүхэл.
function p74() {
  var mq = pick([1, 1, 1, 1, 2, 3]), mp = nz(-5, 5);
  if (gcd(mp, mq) !== 1) return null;
  var c = nz(-6, 6), org = rnd(0, 9) < 6, x0 = 0, y0 = 0;
  if (!org) {
    x0 = mp * pick([-2, -1, 1, 2]); y0 = rnd(-6, 6);
    if (Math.abs(x0) > 6) return null;
  }
  var b0 = y0 + mq * x0 / mp;
  if (b0 !== Math.round(b0)) return null;
  var line = 'y=' + tm([mp, mq], 'x', true) + sgn(c);
  var ans = ('y=' + tm([-mq, mp], 'x', true) + (b0 ? sgn(b0) : '')).replace(/\\frac/g, '\\dfrac');
  var where = org ? 'координатын эхийг' : '$M' + pt(x0, y0) + '$ цэгийг';
  // Бодолт (гар бичмэл): l: y = kx (+b); l ⟂ y = mx + c ⇔ k·m = −1 ⇒ k = −1/m; M цэгийг орлуулж b.
  var mT = mq === 1 ? par(mp) : mp > 0 ? fr(mp, mq) : '\\left(' + fr(mp, mq) + '\\right)', kT = fr(-mq, mp), kv = -mq / mp;
  var kx0 = kv === 1 ? String(x0) : kv === -1 ? '-' + par(x0) : kT + '\\cdot ' + par(x0);
  return {
    q: '$' + line + '$ шулуунтай перпендикуляр бөгөөд ' + where + ' дайрсан шулууны тэгшитгэлийг бичээрэй.',
    a: '$' + ans + '$',
    wk: 22,
    s: [
      'Хайх шулууныг $l$: ' + (org ? '$y=kx$ гэе (координатын эхийг дайрна).' : '$y=kx+b$ гэе.')
        + ' $l$ нь $' + line + '$ шулуунд перпендикуляр тул өнцгийн коэффициентүүдийн үржвэр $-1$: $$k\\cdot ' + mT + '=-1\\Rightarrow k=' + kT + '.$$',

})();

/* 1.6 */
var e1_6 = (function () {
// 6. Координатын эхэд төвтэй, Ax + By + C = 0 шулууныг шүргэх тойрог: R = |C|/√(A² + B²).
//    A² + b = s² (s бүхэл, b бүтэн квадрат биш) → Ax + √b·y − c√b = 0: R = c√b/s, R² = c²b/s²;
//    тогтмол гишүүн бүхэл (−c) бол R² = c²/s². Заримдаа √b-г x-ийн коэффициент болгоно, тэмдгийг солино.
function p6() {
  var A = rnd(1, 4), s = rnd(A + 1, A + 4), b = s * s - A * A, sb = surd(b);
  if (sb.r === 1) return null;
  var c = rnd(1, 4), rad = rnd(0, 9) < 7;
  if (rad ? gcd(A, sb.k) !== 1 : gcd(gcd(A, sb.k), c) !== 1) return null;   // тэгшитгэлийг хураах боломжгүй байх
  var sy = rnd(0, 9) < 8 ? 1 : -1, sc = rnd(0, 9) < 8 ? -1 : 1, sw = rnd(0, 9) < 2;
  var R = rt(sb.k, sb.r), tx, ty;
  if (!sw) { tx = tm(A, 'x', true); ty = (sy < 0 ? '-' : '+') + R + 'y'; }
  else { tx = R + 'x'; ty = tm(sy * A, 'y'); }
  var tc = rad ? (sc < 0 ? '-' : '+') + rt(c * sb.k, sb.r) : sgn(sc * c);
  var num = rad ? c * c * b : c * c, den = s * s;
  // Бодолт (гар бичмэл): l: y = k₁x + b₀; OA ⊥ l → y = kx, k·k₁ = −1; системээс шүргэлтийн A цэг; R² = |OA|² = x² + y².
  var r = sb.r, M1 = p6_q(-1, 1, 1);
  var P = sw ? p6_q(sb.k, 1, r) : p6_q(A, 1, 1), Q = sw ? p6_q(sy * A, 1, 1) : p6_q(sy * sb.k, 1, r);
  var K = rad ? p6_q(sc * c * sb.k, 1, r) : p6_q(sc * c, 1, 1);
  var k1 = p6_mul(M1, p6_mul(P, p6_inv(Q))), k2 = p6_mul(Q, p6_inv(P)), b0 = p6_mul(M1, p6_mul(K, p6_inv(Q)));
  var dk = p6_add(k2, p6_mul(M1, k1)), xA = p6_mul(b0, p6_inv(dk)), yA = p6_mul(k2, xA);
  var sb0 = (b0.n < 0 ? '-' : '+') + p6_tex(p6_q(Math.abs(b0.n), b0.d, b0.q));
  return {
    q: 'Координатын эхэд төвтэй бөгөөд $' + tx + ty + tc + '=0$ шулууныг шүргэх тойргийн тэгшитгэл бичээрэй.',
    a: '$x^2+y^2=' + fr(num, den) + '$',
    wk: 25,
    s: [
      'Координатын эхэд төвтэй тойрог: $x^2+y^2=R^2$. Өгсөн шулууныг $l$, шүргэлтийн цэгийг $A$ гэвэл $OA\\perp l$ ба $R=|OA|$.',
      '$l$ шулууны тэгшитгэлийг $y$-ээр илэрхийлбэл $$y=' + p6_tex(k1) + 'x' + sb0 + ',$$ өнцгийн коэффициент нь $k_1=' + p6_tex(k1) + '$.',
      '$OA\\perp l$ тул $OA$ шулуун $y=kx$-ийн хувьд $k\\cdot k_1=-1$: $$k\\cdot' + (k1.n < 0 ? p6_p(k1) : ' ' + p6_tex(k1)) + '=-1\\Rightarrow k=' + p6_tex(k2) + '.$$',
      '$A$ нь эдгээр хоёр шулууны огтлолцлын цэг: $$\\begin{aligned}&' + p6_tex(k2) + 'x=' + p6_tex(k1) + 'x' + sb0 + '\\Rightarrow ' + p6_tex(dk) + 'x=' + p6_tex(b0)
        + '\\Rightarrow x=' + p6_tex(xA) + ',\\\\&y=' + p6_tex(k2) + '\\cdot' + (xA.n < 0 ? p6_p(xA) : ' ' + p6_tex(xA)) + '=' + p6_tex(yA) + '.\\end{aligned}$$'
        + 'Иймд $A\\left(' + p6_tex(xA) + ';\\,' + p6_tex(yA) + '\\right)$.',
      '$$R^2=|OA|^2=' + p6_p(xA) + '^2+' + p6_p(yA) + '^2=' + p6_sq(xA) + '+' + p6_sq(yA) + '=' + fr(num, den) + '.$$ Иймд тойргийн тэгшитгэл $x^2+y^2=' + fr(num, den) + '$.'
    ],
    sfig: p6_fig(p6_v(P), p6_v(Q), p6_v(K)),

}
// Бодолтын туслах: (n/d)·√q хэлбэрийн тоо (q = 1 эсвэл квадрат хуваагчгүй r)
function p6_q(n, d, q) { if (d < 0) { n = -n; d = -d; } var g = gcd(n, d); return { n: n / g, d: d / g, q: n === 0 ? 1 : q }; }
function p6_mul(u, v) { var n = u.n * v.n, q = 1; if (u.q > 1 && v.q > 1) n *= u.q; else q = Math.max(u.q, v.q); return p6_q(n, u.d * v.d, q); }
function p6_inv(u) { return p6_q(u.d, u.n * u.q, u.q); }                 // 1/((n/d)√q) = d√q/(n·q)
function p6_add(u, v) { return p6_q(u.n * v.d + v.n * u.d, u.d * v.d, u.q); }   // ижил q-тэй
function p6_v(u) { return u.n / u.d * Math.sqrt(u.q); }

function p6_fig(Pn, Qn, Kn) {

    .circle([0, 0], 1, { w: 1.3 }).seg(L1, L2, { w: 1.4 })
    .seg(D1, D2, { dash: '4 3', w: 1 }).seg([0, 0], A, { w: 1.5 })
