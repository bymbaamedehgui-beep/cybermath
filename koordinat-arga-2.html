<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Координатын арга 2 · параллелограммын дутуу оройг ол (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--orange:#e0701a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:11mm 13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 24px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:11px;text-align:center}
  .sec{font-size:12.5px;font-weight:800;color:#5a32d6;margin:6px 0 8px;display:flex;align-items:center;gap:7px}
  .sec b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;background:var(--purple);color:#fff;font-size:11px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:12px}
  .q{break-inside:avoid;page-break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:7px 9px;background:linear-gradient(#fff,#fbf9ff);display:flex;gap:10px;align-items:center}
  .q .fig{flex:none}.q .rt{flex:1;font-size:12px}
  .q .qn{font-weight:800;color:var(--purple)}
  .q .shape{font-weight:700;color:#5a32d6}
  .ansl{font-weight:700;margin-top:8px}.ansl .bl{display:inline-block;min-width:66px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .wgrid{display:grid;grid-template-columns:1fr;gap:8px}
  .wq{break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:8px 11px;background:linear-gradient(#fff,#fbf9ff)}
  .wq .wn{font-weight:800;color:var(--purple);margin-right:5px}.wq .wt{font-size:12.7px}.wq .wt .ask{color:#5a32d6;font-weight:700}
  .wans{font-size:12px;font-weight:700;margin-top:5px}.wans .bl{display:inline-block;min-width:150px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  .ans-w{margin-top:8px;font-size:12.5px;display:grid;gap:5px}.ans-w .an{color:var(--soft);font-weight:800}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
/* ---- тоотой координатын хавтгай ---- */
var VB=190, LC='#2f6cae';
function X(w,x){return (x-w.xmin)/(w.xmax-w.xmin)*VB;}
function Y(w,y){return VB-(y-w.ymin)/(w.ymax-w.ymin)*VB;}
function grid(w){var g='',i,st=(w.xmax-w.xmin)>13?2:1;
  for(i=w.xmin;i<=w.xmax;i++){var px=X(w,i);g+='<line x1="'+px.toFixed(1)+'" y1="0" x2="'+px.toFixed(1)+'" y2="'+VB+'" stroke="'+(i===0?'#555':'#e8e2f7')+'" stroke-width="'+(i===0?1.2:0.5)+'"/>';}
  for(i=w.ymin;i<=w.ymax;i++){var py=Y(w,i);g+='<line x1="0" y1="'+py.toFixed(1)+'" x2="'+VB+'" y2="'+py.toFixed(1)+'" stroke="'+(i===0?'#555':'#e8e2f7')+'" stroke-width="'+(i===0?1.2:0.5)+'"/>';}
  var y0=Y(w,0),x0=X(w,0);
  for(i=w.xmin;i<=w.xmax;i++){if(i!==0&&i%st===0)g+='<text x="'+(X(w,i)+1).toFixed(1)+'" y="'+(y0+8).toFixed(1)+'" font-size="7" fill="#9a92b5">'+i+'</text>';}
  for(i=w.ymin;i<=w.ymax;i++){if(i!==0&&i%st===0)g+='<text x="'+(x0+2).toFixed(1)+'" y="'+(Y(w,i)+3).toFixed(1)+'" font-size="7" fill="#9a92b5">'+i+'</text>';}
  return g;
}
function winPoints(pts){var xs=[0],ys=[0],k;for(k=0;k<pts.length;k++){xs.push(pts[k][0]);ys.push(pts[k][1]);}
  var xmin=Math.floor(Math.min.apply(null,xs))-1,xmax=Math.ceil(Math.max.apply(null,xs))+1,ymin=Math.floor(Math.min.apply(null,ys))-1,ymax=Math.ceil(Math.max.apply(null,ys))+1;
  var rx=xmax-xmin,ry=ymax-ymin,S=Math.max(rx,ry),ex=S-rx,ey=S-ry;
  xmin-=Math.floor(ex/2);xmax+=Math.ceil(ex/2);ymin-=Math.floor(ey/2);ymax+=Math.ceil(ey/2);
  return {xmin:xmin,xmax:xmax,ymin:ymin,ymax:ymax};
}
var LET=['A','B','C','D'];
function drawPar(pts,unk){
  var w=winPoints(pts), sp=pts.map(function(p){return [X(w,p[0]),Y(w,p[1])];});
  var cen=[(sp[0][0]+sp[1][0]+sp[2][0]+sp[3][0])/4,(sp[0][1]+sp[1][1]+sp[2][1]+sp[3][1])/4];
  var s='<svg viewBox="0 0 '+VB+' '+VB+'" width="150" height="150" style="background:#fff;border:1px solid #e5e0f0;border-radius:6px">'+grid(w);
  s+='<path d="M'+sp[0][0].toFixed(1)+' '+sp[0][1].toFixed(1)+' L'+sp[1][0].toFixed(1)+' '+sp[1][1].toFixed(1)+' L'+sp[2][0].toFixed(1)+' '+sp[2][1].toFixed(1)+' L'+sp[3][0].toFixed(1)+' '+sp[3][1].toFixed(1)+' Z" fill="rgba(123,82,238,.06)" stroke="'+LC+'" stroke-width="2"/>';
  // диагональ (сул)
  s+='<line x1="'+sp[0][0].toFixed(1)+'" y1="'+sp[0][1].toFixed(1)+'" x2="'+sp[2][0].toFixed(1)+'" y2="'+sp[2][1].toFixed(1)+'" stroke="#c9bef0" stroke-width="1"/>';
  s+='<line x1="'+sp[1][0].toFixed(1)+'" y1="'+sp[1][1].toFixed(1)+'" x2="'+sp[3][0].toFixed(1)+'" y2="'+sp[3][1].toFixed(1)+'" stroke="#c9bef0" stroke-width="1"/>';
  for(var i=0;i<4;i++){var isU=(i===unk),col=isU?'#e0701a':'#3a2d5e';
    s+='<circle cx="'+sp[i][0].toFixed(1)+'" cy="'+sp[i][1].toFixed(1)+'" r="2.4" fill="'+col+'"/>';
    var dir=[sp[i][0]-cen[0],sp[i][1]-cen[1]],L=Math.hypot(dir[0],dir[1])||1;
    var lp=[sp[i][0]+dir[0]/L*13,sp[i][1]+dir[1]/L*13];
    var txt=LET[i]+(isU?'(?,?)':'('+pts[i][0]+','+pts[i][1]+')');
    s+='<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3).toFixed(1)+'" font-size="8.5" font-weight="700" fill="'+col+'" text-anchor="middle">'+txt+'</text>';}
  s+='</svg>';return s;
}
function gen(){
  var A=[rnd(-4,4),rnd(-4,4)], u=[nz(-6,6),nz(-6,6)], v=[nz(-6,6),nz(-6,6)];
  var cross=u[0]*v[1]-u[1]*v[0];
  if(Math.abs(cross)<6)return gen();                       // хэт нимгэн/параллель биш
  var pts=[A,[A[0]+u[0],A[1]+u[1]],[A[0]+u[0]+v[0],A[1]+u[1]+v[1]],[A[0]+v[0],A[1]+v[1]]];
  for(var i=0;i<4;i++)if(Math.abs(pts[i][0])>9||Math.abs(pts[i][1])>9)return gen();
  var unk=rnd(0,3);
  return {pts:pts,unk:unk,ans:pts[unk],sig:pts.map(function(p){return p.join('_');}).join('|')+':'+unk};
}
function wp(){
  return pick([
    (function(){var a=[nz(-6,6),nz(-6,6)],c=[nz(-6,6),nz(-6,6)];
      return {t:'Параллелограммын диагональ $AC$-ийн үзүүрүүд $A('+a+')$, $C('+c+')$. <span class="ask">Диагоналуудын огтлолцлын (төвийн) цэгийг ол.</span>',
        a:'$O=\\left(\\frac{'+a[0]+'+'+c[0]+'}{2},\\frac{'+a[1]+'+'+c[1]+'}{2}\\right)=('+((a[0]+c[0])/2)+',\\ '+((a[1]+c[1])/2)+')$'};})(),
    (function(){var A=[nz(-5,5),nz(-5,5)],B=[nz(-5,5),nz(-5,5)],C=[nz(-5,5),nz(-5,5)];
      return {t:'Параллелограмм $ABCD$-ийн дараалсан гурван орой $A('+A+')$, $B('+B+')$, $C('+C+')$. <span class="ask">$D$ оройг ол.</span>',
        a:'$D=A+C-B=('+(A[0]+C[0]-B[0])+',\\ '+(A[1]+C[1]-B[1])+')$'};})(),
    (function(){var A=[nz(-5,5),nz(-5,5)],C=[nz(-5,5),nz(-5,5)];
      return {t:'Тэгш өнцөгтийн эсрэг орших хоёр орой $A('+A+')$, $C('+C+')$. <span class="ask">Диагоналуудын огтлолцлыг (төвийг) ол.</span>',
        a:'$\\left('+((A[0]+C[0])/2)+',\\ '+((A[1]+C[1])/2)+'\\right)$'};})()
  ]);
}

function build(){
  var cards='',answ='',items=[],seen={};
  for(var i=0;i<6;i++){
    var g,tr=0;do{g=gen();tr++;}while(seen[g.sig]&&tr<80);seen[g.sig]=1;
    var n=i+1, known=[];
    for(var k=0;k<4;k++)if(k!==g.unk)known.push(LET[k]+'('+g.pts[k][0]+','+g.pts[k][1]+')');
    cards+='<div class="q"><div class="fig">'+drawPar(g.pts,g.unk)+'</div>'
      +'<div class="rt"><span class="qn">'+n+'.</span> <span class="shape">Параллелограмм</span><br>'+known.join(', ')+'<div class="ansl">'+LET[g.unk]+' = (<span class="bl"></span>)</div></div></div>';
    answ+='<div class="a"><span class="an">'+n+'.</span><span>'+LET[g.unk]+'('+g.ans[0]+', '+g.ans[1]+')</span></div>';
    items.push({q:'Дутуу орой '+LET[g.unk],a:LET[g.unk]+'('+g.ans[0]+','+g.ans[1]+')'});
  }
  var W=(function(){var arr=[],s={},t=0;while(arr.length<3&&t<60){var w=wp(),k=w.t.slice(0,26);if(!s[k]){s[k]=1;arr.push(w);}t++;}while(arr.length<3)arr.push(wp());return arr;})();
  var wc='',wa='';
  for(var j=0;j<W.length;j++){var w=W[j],n2=j+7;
    wc+='<div class="wq"><span class="wn">'+n2+'.</span><span class="wt">'+w.t+'</span><div class="wans">Хариу:<span class="bl"></span></div></div>';
    wa+='<div><span class="an">'+n2+'.</span> '+w.a+'</div>';
    items.push({q:'Бодлого '+n2,a:w.a});}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Координатын арга 2</h1><div class="sub">Координатын хавтгайд параллелограммын дутуу оройг ол · диагональ харилцан хагасалдана · 9-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Параллелограмм (тэгш өнцөгт)-ийн <b>диагоналууд харилцан хагасалдана</b> → $A+C=B+D$ &nbsp;·&nbsp; дутуу орой: $D=A+C-B$ гэх мэт</div>'
    +'<div class="sec"><b>1</b> Мэдэгдэхгүй байгаа оройг ол</div><div class="dgrid">'+cards+'</div>'
    +'<div class="sec"><b>2</b> Бодлого</div><div class="wgrid">'+wc+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answ+'</div><div class="ans-w">'+wa+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Координатын арга 2';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
