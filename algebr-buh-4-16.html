<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Алгебрын бутархай — 3-4 үйлдэл (хүнд) — 16 бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.6}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .guide{background:#f6f2ff;border:1px solid #e2d6ff;border-radius:12px;padding:10px 16px;margin-bottom:14px;font-size:12px;text-align:center}
  .q{break-inside:avoid;page-break-inside:avoid;padding:9px 4px 10px;border-bottom:1px dashed #efeaff}
  .qh{display:flex;gap:8px;align-items:baseline}.qn{font-weight:800;color:var(--purple);min-width:26px}.qm{font-size:14px}
  .bl{margin:14px 0 2px 30px;border-bottom:1.4px solid #b9accf;height:1.05em}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(lo,hi){var v=0;while(v===0)v=rnd(lo,hi);return v;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function bin(c){return 'x'+(c>0?'+'+c:c<0?'-'+(-c):'');}
function dfr(t,b){return '\\dfrac{'+t+'}{'+b+'}';}
function pickN(k){var pool=[];for(var v=-7;v<=7;v++)if(v!==0)pool.push(v);for(var i=pool.length-1;i>0;i--){var j=rnd(0,i);var t=pool[i];pool[i]=pool[j];pool[j]=t;}return pool.slice(0,k);}
// Телескоп ×/÷ гинж (4-5 бутархай → 3-4 үйлдэл)
function chainType(){
  var L=rnd(0,1)===0?4:5;
  var rs=pickN(L+1), top=rs[0], bot=rs[1];
  var q=dfr(bin(top),bin(bot));
  for(var k=2;k<=L;k++){
    var nw=rs[k];
    if(rnd(0,1)===0)q+='\\cdot '+dfr(bin(bot),bin(nw));
    else q+='\\div '+dfr(bin(nw),bin(bot));
    bot=nw;
  }
  return {q:q,a:dfr(bin(top),bin(bot))};
}
// Хаалт доторх нийлбэр/ялгавар → хуваах → үржих (бүх үйлдэл нэг бодлогод)
function conjType(){
  var a=rnd(2,6),plus=rnd(0,1)===0,c=nz(-6,6);
  var inner='\\left('+dfr('1',bin(-a))+(plus?'+':'-')+dfr('1',bin(a))+'\\right)';
  var divisor=plus?dfr('2x','x^{2} - '+(a*a)):dfr(''+(2*a),'x^{2} - '+(a*a));
  var q=inner+'\\div '+divisor+'\\cdot\\left('+bin(c)+'\\right)';
  return {q:q,a:bin(c)};
}
function build(){
  var probs='',answs='',ITEMS=[];
  for(var i=0;i<16;i++){
    var it=(rnd(0,2)===0)?conjType():chainType();
    var n=i+1;
    probs+='<div class="q"><div class="qh"><span class="qn">'+n+'.</span><span class="qm">$'+it.q+'=$</span></div><div class="bl"></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>$'+it.a+'$</span></div>';
    ITEMS.push({q:it.q+'=',a:it.a});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Алгебрын бутархай — 3–4 үйлдэлтэй (хүнд)</h1><div class="sub">Бүх үйлдэл хамарсан · задал, хорого, үйлдлийн дарааллыг баримтал · 16 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="guide">Эхлээд <b>хаалт доторх</b> нэмэх/хасахыг нэгтгэ → <b>хуваахдаа урвуугаар үржүүл</b> → үржигдэхүүн болгон задлаад нийтлэг хаалтыг <b>хорого</b>.</div>'
    +'<div>'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=ITEMS; window.WS_TITLE='Алгебрын бутархай 3-4 үйлдэл (хүнд)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=7"></script>
</body>
</html>
