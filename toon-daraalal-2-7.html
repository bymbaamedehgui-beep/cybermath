<script>
// ══════════ g7core.js — 7-р ангийн нийтлэг хөдөлгүүр (бүх бүлэгт залгагдана) ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ g7ch6.js — VI БҮЛЭГ. ДАРААЛАЛ, ФУНКЦ ══════════
// g7core.js доторх helper-үүд (rnd,nz,pick,shuffle,gcd,sgn,paren,frTeX...) шууд дуудагдана.

// ── Тусгай helper ──
// a*v + b хэлбэрийн шугаман илэрхийлэл (v='n' эсвэл 'x'), тэмдэг цэвэр
function linTex(a,b,v){var t='';
 if(a===0)t='';
 else if(a===1)t=v;
 else if(a===-1)t='-'+v;
 else t=a+v;
 if(b>0)t+=(t?'+':'')+b;
 else if(b<0)t+='-'+(-b);
 if(t==='')t='0';
 return t;}
function nT(a,b){return linTex(a,b,'n');}
function seqL(arr){return arr.join(',\\ ');}
function aList(arr){ // a_1=..,a_2=..
 return arr.map(function(v,i){return 'a_{'+(i+1)+'}='+v;}).join(',\\ ');}

// ════════════ 6.1 Тоон дараалал ба гишүүн ════════════

// Дарааллын зүй тогтол → дараагийн 3 гишүүн
function g_nextTermsRule(){
 var mode=pick(['arith','arith','grow']);
 if(mode==='arith'){
  var a1=rnd(-10,20),r=pick([-6,-5,-4,-3,3,4,5,6]);
  var terms=[a1,a1+r,a1+2*r,a1+3*r];
  var last=terms[3];
  var next3=[last+r,last+2*r,last+3*r];
  var rule=r>0?('өмнөх гишүүн дээр '+r+' нэмнэ'):('өмнөх гишүүнээс '+(-r)+' хасна');
  return {
   q:'$'+seqL(terms)+',\\ \\dots$ дарааллын зүй тогтлыг олж, дараагийн 3 гишүүнийг бич.',
   a:'Зүй тогтол: '+rule+' $(d='+r+')$. Дараагийн 3 гишүүн: $'+seqL(next3)+'$.',
   key:'ntr-a-'+a1+'-'+r, nv:next3[0],
   _c:{type:'nextTerms',gen:'arith',terms:terms,next3:next3,r:r}
  };
 } else {
  var b1=rnd(1,5),d0=rnd(1,4),s=pick([1,2]);
  var t=[b1],diffs=[];
  for(var i=0;i<4;i++){var dd=d0+i*s;diffs.push(dd);t.push(t[t.length-1]+dd);} // 5 гишүүн
  var L=t.length; // 5
  var n3=[],cur=t[L-1];
  for(var j=0;j<3;j++){var nd=d0+(L-1+j)*s;cur+=nd;n3.push(cur);}
  return {
   q:'$'+seqL(t)+',\\ \\dots$ дарааллын зүй тогтлыг олж, дараагийн 3 гишүүнийг бич.',
   a:'Зэргэлдээ гишүүдийн зөрүү $'+seqL(diffs)+'$ буюу $'+s+'$-аар өсдөг. Дараагийн 3 гишүүн: $'+seqL(n3)+'$.',
   key:'ntr-g-'+b1+'-'+d0+'-'+s, nv:n3[0],
   _c:{type:'nextTerms',gen:'grow',terms:t,next3:n3,d0:d0,s:s}
  };
 }
}

// Ерөнхий гишүүний томьёогоор эхний 4 ба a_k
function g_termByFormula(){
 var p=pick([2,3,4,5,-2,-3,-4]),q=nz(-9,9),k=pick([20,30,50,100]);
 var f4=[1,2,3,4].map(function(i){return p*i+q;});
 var ak=p*k+q;
 return {
  q:'$a_n='+nT(p,q)+'$ дарааллын эхний 4 гишүүн ба $a_{'+k+'}$-ийг ол.',
  a:'Эхний 4 гишүүн: $'+aList(f4)+'$. $\\ a_{'+k+'}='+paren(p)+'\\cdot '+k+sgn(q)+'='+ak+'$'+(p<0?' (буурах дараалал).':' (өсөх дараалал).'),
  key:'tbf-'+p+'-'+q+'-'+k, nv:ak,
  _c:{type:'lin_n',p:p,q:q,k:k}
 };
}

// Өсөх/буурах ангилах
function g_increasingDecreasing(){
 var type=pick(['up','down','geoDown','geoUp','fracDown']);
 var arr, vals, tex, label, key;
 if(type==='up'){var a1=rnd(1,15),r=pick([2,3,4,5,6,7]);vals=[a1,a1+r,a1+2*r,a1+3*r];tex=seqL(vals);label='өсөх';key='id-up-'+a1+'-'+r;}
 else if(type==='down'){var b1=rnd(12,30),r2=pick([3,4,5,6,7,8]);vals=[b1,b1-r2,b1-2*r2,b1-3*r2];tex=seqL(vals);label='буурах';key='id-dn-'+b1+'-'+r2;}
 else if(type==='geoDown'){var st=pick([800,1000,640,320,1024]);vals=[st,st/2,st/4,st/8];tex=seqL(vals);label='буурах';key='id-gd-'+st;}
 else if(type==='geoUp'){var g0=pick([2,3,5]),q=pick([2,3]);vals=[g0,g0*q,g0*q*q,g0*q*q*q];tex=seqL(vals);label='өсөх';key='id-gu-'+g0+'-'+q;}
 else {var dn=pick([2,3]);vals=[1/(dn),1/(dn*dn),1/(dn*dn*dn),1/(dn*dn*dn*dn)];
  tex=['\\dfrac{1}{'+dn+'}','\\dfrac{1}{'+(dn*dn)+'}','\\dfrac{1}{'+(dn*dn*dn)+'}','\\dfrac{1}{'+(dn*dn*dn*dn)+'}'].join(',\\ ');
  label='буурах';key='id-fr-'+dn;}
 return {
  q:'Дараах дараалал өсөх үү, буурах уу? $'+tex+',\\ \\dots$',
  a:'Гишүүн бүр өмнөхтэйгээ харьцуулахад '+(label==='өсөх'?'их':'бага')+' тул '+label+' дараалал.',
  key:key,
  _c:{type:'incdec',vals:vals,label:label}
 };
}

// Ээлжлэн тэмдэг солих дараалал
var _SIGN=[
 {tex:'n',f:function(i){return i;}},
 {tex:'2n',f:function(i){return 2*i;}},
 {tex:'3n',f:function(i){return 3*i;}},
 {tex:'4n',f:function(i){return 4*i;}},
 {tex:'(n+1)',f:function(i){return i+1;}},
 {tex:'(n+2)',f:function(i){return i+2;}},

 };
}

 var aFull=cols.map(function(c){return '('+c.x+';\\ '+c.y+')';}).join(',\\ ');
 return {
  q:'$y='+linTex(a,b,'x')+'$ томьёогоор хүснэгтийг гүйцээ (зарим $x$, зарим $y$ дутуу). $x='+xrow+'$; $\\ y='+yrow+'$',
  a:'Мэдэгдэх $x$-д $y=ax+b$, мэдэгдэх $y$-д $x=\\dfrac{y-b}{a}$ гэж бодоод бүрэн хүснэгт: $'+aFull+'$.',
  key:'ctp-'+a+'-'+b+'-'+xs.join(','), nv:cols[0].y,
  _c:{type:'bothtable',a:a,b:b,cols:cols}
 };
}

// ════════════ 6.4 Шууд пропорционал хамаарал ════════════

function g_directProportionFormulaTable(){
 var k=pick([1.5,2,2.5,3,4,0.5]);
 var xpool=shuffle([-4,-3,-2,-1,1,2,3,4,6,8]);
 var n=pick([6,7]);
 var xs=xpool.slice(0,n).sort(function(p,q){return p-q;});
 var ys=xs.map(function(x){return k*x;});
 var kt=(k===0.5?'\\dfrac{1}{2}':k===1.5?'\\dfrac{3}{2}':k===2.5?'\\dfrac{5}{2}':''+k);
 var yts=ys.map(function(v){return decStr(v,4);});
 return {
  q:'$y$ нь $x$-тэй шууд пропорционал бөгөөд налалт нь $'+decStr(k,4)+'$. а) $y$-ийг $x$-ээр илэрхийл. б) хүснэгтийг гүйцээ. $x='+seqL(xs)+'$',
  a:'а) $y='+kt+'x$. б) $y='+yts.join(',\\ ')+'$ (харгалзан).',
  key:'dpf-'+k+'-'+xs.join(','), nv:ys[0],
  _c:{type:'dprop',k:k,xs:xs,ys:ys}
 };
}

function g_dpMotionProblem(){
 var v=pick([4,6,50,64]);
 var t=pick([1.5,2,3.5]),t2=pick([2,3,4]);
 // s зорилтот — бүхэл цаг гарахаар
 var th=pick([1.5,2,2.5,3,4.5]);var s=v*th;
 var s1=v*t,s2=v*t2;
 return {
  q:'Машин цагт '+v+' км зам явдаг бол: а) явсан замын томьёог бич. б) '+decStr(t,3)+' цаг ба '+t2+' цагт хэдэн км явах вэ? в) '+s+' км замыг хэдэн цагт явах вэ?',
  a:'а) $s='+v+'t$. б) $s='+v+'\\cdot '+decStr(t,3)+'='+decStr(s1,3)+'$ км ба $s='+v+'\\cdot '+t2+'='+s2+'$ км. в) $t=\\dfrac{'+s+'}{'+v+'}='+decStr(th,3)+'$ цаг.',
  key:'dpm-'+v+'-'+t+'-'+t2+'-'+s, nv:s2,
  _c:{type:'motion',v:v,t:t,t2:t2,s:s,th:th,s1:s1,s2:s2}
 };
}

function g_dpPriceOrTank(){
 var mode=pick(['price','fill','drain']);
 if(mode==='price'){
  var p=1500,m=pick([2.5,3.75,4.25]),M=pick([7500,15000]);
  var cost=p*m,qty=M/p;
  return {
   q:'1 кг будаа '+p+'₮ бол: а) хэмжээ ($x$ кг) ба үнэ ($y$₮)-ийн томьёог бич. б) '+decStr(m,3)+' кг-ийн үнэ хэд вэ? в) '+M+'₮-өөр хэдэн кг авах вэ?',
   a:'а) $y='+p+'x$. б) $y='+p+'\\cdot '+decStr(m,3)+'='+decStr(cost,2)+'$₮. в) $x=\\dfrac{'+M+'}{'+p+'}='+decStr(qty,3)+'$ кг.',
   key:'dpp-price-'+m+'-'+M, nv:cost,
   _c:{type:'price',p:p,m:m,M:M,cost:cost,qty:qty}
  };
 } else if(mode==='fill'){
  var c=4000,r=500,x=pick([6,8,10,12]);
  var V=r*x+c;
  return {
   q:'Усан санд анх '+c+' л ус байсан ба цагт '+r+' л нэмэгдэнэ. а) $x$ цагийн дараах усны хэмжээ $y$-ийн томьёог бич. б) '+x+' цагийн дараа хэдэн литр болох вэ? в) '+V+' л болоход хэдэн цаг зарцуулах вэ?',
   a:'а) $y='+r+'x+'+c+'$. б) $y='+r+'\\cdot '+x+'+'+c+'='+V+'$ л. в) $'+V+'='+r+'x+'+c+'$ тэгшитгэлээс $x='+x+'$ цаг.',
   key:'dpp-fill-'+x, nv:V,
   _c:{type:'fill',c:c,r:r,x:x,V:V}
  };
 } else {
  var V0=pick([9000,15000]),r2=3000,x2=V0/r2;
  return {
   q:V0+' л ус агуулсан сан цагт '+r2+' л сулардаг. а) $x$ цагийн дараах усны хэмжээ $y$-ийн томьёог бич. б) 2 цагийн дараа хэдэн литр үлдэх вэ? в) сан хэдэн цагт бүрэн хоосрох вэ?',
   a:'а) $y='+V0+'-'+r2+'x$. б) $y='+V0+'-'+r2+'\\cdot 2='+(V0-r2*2)+'$ л. в) $0='+V0+'-'+r2+'x$ тэгшитгэлээс $x='+x2+'$ цаг.',
   key:'dpp-drain-'+V0, nv:x2,
   _c:{type:'drain',V0:V0,r2:r2,x2:x2}
  };
 }
}
var WSPEC={"title":"Тоон дараалал ба гишүүн-2","sub":"Тоон дараалал · VI бүлэг · 7-р анги","rule":"<b>Санамж:</b> Тодорхой зүй тогтлоор эрэмбэлэгдсэн тоонуудыг <b>тоон дараалал</b> гээд гишүүдийг нь $a_1,a_2,\\ldots,a_n$ гэж тэмдэглэнэ. Гишүүн бүр өмнөхөөсөө их бол өсөх, бага бол буурах дараалал болно. $(-1)^n$ үржигдэхүүн нь гишүүдийн тэмдгийг ээлжлэн сольдог.","ref":"","tasks":[{"label":"Ээлжлэн тэмдэг солих дарааллын гишүүдийг ол.","fn":"g_signAlternatingTerms","cap":3},{"label":"Зүй тогтлыг олж, дараагийн гишүүдийг бич.","fn":"g_nextTermsRule","cap":4},{"label":"Томьёогоор гишүүнийг ол.","fn":"g_termByFormula","cap":4}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={};for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap){var use=WK?arr.slice(0,cap):arr;return '<div class="grid">'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  TASKS.forEach(function(t,i){html+='<div class="task">'+(i+1)+'. '+t.label+'</div>'+block(S[i],t.cap);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
