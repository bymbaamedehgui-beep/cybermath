<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Босоо өнцөг · огтлолцсон хоёр шулуун</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--orange:#e0701a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:11mm 13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 22px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:11px;text-align:center}
  .sec{font-size:12.5px;font-weight:800;color:#5a32d6;margin:4px 0 8px;display:flex;align-items:center;gap:7px}
  .sec b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;background:var(--purple);color:#fff;font-size:11px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px 12px;margin-bottom:11px}
  .q{break-inside:avoid;page-break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:6px 7px 7px;background:linear-gradient(#fff,#fbf9ff)}
  .qh{font-weight:800;color:var(--purple);font-size:12.5px;margin-bottom:1px}
  .dfig{display:flex;justify-content:center}.dfig svg{width:100%;max-width:180px;height:auto}
  .xline{font-size:12.5px;font-weight:700;margin-top:3px}.xline .bl{display:inline-block;min-width:60px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .wgrid{display:grid;grid-template-columns:1fr;gap:8px}
  .wq{break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:8px 11px;background:linear-gradient(#fff,#fbf9ff);display:flex;gap:9px}
  .wq .wn{font-weight:800;color:var(--purple);min-width:20px;font-size:13px}.wq .wt{font-size:12.7px}.wq .wt .ask{color:#5a32d6;font-weight:700}
  .wans{font-size:12px;font-weight:700;margin-top:5px}.wans .bl{display:inline-block;min-width:150px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:20px}
  .ans-w{margin-top:8px;font-size:12.5px;display:grid;gap:5px}.ans-w .an{color:var(--soft);font-weight:800}
  #answers{display:none}
  .s-line{fill:none;stroke:#2f6cae;stroke-width:2;stroke-linecap:round}
  .s-arc{fill:none;stroke:var(--orange);stroke-width:1.5}
  .s-vtx{fill:#3a2d5e}
  .s-ang{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;font-size:10.5px;fill:#2f6cae}
  .s-x{fill:var(--orange);font-weight:800;font-style:italic;font-family:Georgia,serif;font-size:12.5px}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function PT(V,r,a){return[V[0]+r*Math.cos(a),V[1]+r*Math.sin(a)];}
function sA(deg){return -deg*Math.PI/180;}
function arcBetween(O,dBig,dSmall,r){var a1=sA(dBig),a2=sA(dSmall),p1=PT(O,r,a1),p2=PT(O,r,a2);
  return 'M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A'+r+' '+r+' 0 0 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);}
function labelAt(O,dmid,r,text,isX){var p=PT(O,r,sA(dmid));
  return '<text class="'+(isX?'s-x':'s-ang')+'" x="'+p[0].toFixed(1)+'" y="'+(p[1]+3.5).toFixed(1)+'" text-anchor="middle">'+text+'</text>';}

/* Хоёр огтлолцсон шулуун — 4 муж. labels[4]: ''=алгасах, 'x'=үл мэдэгдэх, эсвэл "52°" */
function drawCross(theta,labels){
  var O=[105,80], L=74, s='<svg viewBox="0 0 210 160" xmlns="http://www.w3.org/2000/svg">';
  var h1=PT(O,90,sA(0)),h2=PT(O,90,sA(180));
  s+='<line class="s-line" x1="'+h2[0].toFixed(1)+'" y1="'+h2[1].toFixed(1)+'" x2="'+h1[0].toFixed(1)+'" y2="'+h1[1].toFixed(1)+'"/>';
  var p1=PT(O,L,sA(theta)),p2=PT(O,L,sA(theta+180));
  s+='<line class="s-line" x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'"/>';
  var bounds=[[theta,0],[180,theta],[180+theta,180],[360,180+theta]]; /* [dBig,dSmall] */
  for(var i=0;i<4;i++){if(labels[i]==='')continue;var r=20,isX=(labels[i]==='x');
    s+='<path class="s-arc" d="'+arcBetween(O,bounds[i][0],bounds[i][1],r)+'"/>';
    var mid=(bounds[i][0]+bounds[i][1])/2;
    s+=labelAt(O,mid,r+11,isX?'x':labels[i],isX);}
  s+='<circle class="s-vtx" cx="'+O[0]+'" cy="'+O[1]+'" r="2.4"/>';
  s+='</svg>';return s;
}
/* Зөвхөн БОСОО (эсрэг орших, тэнцүү) өнцгүүд — хамар (зэргэлдээ) өнцөг оруулахгүй */
function gen(){
  var theta=rnd(35,145), vals=[theta,180-theta,theta,180-theta];
  var diag=pick([[0,2],[1,3]]), gi=diag[0], ui=diag[1];
  if(pick([0,1])){var t=gi;gi=ui;ui=t;}
  var labels=['','','',''];labels[gi]=vals[gi]+'°';labels[ui]='x';
  return {theta:theta,labels:labels,ans:vals[ui],sig:vals[gi]+':'+gi};
}
function wp(){
  var a=rnd(25,155);
  return pick([
    {t:'Хоёр шулуун огтлолцоход үүссэн нэг өнцөг '+a+'°. <span class="ask">Түүнтэй эсрэг орших (босоо) өнцгийг ол.</span>',a:a+'°  (босоо өнцгүүд тэнцүү)'},
    {t:'Огтлолцсон хоёр шулууны нэг босоо өнцөг '+a+'°. <span class="ask">Нөгөө босоо өнцгийг ол.</span>',a:a+'°  (тэнцүү)'},
    {t:'Хоёр шулуун огтлолцов. Эсрэг талын хоёр өнцгийн нэг нь '+a+'°. <span class="ask">Нөгөөг нь ол.</span>',a:a+'°  (босоо өнцгүүд тэнцүү)'}
  ]);
}

function build(){
  var cards='',answ='',items=[],seen={};
  for(var i=0;i<9;i++){
    var g,tr=0;do{g=gen();tr++;}while(seen[g.sig]&&tr<80);seen[g.sig]=1;
    var n=i+1;
    cards+='<div class="q"><div class="qh">'+n+'.</div><div class="dfig">'+drawCross(g.theta,g.labels)+'</div>'
      +'<div class="xline">x =<span class="bl"></span></div></div>';
    answ+='<div class="a"><span class="an">'+n+'.</span><span>x = '+g.ans+'°</span></div>';
    items.push({q:'Босоо өнцөг',a:'x='+g.ans+'°'});
  }
  var W=(function(){var arr=[],s={},t=0;while(arr.length<3&&t<60){var w=wp(),k=w.t.slice(0,16);if(!s[k]){s[k]=1;arr.push(w);}t++;}while(arr.length<3)arr.push(wp());return arr;})();
  var wcards='',wans='';
  for(var j=0;j<W.length;j++){var w=W[j],n2=j+10;
    wcards+='<div class="wq"><div class="wn">'+n2+'.</div><div class="wt">'+w.t+'<div class="wans">Хариу:<span class="bl"></span></div></div></div>';
    wans+='<div><span class="an">'+n2+'.</span> '+w.a+'</div>';
    items.push({q:'Бодлого '+n2,a:w.a});}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Босоо өнцөг 1</h1><div class="sub">Огтлолцсон хоёр шулууны эсрэг орших (босоо) өнцгүүд тэнцүү · x-ийг ол · 6·7-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Огтлолцсон хоёр шулууны <b>эсрэг орших (босоо) өнцгүүд тэнцүү</b> → x = өгөгдсөн өнцөг</div>'
    +'<div class="sec"><b>1</b> Мэдэгдэхгүй байгаа өнцгийг ол</div><div class="dgrid">'+cards+'</div>'
    +'<div class="sec"><b>2</b> Бодлого</div><div class="wgrid">'+wcards+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answ+'</div><div class="ans-w">'+wans+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Босоо өнцөг';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=22"></script>
</body>
</html>
