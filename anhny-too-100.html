<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Анхны тоонууд (1–100)</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#16241c;--soft:#5a7064;--line:#cfe0d6;--forest:#13502e;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:#eceaf3;padding:18px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .btn{font-family:inherit;font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;color:#fff;font-size:.9rem;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn.ghost{background:#fff;color:var(--purple);box-shadow:inset 0 0 0 1.5px #d8ccff}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.9rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:16mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:21px;color:#5a32d6;font-weight:800}.head .sub{font-size:12px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12.5px;margin:8px 2px 14px}.meta span{border-bottom:1px dotted #9bb3a6;padding:0 36px 2px 4px}
  .rule{font-size:12.5px;color:#8a5a00;background:#fff7e6;border:1px solid #f3dca6;border-radius:10px;padding:10px 14px;margin-bottom:16px}
  .rule b{color:#7a4f00}
  .num-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:560px;margin:0 auto}
  .cell{aspect-ratio:1;display:grid;place-items:center;border:1.5px solid #e3ddf2;border-radius:8px;font-weight:700;font-size:16px;color:var(--ink)}
  .cell.one{color:#b9b9c8;border-style:dashed}
  .show .cell.prime{background:#e1f4e9;border-color:#9adcb6;color:#0b6b2e}
  .show .cell.one{background:#f3f3f6;text-decoration:line-through}
  .list{margin-top:16px;font-size:12.5px;display:none}
  .show .list{display:block}
  .list b{color:#5a32d6}
  .legend{display:flex;gap:16px;justify-content:center;font-size:11.5px;color:var(--soft);margin-top:12px}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:14mm}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Анхны тоог тодруулах (хариу)</label>
</div>
<div class="sheet" id="sheet">
  <div class="head"><h1>Анхны тоонууд — 1-ээс 100</h1><div class="sub">Эратосфенийн шигшүүрээр анхны тоонуудыг ол</div></div>
  <div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Анги: </span></div>
  <div class="rule">
    <b>Анхны тоо</b> гэдэг нь зөвхөн <b>1 ба өөртөө</b> хуваагддаг тоо. <br>
    <b>Шигшүүр:</b> ① 1-ийг хас (анхны биш). ② 2-ыг үлдээгээд бусад 2-ын үржвэрийг хас. ③ 3, 5, 7-той ижил үйлд. ④ Үлдсэн нь анхны тоонууд.
  </div>
  <div class="num-grid" id="grid"></div>
  <div class="legend"><span><i style="background:#e1f4e9;border:1px solid #9adcb6"></i>Анхны тоо</span><span><i style="background:#f3f3f6;border:1px dashed #ccc"></i>Анхны биш / 1</span></div>
  <div class="list" id="list"></div>
</div>
<script>
function isPrime(n){if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function toggleAns(){document.getElementById('sheet').classList.toggle('show',document.getElementById('sa').checked);}
var primes=[];
var g='';
for(var n=1;n<=100;n++){
  var p=isPrime(n);if(p)primes.push(n);
  g+='<div class="cell '+(n===1?'one':(p?'prime':''))+'">'+n+'</div>';
}
document.getElementById('grid').innerHTML=g;
document.getElementById('list').innerHTML='<b>1–100 хүртэлх анхны тоонууд ('+primes.length+' ширхэг):</b><br>'+primes.join(', ');
window.WS_ITEMS=[{q:'1\\text{–}100 \\text{ хүртэлх анхны тоонууд}',a:'\\text{'+primes.join(', ')+'}'}];
window.WS_TITLE='Анхны тоонууд 1–100';
</script>
<script src="/ws-store.js?v=35"></script>
</body>
</html>
