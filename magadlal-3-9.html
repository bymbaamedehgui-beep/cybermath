<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Магадлал-3 (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:6px 0 9px;border-left:4px solid var(--purple2);padding-left:9px}
  .prob{break-inside:avoid;page-break-inside:avoid;margin-bottom:12px}
  .pq{font-size:13px;margin-bottom:5px}.pn{font-weight:800;color:var(--purple);margin-right:6px}
  .ptree{margin:6px 0 4px 18px}
  .pw{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:15mm}
  .sols-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.sols-page h2{font-size:16px;color:#5a32d6;margin-bottom:12px}
  .sol{break-inside:avoid;page-break-inside:avoid;margin-bottom:11px;padding-bottom:8px;border-bottom:1px dashed #ece7fb}
  .sol .sq{font-size:12px;color:#42395e;margin-bottom:4px}.sol .sn{font-weight:800;color:var(--purple);margin-right:6px}
  .step{font-size:13px;margin:3px 0 3px 20px;color:#241a3d}
  .res{font-size:13px;font-weight:800;color:var(--green);margin:4px 0 0 20px}
  #solutions{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.sols-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="ss" onchange="toggleSol()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function fr(p,q){if(p===0)return {p:0,q:1};var g=gcd(p,q);return {p:p/g,q:q/g};}
function frT(f){return f.q===1?(''+f.p):('\\dfrac{'+f.p+'}{'+f.q+'}');}
function toggleSol(){var el=document.getElementById('solutions');if(el)el.style.display=document.getElementById('ss').checked?'block':'none';}
function step(t){return '<div class="step">'+t+'</div>';}
function res(t){return '<div class="res">Хариу: '+t+'</div>';}
// Хамааралтай модны схем (салаа тус бүр өөр магадлалтай)
function tree(s1,s2t,s2b,leaves,filled){
  function ln(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#b3a9d6" stroke-width="1.4"/>';}
  function tx(x,y,t,col,an){return '<text x="'+x+'" y="'+y+'" font-size="10.5" fill="'+col+'"'+(an?' text-anchor="'+an+'"':'')+'>'+t+'</text>';}
  var s='<svg viewBox="0 0 470 156" width="100%" style="max-width:440px" xmlns="http://www.w3.org/2000/svg">';
  s+='<circle cx="24" cy="76" r="3" fill="#7B52EE"/>';
  s+=ln(24,76,150,38)+ln(24,76,150,114)+ln(150,38,300,20)+ln(150,38,300,56)+ln(150,114,300,96)+ln(150,114,300,132);
  var bl=function(x,y){return '<line x1="'+x+'" y1="'+y+'" x2="'+(x+26)+'" y2="'+y+'" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="2.5 2"/>';};
  if(filled){s+=tx(70,46,s1[0][1],'#7B52EE')+tx(70,100,s1[1][1],'#7B52EE')+tx(210,22,s2t[0][1],'#A855F7')+tx(210,50,s2t[1][1],'#A855F7')+tx(210,98,s2b[0][1],'#A855F7')+tx(210,126,s2b[1][1],'#A855F7');}
  else{s+=bl(70,48)+bl(70,102)+bl(210,24)+bl(210,52)+bl(210,100)+bl(210,128);}
  s+=tx(150,32,s1[0][0],'#5a32d6','middle')+tx(150,128,s1[1][0],'#5a32d6','middle');
  s+=tx(308,24,leaves[0],'#241a3d')+tx(308,60,leaves[1],'#241a3d')+tx(308,100,leaves[2],'#241a3d')+tx(308,136,leaves[3],'#241a3d');
  s+='</svg>';return '<div class="ptree">'+s+'</div>';}
function noRepTree(r,b,n,filled){return tree(
  [['У',r+'/'+n],['Б',b+'/'+n]],
  [['У',(r-1)+'/'+(n-1)],['Б',b+'/'+(n-1)]],
  [['У',r+'/'+(n-1)],['Б',(b-1)+'/'+(n-1)]],
  ['УУ','УБ','БУ','ББ'],filled);}
// A) Хоёулаа улаан (буцаалтгүй)
function gBothRed(){var r=rnd(2,6),b=rnd(2,6),n=r+b,num=r*(r-1),den=n*(n-1),f=fr(num,den);
  return {q:'$'+r+'$ улаан, $'+b+'$ бусад бөмбөгнөөс нэгийг авч буцааж хийлгүйгээр дахин нэгийг авав. Хоёулаа улаан байх магадлалыг ол.',treeB:noRepTree(r,b,n,false),treeF:noRepTree(r,b,n,true),
    sol:step('Хоёр дахь авалтад бөмбөг $'+(n-1)+'$ үлдэнэ: $P=\\dfrac{'+r+'}{'+n+'}\\times\\dfrac{'+(r-1)+'}{'+(n-1)+'}=\\dfrac{'+num+'}{'+den+'}'+(f.q!==den?'='+frT(f):'')+'$')+res('$'+frT(f)+'$')};}
// B) Яг нэг улаан (буцаалтгүй)
function gOneRed(){var r=rnd(2,6),b=rnd(2,6),n=r+b,num=2*r*b,den=n*(n-1),f=fr(num,den);
  return {q:'$'+r+'$ улаан, $'+b+'$ бусад бөмбөгнөөс буцааж хийлгүйгээр дараалан хоёрыг авав. Яг нэг нь улаан байх магадлалыг ол.',treeB:noRepTree(r,b,n,false),treeF:noRepTree(r,b,n,true),
    sol:step('Таатай: УБ ба БУ')+step('$P=\\dfrac{'+r+'}{'+n+'}\\times\\dfrac{'+b+'}{'+(n-1)+'}+\\dfrac{'+b+'}{'+n+'}\\times\\dfrac{'+r+'}{'+(n-1)+'}=\\dfrac{'+num+'}{'+den+'}'+(f.q!==den?'='+frT(f):'')+'$')+res('$'+frT(f)+'$')};}
// C) Хоёулаа бусад (буцаалтгүй)
function gBothOther(){var r=rnd(2,6),b=rnd(3,7),n=r+b,num=b*(b-1),den=n*(n-1),f=fr(num,den);
  return {q:'$'+r+'$ улаан, $'+b+'$ бусад бөмбөгнөөс буцааж хийлгүйгээр хоёрыг авав. Хоёулаа бусад өнгө байх магадлалыг ол.',treeB:noRepTree(r,b,n,false),treeF:noRepTree(r,b,n,true),
    sol:step('$P=\\dfrac{'+b+'}{'+n+'}\\times\\dfrac{'+(b-1)+'}{'+(n-1)+'}=\\dfrac{'+num+'}{'+den+'}'+(f.q!==den?'='+frT(f):'')+'$')+res('$'+frT(f)+'$')};}
function build(){
  var probs=[],seen={};
  function add(fn,cnt){var c=0,tr=0;while(c<cnt&&tr<400){tr++;var f=fn();if(!f||seen[f.q])continue;seen[f.q]=1;probs.push(f);c++;}}
  add(gBothRed,2);add(gOneRed,2);add(gBothOther,2);
  var pHtml=probs.map(function(p,i){return '<div class="prob"><div class="pq"><span class="pn">'+(i+1)+'.</span>'+p.q+'</div>'+(p.treeB||'')+'<div class="pw"></div></div>';}).join('');
  var sHtml=probs.map(function(p,i){return '<div class="sol"><div class="sq"><span class="sn">'+(i+1)+'.</span>'+p.q+'</div>'+(p.treeF||'')+p.sol+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Модны схем — буцаалтгүй авалт</h1><div class="sub">Хамааралтай үзэгдэл · хоёр дахь авалтад тоо багасна · салаа үржих, нэмэх · 9-р анги · 3.1</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Буцааж хийхгүй бол хоёр дахь авалтад нийт тоо ба авсан өнгийн тоо <b>нэгээр багасна</b>. Модны схемийн салаа дагуу үржүүлж, таатай салаануудыг нэмнэ.</div>'
    +'<div class="task">Модны схемийг ашиглан бод. (Бодолтоо доор бич)</div>'+pHtml
    +'<div class="sols-page" id="solutions"><h2>Бодолт ба хариу</h2>'+sHtml+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Магадлал-3';
  toggleSol();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=38"></script>
</body>
</html>
