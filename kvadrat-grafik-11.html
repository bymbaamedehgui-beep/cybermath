<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат тэгшитгэл — график байгуулах ба графикаар бодох (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:17px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .col1{display:grid;grid-template-columns:1fr;gap:10px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:13.5px}
  .qfig{display:flex;gap:12px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .vt{border-collapse:collapse;font-size:11px}.vt th,.vt td{border:1px solid #d9cff5;padding:2px 6px;text-align:center;min-width:20px;height:17px}.vt th{background:#f3eefe;color:#5a32d6;font-weight:800}.vt td.blank{background:#fbfaff}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:16mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:7px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:28px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function quadStr(b,c){var t='x^2';if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
function qsa(a,b,c){var t=(a===1?'x^2':a===-1?'-x^2':a+'x^2');if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
function valTable(xs,ys,show){var xh='<tr><th>$x$</th>'+xs.map(function(x){return '<td>$'+x+'$</td>';}).join('')+'</tr>';
  var yh='<tr><th>$y$</th>'+xs.map(function(x,i){return show?'<td>$'+ys[i]+'$</td>':'<td class="blank"></td>';}).join('')+'</tr>';
  return '<table class="vt">'+xh+yh+'</table>';}
function labeledGrid(x0,x1,y0,y1){var u=11,mL=20,mT=8,PW=(x1-x0)*u,PH=(y1-y0)*u;
  function px(x){return mL+(x-x0)*u;}function py(y){return mT+(y1-y)*u;}
  var W=mL+PW+8,H=mT+PH+14,g='';
  for(var i=Math.ceil(x0);i<=Math.floor(x1);i++)g+='<line x1="'+px(i).toFixed(1)+'" y1="'+mT+'" x2="'+px(i).toFixed(1)+'" y2="'+(mT+PH)+'" stroke="#ede9fa" stroke-width="0.5"/>';
  for(var j=Math.ceil(y0);j<=Math.floor(y1);j++)g+='<line x1="'+mL+'" y1="'+py(j).toFixed(1)+'" x2="'+(mL+PW)+'" y2="'+py(j).toFixed(1)+'" stroke="#ede9fa" stroke-width="0.5"/>';
  var axY=py(0),axX=px(0);
  g+='<line x1="'+mL+'" y1="'+axY.toFixed(1)+'" x2="'+(mL+PW)+'" y2="'+axY.toFixed(1)+'" stroke="#555" stroke-width="1"/><line x1="'+axX.toFixed(1)+'" y1="'+mT+'" x2="'+axX.toFixed(1)+'" y2="'+(mT+PH)+'" stroke="#555" stroke-width="1"/>';
  for(var t2=Math.ceil(x0);t2<=Math.floor(x1);t2++){if(t2===0||t2%2)continue;g+='<text x="'+(px(t2)-3).toFixed(1)+'" y="'+(axY+9).toFixed(1)+'" font-size="7.5" fill="#8a80b0">'+t2+'</text>';}
  var yst=(y1-y0>13)?2:1;for(var s2=Math.ceil(y0);s2<=Math.floor(y1);s2++){if(s2===0||s2%yst)continue;g+='<text x="'+(axX-13).toFixed(1)+'" y="'+(py(s2)+3).toFixed(1)+'" font-size="7.5" fill="#8a80b0">'+s2+'</text>';}
  g+='<text x="'+(axX+3).toFixed(1)+'" y="'+(mT+7)+'" font-size="9" fill="#555" font-weight="700">y</text><text x="'+(mL+PW-6)+'" y="'+(axY-3).toFixed(1)+'" font-size="9" fill="#555" font-weight="700">x</text>';
  return '<svg width="'+W.toFixed(0)+'" height="'+H.toFixed(0)+'" viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" style="flex-shrink:0">'+g+'</svg>';}
function parabolaPlot(r1,r2){var lo=Math.min(r1,r2),hi=Math.max(r1,r2),vy=-(hi-lo)*(hi-lo)/4;
  var x0=lo-2,x1=hi+2,y0=Math.floor(vy)-1,y1=Math.max(4,y0+Math.ceil(x1-x0));
  var u=11,mL=18,mT=8,PW=(x1-x0)*u,PH=(y1-y0)*u;
  function px(x){return mL+(x-x0)*u;}function py(y){return mT+(y1-y)*u;}
  var W=mL+PW+8,H=mT+PH+12,g='';
  for(var i=Math.ceil(x0);i<=Math.floor(x1);i++)g+='<line x1="'+px(i).toFixed(1)+'" y1="'+mT+'" x2="'+px(i).toFixed(1)+'" y2="'+(mT+PH)+'" stroke="#ede9fa" stroke-width="0.5"/>';
  for(var j=Math.ceil(y0);j<=Math.floor(y1);j++)g+='<line x1="'+mL+'" y1="'+py(j).toFixed(1)+'" x2="'+(mL+PW)+'" y2="'+py(j).toFixed(1)+'" stroke="#ede9fa" stroke-width="0.5"/>';
  if(y0<=0&&y1>=0)g+='<line x1="'+mL+'" y1="'+py(0).toFixed(1)+'" x2="'+(mL+PW)+'" y2="'+py(0).toFixed(1)+'" stroke="#555" stroke-width="1"/>';
  if(x0<=0&&x1>=0)g+='<line x1="'+px(0).toFixed(1)+'" y1="'+mT+'" x2="'+px(0).toFixed(1)+'" y2="'+(mT+PH)+'" stroke="#555" stroke-width="1"/>';
  var pts='';for(var x=x0;x<=x1+0.001;x+=(x1-x0)/70){var y=(x-r1)*(x-r2);if(y<y0-0.3||y>y1+0.3)continue;pts+=px(x).toFixed(1)+','+py(y).toFixed(1)+' ';}
  g+='<polyline points="'+pts+'" fill="none" stroke="#7B52EE" stroke-width="1.7"/>';
  for(var t=Math.ceil(x0);t<=Math.floor(x1);t++){if(t===0)continue;g+='<text x="'+(px(t)-2).toFixed(1)+'" y="'+(py(0)+9).toFixed(1)+'" font-size="7.5" fill="#8a80b0">'+t+'</text>';}
  return '<svg width="'+W.toFixed(0)+'" height="'+H.toFixed(0)+'" viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" style="flex-shrink:0">'+g+'</svg>';}
// 1. Хүснэгт нөхөж, параболыг байгуул
function g_build(){for(var t=0;t<300;t++){var r1=nz(-4,4),r2=nz(-4,4);if(r1===r2)continue;if(Math.abs(r1-r2)>5)continue;var b=-(r1+r2),c=r1*r2,xv=(r1+r2)/2,m=-(r1-r2)*(r1-r2)/4;
  var st=Math.round(xv)-3,xs=[],ys=[];for(var x=st;x<=st+6;x++){xs.push(x);ys.push(x*x+b*x+c);}
  return {q:'$y='+quadStr(b,c)+'$',tbl:valTable(xs,ys,false),grid:labeledGrid(-6,6,Math.min(m-1,-2),8),a:'$y:\\ '+ys.join(',\\ ')+'$; язгуур $x='+Math.min(r1,r2)+',\\ '+Math.max(r1,r2)+'$; орой $('+xv+';\\ '+m+')$',ok:true};}return null;}
// 2. Графикийг ашиглан тэгшитгэлийн шийдийг ол
function g_read(){for(var t=0;t<300;t++){var r1=nz(-5,5),r2=nz(-5,5);if(r1===r2)continue;if(Math.abs(r1-r2)>6)continue;var b=-(r1+r2),c=r1*r2;
  return {q:'Зурагт үзүүлсэн $y='+quadStr(b,c)+'$ параболыг ашиглан $'+quadStr(b,c)+'=0$ тэгшитгэлийн шийдийг ол.',fig:parabolaPlot(r1,r2),a:'$Ox$-тэй огтлолцлын цэгүүд: $x_1='+Math.min(r1,r2)+',\\ x_2='+Math.max(r1,r2)+'$',ok:true};}return null;}
// 3. Орой, тэнхлэг, Ox огтлолын тоо
function g_vertex(){var a=pick([1,1,2]),xv=nz(-3,3),m=nz(-6,6),b=-2*a*xv,c=a*xv*xv+m,cnt=(a>0)?(m<0?2:m===0?1:0):(m>0?2:m===0?1:0);
  return {q:'$y='+qsa(a,b,c)+'$ параболын орой, тэгш хэмийн тэнхлэг, $Ox$-тэй огтлолцох цэгийн тоог ол.',a:'орой $('+xv+';\\ '+m+')$, тэнхлэг $x='+xv+'$, $Ox$ огтлол: '+cnt+' цэг',ok:true};}
function gen(fn){for(var t=0;t<400;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т','у','ү'];
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid,.col1'),map={};
  for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<80){var blocks=sheet.querySelectorAll('.grid,.col1'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>1){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var P=[[],[],[]];var seen={};
  function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<4000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;P[idx].push(f);c++;}}
  fill(0,g_build,2);fill(1,g_read,2);fill(2,g_vertex,4);return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function build1(arr){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div><div class="qfig">'+f.tbl+f.grid+'</div></div>';}).join('');}
  function build2(arr){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div><div class="qfig">'+f.fig+'</div></div>';}).join('');}
  function build3(arr){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div></div>';}).join('');}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>'+p.f.a+'</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадрат тэгшитгэл — график байгуулах ба графикаар бодох</h1><div class="sub">Хүснэгт · парабол · $Ox$-тэй огтлол · орой · 11-р анги · I бүлэг 1.1</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">$y=ax^2+bx+c$ параболын $Ox$ тэнхлэгтэй огтлолцох цэгийн абсцисс нь $ax^2+bx+c=0$ тэгшитгэлийн шийд юм.</div>'
    +'<div class="task">1. Хүснэгтийг гүйцээж, $y$-ийг тооцоол, параболыг координатын хавтгайд байгуул.</div><div class="col1">'+build1(S[0])+'</div>'
    +'<div class="task">2. Зурагт өгсөн параболыг ашиглан тэгшитгэлийн шийдийг ол.</div><div class="grid">'+build2(S[1])+'</div>'
    +'<div class="task">3. Параболын орой, тэгш хэмийн тэнхлэг, $Ox$-тэй огтлолын тоог ол.</div><div class="col1">'+build3(S[2])+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Квадрат тэгшитгэл — график байгуулах ба графикаар бодох';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
