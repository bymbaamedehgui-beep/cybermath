<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VII бүлэг — Жишиг даалгавар 1 (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.packed{display:flex;gap:20px;align-items:flex-start}
  .grid.packed .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:11px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:13px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.sm{height:13mm}
  .dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
  .dcard{break-inside:avoid;page-break-inside:avoid;border:1px solid #eee7fb;border-radius:9px;padding:6px 7px;background:linear-gradient(#fff,#fcfbff)}
  .dcard .dq{font-size:10.5px;margin-bottom:2px;min-height:15px}.dcard .dq b{color:var(--purple)}
  .dsvg{width:100%;height:auto;display:block}
  .aline{margin-top:3px;font-size:10.5px;color:var(--soft);text-align:center}.aline b{color:var(--ink);border-bottom:1px solid #cdbff0;padding:0 16px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function fr(p,q){if(q<0){p=-p;q=-q;}var g=gcd(p,q)||1;return{p:p/g,q:q/g};}
function frTex(f){if(f.q===1)return ''+f.p;return (f.p<0?'-':'')+'\\dfrac{'+Math.abs(f.p)+'}{'+f.q+'}';}
function surdR(n,d,root){var g=gcd(n,d)||1;n/=g;d/=g;var co=(d===1?(n===1?'':''+n):'\\dfrac{'+n+'}{'+d+'}');return co+'\\sqrt{'+root+'}';}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function heronS(a,b,c){var s=(a+b+c)/2;return Math.round(Math.sqrt(s*(s-a)*(s-b)*(s-c)));}
var RIGHT=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[20,21,29],[10,24,26]];
var HERON=[[5,5,6],[13,14,15],[9,10,17],[11,13,20],[10,13,13]];
// 7.1 багтсан ба төв өнцөг
function g1(){var al=rnd(20,72);return {q:'Төв өнцөг $\\angle AOB='+(2*al)+'^\\circ$ бол багтсан $\\angle APB=?$',a:'$'+al+'^\\circ$',ok:true};}
// 7.1 диаметрт багтсан
function g2(){var al=rnd(16,74);return {q:'$AB$ диаметр, $\\angle CAB='+al+'^\\circ$ бол $\\angle ABC=?$',a:'$'+(90-al)+'^\\circ$',ok:true};}
// 7.1 багтсан дөрвөн өнцөгт
function g3(){var a=rnd(65,120);return {q:'Багтсан $ABCD$-д $\\angle A='+a+'^\\circ$ бол $\\angle C=?$',a:'$'+(180-a)+'^\\circ$',ok:true};}
// 7.2 гурвалжинд багтсан тойрог
function g4(){if(rnd(0,1)){var t=pick(RIGHT),r=(t[0]+t[1]-t[2])/2;return {q:'Тэгш өнцөгт катет $'+t[0]+',\\ '+t[1]+'$ бол багтсан тойргийн $r=?$',a:'$'+r+'$',ok:true};}
  var h=pick(HERON),S=heronS(h[0],h[1],h[2]);return {q:'Талууд $'+h[0]+',\\ '+h[1]+',\\ '+h[2]+'$ бол багтсан тойргийн $r=?$',a:'$'+frTex(fr(2*S,h[0]+h[1]+h[2]))+'$',ok:true};}
// 7.2 гурвалжныг багтаасан тойрог
function g5(){if(rnd(0,1)){var t=pick(RIGHT);return {q:'Тэгш өнцөгт гипотенуз $'+t[2]+'$ бол багтаасан тойргийн $R=?$',a:'$'+frTex(fr(t[2],2))+'$',ok:true};}
  var a=pick([3,6,9,12]);return {q:'Адил талт, тал $'+a+'$ бол багтаасан тойргийн $R=?$',a:'$'+surdR(a,3,3)+'$',ok:true};}
// 7.2 зөв олон өнцөгт
function g6(){if(rnd(0,1)){var n=pick([5,6,8,9,10,12]);return {q:'Зөв $'+n+'$ өнцөгтийн дотоод өнцөг $=?$',a:'$'+((n-2)*180/n)+'^\\circ$',ok:true};}
  var R=pick([2,3,4,5,6]);return {q:'$R='+R+'$ тойрогт багтсан зөв 6 өнцөгтийн тал $=?$',a:'$'+R+'$',ok:true};}
// ── Диаграм engine ──
var CX=64,CY=59,CR=45,VB=132;
function pt(deg){var r=deg*Math.PI/180;return [CX+CR*Math.cos(r),CY-CR*Math.sin(r)];}
function seg(a,b,col,w){return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+(col||'#7B52EE')+'" stroke-width="'+(w||1.4)+'"/>';}
function dt(p,col){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="1.7" fill="'+(col||'#7B52EE')+'"/>';}
function plab(p,deg,s){var r=deg*Math.PI/180,lx=CX+(CR+9)*Math.cos(r),ly=CY-(CR+9)*Math.sin(r);return '<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" font-size="9" fill="#1a1030" text-anchor="middle" font-weight="700">'+s+'</text>';}
function amk(v,pa,pb,rr,s,col){function a(p){return Math.atan2(p[1]-v[1],p[0]-v[0]);}var A1=a(pa),A2=a(pb),d=A2-A1;while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;var sw=d>0?1:0,S=[v[0]+rr*Math.cos(A1),v[1]+rr*Math.sin(A1)],E=[v[0]+rr*Math.cos(A2),v[1]+rr*Math.sin(A2)],mid=A1+d/2,lp=[v[0]+(rr+9)*Math.cos(mid),v[1]+(rr+9)*Math.sin(mid)];return '<path d="M'+S[0].toFixed(1)+' '+S[1].toFixed(1)+' A '+rr+' '+rr+' 0 0 '+sw+' '+E[0].toFixed(1)+' '+E[1].toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="1.3"/><text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3).toFixed(1)+'" font-size="8" fill="'+col+'" text-anchor="middle" font-weight="800">'+s+'</text>';}
function csvg(g){return '<svg class="dsvg" viewBox="0 0 '+VB+' '+VB+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';}
// багтсан ба төв өнцөг
function figInsc(){var al=rnd(20,70),theta=2*al,dA=rnd(15,70),dB=dA+theta,dP=dB+Math.round((360-theta)/2),A=pt(dA),B=pt(dB),P=pt(dP),O=[CX,CY];
  var g='<circle cx="'+CX+'" cy="'+CY+'" r="'+CR+'" fill="none" stroke="#4a4470" stroke-width="1.3"/>'+seg(O,A,'#9a94b5',1.1)+seg(O,B,'#9a94b5',1.1)+seg(P,A)+seg(P,B)+amk(O,A,B,14,theta+'&#176;','#2563eb')+amk(P,A,B,13,'?','#c2451f')+dt(A)+dt(B)+dt(P)+dt(O,'#4a4470')+plab(A,dA,'A')+plab(B,dB,'B')+plab(P,dP,'P')+'<text x="'+(CX-3)+'" y="'+(CY+10)+'" font-size="8" fill="#4a4470" font-style="italic">O</text>';
  return {svg:csvg(g),q:'Төв $\\angle AOB='+theta+'^\\circ$. Багтсан $\\angle APB=?$',a:'$'+al+'^\\circ$',key:'in'+theta+'-'+dA,ok:true};}
// гурвалжин + дотоод/гадаад тойрог
function triLayout(a,b,c){var Ax=(c*c-b*b+a*a)/(2*a),Ay=Math.sqrt(Math.max(0,c*c-Ax*Ax));return {A:[Ax,Ay],B:[0,0],C:[a,0]};}
function incenter(A,B,C,a,b,c){var P=a+b+c;return [(a*A[0]+b*B[0]+c*C[0])/P,(a*A[1]+b*B[1]+c*C[1])/P];}
function circumc(A,B,C){var ax=A[0],ay=A[1],bx=B[0],by=B[1],cx=C[0],cy=C[1],d=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));return [((ax*ax+ay*ay)*(by-cy)+(bx*bx+by*by)*(cy-ay)+(cx*cx+cy*cy)*(ay-by))/d,((ax*ax+ay*ay)*(cx-bx)+(bx*bx+by*by)*(ax-cx)+(cx*cx+cy*cy)*(bx-ax))/d];}
function drawTri(a,b,c,mode){var P=16,L=triLayout(a,b,c),A=L.A,B=L.B,C=L.C,s=(a+b+c)/2,area=Math.sqrt(s*(s-a)*(s-b)*(s-c)),cen,rad;
  if(mode==='in'){cen=incenter(A,B,C,a,b,c);rad=area/s;}else{cen=circumc(A,B,C);rad=a*b*c/(4*area);}
  var xs=[A[0],B[0],C[0],cen[0]-rad,cen[0]+rad],ys=[A[1],B[1],C[1],cen[1]-rad,cen[1]+rad],minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys),W=maxx-minx,H=maxy-miny,sc=Math.min((VB-2*P)/W,(VB-2*P)/H),ex=(VB-2*P-W*sc)/2,ey=(VB-2*P-H*sc)/2;
  function T(p){return [P+ex+(p[0]-minx)*sc,P+ey+(maxy-p[1])*sc];}
  var Ap=T(A),Bp=T(B),Cp=T(C),Op=T(cen),TC=T([(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3]);
  function sl(Pa,Q,tx){var mx=(Pa[0]+Q[0])/2,my=(Pa[1]+Q[1])/2,dx=mx-TC[0],dy=my-TC[1],Ln=Math.hypot(dx,dy)||1;return '<text x="'+(mx+dx/Ln*8).toFixed(1)+'" y="'+(my+dy/Ln*8+2).toFixed(1)+'" font-size="8.5" fill="#c2451f" text-anchor="middle" font-weight="700">'+tx+'</text>';}
  var col=(mode==='in'?'#7B52EE':'#16a34a');
  var g='<circle cx="'+Op[0].toFixed(1)+'" cy="'+Op[1].toFixed(1)+'" r="'+(rad*sc).toFixed(1)+'" fill="'+(mode==='in'?'rgba(123,82,238,0.08)':'none')+'" stroke="'+col+'" stroke-width="1.3"/>';
  g+='<path d="M'+Ap[0].toFixed(1)+' '+Ap[1].toFixed(1)+' L'+Bp[0].toFixed(1)+' '+Bp[1].toFixed(1)+' L'+Cp[0].toFixed(1)+' '+Cp[1].toFixed(1)+' Z" fill="none" stroke="#1a1030" stroke-width="1.5"/>'+dt(Op,col)+sl(Bp,Cp,''+a)+sl(Cp,Ap,''+b)+sl(Ap,Bp,''+c);
  return csvg(g);}
function figIn(){var t=pick(RIGHT.concat([[5,5,6],[13,14,15],[9,10,17]])),a=t[0],b=t[1],c=t[2],S=heronS(a,b,c);
  return {svg:drawTri(a,b,c,'in'),q:'Багтсан тойргийн радиус $r=?$',a:'$'+frTex(fr(2*S,a+b+c))+'$',key:'ti'+a+'-'+b+'-'+c,ok:true};}
function figOut(){var t=pick(RIGHT.concat([[5,5,6],[13,14,15]])),a=t[0],b=t[1],c=t[2],S=heronS(a,b,c);
  return {svg:drawTri(a,b,c,'out'),q:'Багтаасан тойргийн радиус $R=?$',a:'$'+frTex(fr(a*b*c,4*S))+'$',key:'to'+a+'-'+b+'-'+c,ok:true};}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var i=1;[].forEach.call(sheet.querySelectorAll('.dcard .dn'),function(el){el.textContent=(i++)+'.';});[].forEach.call(sheet.querySelectorAll('.grid .q'),function(q){var el=q.querySelector('.ql');if(el)el.textContent=(i++)+'.';});var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var e2=as[j].querySelector('.an');if(e2)e2.textContent=(j+1)+'.';}}
function trimToFitBalanced(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<400){var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>3){bestN=n;best=s;}}if(best<0)break;var qs=grids[best].querySelectorAll('.q'),last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function packColumns(sheet){[].forEach.call(sheet.querySelectorAll('.grid'),function(g){if(g.classList.contains('packed'))return;var qs=[].slice.call(g.children).filter(function(c){return c.classList&&c.classList.contains('q');});if(qs.length<2)return;var half=Math.ceil(qs.length/2),c1=document.createElement('div'),c2=document.createElement('div');c1.className='col';c2.className='col';qs.forEach(function(q,i){(i<half?c1:c2).appendChild(q);});g.appendChild(c1);g.appendChild(c2);g.classList.add('packed');});}
function build(){
  var WORK=!!window.WS_WORK;
  var S=[[],[],[],[],[],[]],D=[],seen={};window.__PROB=[];
  function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<2000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;S[idx].push(f);c++;}}
  var dfns=[figInsc,figIn,figOut],dtr=0;while(D.length<3&&dtr++<400){var df=dfns[D.length]();if(!df||seen[df.key])continue;seen[df.key]=1;D.push(df);}
  var per=WORK?4:6;
  fill(0,g1,per);fill(1,g2,per);fill(2,g3,per);fill(3,g4,per);fill(4,g5,per);fill(5,g6,per);
  var K=0;
  function block(arr){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'"><div class="qeq"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(WORK?'<div class="work sm"></div>':'')+'</div>';}).join('');}
  function dblock(arr){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="dcard"><div class="dq"><b class="dn"></b> '+f.q+'</div>'+f.svg+'<div class="aline">Хариу: <b>&nbsp;</b></div></div>';}).join('');}
  var bd=dblock(D);
  var b=[block(S[0]),block(S[1]),block(S[2]),block(S[3]),block(S[4]),block(S[5])];
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>'+p.f.a+'</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>VII бүлэг — Жишиг даалгавар 1</h1><div class="sub">Тойрогт багтсан өнцөг · багтсан ба багтаасан тойргийн радиус · зөв олон өнцөгт · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Багтсан өнцөг $=\\tfrac12$ төв өнцөг · диаметрт багтсан $=90^\\circ$ · багтсан 4 өнцөгтийн эсрэг өнцөг $180^\\circ$ · $r=\\tfrac{2S}{a+b+c}$ · $R=\\tfrac{abc}{4S}$</div>'
    +'<div class="task">1. Зурагт бодлого: багтсан өнцөг, багтсан ба багтаасан тойргийн радиус.</div><div class="dgrid">'+bd+'</div>'
    +'<div class="task">2. Төв өнцгөөр багтсан өнцгийг ол.</div><div class="grid">'+b[0]+'</div>'
    +'<div class="task">3. Диаметрт багтсан өнцгийг ашиглан ол.</div><div class="grid">'+b[1]+'</div>'
    +'<div class="task">4. Багтсан дөрвөн өнцөгтийн эсрэг өнцгийг ол.</div><div class="grid">'+b[2]+'</div>'
    +'<div class="task">5. Гурвалжинд багтсан тойргийн радиусыг ол.</div><div class="grid">'+b[3]+'</div>'
    +'<div class="task">6. Гурвалжныг багтаасан тойргийн радиусыг ол.</div><div class="grid">'+b[4]+'</div>'
    +'<div class="task">7. Зөв олон өнцөгтийн өнцөг/талыг ол.</div><div class="grid">'+b[5]+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
