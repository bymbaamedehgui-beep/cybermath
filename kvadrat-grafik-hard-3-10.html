<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Парабол, шулуун ба талбай — хүнд (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:30mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
// ══════════ g10core.js — 10-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ 10-р анги · V БҮЛЭГ (ФУНКЦ БА ГРАФИК) — ЗӨВХӨН ХҮНД ТҮВШИН ══════════
// g10core.js-ийн ард залгагдана. Бүх генератор {q,a,key,fig?,nv?,_v?} буцаана.

// ──────────── Ерөнхий туслахууд ────────────
function I(n){return Fr(n,1);}
function absFr(f){return Fr(Math.abs(f.n),f.d);}
function aTex(f){if(f.d===1){if(f.n===1)return '';if(f.n===-1)return '-';return ''+f.n;}return fTex(f);}
function absCoef(f){var m=absFr(f);return (m.d===1&&m.n===1)?'':fTex(m);}
function sgnFr(f){if(f.n===0)return '';if(f.n>0)return '+'+fTex(f);return '-'+fTex(absFr(f));}
function pFr(f){return f.n<0?('\\bigl('+fTex(f)+'\\bigr)'):fTex(f);}
function pm(n){return n>=0?'+'+n:''+n;}
function pmz(n){return n===0?'':pm(n);}
function coefTerm(n,v){if(n===0)return '';return (n<0?'-':'+')+(Math.abs(n)===1?'':Math.abs(n))+v;}
function fPow(f,n){var r=I(1),i;if(n>=0){for(i=0;i<n;i++)r=fMul(r,f);}else{for(i=0;i<-n;i++)r=fDiv(r,f);}return r;}
function fMin(a,b){return fVal(a)<=fVal(b)?a:b;}
function fMax(a,b){return fVal(a)>=fVal(b)?a:b;}
function fEq(a,b){return Math.abs(fVal(a)-fVal(b))<1e-9;}

// ax^2+bx+c (a,b,c нь Fr) — хоосон гишүүдийг алгасана
function quadTex(a,b,c,v){v=v||'x';
 var t='';
 if(a.n!==0)t+=(a.n<0?'-':'')+absCoef(a)+v+'^2';
 if(b.n!==0)t+=(b.n<0?'-':(t?'+':''))+absCoef(b)+v;
 if(c.n!==0)t+=(c.n<0?'-':(t?'+':''))+fTex(absFr(c));
 return t===''?'0':t;}
function linTex(k,b,v){return quadTex(I(0),k,b,v);}
// a(x-p)^2+q
function vertexTex(a,p,q){
 var s=(fVal(a)===1?'':(fVal(a)===-1?'-':aTex(a)));
 if(p.n===0)s+='x^2';else s+='\\bigl(x'+sgnFr(fMul(p,I(-1)))+'\\bigr)^2';
 return s+sgnFr(q);}
function ptN(x,y){return '\\bigl('+x+';\\ '+y+'\\bigr)';}
function ptF(x,y){return '\\bigl('+fTex(x)+';\\ '+fTex(y)+'\\bigr)';}
function setX(lo,hi){return '\\{x\\mid '+lo+'\\le x\\le '+hi+'\\}';}
function setY(lo,hi){return '\\{y\\mid '+lo+'\\le y\\le '+hi+'\\}';}

// ──────────── Цэвэр SVG график ────────────
function graph(o){o=o||{};
 var W=o.W||212,H=o.H||212,pad=17;
 var xr=o.xr||5,yr=o.yr||5;
 var ux=(W-2*pad)/(2*xr),uy=(H-2*pad)/(2*yr);
 function X(x){return (pad+(x+xr)*ux).toFixed(1);}
 function Y(y){return (H-pad-(y+yr)*uy).toFixed(1);}
 var g='',i;
 if(o.grid!==false){
  for(i=-xr;i<=xr;i++)g+='<line x1="'+X(i)+'" y1="'+Y(-yr)+'" x2="'+X(i)+'" y2="'+Y(yr)+'" stroke="#eaeaf5" stroke-width="0.8"/>';
  for(i=-yr;i<=yr;i++)g+='<line x1="'+X(-xr)+'" y1="'+Y(i)+'" x2="'+X(xr)+'" y2="'+Y(i)+'" stroke="#eaeaf5" stroke-width="0.8"/>';
 }
 g+='<line x1="'+X(-xr)+'" y1="'+Y(0)+'" x2="'+X(xr)+'" y2="'+Y(0)+'" stroke="#444" stroke-width="1.2"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-yr)+'" x2="'+X(0)+'" y2="'+Y(yr)+'" stroke="#444" stroke-width="1.2"/>';
 g+='<polygon points="'+X(xr)+','+Y(0)+' '+(+X(xr)-6)+','+(+Y(0)-3)+' '+(+X(xr)-6)+','+(+Y(0)+3)+'" fill="#444"/>';
 g+='<polygon points="'+X(0)+','+Y(yr)+' '+(+X(0)-3)+','+(+Y(yr)+6)+' '+(+X(0)+3)+','+(+Y(yr)+6)+'" fill="#444"/>';
 if(o.labels){
  var sx=xr<=5?1:2,sy=yr<=5?1:Math.ceil(yr/5);
  for(i=-xr;i<=xr;i++){if(i===0)continue;
   g+='<line x1="'+X(i)+'" y1="'+(+Y(0)-2.5)+'" x2="'+X(i)+'" y2="'+(+Y(0)+2.5)+'" stroke="#444" stroke-width="0.9"/>';
   if(i%sx===0)g+='<text x="'+X(i)+'" y="'+(+Y(0)+11)+'" font-size="7.5" text-anchor="middle" fill="#666">'+i+'</text>';}
  for(i=-yr;i<=yr;i++){if(i===0)continue;
   g+='<line x1="'+(+X(0)-2.5)+'" y1="'+Y(i)+'" x2="'+(+X(0)+2.5)+'" y2="'+Y(i)+'" stroke="#444" stroke-width="0.9"/>';
   if(i%sy===0)g+='<text x="'+(+X(0)-4)+'" y="'+(+Y(i)+3)+'" font-size="7.5" text-anchor="end" fill="#666">'+i+'</text>';}
 }
 g+='<text x="'+(+X(0)-4)+'" y="'+(+Y(0)+11)+'" font-size="8" text-anchor="end" fill="#666">O</text>';
 g+='<text x="'+(+X(xr)-2)+'" y="'+(+Y(0)+13)+'" font-size="10" font-style="italic" fill="#444">x</text>';
 g+='<text x="'+(+X(0)+6)+'" y="'+(+Y(yr)+9)+'" font-size="10" font-style="italic" fill="#444">y</text>';
 (o.fns||[]).forEach(function(F){
  var cur=[],N=o.N||420,t,k;
  for(k=0;k<=N;k++){
   t=-xr+(2*xr)*k/N;
   var yv;
   try{yv=F.f(t);}catch(e){yv=null;}
   if(yv==null||!isFinite(yv)||yv<-yr-0.02||yv>yr+0.02){if(cur.length>1)g+='<polyline points="'+cur.join(' ')+'" fill="none" stroke="'+(F.color||'#7B52EE')+'" stroke-width="1.9"/>';cur=[];continue;}
   cur.push(X(t)+','+Y(yv));
  }
  if(cur.length>1)g+='<polyline points="'+cur.join(' ')+'" fill="none" stroke="'+(F.color||'#7B52EE')+'" stroke-width="1.9"/>';
 });
 (o.segs||[]).forEach(function(S){g+='<line x1="'+X(S.x1)+'" y1="'+Y(S.y1)+'" x2="'+X(S.x2)+'" y2="'+Y(S.y2)+'" stroke="'+(S.color||'#9aa0b5')+'" stroke-width="1.1" stroke-dasharray="3,3"/>';});

// 1. √(ax+b)/(cx-d) хэлбэрийн тодорхойлогдох муж — гурван тохиолдол
function g_domSqrtFrac(){

 if(cmp>1e-9){kind='cut';ans=head+'$'+fTex(r)+'\\gt '+fTex(p)+'$ тул хасалт хүчинтэй байна: $D='+'\\{x\\mid x\\ge '+fTex(p)+',\\ x\\ne '+fTex(r)+'\\}$';}
 else if(Math.abs(cmp)<1e-9){kind='edge';ans=head+'Хоёр нөхцлийн хил давхцаж байгаа тул $x='+fTex(p)+'$ гарна: $D=\\{x\\mid x\\gt '+fTex(p)+'\\}$';}
 else {kind='out';ans=head+'$'+fTex(r)+'\\lt '+fTex(p)+'$ тул энэ цэг эхний мужид ороогүй: $D=\\{x\\mid x\\ge '+fTex(p)+'\\}$';}

  _v:{t:'domSqrtFrac',a:a,b:b,c:c,d:d,p:fVal(p),r:fVal(r),kind:kind}};}

// 5. Квадрат функцийн хаалттай завсар дээрх дүр (орой дотор/гадна)
function g_rangeQuadInt(){

  else{hi=fv;lo=fMin(fm,fn);ex='Орой $x='+fTex(xv)+'$ нь завсарт орсон ба $a\\lt 0$ тул хамгийн их утга $f\\bigl('+fTex(xv)+'\\bigr)='+fTex(fv)+'$. Захын утгууд $f('+m+')='+fTex(fm)+',\\ f('+n+')='+fTex(fn)+'$ тул хамгийн бага нь $'+fTex(lo)+'$.';}

// 8. Функцийн тоо (тоолох бодлого)
function g_countFuncs(){
 var k=rnd(2,4),n=rnd(2,5),mode=pick(['all','inj','miss','img2']);
 var all=Math.pow(n,k),i,q,ans,val;
 if(mode==='all'){val=all;q='$D$ олонлогт $'+k+'$, $E$ олонлогт $'+n+'$ элемент байв. $D$ дээр тодорхойлогдсон $E$-ээс утга авах функц нийт хэд байх вэ?';
  ans='$D$-ийн элемент бүрт $E$-ээс $'+n+'$ янзаар утга сонгоно. Сонголтууд хоорондоо хамааралгүй тул нийт $'+n+'^{'+k+'}='+all+'$ функц.';}
 else if(mode==='inj'){if(n<k)return null;var p=1;for(i=0;i<k;i++)p*=(n-i);val=p;
  q='$D$ олонлогт $'+k+'$, $E$ олонлогт $'+n+'$ элемент байв. Дүр нь $'+k+'$ ялгаатай элементтэй байх функц хэд байх вэ?';
  ans='Элемент бүрт өмнөх сонголтуудаас ялгаатай утга өгнө: $'+(function(){var t=[];for(i=0;i<k;i++)t.push(n-i);return t.join('\\cdot ');})()+'='+p+'$ функц.';}
 else if(mode==='miss'){val=Math.pow(n-1,k);
  q='$D$ олонлогт $'+k+'$, $E$ олонлогт $'+n+'$ элемент байв. $E$-ийн нэг тогтмол элемент дүрд <b>орохгүй</b> байх функц хэд байх вэ?';
  ans='Тэр элементийг хасвал сонголт $'+(n-1)+'$ болно: $'+(n-1)+'^{'+k+'}='+Math.pow(n-1,k)+'$ функц.';}
 else{if(n<2)return null;var C=n*(n-1)/2,cnt=C*(Math.pow(2,k)-2);if(cnt<=0)return null;val=cnt;
  q='$D$ олонлогт $'+k+'$, $E$ олонлогт $'+n+'$ элемент байв. Дүр нь яг $2$ элементтэй байх функц хэд байх вэ?';
  ans='Эхлээд дүрийн $2$ элементийг $\\dfrac{'+n+'\\cdot '+(n-1)+'}{2}='+C+'$ янзаар сонгоно. Тэр хоёр утгыг ашиглах функц $2^{'+k+'}='+Math.pow(2,k)+'$ ба тэдгээрээс зөвхөн нэг утга авдаг $2$-ыг хасна: $'+C+'\\cdot \\bigl('+Math.pow(2,k)+'-2\\bigr)='+cnt+'$ функц.';}
 return {q:q,a:ans,key:'cf'+mode+k+'_'+n,nv:val,_v:{t:'countFuncs',mode:mode,k:k,n:n,val:val}};}

// 9. Модультай функцийн хаалттай завсар дээрх дүр
function g_rangeAbsInt(){

function g_qVertexFull(){

function g_qDomRangeParam(){

// 8. Зургаас a, b, c, D-ийн тэмдгийг тодорхойлох
function g_qSignCoef(){

    'График $Oy$ тэнхлэгийг эхээс '+(c>0?'дээш':'доош')+' огтолж байгаа тул $c=f(0)'+sg(c)+'$. '+
    'График $Ox$ тэнхлэгтэй '+(D>0?'хоёр цэгээр огтлолцож байгаа тул $D=b^2-4ac\\gt 0$':'огтлолцохгүй байгаа тул $D=b^2-4ac\\lt 0$')+'. '+
    'Иймд $abc'+sg(abc)+'$.',
  key:'qsc'+a+'_'+xv+'_'+yv,_v:{t:'qSignCoef',a:a,b:b,c:c,D:D}};}

// 9. Хаалттай завсар дээрх хамгийн бага утгаас параметрийг олох (тохиолдол ялгах)
function g_qMinParam(){
 var n=pick([2,3,4,5,6]),c=rnd(-4,8),which=pick(['in','in','edge']);
 var m0,M;
 if(which==='in'){m0=rnd(1,n);M=c-m0*m0;}
 else{m0=n+rnd(1,4);M=n*n-2*m0*n+c;}
 var sols=[];
 var t=c-M;                     // m^2=t (оройн тохиолдол)
 var rt=isqrt(t);
 if(rt!==null&&rt>=0&&rt<=n)sols.push(rt);
 var mr=Fr(n*n+c-M,2*n);        // баруун тохиолдол
 if(fVal(mr)>n+1e-12)sols.push(fVal(mr));
 if(!sols.length)return null;
 return {q:'$f(x)=x^2-2mx'+pmz(c)+',\\quad D='+setX(0,n)+',\\quad f_{min}='+M+'$',
  a:'$f(x)=\\bigl(x-m\\bigr)^2'+pmz(c)+'-m^2$ тул орой нь $x=m$. Гурван тохиолдлыг шалгана. '+
    '<b>1)</b> $m\\lt 0$: функц завсартаа өсөх тул $f_{min}=f(0)='+c+'$'+(c===M?' (энэ нь өгөгдөлтэй тохирох боловч $m$ ганц утгаар тодорхойлогдохгүй)':(', өгөгдөлтэй тохирохгүй ($'+c+'\\ne '+M+'$)'))+'. '+
    '<b>2)</b> $0\\le m\\le '+n+'$: $f_{min}=f(m)='+c+'-m^2='+M+'\\Rightarrow m^2='+t+'$'+(rt!==null&&rt<=n?(' тул $m='+rt+'$'):' тул энэ мужид шийдгүй')+'. '+
    '<b>3)</b> $m\\gt '+n+'$: функц завсартаа буурах тул $f_{min}=f('+n+')='+(n*n)+'-'+(2*n)+'m'+pmz(c)+'='+M+'\\Rightarrow m='+fTex(mr)+'$'+(fVal(mr)>n?(' (нөхцөл биелнэ)'):(' (нөхцөл биелэхгүй)'))+'. '+
    'Хариу: $m='+sols.map(function(z){return ''+z;}).join('$ эсвэл $m=')+'$.',
  key:'qmp'+n+'_'+c+'_'+which+'_'+m0,_v:{t:'qMinParam',n:n,c:c,M:M,sols:sols}};}

// 10. Ялгаварлагчтай холбоотой параметрийн муж
function g_qDiscParam(){

 var al=r1+r2,k=-r1*r2,cond=pick(['touch','none','two']);

 if(al===0&&k===0)return null;
 var ctxt=cond==='touch'?'$Ox$ тэнхлэгийг шүргэнэ':(cond==='none'?'$Ox$ тэнхлэгтэй огтлолцохгүй':'$Ox$ тэнхлэгийг хоёр цэгээр огтлоно');

 var sgnw=cond==='touch'?'=0':(cond==='none'?'\\lt 0':'\\gt 0');

  a:'$\\dfrac{D}{4}=m^2-\\bigl('+tail+'\\bigr)=m^2'+coefTerm(-al,'m')+pmz(-k)+'=\\bigl(m'+pmz(-r1)+'\\bigr)\\bigl(m'+pmz(-r2)+'\\bigr)$. '+
    'Нөхцөл нь $\\dfrac{D}{4}'+sgnw+'$ байх явдал тул '+res+'.',
  key:'qdp'+r1+'_'+r2+'_'+cond,_v:{t:'qDiscParam',r1:r1,r2:r2,al:al,k:k,cond:cond}};}

// 12. f(m)=f(n) нөхцлөөс тэгш хэмийн тэнхлэгийг олж коэффициент сэргээх

    'Дараа нь $f('+w+')='+(w*w)+pmz(b*w)+'+c='+v+'$-аас $c='+c+'$. '+
    'Иймд $f(x)='+quadTex(I(1),I(b),I(c))+'$, тэгш хэмийн тэнхлэг $x='+fTex(pv)+'$, орой $'+ptF(pv,qv)+'$.',

// ════════════════ 5.3 y = a/x функц ════════════════
function bTexF(f){return (f.d===1)?(''+f.n):('\\Bigl('+fTex(f)+'\\Bigr)');}
function hypTex(a){return (a<0?'-':'')+'\\dfrac{'+Math.abs(a)+'}{x}';}
function kTexM(k){return (k===1)?'':((k===-1)?'-':(''+k+'\\cdot '));}
function chordLHS(a,p){var N=-a,P=p;if(P<0){N=-N;P=-P;}return (N<0?'-':'')+'\\dfrac{'+Math.abs(N)+'}{'+(P===1?'':P)+'q}';}
function mfrac(n,dTex){return (n<0?'-':'')+'\\dfrac{'+Math.abs(n)+'}{'+dTex+'}';}
function invSqTex(a){return (a<0?'-':'')+'\\dfrac{'+Math.abs(a)+'}{x^2}';}
function pwT(b,e){if(e===1)return b;if(e===0)return '1';return b+'^{'+e+'}';}
function flipRel(r){return r==='ge'?'le':'ge';}
function relT(r){return r==='ge'?'\\ge ':'\\le ';}
function divisorsOf(n){n=Math.abs(n);var d=[],i;for(i=1;i<=n;i++)if(n%i===0)d.push(i);return d;}

// 1. Гипербол дээрх бүхэл координаттай цэгийн тоо

    '$'+A+'='+pfTex(A)+'$ тул эерэг хуваагчийн тоо $'+pe.map(function(z){return '\\bigl('+z.e+'+1\\bigr)';}).join('\\cdot ')+'='+d+'$. '+
    'Сөрөг хуваагч бүрд ч нэг цэг харгалзах тул нийт $2\\cdot '+d+'='+(2*d)+'$ цэг байна. Жишээ нь $'+show+'$ гэх мэт.',

function g_axnFindN(){

 if(N===0.5){var s1=pick([1,2,3]),s2=s1+pick([1,2,3]),s3=s2+1;p=s1*s1;q0=s2*s2;w=s3*s3;}
 else{p=pick([1,2,3]);q0=p+pick([1,2,3]);w=q0+1;}
 function pw(x){
  if(N===-2)return fDiv(A,I(x*x));
  if(N===-1)return fDiv(A,I(x));
  if(N===0.5)return fMul(A,I(Math.round(Math.sqrt(x))));
  if(N===1)return fMul(A,I(x));
  if(N===2)return fMul(A,I(x*x));
  return fMul(A,I(x*x*x));}

 if(fEq(u,v))return null;
 var ratio=fDiv(u,v),pq=Fr(p,q0);

  a:'Хоёр нөхцлийг харьцуулбал $\\dfrac{f('+p+')}{f('+q0+')}=\\Bigl(\\dfrac{'+p+'}{'+q0+'}\\Bigr)^{n}$ болно. '+
    'Энд $\\dfrac{'+p+'}{'+q0+'}='+fTex(pq)+'$, $\\dfrac{f('+p+')}{f('+q0+')}='+fTex(ratio)+'$ тул боломжит зургаан утгыг шалгахад зөвхөн $n='+nTex+'$ тохирно. '+
    'Иймд $y='+powForm+'$ бөгөөд эхний нөхцлөөс $a='+fTex(A)+'$. Тэгэхээр $f('+w+')='+fTex(fw)+'$.',
  key:'afn'+N+'_'+fVal(A)+'_'+p+'_'+q0,_v:{t:'axnFindN',N:N,A:fVal(A),p:p,q:q0,w:w}};}

// 2. Илтгэгч функцийн хаалттай завсар дээрх дүр
function g_expRangeInt(){

    '$k='+k+(k>0?'\\gt ':'\\lt ')+'0$ тул $k$-гаар үржүүлэхэд монотон чанар '+(k>0?'хадгалагдана':'урвуу болно')+', өөрөөр хэлбэл функц '+((big===(k>0))?'өснө':'буурна')+'. '+

// 3. D ба E-ээс (k; a)-гийн БҮХ хосыг олох (хоёр тохиолдол)
function g_expInvRange(){
 var A=pick([I(2),I(3),I(4),Fr(1,2),Fr(1,3),Fr(3,2),Fr(2,3)]);
 var k=pick([1,2,3,4,6,9,-1,-2,-3,-4,-6]);
 var m=rnd(-2,1),e=pick([1,2]),n=m+e;
 var fm=fMul(I(k),fPow(A,m)),fn=fMul(I(k),fPow(A,n));
 var lo=fMin(fm,fn),hi=fMax(fm,fn);
 if(fEq(lo,hi))return null;
 var a1=fPow(fDiv(hi,lo),1),A1,A2,k1,k2;
 // 1-р тохиолдол: f(m)=lo, f(n)=hi ;  2-р тохиолдол: f(m)=hi, f(n)=lo
 var r1=fDiv(hi,lo),r2=fDiv(lo,hi);
 function eroot(fr,ee){if(ee===1)return fr;var sn=isqrt(fr.n),sd=isqrt(fr.d);if(sn===null||sd===null)return null;return Fr(sn,sd);}
 A1=eroot(r1,e);A2=eroot(r2,e);
 if(!A1||!A2)return null;
 k1=fDiv(lo,fPow(A1,m));k2=fDiv(hi,fPow(A2,m));
 return {q:'$y=k\\cdot a^{x},\\quad D='+setX(m,n)+',\\quad E='+setY(fTex(lo),fTex(hi))+'$',
  a:'Функц монотон тул захын утгууд захад хүрнэ, гэвч аль зах нь хамгийн бага болохыг мэдэхгүй тул хоёр тохиолдлыг үзнэ. '+
    '<b>1)</b> $f('+m+')='+fTex(lo)+'$, $f('+n+')='+fTex(hi)+'$ бол $'+pwT('a',e)+'='+fTex(r1)+'$ тул $a='+fTex(A1)+'$, $k='+fTex(lo)+'\\div '+pwT(bTexF(A1),m)+'='+fTex(k1)+'$. '+
    '<b>2)</b> $f('+m+')='+fTex(hi)+'$, $f('+n+')='+fTex(lo)+'$ бол $'+pwT('a',e)+'='+fTex(r2)+'$ тул $a='+fTex(A2)+'$, $k='+fTex(k2)+'$. '+
    'Хариу: $\\bigl(k;\\ a\\bigr)='+ptF(k1,A1)+'$ эсвэл $'+ptF(k2,A2)+'$.',
  key:'eiv'+fVal(A)+'_'+k+'_'+m+'_'+e,_v:{t:'expInvRange',m:m,n:n,lo:fVal(lo),hi:fVal(hi),k1:fVal(k1),a1:fVal(A1),k2:fVal(k2),a2:fVal(A2)}};}

// 1. Параболын цэг дээрх шүргэгчийн налалт (давхар язгуурын нөхцөл)
function g_tanParab(){
 var A=pick([I(1),I(-1),I(2),I(-2),Fr(1,2),Fr(-1,2),I(3),Fr(-3,2)]);
 var b=nz(-6,6),c=rnd(-6,6),x0=nz(-4,4);
 var y0=fAdd(fAdd(fMul(A,I(x0*x0)),I(b*x0)),I(c));
 var k=fAdd(fMul(I(2*x0),A),I(b));
 var d=fSub(y0,fMul(k,I(x0)));
 var yr=Math.min(12,Math.max(5,Math.ceil(Math.abs(fVal(y0)))+2));
 var xr=Math.max(4,Math.abs(x0)+2);
 var av=fVal(A);
 var fig=(Math.abs(fVal(y0))<=10)?graph({xr:xr,yr:yr,labels:true,
   fns:[{f:function(x){return av*x*x+b*x+c;}}],pts:[{x:x0,y:fVal(y0),l:'A'}]}):null;
 var r={q:'$y='+quadTex(A,I(b),I(c))+'$ парабол, $A'+ptF(I(x0),y0)+'$',
  a:'Шүргэгчийг $y=kx+d$ гэвэл $'+quadTex(A,I(b),I(c))+'=kx+d$ тэгшитгэл нь $x='+x0+'$ давхар язгууртай байх ёстой. '+
    'Энэ нь $'+aTex(A)+'x^2+\\bigl('+b+'-k\\bigr)x+\\bigl('+c+'-d\\bigr)=0$ бөгөөд язгууруудын нийлбэр $2\\cdot '+paren(x0)+'=\\dfrac{k-'+paren(b)+'}{'+fTex(A)+'}$ гэсэн үг. '+
    'Эндээс $k=2\\cdot '+pFr(A)+'\\cdot '+paren(x0)+sgnFr(I(b))+'='+fTex(k)+'$, $d='+fTex(y0)+'-'+pFr(k)+'\\cdot '+paren(x0)+'='+fTex(d)+'$. '+
    'Иймд шүргэгчийн налалт нь $'+fTex(k)+'$, тэгшитгэл нь $y='+linTex(k,d)+'$.',
  key:'tp'+fVal(A)+'_'+b+'_'+c+'_'+x0,_v:{t:'tanParab',A:fVal(A),b:b,c:c,x0:x0,k:fVal(k),d:fVal(d)}};
 if(fig)r.fig=fig;
 return r;}

    'Шүргэх нөхцөл нь давхар язгууртай байх буюу $k^2-4\\cdot '+pFr(A)+'\\bigl(k\\cdot '+paren(u)+'-'+pFr(v)+'\\bigr)=0$. '+
    'Энэ нь $k$-гийн хувьд квадрат тэгшитгэл бөгөөд бодвол $k_{1}='+fTex(k1)+'$, $k_{2}='+fTex(k2)+'$ гарна. '+
    'Шүргэлтийн цэгүүд нь $x='+x1+'$ ба $x='+x2+'$ бөгөөд шүргэгчид нь $y='+linTex(k1,d1)+'$, $y='+linTex(k2,d2)+'$.',
  key:'te'+fVal(A)+'_'+x1+'_'+x2,_v:{t:'tanExternal',A:fVal(A),x1:x1,x2:x2,u:u,k1:fVal(k1),k2:fVal(k2)}};
 if(fig)r.fig=fig;
 return r;}

// 7. Өгсөн налалттай шүргэгчийн шүргэлтийн цэгийг олох (урвуу бодлого)
function g_tanParallel(){
 var A=pick([I(1),I(-1),I(2),I(-2),Fr(1,2),Fr(-1,2),I(3),Fr(-3,2)]);
 var b=nz(-6,6),c=rnd(-6,6),x0=nz(-4,4);
 var k=fAdd(fMul(I(2*x0),A),I(b));
 var y0=fAdd(fAdd(fMul(A,I(x0*x0)),I(b*x0)),I(c));
 var d=fSub(y0,fMul(k,I(x0)));
 var mm=fAdd(d,I(pick([1,2,3,-1,-2,-3])));
 return {q:'$y='+quadTex(A,I(b),I(c))+'$ парабол, $y='+linTex(k,mm)+'$ шулуун',
  a:'Абсцисс нь $x_{0}$ байх цэг дээрх шүргэгчийн налалтыг олъё. $y=kx+d$ шүргэгчийн хувьд $'+aTex(A)+'x^2+\\bigl('+b+'-k\\bigr)x+\\bigl('+c+'-d\\bigr)=0$ нь $x_{0}$ давхар язгууртай тул $2x_{0}=\\dfrac{k-'+paren(b)+'}{'+fTex(A)+'}$ буюу $k=2\\cdot '+pFr(A)+'x_{0}'+sgnFr(I(b))+'$. '+
    'Шүргэгч өгсөн шулуунтай параллел байхын тулд налалт нь тэнцүү: $2\\cdot '+pFr(A)+'x_{0}'+sgnFr(I(b))+'='+fTex(k)+'$ тул $x_{0}='+x0+'$. '+
    'Шүргэлтийн цэг нь $'+ptF(I(x0),y0)+'$ бөгөөд $d='+fTex(y0)+'-'+pFr(k)+'\\cdot '+paren(x0)+'='+fTex(d)+'$. '+
    'Иймд шүргэгч нь $y='+linTex(k,d)+'$ бөгөөд $d\\ne '+fTex(mm)+'$ тул өгсөн шулуунаас ялгаатай.',
  key:'tpl'+fVal(A)+'_'+b+'_'+c+'_'+x0,_v:{t:'tanParallel',A:fVal(A),b:b,c:c,x0:x0,k:fVal(k),d:fVal(d)}};}
var WSPEC={"title":"Парабол, шулуун ба талбай — хүнд","sub":"Квадрат функц · V бүлэг · 10-р анги","rule":"<b>Санамж:</b> $y=ax^2+bx+c$ нь $y=a\\Bigl(x+\\dfrac{b}{2a}\\Bigr)^2-\\dfrac{b^2-4ac}{4a}$ хэлбэрт шилжих тул орой нь $\\Bigl(-\\dfrac{b}{2a};\\ -\\dfrac{b^2-4ac}{4a}\\Bigr)$, тэгш хэмийн тэнхлэг нь $x=-\\dfrac{b}{2a}$ шулуун байна. $a\\gt 0$ бол дээшээ, $a\\lt 0$ бол доошоо харсан парабол. $Ox$ тэнхлэгтэй огтлолцох эсэх нь $D=b^2-4ac$-ийн тэмдгээр тодорхойлогдоно. $f(m)=f(n)$ бол тэгш хэмийн тэнхлэг $x=\\dfrac{m+n}{2}$.","ref":"","tasks":[{"label":"Зургаас $a$, $b$, $c$ болон $abc$-ийн тэмдгийг тодорхойлж үндэслэлээ бич.","fn":"g_qSignCoef","cap":2,"cols":2,"wk":26},{"label":"Нөхцөл биелэх $m$ параметрийн утгын мужийг ол.","fn":"g_qDiscParam","cap":3,"cols":1,"wk":28},{"label":"Парабол ба шулууны огтлолцох цэгүүд, хөвчийн дундаж цэгийг ол.","fn":"g_qParabLine","cap":3,"cols":1,"wk":28},{"label":"Парабол ба $Ox$ тэнхлэгийн үүсгэх гурвалжны талбайг ол.","fn":"g_qTriArea","cap":3,"cols":2,"wk":30}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
