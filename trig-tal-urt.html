<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Талын урт олох · тригонометр (30° 45° 60°)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--orange:#e0701a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:11mm 13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 22px 2px 4px}
  .rule{font-size:11.5px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px;text-align:center}
  .sec{font-size:12.5px;font-weight:800;color:#5a32d6;margin:4px 0 8px;display:flex;align-items:center;gap:7px}
  .sec b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;background:var(--purple);color:#fff;font-size:11px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px 12px;margin-bottom:11px}
  .q{break-inside:avoid;page-break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:6px 7px 7px;background:linear-gradient(#fff,#fbf9ff)}
  .qh{font-weight:800;color:var(--purple);font-size:12.5px;margin-bottom:1px}
  .dfig{display:flex;justify-content:center}.dfig svg{width:100%;max-width:172px;height:auto}
  .xline{font-size:12.5px;font-weight:700;margin-top:3px}.xline .bl{display:inline-block;min-width:70px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .wgrid{display:grid;grid-template-columns:1fr;gap:8px}
  .wq{break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:8px 11px;background:linear-gradient(#fff,#fbf9ff);display:flex;gap:9px}
  .wq .wn{font-weight:800;color:var(--purple);min-width:20px;font-size:13px}.wq .wt{font-size:12.7px}.wq .wt .ask{color:#5a32d6;font-weight:700}
  .wans{font-size:12px;font-weight:700;margin-top:5px}.wans .bl{display:inline-block;min-width:150px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;font-size:12px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:20px}
  .ans-w{margin-top:8px;font-size:12px;display:grid;gap:5px}.ans-w .an{color:var(--soft);font-weight:800}
  #answers{display:none}
  .s-side{fill:none;stroke:#2f6cae;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .s-ra{fill:none;stroke:#8f9bb3;stroke-width:1.3}
  .s-arc{fill:none;stroke:var(--orange);stroke-width:1.6}
  .s-vtx{fill:#3a2d5e}
  .s-len{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;font-size:11px;fill:#2f6cae}
  .s-x{fill:var(--orange);font-weight:800;font-style:italic;font-family:Georgia,serif;font-size:13px}
  .s-ang{font-family:'Segoe UI',Arial,sans-serif;font-weight:800;font-size:10.5px;fill:var(--orange)}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function mid(P,Q){return[(P[0]+Q[0])/2,(P[1]+Q[1])/2];}
function unit(P,Q){var dx=Q[0]-P[0],dy=Q[1]-P[1],L=Math.hypot(dx,dy)||1;return[dx/L,dy/L];}
function dist(P,Q){return Math.hypot(P[0]-Q[0],P[1]-Q[1]);}
function A2(V,P){return Math.atan2(P[1]-V[1],P[0]-V[0]);}
function PT(V,r,a){return[V[0]+r*Math.cos(a),V[1]+r*Math.sin(a)];}
function arcPath(V,r,a1,a2){while(a2-a1>Math.PI)a2-=2*Math.PI;while(a2-a1<-Math.PI)a2+=2*Math.PI;var p1=PT(V,r,a1),p2=PT(V,r,a2),sw=a2>a1?1:0;return 'M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A'+r+' '+r+' 0 0 '+sw+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);}
function rightTri(adjR,oppR,mirror){var scale=Math.min(150/adjR,104/oppR),top=22,mx=24;
  var A=[mx,top+oppR*scale],C=[mx+adjR*scale,top+oppR*scale],B=[mx+adjR*scale,top];
  if(mirror){A[0]=210-A[0];C[0]=210-C[0];B[0]=210-B[0];}return {A:A,B:B,C:C};}
function dot(P){return '<circle class="s-vtx" cx="'+P[0].toFixed(1)+'" cy="'+P[1].toFixed(1)+'" r="2.2"/>';}
function raSq(C,P1,P2){var u1=unit(C,P1),u2=unit(C,P2),L=9;
  var a=[C[0]+u1[0]*L,C[1]+u1[1]*L],b=[a[0]+u2[0]*L,a[1]+u2[1]*L],d=[C[0]+u2[0]*L,C[1]+u2[1]*L];
  return '<path class="s-ra" d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' L'+b[0].toFixed(1)+' '+b[1].toFixed(1)+' L'+d[0].toFixed(1)+' '+d[1].toFixed(1)+'"/>';}
function angMark(V,P,Q,lab,cls){var r=17,a1=A2(V,P),a2=A2(V,Q);
  var s='<path class="s-arc" d="'+arcPath(V,r,a1,a2)+'"/>';
  var d2=a2;while(d2-a1>Math.PI)d2-=2*Math.PI;while(d2-a1<-Math.PI)d2+=2*Math.PI;var bis=(a1+d2)/2;var lp=PT(V,r+11,bis);
  s+='<text class="'+(cls||'s-ang')+'" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3.5).toFixed(1)+'" text-anchor="middle">'+lab+'</text>';return s;}
function labelSide(P,Q,third,val,isX){if(val==='')return '';var m=mid(P,Q),d=unit(P,Q),perp=[-d[1],d[0]];
  var c1=[m[0]+13*perp[0],m[1]+13*perp[1]],c2=[m[0]-13*perp[0],m[1]-13*perp[1]];
  var c=dist(c1,third)>dist(c2,third)?c1:c2;
  return '<text class="'+(isX?'s-x':'s-len')+'" x="'+c[0].toFixed(1)+'" y="'+(c[1]+3.5).toFixed(1)+'" text-anchor="middle">'+val+'</text>';}

var RAT={30:[Math.sqrt(3),1],45:[1,1],60:[1,Math.sqrt(3)]};  // [adjR, oppR]  (α = A өнцөг)
function gen(){
  var k=rnd(2,9);
  var c=pick([
    {th:30,g:'hyp',gv:2*k,a:'opp',av:k,  how:'эсрэг = гип·sin30° = '+(2*k)+'·½ = '+k},
    {th:30,g:'opp',gv:k,  a:'hyp',av:2*k,how:'гип = эсрэг ÷ sin30° = '+k+'÷½ = '+(2*k)},
    {th:45,g:'adj',gv:k,  a:'opp',av:k,  how:'эсрэг = залгаа·tan45° = '+k+'·1 = '+k},
    {th:45,g:'opp',gv:k,  a:'adj',av:k,  how:'залгаа = эсрэг ÷ tan45° = '+k+'÷1 = '+k},
    {th:60,g:'hyp',gv:2*k,a:'adj',av:k,  how:'залгаа = гип·cos60° = '+(2*k)+'·½ = '+k},
    {th:60,g:'adj',gv:k,  a:'hyp',av:2*k,how:'гип = залгаа ÷ cos60° = '+k+'÷½ = '+(2*k)}
  ]);
  c.mirror=!!pick([0,1]);return c;
}
function sideVal(role,c){ if(c.g===role)return {v:''+c.gv,x:false}; if(c.a===role)return {v:'x',x:true}; return {v:'',x:false}; }
function draw(c){
  var T=rightTri(RAT[c.th][0],RAT[c.th][1],c.mirror),A=T.A,B=T.B,C=T.C;
  var s='<svg viewBox="0 0 210 150" xmlns="http://www.w3.org/2000/svg">';
  s+='<path class="s-side" d="M'+A[0]+' '+A[1]+' L'+B[0]+' '+B[1]+' L'+C[0]+' '+C[1]+' Z"/>';
  s+=raSq(C,A,B)+angMark(A,B,C,c.th+'°');
  var adj=sideVal('adj',c),opp=sideVal('opp',c),hyp=sideVal('hyp',c);
  s+=labelSide(A,C,B,adj.v,adj.x)+labelSide(C,B,A,opp.v,opp.x)+labelSide(A,B,C,hyp.v,hyp.x);
  s+=dot(A)+dot(B)+dot(C);s+='</svg>';return s;
}

function wp(){
  var k=rnd(2,9);
  return pick([
    {t:'Шатыг газартай 30° өнцөг үүсгэн хананд наажээ. Шатны урт '+(2*k)+' м бол дээд үзүүр газраас хэдэн м өндөрт байх вэ? <span class="ask">(өндөр = эсрэг тал)</span>',
     a:'өндөр = '+(2*k)+'·sin30° = '+(2*k)+'·½ = '+k+' м'},
    {t:'Налуу зам газартай 30° өнцөг үүсгэнэ. Замын дагуу '+(2*k)+' м өгсвөл газраас хэдэн м өндөрт гарах вэ?',
     a:'өндөр = '+(2*k)+'·sin30° = '+k+' м'},
    {t:'Тэгш өнцөгт гурвалжны нэг хурц өнцөг 45°, түүний залгаа тал '+k+' м. <span class="ask">Эсрэг талын уртыг ол.</span>',
     a:'эсрэг = '+k+'·tan45° = '+k+'·1 = '+k+' м'},
    {t:'Тэгш өнцөгт гурвалжны нэг өнцөг 60°, гипотенуз '+(2*k)+' см. <span class="ask">60°-ийн залгаа талыг ол.</span>',
     a:'залгаа = '+(2*k)+'·cos60° = '+(2*k)+'·½ = '+k+' см'}
  ]);
}

function build(){
  var cards='',answ='',items=[];
  var seen={};
  for(var i=0;i<9;i++){var c,sg,tr=0;do{c=gen();sg=c.th+'_'+c.g+'_'+c.a+'_'+c.gv;tr++;}while(seen[sg]&&tr<80);seen[sg]=1;var n=i+1;
    cards+='<div class="q"><div class="qh">'+n+'.</div><div class="dfig">'+draw(c)+'</div>'
      +'<div class="xline">x =<span class="bl"></span></div></div>';
    answ+='<div class="a"><span class="an">'+n+'.</span><span>x = '+c.av+'  <span style="color:#9891b3">('+c.how+')</span></span></div>';
    items.push({q:c.th+'° тал олох',a:'x='+c.av});
  }
  var W=(function(){var a=[],s={},t=0;while(a.length<3&&t<60){var w=wp(),k=w.t.slice(0,16);if(!s[k]){s[k]=1;a.push(w);}t++;}while(a.length<3)a.push(wp());return a;})();var wcards='',wans='';
  for(var j=0;j<W.length;j++){var w=W[j];var n2=j+10;
    wcards+='<div class="wq"><div class="wn">'+n2+'.</div><div class="wt">'+w.t+'<div class="wans">Хариу:<span class="bl"></span></div></div></div>';
    wans+='<div><span class="an">'+n2+'.</span> '+w.a+'</div>';
    items.push({q:'Бодлого '+n2,a:w.a});}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Талын урт олох — тригонометр</h1><div class="sub">Өнцөг ба нэг талыг мэдэж, x талыг ол · тусгай өнцөг 30° · 45° · 60° · 9-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">эсрэг = гип·sin θ &nbsp;·&nbsp; залгаа = гип·cos θ &nbsp;·&nbsp; эсрэг = залгаа·tan θ &nbsp;|&nbsp; $\\sin30°{=}\\tfrac12,\\ \\cos60°{=}\\tfrac12,\\ \\tan45°{=}1$</div>'
    +'<div class="sec"><b>1</b> Мэдэгдэхгүй байгаа талыг ол</div><div class="dgrid">'+cards+'</div>'
    +'<div class="sec"><b>2</b> Бодлого</div><div class="wgrid">'+wcards+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answ+'</div><div class="ans-w">'+wans+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Талын урт олох — тригонометр';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
