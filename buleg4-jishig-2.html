<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IV бүлэг — Жишиг даалгавар 2 (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:6px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:3px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:2px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 22px 2px 4px}
  .col1{display:grid;grid-template-columns:1fr;gap:11px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:8px;align-items:baseline}
  .ql{font-weight:800;color:var(--purple);font-size:13.5px;min-width:20px}
  .qm{font-size:13.5px;flex:1}
  .pts{font-size:10.5px;font-weight:700;color:#16a34a;background:#eafaf0;border:1px solid #bff0d0;border-radius:6px;padding:1px 7px;white-space:nowrap;margin-left:auto}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:22mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5;overflow:hidden}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ хувилбар</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодох зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function pn(n){return n<0?'('+n+')':''+n;}
function linN(a,b){var t='';if(a===1)t+='n';else if(a===-1)t+='-n';else if(a!==0)t+=a+'n';if(b>0)t+=(t?'+':'')+b;else if(b<0)t+='-'+(-b);if(t==='')t='0';return t;}
// ── IV бүлгийн генераторууд (4.1–4.3) ──
function e_seqFirst(){var type=pick(['lin','quad']);
 if(type==='lin'){var a=nz(-3,4),b=nz(-4,5);var T=[1,2,3,4].map(function(n){return a*n+b;});
   return {q:'$a_n='+linN(a,b)+'$ дарааллын эхний 4 гишүүнийг ол.',a:'$a_1='+T[0]+',\\ a_2='+T[1]+',\\ a_3='+T[2]+',\\ a_4='+T[3]+'$'};}
 var b2=nz(-3,4);var Q=[1,2,3,4].map(function(n){return n*n+b2*n;});
 return {q:'$a_n=n^2'+(b2>0?'+'+b2+'n':b2<0?''+b2+'n':'')+'$ дарааллын эхний 4 гишүүнийг ол.',a:'$a_1='+Q[0]+',\\ a_2='+Q[1]+',\\ a_3='+Q[2]+',\\ a_4='+Q[3]+'$'};}
function e_recur(){var r=pick([2,3]),c=nz(-3,3),a1=nz(-2,4);var T=[a1];for(var i=1;i<5;i++)T.push(r*T[i-1]+c);
 var st='$a_1='+a1+'$; ';for(var i=1;i<5;i++)st+='$a_'+(i+1)+'='+r+'\\cdot'+pn(T[i-1])+sg(c)+'='+T[i]+'$'+(i<4?'; ':'');
 return {q:'$a_1='+a1+',\\ a_{n+1}='+r+'a_n'+sg(c)+'$ бол эхний 5 гишүүнийг ол.',a:st};}
function e_apGen(){var a1=nz(-6,8),d=nz(-5,6),k=pick([15,20,25,30]);var ak=a1+(k-1)*d;
 return {q:'Арифметик прогрессийн $a_1='+a1+',\\ d='+d+'$ бол $a_{'+k+'}$-г ол.',a:'$a_{'+k+'}=a_1+(n-1)d='+a1+'+'+(k-1)+'\\cdot'+pn(d)+'='+ak+'$'};}
function e_apTwo(){for(var t=0;t<300;t++){var a1=nz(-6,8),d=nz(-4,5),m=rnd(2,7),n=m+rnd(2,8);var am=a1+(m-1)*d,an=a1+(n-1)*d;if(Math.abs(am)>110||Math.abs(an)>110)continue;
  return {q:'Арифметик прогрессийн $a_{'+m+'}='+am+',\\ a_{'+n+'}='+an+'$ бол $a_1,\\ d$-г ол.',a:'$('+n+'-'+m+')d='+(an-am)+'\\Rightarrow d='+d+'$; $a_1='+am+'-'+(m-1)+'\\cdot'+pn(d)+'='+a1+'$'};}return null;}
function e_apSum(){var a1=nz(-6,8),d=nz(-4,5),n=pick([10,12,15,20]);var Sn=n*(2*a1+(n-1)*d)/2;if(Sn!==Math.round(Sn))return null;
 return {q:'Арифметик прогрессийн $a_1='+a1+',\\ d='+d+'$ бол $S_{'+n+'}$-г ол.',a:'$S_n=\\dfrac{2a_1+(n-1)d}{2}n=\\dfrac{'+(2*a1+(n-1)*d)+'}{2}\\cdot'+n+'='+Sn+'$'};}
function e_apMean(){for(var t=0;t<300;t++){var m=rnd(2,5),p=rnd(1,4),x0=rnd(2,6);var A=2*m-p;if(A===0)continue;var r=rnd(3,18),q=A*x0-r;if(Math.abs(q)>40)continue;
  return {q:'$('+p+'x'+sg(q)+'),\\ '+(m===1?'x':m+'x')+',\\ '+r+'$ гурван тоо арифметик прогресс үүсгэдэг бол $x$-г ол.',a:'$2\\cdot'+(m===1?'x':m+'x')+'=('+p+'x'+sg(q)+')+'+r+'\\Rightarrow '+A+'x='+(q+r)+'\\Rightarrow x='+x0+'$'};}return null;}
function e_gpGen(){for(var t=0;t<200;t++){var b1=pick([1,2,3,-2]),q=pick([2,3,-2]),k=pick([6,7,8]);var bk=b1*Math.pow(q,k-1);if(Math.abs(bk)>200000)continue;
  return {q:'Геометр прогрессийн $b_1='+b1+',\\ q='+q+'$ бол $b_{'+k+'}$-г ол.',a:'$b_{'+k+'}=b_1 q^{n-1}='+b1+'\\cdot'+pn(q)+'^{'+(k-1)+'}='+bk+'$'};}return null;}
function e_gpTwo(){for(var t=0;t<200;t++){var b1=pick([1,2,3,-2]),q=pick([2,3,-2]),m=rnd(1,3),diff=pick([1,3,5]);var n=m+diff;var bm=b1*Math.pow(q,m-1),bn=b1*Math.pow(q,n-1);if(Math.abs(bn)>100000)continue;
  return {q:'Геометр прогрессийн $b_{'+m+'}='+bm+',\\ b_{'+n+'}='+bn+'$ бол $q$ ба $b_1$-г ол.',a:'$q^{'+(n-m)+'}=\\dfrac{'+bn+'}{'+bm+'}='+(bn/bm)+'\\Rightarrow q='+q+'$; $b_1='+b1+'$'};}return null;}
function e_gpSum(){for(var t=0;t<200;t++){var b1=pick([1,2,3]),q=pick([2,3,-2]),n=pick([5,6,7]);var Sn=b1*(Math.pow(q,n)-1)/(q-1);if(Math.abs(Sn)>500000)continue;
  return {q:'Геометр прогрессийн $b_1='+b1+',\\ q='+q+'$ бол $S_{'+n+'}$-г ол.',a:'$S_n=\\dfrac{b_1(q^n-1)}{q-1}=\\dfrac{'+b1+'('+Math.pow(q,n)+'-1)}{'+(q-1)+'}='+Sn+'$'};}return null;}
function e_gpMean(){var b1=pick([2,3,4,5,-2,-3]),q=pick([2,3]);var A=b1,B=b1*q*q,x=b1*q;
 return {q:'$'+A+',\\ x,\\ '+B+'$ тоонууд геометр прогресс үүсгэдэг бол $x$-г ол.',a:'$x^2='+A+'\\cdot'+B+'='+(A*B)+'\\Rightarrow x=\\pm'+Math.abs(x)+'$'};}
function e_word(){var mode=pick(['ap','gp']);
 if(mode==='ap'){var A=rnd(12,20),D=rnd(1,3),N=pick([10,12,15]);var aN=A+(N-1)*D,SN=N*(A+aN)/2;
   return {q:'Танхимын эхний эгнээнд $'+A+'$ суудал, дараа эгнээ бүрд $'+D+'$-аар нэмэгддэг. $'+N+'$ эгнээнд нийт хэдэн суудал вэ?',a:'$a_{'+N+'}='+aN+'$; $S_{'+N+'}=\\dfrac{'+A+'+'+aN+'}{2}\\cdot'+N+'='+SN+'$ суудал'};}
 var N2=pick([100,200]),q=pick([2,3]),k=pick([4,5]);var res=N2*Math.pow(q,k);
 return {q:'$'+N2+'$ бактери цаг тутам $'+q+'$ дахин нэмэгддэг бол $'+k+'$ цагийн дараа хэд болох вэ?',a:'$'+N2+'\\cdot'+q+'^{'+k+'}='+res+'$ бактери'};}
// ── Жишиг даалгаврын бүтэц ──
var EXAM={title:'IV бүлэг — Жишиг даалгавар 2',sub:'Дараалал ба прогресс: рекуррент · арифметик прогресс (систем·дундаж·нийлбэр) · геометр прогресс (4.1–4.3)',
  tasks:[e_recur,e_apTwo,e_apMean,e_apSum,e_gpMean,e_gpTwo,e_gpSum,e_word],
  points:[12,13,12,13,12,13,13,12]};
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f)return f;}return null;}
function build(){window.__P=EXAM.tasks.map(function(fn){return gen(fn);});layout();}
function layout(){var WK=document.getElementById('sw').checked;var P=window.__P||(window.__P=EXAM.tasks.map(function(fn){return gen(fn);}));
  var total=EXAM.points.reduce(function(a,b){return a+b;},0);
  var qs2=P.map(function(f,i){return '<div class="q"><div class="qh"><span class="ql">'+(i+1)+'.</span><span class="qm">'+f.q+'</span><span class="pts">'+EXAM.points[i]+' оноо</span></div>'+(WK?'<div class="wk"></div>':'')+'</div>';}).join('');
  var ans=P.map(function(f,i){return '<div class="a"><span class="an">'+(i+1)+'.</span>'+f.a+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>'+EXAM.title+'</h1><div class="sub">'+EXAM.sub+' · 11-р анги · Нийт '+total+' оноо</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="col1">'+qs2+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE=EXAM.title;
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
