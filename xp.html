<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>500 XP — Уналтын тоглоом</title>
<meta name="description" content="Математикийн бодлогыг буруу хариулах бүрд XP уна. Анх 500 XP-тэй эхэлж, эцэст нь хичнээн үлдсэнээ хар.">
<meta property="og:title" content="500 XP — Уналтын тоглоом">
<meta property="og:description" content="Анх 500 XP. Буруу хариулах бүрт уна. Хэр чадварлаг вэ?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Inter', sans-serif;
    background:#020a0a;
    color:#fff;
    overflow-x:hidden;
    background-image:
      radial-gradient(ellipse at top left, rgba(240,193,75,0.08), transparent 40%),
      radial-gradient(ellipse at bottom right, rgba(154,220,255,0.06), transparent 40%);
    background-attachment:fixed;
  }

  /* Falling number background */
  .bg-numbers {
    position:fixed; inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .bg-n {
    position:absolute;
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    color:#f0c14b;
    opacity:0.04;
    user-select:none;
    animation:fallDown linear infinite;
  }
  @keyframes fallDown {
    from { transform:translateY(-100px); }
    to { transform:translateY(110vh); }
  }

  .wrap {
    position:relative;
    z-index:1;
    max-width:1100px;
    margin:0 auto;
    padding:32px 24px 60px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .top {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:32px;
  }
  .logo {
    font-family:'Bebas Neue', sans-serif;
    font-size:1.7rem;
    color:#f0c14b;
    letter-spacing:4px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo::before {
    content:'';
    width:10px; height:10px;
    background:#f0c14b;
    border-radius:50%;
    box-shadow:0 0 14px #f0c14b;
    animation:pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.6; transform:scale(1.3); }
  }
  .top-link {
    font-size:0.78rem;
    font-weight:700;
    color:#9adcff;
    text-decoration:none;
    letter-spacing:1px;
    opacity:0.7;
  }
  .top-link:hover { opacity:1; }

  .hero {
    text-align:center;
    margin-bottom:48px;
  }
  .hero-xp {
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    font-size:11rem;
    line-height:1;
    color:#f0c14b;
    text-shadow:0 0 80px rgba(240,193,75,0.5);
    letter-spacing:-4px;
    margin-bottom:6px;
    animation:gentleGlow 3s ease-in-out infinite;
  }
  @keyframes gentleGlow {
    0%,100% { text-shadow:0 0 60px rgba(240,193,75,0.3); }
    50% { text-shadow:0 0 100px rgba(240,193,75,0.6), 0 0 40px rgba(240,193,75,0.4); }
  }
  .hero-title {
    font-family:'Bebas Neue', sans-serif;
    font-size:3.6rem;
    color:#fff;
    letter-spacing:8px;
    margin-bottom:16px;
  }
  .hero-tagline {
    max-width:520px;
    margin:0 auto;
    font-size:1.05rem;
    color:#a8c2c2;
    line-height:1.55;
    font-weight:500;
  }
  .hero-tagline b { color:#f0c14b; font-weight:800; }

  .rules {
    background:rgba(15,30,30,0.55);
    border:1px solid rgba(240,193,75,0.15);
    border-radius:16px;
    padding:18px 22px;
    max-width:560px;
    margin:32px auto;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:18px;
    backdrop-filter:blur(8px);
  }
  .rule {
    text-align:center;
  }
  .rule-num {
    font-family:'JetBrains Mono', monospace;
    font-size:1.6rem;
    font-weight:800;
    color:#f0c14b;
    line-height:1;
    margin-bottom:4px;
  }
  .rule-lbl {
    font-size:0.7rem;
    font-weight:700;
    color:#88a0a0;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .grade-section {
    margin-top:24px;
    text-align:center;
  }
  .grade-label {
    font-family:'Bebas Neue', sans-serif;
    font-size:1.4rem;
    color:#fff;
    letter-spacing:6px;
    margin-bottom:20px;
    opacity:0.9;
  }
  .grade-label::before, .grade-label::after {
    content:'—';
    margin:0 10px;
    opacity:0.4;
    color:#f0c14b;
  }
  .grade-grid {
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    max-width:760px;
    margin:0 auto;
  }
  .grade-btn {
    background:#0a1f1f;
    border:2px solid rgba(240,193,75,0.3);
    border-radius:16px;
    padding:28px 16px;
    color:#fff;
    font-family:inherit;
    cursor:pointer;
    text-align:center;
    transition:transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
    position:relative;
    overflow:hidden;
  }
  .grade-btn:hover {
    transform:translateY(-4px);
    border-color:#f0c14b;
    background:#11272a;
    box-shadow:0 16px 40px rgba(240,193,75,0.18);
  }
  .grade-btn::before {
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 0%, rgba(240,193,75,0.15), transparent 70%);
    opacity:0;
    transition:opacity 0.15s;
  }
  .grade-btn:hover::before { opacity:1; }
  .grade-emoji {
    font-size:2.6rem;
    line-height:1;
    margin-bottom:10px;
    display:block;
  }
  .grade-range {
    font-family:'Bebas Neue', sans-serif;
    font-size:2rem;
    color:#f0c14b;
    letter-spacing:3px;
    line-height:1;
    margin-bottom:4px;
  }
  .grade-name {
    font-size:0.86rem;
    font-weight:700;
    color:#a8c2c2;
    letter-spacing:1px;
  }
  .grade-diff {
    margin-top:10px;
    font-size:0.74rem;
    color:#88a0a0;
    font-weight:600;
  }

  .footer {
    text-align:center;
    margin-top:60px;
    padding-top:30px;
    border-top:1px solid rgba(255,255,255,0.05);
    font-size:0.74rem;
    color:#5a7070;
    letter-spacing:1px;
  }
  .footer a { color:#9adcff; text-decoration:none; font-weight:700; }

  @media (max-width:760px) {
    .hero-xp { font-size:6.5rem; }
    .hero-title { font-size:2.2rem; letter-spacing:4px; }
    .hero-tagline { font-size:0.92rem; }
    .rules { grid-template-columns:1fr; gap:10px; padding:14px; }
    .grade-grid { grid-template-columns:1fr; }
    .grade-btn { padding:22px 14px; }
    .wrap { padding:20px 16px 40px; }
  }
</style>
</head>
<body>

<div class="bg-numbers" id="bg-host"></div>

<div class="wrap">
  <div class="top">
    <div class="logo">500 XP DROP</div>
    <a href="https://cybermath.mn" class="top-link">cybermath.mn ↗</a>
  </div>

  <div class="hero">
    <div class="hero-xp">500</div>
    <div class="hero-title">XP-НЫ УНАЛТ</div>
    <div class="hero-tagline">
      Та <b>500 XP</b>-тэй эхэлнэ. Математикийн бодлогуудыг <b>буруу</b> хариулах бүрд XP уна. Зөв хариулах тусам ялалт. Эцэст нь хэдийг үлдээж чадах вэ?
    </div>
  </div>

  <div class="rules">
    <div class="rule">
      <div class="rule-num">500</div>
      <div class="rule-lbl">Эхлэх XP</div>
    </div>
    <div class="rule">
      <div class="rule-num">−50</div>
      <div class="rule-lbl">Алдаа бүрд</div>
    </div>
    <div class="rule">
      <div class="rule-num">10</div>
      <div class="rule-lbl">Асуулт</div>
    </div>
  </div>

  <div class="grade-section">
    <div class="grade-label">АНГИА СОНГОНО УУ</div>
    <div class="grade-grid">
      <button class="grade-btn" onclick="pickGrade('low')">
        <span class="grade-emoji">🌱</span>
        <div class="grade-range">1—5</div>
        <div class="grade-name">АНГИ</div>
        <div class="grade-diff">Үндсэн арифметик</div>
      </button>
      <button class="grade-btn" onclick="pickGrade('mid')">
        <span class="grade-emoji">⚡</span>
        <div class="grade-range">6—9</div>
        <div class="grade-name">АНГИ</div>
        <div class="grade-diff">Алгебр, геометрийн суурь</div>
      </button>
      <button class="grade-btn" onclick="pickGrade('high')">
        <span class="grade-emoji">🔥</span>
        <div class="grade-range">10—12</div>
        <div class="grade-name">АНГИ</div>
        <div class="grade-diff">Дээд тооцоо, ЭЕШ</div>
      </button>
    </div>
  </div>

  <div class="footer">
    Powered by <a href="https://cybermath.mn">CyberMath</a> · © 2026
  </div>
</div>

<script>
  // Falling background numbers (decorative)
  (function(){
    const host = document.getElementById('bg-host');
    function spawn() {
      const el = document.createElement('div');
      el.className = 'bg-n';
      el.textContent = Math.floor(Math.random() * 900 + 100);
      el.style.left = (Math.random() * 100) + '%';
      el.style.fontSize = (1.5 + Math.random() * 4) + 'rem';
      const dur = 8 + Math.random() * 14;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (Math.random() * dur * -1) + 's';
      host.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 500);
    }
    for (let i = 0; i < 30; i++) spawn();
    setInterval(spawn, 800);
  })();

  function pickGrade(grade) {
    // Анги хадгалах (тоглоомд дамжуулна)
    try { localStorage.setItem('xpdrop_grade', grade); } catch(e) {}
    // Тоглоом руу шилжих
    location.href = 'xpdrop.html?grade=' + encodeURIComponent(grade);
  }
</script>

</body>
</html>
