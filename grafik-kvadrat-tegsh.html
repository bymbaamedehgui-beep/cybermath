<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Графикаас квадрат функцийн тэгшитгэл</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--curve:#e11d48}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:12px;text-align:center}
  .legend{font-size:10.5px;color:var(--soft);text-align:center;margin-bottom:8px}
  .legend b.v{color:#7c3aed}.legend b.p{color:#d97706}
  .pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
  .q{break-inside:avoid;page-break-inside:avoid;text-align:center}
  .qn{font-weight:800;color:var(--purple);font-size:13px;display:block;text-align:left;margin-bottom:1px}
  svg.gr{width:100%;max-width:52mm;aspect-ratio:1/1;height:auto;background:#fff;border:1px solid #e7ddff;border-radius:4px}
  .eqline{font-size:13px;margin-top:3px}.bl{display:inline-block;min-width:62px;border-bottom:1.3px solid #b9b0d8;height:14px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
  .a{text-align:center;font-size:11px}.a .af{font-size:14px;margin-bottom:1px}.a .ai{color:var(--soft);font-size:10px;margin-top:2px}
  svg.grs{width:100%;max-width:44mm;aspect-ratio:1/1;height:auto;background:#fff;border:1px solid #eee;border-radius:4px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var VB=200,W={xmin:-6,xmax:6,ymin:-6,ymax:6};
function X(x){return (x-W.xmin)/(W.xmax-W.xmin)*VB;}
function Y(y){return VB-(y-W.ymin)/(W.ymax-W.ymin)*VB;}
function grid(){
  var g='',i;
  for(i=W.xmin;i<=W.xmax;i++){var px=X(i);g+='<line x1="'+px.toFixed(1)+'" y1="0" x2="'+px.toFixed(1)+'" y2="'+VB+'" stroke="'+(i===0?'#555':'#e8e2f7')+'" stroke-width="'+(i===0?1.3:0.6)+'"/>';}
  for(i=W.ymin;i<=W.ymax;i++){var py=Y(i);g+='<line x1="0" y1="'+py.toFixed(1)+'" x2="'+VB+'" y2="'+py.toFixed(1)+'" stroke="'+(i===0?'#555':'#e8e2f7')+'" stroke-width="'+(i===0?1.3:0.6)+'"/>';}
  var y0=Y(0),x0=X(0);
  for(i=W.xmin;i<=W.xmax;i++){if(i!==0&&i%2===0)g+='<text x="'+(X(i)+1).toFixed(1)+'" y="'+(y0+9).toFixed(1)+'" font-size="8" fill="#999">'+i+'</text>';}
  for(i=W.ymin;i<=W.ymax;i++){if(i!==0&&i%2===0)g+='<text x="'+(x0+3).toFixed(1)+'" y="'+(Y(i)+3).toFixed(1)+'" font-size="8" fill="#999">'+i+'</text>';}
  g+='<text x="'+(VB-9)+'" y="'+(y0-3).toFixed(1)+'" font-size="10" font-style="italic" fill="#666">x</text>';
  g+='<text x="'+(x0+4).toFixed(1)+'" y="11" font-size="10" font-style="italic" fill="#666">y</text>';
  return g;
}
function curve(f){
  var d='',pen=false,step=0.03;
  for(var x=W.xmin;x<=W.xmax+1e-9;x+=step){
    var y=f(x);
    if(y<W.ymin||y>W.ymax){pen=false;continue;}
    d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)+' ';pen=true;
  }
  return '<path d="'+d+'" fill="none" stroke="var(--curve)" stroke-width="2"/>';
}
function dot(px,py,col,guide){
  var cx=X(px),cy=Y(py),s='';
  if(guide){s+='<line x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="'+col+'" stroke-width="0.8" stroke-dasharray="3 2"/>';
    s+='<line x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+X(0).toFixed(1)+'" y2="'+cy.toFixed(1)+'" stroke="'+col+'" stroke-width="0.8" stroke-dasharray="3 2"/>';}
  s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3.1" fill="'+col+'"/>';
  return s;
}
function vtex(a,h,k){
  var sx=(h===0)?'x':('(x'+(h>0?'-'+h:'+'+(-h))+')');
  var ac=(a===1?'':(a===-1?'-':''+a));
  var t=ac+sx+'^2';
  if(k>0)t+='+'+k;else if(k<0)t+='-'+(-k);
  return 'y = '+t;
}
function genOne(){
  var a=pick([-2,-1,-1,1,1,2]),h=rnd(-3,3),k=rnd(-3,3);
  var f=function(x){return a*(x-h)*(x-h)+k;};
  return {a:a,h:h,k:k,f:f,label:vtex(a,h,k),p2:[h+1,k+a]};
}
function build(){
  var probs='',answs='',items=[],seen={};
  for(var i=0;i<12;i++){
    var e,tr=0;do{e=genOne();tr++;}while(seen[e.label]&&tr<50);seen[e.label]=1;var n=i+1;
    probs+='<div class="q"><span class="qn">'+n+'.</span>'
      +'<svg class="gr" viewBox="0 0 '+VB+' '+VB+'">'+grid()+curve(e.f)+dot(e.p2[0],e.p2[1],'#d97706',true)+dot(e.h,e.k,'#7c3aed',true)+'</svg>'
      +'<div class="eqline">$y=$ <span class="bl"></span></div></div>';
    answs+='<div class="a"><div class="af"><span class="an">'+n+'.</span> $'+e.label+'$</div>'
      +'<svg class="grs" viewBox="0 0 '+VB+' '+VB+'">'+grid()+curve(e.f)+dot(e.p2[0],e.p2[1],'#d97706',false)+dot(e.h,e.k,'#7c3aed',false)+'</svg>'
      +'<div class="ai">Орой ('+e.h+', '+e.k+') · a = '+e.p2[1]+' − '+e.k+' = '+e.a+'</div></div>';
    items.push({q:'график',a:e.label});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Графикаас квадрат функцийн тэгшитгэл</h1><div class="sub">Парабол · орой ба нэг цэгээр $a$-г ол · оройн хэлбэр · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Орой $(h,k)$-г уншина · оройгоос 1 нэгж хажуугийн цэгээр $a=y-k$ · дараа нь $y=a(x-h)^2+k$ бич</div>'
    +'<div class="legend"><b class="v">● ягаан</b> — орой $(h,k)$ &nbsp;·&nbsp; <b class="p">● улбар шар</b> — тусламжийн цэг $(h+1,\\ k+a)$</div>'
    +'<div class="pgrid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="agrid">'+answs+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Графикаас квадрат функцийн тэгшитгэл';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=39"></script>
</body>
</html>
