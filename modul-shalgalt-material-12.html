<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var OL=['А','Б','В','Г'];
var SYM={lt:'<',le:'\\le',gt:'>',ge:'\\ge'};
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function reduce(r){var p=r.p,q=r.q;if(q<0){p=-p;q=-q;}var g=gcd(p,q);return {p:p/g,q:q/g};}
function fr(p,q){var r=reduce({p:p,q:q});if(r.q===1)return ''+r.p;return (r.p<0?'-':'')+'\\dfrac{'+Math.abs(r.p)+'}{'+r.q+'}';}
function lin(a,b){var s;if(a===1)s='x';else if(a===-1)s='-x';else s=a+'x';if(b>0)s+='+'+b;else if(b<0)s+='-'+(-b);return s;}
// ── Тоон завсрын алгебр ──
function EP(p,q){var r=reduce({p:p,q:q});return {inf:0,p:r.p,q:r.q};}
var NINF={inf:-1},PINF={inf:1},ZERO=EP(0,1);
function epVal(e){return e.inf<0?-Infinity:(e.inf>0?Infinity:e.p/e.q);}
function mkI(a,ao,b,bo){return {a:a,ao:ao,b:b,bo:bo};}
function sortMerge(list){
  list=list.filter(function(I){var lv=epVal(I.a),rv=epVal(I.b);if(lv<rv)return true;if(lv>rv)return false;return !I.ao&&!I.bo;});
  list.sort(function(a,b){return epVal(a.a)-epVal(b.a)||((a.ao?1:0)-(b.ao?1:0));});
  var out=[];
  list.forEach(function(I){
    if(!out.length){out.push({a:I.a,ao:I.ao,b:I.b,bo:I.bo});return;}
    var last=out[out.length-1],lrv=epVal(last.b),ilv=epVal(I.a);
    if(ilv<lrv||(ilv===lrv&&(!I.ao||!last.bo))){var irv=epVal(I.b);if(irv>lrv||(irv===lrv&&!I.bo)){last.b=I.b;last.bo=I.bo;}}
    else out.push({a:I.a,ao:I.ao,b:I.b,bo:I.bo});
  });
  return out;
}
function intersect(S1,S2){
  var out=[];
  S1.forEach(function(i){S2.forEach(function(j){
    var v1=epVal(i.a),v2=epVal(j.a),L,lo;
    if(v1>v2){L=i.a;lo=i.ao;}else if(v2>v1){L=j.a;lo=j.ao;}else{L=i.a;lo=i.ao||j.ao;}
    var w1=epVal(i.b),w2=epVal(j.b),R,ro;
    if(w1<w2){R=i.b;ro=i.bo;}else if(w2<w1){R=j.b;ro=j.bo;}else{R=i.b;ro=i.bo||j.bo;}
    var lv=epVal(L),rv=epVal(R);
    if(lv<rv||(lv===rv&&!lo&&!ro))out.push(mkI(L,lo,R,ro));
  });});
  return sortMerge(out);
}
function union(S1,S2){return sortMerge(S1.concat(S2));}
function inSet(S,x){for(var i=0;i<S.length;i++){var I=S[i],lv=epVal(I.a),rv=epVal(I.b);var okL=x>lv||(x===lv&&!I.ao),okR=x<rv||(x===rv&&!I.bo);if(okL&&okR)return true;}return false;}
function fmtInterval(I){
  if(I.a.inf===0&&I.b.inf===0&&(I.a.p/I.a.q)===(I.b.p/I.b.q))return '\\{'+fr(I.a.p,I.a.q)+'\\}';
  var lb=I.a.inf<0?']':(I.ao?']':'['),rb=I.b.inf>0?'[':(I.bo?'[':']');
  var lv=I.a.inf<0?'-\\infty':fr(I.a.p,I.a.q),rv=I.b.inf>0?'+\\infty':fr(I.b.p,I.b.q);
  return lb+lv+';\\,'+rv+rb;
}
function fmtSet(S){
  if(!S.length)return '\\varnothing';
  if(S.length===1&&S[0].a.inf<0&&S[0].b.inf>0)return 'x\\in\\mathbb{R}';
  return 'x\\in '+S.map(fmtInterval).join('\\cup ');
}
function solveLinRel(m,n,rel){
  if(m===0){var ok=(rel==='gt'?n>0:rel==='ge'?n>=0:rel==='lt'?n<0:n<=0);return ok?[mkI(NINF,true,PINF,true)]:[];}
  var x0=EP(-n,m),strict=(rel==='gt'||rel==='lt'),greater=(rel==='gt'||rel==='ge');
  var upper=(m>0)?greater:!greater;
  if(upper)return [mkI(x0,strict,PINF,true)];
  return [mkI(NINF,true,x0,strict)];
}
function solveProdRel(P1,P0,Q1,Q0,rel){
  var sp=(rel==='gt'||rel==='lt')?'gt':'ge', sn=(rel==='gt'||rel==='lt')?'lt':'le';
  var sameSign=(rel==='gt'||rel==='ge');
  var Pp=solveLinRel(P1,P0,sp),Pn=solveLinRel(P1,P0,sn),Qp=solveLinRel(Q1,Q0,sp),Qn=solveLinRel(Q1,Q0,sn);
  if(sameSign)return union(intersect(Pp,Qp),intersect(Pn,Qn));
  return union(intersect(Pp,Qn),intersect(Pn,Qp));
}
function flip(rel){return {lt:'gt',le:'ge',gt:'lt',ge:'le'}[rel];}
function strictify(rel){return {lt:'le',le:'lt',gt:'ge',ge:'gt'}[rel];}
function solveBothAbs(k1,A,B,k2,C,D,rel){
  var P1=k1*A-k2*C,P0=k1*B-k2*D,Q1=k1*A+k2*C,Q0=k1*B+k2*D;
  if((P1===0&&P0===0)||(Q1===0&&Q0===0))return null;
  return solveProdRel(P1,P0,Q1,Q0,rel);
}
function solveBothEq(k1,A,B,k2,C,D){
  var P1=k1*A-k2*C,P0=k1*B-k2*D,Q1=k1*A+k2*C,Q0=k1*B+k2*D;
  if((P1===0&&P0===0)||(Q1===0&&Q0===0))return {all:true};
  var rs=[]; if(P1!==0)rs.push(EP(-P0,P1)); if(Q1!==0)rs.push(EP(-Q0,Q1));
  var uniq=[],seen={};
  rs.forEach(function(e){var k=e.p+'/'+e.q;if(!seen[k]){seen[k]=1;uniq.push(e);}});
  uniq.sort(function(a,b){return a.p/a.q-b.p/b.q;});
  return {all:false,roots:uniq};
}
function solveAbsEqLin(m,n,C,D){
  var cands=[];
  if(m-C!==0 && (m*D-n*C)*(m-C)>=0) cands.push(EP(D-n,m-C));
  if(m+C!==0 && (n*C-m*D)*(m+C)<0)  cands.push(EP(-(n+D),m+C));
  var uniq=[],seen={};
  cands.forEach(function(e){var k=e.p+'/'+e.q;if(!seen[k]){seen[k]=1;uniq.push(e);}});
  uniq.sort(function(a,b){return a.p/a.q-b.p/b.q;});
  return uniq;
}
function isqrt(n){if(n<0)return -1;var s=Math.round(Math.sqrt(n));return s*s===n?s:-1;}
function quadCoef(a2){
  for(var it=0;it<400;it++){var b2=nz(-9,9),c2=rnd(-14,14);if(c2===0&&Math.abs(b2)<2)continue;
    var disc=b2*b2-4*a2*c2;var s=isqrt(disc);if(s<0)continue;var den=2*a2,r1=EP(-b2-s,den),r2=EP(-b2+s,den);
    if(epVal(r2)<0)continue;return {a2:a2,b2:b2,c2:c2,r1:r1,r2:r2};}
  return null;
}
function solveQuadAbsEq(r1,r2){var roots=[];[r1,r2].forEach(function(r){var v=epVal(r);if(v<0)return;if(v===0)roots.push(EP(0,1));else{roots.push(r);roots.push(EP(-r.p,r.q));}});
  var uniq=[],seen={};roots.forEach(function(e){var k=e.p+'/'+e.q;if(!seen[k]){seen[k]=1;uniq.push(e);}});uniq.sort(function(a,b){return a.p/a.q-b.p/b.q;});return uniq;}
// ── Форматлагч ──
function joinSum(terms){terms=terms.filter(function(x){return x;});if(!terms.length)return '0';var out='';terms.forEach(function(t,i){if(i===0)out+=(t.sign<0?'-':'')+t.tex;else out+=(t.sign<0?' - ':' + ')+t.tex;});return out;}
function tTerm(coef,base){if(coef===0)return null;return {sign:coef<0?-1:1,tex:(Math.abs(coef)===1?'':Math.abs(coef))+base};}
function cTerm(c){if(c===0)return null;return {sign:c<0?-1:1,tex:''+Math.abs(c)};}
function quadTex(A,B,C){return joinSum([tTerm(A,'x^2'),tTerm(B,'x'),cTerm(C)]);}
function quadAbsTex(A,B,C){return joinSum([tTerm(A,'x^2'),tTerm(B,'\\left|x\\right|'),cTerm(C)]);}
function setDisc(list){if(!list.length)return '\\varnothing';var s=list.slice().sort(function(a,b){return a.p/a.q-b.p/b.q;});return 'x\\in\\left\\{'+s.map(function(e){return fr(e.p,e.q);}).join(';\\,')+'\\right\\}';}
function canonDisc(list){return list.slice().sort(function(a,b){return a.p/a.q-b.p/b.q;}).map(function(e){return e.p+'/'+e.q;}).join('|');}
// ── MCQ угсрагчид ──
function makeMCdisc(correct,distrs){
  var used={},opts=[{tex:setDisc(correct),ok:true,list:correct}];used[canonDisc(correct)]=1;
  for(var i=0;i<distrs.length&&opts.length<4;i++){var c=canonDisc(distrs[i]);if(!used[c]){used[c]=1;opts.push({tex:setDisc(distrs[i]),ok:false,list:distrs[i]});}}
  if(opts.length<4)return null;return finishMC(opts,'disc');
}
function makeMCintv(correct,distrs){
  var used={},opts=[{tex:fmtSet(correct),ok:true,set:correct}];used[fmtSet(correct)]=1;
  for(var i=0;i<distrs.length&&opts.length<4;i++){var c=fmtSet(distrs[i]);if(!used[c]){used[c]=1;opts.push({tex:fmtSet(distrs[i]),ok:false,set:distrs[i]});}}
  if(opts.length<4)return null;return finishMC(opts,'intv');
}
function makeMCplain(correctTex,distrTexs){
  var used={},opts=[{tex:correctTex,ok:true}];used[correctTex]=1;
  for(var i=0;i<distrTexs.length&&opts.length<4;i++){if(!used[distrTexs[i]]){used[distrTexs[i]]=1;opts.push({tex:distrTexs[i],ok:false});}}
  if(opts.length<4)return null;return finishMC(opts,'plain');

function finishMC(opts,kind){var sh=shuffle(opts),ci=-1;for(var i=0;i<sh.length;i++)if(sh[i].ok)ci=i;return {opts:sh,correct:ci,kind:kind};}
// ── Тест генераторууд (stem + MCQ) ──
function tValue(){var a=nz(-9,9),b=nz(-9,9),val=Math.abs(a)-Math.abs(b);
  var mc=makeMCplain(''+val,[''+(a-b),''+(b-a),''+Math.abs(a-b),''+(-val),''+(Math.abs(a)+Math.abs(b)),''+(-(Math.abs(a)+Math.abs(b)))]);if(!mc)return null;
  var as=(a<0?'('+a+')':a),bs=(b<0?'('+b+')':b);
  return {stem:'$\\left|'+as+'\\right| - \\left|'+bs+'\\right|$ илэрхийллийн утга:',mc:mc};
}
function tSimplify(){var a=pick([1,2,3]),b=nz(-6,6);
  var mc=makeMCplain('\\left|'+lin(a,b)+'\\right|',['\\left('+lin(a,b)+'\\right)^2',lin(a,b),'\\left|'+lin(a,0)+'\\right|+'+Math.abs(b)]);if(!mc)return null;
  return {stem:'$\\sqrt{'+quadTex(a*a,2*a*b,b*b)+'}$ илэрхийллийг хялбарчил:',mc:mc};
}
function tEqConst(){var a=pick([1,2,3]),b=nz(-8,8),c=rnd(2,12);
  var cor=[EP(c-b,a),EP(-c-b,a)];
  var mc=makeMCdisc(cor,[[EP(c-b,a)],[EP(c-b,a),EP(c+b,a)],[EP(b-c,a),EP(b+c,a)],[EP(-c-b,a)]]);if(!mc)return null;
  return {stem:'$\\left|'+lin(a,b)+'\\right| = '+c+'$ тэгшитгэлийн шийд:',mc:mc};
}
function tAbsAbs(){var a=nz(-3,3),b=nz(-8,8),c=nz(-3,3),d=nz(-8,8);if(a===c&&b===d)return null;if(a===-c&&b===-d)return null;
  var r=solveBothEq(1,a,b,1,c,d);if(r.all||r.roots.length<2)return null;
  var r0=r.roots[0],r1=r.roots[1];
  var neg=[EP(-r0.p,r0.q),EP(-r1.p,r1.q)];
  var shift=[r0,EP(r1.p+r1.q,r1.q)];
  var mc=makeMCdisc(r.roots,[[r0],[r1],neg,shift]);if(!mc)return null;
  return {stem:'$\\left|'+lin(a,b)+'\\right| = \\left|'+lin(c,d)+'\\right|$ тэгшитгэлийн шийд:',mc:mc};
}
function tQuad(){var qc=quadCoef(1);if(!qc)return null;var cor=solveQuadAbsEq(qc.r1,qc.r2);if(cor.length<2)return null;
  var tvals=[qc.r1,qc.r2].filter(function(e){return epVal(e)>=0;});
  var onlyPlus=cor.filter(function(e){return e.p>=0;});
  var allpm=[];[qc.r1,qc.r2].forEach(function(e){allpm.push(e);allpm.push(EP(-e.p,e.q));});
  var big=cor[cor.length-1],shift=[cor[0],EP(big.p+big.q,big.q)];
  var mc=makeMCdisc(cor,[tvals,onlyPlus,allpm,[big],shift]);if(!mc)return null;
  return {stem:'$'+quadAbsTex(qc.a2,qc.b2,qc.c2)+' = 0$ тэгшитгэлийн шийд:',mc:mc};
}
function tCount(){var a=pick([1,2,3]),b=nz(-7,7),C=nz(-3,3);if(C===a||C===-a)C=a+2;var D=rnd(-3,7);

  var mc=makeMCplain(''+n,['0','1','2','3'].filter(function(x){return x!==''+n;}));if(!mc)return null;

}
function tIneqConst(){var a=pick([1,2,3]),b=nz(-7,7),c=rnd(2,9),rel=pick(['lt','le','gt','ge']);

  var d1=solveBothAbs(1,a,b,1,0,c,flip(rel)),d2=solveBothAbs(1,a,b,1,0,c,strictify(rel)),d3=solveBothAbs(1,a,b,1,0,c+1,rel);
  var mc=makeMCintv(cor,[d1,d2,d3]);if(!mc)return null;
  return {stem:'$\\left|'+lin(a,b)+'\\right| '+SYM[rel]+' '+c+'$ тэнцэтгэл бишийн шийд:',mc:mc};
}
function tIneqAbsAbs(){var a=nz(-3,3),b=nz(-8,8),c=nz(-3,3),d=nz(-8,8),k=pick([1,1,2]);if(a===c*k&&b===d*k)return null;if(a===-c*k&&b===-d*k)return null;
  var rel=pick(['lt','le','gt','ge']),cor=solveBothAbs(1,a,b,k,c,d,rel);if(cor===null)return null;
  var d1=solveBothAbs(1,a,b,k,c,d,flip(rel)),d2=solveBothAbs(1,a,b,k,c,d,strictify(rel));
  var d3=solveBothAbs(1,a,b,k,c,d,flip(strictify(rel))),d4=solveBothAbs(1,a,b,k,c,d+(d>=0?1:-1),rel);
  var mc=makeMCintv(cor,[d1,d2,d3,d4]);if(!mc)return null;
  return {stem:'$\\left|'+lin(a,b)+'\\right| '+SYM[rel]+' '+(k===1?'':k)+'\\left|'+lin(c,d)+'\\right|$ тэнцэтгэл бишийн шийд:',mc:mc};
}
// ── Задгай даалгавар ──
function fEqLin(){var a=pick([1,2,3]),b=nz(-7,7),C=nz(-3,3);if(C===a||C===-a)C=a+2;var D=rnd(-3,6);
  var r=solveAbsEqLin(a,b,C,D);if(r.length<1)return null;
  return {stem:'$\\left|'+lin(a,b)+'\\right| = '+lin(C,D)+'$ тэгшитгэлийг бод.',a:setDisc(r)};}
function fIneq(){var a=pick([1,2,3]),b=nz(-8,8),c=rnd(2,9),rel=pick(['le','ge']),S=solveBothAbs(1,a,b,1,0,c,rel);
  return {stem:'$\\left|'+lin(a,b)+'\\right| '+SYM[rel]+' '+c+'$ тэнцэтгэл бишийг бодож, шийдийг тоон завсраар бич.',a:fmtSet(S)};}
function fQuad(){var qc=quadCoef(1);if(!qc)return null;var r=solveQuadAbsEq(qc.r1,qc.r2);if(r.length<2)return null;
  return {stem:'$'+quadAbsTex(qc.a2,qc.b2,qc.c2)+' = 0$ тэгшитгэлийг бод.',a:setDisc(r)};}
function fAbsAbs(){var a=nz(-3,3),b=nz(-8,8),c=nz(-3,3),d=nz(-8,8);if(a===c&&b===d)return null;if(a===-c&&b===-d)return null;
  var r=solveBothEq(1,a,b,1,c,d);if(r.all||!r.roots.length)return null;
  return {stem:'$\\left|'+lin(a,b)+'\\right| = \\left|'+lin(c,d)+'\\right|$ тэгшитгэлийг бод.',a:setDisc(r.roots)};}
var TESTS=[tValue,tSimplify,tEqConst,tAbsAbs,tQuad,tCount,tIneqConst,tIneqConst,tIneqAbsAbs,tEqConst];
var FREE=[fEqLin,fIneq,fQuad,fAbsAbs];
var TEST_PT=1, FREE_PT=[2,2,3,3];
var ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function totalPts(){return 10*TEST_PT+FREE_PT.reduce(function(s,v){return s+v;},0);}
function ptFmt(v){return (Math.round(v*100)/100).toString();}
function recomputeTotal(){var tot=0;
  [].forEach.call(document.querySelectorAll('#sheet .ptv'),function(el){var v=parseFloat((el.textContent||'').replace(',','.'));if(!isNaN(v))tot+=v;});
  var s=ptFmt(tot);
  [].forEach.call(document.querySelectorAll('#sheet .totmax'),function(el){el.textContent=s;});
}
function gen(fn){for(var t=0;t<200;t++){var g=fn();if(g)return g;}return null;}
// Сонголт урт бол тухайн бодлогыг 2 багана болгоно (А Б дээрээ, В Г доор)
function adjustOpts(){
  [].forEach.call(document.querySelectorAll('#sheet .opts'),function(op){
    op.classList.remove('two');
    var cells=op.children; if(!cells.length)return;
    var cellW=cells[0].clientWidth, need2=false;
    [].forEach.call(cells,function(o){
      var prev=o.getAttribute('style')||'';
      o.style.position='absolute';o.style.whiteSpace='nowrap';o.style.width='auto';o.style.visibility='hidden';
      var w=o.offsetWidth;
      o.setAttribute('style',prev);
      if(w>cellW+1)need2=true;
    });
    if(need2)op.classList.add('two');
  });
}
function build(){
  window.__TEST=[];window.__FREE=[];
  var testHtml='',akTest='',seen={};
  for(var i=0;i<10;i++){var g=null,tr=0;
    do{g=gen(TESTS[i]);tr++;}while(g&&seen[g.stem]&&tr<50);
    if(!g)continue;seen[g.stem]=1;window.__TEST.push(g);
    var opts=g.mc.opts.map(function(o,j){return '<div class="opt"><span class="ol">'+OL[j]+'.</span>$'+o.tex+'$</div>';}).join('');
    testHtml+='<div class="t-item"><div class="t-stem"><span class="pt"><b class="ptv" contenteditable="true">'+TEST_PT+'</b> оноо</span><span class="n">'+(i+1)+'.</span>'+g.stem+'</div><div class="opts">'+opts+'</div></div>';
    akTest+=(i>0?', ':'')+(i+1)+'-'+OL[g.mc.correct];
  }
  var freeHtml='',akFree='';
  for(var f=0;f<4;f++){var fg=gen(FREE[f]);if(!fg)continue;window.__FREE.push(fg);
    freeHtml+='<div class="free"><div class="fs"><span class="pt"><b class="ptv" contenteditable="true">'+FREE_PT[f]+'</b> оноо</span><span class="n">'+(11+f)+'.</span>'+fg.stem+'</div><div class="work"></div></div>';
    akFree+='<div class="ak"><span class="n">'+(11+f)+')</span> $'+fg.a+'$</div>';
  }
  var TOTAL=totalPts();
  var gRoman='<table class="gtbl"><tr><th>Тест</th>'+ROMAN.map(function(r){return '<td class="lab">'+r+'</td>';}).join('')+'</tr><tr><th>Оноо</th>'+ROMAN.map(function(){return '<td></td>';}).join('')+'</tr></table>';
  var gFree='<table class="gtbl"><tr><th>Задгай</th>'+FREE_PT.map(function(_,i){return '<td class="lab">2.'+(i+1)+'</td>';}).join('')+'</tr><tr><th>Оноо</th>'+FREE_PT.map(function(){return '<td></td>';}).join('')+'</tr></table>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Модул — Шалгалтын материал</h1><div class="sub">Модул агуулсан тэгшитгэл ба тэнцэтгэл биш · 12-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Хугацаа: </span><div class="score-top">Хувилбар: <b class="varv" contenteditable="true" data-ph="А"></b> · Оноо: <b class="totmax">'+TOTAL+'</b></div></div>'
    +'<div class="task">I. Сонголттой тест. Зөв хариуг сонгоно уу. (1–10)</div>'
    +testHtml
    +'<div class="task">II. Задгай даалгавар. Бодолтоо дэлгэрэнгүй бичнэ үү. (11–14)</div>'
    +freeHtml
    +'<div class="grade"><div class="gtitle">Багшийн засах хүснэгт — авсан оноо</div>'+gRoman+gFree+'<div class="gtot">Нийт авсан оноо: <u></u> / <b class="totmax">'+TOTAL+'</b> оноо</div></div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2>'
      +'<div class="ak"><span class="n">Тест:</span> '+akTest+'</div>'
      +'<div style="height:6px"></div><div class="ak" style="font-weight:800;color:#5a32d6">Задгай даалгавар:</div>'+akFree
    +'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Модул — Шалгалтын материал (12-р анги)';
  [].forEach.call(document.querySelectorAll('#sheet .ptv'),function(el){el.addEventListener('input',recomputeTotal);el.addEventListener('focus',function(){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);});});
  recomputeTotal();
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{adjustOpts();}catch(e){}
}
// ══════ Нэг загвараас олон хувилбар (зөвхөн шалгалтын материал) ══════
var VLET=['А','Б','В','Г','Д','Е','Ё','Ж','З','И','Й','К','Л','М','Н','О'];
function hugSpan(){return [].filter.call(document.querySelectorAll('#sheet .meta > span'),function(s){return /Хугацаа/.test(s.textContent);})[0]||null;}
function getHug(){var sp=hugSpan();if(!sp)return '';var f=sp.querySelector('.cm-fill');return ((f?f.textContent:sp.textContent.replace(/^[^:]*:?\s*/,''))||'').trim();}
function hugFill(){var sp=hugSpan();return sp?sp.querySelector('.cm-fill'):null;}
function snapPts(){return [].map.call(document.querySelectorAll('#sheet .ptv'),function(e){return e.textContent;});}
function injectVBatchCSS(){
  if(document.getElementById('cm-vbatch-css'))return;
  var st=document.createElement('style');st.id='cm-vbatch-css';
  st.textContent='@media print{body>*:not(#cm-vbatch){display:none!important}body>#cm-vbatch{display:block!important}'
    +'.cm-vsheet{page-break-after:always;box-shadow:none!important;width:auto!important;min-height:auto!important;margin:0!important;padding:0!important;background:#fff;zoom:1!important}'
    +'.cm-vsheet:last-child{page-break-after:auto}}';
  document.head.appendChild(st);
}
function openVariantModal(){
  if(document.getElementById('cm-vmodal'))return;
  var o=document.createElement('div');o.id='cm-vmodal';
  o.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(20,15,40,.6);display:grid;place-items:center;padding:16px;font-family:"Segoe UI",Arial,sans-serif';
  o.innerHTML='<div style="background:#fff;border-radius:16px;max-width:410px;width:100%;padding:20px;box-shadow:0 24px 60px -18px rgba(0,0,0,.5)">'
    +'<div style="font-weight:900;color:#5a32d6;font-size:1.06rem;margin-bottom:4px">Олон хувилбар гаргах</div>'
    +'<p style="color:#7a7390;font-size:.84rem;margin-bottom:12px;line-height:1.45">Одоогийн <b>загвараас</b> хэдэн хувилбар гаргах вэ? Бодлого нь хувилбар бүрт өөр, харин <b>Хугацаа ба оноо загвар дагуу хэвээр</b>. Хувилбар <b>А, Б, В…</b> автоматаар тавигдана. Бүгд нэг дор хэвлэгдэж, төгсгөлд нь хариун түлхүүр гарна.</p>'
    +'<label style="display:block;font-size:.85rem;font-weight:700;color:#3a2d5e;margin-bottom:5px">Хувилбарын тоо</label>'
    +'<input id="cm-vcount" type="number" min="1" max="16" value="4" style="width:100%;box-sizing:border-box;border:1.6px solid #e7ddff;border-radius:10px;padding:.55rem .8rem;font-size:1rem;font-weight:700;outline:none;font-family:inherit;margin-bottom:14px">'
    +'<div id="cm-vmsg" style="font-size:.82rem;color:#7a7390;margin-bottom:8px"></div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end">'
    +'<button id="cm-vcancel" style="border:1.4px solid #e7ddff;background:#faf7ff;color:#5a32d6;font-weight:800;border-radius:999px;padding:.5rem 1rem;cursor:pointer;font-family:inherit">Болих</button>'
    +'<button id="cm-vgo" style="display:inline-flex;align-items:center;gap:6px;border:0;background:linear-gradient(135deg,#7B52EE,#A855F7);color:#fff;font-weight:800;border-radius:999px;padding:.5rem 1.2rem;cursor:pointer;font-family:inherit">Гаргаж хэвлэх</button>'
    +'</div></div>';
  document.body.appendChild(o);
  var ci=o.querySelector('#cm-vcount');try{ci.focus();ci.select();}catch(e){}
  o.querySelector('#cm-vcancel').onclick=function(){o.remove();};
  o.querySelector('#cm-vgo').onclick=function(){var n=parseInt(ci.value,10);if(!n||n<1){o.querySelector('#cm-vmsg').style.color='#dc2626';o.querySelector('#cm-vmsg').textContent='Хувилбарын тоог зөв оруулна уу.';return;}o.remove();genVariants(n);};
}
function genVariants(N){
  if(!N||N<1)return; if(N>16)N=16;
  var sheet=document.getElementById('sheet');
  var hug=getHug(), pts=snapPts();
  var sa=document.getElementById('sa'); if(sa&&sa.checked){sa.checked=false;toggleAns();}
  var old=document.getElementById('cm-vbatch'); if(old)old.remove();
  var box=document.createElement('div');box.id='cm-vbatch';box.style.display='none';
  var keys=[];
  for(var i=0;i<N;i++){
    build();
    var tk=(window.__TEST||[]).map(function(g,idx){return (idx+1)+'-'+OL[g.mc.correct];}).join(', ');
    var fk=(window.__FREE||[]).map(function(f,idx){return {n:11+idx,a:f.a};});
    var clone=sheet.cloneNode(true);
    clone.removeAttribute('id');clone.classList.add('cm-vsheet');
    var ap=clone.querySelector('#answers,.ans-page');if(ap)ap.parentNode.removeChild(ap);
    var cptv=clone.querySelectorAll('.ptv'),tot=0;
    for(var k=0;k<cptv.length;k++){if(pts[k]!=null)cptv[k].textContent=pts[k];var v=parseFloat((cptv[k].textContent||'').replace(',','.'));if(!isNaN(v))tot+=v;cptv[k].removeAttribute('contenteditable');}
    [].forEach.call(clone.querySelectorAll('.totmax'),function(e){e.textContent=ptFmt(tot);});
    var hs=[].filter.call(clone.querySelectorAll('.meta > span'),function(s){return /Хугацаа/.test(s.textContent);})[0];
    if(hs)hs.textContent='Хугацаа: '+hug;
    var vv=clone.querySelector('.varv');if(vv){vv.textContent=VLET[i]||('#'+(i+1));vv.removeAttribute('contenteditable');}
    box.appendChild(clone);
    keys.push({letter:VLET[i]||('#'+(i+1)),tk:tk,fk:fk});
  }
  var keyHtml='<div class="sheet cm-vsheet"><div class="head"><h1>Хариун түлхүүр — бүх хувилбар</h1><div class="sub">Модул — Шалгалтын материал · 12-р анги</div></div>';
  keys.forEach(function(kr){
    keyHtml+='<div style="margin:9px 0;break-inside:avoid;border-left:3px solid #A855F7;padding-left:9px">'
      +'<div style="font-weight:800;color:#5a32d6;font-size:13.5px;margin-bottom:3px">Хувилбар '+kr.letter+'</div>'
      +'<div style="font-size:12px;margin-bottom:3px"><b>Тест:</b> '+kr.tk+'</div>'
      +'<div style="font-size:12px"><b>Задгай:</b> '+kr.fk.map(function(x){return x.n+') $'+x.a+'$';}).join(' &nbsp;·&nbsp; ')+'</div></div>';
  });
  keyHtml+='</div>';
  box.insertAdjacentHTML('beforeend',keyHtml);
  document.body.appendChild(box);
  injectVBatchCSS();
  try{renderMathInElement(box,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  function cleanup(){var b=document.getElementById('cm-vbatch');if(b)b.remove();window.removeEventListener('afterprint',cleanup);
    try{build();}catch(e){}
    var pv=document.querySelectorAll('#sheet .ptv');for(var k=0;k<pv.length;k++){if(pts[k]!=null)pv[k].textContent=pts[k];}
    try{recomputeTotal();}catch(e){}
    setTimeout(function(){var f=hugFill();if(f&&hug)f.textContent=hug;},80);
  }
  window.addEventListener('afterprint',cleanup);
  setTimeout(function(){window.print();},140);
}
build();
window.addEventListener('load',function(){try{adjustOpts();}catch(e){}});
window.addEventListener('beforeprint',function(){try{adjustOpts();}catch(e){}});
</script>
