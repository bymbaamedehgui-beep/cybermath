<script>
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
// ── V бүлэг exam — хуваалцах генераторын сан (jishig {q,a}) ──
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function sg(n){return n>=0?'+'+n:''+n;}
function pn(n){return n<0?'('+n+')':''+n;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
function g3norm(a,b,c){var g=gcd(gcd(a,b),c);if(!g)g=1;a/=g;b/=g;c/=g;var lead=a!==0?a:b;if(lead<0){a=-a;b=-b;c=-c;}return [a,b,c];}
function lineFmt(a,b,c){function v(k,nm){if(k===0)return '';var s=k>0?'+':'-',m=Math.abs(k);return s+(m===1?'':m)+nm;}var s=v(a,'x')+v(b,'y')+(c>0?'+'+c:c<0?'-'+(-c):'');s=s.replace(/^\+/,'');if(s==='')s='0';return s+'=0';}
function sqSimp(N){if(N===0)return '0';var out=1,r=N;for(var f=2;f*f<=r;f++){while(r%(f*f)===0){out*=f;r/=(f*f);}}if(r===1)return ''+out;return (out===1?'':out)+'\\sqrt{'+r+'}';}
function P2(A){return '('+A[0]+',\\ '+A[1]+')';}
function P3(A){return '('+A[0]+',\\ '+A[1]+',\\ '+A[2]+')';}
function sqT(b,a){return '('+b+'-'+pn(a)+')^2';}
function d2_2(A,B){var dx=B[0]-A[0],dy=B[1]-A[1];return dx*dx+dy*dy;}
function d2_3(A,B){var dx=B[0]-A[0],dy=B[1]-A[1],dz=B[2]-A[2];return dx*dx+dy*dy+dz*dz;}
var ROMANO=['I','II','III','IV','V','VI','VII','VIII'];
function octIdx(x,y,z){var sx=x>0,sy=y>0,sz=z>0;if(sz){if(sx&&sy)return 0;if(!sx&&sy)return 1;if(!sx&&!sy)return 2;return 3;}return sx&&sy?4:(!sx&&sy?5:(!sx&&!sy?6:7));}

// 1. 2D налалт
function j_slope(){var A=[nz(-6,6),nz(-6,6)],B=[nz(-6,6),nz(-6,6)];if(B[0]===A[0])return null;var dy=B[1]-A[1],dx=B[0]-A[0];
 return {q:'$A'+P2(A)+',\\ B'+P2(B)+'$ цэгээр дайрсан шулууны налалтыг ол.',a:'$m=\\dfrac{y_2-y_1}{x_2-x_1}=\\dfrac{'+dy+'}{'+dx+'}='+frTeX(dy,dx)+'$',key:'sl'+A+B};}
// 2. Нэг шулуун дээр орших y (цуг байх)
function j_collinearY(){var A=[nz(-5,5),nz(-5,5)],m=nz(-3,3),t=rnd(1,3),s=nz(-4,4);var B=[A[0]+t,A[1]+m*t],C=[A[0]+s,A[1]+m*s];
 if(s===0)return null;
 return {q:'$A'+P2(A)+',\\ B'+P2(B)+',\\ C('+C[0]+',\\ y)$ цэгүүд нэг шулуун дээр байх $y$-г ол.',
  a:'Налалт $m='+frTeX(B[1]-A[1],B[0]-A[0])+'$; $y-y_A=m(x-x_A)$-д $x='+C[0]+'$ орлуулбал $y='+C[1]+'$',key:'cy'+A+m+t+s};}
// 3. P-ээр дайрч AB-д параллель шулуун
function j_parLine(){var A=[nz(-6,6),nz(-6,6)],B=[nz(-6,6),nz(-6,6)],P=[nz(-6,6),nz(-6,6)];if(A[0]===B[0]&&A[1]===B[1])return null;
 var dx=B[0]-A[0],dy=B[1]-A[1];var L=g3norm(dy,-dx,dx*P[1]-dy*P[0]);
 return {q:'$A'+P2(A)+',\\ B'+P2(B)+'$. $P'+P2(P)+'$ цэгээр дайрч $AB$-д параллель шулууны тэгшитгэлийг бич.',
  a:'$AB$-ийн чиглэл $('+dx+';\\ '+dy+')$. $P$-ээр дайрсан параллель шулуун: $'+lineFmt(L[0],L[1],L[2])+'$',key:'pl'+A+B+P};}
// 4. P-ээр дайрч AB-д перпендикуляр шулуун
function j_perpLine(){var A=[nz(-6,6),nz(-6,6)],B=[nz(-6,6),nz(-6,6)],P=[nz(-6,6),nz(-6,6)];if(A[0]===B[0]&&A[1]===B[1])return null;
 var dx=B[0]-A[0],dy=B[1]-A[1];var L=g3norm(dx,dy,-(dx*P[0]+dy*P[1]));
 return {q:'$A'+P2(A)+',\\ B'+P2(B)+'$. $P'+P2(P)+'$ цэгээр дайрч $AB$-д перпендикуляр шулууны тэгшитгэлийг бич.',
  a:'Перпендикуляр шулууны нормаль нь $AB=('+dx+';\\ '+dy+')$. Тэгшитгэл: $'+lineFmt(L[0],L[1],L[2])+'$',key:'pp'+A+B+P};}
// 5. Гурвалжны AB⊥BC байх k
function j_perpK(){var B=[nz(-5,5),nz(-5,5)],ux=nz(-4,4),uy=nz(-4,4),t=rnd(1,2);
 var A=[B[0]+ux,B[1]+uy];var C=[B[0]-uy*t,B[1]+ux*t];var bx=C[0]-B[0];var yc='k'+sg(-B[1]);
 return {q:'$A'+P2(A)+',\\ B'+P2(B)+',\\ C('+C[0]+',\\ k)$ гурвалжны $AB\\perp BC$ бол $k$-г ол.',
  a:'$\\vec{BA}=('+ux+';\\ '+uy+'),\\ \\vec{BC}=('+bx+';\\ '+yc+')$; $\\vec{BA}\\cdot\\vec{BC}=0$: $'+pn(ux)+'\\cdot'+pn(bx)+'+'+pn(uy)+'\\cdot('+yc+')=0\\Rightarrow k='+C[1]+'$',key:'pk'+B+ux+uy+t};}
// 6. Хоёр цэгээр дайрсан шулууны тэгшитгэл
function j_lineThru2(){var A=[nz(-6,6),nz(-6,6)],B=[nz(-6,6),nz(-6,6)];if(A[0]===B[0]&&A[1]===B[1])return null;
 var dx=B[0]-A[0],dy=B[1]-A[1];var L=g3norm(dy,-dx,dx*A[1]-dy*A[0]);
 return {q:'$A'+P2(A)+',\\ B'+P2(B)+'$ цэгүүдээр дайрсан шулууны тэгшитгэлийг бич.',
  a:'Чиглэл $('+dx+';\\ '+dy+')$; $A$-аар дайруулбал $'+lineFmt(L[0],L[1],L[2])+'$',key:'l2'+A+B};}
// 7. Хэрчмийн дундажаар дайрч өгсөн шулуунд параллель
function j_midParLine(){var M=[nz(-4,4),nz(-4,4)],h=[nz(-3,3),nz(-3,3)];var P=[M[0]-h[0],M[1]-h[1]],Q=[M[0]+h[0],M[1]+h[1]];
 var a=nz(-3,3),b=nz(-3,3);var c0=a*M[0]+b*M[1];var L=g3norm(a,b,-c0);
 return {q:'$P'+P2(P)+',\\ Q'+P2(Q)+'$ хэрчмийн дундаж цэгээр дайрч $'+lineFmt(a,b,-nz(1,5))+'$-д параллель шулууны тэгшитгэлийг бич.',
  a:'Дундаж цэг $M('+M[0]+';\\ '+M[1]+')$. Параллель шулуун ижил нормальтай: $'+lineFmt(L[0],L[1],L[2])+'$',key:'mpl'+M+h+a+b};}
// 8. 2D зай
function j_dist2d(){var A=[nz(-6,6),nz(-6,6)],B=[nz(-6,6),nz(-6,6)];if(A[0]===B[0]&&A[1]===B[1])return null;var N=d2_2(A,B),s=sqSimp(N),raw='\\sqrt{'+N+'}';
 return {q:'$A'+P2(A)+',\\ B'+P2(B)+'$ хоёр цэгийн хоорондох зайг ол.',a:'$|AB|=\\sqrt{'+sqT(B[0],A[0])+'+'+sqT(B[1],A[1])+'}='+raw+(s!==raw?'='+s:'')+'$',key:'d2'+A+B};}
// 9. 2D параллелограммын орой D
function j_paraD2d(){var A=[nz(-5,5),nz(-5,5)],B=[nz(-5,5),nz(-5,5)],C=[nz(-5,5),nz(-5,5)];var D=[A[0]+C[0]-B[0],A[1]+C[1]-B[1]];
 var vx=B[0]-A[0],vy=B[1]-A[1],wx=C[0]-A[0],wy=C[1]-A[1];if(vx*wy-vy*wx===0)return null;
 return {q:'$ABCD$ параллелограммын $A'+P2(A)+',\\ B'+P2(B)+',\\ C'+P2(C)+'$ орой өгөгдөв. $D$ оройг ол.',
  a:'Диагоналиуд харилцан хагаслах тул $D=A+C-B='+P2(D)+'$',key:'pd2'+A+B+C};}
// 10. 3D зай
function j_dist3d(){var A=[nz(-5,5),nz(-5,5),nz(-5,5)],B=[nz(-5,5),nz(-5,5),nz(-5,5)];if(A[0]===B[0]&&A[1]===B[1]&&A[2]===B[2])return null;var N=d2_3(A,B),s=sqSimp(N),raw='\\sqrt{'+N+'}';
 return {q:'$A'+P3(A)+',\\ B'+P3(B)+'$ хоёр цэгийн хоорондох зайг ол.',a:'$|AB|=\\sqrt{'+sqT(B[0],A[0])+'+'+sqT(B[1],A[1])+'+'+sqT(B[2],A[2])+'}='+raw+(s!==raw?'='+s:'')+'$',key:'d3'+A+B};}
// 11. 3D зайгаар z олох (Пифагорын дөрвөлөөр баталгаатай)
var QZ=[[1,2,2,3],[2,3,6,7],[1,4,8,9],[4,4,7,9],[2,6,9,11],[6,6,7,11],[3,4,12,13]];
function j_distZ(){var Q=pick(QZ);var hx=Q[0]*pick([1,-1]),hy=Q[1]*pick([1,-1]),k=Q[2],D=Q[3];var A=[nz(-4,4),nz(-4,4),nz(-4,4)];var B0=A[0]+hx,B1=A[1]+hy,base=hx*hx+hy*hy,z1=A[2]+k,z2=A[2]-k;
 return {q:'$A'+P3(A)+',\\ B('+B0+',\\ '+B1+',\\ z)$ ба $|AB|='+D+'$ бол $z$-г ол.',
  a:'$(B_x-A_x)^2+(B_y-A_y)^2+(z-A_z)^2=|AB|^2$: $'+base+'+(z'+sg(-A[2])+')^2='+(D*D)+'\\Rightarrow (z'+sg(-A[2])+')^2='+(k*k)+'\\Rightarrow z='+A[2]+'\\pm'+k+'='+z1+',\\ '+z2+'$',key:'dz'+A+B0+B1+k};}
// 12. 3D дундаж цэг
function j_mid3d(){var A=[nz(-7,7),nz(-7,7),nz(-7,7)],B=[nz(-7,7),nz(-7,7),nz(-7,7)];if(A[0]===B[0]&&A[1]===B[1]&&A[2]===B[2])return null;var M=[(A[0]+B[0])/2,(A[1]+B[1])/2,(A[2]+B[2])/2];
 return {q:'$A'+P3(A)+',\\ B'+P3(B)+'$ хэрчмийн дундаж цэгийн координатыг ол.',a:'$M\\left(\\dfrac{'+A[0]+sg(B[0])+'}{2},\\ \\dfrac{'+A[1]+sg(B[1])+'}{2},\\ \\dfrac{'+A[2]+sg(B[2])+'}{2}\\right)=('+M[0]+',\\ '+M[1]+',\\ '+M[2]+')$',key:'m3'+A+B};}
// 13. Мөч
function j_octant(){var x=nz(-6,6),y=nz(-6,6),z=nz(-6,6),i=octIdx(x,y,z);
 return {q:'$A'+P3([x,y,z])+'$ цэг аль мөчид (октант) орших вэ?',a:'Тэмдгүүд $('+(x>0?'+':'-')+',\\ '+(y>0?'+':'-')+',\\ '+(z>0?'+':'-')+')$ тул $A$ нь <b>'+ROMANO[i]+'</b> мөчид оршино.',key:'oc'+x+y+z};}
// 14. Oyz-д параллель хавтгай Ox-ийг огтлох
function j_parPlane3d(){var P=[nz(-6,6),nz(-6,6),nz(-6,6)];var v=pick([0,1,2]);
 var pl=['Oyz','Oxz','Oxy'][v],ax=['Ox','Oy','Oz'][v],eqv=['x','y','z'][v];var cr=[[P[0],0,0],[0,P[1],0],[0,0,P[2]]][v];
 return {q:'$P'+P3(P)+'$ цэгээр дайрч $'+pl+'$ хавтгайд параллель хавтгай татав. $'+ax+'$ тэнхлэгийг ямар цэгээр огтлох вэ?',
  a:'Параллель хавтгай $'+eqv+'='+P[v]+'$; $'+ax+'$ тэнхлэг дээр бусад координат тэг тул $'+P3(cr)+'$',key:'pp3'+P+v};}
// 15. 3D тэгш хэмтэй цэг
function j_sym3d(){var A=[nz(-6,6),nz(-6,6),nz(-6,6)];var TS=[
  {n:'$Oxy$ хавтгай',f:[A[0],A[1],-A[2]]},{n:'$Oxz$ хавтгай',f:[A[0],-A[1],A[2]]},{n:'$Oyz$ хавтгай',f:[-A[0],A[1],A[2]]},
  {n:'$Ox$ тэнхлэг',f:[A[0],-A[1],-A[2]]},{n:'$Oy$ тэнхлэг',f:[-A[0],A[1],-A[2]]},{n:'$Oz$ тэнхлэг',f:[-A[0],-A[1],A[2]]},
  {n:'координатын эх $O$',f:[-A[0],-A[1],-A[2]]}];var t=pick(TS);
 return {q:'$A'+P3(A)+'$ цэгтэй '+t.n+'-ээр тэгш хэмтэй цэгийн координатыг ол.',a:'Харгалзах тэмдгүүд солигдоно: $A\'\\,'+P3(t.f)+'$',key:'sy'+A+t.n};}
// 16. 3D параллелограммын орой D
function j_paraD3d(){var A=[nz(-5,5),nz(-5,5),nz(-5,5)],B=[nz(-5,5),nz(-5,5),nz(-5,5)],C=[nz(-5,5),nz(-5,5),nz(-5,5)];var D=[A[0]+C[0]-B[0],A[1]+C[1]-B[1],A[2]+C[2]-B[2]];
 var v=[B[0]-A[0],B[1]-A[1],B[2]-A[2]],w=[C[0]-A[0],C[1]-A[1],C[2]-A[2]];var cx=v[1]*w[2]-v[2]*w[1],cy=v[2]*w[0]-v[0]*w[2],cz=v[0]*w[1]-v[1]*w[0];if(cx===0&&cy===0&&cz===0)return null;
 return {q:'$ABCD$ параллелограммын $A'+P3(A)+',\\ B'+P3(B)+',\\ C'+P3(C)+'$ орой өгөгдөв. $D$ оройг ол.',a:'$D=A+C-B='+P3(D)+'$',key:'pd3'+A+B+C};}
// 17. 3D адил хажуут гурвалжин
function j_isoTri3d(){var A=[nz(-4,4),nz(-4,4),nz(-4,4)];var iso=Math.random()<0.6;var v=[nz(-4,4),nz(-4,4),nz(-4,4)],w;
 if(iso){var pm=pick([[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]]);w=[v[pm[0]]*pick([1,-1]),v[pm[1]]*pick([1,-1]),v[pm[2]]*pick([1,-1])];}
 else w=[nz(-4,4),nz(-4,4),nz(-4,4)];
 var B=[A[0]+v[0],A[1]+v[1],A[2]+v[2]],C=[A[0]+w[0],A[1]+w[1],A[2]+w[2]];
 var cx=v[1]*w[2]-v[2]*w[1],cy=v[2]*w[0]-v[0]*w[2],cz=v[0]*w[1]-v[1]*w[0];if(cx===0&&cy===0&&cz===0)return null;
 var AB=d2_3(A,B),AC=d2_3(A,C),BC=d2_3(B,C);if(AB===0||AC===0||BC===0)return null;
 var eq=(AB===AC&&AC===BC),is=(AB===AC||AB===BC||AC===BC);
 return {q:'$A'+P3(A)+',\\ B'+P3(B)+',\\ C'+P3(C)+'$ гурвалжин адил хажуут эсэхийг тодорхойл.',
  a:'$|AB|^2='+AB+',\\ |AC|^2='+AC+',\\ |BC|^2='+BC+'$ — '+(eq?'<b>зөв гурвалжин</b>':is?'хоёр тал тэнцүү тул <b>адил хажуут</b>':'гурван тал өөр тул <b>адил хажуут биш</b>'),key:'it'+A+B+C};}
var EXAM={title:'V бүлэг — Жишиг даалгавар 1',sub:'Координатын арга: шулууны налалт ба тэгшитгэл (5.1) · огторгуйн координат (5.2) · зай ба дундаж цэг (5.3)',tasks:[j_slope,j_parLine,j_perpK,j_dist2d,j_distZ,j_parPlane3d,j_mid3d,j_paraD3d],points:[12,12,13,13,12,13,13,12]};

function gen(fn){for(var t=0;t<400;t++){var f=fn();if(f)return f;}return null;}
function build(){window.__P=EXAM.tasks.map(function(fn){return gen(fn);});layout();}
function layout(){var WK=document.getElementById('sw').checked;var P=window.__P||(window.__P=EXAM.tasks.map(function(fn){return gen(fn);}));
  var total=EXAM.points.reduce(function(a,b){return a+b;},0);
  var qs2=P.map(function(f,i){return '<div class="q"><div class="qh"><span class="ql">'+(i+1)+'.</span><span class="qm">'+f.q+'</span><span class="pts">'+EXAM.points[i]+' оноо</span></div>'+(WK?'<div class="wk"></div>':'')+'</div>';}).join('');
  var ans=P.map(function(f,i){return '<div class="a"><span class="an">'+(i+1)+'.</span>'+f.a+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>'+EXAM.title+'</h1><div class="sub">'+EXAM.sub+' · 11-р анги · Нийт '+total+' оноо</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="col1">'+qs2+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE=EXAM.title;
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
