<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V бүлэг — Шалгалтын материал (8-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 8-р анги · V бүлэг. Дараалал, функц (5.1 Дараалал · 5.2 Арифметик прогресс · 5.3 Шугаман функц, түүний график ·
   5.4 Шулууны налалт, ШТС-ийн график · 5.5 Урвуу пропорционал хамаарлын график · 5.6 y=ax² функц, түүний график) */
function mono(c, v) { if (!v) return String(c); return c === 1 ? v : c === -1 ? '-' + v : c + v; }
// олон гишүүнт [[c, v], …] → 3n^{2}-5n+2 (тэг гишүүнийг алгасна)
function poly(ts) { var s = ''; ts.forEach(function (t) { if (!t[0]) return; s += (t[0] < 0 ? '-' : s ? '+' : '') + mono(Math.abs(t[0]), t[1]); }); return s || '0'; }
function lin(a, b, v) { return poly([[a, v || 'x'], [b, '']]); }
// рационал коэффициенттэй гишүүд [[хүртвэр, хуваарь, хувьсагч], …] → -\dfrac{2}{3}x+4 (хураасан)
function rpoly(ts) {
  var s = '';
  ts.forEach(function (t) {
    var n = t[0], d = t[1]; if (!n) return;
    var g = gcd(n, d), neg = (n < 0) !== (d < 0); n = Math.abs(n) / g; d = Math.abs(d) / g;
    s += (neg ? '-' : s ? '+' : '') + (d === 1 ? (n === 1 && t[2] ? '' : String(n)) : '\\dfrac{' + n + '}{' + d + '}') + (t[2] || '');
  });
  return s || '0';
}
// цэг (x; y) — бутархай координаттай бол том хаалт
function P(x, y) { var big = /dfrac/.test(String(x) + String(y)); return (big ? '\\left(' : '(') + x + ';\\ ' + y + (big ? '\\right)' : ')'); }
// ax + by = c, x-ийн коэффициент эерэг
function eqn(a, b, c) { if (a < 0) { a = -a; b = -b; c = -c; } return poly([[a, 'x'], [b, 'y']]) + '=' + c; }
// дэс тоо: 1, 4, 9-өөр (тэгээр төгсвөл 40, 90-ээр) төгсвөл «дүгээр», бусад «дугаар»
function ord(n) { var u = n % 10, t = Math.floor(n / 10) % 10; return (u ? (u === 1 || u === 4 || u === 9) : (t === 4 || t === 9)) ? 'дүгээр' : 'дугаар'; }
// математик + нөхцөл (ж: $x$-ийг) — мөрийн төгсгөлд тасрахгүй
function nb(s) { return '<span style="white-space:nowrap">' + s + '</span>'; }
function tx(x, y, s, it) { return '<text x="' + x + '" y="' + y + '" font-size="11"' + (it ? ' font-style="italic"' : '') + ' fill="#1a1030">' + s + '</text>'; }
// Координатын хавтгай (−3…3) — ЗӨВХӨН өгөгдөл: тор, тэнхлэг, «1» хуваарь, өгсөн шулуун/парабол ба түүн дээрх мэдэгдэх бүхэл цэгүүд
// (хариу — налалт, a-гийн утга — зурагт бичигдэхгүй). o: { k, b } — y = kx + b | { a } — y = ax²; pts: [[x, y], …]
function plane(o) {
  var R = 3, u = 10, ox = 40, oy = 42, s = '', i, j, pts = [];
  function X(x) { return +(ox + x * u).toFixed(1); }
  function Y(y) { return +(oy - y * u).toFixed(1); }
  for (i = -R; i <= R; i++) s += '<path d="M' + X(i) + ' ' + Y(-R) + 'V' + Y(R) + 'M' + X(-R) + ' ' + Y(i) + 'H' + X(R) + '" stroke="#ddd6ee" stroke-width="0.7"/>';
  s += '<path d="M' + (X(-R) - 2) + ' ' + Y(0) + 'H' + (X(R) + 6) + 'M' + X(0) + ' ' + (Y(-R) + 2) + 'V' + (Y(R) - 6) + 'M' + X(1) + ' ' + (Y(0) - 2) + 'v4M' + (X(0) - 2) + ' ' + Y(1) + 'h4" stroke="#1a1030" stroke-width="1"/>'
    + '<path d="M' + (X(R) + 8) + ' ' + Y(0) + 'l-5 -2.6v5.2zM' + X(0) + ' ' + (Y(R) - 8) + 'l-2.6 5h5.2z" fill="#1a1030"/>'
    + tx(X(R) + 1, Y(0) + 11, 'x', 1) + tx(X(0) + 4, Y(R) - 2, 'y', 1) + tx(X(0) - 9, Y(0) + 10, 'O') + tx(X(1) - 3, Y(0) + 11, '1') + tx(X(0) - 8, Y(1) + 4, '1');
  if (o.k != null) {
    var lo = -R, hi = R;
    if (o.k) { var xa = (-R - o.b) / o.k, xb = (R - o.b) / o.k; lo = Math.max(lo, Math.min(xa, xb)); hi = Math.min(hi, Math.max(xa, xb)); }
    pts = [[lo, o.k * lo + o.b], [hi, o.k * hi + o.b]];
  } else {
    var xm = Math.min(R, Math.sqrt(R / Math.abs(o.a)));
    for (j = 0; j <= 40; j++) { var x = -xm + 2 * xm * j / 40; pts.push([x, o.a * x * x]); }
  }
  s += '<polyline points="' + pts.map(function (p) { return X(p[0]) + ',' + Y(p[1]); }).join(' ') + '" fill="none" stroke="#1a1030" stroke-width="1.6"/>';
  (o.pts || []).forEach(function (p) { s += '<circle cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="2.4" fill="#1a1030"/>'; });
  return '<svg viewBox="0 0 84 80" width="84" height="80" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">' + s + '</svg>';
}

/* ── I. Тест (10) ── */
var TESTS = [
  // 1. Дараалал (5.1): ерөнхий гишүүний томьёогоор заасан гишүүнийг олох — хялбар
  function () {
    var t = rnd(1, 3), k, F, v, d;
    if (t === 1) {                       // aₙ = pn + q
      var p = nz(-9, 9), q = nz(-15, 15); k = rnd(6, 20); if (Math.abs(p) < 2) return null;
      F = lin(p, q, 'n'); v = p * k + q;
      d = [p * (k - 1) + q, p * k - q, p + q * k, p * k, p * (k + 1) + q];
    } else if (t === 2) {                // aₙ = n² + qn + c
      var q2 = nz(-6, 6), c = nz(-9, 9); k = rnd(4, 10);
      F = poly([[1, 'n^{2}'], [q2, 'n'], [c, '']]); v = k * k + q2 * k + c;
      d = [2 * k + q2 * k + c, k * k - q2 * k + c, (k - 1) * (k - 1) + q2 * (k - 1) + c, k * k + q2 * k - c, k * k + q2 + c];
    } else {                             // aₙ = (−1)ⁿ(pn + q)
      var p3 = rnd(2, 6), q3 = nz(-7, 7), s; k = rnd(5, 14); s = k % 2 ? -1 : 1;
      F = '(-1)^{n}(' + lin(p3, q3, 'n') + ')'; v = s * (p3 * k + q3);
      d = [-v, s * (p3 * (k - 1) + q3), s * p3 * k, s * (p3 * k - q3), -s * (p3 * k - q3)];
    }
    return { stem: '$a_n=' + F + '$ дарааллын $a_{' + k + '}$ гишүүн хэд вэ?', mc: makeMC(C(v), d.map(C)) };
  },
  // 2. Арифметик прогресс (5.2): a₁, d (эсвэл эхний гишүүд) өгөгдсөн үед aₖ = a₁ + (k − 1)d — хялбар
  function () {
    var a1 = nz(-12, 20), d = nz(-9, 9), k = rnd(8, 25); if (Math.abs(d) < 2) return null;
    var v = a1 + (k - 1) * d;
    var st = rnd(0, 1) ? '$a_1=' + a1 + ',\\ d=' + d + '$ арифметик прогрессын $a_{' + k + '}$ гишүүн хэд вэ?'
      : '$' + a1 + ',\\ ' + (a1 + d) + ',\\ ' + (a1 + 2 * d) + ',\\ \\ldots$ арифметик прогрессын $a_{' + k + '}$ гишүүн хэд вэ?';
    return { stem: st, mc: makeMC(C(v), [C(a1 + k * d), C((k - 1) * d), C(a1 - (k - 1) * d), C(d + (k - 1) * a1), C(a1 + (k - 2) * d)]) };
  },
  // 3. Шугаман функц (5.3): графикийн Ox эсвэл Oy тэнхлэгтэй огтлолцох цэг — хялбар
  function () {
    var x0 = nz(-6, 6), k = nz(-5, 5), b = -k * x0; if (Math.abs(b) > 20) return null;
    var F = '$y=' + lin(k, b) + '$ функцийн график ';
    if (rnd(0, 1)) return { stem: F + '$Ox$ тэнхлэгийг огтлох цэг аль нь вэ?', mc: makeMC(C(P(x0, 0)), [C(P(0, b)), C(P(-x0, 0)), C(P(b, 0)), C(P(0, x0)), C(P(k, 0))]) };
    return { stem: F + '$Oy$ тэнхлэгийг огтлох цэг аль нь вэ?', mc: makeMC(C(P(0, b)), [C(P(b, 0)), C(P(x0, 0)), C(P(0, -b)), C(P(0, k)), C(P(0, x0))]) };
  },
  // 4. Дараалал (5.1): эхний гишүүдээр ерөнхий гишүүний томьёог таних (эхний 1–3 гишүүнд таарах төөрөгдүүлэгч) — дунд
  function () {
    var t = rnd(1, 5), T = [], c, d, i;
    if (t <= 2) {                        // арифметик: a₁, a₁ + d, …  →  aₙ = dn + (a₁ − d)
      var a1 = nz(-9, 15), dd = nz(-8, 8); if (Math.abs(dd) < 2) return null;
      for (i = 0; i < 4; i++) T.push(a1 + i * dd);
      c = lin(dd, a1 - dd, 'n');
      d = [lin(dd, a1, 'n'), lin(dd, a1 + dd, 'n'), a1 === dd ? lin(dd, -a1, 'n') : lin(a1 - dd, dd, 'n'), lin(-dd, a1 + dd, 'n'), lin(a1, dd, 'n')];
    } else if (t === 3) {                // n² + c
      var c0 = rnd(-4, 5);
      for (i = 1; i <= 4; i++) T.push(i * i + c0);
      c = poly([[1, 'n^{2}'], [c0, '']]);
      d = [lin(3, c0 - 2, 'n'), poly([[2, 'n^{2}'], [c0 - 1, '']]), poly([[1, 'n^{2}'], [c0 + 1, '']]), lin(2, c0 - 1, 'n'), poly([[1, 'n^{2}'], [-c0, '']])];
    } else if (t === 4) {                // n(n + c)
      var c1 = rnd(1, 3), s1 = 1 + c1, s2 = 4 + 2 * c1;
      for (i = 1; i <= 4; i++) T.push(i * (i + c1));
      c = 'n(' + lin(1, c1, 'n') + ')';
      d = [lin(s2 - s1, 2 * s1 - s2, 'n'), poly([[1, 'n^{2}'], [c1, '']]), poly([[1 + c1, 'n^{2}']]), 'n(' + lin(1, c1 + 1, 'n') + ')', '(' + lin(1, c1, 'n') + ')^{2}'];
    } else {                             // 2ⁿ, 3ⁿ
      var g = pick([2, 3]);
      for (i = 1; i <= 4; i++) T.push(Math.pow(g, i));
      c = g + '^{n}';
      d = [mono(g, 'n'), 'n^{' + g + '}', g + '^{n+1}', g + '^{n-1}', g === 2 ? poly([[1, 'n^{2}'], [-1, 'n'], [2, '']]) : lin(6, -3, 'n')];
    }
    return { stem: '$' + T.join(',\\ ') + ',\\ \\ldots$ дарааллын ерөнхий гишүүний томьёо аль нь вэ?',
      mc: makeMC(C('a_n=' + c), d.map(function (x) { return C('a_n=' + x); })) };
  },
  // 5. Арифметик прогресс (5.2): хоёр гишүүнээр ялгавар d эсвэл эхний гишүүн a₁ — дунд
  function () {
    var m = rnd(2, 6), n = m + rnd(3, 7), d = nz(-8, 8), a1 = nz(-12, 15); if (Math.abs(d) < 2) return null;
    var am = a1 + (m - 1) * d, an = a1 + (n - 1) * d;
    var st = '$a_{' + m + '}=' + am + ',\\ a_{' + n + '}=' + an + '$ бол арифметик прогрессын ';
    if (rnd(0, 1)) return { stem: st + 'ялгавар $d$ хэд вэ?', mc: makeMC(C(d), [C(-d), C(fr(an - am, n - m + 1)), C(an - am), C(fr(an + am, n - m)), C(fr(an - am, n))]) };
    return { stem: st + 'эхний гишүүн $a_1$ хэд вэ?', mc: makeMC(C(a1), [C(am - m * d), C(-a1), C(am - (m - 2) * d), C(am + (m - 1) * d), C(d)]) };
  },
  // 6. Шулууны налалт (5.4): хоёр цэгээр, эсвэл графикаар (зураг — зөвхөн өгөгдөл: шулуун ба түүн дээрх 2 бүхэл цэг) — дунд
  function () {
    var K = pick([[2, 1], [3, 1], [1, 2], [1, 3], [2, 3], [3, 2], [3, 4], [4, 3]]), p = pick([1, -1]) * K[0], q = K[1];
    var ds = [fr(-p, q), fr(q, p), fr(-q, p)], x1, y1, x2, y2;
    if (rnd(0, 1)) {
      var m = pick([1, 2, -1]); x1 = nz(-6, 6); y1 = nz(-8, 8); x2 = x1 + m * q; y2 = y1 + m * p;
      if (!x2 || !y2 || Math.abs(x2) > 9 || Math.abs(y2) > 12) return null;
      ds.push(fr(y2 + y1, x2 + x1));                 // буруу томьёо: нийлбэрүүдийн харьцаа
      return { stem: '$A' + P(x1, y1) + '$ ба $B' + P(x2, y2) + '$ цэгүүдийг дайрсан шулууны налалт хэд вэ?', mc: makeMC(C(fr(p, q)), ds.map(C)) };
    }
    x1 = rnd(-3, 3 - q); y1 = p > 0 ? rnd(-3, 3 - p) : rnd(-3 - p, 3); x2 = x1 + q; y2 = y1 + p;
    var b = y1 - p * x1 / q; if (Math.abs(b) > 6) return null;
    if (b === Math.round(b)) ds.push(b);
    return { stem: 'Зурагт үзүүлсэн шулууны налалт хэд вэ?', fig: plane({ k: p / q, b: b, pts: [[x1, y1], [x2, y2]] }), mc: makeMC(C(fr(p, q)), ds.map(C)) };
  },
  // 7. ШТС-ийн график (5.4): өгсөн тэгшитгэлтэй хамт шийдгүй (параллель) / төгсгөлгүй олон шийдтэй (давхцах) систем үүсгэх тэгшитгэл,
  //    эсвэл өгсөн шулуунтай параллель шулуун (налалт тэнцүү, b өөр) — дунд
  function () {
    var t = rnd(1, 3);
    if (t <= 2) {
      var a = nz(-5, 5), b0 = nz(-5, 5), c = nz(-9, 9), m = pick([2, 3]); if (gcd(gcd(a, b0), c) > 1) return null;
      if (a < 0) { a = -a; b0 = -b0; c = -c; }
      var prl = eqn(m * a, m * b0, m * c + pick([-3, -2, -1, 1, 2, 3])), coin = eqn(m * a, m * b0, m * c);
      var ds = [t === 1 ? coin : prl, eqn(m * a, -m * b0, m * c), eqn(m * a + 1, m * b0, m * c)];   // огтлолцох: det ≠ 0
      if (Math.abs(a) !== Math.abs(b0)) ds.push(eqn(m * b0, m * a, m * c));
      return { stem: 'Аль тэгшитгэл $' + eqn(a, b0, c) + '$ тэгшитгэлтэй хамт ' + (t === 1 ? 'шийдгүй' : 'төгсгөлгүй олон шийдтэй') + ' систем үүсгэх вэ?',
        mc: makeMC(C(t === 1 ? prl : coin), ds.map(C)) };
    }
    var k = nz(-5, 5), b = nz(-9, 9), b2 = nz(-9, 9); if (b2 === b || b === k) return null;
    return { stem: 'Аль шулуун $y=' + lin(k, b) + '$ шулуунтай параллель вэ?',
      mc: makeMC(C('y=' + lin(k, b2)), [C('y=' + lin(-k, b)), C('y=' + lin(-k, b2)), C('y=' + rpoly([[1, k, 'x'], [b2, 1]])), C('y=' + rpoly([[-1, k, 'x'], [b, 1]])), C('y=' + lin(b, k))]) };
  },
  // 8. Урвуу пропорционал хамаарал (5.5): цэгээр k = xy-г олоод өөр x-ийн утгад y — хүнд
  function () {
    var x1 = nz(-6, 6), y1 = nz(-9, 9), x2 = nz(-12, 12); if (Math.abs(x1) < 2 || Math.abs(y1) < 2 || Math.abs(x2) < 2 || x2 === x1) return null;
    var k = x1 * y1; if (k % x2) return null; var y2 = k / x2;
    var st = rnd(0, 1) ? '$y=\\dfrac{k}{x}$ функцийн график $A' + P(x1, y1) + '$ цэгийг дайрдаг бол $x=' + x2 + '$ үед $y$ хэд вэ?'
      : '$y$ нь ' + nb('$x$-тэй') + ' урвуу пропорционал. $x=' + x1 + '$ үед $y=' + y1 + '$ бол $x=' + x2 + '$ үед $y$ хэд вэ?';
    return { stem: st, mc: makeMC(C(y2), [C(-y2), C(fr(y1 * x2, x1)), C(k), C(k * x2), C(fr(y1, x1 * x2))]) };
  },
  // 9. y=ax² функц (5.6): цэгээр a-г олох / өөр x-ийн утгад y, эсвэл графикаар a (зураг — зөвхөн өгөгдөл) — хүнд
  function () {
    var t = rnd(1, 3), s = pick([1, -1]), an, ad, x1, y1;
    if (t === 3) {
      var G = pick([[2, 1, 1], [3, 1, 1], [1, 2, 2], [1, 3, 3], [1, 4, 2]]);   // [|a|-ийн хүртвэр, хуваарь, x₁] — цэгүүд [−3; 3] мужид
      an = s * G[0]; ad = G[1]; x1 = G[2]; y1 = an * x1 * x1 / ad;
      return { stem: 'Зурагт $y=ax^2$ функцийн график үзүүлэв. $a$ хэд вэ?', fig: plane({ a: an / ad, pts: [[-x1, y1], [x1, y1]] }),
        mc: makeMC(C(fr(an, ad)), [C(fr(-an, ad)), C(fr(ad, an)), C(fr(-ad, an)), C(y1), C(fr(y1, x1))]) };
    }
    var A = pick([[1, 1], [2, 1], [3, 1], [1, 2], [1, 3], [1, 4], [3, 2]]); an = s * A[0]; ad = A[1];
    var X = [1, 2, 3, 4].filter(function (x) { return (x * x) % ad === 0; });
    x1 = pick(X) * pick([1, -1]); y1 = an * x1 * x1 / ad;
    var st = '$y=ax^2$ функцийн график $A' + P(x1, y1) + '$ цэгийг дайрдаг бол ';
    if (t === 1) {
      var XX = [1, 2, 3, 4, 5, 6].filter(function (x) { return (x * x) % ad === 0 && x !== Math.abs(x1); });
      var x2 = pick(XX) * pick([1, -1]), y2 = an * x2 * x2 / ad; if (Math.abs(y2) > 150) return null;
      return { stem: st + '$x=' + x2 + '$ үед $y$ хэд вэ?', mc: makeMC(C(y2), [C(-y2), C(fr(an * x2, ad)), C(fr(y1 * x2 * x2, x1)), C(fr(y1 * x2, x1)), C(fr(an * an * x2 * x2, ad * ad))]) };
    }
    return { stem: st + '$a$ хэд вэ?', mc: makeMC(C(fr(an, ad)), [C(fr(y1, x1)), C(fr(-an, ad)), C(fr(ad, an)), C(fr(y1, 2 * x1)), C(fr(2 * an, ad)), C(fr(an, 2 * ad))]) };
  },
  // 10. Шугаман функц (5.3): хоёр шулууны огтлолцлын цэгийг график байгуулахгүйгээр олох — хүнд
  function () {
    var k1 = nz(-4, 4), k2 = nz(-4, 4); if (k1 === k2) return null;
    var x0 = nz(-5, 5), y0 = nz(-9, 9), b1 = y0 - k1 * x0, b2 = y0 - k2 * x0;
    if (!b1 || !b2 || Math.abs(b1) > 15 || Math.abs(b2) > 15 || x0 === y0) return null;
