<script>
/* ЭЕШ 1000 — Олон гишүүнт, рационал бутархай-2 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Үлдэгдлийн теорем, хуваагч, язгуур; хялбар бутархайд задлах.
   Эх: 3.15, 2.4, 1.9, 3.16, 3.17, 1.31, 3.18, 2.8, 1.53, 1.77, 1.19, 2.5, 2.6, 1.85, 3.19, 3.20, 3.21 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 3.15 */
var e3_15 = (function () {
// 15. p(x) = ax³ + bx² + cx + d олон гишүүнтийг x − r-д хуваахад гарах үлдэгдэл нь p(r) (Безугийн теорем).
//     r ∈ {±1, ±2}; үлдэгдэл голдуу ≠ 0, |p(r)| ≤ 30  (эх: 5x³ − 13x² + 17x − 7, x − 1 → 2).
function p15() {
  var r = pick([1, 1, 1, -1, -1, -1, 2, 2, -2, -2]), a = pick([2, 3, 3, 4, 5, 5, 6, 7, -2, -3]);
  var b = nz(-15, 15), c = nz(-20, 20), d = nz(-12, 12);
  if (a === 5 && b === -13 && c === 17 && d === -7 && r === 1) return null;   // эх тоо тогтмол хувилбар болохгүй
  var R = a * r * r * r + b * r * r + c * r + d;
  if (Math.abs(R) > 30 || (R === 0 && rnd(0, 3))) return null;               // 0 үлдэгдэл ховор
  return {
    q: '$p(x)=' + poly([a, b, c, d]) + '$ олон гишүүнтийг <span class="nw">$' + poly([1, -r]) + '$-' + suf(Math.abs(r), 'д')
      + '</span> хуваахад гарах үлдэгдлийг олоорой.',
    a: '$' + R + '$',
    wk: 22,
    t: { P: [a, b, c, d], r: r }
  };
}
return p15;
})();

/* 2.4 */
var e2_4 = (function () {
// 4. P(x) = x³ + ax² + cx + b; (x − u)-д хуваахад r₁, (x − v)-д хуваахад r₂ үлдэнэ ⇔ P(u) = r₁, P(v) = r₂ (Безу):
//    a(u² − v²) = r₁ − r₂ − (u³ − v³) − c(u − v),  b = r₁ − u³ − au² − cu  (u² ≠ v²). Хариу бутархай байж болно.
//    (эх: c = −4, (x − 1) → 1, (x + 2) → −1  ⇒  a = −5/3)
function p4() {
  var u = pick([1, 1, 1, 2, -1, -2, 3, -3]), v = pick([1, -1, 2, -2, -2, 3, -3]);
  if (u === v || u === -v) return null;
  var c = nz(-6, 6), r1 = nz(-5, 5), r2 = nz(-5, 5);
  if (rnd(0, 1)) {                       // заримдаа бүхэл a, b-ээс үлдэгдлүүдийг тооцно (бүхэл хариу)
    var a0 = nz(-4, 4), b0 = nz(-6, 6);
    r1 = u * u * u + a0 * u * u + c * u + b0; r2 = v * v * v + a0 * v * v + c * v + b0;
    if (!r1 || !r2 || Math.abs(r1) > 15 || Math.abs(r2) > 15) return null;
  }
  var D = u * u - v * v, N = r1 - r2 - (u * u * u - v * v * v) - c * (u - v);   // a = N/D
  var bN = D * (r1 - u * u * u - c * u) - N * u * u;                              // b = bN/D
  var ask = pick(['a', 'a', 'a', 'a', 'b', 'a+b']), vN = ask === 'a' ? N : ask === 'b' ? bN : N + bN;
  var den = Math.abs(D) / gcd(vN, D);
  if (den > 6 || Math.abs(vN / D) > 12) return null;
  if (ask === 'a' && !N) return null;
  // дагаврыг томьёоноос тасрахгүй байлгана (nw)
  var dv = function (w) { return '<span class="nw">$(' + poly([1, -w]) + ')$-' + suf(Math.abs(w), 'д') + '</span>'; };
  return {
    q: '$P(x)=x^3+ax^2' + tm(c, 'x') + '+b$ олон гишүүнтийг ' + dv(u) + ' хуваахад $' + r1 + '$ үлддэг ба ' + dv(v) + ' хуваахад $' + r2
      + '$ үлддэг бол <span class="nw">$' + ask + '$-гийн</span> утгыг олоорой.',
    a: '$' + ask + '=' + fr(vN, D) + '$',
    wk: 28,
    t: { u: u, v: v, c: c, r1: r1, r2: r2, ask: ask }
  };
}
return p4;
})();

/* 1.9 */
var e1_9 = (function () {
// 9. P(x) = (x³ + e)·S(x) + R(x), x³ + e = (x + e)(x² − ex + 1), e = ±1, R = αx² + βx + γ.
//    x + e-д хуваахад R(−e) = α − eβ + γ, x² − ex + 1-д хуваахад R − α(x² − ex + 1) = (β + αe)x + (γ − α) үлдэнэ.
//    Эдгээрээс R-ийг сэргээнэ (хариу нь R).
function p9() {
  var e = rnd(0, 9) < 6 ? 1 : -1, al = nz(-3, 3), be = rnd(-5, 5), ga = rnd(-5, 5);
  var r1 = al - e * be + ga, u = be + al * e, v = ga - al;
  if (!r1 || !u || Math.abs(r1) > 12) return null;
  var L = poly([1, e]), Q = poly([1, -e, 1]);
  // Бодолт (гар бичмэл): P(−e) = r1 (Безу); R(x) = a·Q(x) + ux + v хэлбэртэй; R(−e) = P(−e) → a.
  var lin = poly([u, v]), w = -e * u + v, x0 = -e;
  // орлуулга: x² ∓ x + 1 ба ux + v-д x = x₀-г тавина (ux + v нь зөвхөн x бол утга нь x₀ өөрөө тул алгасна)
  var qs = x0 === 1 ? '1^2+1+1' : '(-1)^2-(-1)+1', ls = (u === 1 ? '' : u === -1 ? '-' : u + '\\cdot ') + par(x0) + (v ? sgn(v) : '');
  var lp = v === 0 && u === 1 ? '' : ', $' + lin + '=' + (ls === String(w) ? '' : ls + '=') + w + '$';
  return {
    q: '$P(x)$ олон гишүүнтийг $' + L + '$-д хуваахад $' + r1 + '$ үлдэх ба $' + Q + '$-д хуваахад $' + poly([u, v]) + '$ үлдэнэ. '
      + '$P(x)$ олон гишүүнтийг $(' + L + ')(' + Q + ')$ олон гишүүнтэд хуваахад гарах үлдэгдлийг олоорой.',
    a: '$R(x)=' + poly([al, be, ga]) + '$',
    wk: 32,
    s: [
      '$P(x)=(' + L + ')\\cdot Q_1(x)' + sgn(r1) + '$ тул Безугийн теоремоор $P(' + x0 + ')=' + r1 + '$.',
      '$P(x)=(' + L + ')(' + Q + ')\\cdot Q_2(x)+R(x)$, $\\deg R(x)\\le 2$. $P(x)$ ба $R(x)$-ийг $' + Q + '$-д хуваахад ижил үлдэгдэл гарах тул '
        + '$R(x)=a(' + Q + ')' + (lin[0] === '-' ? '' : '+') + lin + '$ хэлбэртэй.',
      '$x=' + x0 + '$ үед $' + L + '=0$ тул $P(' + x0 + ')=R(' + x0 + ')$. Мөн энэ үед $' + Q + '=' + qs + '=3$' + lp + ' тул '
        + '$$R(' + x0 + ')=3a' + (w ? sgn(w) : '') + '=' + r1 + '\\Rightarrow a=' + al + '.$$',
      'Иймд $R(x)=' + (al === 1 ? '' : al === -1 ? '-' : al) + '(' + Q + ')' + (lin[0] === '-' ? '' : '+') + lin + '=' + poly([al, be, ga]) + '$.'
    ],
    t: { e: e, al: al, be: be, ga: ga }
  };
}
return p9;
})();

/* 3.16 */
var e3_16 = (function () {
// 16. p(x) = kx⁴ + ax² + cx + b нь x² − (r₁ + r₂)x + r₁r₂ = (x − r₁)(x − r₂)-д хуваагдана ⇔ p(r₁) = p(r₂) = 0:
//     a·r² + b = −k·r⁴ − c·r (r = r₁, r₂) ⇒ a = −c/(r₁ + r₂) − k(r₁² + r₂²), b = −k·r₁⁴ − a·r₁² − c·r₁  (r₁ ≠ ±r₂, c нь r₁ + r₂-т хуваагдана).
//     (эх: 4x⁴ + ax² + 11x + b, x² + x − 2 → a = −9, b = −6)
function p16() {
  var r1 = nz(-3, 3), r2 = nz(-3, 3);
  if (r1 >= r2 || r1 === -r2) return null;
  var S = r1 + r2, k = pick([1, 2, 2, 3, 3, 4, 4, 5]), c = nz(-20, 20);
  if (c % S) return null;                                      // a бүхэл
  var a = -c / S - k * (r1 * r1 + r2 * r2), b = -k * Math.pow(r1, 4) - a * r1 * r1 - c * r1;
  if (!a || !b || Math.abs(a) > 30 || Math.abs(b) > 50) return null;
  if (k === 4 && c === 11 && r1 === -2 && r2 === 1) return null;   // эх тоо тогтмол хувилбар болохгүй
  return {
    q: '$p(x)=' + tm(k, 'x^4', true) + '+ax^2' + tm(c, 'x') + '+b$ олон гишүүнт $' + poly([1, -S, r1 * r2])
      + '$ олон гишүүнтэд хуваагддаг байх $a,b$ тогтмол тоонуудыг олоорой.',
    a: '$a=' + a + '$, $b=' + b + '$',
    wk: 34,
    t: { k: k, c: c, r: [r1, r2] }
  };
}
return p16;
})();

/* 3.17 */
var e3_17 = (function () {
// 17. p(x) = kx³ + ax² + bx + d нь x − r₁-д хуваагдана (p(r₁) = 0), mx + n-д хуваахад R үлдэгдэлтэй (p(−n/m) = R).
//     Бүхэл a, b, R гарахаар p = (x − r₁)(kx² + ux + v) байгуулна: k = mk', u = k'n + mu', v = u'n + mv' ⇒ R = −(n + mr₁)·v'.
//     (эх: 8x³ + ax² + bx − 1, x + 1-д хуваагдана, 2x + 1-д хуваахад 1 үлдэнэ → a = 6, b = −3)
function p17() {
  var m = pick([2, 2, 2, 3, 1]), n = m === 1 ? nz(-4, 4) : nz(-3, 3);
  if (gcd(m, n) !== 1) return null;
  var r1 = pick([-2, -1, -1, 1, 1, 2]);
  if (m * r1 === -n) return null;                                   // r₁ ≠ −n/m
  var kp = m === 1 ? rnd(1, 6) : m === 2 ? rnd(1, 4) : rnd(1, 3), k = m * kp;
  var up = rnd(-5, 5), vp = nz(-5, 5), u = kp * n + m * up, v = up * n + m * vp;
  var a = u - k * r1, b = v - u * r1, d = -v * r1, R = -(n + m * r1) * vp;
  if (!a || !b || !d || Math.abs(a) > 20 || Math.abs(b) > 20 || Math.abs(d) > 12 || Math.abs(R) > 12) return null;
  if (k === 8 && d === -1 && r1 === -1 && m === 2 && n === 1 && R === 1) return null;   // эх тоо тогтмол хувилбар болохгүй
  var dv = function (s, w) { return '<span class="nw">$' + s + '$-' + suf(Math.abs(w), 'д') + '</span>'; };
  return {
    q: '$p(x)=' + tm(k, 'x^3', true) + '+ax^2+bx' + sgn(d) + '$ олон гишүүнт нь ' + dv(poly([1, -r1]), r1) + ' хуваагдах бөгөөд '
      + dv(poly([m, n]), n) + ' хуваахад $' + R + '$ үлдэгдэлтэй байдаг бол $a,b$ тогтмол тоонуудыг олоорой.',
    a: '$a=' + a + '$, $b=' + b + '$',
    wk: 34,
    t: { k: k, d: d, r1: r1, m: m, n: n, R: R }
  };
}
return p17;
})();

/* 1.31 */
var e1_31 = (function () {
// 31. P(x) = kx³ + ax² + b нь (x − r)²-д хуваагдана ⇔ P(r) = P'(r) = 0 → a = −3kr/2, b = kr³/2
//     (эх: P = 2x³ + ax² + b, (x+2)² → a = 6, b = −8, ab = −48). kr тэгш байх ёстой (a, b бүхэл).
function p31() {
  var k = rnd(1, 4), r = pick([-3, -2, -1, 1, 2, 3]);
  if ((k * r) % 2 !== 0) return null;
  var a = -3 * k * r / 2, b = k * r * r * r / 2, ask = pick(['ab', 'ab', 'a+b']), v = ask === 'ab' ? a * b : a + b;
  if (Math.abs(a * b) > 400) return null;
  // Бодолт (гар бичмэл): Безугийн теоремоор P(r) = 0; (x − r)² | P → (x − r) | P' → P'(r) = 0 → a, дараа нь b.
  var r2 = r * r, C = -k * r * r * r, D = poly([1, -r]), pr = par(r), direct = r2 === 1 && ask === 'a+b';
  var Dd = '$(' + D + ')$-' + suf(Math.abs(r), 'д');   // (x±1)-д, (x±2)-т, (x±3)-т
  var s1 = '$P(x)$ нь ' + Dd + ' хуваагдах тул Безугийн теоремоор $P(' + r + ')=0$: $$P(' + r + ')=' + (k === 1 ? '' : k + '\\cdot ') + pr + '^3+a\\cdot ' + pr + '^2+b='
    + (-C) + tm(r2, 'a') + '+b=0' + (direct ? '.$$' : '\\Rightarrow ' + tm(r2, 'a', true) + '+b=' + C + '.$$');
  // b = C − r²·a (r² = 1 үед «C − a = C − 3» гэж давтахгүй)
  var bs = 'b=' + C + tm(-r2, 'a') + '=' + C + '-' + (r2 === 1 ? par(a) : r2 + '\\cdot ' + par(a)) + (r2 === 1 && a > 0 ? '' : '=' + C + sgn(-r2 * a)) + '=' + b;
  return {
    q: '$P(x)=' + tm(k, 'x^3', true) + '+ax^2+b$ олон гишүүнт $(' + D + ')^2$-д хуваагддаг бол $' + ask + '$ хэдтэй тэнцүү вэ?',
    a: '$' + ask + '=' + v + '$', wk: 30,
    s: direct ? [s1, 'Эндээс шууд $a+b=' + v + '$.'] : [
      s1,
      '$P(x)$ нь $(' + D + ')^2$-д хуваагддаг тул $P\'(x)=' + tm(3 * k, 'x^2', true) + '+2ax$ нь ' + Dd + ' хуваагдана. Безугийн теоремоор $$P\'(' + r + ')='
        + 3 * k + '\\cdot ' + pr + '^2+2a\\cdot ' + pr + '=' + 3 * k * r2 + tm(2 * r, 'a') + '=0\\Rightarrow a=' + a + '.$$',
      'Эндээс $' + bs + '$. Иймд $' + (ask === 'ab' ? 'ab=' + par(a) + '\\cdot ' + par(b) : 'a+b=' + a + sgn(b)) + '=' + v + '$.'
    ],
    t: { k: k, r: r, ask: ask }
  };
}
return p31;
})();

/* 3.18 */
var e3_18 = (function () {
// 18. p(x) = x³ + mx² + kax + la-ийн нэг хуваагч x + a ⇔ p(−a) = 0 (Безу):
//     p(−a) = −a³ + ma² − ka² + la = −a(a² − (m − k)a − l) = −a(a − α)(a − β) ⇒ a ∈ {0; α; β}  (α ≠ β, тэг биш бүхэл).
//     Заримдаа хуваагч x − a: p(a) = a(a² + (m + k)a + l).  (эх: x³ + 4x² + 7ax + 4a, x + a → a ∈ {−4; 0; 1})
function p18() {
  var al = nz(-5, 5), be = nz(-5, 5);
  if (al >= be) return null;
  var plus = rnd(0, 3) > 0, m = pick([2, 3, 4, 4, 5, 6, 1, -2, -3]), k, l;
  if (plus) { k = m - (al + be); l = -al * be; } else { k = -(al + be) - m; l = al * be; }
  if (!k || Math.abs(k) > 12) return null;
  if (plus && m === 4 && k === 7 && l === 4) return null;   // эх тоо тогтмол хувилбар болохгүй
  var vals = [0, al, be].sort(function (x, y) { return x - y; });
  return {
    q: '$x^3' + tm(m, 'x^2') + tm(k, 'ax') + tm(l, 'a') + '$ олон гишүүнтийн нэг хуваагч нь $x' + (plus ? '+' : '-') + 'a$ бол <span class="nw">$a$-ийн</span> утгыг олоорой.',
    a: '$a\\in\\{' + vals.join(';\\ ') + '\\}$',
    wk: 30,
    t: { m: m, k: k, l: l, plus: plus }
  };
}
return p18;
})();

/* 2.8 */
var e2_8 = (function () {
// 8. x² + px + c (c > 0, бүтэн квадрат биш) олон гишүүнтийн язгуурууд x₁x₂ = c, p = −(x₁ + x₂) (Виет).
//    Натурал язгууруудын хос {x₁ < x₂} = c-ийн хуваагчдын хос → τ(c)/2; бүхэл язгуур бол сөрөг хосууд нэмэгдэж τ(c).
//    (эх: c = 12 → (1; 12), (2; 6), (3; 4) — 3 хос)
var p8_C = [6, 8, 10, 12, 12, 12, 14, 15, 18, 18, 20, 20, 21, 22, 24, 24, 28, 30, 32, 40, 42, 44, 45, 48, 50, 52, 54, 56, 60, 63, 66, 70, 72, 75, 80, 84, 90, 96];
function p8() {
  var c = pick(p8_C), nat = rnd(1, 4) > 1, pairs = [], d;
  for (d = 1; d * d < c; d++) if (c % d === 0) pairs.push([d, c / d]);
  if (!nat && pairs.length > 4) return null;
  if (nat && pairs.length < 2) return null;
  var all = nat ? pairs : pairs.concat(pairs.map(function (q) { return [-q[0], -q[1]]; }));
  return {
    q: '$P(x)=x^2+px+' + c + '$ олон гишүүнт хичнээн хос ' + (nat ? 'натурал' : 'бүхэл') + ' язгууруудтай вэ?',
    a: '$' + all.length + '$ хос: ' + all.map(function (q) { return '$' + pt(q[0], q[1]) + '$'; }).join(', '),
    wk: 22,
    t: { c: c, nat: nat }
  };
}
return p8;
})();

/* 1.53 */
var e1_53 = (function () {
// 53. r₁ < r₂ < r₃ язгууртай гурван зэргийн олон гишүүнт: P(x) = (x − r₁)(x − r₂)(x − r₃) — задалж бичнэ.
function p53() {
  var r = [rnd(-5, 5), rnd(-5, 5), rnd(-5, 5)].sort(function (a, b) { return a - b; });
  if (r[0] === r[1] || r[1] === r[2]) return null;
  var e1 = r[0] + r[1] + r[2], e2 = r[0] * r[1] + r[0] * r[2] + r[1] * r[2], e3 = r[0] * r[1] * r[2];
  if (Math.abs(e3) > 60 || Math.abs(e2) > 40) return null;
  var fac = r.slice().sort(function (a, b) { return (a === 0 ? -1 : 0) - (b === 0 ? -1 : 0); })   // x хүчин зүйлийг эхэнд
    .map(function (v) { return v === 0 ? 'x' : '(x' + sgn(-v) + ')'; }).join('');
  // Бодолт (гар бичмэл): Безугийн теоремоор P(x) = a(x − r₁)(x − r₂)(x − r₃), a ≠ 0; a = 1 үед хоёр хаалтыг
  //   эхэлж үржүүлнэ: 0 язгуур бол x-ийн дараах хоёрыг, эсрэг тэмдэгтэй хос бол (x − u)(x + u) = x² − u², бусад үед эхний хоёрыг.
  var o = r.slice().sort(function (a, b) { return (a === 0 ? -1 : 0) - (b === 0 ? -1 : 0); }), mid;
  var p53_f = function (v) { return '(x' + sgn(-v) + ')'; };
  if (o[0] === 0) mid = 'x(' + poly([1, -(o[1] + o[2]), o[1] * o[2]]) + ')';
  else {
    var pr = [0, 1, 2], j1, j2;   // эсрэг тэмдэгтэй хос (ганц л байж болно) байвал түүнийг эхэлж үржүүлнэ
    for (j1 = 0; j1 < 3; j1++) for (j2 = j1 + 1; j2 < 3; j2++) if (o[j1] === -o[j2]) pr = [j1, j2, 3 - j1 - j2];
