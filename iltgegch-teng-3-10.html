<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Илтгэгч тэгшитгэл 3 — графикийн арга (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:10px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .gblock{display:flex;gap:16px;align-items:flex-start;break-inside:avoid;margin-bottom:8px}
  .gsvg{width:96mm;max-width:52%;height:auto;flex:0 0 auto;border:1px solid #eee7fb;border-radius:8px;background:#fff}
  .qlist{flex:1;display:flex;flex-direction:column;gap:8px;padding-top:6px}
  .qrow{display:flex;gap:8px;align-items:baseline;font-size:14px}.qrow .ql{font-weight:800;color:var(--purple);min-width:22px;font-size:12.5px}
  .qrow .ans{margin-left:auto;color:var(--soft);border-bottom:1px solid #cdbff0;min-width:60px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 16px;font-size:12.5px}.ans-list .a{display:flex;gap:6px}.ans-list .an{color:var(--soft);font-weight:800;min-width:24px}
  .ans-graphs{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.ans-graphs .gsvg{width:100%;max-width:none}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function r1(v){return Math.round(v*10)/10;}
function logA(a,c){return Math.log(c)/Math.log(a);}
var VB=240,VBY=210,PADL=26,PADR=10,PADT=10,PADB=22;
function Xc(w,x){return PADL+(x-w.x0)/(w.x1-w.x0)*(VB-PADL-PADR);}
function Yc(w,y){return VBY-PADB-(y-w.y0)/(w.y1-w.y0)*(VBY-PADT-PADB);}
function gridNS(w){var s='',x,y,x0=Xc(w,0);
  for(x=Math.ceil(w.x0);x<=Math.floor(w.x1);x++){var xp=Xc(w,x).toFixed(1);s+='<line x1="'+xp+'" y1="'+Yc(w,w.y0).toFixed(1)+'" x2="'+xp+'" y2="'+Yc(w,w.y1).toFixed(1)+'" stroke="#ece7f8" stroke-width="0.6"/>';}
  for(y=Math.ceil(w.y0);y<=Math.floor(w.y1);y++){var yp=Yc(w,y).toFixed(1);s+='<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+yp+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+yp+'" stroke="#ece7f8" stroke-width="0.6"/>';}
  var y0=Yc(w,0);
  s+='<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+y0.toFixed(1)+'" stroke="#4a4470" stroke-width="1.2"/>';
  s+='<line x1="'+x0.toFixed(1)+'" y1="'+Yc(w,w.y0).toFixed(1)+'" x2="'+x0.toFixed(1)+'" y2="'+Yc(w,w.y1).toFixed(1)+'" stroke="#4a4470" stroke-width="1.2"/>';
  for(x=Math.ceil(w.x0);x<=Math.floor(w.x1);x++){if(x===0)continue;s+='<text x="'+Xc(w,x).toFixed(1)+'" y="'+(y0+8).toFixed(1)+'" font-size="7" fill="#8a83a5" text-anchor="middle">'+x+'</text>';}
  for(y=2;y<=Math.floor(w.y1);y+=2){s+='<text x="'+(x0-3).toFixed(1)+'" y="'+(Yc(w,y)+2.3).toFixed(1)+'" font-size="7" fill="#8a83a5" text-anchor="end">'+y+'</text>';}
  s+='<text x="'+(Xc(w,w.x1)-1).toFixed(1)+'" y="'+(y0-3).toFixed(1)+'" font-size="7.5" fill="#4a4470" font-style="italic">x</text>';
  s+='<text x="'+(x0+4).toFixed(1)+'" y="'+(Yc(w,w.y1)+7).toFixed(1)+'" font-size="7.5" fill="#4a4470" font-style="italic">y</text>';
  return s;}
function curveNS(w,a){var pts=[],N=120;for(var i=0;i<=N;i++){var x=w.x0+(w.x1-w.x0)*i/N,y=Math.pow(a,x);if(y<w.y0-1||y>w.y1+1){pts.push(null);continue;}pts.push([Xc(w,x),Yc(w,y)]);}
  var d='',pen=false;pts.forEach(function(p){if(!p){pen=false;return;}d+=(pen?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' ';pen=true;});
  return '<path d="'+d+'" fill="none" stroke="#7B52EE" stroke-width="1.9"/>';}
function hlineNS(w,c){return '<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+Yc(w,c).toFixed(1)+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+Yc(w,c).toFixed(1)+'" stroke="#e0562d" stroke-width="1" stroke-dasharray="3 2"/>'
  +'<text x="'+(Xc(w,w.x1)-2).toFixed(1)+'" y="'+(Yc(w,c)-2).toFixed(1)+'" font-size="7" fill="#c2451f" text-anchor="end">'+c+'</text>';}
function dropNS(w,a,c){var x=logA(a,c);return '<line x1="'+Xc(w,x).toFixed(1)+'" y1="'+Yc(w,c).toFixed(1)+'" x2="'+Xc(w,x).toFixed(1)+'" y2="'+Yc(w,0).toFixed(1)+'" stroke="#16a34a" stroke-width="1" stroke-dasharray="3 2"/>'
  +'<circle cx="'+Xc(w,x).toFixed(1)+'" cy="'+Yc(w,c).toFixed(1)+'" r="2.3" fill="#16a34a"/>';}
function svgWrap(inner){return '<svg class="gsvg" viewBox="0 0 '+VB+' '+VBY+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';}
var BASES=[{a:2,win:{x0:-1.5,x1:3.6,y0:0,y1:9},exact:[2,4,8],approx:[3,5,6,7]},
           {a:3,win:{x0:-1.5,x1:2.4,y0:0,y1:10},exact:[3,9],approx:[2,5,7]}];
function build(){
  var b1=pick(BASES),b2=BASES[(BASES.indexOf(b1)+1)%BASES.length];
  var blocks=[b1,b2].map(function(B){
    var ex=shuffle(B.exact.slice()).slice(0,2),ap=shuffle(B.approx.slice()).slice(0,3);
    var cs=shuffle(ex.concat(ap));
    return {a:B.a,win:B.win,cs:cs,exact:ex};
  });
  var K=0;window.__A=[];
  var body=blocks.map(function(bl){
    var g=gridNS(bl.win)+bl.cs.map(function(c){return hlineNS(bl.win,c);}).join('')+curveNS(bl.win,bl.a);
    var rows=bl.cs.map(function(c){var k=K++;var xv=logA(bl.a,c),exact=bl.exact.indexOf(c)>=0;
      window.__A.push({k:k,tex:bl.a+'^x='+c,ans:exact?('x='+Math.round(xv)):('x\\approx '+r1(xv))});
      return '<div class="qrow"><span class="ql">'+(k+1)+'.</span><span>$'+bl.a+'^x='+c+'$</span><span class="ans">&nbsp;</span></div>';}).join('');
    return '<div class="gblock">'+svgWrap(g)+'<div class="qlist"><div style="font-size:11px;color:#8a83a5;margin-bottom:2px">$y='+bl.a+'^x$ график</div>'+rows+'</div></div>';
  }).join('');
  var ansGraphs=blocks.map(function(bl){var g=gridNS(bl.win)+bl.cs.map(function(c){return hlineNS(bl.win,c);}).join('')+bl.cs.map(function(c){return dropNS(bl.win,bl.a,c);}).join('')+curveNS(bl.win,bl.a);return svgWrap(g);}).join('');
  var ansList='<div class="ans-list">'+window.__A.map(function(a){return '<div class="a"><span class="an">'+(a.k+1)+'.</span><span>$'+a.tex+'\\Rightarrow '+a.ans+'$</span></div>';}).join('')+'</div>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Илтгэгч тэгшитгэл 3 — графикийн арга</h1><div class="sub">$a^x=c$ тэгшитгэлийг $y=a^x$ график ба $y=c$ шулууны огтлолцлоор бодох · 6.5 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$a^x=c$ тэгшитгэлийн шийд нь $y=a^x$ график ба $y=c$ хэвтээ шулууны огтлолцлын цэгийн абсцисс юм. Бүхэл зэрэгт нарийн, бусад тохиолдолд $0.1$ нарийвчлалтай ойролцоо ол.</div>'
    +'<div class="task">Графикийг ашиглан тэгшитгэл бүрийн шийдийг ол (шаардлагатай бол ойролцоолол).</div>'
    +body
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2>'+ansList+'<div class="task" style="margin-top:12px">Огтлолцлын цэгүүд</div><div class="ans-graphs">'+ansGraphs+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Илтгэгч тэгшитгэл 3 — графикийн арга (10-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=37"></script>
</body>
</html>
