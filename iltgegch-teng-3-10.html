<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Илтгэгч тэгшитгэл 3 — графикийн арга (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:10px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .gblock{display:flex;gap:16px;align-items:flex-start;break-inside:avoid;margin-bottom:10px}
  .gsvg{width:62mm;max-width:48%;height:auto;flex:0 0 auto;border:1px solid #e5ddf6;border-radius:8px;background:linear-gradient(#fff,#fdfcff)}
  .panel{flex:1;display:flex;flex-direction:column;gap:6px;padding-top:2px;min-width:0}
  .vtab{border-collapse:collapse;font-size:11px}.vtab td{border:1px solid #d9d0f0;padding:2px 6px;text-align:center;white-space:nowrap}.vtab tr:first-child td{background:#f6f2fe;font-weight:700;color:#5a32d6}
  .hint{font-size:10.5px;color:#8a83a5}
  .qlist{display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .qrow{display:flex;gap:8px;align-items:baseline;font-size:14px}.qrow .ql{font-weight:800;color:var(--purple);min-width:22px;font-size:12.5px}
  .qrow .ans{margin-left:auto;color:var(--soft);border-bottom:1px solid #cdbff0;min-width:52px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 16px;font-size:12.5px}.ans-list .a{display:flex;gap:6px}.ans-list .an{color:var(--soft);font-weight:800;min-width:24px}
  .ans-graphs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;margin-top:10px}.ans-graphs .gsvg{width:100%;max-width:none}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function r1(v){return Math.round(v*10)/10;}
function logA(a,c){return Math.log(c)/Math.log(a);}
// ── Координатын хавтгай: квадрат нүд, графикаас хамаарч хэмжээ өөрчлөгдөнө ──
var UNIT=16,PADL=22,PADR=11,PADT=12,PADB=18;
function vbW(w){return PADL+PADR+(w.x1-w.x0)*UNIT;}
function vbH(w){return PADT+PADB+(w.y1-w.y0)*UNIT;}
function Xc(w,x){return PADL+(x-w.x0)*UNIT;}
function Yc(w,y){return PADT+(w.y1-y)*UNIT;}
function gridSq(w){var s='',x,y,x0=Xc(w,0),y0=Yc(w,0);
  for(x=Math.ceil(w.x0);x<=Math.floor(w.x1);x++){var xp=Xc(w,x).toFixed(1);s+='<line x1="'+xp+'" y1="'+Yc(w,w.y0).toFixed(1)+'" x2="'+xp+'" y2="'+Yc(w,w.y1).toFixed(1)+'" stroke="#ece7f8" stroke-width="0.7"/>';}
  for(y=Math.ceil(w.y0);y<=Math.floor(w.y1);y++){var yp=Yc(w,y).toFixed(1);s+='<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+yp+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+yp+'" stroke="#ece7f8" stroke-width="0.7"/>';}
  s+='<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+y0.toFixed(1)+'" stroke="#4a4470" stroke-width="1.3"/>';
  s+='<line x1="'+x0.toFixed(1)+'" y1="'+Yc(w,w.y0).toFixed(1)+'" x2="'+x0.toFixed(1)+'" y2="'+Yc(w,w.y1).toFixed(1)+'" stroke="#4a4470" stroke-width="1.3"/>';
  s+='<polygon points="'+Xc(w,w.x1).toFixed(1)+','+y0.toFixed(1)+' '+(Xc(w,w.x1)-4.5).toFixed(1)+','+(y0-2.6).toFixed(1)+' '+(Xc(w,w.x1)-4.5).toFixed(1)+','+(y0+2.6).toFixed(1)+'" fill="#4a4470"/>';
  s+='<polygon points="'+x0.toFixed(1)+','+Yc(w,w.y1).toFixed(1)+' '+(x0-2.6).toFixed(1)+','+(Yc(w,w.y1)+4.5).toFixed(1)+' '+(x0+2.6).toFixed(1)+','+(Yc(w,w.y1)+4.5).toFixed(1)+'" fill="#4a4470"/>';
  for(x=Math.ceil(w.x0);x<=Math.floor(w.x1);x++){if(x===0)continue;s+='<text x="'+Xc(w,x).toFixed(1)+'" y="'+(y0+7.5).toFixed(1)+'" font-size="6.5" fill="#8a83a5" text-anchor="middle">'+x+'</text>';}
  for(y=Math.ceil(w.y0);y<=Math.floor(w.y1);y++){if(y===0||y%2!==0)continue;s+='<text x="'+(x0-3).toFixed(1)+'" y="'+(Yc(w,y)+2.2).toFixed(1)+'" font-size="6.5" fill="#8a83a5" text-anchor="end">'+y+'</text>';}
  s+='<text x="'+(Xc(w,w.x1)-1).toFixed(1)+'" y="'+(y0-3).toFixed(1)+'" font-size="7" fill="#4a4470" font-style="italic">x</text>';
  s+='<text x="'+(x0+4).toFixed(1)+'" y="'+(Yc(w,w.y1)+7).toFixed(1)+'" font-size="7" fill="#4a4470" font-style="italic">y</text>';
  return s;}
function curveSq(w,a){var pts=[],N=140;for(var i=0;i<=N;i++){var x=w.x0+(w.x1-w.x0)*i/N,y=Math.pow(a,x);if(y<w.y0-0.5||y>w.y1+0.5){pts.push(null);continue;}pts.push([Xc(w,x),Yc(w,y)]);}
  var d='',pen=false;pts.forEach(function(p){if(!p){pen=false;return;}d+=(pen?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' ';pen=true;});
  return '<path d="'+d+'" fill="none" stroke="#7B52EE" stroke-width="1.9"/>';}
function hlineSq(w,c){return '<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+Yc(w,c).toFixed(1)+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+Yc(w,c).toFixed(1)+'" stroke="#e0562d" stroke-width="1" stroke-dasharray="3 2"/>'
  +'<text x="'+(Xc(w,w.x1)-2).toFixed(1)+'" y="'+(Yc(w,c)-1.6).toFixed(1)+'" font-size="6.5" fill="#c2451f" text-anchor="end">'+c+'</text>';}
function lineSq(w,k,b){return '<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+Yc(w,k*w.x0+b).toFixed(1)+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+Yc(w,k*w.x1+b).toFixed(1)+'" stroke="#e0562d" stroke-width="1.6"/>';}
function dropSq(w,x0,yv){return '<line x1="'+Xc(w,x0).toFixed(1)+'" y1="'+Yc(w,yv).toFixed(1)+'" x2="'+Xc(w,x0).toFixed(1)+'" y2="'+Yc(w,0).toFixed(1)+'" stroke="#16a34a" stroke-width="1" stroke-dasharray="3 2"/>'
  +'<circle cx="'+Xc(w,x0).toFixed(1)+'" cy="'+Yc(w,yv).toFixed(1)+'" r="2.4" fill="#16a34a"/>';}
function svgW(w,inner){return '<svg class="gsvg" viewBox="0 0 '+vbW(w).toFixed(0)+' '+vbH(w).toFixed(0)+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';}
function valTable(a,xs,filled){var hx='<tr><td>$x$</td>'+xs.map(function(x){return '<td>$'+x+'$</td>';}).join('')+'</tr>';
  var hy='<tr><td>$'+a+'^x$</td>'+xs.map(function(x){if(!filled)return '<td>&nbsp;</td>';var v=x>=0?(''+Math.pow(a,x)):('\\tfrac{1}{'+Math.pow(a,-x)+'}');return '<td>$'+v+'$</td>';}).join('')+'</tr>';
  return '<table class="vtab">'+hx+hy+'</table>';}
var WINS={2:{win:{x0:-2.4,x1:3.4,y0:0,y1:8.7},xs:[-2,-1,0,1,2,3],exact:[2,4,8],approx:[3,5,6]},
          3:{win:{x0:-1.7,x1:2.4,y0:0,y1:9.7},xs:[-1,0,1,2],exact:[3,9],approx:[2,5,7]}};
function build(){
  var K=0;window.__A=[];
  var bs=shuffle([2,3]);
  // ── Хэсэг 1: y=a^x график байгуулж a^x=c бод ──
  var baseBlocks=bs.map(function(a){var W=WINS[a];
    var ex=shuffle(W.exact.slice()).slice(0,2),ap=shuffle(W.approx.slice()).slice(0,2),cs=shuffle(ex.concat(ap));
    return {a:a,win:W.win,xs:W.xs,cs:cs,exact:ex};});
  var body1=baseBlocks.map(function(bl){
    var g=gridSq(bl.win);
    var rows=bl.cs.map(function(c){var k=K++;var xv=logA(bl.a,c),exact=bl.exact.indexOf(c)>=0;
      window.__A.push({k:k,tex:bl.a+'^x='+c,ans:exact?('x='+Math.round(xv)):('x\\approx '+r1(xv))});
      return '<div class="qrow"><span class="ql">'+(k+1)+'.</span><span>$'+bl.a+'^x='+c+'$</span><span class="ans">&nbsp;</span></div>';}).join('');
    return '<div class="gblock">'+svgW(bl.win,g)+'<div class="panel">'+valTable(bl.a,bl.xs,false)+'<div class="hint">Хүснэгтийн $'+bl.a+'^x$ мөрийг нөхөж, $y='+bl.a+'^x$ муруйг, шаардлагатай $y=c$ шулуунуудыг өөрөө байгуулж огтлолцлыг ол.</div><div class="qlist">'+rows+'</div></div></div>';
  }).join('');
  // ── Хэсэг 2: илтгэгч ба шугаман огтлолцол ──
  var elItems=[],eg=0,eseen={};
  while(elItems.length<2&&eg++<300){var a=pick(bs),W=WINS[a],x0=pick([1,2]),k=pick([-1,-2]),y0=Math.pow(a,x0);if(y0>W.win.y1-0.6)continue;var b=y0-k*x0;
    if(k*W.win.x0+b>W.win.y1+2)continue;var key=a+'|'+x0+'|'+k;if(eseen[key])continue;eseen[key]=1;
    elItems.push({a:a,win:W.win,xs:W.xs,k:k,b:b,x0:x0,y0:y0});}
  var body2=elItems.map(function(e){var qk=K++;var rhs=''+e.b+(e.k===-1?'-x':'-'+(-e.k)+'x');
    window.__A.push({k:qk,tex:e.a+'^x='+rhs,ans:'x='+e.x0});
    var g=gridSq(e.win);
    return '<div class="gblock">'+svgW(e.win,g)+'<div class="panel">'+valTable(e.a,e.xs,false)+'<div class="hint">Хүснэгтийг нөхөж, $y='+e.a+'^x$ муруй ба $y='+rhs+'$ шулууныг өөрөө байгуулж, огтлолцлыг ол.</div><div class="qlist"><div class="qrow"><span class="ql">'+(qk+1)+'.</span><span>$'+e.a+'^x='+rhs+'$</span><span class="ans">&nbsp;</span></div></div></div></div>';}).join('');
  // ── Хариу ──
  var ansList='<div class="ans-list">'+window.__A.map(function(a){return '<div class="a"><span class="an">'+(a.k+1)+'.</span><span>$'+a.tex+'\\Rightarrow '+a.ans+'$</span></div>';}).join('')+'</div>';
  var ag1=baseBlocks.map(function(bl){return svgW(bl.win,gridSq(bl.win)+bl.cs.map(function(c){return hlineSq(bl.win,c);}).join('')+bl.cs.map(function(c){return dropSq(bl.win,logA(bl.a,c),c);}).join('')+curveSq(bl.win,bl.a));}).join('');
  var ag2=elItems.map(function(e){return svgW(e.win,gridSq(e.win)+lineSq(e.win,e.k,e.b)+dropSq(e.win,e.x0,e.y0)+curveSq(e.win,e.a));}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Илтгэгч тэгшитгэл 3 — графикийн арга</h1><div class="sub">$y=a^x$ графикийг өөрөө байгуулж $a^x=c$ ба $a^x=f(x)$ тэгшитгэлийг бодох · 6.5 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Утгын хүснэгтийг ашиглан $y=a^x$ муруйг координатын хавтгайд өөрөө байгуул. Тэгшитгэлийн шийд нь график ба шулууны огтлолцлын цэгийн $x$ координат. Бүхэл зэрэгт нарийн, бусдад $0.1$ ойролцоо ол.</div>'
    +'<div class="task">1. $y=a^x$ графикийг байгуулж, $y=c$ шулуунтай огтлолцуулан тэгшитгэлийг бод.</div>'+body1
    +'<div class="task">2. $y=a^x$ графикийг байгуулж, шугаман функцтэй огтлолцуулан тэгшитгэлийг бод.</div>'+body2
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2>'+ansList
    +'<div class="task" style="margin-top:12px">Нөхсөн утгын хүснэгт</div><div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:4px">'+baseBlocks.map(function(bl){return valTable(bl.a,bl.xs,true);}).join('')+'</div>'
    +'<div class="task" style="margin-top:12px">Байгуулсан график ба огтлолцлын цэгүүд</div><div class="ans-graphs">'+ag1+ag2+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Илтгэгч тэгшитгэл 3 — графикийн арга (10-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
