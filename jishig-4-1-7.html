<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IV бүлэг — Жишиг даалгавар 1 (7-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 7-р анги · IV бүлэг. Магадлал — Жишиг даалгавар 1 (4.1 Эсрэг үзэгдлийн магадлал · 4.2 Нэгдсэн туршилт (шоо, зоос, шагай)) */
function pf(m, n) { var r = fr(m, n), full = '\\dfrac{' + m + '}{' + n + '}'; return r === full ? full : full + '=' + r; }   // бүтэн = хураасан бутархай
var COL = ['улаан', 'цагаан', 'хөх', 'шар', 'ногоон'];

// 1. P(A) өгөгдсөн — эсрэг үзэгдлийн магадлал P(Ā)=1−P(A) (4.1)
function g1() {
  if (rnd(0, 1)) {
    var h = rnd(5, 95); if (h % 10 === 0) return null;
    return { stem: '$P(A)=' + dFmt(h, 2) + '$', a: 'P(\\bar A)=1-' + dFmt(h, 2) + '=' + dFmt(100 - h, 2) };
  }
  var b = rnd(4, 20), a = rnd(1, b - 1); if (gcd(a, b) !== 1) return null;
  return { stem: '$P(A)=\\dfrac{' + a + '}{' + b + '}$', a: 'P(\\bar A)=1-\\dfrac{' + a + '}{' + b + '}=' + fr(b - a, b) };
}
// 2. Эсрэг үзэгдлийг нэрлэж, магадлалыг нь олох — шоо, зоос, уут, анги (4.1)
var EV = [
  ['шоо орхиход тэгш тоо буух', 'сондгой тоо буух', 3, 6],
  ['шоо орхиход анхны тоо буух', 'анхны бус тоо ($1, 4, 6$) буух', 3, 6],
  ['шоо орхиход $3$ тоонд хуваагдах тоо буух', '$3$ тоонд хуваагдахгүй тоо ($1, 2, 4, 5$) буух', 4, 6],
  ['шоо орхиход $6$ буух', '$6$ буухгүй байх', 5, 6],
  ['шоо орхиход $5$ буюу $6$ буух', '$1, 2, 3$ эсвэл $4$ буух', 4, 6],
  ['зоосыг $2$ удаа орхиход ядаж нэг удаа сүлд буух', 'хоёр удаад нь тоо буух', 1, 4],
  ['зоосыг $3$ удаа орхиход бүх удаад сүлд буух', 'ядаж нэг удаа тоо буух', 7, 8],
  ['хоёр зоосыг зэрэг орхиход ижил талаараа буух', 'ялгаатай талаараа буух', 2, 4]
];
function g2() {
  var t = rnd(1, 4);
  if (t <= 2) { var e = pick(EV); return { stem: '$A$: ' + e[0] + '.', a: '$\\bar A$: ' + e[1] + '; $P(\\bar A)=' + pf(e[2], e[3]) + '$' }; }
  if (t === 3) {
    var cs = shuffle(COL).slice(0, 2), a = rnd(2, 12), b = rnd(2, 12); if (a === b) return null;
    return { stem: 'Уутанд $' + a + '$ ' + cs[0] + ', $' + b + '$ ' + cs[1] + ' бөмбөг бий. $A$: таамгаар авсан бөмбөг ' + cs[0] + ' байх.',
      a: '$\\bar A$: ' + cs[1] + ' бөмбөг гарах; $P(\\bar A)=' + pf(b, a + b) + '$' };
  }
  var N = rnd(24, 36), g = rnd(8, N - 8);
  return { stem: 'Ангийн $' + N + '$ сурагчийн $' + g + '$ нь охид. $A$: санамсаргүй сонгосон сурагч охин байх.',
    a: '$\\bar A$: хүү байх; $P(\\bar A)=' + pf(N - g, N) + '$' };
}
// 3. Нэгдсэн туршилтын бүх боломжит үр дүнгийн тоо — үржвэрийн зарчим (4.2)
var EXP = [['Хоёр шоо', [6, 6]], ['Шоо ба зоос', [6, 2]], ['Гурван зоос', [2, 2, 2]], ['Шоо ба хоёр зоос', [6, 2, 2]], ['Хоёр шоо ба зоос', [6, 6, 2]],
  ['Шоо ба шагай', [6, 4]], ['Хоёр шагай', [4, 4]], ['Дөрвөн зоос', [2, 2, 2, 2]], ['Гурван шоо', [6, 6, 6]], ['Шагай ба зоос', [4, 2]],
  ['Шагай ба хоёр зоос', [4, 2, 2]], ['Хоёр шагай ба шоо', [4, 4, 6]]];
function g3() {
  var e = pick(EXP), P = 1; e[1].forEach(function (x) { P *= x; });
  return { stem: e[0], a: e[1].join('\\cdot ') + '=' + P };
}
// 4. Нэгдсэн туршилтын магадлал: зоосыг 2–3 удаа, шоо ба зоос, хоёр шооны нийлбэр (4.2)
var DIE = [['тэгш тоо', 3], ['сондгой тоо', 3], ['анхны тоо', 3], ['$6$', 1], ['$3$ тоонд хуваагдах тоо', 2], ['$1$ буюу $2$', 2], ['$5$ буюу $6$', 2]];
function g4() {
  var t = rnd(1, 3);
  if (t === 1) {
    var n = rnd(2, 3), T = Math.pow(2, n), ev = pick([['ядаж нэг удаа сүлд буух', T - 1], ['нэг ч удаа сүлд буухгүй байх', 1], ['яг нэг удаа сүлд буух', n], ['бүх удаад ижил талаараа буух', 2]]);
    return { stem: 'Зоосыг $' + n + '$ удаа орхив. $A$: ' + ev[0] + '.', a: 'P(A)=' + pf(ev[1], T) };
  }
  if (t === 2) {
    var e = pick(DIE);
    return { stem: 'Шоо ба зоосыг зэрэг орхив. $A$: шоо ' + e[0] + ', зоос ' + pick(['сүлд', 'тоо']) + ' буух.', a: 'P(A)=' + pf(e[1], 12) };
  }
  var s = rnd(2, 12);
  return { stem: 'Хоёр шоог зэрэг орхив. $A$: нүднүүдийн нийлбэр $' + s + '$ байх.', a: 'P(A)=' + pf(6 - Math.abs(7 - s), 36) };
}
// 5. Бодлого: эсрэг үзэгдлээр бөмбөгийн тоо, нийт тоог олох; сугалаа (4.1)
function g5() {
  var t = rnd(1, 3), col = pick(COL);
  if (t === 1) {
    var N = pick([20, 25, 40, 50]), k = rnd(2, N - 2), q = 100 * (N - k) / N; if (q !== Math.round(q) || q === 50) return null;
    return { stem: 'Уутанд нийт $' + N + '$ бөмбөг бий. Таамгаар авсан бөмбөг ' + col + ' биш байх магадлал $' + dFmt(q, 2) + '$ бол хэдэн ' + col + ' бөмбөг байгаа вэ?',
      a: col + ' гарах магадлал $1-' + dFmt(q, 2) + '=' + dFmt(100 - q, 2) + '$; $' + dFmt(100 - q, 2) + '\\cdot ' + N + '=' + k + '$ бөмбөг' };
  }
  if (t === 2) {
    var P = pick([[1, 4], [1, 5], [2, 5], [1, 3], [3, 10], [1, 6], [2, 7]]), m = rnd(2, 5), k2 = P[0] * m, N2 = P[1] * m;
    return { stem: 'Уутанд $' + k2 + '$ ' + col + ' бөмбөг бий. Таамгаар авсан бөмбөг ' + col + ' биш байх магадлал $' + fr(P[1] - P[0], P[1]) + '$ бол уутанд нийт хэдэн бөмбөг байгаа вэ?',
      a: col + ' гарах магадлал $1-' + fr(P[1] - P[0], P[1]) + '=' + fr(P[0], P[1]) + '$; нийт $' + k2 + '\\div ' + fr(P[0], P[1]) + '=' + N2 + '$ бөмбөг' };
  }
  var N3 = pick([50, 100, 200, 500]), k3 = pick([2, 4, 5, 10, 15, 20, 25]); if (k3 * 5 > N3) return null;
  return { stem: 'Сугалааны $' + N3 + '$ билетийн $' + k3 + '$ нь хожилтой. Таамгаар авсан нэг билет хожилгүй байх магадлалыг ол.',
    a: 'P=1-' + fr(k3, N3) + '=' + fr(N3 - k3, N3) };
}

CMX.jishig({
  title: 'IV бүлэг — Жишиг даалгавар 1',
  sub: 'Эсрэг үзэгдлийн магадлал · нэгдсэн туршилт',
  grade: '7-р анги',
  rule: '$P(A)=\\dfrac{m}{n}$ ($m$ — тохирох, $n$ — бүх боломжит үр дүн) &nbsp;·&nbsp; $P(\\bar A)=1-P(A)$ &nbsp;·&nbsp; Нэгдсэн туршилтын үр дүнгийн тоо $=n_1\\cdot n_2\\cdot\\ldots$',
  tasks: [
    { label: 'Эсрэг үзэгдлийн магадлалыг ол.', gen: g1, n: 8, nw: 4, cols: 4, wk: 12 },
    { label: 'Эсрэг үзэгдлийг нэрлэж, магадлалыг нь ол.', gen: g2, n: 6, nw: 4, cols: 2, wk: 14 },
    { label: 'Зэрэг орхиход гарах бүх боломжит үр дүнгийн тоог ол.', gen: g3, n: 8, nw: 4, cols: 4, wk: 10 },
    { label: 'Нэгдсэн туршилтын магадлалыг ол.', gen: g4, n: 6, nw: 4, cols: 2, wk: 16 },
    { label: 'Бодлогыг бод.', gen: g5, n: 4, nw: 2, cols: 2, wk: 22 }
  ]
});
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
