<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1px solid #c3d6ee;border-radius:2px;background-color:#fff;background-image:linear-gradient(to right,#dbe6f5 1px,transparent 1px),linear-gradient(to bottom,#dbe6f5 1px,transparent 1px);background-size:19px 19px;height:16mm;margin-top:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wk.wkc{height:auto;overflow:hidden}
  .cg{--c:19px;position:relative;margin:19px 0 19px 19px}
  .cg span{position:absolute;width:var(--c);height:var(--c);line-height:var(--c);text-align:center;font-size:13.5px;font-weight:600;color:#1a1030;font-family:'Segoe UI',Arial,sans-serif}
  .cg span.sg{transform:translateY(-50%);font-weight:700;color:#5a32d6}
  .cg .hl{position:absolute;height:0;border-top:1.6px solid #1a1030;margin-top:-0.8px}
  .cg .vl{position:absolute;width:0;border-left:1.6px solid #1a1030;margin-left:-0.8px}
  .cg.sm{--c:15px;margin:3px 0 1px;border:1px solid #d3e1f3;box-sizing:content-box;background-color:#fff;background-image:linear-gradient(to right,#dfe9f6 1px,transparent 1px),linear-gradient(to bottom,#dfe9f6 1px,transparent 1px);background-size:15px 15px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cg.sm span{font-size:10.5px}
  .asol{display:inline-block;vertical-align:top;margin:0 0 0 12px}
  .task{break-after:avoid;page-break-after:avoid}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}

<script>
// ══════════ g4core.js — 4-р ангийн нийтлэг хөдөлгүүр (g5core + баганан бичиглэл) ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}

// ══════════ 4-р анги: тоо бичих, дөрвөлжин тор, баганан бичиглэл ══════════
// nf(n): KaTeX доторх тоо — 5+ оронтойг мянгатаар \, зайтай (24\,175), 4 оронтойг зайгүй (1734) — сурах бичгийн дагуу
function nf(n){var neg=n<0,s=String(Math.abs(n));if(s.length>=5)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,'\\,');return (neg?'-':'')+s;}
// nt(n): энгийн текстэд (үгэн бодлого, $-гүй) — 24 175 (тасрахгүй зай)
function nt(n){var neg=n<0,s=String(Math.abs(n));if(s.length>=5)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'−':'')+s;}
// Бодолтын зайн өндөр (мм) → торны 19px нүдний бүхэл тоо (дэвтрийн ~5 мм дөрвөлжин)
function g4wk(mm){return Math.max(2,Math.round((+mm||20)*3.7795/19))*19+'px';}

// ── Нүдний тор: cells [{r,c,t,cls}], lines [{t:'h'|'v',r,c,len}] ──
//   h: r-р мөрний ДООД ирмэг дээр c-ээс len нүд; v: c-р баганын ЗҮҮН ирмэг дээр r-ээс len мөр.
//   cls:'sg' — тэмдэг (×, +, −) хагас мөр дээш (хоёр мөрийн дунд).
function cgHtml(R,C,cells,lines,cls){
  var h='<div class="cg'+(cls?' '+cls:'')+'" style="width:calc(var(--c)*'+C+');height:calc(var(--c)*'+R+')">';
  cells.forEach(function(x){h+='<span class="'+(x.cls||'d')+'" style="left:calc(var(--c)*'+x.c+');top:calc(var(--c)*'+x.r+')">'+x.t+'</span>';});
  lines.forEach(function(l){
    if(l.t==='h')h+='<i class="hl" style="left:calc(var(--c)*'+l.c+');top:calc(var(--c)*'+(l.r+1)+');width:calc(var(--c)*'+l.len+')"></i>';
    else h+='<i class="vl" style="left:calc(var(--c)*'+l.c+');top:calc(var(--c)*'+l.r+');height:calc(var(--c)*'+l.len+')"></i>';
  });
  return h+'</div>';
}
// s мөрийн цифрүүдийг r-р мөрөнд, сүүлийн цифр нь end баганад байхаар (баруун тийш тэгшилж) байрлуулна
function cgPut(cells,s,r,end){s=String(s);for(var i=0;i<s.length;i++)cells.push({r:r,c:end-(s.length-1-i),t:s[i]});}

// ── Баганан үржүүлэх (сурах бичиг 33–34, 40: хэсэгчилсэн үржвэрийг ТЭГТЭЙ нь бичнэ: 990, 1980) ──
// Буцаах: {q: асуултын тор (2 үржигдэхүүн + зураас), s: бүрэн бодолт, R: бодолтын мөрийн тоо}
function colMul(a,b){
  var A=String(a),B=String(b),P=String(a*b),m=B.length,parts=[];
  for(var i=0;i<m;i++){var d=+B[m-1-i];if(d)parts.push(String(a*d*Math.pow(10,i)));}
  var many=parts.length>1,W=Math.max(A.length,B.length+1,P.length);
  parts.forEach(function(p){W=Math.max(W,p.length);});
  var C=W+1,end=W;
  function head(cells,lines){cgPut(cells,A,0,end);cgPut(cells,B,1,end);cells.push({r:1,c:end-Math.max(A.length,B.length),t:'×',cls:'sg'});
    lines.push({t:'h',r:1,c:end-Math.max(A.length,B.length,P.length)+1,len:Math.max(A.length,B.length,P.length)});}
  var R=many?3+parts.length:3;
  var qc=[],ql=[];head(qc,ql);
  var sc=[],sl=[];head(sc,sl);
  if(many){
    parts.forEach(function(p,i){cgPut(sc,p,2+i,end);});
    sc.push({r:3,c:end-Math.max.apply(null,parts.map(function(p){return p.length;})),t:'+',cls:'sg'});
    sl.push({t:'h',r:1+parts.length,c:end-P.length+1,len:P.length});
    cgPut(sc,P,2+parts.length,end);
  } else cgPut(sc,P,2,end);
  return {q:cgHtml(R+1,C+1,qc,ql),s:cgHtml(R,C,sc,sl,'sm'),R:R};
}

// ── Баганан (булангаар) хуваах — товч арга (сурах бичиг 40, 43: хасагдахуун мөр бүрт буулгасан цифртэй) ──
// a ≥ b > 0. Үлдэгдэлтэй байж болно. Буцаах: {q, s, R, quo, rem}
function colDiv(a,b){
  var A=String(a),n=A.length,Bs=String(b),quo=Math.floor(a/b),Q=String(quo),rem=a%b;
  var pos=0,cur=+A[0];
  while(cur<b&&pos<n-1){pos++;cur=cur*10+(+A[pos]);}
  var seq=[],prevV=cur,prevEnd=pos,guard=0;
  while(guard++<40){
    var qd=Math.floor(cur/b),pr=qd*b;
    seq.push({k:'p',v:pr,end:pos,above:prevV});
    var r=cur-pr;pos++;
    if(pos>=n){seq.push({k:'r',v:r,end:n-1});break;}
    cur=r*10+(+A[pos]);
    while(cur<b&&pos<n-1){pos++;cur=cur*10+(+A[pos]);}
    if(cur<b){seq.push({k:'r',v:cur,end:n-1});break;}
    seq.push({k:'c',v:cur,end:pos});prevV=cur;
  }
  var qw=Math.max(Bs.length,Q.length),qwMax=Math.max(Bs.length,n-Bs.length+1);
  var C=1+n+Math.max(qw,qwMax)+1,R=1+seq.length;
  function col(i){return 1+i;}                        // A-ийн i-р цифрийн багана
  function head(cells,lines,lw){cgPut(cells,A,0,col(n-1));cgPut(cells,Bs,0,col(n-1)+Bs.length);
    lines.push({t:'v',r:0,c:col(n-1)+1,len:2});lines.push({t:'h',r:0,c:col(n-1)+1,len:lw});}
  var qc=[],ql=[];head(qc,ql,qwMax);

}

// ── Баганан нэмэх / хасах (2–3 нэмэгдэхүүн; хасахад a ≥ b) ──
function colAddSub(nums,op){
  var res=op==='+'?nums.reduce(function(s,x){return s+x;},0):nums[0]-nums[1];
  var S=nums.map(String),Rs=String(res),W=Math.max(Rs.length,Math.max.apply(null,S.map(function(s){return s.length;})));
  var C=W+1,end=W,k=S.length,R=k+1;
  function head(cells,lines){S.forEach(function(s,i){cgPut(cells,s,i,end);});
    cells.push({r:k-1,c:end-W,t:op==='+'?'+':'−',cls:'sg'});lines.push({t:'h',r:k-1,c:1,len:W});}
  var qc=[],ql=[];head(qc,ql);
  var sc=[],sl=[];head(sc,sl);cgPut(sc,Rs,k,end);
  return {q:cgHtml(R+1,C+1,qc,ql),s:cgHtml(R,C,sc,sl,'sm'),R:R,res:res};

// ── туслахууд ──

function h4_101_hlNum(n,p){var s=String(n),L=s.length,out='';
  for(var i=0;i<L;i++){out+=(i===p)?'\\underline{\\textcolor{#7B52EE}{\\mathbf{'+s[i]+'}}}':s[i];var rem=L-1-i;if(L>=5&&rem>0&&rem%3===0)out+='\\,';}
  return out;}
function h4_101_carries(a,b){var c=0,k=0;while(a>0||b>0){var s=a%10+b%10+c;c=s>=10?1:0;k+=c;a=Math.floor(a/10);b=Math.floor(b/10);}return k;}
function h4_101_borrows(a,b){var br=0,k=0;while(a>0){var d=a%10-br-b%10;br=d<0?1:0;k+=br;a=Math.floor(a/10);b=Math.floor(b/10);}return k;}

// ── 1. Онцолсон цифрийн орны утга (х.4, 1) ──
function g_101_placeVal(){

// ── 2. Зүй тогтол: дараагийн гурван тоо (х.4, 2) ──
function g_101_pattern(){

// ── 4. Буурах эрэмбэ (х.4, 4) ──

  } else {

    while(arr.length<6&&g++<300){var src=String(pick(arr)).split(''),p=rnd(0,3),nd=rnd(p===0?1:0,9);
      if(+src[p]===nd)continue;src[p]=String(nd);var v=+src.join('');if(arr.indexOf(v)<0)arr.push(v);}
    if(arr.length<6)return null;

// ── 5, 7. Баганаар нэмэх, хасах (5 оронтой хүртэл) ──
function h4_101_cAdd(){

// 5 нүд өгнө: нэг бүтэн гурвал (дээд + доорх 2 нүд — дүрмийг харуулна) + өөр 2 нүд;

function g_101_pyramid(){

function h4_101_w3groups(){

  if(t===2){m=rnd(1,9);r=rnd(1,99);L=U2(m,'м',r,'см');return {q:'$'+L+'='+B1('см')+'$',a:'$'+L+'='+U(m*100+r,'см')+'$',key:'101un:2:'+m+':'+r};}
  if(t===3){n=rnd(1001,9999);if(n%1000===0)return null;L=U(n,'г');return {q:'$'+L+'='+B2('кг','г')+'$',a:'$'+L+'='+U2(Math.floor(n/1000),'кг',n%1000,'г')+'$',key:'101un:3:'+n};}
  if(t===4){k=rnd(2,9);var s4=rnd(1,3);
    if(s4===1){L=U(k,'кг');R=U(k*1000,'г');}
    else if(s4===2){r=rnd(5,995);L=U2(k,'кг',r,'г');R=U(k*1000+r,'г');}
    else {r=rnd(5,995);L=U2(k,'т',r,'кг');R=U(k*1000+r,'кг');}
    return {q:'$'+L+'='+B1(s4===3?'кг':'г')+'$',a:'$'+L+'='+R+'$',key:'101un:4:'+L};}
  if(t===5){k=rnd(2,9);var s5=rnd(1,3);
    if(s5===1)return {q:'$'+U(k*1000,'мл')+'='+B1('л')+'$',a:'$'+U(k*1000,'мл')+'='+U(k,'л')+'$',key:'101un:5a:'+k};
    if(s5===2)return {q:'$'+U(k,'л')+'='+B1('мл')+'$',a:'$'+U(k,'л')+'='+U(k*1000,'мл')+'$',key:'101un:5b:'+k};

  if(t===6){if(Math.random()<0.5){k=rnd(1,9);r=rnd(5,995);L=U2(k,'км',r,'м');return {q:'$'+L+'='+B1('м')+'$',a:'$'+L+'='+U(k*1000+r,'м')+'$',key:'101un:6a:'+k+':'+r};}
    n=rnd(1001,9999);if(n%1000===0)return null;L=U(n,'м');return {q:'$'+L+'='+B2('км','м')+'$',a:'$'+L+'='+U2(Math.floor(n/1000),'км',n%1000,'м')+'$',key:'101un:6b:'+n};}
  if(t===7){m=rnd(1,8);r=rnd(10,95);r2=rnd(10,99);if(r+r2<=100)return null;L=U2(m,'м',r,'см')+'+'+U(r2,'см');
    return {q:'$'+L+'='+B2('м','см')+'$',a:'$'+L+'='+U2(m+1,'м',r+r2-100,'см')+'$',key:'101un:7:'+m+':'+r+':'+r2};}
  if(t===8){m=rnd(1,8);r=rnd(100,950);r2=rnd(100,999);if(r+r2<=1000)return null;L=U2(m,'кг',r,'г')+'+'+U(r2,'г');
    return {q:'$'+L+'='+B2('кг','г')+'$',a:'$'+L+'='+U2(m+1,'кг',r+r2-1000,'г')+'$',key:'101un:8:'+m+':'+r+':'+r2};}
  m=rnd(2,9);r=rnd(5,80);r2=rnd(r+5,99);L=U2(m,'м',r,'см')+'-'+U(r2,'см');
  return {q:'$'+L+'='+B2('м','см')+'$',a:'$'+L+'='+U2(m-1,'м',100+r-r2,'см')+'$',key:'101un:9:'+m+':'+r+':'+r2};

var H4_102_UA=['','нэг','хоёр','гурван','дөрвөн','таван','зургаан','долоон','найман','есөн'];
var H4_102_UF=['','нэг','хоёр','гурав','дөрөв','тав','зургаа','долоо','найм','ес'];
var H4_102_TA=['','арван','хорин','гучин','дөчин','тавин','жаран','далан','наян','ерэн'];
var H4_102_TF=['','арав','хорь','гуч','дөч','тавь','жар','дал','ная','ер'];
function h4_102_grp(v,fin){var h=Math.floor(v/100),t=Math.floor(v/10)%10,u=v%10,p=[];
  if(h)p.push(H4_102_UA[h]+' зуу'+((fin&&t===0&&u===0)?'':'н'));
  if(t)p.push((fin&&u===0)?H4_102_TF[t]:H4_102_TA[t]);
  if(u)p.push(fin?H4_102_UF[u]:H4_102_UA[u]);
  return p.join(' ');}
function h4_102_words(n){if(n===1000000)return 'нэг сая';var th=Math.floor(n/1000),r=n%1000,o=[];
  if(th)o.push(h4_102_grp(th,false)+' мянга');if(r)o.push(h4_102_grp(r,true));return o.join(' ');}
function h4_102_cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
// Хэд хэдэн баганан бодолтыг хажуу тийш нь
function h4_102_solRow(arr){return '<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">'+arr.join('')+'</div>';}
// Нэр + гарах тийн ялгал (-аас/-оос/-гаас ...)
var H4_102_NM=[['Хонгор','Хонгороос'],['Туяа','Туяагаас'],['Бат','Батаас'],['Сараа','Сараагаас'],['Болд','Болдоос'],
  ['Номин','Номингоос'],['Тэмүүлэн','Тэмүүлэнгээс'],['Дорж','Доржоос'],['Мөнх','Мөнхөөс'],['Энхжин','Энхжингээс'],['Даваа','Даваагаас'],['Тамир','Тамираас']];

// ═════════════════ ХУУДАС 1 — Орон, орны утга, унших ба бичих, задлах, хоосон нүд ═════════════════

// [27, 29] Онцолсон (доогуур зураастай) цифр ямар орны утгыг илэрхийлж байна
function g_102_digitVal(){
  var L=pick([4,5,5,6,6,6]),n=h4_102_num(L,0.15),s=String(n),cand=[];
  for(var i=0;i<L;i++)if(s[i]!=='0')cand.push(i);
  var idx=pick(cand),d=+s[idx],p=L-1-idx;
  if((p===0||idx===0)&&Math.random()<0.65)return null;     // эхний ба нэгжийн цифр цөөн, дунд орнууд элбэг
  return {q:'$'+h4_102_mark(n,idx)+'$',a:'$'+nf(d*H4_102_POW[p])+'$ ('+H4_102_PN[p]+')',key:'102dv:'+n+':'+idx};
}

// [33] Тоо тус бүрд хэдэн нэгж байна: 78 з = □ н (нэг алхамтай хөрвүүлэлт — хялбар)
function g_102_toUnits(){
  var p=rnd(1,5),c=(p===5?rnd(2,9):(p===4?rnd(11,99):rnd(11,999)));
  if(c%10===0)return null;
  var q=h4_102_ab(c,p)+'=\\square\\text{ н}',a=h4_102_ab(c,p)+'='+nf(c*H4_102_POW[p])+'\\text{ н}';
  return {q:'$'+q+'$',a:'$'+a+'$',key:'102tu:'+c+':'+p};
}

// [24, 38в / 25] Үгээр бичсэн тоог цифрээр, эсвэл цифрээр бичсэн тоог үгээр (дунд нь тэгтэй орон элбэг)
function g_102_readWrite(){
  var L=pick([4,5,5,6,6,6]),n=h4_102_num(L,0.3);
  if(L>=5&&n%1000===0&&Math.random()<0.6)return null;
  if(Math.random()<0.5)return {q:h4_102_cap(h4_102_words(n)),a:'$'+nf(n)+'$',key:'102rw:'+n};
  return {q:'$'+nf(n)+'$',a:h4_102_cap(h4_102_words(n))+'.',key:'102rw:'+n};
}

// [23, 28] Орны нэмэгдэхүүний нийлбэрт задлах
function g_102_expand(){
  var L=pick([5,6,6]),n=h4_102_num(L,0.2),t=h4_102_terms(n);
  if(t.length<3)return null;
  return {q:'$'+nf(n)+'$',a:'$'+nf(n)+'='+t.map(nf).join('+')+'$',key:'102ex:'+n};
}

// ── Хүнд: «Хоосон нүдэнд тохирох тоог бичээрэй» — 5 хэлбэр ──
// [30] Орны нэмэгдэхүүн: mode 0 — дараалсан, 2 нүд; mode 1 — холимог дараалал, 1 нүд; mode 2 — бүлэглэсэн нэмэгдэхүүн, 1 нүд.
// Холимог дараалалд 2 нүд нуувал хоёр утгыг сольж бичсэн ч тэнцэл биелэх тул хариу хоёрдмол → холимог үед ЗӨВХӨН 1 нүд.
function h4_102_missAdd(mode){
  var n=h4_102_num(pick([5,6,6,6]),0.2),t=h4_102_terms(n),parts;
  if(mode<2){
    if(t.length<4||t.length>5)return null;     // 6 нэмэгдэхүүнтэй мөр cols:2-т багтахгүй (2 мөр болно)
    var h=(mode===0?2:1),ids=shuffle(t.map(function(_,i){return i;})).slice(0,h);
    parts=t.map(function(x,i){return {v:x,h:ids.indexOf(i)>=0};});
    if(mode===1){var o=parts.map(function(p){return p.v;}).join(',');parts=shuffle(parts);if(parts.map(function(p){return p.v;}).join(',')===o)return null;}
  } else {
    var s=String(n),L=s.length,c1=rnd(1,L-2),c2=rnd(c1+1,L-1),P1=Math.pow(10,L-c1),P2=Math.pow(10,L-c2);
    var X=Math.floor(n/P1)*P1,M=Math.floor((n%P1)/P2)*P2,Y=n%P2;
    if(!X||!M||!Y)return null;
    var gc=[X,M,Y].map(function(v,i){return h4_102_terms(v).length>=2?i:-1;}).filter(function(i){return i>=0;});
    if(!gc.length)return null;                  // нуусан хэсэг заавал 2+ орны нийлбэр (758 641 = 750 000 + □ + 41 → 8600)
    var hi=pick(gc);parts=[{v:X,h:hi===0},{v:M,h:hi===1},{v:Y,h:hi===2}];
  }
  var q=parts.map(function(p){return p.h?'\\square ':nf(p.v);}).join('+');
  var a=parts.map(function(p){return p.h?'\\boxed{'+nf(p.v)+'}':nf(p.v);}).join('+');
  return {q:'$'+nf(n)+'='+q+'$',a:'$'+nf(n)+'='+a+'$',key:'102ma:'+n+':'+q};
}
// [32, 33] Орны товчлолтой холимог нийлбэр: 3 з.мян + 6 н + 8 мян + 4 а = □
function h4_102_mixSum(){
  var k=rnd(3,4),pl=shuffle([0,1,2,3,4,5]).slice(0,k),sum=0,parts=[];
  if(Math.max.apply(null,pl)<3)return null;
  var cb=pl.filter(function(x){return x<=3&&pl.indexOf(x+1)<0;});   // 2 оронтой коэффициент дээд оронтойгоо давхцахгүй
  var big=(cb.length&&Math.random()<0.5)?pick(cb):-1;
  pl.forEach(function(x){var c=(x===big?rnd(11,99):rnd(1,9));sum+=c*H4_102_POW[x];parts.push(c+'\\text{ '+H4_102_AB[x]+'}');});
  if(sum>999999)return null;
  var o=parts.join('+');parts=shuffle(parts);
  if(parts.join('+')===o&&Math.random()<0.7)return null;            // ихэнхдээ орны дараалал холимог
  var q=parts.join('+')+'=\\square',a=parts.join('+')+'='+nf(sum);
  return {q:'$'+q+'$',a:'$'+a+'$',key:'102fp:'+q};
}
// [33]-ийн хүндрүүлсэн хэлбэр: хоёр орны хооронд шилжүүлэх (36 а.мян = □ з) эсвэл урвуу (4700 з = □ мян, 590 000 н = □ а.мян)
function h4_102_conv2(){
  var hi=rnd(1,5),lo=rnd(Math.max(0,hi-3),hi-1),c=(hi===5?rnd(2,9):(hi===4?rnd(11,99):rnd(11,999)));
  if(c%10===0)return null;                     // орны зай ≤ 3 (7 з.мян = 70 000 а мэт хэт том тоо гаргахгүй)
  var m=c*H4_102_POW[hi-lo],q,a;
  if(lo>0&&Math.random()<0.5){q=h4_102_ab(c,hi)+'=\\square\\text{ '+H4_102_AB[lo]+'}';a=h4_102_ab(c,hi)+'='+h4_102_ab(m,lo);}
  else {q=h4_102_ab(m,lo)+'=\\square\\text{ '+H4_102_AB[hi]+'}';a=h4_102_ab(m,lo)+'='+h4_102_ab(c,hi);}
  return {q:'$'+q+'$',a:'$'+a+'$',key:'102cv:'+c+':'+hi+':'+lo};
}
// Хэлбэрийг «хөзрийн багц»-аар ээлжлүүлнэ. ENGINE-ийн genPool нэг build-д cap+3 = 11 бодлого татдаг тул багц 11 карттай →
// нэг build яг нэг багц хэрэглэнэ. Эхний 8 карт (Бодолтын зайтай горимд харагдах 8 бодлого) = [0,0,1,2,2,3,3,4] холилдсон →
// 5 хэлбэр бүр заавал орж, аль нь ч 2-оос олон давтагдахгүй; сүүлийн 3 карт [0,1,4] нь нөөц (зайгүй горим, trimToFit).
// 0 — 2 нүд, дараалсан; 1 — 1 нүд, холимог дараалал; 2 — бүлэглэсэн; 3 — холимог нийлбэр; 4 — хоёр орны хооронд.
// Нэг багц дотор key давхцуулахгүй (H4_102_FK) → ENGINE давхардлын улмаас нэмэлт дуудлага хийхгүй, build бүр яг 11 карт
// хэрэглэж багцтай үргэлж давхцана (102cv-ийн key-ийн орон зай жижиг тул үүнгүйгээр ~0.4% build-д 1 картаар шилждэг байсан).
var H4_102_FD=[],H4_102_FK={};
function g_102_fill(){
  if(!H4_102_FD.length){H4_102_FD=shuffle([0,0,1,2,2,3,3,4]).concat(shuffle([0,1,4]));H4_102_FK={};}
  var f=H4_102_FD[0],r=null;
  for(var t=0;t<60&&!r;t++){r=(f<3?h4_102_missAdd(f):(f===3?h4_102_mixSum():h4_102_conv2()));if(r&&H4_102_FK[r.key])r=null;}
  if(r){H4_102_FD.shift();H4_102_FK[r.key]=1;}
  return r;
}

// ═════════════════ ХУУДАС 2 — Жиших, зүй тогтол, тоймлох, эрэмбэлэх, үгэн бодлого ═════════════════

// [55] Нэгжтэй хэмжигдэхүүнийг жиших (=, <, >): 2300 кг □ 2 т 400 кг, 27 л 500 мл □ 26 л 900 мл
var H4_102_CU=[{B:'т',S:'кг',k:1000},{B:'кг',S:'г',k:1000},{B:'м',S:'см',k:100},{B:'л',S:'мл',k:1000},{B:'км',S:'м',k:1000}];
function h4_102_mixT(b,s,U){return b+'\\text{ '+U.B+' }'+s+'\\text{ '+U.S+'}';}
function h4_102_plT(N,U){return nf(N)+'\\text{ '+U.S+'}';}
function h4_102_small(U){if(U.k===100)return (Math.random()<0.25?rnd(1,9):rnd(10,99));
  var r=Math.random();return r<0.5?rnd(1,9)*100:(r<0.7?rnd(10,99):rnd(101,999));}
function h4_102_cmpU(){
  var U=pick(H4_102_CU),b=(Math.random()<0.7?rnd(1,9):rnd(10,40)),s=h4_102_small(U),V=b*U.k+s,L,R,vL,vR,note,form;
  if(Math.random()<0.7){                                   // холимог ↔ энгийн (тэнцүү байж болно)
    var N,r=Math.random();
    if(r<0.45)N=V;
    else if(r<0.7&&U.k===1000&&s<100)N=b*1000+s*10;        // «урхи»: 3 кг 50 г ба 3500 г
    else if(r<0.7&&U.k===100&&s<10)N=b*100+s*10;           // «урхи»: 2 м 5 см ба 250 см
    else N=V+pick([-1,1])*(U.k===100?rnd(1,30):(Math.random()<0.5?rnd(1,9)*100:rnd(1,90)));
    if(N<=0||(r>=0.45&&N===V))return null;
    var mx=h4_102_mixT(b,s,U),pl=h4_102_plT(N,U);
    if(Math.random()<0.5){L=mx;R=pl;vL=V;vR=N;}else{L=pl;R=mx;vL=N;vR=V;}
    note=h4_102_mixT(b,s,U)+'='+h4_102_plT(V,U);form='m';
  } else {                                                  // холимог ↔ холимог
    var b2=(Math.random()<0.3?b:b+pick([-1,1])),s2=h4_102_small(U);
    if(b2<1||(b2===b&&s2===s))return null;
    if(b2!==b&&Math.random()<0.6&&((b2<b)!==(s2>s)))return null;   // ихэнхдээ «урхи»: их бүхэл хэсэгтэй нь бага жижиг хэсэгтэй
    var V2=b2*U.k+s2;
    L=h4_102_mixT(b,s,U);R=h4_102_mixT(b2,s2,U);vL=V;vR=V2;
    note=h4_102_plT(V,U)+(V<V2?'\\lt ':'\\gt ')+h4_102_plT(V2,U);form='x';
  }
  var sg=(vL<vR?'\\lt ':(vL>vR?'\\gt ':'='));
  return {q:'$'+L+'\\;\\square\\;'+R+'$',a:'$'+L+sg+R+'$'+(vL===vR?'':' ($'+note+'$)'),
    key:'102cu:'+U.S+':'+Math.min(vL,vR)+':'+Math.max(vL,vR)+':'+form};
}
// [35, 36] Хоёр тоог жиших: орны тоо ижил (дээд орноос нь харгалзуулан) эсвэл ялгаатай (цөөн оронтой нь их цифрээр эхэлдэг);
// 30% нь [55] нэгжтэй хэмжигдэхүүн (тэнцүү тохиолдолтой)
function g_102_cmp(){
  if(Math.random()<0.3)return h4_102_cmpU();
  var x,y,L;
  if(Math.random()<0.25){
    L=pick([5,6]);x=h4_102_num(L,0.2);var f=+String(x)[0];
    if(f>=9)return null;
    y=+(''+rnd(f+1,9)+h4_102_tail(L-2,0.2));
  } else {
    L=pick([5,6,6]);var A=String(h4_102_num(L,0.15)).split(''),B=A.slice(),k=(Math.random()<0.15?0:rnd(1,L-1)),dk;
    do{dk=rnd(k===0?1:0,9);}while(dk===+A[k]);
    B[k]=''+dk;for(var i=k+1;i<L;i++)B[i]=''+rnd(0,9);
    x=+A.join('');y=+B.join('');
  }
  if(x===y)return null;
  if(Math.random()<0.5){var t=x;x=y;y=t;}
  return {q:'$'+nf(x)+'\\;\\square\\;'+nf(y)+'$',a:'$'+nf(x)+(x<y?'\\lt ':'\\gt ')+nf(y)+'$',key:'102cm:'+Math.min(x,y)+':'+Math.max(x,y)};
}

// [31] Зүй тогтол: дараагийн 2 тоо (алхам 1…100 000, 2, 5, 20, 50 …; хариунд дээд орон солигдоно)
function g_102_seq(){
  var s=pick([1,10,100,1000,10000,100000,2,5,20,50,200,500,2000,5000,20000,50000]);
  var u=Math.pow(10,String(s).length),dir=(Math.random()<0.7?1:-1),j=rnd(3,4);
  var mMax=Math.floor(1000000/u);if(mMax<1)return null;
  var A=rnd(1,mMax)*u,noise=(s>1&&Math.random()<0.5)?rnd(1,s-1):0,T=[],i;
  if(dir>0){var tj=A+noise;for(i=0;i<5;i++)T.push(tj+(i-j)*s);}
  else {var tp=A+noise;for(i=0;i<5;i++)T.push(tp-(i-(j-1))*s);}
  for(i=0;i<5;i++)if(T[i]<1||T[i]>1000000)return null;
  return {q:'$'+T.slice(0,3).map(nf).join(',\\ ')+',\\ \\square,\\ \\square$',a:'$'+nf(T[3])+',\\ '+nf(T[4])+'$',key:'102sq:'+T[0]+':'+(s*dir)};
}

// [40, 43, 46] Заасан орноор тоймлох (арын цифр 5 бол алгасна — сурах бичгийн «5-аас бага / их» дүрмийн дагуу)
var H4_102_RN=['аравтаар','зуутаар','мянгатаар','арван мянгатаар','зуун мянгатаар'];
function g_102_round(){
  var L=pick([4,5,5,6,6]),pi=rnd(0,Math.min(4,L-2)),p=H4_102_POW[pi+1],n=h4_102_num(L,0.12);
  if(Math.random()<0.25){var s=String(n).split(''),ip=L-2-pi;if(ip<0)return null;s[ip]='9';s[ip+1]=''+rnd(6,9);n=+s.join('');}
  var d=Math.floor(n/(p/10))%10;
  if(d===5||n%p===0)return null;
  var r=Math.round(n/p)*p;
  return {q:'$'+nf(n)+'$ — '+H4_102_RN[pi],a:'$'+nf(n)+'\\approx '+nf(r)+'$',key:'102rd:'+n+':'+p};
}

// [54] Буурах эрэмбэ (ижил эхлэлтэй, цифр нь сэлгэсэн, орны тоо ялгаатай «урхи»)
function g_102_order(){
  var L=pick([5,6,6]),k=rnd(1,2),pre=String(h4_102_num(k,0)),N=[],i;
  for(i=0;i<4;i++)N.push(pre+h4_102_tail(L-k,0.2));
  if(Math.random()<0.6){var a=N[0].split(''),pos=rnd(k,L-2);if(a[pos]!==a[pos+1]){var t=a[pos];a[pos]=a[pos+1];a[pos+1]=t;N[1]=a.join('');}}
  if(Math.random()<0.4&&+pre[0]<9){N[3]=(+pre[0]+1)+N[3].slice(1);}
  N=N.map(Number);
  if(L===6&&pre[0]==='1'&&Math.random()<0.5)N[2]=+('9'+h4_102_tail(4,0.1));   // 5 оронтой 9xxxx «урхи» (6 оронтой 1xxxxx-ээс бага)
  var S=N.slice().sort(function(p,q){return q-p;});
  for(i=1;i<4;i++)if(S[i]===S[i-1])return null;
  N=shuffle(N);
  return {q:'$'+N.map(nf).join(',\\ \\ ')+'$',a:'$'+S.map(nf).join('\\gt ')+'$',key:'102or:'+S.join(',')};
}

// ── Үгэн бодлого (хүнд) ──
// [48] Мөнгө: хэн хамгийн их зарцуулсан бэ
function h4_102_w1(){
  var N=shuffle(H4_102_NM).slice(0,3),A=rnd(3000,6000),B=rnd(300,999),C=rnd(1000,1600),Q=A-B,R=Q+C;
  var x=rnd(500,A-800),y=rnd(500,Q-800),z=rnd(500,R-800),sp=[A-x,Q-y,R-z],mx=Math.max.apply(null,sp),cnt=0;
  sp.forEach(function(v){if(mx-v<60)cnt++;});
  if(cnt!==1)return null;
  var w=sp.indexOf(mx);
  var q=N[0][0]+' '+nt(A)+' төгрөгтэй. '+N[1][0]+' '+N[0][1]+' '+nt(B)+' төгрөгөөр бага, '+N[2][0]+' '+N[1][1]+' '+nt(C)+
    ' төгрөгөөр их мөнгөтэй байв. Дэлгүүрээс худалдан авалт хийсний дараа '+N[0][0]+' '+nt(x)+' төг, '+N[1][0]+' '+nt(y)+' төг, '+
    N[2][0]+' '+nt(z)+' төгрөгтэй үлджээ. Хэн хамгийн их мөнгө зарцуулсан бэ?';

// нэмэхэд дээд оронд шилжих тоо
function h4_103_carries(a,b){var c=0,n=0;while(a>0||b>0){var s=a%10+b%10+c;c=s>=10?1:0;n+=c;a=Math.floor(a/10);b=Math.floor(b/10);}return n;}
// хасахад дээд орноос зээлэх тоо (a ≥ b)
function h4_103_borrows(a,b){var br=0,n=0;while(a>0){var d=a%10-b%10-br;br=d<0?1:0;n+=br;a=Math.floor(a/10);b=Math.floor(b/10);}return n;}
// 3 нэмэгдэхүүн: орон бүрийн нийлбэр (шилжсэнтэй нь) < 20 → дээд оронд үргэлж 1 л шилжинэ; шилжилтийн тоог буцаана (-1 = тохирохгүй)
function h4_103_carry3(x,y,z){var c=0,n=0;while(x>0||y>0||z>0){var s=x%10+y%10+z%10+c;if(s>=20)return -1;c=s>=10?1:0;n+=c;
  x=Math.floor(x/10);y=Math.floor(y/10);z=Math.floor(z/10);}return n;}
// дунд нь тэгтэй тоо (ж: 603 040) — зээлэх нь хэцүү
function h4_103_zeros(lo,hi){var s=String(rnd(lo,hi)).split(''),k=rnd(1,2);for(var i=0;i<k;i++)s[rnd(1,s.length-2)]='0';return +s.join('');}

function h4_103_nd(d){return rnd(Math.pow(10,d-1),Math.pow(10,d)-1);}
// баганан нэмэх хос (≥ minC шилжилттэй, нийлбэр ≤ 999 999); тохирохыг олтол дотроо давтана → нэмэх/хасах тэнцвэртэй
function h4_103_addPair(minC){for(var t=0;t<300;t++){var a=h4_103_nd(pick([5,6,6])),b=h4_103_nd(pick([5,5,6]));
  if(a+b<=999999&&h4_103_carries(a,b)>=minC)return [a,b];}return null;}

// загварын уут: хувилбарууд тэнцвэртэй, ээлжлэн гарна.
// avoid>0 бол уут дахин дүүрэхэд сүүлд гарсан avoid загвар шинэ уутны эхний avoid байранд орохгүй
// → дараалсан (avoid+1) бодлого үргэлж өөр өөр загвартай.
var h4_103_bags={},h4_103_last={};
function h4_103_bag(name,arr,avoid){

function g_103_mental(){

var h4_103_EV=[{n:'Хөл бөмбөгийн тэмцээнийг',lo:8000,hi:60000},{n:'Наадмын бөхийн барилдааныг',lo:10000,hi:60000},

function h4_104_deal(o,mk,body){
 var v,r=null,x,i;
 if(!o.dk||!o.dk.length||!(Date.now()-o.t<250)){o.dk=mk();o.used={};}
 v=o.dk.shift();
 for(i=0;i<150;i++){x=body(v);if(x){r=x;if(!o.used[x.key])break;}}
 if(r)o.used[r.key]=1;
 o.t=Date.now();
 return r;}
// main — харагдах cap карт (холино), res — нөөц карт (холино)
function h4_104_pack(main,res){return shuffle(main).concat(shuffle(res));}

// ───────── SVG туслахууд (h4_104_*) ─────────
function h4_104_f(x){return String(Math.round(x*10)/10);}
function h4_104_svg(W,H,g){W=Math.ceil(W);H=Math.ceil(H);
 return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';}
function h4_104_line(x1,y1,x2,y2,st,sw,dash){var f=h4_104_f;
 return '<line x1="'+f(x1)+'" y1="'+f(y1)+'" x2="'+f(x2)+'" y2="'+f(y2)+'" stroke="'+st+'" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+' stroke-linecap="round"/>';}
function h4_104_text(x,y,t,anchor,size){
 return '<text x="'+h4_104_f(x)+'" y="'+h4_104_f(y)+'" font-size="'+(size||10.5)+'" font-family="Segoe UI, Arial, sans-serif" fill="#2a2140" text-anchor="'+(anchor||'middle')+'">'+t+'</text>';}
function h4_104_rect(x,y,w,h,fill,st,sw){var f=h4_104_f;
 return '<rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(w)+'" height="'+f(h)+'" fill="'+fill+'"'+(st?' stroke="'+st+'" stroke-width="'+sw+'"':'')+'/>';}
function h4_104_poly(pts,fill,st,sw){
 return '<polygon points="'+pts.map(function(p){return h4_104_f(p[0])+','+h4_104_f(p[1]);}).join(' ')+'" fill="'+fill+'"'+(st?' stroke="'+st+'" stroke-width="'+sw+'" stroke-linejoin="round"':'')+'/>';}
// C×R нүдтэй дөрвөлжин тор (саарал шугам)
function h4_104_grid(C,R,u,x0,y0){var g='',i;
 for(i=0;i<=C;i++)g+=h4_104_line(x0+i*u,y0,x0+i*u,y0+R*u,'#c3cddf',0.8);
 for(i=0;i<=R;i++)g+=h4_104_line(x0,y0+i*u,x0+C*u,y0+i*u,'#c3cddf',0.8);
 return g;}
// M[r][c]=1 нүднүүдийг будна / хүрээг нь зурна
function h4_104_cells(M,u,x0,y0,fill){var g='',r,c;
 for(r=0;r<M.length;r++)for(c=0;c<M[r].length;c++)if(M[r][c])g+=h4_104_rect(x0+c*u,y0+r*u,u,u,fill);
 return g;}
function h4_104_outline(M,u,x0,y0,st,sw){var g='',R=M.length,C=M[0].length,r,c,L=h4_104_line;
 function on(rr,cc){return rr>=0&&rr<R&&cc>=0&&cc<C&&M[rr][cc];}
 for(r=0;r<R;r++)for(c=0;c<C;c++)if(M[r][c]){var x=x0+c*u,y=y0+r*u;
  if(!on(r-1,c))g+=L(x,y,x+u,y,st,sw);
  if(!on(r+1,c))g+=L(x,y+u,x+u,y+u,st,sw);
  if(!on(r,c-1))g+=L(x,y,x,y+u,st,sw);
  if(!on(r,c+1))g+=L(x+u,y,x+u,y+u,st,sw);}
 return g;}

// ───────── Биетийн зураг, дэлгээс ─────────
// Параллелепипед (куб): урт a (урд доод ирмэг), өргөн b (гүн), өндөр c.
// lab — [a, b, c] ирмэгийн шошго (заавал биш; '' бол шошгогүй, '?' бол мэдэгдэхгүй ирмэг)
function h4_104_box(a,b,c,u,lab){
 var k=Math.min(118/(a+0.5*b),80/(c+0.4*b),15),W=a*k,H=c*k,dx=0.5*b*k,dy=0.4*b*k,x0=8,y0=8+dy,g='';
 var L=lab||[a+' '+u,b+' '+u,c+' '+u];
 g+=h4_104_poly([[x0,y0],[x0+dx,y0-dy],[x0+W+dx,y0-dy],[x0+W,y0]],'#ddd0fb','#7B52EE',1.3);
 g+=h4_104_poly([[x0+W,y0],[x0+W+dx,y0-dy],[x0+W+dx,y0+H-dy],[x0+W,y0+H]],'#cbb8f6','#7B52EE',1.3);
 g+=h4_104_rect(x0,y0,W,H,'#efe8ff','#7B52EE',1.3);
 if(L[0])g+=h4_104_text(x0+W/2,y0+H+13,L[0]);
 if(L[1])g+=h4_104_text(x0+W+dx/2+5,y0+H-dy/2+11,L[1],'start');
 if(L[2])g+=h4_104_text(x0+W+dx+4,y0-dy+H/2+4,L[2],'start');
 return h4_104_svg(x0+W+dx+42,y0+H+19,g);}
// Параллелепипедийн дэлгээс: 4 хажуу талс нэг эгнээнд, дээд/доод талс 2-р талсад наалттай
function h4_104_boxNet(a,b,c,u){
 var k=Math.min(158/(2*a+2*b),118/(c+2*b),13),x0=36,y0=15,A=a*k,B=b*k,Cc=c*k,g='',i;
 var xs=[x0,x0+B,x0+B+A,x0+2*B+A],ws=[B,A,B,A];
 for(i=0;i<4;i++)g+=h4_104_rect(xs[i],y0+B,ws[i],Cc,i%2?'#efe8ff':'#e3d7fd','#7B52EE',1.3);
 g+=h4_104_rect(x0+B,y0,A,B,'#ddd0fb','#7B52EE',1.3);
 g+=h4_104_rect(x0+B,y0+B+Cc,A,B,'#ddd0fb','#7B52EE',1.3);
 g+=h4_104_text(x0+B+A/2,y0-4,a+' '+u);
 // b шошго: дээд талсын зүүн талд; B бага үед эхний хажуу талсын ирмэгт наалдахгүйн тулд дээш хязгаарлана
 g+=h4_104_text(x0+B-4,Math.min(y0+B/2+4,y0+B-4),b+' '+u,'end');
 g+=h4_104_text(x0-4,y0+B+Cc/2+4,c+' '+u,'end');
 return h4_104_svg(x0+2*A+2*B+4,y0+2*B+Cc+4,g);}
// Кубийн дэлгээс (загалмай хэлбэр)
function h4_104_cubeNetFig(e,u){
 var s=Math.min(38,Math.max(28,e*4)),x0=36,y0=15,g='',i;
 for(i=0;i<4;i++)g+=h4_104_rect(x0+i*s,y0+s,s,s,i%2?'#efe8ff':'#e3d7fd','#7B52EE',1.3);
 g+=h4_104_rect(x0+s,y0,s,s,'#ddd0fb','#7B52EE',1.3);
 g+=h4_104_rect(x0+s,y0+2*s,s,s,'#ddd0fb','#7B52EE',1.3);
 g+=h4_104_text(x0+1.5*s,y0-4,e+' '+u);
 g+=h4_104_text(x0-4,y0+1.5*s+4,e+' '+u,'end');
 return h4_104_svg(x0+4*s+4,y0+3*s+4,g);}

// ───────── Зургаан нүдт дүрс (гексомино) ба кубийн дэлгээс ─────────
function h4_104_canon(cells){var best=null,t;
 for(t=0;t<8;t++){
  var P=cells.map(function(p){var x=p[0],y=p[1],z;if(t&1)x=-x;if(t&2)y=-y;if(t&4){z=x;x=y;y=z;}return [x,y];});
  var mx=Math.min.apply(null,P.map(function(p){return p[0];})),my=Math.min.apply(null,P.map(function(p){return p[1];}));
  P=P.map(function(p){return [p[0]-mx,p[1]-my];}).sort(function(A,B){return A[1]-B[1]||A[0]-B[0];});
  var s=P.map(function(p){return p[0]+'.'+p[1];}).join(' ');
  if(best===null||s<best)best=s;}
 return best;}
function h4_104_roll(s,dir){var t={D:s.D,U:s.U,N:s.N,S:s.S,E:s.E,W:s.W};
 if(dir==='E'){t.D=s.E;t.W=s.D;t.U=s.W;t.E=s.U;}
 else if(dir==='W'){t.D=s.W;t.E=s.D;t.U=s.E;t.W=s.U;}
 else if(dir==='N'){t.D=s.N;t.S=s.D;t.U=s.S;t.N=s.U;}
 else {t.D=s.S;t.N=s.D;t.U=s.N;t.S=s.U;}
 return t;}
// Шоог дэлгээс дээгүүр өнхрүүлж, нүд бүрт ямар талс буухыг тэмдэглэнэ: 6 өөр талс бол зөв дэлгээс
function h4_104_isCubeNet(cells){
 var has={},face={},stack,mv=[[1,0,'E'],[-1,0,'W'],[0,-1,'N'],[0,1,'S']],k,used={};
 cells.forEach(function(p){has[p[0]+','+p[1]]=1;});
 stack=[[cells[0][0],cells[0][1],{D:0,U:1,N:2,S:3,E:4,W:5}]];
 face[cells[0][0]+','+cells[0][1]]=0;
 while(stack.length){var it=stack.pop(),i;
  for(i=0;i<4;i++){var nx=it[0]+mv[i][0],ny=it[1]+mv[i][1],kk=nx+','+ny;
   if(!has[kk]||face[kk]!==undefined)continue;
   var t=h4_104_roll(it[2],mv[i][2]);face[kk]=t.D;stack.push([nx,ny,t]);}}
 for(k in face){if(used[face[k]])return false;used[face[k]]=1;}
 return true;}
function h4_104_hexos(){
 if(h4_104_hexos.c)return h4_104_hexos.c;
 var cur={'0.0':[[0,0]]},n,k,out=[];
 for(n=1;n<6;n++){var nxt={};
  for(k in cur){var cs=cur[k],has={};
   cs.forEach(function(p){has[p[0]+','+p[1]]=1;});
   cs.forEach(function(p){[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
    var x=p[0]+d[0],y=p[1]+d[1];if(has[x+','+y])return;
    var nc=cs.concat([[x,y]]),key=h4_104_canon(nc);if(!nxt[key])nxt[key]=nc;});});}
  cur=nxt;}
 for(k in cur){var cells=k.split(' ').map(function(s){var q=s.split('.');return [+q[0],+q[1]];});
  out.push({k:k,cells:cells,ok:h4_104_isCubeNet(cells)});}
 h4_104_hexos.c=out;return out;}
function h4_104_has2x2(cells){var h={};cells.forEach(function(p){h[p[0]+','+p[1]]=1;});
 return cells.some(function(p){return h[(p[0]+1)+','+p[1]]&&h[p[0]+','+(p[1]+1)]&&h[(p[0]+1)+','+(p[1]+1)];});}
function h4_104_line5(cells){var h={};cells.forEach(function(p){h[p[0]+','+p[1]]=1;});
 return cells.some(function(p){var i,a=1,b=1;for(i=1;i<5;i++){if(!h[(p[0]+i)+','+p[1]])a=0;if(!h[p[0]+','+(p[1]+i)])b=0;}return a||b;});}

// [86, 88, 105] Тор дээрх дүрсийн талбайг нүд тоолж олох (1 нүд = 1 см.кв)
// Багц (cap 4 + 3): харагдах 4-т ховилгүй тэгш өнцөгт яг 1, нэг ховилтой 1, хоёр ховилтой 2
function g_104_gridShape(){return h4_104_deal(g_104_gridShape,function(){return h4_104_pack([0,1,2,2],[1,2,2]);},h4_104_gsV);}
function h4_104_gsV(want){
 var W0=rnd(3,7),H0=rnd(3,5),M=[],r,c,i;
 for(r=0;r<H0;r++){M.push([]);for(c=0;c<W0;c++)M[r].push(1);}
 var N=[],t=0;
 while(N.length<want&&t++<200){
  var nw=rnd(1,W0-1),nh=rnd(1,H0-1),sd=rnd(0,3),x,y,ok=true;
  if(nw*nh*3>W0*H0)continue;
  if(sd===0){y=0;x=rnd(0,W0-nw);}else if(sd===1){y=H0-nh;x=rnd(0,W0-nw);}
  else if(sd===2){x=0;y=rnd(0,H0-nh);}else{x=W0-nw;y=rnd(0,H0-nh);}
  for(i=0;i<N.length;i++){var o=N[i];if(x<o.x+o.w&&o.x<x+nw&&y<o.y+o.h&&o.y<y+nh)ok=false;}
  if(ok)N.push({x:x,y:y,w:nw,h:nh});}
 if(N.length<want)return null;
 N.forEach(function(o){for(var rr=o.y;rr<o.y+o.h;rr++)for(var cc=o.x;cc<o.x+o.w;cc++)M[rr][cc]=0;});
 for(r=0;r<H0;r++)if(M[r].indexOf(1)<0)return null;
 for(c=0;c<W0;c++){var hs=0;for(r=0;r<H0;r++)hs=hs||M[r][c];if(!hs)return null;}
 var S=0,st=null;for(r=0;r<H0;r++)for(c=0;c<W0;c++)if(M[r][c]){S++;if(!st)st=[r,c];}
 if(S<5)return null;
 var seen={},q=[st],cnt=0;seen[st[0]+','+st[1]]=1;
 while(q.length){var p=q.pop();cnt++;
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var a=p[0]+d[0],b=p[1]+d[1];
   if(a>=0&&a<H0&&b>=0&&b<W0&&M[a][b]&&!seen[a+','+b]){seen[a+','+b]=1;q.push([a,b]);}});}
 if(cnt!==S)return null;
 var u=15,x0=1+u,y0=1+u,g='';
 g+=h4_104_cells(M,u,x0,y0,'#e4d9ff');
 g+=h4_104_grid(W0+2,H0+2,u,1,1);
 g+=h4_104_outline(M,u,x0,y0,'#7B52EE',1.8);
 var ex=W0+'\\times '+H0;
 N.forEach(function(o){ex+='-'+(o.w*o.h===1?'1':o.w+'\\times '+o.h);});
 return {q:'',fig:h4_104_svg((W0+2)*u+2,(H0+2)*u+2,g),
  a:'$'+S+'$ см.кв ($'+ex+'='+S+'$)',
  key:'104gs:'+M.map(function(row){return row.join('');}).join('|')};
}

// [89, 90, 98, 108] Тэгш өнцөгтийн (квадратын) талбай ба периметр — зураг дээр талуудын урт
// (≤ 25 × 1 оронтой: сурах бичгийн 124в, 127-ийн түвшин — 11×7, 12×9)
function g_104_rectAP(){
 var u=pick(['см','см','дм','м']),sq=rnd(1,7)===1,a,b;
 if(sq){a=pick([3,4,5,6,7,9,10,20,30,40]);b=a;}else{a=rnd(5,25);b=rnd(2,9);if(b>=a)return null;}
 // сурах бичгийн тоо: 90 (9×4), 98а (6×2), 98в (10×2), 108 (8×5); 98б квадрат 8 дээрх жагсаалтад алга
 if((a===9&&b===4)||(a===6&&b===2)||(a===10&&b===2)||(a===8&&b===5))return null;
 var k=Math.min(140/a,64/b,13),w=a*k,h=b*k,x0=6,y0=16,g='';
 g+=h4_104_rect(x0,y0,w,h,'#efe8ff','#7B52EE',1.6);
 g+=h4_104_text(x0+w/2,y0-4,a+' '+u);
 g+=h4_104_text(x0+w+4,y0+h/2+4,b+' '+u,'start');
 var S=a*b,P=(a+b)*2;
 return {q:'',fig:h4_104_svg(x0+w+42,y0+h+6,g),
  a:'Талбай: $'+a+'\\times '+b+'='+S+'$ '+u+'.кв; периметр: $('+a+'+'+b+')\\times 2='+P+'$ '+u,
  key:'104ra:'+a+'x'+b+u};
}

// [95, 96, 100, 112] Талбайн нэгж шилжүүлэх (1 дм.кв = 100 см.кв, 1 га = 10 000 м.кв ...)
function g_104_unitConv(){
 var U=[['дм.кв','см.кв',100],['м.кв','дм.кв',100],['см.кв','мм.кв',100],['а','м.кв',100],
        ['га','а',100],['км.кв','га',100],['м.кв','см.кв',10000],['га','м.кв',10000]];
 var i=rnd(0,U.length-1),o=U[i],f=o[2],rev=rnd(0,2)===0,x=f===100?rnd(2,99):rnd(2,60),y=x*f;
 var B='\\text{ '+o[0]+'}',Sm='\\text{ '+o[1]+'}';
 var q=rev?'$'+nf(y)+Sm+'=\\square'+B+'$':'$'+nf(x)+B+'=\\square'+Sm+'$';
 var a=(rev?'$'+nf(y)+Sm+'='+nf(x)+B+'$':'$'+nf(x)+B+'='+nf(y)+Sm+'$')+' ($1'+B+'='+nf(f)+Sm+'$)';
 return {q:q,a:a,key:'104uc:'+i+(rev?'r':'f')+x};
}

// [103, 113] Будаагүй хэсгийн талбай (тор дээр эсвэл хэмжээ бичсэн)
// Багц (cap 3 + 3): 5 хэлбэрийг холиод + 1 нөөц → харагдах 3 нь бүгд өөр хэлбэр
function g_104_unshaded(){return h4_104_deal(g_104_unshaded,function(){return h4_104_pack(['a','b','c','d','e'],[pick(['a','b','c','d','e'])]);},h4_104_usV);}
function h4_104_usV(v){
 var u=16,g='',W,H,X,key,ex;
 var SH='#c7b3f5',ST='#7B52EE',OUT='#4b4560';
 if(v==='a'){W=rnd(5,9);H=rnd(4,6);var w=rnd(2,W-2),h=rnd(1,H-2);if(w*h<2||w*h*2>W*H)return null;
  var px=rnd(1,W-w-1),py=rnd(1,H-h-1);
  g+=h4_104_grid(W+2,H+2,u,1,1);
  g+=h4_104_rect(1+u,1+u,W*u,H*u,'none',OUT,1.7);
  g+=h4_104_rect(1+u+px*u,1+u+py*u,w*u,h*u,SH,ST,1.4);
  X=W*H-w*h;ex='$'+W+'\\times '+H+'-'+w+'\\times '+h+'='+(W*H)+'-'+(w*h)+'='+X+'$ см.кв';
  key='104us:a'+W+'x'+H+'-'+w+'x'+h;
  return {q:'',fig:h4_104_svg((W+2)*u+2,(H+2)*u+2,g),a:ex,key:key};}
 if(v==='b'){W=pick([4,6,8,10]);H=pick([4,6]);
  var x0=1+u,y0=1+u,Wp=W*u,Hp=H*u;
  g+=h4_104_grid(W+2,H+2,u,1,1);
  g+=h4_104_poly([[x0+Wp/2,y0],[x0+Wp,y0+Hp/2],[x0+Wp/2,y0+Hp],[x0,y0+Hp/2]],SH,ST,1.4);
  g+=h4_104_line(x0+Wp/2,y0,x0+Wp/2,y0+Hp,ST,1,'3 2');
  g+=h4_104_line(x0,y0+Hp/2,x0+Wp,y0+Hp/2,ST,1,'3 2');
  g+=h4_104_rect(x0,y0,Wp,Hp,'none',OUT,1.7);
  X=W*H/2;
  ex='Тасархай шугам тэгш өнцөгтийг 4 хэсэгт хуваана; хэсэг бүрийн хагас нь будаагүй. $'+W+'\\times '+H+'='+(W*H)+'$, $'+(W*H)+'\\div 2='+X+'$ см.кв';
  return {q:'',fig:h4_104_svg((W+2)*u+2,(H+2)*u+2,g),a:ex,key:'104us:b'+W+'x'+H};}
 if(v==='c'){W=rnd(3,9);H=rnd(2,6);if(W*H%2)return null;var kk=rnd(1,H-1),fl=rnd(0,1);
  var x1=1+u,y1=1+u,Wq=W*u,Hq=H*u,xa=fl?x1+Wq:x1,xb=fl?x1:x1+Wq;
  g+=h4_104_grid(W+2,H+2,u,1,1);
  g+=h4_104_poly([[xa,y1],[xa,y1+Hq],[xb,y1+kk*u]],SH,ST,1.4);
  g+=h4_104_line(x1,y1+kk*u,x1+Wq,y1+kk*u,ST,1,'3 2');
  g+=h4_104_rect(x1,y1,Wq,Hq,'none',OUT,1.7);
  X=W*H/2;
  ex='Тасархай шугам тэгш өнцөгтийг 2 хэсэгт хуваана; хэсэг бүрийн хагас нь будаагүй. $'+W+'\\times '+H+'='+(W*H)+'$, $'+(W*H)+'\\div 2='+X+'$ см.кв';
  return {q:'',fig:h4_104_svg((W+2)*u+2,(H+2)*u+2,g),a:ex,key:'104us:c'+W+'x'+H+'k'+Math.min(kk,H-kk)};}
 if(v==='d'){var R=rnd(3,4),C=rnd(8,11),s=rnd(C,2*C),M=[],r,c,cells=[];

 g+=h4_104_grid(C,R,u,1,1);
 g+=h4_104_poly(P,'none','#7B52EE',1.7);
 return {q:'',fig:h4_104_svg(C*u+2,R*u+2,g),a:ex,key:key};
}

// [121–128] Куб, параллелепипедийн гадаргуугийн талбай (зураг, дэлгээс, текст)
// + [125, 126] гадаргуугийн талбай өгөгдсөн үед мэдэгдэхгүй «?» ирмэгийг олох
// Багц (cap 6 + 3): харагдах 6 = зураг, дэлгээс, текст, «?» ирмэг яг 2, куб 1; нөөц 3-т «?» ирмэг орохгүй
function g_104_surface(){return h4_104_deal(g_104_surface,function(){var K=['cube','cnet','fcube'];
 return h4_104_pack(['box','net','txt','find','find',pick(K)],shuffle(['box','net','txt',pick(K)]).slice(0,3));},h4_104_sfV);}
// сурах бичгийн ирмэгүүд (өсөхөөр): 123, 124а, 124в, 124г, 126, 127, 128б
var H4_104_TB=['2-6-8','3-4-5','3-7-11','2-4-7','4-4-8','7-9-12','2-5-8'];
function h4_104_srt(A){return A.slice().sort(function(m,n){return m-n;}).join('-');}
function h4_104_sfV(v){
 var u='см',a,b,c;
 if(v==='cube'||v==='cnet'){var e=rnd(2,10),Se=6*e*e;
  if((v==='cube'&&e===3)||(v==='cnet'&&e===6))return null;   // сурах бичгийн 124б, 128а
  return {q:v==='cube'?'Куб':'Кубийн дэлгээс',fig:v==='cube'?h4_104_box(e,e,e,u):h4_104_cubeNetFig(e,u),
   a:'$S=6\\times '+e+'\\times '+e+'=6\\times '+(e*e)+'='+Se+'$ см.кв',key:'104sf:'+v+e};}
 // Куб: гадаргуугийн талбай → ирмэг (таамаглаж шалгах: 6 × ? × ? = S)
 if(v==='fcube'){var ef=rnd(2,9),Sf=6*ef*ef;
  return {q:'Куб, гадаргуугийн талбай '+Sf+' см.кв',fig:h4_104_box(ef,ef,ef,u,['?','','']),
   a:'Кубийн 6 талс тэнцүү квадрат. $6\\times '+ef+'\\times '+ef+'=6\\times '+(ef*ef)+'='+Sf+'$ тул ирмэг нь $'+ef+'$ см.',
   key:'104sf:fcube'+ef};}
 // Параллелепипед: 2 ирмэг ба гадаргуугийн талбай → 3 дахь ирмэг.
 // S÷2 = p×q + (p+q)×x;  p+q ≤ 10, x ≤ 9 тул (p+q)×x нь үржүүлэхийн хүснэгтэд.
 if(v==='find'){var p=rnd(2,7),q=rnd(2,Math.min(7,10-p)),x=rnd(2,9);
  if(p===q&&q===x)return null;
  if(H4_104_TB.indexOf(h4_104_srt([p,q,x]))>=0)return null;
  var pq=p*q,sp=p+q,Hf=pq+sp*x,Sb=2*Hf,pos=rnd(0,2),lab=['','',''],dims=[0,0,0],kn=[p,q];
  // pos — мэдэгдэхгүй ирмэг (0: урт, 1: өргөн, 2: өндөр); бусад хоёрт p, q
  var j=0,i;for(i=0;i<3;i++){if(i===pos){dims[i]=x;lab[i]='?';}else{dims[i]=kn[j];lab[i]=kn[j]+' '+u;j++;}}
  return {q:'Параллелепипед, гадаргуугийн талбай '+Sb+' см.кв',fig:h4_104_box(dims[0],dims[1],dims[2],u,lab),
   a:'$'+Sb+'\\div 2='+Hf+'$ — гурван өөр талсын нийлбэр. $'+p+'\\times '+q+'='+pq+'$, үлдсэн 2 талс: $'+Hf+'-'+pq+'='+(sp*x)+'$. $'+p+'\\times ?+'+q+'\\times ?='+sp+'\\times ?='+(sp*x)+'$ тул $?='+(sp*x)+'\\div '+sp+'='+x+'$ см.',
   key:'104sf:find'+[p,q].sort(function(m,n){return m-n;}).join('-')+'-'+x};}
 if(v==='txt'){a=rnd(10,20);b=rnd(4,9);c=rnd(3,9);}
 else {a=rnd(3,12);b=rnd(2,Math.min(8,a));c=rnd(2,10);}
 if(a===b&&b===c)return null;
 if(H4_104_TB.indexOf(h4_104_srt([a,b,c]))>=0)return null;
 var ab=a*b,bc=b*c,ac=a*c,sum=ab+bc+ac,S=2*sum,qq,fig;
 if(v==='box'){qq='Параллелепипед';fig=h4_104_box(a,b,c,u);}
 else if(v==='net'){qq='Параллелепипедийн дэлгээс';fig=h4_104_boxNet(a,b,c,u);}
 else qq='Хайрцагны урт '+a+' см, өргөн '+b+' см, өндөр '+c+' см.';
 var r={q:qq,a:'$S=2\\times ('+a+'\\times '+b+'+'+b+'\\times '+c+'+'+a+'\\times '+c+')=2\\times ('+ab+'+'+bc+'+'+ac+')=2\\times '+sum+'='+nf(S)+'$ см.кв',
  key:'104sf:'+v+[a,b,c].sort(function(m,n){return m-n;}).join('-')};
 if(fig)r.fig=fig;
 return r;
}

// ══════════ 1.5 Нийлбэрийг үржвэрээр бичих (4-р анги, I бүлэг, сурах бичиг 27–31) ══════════
// Дасгалын хэлбэрүүд (сурах бичгээс):
//  137а, 138  ижил нэмэгдэхүүнтэй нийлбэр → үржвэр, байр солих чанар       → g_105_sumToProd, g_105_boxFill
//  137б       давтан хасах → хуваах                                        → g_105_boxFill
//  147        16÷2÷2÷2÷2=1 төрлийн гинж                                   → g_105_boxFill
//  141,150в,164 тооны машины давталт, зүй тогтол (×10, +k)                → g_105_boxFill
//  136б,144   хоёр тооны үржвэрт задлах хүснэгт, хуваагчид                → g_105_factorPairs
//  142,143,145 задралын мод, 24 = □×□×□                                   → g_105_tree
//  (137а хүндрүүлсэн) олон оронтой нэмэгдэхүүн → үржвэр, баганаар          → g_105_sumToProdCol
//  136а,139,146 бүлэглэх (хаалт), туузан загвар, хоёр алхамт хуваалт       → g_105_wordGroups
//  151,152,158 10, 100, 1000-аар үржүүлэх / хуваах                         → g_105_by10
//  155,161    урт, жин, багтаамжийн нэгж шилжүүлэх                         → g_105_units
//  154,159,160,162 тэгтэй тоо, ×5 = ×10÷2, ×9 = ×10−, байр солих/хаалт    → g_105_clever

// ── туслахууд ──
var h4_105_rotS={};   // хэлбэрүүдийг ээлжлэн гаргана — нэг хуудсанд олон янзын бодлого
function h4_105_rot(name,k){if(h4_105_rotS[name]===undefined)h4_105_rotS[name]=rnd(0,k-1);return (h4_105_rotS[name]++%k)+1;}
function h4_105_try(f){for(var t=0;t<400;t++){var r=f();if(r)return r;}return null;}  // хэлбэр дотроо дахин оролдоно (ээлж алдагдахгүй)
function h4_105_rep(a,n){var s=[];for(var i=0;i<n;i++)s.push(nf(a));return s.join('+');}
function h4_105_divs(N){var d=[];for(var i=1;i<=N;i++)if(N%i===0)d.push(i);return d;}
function h4_105_pairs(N){var P=[];for(var d=1;d*d<=N;d++)if(N%d===0)P.push([d,N/d]);return P;}
function h4_105_flex(arr){return '<div style="display:flex;flex-wrap:wrap;gap:4px 14px;align-items:flex-start">'+arr.join('')+'</div>';}
function h4_105_cell(x,y,w,h,t,hd,fs,bold){
  var g='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(hd?'#f1ecfd':'#fff')+'" stroke="#7B52EE" stroke-width="1.1"/>';
  if(t!=='')g+='<text x="'+(x+w/2)+'" y="'+(y+h/2+4.5)+'" font-size="'+(fs||12.5)+'" text-anchor="middle" fill="#1a1030"'+(bold?' font-weight="700"':'')+'>'+t+'</text>';
  return g;}

// ── 1. Ижил нэмэгдэхүүнтэй нийлбэрийг үржвэрээр (137а, 138) ──
function g_105_sumToProd(){
  var a=Math.random()<0.6?rnd(3,9):pick([11,12,13,14,15,20,25,30,40,50]);
  var n=rnd(3,7);
  if(a>=11&&n>5)n=rnd(3,5);
  var s=h4_105_rep(a,n);
  return {q:'$'+s+'$', a:'$'+s+'='+n+'\\times '+a+'='+(n*a)+'$', key:'105s:'+a};   // нэг хуудсанд нэмэгдэхүүн давтагдахгүй
}

// ── 2. Нүдэнд тохирох тоо: байр солих, давтан хасах, хуваах гинж, зүй тогтол (137б, 138, 141, 147, 164) ──
function g_105_boxFill(){var f=h4_105_rot('bf',4);return h4_105_try(function(){return h4_105_bf(f);});}
function h4_105_bf(f){
  var a,b,v,n,N;
  if(f===1){                                         // байр солих чанар
    a=rnd(12,49);b=rnd(3,9);if(a%10===0)return null;v=rnd(1,2);
    if(v===1)return {q:'$'+a+'\\times '+b+'='+b+'\\times\\square=\\square$',
      a:'$'+a+'\\times '+b+'='+b+'\\times '+a+'='+(a*b)+'$', key:'105b1:'+a+'x'+b};
    return {q:'$\\square\\times '+b+'='+b+'\\times '+a+'=\\square$',
      a:'$'+a+'\\times '+b+'='+b+'\\times '+a+'='+(a*b)+'$', key:'105b1:'+a+'x'+b};
  }
  if(f===2){                                         // давтан хасах → хуваах (бүх нүд ижил тоо — хариу нэг утгатай)
    n=rnd(3,5);v=rnd(4,15);N=n*v;var bx=[],fl=[];
    for(var i=0;i<n;i++){bx.push('\\square');fl.push(v);}
    return {q:'Бүх нүдэнд ижил тоо орно: $'+N+'-'+bx.join('-')+'=0$ ба $'+N+'\\div '+n+'=\\square$',
      a:'$'+N+'-'+fl.join('-')+'=0$ ба $'+N+'\\div '+n+'='+v+'$', key:'105b2:'+N+':'+n};
  }
  if(f===3){                                         // хуваах гинж … = 1
    var k=rnd(3,4),fs=[];N=1;
    for(var j=0;j<k;j++){var x=pick([2,2,2,3,3,3,4,5,5,6,7,8,9]);fs.push(x);N*=x;}
    if(N<16||N>360)return null;
    var pos=rnd(N>100?1:0,k-1),qs=[],as=[];          // эхний байранд нүд зөвхөн N ≤ 100 үед (3 оронтойг 2 оронтойд хуваахгүй)
    for(var m=0;m<k;m++){qs.push(m===pos?'\\square':fs[m]);as.push(fs[m]);}
    return {q:'$'+N+'\\div '+qs.join('\\div ')+'=1$', a:'$'+N+'\\div '+as.join('\\div ')+'=1$',
      key:'105b3:'+N+':'+fs.join('.')+':'+pos};
  }
  // f===4: зүй тогтол
  var p=rnd(1,3),t=[],why;
  if(p===1){a=rnd(2,99);if(a%10===0)return null;for(var e=0;e<5;e++)t.push(a*Math.pow(10,e));why='дараагийн тоо нь 10 дахин их';}
  else if(p===2){a=rnd(2,99);if(a%10===0)return null;for(var e2=4;e2>=0;e2--)t.push(a*Math.pow(10,e2));why='дараагийн тоо нь 10 дахин бага';}
  else{var st=pick([6,7,8,9,11,12,15,25,50,75]),s0=rnd(1,5);for(var e3=0;e3<5;e3++)t.push(st*(s0+e3));why='өмнөх тоон дээр '+st+' нэмнэ';a=st*100+s0;}
  var qq=[t[0],t[1],t[2]].map(nf).join(',\\ ')+',\\ \\square,\\ \\square';
  return {q:'$'+qq+'$', a:'$'+t.map(nf).join(',\\ ')+'$ ('+why+')', key:'105b4:'+p+':'+a};
}

// ── 3. Хоёр тооны үржвэрт задлах хүснэгт, хуваагчид (136б, 144) ──
var h4_105_fpList=[12,16,18,20,24,28,30,32,36,40,42,44,45,48,50,52,54,56,60,63,64,66,70,72,75,80,84,90,96,100];
function h4_105_pairFig(N,P,rev,ex){               // ex — илүү хоосон багана (сурах бичгийн 144 шиг)
  var nc=P.length+ex,cw=34,ch=24,x0=3,y0=3,fw=40,W=x0+fw+nc*cw+3,H=y0+2*ch+3,g='';
  g+='<rect x="'+x0+'" y="'+y0+'" width="'+fw+'" height="'+(2*ch)+'" fill="#f1ecfd" stroke="#7B52EE" stroke-width="1.1"/>';
  g+='<text x="'+(x0+fw/2)+'" y="'+(y0+ch+5)+'" font-size="14" font-weight="700" text-anchor="middle" fill="#3b2a80">'+N+'</text>';
  for(var i=0;i<nc;i++){var x=x0+fw+i*cw;
    for(var r=0;r<2;r++)g+=h4_105_cell(x,y0+r*ch,cw,ch,(i<P.length&&rev[i][r])?String(P[i][r]):'',false,13);}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'">'+g+'</svg>';
}
function g_105_factorPairs(){
  var N=pick(h4_105_fpList),P=h4_105_pairs(N),rev,emp,full,i;
  for(var t=0;t<60;t++){                             // эхний баганаас бусдад ≥1 бүтэн хоосон багана, ≥3 хоосон нүд
    rev=[[1,1]];emp=0;full=0;
    for(i=1;i<P.length;i++){var r=Math.random(),c=r<0.25?[1,0]:r<0.5?[0,1]:[0,0];rev.push(c);emp+=2-c[0]-c[1];if(!c[0]&&!c[1])full++;}
    if(full>=1&&emp>=3)break;
  }
  if(!(full>=1&&emp>=3))return null;
  var ex=Math.min(rnd(1,2),7-P.length);              // хосын тоо баганын тоогоор илрэхгүй; өргөн ≤ 7 багана (≤ 300px)
  var eq=P.map(function(p){return p[0]+'\\times '+p[1];}).join('=');
  return {q:'', fig:h4_105_pairFig(N,P,rev,ex),
    a:'$'+N+'='+eq+'$; хуваагчид: $'+h4_105_divs(N).join(',\\ ')+'$', key:'105fp:'+N};
}

// ── 4. Олон оронтой нэмэгдэхүүнтэй нийлбэрийг үржвэрээр бичиж, баганаар бодох (137а-г хүндрүүлсэн) ──
function g_105_sumToProdCol(){var r=h4_105_rot('sc',3);return h4_105_try(function(){return h4_105_sc(r);});}
function h4_105_sc(r){
  var a,n,q;
  if(r===1){a=rnd(1012,9899);n=3;q=h4_105_rep(a,n);}
  else if(r===2){a=rnd(123,987);n=4;q=h4_105_rep(a,n);}
  else{a=rnd(1012,9899);n=rnd(5,9);q='\\underbrace{'+nf(a)+'+'+nf(a)+'+\\ldots+'+nf(a)+'}_{'+n+'\\text{ нэмэгдэхүүн}}';}
  if(a%10===0)return null;
  var c=colMul(a,n);
  return {q:'$'+q+'$', a:'$'+n+'\\times '+nf(a)+'='+nf(a)+'\\times '+n+'='+nf(a*n)+'$',
    key:'105sc:'+a+'x'+n, col:c.q, sol:c.s};
}

// ── 5. Үгэн бодлого: бүлэглэх (хаалт), туузан загвар, хоёр алхамт хуваалт (136а, 139, 146) ──
function h4_105_barFig(k1,k2,T,n1,n2){
  var mx=Math.max(k1,k2),seg=Math.min(36,Math.floor(180/mx)),x0=64,y1=6,y2=40,h=22,g='',i;
  g+='<text x="'+(x0-8)+'" y="'+(y1+15)+'" font-size="12" text-anchor="end" fill="#1a1030">'+n1+'</text>';
  g+='<text x="'+(x0-8)+'" y="'+(y2+15)+'" font-size="12" text-anchor="end" fill="#1a1030">'+n2+'</text>';
  for(i=0;i<k1;i++)g+='<rect x="'+(x0+i*seg)+'" y="'+y1+'" width="'+seg+'" height="'+h+'" fill="#ede7fd" stroke="#7B52EE" stroke-width="1.2"/>';
  for(i=0;i<k2;i++)g+='<rect x="'+(x0+i*seg)+'" y="'+y2+'" width="'+seg+'" height="'+h+'" fill="#f6edfe" stroke="#A855F7" stroke-width="1.2"/>';
  var xb=x0+mx*seg+8,yb=y2+h,ym=(y1+yb)/2;
  g+='<path d="M'+xb+' '+y1+' Q'+(xb+6)+' '+y1+' '+(xb+6)+' '+(y1+6)+' L'+(xb+6)+' '+(ym-6)+' Q'+(xb+6)+' '+ym+' '+(xb+12)+' '+ym+
     ' Q'+(xb+6)+' '+ym+' '+(xb+6)+' '+(ym+6)+' L'+(xb+6)+' '+(yb-6)+' Q'+(xb+6)+' '+yb+' '+xb+' '+yb+'" fill="none" stroke="#555" stroke-width="1.3"/>';
  g+='<text x="'+(xb+16)+'" y="'+(ym+5)+'" font-size="13" font-weight="700" fill="#1a1030">'+T+'</text>';
  var W=xb+16+30;
  return '<svg viewBox="0 0 '+W+' 68" width="'+W+'">'+g+'</svg>';
}
function g_105_wordGroups(){var f=h4_105_rot('wg',3);return h4_105_try(function(){return h4_105_wg(f);});}
function h4_105_wg(f){
  var a,b,c,P;
  if(f===1){                                         // гурван үржигдэхүүн, хаалтаар бүлэглэх
    a=rnd(4,25);b=rnd(3,9);c=rnd(2,9);P=a*b*c;
    if(P>1500||a===b||b===c)return null;
    var ctx=rnd(1,3),q,unit;
    if(ctx===1){q='Нэг боодолд '+a+' дэвтэр, нэг хайрцагт '+b+' боодол байна. Ийм '+c+' хайрцагт хэдэн дэвтэр байх вэ?';unit='дэвтэр';}
    else if(ctx===2){q='Цэцэрлэгт хүрээлэнд '+c+' талбай бий. Талбай бүрт '+b+' эгнээ, эгнээ бүрт '+a+' мод тарьжээ. Нийт хэдэн мод тарьсан бэ?';unit='мод';}
    else{q='Номын санд '+c+' шүүгээ бий. Шүүгээ бүр '+b+' тавиуртай, тавиур бүрт '+a+' ном байна. Номын санд хэдэн ном байгаа вэ?';unit='ном';}
    var ans;
    if((b*c)%10===0)ans='$'+a+'\\times '+b+'\\times '+c+'='+a+'\\times('+b+'\\times '+c+')='+a+'\\times '+(b*c)+'='+nf(P)+'$ '+unit;
    else ans='$'+a+'\\times '+b+'\\times '+c+'=('+a+'\\times '+b+')\\times '+c+'='+(a*b)+'\\times '+c+'='+nf(P)+'$ '+unit;
    return {q:q, a:ans, key:'105w1:'+a+':'+b+':'+c};
  }
  if(f===2){                                         // туузан загвар: k1 ба k2 ижил хэсэг, нийлбэр T
    var k1=rnd(2,5),k2=rnd(2,4),v=rnd(6,25);if(k1===k2)return null;
    var T=v*(k1+k2);if(T>200)return null;
    var nm=pick([['Бат','Дорж'],['Сараа','Номин'],['Анар','Тэмүүлэн'],['Болд','Цэцэг']]);
    var it=pick([['хайрцаг','хайрцагт','чихэр'],['боодол','боодолд','дэвтэр'],['сагс','сагсанд','алим'],['багц','багцад','харандаа']]);
    var q2=nm[0]+' '+k1+' '+it[0]+', '+nm[1]+' ийм '+k2+' '+it[0]+' '+it[2]+' авав. Тэд нийт '+T+' '+it[2]+' авсан бол нэг '+it[1]+' хэдэн '+it[2]+' байсан бэ?';
    return {q:q2, fig:h4_105_barFig(k1,k2,T,nm[0],nm[1]),
      a:'$'+k1+'+'+k2+'='+(k1+k2)+'$ '+it[0]+', $'+T+'\\div '+(k1+k2)+'='+v+'$ '+it[2], key:'105w2:'+k1+':'+k2+':'+v};

//  х.39 204–207 — үлдэгдэлтэй хуваах, шалгах (хуваагдагч = ногдвор × хуваагч + үлдэгдэл);  208 — хүснэгт нөхөх;
//  х.39 209 / х.42 235 — □-тэй тэгшитгэл (□ ÷ 7 = 358 (үлд 4), (□ − 702) ÷ 2 = 398, (□ + 6532) × 3 = 82 500);
//  х.42 233 — худалдааны бодлого (хариулт хасаад хуваах).

// ── туслахууд ──
function h4_107_dsum(n){var s=0,S=String(n);for(var i=0;i<S.length;i++)s+=+S[i];return s;}
function h4_107_pad(n,w){var s=String(n);while(s.length<w)s='0'+s;return s;}
function h4_107_suf(d){return d===2?'-т':'-д';}
function h4_107_flex(){return '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start">'+Array.prototype.join.call(arguments,'')+'</div>';}
// Хэлбэрүүдийг ээлжлэн гаргах (нэг даалгаварт ижил хэлбэр давтагдахгүй): f(v) амжилттай бол дараагийн хэлбэрт шилжинэ
function h4_107_rot(tag,n,f){var S=h4_107_rot.S||(h4_107_rot.S={}),s=S[tag];if(!s)s=S[tag]={i:rnd(0,n-1)};var r=f(s.i%n);if(r)s.i++;return r;}
// Хүснэгт (208): labs — мөрийн нэр, cv — багана бүрийн утгууд (null = хоосон нүд)
function h4_107_table(labs,cv){
  var bd='border:1px solid #9d8fd0;';
  var th='style="'+bd+'padding:2px 7px;text-align:left;font-weight:700;color:#5a32d6;white-space:nowrap"';
  var td='style="'+bd+'min-width:52px;height:22px;text-align:center;padding:2px 5px"';
  var h='<table style="border-collapse:collapse;font-size:12.5px;margin:2px auto">';
  for(var i=0;i<labs.length;i++){
    h+='<tr><td '+th+'>'+labs[i]+'</td>';
    for(var j=0;j<cv.length;j++)h+='<td '+td+'>'+(cv[j][i]===null?'':nt(cv[j][i]))+'</td>';
    h+='</tr>';
  }
  return h+'</table>';
}
// Зураглал (198, 236): мөр бүр ns[i] ижил хэсэг, баруун талд нийт дүнгийн хаалт. Хариуг илчлэхгүй.
function h4_107_bars(ns,labs,tot){
  // u ≤ 160/maxN, bx = мөрийн төгсгөл + 14 («?» хаалтнаас ~10px зайтай) → W ≤ 300 («2000 л», k=7 үед ч)
  var maxN=Math.max.apply(null,ns),u=Math.min(32,Math.floor(160/maxN)),h=18,gap=10,x0=58,top=6;
  var H=top*2+ns.length*h+(ns.length-1)*gap,bx=x0+maxN*u+14,W=bx+22+Math.ceil(String(tot).length*7.5);
  var g='';
  for(var i=0;i<ns.length;i++){var y=top+i*(h+gap);
    g+='<text x="'+(x0-6)+'" y="'+(y+13)+'" font-size="11" text-anchor="end" fill="#555">'+labs[i]+'</text>';
    for(var j=0;j<ns[i];j++)g+='<rect x="'+(x0+j*u)+'" y="'+y+'" width="'+u+'" height="'+h+'" fill="#efe9fd" stroke="#7B52EE" stroke-width="1.2"/>';
    g+='<text x="'+(x0+ns[i]*u+4)+'" y="'+(y+13)+'" font-size="11" fill="#7B52EE">?</text>';
  }
  var y1=top,y2=H-top,ym=(y1+y2)/2,b2=bx+6;
  g+='<path d="M'+bx+' '+y1+' Q'+b2+' '+y1+' '+b2+' '+(y1+6)+' L'+b2+' '+(ym-5)+' Q'+b2+' '+ym+' '+(bx+12)+' '+ym+' Q'+b2+' '+ym+' '+b2+' '+(ym+5)+' L'+b2+' '+(y2-6)+' Q'+b2+' '+y2+' '+bx+' '+y2+'" fill="none" stroke="#555" stroke-width="1.3"/>';
  g+='<text x="'+(bx+16)+'" y="'+(ym+4)+'" font-size="12" font-weight="700" fill="#5a32d6">'+tot+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+g+'</svg>';
}
// Хуваагдах шинжийн тоо: want=true → d-д хуваагдана; false → хуваагдахгүй (ихэнхдээ «заль»-тай: 9-д биш ч 3-д г.м.)
function h4_107_mk(d,lo,hi,want){
  for(var t=0;t<60;t++){
    var x=rnd(lo,hi);
    if(want){x-=x%d;if(x<lo)continue;if(x%10===0&&Math.random()<0.7)continue;return x;}
    if(Math.random()<0.6){
      if(d===9){x-=x%3;if(x%9===0)x+=3;}
      else if(d===6){if(Math.random()<0.5){x-=x%3;if(x%2===0)x+=3;}else{if(x%2)x++;if(x%3===0)x+=2;}}
      else if(d===4){if(x%2)x++;if(x%4===0)x+=2;}
      else if(d===8){x-=x%4;if(x%8===0)x+=4;}
    }
    if(x<lo||x>hi||x%d===0)continue;
    return x;
  }
  return null;
}
function h4_107_divTest(ds,tag){return h4_107_rot(tag,ds.length,function(v){return h4_107_divTestD(ds[v],tag);});}
function h4_107_divTestD(d,tag){
  var lo=100,hi=9999;
  if(d===8){lo=1000;hi=99999;}else if(d===4){lo=100;hi=99999;}
  var k=rnd(2,3),nums=[],seen={};
  for(var i=0;i<5;i++){
    var x=null;
    for(var t=0;t<25;t++){x=h4_107_mk(d,lo,hi,i<k);if(x!==null&&!seen[x])break;}
    if(x===null||seen[x])return null;
    seen[x]=1;nums.push(x);
  }
  nums=shuffle(nums);
  var yes=nums.filter(function(x){return x%d===0;});
  if(yes.length!==k)return null;
  var why;
  if(d===3||d===9)why='Цифрийн нийлбэр: '+nums.map(h4_107_dsum).join(', ');
  else if(d===2)why='Сүүлийн цифр нь тэгш';
  else if(d===5)why='Сүүлийн цифр нь 0 эсвэл 5';
  else if(d===4)why='Сүүлийн 2 цифр: '+nums.map(function(x){return h4_107_pad(x%100,2);}).join(', ');
  else if(d===8)why='Сүүлийн 3 цифр: '+nums.map(function(x){return h4_107_pad(x%1000,3);}).join(', ');
  else why='Тэгш бөгөөд цифрийн нийлбэр нь 3-д хуваагдах (цифрийн нийлбэр: '+nums.map(h4_107_dsum).join(', ')+')';
  return {q:'$'+d+'$'+h4_107_suf(d)+': '+nums.map(function(x){return '$'+nf(x)+'$';}).join('; '),
    a:why+' → '+yes.map(function(x){return '$'+nf(x)+'$';}).join('; '),
    key:'107'+tag+':'+d+':'+nums.slice().sort(function(p,q){return p-q;}).join(',')};
}

// ══════════ 1-р хуудас: хуваагдах шинж, булангаар хуваах ══════════
// 193: ногдвор хэдэн оронтой болохыг тогтоох (эхний бүрэн бус хуваагдагч)
function g_107_quoDigits(){
  var b=rnd(2,9),nd=pick([3,4,4,5]),lo=Math.pow(10,nd-1),a=rnd(lo,lo*10-1);
  a-=a%b;if(a<lo||a%100===0)return null;
  var A=String(a),f=+A[0],want=Math.random()<0.5;
  if((f>=b)!==want&&b>2&&b<9)return null;
  var head=f>=b?f:+A.slice(0,2),k=f>=b?nd:nd-1,q=a/b;
  if(String(q).length!==k)return null;
  return {q:'$'+nf(a)+'\\div '+b+'$',
    a:'Эхний бүрэн бус хуваагдагч $'+head+'$ → ногдвор '+k+' оронтой: $'+divAnsTex(a,b)+'$',
    key:'107qd:'+a+'/'+b};
}
// 196–197, 200: 2, 3, 5, 9-д хуваагдах шинж
function g_107_divTest(){return h4_107_divTest([2,3,5,9],'dt');}
// 192–193: 3–4 оронтой тоог нэг оронтой тоонд булангаар хуваах (үлдэгдэлгүй)
function g_107_colDiv4(){
  var b=pick([2,3,4,5,6,7,8,9,6,7,8,9]),q=rnd(105,Math.floor(9999/b)),a=q*b;
  if(q%10===0&&Math.random()<0.7)return null;
  var c=colDiv(a,b);
  return {q:'$'+nf(a)+'\\div '+b+'$',
    a:'$'+divAnsTex(a,b)+'$, шалгах: $'+nf(q)+'\\times '+b+'='+nf(a)+'$',
    key:'107c4:'+a+'/'+b,col:c.q,sol:c.s};
}
// 5 оронтой тоог хуваах (ногдворт 0 орох нь олонтаа), үлдэгдэлгүй
function g_107_colDiv5(){
  var b=rnd(3,9),q=rnd(Math.ceil(10000/b),Math.floor(99999/b)),a=q*b,Q=String(q);
  if(Q.slice(1).indexOf('0')<0&&Math.random()<0.6)return null;
  if(q%100===0)return null;
  var c=colDiv(a,b);
  return {q:'$'+nf(a)+'\\div '+b+'$',
    a:'$'+divAnsTex(a,b)+'$, шалгах: $'+nf(q)+'\\times '+b+'='+nf(a)+'$',
    key:'107c5:'+a+'/'+b,col:c.q,sol:c.s};
}
// 192 (2 онгоц), ÷ дараа нь × (өдрийн бүтээмж), үнэ олох — үлдэгдэлгүй
function g_107_wordA(){return h4_107_rot('wa',3,h4_107_wordA);}
function h4_107_wordA(v){
  if(v===0){
    var p=pick([[2,3],[2,4],[3,4],[3,5],[2,5],[4,5]]),t1=p[0],t2=p[1],L=lcm(t1,t2);
    var lo=Math.max(300*t2,1000),hi=Math.min(950*t1,3900);
    var m1=Math.ceil(lo/L),m2=Math.floor(hi/L);if(m2<m1)return null;
    var D=rnd(m1,m2)*L;if(D%100===0)return null;
    var c1=colDiv(D,t1),c2=colDiv(D,t2);
    return {q:'А хотоос В хот хүртэл '+nt(D)+' км зайтай. Энэ зайд зорчигчийн онгоц '+t1+' цаг, ачааны онгоц '+t2+' цаг нисэж хүрдэг бол онгоц тус бүр цагт хэдэн километр нисдэг вэ?',
      a:'Зорчигчийн: $'+nf(D)+'\\div '+t1+'='+nf(D/t1)+'$ км, ачааны: $'+nf(D)+'\\div '+t2+'='+nf(D/t2)+'$ км',
      key:'107wa0:'+D+':'+t1+':'+t2,sol:h4_107_flex(c1.s,c2.s)};
  }
  if(v===1){
    var C=pick([{w:'Оёдлын цех',t:'цамц',p:'оёжээ',h:'оёдог',f:'оёх'},{w:'Талх нарийн боовны цех',t:'талх',p:'жигнэжээ',h:'жигнэдэг',f:'жигнэх'},{w:'Гутлын үйлдвэр',t:'хос гутал',p:'хийжээ',h:'хийдэг',f:'хийх'}]);
    var d1=rnd(3,8),per=rnd(126,1240),N=per*d1,d2=rnd(2,9);
    if(N>9999||N<1000||d2===d1)return null;
    var c=colDiv(N,d1);
    return {q:C.w+' '+d1+' өдөрт '+nt(N)+' '+C.t+' '+C.p+'. Өдөр бүр ижил тооны '+C.t+' '+C.h+' бол '+d2+' өдөрт хэдэн '+C.t+' '+C.f+' вэ?',
      a:'1 өдөрт: $'+nf(N)+'\\div '+d1+'='+nf(per)+'$; '+d2+' өдөрт: $'+nf(per)+'\\times '+d2+'='+nf(per*d2)+'$ '+C.t,
      key:'107wa1:'+N+':'+d1+':'+d2,sol:c.s};
  }
  var I=pick([{n:'ширээ',acc:'ширээг',lo:450,hi:1600},{n:'сандал',acc:'сандлыг',lo:250,hi:900},{n:'самбар',acc:'самбарыг',lo:800,hi:2200}]);
  var n=rnd(3,9),pr=rnd(I.lo,I.hi)*100,T=n*pr;
  if(T>999999||T<10000)return null;
  var c3=colDiv(T,n);
  return {q:'Сургууль '+n+' ширхэг '+I.acc+' нийт '+nt(T)+' төгрөгөөр худалдаж авав. Нэг '+I.n+' ямар үнэтэй вэ?',
    a:'$'+nf(T)+'\\div '+n+'='+nf(pr)+'$ төгрөг',key:'107wa2:'+T+':'+n,sol:c3.s};
}

// ══════════ 2-р хуудас: үлдэгдэлтэй хуваах ══════════
// 205: 19 ÷ 4 = □ үлд □  ба  19 = 4 × □ + □ — сурах бичгийн адил хоёр хэлбэрийг хос болгож өгнө
function g_107_remSmall(){
  var b=rnd(3,9),q=rnd(3,11),r=rnd(1,b-1),a=q*b+r;
  if(a>99||a<20)return null;
  var qq='$'+a+'\\div '+b+'=\\square\\text{ үлд }\\square$<br>$'+a+'='+b+'\\times\\square+\\square$';
  var aa='$'+a+'\\div '+b+'='+q+'\\text{ (үлд }'+r+'\\text{)}$; $'+a+'='+b+'\\times '+q+'+'+r+'$';
  return {q:qq,a:aa,key:'107rs:'+a+'/'+b};
}
// 203: 160 ÷ 50 = 16 ÷ 5 = 3 (үлд 10) — үлдэгдэлд тэгийг буцааж залгана
function g_107_zeroCut(){
  var B=rnd(2,9),A=rnd(Math.max(11,2*B),99),z=pick([1,1,2]),p=Math.pow(10,z),a=A*p,b=B*p,q=Math.floor(A/B),r=A%B;
  if(r===0&&Math.random()<0.75)return null;
  var rr=r*p;
  return {q:'$'+nf(a)+'\\div '+nf(b)+'$',
    a:'$'+A+'\\div '+B+'='+q+(r?'\\text{ (үлд }'+r+'\\text{)}':'')+'$ тул $'+divAnsTex(a,b)+'$'+(r?', шалгах: $'+nf(b)+'\\times '+q+'+'+nf(rr)+'='+nf(a)+'$':''),
    key:'107zc:'+a+'/'+b};
}
// 204, 207: булангаар үлдэгдэлтэй хуваагаад шалгах
function g_107_colDivR(){
  var b=rnd(3,9),q=rnd(21,Math.floor(9998/b)),r=rnd(1,b-1),a=q*b+r;
  if(a<100||a>9999)return null;
  var c=colDiv(a,b);
  return {q:'$'+nf(a)+'\\div '+b+'$',
    a:'$'+divAnsTex(a,b)+'$, шалгах: $'+nf(a)+'='+nf(q)+'\\times '+b+'+'+r+'$',
    key:'107cr:'+a+'/'+b,col:c.q,sol:c.s};
}
// 208: хүснэгт нөхөх (хуваагдагч / хуваагч / ногдвор / үлдэгдэл), зөвхөн цор ганц хариутай хэлбэрүүд
// Бодолт (sol) баганын дарааллаар: p=1 (ногдвор, үлдэгдэл) → булангаар хуваах; p=0 (хуваагдагч), p=3 (үлдэгдэл) → q × b баганаар.
// p=2 (хуваагч) нь q ≤ 25, b ≤ 9 тул q × b ≤ 225 — цээжээр, баганан бодолт хэрэггүй.
function g_107_remTable(){
  var pats=shuffle([0,1,2,3]).slice(0,3),cv=[],ans=[],ks=[],sols=[];
  for(var i=0;i<3;i++){
    var p=pats[i],b=rnd(3,9),q,r;
    if(p===2){q=rnd(11,25);r=rnd(1,b-1);}
    else{q=rnd(12,240);r=rnd(1,b-1);if(p===0&&Math.random()<0.25)r=0;}
    var a=q*b+r,col=[a,b,q,r];
    if(p===0)col[0]=null;
    if(p===1){col[2]=null;col[3]=null;}
    if(p===2)col[1]=null;
    if(p===3)col[3]=null;
    cv.push(col);
    ans.push('$'+divAnsTex(a,b)+'$');
    ks.push(p+'.'+a+'.'+b);
    if(p===1)sols.push(colDiv(a,b).s);
    else if(p!==2)sols.push(colMul(q,b).s);
  }
  return {q:'',fig:h4_107_table(['Хуваагдагч','Хуваагч','Ногдвор','Үлдэгдэл'],cv),a:ans.join('; '),key:'107tb:'+ks.join(','),
    sol:h4_107_flex.apply(null,sols)};
}
// Үлдэгдэлтэй хуваах үгэн бодлого: бүлэглэх, долоо хоног, хамгийн багадаа хэд (дээш), дэвсгэрт солих (203)
function g_107_wordR(){return h4_107_rot('wr',4,h4_107_wordR);}
function h4_107_wordR(v){
  var N,k,q,r;
  if(v===0){
    var C=pick([
      {s:function(N,k){return 'Наадамд '+nt(N)+' хүүхэд оролцов. Тэднийг '+k+' хүүхэдтэй баг болгоход хэдэн баг болж, хэдэн хүүхэд үлдэх вэ?';},u:'баг',t:'хүүхэд',ks:[3,4,5,6,7,8,9]},
      {s:function(N,k){return 'Талх нарийн боовны цех '+nt(N)+' боорцог хийжээ. Нэг уутанд '+k+' боорцог хийвэл хэдэн дүүрэн уут болж, хэдэн боорцог үлдэх вэ?';},u:'уут',t:'боорцог',ks:[5,6,7,8,9]},
      // өндөгний хайрцаг бодитоор 6-гийн (нэг оронтой хуваагчийн хүрээнд)
      {s:function(N,k){return 'Фермд '+nt(N)+' өндөг цуглуулав. Нэг хайрцагт '+k+' өндөг багтдаг бол хэдэн дүүрэн хайрцаг болж, хэдэн өндөг үлдэх вэ?';},u:'хайрцаг',t:'өндөг',ks:[6]}]);
    N=rnd(100,999);k=pick(C.ks);q=Math.floor(N/k);r=N%k;if(!r)return null;
    return {q:C.s(N,k),a:'$'+divAnsTex(N,k)+'$: '+q+' '+C.u+' болж, '+r+' '+C.t+' үлдэнэ',key:'107wr0:'+N+'/'+k,sol:colDiv(N,k).s};
  }
  if(v===1){
    // Бодит хугацаа: нэг нислэг ≤ 437 хоног (рекорд), говийн экспедиц ≤ 1 жил орчим, Антарктидын өвөлжилт ≤ 2 жил орчим
    var W=pick([['Сансрын нисгэгч сансарт',100,400],['Экспедицийн баг говьд',100,360],['Эрдэмтэн Антарктидад',100,730]]);
    N=rnd(W[1],W[2]);q=Math.floor(N/7);r=N%7;if(!r)return null;W=W[0];
    return {q:W+' '+N+' хоног ажилласан. Энэ нь хэдэн бүтэн долоо хоног, хэдэн хоног вэ?',
      a:'$'+divAnsTex(N,7)+'$: '+q+' долоо хоног '+r+' хоног',key:'107wr1:'+N,sol:colDiv(N,7).s};
  }
  if(v===2){
    var R=pick([
      {s:function(N,k){return 'Аялалд '+N+' сурагч явна. Нэг микроавтобусанд '+k+' сурагч суудаг бол хамгийн багадаа хэдэн микроавтобус хэрэгтэй вэ?';},d:'сурагчид',u:'микроавтобус'},
      {s:function(N,k){return 'Номын санч '+N+' номыг хайрцаглахаар болов. Нэг хайрцагт '+k+' ном багтдаг бол хамгийн багадаа хэдэн хайрцаг хэрэгтэй вэ?';},d:'номд',u:'хайрцаг'}]);
    N=rnd(100,400);k=rnd(6,9);q=Math.floor(N/k);r=N%k;if(!r)return null;
    return {q:R.s(N,k),a:'$'+divAnsTex(N,k)+'$; үлдсэн '+r+' '+R.d+' дахиад 1 '+R.u+' хэрэгтэй: $'+q+'+1='+(q+1)+'$ '+R.u,
      key:'107wr2:'+N+'/'+k,sol:colDiv(N,k).s};
  }

    q='Дэлгүүрт '+h4_109_bq(G,1)+' '+nt(P)+' төгрөг байсан бөгөөд '+nt(D)+' төгрөгөөр хямдарчээ. '+nm+' хямдарсан үнээр '+h4_109_bq(G,n)+' авч, '+nt(M2)+' төгрөг өгөв. Хэдэн төгрөгийн хариулт авах вэ?';
    a='$'+nf(P)+'-'+nf(D)+'='+nf(P2)+'\\text{ төг}$, $'+nf(P2)+'\\times '+n+'='+nf(S2)+'\\text{ төг}$, $'+nf(M2)+'-'+nf(S2)+'='+nf(M2-S2)+'$. Хариу: '+nt(M2-S2)+' төг.';
    key='109ch2:'+G[0]+P+'-'+D+'x'+n+'/'+M2;
  }
  return h4_109_ok('ch',{q:q,a:a,key:key});
}

// 263.2 — нэгийн үнээр дамжуулан бодох (5 зайрмагт 4000 төг бол 10 ба 15 зайрмагт хэд)
function g_109_unitary(){
  var G=pick([['зайрмаг',600,1500,50],['бялуу',2500,6500,100],['ундаа',900,2500,100],['шоколад',1500,4500,100],['дэвтэр',450,1500,50],

    a='$'+nf(T1)+'\\div '+n1+'='+nf(u)+'\\text{ төг}$ (1 '+nm+'), $'+nf(u)+'\\times '+n2+'='+nf(u*n2)+'\\text{ төг}$, $'+nf(u)+'\\times '+n3+'='+nf(u*n3)+'\\text{ төг}$.';
    sol=h4_109_sols([colDiv(T1,n1).s,colMul(u,n2).s,colMul(u,n3).s]);

  } else {
    var u2=h4_109_step(G[1],G[2],100);if(u2/100>99)return null;

    q=who+' '+n1+' '+nm+' авч, '+nt(T2)+' төгрөг төлжээ. Ийм '+nm+' '+nt(B)+' төгрөгөөр хэдийг авч болох вэ?';
    a='$'+nf(T2)+'\\div '+n1+'='+nf(u2)+'\\text{ төг}$ (1 '+nm+'), $'+nf(B)+'\\div '+nf(u2)+'='+nf(B/100)+'\\div '+(u2/100)+'='+c+'$. Хариу: '+c+' '+nm+'.';
    sol=h4_109_sols([colDiv(T2,n1).s,colDiv(B/100,u2/100).s]);
