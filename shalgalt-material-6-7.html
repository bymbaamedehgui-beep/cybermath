<script>
/* 7-р анги · VI бүлэг. Дараалал, функц (6.1 Тоон дараалал ба ерөнхий гишүүн · 6.2 Арифметик прогресс ·

function seq(a) { return a.join(',\\ '); }                                                    // 3,\ 7,\ 11

// Графикийн шулуун y = (n/d)x + b: торын 2 цэг — A(0; b) ба B, цонх x∈[−5; 5], y∈[−4; 4]
function pickLine() {

    var order = a > 0 ? ['UL', 'LR', 'UR', 'LL', 'L', 'R', 'UL2', 'LR2', 'UR2', 'LL2'] : ['UR', 'LL', 'UL', 'LR', 'R', 'L', 'UR2', 'LL2', 'UL2', 'LR2'];   // шулуунаас хол тал түрүүлж
    g += '<circle cx="' + px + '" cy="' + py + '" r="2.6" fill="#1a1030"/>';
    labs += place('(' + num(p[0]) + '; ' + num(p[1]) + ')', order.map(function (k) { return U[k]; }), '', true);
  });
  g += labs + place('x', [[sx(X1) - 1, sy(0) + 11, 'start'], [sx(X1) - 1, sy(0) - 4, 'start']], ' font-style="italic"')
    + place('y', [[sx(0) + 4, sy(Y1) + 3, 'start'], [sx(0) - 4, sy(Y1) + 3, 'end'], [sx(0) + 4, sy(Y1) + 14, 'start'], [sx(0) - 4, sy(Y1) + 14, 'end']], ' font-style="italic"');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">' + g + '</svg>';

// Тоон сонголт: [TeX, утга]; зөвтэй утгаараа тэнцүү төөрөгдүүлэгчийг хасна
function VMC(ok, cands) {

function NI(n, d) { return d !== 0 && n % d === 0 ? NV(n / d) : null; }         // хуваагдвал л
// Шулууны сонголт [n, d, b] → y = (n/d)x + b; налалт ба сул гишүүнээрээ давхцахыг (өөр хэлбэртэйг ч) хасна

  cands.forEach(function (c) {

    var k = key(c); if (seen[k]) return; seen[k] = 1; out.push(C('y=' + kx(c[0], c[1], c[2])));

var DS = [-9, -8, -7, -6, -5, -4, -3, -2, 2, 3, 4, 5, 6, 7, 8, 9];                            // зөрүү (0, ±1-гүй)

/* ── I. Тест (10) ── */
var TESTS = [
  // 1. [хялбар] Дарааллын дараагийн гишүүн (6.1): арифметик, геометр, квадрат, өсөх зөрүү; төөрөгдүүлэгч — зөрүүг буруу авах, үржих ба нэмэхийг андуурах

    var t = rnd(1, 4), s = [], i, nx, c;
    if (t === 1) { var a = rnd(-10, 25), d = pick(DS); for (i = 0; i < 4; i++) s.push(a + i * d); nx = a + 4 * d; c = [nx + d, nx + 1, nx - 1, s[2] + s[3], nx + 2]; }
    else if (t === 2) { var g0 = rnd(1, 5), q = pick([2, 2, 3]); if (q === 3 && g0 > 3) return null; for (i = 0; i < 4; i++) s.push(g0 * Math.pow(q, i)); nx = s[3] * q; c = [2 * s[3] - s[2], s[3] + q, nx * q, s[3] + s[2], s[3] * (q + 1)]; }

  },
  // 2. [хялбар] Ерөнхий гишүүний томьёогоор гишүүн олох (6.1); төөрөгдүүлэгч — сул гишүүнийг мартах/тэмдэг андуурах, n-ийн оронд n±1, квадратыг 2-оор үржүүлэх

    var t = rnd(1, 3), k, f, ok, c;

  },
  // 3. [хялбар] Шугаман функцийн утга, эсвэл аль нь шугаман функц вэ (6.3); төөрөгдүүлэгч — сөрөг тоог орлуулахад тэмдэг алдах; x², k/x, x=c хэлбэр
  function () {
    if (rnd(0, 2)) {

  // 4. [дунд] Арифметик прогрессын гишүүн a_k = a_1 + (k−1)d (6.2); төөрөгдүүлэгч — (k−1)-ийн оронд k, зөрүүний тэмдэг, a_1 ба d-г солих

  // 6. [дунд] Арифметик прогресс: өгсөн тоо хэддүгээр гишүүн, эсвэл хоёр гишүүнээр a_1 (6.2); төөрөгдүүлэгч — «+1»-ийг мартах, (m−1)-ийн оронд m, d-г хариу гэж авах
