<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат функц — орой, тэгш хэм, шийд (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.one{grid-template-columns:1fr;gap:12px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:14px}
  .qbody{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-left:30px;margin-top:5px}
  .shiid{padding-left:30px;font-size:12.5px;color:#7a7390;margin-top:4px}.shiid u{display:inline-block;min-width:130px;border-bottom:1px dotted #b3a9cf;text-decoration:none}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:12mm;margin-top:5px}
  table.vt{border-collapse:collapse;font-size:12.5px}
  table.vt th,table.vt td{border:1px solid #c9bdec;padding:3px 8px;text-align:center;min-width:26px;height:22px}
  table.vt th{background:#f3eefe;color:#5a32d6;font-weight:800}
  table.vt td.blank{background:linear-gradient(#fff,#fbf9ff)}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:28px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function quadStr(b,c){var t='x^2';if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
function valTable(xs,ys,show){var xh='<tr><th>$x$</th>'+xs.map(function(x){return '<td>$'+x+'$</td>';}).join('')+'</tr>';
  var yh='<tr><th>$y$</th>'+xs.map(function(x,i){return show?'<td>$'+ys[i]+'$</td>':'<td class="blank"></td>';}).join('')+'</tr>';
  return '<table class="vt">'+xh+yh+'</table>';}
function parabolaPlot(r1,r2){var lo=Math.min(r1,r2),hi=Math.max(r1,r2),vy=-(hi-lo)*(hi-lo)/4;
  var x0=lo-2,x1=hi+2,y0=Math.floor(vy)-1,y1=Math.max(4,y0+Math.ceil(x1-x0));
  var PW=120,PH=104,mL=16,mT=10,ux=PW/(x1-x0),uy=PH/(y1-y0);
  function px(x){return mL+(x-x0)*ux;}function py(y){return mT+(y1-y)*uy;}
  var W=mL+PW+8,H=mT+PH+10,g='';
  for(var i=Math.ceil(x0);i<=Math.floor(x1);i++)g+='<line x1="'+px(i).toFixed(1)+'" y1="'+mT+'" x2="'+px(i).toFixed(1)+'" y2="'+(mT+PH)+'" stroke="#ede9fa" stroke-width="0.5"/>';
  for(var j=Math.ceil(y0);j<=Math.floor(y1);j++)g+='<line x1="'+mL+'" y1="'+py(j).toFixed(1)+'" x2="'+(mL+PW)+'" y2="'+py(j).toFixed(1)+'" stroke="#ede9fa" stroke-width="0.5"/>';
  if(y0<=0&&y1>=0)g+='<line x1="'+mL+'" y1="'+py(0).toFixed(1)+'" x2="'+(mL+PW)+'" y2="'+py(0).toFixed(1)+'" stroke="#555" stroke-width="1"/>';
  if(x0<=0&&x1>=0)g+='<line x1="'+px(0).toFixed(1)+'" y1="'+mT+'" x2="'+px(0).toFixed(1)+'" y2="'+(mT+PH)+'" stroke="#555" stroke-width="1"/>';
  var pts='';for(var x=x0;x<=x1+0.001;x+=(x1-x0)/70){var y=(x-r1)*(x-r2);if(y<y0-0.3||y>y1+0.3)continue;pts+=px(x).toFixed(1)+','+py(y).toFixed(1)+' ';}
  g+='<polyline points="'+pts+'" fill="none" stroke="#7B52EE" stroke-width="1.7"/>';
  for(var t=Math.ceil(x0);t<=Math.floor(x1);t++){if(t===0)continue;g+='<text x="'+(px(t)-2).toFixed(1)+'" y="'+(py(0)+9).toFixed(1)+'" font-size="7.5" fill="#8a80b0">'+t+'</text>';}
  return '<svg width="'+W.toFixed(0)+'" height="'+H.toFixed(0)+'" viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" style="flex-shrink:0">'+g+'</svg>';}
// Section 1: орой ба тэнхлэг + хүснэгт
function g1(){var xv=rnd(-1,1),m=rnd(-4,2),b=-2*xv,c=xv*xv+m;var xs=[],ys=[];for(var x=xv-3;x<=xv+3;x++){xs.push(x);ys.push((x-xv)*(x-xv)+m);}
  return {q:'$y='+quadStr(b,c)+'$',tbl:valTable(xs,ys,false),a:'$y:\\ '+ys.join(',\\ ')+'$; орой $('+xv+';\\ '+m+')$, тэнхлэг $x='+xv+'$',ok:true};}
// Section 2: график ашиглан x^2+bx+c=0 бод (бүхэл язгуур)
function g2(){for(var t=0;t<300;t++){var r1=nz(-6,6),r2=nz(-6,6);if(r1===r2)continue;if(Math.abs(r1-r2)>6)continue;var b=-(r1+r2),c=r1*r2,lo=Math.min(r1,r2),hi=Math.max(r1,r2);
  return {q:'$'+quadStr(b,c)+'=0$',r1:r1,r2:r2,a:'$x_1='+lo+',\\ x_2='+hi+'$',ok:true};}return null;}
// Section 3: хамгийн бага утга
function g3(){var xv=nz(-4,4),m=nz(-6,6),b=-2*xv,c=xv*xv+m;return {q:'$y='+quadStr(b,c)+'$',a:'хамгийн бага $y='+m+'$ ($x='+xv+'$)',ok:true};}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т','у','ү'];
function relabel(sheet){var grids=sheet.querySelectorAll('.grid'),map={};
  for(var g=0;g<grids.length;g++){var qs=grids[g].querySelectorAll('.q');
    for(var i=0;i<qs.length;i++){var letter=LET[i]||('#'+(i+1));var ql=qs[i].querySelector('.ql');if(ql)ql.textContent=letter+')';map[qs[i].getAttribute('data-k')]=(g+1)+letter+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimSec(sheet,gi,minN,target){var guard=0,h=probeH(sheet);var g=sheet.querySelectorAll('.grid')[gi];while(h>target&&guard++<60){var qs=g.querySelectorAll('.q');if(qs.length<=minN)break;var last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function build(){window.__S1=[];window.__S2=[];window.__S3=[];
  var seen={};function add(arr,fn,n){var c=0,tr=0;while(c<n&&tr<3000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;arr.push(f);c++;}}
  add(window.__S1,g1,3);add(window.__S2,g2,6);add(window.__S3,g3,8);layout();}
function layout(){
  window.__PROB=[];var K=0;
  function blk(arr,tbl){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'"><div class="qeq"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(tbl?'<div class="qbody">'+f.tbl+'</div>':'<div class="wk"></div>')+'</div>';}).join('');}
  function blkGraph(arr){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'"><div class="qeq"><span class="ql"></span><span class="qm">'+f.q+'</span></div><div class="qbody">'+parabolaPlot(f.r1,f.r2)+'</div><div class="shiid">Шийд: <u>&nbsp;</u></div></div>';}).join('');}
  var b1=blk(window.__S1,true),b2=blkGraph(window.__S2),b3=blk(window.__S3,false);
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>'+p.f.a+'</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадрат функц — орой, тэгш хэм, шийд</h1><div class="sub">Параболын орой · тэгш хэмийн тэнхлэг · график ашиглан тэгшитгэл бодох · хамгийн бага утга · 9-р анги · 5.3</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$y=x^2+bx+c$ параболын тэгш хэмийн тэнхлэг $x=-\\dfrac{b}{2}$, орой $\\left(-\\dfrac{b}{2};\\ y_{min}\\right)$. $Ox$ огтлолцлын цэг нь $x^2+bx+c=0$-ийн шийд.</div>'
    +'<div class="task">1. Утгын хүснэгтийг нөхөж, орой ба тэгш хэмийн тэнхлэгийг ол.</div><div class="grid one">'+b1+'</div>'
    +'<div class="task">2. График ашиглан тэгшитгэлийг бод.</div><div class="grid">'+b2+'</div>'
    +'<div class="task">3. Функцийн хамгийн бага утгыг ол.</div><div class="grid">'+b3+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Квадрат функц — орой, тэгш хэм, шийд';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimSec(document.getElementById('sheet'),2,4,1035);}catch(e){}
  try{trimSec(document.getElementById('sheet'),1,4,1035);}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=39"></script>
</body>
</html>
