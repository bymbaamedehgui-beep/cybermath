function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
function fracStr(n,d){var sg=(n<0)!==(d<0);n=Math.abs(n);d=Math.abs(d);var g=gcd(n,d);n/=g;d/=g;if(d===1)return (sg?'-':'')+n;return (sg?'-':'')+'\\dfrac{'+n+'}{'+d+'}';}
var TRI=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[20,21,29],[10,24,26]];
function lineCircle(K,ang){var c=Math.cos(ang),s=Math.sin(ang);var b=2*(K[0]*c+K[1]*s);var cc=K[0]*K[0]+K[1]*K[1]-1;var disc=Math.sqrt(Math.max(0,b*b-4*cc));var t1=(-b+disc)/2,t2=(-b-disc)/2;return [[K[0]+t1*c,K[1]+t1*s],[K[0]+t2*c,K[1]+t2*s]];}

function figTangent(R,OM){var ratio=OM/R;if(ratio<1.45)ratio=1.45;if(ratio>2.6)ratio=2.6;R=1;OM=ratio;var ML=Math.sqrt(OM*OM-R*R);

  function dot(p){return '<circle cx="'+px(p[0]).toFixed(1)+'" cy="'+py(p[1]).toFixed(1)+'" r="2" fill="#111"/>';}
  function tx(p,ox,oy,t){return '<text x="'+(px(p[0])+ox).toFixed(1)+'" y="'+(py(p[1])+oy).toFixed(1)+'" font-size="11" font-weight="700">'+t+'</text>';}
  var Oc=[0,0];
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="flex-shrink:0">'
   +'<circle cx="'+px(0).toFixed(1)+'" cy="'+py(0).toFixed(1)+'" r="'+(R*sc).toFixed(1)+'" fill="none" stroke="#2b7fd4" stroke-width="1.4"/>'
   +'<line x1="'+px(Mp[0]).toFixed(1)+'" y1="'+py(Mp[1]).toFixed(1)+'" x2="'+px(0).toFixed(1)+'" y2="'+py(0).toFixed(1)+'" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>'

   +'</svg>';}

function figChord(R,half,d){

   +'<circle cx="'+px(O).toFixed(1)+'" cy="'+py(O).toFixed(1)+'" r="'+(R*sc).toFixed(1)+'" fill="none" stroke="#2b7fd4" stroke-width="1.4"/>'
   +line(A,B,'#7B52EE',1.6)+line(O,Kp,'#16a34a',1.3)+line(O,A,'#dc2626',1.2)

// ---- хөвч-шүргэгч өнцөг ----
function figTanChord(arc){
  var toR=Math.PI/180;

function figIntersect(seed,names){
  var kx=[0.30,0.36,0.22,0.40,0.26][seed%5];

function figIncircle(a,b){var c=Math.sqrt(a*a+b*b),r=(a+b-c)/2;

// ---- багтсан өнцөг ----
function figInscribed(arc,seed){var toR=Math.PI/180;
  var vx=[150,120,200,90][seed%4]*toR;
  var V=[Math.cos(vx),Math.sin(vx)];
  // Chord endpoints subtending arc: put arc centered opposite V
  var base=vx*180/Math.PI+180; // opposite side
  var Pp=[Math.cos((base-arc/2)*toR),Math.sin((base-arc/2)*toR)];
  var Qp=[Math.cos((base+arc/2)*toR),Math.sin((base+arc/2)*toR)];
  var phi=[0,60,120,200,300][seed%5]*toR;
  function rot(p){return [p[0]*Math.cos(phi)-p[1]*Math.sin(phi),p[0]*Math.sin(phi)+p[1]*Math.cos(phi)];}
  var pV=rot(V),pP=rot(Pp),pQ=rot(Qp),pO=[0,0];
  var all=[pV,pP,pQ,[1,0],[-1,0],[0,1],[0,-1]];
  var xs=all.map(function(p){return p[0];}),ys=all.map(function(p){return p[1];});
  var minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs),minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
  var W=170,H=132,pad=16,sc=Math.min((W-2*pad)/(maxX-minX),(H-2*pad)/(maxY-minY));
  function px(p){return (pad+(p[0]-minX)*sc);}function py(p){return (H-pad-(p[1]-minY)*sc);}
  function line(p,q,col,w){return '<line x1="'+px(p).toFixed(1)+'" y1="'+py(p).toFixed(1)+'" x2="'+px(q).toFixed(1)+'" y2="'+py(q).toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+'"/>';}
  function dot(p){return '<circle cx="'+px(p).toFixed(1)+'" cy="'+py(p).toFixed(1)+'" r="2" fill="#111"/>';}
  function lab(p,t){var ox=px(p)-px(pO),oy=py(p)-py(pO),n=Math.max(1,Math.sqrt(ox*ox+oy*oy));return '<text x="'+(px(p)+ox/n*11).toFixed(1)+'" y="'+(py(p)+oy/n*11+4).toFixed(1)+'" font-size="11" font-weight="700" text-anchor="middle">'+t+'</text>';}
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="flex-shrink:0">'
   +'<circle cx="'+px(pO).toFixed(1)+'" cy="'+py(pO).toFixed(1)+'" r="'+sc.toFixed(1)+'" fill="none" stroke="#2b7fd4" stroke-width="1.4"/>'
   +line(pV,pP,'#7B52EE',1.5)+line(pV,pQ,'#7B52EE',1.5)+line(pP,pQ,'#16a34a',1.3)
   +dot(pV)+dot(pP)+dot(pQ)+lab(pV,'A')+lab(pP,'B')+lab(pQ,'C')
   +'</svg>';}

function build(){
