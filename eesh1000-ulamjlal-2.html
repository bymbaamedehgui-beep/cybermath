/* 3.42 */
var e3_42 = (function () {
// 42. x₀ цэгт татсан шүргэгчийн налалт k = f'(x₀):
//     a·ln x → a/x₀;  ln mx → 1/x₀;  a·ln x + bx → a/x₀ + b;  a√x (x₀ = s²) → a/(2s);  axⁿ + bx → anx₀ⁿ⁻¹ + b;

// Бодолт: k = f'(x₀) — уламжлалыг (томьёог нэрлэж) олоод x₀-ийг орлуулна. o = { f, F, X, a, b, k, x0, n, d, s, p, mm, P, Q, e }

  var s = ["Шүргэгч шулууны налалт нь шүргэлтийн цэг дээрх уламжлалын утгатай тэнцүү: $k=f'(x_0)$."];

/* 1.23 */

  // Бодолт (гар бичмэл): шүргэгчийн налалт k = f'(x₀); параллел ⇔ налалт тэнцүү → 2x₀ + b = m → x₀, y₀ = f(x₀)

/* 3.74 */
