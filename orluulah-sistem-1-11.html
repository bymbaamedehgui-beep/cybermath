<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тэгшитгэлийн систем — орлуулах арга 1 (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:17px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13.5px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:30mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sysTex(e1,e2){return '\\begin{cases}'+e1+'\\\\ '+e2+'\\end{cases}';}
function solTex(sols){return sols.map(function(s){return '('+s[0]+';'+s[1]+')';}).join(',\\ ');}
// Шугаман + квадрат системүүд — хэлбэр олон янз (тойрог·гипербол·ялгаврын квадрат·xy-цуцлах). Бүгд шалгагдсан.
var POOL=[
 // тойрог x^2+y^2=R^2
 {e1:'x+y=7',e2:'x^2+y^2=25',expr:'y=7-x',red:'x^2+(7-x)^2=25\\Rightarrow x^2-7x+12=0\\Rightarrow x=3;4',sols:[[3,4],[4,3]]},
 {e1:'x-y=1',e2:'x^2+y^2=25',expr:'x=y+1',red:'(y+1)^2+y^2=25\\Rightarrow y^2+y-12=0\\Rightarrow y=3;-4',sols:[[4,3],[-3,-4]]},
 {e1:'y=2x',e2:'x^2+y^2=20',expr:'y=2x',red:'x^2+4x^2=20\\Rightarrow x^2=4\\Rightarrow x=\\pm2',sols:[[2,4],[-2,-4]]},
 {e1:'x+2y=5',e2:'x^2+y^2=10',expr:'x=5-2y',red:'(5-2y)^2+y^2=10\\Rightarrow y^2-4y+3=0\\Rightarrow y=1;3',sols:[[3,1],[-1,3]]},
 {e1:'x+y=8',e2:'x^2+y^2=40',expr:'y=8-x',red:'x^2+(8-x)^2=40\\Rightarrow x^2-8x+12=0\\Rightarrow x=2;6',sols:[[2,6],[6,2]]},
 // гипербол хэлбэр x^2-ky^2=m
 {e1:'x-y=2',e2:'x^2-2y^2=7',expr:'x=y+2',red:'(y+2)^2-2y^2=7\\Rightarrow y^2-4y+3=0\\Rightarrow y=1;3',sols:[[3,1],[5,3]]},
 {e1:'x-y=1',e2:'3x^2-y^2=11',expr:'x=y+1',red:'3(y+1)^2-y^2=11\\Rightarrow y^2+3y-4=0\\Rightarrow y=1;-4',sols:[[2,1],[-3,-4]]},
 {e1:'2x-3y=0',e2:'2x^2-3y^2=24',expr:'y=\\tfrac{2x}{3}',red:'2x^2-3\\cdot\\tfrac{4x^2}{9}=24\\Rightarrow \\tfrac{2x^2}{3}=24\\Rightarrow x^2=36\\Rightarrow x=\\pm6',sols:[[6,4],[-6,-4]]},
 {e1:'x-y=3',e2:'x^2-3y^2=13',expr:'x=y+3',red:'(y+3)^2-3y^2=13\\Rightarrow y^2-3y+2=0\\Rightarrow y=1;2',sols:[[4,1],[5,2]]},
 {e1:'x-y=1',e2:'x^2-2y^2=1',expr:'x=y+1',red:'(y+1)^2-2y^2=1\\Rightarrow y^2-2y=0\\Rightarrow y=0;2',sols:[[1,0],[3,2]]},
 // ялгаврын квадрат x^2-y^2=(x-y)(x+y)
 {e1:'x-y=1',e2:'x^2-y^2=7',sol:'$x^2-y^2=(x-y)(x+y)=7$; $x-y=1\\Rightarrow x+y=7$, иймд $x=4,\\ y=3$',sols:[[4,3]]},
 {e1:'x+y=5',e2:'x^2-y^2=5',sol:'$(x-y)(x+y)=5$; $x+y=5\\Rightarrow x-y=1$, иймд $x=3,\\ y=2$',sols:[[3,2]]},
 // xy гишүүнтэй — квадрат гишүүд цуцлагдана
 {e1:'x-3y=1',e2:'x^2-3xy=7',sol:'$x^2-3xy=x(x-3y)=x\\cdot1=7\\Rightarrow x=7$; $3y=x-1=6\\Rightarrow y=2$',sols:[[7,2]]},
 {e1:'x-2y=1',e2:'x^2-2xy=3',sol:'$x^2-2xy=x(x-2y)=x\\cdot1=3\\Rightarrow x=3$; $2y=x-1=2\\Rightarrow y=1$',sols:[[3,1]]}
];
function gitem(c){var body=c.sol?c.sol:('Шугамангаас $'+c.expr+'$. Орлуулбал $'+c.red+'$');return {q:'$'+sysTex(c.e1,c.e2)+'$',a:body+'. Шийд: $'+solTex(c.sols)+'$',key:c.e1+c.e2};}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var qs=sheet.querySelectorAll('.grid .q');for(var i=0;i<qs.length;i++){var ql=qs[i].querySelector('.ql');if(ql)ql.textContent=(i+1)+'.';}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=(j+1)+'.';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<40){var qs=sheet.querySelectorAll('.grid .q');if(qs.length<=2)break;var last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var arr=shuffle(POOL).map(gitem);return arr;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());var K=0;
  var qs=S.map(function(f){var k=K++;return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(WK?'<div class="wk"></div>':'')+'</div>';}).join('');
  var ans=S.map(function(f,i){return '<div class="a" data-k="'+i+'"><span class="an"></span>'+f.a+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тэгшитгэлийн систем — орлуулах аргаар бод (1)</h1><div class="sub">Шугаман ба квадрат тэгшитгэлийн систем · 11-р анги · 2.2</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule"><b>Орлуулах арга:</b> 1) <b>Шугаман</b> тэгшитгэлээс нэг хувьсагчийг нөгөөгөөр илэрхийл. 2) Илэрхийллийг <b>квадрат</b> тэгшитгэлд орлуул → нэг хувьсагчтай квадрат тэгшитгэл гарна. 3) Бодоод, олдсон утга тус бүрд нөгөө хувьсагчийг ол. 4) Шийдийн хосуудыг бич.</div>'
    +'<div class="task">Тэгшитгэлийн системийг орлуулах аргаар бод.</div>'
    +'<div class="grid">'+qs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Тэгшитгэлийн систем — орлуулах арга 1';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFit(document.getElementById('sheet'),WK?1010:1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
