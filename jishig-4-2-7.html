<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IV бүлэг — Жишиг даалгавар 2 (7-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 7-р анги · IV бүлэг. Магадлал — Жишиг даалгавар 2 (4.2 Нэгдсэн туршилт: хоёр шоо · 4.3 Санамсаргүй сонголтын магадлал) */
function pf(m, n) { var r = fr(m, n), full = '\\dfrac{' + m + '}{' + n + '}'; return r === full ? full : full + '=' + r; }   // бүтэн = хураасан бутархай
function d2(pred) { var c = 0; for (var a = 1; a <= 6; a++) for (var b = 1; b <= 6; b++) if (pred(a, b)) c++; return c; }   // хоёр шооны 36 үр дүнгээс тоолох
function isPr(n) { if (n < 2) return false; for (var i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
function fact(n) { var r = 1; for (var i = 2; i <= n; i++) r *= i; return r; }
var NAMES = [['Бат', 'Оюун'], ['Болд', 'Сараа'], ['Дорж', 'Гэрэл'], ['Төгс', 'Номин']];

// 1. Хоёр шоо — A үзэгдлийн магадлал, 36 үр дүнгийн хүснэгтээр тоолно (4.2)
var D2E = [
  ['үржвэр нь тэгш тоо байх', function (a, b) { return a * b % 2 === 0; }],
  ['үржвэр нь сондгой тоо байх', function (a, b) { return a * b % 2 === 1; }],
  ['ядаж нэг шоо $6$ буух', function (a, b) { return a === 6 || b === 6; }],
  ['нэг ч шоо $6$ буухгүй байх', function (a, b) { return a !== 6 && b !== 6; }],
  ['хоёр шоо ижил нүдээр буух', function (a, b) { return a === b; }],
  ['үржвэр нь $3$ тоонд хуваагдах', function (a, b) { return a * b % 3 === 0; }],
  ['нийлбэр нь анхны тоо байх', function (a, b) { return isPr(a + b); }],
  ['ялгаврын модул нь $1$ байх', function (a, b) { return Math.abs(a - b) === 1; }],
  ['нийлбэр нь $4$ тоонд хуваагдах', function (a, b) { return (a + b) % 4 === 0; }],
  ['нийлбэр нь $3$ тоонд хуваагдах', function (a, b) { return (a + b) % 3 === 0; }],
  ['үржвэр нь $12$ байх', function (a, b) { return a * b === 12; }],
  ['үржвэр нь $6$ байх', function (a, b) { return a * b === 6; }],
  ['нийлбэр нь тэгш тоо байх', function (a, b) { return (a + b) % 2 === 0; }]
];
function g1() {
  if (rnd(0, 2) === 0) { var s = rnd(2, 12); return { stem: '$A$: нийлбэр нь $' + s + '$ байх', a: 'P(A)=' + pf(6 - Math.abs(7 - s), 36) }; }
  var e = pick(D2E); return { stem: '$A$: ' + e[0], a: 'P(A)=' + pf(d2(e[1]), 36) };
}
// 2. Санамсаргүйгээр сонгосон тоо — хуваагдах, анхны тоо, цифрийн нөхцөл (4.3)
var TD = [
  ['цифрүүд нь тэнцүү байх', function (a, b) { return a === b; }],
  ['цифрүүд нь өсөх эрэмбээр байрлах', function (a, b) { return a < b; }],
  ['цифрүүдийн нийлбэр $10$ байх', function (a, b) { return a + b === 10; }],
  ['хоёр цифр нь хоёулаа сондгой байх', function (a, b) { return a % 2 === 1 && b % 2 === 1; }],
  ['нэгжийн цифр нь $0$ байх', function (a, b) { return b === 0; }],
  ['цифрүүдийн нийлбэр $5$ тоонд хуваагдах', function (a, b) { return (a + b) % 5 === 0; }]
];
function g2() {
  var t = rnd(1, 4);
  if (t === 1) {
    var N = pick([20, 30, 40, 50, 60, 100]), d = rnd(3, 9), k = Math.floor(N / d);
    return { stem: '$1, 2, \\dots, ' + N + '$ тоонуудаас нэгийг сонгов. $A$: $' + d + '$ тоонд хуваагдах.', a: '$' + k + '$ тоо; $P(A)=' + pf(k, N) + '$' };
  }
  if (t === 2) {
    var d2v = pick([3, 4, 5, 6, 7, 8, 9, 11, 12, 15]), k2 = Math.floor(99 / d2v) - Math.floor(9 / d2v);
    return { stem: 'Хоёр оронтой тоо сонгов. $A$: $' + d2v + '$ тоонд хуваагдах.', a: '$' + k2 + '$ тоо; $P(A)=' + pf(k2, 90) + '$' };
  }
  if (t === 3) {
    var M = pick([10, 20, 30, 40, 50]), c = 0; for (var x = 2; x <= M; x++) if (isPr(x)) c++;
    return { stem: '$1, 2, \\dots, ' + M + '$ тоонуудаас нэгийг сонгов. $A$: анхны тоо байх.', a: '$' + c + '$ анхны тоо; $P(A)=' + pf(c, M) + '$' };
  }
  var e = pick(TD), c2 = 0; for (var y = 10; y <= 99; y++) if (e[1](Math.floor(y / 10), y % 10)) c2++;
  return { stem: 'Хоёр оронтой тоо сонгов. $A$: ' + e[0] + '.', a: '$' + c2 + '$ тоо; $P(A)=' + pf(c2, 90) + '$' };
}
// 3. Эгнэх (n! байрлал) ба хоёрыг сонгох (n(n−1)/2 хос) магадлал (4.3)
function g3() {
  var nm = pick(NAMES);
  if (rnd(0, 1)) {
    var n = rnd(3, 5), T = fact(n), ev = pick([[nm[0] + ' хамгийн түрүүнд зогсох', fact(n - 1)], [nm[0] + ', ' + nm[1] + ' хоёр зэрэгцэн зогсох', 2 * fact(n - 1)],
      [nm[0] + ' түрүүнд, ' + nm[1] + ' хамгийн сүүлд зогсох', fact(n - 2)]]);
    return { stem: '$' + n + '$ хүүхэд санамсаргүй эгнэв. $A$: ' + ev[0] + '.', a: 'нийт $' + n + '!=' + T + '$; $P(A)=' + pf(ev[1], T) + '$' };
  }
  var m = rnd(4, 8), T2 = m * (m - 1) / 2, ev2 = pick([[nm[0] + ' сонгогдох', m - 1], [nm[0] + ', ' + nm[1] + ' хоёулаа сонгогдох', 1],
    [nm[0] + ', ' + nm[1] + ' хоёрын аль нь ч сонгогдохгүй байх', (m - 2) * (m - 3) / 2]]);
  if (ev2[1] <= 0) return null;
  return { stem: '$' + m + '$ сурагчаас хоёрыг сонгов. $A$: ' + ev2[0] + '.', a: 'нийт $\\dfrac{' + m + '\\cdot ' + (m - 1) + '}{2}=' + T2 + '$ хос; $P(A)=' + pf(ev2[1], T2) + '$' };
}
// 4. Нийлмэл бодлого: ядаж нэгэнд нь хуваагдах, шударга тоглоом, будсан куб, хоёр шооны олон алхамт (4.2, 4.3)
var FAIR = [
  ['нийлбэр тэгш', 'нийлбэр сондгой', function (a, b) { return (a + b) % 2 === 0; }, function (a, b) { return (a + b) % 2 === 1; }],
  ['үржвэр тэгш', 'үржвэр сондгой', function (a, b) { return a * b % 2 === 0; }, function (a, b) { return a * b % 2 === 1; }],
  ['нийлбэр $s\\lt 7$', 'нийлбэр $s\\gt 7$', function (a, b) { return a + b < 7; }, function (a, b) { return a + b > 7; }],
  ['нүднүүд тэнцүү', 'нийлбэр $7$', function (a, b) { return a === b; }, function (a, b) { return a + b === 7; }],
  ['нийлбэр $7$', 'нийлбэр $8$', function (a, b) { return a + b === 7; }, function (a, b) { return a + b === 8; }],
  ['нийлбэр $6$', 'нийлбэр $8$', function (a, b) { return a + b === 6; }, function (a, b) { return a + b === 8; }],
  ['үржвэр $3$ тоонд хуваагдах', 'үржвэр $3$ тоонд хуваагдахгүй', function (a, b) { return a * b % 3 === 0; }, function (a, b) { return a * b % 3 !== 0; }]
];
// будсан куб: [нөхцөл, n → [тоо, тайлбар]]
var CUBE = [['яг гурван талаараа будагдсан', function (n) { return [8, 'булангийн $8$ куб']; }],
  ['яг хоёр талаараа будагдсан', function (n) { return [12 * (n - 2), 'нэг ирмэг дээр $' + (n - 2) + '$ куб, $12$ ирмэг: $12\\cdot ' + (n - 2) + '=' + 12 * (n - 2) + '$']; }],
  ['яг нэг талаараа будагдсан', function (n) { var q = (n - 2) * (n - 2); return [6 * q, 'нэг тал дээр $' + q + '$ куб, $6$ тал: $6\\cdot ' + q + '=' + 6 * q + '$']; }],
  ['нэг ч талаараа будагдаагүй', function (n) { var r = n - 2; return [r * r * r, 'дотор талын $' + r + '^3=' + r * r * r + '$ куб']; }]];
function g4() {
  var t = rnd(1, 4), nm = pick(NAMES);
  if (t === 1) {
    var pr = pick([[2, 3], [2, 5], [3, 4], [3, 5], [4, 6], [2, 7], [3, 7], [4, 5], [5, 6], [4, 10], [6, 8], [6, 9]]), a = pr[0], b = pr[1], L = lcm(a, b), N = pick([30, 40, 50, 60, 100]);
    if (L > N) return null;
    var A = Math.floor(N / a), B = Math.floor(N / b), AB = Math.floor(N / L), k = A + B - AB;
    return { stem: '$1, 2, \\dots, ' + N + '$ тоонуудаас нэгийг сонгов. Тэр нь $' + a + '$ ба $' + b + '$ тоонуудын ядаж нэгэнд нь хуваагдах магадлалыг ол.',
      a: '$' + A + '+' + B + '-' + AB + '=' + k + '$ тоо; $P=' + pf(k, N) + '$' };
  }
  if (t === 2) {
    var f = pick(FAIR), ca = d2(f[2]), cb = d2(f[3]);
    return { stem: 'Хоёр шоог зэрэг орхиход ' + f[0] + ' бол ' + nm[0] + ', ' + f[1] + ' бол ' + nm[1] + ' оноо авна. Энэ тоглоом шударга уу?',
      a: '$P_1=' + pf(ca, 36) + '$, $P_2=' + pf(cb, 36) + '$ — ' + (ca === cb ? 'тэнцүү тул шударга' : 'тэнцүү биш тул шударга биш') };
  }
  if (t === 3) {
    var n = rnd(3, 5), c = pick(CUBE), r = c[1](n), cnt = r[0], T = n * n * n;
    if (cnt <= 0) return null;
    return { stem: 'Гадна талыг нь будсан кубын ирмэг бүрийг $' + n + '$ тэнцүү хэсэгт хувааж $' + T + '$ жижиг куб гаргав. Таамгаар авсан жижиг куб ' + c[0] + ' байх магадлалыг ол.',
      a: r[1] + '; $P=' + pf(cnt, T) + '$' };
  }
  var s = rnd(3, 11), k2 = 6 - Math.abs(7 - s);
  return { stem: 'Хоёр шоог зэрэг орхив. а) Нүднүүдийн нийлбэр $' + s + '$ байх; б) нийлбэр $' + s + '$ биш байх; в) хоёр шоо ижил нүдээр буух магадлалыг ол.',
    a: 'а) $' + pf(k2, 36) + '$; б) $' + pf(36 - k2, 36) + '$; в) $' + pf(6, 36) + '$' };
}

CMX.jishig({
  title: 'IV бүлэг — Жишиг даалгавар 2',
  sub: 'Хоёр шоо орхих туршилт · санамсаргүй сонголтын магадлал',
  grade: '7-р анги',
  rule: 'Хоёр шоо: $6\\cdot 6=36$ үр дүн &nbsp;·&nbsp; $n$ хүүхдийг эгнүүлэх: $n!=1\\cdot 2\\cdot\\ldots\\cdot n$ янз &nbsp;·&nbsp; $n$ хүнээс хоёрыг сонгох: $\\dfrac{n(n-1)}{2}$ янз &nbsp;·&nbsp; $|A\\cup B|=|A|+|B|-|A\\cap B|$',
  tasks: [
    { label: 'Хоёр шоог зэрэг орхив. $A$ үзэгдлийн магадлалыг ол.', gen: g1, n: 8, nw: 4, cols: 2, wk: 14 },
    { label: 'Санамсаргүйгээр сонгосон тооны магадлалыг ол.', gen: g2, n: 6, nw: 4, cols: 2, wk: 14 },
    { label: 'Магадлалыг ол.', gen: g3, n: 4, nw: 4, cols: 2, wk: 16 },
    { label: 'Бодлогыг бод.', gen: g4, n: 4, nw: 2, cols: 2, wk: 24 }
  ]
});
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
