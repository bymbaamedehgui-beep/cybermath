<script>
/* 6-р анги · III бүлэг. Харьцаа, пропорц — Жишиг даалгавар 2 (3.2 Пропорцын үндсэн чанар · 3.3 Шууд пропорционал хамаарал) */
function cop(a, b) { return a !== b && gcd(a, b) === 1; }

// 1. Харьцаанууд пропорц үүсгэх эсэх
function g1() {
  var a = rnd(2, 9), b = rnd(2, 9); if (!cop(a, b)) return null;
  var k = rnd(2, 6), m = rnd(2, 6), ok = rnd(0, 1) === 1;
  var c = a * k, d = ok ? b * k : b * k + pick([-1, 1]) * rnd(1, 2);
  if (d <= 0 || (!ok && a * d === b * c)) return null;
  var A = a * m, B = b * m;
  return { stem: '$' + A + ':' + B + '$ ба $' + c + ':' + d + '$', a: (A * d === B * c ? 'Тийм' : 'Үгүй') + ': $' + A + '\\cdot' + d + (A * d === B * c ? '=' : '\\ne') + B + '\\cdot' + c + '$' };
}
// 2. Шууд пропорционал хамаарал: k ба утга
function g2() {
  var k = rnd(2, 9), x1 = rnd(2, 6), x2 = rnd(3, 12); if (x1 === x2) return null;
  if (rnd(0, 1)) return { stem: '$y$ нь $x$-тэй шууд пропорционал, $x=' + x1 + '$ үед $y=' + (k * x1) + '$. $x=' + x2 + '$ үед $y$-ийг ол.', a: 'y=' + (k * x2) };
  return { stem: '$y=kx$, $x=' + x1 + '$ үед $y=' + (k * x1) + '$. $k$-г олж, $y=' + (k * x2) + '$ үед $x$-ийг ол.', a: 'k=' + k + ',\\ x=' + x2 };
}
// 3. Үнэ, зам, ажлын шууд пропорционал бодлого
function g3() {
  var t = rnd(1, 3);
  if (t === 1) {
    var it = pick([['дэвтэр', 400, 1200], ['кг алим', 1500, 3500], ['литр сүү', 2500, 4000]]);
    var u = Math.round(rnd(it[1], it[2]) / 100) * 100, n1 = rnd(2, 6), n2 = rnd(3, 9); if (n1 === n2) return null;
    return { stem: '$' + n1 + '$ ' + it[0] + ' $' + th(u * n1) + '$ төгрөг. $' + n2 + '$ ' + it[0] + ' хэдэн төгрөг вэ?', a: '$' + th(u * n2) + '$ төгрөг' };
  }
  if (t === 2) {
    var v = 5 * rnd(8, 18), t1 = rnd(2, 4), t2 = rnd(3, 7); if (t1 === t2) return null;
    return { stem: 'Автобус $' + t1 + '$ цагт $' + (v * t1) + '$ км явжээ. Ижил хурдаар $' + t2 + '$ цагт хэдэн км явах вэ?', a: '$' + (v * t2) + '$ км' };
  }
  var p = rnd(4, 12), h1 = rnd(2, 5), h2 = rnd(3, 8); if (h1 === h2) return null;
  return { stem: 'Хэвлэгч $' + h1 + '$ минутад $' + (p * h1) + '$ хуудас хэвлэдэг. $' + h2 + '$ минутад хэдэн хуудас хэвлэх вэ?', a: '$' + (p * h2) + '$ хуудас' };
}
// 4. Пропорцоор тооцоолох (жор, хүснэгт)
function g4() {
  if (rnd(0, 1)) {
    var per = pick([[4, 300, 'г гурил'], [3, 150, 'г элсэн чихэр'], [5, 400, 'мл сүү'], [2, 120, 'г цөцгийн тос']]), n2 = rnd(2, 12);
    var unit = per[1] / per[0]; if (unit !== Math.round(unit) || n2 === per[0]) return null;
    return { stem: '$' + per[0] + '$ хүний бялуунд $' + per[1] + '$ ' + per[2] + ' ордог. $' + n2 + '$ хүний бялуунд хэдэн ' + per[2].split(' ')[0] + ' ' + per[2].split(' ').slice(1).join(' ') + ' орох вэ?', a: '$' + (unit * n2) + '$ ' + per[2].split(' ')[0] };
  }
  var k = rnd(2, 9), xs = shuffle([1, 2, 3, 4, 5, 6, 8, 10]).slice(0, 4).sort(function (a, b) { return a - b; }), hide = rnd(1, 3);
  var row1 = xs.map(function (x) { return x; }), row2 = xs.map(function (x, i) { return i === 0 || i === hide ? String(k * x) : '?'; });
  return { stem: '$y$ нь $x$-тэй шууд пропорционал. Хүснэгтийг нөх: $\\begin{array}{c|c|c|c|c}x&' + row1.join('&') + '\\\\\\hline y&' + row2.join('&') + '\\end{array}$',
    a: xs.map(function (x) { return String(k * x); }).filter(function (_, i) { return row2[i] === '?'; }).join(', ') + ' $(k=' + k + ')$', wk: 14 };
}

CMX.jishig({
  title: 'III бүлэг — Жишиг даалгавар 2',
  sub: 'Пропорцын үндсэн чанар · шууд пропорционал хамаарал',
  grade: '6-р анги',
  rule: '$a:b=c:d \\;\\Leftrightarrow\\; a\\cdot d=b\\cdot c$ &nbsp;·&nbsp; Шууд пропорционал: $y=kx$, $k=\\dfrac{y}{x}$ — нэг хэмжигдэхүүн хэд дахин өсөхөд нөгөө нь мөн тэр хэмжээгээр өснө',
  tasks: [
    { label: 'Харьцаанууд пропорц үүсгэх эсэхийг шалга.', gen: g1, n: 8, nw: 4, cols: 4, wk: 12 },
    { label: 'Шууд пропорционал хамаарлын утгыг ол.', gen: g2, n: 4, nw: 4, cols: 2, wk: 16 },
    { label: 'Бодлогыг бод.', gen: g3, n: 4, nw: 4, cols: 2, wk: 18 },
    { label: 'Пропорцоор тооцоол.', gen: g4, n: 4, nw: 2, cols: 2, wk: 18 }
  ]
});
</script>
