<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>500 XP-ны уналт — Математикийн тоглоом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="/assets/xpdrop-questions.js"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Baloo 2', sans-serif;
    background:linear-gradient(135deg, #020a0a 0%, #061616 50%, #020a0a 100%);
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ── SELECT SCREEN ── */
  .select-wrap {
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .brand {
    font-size:0.75rem;
    color:#9adcff;
    letter-spacing:6px;
    font-weight:700;
    margin-bottom:6px;
    text-transform:uppercase;
  }
  .title-main {
    font-size:clamp(2rem, 6vw, 3.6rem);
    font-weight:900;
    color:#f0c14b;
    letter-spacing:2px;
    line-height:1;
    margin-bottom:6px;
    text-shadow:0 0 30px rgba(240,193,75,0.4);
  }
  .title-sub {
    font-size:0.75rem;
    color:#fff;
    letter-spacing:8px;
    opacity:0.55;
    margin-bottom:40px;
    font-weight:600;
  }
  .prompt {
    font-size:1.1rem;
    color:#fff;
    font-weight:800;
    margin-bottom:24px;
    opacity:0.9;
  }
  .grade-grid {
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
    max-width:520px;
    width:100%;
  }
  @media (min-width:760px) { .grade-grid { grid-template-columns:repeat(4, 1fr); max-width:780px; } }
  .grade-card {
    background:linear-gradient(180deg, #1a1a1d 0%, #0d1517 100%);
    border:1px solid rgba(154,220,255,0.25);
    border-radius:14px;
    padding:28px 18px;
    cursor:pointer;
    transition:transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    color:#fff;
    text-align:center;
  }
  .grade-card:hover, .grade-card:focus {
    transform:translateY(-4px);
    border-color:#f0c14b;
    box-shadow:0 12px 30px rgba(240,193,75,0.25), 0 0 60px rgba(240,193,75,0.12);
    outline:none;
  }
  .grade-num {
    font-size:3.4rem;
    font-weight:900;
    color:#f0c14b;
    line-height:1;
    margin-bottom:6px;
    font-family:ui-monospace, 'SF Mono', Menlo, monospace;
  }
  .grade-label {
    font-size:0.84rem;
    color:#9adcff;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:800;
  }
  .grade-count {
    margin-top:8px;
    font-size:0.7rem;
    opacity:0.5;
    color:#fff;
    font-weight:600;
  }
  .rules {
    margin-top:34px;
    max-width:540px;
    font-size:0.82rem;
    line-height:1.6;
    opacity:0.7;
    color:#9adcff;
  }
  .rules b { color:#f0c14b; }

  /* ── GAME WRAP ── */
  .game-wrap {
    position:fixed;
    inset:0;
    background:#020a0a;
    display:none;
    flex-direction:column;
  }
  .game-topbar {
    background:#061616;
    border-bottom:1px solid rgba(154,220,255,0.2);
    padding:10px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-shrink:0;
  }
  .back-btn {
    background:rgba(248,113,113,0.15);
    border:1px solid rgba(248,113,113,0.4);
    color:#f87171;
    padding:8px 14px;
    border-radius:8px;
    font-family:inherit;
    font-weight:800;
    font-size:0.84rem;
    cursor:pointer;
    letter-spacing:0.5px;
  }
  .game-info {
    display:flex;
    gap:18px;
    align-items:center;
    color:#fff;
    font-weight:800;
    font-size:0.86rem;
  }
  .game-info .grade-pill {
    background:rgba(240,193,75,0.15);
    border:1px solid rgba(240,193,75,0.4);
    color:#f0c14b;
    padding:4px 12px;
    border-radius:8px;
    letter-spacing:1px;
  }
  #game-frame {
    flex:1;
    width:100%;
    border:none;
    background:#020a0a;
  }

  /* Loading screen */
  .loading {
    position:fixed;
    inset:0;
    background:rgba(2,10,10,0.95);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    color:#f0c14b;
    font-weight:800;
    font-size:1.1rem;
    letter-spacing:2px;
  }
  .loading.hidden { display:none; }
</style>
</head>
<body>

<!-- SELECT SCREEN -->
<div class="select-wrap" id="select-screen">
  <div class="brand">CYBERMATH PRESENTS</div>
  <div class="title-main">500 XP-НЫ УНАЛТ</div>
  <div class="title-sub">MONEY DROP</div>

  <div class="prompt">Ангиа сонго</div>

  <div class="grade-grid" id="grade-grid"></div>

  <div class="rules">
    🎯 <b>10 бодлого</b>, бүрд 4 хариулт. Зөв хариунд <b>500 XP</b> хүртэлх шагнал хуваагдана. Алдвал XP алгасна — өргөнтэй, эрсдэлтэй бүртгэлгүй математикийн тоглоом.
  </div>
</div>

<!-- GAME SCREEN -->
<div class="game-wrap" id="game-screen">
  <div class="game-topbar">
    <button class="back-btn" onclick="exitGame()">← Буцах</button>
    <div class="game-info">
      <span class="grade-pill" id="info-grade">6-Р АНГИ</span>
      <span>🎯 10 бодлого</span>
    </div>
  </div>
  <iframe id="game-frame"></iframe>
  <div class="loading" id="game-loading">⏳ Бодлого ачаалж байна...</div>
</div>

<script>
  var QUESTIONS = null; // {6:[...], 7:[...], 8:[...], 9:[...]}
  var CURRENT_GRADE = null;
  var CURRENT_ROUNDS = [];

  // KaTeX-аар $...$-ийг HTML render
  function renderTex(s) {
    s = String(s == null ? '' : s);
    if (!window.katex) return s;
    return s.replace(/\$([^$]+)\$/g, function(_, expr) {
      try { return window.katex.renderToString(expr, { throwOnError: false, output: 'html' }); }
      catch(e) { return expr; }
    });
  }

  // Бодлогын санг embedded script-ээс ачаалах (fetch хэрэггүй)
  async function loadQuestions() {
    if (window.XPDROP_QUESTIONS) {
      QUESTIONS = window.XPDROP_QUESTIONS;
      console.log('[xpdrop] embedded loaded', { 6: (QUESTIONS['6']||[]).length, 7: (QUESTIONS['7']||[]).length, 8: (QUESTIONS['8']||[]).length, 9: (QUESTIONS['9']||[]).length });
    } else {
      // Fallback: fetch JSON
      try {
        var r = await fetch('/assets/xpdrop-questions.json?v=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        QUESTIONS = await r.json();
      } catch(e) {
        var rules = document.querySelector('.rules');
        if (rules) {
          rules.innerHTML = '<span style="color:#f87171;">⚠️ Бодлогын сан ачаалагдсангүй: ' + e.message + '</span>';
        }
        QUESTIONS = { 6:[], 7:[], 8:[], 9:[] };
      }
    }
    renderGradeCards();
  }

  function renderGradeCards() {
    var grid = document.getElementById('grade-grid');
    grid.innerHTML = '';
    [6, 7, 8, 9].forEach(function(g) {
      var arr = (QUESTIONS && QUESTIONS[g]) || [];
      var count = arr.length;
      var card = document.createElement('button');
      card.className = 'grade-card';
      card.setAttribute('type', 'button');
      card.onclick = function(){ startGame(g); };
      card.innerHTML = ''
        + '<div class="grade-num">' + g + '</div>'
        + '<div class="grade-label">-р анги</div>'
        + '<div class="grade-count">' + count + ' бодлого бэлэн</div>';
      grid.appendChild(card);
    });
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildRoundsForGrade(g) {
    var src = (QUESTIONS && QUESTIONS[g]) || [];
    var pool = src.filter(function(q){
      return q && q.text && Array.isArray(q.options) && q.options.length >= 4 && typeof q.correctIdx === 'number';
    });
    pool = shuffle(pool.slice()).slice(0, 10);
    if (!pool.length) {
      return [{ text: g + '-р ангийн бодлогын сан хоосон байна.', options: ['—','—','—','—'], correctIdx: 0 }];
    }
    return pool.map(function(q){
      return {
        text: renderTex(q.text),
        options: q.options.slice(0, 4).map(function(o){ return renderTex(o); }),
        correctIdx: q.correctIdx
      };
    });
  }

  function startGame(grade) {
    CURRENT_GRADE = grade;
    CURRENT_ROUNDS = buildRoundsForGrade(grade);
    document.getElementById('info-grade').textContent = grade + '-Р АНГИ';
    document.getElementById('select-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    document.getElementById('game-loading').classList.remove('hidden');
    var f = document.getElementById('game-frame');
    f.src = 'xpdrop.html';
    f.onload = function(){
      // KaTeX CSS-ийг iframe-руу ган inject
      try {
        var doc = f.contentDocument;
        if (doc && !doc.getElementById('katex-css-injected')) {
          var link = doc.createElement('link');
          link.id = 'katex-css-injected';
          link.rel = 'stylesheet';
          link.href = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css';
          doc.head.appendChild(link);
        }
        if (doc && !doc.getElementById('xpdrop-custom-css')) {
          var st = doc.createElement('style');
          st.id = 'xpdrop-custom-css';
          st.textContent = ''
            + '.trapdoors{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:14px!important;width:100%!important;max-width:none!important;padding:0 16px!important}'
            + '.trap{flex:1!important;width:100%!important;min-width:0!important;max-width:none!important}'
            + '.monitor{width:100%!important;max-width:none!important}'
            + '.monitor-bezel{width:100%!important}'
            + '.screen{aspect-ratio:5/3!important;width:100%!important;min-height:140px!important}'
            + '.screen-answer{font-size:clamp(1rem,3.2vw,2rem)!important;font-weight:800!important;line-height:1.2!important;padding:8px!important;word-break:break-word;overflow-wrap:anywhere;display:flex!important;align-items:center;justify-content:center;text-align:center;max-height:100%}'
            + '.screen-answer .katex,.screen-answer .katex-html{font-size:inherit!important}'
            + '.q-text{font-size:clamp(1.1rem,3vw,1.6rem)!important;line-height:1.35!important;padding:0 16px}'
            + '.q-text .katex,.q-text .katex-html{font-size:inherit!important}'
            + 'main{width:100%!important;max-width:none!important;padding:0!important;box-sizing:border-box}'
            ;
          doc.head.appendChild(st);
        }
      } catch(_){}
      // Iframe-руу бодлогуудыг шууд илгээх
      setTimeout(function(){
        f.contentWindow.postMessage({ type: 'xpdrop-questions', rounds: CURRENT_ROUNDS }, '*');
        document.getElementById('game-loading').classList.add('hidden');
      }, 400);
    };
  }

  function exitGame() {
    var f = document.getElementById('game-frame');
    f.src = 'about:blank';
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('select-screen').style.display = 'flex';
  }

  // Iframe-аас ирэх postMessage
  window.addEventListener('message', function(e) {
    var d = e && e.data;
    if (!d) return;
    if (d.type === 'xpdrop-need-questions') {
      // Iframe-р дахин асуулт хүсэх (replay) — мөн адил рандом 10
      CURRENT_ROUNDS = buildRoundsForGrade(CURRENT_GRADE);
      var f = document.getElementById('game-frame');
      if (f && f.contentWindow) {
        f.contentWindow.postMessage({ type: 'xpdrop-questions', rounds: CURRENT_ROUNDS }, '*');
      }
    }
  });

  loadQuestions();
</script>

</body>
</html>
