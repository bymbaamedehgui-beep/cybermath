/* 8-р анги · VI бүлэг. Өнцөг, дүрс, байгуулалт — Жишиг даалгавар 1

/* ── Зураг: SVG (≤160×110 px), зураас #1a1030, бичиг 11px. Дүрсийг абстракт координатад (y дээш) байгуулж fit()-ээр хүрээнд

var INK = '#1a1030';
function r1(v) { return Math.round(v * 10) / 10; }
function rad(d) { return d * Math.PI / 180; }
function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }

function triBC(b, c) { var t = Math.sin(rad(c)) / Math.sin(rad(b + c)); return [t * Math.cos(rad(b)), t * Math.sin(rad(b))]; }

  var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  pts.forEach(function (p) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });

}
function tw(t) { t = String(t); return t.replace(/°/g, '').length * 6.2 + (t.indexOf('°') >= 0 ? 4 : 0); }   // бичгийн өргөн (px)
// Зургийн самбар (SVG координат, y доош): элементүүдийг цуглуулж, хүрээгээр нь тайрна; шошгыг саадаас зайтай байрлуулна

    G.forEach(function (g) {

}
// гүдгэр n өнцөгт: оройнуудыг тойргийн дагуу санамсаргүй хэлбийлгэнэ; өнцөг бүр [lo, hi] байвал { P, A (бодит өнцгүүд) }
function rpoly(n, jit, lo, hi) {
  var b = rnd(0, 359), P = [], A = [], i;
  for (i = 0; i < n; i++) { var t = rad(b + i * 360 / n + rnd(-jit, jit)), r = 1 + rnd(-15, 15) / 100; P.push([r * Math.cos(t), r * Math.sin(t)]); }

    var p = P[(i + n - 1) % n], c = P[i], q = P[(i + 1) % n];
    if ((c[0] - p[0]) * (q[1] - c[1]) - (c[1] - p[1]) * (q[0] - c[0]) <= 0) return null;

// олон өнцөгт, орой бүрт дотоод өнцгийн шошго
function figPoly(P, labs) {
  var m = fit(P, 136, 92), Q = P.map(m), S = Sc(), n = Q.length;
  S.poly(Q);

}
// a ∥ b (хэвтээ), огтлогч th° өнцгөөр; mk: [{ L: 'a'|'b', p: 'ur'|'ul'|'ll'|'lr', t: шошго, it }] — ur, ll: th°; ul, lr: 180° − th
function figPar(th, mk) {

  var u = [Math.cos(rad(th)), -Math.sin(rad(th))], Pa = [xa, ya], Pb = [xb, yb];

// a ∥ b, M — хоёр шулууны хооронд зүүн талд: ∠1 = al (A орой), ∠2 = be (B орой), ∠AMB = x
function figZig(al, be) {

  S.line(a0, a1).line(b0, b1).line(PA, PM).line(PM, PB);

// гурвалжин ABC (A, B — суурь), M, N — AC, BC-ийн дунд цэг; lb — AB-ийн доор, lm — MN-ийн доор
function figMid(cx, cy, lb, lm) {

  if (lm) S.text([(pm[0] + pn[0]) / 2, pm[1] + 9], lm);

// гурвалжин ABC, AD ба BE медиан, O — хүндийн төв
function figCen(cx, cy) {
  var A = [0, 0], B = [1, 0], Cc = [cx, cy], m = fit([A, B, Cc], 112, 66), a = m(A), b = m(B), c = m(Cc), d = m(mid(B, Cc)), e = m(mid(A, Cc)), o = m([(1 + cx) / 3, cy / 3]), G0 = cen([a, b, c]), S = Sc();

// гурвалжин ABC (A дээр), B ба C өнцгийн биссектрисүүд O цэгт (багтсан тойргийн төв: O = (a·A + b·B + c·C)/(a + b + c)); ∠A шошготой, ∠BOC — ?

/* ── туслах ── */

  if (t === 1) { n = rnd(5, 20); return { stem: 'Гүдгэр $' + n + '$ өнцөгтийн дотоод өнцгүүдийн нийлбэр', a: '(' + n + '-2)\\cdot 180^\\circ=' + dg((n - 2) * 180) }; }
  if (t === 2) { n = pick(NREG); I = 180 - 360 / n; return { stem: 'Зөв $' + n + '$ өнцөгтийн нэг дотоод өнцөг', a: '\\dfrac{(' + n + '-2)\\cdot 180^\\circ}{' + n + '}=' + dg(I) }; }
  if (t === 3) { n = pick(NREG); return { stem: 'Зөв $' + n + '$ өнцөгтийн нэг гадаад өнцөг', a: '\\dfrac{360^\\circ}{' + n + '}=' + dg(360 / n) }; }
  if (t === 4) { n = pick(NREG); return { stem: 'Нэг гадаад өнцөг нь $' + dg(360 / n) + '$ байх зөв олон өнцөгтийн талын тоо', a: 'n=\\dfrac{360^\\circ}{' + dg(360 / n) + '}=' + n }; }
  if (t === 5) { n = pick(NREG); I = 180 - 360 / n; return { stem: 'Нэг дотоод өнцөг нь $' + dg(I) + '$ байх зөв олон өнцөгтийн талын тоо', a: '180^\\circ-' + dg(I) + '=' + dg(360 / n) + ';\\ n=\\dfrac{360^\\circ}{' + dg(360 / n) + '}=' + n }; }
  if (t === 6) { n = rnd(4, 20); return { stem: 'Гүдгэр $' + n + '$ өнцөгтийн диагоналийн тоо', a: '\\dfrac{' + n + '\\cdot ' + (n - 3) + '}{2}=' + n * (n - 3) / 2 }; }
  if (t === 7) { n = rnd(5, 20); return { stem: '$' + n * (n - 3) / 2 + '$ диагональтай гүдгэр олон өнцөгтийн талын тоо', a: '\\dfrac{n(n-3)}{2}=' + n * (n - 3) / 2 + ';\\ n=' + n }; }
  if (t === 8) { n = rnd(5, 20); return { stem: 'Дотоод өнцгүүдийн нийлбэр нь $' + dg((n - 2) * 180) + '$ байх гүдгэр олон өнцөгтийн талын тоо', a: '(n-2)\\cdot 180^\\circ=' + dg((n - 2) * 180) + ';\\ n=' + n }; }
  var x = rnd(40, 170);
  return { stem: 'Олон өнцөгтийн нэг оройн дотоод өнцөг $' + dg(x) + '$ бол тэр оройн гадаад өнцөг', a: '$180^\\circ-' + dg(x) + '=' + dg(180 - x) + '$ (хамар өнцгүүд)' };
}

// 2. Мэдэгдэхгүй өнцөг (зурагтай): олон өнцөгтийн дотоод өнцөг, гадаад өнцгүүдийн нийлбэр, параллель шулуун ба огтлогч, туслах параллель шулуун (6.1)
function g2() { var t = B2(); return tryN(function () { return g2m(t); }); }
function g2m(t) {
  if (t <= 2) {          // олон өнцөгт: зурган дээрх өнцгүүд нь бодит өнцгөө бүхэлчилсэн утга (x нь ±2°-ийн дотор таарна)
    var n = t === 1 ? 4 : 5, R = rpoly(n, n === 4 ? 22 : 13, 50, 165); if (!R) return null;
    var k = rnd(0, n - 1), tot = (n - 2) * 180, g = R.A.map(Math.round), s = 0, vals = [], labs = [], i;
    for (i = 0; i < n; i++) if (i !== k) { s += g[i]; vals.push(dg(g[i])); }
    var x = tot - s; if (Math.abs(x - R.A[k]) > 2.5 || x < 50 || x > 168) return null;
    for (i = 0; i < n; i++) labs.push(i === k ? 'x' : g[i] + '°');
    return { stem: PNM[n] + ' өнцөгтийн өнцгүүд $' + vals.join(',\\ ') + '$ ба $x$', fig: figPoly(R.P, labs), a: '(' + n + '-2)\\cdot 180^\\circ=' + dg(tot) + ';\\ x=' + dg(tot) + '-' + dg(s) + '=' + dg(x) };
  }
  if (t === 3) {         // параллель шулуун: харгалзах, солбисон, нэг талын өнцөг
    var th = rnd(32, 80); if (th === 45) return null;
    var P4 = ['ur', 'ul', 'll', 'lr'], gp = pick(P4), up = pick(P4), gl = pick(['a', 'b']);
    var val = function (p) { return p === 'ur' || p === 'll' ? th : 180 - th; }, gv = val(gp), uv = val(up);
    return { stem: '$a\\parallel b$, $\\angle 1=' + dg(gv) + '$', fig: figPar(th, [{ L: gl, p: gp, t: '1' }, { L: gl === 'a' ? 'b' : 'a', p: up, t: 'x', it: 1 }]),
      a: gv === uv ? 'x=\\angle 1=' + dg(uv) : 'x=180^\\circ-' + dg(gv) + '=' + dg(uv) };
  }
  if (t === 4) {         // оройгоор туслах параллель шулуун татна: x = ∠1 + ∠2
    var al = rnd(25, 70), be = rnd(25, 70); if (al === be || al + be > 140) return null;
    return { stem: '$a\\parallel b$, $\\angle 1=' + dg(al) + '$, $\\angle 2=' + dg(be) + '$', fig: figZig(al, be), a: 'x=\\angle 1+\\angle 2=' + dg(al) + '+' + dg(be) + '=' + dg(al + be) };
  }
  // гадаад өнцгүүдийн нийлбэр 360°
  var n5 = pick([4, 5, 6]), e = [], s5 = 0;
  for (var j = 0; j < n5 - 1; j++) { e.push(rnd(30, 100)); s5 += e[j]; }
  var x5 = 360 - s5; if (x5 < 25 || x5 > 120) return null;
  return { stem: PNM[n5] + ' өнцөгтийн гадаад өнцгүүд $' + e.map(dg).join(',\\ ') + '$ ба $x$', a: 'x=360^\\circ-(' + e.join('+') + ')^\\circ=' + dg(x5) };
}

// 3. Дундаж шугам, дундаж шугамуудаас тогтох гурвалжны периметр, гипотенуз руу татсан медиан, хүндийн төв (2 : 1) (6.2)
function g3() { var t = B3(); return tryN(function () { return g3m(t); }); }
function g3m(t) {
  var cx = rnd(25, 70) / 100, cy = rnd(60, 90) / 100;
  if (t === 1) { var b = rnd(6, 30); return { stem: '$M$, $N$ — $AC$, $BC$ талуудын дунд цэг, $AB=' + b + '$ см, $MN=?$', fig: figMid(cx, cy, b + ' см', ''), a: '$MN=\\dfrac{AB}{2}=' + nm(b / 2) + '$ см' }; }
  if (t === 2) { var h = rnd(3, 16); return { stem: '$M$, $N$ — $AC$, $BC$ талуудын дунд цэг, $MN=' + h + '$ см, $AB=?$', fig: figMid(cx, cy, '', h + ' см'), a: '$AB=2\\cdot MN=' + 2 * h + '$ см' }; }
  if (t === 3) {
    var p = rnd(5, 24), q = rnd(5, 24), r = rnd(5, 24); if (p + q <= r || p + r <= q || q + r <= p || (p === q && q === r)) return null;
    return { stem: 'Гурвалжны талууд $' + p + '$, $' + q + '$, $' + r + '$ см. Дундаж шугамуудаас тогтох гурвалжны периметр', a: '$\\dfrac{' + p + '+' + q + '+' + r + '}{2}=' + nm((p + q + r) / 2) + '$ см' };
  }
  if (t === 4) { var c = 2 * rnd(4, 25); return { stem: 'Тэгш өнцөгт гурвалжны гипотенуз $' + c + '$ см. Тэгш өнцгийн оройгоос татсан медиан', a: '$\\dfrac{' + c + '}{2}=' + c / 2 + '$ см' }; }
  var k = rnd(2, 12), k2 = rnd(2, 12);
  if (t === 5) return { stem: '$O$ — $ABC$ гурвалжны хүндийн төв, $AD$ медиан $' + 3 * k + '$ см. $AO=?$, $OD=?$', fig: figCen(cx, cy), a: '$AO=\\dfrac{2}{3}\\cdot ' + 3 * k + '=' + 2 * k + '$ см, $OD=' + k + '$ см' };
  if (t === 6) return { stem: '$O$ — $ABC$ гурвалжны хүндийн төв, $AD$ медиан, $OD=' + k + '$ см. $AD=?$', a: '$AO=2\\cdot OD=' + 2 * k + '$ см, $AD=' + 3 * k + '$ см' };
  if (k === k2) return null;
  return { stem: '$O$ — хүндийн төв, $AD=' + 3 * k + '$ см, $BE=' + 3 * k2 + '$ см медианууд. $AO+BO=?$', fig: figCen(cx, cy), a: '$AO+BO=' + 2 * k + '+' + 2 * k2 + '=' + 2 * (k + k2) + '$ см' };
}

// 4. Биссектрис, өндөр, багтсан тойрог: ∠BOC = 90° + A/2, өндөр ба өнцөг, биссектрисийн үүсгэх өнцөг, S = p·r, дотоод ба гадаад биссектрис (6.2)
function g4() { var t = B4() || pick([4, 5, 6]); return tryN(function () { return g4m(t); }); }    // 0 → багтсан тойрог эсвэл дотоод/гадаад биссектрис
function g4m(t) {
  if (t === 1) {
    var A = 2 * rnd(20, 45), bv = rnd(Math.round((180 - A) * 0.38), Math.round((180 - A) * 0.62));
    return { stem: '$ABC$ гурвалжны $B$, $C$ өнцгийн биссектрисүүд $O$ цэгт огтлолцоно, $\\angle A=' + dg(A) + '$ бол $\\angle BOC=?$', fig: figBis(A, bv),
      a: '\\angle B+\\angle C=' + dg(180 - A) + ';\\ \\angle BOC=180^\\circ-' + dg((180 - A) / 2) + '=' + dg(90 + A / 2) };
  }
  if (t === 2) {
    var av = rnd(35, 80), cv = rnd(35, 80); if (av + cv > 150) return null;
    return { stem: '$BH$ — $ABC$ гурвалжны өндөр, $\\angle A=' + dg(av) + '$ бол $\\angle ABH=?$', fig: figAlt(av, cv), a: '\\angle AHB=90^\\circ;\\ \\angle ABH=90^\\circ-' + dg(av) + '=' + dg(90 - av) };
  }
  if (t === 3) {
    var a3 = 2 * rnd(20, 50), b3 = rnd(30, 95); if (a3 + b3 > 150) return null;
    return { stem: '$AD$ — $ABC$ гурвалжны биссектрис, $\\angle A=' + dg(a3) + '$, $\\angle B=' + dg(b3) + '$ бол $\\angle ADB=?$', fig: figAD(a3, b3),
      a: '\\angle BAD=' + dg(a3 / 2) + ';\\ \\angle ADB=180^\\circ-' + dg(a3 / 2) + '-' + dg(b3) + '=' + dg(180 - a3 / 2 - b3) };
  }
  if (t <= 5) {
    var H = pick(HER), p = (H[0] + H[1] + H[2]) / 2, S = p * H[3];
    if (t === 4) return { stem: 'Гурвалжны талууд $' + H[0] + '$, $' + H[1] + '$, $' + H[2] + '$ см, багтсан тойргийн радиус $' + H[3] + '$ см. Талбайг ол.', a: '$p=' + p + '$; $S=p\\cdot r=' + p + '\\cdot ' + H[3] + '=' + S + '$ см$^2$' };
    return { stem: 'Гурвалжны талууд $' + H[0] + '$, $' + H[1] + '$, $' + H[2] + '$ см, талбай $' + S + '$ см$^2$. Багтсан тойргийн радиусыг ол.', a: '$p=' + p + '$; $r=\\dfrac{S}{p}=\\dfrac{' + S + '}{' + p + '}=' + H[3] + '$ см' };
  }
  var B = rnd(30, 150); if (B === 90) return null;
  return { stem: 'Гурвалжны $\\angle B=' + dg(B) + '$ бол $B$ оройн дотоод ба гадаад өнцгийн биссектрисүүдийн хоорондох өнцгийг ол.', a: '\\dfrac{' + dg(B) + '}{2}+\\dfrac{' + dg(180 - B) + '}{2}=90^\\circ' };
}

  grade: '8-р анги',

  tasks: [
    { label: 'Олон өнцөгтийн өнцөг, талын тоо, диагоналийн тоог ол.', gen: g1, n: 8, nw: 4, cols: 2, wk: 12 },
    { label: 'Мэдэгдэхгүй байгаа өнцгийг ол.', gen: g2, n: 4, nw: 2, cols: 2, wk: 14 },
    { label: 'Гурвалжны хэрчмийн уртыг ол.', gen: g3, n: 4, nw: 2, cols: 2, wk: 14 },
    { label: 'Биссектрис, өндөр, багтсан тойргийн бодлогыг бод.', gen: g4, n: 2, nw: 2, cols: 2, wk: 18 }
  ]
