<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Шугаман функц — утга ба томьёо (8-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:18mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
// ── 8-р анги V бүлэг (Дараалал, функц) ──
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function sgn(n){return n>=0?'+'+n:''+n;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
function lineY(k,b){var t=(k===1?'x':k===-1?'-x':k===0?'':k+'x');if(b>0)t+=(t?'+':'')+b;else if(b<0)t+='-'+(-b);if(t==='')t='0';return t;}
// ── 2D координат зураг ──
function plane(opts){var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.parab||[]).forEach(function(P){var pts=[],t;for(t=-R;t<=R;t+=0.2){var yy=P.a*t*t;if(yy>=-R-0.5&&yy<=R+0.5)pts.push(X(t)+','+Y(yy));}g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+(P.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}

// ════════ 5.1 Дараалал ════════
var SEQ=[
 {t:'n^2',f:function(n){return n*n;},tex:'n^2'},
 {t:'2n-1',f:function(n){return 2*n-1;},tex:'2n-1'},
 {t:'3n',f:function(n){return 3*n;},tex:'3n'},
 {t:'n(n+1)',f:function(n){return n*(n+1);},tex:'n(n+1)'},
 {t:'n^3',f:function(n){return n*n*n;},tex:'n^3'},
 {t:'2^n',f:function(n){return Math.pow(2,n);},tex:'2^{n}'},
 {t:'n^2+1',f:function(n){return n*n+1;},tex:'n^2+1'}
];
function g_seqNext(){var s=pick(SEQ);var first=[1,2,3,4].map(s.f);var nxt=[s.f(5),s.f(6)];
 return {q:'$'+first.join(',\\ ')+',\\ \\ldots$ дарааллын дараагийн хоёр гишүүнийг ол.',a:'Зүй тогтол $a_n='+s.tex+'$ тул $a_5='+nxt[0]+',\\ a_6='+nxt[1]+'$',key:'sn'+s.t,nv:nxt[0]};}
function g_seqNth(){var s=pick(SEQ),n=pick([5,6,8,10]);
 return {q:'$a_n='+s.tex+'$ дарааллын $a_{'+n+'}$ гишүүнийг ол.',a:'$a_{'+n+'}='+s.tex.replace(/n/g,'('+n+')')+'='+s.f(n)+'$',key:'snth'+s.t+n,nv:s.f(n)};}
function g_seqFirst4(){var s=pick(SEQ);var T=[1,2,3,4].map(s.f);
 return {q:'$a_n='+s.tex+'$ дарааллын эхний $4$ гишүүнийг ол.',a:'$a_1='+T[0]+',\\ a_2='+T[1]+',\\ a_3='+T[2]+',\\ a_4='+T[3]+'$',key:'sf4'+s.t};}

// ════════ 5.2 Арифметик прогресс ════════
function g_apNth(){var a1=nz(-8,10),d=nz(-6,6),n=pick([10,12,15,20,25]);var an=a1+(n-1)*d;
 return {q:'Арифметик прогрессийн $a_1='+a1+',\\ d='+d+'$ бол $a_{'+n+'}$-г ол.',a:'$a_{'+n+'}=a_1+(n-1)d='+a1+'+'+(n-1)+'\\cdot('+d+')='+an+'$',key:'apn'+a1+d+n,nv:an};}
function g_apFind(){for(var t=0;t<200;t++){var a1=nz(-8,10),d=nz(-5,6),m=rnd(2,6),n=m+rnd(2,8);var am=a1+(m-1)*d,an=a1+(n-1)*d;if(Math.abs(am)>120||Math.abs(an)>120)continue;
  return {q:'Арифметик прогрессийн $a_{'+m+'}='+am+',\\ a_{'+n+'}='+an+'$ бол $a_1$ ба $d$-г ол.',a:'$('+n+'-'+m+')d='+(an-am)+'\\Rightarrow d='+d+'$; $\\ a_1='+am+'-'+(m-1)+'\\cdot('+d+')='+a1+'$',key:'apf'+a1+d+m+n};}return null;}
function g_apSum(){var a1=nz(-6,8),d=nz(-4,5),n=pick([10,12,15,20]);var an=a1+(n-1)*d,Sn=n*(a1+an)/2;if(Sn!==Math.round(Sn))return null;
 return {q:'Арифметик прогрессийн $a_1='+a1+',\\ d='+d+'$ бол $S_{'+n+'}$-г ол.',a:'$a_{'+n+'}='+an+'$; $\\ S_{'+n+'}=\\dfrac{(a_1+a_{'+n+'})n}{2}=\\dfrac{('+a1+sgn(an)+')\\cdot'+n+'}{2}='+Sn+'$',key:'aps'+a1+d+n,nv:Sn};}
function g_apCheck(){var mode=pick(['ap','geo','none']);var a1=nz(1,6),arr;
 if(mode==='ap'){var d=nz(-4,5);arr=[a1,a1+d,a1+2*d,a1+3*d];}
 else if(mode==='geo'){var r=pick([2,3]);arr=[a1,a1*r,a1*r*r,a1*r*r*r];}
 else arr=[a1,a1+2,a1+5,a1+9];
 return {q:'$'+arr.join(',\\ ')+',\\ \\ldots$ дараалал арифметик прогресс мөн үү?',a:mode==='ap'?('Зэргэлдээ гишүүдийн ялгавар тогтмол ($d='+(arr[1]-arr[0])+'$) тул <b>арифметик прогресс мөн</b>.'):('Зэргэлдээ гишүүдийн ялгавар тогтмол бус тул <b>арифметик прогресс биш</b>.'),key:'apc'+mode+arr.join()};}

// ════════ 5.3 Шугаман функц ════════
function g_linVal(){var k=nz(-4,4),b=nz(-6,6),x=nz(-5,5);var y=k*x+b;
 return {q:'$y='+lineY(k,b)+'$ функцийн $x='+x+'$ үеийн утгыг ол.',a:'$y='+k+'\\cdot('+x+')'+sgn(b)+'='+y+'$',key:'lv'+k+b+x,nv:y};}
function g_pointOnLine(){var k=nz(-3,3),b=nz(-5,5),x=nz(-4,4);var yTrue=k*x+b;var on=pick([true,false]);var y=on?yTrue:yTrue+pick([1,-1,2]);
 return {q:'$('+x+';\\ '+y+')$ цэг $y='+lineY(k,b)+'$ шулуун дээр орших уу?',a:'$'+k+'\\cdot('+x+')'+sgn(b)+'='+yTrue+'$ '+(y===yTrue?'$='+y+'$ тул <b>оршино</b>.':'$\\ne '+y+'$ тул <b>үл оршино</b>.'),key:'pol'+k+b+x+y};}
function g_lineFromTable(){var k=nz(-3,4),b=nz(-5,5);var xs=[0,1,2,3];
 return {q:'Хүснэгтээр өгсөн шугаман функцийн томьёог ол: $x:\\ '+xs.join(',\\ ')+'$; $\\ y:\\ '+xs.map(function(x){return k*x+b;}).join(',\\ ')+'$',a:'$b=y(0)='+b+'$; налалт $k=\\dfrac{'+(k*1+b)+'-'+b+'}{1}='+k+'$ тул $y='+lineY(k,b)+'$',key:'lft'+k+b};}
function g_linGraph(){var k=pick([1,2,-1,-2]),b=nz(-3,3);
 return {q:'$y='+lineY(k,b)+'$ шугаман функцийн графикийг доорх координатын хавтгайд байгуул.',fig:plane({blank:true}),noWk:true,a:'$x=0\\Rightarrow y='+b+'$; $\\ x=1\\Rightarrow y='+(k+b)+'$ цэгүүдийг тэмдэглэн шулуунаар холбоно.',afig:plane({lines:[{k:k,b:b}],pts:[{x:0,y:b},{x:1,y:k+b}]}),key:'lg'+k+b};}

// ════════ 5.4 Налалт ба шулууны тэгшитгэл ════════
function g_slope2pts(){var x1=nz(-5,5),x2=nz(-5,5);if(x1===x2)return null;var y1=nz(-6,6),y2=nz(-6,6);
 return {q:'$A('+x1+';\\ '+y1+'),\\ B('+x2+';\\ '+y2+')$ цэгээр дайрсан шулууны налалтыг ол.',a:'$k=\\dfrac{y_2-y_1}{x_2-x_1}=\\dfrac{'+(y2-y1)+'}{'+(x2-x1)+'}='+frTeX(y2-y1,x2-x1)+'$',key:'sl'+x1+y1+x2+y2};}
function g_lineEq2pts(){var k=nz(-3,3),b=nz(-5,5),x1=nz(-4,4),x2=nz(-4,4);if(x1===x2)return null;var y1=k*x1+b,y2=k*x2+b;
 return {q:'$A('+x1+';\\ '+y1+'),\\ B('+x2+';\\ '+y2+')$ цэгээр дайрсан шулууны тэгшитгэлийг ($y=kx+b$) ол.',a:'$k=\\dfrac{'+(y2-y1)+'}{'+(x2-x1)+'}='+k+'$; $\\ b=y_1-kx_1='+y1+'-('+k+')\\cdot('+x1+')='+b+'$ тул $y='+lineY(k,b)+'$',key:'le'+k+b+x1+x2};}

// ════════ 5.5 ШТС графикаар ════════
function g_systemGraph(){var x=nz(-3,3),y=nz(-4,4),k1=nz(-2,2),k2=nz(-2,2);if(k1===k2)return null;var b1=y-k1*x,b2=y-k2*x;if(Math.abs(b1)>5||Math.abs(b2)>5)return null;
 return {q:'$\\begin{cases}y='+lineY(k1,b1)+'\\\\y='+lineY(k2,b2)+'\\end{cases}$ системийг графикийн аргаар бод.',a:'Хоёр шулууны огтлолцлын цэг $('+x+';\\ '+y+')$ нь шийд.',afig:plane({lines:[{k:k1,b:b1,color:'#7B52EE'},{k:k2,b:b2,color:'#16a34a'}],pts:[{x:x,y:y,l:'('+x+';'+y+')'}]}),key:'sg'+k1+b1+k2+b2,sol:[x,y]};}

// ════════ 5.6 Урвуу пропорцын график ════════
function g_invProp(){var k=pick([6,8,12,-6,-12,24]);var xs=[1,2,3,-1,-2].filter(function(x){return k%x===0;});var x=pick(xs);var y=k/x;
 return {q:'$y=\\dfrac{'+k+'}{x}$ урвуу пропорционал функцийн $x='+x+'$ үеийн утгыг ол.',a:'$y=\\dfrac{'+k+'}{'+x+'}='+y+'$',key:'ip'+k+x,nv:y};}
function g_invPropK(){var k=pick([6,8,12,10,24,-12]);var x=pick([2,3,4]);if(k%x!==0)return null;var y=k/x;
 return {q:'$y$ ба $x$ урвуу пропорционал ($xy=k$). $x='+x+'$ үед $y='+y+'$ бол $k$-г олж, $x=6$ үеийн $y$-г ол.',a:'$k=xy='+x+'\\cdot'+y+'='+k+'$; $\\ x=6\\Rightarrow y=\\dfrac{'+k+'}{6}='+(k/6)+'$',key:'ipk'+k+x,nv:k};}

// ════════ 5.7 y=ax^2 функц ════════
function g_paraTable(){var a=pick([1,2,-1,-2]);var xs=[-2,-1,0,1,2];
 return {q:'$y='+(a===1?'':a===-1?'-':a)+'x^2$ функцийн $x=-2,-1,0,1,2$ үеийн утгуудыг ол.',a:'$'+xs.map(function(x){return 'y('+x+')='+(a*x*x);}).join(',\\ ')+'$',key:'pt'+a};}
function g_pointOnPara(){var a=pick([1,2,3,-1,-2]);var x=nz(-3,3);var yTrue=a*x*x;var on=pick([true,false]);var y=on?yTrue:yTrue+pick([1,-1,2]);
 return {q:'$('+x+';\\ '+y+')$ цэг $y='+(a===1?'':a===-1?'-':a)+'x^2$ парабол дээр орших уу?',a:'$'+(a===1?'':a===-1?'-':a)+'\\cdot('+x+')^2='+yTrue+'$ '+(y===yTrue?'$='+y+'$ тул <b>оршино</b>.':'$\\ne '+y+'$ тул <b>үл оршино</b>.'),key:'pop'+a+x+y};}
function g_paraDirection(){var a=nz(-4,4);
 return {q:'$y='+(a===1?'':a===-1?'-':a)+'x^2$ параболын салаа дээшээ юу, доошоо юу харсан бэ? Хамгийн их/бага утга нь юу вэ?',a:a>0?('$a='+a+'>0$ тул салаа <b>дээшээ</b>; $x=0$ үед хамгийн бага утга $0$.'):('$a='+a+'<0$ тул салаа <b>доошоо</b>; $x=0$ үед хамгийн их утга $0$.'),key:'pd'+a};}
function g_paraGraph(){var a=pick([1,-1]);
 return {q:'$y='+(a===1?'':'-')+'x^2$ параболыг доорх координатын хавтгайд байгуул.',fig:plane({blank:true}),noWk:true,a:'$(-2,'+(4*a)+'),(-1,'+a+'),(0,0),(1,'+a+'),(2,'+(4*a)+')$ цэгүүдийг тэмдэглэн муруйгаар холбоно.',afig:plane({parab:[{a:a}],pts:[{x:-2,y:4*a},{x:-1,y:a},{x:0,y:0},{x:1,y:a},{x:2,y:4*a}]}),key:'pg'+a};}
var WSPEC={"title":"Шугаман функц — утга ба томьёо","sub":"Шугаман функц, түүний график · V бүлэг · 8-р анги","rule":"<b>Санамж:</b> $y=kx+b$ шугаман функцийн график нь шулуун. $k$ — налалт, $b$ — $Oy$ тэнхлэгтэй огтлолцох цэгийн ординат. Хоёр цэгээр график байгуулна.","ref":"","tasks":[{"label":"Функцийн утгыг ол.","fn":"g_linVal","cap":4},{"label":"Цэг график дээр орших эсэхийг шалга.","fn":"g_pointOnLine","cap":4},{"label":"Хүснэгтээр функцийн томьёог ол.","fn":"g_lineFromTable","cap":3}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={};for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap){var use=WK?arr.slice(0,cap):arr;return '<div class="grid">'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  TASKS.forEach(function(t,i){html+='<div class="task">'+(i+1)+'. '+t.label+'</div>'+block(S[i],t.cap);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
