<!DOCTYPE html>

<title>II бүлэг — Шалгалтын материал (7-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 7-р анги · II бүлэг. Аравтын ба энгийн бутархай, процент (2.1 10-ын натурал илтгэгчтэй зэрэг · 2.2 Аравтын бутархайг жиших ·
   2.3 Тоог тоймлох · 2.4 Хялбар аргаар тооцоолох · 2.5 Бутархайг хураах, жиших · 2.6 Нэмэх, хасах · 2.7 Үржүүлэх, хуваах ·
   2.8 Бутархай ба процент · 2.9 Хөдөлгөөн ба ажлын бодлого · 2.10 Процентын бодлого · 2.11 Өсөлт, бууралтын процент) */
// бутархай {n, d} — хураасан, d > 0
function F(n, d) { if (d < 0) { n = -n; d = -d; } var g = gcd(n, d); return { n: n / g, d: d / g }; }
function fAdd(a, b) { return F(a.n * b.d + b.n * a.d, a.d * b.d); }
function fSub(a, b) { return F(a.n * b.d - b.n * a.d, a.d * b.d); }
function fMul(a, b) { return F(a.n * b.n, a.d * b.d); }
function fDiv(a, b) { return F(a.n * b.d, a.d * b.n); }
function fEq(a, b) { return a.n * b.d === b.n * a.d; }
// холимог тооны TeX: 2\dfrac{1}{3}
function mx(a) { if (a.d === 1) return '' + a.n; var N = Math.abs(a.n), w = Math.floor(N / a.d); return (a.n < 0 ? '-' : '') + (w ? w : '') + '\\dfrac{' + (N % a.d) + '}{' + a.d + '}'; }
// бутархай төөрөгдүүлэгч: эерэг, зөв хариутай болон хоорондоо утгаар давхцахгүй
function fdis(cor, arr) { var out = [], seen = [cor]; arr.forEach(function (f) { if (!f || f.n <= 0) return; for (var i = 0; i < seen.length; i++) if (fEq(seen[i], f)) return; seen.push(f); out.push(C(mx(f))); }); return out; }
// бүхэл (масштабтай) тоон төөрөгдүүлэгч: fmt(x) хэлбэрээр, утгаар давхцахгүй
function ndis(cor, arr, fmt) { var u = {}, out = []; u[cor] = 1; arr.forEach(function (v) { if (v == null || !isFinite(v) || v % 1 || v <= 0 || u[v]) return; u[v] = 1; out.push(C(fmt(v))); }); return out; }
// m·10^(−e) тоог аравтын бичлэгээр (бүхэл бол th)
function sci(m, e) { if (e > 0) return dFmt(m, e); var s = '' + m; for (var i = 0; i < -e; i++) s += '0'; return th(+s); }
// n/d-ийг ≤ 3 оронтой аравтын бутархайгаар (төгсгөлгүй бол null)
function dq(n, d) { if (!d) return null; for (var s = 0; s <= 3; s++) { var m = n * Math.pow(10, s); if (m % d === 0) return dFmt(m / d, s); } return null; }

/* ── I. Тест (10): хялбар 1–3, дунд 4–7, хүнд 8–10 ── */
var TESTS = [
  // 1. 10-ын зэрэгт үржүүлэх, хуваах (2.1)
  function () {
    var m = rnd(101, 999); if (m % 10 === 0) return null;
    var sc = rnd(1, 2), k = rnd(2, 4), mul = rnd(0, 1) === 1, e = mul ? sc - k : sc + k;
    if (e < -3 || e > 6) return null;
    return { stem: '$' + dFmt(m, sc) + (mul ? '\\cdot ' : '\\div ') + '10^{' + k + '}$ илэрхийллийн утгыг ол.',
      mc: makeMC(C(sci(m, e)), [C(sci(m, e + 1)), C(sci(m, e - 1)), C(sci(m, mul ? sc + k : sc - k)), C(sci(m, e + 2))]) };
  },
  // 2. Аравтын бутархайг жиших — хамгийн их / бага (2.2)
  function () {
    var w = rnd(0, 9), base = rnd(2, 8), vals = [], strs = [], seen = {}, tries = 0, i;
    while (vals.length < 4 && tries++ < 80) {
      var len = rnd(1, 3), digs = '' + pick([base, base, base - 1, base + 1]);
      for (i = 1; i < len; i++) digs += rnd(0, 9);
      if (digs.length > 1 && digs.charAt(digs.length - 1) === '0') continue;
      var v = w * 1000 + parseInt((digs + '00').slice(0, 3), 10);
      if (seen[v]) continue; seen[v] = 1; vals.push(v); strs.push(w + '.' + digs);
    }
    if (vals.length < 4) return null;
    var big = rnd(0, 1) === 1, best = 0;
    for (i = 1; i < 4; i++) if (big ? vals[i] > vals[best] : vals[i] < vals[best]) best = i;
    return { stem: 'Дараах тоонуудаас аль нь хамгийн ' + (big ? 'их' : 'бага') + ' вэ?', mc: makeMC(C(strs[best]), strs.filter(function (_, j) { return j !== best; }).map(C)) };
  },
  // 3. Тоог тоймлох (2.3)
  function () {
    var p = rnd(1, 2), X = rnd(Math.pow(10, p + 2) + 1, 50 * Math.pow(10, p + 2)); if (X % 10 === 0) return null;
    var q = Math.floor(X / 100), r = X % 100, R = r >= 50 ? q + 1 : q, W = r >= 50 ? q : q + 1;
    if (R % 10 === 0) return null;
    var q1 = Math.floor(X / 1000), R1 = X % 1000 >= 500 ? q1 + 1 : q1, q3 = Math.floor(X / 10), R3 = X % 10 >= 5 ? q3 + 1 : q3;
    // утгыг 10^-(p+1) нэгжээр харьцуулна
    var cand = [[W * 10, dFmt(W, p)], [R1 * 100, dFmt(R1, p - 1)], [R3, dFmt(R3, p + 1)], [(R + 1) * 10, dFmt(R + 1, p)], [(R - 1) * 10, dFmt(R - 1, p)]];
    var u = {}, ds = []; u[R * 10] = 1;
    cand.forEach(function (c) { if (!u[c[0]]) { u[c[0]] = 1; ds.push(C(c[1])); } });
    return { stem: '$' + dFmt(X, p + 2) + '$ тоог $' + (p === 1 ? '0.1' : '0.01') + '$ нарийвчлалтай тоймлоход аль нь гарах вэ?', mc: makeMC(C(dFmt(R, p)), ds) };
  },
  // 4. Энгийн бутархайг хураах (2.5)
  function () {
    var p = rnd(2, 11), q = rnd(3, 13), g = pick([6, 8, 9, 12, 14, 15, 16, 18, 21]);
    if (p >= q || gcd(p, q) !== 1) return null;
    var a = p * g, b = q * g; if (b > 250) return null;
    var cor = F(p, q), cand = [F(p + 1, q), F(p, q + 1), F(p + 1, q + 1), F(p - 1, q), F(p, q - 1)].filter(function (f) { return f.n < f.d; });
    return { stem: '$\\dfrac{' + a + '}{' + b + '}$ бутархайг хураахад аль нь гарах вэ?', mc: makeMC(C(mx(cor)), fdis(cor, cand)) };
  },
  // 5. Холимог тоог нэмэх, хасах (2.6)
  function () {
    var d1 = pick([2, 3, 4, 5, 6, 8]), d2 = pick([3, 4, 5, 6, 8, 9, 10, 12]); if (d1 === d2) return null;
    var n1 = rnd(1, d1 - 1), n2 = rnd(1, d2 - 1), w1 = rnd(2, 7), w2 = rnd(1, 5);
    if (gcd(n1, d1) !== 1 || gcd(n2, d2) !== 1) return null;
    var A = F(w1 * d1 + n1, d1), B = F(w2 * d2 + n2, d2), add = rnd(0, 1) === 1, R = add ? fAdd(A, B) : fSub(A, B);
    if (R.n <= 0 || R.d === 1) return null;
    var wrong = F((add ? w1 + w2 : w1 - w2) * (d1 + d2) + (add ? n1 + n2 : n1 - n2), d1 + d2);   // хүртвэр, хуваарийг тус тусад нь нэмсэн/хассан
    return { stem: '$' + w1 + '\\dfrac{' + n1 + '}{' + d1 + '}' + (add ? '+' : '-') + w2 + '\\dfrac{' + n2 + '}{' + d2 + '}$ илэрхийллийн утгыг ол.',
      mc: makeMC(C(mx(R)), fdis(R, [wrong, fAdd(R, F(1, 1)), fSub(R, F(1, 1)), add ? fSub(A, B) : fAdd(A, B)])) };
  },
  // 6. Холимог тоог энгийн бутархайд хуваах (2.7)
  function () {
    var w = rnd(1, 3), a = rnd(1, 7), b = rnd(2, 9), c = rnd(1, 9), d = rnd(2, 10);
    if (a >= b || gcd(a, b) !== 1 || c >= d || gcd(c, d) !== 1) return null;
    var A = F(w * b + a, b), B = F(c, d), R = fDiv(A, B);
    if (R.n === R.d || R.d > 30 || R.n > 200) return null;
    return { stem: '$' + w + '\\dfrac{' + a + '}{' + b + '}\\div\\dfrac{' + c + '}{' + d + '}$ илэрхийллийн утгыг ол.',
      mc: makeMC(C(mx(R)), fdis(R, [fMul(A, B), F(R.d, R.n), fAdd(F(w, 1), fDiv(F(a, b), B)), fDiv(F(w * b - a, b), B)])) };
  },
  // 7. Энгийн бутархайг хувиар (процентоор) илэрхийлэх (2.8) — утга 0.001%-ийн нэгжээр
  function () {
    var b = pick([4, 5, 8, 16, 20, 25, 40, 50]), a = rnd(1, b - 1); if (gcd(a, b) !== 1) return null;
    var P = a * 100000 / b, pc = function (v) { return dFmt(v, 3) + '\\%'; };
    return { stem: '$\\dfrac{' + a + '}{' + b + '}$ бутархайг хувиар илэрхийлбэл аль нь вэ?',
      mc: makeMC(C(pc(P)), ndis(P, [P / 10, P * 10, 100000 - P, (a < 10 && b < 10) ? (a * 10 + b) * 1000 : null, (100000 * b) % a === 0 ? 100000 * b / a : null], pc)) };
  },
  // 8. Тоог түүний хувиар олох (2.10) — утга 0.01-ийн нэгжээр
  function () {
    var p = pick([5, 12, 15, 24, 25, 35, 40, 45, 60, 75, 120, 150]), N = rnd(2, 40) * pick([5, 10, 20]), v = N * p / 100;
    if (v % 1 || v < 3) return null;
    var f2 = function (x) { return dFmt(x, 2); };
    return { stem: 'Тооны $' + p + '\\%$ нь $' + v + '$ бол уг тоог ол.',
      mc: makeMC(C(f2(N * 100)), ndis(N * 100, [v * p, v * (100 + p), (v + p) * 100, p < 100 && (v * 10000) % (100 - p) === 0 ? v * 10000 / (100 - p) : null, v * (100 - p)], f2)) };
  },
  // 9. Хямдарсан үнээр анхны үнийг олох (2.11)
  function () {
    var p = pick([10, 15, 20, 25, 30, 40]), V = rnd(4, 60) * 1000, after = V * (100 - p) / 100;
    if (after % 100) return null;
    return { stem: 'Барааны үнийг $' + p + '\\%$ хямдруулахад $' + th(after) + '$ төгрөг болжээ. Анхны үнийг ол.',
      mc: makeMC(C(th(V)), ndis(V, [after * (100 + p) / 100, (after * 100) % (100 + p) === 0 ? after * 100 / (100 + p) : null, after + p * 100, after * (100 - p) / 100, V + 1000], th)) };
  },
  // 10. Угталцсан хөдөлгөөн ба хамтын ажил (2.9)
  function () {
    if (rnd(0, 1)) {
      var v1 = rnd(8, 18) * 5, v2 = rnd(8, 18) * 5; if (v1 === v2) return null;
      var tt = rnd(4, 10), S = (v1 + v2) * tt / 2; if (S % 1) return null;
      var cor = dq(tt, 2), u = {}, ds = []; u[tt / 2] = 1;
      [dq(S, Math.abs(v1 - v2)), dq(S, v1), dq(S, v2), dq(tt, 1)].forEach(function (s) { if (s == null || u[+s]) return; u[+s] = 1; ds.push(C(s)); });
      return { stem: '$' + S + '$ км зайтай хоёр хотоос хоёр машин $' + v1 + '$ ба $' + v2 + '$ км/ц хурдтай зэрэг угталцан гарав. Хэдэн цагийн дараа уулзах вэ?', mc: makeMC(C(cor), ds) };
    }
    var a = rnd(2, 12), b = rnd(3, 15); if (a >= b) return null;
    var T = F(a * b, a + b); if (T.d > 12) return null;
    return { stem: 'Усан санг нэг цорго $' + a + '$ цагт, нөгөө нь $' + b + '$ цагт дүүргэдэг. Хоёуланг зэрэг нээвэл хэдэн цагт дүүргэх вэ?',
      mc: makeMC(C(mx(T)), fdis(T, [F(a + b, 2), F(a + b, 1), F(b - a, 1), F(a * b, b - a)])) };
  }
];

/* ── II. Задгай (5): 11–12 суурь (2 оноо), 13–15 олон алхамтай (3 оноо) ── */
var FREE = [
  // 11. Холимог тоотой илэрхийлэл (2.6–2.7)
  function () {
    var d1 = pick([2, 3, 4, 6]), d2 = pick([3, 4, 5, 6, 8]), n1 = rnd(1, d1 - 1), n2 = rnd(1, d2 - 1), w1 = rnd(2, 5), w2 = rnd(1, w1 - 1);
    if (d1 === d2 || gcd(n1, d1) !== 1 || gcd(n2, d2) !== 1) return null;
    var A = F(w1 * d1 + n1, d1), B = F(w2 * d2 + n2, d2), I = fSub(A, B); if (I.n <= 0) return null;
    var e = rnd(2, 6), f = rnd(1, e - 1); if (gcd(f, e) !== 1) return null;
    var M = F(rnd(0, 1) * e + f, e), mul = rnd(0, 1) === 1, R = mul ? fMul(I, M) : fDiv(I, M);
    if (R.d > 12 || R.n > 20 * R.d) return null;
    return { stem: 'Илэрхийллийн утгыг ол: $\\left(' + w1 + '\\dfrac{' + n1 + '}{' + d1 + '}-' + w2 + '\\dfrac{' + n2 + '}{' + d2 + '}\\right)' + (mul ? '\\cdot ' : '\\div ') + mx(M) + '$',
      a: mx(I) + (mul ? '\\cdot ' : '\\div ') + mx(M) + '=' + mx(R) };
  },
  // 12. Аравтын бутархайн үйлдлийн дараалал (2.4)
  function () {
    var b = pick([2, 4, 5, 8, 12, 15, 25]), q = rnd(3, 15), a10 = b * q;      // a ÷ b = q
    var c10 = rnd(11, 49), d10 = rnd(2, 9), e100 = rnd(5, 95); if (e100 % 10 === 0 || c10 % 10 === 0) return null;
    var v = q * 100 + c10 * d10 - e100;
    return { stem: 'Илэрхийллийн утгыг ол: $' + dFmt(a10, 1) + '\\div ' + dFmt(b, 1) + '+' + dFmt(c10, 1) + '\\cdot ' + dFmt(d10, 1) + '-' + dFmt(e100, 2) + '$',
      a: q + '+' + dFmt(c10 * d10, 2) + '-' + dFmt(e100, 2) + '=' + dFmt(v, 2) };
  },
  // 13. Процентын хоёр алхамт бодлого (2.10)
  function () {
    var p = pick([20, 25, 30, 40, 60]), q = pick([20, 25, 40, 50, 75]), N = rnd(4, 30) * 20;
    var r1 = N * (100 - p) / 100, r2 = r1 * (100 - q) / 100; if (r1 % 1 || r2 % 1 || !r2) return null;
    return { stem: 'Ном $' + N + '$ хуудастай. Сурагч эхний өдөр номын $' + p + '\\%$-ийг, хоёр дахь өдөр үлдсэн хуудасны $' + q + '\\%$-ийг уншжээ. Хэдэн хуудас уншаагүй үлдсэн бэ?',
      a: '$' + N + '-' + (N - r1) + '=' + r1 + '$; $' + r1 + '-' + (r1 - r2) + '=' + r2 + '$ хуудас' };
  },
  // 14. Урсгалтай голын хөдөлгөөн (2.9)
  function () {
    var v = rnd(12, 30), u = pick([15, 20, 25, 30, 35, 40]), t1 = rnd(2, 5), t2 = rnd(2, 5);     // u — аравтаар
    if (v * 10 <= 2 * u || t1 === t2) return null;
    var dn = v * 10 + u, up = v * 10 - u, S = dn * t1 + up * t2;
    return { stem: 'Завины өөрийн хурд $' + v + '$ км/ц, голын урсгалын хурд $' + dFmt(u, 1) + '$ км/ц. Завь урсгал дагуу $' + t1 + '$ цаг, урсгал сөрж $' + t2 + '$ цаг явжээ. Нийт хэдэн км зам туулсан бэ?',
      a: '$' + dFmt(dn, 1) + '\\cdot ' + t1 + '+' + dFmt(up, 1) + '\\cdot ' + t2 + '=' + dFmt(S, 1) + '$ км' };
  },
  // 15. Өсөлт, бууралтын дараалсан процент (2.11)
  function () {
    var p = pick([10, 20, 25, 30, 50]), q = pick([10, 20, 25, 40]), V = rnd(2, 30) * 10000;
    var mid = V * (100 + p) / 100, fin = mid * (100 - q) / 100, ch = (100 + p) * (100 - q) - 10000;   // ch — 0.01%-ийн нэгжээр
    if (mid % 1 || fin % 1 || ch === 0) return null;
    return { stem: 'Барааны үнэ $' + th(V) + '$ төгрөг байв. Үнийг эхлээд $' + p + '\\%$ нэмж, дараа нь $' + q + '\\%$ хямдруулжээ. а) Эцсийн үнийг ол. б) Үнэ анхныхаасаа хэдэн хувиар өөрчлөгдсөн бэ?',
      a: 'а) $' + th(fin) + '$ төгрөг; б) $' + dFmt(Math.abs(ch), 2) + '\\%$-иар ' + (ch > 0 ? 'өссөн' : 'буурсан') };
  }
];

CMX.exam({
  title: 'II бүлэг — Шалгалтын материал',
  sub: 'Аравтын ба энгийн бутархай · тоймлох · процент · хөдөлгөөн ба ажлын бодлого',
  grade: '7-р анги',
  topic: 'Алгебр',
  tests: TESTS,
  free: FREE
});
</script>
