<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тэг ба сөрөг илтгэгчтэй зэрэг — үнэлгээ (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.cols3{grid-template-columns:repeat(3,1fr);gap:8px 16px}
  .grid.cols3 .qm{font-size:14px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:15.5px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.sm{height:16mm}.work.md{height:21mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 16px;font-size:13px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var LAB=['а','б','в','г','д','е','ё','ж','з','и','й','к','л','м','н','о','п','р'];
// ── BigInt рационал ──
function bgcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){var t=b;b=a%b;a=t;}return a||1n;}
function bf(n,d){n=BigInt(n);d=(d===undefined?1n:BigInt(d));if(d<0n){n=-n;d=-d;}var g=bgcd(n,d);return {n:n/g,d:d/g};}
function bmul(a,b){return bf(a.n*b.n,a.d*b.d);}
function bdiv(a,b){return bf(a.n*b.d,a.d*b.n);}
function badd(a,b){return bf(a.n*b.d+b.n*a.d,a.d*b.d);}
function bsub(a,b){return bf(a.n*b.d-b.n*a.d,a.d*b.d);}
function bpow(base,e){var r=bf(1),b=(e<0)?bdiv(bf(1),base):base,k=Math.abs(e),i;for(i=0;i<k;i++)r=bmul(r,b);return r;}
function bfTex(f){if(f.d===1n)return f.n.toString();var neg=f.n<0n;var nn=(neg?-f.n:f.n);return (neg?'-':'')+'\\dfrac{'+nn.toString()+'}{'+f.d.toString()+'}';}
function bfNum(f){return Number(f.n)/Number(f.d);}
function tooBig(f){return (f.n<0n?-f.n:f.n)>100000n||f.d>100000n;}
// зэргийн латекс: base^{e}
function pw(base,e){return e===1?(''+base):(base+'^{'+e+'}');}   // зэрэг 1 бол бичихгүй
function fpw(p,q,e){return e===1?('\\dfrac{'+p+'}{'+q+'}'):('\\left(\\dfrac{'+p+'}{'+q+'}\\right)^{'+e+'}');}
// ── Генераторууд ──
// A) Нэг суурьтай үржих/хуваах → нэг зэрэг
function gSameBase(){
  var a=pick([2,3,4,5,6,7]),op=pick(['\\cdot',':']);
  var r; do{r=rnd(-3,3);}while(Math.pow(a,Math.abs(r))>729);
  var e1=nz(-4,6),e2;
  if(op==='\\cdot')e2=r-e1; else e2=e1-r;
  if(e2<-6||e2>6||e2===0||e1===0)return null;
  if(e1>0&&e2>0)return null;                 // дор хаяж нэг сөрөг илтгэгч
  var ans=(op==='\\cdot')?bmul(bpow(bf(a),e1),bpow(bf(a),e2)):bdiv(bpow(bf(a),e1),bpow(bf(a),e2));
  if(tooBig(ans))return null;
  return {q:pw(a,e1)+' '+op+' '+pw(a,e2),ans:ans,fv:(op==='\\cdot'?Math.pow(a,e1)*Math.pow(a,e2):Math.pow(a,e1)/Math.pow(a,e2))};
}
// B) Ижил илтгэгч, өөр суурь → (ab)^m буюу (a/b)^m
function gSameExp(){
  var op=pick(['\\cdot',':']),m=pick([-2,-2,-1,-1,1,2]),a,b;
  if(op==='\\cdot'){var pr=pick([[2,3],[2,4],[3,2],[2,5],[3,3],[2,2],[3,4]]);a=pr[0];b=pr[1];}
  else{var pr2=pick([[6,2],[8,2],[9,3],[10,5],[12,4],[6,3],[8,4],[12,3],[15,5]]);a=pr2[0];b=pr2[1];}
  var ans=(op==='\\cdot')?bmul(bpow(bf(a),m),bpow(bf(b),m)):bdiv(bpow(bf(a),m),bpow(bf(b),m));
  if(tooBig(ans))return null;
  return {q:pw(a,m)+' '+op+' '+pw(b,m),ans:ans,fv:(op==='\\cdot'?Math.pow(a,m)*Math.pow(b,m):Math.pow(a,m)/Math.pow(b,m))};
}
// C) Бутархай суурьтай зэрэг (нэг эсвэл үржвэр)
function gFrac(){
  var pr=pick([[2,3],[3,4],[2,5],[5,6],[1,4],[2,3],[3,5],[1,3],[4,7],[5,2],[7,9]]);
  var p=pr[0],q=pr[1];
  if(pick([0,1])){ // нэг
    var e=nz(-3,3);
    var ans=bpow(bf(p,q),e); if(tooBig(ans))return null;
    return {q:fpw(p,q,e),ans:ans,fv:Math.pow(p/q,e)};
  }
  var e1=nz(-3,3),e2=nz(-3,3);
  var ans2=bmul(bpow(bf(p,q),e1),bpow(bf(p,q),e2)); if(tooBig(ans2))return null;
  return {q:fpw(p,q,e1)+' \\cdot '+fpw(p,q,e2),ans:ans2,fv:Math.pow(p/q,e1)*Math.pow(p/q,e2)};
}
// D) Хоёр гишүүний нийлбэр/ялгавар
function gSum(){
  function term(){
    var t=pick(['sb','fr']);
    if(t==='sb'){var a=pick([2,3,4,5]),e1=nz(-3,4),e2=nz(-4,3);if(e1>0&&e2>0)return null;
      var v=bmul(bpow(bf(a),e1),bpow(bf(a),e2));return {tex:pw(a,e1)+' \\cdot '+pw(a,e2),val:v,fv:Math.pow(a,e1)*Math.pow(a,e2)};}
    var pr=pick([[2,3],[3,4],[4,7],[1,4],[2,5],[3,5]]),e=nz(-2,2);
    var v2=bpow(bf(pr[0],pr[1]),e);return {tex:fpw(pr[0],pr[1],e),val:v2,fv:Math.pow(pr[0]/pr[1],e)};
  }
  var t1=term(),t2=term();if(!t1||!t2)return null;
  var op=pick(['+','-']);
  var ans=(op==='+')?badd(t1.val,t2.val):bsub(t1.val,t2.val);
  if(tooBig(ans))return null;
  return {q:t1.tex+' '+op+' '+t2.tex,ans:ans,fv:(op==='+'?t1.fv+t2.fv:t1.fv-t2.fv)};
}
function gen(fns){for(var t=0;t<200;t++){var f=pick(fns)(),ok=f&&Math.abs(bfNum(f.ans)-f.fv)<1e-6;if(ok)return f;}return null;}
// A4-ийг дүүргэж, хэтэрсэн бодлогыг доороос нь тайрна
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function trimToFit(sheet,target){var g=0,h=probeH(sheet);while(h>target&&g++<120){var qs=sheet.querySelectorAll('.q');if(qs.length<=6)break;var i=qs.length-1;var ans=sheet.querySelectorAll('#answers .a');if(ans[i])ans[i].parentNode.removeChild(ans[i]);qs[i].parentNode.removeChild(qs[i]);h=probeH(sheet);}}
function build(){
  var WORK=!!window.WS_WORK;
  var secA=[],secB=[],seen={},i;window.__PROB=[];
  var poolA=[gSameBase,gSameBase,gSameExp,gFrac];
  var poolB=[gFrac,gSum,gSum,gSameExp];
  function fill(arr,pool,n){var c=0,tr=0;while(c<n&&tr<800){tr++;var f=gen(pool);if(!f||seen[f.q])continue;seen[f.q]=1;arr.push(f);window.__PROB.push(f);c++;}}
  fill(secA,poolA,WORK?9:16); fill(secB,poolB,WORK?15:26);   // элбэг үүсгээд доор нь A4-т тааруулж тайрна
  var gcls=WORK?'':' cols3';
  function block(arr,off,cls){return arr.map(function(f,idx){var lb=LAB[off+idx]||('#'+(off+idx+1));
    return '<div class="q"><div class="qeq"><span class="ql">'+lb+')</span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work '+cls+'"></div>':'')+'</div>';}).join('');}
  function ansBlock(arr,off){return arr.map(function(f,idx){var lb=LAB[off+idx]||('#'+(off+idx+1));
    return '<div class="a"><span class="an">'+lb+')</span><span>$'+bfTex(f.ans)+'$</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тэг ба сөрөг илтгэгчтэй зэрэг</h1></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$a^{0}=1\\ (a\\ne0)$ &nbsp;·&nbsp; $a^{-n}=\\dfrac{1}{a^{n}}$ &nbsp;·&nbsp; $a^{m}\\cdot a^{n}=a^{m+n}$ &nbsp;·&nbsp; $a^{m}:a^{n}=a^{m-n}$ &nbsp;·&nbsp; $(ab)^m=a^m b^m$</div>'
    +'<div class="task">1. Хялбарчилж, утгыг ол.</div>'
    +'<div class="grid'+gcls+'">'+block(secA,0,'sm')+'</div>'
    +'<div class="task">2. Илэрхийллийн утгыг ол.</div>'
    +'<div class="grid'+gcls+'">'+block(secB,secA.length,'md')+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansBlock(secA,0)+ansBlock(secB,secA.length)+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Тэг ба сөрөг илтгэгчтэй зэрэг — үнэлгээ (10-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFit(document.getElementById('sheet'),1035);}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=35"></script>
</body>
</html>
