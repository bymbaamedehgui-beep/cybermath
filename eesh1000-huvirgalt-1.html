<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<div class="sheet" id="sheet"></div>
<script>
/* ЭЕШ 1000 — Хувиргалт ба матриц-1 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Матрицын үйлдэл, эргүүлэлт, тэгш хэм, гомотети, хувиргалтын матриц.
   Эх: 1.45, 1.21, 1.49, 1.76, 3.90, 3.97, 1.40, 1.41, 1.42, 1.43, 3.91, 3.92, 3.93, 3.94, 1.64, 3.96, 1.58, 3.98, 1.2, 3.95, 3.100, 4.6 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 1.45 */
var e1_45 = (function () {
// 45. A (m×n), B (p×q) матрицуудын хувьд A+B, AB, BA, A², B² үйлдлүүдээс аль нь гүйцэтгэгдэх вэ?
//     A+B: хэмжээ ижил; AB: n = p; BA: q = m; A²: m = n; B²: p = q.  (эхэд жагсаалт алга — бид нэмэв)
var p45_S = [[2, 2], [2, 2], [2, 1], [1, 2], [2, 3], [3, 2], [3, 1], [1, 3]];
function p45_M(r, c) { var M = [], i, j; for (i = 0; i < r; i++) { M.push([]); for (j = 0; j < c; j++) M[i].push(nz(-6, 7)); } return M; }
function p45() {
  var sa = pick(p45_S), sb = pick(p45_S), A = p45_M(sa[0], sa[1]), B = p45_M(sb[0], sb[1]);
  var ok = [
    ['A+B', sa[0] === sb[0] && sa[1] === sb[1]], ['AB', sa[1] === sb[0]], ['BA', sb[1] === sa[0]],
    ['A^2', sa[0] === sa[1]], ['B^2', sb[0] === sb[1]]
  ].filter(function (o) { return o[1]; }).map(function (o) { return '$' + o[0] + '$'; });
  if (!ok.length || ok.length === 5) return null;
  if (sa[0] * sa[1] + sb[0] * sb[1] > 12) return null;   // хэт том биш
  var ans = ok.length === 1 ? ok[0] : ok.slice(0, -1).join(', ') + ' ба ' + ok[ok.length - 1];
  // Бодолт (гар бичмэл нэг мөр: «AB үржих үйлдлийг гүйцэтгэж болно») — хэмжээсээр үйлдэл бүрийг шалгана
  var m = sa[0], n = sa[1], p = sb[0], q = sb[1], sz = function (r, c) { return '(' + r + '\\times ' + c + ')'; };
  var mul = function (X, Y, s1, s2) {   // X·Y: X-ийн баганын тоо = Y-ийн мөрийн тоо
    return '$' + X + Y + '$: $' + sz(s1[0], s1[1]) + '\\cdot' + sz(s2[0], s2[1]) + '$, ' + (s1[1] === s2[0] ? '$' + s1[1] + '=' + s2[0] + '$ тул болно'
      : '$' + s1[1] + '\\ne ' + s2[0] + '$ тул болохгүй');
  };
  var sq = function (X, s) { return '$' + X + '^2$: $' + X + '$ ' + (s[0] === s[1] ? 'квадрат матриц тул болно' : 'квадрат матриц биш тул болохгүй'); };
  return {
    q: '$A=' + mat(A) + '\\quad B=' + mat(B) + '$ матрицуудын хувьд дараах үйлдлүүдээс алийг нь гүйцэтгэж болох вэ?'
      + '<br>$A+B,\\quad AB,\\quad BA,\\quad A^2,\\quad B^2$',
    a: ans,
    wk: 24,
    s: [
      '$A$ матриц $' + m + '\\times ' + n + '$, $B$ матриц $' + p + '\\times ' + q + '$ хэмжээтэй (мөрийн тоо $\\times$ баганын тоо).',
      'Ижил хэмжээтэй матрицуудыг л нэмж болно. $XY$ үржвэр нь $X$-ийн баганын тоо $Y$-ийн мөрийн тоотой тэнцүү үед л олдоно.'
        + ' $X^2=X\\cdot X$ тул зөвхөн квадрат матрицыг квадрат зэрэгт дэвшүүлж болно.',
      ['$A+B$: хэмжээ нь ' + (m === p && n === q ? 'ижил тул болно' : 'ялгаатай тул болохгүй'), mul('A', 'B', sa, sb), mul('B', 'A', sb, sa), sq('A', sa), sq('B', sb)].join(';<br>') + '.',
      'Иймд ' + ans + ' үйлдлийг гүйцэтгэж болно.'
    ],
    t: { A: A, B: B }
  };
}
return p45;
})();

/* 1.21 */
var e1_21 = (function () {
// 21. Матрицын тэгшитгэл A − X = kB → X = A − kB (эх: (4 1; 2 −1) − X = 3(−1 2; −2 0) → X = (7 −5; 8 −1)).
function p21() {
  var A = [[rnd(-5, 5), rnd(-5, 5)], [rnd(-5, 5), rnd(-5, 5)]], B = [[rnd(-5, 5), rnd(-5, 5)], [rnd(-5, 5), rnd(-5, 5)]], k = pick([2, 3, 2, 3, -2, -3]);
  var zeros = function (M) { return M[0].concat(M[1]).filter(function (v) { return v === 0; }).length; };
  if (zeros(A) > 1 || zeros(B) > 1) return null;
  var X = A.map(function (r, i) { return r.map(function (v, j) { return v - k * B[i][j]; }); });
  // Бодолт (гар бичмэл): kB-г бодоод X = A − kB, элемент бүрээр хасна
  var KB = B.map(function (r) { return r.map(function (v) { return k * v; }); });
  var DF = A.map(function (r, i) { return r.map(function (v, j) { var w = KB[i][j]; return dec(v) + (w === 0 ? '-0' : sgn(-w)); }); });
  return { q: '$' + mat(A) + '-X=' + k + mat(B) + '$ тэгшитгэлийг бод.', a: '$X=' + mat(X) + '$', wk: 24,
    s: [
      'Матрицыг тоогоор үржүүлэхэд элемент бүрийг тэр тоогоор үржүүлнэ: $$' + k + mat(B) + '=' + mat(KB) + '.$$',
      'Тэгшитгэлээс $X$-ийг олбол $$X=' + mat(A) + '-' + mat(KB) + '=' + mat(DF) + '=' + mat(X) + '.$$'
    ],
    t: { A: A, B: B, k: k } };
}
return p21;
})();

/* 1.49 */
var e1_49 = (function () {
// 49. 2×2 матрицын урвуу: M = (a b; c d), det = ad − bc ∈ {±1, ±2} → M⁻¹ = (1/det)·(d −b; −c a).
function p49_mx(rows) {   // бутархайтай матрицад мөр хооронд зай (бутархайнууд наалдахгүй)
  if (!/frac/.test(rows.join())) return mat(rows);
  return '\\begin{pmatrix}' + rows.map(function (r) { return r.join('&'); }).join('\\\\[6pt]') + '\\end{pmatrix}';
}
function p49() {
  var a = nz(-6, 6), b = nz(-6, 6), c = nz(-6, 6), d = nz(-6, 6), D = a * d - b * c;
  if ([1, -1, 2, -2, 2, -2].indexOf(D) < 0) return null;
  if (Math.abs(D) === 1 && rnd(1, 2) === 1) return null;   // det = ±2 (бутархайтай) илүү олон
  var inv = [[frs(d, D), frs(-b, D)], [frs(-c, D), frs(a, D)]];
  // Бодолт (гар бичмэл): |M| = ad − bc → M⁻¹ = (1/|M|)·(d −b; −c a)
  var adj = mat([[d, -b], [-c, a]]), res = p49_mx(inv);
  var pre = D === 1 ? '' : D === -1 ? '-' : (D < 0 ? '-' : '') + '\\dfrac{1}{' + Math.abs(D) + '}';
  return {
    q: '$M=' + mat([[a, b], [c, d]]) + '$ бол $M^{-1}$ матрицыг олоорой.',
    a: '$M^{-1}=' + p49_mx(inv) + '$',
    wk: 24,
    s: [
      'Тодорхойлогч: $$|M|=' + a + '\\cdot ' + par(d) + '-' + par(b) + '\\cdot ' + par(c) + '=' + a * d + sgn(-b * c) + '=' + D + '.$$',
      '$A=\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}$ бол $A^{-1}=\\dfrac{1}{|A|}\\begin{pmatrix}d&-b\\\\-c&a\\end{pmatrix}$ тул $$M^{-1}='
        + (D === 1 ? '' : pre + adj + '=') + res + '.$$'
    ],
    t: { M: [[a, b], [c, d]] }
  };
}
return p49;
})();

/* 1.76 */
var e1_76 = (function () {
// 76. kA⁻¹ ± A: A⁻¹ = adj(A)/det A. det A = d ∈ {±1, ±2, ±3, ±4}, k нь d-д хуваагдана → kA⁻¹ бүхэл.
function p76() {
  var p = rnd(1, 9), q = rnd(-3, 8), r = rnd(-3, 9), s = rnd(1, 9);
  if (!q || !r) return null;
  var d = p * s - q * r;
  if (!d || Math.abs(d) > 4) return null;
  var k = rnd(2, 8);
  if (k % d) return null;
  var e = k / d, sg = pick([1, 1, 1, -1]);
  var M = [[e * s + sg * p, -e * q + sg * q], [-e * r + sg * r, e * p + sg * s]];
  if (M.some(function (row) { return row.some(function (x) { return Math.abs(x) > 40; }); })) return null;
  var ex = k + 'A^{-1}' + (sg > 0 ? '+' : '-') + 'A';
  // Бодолт (гар бичмэл): |A| → A⁻¹ = (1/|A|)·[[s, −q], [−r, p]] → kA⁻¹ ± A
  var adj = mat([[s, -q], [-r, p]]), cA = d === 1 ? '' : d === -1 ? '-' : fr(1, d);
  var kA = d === 1 ? String(k) : d === -1 ? '-' + k : k + '\\cdot' + (d < 0 ? '\\left(' + fr(1, d) + '\\right)' : fr(1, d));
  return {
    q: '$A=' + mat([[p, q], [r, s]]) + '$ бол $' + ex + '$ ол.',
    a: '$' + ex + '=' + mat(M) + '$',
    wk: 26,
    s: [
      'Тодорхойлогч: $|A|=' + p + '\\cdot ' + s + '-' + par(q) + '\\cdot ' + par(r) + '=' + d + '$.',
      'Гол диагоналийн элементүүдийн байрыг сольж, нөгөө хоёр элементийн тэмдгийг өөрчлөөд тодорхойлогчид хуваавал $$A^{-1}=' + cA + adj + '.$$',
      'Иймд $$' + ex + '=' + kA + adj + (sg > 0 ? '+' : '-') + mat([[p, q], [r, s]]) + '=' + mat([[e * s, -e * q], [-e * r, e * p]])
        + (sg > 0 ? '+' : '-') + mat([[p, q], [r, s]]) + '=' + mat(M) + '.$$'
    ],
    t: { A: [[p, q], [r, s]], k: k, sg: sg }
  };
}
return p76;
})();

/* 3.90 */
var e3_90 = (function () {
// 90. O(0;0) төвтэй θ өнцгийн эргүүлэлтийн матриц: A = (cos θ  −sin θ; sin θ  cos θ).
//     θ голдуу 90°-ын үржвэр (±90°, ±180°, ±270° — бүхэл элементтэй), заримдаа 30°, 45°, 60°, 120°, … (язгууртай яг утга).
//     Эхийн үг хэллэг («эргүүлэлтийг A хувиргалтын матриц аль вэ?») хэвээр.
function p90_neg(t) { return t === '0' ? '0' : t[0] === '-' ? t.slice(1) : '-' + t; }
function p90_cs(deg) {   // [cos, sin] TeX (яг утга); deg — 30 эсвэл 45-ын үржвэр
  var B = { 0: ['1', '0'], 30: ['\\frac{\\sqrt{3}}{2}', '\\frac{1}{2}'], 45: ['\\frac{1}{\\sqrt{2}}', '\\frac{1}{\\sqrt{2}}'],
    60: ['\\frac{1}{2}', '\\frac{\\sqrt{3}}{2}'], 90: ['0', '1'] };
  var a = ((deg % 360) + 360) % 360, q = Math.floor(a / 90), cs = B[a - 90 * q];
  return q === 0 ? [cs[0], cs[1]] : q === 1 ? [p90_neg(cs[1]), cs[0]] : q === 2 ? [p90_neg(cs[0]), p90_neg(cs[1])] : [cs[1], p90_neg(cs[0])];
}
function p90_mx(rows) {   // бутархайтай матрицад мөр хооронд зай (√-тэй хуваарь давхцахгүй)
  return '\\begin{pmatrix}' + rows.map(function (r) { return r.join('&'); }).join(/frac/.test(rows.join()) ? '\\\\[6pt]' : '\\\\') + '\\end{pmatrix}';
}
function p90() {
  var deg = rnd(1, 5) <= 3 ? pick([90, 90, 180, 270, -90, -90, -180, -270])
    : pick([30, 45, 60, 120, 135, 150, 210, 225, 240, 300, 315, 330, -30, -45, -60, -120, -135, -150]);
  var cs = p90_cs(deg), M = [[cs[0], p90_neg(cs[1])], [cs[1], cs[0]]];
  return {
    q: '$O(0;\\,0)$ төвтэй $' + deg + '^\\circ$ өнцгөөр эргүүлэх эргүүлэлтийг $A$ хувиргалтын матриц аль вэ?',
    a: '$A=' + p90_mx(M) + '$',
    wk: 20,
    t: { deg: deg }
  };
}
return p90;
})();

/* 3.97 */
var e3_97 = (function () {
// 97. Тэнхлэгийн (шулууны) ба төвийн тэгш хэмийн хувиргалтын матриц.
//     Голдуу (эх шиг): Ox, Oy, y = x, y = −x тэнхлэг, O(0;0) төв. Олон янз байдлын тулд заримдаа O-г дайрах y = mx шулуун:
//     m = ±√3, ±1/√3 (30°, 60° — яг утга) эсвэл m = ±2, ±3, ±1/2, ±1/3 (рационал). y = mx шулууны (tg φ = m) тэгш хэм:
//     (cos 2φ  sin 2φ; sin 2φ  −cos 2φ), cos 2φ = (1 − m²)/(1 + m²), sin 2φ = 2m/(1 + m²).
//     [ЗАС: эхэд «хэнхлэгийн» гэж үсгийн алдаатай → «тэнхлэгийн»]
function p97_mx(rows) {   // бутархайтай матрицад мөр хооронд зай
  return '\\begin{pmatrix}' + rows.map(function (r) { return r.join('&'); }).join(/frac/.test(rows.join()) ? '\\\\[6pt]' : '\\\\') + '\\end{pmatrix}';
}
function p97() {
  var u = rnd(1, 100), L, M, ax = 'шулууны';
  var h = '\\frac{1}{2}', r = '\\frac{\\sqrt{3}}{2}', n = function (t) { return '-' + t; };
  if (u <= 60) {
    var B = pick([
      ['Ox', [['1', '0'], ['0', '-1']]], ['Oy', [['-1', '0'], ['0', '1']]], ['y=x', [['0', '1'], ['1', '0']]],
      ['y=-x', [['0', '-1'], ['-1', '0']]], ['O', [['-1', '0'], ['0', '-1']]]]);
    L = B[0]; M = B[1];
    if (L === 'O') {
      return { q: '$O(0;\\,0)$ цэгийн хувьд төвийн тэгш хэмийн хувиргалтын матрицыг бич.', a: '$' + p97_mx(M) + '$', wk: 16, t: { L: L } };
    }
    if (L[0] === 'O') ax = 'тэнхлэгийн';
  } else if (u <= 82) {   // 30°/60°-ын шулуун
    var S = pick([
      ['y=\\sqrt{3}x', [[n(h), r], [r, h]]], ['y=-\\sqrt{3}x', [[n(h), n(r)], [n(r), h]]],
      ['y=\\frac{1}{\\sqrt{3}}x', [[h, r], [r, n(h)]]], ['y=-\\frac{1}{\\sqrt{3}}x', [[h, n(r)], [n(r), n(h)]]]]);
    L = S[0]; M = S[1];
  } else {                // y = (p/q)x
    var pq = pick([[2, 1], [-2, 1], [3, 1], [-3, 1], [1, 2], [-1, 2], [1, 3], [-1, 3]]), p = pq[0], q = pq[1], D = p * p + q * q;
    var c = frs(q * q - p * p, D), s = frs(2 * p * q, D), cn = frs(p * p - q * q, D);
    L = 'y=' + tm(q === 1 ? p : [p, q], 'x', true); M = [[c, s], [s, cn]];
  }
  return {
    q: '$' + L + '$ ' + ax + ' хувьд тэнхлэгийн тэгш хэмийн хувиргалтын матрицыг бич.',
    a: '$' + p97_mx(M) + '$',
    wk: 16,
    t: { L: L }
  };
}
return p97;
})();

/* 1.40 */
var e1_40 = (function () {
// 40. Координатын эх дээр төвтэй θ өнцгийн эргүүлэлтийн матриц R(θ)-ийн урвуу: R⁻¹ = R(−θ) = Rᵀ.
//     Утгууд яг: 1/√2 (45°, 135°), √3/2 ба 1/2 (30°, 60°, 120°, 150°), 0 ба 1 (90°). Цагийн зүүний эсрэг/дагуу.
function p40_cs(deg) {   // [cos, sin] TeX (яг утга), deg — 15-ын үржвэр
  var B = { 0: ['1', '0'], 30: ['\\frac{\\sqrt{3}}{2}', '\\frac{1}{2}'], 45: ['\\frac{1}{\\sqrt{2}}', '\\frac{1}{\\sqrt{2}}'],
    60: ['\\frac{1}{2}', '\\frac{\\sqrt{3}}{2}'], 90: ['0', '1'] };
  var a = ((deg % 360) + 360) % 360, q = Math.floor(a / 90), b = a - 90 * q, cs = B[b];
  var neg = function (t) { return t === '0' ? '0' : t[0] === '-' ? t.slice(1) : '-' + t; };
  if (q === 0) return [cs[0], cs[1]];
  if (q === 1) return [neg(cs[1]), cs[0]];
  if (q === 2) return [neg(cs[0]), neg(cs[1])];
  return [cs[1], neg(cs[0])];
}
function p40_R(deg) {   // [[cos, −sin], [sin, cos]]
  var cs = p40_cs(deg), ns = cs[1] === '0' ? '0' : cs[1][0] === '-' ? cs[1].slice(1) : '-' + cs[1];
  return [[cs[0], ns], [cs[1], cs[0]]];
}
function p40_mx(rows) {   // бутархайтай матрицад мөр хооронд зай (√-тэй хуваарь давхцахгүй)
  if (!/frac/.test(rows.join())) return mat(rows);
  return '\\begin{pmatrix}' + rows.map(function (r) { return r.join('&'); }).join('\\\\[6pt]') + '\\end{pmatrix}';
}
function p40() {
  var th = pick([30, 45, 45, 60, 90, 120, 135, 150]), cw = rnd(1, 3) === 1;   // cw: цагийн зүүний дагуу
  var ang = cw ? -th : th;
  // Бодолт (гар бичмэл): A⁻¹ = (1/|A|)·(d −b; −c a); |R| = cos²α + sin²α = 1 → R⁻¹
  var R = p40_R(ang), w = function (t) { return t[0] !== '-' ? t : /frac/.test(t) ? '\\left(' + t + '\\right)' : '(' + t + ')'; };
  var c4 = Math.round(4 * Math.pow(Math.cos(ang * Math.PI / 180), 2));   // 4cos²α
  var vm = '\\begin{vmatrix}' + R.map(function (r) { return r.join('&'); }).join(/frac/.test(R.join()) ? '\\\\[6pt]' : '\\\\') + '\\end{vmatrix}';
  return {
    q: 'Координатын эх дээр төвтэй цагийн зүүний ' + (cw ? 'дагуу' : 'эсрэг') + ' $' + th + '^\\circ$-' + suf(th, 'ын')
      + ' эргүүлэлтийн матриц $R=' + p40_mx(p40_R(ang)) + '$-ын урвуу матрицыг ол.',
    a: '$R^{-1}=' + p40_mx(p40_R(-ang)) + '$',
    wk: 22,
    s: [
      '$A=\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}$ матрицын урвуу матриц $A^{-1}=\\dfrac{1}{|A|}\\begin{pmatrix}d&-b\\\\-c&a\\end{pmatrix}$ байна. $R$ матрицын тодорхойлогч'
        + ' $$|R|=' + vm + '=' + w(R[0][0]) + '\\cdot ' + w(R[1][1]) + '-' + w(R[0][1]) + '\\cdot ' + w(R[1][0]) + '=' + fr(c4, 4) + '+' + fr(4 - c4, 4) + '=1.$$',
      '$|R|=1$ тул гол диагоналийн элементүүдийн байрыг сольж, нөгөө хоёр элементийн тэмдгийг эсрэгээр өөрчилбөл $$R^{-1}=' + p40_mx(p40_R(-ang)) + '.$$'
    ],
    t: { th: th, cw: cw }
  };
}
return p40;
})();

/* 1.41 */
var e1_41 = (function () {

var e4_6 = (function () {
// 6. XA = B (эсвэл AX = B) ⇒ det X · det A = det B ⇒ det X = det B / det A;  X = B·A⁻¹ (эсвэл A⁻¹·B).

  if (big) return null;
