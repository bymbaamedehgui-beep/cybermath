<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадратад шилждэг тэгшитгэл 2 — бодлого (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.55}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .plist{display:flex;flex-direction:column;gap:8px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qt{display:flex;gap:8px;align-items:baseline;font-size:12.5px;margin-bottom:5px}.ql{font-weight:800;color:var(--purple);min-width:22px}.qx{flex:1}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:20mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-list{display:flex;flex-direction:column;gap:7px;font-size:12.5px}.ans-list .a{display:flex;gap:7px;align-items:baseline}.ans-list .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var TRIP_S=[[3,4,5],[6,8,10],[9,12,15],[12,16,20],[5,12,13],[8,15,17],[15,20,25]];
// Дараалсан хоёр тооны үржвэр
function gConsec(){var n=rnd(4,20),P=n*(n+1);
  return {q:'Дараалсан хоёр натурал тооны үржвэр нь $'+P+'$ болно. Эдгээр тоог ол.',
    a:'$n(n+1)='+P+'$ · тоонууд $'+n+'$ ба $'+(n+1)+'$',ok:true};}
// Тэгш өнцөгт: урт d-ээр их, талбай A → периметр
function gRectPeri(){var w=rnd(4,16),d=rnd(2,10),A=w*(w+d);
  return {q:'Тэгш өнцөгтийн талбай $'+A+'\\ \\text{м}^2$ бөгөөд урт нь өргөнөөсөө $'+d+'$ м-ээр их. Периметрийг ол.',
    a:'$w(w+'+d+')='+A+'$ · өргөн $'+w+'$, урт $'+(w+d)+'$ · периметр $'+(2*(2*w+d))+'$ м',ok:true};}
// Тэгш өнцөгт: периметр ба талбай → талууд
function gRectSides(){var a=rnd(4,16),b=rnd(4,16);if(a>=b)return null;var Per=2*(a+b),A=a*b;
  return {q:'Тэгш өнцөгтийн периметр $'+Per+'$ м, талбай нь $'+A+'\\ \\text{м}^2$ болно. Талуудын уртыг тодорхойл.',
    a:'$x^2-'+(Per/2)+'x+'+A+'=0$ · талууд $'+a+'$ м ба $'+b+'$ м',ok:true};}
// Тэгш өнцөгт гурвалжны катет
function gRightLegs(){var t=pick(TRIP_S),a1=t[0],b1=t[1],c1=t[2],d=b1-a1;
  return {q:'Тэгш өнцөгт гурвалжны нэг катет нь нөгөөгөөсөө $'+d+'$ см-ээр урт. Гипотенуз нь $'+c1+'$ см бол катетуудыг олж, талбайг тодорхойл.',
    a:'$a^2+(a+'+d+')^2='+(c1*c1)+'$ · катетууд $'+a1+'$, $'+b1+'$ см · талбай $'+(a1*b1/2)+'\\ \\text{см}^2$',ok:true};}
// Суудал
function gSeats(){var r=rnd(6,22),d=rnd(2,12),N=r*(r+d);
  return {q:'Кино театрын эгнээ бүрийн суудлын тоо нь эгнээний тооноос $'+d+'$-аар олон. Нийт $'+N+'$ суудалтай бол хэдэн эгнээтэй вэ?',
    a:'$r(r+'+d+')='+N+'$ · $'+r+'$ эгнээ, эгнээ бүр $'+(r+d)+'$ суудал',ok:true};}
// Тэмцээн
function gTour(){var n=rnd(6,26),k=pick([1,2]),G=k*n*(n-1)/2,kk=k===1?'нэг':'хоёр',eq=k===1?'\\dfrac{n(n-1)}{2}='+G:'n(n-1)='+G;
  return {q:'Тэмцээнд баг бүр бусад баг бүртэйгээ '+kk+' удаа тоглов. Нийт $'+G+'$ тоглолт болсон бол хэдэн баг оролцсон бэ?',
    a:'$'+eq+'$ · $'+n+'$ баг',ok:true};}
// Хөдөлгөөн
function gTravel(){var t=pick(TRIP_S),a1=t[0],b1=t[1],L=t[2],d=b1-a1;
  return {q:'Хоёр явган зорчигч нэг цэгээс перпендикуляр чиглэлд нэгэн зэрэг гарав. Нэгийх нь хурд нөгөөгөөсөө $'+d+'$ км/ц-аар их. $1$ цагийн дараа тэдний хоорондын зай $'+L+'$ км болсон бол хурдыг нь ол.',
    a:'$v^2+(v+'+d+')^2='+(L*L)+'$ · хурднууд $'+a1+'$ ба $'+b1+'$ км/ц',ok:true};}
function gen(fn){for(var t=0;t<400;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function build(){
  var WORK=window.WS_WORK!==false;
  var base=[gConsec,gRectPeri,gRightLegs,gRectSides,gSeats,gTour,gTravel];
  var target=WORK?8:16,items=[],seen={},gi=0,guard=0;
  while(items.length<target&&guard++<6000){var fn=base[gi%base.length];gi++;var f=gen(fn);if(f&&!seen[f.q]){seen[f.q]=1;items.push(f);}}
  var K=0;window.__PROB=[];
  var body=items.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'"><div class="qt"><span class="ql"></span><span class="qx">'+f.q+'</span></div>'+(WORK?'<div class="work"></div>':'')+'</div>';}).join('');
  var ans=window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>'+p.f.a+'</span></div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадратад шилждэг тэгшитгэл 2 — бодлого</h1><div class="sub">Тоо · геометр · хэрэглээ · квадрат тэгшитгэл зохиох · 6.3 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Үл мэдэгдэх хэмжигдэхүүнийг $x$-ээр тэмдэглэн квадрат тэгшитгэл зохиож бод. Утга учрын дагуу зөвхөн тохирох (эерэг) шийдийг ав.</div>'
    +'<div class="task">Дараах бодлого бүрийг квадрат тэгшитгэл зохиож бод.</div><div class="plist">'+body+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-list">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Квадратад шилждэг тэгшитгэл 2 — бодлого (10-р анги)';
  var s=document.getElementById('sheet');
  toggleAns();
  try{renderMathInElement(s,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimTail(s,1035);}catch(e){}
  relabel(s);
}
function relabel(s){var qs=s.querySelectorAll('.plist .q');for(var i=0;i<qs.length;i++)qs[i].querySelector('.ql').textContent=(i+1)+'.';var as=s.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++)as[j].querySelector('.an').textContent=(j+1)+'.';}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function trimTail(sheet,target){var h=probeH(sheet),g=0;while(h>target&&g++<300){var qs=sheet.querySelectorAll('.plist .q');if(qs.length<=5)break;var last=qs[qs.length-1],k=last.getAttribute('data-k');var a=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(a)a.parentNode.removeChild(a);last.parentNode.removeChild(last);h=probeH(sheet);}}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
