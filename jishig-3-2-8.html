<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />

<title>III бүлэг — Жишиг даалгавар 2 (8-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 8-р анги · III бүлэг. Магадлал — Жишиг даалгавар 2 (3.3 Үзэгдлийн магадлал: сонгодог магадлал, магадлалын хуваарь, эсрэг үзэгдэл,
   нийцгүй үзэгдлийн нэгдэл, харьцангуй давтамж; 3.1-ийн чадлын томьёотой хосолсон бодлого) */
function pf(m, n) { var r = fr(m, n), full = '\\dfrac{' + m + '}{' + n + '}'; return r === full ? full : full + '=' + r; }   // бүтэн = хураасан бутархай
// «нэр» — нэр томьёогоор эхэлбэл нээх хашилтыг томьёотой нь нэг мөрөнд үлдээнэ («» мөрийн төгсгөлд ганцаараа үлдэхгүй)
function qt(s) { if (s.charAt(0) !== '$') return '«' + s + '»'; var k = s.indexOf('$', 1) + 1; return '<span style="white-space:nowrap">«' + s.slice(0, k) + '</span>' + s.slice(k) + '»'; }
function D(x) { return dFmt(x, 2); }                      // хувиар өгсөн бүхэл → 0.35
var COL = ['улаан', 'цагаан', 'хөх', 'шар', 'ногоон'];
var DIEV = [['тэгш тоо', 3], ['сондгой тоо', 3], ['анхны тоо', 3], ['$3$ тоонд хуваагдах тоо', 2], ['$4$ тооноос их тоо', 2], ['$2$ тооноос их тоо', 4],
  ['$5$ тооноос бага тоо', 4], ['$4$ тооноос бага тоо', 3], ['$6$', 1], ['$1$ эсвэл $6$', 2]];
var RK = ['туз', 'ноён', 'хатан', 'боол'], SU = ['тамга', 'бундан', 'гил', 'дөрвөлжин'];
var WORDS = ['МОНГОЛ', 'ХАРАНДАА', 'ДЭВТЭР', 'ЦАГИРАГ', 'НАРАН', 'ЗУРАГ', 'ТООЛУУР', 'ГУРВАЛЖИН', 'МАГАДЛАЛ', 'ОЛОНЛОГ', 'ДАДЛАГА', 'ХУРДАН', 'ШАТАР', 'ЦЭЦЭГ', 'ДӨРВӨЛЖИН'];
var VOW = 'АЭИОӨУҮ';
function d2(f) { var c = 0; for (var a = 1; a <= 6; a++) for (var b = 1; b <= 6; b++) if (f(a, b)) c++; return c; }   // хоёр шооны 36 эгэл үзэгдлээс тоолох

// 1. [3.3] Сонгодог магадлал P(A)=m/n: шоо, уут, хөзөр, үгийн үсэг, тоо сонгох (Дасгал 21, 44, 50, 58)
function g1() {
  var t = rnd(1, 5);
  if (t === 1) { var e = pick(DIEV); return { stem: 'Шоо орхих; ' + qt(e[0] + ' буух'), a: 'P=' + pf(e[1], 6) }; }
  if (t === 2) {
    var cs = shuffle(COL).slice(0, 3), a = rnd(2, 9), b = rnd(2, 9), c = rnd(2, 9), N = a + b + c, k = rnd(0, 2), cnt = [a, b, c][k];
    if (a === b || b === c || a === c) return null;
    if (rnd(0, 1)) return { stem: 'Уутанд $' + a + '$ ' + cs[0] + ', $' + b + '$ ' + cs[1] + ', $' + c + '$ ' + cs[2] + ' бөмбөг бий; «' + cs[k] + ' бөмбөг гарах»', a: 'P=' + pf(cnt, N) };
    return { stem: 'Уутанд $' + a + '$ ' + cs[0] + ', $' + b + '$ ' + cs[1] + ', $' + c + '$ ' + cs[2] + ' бөмбөг бий; «' + cs[k] + ' биш бөмбөг гарах»', a: 'P=' + pf(N - cnt, N) };
  }
  if (t === 3) {
    var ev = pick([[pick(RK) + ' таарах', 4], [pick(SU) + ' таарах', 13], [pick(RK) + ' биш хөзөр таарах', 48], [pick(SU) + ' биш хөзөр таарах', 39]]);
    return { stem: '$52$ хөзрөөс нэгийг сугалах; «' + ev[0] + '»', a: 'P=' + pf(ev[1], 52) };
  }
  if (t === 4) {
    var w = pick(WORDS), n = w.length, v = 0; for (var i = 0; i < n; i++) if (VOW.indexOf(w.charAt(i)) >= 0) v++;
    var vw = rnd(0, 1);
    return { stem: '«' + w + '» үгийн үсгүүдээс нэгийг сонгох; «' + (vw ? 'эгшиг' : 'гийгүүлэгч') + ' үсэг сонгогдох»', a: 'P=' + pf(vw ? v : n - v, n) };
  }
  var M = pick([20, 24, 30, 36, 40, 50, 60]), d = rnd(3, 9), q = Math.floor(M / d);
  return { stem: '$1, 2, \\dots, ' + M + '$ тоонуудаас нэгийг сонгох; ' + qt('$' + d + '$ тоонд хуваагдах тоо байх'), a: 'P=' + pf(q, M) };
}

// 2. [3.3] Магадлалын хуваарь (бүх эгэл үзэгдлийн магадлалын нийлбэр 1) ба эсрэг үзэгдэл P(Ā)=1−P(A) (Жишээ 6, Дасгал 36, 53)
function g2() {
  var t = rnd(1, 4);
  if (t === 4) {
    var q = rnd(5, 20), p = rnd(1, q - 1); if (gcd(p, q) !== 1) return null;
    return { stem: '$P(A)=\\dfrac{' + p + '}{' + q + '}$; $\\ P(\\bar A)$', a: 'P(\\bar A)=1-\\dfrac{' + p + '}{' + q + '}=' + fr(q - p, q) };
  }
  var els = pick([['a', 'b', 'c', 'd'], ['x', 'y', 'z', 't'], ['a', 'b', 'c', 'd', 'e'], ['p', 'q', 'r', 's']]), n = els.length, c = [], rest = 100, i;
  for (i = 0; i < n - 1; i++) { var hi = Math.min(45, rest - 5 * (n - 1 - i)); if (hi < 5) return null; var v = 5 * rnd(1, Math.floor(hi / 5)); c.push(v); rest -= v; }
  if (rest < 5 || rest > 50) return null;
  c.push(rest);
  var om = '\\Omega=\\{' + els.join(',\\ ') + '\\}';
  if (t === 1) {
    var j = rnd(0, n - 1), gv = [], ov = [];
    for (i = 0; i < n; i++) if (i !== j) { gv.push('P(' + els[i] + ')=' + D(c[i])); ov.push(D(c[i])); }
    return { stem: '$' + om + '$; $\\ ' + gv.join(',\\ ') + '$; $\\ P(' + els[j] + ')$', a: 'P(' + els[j] + ')=1-(' + ov.join('+') + ')=' + D(c[j]) };
  }
  var all = els.map(function (e, k) { return 'P(' + e + ')=' + D(c[k]); }).join(',\\ ');
  var idx = shuffle(els.map(function (_, k) { return k; })).slice(0, rnd(2, n - 2)).sort(function (x, y) { return x - y; }), s = 0;
  idx.forEach(function (k) { s += c[k]; });
  var sub = '\\{' + idx.map(function (k) { return els[k]; }).join(',\\ ') + '\\}';
  if (t === 2) return { stem: '$' + om + '$; $\\ ' + all + '$; $\\ A=' + sub + '$; $\\ P(A)$', a: 'P(A)=' + idx.map(function (k) { return D(c[k]); }).join('+') + '=' + D(s) };
  return { stem: '$' + om + '$; $\\ ' + all + '$; $\\ B=' + sub + '$; $\\ P(\\bar B)$', a: 'P(B)=' + D(s) + ',\\ P(\\bar B)=1-' + D(s) + '=' + D(100 - s) };
}

// 3. [3.3] Нийцгүй үзэгдлүүдийн нэгдлийн магадлал P(A∪B)=P(A)+P(B) (Жишээ 7, Дасгал 33, 37, 62)
function g3() {
  var t = rnd(1, 6);
  if (t === 1) {
    var a = rnd(2, 9) * 5, b = rnd(2, 9) * 5; if (a + b > 95) return null;
    return { stem: '$A$, $B$ нийцгүй; $P(A)=' + D(a) + '$, $P(B)=' + D(b) + '$; $\\ P({A\\cup B})$', a: 'P({A\\cup B})=' + D(a) + '+' + D(b) + '=' + D(a + b) };
  }
  if (t === 2) {
    var u = rnd(8, 19) * 5, x = rnd(2, 9) * 5; if (x >= u - 5) return null;
    return { stem: '$A$, $B$ нийцгүй; $P({A\\cup B})=' + D(u) + '$, $P(A)=' + D(x) + '$; $\\ P(B)$', a: 'P(B)=' + D(u) + '-' + D(x) + '=' + D(u - x) };
  }
  if (t === 3) {
    var r1 = pick(RK), r2 = pick(RK); if (r1 === r2) return null;
    return { stem: '$52$ хөзрөөс нэгийг сугалах; «' + r1 + ' эсвэл ' + r2 + ' таарах»', a: 'P=\\dfrac{4}{52}+\\dfrac{4}{52}=\\dfrac{8}{52}=\\dfrac{2}{13}' };
  }
  if (t === 4) {
    var cs = shuffle(COL).slice(0, 3), p = rnd(2, 9), q = rnd(2, 9), z = rnd(2, 9), N = p + q + z; if (p === q || q === z || p === z) return null;
    return { stem: 'Уутанд $' + p + '$ ' + cs[0] + ', $' + q + '$ ' + cs[1] + ', $' + z + '$ ' + cs[2] + ' бөмбөг бий; «' + cs[0] + ' эсвэл ' + cs[2] + ' бөмбөг гарах»',
      a: 'P=\\dfrac{' + p + '}{' + N + '}+\\dfrac{' + z + '}{' + N + '}=' + pf(p + z, N) };
  }
  if (t === 5) {
    var s1 = rnd(3, 11), s2 = rnd(3, 11); if (s1 >= s2) return null;
    var k1 = 6 - Math.abs(7 - s1), k2 = 6 - Math.abs(7 - s2);
    return { stem: 'Хоёр шоо зэрэг орхих; «нүднүүдийн нийлбэр $' + s1 + '$ эсвэл $' + s2 + '$ байх»', a: 'P=\\dfrac{' + k1 + '}{36}+\\dfrac{' + k2 + '}{36}=' + pf(k1 + k2, 36) };
  }
  var p10 = rnd(3, 8) * 5, p9 = rnd(3, 9) * 5; if (p10 + p9 > 90) return null;
  return { stem: 'Нэг харвалтаар $10$ оноо авах магадлал $' + D(p10) + '$, $9$ оноо авах магадлал $' + D(p9) + '$; ' + qt('$9$ эсвэл $10$ оноо авах'), a: 'P=' + D(p10) + '+' + D(p9) + '=' + D(p10 + p9) };
}

// 4. Өгүүлбэртэй бодлого — 4 төрлийг ээлжлэн: олонлог ба магадлал · харьцангуй давтамж · завсрын магадлал · олон алхамт (шагай, цифр, хоёр хайрцаг)
// Олонлогийн чадал ашиглан магадлал олох (Өөрийгөө сорих 7)
function wClub() {
  var C = pick([['шатрын', 'даамын'], ['дууны', 'бүжгийн'], ['зургийн', 'робот техникийн'], ['сагсан бөмбөгийн', 'волейболын']]);
  var N = pick([20, 24, 25, 28, 30, 32, 35, 36, 40]), c = rnd(2, 6), a = c + rnd(3, 10), b = c + rnd(3, 10), un = a + b - c; if (un >= N - 1) return null;
  return { stem: 'Ангийн $' + N + '$ сурагчийн $' + a + '$ нь ' + C[0] + ', $' + b + '$ нь ' + C[1] + ' дугуйланд, $' + c + '$ нь хоёуланд нь явдаг. Таамгаар сонгосон сурагч а) ядаж нэг дугуйланд явдаг; б) аль ч дугуйланд явдаггүй байх магадлалыг ол.',
    a: '$|{A\\cup B}|=' + a + '+' + b + '-' + c + '=' + un + '$; а) $' + pf(un, N) + '$; б) $' + pf(N - un, N) + '$' };
}
// Харьцангуй давтамж (Жишээ 8, Дасгал 42, 43)
function wFreq() {
  if (rnd(0, 1)) {
    var M = pick([10, 20]), T = pick([100, 200, 500]), red = rnd(2, M - 2), f = Math.round(red / M * T) + rnd(-T / 50, T / 50), cc = pick(['улаан', 'хөх', 'шар']);
    var est = Math.round(f / T * M); if (est !== red || f <= 0 || f >= T) return null;
    return { stem: 'Уутанд ' + cc + ', цагаан нийт $' + M + '$ бөмбөг бий. Нэгийг гаргаж өнгийг нь тэмдэглээд буцааж хийхийг $' + T + '$ удаа давтахад ' + cc + ' бөмбөг $' + f + '$ удаа гарчээ. Харьцангуй давтамжийг олж, уутанд хэдэн ' + cc + ' бөмбөг байгааг тааварла.',
      a: '$\\dfrac{' + f + '}{' + T + '}=' + dFmt(Math.round(f / T * 1000), 3) + '$; $\\ ' + M + '\\cdot ' + dFmt(Math.round(f / T * 1000), 3) + '\\approx ' + est + '$ бөмбөг' };
  }
  var r = pick([5, 8, 10, 12, 15, 20, 25, 40]), Np = pick([500, 1000, 2000, 2500, 5000]), cnt = Np * r / 1000; if (cnt !== Math.round(cnt)) return null;
  return { stem: 'Үйлдвэрийн бүтээгдэхүүний гологдлын харьцангуй давтамж $' + dFmt(r, 3) + '$ болохыг тогтоожээ. Таамгаар авсан бүтээгдэхүүн гологдолгүй байх магадлалыг ол. $' + Np + '$ бүтээгдэхүүнд ойролцоогоор хэдэн гологдол байх вэ?',
    a: '$P=1-' + dFmt(r, 3) + '=' + dFmt(1000 - r, 3) + '$; $\\ ' + Np + '\\cdot ' + dFmt(r, 3) + '=' + cnt + '$ гологдол' };
}
// Завсрын магадлал: «m-ээс олон» = «яг m+1» ∪ «m+1-ээс олон» (Дасгал 40, 59, 60)
function wNested() {
  var t = rnd(1, 3);
  if (t === 1) {
    var p9 = rnd(12, 18) * 5, p10 = rnd(6, p9 / 5 - 2) * 5, nm = pick(['Болд', 'Сараа', 'Тэмүүлэн', 'Номин']);
    return { stem: 'Шалгалтад ' + nm + ' $9$ бодлогоос олныг зөв бодох магадлал $' + D(p9) + '$, $10$ бодлогоос олныг зөв бодох магадлал $' + D(p10) + '$ байв. Яг $10$ бодлого зөв бодох магадлалыг ол.',
      a: qt('$9$ бодлогоос олон') + ' нь «яг $10$» ба ' + qt('$10$ бодлогоос олон') + ' гэсэн нийцгүй үзэгдлүүдийн нэгдэл: $' + D(p9) + '-' + D(p10) + '=' + D(p9 - p10) + '$' };
  }
  if (t === 2) {
    var q1 = rnd(16, 19) * 5, q2 = rnd(10, q1 / 5 - 2) * 5;
    return { stem: 'Шинэ угаалгын машин $1$ жилээс илүү хугацаанд эвдрэлгүй ажиллах магадлал $' + D(q1) + '$, $2$ жилээс илүү хугацаанд эвдрэлгүй ажиллах магадлал $' + D(q2) + '$. Машин $1$ жилээс илүү, гэхдээ $2$ жилээс илүүгүй хугацаанд эвдрэлгүй ажиллах магадлалыг ол.',
      a: '$' + D(q1) + '-' + D(q2) + '=' + D(q1 - q2) + '$' };
  }
  var r1 = rnd(17, 19) * 5, r2 = rnd(8, r1 / 5 - 3) * 5;
  return { stem: 'Автобус $16$ хүнээс цөөн зорчигчтой хөдлөх магадлал $' + D(r1) + '$, $10$ хүнээс цөөн зорчигчтой хөдлөх магадлал $' + D(r2) + '$. Зорчигчийн тоо $10$ ба түүнээс олон, $15$ ба түүнээс цөөн байх магадлалыг ол.',
    a: '$' + D(r1) + '-' + D(r2) + '=' + D(r1 - r2) + '$' };
}
// Олон алхамт: шагайн магадлалын хуваарь, цифрийн эсрэг үзэгдэл, хоёр хайрцаг (Дасгал 25, 35, 64, Өөрийгөө сорих 6)
function wMulti() {
  var t = rnd(1, 3);
  if (t === 1) {
    var m = rnd(1, 4) * 5, tm = rnd(1, 4) * 5, h = rnd(5, 9) * 5, y = 100 - m - tm - h; if (y < 15 || m === tm) return null;
    return { stem: 'Шагай орхиход морь буух магадлал $' + D(m) + '$, тэмээ буух магадлал $' + D(tm) + '$, хонь буух магадлал $' + D(h) + '$ бол а) ямаа; б) бод мал (морь, тэмээ); в) бог мал (хонь, ямаа) буух магадлалыг ол.',
      a: 'а) $1-(' + D(m) + '+' + D(tm) + '+' + D(h) + ')=' + D(y) + '$; б) $' + D(m) + '+' + D(tm) + '=' + D(m + tm) + '$; в) $1-' + D(m + tm) + '=' + D(100 - m - tm) + '$' };
  }
  if (t === 2) {
    var d1 = rnd(1, 9), d2v = rnd(0, 9); if (d1 === d2v) return null;
    var no = 0; for (var x = 10; x <= 99; x++) { var s = String(x); if (s.indexOf(String(d1)) < 0 && s.indexOf(String(d2v)) < 0) no++; }
    return { stem: 'Таамгаар сонгосон хоёр оронтой тооны бичиглэлд $' + d1 + '$ ба $' + d2v + '$ цифрийн ядаж нэг нь орсон байх магадлалыг эсрэг үзэгдлээр бодож ол.',
      a: 'эсрэг үзэгдэл: аль нь ч ороогүй — $' + no + '$ тоо, $P(\\bar A)=' + pf(no, 90) + '$; $\\ P(A)=1-' + fr(no, 90) + '=' + fr(90 - no, 90) + '$' };
  }
  var b1 = rnd(1, 5), w1 = rnd(1, 5), b2 = rnd(1, 5), w2 = rnd(1, 5), T = (b1 + w1) * (b2 + w2); if (b1 === w1 && b2 === w2) return null;
  return { stem: 'Нэг хайрцагт $' + b1 + '$ хар, $' + w1 + '$ цагаан, нөгөөд нь $' + b2 + '$ хар, $' + w2 + '$ цагаан бөмбөг бий. Хайрцаг бүрээс нэгийг таамгаар гаргахад а) хоёулаа хар; б) ядаж нэг нь цагаан байх магадлалыг ол.',
    a: 'нийт $' + (b1 + w1) + '\\cdot ' + (b2 + w2) + '=' + T + '$ хос; а) $' + pf(b1 * b2, T) + '$; б) $1-' + fr(b1 * b2, T) + '=' + fr(T - b1 * b2, T) + '$' };
}
var K4 = 0;
function g4() {
  var r = [wClub, wFreq, wNested, wMulti][K4 % 4]();
  if (r) K4++;
  return r;
}

CMX.jishig({
  title: 'III бүлэг — Жишиг даалгавар 2',
  sub: 'Үзэгдлийн магадлал · магадлалын хуваарь · нийцгүй үзэгдлийн нэгдэл · харьцангуй давтамж',
  grade: '8-р анги',
  rule: '$P(A)=\\dfrac{m}{n}$ &nbsp;·&nbsp; $P(\\bar A)=1-P(A)$ &nbsp;·&nbsp; бүх эгэл үзэгдлийн магадлалын нийлбэр $1$ &nbsp;·&nbsp; $A$, $B$ нийцгүй бол $P({A\\cup B})=P(A)+P(B)$',
  tasks: [
    { label: 'Үзэгдлийн магадлалыг ол.', gen: g1, n: 10, nw: 4, cols: 2, wk: 10 },
    { label: 'Магадлалын хуваарь ба эсрэг үзэгдлийг ашиглан ол.', gen: g2, n: 8, nw: 2, cols: 2, wk: 12 },
    { label: 'Нийцгүй үзэгдлүүдийн нэгдлийн магадлалыг ол.', gen: g3, n: 8, nw: 4, cols: 2, wk: 12 },
    { label: 'Бодлогыг бод.', gen: g4, n: 6, nw: 2, cols: 2, wk: 20 }
  ]
});
</script>
<script src="/ws-store.js?v=40"></script>
