<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>4-р анги — өгүүлбэртэй бодлого (хүндэвтэр)</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#16241c;--soft:#5a7064;--line:#cfe0d6;--forest:#13502e;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:#e9f1ec;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-family:inherit;font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;color:#fff;font-size:.9rem;background:var(--forest)}
  .btn.ghost{background:#fff;color:var(--forest);box-shadow:inset 0 0 0 1.5px var(--line)}
  .bar label{font-weight:700;color:var(--forest);display:flex;align-items:center;gap:6px;font-size:.9rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.3)}
  .head{text-align:center;border-bottom:2.5px solid var(--forest);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:var(--forest);font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #9bb3a6;padding:0 30px 2px 4px}
  .guide{background:#fff7e6;border:1px solid #f3dca6;border-radius:10px;padding:9px 14px;margin-bottom:14px;font-size:12.5px;color:#8a5a00;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:7px 4px 8px;border-bottom:1px dashed #e6efe9}
  .qt{font-size:13.5px}.qt .qn{font-weight:800;color:var(--forest);margin-right:5px}
  .work{margin:7px 0 5px 0;height:20mm;border:1.3px solid #bcd3c4;border-radius:6px;background-image:linear-gradient(#eee 1px,transparent 1px);background-size:100% 6mm}
  .ans2{font-size:12.5px;font-weight:700}.ans2 .bl{display:inline-block;min-width:70px;border-bottom:1.4px solid #6f8a7c;height:1.05em;margin-left:6px}
  .ans-page{margin-top:9mm;border-top:2px dashed var(--line);padding-top:7mm}.ans-page h2{font-size:15px;color:var(--forest);margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 16px;font-size:12.5px}.ans-grid .an{color:var(--soft);font-weight:800}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn ghost" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var NAMES=['Болд','Сараа','Тэмүүлэн','Ану','Наран','Оюун','Батаа','Дулмаа','Төгс','Мичид'];
var THINGS=['дэвтэр','харандаа','ном','алим','жүрж','бэлэг','шоколад','бөмбөг'];

// — бодлого үүсгэгчид (хүндэвтэр түвшин) —
var GENS=[
  // Нийлбэр–зөрүү
  function(){var b=rnd(25,95),d=rnd(12,60),a=b+d,S=a+b;
    return {q:'Хоёр тооны нийлбэр '+S+', зөрүү нь '+d+'. Тэр хоёр тоог ол.',
            a:'Их тоо '+a+', бага тоо '+b};},
  // Хэд дахин их + нийлбэр
  function(){var k=rnd(2,4),b=rnd(15,70),a=k*b,S=a+b;
    return {q:'Нэг тоо нөгөөгөөсөө '+k+' дахин их. Нийлбэр нь '+S+'. Хоёр тоог ол.',
            a:'Бага '+b+', их '+a};},
  // Үнэ · тоо · өртөг + өөрчлөлт
  function(){var p=rnd(3,9)*100,n=rnd(4,9),c=p*n,paid=Math.ceil(c/1000)*1000+ (rnd(0,1)?1000:0);
    var th=pick(THINGS);
    return {q:pick(NAMES)+' нэг '+th+'-ийг '+p+'₮-өөр '+n+' ширхэг авч, '+paid+'₮ өгөв. Хэдэн төгрөгийн хариулт авах вэ?',
            a:(paid-c)+'₮ (нийт '+c+'₮)'};},
  // Хурд · зам · хугацаа
  function(){var v=pick([40,50,60,80]),t=rnd(2,5),s=v*t,f=rnd(0,2);
    if(f===0)return{q:'Машин цагт '+v+' км хурдтай явна. '+t+' цагт хэдэн км явах вэ?',a:s+' км'};
    if(f===1)return{q:'Машин '+s+' км замыг цагт '+v+' км хурдтай явав. Хэдэн цаг явсан бэ?',a:t+' цаг'};
    return{q:'Машин '+s+' км замыг '+t+' цагт явав. Хурд нь хэдэн км/ц вэ?',a:v+' км/ц'};},
  // Олон үйлдэлт худалдаа
  function(){var p1=rnd(3,8)*100,n1=rnd(2,5),p2=rnd(2,6)*100,n2=rnd(2,5);
    return {q:pick(NAMES)+' '+n1+' ширхэг дэвтэр ('+p1+'₮), '+n2+' ширхэг харандаа ('+p2+'₮) авав. Нийт хэдэн төгрөг вэ?',
            a:(p1*n1+p2*n2)+'₮'};},
  // Хэмжигдэхүүн хөрвүүлэх
  function(){var m=rnd(3,6),cm=rnd(1,9)*10,tot=m*100+cm,cut=rnd(1,3)*100+rnd(1,9)*10;
    if(cut>=tot)cut=100;
    return {q:'Утас '+m+' м '+cm+' см урттай. Түүнээс '+cut+' см таслав. Хэдэн см үлдэх вэ?',
            a:(tot-cut)+' см'};},
  // Талбай ба периметр
  function(){var a=rnd(6,18),b=rnd(4,a-1);
    return {q:'Тэгш өнцөгтийн урт '+a+' см, өргөн '+b+' см. Талбай ба периметрийг ол.',
            a:'Талбай '+(a*b)+' см², периметр '+(2*(a+b))+' см'};},
  // Бутархайн хэсэг
  function(){var d=pick([2,3,4,5]),W=d*rnd(6,20),m=rnd(1,d-1);
    return {q:'Нэг хайрцагт '+W+' алим байв. Түүний '+m+'/'+d+' нь болов. Хэдэн алим болсон бэ?',
            a:(W/d*m)+' алим'};},
  // Хэд дахин их/бага (хуваах)
  function(){var b=rnd(6,15),k=rnd(3,6),a=b*k;
    return {q:pick(NAMES)+'-д '+a+' төгрөг, '+pick(NAMES)+'-д '+b+' төгрөг байв. Хэд дахин их байгаа вэ?',
            a:k+' дахин'};},
];

function build(){
  var probs='',answs='',WS=[];
  // 12 бодлого — төрлүүдийг хольж, давхардлыг багасгана
  var order=[];for(var g=0;g<GENS.length;g++)order.push(g);
  for(var i=order.length-1;i>0;i--){var j=rnd(0,i);var t=order[i];order[i]=order[j];order[j]=t;}
  for(var i=0;i<12;i++){
    var gi=order[i%order.length];
    var pr=GENS[gi]();
    var k=i+1;
    probs+='<div class="q"><div class="qt"><span class="qn">'+k+'.</span>'+pr.q+'</div><div class="work"></div>'
      +'<div class="ans2">Хариу:<span class="bl"></span></div></div>';
    answs+='<div class="a"><span class="an">'+k+'.</span> '+pr.a+'</div>';
    WS.push({q:'\\text{'+pr.q+'}',a:'\\text{'+pr.a+'}'});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>4-р анги — өгүүлбэртэй бодлого</h1><div class="sub">Хүндэвтэр түвшин · нийлбэр-зөрүү · үнэ · хурд · талбай · бутархай · 12 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Анги: </span></div>'
    +'<div class="guide">Бодлого бүрийг <b>уншиж</b>, ямар үйлдэл хэрэгтэйг бодоод, <b>үе шаттай</b> бод. Хариудаа <b>нэгжийг</b> (₮, км, см, цаг) заавал бич.</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='4-р анги өгүүлбэртэй бодлого (хүндэвтэр)';
}
build();
</script>
<script src="/ws-store.js?v=38"></script>
</body>
</html>
