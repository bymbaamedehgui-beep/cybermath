/* ЭЕШ 1000 — Тоо ба илэрхийлэл-1 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Тоо, зэрэг, язгуур, хуваагдах чанар, харьцаа ба хувь, текст бодлого.
   Эх: 1.10, 1.47, 1.70, 1.11, 1.15, 1.18, 1.69, 1.14, 1.73, 1.36, 1.57, 4.19, 4.38, 4.71, 4.39, 4.97, 4.102, 4.40, 4.56, 4.90, 4.43, 4.93, 4.68, 4.77, 4.65 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 1.10 */
var e1_10 = (function () {
// 10. Таван тооноос рационал (эсвэл иррационал) тоонуудыг ялгах. 2–3 рационал (үетэй/төгсгөлөг аравтын бутархай,
//     бүтэн квадратын язгуур, бүтэн кубын язгуур, энгийн бутархай, бүхэл) + үлдсэн нь иррационал (π, бүтэн биш язгуур, …).
//     Төрлүүдийг давхардуулахгүй сонгож холино; хариу нь харагдсан дарааллаар.
function p10_rat(kind) {
  var v, p, q;
  if (kind === 'per') {        // үетэй бутархай: 2.(07), 0.(3), 1.2(6)
    var per = rnd(0, 1) ? String(rnd(1, 8)) : String(rnd(0, 9)) + String(rnd(1, 9));
    if (per.length === 2 && per[0] === per[1]) per = per[0];
    var pre = rnd(0, 9) < 3 ? String(rnd(1, 9)) : '';
    return (rnd(0, 9) < 2 ? '-' : '') + rnd(0, 5) + '.' + pre + '(' + per + ')';
  }
  if (kind === 'dec') {        // төгсгөлөг аравтын бутархай: -4.5, 0.25, 3.14
    if (rnd(0, 9) < 1) return '3.14';
    v = rnd(0, 1) ? nz(-99, 99) / 10 : nz(-999, 999) / 100;
    if (Math.round(v) === v) return null;
    return dec(v);
  }
  if (kind === 'sq') return (rnd(0, 9) < 2 ? '-' : '') + '\\sqrt{' + Math.pow(rnd(2, 12), 2) + '}';
  if (kind === 'cb') { v = rnd(2, 5); return '\\sqrt[3]{' + (rnd(0, 9) < 3 ? -1 : 1) * v * v * v + '}'; }
  if (kind === 'frac') {
    if (rnd(0, 9) < 1) return '\\dfrac{22}{7}';
    q = rnd(2, 9); p = rnd(1, 20);
    if (gcd(p, q) !== 1) return null;
    return (rnd(0, 9) < 4 ? '-' : '') + '\\dfrac{' + p + '}{' + q + '}';
  }
  return String(rnd(-15, 15));   // бүхэл
}
function p10_irr(kind) {
  var n;
  if (kind === 'pi') return pick(['\\pi', '\\pi', '\\dfrac{\\pi}{2}', '2\\pi', '-\\pi', '\\pi+1', '\\dfrac{\\pi}{3}']);
  if (kind === 'rt') { n = pick([2, 3, 5, 6, 7, 10, 11, 13, 15, 17]); return (rnd(0, 9) < 2 ? '-' : '') + (rnd(0, 9) < 2 ? rnd(2, 3) : '') + '\\sqrt{' + n + '}'; }
  if (kind === 'rt1') { n = pick([2, 3, 5, 6, 7]); return rnd(0, 1) ? '\\sqrt{' + n + '}' + pick(['+', '-']) + rnd(1, 3) : rnd(1, 3) + '-\\sqrt{' + n + '}'; }
  if (kind === 'cbrt') return '\\sqrt[3]{' + pick([2, 3, 4, 5, 6, 7, 9, 10, 25]) + '}';
  return pick(['0.1010010001\\ldots', '1.2122122212222\\ldots', '0.12112111211112\\ldots']);   // үегүй хязгааргүй
}
function p10() {
  var nr = rnd(2, 3), ni = 5 - nr;
  var rk = shuffle(['per', 'dec', 'sq', 'cb', 'frac', 'int']).slice(0, nr), ik = shuffle(['pi', 'rt', 'rt1', 'cbrt', 'non']).slice(0, ni);
  if (rk.indexOf('per') < 0 && rk.indexOf('dec') < 0 && rnd(0, 1)) return null;   // ихэвчлэн аравтын бутархай орно
  if (ik.indexOf('pi') < 0 && rnd(0, 1)) return null;                               // ихэвчлэн π орно
  var items = [], seen = {}, i, x;
  for (i = 0; i < nr; i++) { x = p10_rat(rk[i]); if (x == null) return null; items.push({ s: x, r: true, k: rk[i] }); }
  for (i = 0; i < ni; i++) { x = p10_irr(ik[i]); items.push({ s: x, r: false, k: ik[i] }); }
  for (i = 0; i < 5; i++) { if (seen[items[i].s]) return null; seen[items[i].s] = 1; }
  if (items.some(function (o) { return o.s === '0' || o.s === '1' || o.s === '-1'; })) return null;
  items = shuffle(items);
  var askR = rnd(0, 9) < 7;
  // Бодолт (гар бичмэл): рационал ба иррационал тоонуудыг тус тусад нь бичнэ (асуусан төрөл сүүлд), шалтгааныг хаалтад.
  var lineR = '<b>Рационал тоонууд:</b> ' + items.filter(function (o) { return o.r; }).map(p10_why).join(', ') + '.';
  var lineI = '<b>Иррационал тоонууд:</b> ' + items.filter(function (o) { return !o.r; }).map(p10_why).join(', ') + '.';
  return {
    q: '$' + items.map(function (o) { return o.s; }).join(',\\ ') + '$ тоонуудаас бүх ' + (askR ? 'рационал' : 'иррационал') + ' тоог ялгаж бич.',
    a: '$' + items.filter(function (o) { return o.r === askR; }).map(function (o) { return o.s; }).join(',\\ ') + '$',
    wk: 18,
    s: [
      'Рационал тоо $\\frac{m}{n}$ ($m$ бүхэл, $n$ натурал) хэлбэрт бичигдэнэ: бүхэл тоо, энгийн бутархай, төгсгөлөг ба үетэй аравтын бутархай. '
        + 'Иррационал тоо нь үегүй хязгааргүй аравтын бутархай.',
      askR ? lineI : lineR,
      askR ? lineR : lineI
    ],
    t: { askR: askR }
  };
}
// Бодолтын тайлбар: тоо + яагаад рационал/иррационал болох (хаалтад)
function p10_why(o) {
  var s = o.s, t = '$' + s + '$', m, v;
  if (o.k === 'per') return t + ' (үетэй аравтын бутархай)';
  if (o.k === 'dec') return t + ' (төгсгөлөг аравтын бутархай)';
  if (o.k === 'frac') return t + ' (энгийн бутархай)';
  if (o.k === 'int') return t + ' (бүхэл тоо)';
  if (o.k === 'sq') { m = /\{(\d+)\}/.exec(s); v = Math.round(Math.sqrt(+m[1])); return '$' + s + '=' + (s[0] === '-' ? -v : v) + '$'; }
  if (o.k === 'cb') { m = /\{(-?\d+)\}/.exec(s); v = Math.round(Math.cbrt(+m[1])); return '$' + s + '=' + v + '$'; }
  if (o.k === 'pi') return s === '\\pi' ? t : t + ' ($\\pi$ иррационал)';
  if (o.k === 'rt') { m = /\\sqrt\{(\d+)\}/.exec(s); return t + ' ($' + m[1] + '$ бүтэн квадрат биш)'; }
  if (o.k === 'rt1') { m = /\\sqrt\{(\d+)\}/.exec(s); return t + ' ($\\sqrt{' + m[1] + '}$ иррационал)'; }
  if (o.k === 'cbrt') { m = /\{(\d+)\}/.exec(s); return t + ' ($' + m[1] + '$ бүтэн куб биш)'; }
  return t + ' (үегүй хязгааргүй аравтын бутархай)';
}
return p10;
})();

/* 1.47 */
var e1_47 = (function () {
// 47. Бүхэл, аравтын бутархай, энгийн бутархай, π-тэй тоо — 4 тоо √n-ийн ойролцоо (≥ 0.01 зайтай);
//     √n-ээс бага (эсвэл их) тоонуудыг ялгана. Дор хаяж нэг нь тохирно, нэг нь тохирохгүй.
var p47_PI = [[1, 1], [1, 2], [1, 3], [1, 4], [1, 6], [2, 3], [3, 4], [5, 6], [3, 2], [4, 3], [5, 4], [7, 6], [5, 3], [7, 4], [11, 6], [2, 1]];
function p47() {
  var n = pick([2, 2, 3, 5, 6, 7, 10]), R = Math.sqrt(n), far = function (v) { return Math.abs(v - R) >= 0.01; };
  var pools = [[], [], [], []], i, p, q;
  [Math.floor(R), Math.ceil(R)].forEach(function (v) { pools[0].push({ v: v, t: String(v) }); });
  for (i = Math.round(R * 10) - 5; i <= Math.round(R * 10) + 5; i++) if (i % 10 && far(i / 10)) pools[1].push({ v: i / 10, t: dec(i / 10) });
  for (q = 2; q <= 9; q++) for (p = Math.ceil((R - 0.5) * q); p <= (R + 0.5) * q; p++) {
    if (gcd(p, q) === 1 && p % q && far(p / q)) pools[2].push({ v: p / q, t: '\\dfrac{' + p + '}{' + q + '}' });
  }
  p47_PI.forEach(function (km) {
    var v = km[0] * Math.PI / km[1];
    if (Math.abs(v - R) <= 0.8 && far(v)) pools[3].push({ v: v, t: km[1] === 1 ? (km[0] === 1 ? '' : km[0]) + '\\pi' : '\\dfrac{' + (km[0] === 1 ? '' : km[0]) + '\\pi}{' + km[1] + '}' });
  });
  if (pools.some(function (P) { return !P.length; })) return null;
  var xs = shuffle(pools.map(function (P) { return pick(P); }));
  for (i = 0; i < 4; i++) for (p = i + 1; p < 4; p++) if (Math.abs(xs[i].v - xs[p].v) < 0.02) return null;
  var less = rnd(1, 3) !== 1, sel = xs.filter(function (x) { return less ? x.v < R : x.v > R; });
  if (!sel.length || sel.length === 4) return null;
  // Бодолт (гар бичмэл): √n ≈ (аравтын бутархай); тоо бүрийг аравтын бутархайгаар илэрхийлж √n-тэй харьцуулна.
  //   2 оронгоор харьцуулахад тэнцүү/эргэлзээтэй гарвал 3 орон авна (тоонууд √n-ээс ≥ 0.01 зайтай тул хангалттай)
  var dg = xs.every(function (x) { var u = +x.v.toFixed(2), w = +R.toFixed(2); return u !== w && (u < w) === (x.v < R); }) ? 2 : 3;
  var cmp = xs.map(function (x) {
    var mid = /^\d+(\.\d+)?$/.test(x.t) ? '' : Math.abs(x.v * 1000 - Math.round(x.v * 1000)) < 1e-9 ? '=' + dec(x.v) : '\\approx ' + dec(x.v, dg);
    return x.t + mid + (x.v < R ? '\\lt' : '\\gt') + '\\sqrt{' + n + '}';
  });
  var st = sel.map(function (x) { return '$' + x.t + '$'; }), lst = st.length === 1 ? st[0] : st.slice(0, -1).join(', ') + ' ба ' + st[st.length - 1];
  return {
    q: '$' + xs.map(function (x) { return x.t; }).join(',\\ ') + '$ тоонуудаас $\\sqrt{' + n + '}$-' + suf(n, 'аас') + ' '
      + (less ? 'бага' : 'их') + ' байх бүх тоог ялган бич.',
    a: '$' + sel.map(function (x) { return x.t; }).join(',\\ ') + '$',
    wk: 18,
    s: [
      '$\\sqrt{' + n + '}\\approx ' + dec(R, dg) + '$ гэдгийг ашиглан тоо бүрийг $\\sqrt{' + n + '}$-' + suf(n, 'тай') + ' харьцуулбал $$' + cmp.join(',\\qquad ') + '.$$',
      'Иймд $\\sqrt{' + n + '}$-' + suf(n, 'аас') + ' ' + (less ? 'бага' : 'их') + ' тоо нь ' + lst + '.'
    ],
    t: { n: n, less: less }
  };
}
return p47;
})();

/* 1.70 */
var e1_70 = (function () {
// 70. Нөхцөлөөс хоёр тооны харьцааг тогтоох. Хүснэгтэд зөвхөн нөхцөлөөр БҮРЭН тодорхойлогдох хосууд:

var p70_S = [
  { c: { a: '$-1\\lt a\\lt 0$', b: '$0\\lt b\\lt 1$' }, w: 3, P: [

// Бодолт (гар бичмэл): нөхцөлөөс илэрхийлэл бүрийн мужийг гаргаж завсрын тоогоор (1, 0, −1) жиших, эсвэл тэнцэтгэл бишийг

function p70_m(ineq, k, pos) {   // ineq = null → өмнө гаргасан тэнцэтгэл бишийг «Үүнийг» гэж заана
  return (ineq ? '$' + ineq + '$ тэнцэтгэл бишийн хоёр талыг' : 'Үүнийг') + ' ' + (pos ? 'эерэг' : 'сөрөг') + ' $' + k + '$ тоогоор үржүүлбэл тэмдэг нь '
    + (pos ? 'хэвээр үлдэнэ.' : 'эсрэгээр солигдоно.');
}
var p70_R = [
  [   // −1 < a < 0, 0 < b < 1
    ['$-1\\lt a\\lt 0\\Rightarrow 0\\lt -a\\lt 1$; $0\\lt b\\lt 1\\Rightarrow\\dfrac{1}{b}\\gt 1$.', ['-a', '<', '1', '<', '\\dfrac{1}{b}']],

    [p70_m('a\\lt 1', 'b', true), ['ab', '<', 'b']],
    [p70_m('b\\gt 1', 'a', true), ['ab', '>', 'a']],
    ['$b\\gt 1\\Rightarrow 0\\lt\\dfrac{1}{b}\\lt 1$.', ['\\dfrac{1}{b}', '<', '1', '<', 'b']],
    ['$b\\gt 1\\Rightarrow\\dfrac{1}{b}\\lt 1$. ' + p70_m(null, 'a', true), ['\\dfrac{a}{b}', '<', 'a']],
    ['$b\\gt 1\\Rightarrow\\dfrac{1}{b}\\lt 1$; $0\\lt a\\lt 1\\Rightarrow\\dfrac{1}{a}\\gt 1$.', ['\\dfrac{1}{b}', '<', '1', '<', '\\dfrac{1}{a}']],
