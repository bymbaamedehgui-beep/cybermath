<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Модултай тэгшитгэл |f(x)|=|g(x)| (12-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13.5px;margin-bottom:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:5px}.ql{font-weight:800;color:var(--purple);font-size:13.5px;min-width:22px}.qm{font-size:16px}
  .work{height:22mm;border:1.2px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 16px;font-size:13px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var LAB=['а','б','в','г','д','е','ё','ж','з','и','й','к','л','м'];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function reduce(r){var p=r.p,q=r.q;if(q<0){p=-p;q=-q;}var g=gcd(p,q);return {p:p/g,q:q/g};}
function fr(p,q){var r=reduce({p:p,q:q});if(r.q===1)return ''+r.p;return (r.p<0?'-':'')+'\\dfrac{'+Math.abs(r.p)+'}{'+r.q+'}';}
function dedupSort(a){var seen={},out=[];a.map(reduce).forEach(function(r){var k=(r.p/r.q).toFixed(6);if(!seen[k]){seen[k]=1;out.push(r);}});out.sort(function(x,y){return x.p/x.q-y.p/y.q;});return out;}
function fmtSols(list){if(!list.length)return '\\text{Шийдгүй}';return 'x='+list.map(function(r){return fr(r.p,r.q);}).join(';\\ \\ x=');}
function lin(a,b){var s;if(a===1)s='x';else if(a===-1)s='-x';else s=a+'x';if(b>0)s+='+'+b;else if(b<0)s+='-'+(-b);return s;}
function quadLatex(A,B,C){var s=(A===1?'x^{2}':(A===-1?'-x^{2}':A+'x^{2}'));if(B!==0)s+=(B>0?'+':'-')+(Math.abs(B)===1?'x':Math.abs(B)+'x');if(C!==0)s+=(C>0?'+':'-')+Math.abs(C);return s;}
function polyEval(P,x){return P[0]*x*x+P[1]*x+P[2];}
// Ax²+Bx+C=0 рационалаар. {roots:[...]} эсвэл {bad:true} (иррационал/төгсгөлгүй)
function resolve(P){var A=P[0],B=P[1],C=P[2];
  if(A===0){ if(B===0){ return {bad:(C===0)}; } return {roots:[{p:-C,q:B}]}; }
  var disc=B*B-4*A*C; if(disc<0)return {roots:[]};
  var s=Math.round(Math.sqrt(disc)); if(s*s!==disc)return {bad:true};
  return {roots:[{p:-B+s,q:2*A},{p:-B-s,q:2*A}]};
}
// |P(x)| = |Q(x)|  ⟺  P=Q эсвэл P=-Q
function solveAbsAbs(P,Q){
  var r1=resolve([P[0]-Q[0],P[1]-Q[1],P[2]-Q[2]]), r2=resolve([P[0]+Q[0],P[1]+Q[1],P[2]+Q[2]]);
  if(r1.bad||r2.bad)return null;
  return dedupSort((r1.roots||[]).concat(r2.roots||[]));
}
function mk(q,P,Q,key){var s=solveAbsAbs(P,Q);if(!s)return null;
  return {q:q,a:fmtSols(s),key:key,fn:function(x){return Math.abs(polyEval(P,x))-Math.abs(polyEval(Q,x));},xs:s.map(function(r){return r.p/r.q;})};}
// ─── Генераторууд ───
function genL(){var a=nz(-7,7),b=nz(-9,9),c=nz(-7,7),d=nz(-9,9);
  return mk('\\left|'+lin(a,b)+'\\right|=\\left|'+lin(c,d)+'\\right|',[0,a,b],[0,c,d],'L'+a+b+c+d);}
function genLk(){var k=pick([2,3]),a=nz(-5,5),b=nz(-8,8),c=nz(-7,7),d=nz(-9,9);
  return mk(k+'\\left|'+lin(a,b)+'\\right|=\\left|'+lin(c,d)+'\\right|',[0,k*a,k*b],[0,c,d],'Lk'+k+a+b+c+d);}
function genQ2(){var b1=nz(-6,6),c1=nz(-9,9),b2=nz(-6,6),c2=nz(-9,9);if(b1===b2&&c1===c2)return null;
  return mk('\\left|'+quadLatex(1,b1,c1)+'\\right|=\\left|'+quadLatex(1,b2,c2)+'\\right|',[1,b1,c1],[1,b2,c2],'Q2'+b1+c1+b2+c2);}
function genQ1(){var A=pick([1,1,2]),b=nz(-6,6),c=nz(-9,9),d=nz(-6,6),e=nz(-9,9);
  return mk('\\left|'+quadLatex(A,b,c)+'\\right|=\\left|'+lin(d,e)+'\\right|',[A,b,c],[0,d,e],'Q1'+A+b+c+d+e);}
function genQk(){var k=2,b=nz(-5,5),c=nz(-8,8),d=nz(-6,6),e=nz(-9,9);
  return mk(k+'\\left|'+quadLatex(1,b,c)+'\\right|=\\left|'+lin(d,e)+'\\right|',[k,k*b,k*c],[0,d,e],'Qk'+b+c+d+e);}
var GENS=[genL,genL,genL,genLk,genQ2,genQ1,genQk];
function build(){
  var N=12,items=[],seen={},probs='',ans='',i;
  window.__PROB=[];
  for(i=0;i<N;i++){
    var g=null,tr=0;
    do{ g=pick(GENS)(); tr++; }while((!g||seen[g.key]||g.xs.length===0)&&tr<260);
    if(!g)continue;
    seen[g.key]=1;
    var lb=LAB[i]||('#'+(i+1));
    probs+='<div class="q"><div class="qeq"><span class="ql">'+lb+')</span><span class="qm">$'+g.q+'$</span></div><div class="work"></div></div>';
    ans+='<div class="a"><span class="an">'+lb+')</span><span>$'+g.a+'$</span></div>';
    items.push({q:g.q,a:g.a});
    window.__PROB.push({fn:g.fn,xs:g.xs,q:g.q,a:g.a});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Модултай тэгшитгэл · $|f(x)|=|g(x)|$</h1><div class="sub">$|ax+b|=|cx+d|$ ба $|P(x)|=|Q(x)|$ квадрат хэлбэр · 12-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$|f(x)|=|g(x)|$ &nbsp;⟺&nbsp; $f(x)=g(x)$ &nbsp;<b>эсвэл</b>&nbsp; $f(x)=-g(x)$</div>'
    +'<div class="task">1. Тэгшитгэлийг бод.</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Модултай тэгшитгэл |f|=|g| (12-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=32"></script>
</body>
</html>
