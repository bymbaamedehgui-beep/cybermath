<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ерөнхий үржигдэхүүн гаргах (нэг гишүүнт) — 16 бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .guide{background:#f6f2ff;border:1px solid #e2d6ff;border-radius:12px;padding:10px 16px;margin-bottom:14px;font-size:12px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:7px 4px 8px;border-bottom:1px dashed #efeaff}
  .qeq{display:flex;gap:8px;align-items:baseline}.qn{font-weight:800;color:var(--purple);min-width:24px}.qm{font-size:15px}
  .bl{margin:11px 0 2px 30px;border-bottom:1.4px solid #b9accf;height:1.05em}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;font-size:12px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(lo,hi){var v=0;while(v===0)v=rnd(lo,hi);return v;}
function gcd(x,y){x=Math.abs(x);y=Math.abs(y);while(y){var t=y;y=x%y;x=t;}return x||1;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function vp(ex,ey){var s='';if(ex)s+=(ex===1?'x':'x^{'+ex+'}');if(ey)s+=(ey===1?'y':'y^{'+ey+'}');return s;}
function sterm(c,ex,ey,first){var sign=first?(c<0?'-':''):(c<0?' - ':' + ');var m=Math.abs(c),v=vp(ex,ey),cp=(m===1&&v)?'':m;return sign+cp+v;}
function polyStr(ts){return ts.map(function(t,i){return sterm(t.c,t.ex,t.ey,i===0);}).join('');}
function facStr(c,ex,ey){var v=vp(ex,ey);if(!v)return ''+c;if(c===1)return v;if(c===-1)return '-'+v;return c+v;}
function deg(t){return (t.ex+t.ey)*10+t.ex;}
function genOne(){
  var fc=rnd(2,6),fx=rnd(0,2),fy=rnd(0,2);
  var nT=rnd(0,2)===0?3:2,exps=[],seen={},tries=0;
  while(exps.length<nT&&tries<60){tries++;var ex=rnd(0,2),ey=rnd(0,2),k=ex+'_'+ey;if(seen[k])continue;seen[k]=1;exps.push({ex:ex,ey:ey});}
  if(exps.length<nT)return null;
  exps.sort(function(a,b){return deg(b)-deg(a);});
  var minEx=Math.min.apply(null,exps.map(function(e){return e.ex;}));
  var minEy=Math.min.apply(null,exps.map(function(e){return e.ey;}));
  if(minEx!==0||minEy!==0)return null;
  var inner=exps.map(function(e,idx){return {c:idx===0?rnd(1,5):nz(-5,5),ex:e.ex,ey:e.ey};});
  var g=0;inner.forEach(function(t){g=gcd(g,t.c);});if(g!==1)return null;
  var exp=inner.map(function(t){return {c:fc*t.c,ex:fx+t.ex,ey:fy+t.ey};});
  var neg=rnd(0,1)===0,facCoef=neg?-fc:fc;
  if(neg)exp=exp.map(function(t){return {c:-t.c,ex:t.ex,ey:t.ey};});
  exp.sort(function(a,b){return deg(b)-deg(a);});
  return {q:polyStr(exp), a:facStr(facCoef,fx,fy)+'\\left('+polyStr(inner)+'\\right)'};
}
function build(){
  var probs='',answs='',ITEMS=[];
  while(ITEMS.length<16){
    var it=genOne();if(!it)continue;
    var n=ITEMS.length+1;
    probs+='<div class="q"><div class="qeq"><span class="qn">'+n+'.</span><span class="qm">$'+it.q+'=$</span></div><div class="bl"></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>$'+it.a+'$</span></div>';
    ITEMS.push({q:it.q+'=',a:it.a});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Ерөнхий үржигдэхүүн гаргах (нэг гишүүнт)</h1><div class="sub">Бүх гишүүний нийтлэг тоо ба хувьсагчийг хаалтнаас гарга · 16 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="guide"><b>Жишээ:</b> $-25x^{2}y^{2}-10xy=-5xy(5xy+2)$ &nbsp;·&nbsp; $3x^{4}y^{3}+6x^{2}y^{2}=3x^{2}y^{2}(x^{2}y+2)$<br>Тэргүүлэгч сөрөг бол <b>сөрөг үржигдэхүүн</b> гаргана.</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=ITEMS; window.WS_TITLE='Ерөнхий үржигдэхүүн гаргах (нэг гишүүнт)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=17"></script>
</body>
</html>
