<!DOCTYPE html>
<html lang="mn">
<head>

<title>Хүндийг хэмжих-3 (3-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1px solid #c3d6ee;border-radius:2px;background-color:#fff;background-image:linear-gradient(to right,#dbe6f5 1px,transparent 1px),linear-gradient(to bottom,#dbe6f5 1px,transparent 1px);background-size:19px 19px;height:16mm;margin-top:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wk.wkc{height:auto;overflow:hidden}
  .cg{--c:19px;position:relative;margin:19px 0 19px 19px}
  .cg span{position:absolute;width:var(--c);height:var(--c);line-height:var(--c);text-align:center;font-size:13.5px;font-weight:600;color:#1a1030;font-family:'Segoe UI',Arial,sans-serif}
  .cg span.sg{transform:translateY(-50%);font-weight:700;color:#5a32d6}
  .cg .hl{position:absolute;height:0;border-top:1.6px solid #1a1030;margin-top:-0.8px}
  .cg .vl{position:absolute;width:0;border-left:1.6px solid #1a1030;margin-left:-0.8px}
  .cg.sm{--c:15px;margin:3px 0 1px;border:1px solid #d3e1f3;box-sizing:content-box;background-color:#fff;background-image:linear-gradient(to right,#dfe9f6 1px,transparent 1px),linear-gradient(to bottom,#dfe9f6 1px,transparent 1px);background-size:15px 15px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cg.sm span{font-size:10.5px}
  .asol{display:inline-block;vertical-align:top;margin:0 0 0 12px}
  .task{break-after:avoid;page-break-after:avoid}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
// ══════════ g3core.js — 3-р ангийн нийтлэг хөдөлгүүр (g5core + баганан бичиглэл) ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}

// ══════════ 4-р анги: тоо бичих, дөрвөлжин тор, баганан бичиглэл ══════════
// nf(n): KaTeX доторх тоо — 5+ оронтойг мянгатаар \, зайтай (24\,175), 4 оронтойг зайгүй (1734) — сурах бичгийн дагуу
function nf(n){var neg=n<0,s=String(Math.abs(n));if(s.length>=5)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,'\\,');return (neg?'-':'')+s;}
// nt(n): энгийн текстэд (үгэн бодлого, $-гүй) — 24 175 (тасрахгүй зай)
function nt(n){var neg=n<0,s=String(Math.abs(n));if(s.length>=5)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'−':'')+s;}
// Бодолтын зайн өндөр (мм) → торны 19px нүдний бүхэл тоо (дэвтрийн ~5 мм дөрвөлжин)
function g4wk(mm){return Math.max(2,Math.round((+mm||20)*3.7795/19))*19+'px';}

// ── Нүдний тор: cells [{r,c,t,cls}], lines [{t:'h'|'v',r,c,len}] ──
//   h: r-р мөрний ДООД ирмэг дээр c-ээс len нүд; v: c-р баганын ЗҮҮН ирмэг дээр r-ээс len мөр.
//   cls:'sg' — тэмдэг (×, +, −) хагас мөр дээш (хоёр мөрийн дунд).
function cgHtml(R,C,cells,lines,cls){
  var h='<div class="cg'+(cls?' '+cls:'')+'" style="width:calc(var(--c)*'+C+');height:calc(var(--c)*'+R+')">';
  cells.forEach(function(x){h+='<span class="'+(x.cls||'d')+'" style="left:calc(var(--c)*'+x.c+');top:calc(var(--c)*'+x.r+')">'+x.t+'</span>';});
  lines.forEach(function(l){
    if(l.t==='h')h+='<i class="hl" style="left:calc(var(--c)*'+l.c+');top:calc(var(--c)*'+(l.r+1)+');width:calc(var(--c)*'+l.len+')"></i>';
    else h+='<i class="vl" style="left:calc(var(--c)*'+l.c+');top:calc(var(--c)*'+l.r+');height:calc(var(--c)*'+l.len+')"></i>';
  });
  return h+'</div>';
}
// s мөрийн цифрүүдийг r-р мөрөнд, сүүлийн цифр нь end баганад байхаар (баруун тийш тэгшилж) байрлуулна
function cgPut(cells,s,r,end){s=String(s);for(var i=0;i<s.length;i++)cells.push({r:r,c:end-(s.length-1-i),t:s[i]});}

// ── Баганан үржүүлэх (сурах бичиг 33–34, 40: хэсэгчилсэн үржвэрийг ТЭГТЭЙ нь бичнэ: 990, 1980) ──
// Буцаах: {q: асуултын тор (2 үржигдэхүүн + зураас), s: бүрэн бодолт, R: бодолтын мөрийн тоо}
function colMul(a,b){
  var A=String(a),B=String(b),P=String(a*b),m=B.length,parts=[];
  for(var i=0;i<m;i++){var d=+B[m-1-i];if(d)parts.push(String(a*d*Math.pow(10,i)));}
  var many=parts.length>1,W=Math.max(A.length,B.length+1,P.length);
  parts.forEach(function(p){W=Math.max(W,p.length);});
  var C=W+1,end=W;
  function head(cells,lines){cgPut(cells,A,0,end);cgPut(cells,B,1,end);cells.push({r:1,c:end-Math.max(A.length,B.length),t:'×',cls:'sg'});
    lines.push({t:'h',r:1,c:end-Math.max(A.length,B.length,P.length)+1,len:Math.max(A.length,B.length,P.length)});}
  var R=many?3+parts.length:3;
  var qc=[],ql=[];head(qc,ql);
  var sc=[],sl=[];head(sc,sl);
  if(many){
    parts.forEach(function(p,i){cgPut(sc,p,2+i,end);});
    sc.push({r:3,c:end-Math.max.apply(null,parts.map(function(p){return p.length;})),t:'+',cls:'sg'});
    sl.push({t:'h',r:1+parts.length,c:end-P.length+1,len:P.length});
    cgPut(sc,P,2+parts.length,end);
  } else cgPut(sc,P,2,end);
  return {q:cgHtml(R+1,C+1,qc,ql),s:cgHtml(R,C,sc,sl,'sm'),R:R};
}

// ── Баганан (булангаар) хуваах — товч арга (сурах бичиг 40, 43: хасагдахуун мөр бүрт буулгасан цифртэй) ──
// a ≥ b > 0. Үлдэгдэлтэй байж болно. Буцаах: {q, s, R, quo, rem}
function colDiv(a,b){
  var A=String(a),n=A.length,Bs=String(b),quo=Math.floor(a/b),Q=String(quo),rem=a%b;
  var pos=0,cur=+A[0];
  while(cur<b&&pos<n-1){pos++;cur=cur*10+(+A[pos]);}
  var seq=[],prevV=cur,prevEnd=pos,guard=0;
  while(guard++<40){
    var qd=Math.floor(cur/b),pr=qd*b;
    seq.push({k:'p',v:pr,end:pos,above:prevV});
    var r=cur-pr;pos++;
    if(pos>=n){seq.push({k:'r',v:r,end:n-1});break;}
    cur=r*10+(+A[pos]);
    while(cur<b&&pos<n-1){pos++;cur=cur*10+(+A[pos]);}
    if(cur<b){seq.push({k:'r',v:cur,end:n-1});break;}
    seq.push({k:'c',v:cur,end:pos});prevV=cur;
  }
  var qw=Math.max(Bs.length,Q.length),qwMax=Math.max(Bs.length,n-Bs.length+1);
  var C=1+n+Math.max(qw,qwMax)+1,R=1+seq.length;
  function col(i){return 1+i;}                        // A-ийн i-р цифрийн багана
  function head(cells,lines,lw){cgPut(cells,A,0,col(n-1));cgPut(cells,Bs,0,col(n-1)+Bs.length);
    lines.push({t:'v',r:0,c:col(n-1)+1,len:2});lines.push({t:'h',r:0,c:col(n-1)+1,len:lw});}
  var qc=[],ql=[];head(qc,ql,qwMax);
  var sc=[],sl=[];head(sc,sl,qw);
  cgPut(sc,Q,1,col(n-1)+Q.length);
  seq.forEach(function(x,i){
    var rr=1+i,e=col(x.end);
    cgPut(sc,x.v,rr,e);
    if(x.k==='p'){var w=Math.max(String(x.v).length,String(x.above).length);
      sc.push({r:rr,c:e-w,t:'−',cls:'sg'});sl.push({t:'h',r:rr,c:e-w+1,len:w});}
  });
  return {q:cgHtml(R+1,C,qc,ql),s:cgHtml(R,C,sc,sl,'sm'),R:R,quo:quo,rem:rem};
}

// ── Баганан нэмэх / хасах (2–3 нэмэгдэхүүн; хасахад a ≥ b) ──
function colAddSub(nums,op){
  var res=op==='+'?nums.reduce(function(s,x){return s+x;},0):nums[0]-nums[1];
  var S=nums.map(String),Rs=String(res),W=Math.max(Rs.length,Math.max.apply(null,S.map(function(s){return s.length;})));
  var C=W+1,end=W,k=S.length,R=k+1;
  function head(cells,lines){S.forEach(function(s,i){cgPut(cells,s,i,end);});
    cells.push({r:k-1,c:end-W,t:op==='+'?'+':'−',cls:'sg'});lines.push({t:'h',r:k-1,c:1,len:W});}
  var qc=[],ql=[];head(qc,ql);
  var sc=[],sl=[];head(sc,sl);cgPut(sc,Rs,k,end);
  return {q:cgHtml(R+1,C+1,qc,ql),s:cgHtml(R,C,sc,sl,'sm'),R:R,res:res};
}
// Хариуны TeX: хуваах (үлдэгдэлтэй бол сурах бичгийн дагуу «(үлд 3)»), үржих
function divAnsTex(a,b){var q=Math.floor(a/b),r=a%b;return nf(a)+'\\div '+nf(b)+'='+nf(q)+(r?'\\text{ (үлд }'+r+'\\text{)}':'');}
function mulAnsTex(a,b){return nf(a)+'\\times '+nf(b)+'='+nf(a*b);}
function colAdd(a,b,c){return colAddSub(c===undefined?[a,b]:[a,b,c],'+');}
function colSub(a,b){return colAddSub([a,b],'−');}
// ══════════ g3ch2.js — II БҮЛЭГ. ХЭМЖИГДЭХҮҮН БА БОДЛОГО (3-р анги) ══════════
// Сурах бичгийн 95–152 хуудасны дасгалын хэлбэрээр.
// g3core.js энэ файлын ӨМНӨ залгагдана.

// ───────── g3ch2.sub01.js ─────────
// ─────────────────────────────────────────────────────────────────────────────
// 3-р анги · II бүлэг · 2.01 — Хүндийг хэмжих
// Сурах бичиг х.95–98 (PDF 1–4) «ХҮНДИЙГ ХЭМЖИХ» ба х.135–138 (PDF 41–44) «ХЭМЖИХ»
//
//   431, 433  жинлүүрийн хуваарь унших (0–250 г нь 5 хуваарь → 50 г)  → g_201_dialRead
//   668       хуваарьт жинлүүрийн заалт (40 кг, 80 кг)                → g_201_dialKg
//   668       2000 г, 4000 г жинлүүр → кг, г-ээр илэрхийлэх           → g_201_dialBig
//   435       нэгжүүдийн хамаарал 1т=10ц=1000кг, 1ц=100кг, 1кг=1000г, 1г=1000мг
//   438 а–г,з 7 ц = … кг, 12 т = … ц, 9 г = … мг, 10 кг = … г         → g_201_unitBig
//   438 д–ж   2300 кг = … ц, 580 ц = … т, 7000 г = … кг               → g_201_unitSmall
//   439 а,в,д 3 кг 20 г = … г, 2 г 500 мг = … мг, 4 т 5 ц = … ц       → g_201_mixToSmall
//   439 б,г,е 2500 г = … кг … г, 240 кг = … ц … кг, 6700 кг = … т … кг→ g_201_smallToMix
//   440       8 кг 500 г □ 8 кг 501 г, 2 т □ 20 ц, 3200 г □ 3 кг 20 г → g_201_cmp
//   444, 445  өсөх/буурах эрэмбэ, их-багын зөрөө                      → g_201_order
//   445       хэмжээ бүр дээр хэдийг нэмэхэд 10 кг болох вэ           → g_201_addTo
//   441 а,в   34 кг + 91 кг, 5700 г + 2900 г (баганаар)               → g_201_addSubCol
//   441 д,б   3 кг 200 г + 1 кг 600 г, 3 кг 200 г − 1 кг 600 г        → g_201_mixAddSub
//   441 г, Жишээ 3: 974 г × 6, 3 ц 58 кг × 9                          → g_201_mulCol
//   441 е, Жишээ 3: 4 кг 581 г ÷ 9, 296 кг ÷ 8                        → g_201_divCol
//   443, 667  ямар нэгжээр хэмжих вэ (баллуур, машин, хүүхэд)         → g_201_unitChoose
//   436       нэг шуудай 20 кг → хэдэн шуудай 1 ц, 1 т болох вэ       → g_201_wordSack
//   449 б     237 кг улаан лоолийг 6 кг-аар савлах                    → g_201_wordPack
//   671       20 ширээ × 150 г будаг, 4 кг будгаас хэд үлдэх вэ       → g_201_wordPaint
// ─────────────────────────────────────────────────────────────────────────────

var NM201 = ['Болд', 'Сараа', 'Батаа', 'Дулмаа', 'Анар', 'Оюунаа', 'Тэмүүлэн', 'Намуун', 'Хулан', 'Ганбат', 'Цэцэгээ', 'Зоригт'];

// Хүндийн нэгжийн хос: B — том нэгж, S — жижиг нэгж, f — хамаарлын итгэлцүүр
var FAM201 = [
  { B: 'кг', S: 'г', f: 1000 },
  { B: 'г', S: 'мг', f: 1000 },
  { B: 'т', S: 'ц', f: 10 },
  { B: 'ц', S: 'кг', f: 100 },
  { B: 'т', S: 'кг', f: 1000 }
];

// v (жижиг нэгжээр) → «8 кг 600 г» хэлбэр. Том хэсэг нь 0 бол null.
function big201(v, F) {
  var B = Math.floor(v / F.f), S = v % F.f;
  if (B < 1) return null;
  return S ? ('$' + nf(B) + '$ ' + F.B + ' $' + nf(S) + '$ ' + F.S) : ('$' + nf(B) + '$ ' + F.B);
}

// ── Хуваарьт жинлүүрийн SVG (сурах бичиг 433, 668) ──────────────────────────
//   mx — даац (бүтэн эргэлт), mj — том хуваарийн алхам, mn — жижиг хуваарийн алхам
function dial201(mx, mj, mn, unit, val) {
  var cx = 66, cy = 60, R = 52, g = '', v, p1, p2, mjr;
  function pt(x, r) {
    var th = (-90 + 360 * x / mx) * Math.PI / 180;
    return [(cx + r * Math.cos(th)).toFixed(1), (cy + r * Math.sin(th)).toFixed(1)];
  }
  g += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="#fff" stroke="#555" stroke-width="1.4"/>';
  g += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R - 4) + '" fill="none" stroke="#c8c8d8" stroke-width="0.8"/>';
  for (v = 0; v < mx; v += mn) {
    mjr = (v % mj === 0);
    p1 = pt(v, R - 4); p2 = pt(v, mjr ? R - 13 : R - 8);
    g += '<line x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '" stroke="#555" stroke-width="' + (mjr ? 1.3 : 0.7) + '"/>';
  }
  for (v = 0; v < mx; v += mj) {
    p1 = pt(v, R - 22);
    g += '<text x="' + p1[0] + '" y="' + (+p1[1] + 3).toFixed(1) + '" font-size="7.5" text-anchor="middle" fill="#333">' + v + '</text>';
  }
  p1 = pt(val, R - 28);
  g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p1[0] + '" y2="' + p1[1] + '" stroke="#7B52EE" stroke-width="2.2" stroke-linecap="round"/>';
  g += '<circle cx="' + cx + '" cy="' + cy + '" r="2.6" fill="#7B52EE"/>';
  g += '<text x="' + cx + '" y="126" font-size="9" text-anchor="middle" fill="#555">' + unit + '</text>';
  return '<svg viewBox="0 0 132 132" width="128">' + g + '</svg>';
}

// ── 1. Жинлүүрийн заалт — граммаар (433) ────────────────────────────────────
function g_201_dialRead() {
  var S = pick([{ mx: 200, mj: 25, mn: 5 }, { mx: 400, mj: 50, mn: 10 },
                { mx: 500, mj: 50, mn: 10 }, { mx: 1000, mj: 250, mn: 50 }]);
  var v = S.mn * rnd(1, S.mx / S.mn - 1);
  return {
    q: 'Даац: $' + nf(S.mx) + '$ г',
    a: '$' + nf(v) + '$ г',
    fig: dial201(S.mx, S.mj, S.mn, 'грамм', v),
    key: '201dr:' + S.mx + ':' + v
  };
}

// ── 2. Жинлүүрийн заалт — килограммаар (668) ────────────────────────────────
function g_201_dialKg() {
  var S = pick([{ mx: 10, mj: 2, mn: 1 }, { mx: 20, mj: 2, mn: 1 },
                { mx: 40, mj: 5, mn: 1 }, { mx: 80, mj: 10, mn: 2 }]);
  var v = S.mn * rnd(1, S.mx / S.mn - 1);
  return {
    q: 'Даац: $' + S.mx + '$ кг',
    a: '$' + v + '$ кг',
    fig: dial201(S.mx, S.mj, S.mn, 'килограмм', v),
    key: '201dk:' + S.mx + ':' + v
  };
}

// ── 3. Жинлүүрийн заалт → кг ба г (668-ын 2000 г, 4000 г жинлүүр) ───────────
function g_201_dialBig() {
  var S = pick([{ mx: 2000, mj: 250, mn: 50 }, { mx: 4000, mj: 500, mn: 100 }]);
  var k = Math.floor(1000 / S.mn);
  var v = S.mn * rnd(k + 1, S.mx / S.mn - 1);
  if (v % 1000 === 0) return null;
  return {
    q: 'Даац: $' + nf(S.mx) + '$ г',
    a: '$' + nf(v) + '$ г $=' + Math.floor(v / 1000) + '$ кг $' + (v % 1000) + '$ г',
    fig: dial201(S.mx, S.mj, S.mn, 'грамм', v),
    key: '201db:' + S.mx + ':' + v
  };
}

// ── 4. Том нэгж → жижиг нэгж: үржүүлнэ (438 а–г, Жишээ 1) ───────────────────
function g_201_unitBig() {
  var F = pick(FAM201);
  var n = F.f === 10 ? rnd(2, 12) : rnd(2, 9);
  return {
    q: '$' + n + '$ ' + F.B + ' $=\\square$ ' + F.S,
    a: '$' + n + '\\times ' + nf(F.f) + '=' + nf(n * F.f) + '$, тиймээс $' + n + '$ ' + F.B + ' $=' + nf(n * F.f) + '$ ' + F.S,
    key: '201ub:' + F.B + F.S + ':' + n
  };
}

// ── 5. Жижиг нэгж → том нэгж: хуваана (438 д–ж, Жишээ 1) ────────────────────
function g_201_unitSmall() {
  var F = pick(FAM201);
  var n = F.f === 1000 ? rnd(2, 9) : rnd(2, 99);
  var V = n * F.f;
  return {
    q: '$' + nf(V) + '$ ' + F.S + ' $=\\square$ ' + F.B,
    a: '$' + nf(V) + '\\div ' + nf(F.f) + '=' + n + '$, тиймээс $' + nf(V) + '$ ' + F.S + ' $=' + n + '$ ' + F.B,
    key: '201us:' + F.B + F.S + ':' + n
  };
}

// ── 6. Холимог нэгж → жижиг нэгж (439 а,в,д; Жишээ 2 а) ─────────────────────
function g_201_mixToSmall() {
  var F = pick(FAM201), a = rnd(1, 9), b;
  if (F.f === 10) b = rnd(1, 9);
  else if (F.f === 100) b = pick([rnd(1, 9), rnd(10, 99)]);
  else b = pick([rnd(1, 9), rnd(10, 99), rnd(100, 999)]);
  var V = a * F.f + b;
  return {
    q: '$' + a + '$ ' + F.B + ' $' + nf(b) + '$ ' + F.S + ' $=\\square$ ' + F.S,
    a: '$' + a + '$ ' + F.B + ' $=' + a + '\\times ' + nf(F.f) + '=' + nf(a * F.f) + '$ ' + F.S + ', нийт $' + nf(a * F.f) + '+' + nf(b) + '=' + nf(V) + '$ ' + F.S,
    key: '201mts:' + F.B + F.S + ':' + a + '_' + b
  };
}

// ── 7. Жижиг нэгж → холимог нэгж (439 б,г,е; Жишээ 2 б) ─────────────────────
function g_201_smallToMix() {
  var F = pick(FAM201), a = rnd(1, 9), b;
  if (F.f === 10) b = rnd(1, 9);
  else if (F.f === 100) b = pick([rnd(1, 9), rnd(10, 99)]);
  else b = pick([rnd(1, 9), rnd(10, 99), rnd(100, 999)]);
  var V = a * F.f + b;
  return {
    q: '$' + nf(V) + '$ ' + F.S + ' $=\\square$ ' + F.B + ' $\\square$ ' + F.S,
    a: '$' + nf(V) + '$ ' + F.S + ' $=' + nf(a * F.f) + '$ ' + F.S + ' $+' + nf(b) + '$ ' + F.S + ' $=' + a + '$ ' + F.B + ' $' + nf(b) + '$ ' + F.S,
    key: '201stm:' + F.B + F.S + ':' + a + '_' + b
  };
}

// ── 8. Жиших (440) ──────────────────────────────────────────────────────────
function g_201_cmp() {
  var F = pick(FAM201), a = rnd(1, 9), b, d;
  if (F.f === 10) { b = rnd(1, 9); d = pick([0, 1, -1, 2, -2]); }
  else if (F.f === 100) { b = rnd(5, 95); d = pick([0, 1, -1, 5, -5, 10, -10]); }
  else { b = rnd(20, 980); d = pick([0, 1, -1, 10, -10, 20, -20, 100, -100]); }
  var V1 = a * F.f + b, V2 = V1 + d;
  // a=9, b+d>1000 үед V2 нь 10 000-аас хэтэрч байв (ж: 10 012 мг) — 3-р ангийн хүрээнээс гарна
  if (V2 <= 0 || V2 > 10000) return null;
  var L = '$' + a + '$ ' + F.B + ' $' + nf(b) + '$ ' + F.S;
  var R = (V2 % F.f === 0) ? ('$' + nf(V2 / F.f) + '$ ' + F.B) : ('$' + nf(V2) + '$ ' + F.S);
  var x1 = V1, x2 = V2, Lt = L, Rt = R;
  if (rnd(0, 1)) { Lt = R; Rt = L; x1 = V2; x2 = V1; }
  var sg = x1 < x2 ? '\\lt' : (x1 > x2 ? '\\gt' : '=');
  return {
    q: Lt + ' $\\;\\square\\;$ ' + Rt,
    a: Lt + ' $' + sg + '$ ' + Rt + ', учир нь $' + nf(x1) + sg + nf(x2) + '$ (' + F.S + ')',
    key: '201cmp:' + F.B + F.S + ':' + a + '_' + b + '_' + d + '_' + (Lt === L ? 0 : 1)
  };
}

// ── 9. Эрэмбэлэх, их-багын зөрөө (444, 445) ─────────────────────────────────
function form201(v, k) {
  if (k === 0) return '$' + nf(v) + '$ кг';
  if (k === 1) return '$' + nf(v / 100) + '$ ц';
  var t = Math.floor(v / 1000), c = (v % 1000) / 100;
  return c ? ('$' + t + '$ т $' + c + '$ ц') : ('$' + t + '$ т');
}
function g_201_order() {
  var vals = [], guard = 0, v;
  while (vals.length < 3 && guard++ < 60) { v = rnd(10, 98) * 100; if (vals.indexOf(v) < 0) vals.push(v); }
  if (vals.length < 3) return null;
  var fs = shuffle([0, 1, 2]);
  var txt = vals.map(function (x, i) { return form201(x, fs[i]); });
  var asc = rnd(0, 1);
  var idx = [0, 1, 2].sort(function (p, r) { return asc ? vals[p] - vals[r] : vals[r] - vals[p]; });
  var sorted = idx.map(function (i) { return txt[i]; });
  var mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
  return {
    q: (asc ? 'Өсөх' : 'Буурах') + ' эрэмбээр: ' + txt.join(', '),
    a: sorted.join(', ') + '. Зөрөө: $' + nf(mx) + '-' + nf(mn) + '=' + nf(mx - mn) + '$ (кг)',
    key: '201or:' + vals.join('_') + ':' + fs.join('') + ':' + asc
  };
}

// ── 10. Хэдийг нэмэхэд 10 кг болох вэ (445) ─────────────────────────────────
function g_201_addTo() {
  var k = rnd(1, 9), g = rnd(1, 19) * 50, v = k * 1000 + g, need = 10000 - v;
  // need < 1000 бол «0 кг 100 г» гэж бичих нь буруу — зөвхөн граммаар үлдээнэ
  var alt = big201(need, { B: 'кг', S: 'г', f: 1000 });
  return {
    q: '$' + k + '$ кг $' + nf(g) + '$ г',
    a: '$' + k + '$ кг $' + nf(g) + '$ г $=' + nf(v) + '$ г; $' + nf(10000) + '-' + nf(v) + '=' + nf(need) + '$ (г)' + (alt ? ', өөрөөр ' + alt : ''),
    key: '201at:' + v
  };
}

// ── 11. Баганаар нэмэх, хасах (441 а, в; Жишээ 3) ───────────────────────────
function g_201_addSubCol() {
  var F = pick([{ B: 'кг', S: 'г', f: 1000 }, { B: 'ц', S: 'кг', f: 100 }, { B: 'г', S: 'мг', f: 1000 }]);
  var op = rnd(0, 1), a, b, t;
  // 441 а: 340 кг + 910 кг (ц/кг), 441 в: 5700 г + 2900 г (кг/г, г/мг)
  if (F.f === 100) { a = rnd(12, 98) * 10; b = rnd(12, 98) * 10; }
  else { a = rnd(11, 88) * 100; b = rnd(11, 88) * 100; }
  if (op === 0 && a + b > 9900) return null;
  if (op === 1) { if (a === b) return null; if (a < b) { t = a; a = b; b = t; } }
  var res = op ? a - b : a + b;
  // «хариугаа том нэгжээр бич» гэсэн заавар биелэх ёстой: res нь дор хаяж 1 том нэгж
  if (res < F.f) return null;
  var c = op ? colSub(a, b) : colAdd(a, b);
  var cv = big201(res, F);
  return {
    q: '$' + nf(a) + '\\,\\text{' + F.S + '}' + (op ? '-' : '+') + nf(b) + '\\,\\text{' + F.S + '}$',
    a: '$' + nf(a) + (op ? '-' : '+') + nf(b) + '=' + nf(res) + '$ (' + F.S + ')' + (cv ? ', өөрөөр ' + cv : ''),
    key: '201asc:' + F.S + ':' + a + (op ? '-' : '+') + b,
    col: c.q, sol: c.s
  };
}

// ── 12. Холимог нэгжтэй нэмэх, хасах (441 б, д) ─────────────────────────────
function g_201_mixAddSub() {
  var F = pick([{ B: 'кг', S: 'г', f: 1000 }, { B: 'т', S: 'кг', f: 1000 },
                { B: 'ц', S: 'кг', f: 100 }, { B: 'г', S: 'мг', f: 1000 }]);
  var op = rnd(0, 1), a1 = rnd(2, 5), a2 = rnd(1, 3), b1, b2;
  if (F.f === 100) { b1 = rnd(10, 95); b2 = rnd(10, 95); }
  else { b1 = rnd(100, 950); b2 = rnd(100, 950); }
  var V1 = a1 * F.f + b1, V2 = a2 * F.f + b2;
  if (op === 1 && V1 <= V2) return null;
  var res = op ? V1 - V2 : V1 + V2;
  var cv = big201(res, F);
  return {
    q: '$' + a1 + '$ ' + F.B + ' $' + nf(b1) + '$ ' + F.S + ' $' + (op ? '-' : '+') + '$ $' + a2 + '$ ' + F.B + ' $' + nf(b2) + '$ ' + F.S,
    a: '$' + nf(V1) + (op ? '-' : '+') + nf(V2) + '=' + nf(res) + '$ (' + F.S + ')' + (cv ? ', өөрөөр ' + cv : ''),
    key: '201mas:' + F.S + ':' + V1 + (op ? '-' : '+') + V2
  };
}

// ── 13. Баганаар үржих (441 г; Жишээ 3: 974 г × 6) ──────────────────────────

var NM202 = ['Болд', 'Сараа', 'Батаа', 'Дулмаа', 'Анар', 'Оюунаа', 'Тэмүүлэн', 'Намуун', 'Хулан', 'Ганбат', 'Мөнхөө', 'Энхжин'];

// ── Форматын туслахууд ──────────────────────────────────────────────────────
function h202_lm(ml) {                      // 3450 → "3\,\text{л}\ 450\,\text{мл}"
  var L = Math.floor(ml / 1000), M = ml % 1000;
  if (L && M) return L + '\\,\\text{л}\\ ' + M + '\\,\\text{мл}';
  if (L) return L + '\\,\\text{л}';
  return M + '\\,\\text{мл}';
}
function h202_ml(v) { return nf(v) + '\\,\\text{мл}'; }
function h202_l(v) { return nf(v) + '\\,\\text{л}'; }
function h202_lmTxt(ml) {                   // энгийн текст дотор: "3 л 450 мл"
  var L = Math.floor(ml / 1000), M = ml % 1000;
  if (L && M) return L + ' л ' + M + ' мл';
  if (L) return L + ' л';
  return M + ' мл';
}
function h202_f(x) { return Math.round(x * 10) / 10; }

// ── Хуваарьтай сав (SVG) ────────────────────────────────────────────────────
// cap — савны багтаамж литрээр, fillMl — доторх шингэн мл-ээр,
// labelHalf — 500 мл-ийн хуваарийг бас тоогоор бичих эсэх
function h202_cup(cap, fillMl, labelHalf) {
  var x0 = 6, w = 92, yb = 148, yt = 20, u = (yb - yt) / cap, f = h202_f;
  var yF = yb - (fillMl / 1000) * u, g = '', i, y;
  g += '<rect x="' + f(x0 + 1.6) + '" y="' + f(yF) + '" width="' + f(w - 3.2) +
       '" height="' + f(yb - yF) + '" fill="#bfe3f7"/>';
  for (i = 1; i < 2 * cap; i += 2) {                       // 500 мл-ийн богино зураас
    y = yb - (i / 2) * u;
    g += '<line x1="' + f(x0 + 1.6) + '" y1="' + f(y) + '" x2="' + f(x0 + 10) +
         '" y2="' + f(y) + '" stroke="#5b5280" stroke-width="1"/>';
  }
  for (i = 1; i <= cap; i++) {                             // бүхэл литрийн хуваарь
    y = yb - i * u;
    g += '<line x1="' + f(x0 + 1.6) + '" y1="' + f(y) + '" x2="' + f(x0 + 16) +
         '" y2="' + f(y) + '" stroke="#3b3160" stroke-width="1.3"/>';
    g += '<text x="' + f(x0 + 20) + '" y="' + f(y + 3.4) + '" font-size="9" ' +
         'font-family="Segoe UI, Arial, sans-serif" fill="#2a2140">' + i + ' л</text>';
  }
  if (labelHalf) {
    for (i = 1; i < 2 * cap; i += 2) {
      y = yb - (i / 2) * u;
      var L = (i - 1) / 2;
      g += '<line x1="' + f(x0 + 1.6) + '" y1="' + f(y) + '" x2="' + f(x0 + 16) +
           '" y2="' + f(y) + '" stroke="#3b3160" stroke-width="1.3"/>';
      g += '<text x="' + f(x0 + 20) + '" y="' + f(y + 3.4) + '" font-size="9" ' +
           'font-family="Segoe UI, Arial, sans-serif" fill="#2a2140">' +
           (L ? L + ' л 500 мл' : '500 мл') + '</text>';
    }
  }
  g += '<rect x="' + x0 + '" y="10" width="' + w + '" height="140" fill="none" ' +
       'stroke="#3b3160" stroke-width="1.6"/>';
  return '<svg viewBox="0 0 104 160" width="104" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>';
}

// ── 1. Хуваарьтай саванг литрээр унших (512) ────────────────────────────────
function g_202_readCup() {
  var cap = rnd(3, 6), k = rnd(1, cap);
  return {
    q: '', fig: h202_cup(cap, k * 1000, false),
    a: '$' + h202_l(k) + '$',
    key: '202rc:' + cap + '_' + k

}

// ── 2. Хуваарьтай саванг л ба мл-ээр унших (513, 522) ───────────────────────
function g_202_readCupHalf() {

  // k=0 үед «500 мл = 500 мл» гэсэн хоосон давталт болох тул л-тэй үед нь л хөрвүүлэлтээ бичнэ
  return {
    q: '', fig: h202_cup(cap, ml, cap === 3),
    a: '$' + h202_lm(ml) + (k ? ' = ' + h202_ml(ml) : '') + '$',
    key: '202rh:' + cap + '_' + ml
  };
}

// ── 3. Хэмжих нэгж сонгох — л уу, мл үү (509, 510, 667) ─────────────────────
var IT202 = [

function g_202_unitPick() {

// ── 4. л ↔ мл энгийн шилжүүлэлт (514 а–е, 669 ж,з) ──────────────────────────
function g_202_convMix() {
  var a = rnd(2, 10);
  if (rnd(0, 1)) {
    return {
      q: '$' + h202_l(a) + '=\\underline{\\quad}\\,\\text{мл}$',
      a: '$' + h202_l(a) + '=' + a + '\\times 1000=' + h202_ml(a * 1000) + '$',
      key: '202cv:l' + a
    };
  }
  return {
    q: '$' + h202_ml(a * 1000) + '=\\underline{\\quad}\\,\\text{л}$',
    a: '$' + h202_ml(a * 1000) + '=' + nf(a * 1000) + '\\div 1000=' + h202_l(a) + '$',
    key: '202cv:m' + a
  };
}

// ── 5. л мл → мл (Жишээ 1 в, 514 ж,з,и) ─────────────────────────────────────
function g_202_lml2ml() {
  var L = rnd(1, 9), M = rnd(5, 995);
  return {
    q: '$' + h202_lm(L * 1000 + M) + '=\\underline{\\quad}\\,\\text{мл}$',
    a: '$' + h202_lm(L * 1000 + M) + '=' + h202_ml(L * 1000) + '+' + h202_ml(M) +
       '=' + h202_ml(L * 1000 + M) + '$',
    key: '202lm:' + (L * 1000 + M)
  };
}

// ── 6. мл → л мл (Жишээ 1 г, 515 а–е) ───────────────────────────────────────
function g_202_ml2lml() {
  var L = rnd(1, 9), M = rnd(3, 997), T = L * 1000 + M;
  return {
    q: '$' + h202_ml(T) + '=\\underline{\\quad}\\,\\text{л}\\ \\underline{\\quad}\\,\\text{мл}$',
    a: '$' + h202_ml(T) + '=' + h202_ml(L * 1000) + '+' + h202_ml(M) + '=' + h202_lm(T) + '$',
    key: '202mm:' + T
  };
}

// ── 7. Их нэгжээр тоймлох (524 а) ───────────────────────────────────────────
function g_202_roundUnit() {
  var L = rnd(1, 8), M = rnd(10, 990);
  if (M === 500) return null;
  var up = M > 500, R = up ? L + 1 : L;
  return {
    q: '$' + h202_lm(L * 1000 + M) + '\\approx\\underline{\\quad}\\,\\text{л}$',
    a: '$' + h202_ml(M) + '$ нь $500\\,\\text{мл}$-ээс ' + (up ? 'их' : 'бага') +
       ' тул $' + h202_lm(L * 1000 + M) + '\\approx' + h202_l(R) + '$',
    key: '202ru:' + (L * 1000 + M)
  };
}

// ── 8. Харьцуулах: >, <, = (516 в,е) ────────────────────────────────────────
function g_202_cmp() {
  var A = rnd(1050, 9850), d = rnd(0, 3) === 0 ? 0 : (rnd(0, 1) ? 1 : -1) * rnd(20, 850);
  var B = A + d;
  if (B < 1005 || B > 9995) return null;
  var swap = rnd(0, 1);                         // аль талыг нь л мл хэлбэрээр бичих
  var LT = swap ? h202_lm(A) : h202_ml(A);
  var RT = swap ? h202_ml(B) : h202_lm(B);
  var sg = A > B ? '\\gt' : (A < B ? '\\lt' : '=');
  return {
    q: '$' + LT + '\\ \\square\\ ' + RT + '$',
    a: '$' + h202_ml(A) + '\\ ' + sg + '\\ ' + h202_ml(B) + '$ тул $\\square$-д $' + sg + '$ тавина',
    key: '202cp:' + A + '_' + B + '_' + swap
  };
}

// ── 9. Баганаар нэмэх (Жишээ 2, 517 а–е, 521-1 а) ───────────────────────────
function g_202_addCol() {
  var A = rnd(1150, 6400), B = rnd(1120, 3600);
  if (A + B > 9980) return null;
  if ((A % 1000) + (B % 1000) < 1000 && rnd(0, 2)) return null;   // шилжүүлэлттэй нь илүү
  var mix = rnd(0, 1), c = colAdd(A, B);
  var LT = h202_lm(A), RT = mix ? h202_ml(B) : h202_lm(B);
  return {
    q: '$' + LT + '+' + RT + '$',
    a: '$' + h202_ml(A) + '+' + h202_ml(B) + '=' + h202_ml(A + B) + '=' + h202_lm(A + B) + '$',
    key: '202ac:' + A + '+' + B + '_' + mix, col: c.q, sol: c.s
  };
}

// ── 10. Баганаар хасах (Жишээ 2, 517 д,ж, 521-1 б) ──────────────────────────
function g_202_subCol() {
  var A = rnd(3100, 9900), B = rnd(1050, A - 900);
  if ((A % 1000) >= (B % 1000) && rnd(0, 2)) return null;          // зээлдэлттэй нь илүү
  var mix = rnd(0, 1), c = colSub(A, B);
  var RT = mix ? h202_ml(B) : h202_lm(B);
  return {
    q: '$' + h202_lm(A) + '-' + RT + '$',
    a: '$' + h202_ml(A) + '-' + h202_ml(B) + '=' + h202_ml(A - B) + '=' + h202_lm(A - B) + '$',
    key: '202sc:' + A + '-' + B + '_' + mix, col: c.q, sol: c.s
  };
}

// ── 11. Баганаар үржих (Жишээ 2, 517 з,и,к, 521-1 в) ────────────────────────
function g_202_mulCol() {
  var t = rnd(1, 2), A, b;
  if (t === 1) { b = rnd(2, 4); A = rnd(1050, Math.min(4700, Math.floor(9950 / b))); }
  else { b = rnd(3, 9); A = rnd(205, Math.min(999, Math.floor(9950 / b))); }
  var P = A * b;
  if (P > 9950) return null;
  var c = colMul(A, b);
  return {
    q: '$' + h202_lm(A) + '\\times ' + b + '$',
    a: '$' + h202_ml(A) + '\\times ' + b + '=' + h202_ml(P) + '=' + h202_lm(P) + '$',
    key: '202mc:' + A + 'x' + b, col: c.q, sol: c.s
  };
}

// ── 12. Баганаар хуваах (Жишээ 2, 517 л,м, 521-1 г) ─────────────────────────
function g_202_divCol() {
  var b = rnd(2, 9), q = rnd(102, Math.floor(9900 / b)), A = q * b;
  if (A < 620) return null;
  var c = colDiv(A, b);
  return {
    q: '$' + h202_lm(A) + '\\div ' + b + '$',
    a: '$' + h202_ml(A) + '\\div ' + b + '=' + h202_ml(q) + (q >= 1000 ? '=' + h202_lm(q) : '') + '$',
    key: '202dc:' + A + 'd' + b, col: c.q, sol: c.s
  };
}

// ── 13. Эрэмбэлээд их ба багын зөрөөг олох (523 а,г) ────────────────────────
function g_202_orderDiff() {
  var v = [], i, x, ok, tries = 0;
  while (v.length < 3 && tries++ < 200) {
    x = rnd(620, 9400); ok = true;
    for (i = 0; i < v.length; i++) if (Math.abs(v[i] - x) < 220) ok = false;
    if (ok) v.push(x);
  }
  if (v.length < 3) return null;
  var fm = [rnd(0, 1), rnd(0, 1), rnd(0, 1)];
  var sh = shuffle([0, 1, 2]);
  var txt = sh.map(function (i) { return '$' + (fm[i] ? h202_lm(v[i]) : h202_ml(v[i])) + '$'; }).join(', ');
  var s = v.slice().sort(function (p, r) { return p - r; });
  return {
    q: txt,
    a: 'Эрэмбэ: $' + h202_ml(s[0]) + '\\lt ' + h202_ml(s[1]) + '\\lt ' + h202_ml(s[2]) +
       '$. Зөрөө: $' + h202_ml(s[2]) + '-' + h202_ml(s[0]) + '=' + h202_ml(s[2] - s[0]) +
       '=' + h202_lm(s[2] - s[0]) + '$',
    key: '202od:' + s.join('_') + ':' + fm.join('')
  };
}

// ── 14. Хоёр саван дахь нийт хэмжээ (520) ───────────────────────────────────
function g_202_wordMore() {
  var A = rnd(1100, 3400), D = rnd(600, 2600), B = A + D;
  if (A + B > 9900) return null;
  // Хоёр үйлдэлтэй тул тор БҮРТ нь: 1) нөгөө савны хэмжээ, 2) нийт хэмжээ
  var c1 = colAdd(A, D), c2 = colAdd(A, B);
  return {
    q: 'Нэг саванд ' + h202_lmTxt(A) + ', нөгөө саванд түүнээс ' + h202_lmTxt(D) +
       '-ээр илүү цай байв. Хоёр саван дахь цайны нийт хэмжээг ол.',
    a: 'Нөгөө сав: $' + h202_ml(A) + '+' + h202_ml(D) + '=' + h202_ml(B) + '$. Нийт: $' +
       h202_ml(A) + '+' + h202_ml(B) + '=' + h202_ml(A + B) + '=' + h202_lm(A + B) + '$',
    key: '202wm:' + A + '_' + D, col: c1.q + c2.q, sol: c1.s + c2.s
  };
}

// ── 15. Юүлсний дараах үлдэгдэл (521-2) ─────────────────────────────────────
function g_202_wordPour() {
  var A = rnd(3100, 9600), B = rnd(1150, A - 950), nm = pick(NM202);
  if ((A % 1000) >= (B % 1000) && rnd(0, 2)) return null;
  var c = colSub(A, B);
  return {
    q: nm + ' саванд ' + h202_lmTxt(A) + ' ус хийжээ. Дараа нь ' + nt(B) +
       ' мл-ийг өөр сав руу юүлэв. Саванд хэдий хэмжээний ус үлдсэн бэ?',
    a: '$' + h202_ml(A) + '-' + h202_ml(B) + '=' + h202_ml(A - B) + '=' + h202_lm(A - B) + '$',
    key: '202wp:' + A + '_' + B, col: c.q, sol: c.s
  };
}

// ── 16. Усыг жижиг саванд суллах (519) ──────────────────────────────────────
function g_202_wordFill() {
  var c = rnd(2, 6), k = rnd(4, 12), T = c * k;
  var d = colDiv(T, c);
  return {
    q: 'Саванд ' + T + ' л ус байв. Усыг ' + c + ' л багтаамжтай хэдэн саванд суллах вэ?',
    a: '$' + h202_l(T) + '\\div ' + c + '=' + k + '$ сав',
    key: '202wf:' + c + '_' + k, col: d.q, sol: d.s
  };
}

// ── 17. Хамгийн цөөндөө хэдэн сав хэрэгтэй вэ (675 а,б) ─────────────────────
function g_202_wordBottles() {
  var c = rnd(2, 6), T = rnd(17, 47);
  if (T % c === 0) return null;
  var k = Math.floor(T / c), r = T % c;
  var d = colDiv(T, c);
  return {
    q: 'Саванд ' + T + ' л ус байв. Бүх усыг ' + c +
       ' л багтаамжтай саванд хийхэд хамгийн цөөндөө хэдэн сав хэрэгтэй вэ? Яагаад?',
    a: '$' + h202_l(T) + '\\div ' + c + '=' + k + '$ (үлдэгдэл $' + r + '$). Үлдсэн $' + h202_l(r) +
       '$-т бас нэг сав хэрэгтэй тул нийт $' + (k + 1) + '$ сав.',
    key: '202wb:' + T + '_' + c, col: d.q, sol: d.s
  };
}

// ── 18. Шүүс — анги хэдэн сурагчтай вэ (527) ────────────────────────────────
function g_202_wordJuice() {
  var per = pick([200, 250, 500]), N = rnd(4, 9), T = N * 1000;
  var k = T / per;
  if (k < 16 || k > 45) return null;
  var d = colDiv(T, per);
  return {
    q: 'Үдийн цайндаа нэг ангийн сурагчид ' + N + ' литр жимсний шүүс уув. Нэг сурагч ' +
       per + ' мл шүүс уусан бол уг анги хэдэн сурагчтай вэ?',
    a: '$' + h202_l(N) + '=' + h202_ml(T) + '$. $' + nf(T) + '\\div ' + per + '=' + k +
       '$ тул ангид $' + k + '$ сурагч байна.',
    key: '202wj:' + N + '_' + per, col: d.q, sol: d.s
  };
}

// ── 19. Усны тоолуур — 7 хоногийн зөрүү (526 а,б) ───────────────────────────
function g_202_wordMeter() {
  var A = rnd(180, 265), B = rnd(85, 140), D = A - B;
  if (D < 60) return null;
  // Хоёр үйлдэлтэй: 1) хоногийн зөрүү (хасах), 2) 7 хоногт (үржих) — тор хоёулаа байна
  var c1 = colSub(A, B), c2 = colMul(D, 7);
  return {
    q: 'Тоолуургүй айл хоногт ' + A + ' л, тоолууртай айл ' + B +
       ' л ус хэрэглэв. Тоолуургүй айл 7 хоногт тоолууртай айлаас хэдэн литр илүү ус хэрэглэх вэ?',
    a: 'Хоногт $' + A + '-' + B + '=' + D + '$ л илүү. 7 хоногт $' + D + '\\times 7=' +
       nf(D * 7) + '$ л илүү.',
    key: '202wt:' + A + '_' + B, col: c1.q + c2.q, sol: c1.s + c2.s
  };
}

// ───────── g3ch2.sub03.js ─────────
// ─────────────────────────────────────────────────────────────────────────────
// 3-р анги · II бүлэг · 2.03 — Урт, хугацааг хэмжих
// Сурах бичиг х.135–138 (PDF 41–44), "ХЭМЖИХ"
//
//   657  «4 цаг 37 мин = … мин»                        → g_203_timeToMin
//   657  «345 мин = … цаг … мин»                       → g_203_minToTime
//   660  «320 см □ 32 дм, 1526 м □ 999 м»              → g_203_lenCmp
//   660  «215 мин □ 3 цаг, 15 цаг 20 мин □ 15 цаг»     → g_203_timeCmp
//   661  «галт тэрэгний хуваарь: ирэх/явах/зогсох цаг» → g_203_clock
//   662  «2 өдөр × 40 мин + 3 өдөр × 35 мин → цаг,мин» → g_203_timeWordSum
//   665 б,е,з «2 дм, 4 дм, 8 дм…; 30 с, 1 мин 15 с…»   → g_203_seqPattern
//   669 а,б,в «8 дм = … см, 6 км = … м»                → g_203_lenConvSimple
//   669 и «8000 м = … км»                              → g_203_lenConvBack
//   672  «609 км + 382 км + 29 км — нийт зам»          → g_203_lenWord2
//   673 а,б,в,г «УБ–Эрдэнэт–Булган, замын дунд, 6 км/ц»→ g_203_lenWordRoute
//   674  «бичгийн хавчаарын уртыг шугамаар олох»       → g_203_ruler
//   (нийлмэл хэмжээ: 3 км 250 м ⇄ 3250 м)              → g_203_lenMixed, g_203_lenSplit
//   (уртыг баганаар нэмэх, хасах, үржих, хуваах)       → g_203_lenAddSub, g_203_lenMulCol, g_203_lenDivCol
//
// Хүрээ: 10 000 хүртэлх бүхэл тоо, үржүүлэгч/хуваагч нэг оронтой.
// g3core.js энэ файлын ӨМНӨ залгагдана.
// ─────────────────────────────────────────────────────────────────────────────

var NM203 = ['Болд', 'Сараа', 'Батаа', 'Дулмаа', 'Анар', 'Оюунаа', 'Тэмүүлэн', 'Намуун', 'Хулан', 'Ганбат'];

// ───────── туслахууд ─────────
// Нэгжийг KaTeX дотор бичих (\text тул кирилл үсэг зөв гарна)
function u203(t) { return '\\,\\text{' + t + '}'; }
// 08:40 хэлбэрийн цаг (энгийн текст)
function hm203(v) { var h = Math.floor(v / 60), m = v % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
// «2 цаг 15 минут» хэлбэрийн үргэлжлэх хугацаа
function dur203(v) {
  var h = Math.floor(v / 60), m = v % 60;
  if (h === 0) return m + ' минут';
  if (m === 0) return h + ' цаг';
  return h + ' цаг ' + m + ' минут';
}
// Нэгж хооронд шилжүүлэх ердийн асуулт
function cv203(a, au, b, bu, k) {
  return {
    q: '$' + nf(a) + u203(au) + '=\\square' + u203(bu) + '$',
    a: '$' + nf(a) + u203(au) + '=' + nf(b) + u203(bu) + '$',
    key: '203' + k
  };
}
// Зүй тогтлын гишүүнийг унших хэлбэрт оруулах
function sec203(s) { var m = Math.floor(s / 60), r = s % 60; return m === 0 ? (s + ' с') : (m + ' мин' + (r ? ' ' + r + ' с' : '')); }
function min203(v) { var h = Math.floor(v / 60), r = v % 60; return h === 0 ? (v + ' мин') : (h + ' цаг' + (r ? ' ' + r + ' мин' : '')); }
function met203(v) { return v % 1000 === 0 ? (v / 1000 + ' км') : (nt(v) + ' м'); }

// ══════════════════ 1-р хуудас: уртын нэгж ══════════════════

// 669 а,б,в,е: том нэгжээс жижиг нэгж рүү
function g_203_lenConvSimple() {
  var ty = rnd(1, 5), k, bu, su, f;
  if (ty === 1) { k = rnd(2, 9); bu = 'км'; su = 'м'; f = 1000; }
  else if (ty === 2) { k = rnd(2, 99); bu = 'м'; su = 'см'; f = 100; }
  else if (ty === 3) { k = rnd(2, 99); bu = 'м'; su = 'дм'; f = 10; }
  else if (ty === 4) { k = rnd(2, 99); bu = 'дм'; su = 'см'; f = 10; }
  else { k = rnd(2, 99); bu = 'см'; su = 'мм'; f = 10; }
  return cv203(k, bu, k * f, su, 'lcs:' + bu + su + ':' + k);
}

// 669 и: жижиг нэгжээс том нэгж рүү
function g_203_lenConvBack() {
  var ty = rnd(1, 5), k, bu, su, f;
  if (ty === 1) { k = rnd(2, 9); bu = 'км'; su = 'м'; f = 1000; }
  else if (ty === 2) { k = rnd(2, 99); bu = 'м'; su = 'см'; f = 100; }
  else if (ty === 3) { k = rnd(2, 99); bu = 'м'; su = 'дм'; f = 10; }
  else if (ty === 4) { k = rnd(2, 99); bu = 'дм'; su = 'см'; f = 10; }
  else { k = rnd(2, 99); bu = 'см'; su = 'мм'; f = 10; }
  return cv203(k * f, su, k, bu, 'lcb:' + bu + su + ':' + k);
}

// Нийлмэл хэмжээг нэг нэгжээр: 3 км 250 м = 3250 м
function g_203_lenMixed() {
  var ty = rnd(1, 4), A, B, bu, su, f;
  if (ty === 1) { A = rnd(1, 9); B = rnd(1, 99) * 10; bu = 'км'; su = 'м'; f = 1000; }
  else if (ty === 2) { A = rnd(2, 9); B = rnd(5, 99); bu = 'м'; su = 'см'; f = 100; }
  else if (ty === 3) { A = rnd(2, 9); B = rnd(1, 9); bu = 'м'; su = 'дм'; f = 10; }
  else { A = rnd(2, 9); B = rnd(1, 9); bu = 'дм'; su = 'см'; f = 10; }
  var v = A * f + B;
  return {
    q: '$' + A + u203(bu) + '\\ ' + B + u203(su) + '=\\square' + u203(su) + '$',
    a: '$' + A + u203(bu) + '\\ ' + B + u203(su) + '=' + nf(v) + u203(su) + '$',
    key: '203lm:' + bu + su + ':' + A + '_' + B
  };
}

// 660: уртыг харьцуулах (өөр нэгжтэй)
function g_203_lenCmp() {
  var ty = rnd(1, 5), L, R, lv, rv, k;
  if (ty === 1) {
    var b1 = rnd(11, 99), d1 = pick([-20, -10, 0, 10, 20]), a1 = b1 * 10 + d1;
    if (a1 <= 0) return null;
    L = nf(a1) + u203('см'); R = b1 + u203('дм'); lv = a1; rv = b1 * 10; k = '203cm1:' + a1 + '_' + b1;
  } else if (ty === 2) {
    var m2 = rnd(2, 20), d2 = pick([-50, -10, 0, 10, 50]), c2 = m2 * 100 + d2;
    L = nf(c2) + u203('см'); R = m2 + u203('м'); lv = c2; rv = m2 * 100; k = '203cm2:' + c2 + '_' + m2;
  } else if (ty === 3) {
    var k3 = rnd(1, 9), d3 = pick([-100, -50, 0, 50, 100]), v3 = k3 * 1000 + d3;
    L = nf(v3) + u203('м'); R = k3 + u203('км'); lv = v3; rv = k3 * 1000; k = '203cm3:' + v3 + '_' + k3;
  } else if (ty === 4) {
    var c4 = rnd(2, 99), d4 = pick([-5, -2, 0, 2, 5]), v4 = c4 * 10 + d4;
    if (v4 <= 0) return null;
    L = nf(v4) + u203('мм'); R = c4 + u203('см'); lv = v4; rv = c4 * 10; k = '203cm4:' + v4 + '_' + c4;
  } else {
    var un = pick(['км', 'м', 'см']), x5 = rnd(101, 998), y5 = x5 + pick([-30, -10, 0, 10, 30]);
    L = nf(x5) + u203(un); R = nf(y5) + u203(un); lv = x5; rv = y5; k = '203cm5:' + un + ':' + x5 + '_' + y5;
  }
  var sg = lv > rv ? '\\gt' : (lv < rv ? '\\lt' : '=');
  return { q: '$' + L + '\\ \\square\\ ' + R + '$', a: '$' + L + '\\ ' + sg + '\\ ' + R + '$', key: k };
}

// Уртыг баганаар нэмэх, хасах (ижил нэгжтэй)
function g_203_lenAddSub() {
  var un = pick(['км', 'м', 'см', 'мм']), op = pick(['+', '-']), a, b, res, c;
  if (op === '+') { a = rnd(125, 4800); b = rnd(125, 4800); res = a + b; c = colAdd(a, b); }
  else { a = rnd(1250, 9800); b = rnd(150, a - 150); res = a - b; c = colSub(a, b); }
  return {
    q: '$' + nf(a) + u203(un) + op + nf(b) + u203(un) + '$',
    a: '$' + nf(a) + op + nf(b) + '=' + nf(res) + u203(un) + '$',
    key: '203las:' + op + ':' + a + '_' + b + ':' + un,
    col: c.q, sol: c.s
  };
}

// 672 ба нийлмэл хэмжээтэй хоёр үйлдэлтэй бодлого
function g_203_lenWord2() {
  var ty = rnd(1, 3), nm = pick(NM203);
  if (ty === 1) {
    var A = rnd(3, 9), B = rnd(10, 95), C1 = rnd(1, A - 1), D = rnd(5, 95);
    var t1 = A * 100 + B, t2 = C1 * 100 + D, c1 = colSub(t1, t2);
    return {
      q: nm + ' ' + A + ' м ' + B + ' см урт туузтай байв. Үүнээс ' + C1 + ' м ' + D +
         ' см-ийг тайрч авчээ. Хэдэн сантиметр тууз үлдсэн бэ?',
      a: '$' + A + u203('м') + '\\ ' + B + u203('см') + '=' + nf(t1) + u203('см') + '$, $' +
         C1 + u203('м') + '\\ ' + D + u203('см') + '=' + nf(t2) + u203('см') + '$; $' +
         nf(t1) + '-' + nf(t2) + '=' + nf(t1 - t2) + u203('см') + '$.',
      key: '203w2a:' + t1 + '_' + t2, col: c1.q, sol: c1.s
    };
  }
  if (ty === 2) {
    var K = rnd(3, 9), M = rnd(1, 99) * 10, K2 = rnd(1, K - 1), M2 = rnd(1, 99) * 10;
    var s1 = K * 1000 + M, s2 = K2 * 1000 + M2, c2 = colSub(s1, s2);
    return {
      q: 'Жолооч ' + K + ' км ' + nt(M) + ' м урт замаар явахаар гарав. Тэр ' + K2 + ' км ' + nt(M2) +
         ' м явсан бол цааш хэдэн метр зам үлдсэн бэ?',
      a: '$' + nf(s1) + '-' + nf(s2) + '=' + nf(s1 - s2) + u203('м') + '$.',
      key: '203w2b:' + s1 + '_' + s2, col: c2.q, sol: c2.s
    };
  }
  var p = rnd(405, 900), q3 = rnd(205, 500), r3 = rnd(12, 60), c3 = colAdd(p, q3, r3);
  return {
    q: nm + ' онгоцоор ' + nt(p) + ' км, машинаар ' + nt(q3) + ' км, мориор ' + nt(r3) +
       ' км аялав. Нийт хэдэн километр аялсан бэ?',
    a: '$' + nf(p) + '+' + nf(q3) + '+' + nf(r3) + '=' + nf(p + q3 + r3) + u203('км') + '$.',
    key: '203w2c:' + p + '_' + q3 + '_' + r3, col: c3.q, sol: c3.s
  };
}

// ══════════════════ 2-р хуудас: хугацааны нэгж ══════════════════

// 657: хугацааг жижиг нэгжээр илэрхийлэх
function g_203_timeToMin() {
  var ty = rnd(1, 3);
  if (ty === 1) {
    var h = rnd(1, 11), m = rnd(1, 59);
    return {
      q: '$' + h + u203('цаг') + '\\ ' + m + u203('мин') + '=\\square' + u203('мин') + '$',
      a: '$' + h + '\\times 60+' + m + '=' + nf(h * 60 + m) + u203('мин') + '$',
      key: '203tm1:' + h + '_' + m
    };
  }
  if (ty === 2) {
    var h2 = rnd(2, 12);
    return {
      q: '$' + h2 + u203('цаг') + '=\\square' + u203('мин') + '$',
      a: '$' + h2 + '\\times 60=' + nf(h2 * 60) + u203('мин') + '$',
      key: '203tm2:' + h2
    };
  }
  var m3 = rnd(1, 9), s3 = rnd(1, 59);
  return {
    q: '$' + m3 + u203('мин') + '\\ ' + s3 + u203('с') + '=\\square' + u203('с') + '$',
    a: '$' + m3 + '\\times 60+' + s3 + '=' + nf(m3 * 60 + s3) + u203('с') + '$',
    key: '203tm3:' + m3 + '_' + s3
  };
}

// Хугацааны нэгж хоорондын шилжүүлэлт (хоног, долоо хоног, сар, жил)
function g_203_timeUnit() {
  var ty = rnd(1, 8), n;
  if (ty === 1) { n = rnd(2, 9); return cv203(n, 'хоног', n * 24, 'цаг', 'tu1:' + n); }
  if (ty === 2) { n = rnd(2, 9); return cv203(n, 'долоо хоног', n * 7, 'хоног', 'tu2:' + n); }
  if (ty === 3) { n = rnd(2, 9); return cv203(n, 'жил', n * 12, 'сар', 'tu3:' + n); }
  if (ty === 4) { n = rnd(2, 20); return cv203(n, 'мин', n * 60, 'с', 'tu4:' + n); }
  if (ty === 5) { n = rnd(2, 9); return cv203(n * 24, 'цаг', n, 'хоног', 'tu5:' + n); }
  if (ty === 6) { n = rnd(2, 9); return cv203(n * 7, 'хоног', n, 'долоо хоног', 'tu6:' + n); }
  if (ty === 7) { n = rnd(2, 9); return cv203(n * 12, 'сар', n, 'жил', 'tu7:' + n); }
  n = rnd(2, 20); return cv203(n * 60, 'с', n, 'мин', 'tu8:' + n);
}

// 657: 345 мин = 5 цаг 45 мин
function g_203_minToTime() {
  var ty = rnd(1, 2);
  if (ty === 1) {
    var v = rnd(70, 720);
    if (v % 60 === 0) return null;
    return {
      q: '$' + nf(v) + u203('мин') + '=\\square' + u203('цаг') + '\\ \\square' + u203('мин') + '$',
      a: '$' + nf(v) + u203('мин') + '=' + Math.floor(v / 60) + u203('цаг') + '\\ ' + (v % 60) + u203('мин') + '$',
      key: '203mt1:' + v
    };
  }
  var s = rnd(70, 600);
  if (s % 60 === 0) return null;
  return {
    q: '$' + nf(s) + u203('с') + '=\\square' + u203('мин') + '\\ \\square' + u203('с') + '$',
    a: '$' + nf(s) + u203('с') + '=' + Math.floor(s / 60) + u203('мин') + '\\ ' + (s % 60) + u203('с') + '$',
    key: '203mt2:' + s
  };
}

// 660: хугацааг харьцуулах
function g_203_timeCmp() {
  var ty = rnd(1, 5), L, R, lv, rv, k;
  if (ty === 1) {
    var h1 = rnd(2, 6), d1 = pick([-25, -10, 0, 10, 25]), v1 = h1 * 60 + d1;
    L = nf(v1) + u203('мин'); R = h1 + u203('цаг'); lv = v1; rv = h1 * 60; k = '203tc1:' + v1 + '_' + h1;
  } else if (ty === 2) {
    // m2 ≠ 0: «20 цаг 0 мин» гэсэн зохисгүй бичиглэл гаргахгүй (тэнцэх тохиолдлыг бусад төрөл хангана)
    var h2 = rnd(8, 20), m2 = pick([5, 10, 15, 20, 30, 45]);
    L = h2 + u203('цаг') + '\\ ' + m2 + u203('мин'); R = h2 + u203('цаг');
    lv = h2 * 60 + m2; rv = h2 * 60; k = '203tc2:' + h2 + '_' + m2;
  } else if (ty === 3) {
    var d3 = rnd(2, 5), v3 = d3 * 24 + pick([-6, -2, 0, 2, 6]);
    L = nf(v3) + u203('цаг'); R = d3 + u203('хоног'); lv = v3; rv = d3 * 24; k = '203tc3:' + v3 + '_' + d3;
  } else if (ty === 4) {
    var w4 = rnd(2, 6), v4 = w4 * 7 + pick([-3, -1, 0, 1, 3]);
    L = nf(v4) + u203('хоног'); R = w4 + u203('долоо хоног'); lv = v4; rv = w4 * 7; k = '203tc4:' + v4 + '_' + w4;
  } else {
    var m5 = rnd(2, 8), v5 = m5 * 60 + pick([-20, -5, 0, 5, 20]);
    L = nf(v5) + u203('с'); R = m5 + u203('мин'); lv = v5; rv = m5 * 60; k = '203tc5:' + v5 + '_' + m5;
  }
  var sg = lv > rv ? '\\gt' : (lv < rv ? '\\lt' : '=');
  return { q: '$' + L + '\\ \\square\\ ' + R + '$', a: '$' + L + '\\ ' + sg + '\\ ' + R + '$', key: k };
}

// 661: эхлэх / дуусах / үргэлжлэх хугацаа
function g_203_clock() {
  var ty = rnd(1, 3);
  var M5 = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
  var h = rnd(6, 19), m = pick([0].concat(M5)), dh, dm;
  if (ty === 2) {
    // «хэдэн цаг хэдэн минут явсан бэ?» — хариунд цаг БА минут хоёулаа байх ёстой
    dh = rnd(1, 3); dm = pick(M5);
  } else {
    dh = rnd(0, 3); dm = pick([0].concat(M5));
    if (dh === 0 && dm === 0) return null;
  }
  var st = h * 60 + m, du = dh * 60 + dm, en = st + du;
  if (en >= 24 * 60) return null;
  if (ty === 1) {
    return {
      q: 'Урлагийн тоглолт ' + hm203(st) + '-д эхэлж ' + dur203(du) +
         ' үргэлжилнэ. Тоглолт хэдэн цагт дуусах вэ?',
      a: hm203(st) + ' дээр ' + dur203(du) + ' нэмнэ: ' + hm203(en) + '-д дуусна.',
      key: '203ck1:' + st + '_' + du
    };
  }
  if (ty === 2) {
    return {
      q: 'Галт тэрэг ' + hm203(st) + '-д хөдөлж ' + hm203(en) +
         '-д буудалд ирэв. Замдаа хэдэн цаг хэдэн минут явсан бэ?',
      a: hm203(en) + ' − ' + hm203(st) + ' = ' + dur203(du) + ' явсан.',
      key: '203ck2:' + st + '_' + en
    };
  }
  return {
    q: 'Дугуйлан ' + hm203(en) + '-д дуусав. Дугуйлан ' + dur203(du) +
       ' үргэлжилсэн бол хэдэн цагт эхэлсэн бэ?',
    a: hm203(en) + ' дээрээс ' + dur203(du) + ' хасна: ' + hm203(st) + '-д эхэлсэн.',
    key: '203ck3:' + en + '_' + du
  };
}

// 662: давтагдах хичээллэх хугацааг цаг, минутаар
function g_203_timeWordSum() {
  var ty = rnd(1, 2), nm = pick(NM203);
  if (ty === 1) {
    var x = rnd(2, 3), y = rnd(2, 4), p = pick([30, 35, 40, 45, 50]), q1 = pick([25, 30, 35, 40, 45]);
    if (p === q1) return null;
    var t = x * p + y * q1;
    if (t % 60 === 0) return null;   // «цаг, минутаар» гэж асуусан тул «3 цаг 0 мин» гаргахгүй
    var c1 = colMul(p, x), c2 = colMul(q1, y), c3 = colAdd(p * x, q1 * y);
    return {
      q: nm + ' долоо хоногт ' + (x + y) + ' өдөр шатрын дугуйланд явдаг. Үүнээс ' + x +
         ' өдөр нь тус бүр ' + p + ' минут, ' + y + ' өдөр нь тус бүр ' + q1 +
         ' минут хичээллэдэг. Нийт хугацааг цаг, минутаар гаргаарай.',
      a: '$' + p + '\\times ' + x + '=' + nf(p * x) + '$, $' + q1 + '\\times ' + y + '=' + nf(q1 * y) +
         '$; нийт $' + nf(t) + u203('мин') + '=' + Math.floor(t / 60) + u203('цаг') + '\\ ' + (t % 60) + u203('мин') + '$.',
      key: '203tw1:' + x + '_' + p + '_' + y + '_' + q1,
      col: c1.q + c2.q + c3.q, sol: c1.s + c2.s + c3.s
    };
  }
  var r = rnd(20, 55), tot = r * 7, c4 = colMul(r, 7);
  return {
    q: nm + ' өдөр бүр ' + r + ' минут ном уншдаг. Долоо хоногт нийт хэдэн цаг хэдэн минут ном уншсан бэ?',
    a: '$' + r + '\\times 7=' + nf(tot) + u203('мин') + '=' + Math.floor(tot / 60) + u203('цаг') + '\\ ' + (tot % 60) + u203('мин') + '$.',
    key: '203tw2:' + r, col: c4.q, sol: c4.s
  };
}

// Нийлмэл хэмжээ болгон задлах: 3250 м = 3 км 250 м
function g_203_lenSplit() {
  var ty = rnd(1, 4), A, B, bu, su, f;
  if (ty === 1) { A = rnd(1, 9); B = rnd(1, 99) * 10; bu = 'км'; su = 'м'; f = 1000; }
  else if (ty === 2) { A = rnd(2, 9); B = rnd(5, 99); bu = 'м'; su = 'см'; f = 100; }
  else if (ty === 3) { A = rnd(2, 9); B = rnd(1, 9); bu = 'м'; su = 'дм'; f = 10; }
  else { A = rnd(2, 9); B = rnd(1, 9); bu = 'дм'; su = 'см'; f = 10; }
  var v = A * f + B;
  return {
    q: '$' + nf(v) + u203(su) + '=\\square' + u203(bu) + '\\ \\square' + u203(su) + '$',
    a: '$' + nf(v) + u203(su) + '=' + A + u203(bu) + '\\ ' + B + u203(su) + '$',
    key: '203ls:' + bu + su + ':' + A + '_' + B
  };
}

// 674: шугамаар хэмжих (хариуг зурган дээр бичээгүй — зөвхөн хуваарь харагдана)
function g_203_ruler() {
  var a = rnd(0, 30), L = rnd(23, 70), b = a + L;
  if (b > 100) return null;
  if (L % 10 === 0) return null;   // «сантиметр, миллиметрээр» гэж асуусан тул мм хэсэг 0 байж болохгүй
  var x0 = 20, u = 3, i, g = '';
  g += '<rect x="' + x0 + '" y="36" width="300" height="34" rx="2" fill="#f7f5ff" stroke="#6b5bb5" stroke-width="1"/>';
  for (i = 0; i <= 100; i++) {
    var x = x0 + i * u, hh = (i % 10 === 0) ? 16 : ((i % 5 === 0) ? 10 : 5);
    g += '<line x1="' + x + '" y1="36" x2="' + x + '" y2="' + (36 + hh) + '" stroke="#6b5bb5" stroke-width="' + (i % 10 === 0 ? 1.2 : 0.7) + '"/>';
    if (i % 10 === 0) g += '<text x="' + x + '" y="65" font-size="9" text-anchor="middle" fill="#4a3f8c">' + (i / 10) + '</text>';
  }
  g += '<text x="' + (x0 - 16) + '" y="65" font-size="8" fill="#4a3f8c">см</text>';
  g += '<rect x="' + (x0 + a * u) + '" y="12" width="' + (L * u) + '" height="16" rx="5" fill="#ded7fb" stroke="#7B52EE" stroke-width="1.3"/>';
  return {
    q: '',
    fig: '<svg viewBox="0 0 340 76" width="340" height="76">' + g + '</svg>',
    a: 'Урт $=' + b + '-' + a + '=' + L + u203('мм') + '=' + Math.floor(L / 10) + u203('см') +
       (L % 10 ? '\\ ' + (L % 10) + u203('мм') : '') + '$.',
    key: '203ru:' + a + '_' + b
  };
}

// Уртыг баганаар үржүүлэх
function g_203_lenMulCol() {
  var ty = rnd(1, 3), k = rnd(3, 9), a = rnd(105, 990), un, q, nm = pick(NM203);
  if (ty === 1) {
    un = 'см';
    q = 'Нэг тууз ' + nt(a) + ' см урт. Ийм ' + k + ' туузыг залгавал нийт урт хэдэн сантиметр болох вэ?';
  } else if (ty === 2) {
    un = 'км';
    q = 'Ачааны машин өдөрт ' + nt(a) + ' км зам туулдаг. ' + k + ' өдөрт нийт хэдэн километр зам туулах вэ?';
  } else {
    un = 'м';
    q = 'Цэцэрлэгт хүрээлэнг нэг тойроход ' + nt(a) + ' м зам болдог. ' + nm + ' ' + k +
        ' удаа тойрвол нийт хэдэн метр гүйх вэ?';
  }
  if (a * k > 9999) return null;
  var c = colMul(a, k);
  return {
    q: q, a: '$' + nf(a) + '\\times ' + k + '=' + nf(a * k) + u203(un) + '$',
    key: '203lmc:' + ty + ':' + a + 'x' + k, col: c.q, sol: c.s
  };
}

// Уртыг баганаар хуваах
function g_203_lenDivCol() {
  var ty = rnd(1, 4), b = rnd(2, 9), q0, a, txt, un;
  if (ty === 1) {                                   // богино хэмжээ: см
    q0 = rnd(20, 160); a = q0 * b; un = 'см';
    if (a < 150 || a > 999) return null;
    txt = nt(a) + ' см урт туузыг ' + b + ' тэнцүү хэсэгт хуваав. Нэг хэсэг нь хэдэн сантиметр вэ?';
  } else if (ty === 2) {                            // богино хэмжээ: м
    q0 = rnd(20, 160); a = q0 * b; un = 'м';
    if (a < 150 || a > 999) return null;
    txt = 'Цэцэрлэгийн ' + nt(a) + ' м урт хашааг ' + b + ' тэнцүү хэсэгт хуваана. Нэг хэсгийн урт хэдэн метр вэ?';
  } else if (ty === 3) {                            // урт зам: км
    q0 = rnd(120, 999); a = q0 * b; un = 'км';
    if (a < 1000 || a > 9999) return null;
    txt = 'Ачааны машин ' + nt(a) + ' км замыг ' + b + ' өдөрт тэнцүү хуваан туулав. Өдөрт хэдэн километр явсан бэ?';
  } else {                                          // гүйлтийн зам: м
    q0 = rnd(120, 999); a = q0 * b; un = 'м';
    if (a < 1000 || a > 9999) return null;
    txt = 'Тамирчин ' + nt(a) + ' м зайг ' + b + ' тэнцүү тойрог болгон гүйв. Нэг тойрог хэдэн метр вэ?';
  }
  var c = colDiv(a, b);
  return {
    q: txt, a: '$' + nf(a) + '\\div ' + b + '=' + nf(q0) + u203(un) + '$',
    key: '203ldc:' + ty + ':' + a + '/' + b, col: c.q, sol: c.s
  };
}

// 665 б, е, з: зүй тогтол (урт ба хугацааны дараалал)
function g_203_seqPattern() {
  var ty = rnd(1, 5), i, t = [], n = [], k;
  if (ty === 1) {
    var un = pick(['см', 'дм', 'м', 'км']), s = rnd(2, 20), d = rnd(2, 15);
    for (i = 0; i < 4; i++) t.push((s + i * d) + ' ' + un);
    for (i = 4; i < 7; i++) n.push((s + i * d) + ' ' + un);
    k = '203sq1:' + un + ':' + s + '_' + d;
  } else if (ty === 2) {
    var un2 = pick(['см', 'дм', 'м']), s2 = pick([2, 3, 5]);
    for (i = 0; i < 4; i++) t.push((s2 * Math.pow(2, i)) + ' ' + un2);
    for (i = 4; i < 7; i++) n.push((s2 * Math.pow(2, i)) + ' ' + un2);
    k = '203sq2:' + un2 + ':' + s2;
  } else if (ty === 3) {
    var s3 = pick([3200, 4800, 6400, 9600]);
    for (i = 0; i < 4; i++) t.push(met203(s3 / Math.pow(2, i)));
    for (i = 4; i < 7; i++) n.push(met203(s3 / Math.pow(2, i)));
    k = '203sq3:' + s3;
  } else if (ty === 4) {
    var s4 = pick([20, 30, 45]), d4 = pick([15, 20, 30, 45]);
    for (i = 0; i < 4; i++) t.push(sec203(s4 + i * d4));
    for (i = 4; i < 7; i++) n.push(sec203(s4 + i * d4));
    k = '203sq4:' + s4 + '_' + d4;
  } else {
    var s5 = pick([20, 25, 30, 40]), d5 = pick([20, 25, 30, 45]);
    for (i = 0; i < 4; i++) t.push(min203(s5 + i * d5));
    for (i = 4; i < 7; i++) n.push(min203(s5 + i * d5));
    k = '203sq5:' + s5 + '_' + d5;
  }
  return { q: t.join(', ') + ', …', a: n.join(', '), key: k };
}

// 673: замын бодлого (нийт зам, замын дунд, хугацаа)
function g_203_lenWordRoute() {
  var ty = rnd(1, 3);

      a: '$' + nf(d1) + '+' + nf(d2) + '=' + nf(d1 + d2) + u203('км') + '$.',
      key: '203wr1:' + d1 + '_' + d2, col: c.q, sol: c.s

  }
  if (ty === 2) {

         ' км. Морьтой хүн нэг сумаас хөдөлж замын яг дунд хүрэв. Тэр хэдэн километр зам туулсан бэ?',

  }
  // явган хүний хурд 4–6 км/ц, зам 3–8 цаг — бодитой хүрээ (12 цаг тасралтгүй явахгүй)
  var v = pick([4, 5, 6]), hh = rnd(3, 8), dd = v * hh, cv = colDiv(dd, v), nm = pick(NM203);
  return {
    q: nm + ' явганаар цагт ' + v + ' км зам туулдаг. Багийн төвөөс сумын төв хүртэл ' + nt(dd) +
       ' км бол тэр энэ замыг хэдэн цагт туулах вэ?',
    a: '$' + nf(dd) + '\\div ' + v + '=' + hh + '$ цаг.',
    key: '203wr3:' + v + '_' + dd, col: cv.q, sol: cv.s
  };
}

var NM204 = ['Болд', 'Сараа', 'Батаа', 'Дулмаа', 'Анар', 'Оюунаа', 'Тэмүүлэн', 'Намуун', 'Хулан', 'Ганбат', 'Сувдаа', 'Мөнхбат'];
var IT204 = ['дэвтэр', 'харандаа', 'баллуур', 'шугам', 'бал'];
function tw204() { var s = shuffle(NM204); return [s[0], s[1]]; }

// ── 1. Нийлбэр олох шууд бодлого (763, 765) ────────────────────────────────
function g_204_eAdd() {
  var ty = rnd(1, 4), x, y, q, un;

    q = 'Автобус ' + nt(d1) + ' км замыг ' + h1 + ' цагт туулав. Цаг тутамд хэдэн километр явсан бэ?';
    nmop = 'Хуваах'; ans = '$' + nf(d1) + '\\div ' + h1 + '=' + nf(v1) + '$ км';
  } else if (ty === 2) {
    var x2 = rnd(120, 460), k2 = rnd(3, 9);
    q = 'Нэг саванд ' + nt(x2) + ' грамм зөгийн бал багтана. ' + k2 + ' саванд нийт хэдэн грамм бал багтах вэ?';
    nmop = 'Үржих'; ans = '$' + nf(x2) + '\\times ' + k2 + '=' + nf(x2 * k2) + '$ грамм';
  } else if (ty === 3) {
    var x3 = rnd(1200, 4800), y3 = rnd(300, 1100);
    q = 'Талбайд ' + nt(x3) + ' мод тарихаар төлөвлөснөөс ' + nt(y3) + ' модыг нь тарьжээ. Хэдэн мод тарих үлдсэн бэ?';
    nmop = 'Хасах'; ans = '$' + nf(x3) + '-' + nf(y3) + '=' + nf(x3 - y3) + '$ мод';
  } else if (ty === 4) {
    var x4 = rnd(900, 3800), y4 = rnd(900, 3800);
    q = 'Эхний өдөр ' + nt(x4) + ' зорчигч, хоёр дахь өдөр ' + nt(y4) + ' зорчигч тээвэрлэв. Хоёр өдөрт нийт хэдэн зорчигч тээвэрлэсэн бэ?';
    nmop = 'Нэмэх'; ans = '$' + nf(x4) + '+' + nf(y4) + '=' + nf(x4 + y4) + '$ зорчигч';
  } else if (ty === 5) {
    var v5 = rnd(4, 9), t5 = rnd(30, 160), d5 = v5 * t5;
    q = 'Зөгий секундэд ' + v5 + ' метр зам туулдаг. ' + nt(d5) + ' метр замыг хэдэн секундэд туулах вэ?';
    nmop = 'Хуваах'; ans = '$' + nf(d5) + '\\div ' + v5 + '=' + nf(t5) + '$ секунд';
  } else {
    var w6 = rnd(180, 420), h6 = rnd(3, 7);
    q = 'Нарийн боовны цех өдөрт ' + nt(w6) + ' кг боов үйлдвэрлэдэг. ' + h6 + ' хоногт хэдэн килограмм боов үйлдвэрлэх вэ?';
    nmop = 'Үржих'; ans = '$' + nf(w6) + '\\times ' + h6 + '=' + nf(w6 * h6) + '$ кг';
  }
  return { q: q + ' Аль үйлдэл тохирохыг тодорхойл.', a: nmop + ' үйлдэл: ' + ans + '.', key: '204hc:' + ty + ':' + q.length + ':' + ans };
}

// ── 12. Мэдэгдэхгүй үржигдэхүүнийг олох (468 а, д) ─────────────────────────
function g_204_hBack() {
  var ty = rnd(1, 4), q, ans, nm = pick(NM204);
  if (ty === 1) {
    var k1 = rnd(3, 9), p1 = rnd(4, 11) * 100, c1 = k1 * p1;
    if (c1 > 9999) return null;
    q = nm + ' ижил үнэтэй ' + k1 + ' ширхэг дэвтэр аваад нийт ' + nt(c1) + ' төгрөг төлөв. Нэг дэвтэр хэдэн төгрөг вэ?';
    ans = '$\\square\\times ' + k1 + '=' + nf(c1)+ '$, иймд $' + nf(c1) + '\\div ' + k1 + '=' + nf(p1) + '$ төгрөг.';
    return { q: q, a: ans, key: '204hb:1:' + c1 + 'd' + k1 };
  }
  if (ty === 2) {
    var x2 = rnd(2, 9), m2 = rnd(15, 120), c2 = x2 * m2;
    q = 'Чихрийг хайрцаг тус бүрт ' + x2 + ' ширхэгээр савлаж, нийт ' + nt(c2) + ' чихэр савлав. Хэдэн хайрцаг болсон бэ?';
    ans = '$' + x2 + '\\times\\square=' + nf(c2) + '$, иймд $' + nf(c2) + '\\div ' + x2 + '=' + nf(m2) + '$ хайрцаг.';
    return { q: q, a: ans, key: '204hb:2:' + c2 + 'd' + x2 };
  }
  if (ty === 3) {
    var k3 = rnd(2, 9), p3 = rnd(60, 900), c3 = k3 * p3;
    q = 'Үржигдэхүүн $\\square$, үржигдэхүүн $' + k3 + '$, үржвэрийн утга $' + nf(c3) + '$. Мэдэгдэхгүй үржигдэхүүнийг ол.';
    ans = '$' + nf(c3) + '\\div ' + k3 + '=' + nf(p3) + '$, шалгалт: $' + nf(p3) + '\\times ' + k3 + '=' + nf(c3) + '$.';
    return { q: q, a: ans, key: '204hb:3:' + c3 + 'd' + k3 };
  }
  var k4 = rnd(2, 9), p4 = rnd(70, 950), c4 = k4 * p4;
  q = 'Үржигдэхүүн $' + k4 + '$, үржигдэхүүн $\\square$, үржвэрийн утга $' + nf(c4) + '$. Мэдэгдэхгүй үржигдэхүүнийг ол.';
  ans = '$' + nf(c4) + '\\div ' + k4 + '=' + nf(p4) + '$, шалгалт: $' + k4 + '\\times ' + nf(p4) + '=' + nf(c4) + '$.';
  return { q: q, a: ans, key: '204hb:4:' + c4 + 'd' + k4 };
}

// ── 13. Нэгж хугацааны замаар нийт замыг олох (471, 751, 753, 760) ─────────
function g_204_eRate() {
  var ty = rnd(1, 4), v, h, q, un;
  if (ty === 1) {
    v = rnd(180, 320); h = rnd(3, 8); un = 'км';
    q = 'Нисдэг тэрэг цагт ' + nt(v) + ' км зам туулдаг. ' + h + ' цагт хэдэн километр зам туулах вэ?';
  } else if (ty === 2) {
    v = rnd(850, 1100); h = rnd(2, 8); un = 'удаа';
    q = 'Хүн тайван байхдаа нэг цагт ' + nt(v) + ' удаа амьсгалдаг. ' + h + ' цагт хэдэн удаа амьсгалах вэ?';
  } else if (ty === 3) {
    v = rnd(280, 420); h = rnd(3, 7); un = 'кг';
    q = 'Африкийн заан өдөрт ' + nt(v) + ' кг хүнс иддэг. ' + h + ' хоногт хэдэн килограмм хүнс идэх вэ?';
  } else {
    v = rnd(120, 260); h = rnd(3, 9); un = 'литр';

  }
  var c = colMul(v, h);
  return {
    q: q, a: '$' + nf(v) + '\\times ' + h + '=' + nf(v * h) + '$ ' + un + '.',
    key: '204er:' + ty + ':' + v + 'x' + h, col: c.q, sol: c.s
  };
}

// ── 14. Нийт зам ба хугацаагаар нэгж хугацааны замыг олох (469, 756) ───────
function g_204_eSpeed() {
  var ty = rnd(1, 4), h = rnd(2, 9), v, d, q, un;
  if (ty === 1) {
    v = rnd(40, 95); d = v * h; un = 'км';
    q = 'Хоёр хотын хоорондох зай ' + nt(d) + ' км. Машин энэ замыг ' + h + ' цагт туулсан бол цаг тутамд хэдэн километр явсан бэ?';
  } else if (ty === 2) {
    v = rnd(15, 30); d = v * h; un = 'метр';
    q = 'Мотоцикл ' + nt(d) + ' метр замыг ' + h + ' секундэд туулав. Секунд тутамд хэдэн метр зам туулсан бэ?';
  } else if (ty === 3) {
    v = rnd(55, 110); d = v * h; un = 'км';

  } else {
    v = rnd(4, 9); d = v * h; un = 'км';
    q = 'Явган аялагч ' + nt(d) + ' км замыг ' + h + ' цагт туулжээ. Цаг тутамд хэдэн километр явсан бэ?';
  }
  var c = colDiv(d, h);
  return {
    q: q, a: '$' + nf(d) + '\\div ' + h + '=' + nf(v) + '$ ' + un + '.',
    key: '204ep:' + ty + ':' + d + 'd' + h, col: c.q, sol: c.s
  };
}

// ── 15. Нэг бүрийн үнэ / тоо хэмжээ / нийт үнэ (475, 477, 468 д) ───────────
function g_204_mPrice() {
  var ty = rnd(1, 3), q, ans, it = pick(IT204), nm = pick(NM204);
  if (ty === 1) {
    var p1 = rnd(3, 11) * 100, n1 = rnd(3, 9);
    if (p1 * n1 > 9999) return null;
    q = 'Нэг ширхэг ' + it + ' ' + nt(p1) + ' төгрөг. ' + n1 + ' ширхэг авбал нийт хэдэн төгрөг төлөх вэ?';
    ans = 'Нийт үнэ $=$ нэг бүрийн үнэ $\\times$ тоо хэмжээ: $' + nf(p1) + '\\times ' + n1 + '=' + nf(p1 * n1) + '$ төгрөг.';
    return { q: q, a: ans, key: '204mp:1:' + p1 + 'x' + n1 + ':' + it };
  }
  if (ty === 2) {
    var n2 = rnd(3, 6), p2 = rnd(9, 16) * 100, t2 = n2 * p2;
    if (t2 > 9999) return null;
    q = nm + ' ' + n2 + ' кг төмс аваад нийт ' + nt(t2) + ' төгрөг төлөв. Нэг килограмм төмс хэдэн төгрөг вэ?';
    ans = 'Нэг бүрийн үнэ $=$ нийт үнэ $\\div$ тоо хэмжээ: $' + nf(t2) + '\\div ' + n2 + '=' + nf(p2) + '$ төгрөг.';
    return { q: q, a: ans, key: '204mp:2:' + t2 + 'd' + n2 };
  }
  var p3 = rnd(2, 11) * 100, n3 = rnd(3, 9), t3 = p3 * n3;
  if (t3 > 9999) return null;
  q = 'Нэг ширхэг ' + it + ' ' + nt(p3) + ' төгрөг. ' + nt(t3) + ' төгрөгөөр хэдэн ширхэг ' + it + ' авах вэ?';
  ans = 'Тоо хэмжээ $=$ нийт үнэ $\\div$ нэг бүрийн үнэ: $' + nf(t3) + '\\div ' + nf(p3) + '=' + n3 + '$ ширхэг.';
  return { q: q, a: ans, key: '204mp:3:' + t3 + 'd' + p3 + ':' + it };
}

// ── 16. Илүүц өгөгдөлтэй үржих/хуваах бодлого (757, 758) ───────────────────
function g_204_mExtraMD() {
  var ty = rnd(1, 4), q, ans, ex;
  if (ty === 1) {
    var c1 = rnd(60, 140), h1 = rnd(4, 9), d1 = rnd(100, 160);
    q = 'Хөхөө шувуу цагт ' + nt(c1) + ' ширхэг шавж идэх чадвартай. Тэрээр манай нутагт ' + d1 + ' хоног байдаг бөгөөд өдөрт ' + h1 + ' цагаар идэш хайдаг. Нэг өдөрт хэдэн шавж идэх вэ?';
    ex = 'нутагт байх хоногийн тоо (' + d1 + ')';
    ans = '$' + nf(c1) + '\\times ' + h1 + '=' + nf(c1 * h1) + '$ шавж';
  } else if (ty === 2) {
    var w2 = rnd(14, 26), k2 = rnd(3, 9), g2 = rnd(3, 6);
    q = 'Тэмээ хоногт ' + w2 + ' литр ус ууна. Ямаа хоногт ' + g2 + ' литр ус уудаг. Тэмээ ' + k2 + ' хоногт хэдэн литр ус уух вэ?';
    ex = 'ямааны хоногт уух ус (' + g2 + ' литр)';
    ans = '$' + w2 + '\\times ' + k2 + '=' + nf(w2 * k2) + '$ литр';
  } else if (ty === 3) {
    var x3 = pick([6, 8, 9]), m3 = rnd(20, 140), t3 = x3 * m3, p3 = rnd(4, 12) * 100;
    q = 'Нэг хайрцагт ' + x3 + ' ширхэг өндөг багтана. Нэг өндөг ' + nt(p3) + ' төгрөг. ' + nt(t3) + ' өндгийг бүгдийг нь хайрцаглавал хэдэн хайрцаг болох вэ?';
    ex = 'нэг өндөгний үнэ (' + nt(p3) + ' төгрөг)';
    ans = '$' + nf(t3) + '\\div ' + x3 + '=' + nf(m3) + '$ хайрцаг';
  } else {
    var s4 = rnd(18, 32), pg = rnd(4, 9), b4 = rnd(1200, 4800);
    q = 'Ангид ' + s4 + ' сурагч байна. Сурагч бүр өдөрт ' + pg + ' хуудас уншина. Номын санд ' + nt(b4) + ' ном байдаг. Анги бүгдээрээ өдөрт хэдэн хуудас уншсан бэ?';
    ex = 'номын сангийн номын тоо (' + nt(b4) + ')';
    ans = '$' + s4 + '\\times ' + pg + '=' + nf(s4 * pg) + '$ хуудас';
  }
  return { q: q, a: 'Илүүц өгөгдөл: ' + ex + '. ' + ans + '.', key: '204mq:' + ty + ':' + q.length + ':' + ans };
}

// ── 17. Нэгж хугацаанд хэн илүү вэ (472, 473) ──────────────────────────────
function g_204_hCompare() {
  var ty = rnd(1, 4), N = tw204(), q, ans;
  if (ty === 1) {
    var t1 = rnd(1, 4) * 10, t2 = rnd(1, 4) * 10, s1 = rnd(2, 6), s2 = rnd(2, 6);
    if (s1 === s2) return null;
    q = N[0] + ' ' + t1 + ' секундэд ' + nt(t1 * s1) + ' метр, ' + N[1] + ' ' + t2 + ' секундэд ' + nt(t2 * s2) + ' метр газар гүйв. Нэгж хугацаанд хэн нь илүү хол гүйсэн бэ?';
    ans = '$' + nf(t1 * s1) + '\\div ' + t1 + '=' + s1 + '$ м, $' + nf(t2 * s2) + '\\div ' + t2 + '=' + s2 + '$ м. ' + (s1 > s2 ? N[0] : N[1]) + ' илүү хол гүйсэн.';
    return { q: q, a: ans, key: '204hp:1:' + t1 + '_' + s1 + ':' + t2 + '_' + s2 };
  }
  if (ty === 2) {
    var m1 = rnd(3, 6), m2 = rnd(3, 6), r1 = rnd(2, 5), r2 = rnd(2, 5);
    if (r1 === r2) return null;
    q = N[0] + ' ' + m1 + ' минутад ' + (m1 * r1) + ' ширхэг, ' + N[1] + ' ' + m2 + ' минутад ' + (m2 * r2) + ' ширхэг цаасан шувуу нугалав. Хэн нь хурдан нугалсан бэ?';
    ans = '$' + (m1 * r1) + '\\div ' + m1 + '=' + r1 + '$ ширхэг, $' + (m2 * r2) + '\\div ' + m2 + '=' + r2 + '$ ширхэг. ' + (r1 > r2 ? N[0] : N[1]) + ' хурдан нугалсан.';
    return { q: q, a: ans, key: '204hp:2:' + m1 + '_' + r1 + ':' + m2 + '_' + r2 };
  }
  if (ty === 3) {
    var h1 = rnd(2, 9), h2 = rnd(2, 9), v1 = rnd(6, 9) * 10, v2 = rnd(6, 9) * 10;
    if (v1 === v2) return null;
    q = 'Эхний машин ' + h1 + ' цагт ' + nt(h1 * v1) + ' км, хоёр дахь машин ' + h2 + ' цагт ' + nt(h2 * v2) + ' км явав. Аль машин нь хурдан явсан бэ?';
    ans = '$' + nf(h1 * v1) + '\\div ' + h1 + '=' + v1 + '$ км, $' + nf(h2 * v2) + '\\div ' + h2 + '=' + v2 + '$ км. ' + (v1 > v2 ? 'Эхний' : 'Хоёр дахь') + ' машин хурдан явсан.';
    return { q: q, a: ans, key: '204hp:3:' + h1 + '_' + v1 + ':' + h2 + '_' + v2 };
  }
  var a1 = rnd(2, 8), a2 = rnd(2, 8), w1 = rnd(3, 9), w2 = rnd(3, 9);
  if (w1 === w2) return null;
  q = 'Эхний ажилчин ' + a1 + ' цагт ' + (a1 * w1) + ' сандал, хоёр дахь ажилчин ' + a2 + ' цагт ' + (a2 * w2) + ' сандал хийв. Нэг цагт хэн нь илүү олон сандал хийсэн бэ?';
  ans = '$' + (a1 * w1) + '\\div ' + a1 + '=' + w1 + '$ сандал, $' + (a2 * w2) + '\\div ' + a2 + '=' + w2 + '$ сандал. ' + (w1 > w2 ? 'Эхний' : 'Хоёр дахь') + ' ажилчин илүү олон хийсэн.';
  return { q: q, a: ans, key: '204hp:4:' + a1 + '_' + w1 + ':' + a2 + '_' + w2 };
}

// ── 18. Тэгш өнцөгтийн урт, өргөн, талбай (474, 468 в) ─────────────────────
function g_204_hArea() {
  var ty = rnd(1, 4), q, ans;
  if (ty === 1) {
    // урт ≥ өргөн байх ЁСТОЙ: L1 нь үргэлж 9-өөс их
    var w1 = rnd(2, 9), L1 = rnd(10, 40), S1 = w1 * L1;
    q = 'Тэгш өнцөгтийн талбайн хэмжээ ' + nt(S1) + ' см.кв, өргөн нь ' + w1 + ' см. Уртыг нь ол.';
    ans = 'Урт $=$ талбай $\\div$ өргөн: $' + nf(S1) + '\\div ' + w1 + '=' + L1 + '$ см.';
    return { q: q, a: ans, key: '204hr:1:' + S1 + 'd' + w1 };
  }
  if (ty === 2) {
    var L2 = rnd(12, 60), w2 = rnd(3, 9);
    q = 'Тэгш өнцөгтийн урт ' + L2 + ' см, өргөн ' + w2 + ' см бол талбайн хэмжээг ол.';
    ans = 'Талбай $=$ урт $\\times$ өргөн: $' + L2 + '\\times ' + w2 + '=' + nf(L2 * w2) + '$ см.кв.';
    return { q: q, a: ans, key: '204hr:2:' + L2 + 'x' + w2 };
  }
  if (ty === 3) {
    // өргөн ≤ урт байх ЁСТОЙ (хуваагч нь нэг оронтой байхыг хадгална)
    var L3 = rnd(6, 9), w3 = rnd(2, L3), S3 = L3 * w3;
    q = 'Тэгш өнцөгт хэлбэртэй зураг ' + L3 + ' см урттай. Зургийн талбайн хэмжээ ' + nt(S3) + ' см.кв бол өргөн нь хэд вэ?';
    ans = 'Өргөн $=$ талбай $\\div$ урт: $' + nf(S3) + '\\div ' + L3 + '=' + w3 + '$ см.';
    return { q: q, a: ans, key: '204hr:3:' + S3 + 'd' + L3 };
  }
  var s4 = rnd(2, 9), o4 = rnd(5, 45), S4 = s4 * o4;
  q = 'Талбайн хэмжээ нь ' + nt(S4) + ' см.кв байх тэгш өнцөгтийн нэг тал ' + s4 + ' см. Нөгөө тал нь хэдэн сантиметр вэ?';
  ans = '$' + nf(S4) + '\\div ' + s4 + '=' + o4 + '$ см.';
  return { q: q, a: ans, key: '204hr:4:' + S4 + 'd' + s4 };
}

// Сурах бичиг х.132–133 (PDF 38–39) ба х.150–152 (PDF 56–58) «АСУУДАЛ ШИЙДВЭРЛЭХ»
//
//   640, 648  баганаар хуваах, аравтаар хуваах (280÷40, 2400÷100) → g_205_divCol
//   642  3160₮, зураг тус бүр 100₮ — хамгийн олондоо хэд авах вэ  → g_205_wMost
//   643  363 кг-ыг 5 кг хайрцагт — хэдэн хайрцаг (үлдэгдэлд +1)   → g_205_wPack
//   644  2 өдрийн зам, эхний өдөр 40 км дутуу → 2 дахь өдөр хэд   → g_205_wPlan
//   646, 652  хайрцаг × ширхэг − хагарсан                         → g_205_wBox
//   649  хоногт 120 л ус → хэдэн хоног → 1 л 2₮ (хэлхээт үржих)   → g_205_wRate
//   650 в  (28+15)×4 — хаалттай илэрхийлэл                        → g_205_exprParen
//   654  хэлхмэл жишээ 27×8 → 216÷3 (хоёр үйлдэл дараалан)        → g_205_exprMulAdd
//   745–749  тахиа/туулай — тоо ба хөлийн тоо (таах-шалгах)       → g_205_wLegs
//   750  2 ангид 51, 20 ба 15 гарсны дараа тэнцүү үлдэв           → g_205_wSumDiff
//   752  1 км — 12 минут → k км хэдэн минут, цаг-минут болгох     → g_205_wRate
//   756  зөгий секундэд 6 м → 360 м хэдэн секундэд                → g_205_wSpeed
//   758  тэмээ 20 л, ямаа 10 дахин бага → 340 л хэд хоногт        → g_205_wPerUnit
//   759, 761  тоть/хавч, шаазгай/хараацай/хэрээ — дахин бага/илүү → g_205_wTimes
//   763  Орхон–Хэрлэн–Туул богиносох — гурван голын нийт урт      → g_205_wChain
//   764  Орос 3485 км, Хятад 4673 км — нийт урт ба хэдээр илүү    → g_205_wBorder
//   765  УБ–Өндөрхаан–Баруун-Урт, замаараа буцах                  → g_205_wRoute
