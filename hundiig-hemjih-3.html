var NM205 = ['Болд', 'Сараа', 'Батаа', 'Дулмаа', 'Анар', 'Оюунаа', 'Тэмүүлэн', 'Намуун', 'Хулан', 'Ганбат', 'Энхжин', 'Мөнхөө'];
var IT205 = ['дэвтэр', 'харандаа', 'баллуур', 'шугам', 'үзэг', 'цавуу'];

// ── h205_bl(тор, тоо): АСУУЛТЫН торноос ӨМНӨХ АЛХМЫН ҮР ДҮН-г хоосолно ────────────
//   Хоёр үйлдэлтэй бодлогод 2-р тор нь 1-р алхмын хариуг агуулдаг (ж. 888×4 →
//   «3552+405»). Тэгвэл сурагч 1-р үйлдлийг бодохгүйгээр хариуг уншина.
//   Иймд тухайн тооны нүднүүдийг хасна — тор, тэмдэг, зураас хэвээр үлдэнэ.
//   Зөвхөн БҮТЭН тоог (хоёр талд зэргэлдээ цифргүй) олно. Хуваах торны босоо
//   зураас нь хуваагдагч ба хуваагчийг тусгаарлана.
function h205_bl(html, v) {
  var s = String(v), h = String(html);
  var vlm = h.match(/<i class="vl" style="left:calc\(var\(--c\)\*(\d+)\)/);
  var cut = vlm ? +vlm[1] : Infinity;
  var re = /<span class="d" style="left:calc\(var\(--c\)\*(\d+)\);top:calc\(var\(--c\)\*(\d+)\)">(\d)<\/span>/g;
  var items = [], m, byRow = {};
  while ((m = re.exec(h))) items.push({ all: m[0], c: +m[1], r: +m[2], t: m[3] });
  items.forEach(function (x) { (byRow[x.r] = byRow[x.r] || []).push(x); });
  function side(c) { return c >= cut; }
  var kill = null;
  Object.keys(byRow).map(Number).sort(function (a, b) { return a - b; }).forEach(function (r) {
    if (kill) return;
    var ds = byRow[r].slice().sort(function (a, b) { return a.c - b.c; });
    for (var i = 0; i + s.length <= ds.length && !kill; i++) {
      var ok = true;
      for (var j = 0; j < s.length; j++) {
        if (ds[i + j].t !== s.charAt(j)) { ok = false; break; }
        if (j && (ds[i + j].c !== ds[i + j - 1].c + 1 || side(ds[i + j].c) !== side(ds[i + j - 1].c))) { ok = false; break; }
      }
      if (!ok) continue;
      var A = ds[i - 1], B = ds[i + s.length], a0 = ds[i], b0 = ds[i + s.length - 1];
      if (A && A.c === a0.c - 1 && side(A.c) === side(a0.c)) continue;      // зүүн талд цифр — бүтэн тоо биш
      if (B && B.c === b0.c + 1 && side(B.c) === side(b0.c)) continue;      // баруун талд цифр
      kill = ds.slice(i, i + s.length);
    }
  });
  if (!kill) return h;
  kill.forEach(function (x) { h = h.replace(x.all, ''); });
  return h;
}

// ── Туузан загвар: нийлбэр S, зөрөө D (бүдүүвч — урт нь хариуг илэрхийлэхгүй) ──
function h205_barSD(S, D) {
  var x0 = 76, w = 196, wd = 58, h = 26, y1 = 12, y2 = 50, g = '';
  g += '<text x="2" y="' + (y1 + 18) + '" font-size="12" fill="#55506b">1 дэх</text>';
  g += '<rect x="' + x0 + '" y="' + y1 + '" width="' + w + '" height="' + h + '" rx="3" fill="none" stroke="#5a32d6" stroke-width="1.4"/>';
  g += '<text x="' + (x0 + w / 2) + '" y="' + (y1 + 18) + '" font-size="13" text-anchor="middle" fill="#1a1030">?</text>';
  g += '<text x="2" y="' + (y2 + 18) + '" font-size="12" fill="#55506b">2 дахь</text>';
  g += '<rect x="' + x0 + '" y="' + y2 + '" width="' + w + '" height="' + h + '" rx="3" fill="none" stroke="#5a32d6" stroke-width="1.4"/>';
  g += '<text x="' + (x0 + w / 2) + '" y="' + (y2 + 18) + '" font-size="13" text-anchor="middle" fill="#1a1030">?</text>';
  g += '<rect x="' + (x0 + w) + '" y="' + y2 + '" width="' + wd + '" height="' + h + '" rx="3" fill="#ece6ff" stroke="#5a32d6" stroke-width="1.4"/>';
  g += '<text x="' + (x0 + w + wd / 2) + '" y="' + (y2 + 18) + '" font-size="12" text-anchor="middle" fill="#1a1030">' + nt(D) + '</text>';
  var bx = x0 + w + wd + 12;
  g += '<path d="M ' + bx + ' ' + y1 + ' h 9 v ' + (y2 + h - y1) + ' h -9" fill="none" stroke="#8b83a8" stroke-width="1.2"/>';
  g += '<text x="' + (bx + 15) + '" y="' + (y1 + (y2 + h - y1) / 2 + 5) + '" font-size="12" fill="#1a1030">' + nt(S) + '</text>';
  return '<svg viewBox="0 0 416 90" width="416" height="90">' + g + '</svg>';
}

// ── 1. Хоёр үйлдлийг дараалан: a×b+c, a×b−c (654) ───────────────────────────
function g_205_exprMulAdd() {
  var a = rnd(104, 989), b = rnd(2, 8), p = a * b;
  if (p > 9000 || p < 200) return null;
  var plus = rnd(0, 1) === 1, c, c2;
  if (plus) {
    c = rnd(24, 489);
    if (p + c > 9999) return null;
    c2 = colAdd(p, c);
  } else {
    c = rnd(24, Math.min(489, p - 50));
    c2 = colSub(p, c);
  }
  var res = plus ? p + c : p - c, c1 = colMul(a, b);
  return {
    q: '$' + nf(a) + '\\times ' + b + (plus ? '+' : '-') + nf(c) + '$',
    a: '$' + nf(a) + '\\times ' + b + '=' + nf(p) + '$, дараа нь $' + nf(p) + (plus ? '+' : '-') + nf(c) + '=' + nf(res) + '$',
    key: '205ema:' + a + 'x' + b + (plus ? 'p' : 'm') + c,
    col: c1.q + h205_bl(c2.q, p), sol: c1.s + c2.s
  };
}

// ── 2. Үржүүлээд хасах: худалдан авалт ба хариулт ───────────────────────────
function g_205_wShop() {
  var p = rnd(3, 15) * 100, k = rnd(3, 8), tot = p * k;
  if (tot > 9000) return null;
  var pay = Math.ceil((tot + 1) / 500) * 500;
  if (pay <= tot || pay > 10000) return null;
  if (pay - tot === p) return null;   // хариулт нь нэгж үнэтэй давхцана
  var nm = pick(NM205), it = pick(IT205), c1 = colMul(p, k), c2 = colSub(pay, tot);
  return {
    q: nm + ' нэг ширхэг нь ' + nt(p) + ' төгрөгийн ' + it + ' ' + k + ' ширхэг авахдаа ' + nt(pay) +
       ' төгрөг өгөв. Хэдэн төгрөгийн хариулт авах вэ?',
    a: '$' + nf(p) + '\\times ' + k + '=' + nf(tot) + '$ төгрөг; $' + nf(pay) + '-' + nf(tot) + '=' + nf(pay - tot) + '$ төгрөг.',
    key: '205wsh:' + p + 'x' + k + ':' + it,
    col: c1.q + h205_bl(c2.q, tot), sol: c1.s + c2.s
  };
}

// ── 3. Савлалт − гэмтсэн нь (646, 652) ──────────────────────────────────────
function g_205_wBox() {
  var ty = rnd(1, 4), k = rnd(3, 8), x, thing, unit, verb;
  if (ty === 1) { x = rnd(18, 36); thing = 'өндөг'; unit = 'өндөг'; verb = 'хагарчээ'; }
  else if (ty === 2) { x = rnd(20, 45); thing = 'шилэн аяга'; unit = 'аяга'; verb = 'хагарчээ'; }
  else if (ty === 3) { x = rnd(24, 48); thing = 'алим'; unit = 'алим'; verb = 'гэмтжээ'; }
  else { x = rnd(15, 30); thing = 'ваар'; unit = 'ваар'; verb = 'хагарчээ'; }
  var tot = k * x;
  if (tot > 4000 || tot < 80) return null;
  var br = rnd(5, Math.min(40, tot - 20));
  if (tot - br === br || tot - br === x) return null;   // хариу нь өгөгдөлтэй давхцана
  var c1 = colMul(x, k), c2 = colSub(tot, br);
  return {
    q: 'Дэлгүүрт ' + k + ' хайрцаг ' + thing + ' ирэв. Хайрцаг тус бүрд ' + x + ' ширхэг байв. Замд ' +
       br + ' ширхэг ' + verb + '. Бүтэн хэдэн ' + unit + ' үлдсэн бэ?',
    a: '$' + x + '\\times ' + k + '=' + nf(tot) + '$ ширхэг; $' + nf(tot) + '-' + br + '=' + nf(tot - br) + '$ ' + unit + '.',
    key: '205wbx:' + ty + ':' + x + 'x' + k + ':' + br,
    col: c1.q + h205_bl(c2.q, tot), sol: c1.s + c2.s
  };
}

// ── 4. «Хэд дахин бага» → зөрөө, нийлбэр (759, 761) ─────────────────────────
//   ty1, ty2 — сурах бичгийн БОДИТ тоонууд (насны мэдээллийг санамсаргүй болгохгүй)
function g_205_wTimes() {

    var c1 = colDiv(150, 5), c2 = colSub(150, 30);
    return {
      q: 'Тоть дунджаар 150 жил насалдаг. Хавч түүнээс 5 дахин бага насалдаг. Тоть хавчаас хэдэн жилээр урт насалдаг вэ?',
      a: 'Хавч: $150\\div 5=30$ жил; зөрөө: $150-30=120$ жил.',
      key: '205wt1:tot', col: c1.q + h205_bl(c2.q, 30), sol: c1.s + c2.s
    };
  }
  if (ty === 2) {
    var e1 = colDiv(27, 3), e2 = colAdd(9, 40);
    return {
      q: 'Шаазгай 27 жил насалдаг. Хараацай шаазгайнаас 3 дахин бага насалдаг. Хэрээ хараацайнаас 40 жилээр илүү насалдаг бол хараацай, хэрээ тус бүр хэд насалдаг вэ?',
      a: 'Хараацай: $27\\div 3=9$ жил; хэрээ: $9+40=49$ жил.',

      q: 'Нэг талбайгаас ' + big3 + ' кг төмс хураав. Хөрш талбайгаас түүнээс ' + k3 +
         ' дахин бага хураажээ. Хоёр талбайгаас нийт хэдэн килограмм төмс хураасан бэ?',
      a: 'Хөрш талбай: $' + nf(big3) + '\\div ' + k3 + '=' + nf(s3) + '$ кг; нийт: $' + nf(big3) + '+' + nf(s3) + '=' + nf(big3 + s3) + '$ кг.',
      key: '205wt3:' + big3 + 'd' + k3, col: f1.q + h205_bl(f2.q, s3), sol: f1.s + f2.s
    };
  }
  var k4 = pick([2, 3, 4, 6]), s4 = rnd(30, 150), big4 = s4 * k4;
  if (big4 > 900) return null;
  var g1 = colDiv(big4, k4), g2 = colSub(big4, s4);
  return {
    q: '1 дэх цехэд ' + big4 + ' ширхэг шилэн аяга байна. 2 дахь цехэд түүнээс ' + k4 +
       ' дахин бага аяга байна. 1 дэх цехэд хэдэн аягаар илүү байна вэ?',
    a: '2 дахь цех: $' + nf(big4) + '\\div ' + k4 + '=' + nf(s4) + '$ аяга; зөрөө: $' + nf(big4) + '-' + nf(s4) + '=' + nf(big4 - s4) + '$ аяга.',
    key: '205wt4:' + big4 + 'd' + k4, col: g1.q + h205_bl(g2.q, s4), sol: g1.s + g2.s
  };
}

// ── 5. Хэлхээт үржих, хоёр асуулт (649, 752, 757) ───────────────────────────
function g_205_wRate() {
  var ty = rnd(1, 3);
  if (ty === 1) {
    var x = rnd(45, 140), d = pick([5, 6, 7]), z = pick([2, 3]), tot = x * d, m = tot * z;
    if (tot > 1000 || m > 9999) return null;

    return {
      q: 'Нэг айл хоногт ' + x + ' литр ус хэрэглэдэг. а) ' + d +
         ' хоногт хэдэн литр ус хэрэглэх вэ? б) 1 литр ус ' + z + ' төгрөг бол ' + d +
         ' хоногт усанд хэдэн төгрөг зарцуулах вэ?',
      a: 'а) $' + x + '\\times ' + d + '=' + nf(tot) + '$ литр. б) $' + nf(tot) + '\\times ' + z + '=' + nf(m) + '$ төгрөг.',
      key: '205wr1:' + x + 'x' + d + 'x' + z, col: c1.q + h205_bl(c2.q, tot), sol: c1.s + c2.s
    };
  }
  if (ty === 2) {

    return {

         ' км замыг хэдэн минутад туулах вэ? б) Энэ хугацаа хэдэн цаг хэдэн минут болох вэ?',
      a: 'а) $' + per + '\\times ' + km + '=' + nf(tot2) + '$ минут. б) ' + hh + ' цаг' + (mn ? ' ' + mn + ' минут' : ''),
      key: '205wr2:' + per + 'x' + km, col: c.q, sol: c.s

  }

  };

// ── 7. Баганаар хуваах, аравтаар хуваах (640, 648) ──────────────────────────
function g_205_divCol() {
  var ty = rnd(1, 4), a, b;
  if (ty === 1) { b = rnd(2, 9); a = b * rnd(30, 999); }
  else if (ty === 2) { b = rnd(3, 9); a = b * rnd(30, 999) + rnd(1, b - 1); }
  else if (ty === 3) { b = pick([20, 30, 40, 50]); a = b * rnd(4, 40); }
  else { b = pick([10, 100]); a = b * rnd(9, 95) + (rnd(0, 1) ? rnd(1, b - 1) : 0); }
  if (a > 9999 || a < b) return null;
  var c = colDiv(a, b);
  return { q: '$' + nf(a) + '\\div ' + nf(b) + '$', a: '$' + divAnsTex(a, b) + '$', key: '205dc:' + a + 'd' + b, col: c.q, sol: c.s };
}

// ── 8. Үлдэгдэлд бас нэг сав — тоймлон дээш (643) ───────────────────────────
function g_205_wPack() {
  var ty = rnd(1, 4), c = pick([3, 4, 5, 6, 8]), N = rnd(120, 900);
  if (N % c === 0) return null;
  var q0 = Math.floor(N / c), r = N % c, need = q0 + 1, txt, sav;

         d + ' км дутуу явжээ. Хугацаандаа хүрэхийн тулд 2 дахь өдөр хэдэн километр явах вэ?',

var LG205 = [

  ['галуу', 2, 'гахай', 4, 'хөл', 'хөлний', 'Фермд'],

function g_205_wLegs() {
  var L = pick(LG205), n1 = rnd(4, 20), n2 = rnd(4, 20), T = n1 + n2;
  var legs = L[1] * n1 + L[3] * n2, base = L[1] * T, diff = legs - base, step = L[3] - L[1];
  if (diff <= 0) return null;
  var un = L[4], last = step === 1
    ? 'Тиймээс ' + L[2] + ' — ' + nf(diff) + ', '
    : 'Тиймээс ' + L[2] + ' — $' + nf(diff) + '\\div ' + step + '=' + n2 + '$, ';
  return {
    q: L[6] + ' ' + L[0] + ', ' + L[2] + ' нийлээд ' + T + ' байв. Тэдний ' + L[5] + ' тоо нийлээд ' +

    a: 'Бүгд ' + L[0] + ' байсан бол ' + un + ': $' + L[1] + '\\times ' + T + '=' + nf(base) + '$. Зөрөө: $' +
       nf(legs) + '-' + nf(base) + '=' + nf(diff) + '$, учир нь ' + L[2] + ' тус бүрд ' + step + ' ' + un + ' илүү байна. ' +
       last + L[0] + ' — $' + T + '-' + n2 + '=' + n1 + '$.',
    key: '205wlg:' + L[0] + ':' + n1 + 'x' + n2
  };
}
