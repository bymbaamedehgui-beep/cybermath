<style>

<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var OL=['А','Б','В','Г'];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function ipow(b,e){var r=1;for(var i=0;i<e;i++)r*=b;return r;}
function rad(n,inner){return n===2?('\\sqrt{'+inner+'}'):('\\sqrt['+n+']{'+inner+'}');}
function rootF(A,n){if(A<0)return (n%2===1)?-Math.pow(-A,1/n):NaN;return Math.pow(A,1/n);}
function isFree(m,n){var mm=m;for(var p=2;p*p<=mm;p++){var e=0;while(mm%p===0){mm/=p;e++;}if(e>=n)return false;}return true;}
var FREEC={};function freeList(n){if(FREEC[n])return FREEC[n];var a=[];for(var m=2;m<=12;m++)if(isFree(m,n))a.push(m);FREEC[n]=a;return a;}
function nthFree(N,n){var out=1,inn=1,m=N;for(var p=2;p*p<=m;p++){if(m%p===0){var e=0;while(m%p===0){m/=p;e++;}var q=Math.floor(e/n),r=e%n;out*=ipow(p,q);inn*=ipow(p,r);}}if(m>1)inn*=m;return [out,inn];}
function frac(p,q){if(q<0){p=-p;q=-q;}var g=gcd(Math.abs(p),q)||1;return {p:p/g,q:q/g};}
function fadd(a,b){return frac(a.p*b.q+b.p*a.q,a.q*b.q);}
function fsub(a,b){return frac(a.p*b.q-b.p*a.q,a.q*b.q);}
function fracTex(f){if(f.q===1)return ''+f.p;if(f.p<0)return '-\\tfrac{'+(-f.p)+'}{'+f.q+'}';return '\\tfrac{'+f.p+'}{'+f.q+'}';}
function pw(b,f){if(f.q===1&&f.p===1)return ''+b;return b+'^{'+fracTex(f)+'}';}
function rexp(){for(;;){var q=pick([2,3,4]),p=nz(-4,4),f=frac(p,q);if(f.q>1)return f;}}
function powRatTex(base,f){
  if(f.p===0)return {tex:'1',val:1};
  var neg=f.p<0,p=Math.abs(f.p),q=f.q;
  if(q===1){var v=ipow(base,p);return neg?{tex:'\\dfrac{1}{'+v+'}',val:1/v}:{tex:''+v,val:v};}
  var quo=Math.floor(p/q),rem=p-quo*q,frr=nthFree(ipow(base,rem),q),coef=ipow(base,quo)*frr[0],inn=frr[1];
  var radp=(inn===1)?'':rad(q,''+inn),top=(radp==='')?(''+coef):((coef===1?'':''+coef)+radp),val=Math.pow(base,p/q);
  return neg?{tex:'\\dfrac{1}{'+top+'}',val:1/val}:{tex:top,val:val};
}
function intPowTex(a,E){if(E===0)return '1';if(E>0)return ''+ipow(a,E);return '\\dfrac{1}{'+ipow(a,-E)+'}';}
function sigLen(m){var s=(''+Math.abs(m)).replace(/0+$/,'');return s.length||1;}
function dispME(m,e){if(m===0)return '0';var sign=m<0?'-':'',ds=''+Math.abs(m),s=ds.length,P=e+s-1,rest=ds.slice(1).replace(/0+$/,'');return sign+ds[0]+(rest?('.'+rest):'')+'\\cdot 10^{'+P+'}';}
function mkS(P,neg){var len=pick([2,2,3]),lo=ipow(10,len-1),hi=ipow(10,len)-1,sig;do{sig=rnd(lo,hi);}while(sig%10===0);var sign=neg?pick([1,1,-1]):1;return {m:sign*sig,e:P-(len-1)};}
function fval(x){return x.m*Math.pow(10,x.e);}
function divisorsOf(x){x=Math.abs(x);var r=[];for(var i=1;i*i<=x;i++){if(x%i===0){r.push(i);if(i!==x/i)r.push(x/i);}}return r;}
// ── MCQ угсрагч (утга давхцахгүйгээр 4 сонголт) ──
function finishMC(opts){var sh=shuffle(opts),ci=-1;for(var i=0;i<sh.length;i++)if(sh[i].ok)ci=i;return {opts:sh,correct:ci};}
function makeMC(cor,distr){
  var opts=[{tex:cor.t,ok:true}],usedT={},usedV=[cor.v];usedT[cor.t]=1;
  function near(v){for(var i=0;i<usedV.length;i++)if(Math.abs(usedV[i]-v)<=1e-9*Math.max(1,Math.abs(v)))return true;return false;}
  for(var i=0;i<distr.length&&opts.length<4;i++){var d=distr[i];if(!d||d.t==null||!isFinite(d.v))continue;if(usedT[d.t]||near(d.v))continue;usedT[d.t]=1;usedV.push(d.v);opts.push({tex:d.t,ok:false});}
  if(opts.length<4)return null;return finishMC(opts);}
function O(t,v){return {t:t,v:v};}
function gen(fn){for(var t=0;t<250;t++){var g=fn();if(g)return g;}return null;}
// ══════ Тест генераторууд ══════
function tZN(){var a=pick([2,3,4,5]),m=nz(-3,3),n=nz(-3,3),k=nz(-3,3),E=m+n-k;
  if(Math.abs(E)>4)return null;function o(X){return O(intPowTex(a,X),Math.pow(a,X));}
  var mc=makeMC(o(E),[o(m+n+k),o(-E),o(m-n-k),o(E+1),o(E-1)]);if(!mc)return null;
  function pe(x){return x===1?(''+a):(a+'^{'+x+'}');}
  return {stem:'$'+pe(m)+'\\cdot '+pe(n)+':'+pe(k)+'$ илэрхийллийн утга:',mc:mc};}
function tRootVal(){var n=pick([2,3]),r=rnd(2,{2:9,3:5}[n]),neg=(n%2===1)&&pick([0,1]),R=neg?-r:r,P=ipow(r,n);
  var divs=[];for(var dd=2;dd<P;dd++)if(P%dd===0)divs.push(dd);if(!divs.length)return null;
  var A=pick(divs),B=P/A;if(A<2||B<2)return null;var As=neg?-A:A;
  var mc=makeMC(O(''+R,R),[O(''+(As*B),As*B),O(''+(-R),-R),O(''+(R+1),R+1),O(''+(R-1),R-1),O(''+(As+B),As+B)]);if(!mc)return null;
  return {stem:'$'+rad(n,''+As)+'\\cdot '+rad(n,''+B)+'$ илэрхийллийн утга:',mc:mc};}
function tPull(){var n=pick([2,2,3]),k=rnd(2,{2:7,3:3}[n]),m=pick(freeList(n)),Rd=ipow(k,n)*m;
  var cor=O(k+'\\cdot '+rad(n,''+m),k*rootF(m,n));
  var mc=makeMC(cor,[O((k+1)+'\\cdot '+rad(n,''+m),(k+1)*rootF(m,n)),O(m+'\\cdot '+rad(n,''+k),m*rootF(k,n)),O(rad(n,''+(k*m)),rootF(k*m,n)),O(k+'\\cdot '+rad(n,''+(m*m)),k*rootF(m*m,n))]);if(!mc)return null;
  return {stem:'$'+rad(n,''+Rd)+'$ илэрхийллийг хялбарчил:',mc:mc};}
function tRatEval(){var n=pick([2,3]),c=rnd(2,{2:8,3:4}[n]),k=rnd(1,3);if(gcd(k,n)!==1)return null;var base=ipow(c,n);
  var neg=pick([0,1]),vv=ipow(c,k),cor=neg?O('\\dfrac{1}{'+vv+'}',1/vv):O(''+vv,vv);
  var mc=makeMC(cor,[neg?O(''+vv,vv):O('\\dfrac{1}{'+vv+'}',1/vv),O(''+ipow(c,k+1),ipow(c,k+1)),O(''+(c*k),c*k),O('\\dfrac{1}{'+(c*k)+'}',1/(c*k))]);if(!mc)return null;
  return {stem:'$'+pw(base,frac(neg?-k:k,n))+'$ илэрхийллийн утга:',mc:mc};}
function tRatSimp(){var a=pick([2,3,5,7]),f1=rexp(),f2=rexp(),f3=rexp(),E=fsub(fadd(f1,f2),f3);
  if(E.q>6)return null;var pr=powRatTex(a,E);if(!isFinite(pr.val)||Math.abs(pr.val)>1e6)return null;
  function o(ff){var p=powRatTex(a,ff);return O(p.tex,p.val);}
  var mc=makeMC(O(pr.tex,pr.val),[o({p:-E.p,q:E.q}),o(fadd(E,frac(1,1))),o(fadd(f1,fadd(f2,f3))),o(fsub(E,frac(1,1)))]);if(!mc)return null;
  return {stem:'$'+pw(a,f1)+'\\cdot '+pw(a,f2)+':'+pw(a,f3)+'$ илэрхийллийг хялбарчил:',mc:mc};}
function tConv(){var a=rnd(2,9),n=pick([3,4,5]),k=rnd(2,2*n),f=frac(k,n);if(f.q===1)return null;
  var cor=O(pw(a,f),Math.pow(a,k/n));
  var mc=makeMC(cor,[O(pw(a,frac(n,k)),Math.pow(a,n/k)),O(a+'^{'+k+'\\cdot '+n+'}',Math.pow(a,k*n)),O(pw(a,frac(k,n+1)),Math.pow(a,k/(n+1))),O(rad(k,a+'^{'+n+'}'),Math.pow(a,n/k))]);if(!mc)return null;
  return {stem:'$'+rad(n,(k===1?''+a:a+'^{'+k+'}'))+'$ илэрхийллийг рационал илтгэгчтэйгээр бич:',mc:mc};}
function tStdMul(){var A=mkS(rnd(-4,4),false),B=mkS(rnd(-4,4),false),mr=A.m*B.m,e=A.e+B.e;
  if(sigLen(mr)>4)return null;var cor=O(dispME(mr,e),mr*Math.pow(10,e));
  var mc=makeMC(cor,[O(dispME(mr,e+1),mr*Math.pow(10,e+1)),O(dispME(mr,e-1),mr*Math.pow(10,e-1)),O(dispME(A.m*B.m,A.e*B.e),(A.m*B.m)*Math.pow(10,A.e*B.e)),O(dispME(mr*10,e),mr*10*Math.pow(10,e))]);if(!mc)return null;
  return {stem:'$'+dispME(A.m,A.e)+'\\cdot '+dispME(B.m,B.e)+'$ үйлдлийн үр дүн:',mc:mc};}
function tStdDiv(){var D=mkS(rnd(-3,3),false),R=mkS(rnd(-3,3),false),m1=D.m*R.m,e1=D.e+R.e;
  if(sigLen(m1)>4)return null;var cor=O(dispME(R.m,R.e),fval(R));
  var mc=makeMC(cor,[O(dispME(R.m,R.e+1),R.m*Math.pow(10,R.e+1)),O(dispME(R.m,R.e-1),R.m*Math.pow(10,R.e-1)),O(dispME(m1,e1),m1*Math.pow(10,e1)),O(dispME(D.m,D.e),fval(D))]);if(!mc)return null;
  return {stem:'$'+dispME(m1,e1)+' : \\left('+dispME(D.m,D.e)+'\\right)$ үйлдлийн үр дүн:',mc:mc};}
function tStdAdd(){var P1=rnd(-4,4),dd=pick([1,1,2]),P2=P1+pick([dd,-dd]),A=mkS(P1,true),B=mkS(P2,false),op=pick(['+','-']),e=Math.min(A.e,B.e);
  if(Math.abs(A.e-B.e)>6)return null;
  var mr=(op==='+')?A.m*ipow(10,A.e-e)+B.m*ipow(10,B.e-e):A.m*ipow(10,A.e-e)-B.m*ipow(10,B.e-e);
  if(mr===0||sigLen(mr)>3)return null;var cor=O(dispME(mr,e),mr*Math.pow(10,e));
  var mc=makeMC(cor,[O(dispME(mr,e+1),mr*Math.pow(10,e+1)),O(dispME(-mr,e),-mr*Math.pow(10,e)),O(dispME(mr,e-1),mr*Math.pow(10,e-1)),O(dispME(mr+(mr>0?10:-10),e),(mr+(mr>0?10:-10))*Math.pow(10,e))]);if(!mc)return null;
  return {stem:'$'+dispME(A.m,A.e)+' '+op+' '+dispME(B.m,B.e)+'$ үйлдлийн үр дүн:',mc:mc};}
var TESTS=[tZN,tRootVal,tPull,tRatEval,tRatSimp,tConv,tStdMul,tStdDiv,tStdAdd,tRatEval];
// ══════ Задгай даалгаврын генераторууд (олон үйлдэлтэй) ══════
function termGen(){
  var kind=pick(['pow','pow','neg','root','one']);
  if(kind==='one'){return {tex:rnd(2,99)+'^{0}',val:{p:1,q:1},fv:1};}
  if(kind==='root'){var n=pick([2,3]),c=rnd(2,{2:9,3:4}[n]);return {tex:rad(n,''+ipow(c,n)),val:{p:c,q:1},fv:c};}
  var n2=pick([2,3,4]),c2=rnd(2,{2:9,3:4,4:3}[n2]),k=rnd(1,3);if(gcd(k,n2)!==1)return null;
  var base=ipow(c2,n2);if(base>1e7)return null;var v=ipow(c2,k);
  if(kind==='neg')return {tex:pw(base,frac(-k,n2)),val:{p:1,q:v},fv:1/v};
  return {tex:pw(base,frac(k,n2)),val:{p:v,q:1},fv:v};}
function gMultiTerm(){
  var nT=pick([3,3,4]),parts=[],tot={p:0,q:1},fvTot=0;
  for(var i=0;i<nT;i++){var t=termGen();if(!t)return null;var op=(i===0)?'':pick(['+','-']),sgn=(op==='-')?-1:1;
    parts.push((op?(' '+op+' '):'')+t.tex);tot=(sgn<0)?fsub(tot,t.val):fadd(tot,t.val);fvTot+=sgn*t.fv;}
  if(tot.q>8||Math.abs(tot.p/tot.q)>500)return null;
  if(Math.abs(fvTot-tot.p/tot.q)>1e-6*Math.max(1,Math.abs(fvTot)))return null;
  var a=(tot.q===1)?(''+tot.p):((tot.p<0?'-':'')+'\\dfrac{'+Math.abs(tot.p)+'}{'+tot.q+'}');
  return {q:parts.join(''),a:a};}
function gRatMulti(){
  var pr=pick([[2,3],[3,5],[2,5]]),p1=pr[0],p2=pr[1],Af=frac(0,1),Bf=frac(0,1),chk=1,nd=pick([1,2]);
  function mkT(sgn){var ii=rnd(0,2),jj=rnd(0,2);if(ii===0&&jj===0)ii=1;var bv=ipow(p1,ii)*ipow(p2,jj),f=rexp();
    Af=fadd(Af,frac(sgn*ii*f.p,f.q));Bf=fadd(Bf,frac(sgn*jj*f.p,f.q));chk*=Math.pow(bv,sgn*f.p/f.q);return pw(bv,f);}
  var n1=mkT(1),n2=mkT(1),d1=mkT(-1),d2=(nd===2)?mkT(-1):null;
  if(Af.q!==1||Bf.q!==1)return null;var Ai=Af.p,Bi=Bf.p;if(Ai<0||Bi<0||(Ai===0&&Bi===0)||Ai>4||Bi>4)return null;
  var val=ipow(p1,Ai)*ipow(p2,Bi);if(Math.abs(chk-val)>1e-6*val)return null;
  var den=d1+(d2?('\\cdot '+d2):'');

function gRadSum(){
  var n=pick([2,2,3]),d=pick(freeList(n)),nT=pick([2,3]),maxA={2:6,3:3}[n],avail=[];
  for(var x=1;x<=maxA;x++)avail.push(x);if(avail.length<nT)return null;
  avail=shuffle(avail);var as=avail.slice(0,nT),parts=[],totCoef=0,fSum=0;
  for(var i=0;i<nT;i++){var a=as[i],radicand=ipow(a,n)*d,c=pick([1,1,2,3]),op=(i===0)?'':pick(['+','-']),sgn=(op==='-')?-1:1;
    totCoef+=sgn*c*a;fSum+=sgn*c*rootF(radicand,n);parts.push((op?(' '+op+' '):'')+(c===1?'':''+c)+rad(n,''+radicand));}
  var a2;if(totCoef===0)a2='0';else{var s=(totCoef<0?'-':''),ac=Math.abs(totCoef);a2=s+(ac===1?'':''+ac)+rad(n,''+d);}

function gStdMulti(){
  if(pick([0,1])){
    var A=mkS(rnd(-4,4),false),B=mkS(rnd(-4,4),false),C=mkS(rnd(-3,3),false),mr=A.m*B.m*C.m,e=A.e+B.e+C.e;
    if(sigLen(mr)>4||Math.abs(mr)>1e9)return null;var av=mr*Math.pow(10,e);
    if(Math.abs(fval(A)*fval(B)*fval(C)-av)>1e-3*Math.max(1,Math.abs(av)))return null;
    return {q:dispME(A.m,A.e)+'\\cdot '+dispME(B.m,B.e)+'\\cdot '+dispME(C.m,C.e),a:dispME(mr,e)};
  }
  var C=mkS(rnd(-3,3),false),R=mkS(rnd(-3,3),false),mN=C.m*R.m,eN=C.e+R.e;
  var divs=divisorsOf(mN).filter(function(x){return x>1&&x<Math.abs(mN);});if(!divs.length)return null;
  var mA=pick(divs),mB=Math.abs(mN)/mA;if(mA>999||mB>999||sigLen(mA)>3||sigLen(mB)>3)return null;
  var eA=rnd(-2,2),eB=eN-eA,A2={m:mA,e:eA},B2={m:mB,e:eB},val=(fval(A2)*fval(B2))/fval(C);
  if(Math.abs(val-fval(R))>1e-3*Math.max(1,Math.abs(fval(R))))return null;

function fMulti(){var g=gMultiTerm();if(!g)return null;return {stem:'$'+g.q+'$ илэрхийллийн утгыг ол.',a:g.a};}
function fRat(){var g=gRatMulti();if(!g)return null;return {stem:'$'+g.q+'$ илэрхийллийг хялбарчил.',a:g.a};}
function fRad(){var g=gRadSum();if(!g)return null;return {stem:'$'+g.q+'$ илэрхийллийг хялбарчил.',a:g.a};}
function fStd(){var g=gStdMulti();if(!g)return null;return {stem:'$'+g.q+'$ үйлдлийг гүйцэтгэ (стандарт хэлбэрээр).',a:g.a};}
var FREE=[fMulti,fRat,fRad,fStd];

function genVariants(N){
