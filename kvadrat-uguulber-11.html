<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат тэгшитгэл зохиож бодох (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .col1{display:grid;grid-template-columns:1fr;gap:10px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:13px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:22mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:7px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:28px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var TRI=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[20,21,29],[10,24,26]];
// 1. Тоон бодлого
function nNum(){var t=pick(['sp','con','cons']);
  if(t==='sp'){for(var i=0;i<100;i++){var r1=rnd(2,15),r2=rnd(2,15);if(r1===r2)continue;var S=r1+r2,P=r1*r2;return {q:'Хоёр эерэг тооны нийлбэр нь $'+S+'$, үржвэр нь $'+P+'$. Тэдгээр тоог ол.',a:'$x^2-'+S+'x+'+P+'=0\\Rightarrow x_1='+Math.min(r1,r2)+',\\ x_2='+Math.max(r1,r2)+'$',ok:true};}}
  if(t==='con'){var n=rnd(4,20),P=n*(n+1);return {q:'Дараалсан хоёр натурал тооны үржвэр нь $'+P+'$. Тэр тоонуудыг ол.',a:'$n(n+1)='+P+'\\Rightarrow n^2+n-'+P+'=0,\\ n='+n+',\\ '+(n+1)+'$',ok:true};}
  var n2=rnd(3,14),S2=n2*n2+(n2+1)*(n2+1);return {q:'Дараалсан хоёр натурал тооны квадратын нийлбэр нь $'+S2+'$. Тэр тоонуудыг ол.',a:'$n^2+(n+1)^2='+S2+'\\Rightarrow n='+n2+',\\ '+(n2+1)+'$',ok:true};}
// 2. Геометрийн бодлого
function nGeo(){var t=pick(['rect','tri','trap']);
  if(t==='rect'){var x=rnd(4,15),d=rnd(2,9),A=x*(x+d);return {q:'Тэгш өнцөгтийн урт нь өргөнөөсөө $'+d+'$ м-ээр их. Талбай нь $'+A+'\\text{ м}^2$ бол талуудыг ол.',a:'$x(x+'+d+')='+A+'\\Rightarrow$ өргөн $'+x+'$ м, урт $'+(x+d)+'$ м',ok:true};}
  if(t==='tri'){var tr=pick(TRI),a=tr[0],b=tr[1],c=tr[2],dd=b-a;return {q:'Тэгш өнцөгт гурвалжны нэг катет нөгөөгөөсөө $'+dd+'$ см урт, гипотенуз нь $'+c+'$ см. Катетуудыг ол.',a:'$x^2+(x+'+dd+')^2='+(c*c)+'\\Rightarrow$ катетууд $'+a+'$ см ба $'+b+'$ см',ok:true};}
  for(var j=0;j<100;j++){var x2=rnd(3,12),k=rnd(2,8),A2=(2*x2+k)*x2/2;if(A2%1)continue;return {q:'Трапецийн зэрэгцээ суурьнууд $x$ ба $(x+'+k+')$ см, өндөр нь $x$ см. Талбай нь $'+A2+'\\text{ см}^2$ бол $x$-ийг ол.',a:'$\\dfrac{x+(x+'+k+')}{2}\\cdot x='+A2+'\\Rightarrow 2x^2+'+k+'x-'+(2*A2)+'=0,\\ x='+x2+'$ см',ok:true};}return null;}
// 3. Физик ба хэрэглээ (Сергей Бубка — h=-5t²+11t)
var BUBKA=[
  {q:'Сергей Бубка шонгоор харайх үед өндөр нь $h=-5t^2+11t$ (м) томьёогоор өөрчлөгдөнө. $t=2$ секунд үед харайлтын өндрийг ол.',a:'$h=-5\\cdot2^2+11\\cdot2=-20+22=2$ м'},
  {q:'$h=-5t^2+11t$. Тамирчин хамгийн өндөрт хэдэн секундэд хүрэх вэ?',a:'орой: $t=\\dfrac{11}{2\\cdot5}=1.1$ сек ($h_{max}=6.05$ м)'},
  {q:'$h=-5t^2+11t$. Тамирчин агаарт хэдэн секунд байх вэ (газарт буцаж ирэх хүртэл)?',a:'$-5t^2+11t=0\\Rightarrow t(11-5t)=0,\\ t=0;\\ t=2.2$ сек'},
  {q:'$h=-5t^2+11t$. $5$ м өндөрт хэдэн секундэд хүрэхийг $0.1$ нарийвчлалтай ол.',a:'$5t^2-11t+5=0,\\ D=21,\\ t\\approx0.6\\text{ ба }1.6$ сек'}
];
function gen(fn){for(var t=0;t<400;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т','у','ү'];
function relabel(sheet){var blocks=sheet.querySelectorAll('.col1'),map={};
  for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<80){var qs2=sheet.querySelectorAll('#qlist .q');if(qs2.length<=3)break;var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);h=probeH(sheet);}}
function genPool(){var arr=[],seen={};
  function fill(fn,n){var c=0,tr=0;while(c<n&&tr<4000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;arr.push(f);c++;}}
  fill(nNum,4);fill(nGeo,4);BUBKA.forEach(function(b){arr.push(b);});return arr;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];
  var body=S.map(function(f,i){window.__PROB.push({f:f,k:i});return '<div class="q" data-k="'+i+'"><div class="qh"><span class="ql">'+(i+1)+'.</span><span class="qm">'+f.q+'</span></div>'+(WK?'<div class="wk"></div>':'')+'</div>';}).join('');
  var ans=window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an">'+(p.k+1)+')</span><span>'+p.f.a+'</span></div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадрат тэгшитгэл зохиож бодох</h1><div class="sub">Квадрат тэгшитгэл зохиож бодох бодлогууд · 11-р анги · I бүлэг 1.1</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">Бодлогод үл мэдэгдэх хэмжигдэхүүнийг $x$-ээр тэмдэглэж, нөхцөлөөр квадрат тэгшитгэл зохионо. Дараа нь тэгшитгэлийг бодож, бодлогын нөхцөлд тохирох шийдийг сонгоно.</div>'
    +'<div class="task">Дараах бодлогуудыг квадрат тэгшитгэл зохиож бод.</div><div class="col1" id="qlist">'+body+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Квадрат тэгшитгэл зохиож бодох';toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFit(document.getElementById('sheet'),1035);}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
