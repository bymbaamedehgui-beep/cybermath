<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Муруйн шүргэгч ба налалт — 10-р анги (5.6)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .rule{font-size:12px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:14px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 20px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:5px 4px 6px;border-bottom:1px dashed #efeaff}
  .qeq{display:flex;gap:6px;align-items:baseline}.qn{font-weight:800;color:var(--purple);min-width:24px}.qm{font-size:13.5px}
  .bl{display:inline-block;min-width:90px;border-bottom:1.4px solid #b9accf;height:1.05em;margin-left:6px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .sol{break-inside:avoid;page-break-inside:avoid;padding:7px 10px;margin-bottom:8px;border:1px solid #eee;border-left:3px solid var(--purple);border-radius:8px;font-size:12.5px}
  .sol .sn{font-weight:800;color:var(--purple);margin-right:4px}.sol .fin{color:var(--green);font-weight:800}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function tl(terms){var s='',first=true;for(var i=0;i<terms.length;i++){var co=terms[i][0],sym=terms[i][1];if(co===0)continue;var sign=co<0?'-':'+',a=Math.abs(co),body=(sym==='')?(''+a):((a===1?'':a)+sym);if(first){s+=(co<0?'-':'')+body;first=false;}else{s+=' '+sign+' '+body;}}return s===''?'0':s;}
function line(k,m){return 'y='+tl([[k,'x'],[m,'']]);}
function make(){
  var form=rnd(0,1);
  if(form===0){ // y=ax^2
    var a=pick([1,1,2,-1]),x0=nz(-4,4);
    var k=2*a*x0, y0=a*x0*x0, m=-a*x0*x0;
    return {q:'y='+(a===1?'':(a===-1?'-':a))+'x^2\\text{ муруйн }x_0='+x0+'\\text{ цэг дэх шүргэгч}',
      ans:'налалт $k='+k+'$, &nbsp;$'+line(k,m)+'$',
      sol:'Налалт $k=2a x_0=2\\cdot'+a+'\\cdot('+x0+')='+k+'$. Хүрэлцэх цэг $y_0='+y0+'$. '
        +'Шүргэгч: $y-'+y0+'='+k+'(x-('+x0+'))\\Rightarrow '+line(k,m)+'$.'};
  }else{ // y=x^2+bx+c
    var b=nz(-5,5),c=nz(-5,5),x0=nz(-3,3);
    var k=2*x0+b, y0=x0*x0+b*x0+c, m=c-x0*x0;
    return {q:'y='+tl([[1,'x^2'],[b,'x'],[c,'']])+'\\text{ муруйн }x_0='+x0+'\\text{ цэг дэх шүргэгч}',
      ans:'налалт $k='+k+'$, &nbsp;$'+line(k,m)+'$',
      sol:'Налалт $k=2x_0+b=2\\cdot('+x0+')+('+b+')='+k+'$. Цэг $y_0='+y0+'$. '
        +'Шүргэгч: $y-'+y0+'='+k+'(x-('+x0+'))\\Rightarrow '+line(k,m)+'$.'};
  }
}
function build(){
  var probs='',sols='',WS=[];
  for(var i=0;i<8;i++){var p=make(),n=i+1;
    probs+='<div class="q"><div class="qeq"><span class="qn">'+n+'.</span><span class="qm">$'+p.q+'$</span></div><div style="margin-top:6px;font-size:12px;color:#7a7390">налалт: <span class="bl"></span> тэгшитгэл: <span class="bl"></span></div></div>';
    sols+='<div class="sol"><span class="sn">'+n+'.</span><span>$'+p.q+'$</span><div style="margin:3px 0">'+p.sol+'</div><div class="fin">Хариу: '+p.ans+'</div></div>';
    WS.push({q:p.q,a:p.ans.replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ')});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Муруйн шүргэгч ба шүргэгчийн налалт</h1><div class="sub">10-р анги · 5.6 · параболд татсан шүргэгч · налалт ба тэгшитгэл · 8 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$y=x^2$ муруйн $x_0$ цэг дэх шүргэгчийн налалт $k=2x_0$ (ерөнхийд $y=ax^2+bx+c$ бол $k=2ax_0+b$). '
    +'Шүргэгч: $y-y_0=k(x-x_0)$.</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Бодолт ба хариу</h2>'+sols+'</div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='Муруйн шүргэгч ба налалт (10-р анги 5.6)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js"></script>
</body>
</html>
