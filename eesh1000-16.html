/* ЭЕШ 1000 4-4 — ЭЕШ-ийн 1000 бодлого, 4-р хэсэг (81–106-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 81. Гурвалжны XY тал ба түүний эсрэг орших Z өнцөг өгөгдөв, O — багтсан тойргийн төв. XO, YO нь биссектрис тул
//     ∠XOY = 180° − (∠X + ∠Y)/2 = 90° + ∠Z/2 ⇒ O, X, Y-г дайрсан тойргийн радиус R = XY/(2 sin∠XOY) = XY/(2 cos(Z/2)):
//     Z = 60° ⇒ R = XY/√3;  Z = 90° ⇒ R = XY/√2;  Z = 120° ⇒ R = XY.  XY = k√r (r ∈ {1, 2, 3}); R² = k²r/D ⇒ хялбарчилсан язгуур.
var p81_V = [['A', 'C', 'B'], ['A', 'B', 'C'], ['B', 'C', 'A']];
function p81() {
  var V = rnd(1, 10) <= 6 ? p81_V[0] : pick(p81_V), Z = pick([60, 60, 60, 90, 90, 120]), D = Z === 60 ? 3 : Z === 90 ? 2 : 1;
  var k, r = 1, w = rnd(1, 4);
  if (Z === 60) { if (w === 1) { r = 3; k = rnd(2, 12); } else k = rnd(1, 10) <= 7 ? 3 * rnd(1, 12) : rnd(2, 20); }
  else if (Z === 90) { if (w === 1) { r = 2; k = rnd(2, 12); } else k = rnd(1, 10) <= 7 ? 2 * rnd(1, 15) : 2 * rnd(1, 9) + 1; }
  else if (w === 1) { r = pick([2, 3]); k = rnd(2, 10); } else k = rnd(3, 25);
  // R = √(k²r/D) = √(k²rD)/D
  var s = surd(k * k * r * D), g = gcd(s.k, D), sk = s.k / g, sd = D / g;
  var R = s.r === 1 ? fr(s.k, D) : sd === 1 ? rt(sk, s.r) : '\\dfrac{' + rt(sk, s.r) + '}{' + sd + '}';
  var u = pick(['м', 'м', 'см']);
  // Бодолт: XO, YO — биссектрис ⇒ ∠OXY + ∠OYX = (180° − Z)/2 ⇒ ∠XOY = 90° + Z/2; OXY-д синусын теорем R = XY/(2 sin∠XOY)
  var X = V[0], Y = V[1], hs = (180 - Z) / 2, W = 180 - hs, side = rt(k, r), sv = { 60: ['60', '\\dfrac{\\sqrt{3}}{2}'], 90: ['45', '\\dfrac{\\sqrt{2}}{2}'], 120: ['30', '\\dfrac{1}{2}'] }[Z];
  var fin = D === 1 ? X + Y + '=' + side
    : '\\dfrac{' + side + '}{\\sqrt{' + D + '}}=' + (r === D ? String(k) : '\\dfrac{' + k + '\\sqrt{' + D + '}}{' + D + '}' + (k % D ? '' : '=' + rt(k / D, D)));
  // Зураг: XY хэвтээ суурь, биссектрисүүд XO, YO, ∠XOY-ийн нум, O, X, Y-г дайрсан тойргийн нум (тасархай)
  var dg = Math.PI / 180, aX = 0.56 * (180 - Z), aY = 180 - Z - aX, Ls = 10, XW = Ls * Math.sin(aY * dg) / Math.sin(Z * dg);
  var P1 = [0, 0], P2 = [Ls, 0], P3 = [XW * Math.cos(aX * dg), XW * Math.sin(aX * dg)];
  var la = Math.sqrt((P3[0] - Ls) * (P3[0] - Ls) + P3[1] * P3[1]), per = la + XW + Ls;
  var O = [(la * P1[0] + XW * P2[0] + Ls * P3[0]) / per, (la * P1[1] + XW * P2[1] + Ls * P3[1]) / per];
  var Rr = Ls / (2 * Math.sin(W * dg)), dC = Math.sqrt(Rr * Rr - Ls * Ls / 4), a0 = Math.atan2(dC, Ls / 2) / dg;
  var f = Fig({ w: 220 });
  f.poly([P1, P2, P3]).seg(P1, O, { w: 1.1 }).seg(P2, O, { w: 1.1 }).arc([Ls / 2, -dC], Rr, a0, 180 - a0, { dash: '4 3', c: '#5a32d6' })
    .angle(O, P1, P2, { r: 9 }).dot(O, { r: 2.2 })
    .text(P1, X, { pos: 'sw' }).text(P2, Y, { pos: 'se' }).text(P3, V[2], { pos: 'n' }).text(O, 'O', { pos: 'n' });
  return {
    q: '$ABC$ гурвалжны $' + V[0] + V[1] + '$ талын урт $' + rt(k, r) + '$ ' + u + ' ба $' + V[2] + '$ өнцөг нь $' + Z + '^\\circ$ болно. $O$ нь энэ гурвалжинд'
      + ' багтсан тойргийн төв бол $O,' + V[0] + ',' + V[1] + '$ цэгийг дайрсан тойргийн радиусыг олоорой.',
    a: '$R=' + R + '$ ' + u,
    wk: 28,
    s: [
      '$O$ нь багтсан тойргийн төв тул $' + X + 'O$ ба $' + Y + 'O$ нь $' + X + '$, $' + Y + '$ өнцгийн биссектрис. Гурвалжны өнцгүүдийн нийлбэр $180^\\circ$ тул'
        + ' $$\\angle O' + X + Y + '+\\angle O' + Y + X + '=\\dfrac{\\angle ' + X + '+\\angle ' + Y + '}{2}=\\dfrac{180^\\circ-' + Z + '^\\circ}{2}=' + hs + '^\\circ.$$',
      '$O' + X + Y + '$ гурвалжны өнцгүүдийн нийлбэрээс $$\\angle ' + X + 'O' + Y + '=180^\\circ-' + hs + '^\\circ=' + W + '^\\circ.$$',
      'Синусын теоремоор $O' + X + Y + '$ гурвалжныг багтаасан тойргийн радиус $$R=\\dfrac{' + X + Y + '}{2\\sin\\angle ' + X + 'O' + Y + '}=\\dfrac{' + side + '}{2\\sin ' + W + '^\\circ}.$$',
      '$\\sin(180^\\circ-\\alpha)=\\sin\\alpha$ тул $$2\\sin ' + W + '^\\circ=2\\sin ' + sv[0] + '^\\circ=2\\cdot ' + sv[1] + '=' + (D === 1 ? '1' : '\\sqrt{' + D + '}') + '.$$'
        + ' Иймд $$R=' + fin + '\\ \\text{' + u + '}.$$'
    ],
    sfig: f.svg(),
    t: { Z: Z, k: k, r: r }
  };
}

// 82. ∫(ax + b)ⁿdx = (ax + b)ⁿ⁺¹/(a(n + 1)) + C, n ≠ −1: n — эерэг бүхэл (голдуу), сөрөг бүхэл (хариуг 1/(…)ᵏ хэлбэрээр)
//     эсвэл бутархай n > −1 (бутархай зэрэгтэй хариу). Коэффициент хураасан; a < 0 бол b − |a|x хэлбэрээр бичнэ.
var p82_F = [[1, 2], [1, 3], [2, 3], [3, 2], [3, 4], [1, 4], [5, 2], [4, 3], [-1, 2], [-1, 3], [-2, 3], [-3, 4]];
function p82_pw(u, p, q) {   // (u)^{p/q}
  var g = gcd(p, q); p /= g; q /= g;
  return '(' + u + ')^{' + (q === 1 ? p : (p < 0 ? '-' : '') + '\\frac{' + Math.abs(p) + '}{' + q + '}') + '}';
}
function p82() {
  var w = rnd(1, 20), np, nq = 1, f, ans;
  if (w <= 11) np = rnd(2, 30);
  else if (w <= 15) np = -rnd(2, 5);
  else { f = pick(p82_F); np = f[0]; nq = f[1]; }
  var a = pick([2, 2, 3, 3, 4, 5, 6, 7, -2, -3, -4, -5]), b = a > 0 ? nz(-9, 9) : rnd(1, 9);
  if (gcd(a, b) > 1) return null;                                     // 4x + 6 г.м. ерөнхий үржигдэхүүнгүй
  var u = a > 0 ? poly([a, b]) : b + tm(a, 'x'), mp = np + nq;        // n + 1 = mp/nq
  if (mp > 0) {                                                       // K = 1/(a(n + 1)) = nq/(a·mp)
    var KN = nq, KD = a * mp, g = gcd(KN, KD), neg = KD < 0, body = p82_pw(u, mp, nq);
    KN /= g; KD = Math.abs(KD) / g;
    ans = (neg ? '-' : '') + (KD === 1 ? (KN === 1 ? '' : KN) + body : '\\dfrac{' + (KN === 1 ? '' : KN) + body + '}{' + KD + '}');
  } else {                                                            // n ≤ −2: (u)^{mp}/(a·mp) = 1/(a·mp·(u)^{|mp|})
    var D = a * mp;
    ans = (D < 0 ? '-' : '') + '\\dfrac{1}{' + Math.abs(D) + '(' + u + ')' + (mp === -1 ? '' : '^{' + (-mp) + '}') + '}';
  }
  // Бодолт: t = ax + b, dt = a·dx ⇒ ∫(ax + b)ⁿdx = (1/a)∫tⁿdt = (1/a)·tⁿ⁺¹/(n + 1) + C, буцааж орлуулна
  var Q = p82_pw(u, np, nq), A = Math.abs(a), cA = (a < 0 ? '-' : '') + '\\dfrac{1}{' + A + '}';
  var tp = function (p, q) { var g2 = gcd(p, q); p /= g2; q /= g2; return 't^{' + (q === 1 ? p : (p < 0 ? '-' : '') + '\\frac{' + Math.abs(p) + '}{' + q + '}') + '}'; };
  var c1 = mp > 0 ? fr(nq, mp) : '\\left(' + fr(nq, mp) + '\\right)', Kf = fr(nq, a * mp), Kc = Kf === '1' ? '' : Kf === '-1' ? '-' : Kf + '\\,';
  var nT = nq === 1 ? String(np) : (np < 0 ? '-' : '') + '\\dfrac{' + Math.abs(np) + '}{' + nq + '}', n1T = nq === 1 ? String(mp) : '\\dfrac{' + mp + '}{' + nq + '}';
  return {
    q: '$\\displaystyle\\int' + p82_pw(u, np, nq) + '\\,dx$ интегралыг бодоорой.',
    a: '$' + ans + '+C$',
    wk: 22,
    s: [
      '$t=' + u + '$ гэж орлуулъя. Тэгвэл $dt=' + a + '\\,dx$, эндээс $dx=' + (a < 0 ? '-' : '') + '\\dfrac{dt}{' + A + '}$.',
      'Зэрэгт функцийн интегралын томьёо $\\int t^n\\,dt=\\dfrac{t^{n+1}}{n+1}+C$ ($n\\ne -1$), энд $n=' + nT + '$, $n+1=' + n1T + '$: $$\\int' + Q + '\\,dx='
        + cA + '\\int ' + tp(np, nq) + '\\,dt$$ $$=' + cA + '\\cdot ' + c1 + (mp > 0 ? '\\,' : '') + tp(mp, nq) + '+C=' + Kc + tp(mp, nq) + '+C.$$',
      'Буцааж $t=' + u + '$ гэж орлуулбал' + (mp < 0 ? ' ($' + tp(mp, 1) + '=\\dfrac{1}{' + (mp === -1 ? 't' : 't^{' + -mp + '}') + '}$)' : '')
        + ' $$\\int' + Q + '\\,dx=' + ans + '+C.$$'
    ],
    t: { a: a, b: b, np: np, nq: nq }
  };
}

// 83. t = c^{1/x} (x ≠ 0, t > 0): c^{(2+x)/x} = c·t²,  c^{(2−x)/x} = t²/c ⇒ t-ийн квадрат тэнцэтгэл биш.
//     Язгуурууд t₁ = c^p, t₂ = c^q (p < q бүхэл):  (2 + x)/x: M = c^{p+1} + c^{q+1}, N = c^{p+q+1};  (2 − x)/x: M = c^{p−1} + c^{q−1}, N = c^{p+q−1}.
//     ≤ (<) ⇔ p ≤ 1/x ≤ q;  ≥ (>) ⇔ 1/x ≤ p эсвэл 1/x ≥ q.  u = 1/x-ийн завсрыг u-ийн тэмдэг тус бүрээр x = 1/u болгоно:
//     u = 0 байхгүй, 1/u буурах тул төгсгөлүүд солигдоно, 1/(±∞) = 0 (нээлттэй) — x = 0 үргэлж хасагдана.
function p83_f(I) {   // x-завсар → TeX
  var l = I[0], h = I[1];
  if (l.v === -Infinity) return 'x\\' + (h.c ? 'le' : 'lt') + ' ' + h.t;
  if (h.v === Infinity) return 'x\\' + (l.c ? 'ge' : 'gt') + ' ' + l.t;
  return l.t + '\\' + (l.c ? 'le' : 'lt') + ' x\\' + (h.c ? 'le' : 'lt') + ' ' + h.t;
}
function p83_L() {   // боломжит [c, j, p, q, M, N] (M ≤ 90, N ≤ 128)
  var L = [], pw = Math.pow;
  [2, 3, 5].forEach(function (c) {
    [1, -1].forEach(function (j) {
      for (var p = -1; p <= 3; p++) for (var q = p + 1; q <= 4; q++) {
        if (p + j < 0 || p + q + j < 0) continue;
        var M = pw(c, p + j) + pw(c, q + j), N = pw(c, p + q + j);
        if (M <= 90 && N <= 128) L.push([c, j, p, q, M, N]);
      }
    });
  });
  return L;
}
// Бодолт: t = c^{1/x} ⇒ At² − Bt + C' (бүхэл коэффициенттэй) квадрат тэнцэтгэл биш ⇒ D, язгуурууд cᵖ, c^q ⇒ t-ийн завсар ⇒
//   c > 1 тул илтгэгчийг харьцуулж u = 1/x-ийн завсар ⇒ u-г тэмдгээр нь хувааж урвуу тоо авна (тэмдэг эргэнэ) ⇒ x.
function p83_sol(c, j, p, q, M, N, rel, ans) {
  var pw = Math.pow, th = function (v) { return v >= 10000 ? String(v).replace(/\B(?=(\d{3})+$)/g, '\\,') : String(v); };
  var A = j > 0 ? c : 1, B = j > 0 ? M : c * M, C2 = j > 0 ? N : c * N, Dq = B * B - 4 * A * C2, sD = Math.round(Math.sqrt(Dq));
  var tT = function (e) { return e < 0 ? '\\dfrac{1}{' + pw(c, -e) + '}' : String(pw(c, e)); };      // cᵉ-ийн утга
  var eT = function (e) { return e === 1 ? String(c) : c + '^{' + e + '}'; };                         // cᵉ зэрэг хэлбэрээр
  var root = function (e, sg) { return '\\dfrac{' + th(B) + sg + th(sD) + '}{' + 2 * A + '}=' + tT(e) + (e === 1 ? '' : '=' + c + '^{' + e + '}'); };
  var R = rel === 'le' || rel === 'ge' ? '\\le ' : '\\lt ', G = rel === 'le' || rel === 'ge' ? '\\ge ' : '\\gt ', T = c + '^{\\frac{1}{x}}', U = '\\dfrac{1}{x}', OR = '\\ \\text{эсвэл}\\ ';
  var mid = rel === 'le' || rel === 'lt', s1, s3;
  s1 = '$t=' + T + '$ гэж орлуулъя ($x\\ne 0$, $t\\gt 0$). Зэргийн чанараар $$' + c + '^{\\frac{2' + (j > 0 ? '+' : '-') + 'x}{x}}=' + c + '^{\\frac{2}{x}' + (j > 0 ? '+' : '-') + '1}='
    + (j > 0 ? c + '\\cdot\\left(' + T + '\\right)^2=' + c + 't^2' : '\\dfrac{\\left(' + T + '\\right)^2}{' + c + '}=\\dfrac{t^2}{' + c + '}') + '.$$ '
    + (j > 0 ? 'Иймд $$' + c + 't^2-' + M + 't+' + N + '\\' + rel + ' 0.$$'
      : 'Иймд $\\dfrac{t^2}{' + c + '}-' + M + 't+' + N + '\\' + rel + ' 0$. Хоёр талыг $' + c + '$-' + suf(c, 'аар') + ' үржүүлбэл ($' + c + '\\gt 0$ тул тэмдэг хэвээр) $$t^2-' + B + 't+' + C2 + '\\' + rel + ' 0.$$');
  var s2 = 'Квадрат гурван гишүүнтийн язгуурууд: $$D=' + th(B) + '^2-4\\cdot ' + (A === 1 ? '' : A + '\\cdot ') + th(C2) + '=' + th(B * B) + '-' + th(4 * A * C2) + '=' + th(Dq) + (sD > 1 ? '=' + sD + '^2' : '') + ',$$ $$t_1='
    + root(p, '-') + ',$$ $$t_2=' + root(q, '+') + '.$$';
  s3 = 'Ахлах коэффициент эерэг тул гурван гишүүнт язгууруудынхаа хооронд сөрөг, гадна нь эерэг утгатай. Иймд' + (mid ? '' : ' ($t\\gt 0$)') + ' $$'
    + (mid ? tT(p) + R + 't' + R + tT(q) + '\\ \\Leftrightarrow\\ ' + eT(p) + R + T + R + eT(q) : '0\\lt t' + R + tT(p) + OR + 't' + G + tT(q)) + '.$$ $' + c + '\\gt 1$ тул илтгэгч функц өсөх: $$'
    + (mid ? p + R + U + R + q + '.$$'
      : T + R + eT(p) + '\\ \\Leftrightarrow\\ ' + U + R + p + ',$$ $$' + T + G + eT(q) + '\\ \\Leftrightarrow\\ ' + U + G + q + '.$$');
  // u = 1/x-ийн завсрыг тэмдгээр хувааж x = 1/u (генераторын адил)
  var inc = rel === 'le' || rel === 'ge', Us = mid ? [[p, q, inc, inc]] : [[-Infinity, p, false, inc], [q, Infinity, inc, false]], out = [], zero = false;
  Us.forEach(function (I) {
    (I[0] < 0 && I[1] > 0 ? [[I[0], 0, I[2], false], [0, I[1], false, I[3]]] : [I]).forEach(function (J) {
      var lo = J[0], hi = J[1], lc = J[2] && lo !== 0, hc = J[3] && hi !== 0, xl, xh;
      if (lo === 0 || hi === 0) zero = true;
      var uT = lo === -Infinity ? U + (hc ? '\\le ' : '\\lt ') + hi : hi === Infinity ? U + (lc ? '\\ge ' : '\\gt ') + lo
        : lo + (lc ? '\\le ' : '\\lt ') + U + (hc ? '\\le ' : '\\lt ') + hi;
      if (lo >= 0) {
        xl = hi === Infinity ? { v: 0, t: '0', c: false } : { v: 1 / hi, t: fr(1, hi), c: hc };
        xh = lo === 0 ? { v: Infinity } : { v: 1 / lo, t: fr(1, lo), c: lc };
      } else {
        xl = hi === 0 ? { v: -Infinity } : { v: 1 / hi, t: fr(1, hi), c: hc };
        xh = lo === -Infinity ? { v: 0, t: '0', c: false } : { v: 1 / lo, t: fr(1, lo), c: lc };
      }
      out.push(uT + '\\ \\Rightarrow\\ ' + p83_f([xl, xh]));
    });
  });
  var s4 = '$' + U + '$ ба $x$ ижил тэмдэгтэй' + (zero ? ' ($' + U + '\\ne 0$)' : '') + ', ижил тэмдэгтэй тоонуудын урвуу тоог авахад тэнцэтгэл бишийн тэмдэг эргэнэ: '
    + out.map(function (z, i) { return '$$' + z + (i < out.length - 1 ? ',' : '.') + '$$'; }).join(' ') + ' Иймд ' + ans + '.';
  return [s1, s2, s3, s4];
}
function p83() {
  var L = p83_L(), S = L.filter(function (z) { return z[1] > 0 && z[2] < 0 && z[3] > 0; });   // S: 1/x-ийн завсар 0-ийг агуулна
  var z = rnd(1, 20) <= 9 ? pick(S) : pick(L), c = z[0], j = z[1], p = z[2], q = z[3], M = z[4], N = z[5];
  var rel = pick(['le', 'le', 'le', 'le', 'lt', 'ge', 'ge', 'gt']), inc = rel === 'le' || rel === 'ge';
  // u = 1/x-ийн шийд: [доод, дээд, доод хаалттай, дээд хаалттай]
  var U = rel === 'le' || rel === 'lt' ? [[p, q, inc, inc]] : [[-Infinity, p, false, inc], [q, Infinity, inc, false]], X = [];
  U.forEach(function (I) {
    (I[0] < 0 && I[1] > 0 ? [[I[0], 0, I[2], false], [0, I[1], false, I[3]]] : [I]).forEach(function (J) {
      var lo = J[0], hi = J[1], lc = J[2] && lo !== 0, hc = J[3] && hi !== 0, xl, xh;
      if (lo >= 0) {                                                 // u > 0 ⇒ x > 0
        xl = hi === Infinity ? { v: 0, t: '0', c: false } : { v: 1 / hi, t: fr(1, hi), c: hc };
        xh = lo === 0 ? { v: Infinity } : { v: 1 / lo, t: fr(1, lo), c: lc };
      } else {                                                       // u < 0 ⇒ x < 0
        xl = hi === 0 ? { v: -Infinity } : { v: 1 / hi, t: fr(1, hi), c: hc };
        xh = lo === -Infinity ? { v: 0, t: '0', c: false } : { v: 1 / lo, t: fr(1, lo), c: lc };
      }
      X.push([xl, xh]);
    });
  });
  X.sort(function (A, B) { return A[0].v - B[0].v; });
  var parts = X.map(function (I) { return '$' + p83_f(I) + '$'; });
  var ans = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(', ') + ' эсвэл ' + parts[parts.length - 1];
  return {
    q: '$' + c + '^{\\frac{2' + (j > 0 ? '+' : '-') + 'x}{x}}-' + M + '\\cdot ' + c + '^{\\frac{1}{x}}+' + N + '\\' + rel + ' 0$ тэнцэтгэл бишийг бодоорой.',
    a: ans,
    wk: 32,
    s: p83_sol(c, j, p, q, M, N, rel, ans),
    t: { c: c, j: j, p: p, q: q, rel: rel }

}

// 84. Ромбын тал a, хурц өнцөг α: диагоналиуд d₁ = 2a·cos(α/2), d₂ = 2a·sin(α/2), периметр P = 4a ⇒

// 85. ∫₀ᴸ f(mx)·g(nx)dx, f, g ∈ {sin, cos}, m ≠ n, L ∈ {π, π/2}: үржвэрийг нийлбэрт шилжүүлнэ
//     sin mx cos nx = ½[sin(m+n)x + sin(m−n)x],  sin mx sin nx = ½[cos(m−n)x − cos(m+n)x],  cos mx cos nx = ½[cos(m−n)x + cos(m+n)x];

// Бодолт: үржвэрийг нийлбэрт шилжүүлж (k > 0 болгож), гишүүн бүрийг Ньютон–Лейбницийн томьёогоор:

function p85_sol(F, m, n, L, ans) {

    var sa = F[0] === 'sin' ? m : n, cb = F[0] === 'sin' ? n : m;

  }

  var intT = terms.map(function (t, i) { return (t[2] < 0 ? '-' : i ? '+' : '') + '\\int_0^{' + Lt + '}\\' + t[0] + ' ' + X(t[1]) + '\\,dx'; }).join('');

    : z1 ? 'Иймд $$I=\\dfrac{1}{2}\\cdot ' + (J[0][0] < 0 ? '\\left(' + j0 + '\\right)' : j0) + '=' + ans + '.$$'
    : z0 ? 'Иймд $$I=\\dfrac{1}{2}\\cdot ' + (terms[1][2] * J[1][0] < 0 ? '\\left(' + v1 + '\\right)' : v1) + '=' + ans + '.$$'
    : 'Иймд $$I=\\dfrac{1}{2}\\left(' + j0 + (terms[1][2] < 0 ? '-' : '+') + (J[1][0] < 0 ? '\\left(' + j1 + '\\right)' : j1) + '\\right)=' + ans + '.$$';
  return [
    'Үржвэрийг нийлбэрт шилжүүлэх томьёо: $$' + frm + '.$$ $\\alpha=' + X(ab[0]) + '$, $\\beta=' + X(ab[1]) + '$ гэвэл $$' + P + mid + (mid ? '$$ $$' : '') + '=\\dfrac{1}{2}\\left(' + sumT + '\\right).$$',

// 87. log_c a + log_c b = m ⇒ ab = cᵐ;  log_a d · log_d b = log_a b = k ⇒ b = aᵏ ⇒ a^{k+1} = cᵐ.

// 88. Тэгш өнцөгт гурвалжны катетууд p:q харьцаатай (pk ба qk), талбай S = pq·k²/2. Багтаасан (гадна багтаасан) дугуйн

// 89. MQ медиан (Q — NP-ийн дундаж), MP = b, QP = NP/2 = c, ∠QMP = θ. MQP-д косинусын теорем: c² = x² + b² − 2bx·cos θ ⇒
//     MQ = x = b·cos θ + √(c² − b²sin²θ) (c > b тул эерэг шийд ганц).  S(MNP) = 2·S(MQP) = x·b·sin θ = b²sin θ cos θ + b sin θ·√(c² − b²sin²θ):
//     θ = 45°/135°: b = √(2h) ⇒ S = ±h + √(h(c² − h));  θ = 30°/150°: b = 2√h ⇒ S = ±h√3 + √(h(c² − h));
//     θ = 60°/120°: b = 2√h ⇒ S = ±h√3 + √(3h(c² − 3h)).  Заримдаа MN ба ∠QMN өгнө (N, P-г сольсон тэгш хэм).
function p89() {

    var tr = [[k1, r1], [T.k, T.r]].sort(function (x, y) { return (y[0] > 0) - (x[0] > 0) || x[1] - y[1]; });

  }
  var X = rnd(1, 10) <= 7 ? 'P' : 'N';
  // Бодолт: QX = NP/2 = c; MQX-д косинусын теорем ⇒ x² ∓ 2b|cos θ|·x − (c² − b²) = 0 ⇒ (Виет: үржвэр < 0) x = b cos θ + √(c² − b² sin²θ);

  var bT = rt(B.k, B.r), bSq = B.r === 1 ? bT + '^2' : '(' + bT + ')^2', L2 = surd(4 * bc2), BC = surd(bc2), DD = surd(dd), BS = surd(bs2);
  var xT = BC.r === DD.r ? rt((ac ? BC.k : -BC.k) + DD.k, DD.r) : ac ? BC.tex + '+' + DD.tex : DD.tex + '-' + BC.tex, xP = BC.r === DD.r ? xT : '(' + xT + ')';
  // S = (b sin θ)·x-ийг гишүүнчлэн үржүүлнэ: k₁√r₁·k₂√r₂ = k₁k₂√(r₁r₂) → хялбарчилна → (ижил язгууртай бол) нэгтгэнэ

  var chain = [ac ? e1[0] + '+' + e2[0] : e2[0] + '-' + e1[0]], simp = ac ? e1[1] + '+' + e2[1] : e2[1] + '-' + e1[1];
  if (simp !== chain[0]) chain.push(simp);

  //   Жинхэнэ ∠MQX бага (гурвалжин хэт хавтгай) үед шошго давхцдаг тул ∠MQX ≥ 0.75θ (тойм зураг, ∠QMX = θ хэвээр);

      .seg([-c / 2, -tk], [-c / 2, tk], { w: 1.2 }).seg([c / 2, -tk], [c / 2, tk], { w: 1.2 })
      .angle(Mq, Qq, Xq, { label: th + '°', r: th < 40 ? 30 : 16 })

    a: '$S=' + ans + '$',

// 90. a/p = b/q = c/r = k ⇒ a = pk, b = qk, c = rk;  αa + βb + γc = (αp + βq + γr)·k = R ⇒ k = R/(αp + βq + γr).

// 91. Давхар өнцгийн томьёо: 1 − (sin φ − cos φ)² = (sin φ + cos φ)² − 1 = 2 sin φ cos φ = sin 2φ  (эсрэг тэмдэгтэй хувилбарууд нь −sin 2φ);

// 92. Гурвалжны дундаж шугам: хоёр талын дундаж цэгийг холбосон хэрчим нь гурав дахь талтайгаа параллель бөгөөд түүний
//     хагастай тэнцүү ⇒ урт = |XY|/2 = √(Δx² + Δy²)/2 (хялбарчилсан язгуур/бутархай). Өгөгдсөн хоёр орой: A, B (голдуу), A, C эсвэл B, C.

function p92_tk(f, P, Q, n) {
  var dx = Q[0] - P[0], dy = Q[1] - P[1], l = Math.sqrt(dx * dx + dy * dy), ux = dx / l, uy = dy / l, h = 0.17;

        + '\\ \\Rightarrow\\ ' + poly([4, -4 * p, p * p]) + '=' + r + '.$$',
      'Бүх гишүүнийг зүүн талд шилжүүлж $4$-т хуваавал: $$' + poly([4, -4 * p, p * p - r]) + '=0\\ \\Rightarrow\\ ' + poly([1, B, C]) + '=0.$$',
      'Шалгалт: нөгөө язгуур нь хосмог $x_2=\\frac{' + p + cg + '\\sqrt{' + r + '}}{2}$. Виетийн теоремоор $x_1+x_2=-b$, $x_1x_2=c$: $$x_1+x_2=' + p + ',\\qquad x_1x_2=\\dfrac{'
        + par(p) + '^2-' + r + '}{4}=' + C + '.$$'
    ];
  } else {
    var kr = k * k * r, lx = 'x' + sgn(-p), rx = (s < 0 ? '-' : '') + rt(k, r);
    sol = [
      'Язгууртай гишүүнийг нэг талд нь үлдээе: $$x=' + root + '\\ \\Rightarrow\\ ' + lx + '=' + rx + '.$$',
      'Хоёр талыг квадрат зэрэгт дэвшүүлбэл язгуур арилна (хоёр гишүүнтийн квадратын томьёо): $$(' + lx + ')^2=' + (k > 1 || s < 0 ? '\\left(' + rx + '\\right)^2=' : '') + kr
        + '\\ \\Rightarrow\\ ' + poly([1, -2 * p, p * p]) + '=' + kr + '.$$',
      '$' + kr + '$-' + suf(kr, 'ыг') + ' зүүн талд шилжүүлбэл $$' + poly([1, B, C]) + '=0.$$',
      'Шалгалт: нөгөө язгуур нь хосмог $x_2=' + p + cg + rt(k, r) + '$. Виетийн теоремоор $x_1+x_2=-b$, $x_1x_2=c$: $$x_1+x_2=' + 2 * p + ',\\qquad x_1x_2=' + par(p) + '^2-' + kr + '=' + C + '.$$'
    ];
  }
  return {
    q: '$x=' + root + '$ тоо нэг язгуур нь болдог байх $x^2+bx+c=0$ ($b,\\ c$ — бүхэл тоо) квадрат тэгшитгэлийг бичээрэй.',
    a: '$' + poly([1, B, C]) + '=0$',
    wk: 20,
    s: sol,
    t: { p: p, k: k, r: r, s: s, half: half }
  };
}

// 104. Арифметик прогресс: S_n = n(2a₁ + (n − 1)d)/2 ⇒ d = (2S_n/n − 2a₁)/(n − 1) (бүхэл, ±1 ба 0 биш).
//      Геометр прогресс: b₁ = a₁, q = d ⇒ b_k = a₁·d^{k−1}.  a₁, d, n, k санамсаргүй, |b_k| ≤ 2000.
function p104() {
  var a1 = nz(-6, 9), d = pick([2, 2, 3, 3, -2, -3, 4, 5]), n = rnd(4, 10), k = rnd(3, 6);
  var S = n * (2 * a1 + (n - 1) * d) / 2, b = a1 * Math.pow(d, k - 1);
  if (!S || Math.abs(b) > 2000 || (a1 < 0 && rnd(0, 1))) return null;
  // Бодолт: S_n = (2a₁ + (n − 1)d)/2 · n-д орлуулж d-г олно; b₁ = a₁, q = d ⇒ b_k = b₁q^{k−1}.
  var A2 = 2 * a1, R2 = 2 * S / n, qk = Math.pow(d, k - 1);
  return {
    q: '$a_1=' + a1 + ',\\ S_{' + n + '}=' + S + '$ байх арифметик прогрессийн $d=q$, $a_1=b_1$ нөхцөлийг хангах геометр прогрессийн '
      + k + '-р гишүүнийг олоорой.',
    a: '$b_{' + k + '}=' + b + '$',
    wk: 26,
    s: [
      'Арифметик прогрессийн эхний $n$ гишүүний нийлбэрийн томьёо: $$S_n=\\dfrac{2a_1+(n-1)d}{2}\\cdot n.$$',
      '$a_1=' + a1 + '$, $n=' + n + '$-' + suf(n, 'ыг') + ' орлуулбал $$\\dfrac{2\\cdot ' + par(a1) + '+' + (n - 1) + 'd}{2}\\cdot ' + n + '=' + S + '$$ $$\\Rightarrow\\ '
        + A2 + '+' + (n - 1) + 'd=\\dfrac{2\\cdot ' + par(S) + '}{' + n + '}=' + R2 + '$$ $$\\Rightarrow\\ ' + (n - 1) + 'd=' + (R2 - A2) + '\\ \\Rightarrow\\ d=' + d + '.$$',
      'Геометр прогрессийн $b_1=a_1=' + a1 + '$, хуваарь $q=d=' + d + '$. $b_n=b_1q^{n-1}$ томьёогоор $$b_{' + k + '}=b_1q^{' + (k - 1) + '}=' + a1 + '\\cdot ' + par(d) + '^{' + (k - 1) + '}='
        + a1 + '\\cdot ' + par(qk) + '=' + b + '.$$'
    ],
    t: { a1: a1, d: d, n: n, k: k }
  };
}

// 105. Нэг суурийг аравтын ба энгийн бутархайгаар (0 < b < 1) бичсэн: y = log_b t буурах функц тул
//      log_b u ≥ log_b M ⇔ 0 < u ≤ M,  log_b u > log_b M ⇔ 0 < u < M,  log_b u ≤ log_b M ⇔ u ≥ M,  log_b u < log_b M ⇔ u > M.
//      u = x − c эсвэл c − x; тогтмол log_b M зүүн (эх шиг) эсвэл баруун талд; тэмдэг ≤ (голдуу), <, ≥, >.
var p105_B = [['0.5', '\\frac{1}{2}', [2, 4, 8, 16]], ['0.25', '\\frac{1}{4}', [2, 4, 8, 16]], ['0.2', '\\frac{1}{5}', [5, 25]],
  ['0.125', '\\frac{1}{8}', [2, 4, 8]], ['0.1', '\\frac{1}{10}', [10, 100]]];
var p105_FL = { le: 'ge', lt: 'gt', ge: 'le', gt: 'lt' };
function p105() {
  var B = pick(p105_B), M = pick(B[2]), rev = rnd(0, 4) === 0, c = rev ? rnd(1, 9) : nz(-6, 9);
  var rel = pick(['le', 'le', 'le', 'lt', 'ge', 'gt']), cl = rnd(0, 3) > 0, dl = rnd(0, 3) > 0;
  var u = rev ? '(' + c + '-x)' : '(x' + sgn(-c) + ')';
  var kc = '\\log_{' + (dl ? B[0] : B[1]) + '}' + M, ku = '\\log_{' + (dl ? B[1] : B[0]) + '}' + u;
  var ineq = cl ? kc + '\\' + rel + ku : ku + '\\' + rel + kc;
  var r = cl ? p105_FL[rel] : rel;   // log_b u (r) log_b M
  // u-ийн муж: ge → 0 < u ≤ M, gt → 0 < u < M, le → u ≥ M, lt → u > M
  var ans;
  if (!rev) {
    ans = r === 'ge' ? c + '\\lt x\\le ' + (c + M) : r === 'gt' ? c + '\\lt x\\lt ' + (c + M) : r === 'le' ? 'x\\ge ' + (c + M) : 'x\\gt ' + (c + M);
  } else {
    ans = r === 'ge' ? (c - M) + '\\le x\\lt ' + c : r === 'gt' ? (c - M) + '\\lt x\\lt ' + c : r === 'le' ? 'x\\le ' + (c - M) : 'x\\lt ' + (c - M);
  }
  // Бодолт: муж u > 0; 0 < b < 1 тул y = log_b t буурах ⇒ аргументуудын хооронд тэмдэг эсрэгээр (асуултын байрлалаар FL[rel]);
  // u (ur) M-ийг x-ээр бодож мужтай огтлолцуулна (ur ∈ {ge, gt} бол u ≥ M > 0 тул муж автоматаар биелнэ).
  var uu = rev ? c + '-x' : 'x' + sgn(-c), dom = rev ? 'x\\lt ' + c : 'x\\gt ' + c, ar = p105_FL[rel], ur = p105_FL[r];
  var argI = cl ? M + '\\' + ar + ' ' + uu : uu + '\\' + ar + ' ' + M, xr = rev ? p105_FL[ur] : ur, xb = rev ? c - M : c + M;
  var two = ur === 'le' || ur === 'lt';
  return {
    q: '$' + ineq + '$ тэнцэтгэл бишийг бодоорой.',
    a: '$' + ans + '$',
    wk: 24,
    s: [
      'Суурь $' + B[0] + '=' + B[1] + '$ тул хоёр логарифм ижил суурьтай. Тодорхойлогдох муж: $$' + uu + '\\gt 0\\ \\Rightarrow\\ ' + dom + '.$$',
      '$0\\lt ' + B[1] + '\\lt 1$ тул $y=\\log_{' + B[1] + '}t$ буурах функц: логарифмын тэмдгийг арилгахад тэнцэтгэл бишийн тэмдэг эсрэгээр солигдоно. $$' + ineq + '$$ $$\\Rightarrow\\ '
        + argI + '\\ \\Rightarrow\\ x\\' + xr + ' ' + xb + '.$$',
      two ? 'Тодорхойлогдох мужтай ($' + dom + '$) огтлолцуулбал $$' + ans + '.$$'
        : 'Энэ үед $' + uu + '\\' + ur + ' ' + M + '\\gt 0$ тул муж ($' + dom + '$) автоматаар биелнэ. Иймд $$' + ans + '.$$'
    ],
    t: { b: B[0], M: M, c: c, rev: rev, rel: rel, cl: cl }
  };
}

// 106. Олон гишүүнтийн томьёо: (αa + βb + γc)^n задаргааны a^i·b^j·c^k (i + j + k = n, бүгд ≥ 1) гишүүний коэффициент
//      n!/(i!·j!·k!)·α^i·β^j·γ^k.  n ≤ 12 (коэффициент бүхэл, |…| ≤ 10⁷); α, β, γ ∈ {±1, ±2, 3}: бүгд ±1 биш,
//      ерөнхий хуваагчгүй, хамгийн ихдээ нэг нь сөрөг. Хувьсагч a, b, c (голдуу) эсвэл x, y, z. Хариуд томьёо ба утга.
function p106_f(n) { var v = 1; for (var i = 2; i <= n; i++) v *= i; return v; }
function p106() {
  var V = rnd(0, 3) ? ['a', 'b', 'c'] : ['x', 'y', 'z'];
  var C = [pick([1, 2, 3, 3, -1, -2]), pick([1, 2, 2, 3, -1, -2]), pick([1, 1, 2, 3, -1])];
  if (C.every(function (c) { return Math.abs(c) === 1; }) || gcd(gcd(C[0], C[1]), C[2]) > 1) return null;
  if (C.filter(function (c) { return c < 0; }).length > 1) return null;
  var n = rnd(5, 12), i = rnd(1, n - 2), j = rnd(1, n - 1 - i), k = n - i - j, E = [i, j, k];
  var N = p106_f(n) / (p106_f(i) * p106_f(j) * p106_f(k));
  E.forEach(function (e, t) { N *= Math.pow(C[t], e); });
  if (Math.abs(N) > 1e7 || Math.abs(N) < 60) return null;
  var base = tm(C[0], V[0], true) + tm(C[1], V[1]) + tm(C[2], V[2]);
  var ex = function (e) { return e === 1 ? '' : e < 10 ? '^' + e : '^{' + e + '}'; };
  var mono = V.map(function (v, t) { return v + ex(E[t]); }).join('\\times ');
  var pw = C.map(function (c, t) { return c === 1 ? '' : '\\cdot ' + (c < 0 ? '(' + c + ')' : c) + (E[t] === 1 ? '' : '^{' + E[t] + '}'); }).join('');
  // Бодолт: олон гишүүнтийн томьёо (u + v + w)^n = Σ n!/(i!·j!·k!)·u^i·v^j·w^k; u = αa, v = βb, w = γc ⇒ коэффициент
  // n!/(i!·j!·k!)·α^i·β^j·γ^k. Олон гишүүнтийн коэффициентийг хамгийн их зэргийн факториалаар хураан бодно.
  var Mc = p106_f(n) / (p106_f(i) * p106_f(j) * p106_f(k)), mx = Math.max(i, j, k), mi = E.indexOf(mx), nu = [], de = [], t;
  for (t = n; t > mx; t--) nu.push(t);
  E.forEach(function (e, u) { if (u !== mi && e > 1) de.push(e + '!'); });
  var mfr = '\\dfrac{' + n + '!}{' + i + '!\\,' + j + '!\\,' + k + '!}', red = de.length ? '\\dfrac{' + nu.join('\\cdot ') + '}{' + de.join('\\cdot ') + '}' : nu.join('\\cdot ');
  var fac = C.map(function (c, u) { var b0 = tm(c, V[u], true); return (c === 1 ? b0 : '(' + b0 + ')') + (E[u] === 1 ? '' : '^{' + E[u] + '}'); }).join('\\,');
  var mo = V.map(function (v, u) { return v + (E[u] === 1 ? '' : '^{' + E[u] + '}'); }).join('\\,');
  var vl = [];
  C.forEach(function (c, u) { if (c !== 1) vl.push(par(Math.pow(c, E[u]))); });
  var c1 = Mc + pw, c2 = Mc + vl.map(function (x) { return '\\cdot ' + x; }).join('');
  return {
    q: '$(' + base + ')^{' + n + '}$ задаргааны $' + mono + '$ гишүүний коэффициентийг олоорой.',
    a: '$\\dfrac{' + n + '!}{' + i + '!\\,' + j + '!\\,' + k + '!}' + pw + '=' + N + '$',
    wk: 26,
    s: [
      'Олон гишүүнтийн (Ньютоны биномын ерөнхийлсөн) томьёогоор $(u+v+w)^n$ задаргааны ерөнхий гишүүн $$\\dfrac{n!}{i!\\,j!\\,k!}\\,u^i\\,v^j\\,w^k,\\qquad i+j+k=n.$$',
      'Энд $u=' + tm(C[0], V[0], true) + '$, $v=' + tm(C[1], V[1], true) + '$, $w=' + tm(C[2], V[2], true) + '$, $i=' + i + '$, $j=' + j + '$, $k=' + k + '$ ($' + i + '+' + j + '+' + k + '=' + n
        + '$). Хайж буй гишүүн: $$' + mfr + '\\,' + fac + '$$ $$=' + mfr + pw + '\\cdot ' + mo + '.$$',
      'Хүртвэр ба хуваарийн ижил үржигдэхүүнүүдийг хураавал: $$' + mfr + '=' + red + '=' + Mc + '.$$',
      'Иймд хайж буй коэффициент $$' + (c1 === c2 ? c1 : c1 + '=' + c2) + '=' + N + '.$$'
    ],
    t: { C: C, E: E, V: V }
  };
}
