<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат тэнцэтгэл бишийн шийд — лавлах (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--green:#16a34a;--red:#dc2626;--blue:#2563eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.45}
  .bar{max-width:900px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:13mm 12mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:12px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:12px;color:var(--soft);margin-top:3px}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{border:1.4px solid #d7cef2;padding:6px 6px;vertical-align:middle;text-align:center}
  thead th{background:linear-gradient(135deg,#f2ecff,#e9e0fb);color:#5a32d6;font-size:13px;font-weight:800;padding:8px 6px}
  .corner{background:#faf8ff !important;font-size:12px;color:var(--ink);width:23%}
  .corner .big{font-size:13px;font-weight:700}
  .caseh{height:78px}
  .rowlab{background:#faf8ff;font-size:13px;font-weight:700;color:#5a32d6;text-align:left;padding-left:10px}
  .iv{font-size:13px;margin-bottom:3px}
  .none{color:var(--red);font-weight:700;font-size:12px}
  .allr{color:var(--blue);font-weight:700}
  .mini{display:block;margin:2px auto 0}
  .legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:11.5px;color:#555}
  .legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dotc{width:11px;height:11px;border-radius:50%;border:2px solid var(--purple);background:var(--purple);display:inline-block}
  .doto{width:11px;height:11px;border-radius:50%;border:2px solid var(--purple);background:#fff;display:inline-block}
  .barc{width:20px;height:5px;border-radius:3px;background:var(--green);opacity:.55;display:inline-block}
  .note{margin-top:14px;background:transparent;border-left:3px solid #d9cff5;border-radius:10px;padding:10px 14px;font-size:12px;color:#5a32d6}
  .note b{color:#5a3a00}
  .aeq{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:9px 14px;font-size:12px;color:#166534;margin-top:12px;text-align:center}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}}
  @media(max-width:640px){.sheet{padding:8mm 5mm}th,td{padding:4px 3px}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
// Дээш нээлттэй жижиг парабол (толгойн мөрөнд)
function parab(kind){var W=150,H=66,padT=6,padB=16;var f,xmin=-3.2,xmax=3.2,inter=[];
  if(kind==='two'){f=function(x){return (x+1.6)*(x-1.6);};inter=[{x:-1.6,l:'x_1'},{x:1.6,l:'x_2'}];}
  else if(kind==='one'){f=function(x){return x*x;};inter=[{x:0,l:'x_0'}];}
  else{f=function(x){return x*x+1.4;};inter=[];}
  var N=44,xs=[],ys=[];for(var i=0;i<=N;i++){var x=xmin+(xmax-xmin)*i/N;xs.push(x);ys.push(f(x));}
  var ymin=Math.min.apply(null,ys.concat([0])),ymax=Math.max.apply(null,ys.concat([0]));var yr=(ymax-ymin)||1;ymin-=yr*0.12;ymax+=yr*0.12;
  function PX(x){return 10+(x-xmin)/(xmax-xmin)*(W-20);}function PY(y){return padT+(ymax-y)/(ymax-ymin)*(H-padT-padB);}
  var y0=PY(0),g='<line x1="3" y1="'+y0.toFixed(1)+'" x2="'+(W-3)+'" y2="'+y0.toFixed(1)+'" stroke="#999" stroke-width="1"/><path d="M'+(W-3)+' '+y0.toFixed(1)+' l-4,-2.5 l0,5 z" fill="#999"/>';
  var d='';for(var i=0;i<=N;i++){d+=(i?'L':'M')+PX(xs[i]).toFixed(1)+' '+PY(ys[i]).toFixed(1)+' ';}
  g+='<path d="'+d+'" fill="none" stroke="#16a34a" stroke-width="1.9"/>';
  inter.forEach(function(r){var px=PX(r.x);g+='<circle cx="'+px.toFixed(1)+'" cy="'+y0.toFixed(1)+'" r="2.3" fill="#dc2626"/>';});
  // x1,x2 / x0 гэсэн шошго
  if(kind==='two'){g+='<text x="'+PX(-1.6).toFixed(1)+'" y="'+(y0+11)+'" font-size="8.5" text-anchor="middle" fill="#b91c1c">x₁</text><text x="'+PX(1.6).toFixed(1)+'" y="'+(y0+11)+'" font-size="8.5" text-anchor="middle" fill="#b91c1c">x₂</text>';}
  if(kind==='one'){g+='<text x="'+PX(0).toFixed(1)+'" y="'+(y0+11)+'" font-size="8.5" text-anchor="middle" fill="#b91c1c">x₀</text>';}
  g+='<text x="'+(W-8)+'" y="'+(y0-3).toFixed(1)+'" font-size="8" fill="#888" font-style="italic">x</text>';
  return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';}
// Тоон шулуун дээр будсан шийд (мини)
function ml(opts){var W=150,H=30,y=14,L=7,R=W-7;
  var g='';(opts.segs||[]).forEach(function(s){var a=s[0]<0?L:s[0],b=s[1]>900?R:s[1];g+='<line x1="'+a+'" y1="'+y+'" x2="'+b+'" y2="'+y+'" stroke="#16a34a" stroke-width="4.5" opacity="0.5"/>';});
  g+='<line x1="3" y1="'+y+'" x2="'+(W-3)+'" y2="'+y+'" stroke="#888" stroke-width="1"/><path d="M'+(W-3)+' '+y+' l-4,-2.5 l0,5 z" fill="#888"/><path d="M3 '+y+' l4,-2.5 l0,5 z" fill="#888"/>';
  (opts.roots||[]).forEach(function(r){g+='<circle cx="'+r.px+'" cy="'+y+'" r="3.1" fill="'+(r.closed?'#5a32d6':'#fff')+'" stroke="#5a32d6" stroke-width="1.5"/>';if(r.lab)g+='<text x="'+r.px+'" y="'+(y+11)+'" font-size="7.5" text-anchor="middle" fill="#777">'+r.lab+'</text>';});
  if(opts.empty)g+='<text x="'+(W/2)+'" y="'+(y-4)+'" font-size="10" text-anchor="middle" fill="#dc2626" font-weight="700">∅</text>';
  return '<svg class="mini" width="'+W+'" height="'+H+'">'+g+'</svg>';}
// D>0: x1=52,x2=100; D=0: x0=75
var X1=52,X2=100,X0=75;
function cell(iv,cls,mlopt){return '<div class="iv '+(cls||'')+'">'+iv+'</div>'+ml(mlopt);}
function build(){
  var rows=[
    {lab:'$ax^2+bx+c>0$',
      d2:cell('$]{-}\\infty,x_1[\\cup]x_2,{+}\\infty[$','',{roots:[{px:X1,closed:false,lab:'x₁'},{px:X2,closed:false,lab:'x₂'}],segs:[[-1,X1],[X2,999]]}),
      d1:cell('$x\\ne-\\dfrac{b}{2a}$','',{roots:[{px:X0,closed:false,lab:'x₀'}],segs:[[-1,X0],[X0,999]]}),
      d0:cell('$x\\in\\mathbb{R}$','allr',{segs:[[-1,999]]})},
    {lab:'$ax^2+bx+c\\ge0$',
      d2:cell('$]{-}\\infty,x_1]\\cup[x_2,{+}\\infty[$','',{roots:[{px:X1,closed:true,lab:'x₁'},{px:X2,closed:true,lab:'x₂'}],segs:[[-1,X1],[X2,999]]}),
      d1:cell('$x\\in\\mathbb{R}$','allr',{roots:[{px:X0,closed:true,lab:'x₀'}],segs:[[-1,999]]}),
      d0:cell('$x\\in\\mathbb{R}$','allr',{segs:[[-1,999]]})},
    {lab:'$ax^2+bx+c<0$',
      d2:cell('$]x_1,x_2[$','',{roots:[{px:X1,closed:false,lab:'x₁'},{px:X2,closed:false,lab:'x₂'}],segs:[[X1,X2]]}),
      d1:cell('шийдгүй','none',{empty:true}),
      d0:cell('шийдгүй','none',{empty:true})},
    {lab:'$ax^2+bx+c\\le0$',
      d2:cell('$[x_1,x_2]$','',{roots:[{px:X1,closed:true,lab:'x₁'},{px:X2,closed:true,lab:'x₂'}],segs:[[X1,X2]]}),
      d1:cell('$x=-\\dfrac{b}{2a}$','',{roots:[{px:X0,closed:true,lab:'x₀'}]}),
      d0:cell('шийдгүй','none',{empty:true})}
  ];
  var html='<div class="head"><h1>Квадрат тэнцэтгэл бишийн шийд</h1><div class="sub">$f(x)=ax^2+bx+c,\\ \\ a>0$ (салаа дээш харсан) үеийн бүх тохиолдол · 11-р анги · 1.3</div></div>';
  html+='<table><thead><tr>'
    +'<th class="corner"><div class="big">$f(x)=ax^2+bx+c$</div><div>функцийн график</div></th>'
    +'<th>$D>0$<div style="font-weight:600;font-size:10.5px;color:#8a7fb5">2 язгуур</div></th>'
    +'<th>$D=0$<div style="font-weight:600;font-size:10.5px;color:#8a7fb5">давхар язгуур</div></th>'
    +'<th>$D<0$<div style="font-weight:600;font-size:10.5px;color:#8a7fb5">язгуургүй</div></th></tr></thead><tbody>';
  html+='<tr class="caseh"><td class="corner" style="font-size:11px;color:#8a7fb5">Графикийн байрлал →</td>'
    +'<td>'+parab('two')+'</td><td>'+parab('one')+'</td><td>'+parab('none')+'</td></tr>';
  rows.forEach(function(r){html+='<tr><td class="rowlab">'+r.lab+'</td><td>'+r.d2+'</td><td>'+r.d1+'</td><td>'+r.d0+'</td></tr>';});
  html+='</tbody></table>';
  html+='<div class="legend"><span><span class="barc"></span> шийдийн муж</span><span><span class="doto"></span> нээлттэй ($<,>$ буюу авахгүй)</span><span><span class="dotc"></span> хаалттай ($\\le,\\ge$ буюу авна)</span><span style="color:#dc2626">∅ — шийдгүй</span></div>';
  html+='<div class="aeq">$D=b^2-4ac$ &nbsp;·&nbsp; $x_{1,2}=\\dfrac{-b\\pm\\sqrt{D}}{2a}$ &nbsp;·&nbsp; давхар язгуур $x_0=-\\dfrac{b}{2a}$</div>';
  html+='<div class="note"><b>$a<0$ (салаа доош) үед:</b> график $Ox$-ээс дээш/доош байх муж нь <b>эсрэгээр</b> болно. Өөрөөр хэлбэл дээрх хүснэгтэд $>0 \\leftrightarrow <0$, $\\ge0 \\leftrightarrow \\le0$ мөрүүдийг сольж уншина. Жишээ нь $a<0,\\ D>0$ үед $ax^2+bx+c>0 \\Rightarrow x\\in\\,]x_1,x_2[$ болно.</div>';
  document.getElementById('sheet').innerHTML=html;
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
</body>
</html>
