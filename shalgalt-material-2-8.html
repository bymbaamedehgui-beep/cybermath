<!DOCTYPE html>

<title>II бүлэг — Шалгалтын материал (8-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 8-р анги · II бүлэг. Процент, харьцаа, пропорц (2.1 Процент · 2.2 Масштаб, харьцаа · 2.3 Урвуу пропорционал хамаарал) */
// ── тоо бичих: бүхэл бол 12\,500, бутархай хэсэгтэй бол ≤3 оронтой аравтын бутархай ──
function ok1(v) { return Math.abs(v * 10 - Math.round(v * 10)) < 1e-7; }
function ok2(v) { return Math.abs(v * 100 - Math.round(v * 100)) < 1e-7; }
function nf(v) { return Math.abs(v - Math.round(v)) < 1e-9 ? th(Math.round(v)) : dFmt(Math.round(v * 1000), 3); }
// [TeX, утга] хос; эерэг биш эсвэл 3-аас олон аравтын оронтой бол TeX нь null (сонголтоос хасагдана)
function N(v) { return v > 0 && Math.abs(v * 1000 - Math.round(v * 1000)) < 1e-6 ? [nf(v), v] : [null, v]; }
function P(v) { var r = N(v); return r[0] == null ? r : [r[0] + '\\%', v]; }
// зөвхөн эерэг бүхэл (хоног, цаг, хүний тоо г.м.)
function I(v) { return v > 0 && v === Math.round(v) ? [th(v), v] : [null, v]; }
function R(x, y) { if (!(x > 0 && y > 0) || x !== Math.round(x) || y !== Math.round(y)) return [null, 0]; var h = gcd(x, y); return [x / h + ':' + y / h, x / y]; }
// Сонголт: [TeX, утга] хосууд. Зөв хариутай ижил утгатай эсвэл хоорондоо давхардсан төөрөгдүүлэгчийг хасна.
// ord — төөрөгдүүлэгчийг өгсөн дарааллаар (эхнийх нь илүү түгээмэл алдаа) авна; эс бөгөөс хольж сонгоно.
function same(a, b) { return typeof a === 'number' && typeof b === 'number' ? Math.abs(a - b) <= 1e-9 * Math.max(Math.abs(a), Math.abs(b), 1e-12) : String(a) === String(b); }
function MC(cor, ds, ord) {
  var vals = [cor[1]], out = [];
  ds.forEach(function (d) {
    if (!d || d[0] == null || d[1] == null || (typeof d[1] === 'number' && !isFinite(d[1]))) return;
    for (var i = 0; i < vals.length; i++) if (same(vals[i], d[1])) return;
    vals.push(d[1]); out.push(C(d[0]));
  });
  return makeMC(C(cor[0]), ord ? out : shuffle(out));
}

/* ── I. Тест (10): 1–3 хялбар, 4–7 дунд, 8–10 хүнд ── */
var TESTS = [
  // 1. [2.1 Процент] Энгийн бутархайг процентоор илэрхийлэх (хялбар)
  function () {
    var d = pick([4, 5, 8, 16, 20, 25, 40, 50]), n = rnd(1, d - 1); if (gcd(n, d) !== 1) return null;
    var p = n * 100 / d; if (!ok2(p)) return null;
    return { stem: '$\\dfrac{' + n + '}{' + d + '}$ бутархайг процентоор илэрхийлбэл аль нь вэ?', mc: MC(P(p), [P(p / 10), P(p * 10), P(n / d), P(100 - p), P(d), P(n)]) };
  },
  // 2. [2.1 Процент] Тооны процентыг олох (хялбар)
  function () {
    var A = rnd(4, 60) * 10, p = pick([5, 12, 15, 20, 25, 35, 40, 45, 60, 75, 120, 150]), v = A * p / 100; if (!ok1(v)) return null;
    return { stem: '$' + A + '$ тооны $' + p + '\\%$ нь хэд вэ?', mc: MC(N(v), [N(v * 10), N(v / 10), N(A - v), N(A + v), N(A / p)]) };
  },
  // 3. [2.2 Харьцаа] Нэгжтэй хэмжигдэхүүний харьцааг хялбар хэлбэрт бичих (хялбар)
  function () {
    // [том нэгж, бага нэгж, хувиргах тоо, бага нэгжийн тийн ялгал, андуурах тоо, бага утгын алхам]
    var U = pick([['м', 'см', 100, 'см‑ийн', 10, 5], ['кг', 'г', 1000, 'г‑ын', 100, 50], ['цаг', 'минут', 60, 'минутын', 100, 5], ['км', 'м', 1000, 'м‑ийн', 100, 50], ['л', 'мл', 1000, 'мл‑ийн', 100, 50]]);
    var big = U[2] === 60 ? rnd(1, 3) : pick([1, 1.2, 1.5, 2, 2.4, 2.5, 3, 0.6, 0.8]), A = Math.round(big * U[2]), B = U[5] * rnd(1, U[2] === 60 ? 11 : 19);
    var g = gcd(A, B), p = A / g, q = B / g; if (p > 40 || q > 40 || p === q || A === B) return null;
    return { stem: '$' + nf(big) + '$ ' + U[0] + ' ба $' + B + '$ ' + U[3] + ' харьцааг хялбар хэлбэрт бичвэл аль нь вэ?',
      mc: MC(R(p, q), [R(q, p), R(Math.round(big * U[4]), B), R(p, p + q), R(p + q, q), R(Math.round(big * 10), B)]) };
  },
  // 4. [2.1 Процент] Нэг тоо нөгөө тооны хэдэн процент болох, эсвэл процент нь өгөгдсөн тоог олох (дунд)
  function () {
    if (rnd(0, 1)) {
      var B = pick([20, 25, 40, 50, 60, 75, 80, 120, 150, 200, 250, 300, 400]), p = pick([4, 5, 8, 12, 15, 20, 24, 25, 30, 35, 40, 45, 60, 65, 75, 80, 85, 90]), A = B * p / 100;
      if (A !== Math.round(A) || A === p) return null;
      return { stem: '$' + A + '$ тоо $' + B + '$ тооны хэдэн процент вэ?', mc: MC(P(p), [P(B / A * 100), P(p / 100), P(100 - p), P(A), P(p * 10)]) };
    }
    var W = rnd(4, 80) * 10, q = pick([5, 8, 12, 15, 20, 25, 30, 35, 40, 45, 60, 75]), part = W * q / 100; if (!ok1(part)) return null;
    return { stem: 'Тооны $' + q + '\\%$ нь $' + nf(part) + '$ бол уг тоо хэд вэ?', mc: MC(N(W), [N(part * q / 100), N(part + part * q / 100), N(W / 10), N(W * 10), N(part * (100 - q) / 100)]) };
  },
  // 5. [2.2 Масштаб] Газрын зураг: зураг дээрх зайнаас бодит зай, эсвэл бодит зайнаас зураг дээрх зай (дунд)
  function () {
    var n = pick([50000, 100000, 200000, 250000, 500000, 1000000, 2000000]), cm = pick([1.5, 2, 2.5, 3, 3.5, 4, 4.5, 6, 7.5, 8, 12]), km = Math.round(cm * n) / 100000; if (!ok2(km)) return null;
    if (rnd(0, 1)) return { stem: '$1:' + th(n) + '$ масштабтай газрын зураг дээрх $' + nf(cm) + '$ см зай бодит байдалд хэдэн км вэ?', mc: MC(N(km), [N(km * 10), N(km / 10), N(km * 100), N(km / 100)]) };
    return { stem: 'Бодит $' + nf(km) + '$ км зайг $1:' + th(n) + '$ масштабтай газрын зураг дээр хэдэн см‑ээр дүрслэх вэ?', mc: MC(N(cm), [N(cm * 10), N(cm / 10), N(cm * 100), N(cm / 100)]) };
  },
  // 6. [2.1 Процент] Хямдарсан эсвэл үнэ нь нэмэгдсэн барааны шинэ үнэ (дунд)
  function () {
    var P0 = rnd(12, 96) * 1000, d = pick([10, 15, 20, 25, 30, 40]), up = rnd(0, 2) === 0, sg = up ? 1 : -1, r = P0 * (100 + sg * d) / 100; if (r !== Math.round(r)) return null;
    return { stem: 'Үнэ нь $' + th(P0) + '$ төгрөг байсан барааны үнийг $' + d + '\\%$ ' + (up ? 'нэмэв' : 'хямдруулав') + '. Барааны шинэ үнэ хэд вэ?',
      mc: MC(I(r), [I(P0 * d / 100), I(P0 * (100 - sg * d) / 100), I(P0 * (100 + sg * d) / 1000), I(P0 + sg * P0 * d / 1000)]) };
  },
  // 7. [2.3 Урвуу пропорционал хамаарал] y = k/x — нэг хос утгаар нөгөө утгыг олох; төөрөгдүүлэгч: шууд пропорц, «нэмэх» буруу санаа, k (дунд)
  function () {
    var x1 = rnd(2, 9), y1 = rnd(3, 24), k = x1 * y1, x2 = rnd(2, 18); if (x2 === x1 || k % x2) return null;
    var y2 = k / x2; if (y2 === y1 || y2 === x2) return null;
    return { stem: '$y$ нь $x$-тэй урвуу пропорционал. $x=' + x1 + '$ үед $y=' + y1 + '$ бол $x=' + x2 + '$ үед $y$ хэд вэ?',
      mc: MC(N(y2), [N(y1 * x2 / x1), N(y1 - (x2 - x1)), N(k), N(y1 + (x2 - x1)), N(y1)], true) };
  },
  // 8. [2.3 Урвуу пропорционал хамаарал] Ажилчдын тоо ба хоног, эсвэл цоргоны тоо ба цаг (хүнд)
  function () {
    var a1 = rnd(3, 12), t1 = rnd(4, 30), a2 = rnd(2, 18); if (a1 === a2) return null;
    var tot = a1 * t1, t2 = tot / a2; if (t2 !== Math.round(t2) || t2 < 2 || t2 === t1) return null;
    var stem = rnd(0, 1) ? '$' + a1 + '$ ажилчин ажлыг $' + t1 + '$ хоногт гүйцэтгэдэг. Ижил бүтээмжтэй $' + a2 + '$ ажилчин уг ажлыг хэдэн хоногт гүйцэтгэх вэ?'
      : '$' + a1 + '$ ижил цоргоор усан санг $' + t1 + '$ цагт дүүргэдэг. Ийм $' + a2 + '$ цоргоор уг санг хэдэн цагт дүүргэх вэ?';
    return { stem: stem, mc: MC(I(t2), [I(t1 * a2 / a1), I(t1 + a1 - a2), I(tot), I(t1 - a1 + a2), I(t1 * a2)], true) };
  },
  // 9. [2.1 Процент] Уусмалд ус нэмэхэд давсны агууламж өөрчлөгдөх (хүнд)
  function () {
    var M = pick([100, 150, 200, 250, 300, 400, 500, 600]), p = pick([10, 12, 15, 20, 24, 25, 30, 40]), W = pick([20, 25, 50, 75, 100, 150, 200, 300]);
    var S = M * p / 100, q = S * 100 / (M + W); if (S !== Math.round(S) || !ok2(q)) return null;
    var ds = [P(p), P(S * 100 / W), P(p * (M - W) / M), P(p / 2)]; if (M > W) ds.push(P(S * 100 / (M - W)));
    return { stem: 'Давсны агууламж нь $' + p + '\\%$ байх $' + M + '$ г уусмалд $' + W + '$ г ус нэмэв. Шинэ уусмалын давсны агууламж хэдэн процент вэ?',
      mc: MC(P(q), ds.filter(function (x) { return x[1] < 100; })) };
  },
  // 10. [2.1 Процент] Дараалсан хоёр процентын өөрчлөлт (хүнд)
  function () {
    var p = pick([10, 20, 25, 30, 40, 50]), q = pick([10, 20, 25, 30, 40, 50]), f = (100 + p) * (100 - q) / 100; if (!ok2(f)) return null;
    return { stem: 'Барааны үнэ эхлээд $' + p + '\\%$ өсөөд, дараа нь $' + q + '\\%$ буурчээ. Эцсийн үнэ анхны үнийн хэдэн процент вэ?',
      mc: MC(P(f), [P(100 + p - q), P(100 - p + q), P((100 - p) * (100 + q) / 100), P(100 - p * q / 100), P((100 + p) * (100 + q) / 100)]) };
  }
];

/* ── II. Задгай (5) ── */
var FREE = [
  // 11. [2.1 Процент] Энгийн хүүгийн бодлого (2 оноо)
  function () {
    var P0 = pick([200, 300, 400, 500, 600, 800, 1000, 1200]) * 1000, r = pick([6, 8, 9, 10, 12, 15]), Y = rnd(2, 4), In = P0 * r * Y / 100;
    return { stem: '$' + th(P0) + '$ төгрөгийг жилийн $' + r + '\\%$ энгийн хүүтэйгээр банкинд $' + Y + '$ жил хадгалуулжээ. Хүүгийн орлого ба нийт мөнгийг ол.',
      a: 'хүү $' + th(In) + '$ төгрөг; нийт $' + th(P0 + In) + '$ төгрөг' };
  },
  // 12. [2.2 Масштаб] План зураг дээрх хэмжээнээс бодит урт, өргөн, талбайг олох (2 оноо)
  function () {
    var n = pick([200, 250, 400, 500]), a = pick([3, 4, 5, 6, 8, 2.5, 4.5]), b = pick([2, 3, 4, 1.5, 2.5]); if (b >= a) return null;
    var A = a * n / 100, B = b * n / 100, S = A * B; if (!ok2(A) || !ok2(B) || !ok2(S)) return null;
    return { stem: '$1:' + n + '$ масштабтай план зураг дээр тэгш өнцөгт хашааны урт $' + nf(a) + '$ см, өргөн $' + nf(b) + '$ см байв. Хашааны бодит урт, өргөн ба талбайг ол.',
      a: 'урт $' + nf(A) + '$ м, өргөн $' + nf(B) + '$ м; талбай $' + nf(S) + '$ м$^2$' };
  },
  // 13. [2.1 Процент] Хоёр уусмал холих эсвэл ус ууршуулах (3 оноо)
  function () {
    if (rnd(0, 1)) {
      var p1 = pick([10, 15, 20, 25, 30]), p2 = pick([35, 40, 45, 50, 60]), V1 = pick([100, 150, 200, 300, 400]), V2 = pick([100, 200, 250, 300, 600]);
      var acid = (V1 * p1 + V2 * p2) / 100, c = acid * 100 / (V1 + V2); if (!ok2(c) || !ok2(acid) || V1 === V2) return null;
      return { stem: 'Хүчлийн агууламж нь $' + p1 + '\\%$ байх $' + V1 + '$ г уусмал дээр агууламж нь $' + p2 + '\\%$ байх $' + V2 + '$ г уусмал нэмж холив. Хольцын хүчлийн агууламжийг ол.',
        a: '$' + nf(c) + '\\%$' };
    }
    var M = pick([300, 400, 500, 600, 800, 1000, 1200]), p = pick([10, 12, 15, 20, 24, 25, 30]), q = pick([20, 25, 30, 40, 50, 60]); if (q <= p) return null;
    var S = M * p / 100, T = S * 100 / q, w = M - T; if (!ok1(w) || !ok1(S) || w <= 0) return null;
    return { stem: 'Давсны агууламж нь $' + p + '\\%$ байх $' + M + '$ г уусмалаас хэдэн грамм ус ууршуулбал давсны агууламж $' + q + '\\%$ болох вэ?', a: '$' + nf(w) + '$ г' };
  },
  // 14. [2.2 Харьцаа] Ялгавар нь өгөгдсөн харьцаа (3 оноо)
  function () {
    if (rnd(0, 1)) {
      var a = rnd(3, 9), b = rnd(2, 8); if (a <= b || gcd(a, b) !== 1) return null;
      var u = pick([20, 30, 40, 50, 60, 80, 120]) * 1000, D = (a - b) * u;
      return { stem: 'Хоёр ажилчны цалингийн харьцаа $' + a + ':' + b + '$. Нэг нь нөгөөгөөсөө $' + th(D) + '$ төгрөгөөр их цалинтай бол ажилчин тус бүрийн цалинг ол.',
        a: '$' + th(a * u) + '$ ба $' + th(b * u) + '$ төгрөг' };
    }
    var x = rnd(1, 4), y = rnd(2, 6), z = rnd(3, 9), k = rnd(3, 15); if (!(x < y && y < z) || gcd(gcd(x, y), z) !== 1) return null;
    return { stem: 'Гурван тооны харьцаа $' + x + ':' + y + ':' + z + '$. Хамгийн их ба хамгийн бага тоонуудын ялгавар $' + ((z - x) * k) + '$ бол эдгээр тоог ол.',
      a: '$' + (x * k) + '$; $' + (y * k) + '$; $' + (z * k) + '$' };
  },
  // 15. [2.3 Урвуу пропорционал хамаарал] Ажилчин нэмэх, хурд өөрчлөх, цорго нэмэх (3 оноо)
  function () {
    var t = rnd(1, 3);
    if (t === 1) {
      var w = rnd(4, 15), d = rnd(10, 30), nd = rnd(Math.ceil(d / 2), d - 2), need = w * d / nd; if (need !== Math.round(need) || need === w) return null;
      return { stem: 'Төлөвлөгөөт ажлыг $' + w + '$ хүн $' + d + '$ хоногт хийх ёстой. Ажлыг $' + nd + '$ хоногт дуусгахын тулд ижил бүтээмжтэй хэдэн хүн нэмж авах вэ?', a: '$' + (need - w) + '$ хүн' };
    }
    if (t === 2) {
      var v = pick([40, 45, 50, 60, 64, 72, 75, 80]), h = rnd(3, 8), D = v * h, k = rnd(1, Math.max(1, Math.floor(h / 3))), v2 = D / (h - k); if (v2 !== Math.round(v2)) return null;
      return { stem: '$' + D + '$ км замыг $' + v + '$ км/ц хурдтай туулжээ. Энэ замыг $' + k + '$ цагаар бага хугацаанд туулахын тулд хурдыг хэдэн км/ц‑аар нэмэх вэ?', a: '$' + (v2 - v) + '$ км/ц' };
    }
    var n1 = rnd(2, 8), t1 = rnd(6, 24), t2 = rnd(2, t1 - 2), n2 = n1 * t1 / t2; if (n2 !== Math.round(n2) || n2 === n1 || n2 > 4 * n1) return null;
    return { stem: '$' + n1 + '$ ижил цоргоор усан санг $' + t1 + '$ цагт дүүргэдэг. Санг $' + t2 + '$ цагт дүүргэхийн тулд ийм хэдэн цорго нэмэх вэ?', a: '$' + (n2 - n1) + '$ цорго' };
  }
];

CMX.exam({
  title: 'II бүлэг — Шалгалтын материал',
  sub: 'Процент · масштаб · харьцаа · урвуу пропорционал хамаарал',
  grade: '8-р анги',
  topic: 'Алгебр',
  tests: TESTS,
  free: FREE
});
</script>
