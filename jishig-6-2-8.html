// адил хажуут гурвалжин (суурь base, өндөр h) ба өндөр

// Тойргийн зураг (R = 1): o.p — тойрог дээрх цэгүүд {нэр: градус}, o.e — гаднах цэг {нэр: [x, y]}, o.s — хэрчим [[P, Q]],
// o.a — өнцгийн нум [[орой, P, Q, шошго, налуу]], o.r — тэгш өнцгийн тэмдэг [[орой, P, Q]], o.O === false — төвийг тэмдэглэхгүй

// ойлголт: [дүрс, хариу, тайлбар] — тайлбар бүр $…$ агуулна (хариу бүхэлдээ математик горимд орохгүй)

  ['Дурын хоёр тэгш өнцөгт', 'Заавал биш', 'өнцгүүд нь $90^\\circ$ ч талуудын харьцаа өөр байж болно ($2\\times 3$ ба $2\\times 5$)'], ['Дурын хоёр ромб', 'Заавал биш', 'талуудын харьцаа тогтмол ч өнцгүүд нь өөр байж болно ($90^\\circ$ ба $60^\\circ$)'],

// 1. Пифагорын теорем: катет ба гипотенузын аль нэгийг олох (бүхэл ба язгуурт хариутай) (6.3)

//    зөв гурвалжны өндөр, шат, дэлгэц, шон; урвуу теорем — тэгш өнцөгт эсэх (6.3, 6.4)

// 3. Тойрог ба өнцөг (зурагтай): төв ба багтсан өнцөг, диаметрт тулсан өнцөг, багтсан дөрвөн өнцөгт, хоёр шүргэгч, нэг нумд тулсан өнцөг, радиусын адил хажуут гурвалжин (6.4)

// 4. Төсөөтэй дүрс: коэффициент, харгалзах тал (зурагтай), периметр k, талбай k², талбайгаар k, харьцаа ба периметрээр талууд, сүүдэр, тэгшитгэл, ойлголт (6.5)
