<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хоолны карт — Сурагч</title>
<style>
  :root{
    --navy:#0f2c4c; --accent:#2563eb; --accent-d:#1d4ed8; --bg:#eef2f7; --card:#fff;
    --line:#e2e8f0; --line2:#cbd5e1; --text:#1e293b; --muted:#64748b;
    --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
  .wrap{max-width:460px;margin:0 auto;padding:20px 16px 50px}
  .topbar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:600}
  .topbar .mk{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
  svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(15,44,76,.08)}
  .btn{border:none;background:var(--accent-d);color:#fff;padding:12px 16px;border-radius:11px;font-size:15px;font-weight:600;width:100%;cursor:pointer}
  .btn.alt{background:#fff;color:var(--text);border:1px solid var(--line2)}
  .btn:disabled{opacity:.5}
  input{font-family:inherit}

  /* login */
  .login{margin-top:40px;text-align:center}
  .login .logo{width:60px;height:60px;border-radius:15px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .login h1{font-size:19px;margin:0 0 6px}
  .login p{color:var(--muted);font-size:14px;margin:0 0 22px}
  .login input{width:100%;padding:13px 15px;border:1px solid var(--line2);border-radius:11px;text-align:center;font-size:17px;letter-spacing:1px;margin-bottom:12px}
  .err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:6px}

  /* profile */
  .prof{text-align:center;padding:24px}
  .pic{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#94a3b8;border:4px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  .pname{font-size:22px;font-weight:700;margin:14px 0 2px}
  .pgrade{color:var(--muted);margin-bottom:18px}
  .balbox{display:inline-block;padding:14px 32px;border-radius:14px;font-weight:700}
  .balbox .num{font-size:38px;line-height:1}
  .balbox .cap{font-size:13px;font-weight:500;opacity:.85}
  .b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)}
  .sec-title{font-weight:600;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
  .hist{padding:4px 16px}
  .hrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
  .hrow:last-child{border:none}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600}

  /* recharge */
  .rc{padding:18px}
  .rc label{font-size:14px;font-weight:600;color:var(--muted);display:block;margin-bottom:8px}
  .counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .cbtn{padding:14px 0;border:1px solid var(--line2);border-radius:11px;background:#fff;font-weight:600;cursor:pointer;text-align:center}
  .cbtn.sel{border-color:var(--accent);background:#eff6ff;color:var(--accent-d)}
  .cbtn small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  .amt{text-align:center;font-size:15px;color:var(--muted);margin-bottom:14px}
  .amt b{color:var(--text);font-size:20px}
  .qpaybox{text-align:center;padding:8px}
  .qpaybox img{width:230px;height:230px;max-width:100%}
  .banks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
  .banks a{font-size:12px;padding:7px 10px;border:1px solid var(--line2);border-radius:9px;text-decoration:none;color:var(--text);background:#fff}
  .hidden{display:none!important}
  .muted{color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="topbar"><div class="mk"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11h18M5 11V7a2 2 0 012-2h10a2 2 0 012 2v4M4 11h16v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg></div>Цонжин Кибер Боардинг — Хоолны карт</div>
<div class="wrap">

  <!-- LOGIN -->
  <div id="login" class="login">
    <div class="logo"><svg class="ic" style="width:30px;height:30px" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/></svg></div>
    <h1>Картаа уншуулна уу</h1>
    <p>QR кодоо уншуулах эсвэл кодыг гараар оруулна</p>
    <div class="err" id="err"></div>
    <input id="qrInput" placeholder="QR код" autocomplete="off" autofocus>
    <button class="btn" onclick="login()">Нэвтрэх</button>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="card">
      <div class="prof">
        <div id="pic" class="pic"></div>
        <div class="pname" id="pname"></div>
        <div class="pgrade" id="pgrade"></div>
        <div class="balbox" id="balbox"><div class="num" id="bal"></div><div class="cap">үлдсэн эрх</div></div>
      </div>
    </div>

    <div class="sec-title"><svg class="ic" viewBox="0 0 24 24"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Эрх цэнэглэх</div>
    <div class="card rc" id="rcCard">
      <label>Хэдэн удаагийн эрх авах вэ?</label>
      <div class="counts" id="counts"></div>
      <div class="amt">Төлөх дүн: <b id="payAmt">0₮</b></div>
      <button class="btn" id="payBtn" onclick="startPay()">QPay-аар төлөх</button>
    </div>

    <!-- QPay invoice -->
    <div class="card rc hidden" id="qpayCard">
      <div class="qpaybox">
        <p class="muted">QPay аппаар уншуулна уу</p>
        <img id="qpayImg" alt="QPay QR">
        <div class="banks" id="banks"></div>
      </div>
      <button class="btn" id="checkBtn" onclick="checkPay()">Төлбөр шалгах</button>
      <button class="btn alt" style="margin-top:8px" onclick="cancelPay()">Болих</button>
      <p class="muted" id="payMsg" style="margin-top:10px"></p>
    </div>

    <div class="sec-title"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3v5h5M3.05 13A9 9 0 106 5.3L3 8M12 7v5l4 2"/></svg>Гүйлгээний түүх</div>
    <div class="card hist" id="hist"></div>

    <button class="btn alt" style="margin-top:22px" onclick="logout()">Гарах</button>
  </div>
</div>

<script>
const API='/api/food';
let QR='', ME=null, PRICE=27000, selCount=0, curInvoice=null;

async function api(action,data={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});
  return r.json();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function extractQR(v){
  if(!v) return '';
  const m=v.match(/[?&]qr=([^&\s]+)/);
  if(m) return decodeURIComponent(m[1]);
  return v.trim();
}
document.getElementById('qrInput').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function login(){
  const qr=extractQR(document.getElementById('qrInput').value.trim());
  if(!qr)return;
  const j=await api('me',{qr});
  if(!j.ok){ document.getElementById('err').textContent=j.error||'Карт олдсонгүй'; return; }
  QR=qr; ME=j; PRICE=j.mealPrice||27000;
  render();
}
function logout(){ QR=''; ME=null; curInvoice=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('qrInput').value=''; document.getElementById('err').textContent='';
}

function render(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const s=ME.student;
  const pic=document.getElementById('pic');
  if(s.photo) pic.innerHTML=`<img src="${s.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  else pic.textContent=(s.name||'?').charAt(0).toUpperCase();
  document.getElementById('pname').textContent=s.name;
  document.getElementById('pgrade').textContent=(s.grade||'')+' анги';
  const bal=s.balance;
  document.getElementById('bal').textContent=bal;
  const bb=document.getElementById('balbox');
  bb.className='balbox '+(bal<0?'b-bad':bal<=3?'b-warn':'b-ok');
  // counts
  const opts=[10,20,30,50,100];
  document.getElementById('counts').innerHTML=opts.map(c=>
    `<div class="cbtn" data-c="${c}" onclick="selCnt(${c})">${c}<small>${(c*PRICE).toLocaleString()}₮</small></div>`).join('');
  selCount=0; document.getElementById('payAmt').textContent='0₮';
  document.getElementById('payBtn').disabled=true;
  document.getElementById('qpayCard').classList.add('hidden');
  document.getElementById('rcCard').classList.remove('hidden');
  drawHist();
}
function selCnt(c){
  selCount=c;
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('sel',+b.dataset.c===c));
  document.getElementById('payAmt').textContent=(c*PRICE).toLocaleString()+'₮';
  document.getElementById('payBtn').disabled=false;
}
function drawHist(){
  const ev=[
    ...(ME.recharges||[]).map(r=>({t:r.created_at,txt:'+'+r.amount+' удаа цэнэглэв'+(r.method==='qpay'?' (QPay)':''),c:'b-ok'})),
    ...(ME.scans||[]).map(r=>({t:r.scanned_at,txt:'Хоол авав',sub:'үлдсэн '+r.balance_after,c:'b-warn'})),
  ].sort((a,b)=>new Date(b.t)-new Date(a.t)).slice(0,30);
  const el=document.getElementById('hist');
  el.innerHTML=ev.length? ev.map(e=>{
    const d=new Date(e.t); const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    return `<div class="hrow"><div>${e.txt}${e.sub?` <span style="color:var(--muted)">${e.sub}</span>`:''}</div><span style="color:var(--muted);font-size:12px">${ds}</span></div>`;
  }).join('') : '<div class="muted" style="padding:14px">Түүх алга</div>';
}

async function startPay(){
  if(!selCount)return;
  const btn=document.getElementById('payBtn'); btn.disabled=true; btn.textContent='Уншиж байна...';
  const j=await api('recharge.create',{qr:QR,count:selCount});
  btn.disabled=false; btn.textContent='QPay-аар төлөх';
  if(!j.ok){ alert(j.error||'Алдаа гарлаа'); return; }
  curInvoice=j.invoice;
  const img=j.invoice.qr_image;
  document.getElementById('qpayImg').src=img.startsWith('data:')?img:('data:image/png;base64,'+img);
  // bank deeplinks
  const urls=j.invoice.urls||[];
  document.getElementById('banks').innerHTML=urls.map(u=>`<a href="${u.link}">${esc(u.name)}</a>`).join('');
  document.getElementById('payMsg').textContent='';
  document.getElementById('rcCard').classList.add('hidden');
  document.getElementById('qpayCard').classList.remove('hidden');
}
async function checkPay(){
  const btn=document.getElementById('checkBtn'); btn.disabled=true; btn.textContent='Шалгаж байна...';
  const j=await api('recharge.check',{qr:QR,invoice_id:curInvoice.invoice_id});
  btn.disabled=false; btn.textContent='Төлбөр шалгах';
  if(j.ok&&j.paid){
    document.getElementById('payMsg').textContent='Амжилттай! Эрх нэмэгдлээ.';
    const fresh=await api('me',{qr:QR}); ME=fresh; setTimeout(render,1200);
  }else{
    document.getElementById('payMsg').textContent='Төлбөр хараахан төлөгдөөгүй байна. Төлсний дараа дахин шалгана уу.';
  }
}
function cancelPay(){
  curInvoice=null;
  document.getElementById('qpayCard').classList.add('hidden');
  document.getElementById('rcCard').classList.remove('hidden');
}

// ---- Камераар уншуулахад: URL-ийн ?qr= параметрээр автомат нэвтрэх ----
(function boot(){
  const m=location.search.match(/[?&]qr=([^&\s]+)/);
  if(m){
    const qr=decodeURIComponent(m[1]);
    document.getElementById('qrInput').value=qr;
    login();
  }
})();
</script>
</body>
</html>
