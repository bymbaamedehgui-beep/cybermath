<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>|x|²=x² орлуулга — квадрат тэгшитгэл ба тэнцэтгэл биш (12-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13.5px;margin:4px 0 9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:5px}.ql{font-weight:800;color:var(--purple);font-size:13.5px;min-width:22px}.qm{font-size:16px}
  .work{height:21mm;border:1.2px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 16px;font-size:13px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var LAB=['а','б','в','г','д','е','ё','ж','з','и','й','к'];
var SYM={lt:'<',le:'\\le',gt:'>',ge:'\\ge'};
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function reduce(r){var p=r.p,q=r.q;if(q<0){p=-p;q=-q;}var g=gcd(p,q);return {p:p/g,q:q/g};}
function fr(p,q){var r=reduce({p:p,q:q});if(r.q===1)return ''+r.p;return (r.p<0?'-':'')+'\\dfrac{'+Math.abs(r.p)+'}{'+r.q+'}';}
function lin(a,b){var s;if(a===1)s='x';else if(a===-1)s='-x';else s=a+'x';if(b>0)s+='+'+b;else if(b<0)s+='-'+(-b);return s;}
// ── Тоон завсрын алгебр ──
function EP(p,q){var r=reduce({p:p,q:q});return {inf:0,p:r.p,q:r.q};}
var NINF={inf:-1},PINF={inf:1},ZERO=EP(0,1);
function epVal(e){return e.inf<0?-Infinity:(e.inf>0?Infinity:e.p/e.q);}
function mkI(a,ao,b,bo){return {a:a,ao:ao,b:b,bo:bo};}
function negEP(e){return e.inf!==0?{inf:-e.inf}:EP(-e.p,e.q);}
function sortMerge(list){
  list=list.filter(function(I){var lv=epVal(I.a),rv=epVal(I.b);if(lv<rv)return true;if(lv>rv)return false;return !I.ao&&!I.bo;});
  list.sort(function(a,b){return epVal(a.a)-epVal(b.a)||((a.ao?1:0)-(b.ao?1:0));});
  var out=[];
  list.forEach(function(I){
    if(!out.length){out.push({a:I.a,ao:I.ao,b:I.b,bo:I.bo});return;}
    var last=out[out.length-1],lrv=epVal(last.b),ilv=epVal(I.a);
    if(ilv<lrv||(ilv===lrv&&(!I.ao||!last.bo))){var irv=epVal(I.b);if(irv>lrv||(irv===lrv&&!I.bo)){last.b=I.b;last.bo=I.bo;}}
    else out.push({a:I.a,ao:I.ao,b:I.b,bo:I.bo});
  });
  return out;
}
function intersect(S1,S2){
  var out=[];
  S1.forEach(function(i){S2.forEach(function(j){
    var v1=epVal(i.a),v2=epVal(j.a),L,lo;
    if(v1>v2){L=i.a;lo=i.ao;}else if(v2>v1){L=j.a;lo=j.ao;}else{L=i.a;lo=i.ao||j.ao;}
    var w1=epVal(i.b),w2=epVal(j.b),R,ro;
    if(w1<w2){R=i.b;ro=i.bo;}else if(w2<w1){R=j.b;ro=j.bo;}else{R=i.b;ro=i.bo||j.bo;}
    var lv=epVal(L),rv=epVal(R);
    if(lv<rv||(lv===rv&&!lo&&!ro))out.push(mkI(L,lo,R,ro));
  });});
  return sortMerge(out);
}
function union(S1,S2){return sortMerge(S1.concat(S2));}
function inSet(S,x){for(var i=0;i<S.length;i++){var I=S[i],lv=epVal(I.a),rv=epVal(I.b);var okL=x>lv||(x===lv&&!I.ao),okR=x<rv||(x===rv&&!I.bo);if(okL&&okR)return true;}return false;}
function fmtInterval(I){
  if(I.a.inf===0&&I.b.inf===0&&(I.a.p/I.a.q)===(I.b.p/I.b.q))return '\\{'+fr(I.a.p,I.a.q)+'\\}';
  var lb=I.a.inf<0?']':(I.ao?']':'['),rb=I.b.inf>0?'[':(I.bo?'[':']');
  var lv=I.a.inf<0?'-\\infty':fr(I.a.p,I.a.q),rv=I.b.inf>0?'+\\infty':fr(I.b.p,I.b.q);
  return lb+lv+';\\,'+rv+rb;
}
function fmtSet(S){
  if(!S.length)return '\\varnothing';
  if(S.length===1&&S[0].a.inf<0&&S[0].b.inf>0)return 'x\\in\\mathbb{R}';
  return 'x\\in '+S.map(fmtInterval).join('\\cup ');
}
function solveLinRel(m,n,rel){
  if(m===0){var ok=(rel==='gt'?n>0:rel==='ge'?n>=0:rel==='lt'?n<0:n<=0);return ok?[mkI(NINF,true,PINF,true)]:[];}
  var x0=EP(-n,m),strict=(rel==='gt'||rel==='lt'),greater=(rel==='gt'||rel==='ge');
  var upper=(m>0)?greater:!greater;
  if(upper)return [mkI(x0,strict,PINF,true)];
  return [mkI(NINF,true,x0,strict)];
}
function solveProdRel(P1,P0,Q1,Q0,rel){
  var sp=(rel==='gt'||rel==='lt')?'gt':'ge', sn=(rel==='gt'||rel==='lt')?'lt':'le';
  var sameSign=(rel==='gt'||rel==='ge');
  var Pp=solveLinRel(P1,P0,sp),Pn=solveLinRel(P1,P0,sn),Qp=solveLinRel(Q1,Q0,sp),Qn=solveLinRel(Q1,Q0,sn);
  if(sameSign)return union(intersect(Pp,Qp),intersect(Pn,Qn));
  return union(intersect(Pp,Qn),intersect(Pn,Qp));
}
function relCmp(rel,l,r){return rel==='gt'?l>r:rel==='ge'?l>=r:rel==='lt'?l<r:l<=r;}
// u→x буцаах орлуулга (x=(u-bi)/ai)
function mapX(e,ai,bi){if(e.inf!==0)return ai>0?{inf:e.inf}:{inf:-e.inf};return EP(e.p-bi*e.q,ai*e.q);}
function mapUtoX(uSet,ai,bi){var out=[];uSet.forEach(function(I){var e1=mapX(I.a,ai,bi),e2=mapX(I.b,ai,bi);if(ai>0)out.push(mkI(e1,I.ao,e2,I.bo));else out.push(mkI(e2,I.bo,e1,I.ao));});return sortMerge(out);}
// ТЭНЦЭТГЭЛ БИШ: a2·t²+b2·t+c2 rel 0, t=|ai·x+bi|≥0
function solveQuadAbsIneq(r1,r2,ai,bi,rel){
  var Tall=solveProdRel(r1.q,-r1.p,r2.q,-r2.p,rel);
  var Tpos=intersect(Tall,[mkI(ZERO,false,PINF,true)]);
  var xset=[];
  Tpos.forEach(function(I){
    var tl=I.a,tr=I.b,tlo=I.ao,tro=I.bo,tlv=epVal(tl);
    var upperU=tr.inf>0?[mkI(NINF,true,PINF,true)]:[mkI(negEP(tr),tro,tr,tro)];
    var lowerU;
    if(tlv<=0&&!tlo)lowerU=[mkI(NINF,true,PINF,true)];
    else if(tlv===0&&tlo)lowerU=[mkI(NINF,true,ZERO,true),mkI(ZERO,true,PINF,true)];
    else lowerU=[mkI(NINF,true,negEP(tl),tlo),mkI(tl,tlo,PINF,true)];
    xset=xset.concat(mapUtoX(intersect(upperU,lowerU),ai,bi));
  });
  return sortMerge(xset);
}
// ТЭГШИТГЭЛ: t=r1,r2 (r≥0) → |ai·x+bi|=r
function solveQuadAbsEq(r1,r2,ai,bi){
  var roots=[];
  [r1,r2].forEach(function(r){var v=epVal(r);if(v<0)return;
    if(v===0)roots.push(EP(-bi,ai));
    else{roots.push(EP(r.p-bi*r.q,ai*r.q));roots.push(EP(-r.p-bi*r.q,ai*r.q));}});
  var uniq=[],seen={};
  roots.forEach(function(e){var k=e.p+'/'+e.q;if(!seen[k]){seen[k]=1;uniq.push(e);}});
  uniq.sort(function(a,b){return a.p/a.q-b.p/b.q;});
  return uniq;
}
function isqrt(n){if(n<0)return -1;var s=Math.round(Math.sqrt(n));return s*s===n?s:-1;}
// a2·t²+b2·t+c2, рационал үндэстэй (бүхэл коэфф), r2≥0
function quadCoef(a2){
  for(var it=0;it<400;it++){
    var b2=nz(-11,11),c2=rnd(-16,16); if(c2===0&&Math.abs(b2)<2)continue;
    var disc=b2*b2-4*a2*c2; var s=isqrt(disc); if(s<0)continue;
    var den=2*a2,r1=EP(-b2-s,den),r2=EP(-b2+s,den);
    if(epVal(r2)<0)continue;
    return {a2:a2,b2:b2,c2:c2,r1:r1,r2:r2};
  }
  return null;
}
// ── Илэрхийлэл угсрах ──
function joinSum(terms){if(!terms.length)return '0';var out='';terms.forEach(function(t,i){if(i===0)out+=(t.sign<0?'-':'')+t.tex;else out+=(t.sign<0?' - ':' + ')+t.tex;});return out;}
function tTerm(coef,base){if(coef===0)return null;return {sign:coef<0?-1:1,tex:(Math.abs(coef)===1?'':Math.abs(coef))+base};}
function cTerm(c){if(c===0)return null;return {sign:c<0?-1:1,tex:''+Math.abs(c)};}
function buildExpr(fam,a2,b2,c2,ai,bi){
  var t=[];
  if(fam==='absx'){t.push(tTerm(a2,'x^2'));t.push(tTerm(b2,'\\left|x\\right|'));t.push(cTerm(c2));}
  else if(fam==='binom'){t.push(tTerm(a2,'\\left('+lin(ai,bi)+'\\right)^2'));t.push(tTerm(b2,'\\left|'+lin(ai,bi)+'\\right|'));t.push(cTerm(c2));}
  else{t.push(tTerm(1,'x^2'));t.push(tTerm(2*bi,'x'));t.push(tTerm(b2,'\\left|'+lin(1,bi)+'\\right|'));t.push(cTerm(bi*bi+c2));}
  return joinSum(t.filter(function(x){return x;}));
}
// ── Генератор ──
function makeProb(kind){
  var fam=pick(['absx','absx','absx','binom','expand1']);
  var a2=quadCoef(fam==='expand1'?1:pick([1,2,3])); if(!a2)return null;
  var ai=1,bi=0;
  if(fam==='binom'){ai=pick([1,2,3]);bi=nz(-6,6);}
  else if(fam==='expand1'){ai=1;bi=nz(-5,5);}
  var A2=a2.a2,B2=a2.b2,C2=a2.c2;
  var Efn=function(x){var u=ai*x+bi;return A2*u*u+B2*Math.abs(u)+C2;};
  var q,rel;
  if(kind==='eq'){rel='eq';q=buildExpr(fam,A2,B2,C2,ai,bi)+' = 0';
    var roots=solveQuadAbsEq(a2.r1,a2.r2,ai,bi);
    var aTex=roots.length?'x\\in\\left\\{'+roots.map(function(e){return fr(e.p,e.q);}).join(';\\,')+'\\right\\}':'\\varnothing';
    return {type:'eq',q:q,a:aTex,roots:roots.map(function(e){return e.p/e.q;}),h:Efn,key:'EQ'+fam+A2+B2+C2+ai+bi};
  }else{
    rel=pick(['lt','le','gt','ge']);q=buildExpr(fam,A2,B2,C2,ai,bi)+' '+SYM[rel]+' 0';
    var S=solveQuadAbsIneq(a2.r1,a2.r2,ai,bi,rel);
    return {type:'ineq',q:q,a:fmtSet(S),set:S,pred:function(x){return relCmp(rel,Efn(x),0);},key:'IN'+fam+A2+B2+C2+ai+bi+rel};
  }
}
function build(){
  var N=12,items=[],seen={},probs='',ans='',i,emptyN=0,allN=0;window.__PROB=[];
  for(i=0;i<N;i++){
    var kind=(i%2===0)?'eq':'ineq',g=null,tr=0,ok=false;
    do{
      g=makeProb(kind); tr++; ok=false;
      if(g&&!seen[g.key]){
        if(g.a==='\\varnothing'){ if(emptyN<2)ok=true; }
        else if(g.a==='x\\in\\mathbb{R}'){ if(allN<1)ok=true; }
        else ok=true;
      }
    }while(!ok&&tr<500);
    if(!g)continue; seen[g.key]=1;
    if(g.a==='\\varnothing')emptyN++; else if(g.a==='x\\in\\mathbb{R}')allN++;
    var lb=LAB[i]||('#'+(i+1));
    probs+='<div class="q"><div class="qeq"><span class="ql">'+lb+')</span><span class="qm">$'+g.q+'$</span></div><div class="work"></div></div>';
    ans+='<div class="a"><span class="an">'+lb+')</span><span>$'+g.a+'$</span></div>';
    items.push({q:g.q,a:g.a});
    window.__PROB.push(g);
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>|x|² = x² орлуулгын аргаар</h1><div class="sub">$y=|x|$ (эсвэл $y=|ax+b|$) орлуулж, квадрат тэгшитгэл ба тэнцэтгэл бишид шилжүүлж бод · 12-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$|x|^2=x^2$ &nbsp;·&nbsp; $y=|x|\\ge0$ орлуулж квадрат бод, дараа нь $|x|$-ийг буцааж завсар/олонлог бич</div>'
    +'<div class="task">1. Бод (тэгшитгэл ба тэнцэтгэл биш).</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='|x|²=x² орлуулга — квадрат тэгшитгэл ба тэнцэтгэл биш (12-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>

</body>
