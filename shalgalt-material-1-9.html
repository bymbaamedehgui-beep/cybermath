<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>I бүлэг — Шалгалтын материал (тест + задгай, 9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.42;font-size:11.5px}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;align-items:flex-end;font-size:11.5px;margin:8px 2px 10px}.meta>span{border-bottom:1px dotted #b3a9cf;padding:0 22px 2px 4px}
  .score-top{font-weight:800;color:#5a32d6;white-space:nowrap}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .t-item{break-inside:avoid;page-break-inside:avoid;margin-bottom:6px}
  .t-stem{font-size:12px;margin-bottom:3px;overflow:hidden}.t-stem .n{font-weight:800;color:var(--purple);margin-right:5px}
  .pt{float:right;color:var(--soft);font-size:11px;font-weight:700;white-space:nowrap;margin-left:10px;border:1px solid #e2daf5;border-radius:20px;padding:0 8px}
  .ptv,.varv{outline:none;cursor:text;font-weight:800;color:#5a32d6;display:inline-block;text-align:center}
  .ptv{min-width:13px;border-bottom:1px dotted #b9a9ef}
  .varv{min-width:26px;border-bottom:1px dotted #b9a9ef}
  .varv:empty::before,.ptv:empty::before{content:attr(data-ph);color:#c7bde6;font-weight:600}
  .ptv:focus,.varv:focus{background:#f5efff;border-radius:4px}
  @media print{.varv:empty::before,.ptv:empty::before{content:""}}
  .grade{break-inside:avoid;page-break-inside:avoid;margin-top:12px;border:1.5px solid #d9cff5;border-radius:9px;padding:9px 11px}
  .gtitle{font-weight:800;color:#5a32d6;font-size:12.5px;margin-bottom:7px}
  .gtbl{border-collapse:collapse;font-size:11.5px;margin-bottom:7px}.gtbl th,.gtbl td{border:1px solid #c9bdec;padding:3px 4px;text-align:center;min-width:26px;height:18px}.gtbl th{background:#f3eefe;color:#5a32d6;font-weight:800;min-width:52px}.gtbl td.lab{font-weight:800;color:var(--purple);background:#faf8ff}
  .gtot{font-weight:800;color:#5a32d6;font-size:12.5px;margin-top:4px}.gtot u{display:inline-block;min-width:60px;border-bottom:1.5px solid #b3a9cf;text-decoration:none}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 10px;padding-left:20px;align-items:baseline}
  .opts.two{grid-template-columns:1fr 1fr;gap:3px 18px}
  .opt{font-size:11.5px}.opt .ol{font-weight:800;color:var(--soft);margin-right:4px}
  .free{break-inside:avoid;page-break-inside:avoid;margin-bottom:8px}
  .free .fs{font-size:12px;margin-bottom:5px}.free .fs .n{font-weight:800;color:var(--purple);margin-right:5px}
  .work{height:24mm;border:1.2px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:8px}
  .ak{font-size:13px;margin-bottom:5px}.ak .n{font-weight:800;color:var(--purple);min-width:26px;display:inline-block}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ хувилбар</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
  <button class="btn" style="background:linear-gradient(135deg,#0ea5e9,#2563eb)" onclick="openVariantModal()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Олон хувилбар</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var OL=['А','Б','В','Г'];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function ipow(n){return Math.pow(10,n);}
function fmtDec(m,dec){var neg=m<0;m=Math.abs(m);var s=''+m;if(dec===0)return (neg?'-':'')+s;while(s.length<=dec)s='0'+s;return (neg?'-':'')+s.slice(0,s.length-dec)+'.'+s.slice(s.length-dec);}
function roundPlace(N,place){var q=Math.floor(N/place),rem=N-q*place;return (q+(2*rem>=place?1:0))*place;}
function roundDiv(a,b,q){var q10=ipow(q),num=a*q10,quo=Math.floor(num/b),rem=num-quo*b;return quo+(2*rem>=b?1:0);}
function mant(){var d=rnd(1,3),first=rnd(1,9),digs=''+first;for(var i=1;i<d;i++)digs+=rnd(0,9);if(d>1&&digs[d-1]==='0')digs=digs.slice(0,d-1)+rnd(1,9);return {m:digs.length>1?(digs[0]+'.'+digs.slice(1)):digs,digs:digs};}
function plainFromStd(digs,n){var d=digs.length,shift=n-(d-1);if(shift>=0){var z='';for(var i=0;i<shift;i++)z+='0';return digs+z;}var k=-shift;if(k<d)return digs.slice(0,d-k)+'.'+digs.slice(d-k);var zz='';for(var j=0;j<k-d;j++)zz+='0';return '0.'+zz+digs;}
function intToStd(s){var z=0;while(s.length>1&&s[s.length-1]==='0'){s=s.slice(0,-1);z++;}var d=s.length;return {m:d>1?(s[0]+'.'+s.slice(1)):s,e:z+(d-1)};}
function grp(s){s=''+s;if(s.indexOf('.')>=0)return s;var out='',c=0;for(var i=s.length-1;i>=0;i--){out=s[i]+out;if(++c%3===0&&i>0)out='\\,'+out;}return out;}
function isPS(n){var r=Math.round(Math.sqrt(n));return r*r===n;}
function ansRad(S,d){if(S===0)return '0';var sign=S<0?'-':'',mag=Math.abs(S);return sign+(mag===1?'':mag)+'\\sqrt{'+d+'}';}
var SF=[2,3,5,6,7];
function finishMC(opts){var sh=shuffle(opts),ci=-1;for(var i=0;i<sh.length;i++)if(sh[i].ok)ci=i;return {opts:sh,correct:ci};}
function C(t){return {t:t};}
function makeMC(cor,distr){var opts=[{tex:cor.t,ok:true}],used=[cor.t];for(var i=0;i<distr.length&&opts.length<4;i++){var d=distr[i];if(!d)continue;if(used.indexOf(d.t)>=0)continue;used.push(d.t);opts.push({tex:d.t,ok:false});}if(opts.length<4)return null;return finishMC(opts);}
// ── Тест (1.1–1.4) ──
function t1(){var n;do{n=rnd(2,150);}while(isPS(n));var lo=Math.floor(Math.sqrt(n));var mc=makeMC(C(lo+'\\lt\\sqrt{'+n+'}\\lt'+(lo+1)),[C((lo-1)+'\\lt\\sqrt{'+n+'}\\lt'+lo),C((lo+1)+'\\lt\\sqrt{'+n+'}\\lt'+(lo+2)),C(lo+'\\lt\\sqrt{'+n+'}\\lt'+(lo+2)),C((lo-1)+'\\lt\\sqrt{'+n+'}\\lt'+(lo+1))]);if(!mc)return null;return {stem:'$\\sqrt{'+n+'}$ тоо аль хоёр дараалсан бүхэл тооны хооронд оршино вэ?',mc:mc};}
function t2(){var a=rnd(2,6),b=pick(SF),n=a*a*b;var mc=makeMC(C(a+'\\sqrt{'+b+'}'),[C((a+1)+'\\sqrt{'+b+'}'),C((a-1>1?a-1:a+2)+'\\sqrt{'+b+'}'),C(a+'\\sqrt{'+(b+1)+'}'),C(''+(a*b))]);if(!mc)return null;return {stem:'$\\sqrt{'+n+'}=$',mc:mc};}
function t3(){var IRR=['\\sqrt{2}','\\sqrt{3}','\\sqrt{5}','\\sqrt{7}','\\sqrt{10}','\\sqrt{11}','\\sqrt{13}','\\sqrt{15}'];var RAT=['\\sqrt{4}','\\sqrt{9}','\\sqrt{16}','\\sqrt{25}','\\sqrt{36}','2.5','\\dfrac{3}{4}','0.7','\\sqrt[3]{27}','\\sqrt[3]{8}'];var rr=shuffle(RAT).slice(0,3);var mc=makeMC(C(pick(IRR)),[C(rr[0]),C(rr[1]),C(rr[2])]);if(!mc)return null;return {stem:'Дараахаас аль нь <b>иррационал</b> тоо вэ?',mc:mc};}
function t4(){var M=mant(),n=rnd(2,9),plain=plainFromStd(M.digs,n);var mc=makeMC(C(M.m+'\\times10^{'+n+'}'),[C(M.m+'\\times10^{'+(n+1)+'}'),C(M.m+'\\times10^{'+(n-1)+'}'),C(M.m+'\\times10^{'+n+'}\\cdot10')]);if(!mc)return null;return {stem:'$'+grp(plain)+'$ тооны стандарт хэлбэр:',mc:mc};}
function t5(){var k=rnd(11,40);var mc=makeMC(C(''+k),[C(''+(k-1)),C(''+(k+1)),C(''+(k+2)),C(''+(2*k))]);if(!mc)return null;return {stem:'$\\sqrt{'+(k*k)+'}=$',mc:mc};}
function t6(){var place=pick([100,1000]),N=rnd(place*3,place*90);var cor=roundPlace(N,place),tr=Math.floor(N/place)*place,up=tr+place;var mc=makeMC(C(grp(cor)),[C(grp(cor===tr?up:tr)),C(grp(roundPlace(N,place*10))),C(grp(cor+place)),C(grp(cor-place))]);if(!mc)return null;return {stem:'$'+grp(N)+'$-ийг '+(place===100?'зуутаар':'мянгатаар')+' тоймловол:',mc:mc};}
function t7(){var d=pick(SF),p=rnd(2,6),q=rnd(2,6),r=rnd(1,3),S=p+q-r;if(S<=0)return null;var mc=makeMC(C((S===1?'':S)+'\\sqrt{'+d+'}'),[C((p+q+r)+'\\sqrt{'+d+'}'),C((S+1)+'\\sqrt{'+d+'}'),C(S+'\\sqrt{'+(d+1)+'}'),C(''+S)]);if(!mc)return null;return {stem:'$'+p+'\\sqrt{'+d+'}+'+q+'\\sqrt{'+d+'}-'+r+'\\sqrt{'+d+'}=$',mc:mc};}
function t8(){var d=pick(SF),x=rnd(1,4),y=rnd(1,4),a=d*x*x,b=d*y*y;if(a===b)return null;var ans=d*x*y;var mc=makeMC(C(''+ans),[C(''+(ans+1)),C(''+(ans-1)),C(''+(a*b)),C(''+(2*ans))]);if(!mc)return null;return {stem:'$\\sqrt{'+a+'}\\cdot\\sqrt{'+b+'}=$',mc:mc};}
function t9(){var a=rnd(2,9),b=pick(SF);var mc=makeMC(C('\\sqrt{'+(a*a*b)+'}'),[C('\\sqrt{'+(a*b)+'}'),C('\\sqrt{'+(a*a+b)+'}'),C('\\sqrt{'+(a*b*b)+'}'),C('\\sqrt{'+(a*a*b+1)+'}')]);if(!mc)return null;return {stem:'$'+a+'\\sqrt{'+b+'}=$',mc:mc};}
function t10(){var arr=[],seen={};for(var i=0;i<20&&arr.length<4;i++){var M=mant(),n=rnd(2,6),v=parseFloat(M.m)*ipow(n),tex=M.m+'\\times10^{'+n+'}';if(seen[tex])continue;seen[tex]=1;arr.push({v:v,t:tex});}if(arr.length<4)return null;var mx=arr[0];arr.forEach(function(o){if(o.v>mx.v)mx=o;});var others=arr.filter(function(o){return o!==mx;});var mc=makeMC(C(mx.t),[C(others[0].t),C(others[1].t),C(others[2].t)]);if(!mc)return null;return {stem:'Аль нь хамгийн <b>их</b> вэ?',mc:mc};}
var TESTS=[t1,t2,t3,t4,t5,t6,t7,t8,t9,t10];
// ── Задгай ──
function free1(){var d=pick(SF),n=rnd(3,4),S=0,q='',first=true;for(var i=0;i<n;i++){var mag=rnd(2,5),neg=rnd(0,1)===1,k=neg?-mag:mag;S+=k;q+=(first?(neg?'-':''):(neg?' - ':' + '))+'\\sqrt{'+(mag*mag*d)+'}';first=false;}return {stem:'Хялбарчил: $'+q+'$',a:ansRad(S,d)};}
function free2(){var da=rnd(1,9),db=rnd(1,9),p=rnd(2,5),q2=rnd(2,5);var prod=''+(da*db);for(var i=0;i<p+q2;i++)prod+='0';var st=intToStd(prod);return {stem:'Стандарт хэлбэрт бич: $('+da+'\\times10^{'+p+'})\\cdot('+db+'\\times10^{'+q2+'})$',a:st.m+'\\times10^{'+st.e+'}'};}
function free3(){var a=rnd(100,9999),b=rnd(3,40),R=roundDiv(a,b,2);return {stem:'$'+a+'\\div'+b+'$-ийг $0.01$ нарийвчлалтай ол.',a:'\\approx '+fmtDec(R,2)};}
function free4(){var c=rnd(2,12),b=pick([2,3,5,6,7]),g=gcd(c,b),num=c/g,den=b/g;var ans=(den===1)?((num===1?'':num)+'\\sqrt{'+b+'}'):('\\dfrac{'+(num===1?'':num)+'\\sqrt{'+b+'}}{'+den+'}');return {stem:'Хуваарийг иррационалаас чөлөөл: $\\dfrac{'+c+'}{\\sqrt{'+b+'}}$',a:ans};}
function free5(){var n;do{n=rnd(2,120);}while(isPS(n));var lo=Math.floor(Math.sqrt(n)),r=(Math.round(Math.sqrt(n)*10)/10).toFixed(1);return {stem:'$\\sqrt{'+n+'}$ ямар хоёр дараалсан бүхэл тооны хооронд оршихыг бич, дараа нь $0.1$ нарийвчлалтай ойролцоол.',a:lo+'\\lt\\sqrt{'+n+'}\\lt'+(lo+1)+',\\ \\sqrt{'+n+'}\\approx '+r};}
var FREE=[free1,free2,free3,free4,free5];
var TEST_PT=1,FREE_PT=[2,2,3,3,3],ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function totalPts(){return 10*TEST_PT+FREE_PT.reduce(function(s,v){return s+v;},0);}
function ptFmt(v){return (Math.round(v*100)/100).toString();}
function recomputeTotal(){var tot=0;[].forEach.call(document.querySelectorAll('#sheet .ptv'),function(el){var v=parseFloat((el.textContent||'').replace(',','.'));if(!isNaN(v))tot+=v;});var s=ptFmt(tot);[].forEach.call(document.querySelectorAll('#sheet .totmax'),function(el){el.textContent=s;});}
function adjustOpts(){[].forEach.call(document.querySelectorAll('#sheet .opts'),function(op){op.classList.remove('two');var cells=op.children;if(!cells.length)return;var cellW=cells[0].clientWidth,need2=false;[].forEach.call(cells,function(o){var prev=o.getAttribute('style')||'';o.style.position='absolute';o.style.whiteSpace='nowrap';o.style.width='auto';o.style.visibility='hidden';var w=o.offsetWidth;o.setAttribute('style',prev);if(w>cellW+1)need2=true;});if(need2)op.classList.add('two');});}
function gen(fn){for(var t=0;t<250;t++){var g=fn();if(g)return g;}return null;}
function build(){
  window.__TEST=[];window.__FREE=[];
  var testHtml='',akTest='',seen={};
  for(var i=0;i<10;i++){var g=null,tr=0;do{g=gen(TESTS[i]);tr++;}while(g&&seen[g.stem]&&tr<50);if(!g)continue;seen[g.stem]=1;window.__TEST.push(g);
    var opts=g.mc.opts.map(function(o,j){return '<div class="opt"><span class="ol">'+OL[j]+'.</span>$'+o.tex+'$</div>';}).join('');
    testHtml+='<div class="t-item"><div class="t-stem"><span class="pt"><b class="ptv" contenteditable="true">'+TEST_PT+'</b> оноо</span><span class="n">'+(i+1)+'.</span>'+g.stem+'</div><div class="opts">'+opts+'</div></div>';
    akTest+=(i>0?', ':'')+(i+1)+'-'+OL[g.mc.correct];}
  var freeHtml='',akFree='';
  for(var f=0;f<FREE.length;f++){var fg=gen(FREE[f]);if(!fg)continue;window.__FREE.push(fg);
    freeHtml+='<div class="free"><div class="fs"><span class="pt"><b class="ptv" contenteditable="true">'+FREE_PT[f]+'</b> оноо</span><span class="n">'+(11+f)+'.</span>'+fg.stem+'</div><div class="work"></div></div>';
    akFree+='<div class="ak"><span class="n">'+(11+f)+')</span> $'+fg.a+'$</div>';}
  var TOTAL=totalPts();
  var gRoman='<table class="gtbl"><tr><th>Тест</th>'+ROMAN.map(function(r){return '<td class="lab">'+r+'</td>';}).join('')+'</tr><tr><th>Оноо</th>'+ROMAN.map(function(){return '<td></td>';}).join('')+'</tr></table>';
  var gFree='<table class="gtbl"><tr><th>Задгай</th>'+FREE_PT.map(function(_,i){return '<td class="lab">2.'+(i+1)+'</td>';}).join('')+'</tr><tr><th>Оноо</th>'+FREE_PT.map(function(){return '<td></td>';}).join('')+'</table>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>I бүлэг — Шалгалтын материал</h1><div class="sub">Тоо, тоон олонлог, зэрэг язгуур: рационал/иррационал · язгуур хялбарчлах · стандарт хэлбэр · тоймлол · 9-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Хугацаа: </span><div class="score-top">Хувилбар: <b class="varv" contenteditable="true" data-ph="А"></b> · Оноо: <b class="totmax">'+TOTAL+'</b></div></div>'
    +'<div class="task">I. Сонголттой тест. Зөв хариуг сонгоно уу. (1–10)</div>'+testHtml
    +'<div class="task">II. Задгай даалгавар. Бодолтоо дэлгэрэнгүй бичнэ үү. (11–15)</div>'+freeHtml
    +'<div class="grade"><div class="gtitle">Багшийн засах хүснэгт — авсан оноо</div>'+gRoman+gFree+'<div class="gtot">Нийт авсан оноо: <u></u> / <b class="totmax">'+TOTAL+'</b> оноо</div></div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ak"><span class="n">Тест:</span> '+akTest+'</div><div style="height:6px"></div><div class="ak" style="font-weight:800;color:#5a32d6">Задгай даалгавар:</div>'+akFree+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='I бүлэг — Шалгалтын материал (9-р анги)';
  [].forEach.call(document.querySelectorAll('#sheet .ptv'),function(el){el.addEventListener('input',recomputeTotal);el.addEventListener('focus',function(){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);});});
  recomputeTotal();toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{adjustOpts();}catch(e){}
}
var VLET=['А','Б','В','Г','Д','Е','Ё','Ж','З','И','Й','К','Л','М','Н','О'];
function hugSpan(){return [].filter.call(document.querySelectorAll('#sheet .meta > span'),function(s){return /Хугацаа/.test(s.textContent);})[0]||null;}
function getHug(){var sp=hugSpan();if(!sp)return '';var f=sp.querySelector('.cm-fill');return ((f?f.textContent:sp.textContent.replace(/^[^:]*:?\s*/,''))||'').trim();}
function hugFill(){var sp=hugSpan();return sp?sp.querySelector('.cm-fill'):null;}
function snapPts(){return [].map.call(document.querySelectorAll('#sheet .ptv'),function(e){return e.textContent;});}
function injectVBatchCSS(){if(document.getElementById('cm-vbatch-css'))return;var st=document.createElement('style');st.id='cm-vbatch-css';st.textContent='@media print{body>*:not(#cm-vbatch){display:none!important}body>#cm-vbatch{display:block!important}.cm-vsheet{page-break-after:always;box-shadow:none!important;width:auto!important;min-height:auto!important;margin:0!important;padding:0!important;background:#fff;zoom:1!important}.cm-vsheet:last-child{page-break-after:auto}}';document.head.appendChild(st);}
function openVariantModal(){if(document.getElementById('cm-vmodal'))return;var o=document.createElement('div');o.id='cm-vmodal';o.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(20,15,40,.6);display:grid;place-items:center;padding:16px;font-family:"Segoe UI",Arial,sans-serif';
  o.innerHTML='<div style="background:#fff;border-radius:16px;max-width:410px;width:100%;padding:20px;box-shadow:0 24px 60px -18px rgba(0,0,0,.5)"><div style="font-weight:900;color:#5a32d6;font-size:1.06rem;margin-bottom:4px">Олон хувилбар гаргах</div><p style="color:#7a7390;font-size:.84rem;margin-bottom:12px;line-height:1.45">Одоогийн <b>загвараас</b> хэдэн хувилбар гаргах вэ? Бодлого нь өөр, харин <b>Хугацаа ба оноо хэвээр</b>. Хувилбар <b>А, Б, В…</b> автоматаар тавигдана. Төгсгөлд нь хариун түлхүүр гарна.</p><label style="display:block;font-size:.85rem;font-weight:700;color:#3a2d5e;margin-bottom:5px">Хувилбарын тоо</label><input id="cm-vcount" type="number" min="1" max="16" value="4" style="width:100%;box-sizing:border-box;border:1.6px solid #e7ddff;border-radius:10px;padding:.55rem .8rem;font-size:1rem;font-weight:700;outline:none;font-family:inherit;margin-bottom:14px"><div id="cm-vmsg" style="font-size:.82rem;color:#7a7390;margin-bottom:8px"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button id="cm-vcancel" style="border:1.4px solid #e7ddff;background:#faf7ff;color:#5a32d6;font-weight:800;border-radius:999px;padding:.5rem 1rem;cursor:pointer;font-family:inherit">Болих</button><button id="cm-vgo" style="border:0;background:linear-gradient(135deg,#7B52EE,#A855F7);color:#fff;font-weight:800;border-radius:999px;padding:.5rem 1.2rem;cursor:pointer;font-family:inherit">Гаргаж хэвлэх</button></div></div>';
  document.body.appendChild(o);var ci=o.querySelector('#cm-vcount');try{ci.focus();ci.select();}catch(e){}o.querySelector('#cm-vcancel').onclick=function(){o.remove();};o.querySelector('#cm-vgo').onclick=function(){var n=parseInt(ci.value,10);if(!n||n<1){o.querySelector('#cm-vmsg').style.color='#dc2626';o.querySelector('#cm-vmsg').textContent='Хувилбарын тоог зөв оруулна уу.';return;}o.remove();genVariants(n);};}
function genVariants(N){if(!N||N<1)return;if(N>16)N=16;var sheet=document.getElementById('sheet'),hug=getHug(),pts=snapPts(),sa=document.getElementById('sa');if(sa&&sa.checked){sa.checked=false;toggleAns();}var old=document.getElementById('cm-vbatch');if(old)old.remove();var box=document.createElement('div');box.id='cm-vbatch';box.style.display='none';var keys=[];
  for(var i=0;i<N;i++){build();var tk=(window.__TEST||[]).map(function(g,idx){return (idx+1)+'-'+OL[g.mc.correct];}).join(', ');var fk=(window.__FREE||[]).map(function(f,idx){return {n:11+idx,a:f.a};});var clone=sheet.cloneNode(true);clone.removeAttribute('id');clone.classList.add('cm-vsheet');var ap=clone.querySelector('#answers,.ans-page');if(ap)ap.parentNode.removeChild(ap);var cptv=clone.querySelectorAll('.ptv'),tot=0;for(var k=0;k<cptv.length;k++){if(pts[k]!=null)cptv[k].textContent=pts[k];var v=parseFloat((cptv[k].textContent||'').replace(',','.'));if(!isNaN(v))tot+=v;cptv[k].removeAttribute('contenteditable');}[].forEach.call(clone.querySelectorAll('.totmax'),function(e){e.textContent=ptFmt(tot);});var hs=[].filter.call(clone.querySelectorAll('.meta > span'),function(s){return /Хугацаа/.test(s.textContent);})[0];if(hs)hs.textContent='Хугацаа: '+hug;var vv=clone.querySelector('.varv');if(vv){vv.textContent=VLET[i]||('#'+(i+1));vv.removeAttribute('contenteditable');}box.appendChild(clone);keys.push({letter:VLET[i]||('#'+(i+1)),tk:tk,fk:fk});}
  var keyHtml='<div class="sheet cm-vsheet"><div class="head"><h1>Хариун түлхүүр — бүх хувилбар</h1><div class="sub">I бүлэг — Шалгалтын материал · 9-р анги</div></div>';keys.forEach(function(kr){keyHtml+='<div style="margin:9px 0;break-inside:avoid;border-left:3px solid #A855F7;padding-left:9px"><div style="font-weight:800;color:#5a32d6;font-size:13.5px;margin-bottom:3px">Хувилбар '+kr.letter+'</div><div style="font-size:12px;margin-bottom:3px"><b>Тест:</b> '+kr.tk+'</div><div style="font-size:12px"><b>Задгай:</b> '+kr.fk.map(function(x){return x.n+') $'+x.a+'$';}).join(' &nbsp;·&nbsp; ')+'</div></div>';});keyHtml+='</div>';box.insertAdjacentHTML('beforeend',keyHtml);document.body.appendChild(box);injectVBatchCSS();
  try{renderMathInElement(box,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  function cleanup(){var b=document.getElementById('cm-vbatch');if(b)b.remove();window.removeEventListener('afterprint',cleanup);try{build();}catch(e){}var pv=document.querySelectorAll('#sheet .ptv');for(var k=0;k<pv.length;k++){if(pts[k]!=null)pv[k].textContent=pts[k];}try{recomputeTotal();}catch(e){}setTimeout(function(){var f=hugFill();if(f&&hug)f.textContent=hug;},80);}
  window.addEventListener('afterprint',cleanup);setTimeout(function(){window.print();},140);}
build();
window.addEventListener('load',function(){try{adjustOpts();}catch(e){}});
window.addEventListener('beforeprint',function(){try{adjustOpts();}catch(e){}});
</script>
