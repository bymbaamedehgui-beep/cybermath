<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>I бүлэг — Жишиг даалгавар 1 (7-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 7-р анги · I бүлэг. Бүхэл тоон олонлог, зэрэг, язгуур — Жишиг даалгавар 1
   (1.1 Тооны модул · 1.2 Бүхэл тооны нэмэх, хасах · 1.3 Бүхэл тооны үржүүлэх, хуваах) */
// Төрлүүдийг ээлжлэн сонгоно (нэг даалгаварт ижил төрөл дараалан давтагдахгүй); сонгосон төрөл үүстэл давтана
var BAGS = {};
function rot(key, fns) {
  var b = BAGS[key];
  if (!b || !b.length) b = BAGS[key] = shuffle(fns.map(function (_, i) { return i; }));
  var f = fns[b.pop()];
  for (var i = 0; i < 80; i++) { var r = f(); if (r) return r; }
  return null;
}
// модулын TeX: \lvert -5\rvert (дотрох хасах тэмдэг нэг орлогот байна)
function ab(x) { return '\\lvert ' + x + '\\rvert '; }

// 1. Модулын утга, эсрэг тоо (1.1 Тооны модул)
function g1() {
  return rot('g1', [
    function () { var a = nz(-99, 99), b = nz(-99, 99); if (Math.abs(a) < 5 || Math.abs(b) < 5 || (a > 0 && b > 0)) return null;      // |a|+|b|
      return { stem: '$' + ab(a) + '+' + ab(b) + '$', a: String(Math.abs(a) + Math.abs(b)) }; },
    function () { var a = nz(-99, 99), b = nz(-99, 99); if (Math.abs(a) < 5 || Math.abs(b) < 5 || (a > 0 && b > 0)) return null;      // |a|−|b|
      return { stem: '$' + ab(a) + '-' + ab(b) + '$', a: String(Math.abs(a) - Math.abs(b)) }; },
    function () { var A = rnd(5, 99), k = rnd(1, 3);                                                                                    // үүрлэсэн модул, эсрэг тоо
      return { stem: '$' + (k === 1 ? '-' + ab(-A) : k === 2 ? '-(-' + ab(-A) + ')' : ab('-(-' + A + ')')) + '$', a: String(k === 1 ? -A : A) }; },
    function () { var p = nz(-15, 15), q = nz(-12, 12); if (Math.abs(p) < 2 || Math.abs(q) < 2 || (p > 0 && q > 0)) return null;     // модулуудын үржвэр, ноогдвор
      if (rnd(0, 1)) return { stem: '$' + ab(p) + '\\cdot ' + ab(q) + '$', a: String(Math.abs(p * q)) };
      return { stem: '$' + ab(p * q) + '\\div ' + ab(q) + '$', a: String(Math.abs(p)) }; },
    function () { var a = nz(-99, 99), b = nz(-99, 99); if (Math.abs(a) < 5 || Math.abs(b) < 5 || (a > 0 && b > 0)) return null;      // ялгаврын модул
      return { stem: '$' + ab(a + '-' + par(b)) + '$', a: String(Math.abs(a - b)) }; }
  ]);
}
// 2. Бүхэл тоонуудыг нэмэх, хасах — 4–5 гишүүнтэй (1.2)
function g2() {
  var n = rnd(4, 5), s = '', tot = 0, neg = 0, i;
  for (i = 0; i < n; i++) {
    var x = nz(-99, 99); if (Math.abs(x) < 6) return null;
    if (i === 0) { s = '' + x; tot = x; continue; }
    var plus = rnd(0, 1) === 1; if (x < 0) neg++;
    s += (plus ? '+' : '-') + par(x); tot += plus ? x : -x;
  }
  if (neg < 2) return null;
  return { stem: '$' + s + '$', a: String(tot) };
}
// 3. Үржүүлэх, хуваах — тэмдгийн дүрэм, үйлдлийн дараалал (1.3)
function g3() {
  return rot('g3', [
    function () { var a = nz(-12, 12), b = nz(-12, 12), c = nz(-9, 9);                                                                // гурван үржигдэхүүн
      if (Math.abs(a) < 2 || Math.abs(b) < 2 || Math.abs(c) < 2 || (a < 0) + (b < 0) + (c < 0) < 2) return null;
      return { stem: '$' + par(a) + '\\cdot ' + par(b) + '\\cdot ' + par(c) + '$', a: String(a * b * c) }; },
    function () { var B = nz(-9, 9), m = nz(-12, 12), D = nz(-9, 9);                                                                  // A ÷ B · D
      if (Math.abs(B) < 2 || Math.abs(m) < 2 || Math.abs(D) < 2 || (B > 0 && m > 0)) return null;
      return { stem: '$' + par(B * m) + '\\div ' + par(B) + '\\cdot ' + par(D) + '$', a: String(m * D) }; },
    function () { var p = nz(-12, 12), q = nz(-9, 9), d = rnd(-9, -2), r = nz(-12, 12);                                              // a·b − c ÷ d
      if (Math.abs(p) < 2 || Math.abs(q) < 2 || Math.abs(r) < 2 || (p > 0 && q > 0)) return null;
      return { stem: '$' + par(p) + '\\cdot ' + par(q) + '-' + par(d * r) + '\\div ' + par(d) + '$', a: String(p * q - r) }; },
    function () { var x = rnd(2, 6), y = rnd(2, 6), z = rnd(2, 9), sx = pick([-1, 1]), sy = pick([-1, 1]);                           // A ÷ B ÷ C
      if (sx > 0 && sy > 0) return null;
      return { stem: '$' + par(sx * x * y * z) + '\\div ' + par(sy * x) + '\\div ' + y + '$', a: String(sx * sy * z) }; }
  ]);
}
// 4. Бүхэл тооны хэрэглээний бодлого: тоон шулуун дээрх зай, температур, оноо, шумбагч, санасан тоо (1.1–1.3)
function g4() {
  return rot('g4', [
    function () { var a = rnd(-25, -3), b = nz(-20, 25); if (b === a || Math.abs(b) < 2) return null;
      return { stem: 'Тоон шулуун дээрх $A(' + a + ')$ ба $B(' + b + ')$ цэгийн хоорондох зайг ол.', a: '$AB=' + ab(a + '-' + par(b)) + '=' + Math.abs(a - b) + '$' }; },
    function () { var t0 = rnd(-25, -5), u = rnd(6, 18), d = rnd(5, 20), t1 = t0 + u - d; if (u === d) return null;
      return { stem: 'Өглөө агаарын температур $' + t0 + '$°C байв. Өдөр $' + u + '$ хэмээр дулаарч, орой $' + d + '$ хэмээр хүйтэрчээ. Оройн температурыг ол.',
        a: '$' + t0 + '+' + u + '-' + d + '=' + t1 + '$°C' }; },
    function () { var p = rnd(3, 6), q = rnd(1, 3), x = rnd(5, 15), y = rnd(5, 15), v = p * x - q * y;
      return { stem: 'Тестэд зөв хариулт бүрд $' + p + '$ оноо нэмж, буруу хариулт бүрд $' + q + '$ оноо хасна. Сурагч $' + x + '$ асуултад зөв, $' + y + '$ асуултад буруу хариулжээ. Хэдэн оноо авсан бэ?',
        a: '$' + p + '\\cdot ' + x + '-' + q + '\\cdot ' + y + '=' + v + '$ оноо' }; },
    function () { var h = rnd(20, 60), up = rnd(5, 18), dn = rnd(10, 30), e = -h + up - dn;
      return { stem: 'Шумбагч далайн түвшнээс доош $' + h + '$ м-т байв. Тэр $' + up + '$ м дээш хөвж, дараа нь $' + dn + '$ м доош шумбажээ. Шумбагчийн байрлалыг бүхэл тоогоор илэрхийл.',
        a: '$-' + h + '+' + up + '-' + dn + '=' + e + '$ м' }; },
    function () { var k = rnd(-9, -2), c = nz(-30, 30), x0 = nz(-12, 12);                                                              // санасан тоо
      if (Math.abs(c) < 3 || Math.abs(x0) < 2) return null;
      var res = x0 * k + c;
      return { stem: 'Санасан тоогоо $' + k + '$ тоогоор үржүүлээд $' + c + '$ тоог нэмэхэд $' + res + '$ гарчээ. Санасан тоог ол.',
        a: '$(' + res + '-' + par(c) + ')\\div ' + par(k) + '=' + x0 + '$' }; }
  ]);
}

CMX.jishig({
  title: 'I бүлэг — Жишиг даалгавар 1',
  sub: 'Тооны модул · бүхэл тооны нэмэх, хасах · үржүүлэх, хуваах',
  grade: '7-р анги',
  rule: '$\\lvert a\\rvert\\ge 0,\\;\\; \\lvert -a\\rvert=\\lvert a\\rvert$ &nbsp;·&nbsp; $AB=\\lvert a-b\\rvert$ &nbsp;·&nbsp; $a-b=a+(-b)$ &nbsp;·&nbsp; Ижил тэмдэгтэй хоёр тооны үржвэр, ноогдвор эерэг; эсрэг тэмдэгтэй бол сөрөг',
  tasks: [
    { label: 'Утгыг ол.', gen: g1, n: 12, nw: 3, cols: 3, wk: 10 },
    { label: 'Илэрхийллийн утгыг ол.', gen: g2, n: 8, nw: 2, cols: 2, wk: 12 },
    { label: 'Үйлдлийг гүйцэтгэ.', gen: g3, n: 8, nw: 2, cols: 2, wk: 12 },
    { label: 'Бодлогыг бод.', gen: g4, n: 6, nw: 2, cols: 2, wk: 22 }
  ]
});
</script>

</body>
</html>
