<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Дарааллын зүй тогтол — дараагийн гишүүд · 12 бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:7px 12px;margin-bottom:13px;text-align:center}
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,auto);grid-auto-flow:column;gap:11px 22px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.qn{font-weight:800;color:var(--purple);min-width:22px;font-size:14px}.qm{font-size:15px}
  .ansl{font-size:13px;margin:2px 0 5px;font-weight:700;color:var(--ink)}.ansl .bl{display:inline-block;min-width:60px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin:0 4px}
  .work{height:14mm;border:1.2px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 16px;font-size:14px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}.ans-grid .note{color:var(--soft);font-size:11px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function seqLatex(t){return t.join(',\\ ')+',\\ \\dots';}
function genOne(){
  var t=pick(['arith','arith','arithneg','geom','incdiff','square']);
  var terms=[],next2=[],rule='';
  if(t==='arith'){
    var d=rnd(2,9),a1=rnd(1,9);
    for(var i=0;i<5;i++)terms.push(a1+i*d);
    next2=[a1+5*d,a1+6*d]; rule='тогтмол +'+d;
  } else if(t==='arithneg'){
    var dn=rnd(2,7),an1=rnd(24,48);
    for(var i=0;i<5;i++)terms.push(an1-i*dn);
    next2=[an1-5*dn,an1-6*dn]; rule='тогтмол −'+dn;
  } else if(t==='geom'){
    var r=pick([2,3]),g1=pick([1,2,3]);
    for(var i=0;i<5;i++)terms.push(g1*Math.pow(r,i));
    next2=[g1*Math.pow(r,5),g1*Math.pow(r,6)]; rule='тогтмол ×'+r;
  } else if(t==='incdiff'){
    var b1=rnd(1,4),d0=rnd(1,3),cur=b1; terms.push(cur);
    for(var i=0;i<4;i++){cur+=d0+i;terms.push(cur);}
    var n6=terms[4]+(d0+4),n7=n6+(d0+5);
    next2=[n6,n7]; rule='зөрүү 1-ээр өснө';
  } else { // square
    var k=rnd(1,3);
    for(var i=0;i<5;i++)terms.push(Math.pow(i+k,2));
    next2=[Math.pow(5+k,2),Math.pow(6+k,2)]; rule='бүрэн квадрат';
  }
  return {q:seqLatex(terms),a:next2.join(',\\ '),rule:rule,terms:terms,next2:next2};
}
function build(){
  var probs='',answs='',items=[];
  for(var i=0;i<12;i++){
    var e=genOne();var n=i+1;
    probs+='<div class="q"><div class="qeq"><span class="qn">'+n+'.</span><span class="qm">$'+e.q+'$</span></div>'
      +'<div class="ansl">Дараагийн 2 гишүүн: <span class="bl"></span> , <span class="bl"></span></div>'
      +'<div class="work"></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>$'+e.a+'$ <span class="note">('+e.rule+')</span></span></div>';
    items.push({q:e.terms.join(', ')+'…',a:e.next2.join(', ')+'  ('+e.rule+')'});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Дарааллын зүй тогтлыг олох</h1><div class="sub">Дараалал бүрийн зүй тогтлыг олж, дараагийн 2 гишүүнийг бич · 12 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Хоёр зэргэлдээ гишүүний хамаарлыг ажигла: тогтмол нэмэгдэх/хасагдах (+d, −d) · тогтмол үржих (×r) · зөрүү өсөх · бүрэн квадрат ($1,4,9,16,\\dots$)</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Дарааллын зүй тогтол';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
