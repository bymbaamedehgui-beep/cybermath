<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тойргийн хөвч — перпендикуляр ба хөвчийн урт (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:10px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
  .dcard{break-inside:avoid;page-break-inside:avoid;border:1px solid #eee7fb;border-radius:9px;padding:6px 7px;background:linear-gradient(#fff,#fcfbff)}
  .dcard .dq{font-size:10.5px;margin-bottom:2px;min-height:15px}.dcard .dq b{color:var(--purple)}
  .dsvg{width:100%;height:auto;display:block}
  .aline{margin-top:3px;font-size:10.5px;color:var(--soft);text-align:center}.aline b{color:var(--ink);border-bottom:1px solid #cdbff0;padding:0 20px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var CX=65,CY=50,Rpx=44,VB=132,VBH=118;
function dotC(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="1.6" fill="#7B52EE"/>';}
function txt(p,s,col,dx,dy){return '<text x="'+(p[0]+(dx||0)).toFixed(1)+'" y="'+(p[1]+(dy||0)).toFixed(1)+'" font-size="8.5" fill="'+col+'" text-anchor="middle" font-weight="700">'+s+'</text>';}
function rightMk(v,pa,pb){function u(p){var dx=p[0]-v[0],dy=p[1]-v[1],L=Math.hypot(dx,dy)||1;return [dx/L,dy/L];}var u1=u(pa),u2=u(pb),m=5.5,p1=[v[0]+u1[0]*m,v[1]+u1[1]*m],p2=[v[0]+(u1[0]+u2[0])*m,v[1]+(u1[1]+u2[1])*m],p3=[v[0]+u2[0]*m,v[1]+u2[1]*m];return '<path d="M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' L '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+' L '+p3[0].toFixed(1)+' '+p3[1].toFixed(1)+'" fill="none" stroke="#16a34a" stroke-width="1.1"/>';}
function seg(a,b,col,w){return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+col+'" stroke-width="'+(w||1.4)+'"/>';}
function toOut(p,c,d){var dx=p[0]-c[0],dy=p[1]-c[1],L=Math.hypot(dx,dy)||1;return [dx/L*d,dy/L*d];}
function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];}
function drawChord(R,d,mode){var hk=Math.sqrt(Math.max(0.01,R*R-d*d)),ak=Math.round(hk);
  var O=[0,0],K=[0,-d],A=[-hk,-d],B=[hk,-d],pts=[O,K,A,B],cen=[0,-d/2],th=Math.random()*2*Math.PI;
  function rp(p){var dx=p[0]-cen[0],dy=p[1]-cen[1],c=Math.cos(th),s=Math.sin(th);return [cen[0]+dx*c-dy*s,cen[1]+dx*s+dy*c];}
  var rall=pts.map(rp),Or=rp(O),xs=rall.map(function(p){return p[0];}).concat([Or[0]-R,Or[0]+R]),ys=rall.map(function(p){return p[1];}).concat([Or[1]-R,Or[1]+R]);
  var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys),W=maxx-minx,H=maxy-miny,S=126,pad=15,sc=Math.min((S-2*pad)/W,(S-2*pad)/H),ex=(S-2*pad-W*sc)/2,ey=(S-2*pad-H*sc)/2;
  function TS(p){var q=rp(p);return [pad+ex+(q[0]-minx)*sc,S-pad-ey-(q[1]-miny)*sc];}
  var Os=TS(O),Ks=TS(K),As=TS(A),Bs=TS(B),rr=R*sc,C=TS(cen);
  function LB(p,s,col){var o=toOut(p,C,10);return '<text x="'+(p[0]+o[0]).toFixed(1)+'" y="'+(p[1]+o[1]+2).toFixed(1)+'" font-size="8.5" fill="'+(col||'#1a1030')+'" text-anchor="middle" font-weight="700">'+s+'</text>';}
  function SL(a,b,s,col){var m=mid(a,b),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,tc=[C[0]-m[0],C[1]-m[1]];if(nx*tc[0]+ny*tc[1]>0){nx=-nx;ny=-ny;}var o=8.5;return '<text x="'+(m[0]+nx*o).toFixed(1)+'" y="'+(m[1]+ny*o+2).toFixed(1)+'" font-size="8.5" fill="'+col+'" text-anchor="middle" font-weight="800">'+s+'</text>';}
  var g='<circle cx="'+Os[0].toFixed(1)+'" cy="'+Os[1].toFixed(1)+'" r="'+rr.toFixed(1)+'" fill="none" stroke="#4a4470" stroke-width="1.3"/>';
  g+=seg(As,Bs,'#1a1030',1.6)+seg(Os,As,'#2563eb',1.3)+seg(Os,Ks,'#16a34a',1.3)+rightMk(Ks,Os,As)+dotC(Os)+dotC(As)+dotC(Bs)+dotC(Ks);
  g+=LB(Os,'O','#4a4470')+LB(As,'A')+LB(Bs,'B');
  g+=SL(Os,As,'R','#2563eb');
  if(mode==='d'){g+=SL(Os,Ks,'?','#c2451f')+SL(As,Ks,''+ak,'#c2451f');}
  else if(mode==='ab'){g+=SL(Os,Ks,''+d,'#16a34a')+SL(As,Bs,'AB=?','#c2451f');}
  else{g+=SL(Os,Ks,''+d,'#16a34a')+SL(As,Ks,'?','#c2451f');}
  return '<svg class="dsvg" viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';}
var CHORDT=[[5,3,4],[5,4,3],[10,6,8],[10,8,6],[13,5,12],[13,12,5],[15,9,12],[17,8,15],[17,15,8],[25,7,24],[25,24,7],[26,10,24],[20,12,16]];
function gAk(){var t=pick(CHORDT);return {svg:drawChord(t[0],t[1],'ak'),q:'Радиус $R='+t[0]+'$, $OK='+t[1]+'$ бол хагас хөвч $AK=?$',a:'$AK='+t[2]+'$',key:'ak'+t[0]+'-'+t[1],ok:true};}
function gAb(){var t=pick(CHORDT);return {svg:drawChord(t[0],t[1],'ab'),q:'Радиус $R='+t[0]+'$, $OK='+t[1]+'$ бол бүтэн хөвч $AB=?$',a:'$AB='+(2*t[2])+'$',key:'ab'+t[0]+'-'+t[1],ok:true};}
function gD(){var t=pick(CHORDT);return {svg:drawChord(t[0],t[1],'d'),q:'Радиус $R='+t[0]+'$, $AK='+t[2]+'$ бол төв хүртэлх зай $OK=?$',a:'$OK='+t[1]+'$',key:'dd'+t[0]+'-'+t[1],ok:true};}
// build: 3 diagram sections (chord)
function build(){
  var seen={},K=0;window.__A=[];
  function fillD(fn,n){var arr=[],tr=0;while(arr.length<n&&tr++<400){var f=fn();if(seen[f.key])continue;seen[f.key]=1;arr.push(f);}return arr;}
  var s1=fillD(gAk,3),s2=fillD(gAb,3),s3=fillD(gD,3);
  function card(f){var k=K++;window.__A.push({k:k,a:f.a});return '<div class="dcard"><div class="dq"><b>'+(k+1)+'.</b> '+f.q+'</div>'+f.svg+'<div class="aline">Хариу: <b>&nbsp;</b></div></div>';}
  var b1=s1.map(card).join(''),b2=s2.map(card).join(''),b3=s3.map(card).join('');
  var ans='<div class="ans-grid">'+window.__A.map(function(a){return '<div class="a"><span class="an">'+(a.k+1)+'.</span><span>'+a.a+'</span></div>';}).join('')+'</div>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тойргийн хөвч</h1><div class="sub">Төвөөс татсан перпендикуляр хөвчийг хагаслана · $AK=\\sqrt{R^2-OK^2}$ · 7.3 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Хөвчийн дундаж цэгийг төвтэй холбосон перпендикуляр хөвчийг хагаслана: $OK\\perp AB\\Rightarrow AK=KB$. $\\triangle OKA$ тэгш өнцөгт тул $OA^2=OK^2+AK^2$, өөрөөр $AK=\\sqrt{R^2-OK^2}$.</div>'
    +'<div class="task">1. Хагас хөвчийг ол.</div><div class="dgrid">'+b1+'</div>'
    +'<div class="task">2. Бүтэн хөвчийг ол.</div><div class="dgrid">'+b2+'</div>'
    +'<div class="task">3. Хөвчөөс төв хүртэлх зайг ол.</div><div class="dgrid">'+b3+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2>'+ans+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Тойргийн хөвч — перпендикуляр ба хөвчийн урт (10-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=37"></script>
</body>
</html>
