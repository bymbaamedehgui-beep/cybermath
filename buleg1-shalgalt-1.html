<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}

  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}

  @media print{.varv:empty::before,.ptv:empty::before{content:""}}
  .grade{break-inside:avoid;page-break-inside:avoid;margin-top:12px;border:1.5px solid #d9cff5;border-radius:9px;padding:9px 11px}
  .gtitle{font-weight:800;color:#5a32d6;font-size:12.5px;margin-bottom:7px}
  .gtbl{border-collapse:collapse;font-size:11.5px;margin-bottom:7px}.gtbl th,.gtbl td{border:1px solid #c9bdec;padding:3px 4px;text-align:center;min-width:26px;height:18px}.gtbl th{background:#f3eefe;color:#5a32d6;font-weight:800;min-width:52px}.gtbl td.lab{font-weight:800;color:var(--purple);background:#faf8ff}
  .gtot{font-weight:800;color:#5a32d6;font-size:12.5px;margin-top:4px}.gtot u{display:inline-block;min-width:60px;border-bottom:1.5px solid #b3a9cf;text-decoration:none}

  .work{height:26mm;border:1.2px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:8px}

<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function opD(op){return {'>':'>','<':'<','ge':'\\ge','le':'\\le'}[op];}
function qs(a,b,c){var t=(a===1?'x^2':a===-1?'-x^2':a+'x^2');if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
var OL=['А','Б','В','Г'];
function finishMC(opts){var sh=shuffle(opts),ci=-1;for(var i=0;i<sh.length;i++)if(sh[i].ok)ci=i;return {opts:sh,correct:ci};}
function MC(correct,distr){var opts=[{tex:correct,ok:true}],seen={};seen[correct]=1;for(var i=0;i<distr.length&&opts.length<4;i++){var d=distr[i];if(d==null||seen[d])continue;seen[d]=1;opts.push({tex:d,ok:false});}if(opts.length<4)return null;return finishMC(opts);}
function rootsPair(lo,hi){for(var t=0;t<200;t++){var r1=nz(lo,hi),r2=nz(lo,hi);if(r1!==r2)return [Math.min(r1,r2),Math.max(r1,r2)];}return [-2,3];}
// интервал
var ALLR='x\\in\\mathbb{R}',NONE='\\varnothing';
function ivOut(r1,r2,cl){return 'x\\in\\,]{-}\\infty,'+r1+(cl?']':'[')+'\\cup'+(cl?'[':']')+r2+',{+}\\infty[';}
function ivBtw(r1,r2,cl){return 'x\\in\\,'+(cl?'[':']')+r1+','+r2+(cl?']':'[');}
function ineqSolve(r1,r2,op){var cl=(op==='ge'||op==='le');return (op==='>'||op==='ge')?ivOut(r1,r2,cl):ivBtw(r1,r2,cl);}
function solveGraph(spec,op){var s=spec.s,cl=(op==='ge'||op==='le');
  if(spec.kind==='two'){var r1=spec.r1,r2=spec.r2,between=(s>0)?(op==='<'||op==='le'):(op==='>'||op==='ge');return between?ivBtw(r1,r2,cl):ivOut(r1,r2,cl);}
  if(s>0)return (op==='>'||op==='ge')?ALLR:NONE;return (op==='<'||op==='le')?ALLR:NONE;}
// зургууд
function graphSVG(spec){var W=136,H=98,padL=12,padR=7,padT=7,padB=15;var f,xmin,xmax,inter=[];
  if(spec.kind==='two'){var r1=spec.r1,r2=spec.r2;f=function(x){return spec.s*(x-r1)*(x-r2);};var c=(r1+r2)/2,hh=(r2-r1)/2;xmin=c-hh-1.6;xmax=c+hh+1.6;inter=[r1,r2];}
  else if(spec.kind==='one'){var r0=spec.r0;f=function(x){return spec.s*(x-r0)*(x-r0);};xmin=r0-2.2;xmax=r0+2.2;inter=[r0];}
  else{var h=spec.h;f=function(x){return spec.s*((x-h)*(x-h)+1.3);};xmin=h-2.2;xmax=h+2.2;inter=[];}
  var N=42,xs=[],ys=[];for(var i=0;i<=N;i++){var x=xmin+(xmax-xmin)*i/N;xs.push(x);ys.push(f(x));}
  var ymin=Math.min.apply(null,ys.concat([0])),ymax=Math.max.apply(null,ys.concat([0]));var yr=(ymax-ymin)||1;ymin-=yr*0.13;ymax+=yr*0.13;
  function PX(x){return padL+(x-xmin)/(xmax-xmin)*(W-padL-padR);}function PY(y){return padT+(ymax-y)/(ymax-ymin)*(H-padT-padB);}
  var y0=PY(0),yx=(0>=xmin&&0<=xmax)?PX(0):padL+2;
  var g='<line x1="2" y1="'+y0.toFixed(1)+'" x2="'+(W-2)+'" y2="'+y0.toFixed(1)+'" stroke="#999" stroke-width="1"/><line x1="'+yx.toFixed(1)+'" y1="2" x2="'+yx.toFixed(1)+'" y2="'+(H-2)+'" stroke="#999" stroke-width="1"/>';
  var d='';for(var i=0;i<=N;i++){d+=(i?'L':'M')+PX(xs[i]).toFixed(1)+' '+PY(ys[i]).toFixed(1)+' ';}
  g+='<path d="'+d+'" fill="none" stroke="#16a34a" stroke-width="1.8"/>';
  inter.forEach(function(r){var px=PX(r);g+='<circle cx="'+px.toFixed(1)+'" cy="'+y0.toFixed(1)+'" r="2.3" fill="#dc2626"/><text x="'+px.toFixed(1)+'" y="'+(y0+10).toFixed(1)+'" font-size="8" text-anchor="middle" fill="#b91c1c" font-weight="700">'+r+'</text>';});
  return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';}
function figRect(wl,ll){var W=118,H=76,x=18,y=10,w=82,h=48;return '<svg width="'+W+'" height="'+H+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="'+(x+w/2)+'" y="'+(y+h+13)+'" font-size="11" text-anchor="middle" fill="#166534">'+ll+'</text><text x="'+(x-5)+'" y="'+(y+h/2+4)+'" font-size="11" text-anchor="end" fill="#166534">'+wl+'</text></svg>';}
function figRT(al,bl,cl){var W=124,H=86;var g='<polygon points="20,68 20,14 102,68" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><rect x="20" y="60" width="8" height="8" fill="none" stroke="#16a34a" stroke-width="1"/>';g+='<text x="14" y="44" font-size="11" text-anchor="end" fill="#166534">'+al+'</text><text x="60" y="81" font-size="11" text-anchor="middle" fill="#166534">'+bl+'</text><text x="66" y="36" font-size="11" fill="#166534" transform="rotate(32 66 36)">'+cl+'</text>';return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';}
var TRI=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[20,21,29],[7,24,25]];
// ── I. Тест генераторууд (10) ──
function t_disc(){var r=rootsPair(-5,5),b=-(r[0]+r[1]),c=r[0]*r[1],D=b*b-4*c;
  return {stem:'$'+qs(1,b,c)+'=0$ тэгшитгэлийн дискриминант $D$-ийн утга аль нь вэ?',mc:MC(''+D,[''+(b*b+4*c),''+(-D),''+(b*b-2*c),''+(D+8),''+(D-6)])};}
function t_nroots(){var kind=pick(['two','one','none']),stem,cor;
  if(kind==='two'){var r=rootsPair(-5,5);stem='$'+qs(1,-(r[0]+r[1]),r[0]*r[1])+'=0$ тэгшитгэл хэдэн бодит шийдтэй вэ?';cor='\\text{2 шийдтэй}';}
  else if(kind==='one'){var m=nz(-4,4);stem='$'+qs(1,-2*m,m*m)+'=0$ тэгшитгэл хэдэн бодит шийдтэй вэ?';cor='\\text{1 (давхар) шийдтэй}';}
  else{var h=rnd(-3,3),d=pick([1,2,3]);stem='$'+qs(1,-2*h,h*h+d)+'=0$ тэгшитгэл хэдэн бодит шийдтэй вэ?';cor='\\text{Бодит шийдгүй}';}
  return {stem:stem,mc:MC(cor,['\\text{2 шийдтэй}','\\text{1 (давхар) шийдтэй}','\\text{Бодит шийдгүй}','\\text{Хязгааргүй олон}'].filter(function(x){return x!==cor;}))};}
function t_roots(){var r=rootsPair(-6,6),r1=r[0],r2=r[1],b=-(r1+r2),c=r1*r2;
  return {stem:'$'+qs(1,b,c)+'=0$ тэгшитгэлийн язгуурууд аль нь вэ?',mc:MC('x_1='+r1+',\\ x_2='+r2,['x_1='+(-r1)+',\\ x_2='+(-r2),'x_1='+r1+',\\ x_2='+(-r2),'x_1='+(-r1)+',\\ x_2='+r2,'x_1='+(r1+1)+',\\ x_2='+r2])};}
function t_vieta(){var r=rootsPair(-6,6),r1=r[0],r2=r[1],B=-(r1+r2),C=r1*r2;
  return {stem:'$'+qs(1,B,C)+'=0$ тэгшитгэлийн язгууруудын нийлбэр ба үржвэр?',mc:MC('\\text{нийлбэр }'+(-B)+',\\ \\text{үржвэр }'+C,['\\text{нийлбэр }'+B+',\\ \\text{үржвэр }'+C,'\\text{нийлбэр }'+(-B)+',\\ \\text{үржвэр }'+(-C),'\\text{нийлбэр }'+C+',\\ \\text{үржвэр }'+(-B)])};}
function t_cond(){var kind=pick(['eq','two','none']),stem,cor;
  if(kind==='eq'){stem='$ax^2+bx+c=0\\ (a\\ne0)$ тэгшитгэл давхар (нэг) шийдтэй байх нөхцөл?';cor='D=0';}
  else if(kind==='two'){stem='$ax^2+bx+c=0\\ (a\\ne0)$ тэгшитгэл хоёр ялгаатай шийдтэй байх нөхцөл?';cor='D>0';}
  else{stem='$ax^2+bx+c=0\\ (a\\ne0)$ тэгшитгэл бодит шийдгүй байх нөхцөл?';cor='D<0';}
  return {stem:stem,mc:MC(cor,['D=0','D>0','D<0','D\\ge0'].filter(function(x){return x!==cor;}))};}
function t_ineq(){var r=rootsPair(-5,5),r1=r[0],r2=r[1],op=pick(['>','<']);var wop=(op==='>')?'<':'>';
  return {stem:'$'+qs(1,-(r1+r2),r1*r2)+' '+opD(op)+' 0$ тэнцэтгэл бишийн шийд аль нь вэ?',mc:MC(ineqSolve(r1,r2,op),[ineqSolve(r1,r2,wop),ivBtw(r1,r2,true),ivOut(r1,r2,true),ALLR])};}
function t_vertex(){var m=nz(-4,4),k=nz(-4,4),b=-2*m,c=m*m+k;
  return {stem:'$y='+qs(1,b,c)+'$ параболын оройн $x$ координат?',mc:MC('x='+m,['x='+(-m),'x='+(2*m),'x='+b,'x='+(m+1)])};}
function t_graphread(){var kind=pick(['two','two','none']),s=pick([1,-1]),sp,op=pick(['>','<']);
  if(kind==='two'){var r=rootsPair(-4,4);sp={kind:'two',s:s,r1:r[0],r2:r[1]};}else sp={kind:'none',s:s,h:rnd(-2,2)};
  var cor=solveGraph(sp,op),wop=(op==='>')?'<':'>';
  var dl=[solveGraph(sp,wop)];if(sp.kind==='two'){dl.push(ivBtw(sp.r1,sp.r2,true));dl.push(ivOut(sp.r1,sp.r2,true));}dl.push(ALLR,NONE);
  return {stem:'Доорх графикийг ашиглан $f(x) '+opD(op)+' 0$-ийн шийдийг ол.<div class="gwrap">'+graphSVG(sp)+'</div>',mc:MC(cor,dl.filter(function(x){return x!==cor;}))};}
function bqf(B,C){var s='x^4',ab=Math.abs(B);if(B!==0)s+=(B<0?'-':'+')+(ab===1?'':ab)+'x^2';var ac=Math.abs(C);if(C!==0)s+=(C<0?'-':'+')+ac;return s;}
function t_biquad(){var scen=pick(['four','two','zero']),m,n,stem,cor;
  do{m=rnd(1,4);n=rnd(1,4);}while(m===n);
  if(scen==='four'){stem='$'+bqf(-(m*m+n*n),m*m*n*n)+'=0$ тэгшитгэл хэдэн бодит шийдтэй вэ?';cor='4';}
  else if(scen==='two'){var k=pick([1,4,9]);stem='$'+bqf(k-m*m,-m*m*k)+'=0$ тэгшитгэл хэдэн бодит шийдтэй вэ?';cor='2';}
  else{stem='$'+bqf(m*m+n*n,m*m*n*n)+'=0$ тэгшитгэл хэдэн бодит шийдтэй вэ?';cor='0';}
  return {stem:stem,mc:MC(cor,['0','1','2','3','4'].filter(function(x){return x!==cor;}))};}
function t_wordnum(){var r=rootsPair(2,10),r1=r[0],r2=r[1],S=r1+r2,P=r1*r2;
  return {stem:'Хоёр тооны нийлбэр нь $'+S+'$, үржвэр нь $'+P+'$. Эдгээр тоо аль нь вэ?',mc:MC('\\text{'+r1+' ба '+r2+'}',['\\text{'+(r1+1)+' ба '+(r2-1)+'}','\\text{'+(r1-1)+' ба '+(r2+1)+'}','\\text{'+r1+' ба '+(r2+2)+'}','\\text{'+(r1+2)+' ба '+r2+'}'])};}
var TESTS=[t_disc,t_nroots,t_roots,t_vieta,t_cond,t_ineq,t_vertex,t_graphread,t_biquad,t_wordnum];
// ── II. Задгай генераторууд (4) ──
function f_complete(){var m=nz(-4,4),k=pick([2,3,5,6,7]),b=2*m,c=m*m-k;
  return {stem:'$'+qs(1,b,c)+'=0$ тэгшитгэлийг бүтэн квадрат ялгах аргаар бод.',a:'(x'+sg(m)+')^2='+k+',\\ \\ x='+(-m)+'\\pm\\sqrt{'+k+'}'};}
function f_ineq(){var r=rootsPair(-6,6),r1=r[0],r2=r[1],op=pick(['>','ge','<','le']);
  return {stem:'$'+qs(1,-(r1+r2),r1*r2)+' '+opD(op)+' 0$ тэнцэтгэл бишийг интервалын аргаар бод.',a:'(x'+sg(-r1)+')(x'+sg(-r2)+') '+opD(op)+' 0,\\ \\ '+ineqSolve(r1,r2,op)};}
function f_grafik(){var r=rootsPair(-5,5),r1=r[0],r2=r[1],s=pick([1,-1]),op=pick(['>','ge','<','le']);var a=s,b=-s*(r1+r2),c=s*r1*r2,sp={kind:'two',s:s,r1:r1,r2:r2};
  return {stem:'$'+qs(a,b,c)+' '+opD(op)+' 0$ тэнцэтгэл бишийг тоймлон график байгуулан бод. ($a$-ийн тэмдэг, $D$, язгуур, шийд)',a:'\\text{салаа '+(s>0?'дээш':'доош')+', }D>0,\\ \\text{язгуур }'+r1+','+r2+';\\ \\ '+solveGraph(sp,op)};}
function f_word(){var mode=pick(['rt','rect']);
  if(mode==='rt'){var t=pick(TRI),a=t[0],b=t[1],c=t[2],d=b-a;
    return {stem:'<span class="fig">'+figRT('x','x+'+d,c)+'</span>Тэгш өнцөгт гурвалжны нэг катет нөгөөгөөсөө $'+d+'$-аар урт, гипотенуз нь $'+c+'$. Катетуудыг ол.',a:'x^2+(x+'+d+')^2='+c*c+'\\Rightarrow x='+a+';\\ \\ \\text{катетууд } '+a+', '+b};}
  var p=rnd(3,8),q=rnd(p+2,12),dd=q-p,A=p*q;
  return {stem:'<span class="fig">'+figRect('x','x+'+dd)+'</span>Тэгш өнцөгтийн урт нь өргөнөөсөө $'+dd+'$-аар их, талбай нь $'+A+'\\ \\text{м}^2$. Хэмжээсийг ол.',a:'x(x+'+dd+')='+A+'\\Rightarrow x='+p+';\\ \\ \\text{өргөн }'+p+'\\text{ м, урт }'+(p+dd)+'\\text{ м}'};}
var FREE=[f_complete,f_ineq,f_grafik,f_word];
var TEST_PT=1,FREE_PT=[3,3,4,4],ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function totalPts(){return 10*TEST_PT+FREE_PT.reduce(function(s,v){return s+v;},0);}
function ptFmt(v){return (Math.round(v*100)/100).toString();}
function recomputeTotal(){var tot=0;[].forEach.call(document.querySelectorAll('#sheet .ptv'),function(el){var v=parseFloat((el.textContent||'').replace(',','.'));if(!isNaN(v))tot+=v;});var s=ptFmt(tot);[].forEach.call(document.querySelectorAll('#sheet .totmax'),function(el){el.textContent=s;});}
function adjustOpts(){[].forEach.call(document.querySelectorAll('#sheet .opts'),function(op){op.classList.remove('two');var cells=op.children;if(!cells.length)return;var cellW=cells[0].clientWidth,need2=false;[].forEach.call(cells,function(o){var prev=o.getAttribute('style')||'';o.style.position='absolute';o.style.whiteSpace='nowrap';o.style.width='auto';o.style.visibility='hidden';var w=o.offsetWidth;o.setAttribute('style',prev);if(w>cellW+1)need2=true;});if(need2)op.classList.add('two');});}
function gen(fn){for(var t=0;t<250;t++){var g=fn();if(g&&g.mc!==null)return g;}return fn();}
function genF(fn){for(var t=0;t<120;t++){var g=fn();if(g)return g;}return null;}
function build(){
  window.__TEST=[];window.__FREE=[];
  var testHtml='',akTest='',seen={};
  for(var i=0;i<10;i++){var g=null,tr=0;do{g=gen(TESTS[i]);tr++;}while(g&&(seen[g.stem]||g.mc===null)&&tr<40);if(!g||g.mc===null)continue;seen[g.stem]=1;window.__TEST.push(g);
    var opts=g.mc.opts.map(function(o,j){return '<div class="opt"><span class="ol">'+OL[j]+'.</span>$'+o.tex+'$</div>';}).join('');
    testHtml+='<div class="t-item"><div class="t-stem"><span class="pt"><b class="ptv" contenteditable="true">'+TEST_PT+'</b> оноо</span><span class="n">'+(i+1)+'.</span>'+g.stem+'</div><div class="opts">'+opts+'</div></div>';
    akTest+=(i>0?', ':'')+(i+1)+'-'+OL[g.mc.correct];}
  var freeHtml='',akFree='';
  for(var f=0;f<4;f++){var fg=genF(FREE[f]);if(!fg)continue;window.__FREE.push(fg);
    freeHtml+='<div class="free"><div class="fs"><span class="pt"><b class="ptv" contenteditable="true">'+FREE_PT[f]+'</b> оноо</span><span class="n">'+(11+f)+'.</span>'+fg.stem+'</div><div class="work"></div></div>';
    akFree+='<div class="ak"><span class="n">'+(11+f)+')</span> $'+fg.a+'$</div>';}
  var TOTAL=totalPts();
  var gRoman='<table class="gtbl"><tr><th>Тест</th>'+ROMAN.map(function(r){return '<td class="lab">'+r+'</td>';}).join('')+'</tr><tr><th>Оноо</th>'+ROMAN.map(function(){return '<td></td>';}).join('')+'</tr></table>';
  var gFree='<table class="gtbl"><tr><th>Задгай</th>'+FREE_PT.map(function(_,i){return '<td class="lab">2.'+(i+1)+'</td>';}).join('')+'</tr><tr><th>Оноо</th>'+FREE_PT.map(function(){return '<td></td>';}).join('')+'</tr></table>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>I бүлэг — Шалгалтын материал</h1><div class="sub">Квадрат тэгшитгэл · тэнцэтгэл биш · графикийн арга (1.1–1.3) · 11-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Хугацаа: </span><div class="score-top">Хувилбар: <b class="varv" contenteditable="true" data-ph="А"></b> · Оноо: <b class="totmax">'+TOTAL+'</b></div></div>'
    +'<div class="task">I. Сонголттой тест. Зөв хариуг сонгоно уу. (1–10)</div>'+testHtml
    +'<div class="task">II. Задгай даалгавар. Бодолтоо дэлгэрэнгүй бичнэ үү. (11–14)</div>'+freeHtml
    +'<div class="grade"><div class="gtitle">Багшийн засах хүснэгт — авсан оноо</div>'+gRoman+gFree+'<div class="gtot">Нийт авсан оноо: <u></u> / <b class="totmax">'+TOTAL+'</b> оноо</div></div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ak"><span class="n">Тест:</span> '+akTest+'</div><div style="height:6px"></div><div class="ak" style="font-weight:800;color:#5a32d6">Задгай даалгавар:</div>'+akFree+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='I бүлэг — Шалгалтын материал (11-р анги)';
  [].forEach.call(document.querySelectorAll('#sheet .ptv'),function(el){el.addEventListener('input',recomputeTotal);el.addEventListener('focus',function(){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);});});
  recomputeTotal();toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{adjustOpts();}catch(e){}
}
var VLET=['А','Б','В','Г','Д','Е','Ё','Ж','З','И','Й','К','Л','М','Н','О'];
function hugSpan(){return [].filter.call(document.querySelectorAll('#sheet .meta > span'),function(s){return /Хугацаа/.test(s.textContent);})[0]||null;}
function getHug(){var sp=hugSpan();if(!sp)return '';return (sp.textContent.replace(/^[^:]*:?\s*/,'')||'').trim();}
function snapPts(){return [].map.call(document.querySelectorAll('#sheet .ptv'),function(e){return e.textContent;});}
function injectVBatchCSS(){if(document.getElementById('cm-vbatch-css'))return;var st=document.createElement('style');st.id='cm-vbatch-css';st.textContent='@media print{body>*:not(#cm-vbatch){display:none!important}body>#cm-vbatch{display:block!important}.cm-vsheet{page-break-after:always;box-shadow:none!important;width:auto!important;min-height:auto!important;margin:0!important;padding:0!important;background:#fff;zoom:1!important}.cm-vsheet:last-child{page-break-after:auto}}';document.head.appendChild(st);}
function openVariantModal(){if(document.getElementById('cm-vmodal'))return;var o=document.createElement('div');o.id='cm-vmodal';o.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(20,15,40,.6);display:grid;place-items:center;padding:16px;font-family:"Segoe UI",Arial,sans-serif';
  o.innerHTML='<div style="background:#fff;border-radius:16px;max-width:410px;width:100%;padding:20px;box-shadow:0 24px 60px -18px rgba(0,0,0,.5)"><div style="font-weight:900;color:#5a32d6;font-size:1.06rem;margin-bottom:4px">Олон хувилбар гаргах</div><p style="color:#7a7390;font-size:.84rem;margin-bottom:12px;line-height:1.45">Одоогийн <b>загвараас</b> хэдэн хувилбар гаргах вэ? Бодлого нь өөр, харин <b>оноо хэвээр</b>. Хувилбар <b>А, Б, В…</b> автоматаар тавигдана. Төгсгөлд нь хариун түлхүүр гарна.</p><label style="display:block;font-size:.85rem;font-weight:700;color:#3a2d5e;margin-bottom:5px">Хувилбарын тоо</label><input id="cm-vcount" type="number" min="1" max="16" value="4" style="width:100%;box-sizing:border-box;border:1.6px solid #e7ddff;border-radius:10px;padding:.55rem .8rem;font-size:1rem;font-weight:700;outline:none;font-family:inherit;margin-bottom:14px"><div style="display:flex;gap:8px;justify-content:flex-end"><button id="cm-vcancel" style="border:1.4px solid #e7ddff;background:#faf7ff;color:#5a32d6;font-weight:800;border-radius:999px;padding:.5rem 1rem;cursor:pointer;font-family:inherit">Болих</button><button id="cm-vgo" style="border:0;background:linear-gradient(135deg,#7B52EE,#A855F7);color:#fff;font-weight:800;border-radius:999px;padding:.5rem 1.2rem;cursor:pointer;font-family:inherit">Гаргаж хэвлэх</button></div></div>';
  document.body.appendChild(o);var ci=o.querySelector('#cm-vcount');try{ci.focus();ci.select();}catch(e){}o.querySelector('#cm-vcancel').onclick=function(){o.remove();};o.querySelector('#cm-vgo').onclick=function(){var n=parseInt(ci.value,10);if(!n||n<1)return;o.remove();genVariants(n);};}
function genVariants(N){if(!N||N<1)return;if(N>16)N=16;var sheet=document.getElementById('sheet'),hug=getHug(),pts=snapPts(),sa=document.getElementById('sa');if(sa&&sa.checked){sa.checked=false;toggleAns();}var old=document.getElementById('cm-vbatch');if(old)old.remove();var box=document.createElement('div');box.id='cm-vbatch';box.style.display='none';var keys=[];
  for(var i=0;i<N;i++){build();var tk=(window.__TEST||[]).map(function(g,idx){return (idx+1)+'-'+OL[g.mc.correct];}).join(', ');var fk=(window.__FREE||[]).map(function(f,idx){return {n:11+idx,a:f.a};});var clone=sheet.cloneNode(true);clone.removeAttribute('id');clone.classList.add('cm-vsheet');var ap=clone.querySelector('#answers,.ans-page');if(ap)ap.parentNode.removeChild(ap);var cptv=clone.querySelectorAll('.ptv'),tot=0;for(var k=0;k<cptv.length;k++){if(pts[k]!=null)cptv[k].textContent=pts[k];var v=parseFloat((cptv[k].textContent||'').replace(',','.'));if(!isNaN(v))tot+=v;cptv[k].removeAttribute('contenteditable');}[].forEach.call(clone.querySelectorAll('.totmax'),function(e){e.textContent=ptFmt(tot);});var hs=[].filter.call(clone.querySelectorAll('.meta > span'),function(s){return /Хугацаа/.test(s.textContent);})[0];if(hs)hs.textContent='Хугацаа: '+hug;var vv=clone.querySelector('.varv');if(vv){vv.textContent=VLET[i]||('#'+(i+1));vv.removeAttribute('contenteditable');}box.appendChild(clone);keys.push({letter:VLET[i]||('#'+(i+1)),tk:tk,fk:fk});}
  var keyHtml='<div class="sheet cm-vsheet"><div class="head"><h1>Хариун түлхүүр — бүх хувилбар</h1><div class="sub">I бүлэг — Шалгалтын материал · 11-р анги</div></div>';keys.forEach(function(kr){keyHtml+='<div style="margin:9px 0;break-inside:avoid;border-left:3px solid #A855F7;padding-left:9px"><div style="font-weight:800;color:#5a32d6;font-size:13.5px;margin-bottom:3px">Хувилбар '+kr.letter+'</div><div style="font-size:12px;margin-bottom:3px"><b>Тест:</b> '+kr.tk+'</div><div style="font-size:12px"><b>Задгай:</b> '+kr.fk.map(function(x){return x.n+') $'+x.a+'$';}).join(' &nbsp;·&nbsp; ')+'</div></div>';});keyHtml+='</div>';box.insertAdjacentHTML('beforeend',keyHtml);document.body.appendChild(box);injectVBatchCSS();
  try{renderMathInElement(box,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  function cleanup(){var b=document.getElementById('cm-vbatch');if(b)b.remove();window.removeEventListener('afterprint',cleanup);try{build();}catch(e){}}
  window.addEventListener('afterprint',cleanup);setTimeout(function(){window.print();},160);}
build();
window.addEventListener('load',function(){try{adjustOpts();}catch(e){}});
window.addEventListener('beforeprint',function(){try{adjustOpts();}catch(e){}});
