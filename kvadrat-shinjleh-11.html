<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат тэгшитгэлийн шийдийг шинжлэх (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .col1{display:grid;grid-template-columns:1fr;gap:9px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:13.5px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:20mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:7px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:28px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function qs(a,b,c){var t=(a===1?'x^2':a===-1?'-x^2':a+'x^2');
  if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';
  if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
// 1. Хэдэн шийдтэй вэ? (дискриминантаар)
function g_count(force){for(var t=0;t<500;t++){var a=rnd(1,5),b=nz(-9,9),c=nz(-9,9),D=b*b-4*a*c,cnt=D>0?2:D===0?1:0;
  if(force!=null&&cnt!==force)continue;
  var lbl=cnt===2?'хоёр бодит шийдтэй':cnt===1?'нэг шийдтэй (давхардсан)':'бодит шийдгүй';
  return {q:'$'+qs(a,b,c)+'=0$',a:'$D=b^2-4ac='+D+'$ ('+(D>0?'D>0':D===0?'D=0':'D<0')+') → '+lbl,ok:true};}return null;}
// 2. Нэг шийдтэй байх параметрийг ол (D=0)
function g_param1(){var t=pick(['sqrt','ptype','ktype']);
  if(t==='sqrt'){var c=pick([1,4,9,16,25]),k=2*Math.sqrt(c);return {q:'$x^2+kx+'+c+'=0$ нэг шийдтэй байх $k$-г ол.',a:'$D=k^2-4\\cdot'+c+'=0\\Rightarrow k=\\pm'+k+'$',ok:true};}
  if(t==='ptype'){var n=pick([2,3]),eq=(n===2?'x^2+2px+p=0':'x^2+3px+p=0'),pv=(n===2?'1':'\\dfrac{4}{9}');return {q:'$'+eq+'$ нэг шийдтэй байх $p$-г ол.',a:'$D=('+n+'p)^2-4p=p('+(n*n)+'p-4)=0\\Rightarrow p=0,\\ p='+pv+'$',ok:true};}
  for(var i=0;i<200;i++){var a=rnd(1,4),b=nz(-10,10);if((b*b)%(4*a))continue;var k=b*b/(4*a);return {q:'$'+qs(a,b,0)+'+k=0$ нэг шийдтэй байх $k$-г ол.',a:'$D=b^2-4ak=0\\Rightarrow k=\\dfrac{'+(b*b)+'}{'+(4*a)+'}='+k+'$',ok:true};}return null;}
// 3. Параметрийн утгаас шийдийн тоо
function g_param2(){for(var i=0;i<200;i++){var a=rnd(1,3),b=nz(-8,8);if((b*b)%(4*a))continue;var thr=b*b/(4*a);
  return {q:'$'+qs(a,b,0)+'+t=0$ тэгшитгэлийн $t$-ийн ямар утгад шийдгүй, нэг, хоёр шийдтэй байхыг тодорхойл.',a:'$D='+(b*b)+'-'+(4*a)+'t$; хоёр: $t<'+thr+'$; нэг: $t='+thr+'$; шийдгүй: $t>'+thr+'$',ok:true};}return null;}
// 4. Тооны машин ашиглан (том коэфф) шийдийн тоо
function g_calc(){for(var t=0;t<300;t++){var a=nz(-4,4),b=nz(-40,40),c=nz(-200,200),D=b*b-4*a*c,cnt=D>0?2:D===0?1:0;if(Math.abs(a)===1&&Math.abs(c)<50)continue;
  return {q:'$'+qs(a,b,c)+'=0$ хэдэн шийдтэй вэ? (тооны машин)',a:'$D='+D+'$ → '+(cnt===2?'2 шийдтэй':cnt===1?'1 шийдтэй':'шийдгүй'),ok:true};}return null;}
function gen(fn,arg){for(var t=0;t<400;t++){var f=fn(arg);if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т','у','ү'];
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid,.col1'),map={};
  for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<80){var blocks=sheet.querySelectorAll('.grid,.col1'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var P=[[],[],[],[]];var seen={};
  function fill(idx,fn,n,forces){var c=0,tr=0;while(c<n&&tr<4000){tr++;var f=gen(fn,forces?forces[c%forces.length]:undefined);if(!f||seen[f.q])continue;seen[f.q]=1;P[idx].push(f);c++;}}
  fill(0,g_count,10,[2,0,2,1,2,0,2,0,1,2]);fill(1,g_param1,6);fill(2,g_param2,5);fill(3,g_calc,7);return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,wk){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(wk&&WK?'<div class="wk"></div>':'')+'</div>';}).join('');}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>'+p.f.a+'</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадрат тэгшитгэлийн шийдийг шинжлэх</h1><div class="sub">Дискриминант $D=b^2-4ac$ · шийдийн тоо ба параметр · 11-р анги · I бүлэг 1.1</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">$ax^2+bx+c=0$-ийн дискриминант $D=b^2-4ac$. $D>0$ бол 2 бодит шийд, $D=0$ бол нэг (давхардсан) шийд, $D<0$ бол бодит шийдгүй.</div>'
    +'<div class="task">1. Тэгшитгэл хэдэн шийдтэй вэ? Дискриминантаар тогтоо.</div><div class="grid">'+block(S[0],true)+'</div>'
    +'<div class="task">2. Тэгшитгэл нэг шийдтэй байх параметрийн утгыг ол.</div><div class="col1">'+block(S[1],true)+'</div>'
    +'<div class="task">3. Параметрийн утгаас хамааруулан шийдийн тоог тодорхойл.</div><div class="col1">'+block(S[2],true)+'</div>'
    +'<div class="task">4. Тооны машин ашиглан шийдийн тоог тогтоо.</div><div class="grid">'+block(S[3],true)+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Квадрат тэгшитгэлийн шийдийг шинжлэх';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
