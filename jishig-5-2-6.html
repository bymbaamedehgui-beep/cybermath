<!DOCTYPE html>

<title>V бүлэг — Жишиг даалгавар 2 (6-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 6-р анги · V бүлэг. Алгебрын илэрхийлэл, тэгшитгэл — Жишиг даалгавар 2
   (5.4 Шугаман тэгшитгэл · 5.5 Сонгон судлах — хүнд даалгавар, сүүлийн даалгаварт хөнгөн хэлбэрээр) */
// Гишүүн: c·v (1x→x, -1x→-x); v='' бол сул гишүүн
function tm(c, v) { if (v === '') return '' + c; if (c === 1) return v; if (c === -1) return '-' + v; return c + v; }
// [{c,v}] → '2x-3y+5' (тэг коэффициенттэйг алгасна)
function pl(ts) {
  var s = '';
  ts.forEach(function (t) { var c = t.c, v = t.v || ''; if (!c) return; var body = v === '' ? '' + Math.abs(c) : (Math.abs(c) === 1 ? '' : Math.abs(c)) + v; s += (s === '' ? (c < 0 ? '-' : '') : (c < 0 ? '-' : '+')) + body; });
  return s === '' ? '0' : s;
}
function lin(k, b, v) { return pl([{ c: k, v: v }, { c: b, v: '' }]); }                     // kx+b
function br(k, inner) { return (k === 1 ? '' : k === -1 ? '-' : k) + '(' + inner + ')'; }   // k(…)
function pbr(k, inner) { return k < 0 ? '-' + br(-k, inner) : '+' + br(k, inner); }        // +k(…) / -k(…)
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
// Төрлийн уут: нэг хуудсанд даалгаврын бодлогууд өөр өөр төрлөөс (бүх төрөл гарсны дараа л давтагдана).
// Хөдөлгүүр даалгавруудыг дарааллаар нь үүсгэдэг тул 1-р даалгавар дахин эхлэхэд (шинэ хуудас) уутнуудыг шинэчилнэ.
var BAGS = [], LAST = 0;
function bag(n) {
  var o = { b: [] }; BAGS.push(o);
  return function () { if (!o.b.length) { for (var i = 0; i < n; i++) o.b.push(i); o.b = shuffle(o.b); } return o.b.pop(); };
}
function turn(id) { if (id === 1 && LAST !== 1) BAGS.forEach(function (o) { o.b = []; }); LAST = id; }
var B1 = bag(6), B2 = bag(3), B3 = bag(10), B4 = bag(8);
var NAMES = ['Туяа', 'Болд', 'Сараа', 'Тэмүүлэн', 'Номин', 'Бат'];

// 1. Нэг ба хоёр алхамт шугаман тэгшитгэл (5.4) — урвуу үйлдлээр: x±a=b, kx=b, kx+b=c, b−kx=c
function g1() {
  turn(1);
  var V = pick(['x', 'y', 'a', 'm', 'n', 'b']), t = B1(), x0, a, b, k, c, q;
  if (t === 0) {                                   // x + a = b
    a = rnd(2, 40); x0 = rnd(1, 60); b = x0 + a;
    q = rnd(0, 1) ? V + '+' + a + '=' + b : a + '+' + V + '=' + b;
    return { stem: '$' + q + '$', a: V + '=' + b + '-' + a + '=' + x0 };
  }
  if (t === 1) {                                   // x − a = b
    a = rnd(2, 40); x0 = rnd(1, 60); b = x0 - a;
    q = rnd(0, 1) ? V + '-' + a + '=' + b : b + '=' + V + '-' + a;
    return { stem: '$' + q + '$', a: V + '=' + b + '+' + a + '=' + x0 };
  }
  if (t === 2) {                                   // kx = b
    k = rnd(2, 12); x0 = nz(-12, 15); b = k * x0;
    q = rnd(0, 1) ? k + V + '=' + b : b + '=' + k + V;
    return { stem: '$' + q + '$', a: V + '=' + b + '\\div ' + k + '=' + x0 };
  }
  if (t === 3) {                                   // kx + b = c
    k = rnd(2, 9); x0 = nz(-10, 15); b = nz(-30, 30); c = k * x0 + b;
    if (Math.abs(b) < 2) return null;
    return { stem: '$' + lin(k, b, V) + '=' + c + '$', a: k + V + '=' + (k * x0) + ',\\ ' + V + '=' + x0 };
  }
  if (t === 4) {                                   // kx − b = c  (тал солиж бичсэн)
    k = rnd(2, 9); x0 = rnd(1, 15); b = rnd(2, 30); c = k * x0 - b;
    q = rnd(0, 1) ? c + '=' + k + V + '-' + b : k + V + '-' + b + '=' + c;
    return { stem: '$' + q + '$', a: k + V + '=' + (k * x0) + ',\\ ' + V + '=' + x0 };
  }
  k = rnd(2, 9); x0 = nz(-9, 12); b = rnd(5, 50); c = b - k * x0;   // b − kx = c (сөрөг коэффициент)
  q = rnd(0, 1) ? b + '-' + k + V + '=' + c : lin(-k, b, V) + '=' + c;
  return { stem: '$' + q + '$', a: '-' + k + V + '=' + (c - b) + ',\\ ' + V + '=' + x0 };
}

// 2. Хаалттай шугаман тэгшитгэл (5.4): k(mx+b)=c, ax−k(x+b)=c, k₁(x+p)±k₂(x+q)=c
function g2() {
  turn(2);
  var t = B2(), V = pick(['x', 'y', 'a', 'm']), x0 = nz(-10, 12), k, m, b, c, a;
  if (t === 0) {
    k = rnd(2, 9); m = rnd(1, 6); b = nz(-15, 15);
    var inner = m * x0 + b; c = k * inner; if (Math.abs(c) > 200) return null;
    var lhs = br(k, lin(m, b, V));
    return { stem: '$' + (rnd(0, 1) ? lhs + '=' + c : c + '=' + lhs) + '$', a: lin(m, b, V) + '=' + inner + ',\\ ' + V + '=' + x0 };
  }
  if (t === 1) {
    a = rnd(3, 9); k = rnd(2, a - 1); b = nz(-9, 9); c = (a - k) * x0 - k * b;
    return { stem: '$' + a + V + pbr(-k, lin(1, b, V)) + '=' + c + '$', a: lin(a - k, -k * b, V) + '=' + c + ',\\ ' + V + '=' + x0 };
  }
  var k1 = rnd(2, 7), k2 = nz(-6, 6), p = nz(-9, 9), r = nz(-9, 9);
  if (Math.abs(k2) === 1 || k1 + k2 === 0) return null;
  var A = k1 + k2, B0 = k1 * p + k2 * r; c = A * x0 + B0;
  return { stem: '$' + br(k1, lin(1, p, V)) + pbr(k2, lin(1, r, V)) + '=' + c + '$', a: lin(A, B0, V) + '=' + c + ',\\ ' + V + '=' + x0 };
}

// 3. Тэгшитгэл зохиож бодох (5.4): тоо олох, нийт ба илүү, нас, дараалсан тоо, мөнгө дутах, баг, уулзах, сан, периметр, хурд
function g3() {
  turn(3);
  var t = B3();
  if (t === 0) {
    var k = rnd(2, 9), b = rnd(2, 40), x0 = rnd(2, 30), plus = rnd(0, 1), c = plus ? k * x0 + b : k * x0 - b;
    if (c <= 0) return null;
    return { stem: 'Тоог $' + k + '$ дахин нэмэгдүүлээд, $' + b + '$ тоог ' + (plus ? 'нэмэхэд' : 'хасахад') + ' $' + c + '$ гарчээ. Уг тоог ол.',
      a: '$' + k + 'x' + (plus ? '+' : '-') + b + '=' + c + '$; $x=' + x0 + '$' };
  }
  if (t === 1) {
    var G = pick([['Ангид', 'сурагч', 'Охид', 'хөвгүүдээс', 'хүнээр', 'охид', 'хөвгүүд'], ['Хашаанд', 'мал', 'Хонь', 'ямаанаас', 'толгойгоор', 'хонь', 'ямаа'],
      ['Сагсанд', 'жимс', 'Алим', 'лийрээс', 'ширхгээр', 'алим', 'лийр'], ['Тавиур дээр', 'ном', 'Сурах бичиг', 'туужаас', 'ширхгээр', 'сурах бичиг', 'тууж']]);
    var y = rnd(5, 45), d = rnd(2, 20), N = 2 * y + d;
    return { stem: G[0] + ' нийт $' + N + '$ ' + G[1] + ' бий. ' + G[2] + ' нь ' + G[3] + ' $' + d + '$ ' + G[4] + ' олон. ' + cap(G[5]) + ', ' + G[6] + ' тус бүр хэд вэ?',
      a: '$x+(x+' + d + ')=' + N + '$; ' + G[6] + ' $' + y + '$, ' + G[5] + ' $' + (y + d) + '$' };
  }
  if (t === 2) {
    var P = pick([['Хүү, аав', 'Аав хүүгээсээ', 'хүү', 'аав', 22, 35], ['Охин, ээж', 'Ээж охиноосоо', 'охин', 'ээж', 20, 34], ['Ач хүү, өвөө', 'Өвөө ач хүүгээсээ', 'ач хүү', 'өвөө', 45, 60], ['Дүү, ах', 'Ах дүүгээсээ', 'дүү', 'ах', 2, 9]]);
    var s = rnd(4, 15), D0 = rnd(P[4], P[5]), S = 2 * s + D0;
    return { stem: P[0] + ' хоёрын насны нийлбэр $' + S + '$. ' + P[1] + ' $' + D0 + '$ насаар ах бол тус бүр хэдэн настай вэ?',
      a: '$x+(x+' + D0 + ')=' + S + '$; ' + P[2] + ' $' + s + '$, ' + P[3] + ' $' + (s + D0) + '$ настай' };
  }
  if (t === 3) {
    var n = rnd(2, 4), a0 = rnd(5, 60), Sn = n * a0 + n * (n - 1) / 2, list = [], eq = [], i;
    for (i = 0; i < n; i++) { list.push(a0 + i); eq.push(i ? '(x+' + i + ')' : 'x'); }
    return { stem: 'Дараалсан ' + ['', '', 'хоёр', 'гурван', 'дөрвөн'][n] + ' натурал тооны нийлбэр $' + Sn + '$. Эдгээр тоог ол.',
      a: '$' + eq.join('+') + '=' + Sn + '$; $' + list.join(',\\ ') + '$' };
  }
  if (t === 4) {
    var nm = pick(NAMES), it = pick(['ном', 'дэвтэр', 'бөмбөг', 'цүнх']), q = rnd(2, 7), x = 100 * rnd(10, 60), dd = 100 * rnd(2, 20), Sm = q * x - dd;
    if (Sm < 1000) return null;
    return { stem: nm + ' $' + th(Sm) + '$ төгрөгтэй байв. Тэр $' + q + '$ ижил ' + it + ' авах гэтэл $' + dd + '$ төгрөг дутжээ. Нэг ' + it + ' хэдэн төгрөгийн үнэтэй вэ?',
      a: '$' + q + 'x=' + th(Sm) + '+' + dd + '$; $x=' + th(x) + '$ төгрөг' };
  }
  if (t === 5) {
    var g = rnd(3, 9), xx = rnd(4, 12), sh = rnd(1, xx - 1), Ng = g * xx - sh;
    return { stem: 'Багш сурагчдыг ижил тооны хүүхэдтэй $' + g + '$ багт хуваахад сүүлийн багт $' + sh + '$ хүүхэд дутжээ. Нийт $' + Ng + '$ сурагч бол нэг багт хэдэн хүүхэд орох ёстой вэ?',
      a: '$' + g + 'x-' + sh + '=' + Ng + '$; $x=' + xx + '$ хүүхэд' };
  }
  if (t === 6) {
    var v1 = 5 * rnd(8, 16), v2 = 5 * rnd(8, 16), h = rnd(2, 6), L = (v1 + v2) * h; if (v1 === v2) return null;
    return { stem: 'Хоорондоо $' + L + '$ км зайтай хоёр хотоос $' + v1 + '$ км/ц ба $' + v2 + '$ км/ц хурдтай хоёр машин өөд өөдөөсөө зэрэг гарав. Хэдэн цагийн дараа уулзах вэ?',
      a: '$(' + v1 + '+' + v2 + ')t=' + L + '$; $t=' + h + '$ цаг' };
  }
  if (t === 7) {
    var Vt = 1000 * rnd(5, 40), rr = 10 * rnd(2, 20), tt = rnd(5, 60), W = Vt - rr * tt; if (W <= 0) return null;
    return { stem: '$' + th(Vt) + '$ литр устай усан сангаас минут тутамд $' + rr + '$ литр ус гадагшилдаг. Хэдэн минутын дараа санд $' + th(W) + '$ литр ус үлдэх вэ?',
      a: '$' + th(Vt) + '-' + rr + 't=' + th(W) + '$; $t=' + tt + '$ минут' };
  }
  if (t === 8) {
    var hx = rnd(2, 9), xs = rnd(4, 20), Pp = 3 * xs + hx;
    return { stem: 'Гурвалжны хоёр тал нь тус бүр $x$ см, гурав дахь тал нь $(x+' + hx + ')$ см. Периметр нь $' + Pp + '$ см бол талуудыг ол.',
      a: '$x+x+(x+' + hx + ')=' + Pp + '$; $x=' + xs + '$; талууд $' + xs + '$, $' + xs + '$, $' + (xs + hx) + '$ см' };
  }
  var vv = rnd(6, 18), t1 = rnd(2, 5), rk = rnd(2, 9), Sk = vv * t1 + rk;
  return { stem: 'Морьтой хүн $' + Sk + '$ км замын эхний хэсгийг тогтмол хурдаар $' + t1 + '$ цаг яваад, үлдсэн $' + rk + '$ км замыг явганаар туулав. Морь ямар хурдтай явсан бэ?',
    a: '$' + t1 + 'v+' + rk + '=' + Sk + '$; $v=' + vv + '$ км/ц' };
}

// 4. Сонгон даалгавар, хөнгөн хэлбэрээр (5.5): хоёр талдаа хувьсагчтай, сөрөг тэмдэгтэй, давхар хаалттай тэгшитгэл;
//    нөхцөлөөр хувьсагчийн утга, хоёр илэрхийлэл тэнцүү байх утга, гурван хэсэг, ачаа, дөрвөлжингийн оронд тоо
function g4() {
  turn(4);
  var t = B4();
  if (t === 0) {
    var a = rnd(5, 12), c = rnd(1, a - 1), x0 = nz(-8, 12), b = nz(-20, 20), d = (a - c) * x0 + b;
    return { stem: 'Тэгшитгэлийг бод: $' + lin(a, b, 'x') + '=' + lin(c, d, 'x') + '$.', a: '$' + a + 'x-' + tm(c, 'x') + '=' + d + sgn(-b) + '$; $x=' + x0 + '$' };
  }
  if (t === 1) {
    var A = rnd(20, 120), k = rnd(2, 12), x1 = nz(-9, 15), B = A - k * x1;
    return { stem: 'Тэгшитгэлийг бод: $' + A + '-' + k + 'x=' + B + '$.', a: '$-' + k + 'x=' + (B - A) + '$; $x=' + x1 + '$' };
  }
  if (t === 2) {
    var K = rnd(2, 4), M = rnd(2, 5), p = nz(-6, 6), q = nz(-10, 10), x2 = rnd(1, 10), in1 = M * (x2 + p) + q, C = K * in1;
    return { stem: 'Тэгшитгэлийг бод: $' + K + '(' + M + '(' + lin(1, p, 'x') + ')' + sgn(q) + ')=' + C + '$.',
      a: '$' + M + '(' + lin(1, p, 'x') + ')' + sgn(q) + '=' + in1 + '$; $' + M + '(' + lin(1, p, 'x') + ')=' + (in1 - q) + '$; $x=' + x2 + '$' };
  }
  if (t === 3) {
    var T = pick([[99, 'хамгийн их хоёр оронтой тоотой'], [100, 'хамгийн бага гурван оронтой тоотой'], [10, 'хамгийн бага хоёр оронтой тоотой'], [0, 'тэгтэй']]), kk = nz(-9, 9), bb = nz(-30, 30);
    if (Math.abs(kk) === 1 || (T[0] - bb) % kk !== 0) return null;
    var x3 = (T[0] - bb) / kk, e = lin(kk, bb, 'x');
    return { stem: '$x$-ийн ямар утгад $' + e + '$ илэрхийллийн утга ' + T[1] + ' тэнцүү болох вэ?', a: '$' + e + '=' + T[0] + '$; $x=' + (x3 === 0 ? 0 : x3) + '$' };
  }
  if (t === 4) {
    var a4 = rnd(3, 9), c4 = rnd(1, a4 - 1), x4 = nz(-8, 10), b4 = nz(-20, 20), d4 = (a4 - c4) * x4 + b4;
    if (d4 === 0) return null;
    var e1 = lin(a4, b4, 'x'), e2 = lin(c4, d4, 'x');
    return { stem: '$x$-ийн ямар утгад $' + e1 + '$ ба $' + e2 + '$ илэрхийллийн утга тэнцүү байх вэ?', a: '$' + e1 + '=' + e2 + '$; $x=' + x4 + '$ (утга нь $' + (a4 * x4 + b4) + '$)' };
  }
  if (t === 5) {
    var k5 = rnd(2, 4), d5 = rnd(3, 15), x5 = rnd(5, 25), N5 = x5 + k5 * x5 + (k5 * x5 - d5);
    if (k5 * x5 - d5 < 1) return null;
    return { stem: 'Сагсанд нийт $' + N5 + '$ жимс бий. Жүрж нь алимнаас $' + k5 + '$ дахин олон, лийр нь жүржээс $' + d5 + '$ ширхгээр цөөн. Жимс тус бүр хэдэн ширхэг вэ?',
      a: '$x+' + k5 + 'x+(' + k5 + 'x-' + d5 + ')=' + N5 + '$; алим $' + x5 + '$, жүрж $' + (k5 * x5) + '$, лийр $' + (k5 * x5 - d5) + '$' };
  }
  if (t === 6) {
    var tb = rnd(2, 5), sb = rnd(3, 8), db = rnd(2, 8), yb = rnd(8, 20), Tb = tb * yb + sb * (yb - db);
    if (yb - db < 2) return null;
    return { stem: '$' + tb + '$ багш, $' + sb + '$ сурагч ачаа үүрчээ. Багш бүрийн ачаа ижил, сурагч бүрийнх багшийнхаас $' + db + '$ кг-аар хөнгөн. Нийт ачаа $' + Tb + '$ кг бол багш, сурагч тус бүр хэдэн кг үүрсэн бэ?',
      a: '$' + tb + 'x+' + sb + '(x-' + db + ')=' + Tb + '$; багш $' + yb + '$ кг, сурагч $' + (yb - db) + '$ кг' };
  }
  var PR = pick([['x', 'y'], ['a', 'b'], ['m', 'n']]), k7 = nz(-9, 9), a7 = rnd(2, 12), b7 = nz(-12, 12);
  if (Math.abs(k7) === 1 || gcd(a7, b7) !== 1) return null;
  return { stem: 'Дөрвөлжингийн оронд тохирох тоог ол: $\\square\\cdot (' + pl([{ c: a7, v: PR[0] }, { c: b7, v: PR[1] }]) + ')=' + pl([{ c: k7 * a7, v: PR[0] }, { c: k7 * b7, v: PR[1] }]) + '$.',
    a: '$\\square=' + k7 + '$' };
}

CMX.jishig({
  title: 'V бүлэг — Жишиг даалгавар 2',
  sub: 'Шугаман тэгшитгэл · хаалттай тэгшитгэл · тэгшитгэл зохиож бодох · сонгон даалгавар',
  grade: '6-р анги',
  rule: 'Тэгшитгэл: хаалтыг задлах → $x$-тэй гишүүдийг нэг талд, тоог нөгөө талд шилжүүлэх (тэмдэг өөрчлөгдөнө) → $x$-ийг олох &nbsp;·&nbsp; Олсон утгаа орлуулж шалгана',
  tasks: [
    { label: 'Тэгшитгэлийг бод.', gen: g1, n: 16, nw: 4, cols: 4, wk: 14 },
    { label: 'Хаалттай тэгшитгэлийг бод.', gen: g2, n: 10, nw: 4, cols: 2, wk: 16 },
    { label: 'Тэгшитгэл зохиож бод.', gen: g3, n: 8, nw: 2, cols: 2, wk: 24 },
    { label: 'Бодлогыг бод.', gen: g4, n: 6, nw: 2, cols: 2, wk: 24 }
  ]
});
</script>
