<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тригонометр харьцаа — интерактив</title>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--purple-d:#5a32d6;--ink:#1a1030;--soft:#7c7596;--line:#e7ddff;
        --opp:#f97316;--adj:#2563eb;--hyp:#7B52EE;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:
    radial-gradient(1000px 400px at 12% -6%,#efe7ff 0,rgba(239,231,255,0) 60%),#f1eef8;
    min-height:100vh;padding:16px;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto}
  .back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--purple-d);text-decoration:none;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:.45rem 1rem;font-size:.85rem;margin-bottom:12px}
  .head{text-align:center;margin-bottom:14px}
  .head h1{font-size:1.4rem;color:var(--purple-d);font-weight:900}
  .head p{color:var(--soft);font-size:.9rem;margin-top:3px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px -24px rgba(90,50,214,.6);overflow:hidden}
  svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;background:
    linear-gradient(#f6f3ff 1px,transparent 1px) 0 0/22px 22px,
    linear-gradient(90deg,#f6f3ff 1px,transparent 1px) 0 0/22px 22px,#fff}
  .vtx{cursor:grab}.vtx:active{cursor:grabbing}
  .prop{background:#fff7e6;border:1px solid #f3dca6;border-radius:10px;padding:9px 12px;margin:12px 15px 0;font-size:.84rem;color:#9a6300;text-align:center}
  .readout{padding:13px 15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
  .ro{border-radius:12px;padding:10px 12px;text-align:center}
  .ro b{font-size:.78rem;display:block;opacity:.85}
  .ro .v{font-weight:900;font-size:1.15rem;margin-top:2px}
  .ro .f{font-size:.72rem;opacity:.8;margin-top:1px}
  .ro.ang{background:#eafaf0;color:var(--green)}
  .ro.s{background:#fff1e6;color:#c2410c}
  .ro.c{background:#eef4ff;color:var(--adj)}
  .ro.t{background:#f2ecff;color:var(--purple-d)}
  .hint{text-align:center;color:var(--soft);font-size:.82rem;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/worksheets.html">← Дасгалын төв</a>
  <div class="head">
    <h1>Тригонометр харьцаа</h1>
    <p><b>A</b> ба <b>B</b> оройг чирж талуудыг өөрчил · sin, cos, tan амьдаар шинэчлэгдэнэ</p>
  </div>
  <div class="panel">
    <svg id="stage" viewBox="0 0 440 360" aria-label="Тэгш өнцөгт гурвалжин"></svg>
    <div class="prop">📐 SOH-CAH-TOA · sin θ = эсрэг ÷ гипотенуз · cos θ = залгаа ÷ гипотенуз · tan θ = эсрэг ÷ залгаа</div>
    <div class="readout" id="readout"></div>
  </div>
  <div class="hint">💡 A-г босоо, B-г хэвтээ чиглэлд чирнэ · тэгш өнцөг C оройд үргэлж хадгалагдана</div>
</div>

<script>
var VBW=440,VBH=360;
var svg=document.getElementById('stage');
var C={x:110,y:290};                 // тэгш өнцгийн орой (тогтмол)
var P={A:{x:110,y:110},B:{x:360,y:290}};   // A — босоо, B — хэвтээ
var MIN=40;

function dist(u,v){return Math.hypot(u.x-v.x,u.y-v.y);}
function mid(u,v){return {x:(u.x+v.x)/2,y:(u.y+v.y)/2};}
function fmt(n,d){var p=Math.pow(10,d==null?1:d);return (Math.round(n*p)/p).toFixed(d==null?1:d);}

function L(x1,y1,x2,y2,color,w){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="'+(w||3)+'" stroke-linecap="round"/>';}
function txt(x,y,s,color,size){return '<text x="'+x+'" y="'+y+'" fill="'+color+'" font-size="'+(size||13)+'" font-weight="800" font-family="Segoe UI,Arial">'+s+'</text>';}
function dotc(p,r,fill,stroke){return '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="2"':'')+'/>';}

function angleArc(center,p1,p2,r,color){
  var a1=Math.atan2(p1.y-center.y,p1.x-center.x),a2=Math.atan2(p2.y-center.y,p2.x-center.x);
  var da=a2-a1; while(da<=-Math.PI)da+=2*Math.PI; while(da>Math.PI)da-=2*Math.PI;
  var sweep=da>0?1:0, large=Math.abs(da)>Math.PI?1:0;
  var s={x:center.x+r*Math.cos(a1),y:center.y+r*Math.sin(a1)};
  var e={x:center.x+r*Math.cos(a2),y:center.y+r*Math.sin(a2)};
  return '<path d="M'+s.x+' '+s.y+' A'+r+' '+r+' 0 '+large+' '+sweep+' '+e.x+' '+e.y+'" fill="none" stroke="'+color+'" stroke-width="2.4"/>';
}

function draw(){
  var A=P.A,B=P.B;
  var opp=Math.abs(A.y-C.y), adj=Math.abs(B.x-C.x), hyp=dist(A,B);
  var theta=Math.atan2(opp,adj)*180/Math.PI;
  var g='';
  // талбай
  g+='<polygon points="'+A.x+','+A.y+' '+B.x+','+B.y+' '+C.x+','+C.y+'" fill="rgba(123,82,238,.05)"/>';
  // талууд
  g+=L(C.x,C.y,A.x,A.y,'#f97316',4);   // эсрэг тал (босоо, CA)
  g+=L(C.x,C.y,B.x,B.y,'#2563eb',4);   // залгаа тал (хэвтээ, CB)
  g+=L(A.x,A.y,B.x,B.y,'#7B52EE',4);   // гипотенуз (AB)
  // тэгш өнцгийн тэмдэг C дээр
  var sq=15;
  g+='<path d="M'+(C.x+sq)+' '+C.y+' L'+(C.x+sq)+' '+(C.y-sq)+' L'+C.x+' '+(C.y-sq)+'" fill="none" stroke="#94879f" stroke-width="1.8"/>';
  // θ өнцгийн нум B дээр
  g+=angleArc(B,C,A,30,'#16a34a');
  g+=txt(B.x-52,B.y-14,'θ = '+fmt(theta,1)+'°','#16a34a',14);
  // талын шошго
  var mCA=mid(C,A),mCB=mid(C,B),mAB=mid(A,B);
  g+=txt(mCA.x-96,mCA.y+4,'эсрэг ('+fmt(opp)+')','#c2410c',12.5);
  g+=txt(mCB.x-26,mCB.y+22,'залгаа ('+fmt(adj)+')','#2563eb',12.5);
  g+=txt(mAB.x+8,mAB.y-6,'гипотенуз ('+fmt(hyp)+')','#5a32d6',12.5);
  // чирэгддэг оройнууд
  g+='<circle class="vtx" data-pt="A" cx="'+A.x+'" cy="'+A.y+'" r="17" fill="transparent"/>'+dotc(A,8,'#fff','#f97316');
  g+='<circle class="vtx" data-pt="B" cx="'+B.x+'" cy="'+B.y+'" r="17" fill="transparent"/>'+dotc(B,8,'#fff','#2563eb');
  g+=dotc(C,6,'#94879f');
  g+=txt(A.x-22,A.y-6,'A','#c2410c')+txt(B.x+8,B.y+18,'B','#2563eb')+txt(C.x-20,C.y+18,'C','#94879f');
  svg.innerHTML=g;

  var sinv=opp/hyp, cosv=adj/hyp, tanv=opp/adj;
  document.getElementById('readout').innerHTML=
     '<div class="ro ang"><b>Өнцөг θ</b><div class="v">'+fmt(theta,1)+'°</div></div>'
    +'<div class="ro s"><b>sin θ</b><div class="v">'+fmt(sinv,3)+'</div><div class="f">'+fmt(opp)+' ÷ '+fmt(hyp)+'</div></div>'
    +'<div class="ro c"><b>cos θ</b><div class="v">'+fmt(cosv,3)+'</div><div class="f">'+fmt(adj)+' ÷ '+fmt(hyp)+'</div></div>'
    +'<div class="ro t"><b>tan θ</b><div class="v">'+fmt(tanv,3)+'</div><div class="f">'+fmt(opp)+' ÷ '+fmt(adj)+'</div></div>';
}

/* ---- drag (A — босоо, B — хэвтээ) ---- */
function toSvg(e){var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var p=pt.matrixTransform(svg.getScreenCTM().inverse());return {x:p.x,y:p.y};}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
var drag=null;
svg.addEventListener('pointerdown',function(e){var t=e.target.closest('[data-pt]');if(!t)return;drag=t.getAttribute('data-pt');try{svg.setPointerCapture(e.pointerId);}catch(_){}});
svg.addEventListener('pointermove',function(e){
  if(!drag)return; e.preventDefault(); var p=toSvg(e);
  if(drag==='A'){P.A={x:C.x,y:clamp(p.y,20,C.y-MIN)};}     // зөвхөн босоо
  else if(drag==='B'){P.B={x:clamp(p.x,C.x+MIN,VBW-20),y:C.y};} // зөвхөн хэвтээ
  draw();
});
function endDrag(){drag=null;}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);

draw();
</script>
</body>
</html>
