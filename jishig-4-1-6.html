<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IV бүлэг — Жишиг даалгавар 1 (6-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 6-р анги · IV бүлэг. Магадлал — Жишиг даалгавар 1 (4.1 Үржвэр ба нийлбэрийн зарчим: цифрүүдээр тоо зохиох, тоолох бодлогууд) */
var NW = { 1: 'нэг', 2: 'хоёр', 3: 'гурван', 4: 'дөрвөн', 5: 'таван', 6: 'зургаан', 7: 'долоон', 8: 'найман' };
function prod(ar) { var p = 1; for (var i = 0; i < ar.length; i++) p *= ar[i]; return p; }
function fall(d, k) { var ar = []; for (var i = 0; i < k; i++) ar.push(d - i); return ar; }   // d, d-1, d-2 …
function mul(ar) { return ar.join('\\cdot '); }
function pw(b, e) { return e === 1 ? '' + b : b + '^{' + e + '}'; }
var NAMES = [['Болд', 'Болдод'], ['Сараа', 'Сараад'], ['Тэмүүлэн', 'Тэмүүлэнд'], ['Ану', 'Ануд'], ['Номин', 'Номинд'], ['Дулмаа', 'Дулмаад']];
var PAIRS = [['цамц', 'өмд', 'Нэг цамц, нэг өмдийг'], ['малгай', 'ороолт', 'Нэг малгай, нэг ороолтыг'], ['дэвтэр', 'үзэг', 'Нэг дэвтэр, нэг үзгийг'],
  ['ном', 'сэтгүүл', 'Нэг ном, нэг сэтгүүлийг'], ['цүнх', 'гутал', 'Нэг цүнх, нэг гутлыг']];
var MENU = [['шөл', 'хоол', 'ундаа'], ['салат', 'шөл', 'амттан'], ['талх', 'жимс', 'цай'], ['боов', 'жимс', 'шүүс']];
var DSETS = [[1, 2, 3, 4], [1, 3, 5, 7, 9], [2, 4, 6, 8], [5, 6, 7, 8, 9], [1, 2, 4, 8], [3, 4, 5, 6], [1, 2, 3, 4, 5], [2, 3, 5, 7], [1, 4, 6, 8, 9], [6, 7, 8, 9]];
var ZSETS = [[0, 1, 2, 3], [0, 2, 4, 6, 8], [0, 5, 6, 7], [0, 1, 5, 9], [0, 3, 6, 9], [0, 4, 8, 9], [0, 2, 5, 7, 8], [0, 1, 3, 5, 7]];
var EXP = [['Шоо ба зоосыг зэрэг орхиход', [6, 2]], ['Хоёр шоог зэрэг орхиход', [6, 6]], ['Гурван зоосыг зэрэг орхиход', [2, 2, 2]],
  ['Хоёр зоос ба нэг шоог зэрэг орхиход', [2, 2, 6]], ['Шоо ба $4$ хэсэгтэй ээрүүлийг зэрэг ашиглахад', [6, 4]], ['Зоос ба $10$ хэсэгтэй ээрүүлийг зэрэг ашиглахад', [2, 10]],
  ['Шоог гурван удаа дараалан орхиход', [6, 6, 6]], ['$3$ хэсэгтэй ээрүүлийг хоёр удаа эргүүлэхэд', [3, 3]], ['Зоос, шоо, $5$ хэсэгтэй ээрүүлийг зэрэг ашиглахад', [2, 6, 5]]];

// 1. Үржвэрийн зарчим: хослуулах, зам, иж бүрдэл, туршилтын үзэгдлийн тоо (4.1)
function g1() {
  var t = rnd(1, 6);
  if (t === 1) {
    var P = pick(PAIRS), nm = pick(NAMES), m = rnd(2, 7), n = rnd(2, 6); if (m === n) return null;
    return { stem: nm[1] + ' $' + m + '$ ' + P[0] + ', $' + n + '$ ' + P[1] + ' байна. ' + P[2] + ' хэдэн янзаар сонгох вэ?', a: '$' + m + '\\cdot ' + n + '=' + (m * n) + '$ янзаар' };
  }
  if (t === 2) {
    var a = rnd(2, 6), b = rnd(2, 6);
    return { stem: '$A$ хотоос $B$ хот хүрэх $' + a + '$, $B$ хотоос $C$ хот хүрэх $' + b + '$ зам бий. $A$ хотоос $B$ хотыг дайран $C$ хот хүрэх хэдэн зам бий?', a: '$' + a + '\\cdot ' + b + '=' + (a * b) + '$ зам' };
  }
  if (t === 3) {
    var M = pick(MENU), x = rnd(2, 5), y = rnd(2, 5), z = rnd(2, 4);
    return { stem: 'Цайны газарт $' + x + '$ төрлийн ' + M[0] + ', $' + y + '$ төрлийн ' + M[1] + ', $' + z + '$ төрлийн ' + M[2] + ' байна. Тус бүрээс нэгийг сонгох хэдэн янз бий?', a: '$' + mul([x, y, z]) + '=' + (x * y * z) + '$ янз' };
  }
  if (t === 4) { var E = pick(EXP); return { stem: E[0] + ' хэдэн ялгаатай үзэгдэл илрэх вэ?', a: '$' + mul(E[1]) + '=' + prod(E[1]) + '$ үзэгдэл' }; }
  if (t === 5) { var k = rnd(3, 7); return { stem: 'Зоосыг $' + k + '$ удаа орхиход сүлд, тооны хэдэн янзын дараалал гарах вэ?', a: '$2^{' + k + '}=' + Math.pow(2, k) + '$ дараалал' }; }
  var h = rnd(2, 4), obj = pick([['Ном, дэвтэр, харандаа', 3], ['Алим, жүрж, гадил', 3], ['Сам, үзэг, түлхүүр, утас', 4]]);
  return { stem: obj[0] + ' гэсэн ' + NW[obj[1]] + ' зүйлийг $' + h + '$ халаасандаа хэдэн янзаар хийж болох вэ?', a: '$' + pw(h, obj[1]) + '=' + Math.pow(h, obj[1]) + '$ янзаар' };
}
// 2. Цифрүүдээр тоо зохиох: давтагдах/давтагдахгүй, тэг орсон, бүх цифр сондгой/тэгш, тэгш тоо (4.1)
function g2() {
  var t = rnd(1, 5), ds, d, k, ar;
  if (t === 1) {
    ds = pick(DSETS); d = ds.length; k = rnd(2, 3); var rep = rnd(0, 1); if (!rep && d < k + 1) return null;
    ar = rep ? [] : fall(d, k); if (rep) for (var i = 0; i < k; i++) ar.push(d);
    return { stem: '$' + ds.join(',\\ ') + '$ цифрүүдээр зохиосон, цифр нь ' + (rep ? 'давтагдаж болох ' : 'давтагдахгүй ') + NW[k] + ' оронтой тоо', a: rep ? '$' + pw(d, k) + '=' + prod(ar) + '$' : '$' + mul(ar) + '=' + prod(ar) + '$' };
  }
  if (t === 2) {
    ds = pick(ZSETS); d = ds.length; k = rnd(2, 3); var rp = rnd(0, 1);
    ar = rp ? [d - 1, d, d].slice(0, k) : [d - 1, d - 1, d - 2].slice(0, k);
    return { stem: '$' + ds.join(',\\ ') + '$ цифрүүдээр зохиосон, цифр нь ' + (rp ? 'давтагдаж болох ' : 'давтагдахгүй ') + NW[k] + ' оронтой тоо', a: '$' + mul(ar) + '=' + prod(ar) + '$' };
  }
  if (t === 3) { k = rnd(2, 4); return { stem: 'Бүх цифр нь сондгой ' + NW[k] + ' оронтой тоо', a: '$' + pw(5, k) + '=' + Math.pow(5, k) + '$' }; }
  if (t === 4) { k = rnd(2, 4); return { stem: 'Бүх цифр нь тэгш ' + NW[k] + ' оронтой тоо', a: '$4\\cdot ' + pw(5, k - 1) + '=' + (4 * Math.pow(5, k - 1)) + '$ (эхний орон $0$ биш)' }; }
  ds = pick(DSETS); d = ds.length; var e = ds.filter(function (x) { return x % 2 === 0; }).length; if (e === 0 || e === d || d < 4) return null;
  return { stem: '$' + ds.join(',\\ ') + '$ цифрүүдээр зохиосон, цифр нь давтагдахгүй гурван оронтой тэгш тоо', a: 'Сүүлийн цифр $' + e + '$ янз: $' + mul([d - 1, d - 2, e]) + '=' + ((d - 1) * (d - 2) * e) + '$' };
}
// 3. Нийлбэр ба үржвэрийн зарчмыг хослуулах (4.1)
function g3() {
  var t = rnd(1, 5);
  if (t === 1) {
    var a = rnd(3, 12), b = rnd(3, 12), c = rnd(3, 12);
    return { stem: 'Номын санд $' + a + '$ түүхийн, $' + b + '$ шинжлэх ухааны, $' + c + '$ уран зохиолын ном байв. Аль нэг ном сонгох хэдэн янз бий?', a: '$' + a + '+' + b + '+' + c + '=' + (a + b + c) + '$ янз' };
  }
  if (t === 2) {
    var x = rnd(2, 6), y = rnd(2, 6), z = rnd(2, 6); if (x === y && y === z) return null;
    return { stem: 'Дэлгүүрт $' + x + '$ төрлийн аяга, $' + y + '$ төрлийн таваг, $' + z + '$ төрлийн халбага зарна. Өөр төрлийн хоёр зүйлийг хэдэн янзаар сонгох вэ?', a: '$' + x + '\\cdot ' + y + '+' + x + '\\cdot ' + z + '+' + y + '\\cdot ' + z + '=' + (x * y + x * z + y * z) + '$ янзаар' };
  }
  if (t === 3) {
    var m = rnd(2, 5), n = rnd(2, 5), p = rnd(2, 5), q = rnd(2, 5);
    return { stem: '$A\\to C$ чиглэлд $' + m + '$, $C\\to B$ чиглэлд $' + n + '$, $A\\to D$ чиглэлд $' + p + '$, $D\\to B$ чиглэлд $' + q + '$ зам бий. $A$ хотоос $B$ хот хүрэх хэдэн зам бий?', a: '$' + m + '\\cdot ' + n + '+' + p + '\\cdot ' + q + '=' + (m * n + p * q) + '$ зам' };
  }
  if (t === 4) {
    var bb = rnd(8, 16), gg = rnd(8, 16); if (bb === gg) return null;
    return { stem: 'Ангид $' + bb + '$ хөвгүүн, $' + gg + '$ охин бий. а) Нэг сурагчийг; б) нэг хөвгүүн, нэг охиныг хэдэн янзаар сонгох вэ?', a: 'а) $' + bb + '+' + gg + '=' + (bb + gg) + '$; б) $' + bb + '\\cdot ' + gg + '=' + (bb * gg) + '$' };
  }
  if (rnd(0, 1)) {
    var k = rnd(2, 3), ev = 4 * Math.pow(5, k - 1), od = Math.pow(5, k);
    return { stem: 'Бүх цифр нь тэгш, эсвэл бүх цифр нь сондгой ' + NW[k] + ' оронтой хэдэн тоо байх вэ?', a: '$4\\cdot ' + pw(5, k - 1) + '+' + pw(5, k) + '=' + ev + '+' + od + '=' + (ev + od) + '$ тоо' };
  }
  var u = rnd(2, 4), v = rnd(1, 3), w = rnd(1, 3), s = u + v + w;
  return { stem: '$A$ хотоос $B$ хот руу $' + u + '$ автобус, $' + v + '$ галт тэрэг, $' + w + '$ онгоцоор явж болно. Очиж, буцах аяллыг хэдэн янзаар төлөвлөх вэ?', a: '$' + s + '\\cdot ' + s + '=' + (s * s) + '$ янзаар' };
}
// 4. Тоолох бодлого: гар барих, тоглолт, диагональ, ахлагч-орлогч, далбаа, урвуу бодлого (4.1)
function g4() {
  var t = rnd(1, 7), n;
  if (t === 1) { n = rnd(6, 20); return { stem: 'Хуралд оролцсон $' + n + '$ хүн бүр бусадтайгаа яг нэг удаа гар барьжээ. Нийт хэдэн удаа гар барьсан бэ?', a: '$\\dfrac{' + n + '\\cdot ' + (n - 1) + '}{2}=' + (n * (n - 1) / 2) + '$ удаа' }; }
  if (t === 2) { n = rnd(5, 16); return { stem: 'Гүдгэр $' + n + '$ өнцөгт хэдэн диагональтай вэ?', a: '$\\dfrac{' + n + '\\cdot ' + (n - 3) + '}{2}=' + (n * (n - 3) / 2) + '$ диагональ' }; }
  if (t === 3) { n = rnd(8, 18); return { stem: '$' + n + '$ гишүүнтэй дугуйлангаас ахлагч, орлогч хоёрыг хэдэн янзаар сонгох вэ?', a: '$' + n + '\\cdot ' + (n - 1) + '=' + (n * (n - 1)) + '$ янзаар' }; }
  if (t === 4) { var k = rnd(4, 7), s = rnd(2, 3); return { stem: 'Өнгө нь давтагдахгүй ' + NW[s] + ' судалтай далбааг $' + k + '$ өнгийн даавуугаар хэдэн янзаар хийх вэ?', a: '$' + mul(fall(k, s)) + '=' + prod(fall(k, s)) + '$ янзаар' }; }
  if (t === 5) { n = rnd(5, 12); return { stem: 'Тэмцээнд $' + n + '$ баг оролцож, баг бүр бусадтайгаа хоёр удаа (талбай солин) тоглов. Нийт хэдэн тоглолт болсон бэ?', a: '$' + n + '\\cdot ' + (n - 1) + '=' + (n * (n - 1)) + '$ тоглолт' }; }
  if (t === 6) { n = rnd(5, 16); var T = n * (n - 1) / 2; return { stem: 'Хуралд оролцогч бүр бусадтайгаа яг нэг удаа гар барихад нийт $' + T + '$ удаа гар барьжээ. Хуралд хэдэн хүн оролцсон бэ?', a: '$\\dfrac{n\\cdot (n-1)}{2}=' + T + '$, $n\\cdot (n-1)=' + (2 * T) + '$, $n=' + n + '$ хүн' }; }
  n = rnd(5, 12);
  return { stem: '$' + n + '$ хотын аль ч хоёр нь агаарын замаар шууд холбогдсон бол нийт хэдэн агаарын зам байх вэ? Шинэ хот нэмэгдвэл хэдэн зам нэмэгдэх вэ?', a: '$\\dfrac{' + n + '\\cdot ' + (n - 1) + '}{2}=' + (n * (n - 1) / 2) + '$ зам; $' + n + '$ зам нэмэгдэнэ' };
}

CMX.jishig({
  title: 'IV бүлэг — Жишиг даалгавар 1',
  sub: 'Үржвэр ба нийлбэрийн зарчим · цифрүүдээр тоо зохиох · тоолох бодлого',
  grade: '6-р анги',
  rule: 'Үржвэрийн зарчим: $m\\cdot n$ &nbsp;·&nbsp; Нийлбэрийн зарчим: $m+n$ &nbsp;·&nbsp; Цифр давтагдахгүй: $d\\cdot (d-1)\\cdot (d-2)$ &nbsp;·&nbsp; Хос бүр нэг удаа: $\\dfrac{n\\cdot (n-1)}{2}$',
  tasks: [
    { label: 'Үржвэрийн зарчмаар бод.', gen: g1, n: 6, nw: 2, cols: 2, wk: 14 },
    { label: 'Хэдэн тоо зохиож болохыг ол.', gen: g2, n: 8, nw: 2, cols: 2, wk: 12 },
    { label: 'Нийлбэр ба үржвэрийн зарчмыг хэрэглэн бод.', gen: g3, n: 4, nw: 2, cols: 2, wk: 16 },
    { label: 'Бодлогыг бод.', gen: g4, n: 6, nw: 2, cols: 2, wk: 20 }
  ]
});
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
