<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}

  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}

  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:2px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 22px 2px 4px}
  .col1{display:grid;grid-template-columns:1fr;gap:11px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:8px;align-items:baseline}
  .ql{font-weight:800;color:var(--purple);font-size:13.5px;min-width:20px}
  .qm{font-size:13.5px;flex:1}
  .pts{font-size:10.5px;font-weight:700;color:#16a34a;background:#eafaf0;border:1px solid #bff0d0;border-radius:6px;padding:1px 7px;white-space:nowrap;margin-left:auto}
  .gwrap{margin:5px 0 2px}
  .fig{float:right;margin:0 0 4px 10px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:24mm;margin-top:5px}
  .wk.tall{height:30mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5;overflow:hidden}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  .ans-grid .a svg{float:right;margin:0 0 3px 8px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}

<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function opD(op){return {'>':'>','<':'<','ge':'\\ge','le':'\\le'}[op];}
function qs(a,b,c){var t=(a===1?'x^2':a===-1?'-x^2':a+'x^2');if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
var ALLR='x\\in\\mathbb{R}',NONE='\\varnothing\\ (\\text{шийдгүй})';
function ivOut(r1,r2,cl){return 'x\\in\\,]{-}\\infty,'+r1+(cl?']':'[')+'\\cup'+(cl?'[':']')+r2+',{+}\\infty[';}
function ivBtw(r1,r2,cl){return 'x\\in\\,'+(cl?'[':']')+r1+','+r2+(cl?']':'[');}
function ineqSolve(r1,r2,op){var cl=(op==='ge'||op==='le');return (op==='>'||op==='ge')?ivOut(r1,r2,cl):ivBtw(r1,r2,cl);}
function solveGraph(spec,op){var s=spec.s,cl=(op==='ge'||op==='le');
  if(spec.kind==='two'){var r1=spec.r1,r2=spec.r2,between=(s>0)?(op==='<'||op==='le'):(op==='>'||op==='ge');return between?ivBtw(r1,r2,cl):ivOut(r1,r2,cl);}
  if(spec.kind==='one'){var r0=spec.r0;if(s>0)return (op==='>')?('x\\in\\mathbb{R},\\ x\\ne'+r0):(op==='ge')?ALLR:(op==='<')?NONE:'x='+r0;return (op==='<')?('x\\in\\mathbb{R},\\ x\\ne'+r0):(op==='le')?ALLR:(op==='>')?NONE:'x='+r0;}
  if(s>0)return (op==='>'||op==='ge')?ALLR:NONE;return (op==='<'||op==='le')?ALLR:NONE;}
function graphSVG(spec){var W=140,H=100,padL=12,padR=7,padT=7,padB=15;var f,xmin,xmax,inter=[];
  if(spec.kind==='two'){var r1=spec.r1,r2=spec.r2;f=function(x){return spec.s*(x-r1)*(x-r2);};var c=(r1+r2)/2,hh=(r2-r1)/2;xmin=c-hh-1.6;xmax=c+hh+1.6;inter=[r1,r2];}
  else if(spec.kind==='one'){var r0=spec.r0;f=function(x){return spec.s*(x-r0)*(x-r0);};xmin=r0-2.2;xmax=r0+2.2;inter=[r0];}
  else{var h=spec.h;f=function(x){return spec.s*((x-h)*(x-h)+1.3);};xmin=h-2.2;xmax=h+2.2;inter=[];}
  var N=44,xs=[],ys=[];for(var i=0;i<=N;i++){var x=xmin+(xmax-xmin)*i/N;xs.push(x);ys.push(f(x));}
  var ymin=Math.min.apply(null,ys.concat([0])),ymax=Math.max.apply(null,ys.concat([0]));var yr=(ymax-ymin)||1;ymin-=yr*0.13;ymax+=yr*0.13;
  function PX(x){return padL+(x-xmin)/(xmax-xmin)*(W-padL-padR);}function PY(y){return padT+(ymax-y)/(ymax-ymin)*(H-padT-padB);}
  var y0=PY(0),yx=(0>=xmin&&0<=xmax)?PX(0):padL+2;
  var g='<line x1="2" y1="'+y0.toFixed(1)+'" x2="'+(W-2)+'" y2="'+y0.toFixed(1)+'" stroke="#999" stroke-width="1"/><line x1="'+yx.toFixed(1)+'" y1="2" x2="'+yx.toFixed(1)+'" y2="'+(H-2)+'" stroke="#999" stroke-width="1"/>';
  var d='';for(var i=0;i<=N;i++){d+=(i?'L':'M')+PX(xs[i]).toFixed(1)+' '+PY(ys[i]).toFixed(1)+' ';}
  g+='<path d="'+d+'" fill="none" stroke="#16a34a" stroke-width="1.8"/>';
  inter.forEach(function(r){var px=PX(r);g+='<circle cx="'+px.toFixed(1)+'" cy="'+y0.toFixed(1)+'" r="2.3" fill="#dc2626"/><text x="'+px.toFixed(1)+'" y="'+(y0+10).toFixed(1)+'" font-size="8" text-anchor="middle" fill="#b91c1c" font-weight="700">'+r+'</text>';});
  return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';}
// Геометрийн зургууд
function figRect(wl,ll){var W=122,H=80,x=20,y=12,w=84,h=50;return '<svg width="'+W+'" height="'+H+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="'+(x+w/2)+'" y="'+(y+h+14)+'" font-size="11" text-anchor="middle" fill="#166534">'+ll+'</text><text x="'+(x-5)+'" y="'+(y+h/2+4)+'" font-size="11" text-anchor="end" fill="#166534">'+wl+'</text></svg>';}
function figRT(al,bl,cl){var W=126,H=88;var g='<polygon points="20,70 20,16 104,70" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><rect x="20" y="62" width="8" height="8" fill="none" stroke="#16a34a" stroke-width="1"/>';g+='<text x="14" y="46" font-size="11" text-anchor="end" fill="#166534">'+al+'</text><text x="60" y="83" font-size="11" text-anchor="middle" fill="#166534">'+bl+'</text><text x="68" y="38" font-size="11" fill="#166534" transform="rotate(32 68 38)">'+cl+'</text>';return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';}
var TRI=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[20,21,29],[7,24,25]];
var BOATS=[{v:20,c:4,d:80,T:'8 цаг 20 минут'},{v:15,c:5,d:40,T:'6 цаг'},{v:12,c:3,d:45,T:'8 цаг'},{v:18,c:6,d:96,T:'12 цаг'}];
// ── Генераторууд ──
function rootsPair(lo,hi){for(var t=0;t<200;t++){var r1=nz(lo,hi),r2=nz(lo,hi);if(r1!==r2)return [Math.min(r1,r2),Math.max(r1,r2)];}return [-2,3];}
function g_eqFactor(){var rr=rootsPair(-6,6),r1=rr[0],r2=rr[1];var b=-(r1+r2),c=r1*r2;
  return {q:'$'+qs(1,b,c)+'=0$ тэгшитгэлийг үржигдэхүүн болгон задлах аргаар бод.',a:'$(x'+sg(-r1)+')(x'+sg(-r2)+')=0\\Rightarrow x_1='+r1+',\\ x_2='+r2+'$'};}
function g_eqFormula(){var p=pick([1,3,5]),q=nz(-4,4);var b=-(2*q+p),c=p*q;var D=b*b-8*c,sq=Math.round(Math.sqrt(D));
  return {q:'$'+qs(2,b,c)+'=0$ тэгшитгэлийг томьёогоор бод.',a:'$D=b^2-4ac='+D+'$; $x=\\dfrac{'+(-b)+'\\pm'+sq+'}{4}='+q+';\\ \\tfrac{'+p+'}{2}$'};}
function g_eqComplete(){var m=nz(-4,4),k=pick([2,3,5,6,7]);var b=2*m,c=m*m-k;
  return {q:'$'+qs(1,b,c)+'=0$ тэгшитгэлийг бүтэн квадрат ялган бод.',a:'$(x'+sg(m)+')^2='+k+'\\Rightarrow x='+(-m)+'\\pm\\sqrt{'+k+'}$'};}
function g_biquad(){var m,n;do{m=rnd(1,4);n=rnd(1,4);}while(m===n);var lo=Math.min(m,n),hi=Math.max(m,n);m=lo;n=hi;var b=-(m*m+n*n),c=m*m*n*n;
  return {q:'$x^4'+sg(b)+'x^2'+sg(c)+'=0$ тэгшитгэлийг орлуулах аргаар бод.',a:'$t=x^2:\\ t^2'+sg(b)+'t'+sg(c)+'=0\\Rightarrow t='+(m*m)+';'+(n*n)+'$; $x=\\pm'+m+',\\ \\pm'+n+'$'};}
function g_disc(){var m=pick([2,3,4,5]),c=m*m;
  return {q:'$x^2+2kx+'+c+'=0$ тэгшитгэл хоёр ялгаатай бодит шийдтэй байх $k$-ийн утгыг ол.',a:'$D=4(k^2-'+c+')>0\\Rightarrow k^2>'+c+'$; $k\\in\\,]{-}\\infty,-'+m+'[\\cup]'+m+',{+}\\infty[$'};}
function g_ineqInterval(){var rr=rootsPair(-6,6),r1=rr[0],r2=rr[1],op=pick(['>','ge','<','le']);var b=-(r1+r2),c=r1*r2;
  return {q:'$'+qs(1,b,c)+' '+opD(op)+' 0$ тэнцэтгэл бишийг интервалын аргаар бод.',a:'Задлавал $(x'+sg(-r1)+')(x'+sg(-r2)+') '+opD(op)+' 0$; язгуур $'+r1+','+r2+'$; парабол дээш. Шийд: $'+ineqSolve(r1,r2,op)+'$'};}
function g_ineqFactor(){var rr=rootsPair(-6,6),r1=rr[0],r2=rr[1],op=pick(['>','ge','<','le']);
  return {q:'$(x'+sg(-r1)+')(x'+sg(-r2)+') '+opD(op)+' 0$ тэнцэтгэл бишийг бод.',a:'язгуур $'+r1+','+r2+'$; Шийд: $'+ineqSolve(r1,r2,op)+'$'};}
function g_grafikSolve(){var rr=rootsPair(-5,5),r1=rr[0],r2=rr[1],s=pick([1,-1]),op=pick(['>','ge','<','le']);var a=s,b=-s*(r1+r2),c=s*r1*r2;var sp={kind:'two',s:s,r1:r1,r2:r2};
  return {q:'$'+qs(a,b,c)+' '+opD(op)+' 0$ тэнцэтгэл бишийг график ашиглан бод.',a:'$a'+(s>0?'>':'<')+'0$ (салаа '+(s>0?'дээш':'доош')+'), $D>0$, язгуур $'+r1+','+r2+'$. '+graphSVG(sp)+' Шийд: $'+solveGraph(sp,op)+'$'};}
function g_graphRead(){var kind=pick(['two','two','one','none']),s=pick([1,-1]),sp,op=pick(['>','ge','<','le']);
  if(kind==='two'){var rr=rootsPair(-5,5);sp={kind:'two',s:s,r1:rr[0],r2:rr[1]};}
  else if(kind==='one')sp={kind:'one',s:s,r0:nz(-4,4)};else sp={kind:'none',s:s,h:rnd(-3,3)};
  return {q:'Доорх параболын графикийг ашиглан $f(x) '+opD(op)+' 0$ тэнцэтгэл бишийн шийдийг ол.'+'<div class="gwrap">'+graphSVG(sp)+'</div>',a:'$'+solveGraph(sp,op)+'$'};}
function g_wordNum(){var rr=rootsPair(2,12),r1=rr[0],r2=rr[1];var S=r1+r2,P=r1*r2;
  return {q:'Хоёр тооны нийлбэр нь $'+S+'$, үржвэр нь $'+P+'$ бол тэдгээр тоог ол.',a:'$x^2-'+S+'x+'+P+'=0\\Rightarrow (x-'+r1+')(x-'+r2+')=0$; тоонууд $'+r1+'$ ба $'+r2+'$'};}
function g_wordRect(){var p=rnd(3,8),q=rnd(p+2,12),d=q-p,A=p*q;
  return {q:'<span class="fig">'+figRect('x','x+'+d)+'</span>Тэгш өнцөгтийн урт нь өргөнөөсөө $'+d+'$-аар их бөгөөд талбай нь $'+A+'\\ \\text{м}^2$. Хэмжээсийг нь ол.',a:'$x(x+'+d+')='+A+'\\Rightarrow x^2+'+d+'x-'+A+'=0\\Rightarrow x='+p+'$; өргөн $'+p+'$ м, урт $'+(p+d)+'$ м'};}
function g_wordRT(){var t=pick(TRI),a=t[0],b=t[1],c=t[2],d=b-a;
  return {q:'<span class="fig">'+figRT('x','x+'+d,c)+'</span>Тэгш өнцөгт гурвалжны нэг катет нөгөөгөөсөө $'+d+'$-аар урт, гипотенуз нь $'+c+'$. Катетуудыг ол.',a:'$x^2+(x+'+d+')^2='+c*c+'\\Rightarrow x='+a+'$; катетууд $'+a+'$ ба $'+b+'$'};}
function g_wordBoat(){var B=pick(BOATS);
  return {q:'Мотор завь голоор $'+B.d+'$ км газар өгсөж, буцаж ирэхэд нийт $'+B.T+'$ зарцуулав. Голын урсгалын хурд $'+B.c+'$ км/ц бол завины (усан дахь) хурдыг ол.',a:'$\\dfrac{'+B.d+'}{v-'+B.c+'}+\\dfrac{'+B.d+'}{v+'+B.c+'}=T\\Rightarrow v='+B.v+'$ км/ц'};}
// ── II бүлгийн генераторууд ──
function sysTex2(e1,e2){return '\\begin{cases}'+e1+'\\\\ '+e2+'\\end{cases}';}
function sys3T(e1,e2,e3){return '\\begin{cases}'+e1+'\\\\ '+e2+'\\\\ '+e3+'\\end{cases}';}
function det2t(a,b,c,d){return '\\begin{vmatrix}'+a+'&'+b+'\\\\'+c+'&'+d+'\\end{vmatrix}';}
function mat2(a,b,c,d){return '\\begin{pmatrix}'+a+'&'+b+'\\\\'+c+'&'+d+'\\end{pmatrix}';}
function vec2(p,q){return '\\begin{pmatrix}'+p+'\\\\'+q+'\\end{pmatrix}';}
function pn2(n){return n<0?'('+n+')':''+n;}
function lin2(a,b,r){var t='';if(a===1)t+='x';else if(a===-1)t+='-x';else t+=a+'x';if(b>0)t+='+'+(b===1?'':b)+'y';else t+='-'+(b===-1?'':-b)+'y';t+='='+r;return t;}
function lin3t(a,b,c,d){var parts=[['x',a],['y',b],['z',c]],s='',st=false;parts.forEach(function(p){var co=p[1];if(co===0)return;var m=Math.abs(co),bd=(m===1?'':m)+p[0];if(!st){s+=(co<0?'-':'')+bd;st=true;}else s+=(co<0?'-':'+')+bd;});if(!st)s='0';return s+'='+d;}
function parP(p){var t='x^2';if(p===1)t+='+x';else if(p===-1)t+='-x';else if(p>0)t+='+'+p+'x';else if(p<0)t+='-'+(-p)+'x';return t;}
function qform2(B,C){var t='x^2';if(B===1)t+='+x';else if(B===-1)t+='-x';else if(B>0)t+='+'+B+'x';else if(B<0)t+='-'+(-B)+'x';if(C>0)t+='+'+C;else if(C<0)t+='-'+(-C);return t;}
var DETOK2=[1,-1,2,-2,3,-3,5,-5];
var SUBST=[{e1:'x-y=2',e2:'x^2-2y^2=7',expr:'x=y+2',red:'(y+2)^2-2y^2=7\\Rightarrow y^2-4y+3=0\\Rightarrow y=1;3',sols:[[3,1],[5,3]]},{e1:'x+y=5',e2:'x^2+y^2=13',expr:'y=5-x',red:'x^2+(5-x)^2=13\\Rightarrow x^2-5x+6=0\\Rightarrow x=2;3',sols:[[2,3],[3,2]]},{e1:'x-y=1',e2:'3x^2-y^2=11',expr:'x=y+1',red:'3(y+1)^2-y^2=11\\Rightarrow y^2+3y-4=0\\Rightarrow y=1;-4',sols:[[2,1],[-3,-4]]},{e1:'x+2y=5',e2:'x^2+y^2=10',expr:'x=5-2y',red:'(5-2y)^2+y^2=10\\Rightarrow y^2-4y+3=0\\Rightarrow y=1;3',sols:[[3,1],[-1,3]]}];
function solS(a){return a.map(function(s){return '('+s[0]+';'+s[1]+')';}).join(',\\ ');}
function jsub(){var c=pick(SUBST);return {q:'$'+sysTex2(c.e1,c.e2)+'$ системийг орлуулах аргаар бод.',a:'Шугамангаас $'+c.expr+'$. Орлуулбал $'+c.red+'$. Шийд: $'+solS(c.sols)+'$'};}
var SYMS=[{e1:'x+y=5',e2:'xy=6',sol:'$t^2-5t+6=0\\Rightarrow t=2;3$',sols:[[2,3],[3,2]]},{e1:'x+y=7',e2:'xy=12',sol:'$t^2-7t+12=0\\Rightarrow t=3;4$',sols:[[3,4],[4,3]]},{e1:'xy=6',e2:'x^2+y^2=13',sol:'$(x+y)^2=13+12=25\\Rightarrow x+y=\\pm5$; $t^2\\mp5t+6=0$',sols:[[2,3],[3,2],[-2,-3],[-3,-2]]}];
function jsym(){var c=pick(SYMS);return {q:'$'+sysTex2(c.e1,c.e2)+'$ системийг бод.',a:c.sol+'. Шийд: $'+solS(c.sols)+'$'};}
function jinv(){for(var t=0;t<400;t++){var a=nz(-3,3),b=nz(-3,3),c=nz(-3,3),d=nz(-3,3);var D=a*d-b*c;if(DETOK2.indexOf(D)<0)continue;var x0=nz(-4,4),y0=nz(-4,4);var p=a*x0+b*y0,q=c*x0+d*y0;if(Math.abs(p)>22||Math.abs(q)>22)continue;
  return {q:'$'+sysTex2(lin2(a,b,p),lin2(c,d,q))+'$ системийг урвуу матриц ашиглан бод.',a:'$|A|='+pn2(a)+'\\cdot'+pn2(d)+'-'+pn2(b)+'\\cdot'+pn2(c)+'='+D+'$. $X=A^{-1}B=\\dfrac{1}{'+D+'}'+mat2(d,-b,-c,a)+vec2(p,q)+'='+vec2(x0,y0)+'$. Шийд: $('+x0+';'+y0+')$'};}return null;}
function jcram(){for(var t=0;t<400;t++){var a=nz(-3,3),b=nz(-3,3),c=nz(-3,3),d=nz(-3,3);var D=a*d-b*c;if(DETOK2.indexOf(D)<0)continue;var x0=nz(-4,4),y0=nz(-4,4);var e=a*x0+b*y0,f=c*x0+d*y0;if(Math.abs(e)>22||Math.abs(f)>22)continue;var Dx=e*d-b*f,Dy=a*f-e*c;
  return {q:'$'+sysTex2(lin2(a,b,e),lin2(c,d,f))+'$ системийг Крамерын дүрмээр бод.',a:'$D='+det2t(a,b,c,d)+'='+D+'$; $D_x='+Dx+',\\ D_y='+Dy+'$; $x=\\dfrac{'+Dx+'}{'+D+'}='+x0+',\\ y=\\dfrac{'+Dy+'}{'+D+'}='+y0+'$'};}return null;}
function jgauss(){for(var t=0;t<500;t++){var x0=nz(-3,3),y0=nz(-3,3),z0=nz(-3,3);var b1=rnd(-2,2),c1=rnd(-2,2),c2=rnd(-2,2),c3=pick([1,2,3]);var d1=x0+b1*y0+c1*z0,d2=y0+c2*z0,d3=c3*z0;var m2=pick([-2,-1,1,2]),m3=pick([-2,-1,1,2]),n3=pick([-2,-1,1,2]);var R1=[1,b1,c1,d1],R2=[m2,1+m2*b1,c2+m2*c1,d2+m2*d1],R3=[m3,m3*b1+n3,c3+m3*c1+n3*c2,d3+m3*d1+n3*d2];if(R2[0]===0||R3[0]===0)continue;if([R1,R2,R3].some(function(r){return r.some(function(v){return Math.abs(v)>15;});}))continue;
  return {q:'$'+sys3T(lin3t(R1[0],R1[1],R1[2],R1[3]),lin3t(R2[0],R2[1],R2[2],R2[3]),lin3t(R3[0],R3[1],R3[2],R3[3]))+'$ системийг Гауссын аргаар бод.',a:'Гурвалжин хэлбэрт: $'+sys3T(lin3t(1,b1,c1,d1),lin3t(0,1,c2,d2),lin3t(0,0,c3,d3))+'$. Буцаах орлуулга: $z='+z0+',\\ y='+y0+',\\ x='+x0+'$. Шийд: $('+x0+';'+y0+';'+z0+')$'};}return null;}
function jtangent(){var mm=pick([1,2,3]),C=mm*mm;return {q:'$y=kx$ шулуун $y=x^2+'+C+'$ параболыг шүргэх $k$-ийн утгыг ол.',a:'$x^2-kx+'+C+'=0$-ийн $D=k^2-4\\cdot'+C+'=0\\Rightarrow k^2='+(4*C)+'\\Rightarrow k=\\pm'+(2*mm)+'$'};}
function jcurve(){var p=nz(-2,2),rr=rootsPair(-3,3),r1=rr[0],r2=rr[1];var m=p+(r1+r2),k=-(r1*r2);var y1=r1*r1+p*r1,y2=r2*r2+p*r2;
  var mx=(m===0?'':(m===1?'x':m===-1?'-x':m+'x'));var rhs=(mx===''?''+k:mx+(k>0?'+'+k:k<0?''+k:''));if(rhs==='')rhs='0';
  return {q:'$'+sysTex2('y='+parP(p),'y='+rhs)+'$ парабол ба шулууны ерөнхий цэгийг ол.',a:'$'+parP(p)+'='+rhs+'\\Rightarrow '+qform2(p-m,-k)+'=0\\Rightarrow x='+r1+';'+r2+'$. Цэгүүд: $('+r1+','+y1+'),\\ ('+r2+','+y2+')$'};}
function jword3(){for(var t=0;t<300;t++){var x0=nz(-5,7),y0=nz(-5,7),z0=nz(-5,7);var a1=rnd(1,4),a2=rnd(1,4),a3=rnd(1,4),b1=rnd(1,4),b2=rnd(1,4),b3=rnd(1,4);var det=(a2*b3-a3*b2)-(a1*b3-a3*b1)+(a1*b2-a2*b1);if(det===0)continue;var S=x0+y0+z0,M1=a1*x0+a2*y0+a3*z0,M2=b1*x0+b2*y0+b3*z0;if(Math.abs(M1)>60||Math.abs(M2)>60)continue;
  return {q:'Гурван тооны нийлбэр $'+S+'$. Тэдгээрийг харгалзан $'+a1+','+a2+','+a3+'$-аар үржүүлж нэмбэл $'+M1+'$; $'+b1+','+b2+','+b3+'$-аар үржүүлбэл $'+M2+'$ болно. Тэдгээр тоог ол.',a:'Систем: $'+sys3T('x+y+z='+S,lin3t(a1,a2,a3,M1),lin3t(b1,b2,b3,M2))+'$. Гауссаар бодоход шийд: $('+x0+';'+y0+';'+z0+')$'};}return null;}
// ── Шалгалтын бүтэц ──
var EXAM={title:'II бүлэг — Жишиг даалгавар 1',sub:'Тэгшитгэлийн систем: орлуулах · матриц · Крамер · Гаусс (2.1–2.2)',time:'40 минут',
  tasks:[jsub,jinv,jgauss,jcurve,jword3,jsym,jcram,jtangent],
  points:[12,12,13,13,13,12,13,12]};
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function build(){window.__P=EXAM.tasks.map(function(fn){return gen(fn);});layout();}
function layout(){var WK=document.getElementById('sw').checked;var P=window.__P||(window.__P=EXAM.tasks.map(function(fn){return gen(fn);}));
  var total=EXAM.points.reduce(function(a,b){return a+b;},0);
  var qs2=P.map(function(f,i){var tall=/систем|Гаусс|Гурван|нийлбэр|Крамер|цэгийг/.test(f.q);
    return '<div class="q"><div class="qh"><span class="ql">'+(i+1)+'.</span><span class="qm">'+f.q+'</span></div>'+(WK?'<div class="wk'+(tall?' tall':'')+'"></div>':'')+'</div>';}).join('');
  var ans=P.map(function(f,i){return '<div class="a"><span class="an">'+(i+1)+'.</span>'+f.a+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>'+EXAM.title+'</h1><div class="sub">'+EXAM.sub+' · 11-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="col1">'+qs2+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE=EXAM.title;
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
