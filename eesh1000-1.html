<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЭЕШ 1000 1-1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/e1k.js?v=2"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* ЭЕШ 1000 1-1 — ЭЕШ-ийн 1000 бодлого, 1-р хэсэг (1–25-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 1. Тойрог багтаасан тэгш өнцөгт трапец: r, AD − BC өгөгдсөн → периметр.
//    Өндөр = 2r, хажуу тал AB = √((2r)² + d²); багтаасан тул AD + BC = CD + AB → P = 2(2r + AB).
//    (2r, d, AB) — Пифагорын гурвал; d ≤ 1.6·2r (зураг хэт хавтгай болохоос сэргийлнэ).
var p1_T = [[6, 8, 10], [8, 6, 10], [12, 5, 13], [12, 9, 15], [16, 12, 20], [12, 16, 20], [24, 10, 26], [20, 15, 25],
  [24, 7, 25], [20, 21, 29], [24, 18, 30], [18, 24, 30], [30, 16, 34], [28, 21, 35], [40, 9, 41]];
function p1() {
  var t = pick(p1_T), h = t[0], d = t[1], c = t[2], r = h / 2;
  var tA = (c + d) / 2, tB = (c - d) / 2, AD = r + tA, BC = r + tB, P = 2 * (h + c);
  // Зураг: D(0;0), A(AD;0), B(BC;h), C(0;h), O(r;r)
  var D = [0, 0], A = [AD, 0], B = [BC, h], C = [0, h], O = [r, r];
  var f = Fig({ w: 240, h: 170 });
  f.poly([D, A, B, C]).circle(O, r)
    .right(C, B, D, { s: 7 }).right(D, C, A, { s: 7 })
    .dot(O, { r: 2.2 }).arrow(O, [r, 0], { w: 1.2, h: 7 })
    .text(C, 'C', { pos: 'nw' }).text(B, 'B', { pos: 'ne' }).text(D, 'D', { pos: 'sw' }).text(A, 'A', { pos: 'se' })
    .text(O, 'O', { pos: 'e' }).text([r, r / 2], dec(r), { pos: 'e', size: 12 });
  // Бодолт (гар бичмэл): шүргэгч хэрчмүүд тэнцүү → P = 4r + 2(a + b); BH өндөр → AB = √((2r)² + d²) = a + b.
  var H = [BC, 0], g = Fig({ w: 200, h: 140 });
  g.poly([D, A, B, C]).seg(B, H, { dash: '4 3' }).right(H, B, A, { s: 6 }).right(D, C, A, { s: 6 })
    .text(C, 'C', { pos: 'nw' }).text(B, 'B', { pos: 'ne' }).text(D, 'D', { pos: 'sw' }).text(A, 'A', { pos: 'se' }).text(H, 'H', { pos: 's' })
    .text([BC, h / 2], String(h), { pos: 'w', size: 12 }).text([(BC + AD) / 2, 0], String(d), { pos: 's', size: 12 });
  return {
    q: 'Радиус нь $' + dec(r) + '$ байх тойргийг багтаасан тэгш өнцөгт трапецийн хувьд $AD-BC=' + d + '$ бол $P_{ABCD}$ периметрийг олоорой.',
    a: '$P_{ABCD}=' + P + '$',
    fig: f.svg(), side: true, wk: 30,
    s: [
      'Тойргийн гадна орших цэгээс татсан хоёр шүргэгч хэрчим тэнцүү. Шүргэлтийн цэгүүд талуудыг хуваахад $CD=2r=' + h + '$, $BC=' + dec(r) + '+a$, $AD=' + dec(r) + '+b$, $AB=a+b$ болно'
        + ' ($a$, $b$ — $B$ ба $A$ оройгоос татсан шүргэгчийн урт). Иймд $$P=CD+BC+AD+AB=' + 2 * h + '+2(a+b).$$',
      '$B$ оройгоос $BH$ өндөр буулгая: $BH=CD=' + h + '$, $HA=AD-BC=' + d + '$. $ABH$ тэгш өнцөгт гурвалжинд Пифагорын теоремоор $$AB=\\sqrt{' + h + '^2+' + d + '^2}=' + c + '=a+b.$$',
      'Иймд $P=' + 2 * h + '+2\\cdot ' + c + '=' + P + '$.'
    ],
    sfig: g.svg(),
    t: { r: r, d: d, P: P }
  };
}

// 2. A(a;b) цэгийг O төвтэй k коэффициенттэй гомотетоор хувиргахад B(ka;kb), y (эсвэл x) тэнхлэгийн хувьд
//    тэгш хэмтэй хувиргахад C(−a;b) (эсвэл C(a;−b)). AC нь тэнхлэгт перпендикуляр: |AC| = 2|a| (2|b|),
//    B-ээс AC хүртэлх зай |k − 1|·|b| (|k − 1|·|a|) → S = |ab(k − 1)| (хоёр тохиолдолд ижил).
function p2() {
  var a = nz(-6, 6), b = nz(-6, 6), k = pick([-3, -2, -2, 2, 3]), ax = pick(['y', 'y', 'x']);
  if (Math.abs(a) + Math.abs(b) < 3) return null;
  var S = Math.abs(a * b * (k - 1));
  if (S > 100) return null;
  // Бодолт (гар бичмэл): B, C-ийн координат → AC тэнхлэгт параллель → S = h·|AC|/2.
  var oy = ax === 'y', Bp = [k * a, k * b], Cp = oy ? [-a, b] : [a, -b];
  var AC = oy ? 2 * Math.abs(a) : 2 * Math.abs(b), hh = oy ? Math.abs(b - k * b) : Math.abs(a - k * a);
  var s2 = oy
    ? '$A$ ба $C$ цэгийн ординат тэнцүү тул $AC$ хэрчим $x$ тэнхлэгтэй параллель: $|AC|=|' + a + '-' + par(-a) + '|=' + AC + '$. '
      + '$B$ оройгоос буулгасан өндөр нь $B$ цэгээс $y=' + b + '$ шулуун хүртэлх зай: $h=|' + b + '-' + par(k * b) + '|=' + hh + '$.'
    : '$A$ ба $C$ цэгийн абсцисс тэнцүү тул $AC$ хэрчим $y$ тэнхлэгтэй параллель: $|AC|=|' + b + '-' + par(-b) + '|=' + AC + '$. '
      + '$B$ оройгоос буулгасан өндөр нь $B$ цэгээс $x=' + a + '$ шулуун хүртэлх зай: $h=|' + a + '-' + par(k * a) + '|=' + hh + '$.';
  return {
    q: '$A' + pt(a, b) + '$ цэгийг координатын эх дээр төвтэй $k=' + k + '$ коэффициенттэй гомотетоор хувиргахад $B$ цэг, харин $' + ax
      + '$ тэнхлэгийн хувьд тэгш хэмтэй хувиргахад $C$ цэг үүсэв. $ABC$ гурвалжны талбайг олоорой.',
    a: '$S_{ABC}=' + S + '$',
    wk: 28,
    s: [
      'Координатын эх дээр төвтэй $k$ коэффициенттэй гомотетоор $(x;\\,y)$ цэг $(kx;\\,ky)$ цэгт шилжинэ: $B(' + k + '\\cdot ' + par(a) + ';\\,' + k + '\\cdot ' + par(b) + ')=B' + pt(Bp[0], Bp[1]) + '$.',
      oy ? '$y$ тэнхлэгийн хувьд тэгш хэмтэй цэгийн абсцисс эсрэг тэмдэгтэй болно: $C' + pt(Cp[0], Cp[1]) + '$.'
        : '$x$ тэнхлэгийн хувьд тэгш хэмтэй цэгийн ординат эсрэг тэмдэгтэй болно: $C' + pt(Cp[0], Cp[1]) + '$.',
      s2,
      'Иймд $$S_{ABC}=\\dfrac{h\\cdot|AC|}{2}=\\dfrac{' + hh + '\\cdot ' + AC + '}{2}=' + S + '.$$'
    ],
    sfig: p2_fig(a, b, k, oy),
    t: { a: a, b: b, k: k, ax: ax }
  };
}
// Бодолтын зураг: координатын хавтгай дээр ABC гурвалжин, B-ээс AC шулуунд буулгасан BH өндөр (H нь AC-ийн үргэлжлэл дээр).
function p2_fig(a, b, k, oy) {
  var A = [a, b], B = [k * a, k * b], C = oy ? [-a, b] : [a, -b], Hp = oy ? [k * a, b] : [a, k * b], E = k > 0 ? A : C, O = [0, 0];
  var xs = [0, a, k * a, -a], ys = [0, b, k * b, -b];
  var dx = Math.max.apply(null, xs) - Math.min.apply(null, xs), dy = Math.max.apply(null, ys) - Math.min.apply(null, ys), m = 0.09 * Math.max(dx, dy);
  // Харах муж (Fig-ийнхтэй ижил); хэт хавтгай/нарийн үед тэнхлэг тус бүрийн масштабыг тусад нь (affine) сунгаж шошгонд зай гаргана
  var P = [O, A, B, C, Hp], vx0 = 1e9, vx1 = -1e9, vy0 = 1e9, vy1 = -1e9;
  P.forEach(function (p) { vx0 = Math.min(vx0, p[0]); vx1 = Math.max(vx1, p[0]); vy0 = Math.min(vy0, p[1]); vy1 = Math.max(vy1, p[1]); });
  var xr = vx1 - vx0, yr = vy1 - vy0, rr = yr / xr, sx, sy, g, W = 220, Hh = 190;
  if (rr < 0.45 || rr > 2.2) {          // хавтгай/нарийн: x, y-ийн масштаб тусдаа, ирмэгт 16px зай
    if (rr < 0.45) { Hh = 146; sx = 152 / xr; sy = 78 / yr; } else { W = 136; sx = 68 / xr; sy = 122 / yr; }
    vx0 -= 16 / sx; vx1 += 16 / sx; vy0 -= 16 / sy; vy1 += 16 / sy;
    g = Fig({ view: [vx0, vx1, vy0, vy1], free: true, w: W, h: Hh, pad: 18 });
  } else {
    vx0 -= m; vx1 += m; vy0 -= m; vy1 += m;
    sx = sy = Math.min(184 / (vx1 - vx0), 154 / (vy1 - vy0));
    g = Fig({ w: 220, h: 190, pad: 18, margin: m });
  }
  g.ext(O).poly([A, B, C], { fill: '#e6e6e6', op: 0.85, w: 0.01 }).axes({ o: false, ext: 8 })
    .poly([A, B, C], { w: 1.4 })
    .seg(E, Hp, { dash: '4 3', w: 1.1 }).seg(B, Hp, { dash: '4 3', w: 1.2 }).right(Hp, B, E, { s: 6 })
    .dot(A, { r: 2.2 }).dot(B, { r: 2.2 }).dot(C, { r: 2.2 });
  // Fig-ийн хувиргалтыг давтаж (px), шошго бүрийг шулуун/тэнхлэг/бусад шошготой давхцахгүй байрлалд тавина
  var X = function (p) { return [18 + (p[0] - vx0) * sx, 18 + (vy1 - p[1]) * sy]; }, sg = function (p, q) { return X(p).concat(X(q)); };
  var o = X(O), ax = X([vx1, 0])[0] + 8, ay = X([0, vy1])[1] - 8;   // тэнхлэгийн сумны үзүүр
  var segs = [sg(A, B), sg(B, C), sg(C, A), sg(E, Hp), sg(B, Hp), [X([vx0, 0])[0], o[1], ax, o[1]], [o[0], X([0, vy0])[1], o[0], ay]];
  var L = p2_lay(segs, []), bx = L.boxes;
  [L.box(ax - 2, o[1], 'x', 'se'), L.box(o[0], ay + 2, 'y', 'e', 13, 7)].forEach(function (t) { bx.push([t[0] - 3, t[1] - 3, t[2] + 3, t[3] + 3]); });   // тэнхлэгийн нэрээс хол
  bx.push([ax - 9, o[1] - 4.5, ax, o[1] + 4.5], [o[0] - 4.5, ay, o[0] + 4.5, ay + 9]);   // сумны толгой
  [A, B, C].forEach(function (p) { var q = X(p); bx.push([q[0] - 2.5, q[1] - 2.5, q[0] + 2.5, q[1] + 2.5]); });
  var q = X(Hp); bx.push([q[0] - 7, q[1] - 7, q[0] + 7, q[1] + 7]);
  var G = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
  var dir = function (p, o) { var u = X(p), v = X(o); return Math.atan2(v[1] - u[1], u[0] - v[0]) * 180 / Math.PI; };   // px-ийн чиглэл (y дээш)
  var Hm = oy ? [B[0], (B[1] + b) / 2] : [(B[0] + a) / 2, B[1]], hp = oy ? (B[0] > G[0] ? 0 : 180) : (B[1] > G[1] ? 90 : 270);
  [[B, 'B', dir(B, G)], [A, 'A', dir(A, G)], [C, 'C', dir(C, G)], [O, 'O', 0, ['sw', 'se', 'nw', 'ne', 's', 'w', 'n', 'e']], [Hm, 'h', hp]].forEach(function (t) {
    g.text(t[0], t[1], { pos: L.pick(X(t[0]), t[1], t[2], { cands: t[3] }), halo: true });   // O: заншлын 'sw', AB дайрвал өөр булан
  });
  return g.svg();
}
// Шошго байрлуулагч (px): Fig-ийн textAt-ийн байрлал ба үсгийн хэмжээг (getBBox-оор хэмжсэн) дуурайж,
// хэрчим ба өмнөх шошготой давхцахгүй (эсвэл хамгийн бага давхцах) байрлалыг сонгоно
function p2_lay(segs, boxes) {
  var POS = { e: 0, ne: 45, n: 90, nw: 135, w: 180, sw: 225, s: 270, se: 315 };
  var WD = { A: 9, B: 9, C: 10, O: 10, h: 8, x: 7, y: 8 };
  function box(x, y, txt, pos, size, off) {   // үсгийн бодит хүрээнээс ирмэг бүрт 1.5/2.5px хассан тэгш өнцөгт
    size = size || 13; off = off == null ? 6 : off;
    var w = (WD[txt] || 9) * size / 13, an = 'middle', dy = 0.35 * size;
    if (typeof pos === 'number') {
      var r = pos * Math.PI / 180, cx = Math.cos(r), cy = Math.sin(r);
      x += (off + size * 0.35) * cx; y -= (off + size * 0.35) * cy;
      an = cx > 0.35 ? 'start' : cx < -0.35 ? 'end' : 'middle';
      if (an !== 'middle') x -= cx * size * 0.3;
    } else {
      if (/n/.test(pos)) { y -= off + (pos === 'n' ? 0.1 * size : 0); dy = 0; }
      if (/s/.test(pos)) { y += off + (pos === 's' ? 0.1 * size : 0); dy = 0.72 * size; }
      if (/e/.test(pos)) { x += off * (pos === 'e' ? 1 : 0.6); an = 'start'; }
      if (/w/.test(pos)) { x -= off * (pos === 'w' ? 1 : 0.6); an = 'end'; }
    }
    var x0 = an === 'start' ? x : an === 'end' ? x - w : x - w / 2, yb = y + dy;
    return [x0 + 1.5, yb - 0.92 * size + 2.5, x0 + w - 1.5, yb + 0.23 * size - 2.5];
  }
  function hit(sg, b) {   // хэрчим ∩ тэгш өнцөгт (Liang–Barsky)
    var t0 = 0, t1 = 1, dx = sg[2] - sg[0], dy = sg[3] - sg[1], p = [-dx, dx, -dy, dy], q = [sg[0] - b[0], b[2] - sg[0], sg[1] - b[1], b[3] - sg[1]];
    for (var i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; }
      else { var r = q[i] / p[i]; if (p[i] < 0) { if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; } }
    }
    return true;
  }
  function cost(c) {
    var n = 0;
    segs.forEach(function (sg) { if (hit(sg, c)) n++; });
    boxes.forEach(function (o) { if (c[0] < o[2] && o[0] < c[2] && c[1] < o[3] && o[1] < c[3]) n += 2; });
    return n;
  }
  return {
    box: box, boxes: boxes,
    // P — px цэг; pref — илүүд үзэх чиглэл (градус): 8 чиглэлийг түүнээс зөрүүгээр эрэмбэлж, давхцалгүй эхнийхийг авна
    pick: function (P, txt, pref, o) {
      o = o || {};
      var cs = o.cands || Object.keys(POS).sort(function (u, v) { return p2_ad(POS[u], pref) - p2_ad(POS[v], pref); });
      var best = cs[0], bn = 1e9;
      for (var i = 0; i < cs.length && bn; i++) { var n = cost(box(P[0], P[1], txt, cs[i], o.size, o.off)); if (n < bn) { bn = n; best = cs[i]; } }
      boxes.push(box(P[0], P[1], txt, best, o.size, o.off));
      return best;
    }
  };
}
function p2_ad(u, v) { var d = Math.abs(((u - v) % 360 + 360) % 360); return d > 180 ? 360 - d : d; }

// 3. Хоёр багийн 5 + 5 тоглогчийн онооны Σx, Σx², Σy, Σy² → нийт 10 тоглогчийн стандарт хазайлт.
//    σ² = Q/10 − (S/10)², S = Σx + Σy, Q = Σx² + Σy². Жинхэнэ оноонуудыг (0..12) үүсгэж,
//    10Q − S² = k² (бүтэн квадрат) байхаар шүүнэ → σ = k/10 (яг аравтын бутархай).
function p3() {
  for (var it = 0; it < 3000; it++) {
    var X = [], Y = [], i, sx = 0, sx2 = 0, sy = 0, sy2 = 0;
    for (i = 0; i < 5; i++) { X.push(rnd(0, 12)); Y.push(rnd(0, 12)); }
    for (i = 0; i < 5; i++) { sx += X[i]; sx2 += X[i] * X[i]; sy += Y[i]; sy2 += Y[i] * Y[i]; }
    var S = sx + sy, Q = sx2 + sy2, D = 10 * Q - S * S, k = Math.round(Math.sqrt(D));
    if (k * k !== D || k < 12 || k > 48) continue;
    if (sx === sy && sx2 === sy2) continue;
    // Бодолт (гар бичмэл): D = E(X²) − (E(X))², σ = √D; E(X) = (Σx + Σy)/10, E(X²) = (Σx² + Σy²)/10.
    var EX = dec(S / 10), EX2 = dec(Q / 10), Dv = dec(k * k / 100);
    return {
      q: 'Сагсан бөмбөгийн нэг багийн 5 тоглогчийн эхний үед авсан онооны нийлбэр $\\sum x=' + sx + '$, квадратуудын нийлбэр $\\sum x^2=' + sx2
        + '$ байв. Нөгөө багийн 5 тоглогчийн онооны нийлбэр $\\sum y=' + sy + '$, квадратуудын нийлбэр $\\sum y^2=' + sy2
        + '$ байв. Энэ 10 тоглогчийн эхний үед авсан онооны стандарт хазайлтыг олоорой.',
      a: '$\\sigma=' + dec(k / 10) + '$',
      wk: 30,
      s: [
        '$x_1,\\ x_2,\\ \\ldots,\\ x_n$ өгөгдлийн дундаж $E(X)=\\overline{x}=\\dfrac{x_1+x_2+\\ldots+x_n}{n}$, дисперс $$D=\\dfrac{(x_1-\\overline{x})^2+\\ldots+(x_n-\\overline{x})^2}{n}=\\dfrac{x_1^2+\\ldots+x_n^2}{n}-\\left(\\dfrac{x_1+\\ldots+x_n}{n}\\right)^2,$$'
          + ' өөрөөр хэлбэл $D=E(X^2)-\\big(E(X)\\big)^2$, стандарт хазайлт $\\sigma=\\sqrt{D}$.',
        'Нийт 10 тоглогчийн хувьд $$\\begin{aligned}E(X)&=\\dfrac{\\sum x+\\sum y}{10}=\\dfrac{' + sx + '+' + sy + '}{10}=' + EX + ',\\\\'
          + 'E(X^2)&=\\dfrac{\\sum x^2+\\sum y^2}{10}=\\dfrac{' + sx2 + '+' + sy2 + '}{10}=' + EX2 + '.\\end{aligned}$$',
        '$$D=E(X^2)-\\big(E(X)\\big)^2=' + EX2 + '-' + EX + '^2=' + Dv + '.$$',
        'Иймд $\\sigma=\\sqrt{D}=\\sqrt{' + Dv + '}=' + dec(k / 10) + '$.'
      ],
      t: { X: X, Y: Y }
    };
  }
  return null;
}

// 4. Хоёр параболоор хүрээлэгдсэн дүрсийн талбай (тор дээрх графикаас тэгшитгэлийг уншина).
//    f1 = −(x−h1)² + k1, f2 = (x−h2)² + k2; f1 − f2 = −2(x−x1)(x−x2) → S = (x2 − x1)³ / 3.
function p4() {
  var x1 = rnd(-3, 1), L = rnd(2, 4), x2 = x1 + L;
  if (x2 > 3) return null;
  var h1 = rnd(-3, 2), k1 = rnd(1, 6);
  var f1 = function (x) { return -(x - h1) * (x - h1) + k1; };

// 10. Таван тооноос рационал (эсвэл иррационал) тоонуудыг ялгах. 2–3 рационал (үетэй/төгсгөлөг аравтын бутархай,
//     бүтэн квадратын язгуур, бүтэн кубын язгуур, энгийн бутархай, бүхэл) + үлдсэн нь иррационал (π, бүтэн биш язгуур, …).

function p10_irr(kind) {

// Бодолтын тайлбар: тоо + яагаад рационал/иррационал болох (хаалтад)
function p10_why(o) {

// 11. m1·10^e1 · m2·10^e2 үржвэрийг стандарт хэлбэрт: c·10^k (1 ≤ c < 10, c нь 1–2 цифртэй).
//     Тоонуудыг энгийнээр бичнэ (350, 2000, 0.004, 25\,000 — 5+ оронтой бүхэлд \, бүлэглэлт).
var p11_S = [2, 3, 4, 5, 6, 7, 8, 9, 12, 14, 15, 16, 18, 24, 25, 32, 35, 45, 48, 75, 125];
function p11_num(s, e) {   // s·10^e-ийн аравтын бичлэг (s нь 10-т хуваагдахгүй)

function p11() {

  if (m >= 100 || m === 1) return null;
  if (s1 < 10 && s2 < 10 && z === 0) return null;   // хэт энгийн (2·3 г.м)
  var st = pick(['ii', 'ii', 'ii', 'id', 'dd']);
  if (st === 'ii') { e1 = rnd(0, 3); e2 = rnd(1, 4); }
  else if (st === 'id') { e1 = rnd(1, 4); e2 = -rnd(1, 3); }

  var n1 = p11_num(s1, e1), n2 = p11_num(s2, e2);
  if (n1.replace(/\D/g, '').length > 7 || n2.replace(/\D/g, '').length > 7) return null;
  if (/^\d$/.test(n1) || /^\d$/.test(n2)) return null;   // нэг оронтой бүхэл үржигдэхүүн хэт энгийн

  if (Math.abs(k) < 2) return null;

  var F = n1 === p11_num(s1, e1) ? [[s1, e1, n1], [s2, e2, n2]] : [[s2, e2, n1], [s1, e1, n2]], P = s1 * s2, E = e1 + e2;

    s: [

// 12. ax + b ⋚ c (a ≠ 0)  →  x ⋚ (c − b)/a; a < 0 бол тэнцэтгэл бишийн тэмдэг эсрэгээр эргэнэ.

function p12() {

// 13. Хэрчмийн дундаж цэг: ((x₁ + x₂)/2, (y₁ + y₂)/2, (z₁ + z₂)/2); координат бүрийн хос ижил тэгш/сондгой → бүхэл.

// 14. √x(x + s₁a) − x(√x + s₂b) = x√x + s₁a√x − x√x − s₂bx = −s₂b·x + s₁a·√x.
function p14() {

// 15. (1/p)^(−n) ∓ (q^m)^(1/m) = p^n ∓ q  (q^m-ийг тоогоор: 25, 27, 64, …).
function p15() {
  var p = rnd(2, 5), n = pick([2, 2, 3]), P = Math.pow(p, n);

  return {

    a: '$' + ans + '$',

    s: [
      'Зэргийн тодорхойлолтоор $\\left(\\frac{1}{a}\\right)^{-n}=a^n$, $a^{\\frac{1}{m}}=\\sqrt[m]{a}$ тул '
        + '$$\\left(\\dfrac{1}{' + p + '}\\right)^{-' + n + '}' + op + Q + '^{\\frac{1}{' + m + '}}=' + p + '^' + n + op + root + '=' + P + op + q + '=' + ans + '.$$'

// 16. f(x) = dx³ + ax² + bx + c  →  f'(x) = 3dx² + 2ax + b  (ихэвчлэн квадрат, заримдаа куб).

// 18. Зэрэгтэй үйлдэл: ((b^{1/m})^k · (b²)^{u/v}) : (b^c)^{1/d}  (эх: ((2^{1/6})^3·4^{3/4}):64^{1/3} = 1).

  var inner = p < 0 ? q + tm(p, 'x') : poly([p, q]);
  // Бодолт (гар бичмэл): ∫dt/√t = ∫t^(−1/2)dt = 2√t + C; орлуулга t = px + q, dx = dt/p
  var dtx = p === 1 ? 'dt=dx' : p === -1 ? 'dt=-dx' : 'dt=' + p + '\\,dx';
  var dxt = p === 1 ? 'dx=dt' : p === -1 ? 'dx=-dt' : 'dx=' + (p < 0 ? '-' : '') + '\\dfrac{dt}{' + Math.abs(p) + '}';
  var mid = Math.abs(k) === Math.abs(p) ? '' : tm([k, p], '\\cdot 2\\sqrt{t}', true) + '+C=';
  return {
    q: '$\\displaystyle\\int\\dfrac{' + k + '}{\\sqrt{' + inner + '}}\\,dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm([2 * k, p], '\\sqrt{' + inner + '}', true) + '+C$', wk: 22,
    s: [
      'Зэрэгт функцийн интегралаар $$\\int\\dfrac{dt}{\\sqrt{t}}=\\int t^{-\\frac{1}{2}}\\,dt=\\dfrac{t^{\\frac{1}{2}}}{\\frac{1}{2}}+C=2\\sqrt{t}+C.$$',
      '$t=' + inner + '$ гэж орлуулъя: ' + (p === 1 ? '$dt=dx$.' : '$' + dtx + '$, эндээс $' + dxt + '$.'),
      'Иймд $$\\int\\dfrac{' + k + '}{\\sqrt{' + inner + '}}\\,dx=' + tm([k, p], '\\int\\dfrac{dt}{\\sqrt{t}}', true) + '=' + mid + tm([2 * k, p], '\\sqrt{t}', true) + '+C='
        + tm([2 * k, p], '\\sqrt{' + inner + '}', true) + '+C.$$'
    ],
    t: { p: p, q: q, k: k, inner: inner }
  };
}

// 25. a, b суурьтай тойрог багтаасан адил хажуут трапец: хажуу тал (a+b)/2, h = √(ab), r = √(ab)/2
//     (эх: 9 ба 25 → r = 7.5). ab — бүтэн квадрат байх хосууд (a < b ≤ 64, b/a ≤ 16; 50 хос).
var p25_P = (function () {
  var o = [];
  for (var a = 2; a <= 64; a++) for (var b = a + 1; b <= Math.min(64, 16 * a); b++) { var h = Math.round(Math.sqrt(a * b)); if (h * h === a * b) o.push([a, b]); }
  return o;
})();
function p25() {
  var pr = pick(p25_P), a = pr[0], b = pr[1], h = Math.round(Math.sqrt(a * b));
  // Бодолт (гар бичмэлийн II арга): BC = a, AD = b; шүргэгч хэрчмүүд a/2, b/2 → AB = (a+b)/2, AH = (b−a)/2,
  //   BH = √(AB² − AH²) = h = 2r.  Зураг: A(0;0), D(b;0), B((b−a)/2;h), C((b+a)/2;h), H — B-гийн проекц.
  var AB = (a + b) / 2, AH = (b - a) / 2, A = [0, 0], D = [b, 0], B = [AH, h], C = [AH + a, h], H = [AH, 0], I = [b / 2, h / 2];
  // радиусыг CD хажуу талын шүргэлтийн цэг рүү (BH-тай давхцахгүй): n = (h; AH)/AB — CD-д перпендикуляр нэгж вектор
  var nx = h / AB, ny = AH / AB, T = [I[0] + nx * h / 2, I[1] + ny * h / 2], th = Math.atan2(ny, nx) * 180 / Math.PI;
  var g = Fig({ w: 200, h: 150 });
  g.poly([A, D, C, B]).circle(I, h / 2).seg(B, H, { dash: '4 3' }).right(H, B, D, { s: 6 })
    .dot(I, { r: 2 }).seg(I, T, { w: 1.1 }).text([(I[0] + T[0]) / 2, (I[1] + T[1]) / 2], 'r', { pos: th - 90, size: 12, off: 2 })
    .text(A, 'A', { pos: 'sw' }).text(B, 'B', { pos: 'nw' }).text(C, 'C', { pos: 'ne' }).text(D, 'D', { pos: 'se' }).text(H, 'H', { pos: 'se' })
    .text([AH / 2, h / 2], dec(AB), { pos: 'nw', size: 12 });
  // AH богино (AH < 0.16·AD: 25–36, 36–49, 49–64) бол A, H үсгүүдтэй шахагдана — тоог зөвхөн текстэд үлдээнэ
  if (AH >= 0.16 * b) g.text([AH / 2, 0], dec(AH), { pos: 's', size: 12 });
  return {
    q: a + ' ба ' + b + ' суурьтай тойрог багтаадаг адил хажуут трапецад багтсан тойргийн радиусыг ол.',
    a: '$r=' + dec(h / 2) + '$', wk: 28,
    s: [
      'Трапецийг $ABCD$ ($BC=' + a + '$, $AD=' + b + '$) гэе. Нэг цэгээс татсан шүргэгч хэрчмүүд тэнцүү бөгөөд трапец адил хажуут тул '
        + '$B$, $C$ оройгоос татсан шүргэгч хэрчим бүр $' + a + ':2=' + dec(a / 2) + '$, $A$, $D$ оройгоос татсан нь $' + b + ':2=' + dec(b / 2) + '$. '
        + 'Иймд $$AB=CD=' + dec(a / 2) + '+' + dec(b / 2) + '=' + dec(AB) + '.$$',
      '$B$ оройгоос $BH$ өндөр буулгавал $$AH=\\dfrac{AD-BC}{2}=\\dfrac{' + b + '-' + a + '}{2}=' + dec(AH) + '.$$',
      // квадратуудын ялгавар: (AB − AH)(AB + AH) = BC·AD — гараар бодоход хялбар
      '$ABH$ тэгш өнцөгт гурвалжинд Пифагорын теоремоор $$\\begin{aligned}BH&=\\sqrt{AB^2-AH^2}=\\sqrt{' + dec(AB) + '^2-' + dec(AH) + '^2}\\\\'
        + '&=\\sqrt{(' + dec(AB) + '-' + dec(AH) + ')(' + dec(AB) + '+' + dec(AH) + ')}=\\sqrt{' + a + '\\cdot ' + b + '}=' + h + '.\\end{aligned}$$',
      'Багтсан тойргийн диаметр трапецийн өндөртэй тэнцүү: $2r=BH=' + h + '$. Иймд $r=' + dec(h / 2) + '$.'
    ],
    sfig: g.svg(),
    t: { a: a, b: b }
  };
}
