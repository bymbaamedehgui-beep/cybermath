<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Үзэгдлийн магадлал-1 (6-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:14mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>

</div>
<div class="sheet" id="sheet"></div>
<script>
// ══════════ g6core.js — 6-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ g6ch4.js — IV БҮЛЭГ. МАГАДЛАЛ (6-р анги) ══════════
// Сурах бичгийн 61–69 хуудасны ДАСГАЛУУДЫН хэлбэрээр зохиогдсон.
// ЗАРЧИМ: тооцооллын бодлогод q нь ЗӨВХӨН илэрхийлэл. Заавар нь plan.json дахь task.label-д ганц удаа бичигдэнэ.
// g6core.js доторх helper-үүд (rnd,nz,pick,shuffle,gcd,lcm,Fr,fTex,fMix,powClean,decStr,numline ...) энэ файлын ӨМНӨ залгагдана.

// ═══════════ НИЙТЛЭГ ТУСЛАХУУД ═══════════
var NW6 = {1:'нэг',2:'хоёр',3:'гурван',4:'дөрвөн',5:'таван',6:'зургаан',7:'долоон',8:'найман',9:'есөн',10:'арван'};
function C2(n){return n*(n-1)/2;}
function jd(ar){return ar.join(',\\ ');}                    // $-ийн дотор тоонуудыг таслалаар
function mulTex(ar){return ar.join('\\cdot ');}             // 4\cdot 3\cdot 2
function prodOf(ar){var p=1;for(var i=0;i<ar.length;i++)p*=ar[i];return p;}
function fallDown(d,n){var ar=[],i;for(i=0;i<n;i++)ar.push(d-i);return ar;}   // d,(d-1),(d-2)...
function isPrime6(n){if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function dSuf6(k){var d=k%10;return (d===2||d===3||d===4)?'-т':'-д';}
function digSum(n){var s=0;n=Math.abs(n);while(n){s+=n%10;n=Math.floor(n/10);}return s;}

// ═══════════ ЗУРГИЙН ТУСЛАХУУД (цэвэрхэн, хариу илчлэхгүй) ═══════════
function figTable(rows){
 var h='<table style="border-collapse:collapse;margin:3px auto;font-size:12.5px;line-height:1.15">';
 for(var i=0;i<rows.length;i++){h+='<tr>';
  for(var j=0;j<rows[i].length;j++){var hd=(i===0||j===0);
   h+='<td style="border:1px solid #7B52EE;padding:2px 8px;text-align:center;min-width:30px;height:19px;'
     +(hd?'background:#f3f0ff;color:#4c2fb5;font-weight:600;':'color:#221;')+'">'+rows[i][j]+'</td>';}
  h+='</tr>';}
 return h+'</table>';}
// m мөр × n багана хоосон нүдтэй тор
function figGridCells(m,n){
 var cw=26,ch=22,g='',i,j;
 for(i=0;i<m;i++)for(j=0;j<n;j++)
  g+='<rect x="'+(4+j*cw)+'" y="'+(4+i*ch)+'" width="'+cw+'" height="'+ch+'" fill="#f7f5ff" stroke="#7B52EE" stroke-width="1.2"/>';
 var W=8+n*cw,H=8+m*ch;
 return '<svg viewBox="0 0 '+W+' '+H+'" width="'+Math.min(W*1.6,220)+'">'+g+'</svg>';}
// n тэнцүү хэсэгт хуваагдсан ээрүүл (1..n тоогоор дугаарлагдсан)
function figSpinner(n){
 var cx=56,cy=56,R=46,g='',i;
 g+='<circle cx="56" cy="56" r="46" fill="#f7fbff" stroke="#2563eb" stroke-width="1.4"/>';
 for(i=0;i<n;i++){
  var a=(-90+i*360/n)*Math.PI/180;
  g+='<line x1="56" y1="56" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a)).toFixed(1)+'" stroke="#2563eb" stroke-width="1"/>';
  var am=(-90+(i+0.5)*360/n)*Math.PI/180;
  g+='<text x="'+(cx+0.72*R*Math.cos(am)).toFixed(1)+'" y="'+(cy+0.72*R*Math.sin(am)+4).toFixed(1)
    +'" font-size="10.5" text-anchor="middle" fill="#123">'+(i+1)+'</text>';}
 g+='<line x1="56" y1="56" x2="86" y2="36" stroke="#dc2626" stroke-width="1.7"/>';
 g+='<circle cx="56" cy="56" r="3.2" fill="#dc2626"/>';
 return '<svg viewBox="0 0 112 112" width="122">'+g+'</svg>';}
// өнгөт картуудын эгнээ: items = [{ch:'М',hex:'#dc2626'}, ...]
function figCards(items){
 var cw=28,ch=32,g='',i;
 for(i=0;i<items.length;i++){
  g+='<rect x="'+(3+i*cw)+'" y="3" width="'+(cw-4)+'" height="'+ch+'" rx="4" fill="'+items[i].hex+'" stroke="#334" stroke-width="1"/>';
  g+='<text x="'+(3+i*cw+(cw-4)/2)+'" y="'+(3+ch/2+6)+'" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">'+items[i].ch+'</text>';}
 var W=6+items.length*cw;
 return '<svg viewBox="0 0 '+W+' '+(ch+6)+'" width="'+Math.min(W,300)+'">'+g+'</svg>';}
// оройноос суурь руу k хэрчим татсан гурвалжин
function figTriFan(k){
 var ax=100,ay=8,bx=14,by=86,cx=186,g='',i;
 g+='<polygon points="'+ax+','+ay+' '+bx+','+by+' '+cx+','+by+'" fill="#f7f5ff" stroke="#7B52EE" stroke-width="1.5"/>';
 for(i=1;i<=k;i++){var x=bx+(cx-bx)*i/(k+1);
  g+='<line x1="'+ax+'" y1="'+ay+'" x2="'+x.toFixed(1)+'" y2="'+by+'" stroke="#7B52EE" stroke-width="1"/>';}
 return '<svg viewBox="0 0 200 94" width="192">'+g+'</svg>';}
// 1×n хөлөг, зүүн захад даам
function figBoardRow(n){
 var cw=30,ch=26,g='',i;
 for(i=0;i<n;i++)
  g+='<rect x="'+(3+i*cw)+'" y="12" width="'+cw+'" height="'+ch+'" fill="#f7fbff" stroke="#2563eb" stroke-width="1.2"/>';
 g+='<ellipse cx="'+(3+cw/2)+'" cy="25" rx="10" ry="6" fill="#7B52EE" stroke="#4c2fb5" stroke-width="1"/>';
 g+='<text x="'+(3+cw/2)+'" y="9" font-size="10" text-anchor="middle" fill="#555">A</text>';
 g+='<text x="'+(3+(n-1)*cw+cw/2)+'" y="9" font-size="10" text-anchor="middle" fill="#555">B</text>';
 var W=6+n*cw;
 return '<svg viewBox="0 0 '+W+' 44" width="'+Math.min(W,320)+'">'+g+'</svg>';}
// үгийн гурвалжин байрлал: мөр i-д (i+1) ширхэг word[i]
function figWordTri(w){
 var L=w.length,rh=20,cw=22,W=cw*L+20,H=rh*L+12,g='',i,j;
 for(i=0;i<L;i++)for(j=0;j<=i;j++){
  var x=W/2+(j-i/2)*cw, y=14+i*rh;
  g+='<text x="'+x.toFixed(1)+'" y="'+y+'" font-size="14" font-weight="600" text-anchor="middle" fill="#4c2fb5">'+w.charAt(i)+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="'+Math.min(W*1.3,200)+'">'+g+'</svg>';}
// 0–1 хоорондох магадлалын шулуун (тэмдэглэгээгүй)
function figUnitLine(){
 var W=300,g='<line x1="20" y1="26" x2="280" y2="26" stroke="#555" stroke-width="1.4"/>';
 var pos=[20,150,280],lab=['0','','1'];
 for(var i=0;i<3;i++){g+='<line x1="'+pos[i]+'" y1="20" x2="'+pos[i]+'" y2="32" stroke="#555" stroke-width="1.2"/>';
  if(lab[i])g+='<text x="'+pos[i]+'" y="44" font-size="11" text-anchor="middle" fill="#555">'+lab[i]+'</text>';}
 g+='<text x="150" y="46" font-size="11" text-anchor="middle" fill="#555">1/2</text>';
 return '<svg viewBox="0 0 '+W+' 52" width="286">'+g+'</svg>';}
// цаг тооны бичиг: N хоног, эхний өдрийн гараг st (0=Даваа)
function figCalendar(N,st){
 var head=['Да','Мя','Лх','Пү','Ба','Бя','Ня'],rows=[head.slice()],cur=[],i;
 for(i=0;i<st;i++)cur.push('');
 for(i=1;i<=N;i++){cur.push(''+i);if(cur.length===7){rows.push(cur);cur=[];}}
 if(cur.length){while(cur.length<7)cur.push('');rows.push(cur);}
 var h='<table style="border-collapse:collapse;margin:3px auto;font-size:11.5px;line-height:1.1">';
 for(var r=0;r<rows.length;r++){h+='<tr>';
  for(var c=0;c<7;c++){var hd=(r===0);
   h+='<td style="border:1px solid #7B52EE;padding:1px 5px;text-align:center;min-width:20px;height:17px;'
     +(hd?'background:#f3f0ff;color:#4c2fb5;font-weight:600;':'color:#221;')+'">'+rows[r][c]+'</td>';}
  h+='</tr>';}
 return h+'</table>';}

 for(i=0;i<ds.length;i++)for(j=0;j<ds.length;j++)for(k=0;k<ds.length;k++){
  if(i===j||i===k||j===k)continue;out.push(ds[i]*100+ds[j]*10+ds[k]);}
 return out;}
function g_digitsCond(){
 var di,ds,all,c,e,f,i,x,h,u,t=0;
 do{
  do{di=rnd(0,DSETS.length-1);ds=DSETS[di];}while(ds.length<4);
  all=perms3(ds);c=rnd(0,4);e=pick(ds);f=0;
  for(i=0;i<all.length;i++){x=all[i];h=Math.floor(x/100);u=x%10;
   if(c===0&&h%2===1)f++;
   else if(c===1&&u===e)f++;
   else if(c===2&&u!==e)f++;
   else if(c===3&&h%2===0)f++;
   else if(c===4&&u%2===0)f++;}
  t++;
 }while((f===0||f===all.length)&&t<60);
 var cond=['сондгой цифрээр эхэлсэн байх','$'+e+'$ цифрээр төгссөн байх','$'+e+'$ цифрээр төгсөөгүй байх',

 return {q:'$'+jd(ds)+'$ цифрүүдээр бүх цифр нь ялгаатай гурван оронтой тоо зохиов. Эдгээрийн хэд нь '+cond+' вэ?',

}

// P = c/n хэлбэрийн хариу (хураагдсан бол хоёуланг нь харуулна)
function probAns(c,n){
 var raw='\\dfrac{'+c+'}{'+n+'}', red=fTex(Fr(c,n));
 return raw===red?('$P='+raw+'$'):('$P='+raw+'='+red+'$');
}
function termDen(d){while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1;}
// магадлалыг аравтын бутархай ба процентоор
function decPctTex(c,n){
 var f=Fr(c,n), v=c/n;
 if(termDen(f.d))return '$'+decStr(v,6)+'$ буюу $'+decStr(v*100,4)+'\\%$';
 return '$\\approx '+v.toFixed(3)+'$ буюу $\\approx '+(v*100).toFixed(1)+'\\%$';
}
function combN(n,k){if(k<0||k>n)return 0;var r=1,i;for(i=0;i<k;i++)r=r*(n-i)/(i+1);return Math.round(r);}
function countRange(lo,hi,f){var c=0,x;for(x=lo;x<=hi;x++)if(f(x))c++;return c;}
var VOW6='АЭИОӨУҮЫЕЁЮЯ';
function isVow6(ch){return VOW6.indexOf(ch)>=0;}
function cap1(t){return t.charAt(0).toUpperCase()+t.slice(1);}
function digArr(n){var a=[];while(n>0){a.unshift(n%10);n=Math.floor(n/10);}return a;}

var WORDS4=['НАРС','СУВД','ХУРД','ЦОНХ','БУЛГА','МОРИН','ТУЛГА'];
function permsOf(s){
 var out=[],used=[],i;
 for(i=0;i<s.length;i++)used.push(false);
 function go(cur){
  if(cur.length===s.length){out.push(cur);return;}
  for(var j=0;j<s.length;j++)if(!used[j]){used[j]=true;go(cur+s.charAt(j));used[j]=false;}
 }
 go('');
 return out;
}

}

function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);var solo=blocks[g].getAttribute('data-solo')==='1';if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(solo&&qs2.length===1){if(ql)ql.textContent='';map[qs2[i].getAttribute('data-k')]=gr+')';}else{if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk, solo:t.solo};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.solo?' data-solo="1"':'')+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p||t.solo){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.solo?null:t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
