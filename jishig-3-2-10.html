<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>III бүлэг — Жишиг даалгавар 2 (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.packed{display:flex;gap:18px;align-items:flex-start}
  .grid.packed .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:15px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.sm{height:13mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){var t=a%b;a=b;b=t;}return a;}
function frac(p,q){if(q<0){p=-p;q=-q;}var g=gcd(Math.abs(p),q)||1;return {p:p/g,q:q/g};}
function subf(a,b){return frac(a.p*b.q-b.p*a.q,a.q*b.q);}
function fv(f){return f.p/f.q;}
function vp(v,f){if(f.p===0)return '1';var neg=f.p<0,p=Math.abs(f.p),q=f.q,body;
  if(q===1){body=(p===1)?v:(v+'^{'+p+'}');}
  else{var whole=Math.floor(p/q),rem=p-whole*q,inside=(rem===1)?v:(v+'^{'+rem+'}'),radp=(q===2)?('\\sqrt{'+inside+'}'):('\\sqrt['+q+']{'+inside+'}');body=(whole===0)?radp:((whole===1)?(v+radp):(v+'^{'+whole+'}'+radp));}
  return neg?('\\dfrac{1}{'+body+'}'):body;}
function dbl(f){return frac(2*f.p,f.q);}
function expH(){return frac(1,pick([2,2,3]));}
function pairv(){return pick([['x','y'],['a','b'],['u','v'],['m','n'],['p','q'],['s','t']]);}
var ORD='abcdmnpqrstuvwxyz';
function kv(v,f){var o={};o[v]=f;return o;}
function vkeys(vs){return Object.keys(vs).sort(function(a,b){return ORD.indexOf(a)-ORD.indexOf(b);});}
function varsTex(vs){var s='';vkeys(vs).forEach(function(k){var e=vs[k];if(e.p!==0)s+=vp(k,e);});return s;}
function mTex(m){var vs=varsTex(m.vars),ac=Math.abs(m.c);if(vs==='')return ''+ac;return (ac===1?'':''+ac)+vs;}
function mpolyTex(ts){var out='';ts.forEach(function(t,i){var tx=mTex(t);if(i===0)out+=(t.c<0?'-':'')+tx;else out+=(t.c<0?' - ':' + ')+tx;});return out||'0';}
function monEval(m,vals){var r=m.c;for(var k in m.vars)r*=Math.pow(vals[k],fv(m.vars[k]));return r;}
function mpolyEval(ts,vals){return ts.reduce(function(s,t){return s+monEval(t,vals);},0);}
function chkEq(vars,fa,fb){for(var i=0;i<4;i++){var vals={};vars.forEach(function(k){vals[k]=1.3+Math.random()*3;});var a=fa(vals);if(!isFinite(a)||Math.abs(a-fb(vals))>1e-6*Math.max(1,Math.abs(a)))return false;}return true;}
// ── полином (коэфф) ──
function pe(c,x){var r=0;for(var i=c.length-1;i>=0;i--)r=r*x+c[i];return r;}
function padd(a,b){var n=Math.max(a.length,b.length),r=[];for(var i=0;i<n;i++)r[i]=(a[i]||0)+(b[i]||0);return r;}
function psc(a,k){return a.map(function(c){return c*k;});}
function pmul(a,b){var r=[];for(var i=0;i<a.length;i++)for(var j=0;j<b.length;j++)r[i+j]=(r[i+j]||0)+a[i]*b[j];for(var k=0;k<r.length;k++)r[k]=r[k]||0;return r;}
function ptrim(a){a=a.slice();while(a.length>1&&Math.abs(a[a.length-1])<1e-7)a.pop();return a;}
function pdeg(a){return ptrim(a).length-1;}
function pdivroot(a,r){var A=a.slice().reverse(),out=[A[0]];for(var i=1;i<A.length;i++)out.push(A[i]+out[i-1]*r);out.pop();return out.reverse();}
function introots(a){a=ptrim(a);var rs=[],ch=true;while(ch&&pdeg(a)>=1){ch=false;for(var r=-15;r<=15;r++){if(pdeg(a)<1)break;if(Math.abs(pe(a,r))<1e-6){a=ptrim(pdivroot(a,r));rs.push(r);ch=true;break;}}}return {roots:rs,rest:a};}
function content(a){var g=0;a.forEach(function(c){g=gcd(g,c);});return g||1;}
function reduceFrac(num,den){var fn=introots(num),fd=introots(den),nr=fn.roots.slice(),dr=fd.roots.slice();for(var i=nr.length-1;i>=0;i--){var idx=dr.indexOf(nr[i]);if(idx>=0){dr.splice(idx,1);nr.splice(i,1);}}var np=fn.rest.slice(),dp=fd.rest.slice();nr.forEach(function(r){np=pmul(np,[-r,1]);});dr.forEach(function(r){dp=pmul(dp,[-r,1]);});var g=gcd(content(np),content(dp));if(g>1){np=psc(np,1/g);dp=psc(dp,1/g);}var dl=ptrim(dp);if(dl[dl.length-1]<0){np=psc(np,-1);dp=psc(dp,-1);}return {num:ptrim(np),den:ptrim(dp)};}
function cTex(c,v){c=ptrim(c);var out='',first=true;for(var i=c.length-1;i>=0;i--){var co=Math.round(c[i]);if(co===0)continue;var vpp=(i===0)?'':(i===1?v:v+'^{'+i+'}');var mag=Math.abs(co),t=(mag===1&&i>0)?vpp:(''+mag+vpp);if(first){out+=(co<0?'-':'')+t;first=false;}else out+=(co<0?' - ':' + ')+t;}return first?'0':out;}
function cfracTex(fr,v){var nt=cTex(fr.num,v);if(nt==='0')return '0';var dt=cTex(fr.den,v);return (dt==='1')?nt:('\\dfrac{'+nt+'}{'+dt+'}');}
function mulFrac2(f1,f2){return reduceFrac(pmul(f1.num,f2.num),pmul(f1.den,f2.den));}
function divFrac2(f1,f2){return reduceFrac(pmul(f1.num,f2.den),pmul(f1.den,f2.num));}
function chkFr(v,evalLHS,ans){for(var i=0;i<5;i++){var x=1.7+Math.random()*4,a=evalLHS(x),b=pe(ans.num,x)/pe(ans.den,x);if(!isFinite(a)||!isFinite(b)||Math.abs(a-b)>1e-6*Math.max(1,Math.abs(a)))return false;}return true;}
function linTex(v,r){if(r===0)return v;return v+(r<0?' + '+(-r):' - '+r);}
function quadTex(v,p,q){var B=-(p+q),C=p*q,s=v+'^{2}';if(B!==0)s+=(B<0?' - ':' + ')+(Math.abs(B)===1?'':Math.abs(B))+v;if(C!==0)s+=(C<0?' - ':' + ')+Math.abs(C);return s;}
function distinctRoots(n,lo,hi){var rs=[],tr=0;while(rs.length<n&&tr++<400){var r=nz(lo,hi);if(rs.indexOf(r)<0)rs.push(r);}return rs.length<n?null:rs;}

// 3.1 — Хаалт задлаад ижил гишүүд нэгтгэх (хураагдана)
function g31h(){
  var mode=pick(['cross','fiveM','inv']);
  if(mode==='cross'){var pr=pairv(),u=pr[0],w=pr[1],p=expH(),q=expH(),k=nz(2,5);
    var qtx='\\left('+vp(u,p)+' - '+(k===1?'':k)+vp(w,q)+'\\right)^{2} + '+(2*k)+vp(u,p)+vp(w,q),atx=vp(u,dbl(p))+' + '+(k*k)+vp(w,dbl(q));
    for(var t=0;t<4;t++){var a=1.3+Math.random()*3,b=1.3+Math.random()*3,lhs=Math.pow(Math.pow(a,fv(p))-k*Math.pow(b,fv(q)),2)+2*k*Math.pow(a,fv(p))*Math.pow(b,fv(q)),rhs=Math.pow(a,fv(dbl(p)))+k*k*Math.pow(b,fv(dbl(q)));if(Math.abs(lhs-rhs)>1e-6*Math.max(1,Math.abs(lhs)))return null;}
    return {q:qtx,a:atx,ok:true};}
  if(mode==='fiveM'){var v=pick(['x','y','a','z','t','m']),pp=expH(),C=nz(2,7);
    var q2=(2*C)+vp(v,pp)+' + \\left('+C+' - '+vp(v,pp)+'\\right)^{2} - '+vp(v,dbl(pp)),a2=''+(C*C);
    for(var t2=0;t2<4;t2++){var x=1.3+Math.random()*3;if(Math.abs(2*C*Math.pow(x,fv(pp))+Math.pow(C-Math.pow(x,fv(pp)),2)-Math.pow(x,fv(dbl(pp)))-C*C)>1e-6*Math.max(1,C*C))return null;}
    return {q:q2,a:a2,ok:true};}
  var v3=pick(['x','y','a','b','m','t']),p3=expH();
  var q3='\\left('+vp(v3,p3)+' + \\dfrac{1}{'+vp(v3,p3)+'}\\right)^{2} - 2',a3=vp(v3,dbl(p3))+' + \\dfrac{1}{'+vp(v3,dbl(p3))+'}';
  for(var t3=0;t3<4;t3++){var x3=1.3+Math.random()*3,tt=Math.pow(x3,fv(p3)),ttt=Math.pow(x3,fv(dbl(p3)));if(Math.abs((Math.pow(tt+1/tt,2)-2)-(ttt+1/ttt))>1e-6*Math.max(1,1))return null;}
  return {q:q3,a:a3,ok:true};
}
// 3.2 — Ялгаврын квадрат
function g32h(){
  var mode=pick(['varConst','ab','ab']),half=frac(1,2);
  if(mode==='varConst'){var v=pick(['x','y','a','b','c','s','t']),n=pick([2,2,3,4]),k=nz(2,7);
    var expr=[{c:1,vars:kv(v,frac(2,n))},{c:-k*k,vars:{}}],f1=[{c:1,vars:kv(v,frac(1,n))},{c:-k,vars:{}}],f2=[{c:1,vars:kv(v,frac(1,n))},{c:k,vars:{}}];
    if(!chkEq([v],function(vl){return mpolyEval(expr,vl);},function(vl){return mpolyEval(f1,vl)*mpolyEval(f2,vl);}))return null;
    return {q:mpolyTex(expr),a:'\\left('+mpolyTex(f1)+'\\right)\\left('+mpolyTex(f2)+'\\right)',ok:true};}
  var pr=pick([['x','y'],['a','b'],['s','t'],['p','q'],['m','n']]),c1=pick([1,2,3,4]),c2=pick([1,2,3,4,5]);
  if(gcd(c1,c2)>1)return null;
  var expr2=[{c:c1*c1,vars:kv(pr[0],frac(1,1))},{c:-c2*c2,vars:kv(pr[1],frac(1,1))}],g1=[{c:c1,vars:kv(pr[0],half)},{c:-c2,vars:kv(pr[1],half)}],g2=[{c:c1,vars:kv(pr[0],half)},{c:c2,vars:kv(pr[1],half)}];
  if(!chkEq(pr,function(vl){return mpolyEval(expr2,vl);},function(vl){return mpolyEval(g1,vl)*mpolyEval(g2,vl);}))return null;
  return {q:mpolyTex(expr2),a:'\\left('+mpolyTex(g1)+'\\right)\\left('+mpolyTex(g2)+'\\right)',ok:true};
}
// 3.3 — Хоёр квадрат бутархайг хөндлөн хураах
function g33h(){
  var v=pick(['x','y','a','z','m','t','n']),rs=distinctRoots(6,-6,6);if(!rs)return null;
  var a=rs[0],b=rs[1],c=rs[2],d=rs[3],e=rs[4],f=rs[5],op=pick(['mul','div']);
  var F1='\\dfrac{'+quadTex(v,a,b)+'}{'+quadTex(v,c,d)+'}',F2=(op==='mul')?('\\dfrac{'+quadTex(v,c,e)+'}{'+quadTex(v,b,f)+'}'):('\\dfrac{'+quadTex(v,b,f)+'}{'+quadTex(v,c,e)+'}');
  var ans='\\dfrac{\\left('+linTex(v,a)+'\\right)\\left('+linTex(v,e)+'\\right)}{\\left('+linTex(v,d)+'\\right)\\left('+linTex(v,f)+'\\right)}';
  for(var i=0;i<6;i++){var x=8+Math.random()*7,f1=((x-a)*(x-b))/((x-c)*(x-d)),f2m=((x-c)*(x-e))/((x-b)*(x-f)),f2d=((x-b)*(x-f))/((x-c)*(x-e)),av=((x-a)*(x-e))/((x-d)*(x-f)),lhs=(op==='mul')?f1*f2m:f1/f2d;if(Math.abs(lhs-av)>1e-6*Math.max(1,Math.abs(av)))return null;}
  return {q:F1+(op==='mul'?'\\cdot ':' : ')+F2,a:ans,ok:true};
}
// 3.4 — Нэмэх/хасах + үржих/хуваах хосолсон
function g34h(){
  var v=pick(['x','y','b','a','t','m','p']),a=nz(-6,6),b=nz(-6,6),op1=pick([1,-1]),mul=pick([true,false]);
  if(a===b)return null;var d1=[-a,1],N1=[nz(-5,5),1],N2=[rnd(2,6)];
  if(pe(N1,a)===0)return null;var innerNum=padd(N1,psc(N2,op1));if(cTex(innerNum,v)==='0'||pe(innerNum,a)===0)return null;
  var inner={num:innerNum,den:d1},f3=mul?{num:[-a,1],den:[-b,1]}:{num:[-b,1],den:[-a,1]},fin=mul?mulFrac2(inner,f3):divFrac2(inner,f3);
  if(cfracTex(fin,v)==='0')return null;
  var frac1='\\dfrac{'+cTex(N1,v)+'}{'+cTex(d1,v)+'}',frac2='\\dfrac{'+cTex(N2,v)+'}{'+cTex(d1,v)+'}',f3tex='\\dfrac{'+cTex(f3.num,v)+'}{'+cTex(f3.den,v)+'}';
  var q='\\left('+frac1+(op1<0?' - ':' + ')+frac2+'\\right)'+(mul?'\\cdot ':' : ')+f3tex;
  var evalLHS=function(x){var innv=pe(N1,x)/pe(d1,x)+op1*pe(N2,x)/pe(d1,x),f3v=pe(f3.num,x)/pe(f3.den,x);return mul?innv*f3v:innv/f3v;};
  if(!chkFr(v,evalLHS,fin))return null;
  return {q:q,a:cfracTex(fin,v),ok:true};
}
function gen(fn){for(var t=0;t<400;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var qs=sheet.querySelectorAll('.grid .q');for(var i=0;i<qs.length;i++){var el=qs[i].querySelector('.ql');if(el)el.textContent=(i+1)+'.';}var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var e2=as[j].querySelector('.an');if(e2)e2.textContent=(j+1)+'.';}}
function trimToFitBalanced(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<400){var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>3){bestN=n;best=s;}}if(best<0)break;var qs=grids[best].querySelectorAll('.q'),last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function packColumns(sheet){[].forEach.call(sheet.querySelectorAll('.grid'),function(g){if(g.classList.contains('packed'))return;var qs=[].slice.call(g.children).filter(function(c){return c.classList&&c.classList.contains('q');});if(qs.length<2)return;var half=Math.ceil(qs.length/2),c1=document.createElement('div'),c2=document.createElement('div');c1.className='col';c2.className='col';qs.forEach(function(q,i){(i<half?c1:c2).appendChild(q);});g.appendChild(c1);g.appendChild(c2);g.classList.add('packed');});}
function build(){
  var WORK=!!window.WS_WORK;
  var S=[[],[],[],[]],seen={};window.__PROB=[];
  function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<1600){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;S[idx].push(f);c++;}}
  var per=WORK?4:9;
  fill(0,g31h,per);fill(1,g32h,per);fill(2,g33h,per);fill(3,g34h,per);
  var K=0;
  function block(arr,sec){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'" data-sec="'+sec+'"><div class="qeq"><span class="ql"></span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work sm"></div>':'')+'</div>';}).join('');}
  var b1=block(S[0],1),b2=block(S[1],2),b3=block(S[2],3),b4=block(S[3],4);
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>$'+p.f.a+'$</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>III бүлэг — Жишиг даалгавар 2</h1><div class="sub">Хаалт задлаад хураах · ялгаврын квадрат · бутархай хөндлөн хураах · хосолсон үйлдэл · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$a^{2}-b^{2}=(a-b)(a+b)$ &nbsp;·&nbsp; хүртвэр хуваарийг задалж хураа &nbsp;·&nbsp; $\\dfrac{a}{b}:\\dfrac{c}{d}=\\dfrac{a}{b}\\cdot\\dfrac{d}{c}$ &nbsp;·&nbsp; $x,y>0$</div>'
