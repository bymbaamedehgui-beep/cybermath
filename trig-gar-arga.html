<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Гарын хурууны арга · sin cos tan цээжлэх (0 30 45 60 90)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--orange:#e0701a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:11mm 13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:10px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .top{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:center;margin-bottom:14px}
  .handbox{border:1.4px solid #ecd7b6;background:#fffaf1;border-radius:14px;padding:8px}
  .handbox svg{width:100%;height:auto;display:block}
  .rules{font-size:13px}
  .rules h3{font-size:13px;color:#5a32d6;margin-bottom:6px}
  .rules .r{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}
  .rules .r .d{width:15px;height:15px;border-radius:50%;background:var(--orange);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:2px}
  .fbox{background:#f3eefe;border:1px solid #ddd0fb;border-radius:10px;padding:8px 11px;margin-top:6px;font-size:13px}
  .fbox b{color:#5a32d6}
  h2.sec{font-size:14px;color:#5a32d6;font-weight:800;margin:14px 0 8px;border-left:4px solid var(--purple);padding-left:8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{border:1px solid #d9d0ee;padding:7px 4px;text-align:center}
  thead th{background:#f3eefe;color:#5a32d6;font-weight:800}
  tbody th{background:#faf8ff;color:var(--purple);font-weight:800}
  .cell-blank{color:transparent}
  .practice td .box{display:inline-block;min-width:52px;min-height:20px;border-bottom:1.4px solid #c3b7e6}
  .hint{color:#16a34a !important;font-weight:700}
  #answers{display:none}
  .note{font-size:11px;color:var(--soft);margin-top:5px;text-align:center}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ дасгал</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}

var ANG=[0,30,45,60,90];
var COUNT=[0,1,2,3,4];                 // sin-ий доод хурууны тоо (√n)
var SIN=['0','\\dfrac{1}{2}','\\dfrac{\\sqrt{2}}{2}','\\dfrac{\\sqrt{3}}{2}','1'];
var COS=['1','\\dfrac{\\sqrt{3}}{2}','\\dfrac{\\sqrt{2}}{2}','\\dfrac{1}{2}','0'];
var TAN=['0','\\dfrac{\\sqrt{3}}{3}','1','\\sqrt{3}','\\text{тодорхойгүй}'];

/* --- гарын зураг (хажуу тийш харсан, зураастай) --- */
function drawHand(){
  var s='<svg viewBox="0 0 270 214" xmlns="http://www.w3.org/2000/svg">';
  s+='<defs><style>.hand{fill:#fff;stroke:#141414;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}'
    +'.ang{font:800 14px \'Segoe UI\',Arial;fill:#5a32d6}.cnt{font:800 13px \'Segoe UI\',Arial;fill:#fff}.cc{fill:#e0701a}</style></defs>';
  // гарын гадаад контур — хуруунууд баруун тийш, эрхий дээш
  s+='<path class="hand" d="M120 58 L188 58 A14 14 0 0 1 188 86 L120 86 Q104 88 120 90 '
    +'L212 90 A14 14 0 0 1 212 118 L120 118 Q104 120 120 122 '
    +'L196 122 A14 14 0 0 1 196 150 L120 150 Q104 152 120 154 '
    +'L170 154 A14 14 0 0 1 170 182 L120 182 Q108 196 88 198 L74 198 '
    +'Q56 199 55 181 L55 100 Q55 86 70 84 Q60 58 74 42 Q86 30 98 44 Q104 54 101 70 Q110 64 120 58 Z"/>';
  // хуруу бүрийн √-ийн доорх тоо + өнцөг  [countX,countY,num, angX,angY,angle]
  var L=[[92,66,'0',86,24,'0°'],[158,72,'1',214,74,'30°'],[158,104,'2',238,106,'45°'],[158,136,'3',222,138,'60°'],[150,168,'4',196,170,'90°']];
  L.forEach(function(p){
    s+='<circle class="cc" cx="'+p[0]+'" cy="'+p[1]+'" r="11"/><text class="cnt" x="'+p[0]+'" y="'+(p[1]+4.5)+'" text-anchor="middle">'+p[2]+'</text>';
    s+='<text class="ang" x="'+p[3]+'" y="'+(p[4]+5)+'" text-anchor="middle">'+p[5]+'</text>';
  });
  s+='</svg>';return s;
}

function build(){
  // reference table (бүрэн)
  function fullRow(i){return '<tr><th>'+ANG[i]+'°</th><td>$'+SIN[i]+'$</td><td>$'+COS[i]+'$</td><td>$'+TAN[i]+'$</td></tr>';}
  var refRows='';for(var i=0;i<5;i++)refRows+=fullRow(i);

  // practice: санамсаргүйгээр 4 нүд hint болгож, бусдыг хоослоно
  var cells=[]; for(var r=0;r<5;r++)for(var c=0;c<3;c++)cells.push([r,c]);
  var hints={}; var idxs=cells.slice(); for(var h=0;h<4;h++){var p=idxs.splice(rnd(0,idxs.length-1),1)[0];hints[p[0]+'-'+p[1]]=1;}
  var VAL=[SIN,COS,TAN];
  var prRows='';
  for(var r2=0;r2<5;r2++){prRows+='<tr><th>'+ANG[r2]+'°</th>';
    for(var c2=0;c2<3;c2++){var key=r2+'-'+c2;
      if(hints[key])prRows+='<td><span class="hint">$'+VAL[c2][r2]+'$</span></td>';
      else prRows+='<td><span class="box"></span></td>';}
    prRows+='</tr>';}

  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Гарын хурууны арга — sin · cos · tan цээжлэх</h1><div class="sub">0° · 30° · 45° · 60° · 90° өнцгийн утгыг ганц гараар · 9-р анги</div></div>'
    +'<div class="top">'
      +'<div class="handbox">'+drawHand()+'</div>'
      +'<div class="rules"><h3>Хэрхэн ашиглах вэ?</h3>'
        +'<div class="r"><span class="d">1</span><span>Хурууг дарааллаар нь <b>0°, 30°, 45°, 60°, 90°</b> гэж дугаарлав. Хуруу бүр дээрх улбар шар <b>тоо (n)</b> = √-ийн доорх тоо (0,1,2,3,4).</span></div>'
        +'<div class="r"><span class="d">2</span><span><b>sin</b> — тухайн хурууны тоог шууд ав: $\\sin=\\dfrac{\\sqrt{n}}{2}$</span></div>'
        +'<div class="r"><span class="d">3</span><span><b>cos</b> — эсрэг талаас тоол: $\\cos=\\dfrac{\\sqrt{4-n}}{2}$</span></div>'
        +'<div class="r"><span class="d">4</span><span><b>tan</b> $=\\dfrac{\\sin}{\\cos}$</span></div>'
        +'<div class="fbox">Жишээ — <b>60°</b> (n=3): $\\sin60°=\\dfrac{\\sqrt{3}}{2}$; &nbsp;$\\cos60°=\\dfrac{\\sqrt{4-3}}{2}=\\dfrac12$; &nbsp;$\\tan60°=\\sqrt{3}$.</div>'
      +'</div>'
    +'</div>'
    +'<h2 class="sec">Тусгай өнцгийн утгын хүснэгт</h2>'
    +'<table><thead><tr><th>θ</th><th>sin θ</th><th>cos θ</th><th>tan θ</th></tr></thead><tbody>'+refRows+'</tbody></table>'
    +'<h2 class="sec">Дасгал — гараа ашиглан бөглө (ногоон нүд нь сануулга)</h2>'
    +'<table class="practice"><thead><tr><th>θ</th><th>sin θ</th><th>cos θ</th><th>tan θ</th></tr></thead><tbody>'+prRows+'</tbody></table>'
    +'<div class="note">↻ «Шинэ дасгал» дарах бүрд сануулгын нүд өөрчлөгдөнө · «Хариу хавсаргах» → доор бүрэн хүснэгт</div>'
    +'<div id="answers"><h2 class="sec">Бүрэн хариу</h2>'
      +'<table><thead><tr><th>θ</th><th>sin θ</th><th>cos θ</th><th>tan θ</th></tr></thead><tbody>'+refRows+'</tbody></table></div>';
  window.WS_ITEMS=[{q:'Тусгай өнцгийн sin/cos/tan (0-90)',a:'гарын хурууны арга'}];
  window.WS_TITLE='Гарын хурууны арга — тригонометр цээжлэх';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=17"></script>
</body>
</html>
