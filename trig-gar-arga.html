<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Гарын хурууны арга · Math Tips — sin cos tan цээжлэх (0 30 45 60 90)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--red:#d1342b;--blue:#1f5fbf}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:11mm 13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:10px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .top{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:center;margin-bottom:12px}
  .mtbox{border:1.4px solid #e2dbf5;background:#fdfcff;border-radius:14px;padding:6px}
  .mtbox svg{width:100%;height:auto;display:block}
  .rules{font-size:13px}
  .rules h3{font-size:13.5px;color:#5a32d6;margin-bottom:7px}
  .rules .r{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}
  .rules .r .d{width:15px;height:15px;border-radius:50%;background:var(--purple);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:2px}
  .rules .sw{color:var(--red);font-weight:800}.rules .cw{color:var(--blue);font-weight:800}
  .fbox{background:#f3eefe;border:1px solid #ddd0fb;border-radius:10px;padding:8px 11px;margin-top:6px;font-size:12.5px}
  h2.sec{font-size:14px;color:#5a32d6;font-weight:800;margin:14px 0 8px;border-left:4px solid var(--purple);padding-left:8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{border:1px solid #d9d0ee;padding:7px 4px;text-align:center}
  thead th{background:#f3eefe;color:#5a32d6;font-weight:800}
  tbody th{background:#faf8ff;color:var(--purple);font-weight:800}
  .practice td .box{display:inline-block;min-width:52px;min-height:20px;border-bottom:1.4px solid #c3b7e6}
  .hint{color:#16a34a !important;font-weight:700}
  #answers{display:none}
  .note{font-size:11px;color:var(--soft);margin-top:5px;text-align:center}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ дасгал</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}

var ANG=[0,30,45,60,90];
var SIN=['0','\\dfrac{1}{2}','\\dfrac{\\sqrt{2}}{2}','\\dfrac{\\sqrt{3}}{2}','1'];
var COS=['1','\\dfrac{\\sqrt{3}}{2}','\\dfrac{\\sqrt{2}}{2}','\\dfrac{1}{2}','0'];
var TAN=['0','\\dfrac{\\sqrt{3}}{3}','1','\\sqrt{3}','\\text{тодорхойгүй}'];

/* ==== Math Tips гарын хуудас (алга дээш) ==== */
function drawMT(){
  var s='<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">';
  s+='<defs><style>'
    +'.hand{fill:#fbf9ff;stroke:#161616;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}'
    +'.fr{font:700 15px "Times New Roman",Georgia,serif;text-anchor:middle}'
    +'.ang2{font:800 13px "Segoe UI",Arial;fill:#222;text-anchor:middle}'
    +'.arr{font:800 13px "Segoe UI",Arial}'
    +'</style></defs>';
  // сумнууд
  s+='<text class="arr" x="18" y="33" fill="#d1342b">sin</text>'
    +'<line x1="52" y1="29" x2="276" y2="29" stroke="#d1342b" stroke-width="2.4"/><path d="M285 29 l-11 -5.5 l0 11 Z" fill="#d1342b"/>';
  s+='<text class="arr" x="18" y="56" fill="#1f5fbf">cos</text>'
    +'<line x1="276" y1="52" x2="54" y2="52" stroke="#1f5fbf" stroke-width="2.4"/><path d="M45 52 l11 -5.5 l0 11 Z" fill="#1f5fbf"/>';
  // гар
  s+='<path class="hand" d="M93 290 L93 175 A15 15 0 0 1 123 175 L123 272 Q129 284 135 272 '
    +'L135 159 A15 15 0 0 1 165 159 L165 272 Q171 284 177 272 '
    +'L177 175 A15 15 0 0 1 207 175 L207 272 Q213 284 215 272 '
    +'L215 205 A15 15 0 0 1 245 205 L245 290 '
    +'Q252 335 238 362 Q200 380 150 380 Q104 380 90 358 '
    +'L82 315 Q76 292 58 280 Q38 262 32 244 Q24 232 34 224 '
    +'Q48 216 62 232 Q76 250 88 272 Q91 280 93 290 Z"/>';
  // хуруу тус бүрийн шошго [angle, lx, angleY, cosY, sinY, s, c]
  var F=[['0°',46,208,180,152,0,4],['30°',108,150,124,96,1,3],['45°',150,134,108,80,2,2],['60°',192,150,124,96,3,1],['90°',230,180,154,126,4,0]];
  function frac(cx,cy,rad,color){
    return '<text class="fr" x="'+cx+'" y="'+(cy-1)+'" fill="'+color+'">&#8730;'+rad+'</text>'
      +'<line x1="'+(cx-11)+'" y1="'+(cy+2.5)+'" x2="'+(cx+11)+'" y2="'+(cy+2.5)+'" stroke="'+color+'" stroke-width="1.5"/>'
      +'<text class="fr" x="'+cx+'" y="'+(cy+15)+'" fill="'+color+'">2</text>';
  }
  F.forEach(function(f){
    s+=frac(f[1],f[4],f[5],'#d1342b');     // sin (улаан) дээр
    s+=frac(f[1],f[3],f[6],'#1f5fbf');     // cos (цэнхэр) доор
    s+='<text class="ang2" x="'+f[1]+'" y="'+f[2]+'">'+f[0]+'</text>';
  });
  s+='</svg>';return s;
}

function build(){
  function fullRow(i){return '<tr><th>'+ANG[i]+'°</th><td>$'+SIN[i]+'$</td><td>$'+COS[i]+'$</td><td>$'+TAN[i]+'$</td></tr>';}
  var refRows='';for(var i=0;i<5;i++)refRows+=fullRow(i);

  var cells=[];for(var r=0;r<5;r++)for(var c=0;c<3;c++)cells.push([r,c]);
  var hints={};var idxs=cells.slice();for(var h=0;h<4;h++){var p=idxs.splice(rnd(0,idxs.length-1),1)[0];hints[p[0]+'-'+p[1]]=1;}
  var VAL=[SIN,COS,TAN];var prRows='';
  for(var r2=0;r2<5;r2++){prRows+='<tr><th>'+ANG[r2]+'°</th>';
    for(var c2=0;c2<3;c2++){var key=r2+'-'+c2;
      if(hints[key])prRows+='<td><span class="hint">$'+VAL[c2][r2]+'$</span></td>';
      else prRows+='<td><span class="box"></span></td>';}
    prRows+='</tr>';}

  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Гарын хурууны арга — Math Tips</h1><div class="sub">Ганц гараар 0° · 30° · 45° · 60° · 90° өнцгийн sin, cos, tan-г цээжлэх · 9-р анги</div></div>'
    +'<div class="top">'
      +'<div class="mtbox">'+drawMT()+'</div>'
      +'<div class="rules"><h3>Хэрхэн ажилладаг вэ?</h3>'
        +'<div class="r"><span class="d">1</span><span>Хурууг зүүнээс баруун тийш <b>0°, 30°, 45°, 60°, 90°</b> гэж дугаарла (эрхий = 0°, чигчий = 90°).</span></div>'
        +'<div class="r"><span class="d">2</span><span><span class="sw">sin</span> (улаан) — эрхийнээс эхлэн $\\dfrac{\\sqrt{0}}{2},\\dfrac{\\sqrt{1}}{2},\\dfrac{\\sqrt{2}}{2},\\dfrac{\\sqrt{3}}{2},\\dfrac{\\sqrt{4}}{2}$ — тоо <b>өсдөг</b>.</span></div>'
        +'<div class="r"><span class="d">3</span><span><span class="cw">cos</span> (цэнхэр) — яг <b>эсрэгээр</b>: $\\dfrac{\\sqrt{4}}{2}$-оос $\\dfrac{\\sqrt{0}}{2}$ хүртэл буурна.</span></div>'
        +'<div class="r"><span class="d">4</span><span><b>tan</b> $=\\dfrac{\\sin}{\\cos}$</span></div>'
        +'<div class="fbox">Жишээ — <b>60°</b>: $\\sin60°=\\dfrac{\\sqrt{3}}{2}$, &nbsp;$\\cos60°=\\dfrac{\\sqrt{1}}{2}=\\dfrac12$, &nbsp;$\\tan60°=\\dfrac{\\sqrt3/2}{1/2}=\\sqrt{3}$.</div>'
      +'</div>'
    +'</div>'
    +'<h2 class="sec">Тусгай өнцгийн утгын хүснэгт</h2>'
    +'<table><thead><tr><th>θ</th><th>sin θ</th><th>cos θ</th><th>tan θ</th></tr></thead><tbody>'+refRows+'</tbody></table>'
    +'<h2 class="sec">Дасгал — гараа санаад бөглө (ногоон нүд = сануулга)</h2>'
    +'<table class="practice"><thead><tr><th>θ</th><th>sin θ</th><th>cos θ</th><th>tan θ</th></tr></thead><tbody>'+prRows+'</tbody></table>'
    +'<div class="note">↻ «Шинэ дасгал» → сануулгын нүд өөрчлөгдөнө · «Хариу хавсаргах» → доор бүрэн хүснэгт</div>'
    +'<div id="answers"><h2 class="sec">Бүрэн хариу</h2>'
      +'<table><thead><tr><th>θ</th><th>sin θ</th><th>cos θ</th><th>tan θ</th></tr></thead><tbody>'+refRows+'</tbody></table></div>';
  window.WS_ITEMS=[{q:'Тусгай өнцгийн sin/cos/tan (0-90)',a:'Math Tips гарын арга'}];
  window.WS_TITLE='Гарын хурууны арга — Math Tips';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=17"></script>
</body>
</html>
