<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат функц — утгын хүснэгт ба график (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}.qn{font-weight:800;color:var(--purple);font-size:14px;min-width:22px}.qm{font-size:14px}
  .qbody{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding-left:30px}
  table.vt{border-collapse:collapse;font-size:12.5px}
  table.vt th,table.vt td{border:1px solid #c9bdec;padding:3px 8px;text-align:center;min-width:26px;height:22px}
  table.vt th{background:#f3eefe;color:#5a32d6;font-weight:800}
  table.vt td.blank{background:linear-gradient(#fff,#fbf9ff)}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ak{font-size:12.5px;margin-bottom:7px}.ak .n{font-weight:800;color:var(--purple);min-width:24px;display:inline-block}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function s(a){return a<0?'-'+(-a):'+'+a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function quadStr(b,c){var t='x^2';if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
function valTable(xs,ys,show){var xh='<tr><th>$x$</th>'+xs.map(function(x){return '<td>$'+x+'$</td>';}).join('')+'</tr>';
  var yh='<tr><th>$y$</th>'+xs.map(function(x,i){return show?'<td>$'+ys[i]+'$</td>':'<td class="blank"></td>';}).join('')+'</tr>';
  return '<table class="vt">'+xh+yh+'</table>';}
function labeledGrid(x0,x1,y0,y1){var u=11,mL=22,mT=10,PW=(x1-x0)*u,PH=(y1-y0)*u,ux=u,uy=u;
  function px(x){return mL+(x-x0)*ux;}function py(y){return mT+(y1-y)*uy;}
  var W=mL+PW+8,H=mT+PH+16,g='';
  for(var i=Math.ceil(x0);i<=Math.floor(x1);i++)g+='<line x1="'+px(i).toFixed(1)+'" y1="'+mT+'" x2="'+px(i).toFixed(1)+'" y2="'+(mT+PH)+'" stroke="#ede9fa" stroke-width="0.5"/>';
  for(var j=Math.ceil(y0);j<=Math.floor(y1);j++)g+='<line x1="'+mL+'" y1="'+py(j).toFixed(1)+'" x2="'+(mL+PW)+'" y2="'+py(j).toFixed(1)+'" stroke="#ede9fa" stroke-width="0.5"/>';
  var axY=py(0),axX=px(0);
  g+='<line x1="'+mL+'" y1="'+axY.toFixed(1)+'" x2="'+(mL+PW)+'" y2="'+axY.toFixed(1)+'" stroke="#555" stroke-width="1"/><line x1="'+axX.toFixed(1)+'" y1="'+mT+'" x2="'+axX.toFixed(1)+'" y2="'+(mT+PH)+'" stroke="#555" stroke-width="1"/>';
  for(var t=Math.ceil(x0);t<=Math.floor(x1);t++){if(t===0)continue;g+='<text x="'+(px(t)-3).toFixed(1)+'" y="'+(axY+9).toFixed(1)+'" font-size="8" fill="#777">'+t+'</text>';}
  var yStep=(y1-y0>13)?2:1;
  for(var s2=Math.ceil(y0);s2<=Math.floor(y1);s2++){if(s2===0||s2%yStep!==0)continue;g+='<text x="'+(axX-14).toFixed(1)+'" y="'+(py(s2)+3).toFixed(1)+'" font-size="8" fill="#777">'+s2+'</text>';}
  g+='<text x="'+(axX+3).toFixed(1)+'" y="'+(mT+7)+'" font-size="9" fill="#555" font-weight="700">y</text><text x="'+(mL+PW-6)+'" y="'+(axY-3).toFixed(1)+'" font-size="9" fill="#555" font-weight="700">x</text>';
  return '<svg width="'+W.toFixed(0)+'" height="'+H.toFixed(0)+'" viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" style="flex-shrink:0">'+g+'</svg>';}
function gridForQuad(xv,m){return labeledGrid(-6,6,Math.min(m-1,0),m+10);}
// y=(x-xv)^2+m ; таблиц x=xv-3..xv+3
function gq(){var xv=rnd(-1,1),m=rnd(-4,2),b=-2*xv,c=xv*xv+m;var xs=[],ys=[];for(var x=xv-3;x<=xv+3;x++){xs.push(x);ys.push((x-xv)*(x-xv)+m);}
  return {b:b,c:c,xs:xs,ys:ys,xv:xv,m:m};}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<60){var g=sheet.querySelector('.grid'),qs=g.querySelectorAll('.q');if(qs.length<=3)break;var last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .ak[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);h=probeH(sheet);}}
function build(){window.__POOL=[];var seen={},tr=0;while(window.__POOL.length<6&&tr<400){tr++;var g=gen(gq);if(!g)continue;var key=g.b+','+g.c;if(seen[key])continue;seen[key]=1;window.__POOL.push(g);}layout();}
function layout(){
  var S=window.__POOL||[];var body='',ak='';
  S.forEach(function(f,i){var stem='$y='+quadStr(f.b,f.c)+'$ функцийн утгын хүснэгтийг нөхөж, графикийг байгуул.';
    body+='<div class="q" data-k="'+i+'"><div class="qh"><span class="qn">'+(i+1)+'.</span><span class="qm">'+stem+'</span></div><div class="qbody">'+valTable(f.xs,f.ys,false)+gridForQuad(f.xv,f.m)+'</div></div>';
    ak+='<div class="ak" data-k="'+i+'"><span class="n">'+(i+1)+')</span> $y:\\ '+f.ys.join(',\\ ')+'$; орой $('+f.xv+';\\ '+f.m+')$, тэнхлэг $x='+f.xv+'$</div>';});
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадрат функц — утгын хүснэгт ба график</h1><div class="sub">Утгын хүснэгтийг нөхөж, параболыг байгуул · 9-р анги · 5.3</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$x$-ийн утга тус бүрд $y=x^2+bx+c$-ийг бодож хүснэгтийг нөхнө. Дараа нь $(x;y)$ цэгүүдийг тэмдэглэж, парабол байгуулна.</div>'
    +'<div class="task">Утгын хүснэгтийг нөхөж, графикийг байгуул.</div><div class="grid">'+body+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2>'+ak+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Квадрат функц — утгын хүснэгт ба график';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFit(document.getElementById('sheet'),1035);}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
