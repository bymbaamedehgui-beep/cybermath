<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ХИЕХ ба ХБЕХ — баганан бичлэг</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--blue:#1d6c8c;--green:#0b6b2e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .guide{background:#f6f2ff;border:1px solid #e2d6ff;border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .guide h3{font-size:13px;color:#5a32d6;margin-bottom:6px}
  .gtext{flex:1;min-width:260px;font-size:12px}
  .gtext ol{margin:0 0 0 18px}.gtext li{margin:3px 0}
  .hiehc{color:var(--blue);font-weight:800}.hbehc{color:var(--green);font-weight:800}
  /* баганан бичлэгийн жишээ ба загвар */
  .ladder{border-collapse:collapse;font-size:13px}
  .ladder td{min-width:30px;height:19px;text-align:center;font-weight:700;padding:0 6px}
  .ladder td.dv{border-left:1.8px solid #7a7390;color:var(--blue)}
  .exwrap{background:#fff;border:1px dashed #d8ccff;border-radius:8px;padding:8px 12px;font-size:12px}
  .exwrap .res{margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:6px 4px 8px;border-bottom:1px dashed #efeaff}
  .qh{font-size:14px;font-weight:700;margin-bottom:3px}.qh .qn{color:var(--purple);font-weight:800;margin-right:6px}
  .ladder.blank td{border-bottom:0}
  .ladder.blank td.num{min-width:38px}
  .ladder.blank td.dv{min-width:40px}
  .ladder.blank tr td{height:20px}
  .ans2{display:flex;gap:16px;font-size:12.5px;font-weight:700;margin-top:5px}
  .ans2 .bl{display:inline-block;min-width:50px;border-bottom:1.4px solid #b9accf;height:1.05em;margin-left:4px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function gcd(x,y){x=Math.abs(x);y=Math.abs(y);while(y){var t=y;y=x%y;x=t;}return x;}
function lcm(x,y){return x/gcd(x,y)*y;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
// хоосон баганан загвар: эхний мөрөнд a, b; баруун талд хуваагчийн багана; доош хэдэн мөр
function blankLadder(a,b,rows){
  var h='<table class="ladder blank"><tr><td class="num">'+a+'</td><td class="num">'+b+'</td><td class="dv"></td></tr>';
  for(var r=0;r<rows;r++)h+='<tr><td class="num"></td><td class="num"></td><td class="dv"></td></tr>';
  return h+'</table>';
}
function build(){
  var N=12, probs='',answs='',ITEMS=[],seen={};
  for(var i=0;i<N;i++){
    var g=rnd(2,9), a=g*rnd(2,9), b=g*rnd(2,9);
    if(a===b||seen[a+'_'+b]){i--;continue;} seen[a+'_'+b]=1;
    var G=gcd(a,b), L=lcm(a,b), n=i+1;
    probs+='<div class="q"><div class="qh"><span class="qn">'+n+'.</span>'+a+' ба '+b+'</div>'
      +blankLadder(a,b,3)
      +'<div class="ans2"><span>ХИЕХ:<span class="bl"></span></span><span>ХБЕХ:<span class="bl"></span></span></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>'+a+', '+b+' → <b class="hiehc">ХИЕХ='+G+'</b>, <b class="hbehc">ХБЕХ='+L+'</b></span></div>';
    ITEMS.push({q:'\\text{'+a+' ба '+b+'}',a:'\\text{ХИЕХ}='+G+',\\ \\text{ХБЕХ}='+L});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>ХИЕХ ба ХБЕХ — баганан бичлэг</h1><div class="sub">Хоёр тоог нийтлэг анхны хуваагчид дараалан хувааж ол · 12 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="guide">'
    + '<div class="gtext"><h3>📋 Баганан бичлэгийн алхам</h3><ol>'
    +   '<li>Хоёр тоог зэрэгцүүлж бичээд баруун талд босоо зураас тат.</li>'
    +   '<li>Хоёуланд нь хуваагдах <b>нийтлэг анхны тоог</b> баруун талд бич, хоёр тоог хувааж доор бич.</li>'
    +   '<li>Нийтлэг хуваагчгүй болтол үргэлжлүүл.</li>'
    +   '<li><b class="hiehc">ХИЕХ</b> = баруун талын <b>бүх хуваагчийн</b> үржвэр.</li>'
    +   '<li><b class="hbehc">ХБЕХ</b> = ХИЕХ × доод мөрөнд үлдсэн хоёр тоо.</li>'
    + '</ol></div>'
    + '<div class="exwrap"><b>Жишээ: 24 ба 36</b>'
    +   '<table class="ladder"><tr><td>24</td><td>36</td><td class="dv">2</td></tr>'
    +   '<tr><td>12</td><td>18</td><td class="dv">2</td></tr>'
    +   '<tr><td>6</td><td>9</td><td class="dv">3</td></tr>'
    +   '<tr><td>2</td><td>3</td><td class="dv"></td></tr></table>'
    +   '<div class="res"><span class="hiehc">ХИЕХ</span> $=2\\cdot2\\cdot3=12$</div>'
    +   '<div class="res"><span class="hbehc">ХБЕХ</span> $=12\\cdot2\\cdot3=72$</div>'
    + '</div>'
    +'</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=ITEMS; window.WS_TITLE='ХИЕХ ба ХБЕХ (баганан бичлэг)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=31"></script>
</body>
</html>
