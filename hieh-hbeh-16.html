<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ХИЕХ ба ХБЕХ — алхамаар</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--blue:#1d6c8c;--green:#0b6b2e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  /* заавар */
  .guide{background:#f6f2ff;border:1px solid #e2d6ff;border-radius:12px;padding:12px 16px;margin-bottom:14px}
  .guide h3{font-size:13px;color:#5a32d6;margin-bottom:8px}
  .steps{display:grid;grid-template-columns:1.1fr 1fr;gap:6px 18px;font-size:12px}
  .steps ol{margin:0 0 0 18px;padding:0}.steps li{margin:3px 0}
  .ex{background:#fff;border:1px dashed #d8ccff;border-radius:8px;padding:8px 10px;font-size:12px}
  .ex .ln{margin:3px 0}
  .hiehc{color:var(--blue);font-weight:800}.hbehc{color:var(--green);font-weight:800}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:6px 4px 8px;border-bottom:1px dashed #efeaff}
  .qh{font-size:14.5px;font-weight:700}.qh .qn{color:var(--purple);font-weight:800;margin-right:6px}
  .work{margin:6px 0;height:16mm;border:1.3px solid #cdbfee;border-radius:6px;background-image:linear-gradient(#eee 1px,transparent 1px);background-size:100% 5.3mm}
  .ans2{display:flex;gap:16px;font-size:12.5px;font-weight:700}
  .ans2 .bl{display:inline-block;min-width:52px;border-bottom:1.4px solid #b9accf;height:1.05em;margin-left:4px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function gcd(x,y){x=Math.abs(x);y=Math.abs(y);while(y){var t=y;y=x%y;x=t;}return x;}
function lcm(x,y){return x/gcd(x,y)*y;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function build(){
  var N=16, probs='',answs='',ITEMS=[],seen={};
  for(var i=0;i<N;i++){
    var g=rnd(2,9), a=g*rnd(2,9), b=g*rnd(2,9);
    if(a===b||seen[a+'_'+b]){i--;continue;} seen[a+'_'+b]=1;
    var G=gcd(a,b), L=lcm(a,b);
    var n=i+1;
    probs+='<div class="q"><div class="qh"><span class="qn">'+n+'.</span>'+a+' ба '+b+'</div>'
      +'<div class="work"></div>'
      +'<div class="ans2"><span>ХИЕХ:<span class="bl"></span></span><span>ХБЕХ:<span class="bl"></span></span></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>'+a+', '+b+' → <b class="hiehc">ХИЕХ='+G+'</b>, <b class="hbehc">ХБЕХ='+L+'</b></span></div>';
    ITEMS.push({q:'\\text{'+a+' ба '+b+'}',a:'\\text{ХИЕХ}='+G+',\\ \\text{ХБЕХ}='+L});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>ХИЕХ ба ХБЕХ олох</h1><div class="sub">Хоёр тооны хамгийн их ерөнхий хуваагч ба хамгийн бага ерөнхий хуваагдагчийг ол · 16 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="guide"><h3>📋 Алхмууд (анхны үржигдэхүүнд задлах арга)</h3>'
    + '<div class="steps"><ol>'
    +   '<li>Тоо бүрийг <b>анхны тоонуудын үржвэр</b> болгон задал.</li>'
    +   '<li><b class="hiehc">ХИЕХ</b> = <b>нийтлэг</b> үржигдэхүүнийг <b>хамгийн бага</b> зэргээр нь үржүүл.</li>'
    +   '<li><b class="hbehc">ХБЕХ</b> = <b>бүх</b> үржигдэхүүнийг <b>хамгийн их</b> зэргээр нь үржүүл.</li>'
    +   '<li>Шалгалт: $\\;\\text{ХИЕХ}\\times\\text{ХБЕХ}=a\\times b$</li>'
    + '</ol>'
    + '<div class="ex"><b>Жишээ: 24 ба 36</b>'
    +   '<div class="ln">$24=2^{3}\\cdot 3$</div>'
    +   '<div class="ln">$36=2^{2}\\cdot 3^{2}$</div>'
    +   '<div class="ln"><span class="hiehc">ХИЕХ</span> $=2^{2}\\cdot 3=12$</div>'
    +   '<div class="ln"><span class="hbehc">ХБЕХ</span> $=2^{3}\\cdot 3^{2}=72$</div>'
    + '</div></div></div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=ITEMS; window.WS_TITLE='ХИЕХ ба ХБЕХ олох';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js"></script>
</body>
</html>
