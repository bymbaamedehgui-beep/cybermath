<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Алгебрын бутархай — 2 хувьсагч, 4–5 үйлдэл (олимпиадын хүнд)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--line:#e7ddff;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.6}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:17px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .guide{background:#f6f2ff;border:1px solid #e2d6ff;border-radius:12px;padding:9px 16px;margin-bottom:14px;font-size:11.6px;text-align:center}
  .guide b{color:#5a32d6}
  .q{break-inside:avoid;page-break-inside:avoid;padding:10px 4px 12px;border-bottom:1px dashed #efeaff}
  .qh{display:flex;gap:8px;align-items:baseline}.qn{font-weight:800;color:var(--purple);min-width:26px}.qm{font-size:13.5px;overflow-x:auto}
  .bl{margin:20px 0 2px 30px;border-bottom:1.4px solid #b9accf;height:1.05em}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .sol{break-inside:avoid;page-break-inside:avoid;margin-bottom:13px;padding-bottom:9px;border-bottom:1px dashed #eee}
  .sol .sh{font-weight:800;color:var(--purple);font-size:13px;margin-bottom:3px}
  .sol .step{font-size:12.7px;margin:3px 0 3px 14px;overflow-x:auto}
  .sol .fin{font-size:13.5px;margin:4px 0 0 14px;color:var(--green);font-weight:700}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function fr(t,b){return '\\dfrac{'+t+'}{'+b+'}';}

// Хоёр хувьсагчтай, 4–5 үйлдэлтэй хүнд бутархай илэрхийллүүд.
// Тус бүр (u,v) үсгээр параметржинэ. Задал: нийтлэг үржигдэхүүн, x²-y², x³±y³.
var FAMILIES=[
  function(u,v){ // #15 маягийн → 1/v
    var upv=u+'+'+v,umv=u+'-'+v,vmu=v+'-'+u,u2=u+'^{2}',v2=v+'^{2}',uv=u+v,sc=u+'^{2}-'+u+v+'+'+v+'^{2}';
    return {q:'\\left('+fr(umv,uv+'+'+u2)+'-'+fr(u,uv+'+'+v2)+'\\right)\\div\\left('+fr(v2,u+'^{3}-'+u+v2)+'+'+fr('1',upv)+'\\right)\\cdot '+fr('1',vmu),
      steps:['=\\left('+fr(umv,u+'('+upv+')')+'-'+fr(u,v+'('+upv+')')+'\\right)\\div\\left('+fr(v2,u+'('+umv+')('+upv+')')+'+'+fr('1',upv)+'\\right)\\cdot '+fr('1',vmu),
             '='+fr('-('+sc+')',uv+'('+upv+')')+'\\div '+fr(sc,u+'('+umv+')('+upv+')')+'\\cdot '+fr('1',vmu),
             '='+fr(vmu,v)+'\\cdot '+fr('1',vmu)],
      ans:fr('1',v)};
  },
  function(u,v){ // #16 маягийн → 3/(u-v)
    var upv=u+'+'+v,umv=u+'-'+v,u2=u+'^{2}',v2=v+'^{2}',uv=u+v,dsq=u+'^{2}-'+v+'^{2}';
    return {q:fr(upv,u2)+'\\div\\left('+fr(u2,uv+'-'+v2)+'-'+fr(u2+'+2'+uv+'-'+v2,dsq)+'-'+fr(v2,u2+'+'+uv)+'\\right)\\cdot '+fr('2'+u,v)+'+'+fr('1',umv),
      steps:['='+fr(upv,u2)+'\\div\\left('+fr(u2,v+'('+umv+')')+'-'+fr(u2+'+2'+uv+'-'+v2,'('+umv+')('+upv+')')+'-'+fr(v2,u+'('+upv+')')+'\\right)\\cdot '+fr('2'+u,v)+'+'+fr('1',umv),
             '='+fr(upv,u2)+'\\div '+fr(dsq,uv)+'\\cdot '+fr('2'+u,v)+'+'+fr('1',umv),
             '='+fr('2',umv)+'+'+fr('1',umv)],
      ans:fr('3',umv)};
  },
  function(u,v){ // → 1
    var upv=u+'+'+v,umv=u+'-'+v,uv=u+v,dsq=u+'^{2}-'+v+'^{2}';
    return {q:'\\left('+fr(upv,umv)+'-'+fr(umv,upv)+'\\right)\\div '+fr('4'+uv,dsq),
      steps:['='+fr('('+upv+')^{2}-('+umv+')^{2}','('+umv+')('+upv+')')+'\\div '+fr('4'+uv,dsq),
             '='+fr('4'+uv,dsq)+'\\cdot '+fr(dsq,'4'+uv)],
      ans:'1'};
  },
  function(u,v){ // → u
    var upv=u+'+'+v,umv=u+'-'+v,dsq=u+'^{2}-'+v+'^{2}';
    return {q:'\\left('+fr('1',umv)+'-'+fr('1',upv)+'\\right)\\div '+fr('2'+v,dsq)+'\\cdot '+u,
      steps:['='+fr('('+upv+')-('+umv+')','('+umv+')('+upv+')')+'\\div '+fr('2'+v,dsq)+'\\cdot '+u,
             '='+fr('2'+v,dsq)+'\\cdot '+fr(dsq,'2'+v)+'\\cdot '+u],
      ans:u};
  },
  function(u,v){ // кубуудын нийлбэр → 1
    var upv=u+'+'+v,umv=u+'-'+v,dsq=u+'^{2}-'+v+'^{2}',sc=u+'^{2}-'+u+v+'+'+v+'^{2}';
    return {q:fr(u+'^{3}+'+v+'^{3}',dsq)+'\\cdot '+fr(umv,sc),
      steps:['='+fr('('+upv+')('+sc+')','('+umv+')('+upv+')')+'\\cdot '+fr(umv,sc),
             '='+fr(sc,umv)+'\\cdot '+fr(umv,sc)],
      ans:'1'};
  },
  function(u,v){ // → 1/(u(u+v))
    var upv=u+'+'+v,vmu=v+'-'+u,u2=u+'^{2}',v2=v+'^{2}',uv=u+v,vpu=v+'+'+u;
    return {q:'\\left('+fr('1',u)+'-'+fr('1',v)+'\\right)\\div\\left('+v2+'-'+u2+'\\right)\\cdot '+v,
      steps:['='+fr(vmu,uv)+'\\div\\left(('+vmu+')('+vpu+')\\right)\\cdot '+v,
             '='+fr(vmu,uv)+'\\cdot '+fr('1','('+vmu+')('+vpu+')')+'\\cdot '+v,
             '='+fr(v,uv+'('+vpu+')')],
      ans:fr('1',u+'('+upv+')')};
  },
  function(u,v){ // кубуудын нийлбэр → v
    var upv=u+'+'+v,sc=u+'^{2}-'+u+v+'+'+v+'^{2}';
    return {q:fr(u+'^{3}+'+v+'^{3}',sc)+'-'+u,
      steps:['=('+upv+')-'+u],
      ans:v};
  },
  function(u,v){ // → 1
    var upv=u+'+'+v,umv=u+'-'+v,u2=u+'^{2}',v2=v+'^{2}',dsq=u+'^{2}-'+v+'^{2}';
    return {q:'\\left('+fr(u,umv)+'-'+fr(v,upv)+'\\right)\\cdot '+fr(dsq,u2+'+'+v2),
      steps:['='+fr(u+'('+upv+')-'+v+'('+umv+')','('+umv+')('+upv+')')+'\\cdot '+fr(dsq,u2+'+'+v2),
             '='+fr(u2+'+'+v2,dsq)+'\\cdot '+fr(dsq,u2+'+'+v2)],
      ans:'1'};
  },
];

var PAIRS=[['a','b'],['m','n'],['p','q'],['x','y'],['s','t'],['c','d']];
var N=6;
function build(){
  var order=[];for(var i=0;i<FAMILIES.length;i++)order.push(i);
  for(var i=order.length-1;i>0;i--){var j=rnd(0,i);var t=order[i];order[i]=order[j];order[j]=t;}
  var probs='',sols='',WS=[];
  for(var i=0;i<N;i++){
    var pr=PAIRS[rnd(0,PAIRS.length-1)];
    var it=FAMILIES[order[i%order.length]](pr[0],pr[1]);
    var k=i+1;
    probs+='<div class="q"><div class="qh"><span class="qn">'+k+'.</span><span class="qm">$'+it.q+'=$</span></div><div class="bl"></div></div>';
    var stepHtml=it.steps.map(function(s){return '<div class="step">$'+s+'$</div>';}).join('');
    sols+='<div class="sol"><div class="sh">'+k+'-р бодлого</div>'
      +'<div class="step">$'+it.q+'$</div>'+stepHtml
      +'<div class="fin">$\\Rightarrow\\ '+it.ans+'$</div></div>';
    WS.push({q:it.q+'=',a:it.ans});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Алгебрын бутархай — 2 хувьсагч, 4–5 үйлдэл (хүнд)</h1>'
    +'<div class="sub">9-р анги · нийтлэг үржигдэхүүн, $a^2-b^2$, $a^3\\pm b^3$ задал · бодолттой · '+N+' бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="guide">Хаалт доторхыг <b>нийтлэг хуваарьт</b> оруулж нэгтгэ → тоологч·хуваарийг <b>үржигдэхүүнд задал</b> ($a^2-b^2,\\ a^3\\pm b^3$) → нийтлэгийг <b>хорого</b> → хуваахыг урвуугаар үржүүл. Үйлдлийн дарааллыг чанд баримтал.</div>'
    +'<div>'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Бодолт</h2>'+sols+'</div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='Алгебрын бутархай 2 хувьсагч 4-5 үйлдэл (хүнд)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=8"></script>
</body>
</html>
