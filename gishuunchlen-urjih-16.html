<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Гишүүнчлэн үржүүлж хялбарчлах — 7-р анги</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .rule{font-size:12px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:9px 13px;margin-bottom:14px}
  .rule b{color:#7a4f00}.rule .hl{background:#ffe9b0;border-radius:4px;padding:0 3px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 22px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:6px 4px 7px;border-bottom:1px dashed #efeaff}
  .qeq{display:flex;gap:6px;align-items:baseline}.qn{font-weight:800;color:var(--purple);min-width:24px}.qm{font-size:15px}
  .bl{display:inline-block;min-width:90px;border-bottom:1.4px solid #b9accf;height:1.05em;margin-left:6px;flex:1}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;font-size:13px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}

var SYM={x2:'x^{2}',x:'x',y:'y',c:''};
var ORDER=['x2','x','y','c'];
function fmtExpr(e){
  var s='',first=true;
  for(var i=0;i<ORDER.length;i++){
    var k=ORDER[i],v=e[k]||0; if(v===0)continue;
    var sym=SYM[k],a=Math.abs(v),num=(sym&&a===1)?'':a,body=num+sym;
    if(first){s+=(v<0?'-':'')+body;first=false;}
    else{s+=(v<0?' - ':' + ')+body;}
  }
  return s===''?'0':s;
}
function mul(e,k){var r={};for(var key in e)r[key]=e[key]*k;return r;}
function add(a,b){var r={};for(var i=0;i<ORDER.length;i++){var k=ORDER[i],v=(a[k]||0)+(b[k]||0);if(v)r[k]=v;}return r;}
function kFactor(k){return k<0?'-'+Math.abs(k):''+k;}

function makeProblem(){
  var form=rnd(0,3),q,ans;
  if(form===0){              // k(ax + b)
    var k=nz(-6,6); if(Math.abs(k)<2)k=(k<0?-2:2);
    var e={x:nz(-9,9),c:nz(-9,9)};
    ans=mul(e,k); q=kFactor(k)+'\\left('+fmtExpr(e)+'\\right)';
  }else if(form===1){        // k(ax + by + c)
    var k=nz(2,7), e={x:nz(-9,9),y:nz(-9,9),c:nz(-9,9)};
    ans=mul(e,k); q=k+'\\left('+fmtExpr(e)+'\\right)';
  }else if(form===2){        // k(ax² + bx + c) — зэрэг нэмэгдэхгүйг онцлох
    var k=nz(2,6), e={x2:nz(-6,6),x:nz(-9,9),c:nz(-9,9)};
    ans=mul(e,k); q=k+'\\left('+fmtExpr(e)+'\\right)';
  }else{                     // a(px+q) ± b(rx+s) → хялбарчлах
    var a=rnd(2,7), b=rnd(2,7), op=rnd(0,1)?1:-1;
    var e1={x:nz(-7,7),c:nz(-7,7)}, e2={x:nz(-7,7),c:nz(-7,7)};
    ans=add(mul(e1,a),mul(e2,op*b));
    q=a+'\\left('+fmtExpr(e1)+'\\right) '+(op>0?'+':'-')+' '+b+'\\left('+fmtExpr(e2)+'\\right)';
  }
  return {q:q,a:fmtExpr(ans)};
}

function build(){
  var probs='',answs='',WS=[];
  for(var i=0;i<16;i++){
    var p=makeProblem(),n=i+1;
    probs+='<div class="q"><div class="qeq"><span class="qn">'+n+'.</span><span class="qm">$'+p.q+' =$</span><span class="bl"></span></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>$'+p.a+'$</span></div>';
    WS.push({q:p.q+' =',a:p.a});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Гишүүнчлэн үржүүлж хялбарчлах</h1><div class="sub">7-р анги · хаалт задлах (тараах хууль) · 16 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule"><b>Дүрэм:</b> хаалтан доторх <b>гишүүн бүрийг</b> гадна талын тоогоор үржүүл: $a(b+c)=ab+ac$. '
    +'Тоогоор үржихэд зөвхөн <b>коэффициент</b> үржинэ, <span class="hl">хувьсагчийн зэрэг ХЭВЭЭР</span> үлдэнэ: $3\\cdot 2x = 6x$ (6x² <b>биш</b>!). '
    +'Сөрөг тоогоор үржихэд тэмдэг солигдоно. Эцэст нь ижил гишүүдийг нэгтгэ.</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='Гишүүнчлэн үржүүлж хялбарчлах (7-р анги)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=10"></script>
</body>
</html>
