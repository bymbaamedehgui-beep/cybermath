    return {
      q: 'Агуулахад $' + n + '$ хайрцаг байна. Хайрцаг тус бүрд $10$ ширхэг шилэн аяга хийжээ. Нийт хэдэн шилэн аяга байгаа вэ?',
      a: '$' + n + '\\times 10=' + nf(n * 10) + '$ (ширхэг)',
      key: '305t10:' + n
    };
  }
  var m = rnd(12, 98);
  return {
    q: 'Нэг боодолд $100$ ширхэг цаас байдаг. $' + m + '$ боодолд нийт хэдэн ширхэг цаас байх вэ?',
    a: '$' + m + '\\times 100=' + nf(m * 100) + '$ (ширхэг)',
    key: '305t100:' + m
  };
}

// ══════════ 2-р хуудас: аравтаар хуваах, үлдэгдэл, зүй тогтол ══════════

// 640 «280÷40, 720÷20»: дугуй аравтад баганаар хуваах
function g_105_divTensCol() {
  var b = pick([20, 30, 40, 50, 60, 70, 80, 90]), q0 = rnd(12, 99), a = q0 * b;
  if (a > 9999) return null;
  var c = colDiv(a, b);
  return {
    q: '$' + nf(a) + '\\div ' + b + '$',
    a: '$' + divAnsTex(a, b) + '$',
    key: h3_105_T(q0, b), col: c.q, sol: c.s
  };
}

// 649 «120×30», 653-2: дугуй аравтаар баганаар үржүүлэх
function g_105_mulTens() {
  var b = pick([20, 30, 40, 50, 60, 70, 80, 90]);
  var hi = Math.floor(10000 / b), a;
  if (pick([0, 1]) === 0) a = rnd(11, Math.min(99, hi));
  else a = rnd(2, Math.floor(hi / 10)) * 10;
  if (a < 11 || a * b > 10000) return null;
  // a нь 100-ийн карат бол (100, 200 … 500) бодлого «тэг нэмэх» болж хувирч,
  // 1-р хуудасны $100\times b$-тэй ЯГ ижил асуулт болно → хасна.
  if (a % 100 === 0) return null;
  var c = colMul(a, b);
  return {
    q: '$' + nf(a) + '\\times ' + b + '$',
    a: '$' + mulAnsTex(a, b) + '$',
    key: h3_105_T(a, b), col: c.q, sol: c.s
  };
}

// 642 «3160 ÷ 100»: төгсгөлд нь хангалттай тэг байхгүй үед үлдэгдэлтэй ногдвор
function g_105_divRem10() {
  var d = pick([10, 100]), q0, r;
  if (d === 10) { q0 = rnd(12, 999); r = rnd(1, 9); }
  else { q0 = rnd(11, 99); r = rnd(1, 99); }
  var a = q0 * d + r;
  if (a > 9999) return null;
  return {
    q: '$' + nf(a) + '\\div ' + d + '$',
    a: '$' + divAnsTex(a, d) + '$',
    key: '305dr:' + a + '/' + d
  };
}

// 647б, 653-2: урвуу үйлдлээр хоосон нүдний тоог олох
function g_105_blank() {
  var t = rnd(0, 3), d = pick([10, 100]), n = rnd(12, 99);
  if (t === 0) return {
    q: '$\\square\\times ' + d + '=' + nf(n * d) + '$',
    a: '$' + nf(n * d) + '\\div ' + d + '=' + nf(n) + '$ тул $\\square=' + nf(n) + '$',
    key: h3_105_T(n, d)
  };
  if (t === 1) return {
    q: '$' + nf(n * d) + '\\div\\square=' + nf(n) + '$',
    a: '$' + nf(n * d) + '\\div ' + nf(n) + '=' + d + '$ тул $\\square=' + d + '$',
    key: h3_105_T(n, d)
  };
  if (t === 2) return {
    q: '$\\square\\div ' + d + '=' + nf(n) + '$',
    a: '$' + nf(n) + '\\times ' + d + '=' + nf(n * d) + '$ тул $\\square=' + nf(n * d) + '$',
    key: h3_105_T(n, d)
  };
  return {
    q: '$' + nf(n) + '\\times\\square=' + nf(n * d) + '$',
    a: '$' + nf(n * d) + '\\div ' + nf(n) + '=' + d + '$ тул $\\square=' + d + '$',
    key: h3_105_T(n, d)
  };
}

// 648 «2400÷100 → 4800÷200»: хуваагдагч, хуваагчийг хоёуланг нь ижил дахин өөрчлөх
// Энэ бодлого ХОЁР факт илчилнэ (өгөгдсөн ба асуусан), key нь ганц — тиймээс
// b-г ЗӨВХӨН 100 болгож, B = 100k ∈ {200,300,400,500} болгоно. Тэр хүрээг хуудасны
// өөр ямар ч генератор гаргахгүй (divTensCol/mulTens-ийн аравт ≤ 90, mulTens-ээс
// 100-ийн каратыг хассан) тул цорын цагаан эрсдэлтэй факт нь q0×100 — key-г түүн
// дээр тавина. Ингэснээр чиглэл хамаарахгүй blank/div100-той давхардахаа болино.
function g_105_chain() {
  var k = pick([2, 3, 4, 5]), b = 100;
  var hi = Math.floor(9999 / (b * k));
  if (hi < 12) return null;
  var q0 = rnd(12, Math.min(hi, 99)), a = q0 * b, A = a * k, B = b * k;
  if (pick([0, 1]) === 0) return {
    q: '$' + nf(a) + '\\div ' + nf(b) + '=' + nf(q0) + '$ бол $' + nf(A) + '\\div ' + nf(B) + '$-ийн утгыг ол.',
    a: 'Хуваагдагч, хуваагч хоёулаа $' + k + '$ дахин ихэссэн тул ногдвор өөрчлөгдөхгүй: $' + nf(A) + '\\div ' + nf(B) + '=' + nf(q0) + '$',
    key: h3_105_T(q0, b)
  };
  return {
    q: '$' + nf(A) + '\\div ' + nf(B) + '=' + nf(q0) + '$ бол $' + nf(a) + '\\div ' + nf(b) + '$-ийн утгыг ол.',
    a: 'Хуваагдагч, хуваагч хоёулаа $' + k + '$ дахин багассан тул ногдвор өөрчлөгдөхгүй: $' + nf(a) + '\\div ' + nf(b) + '=' + nf(q0) + '$',
    key: h3_105_T(q0, b)
  };
}

// 642: мөнгөө 100 (эсвэл 10) төгрөгийн барааанд хуваарилах — үлдэгдэлтэй үгэн бодлого
function g_105_wordBuy() {
  if (pick([0, 1]) === 0) {
    var k = rnd(12, 95), r = rnd(10, 90), tot = k * 100 + r;
    return {
      q: 'Халиун наадаг зураг цуглуулдаг. Зураг тус бүр $100$ төгрөгийн үнэтэй. Түүнд $' + nf(tot) + '$ төгрөг байгаа бол хамгийн олондоо хэдэн зураг авч чадах вэ? Хэдэн төгрөг үлдэх вэ?',
      a: '$' + nf(tot) + '\\div 100=' + nf(k) + '\\text{ (үлд }' + r + '\\text{)}$ — $' + k + '$ зураг авч, $' + r + '$ төгрөг үлдэнэ.',
      key: '305dr:' + tot + '/100'          // divRem10-тай НИЙТЛЭГ орон зай
    };
  }
  var n = rnd(11, 97), r2 = rnd(1, 9), tot2 = n * 10 + r2;
  return {
    q: 'Цэцэрлэгт $' + nf(tot2) + '$ ширхэг алим ирлээ. Нэг саванд $10$ алим багтана. Хэдэн сав дүүрэн дүүргэж, хэдэн алим үлдэх вэ?',
    a: '$' + nf(tot2) + '\\div 10=' + nf(n) + '\\text{ (үлд }' + r2 + '\\text{)}$ — $' + n + '$ сав дүүрч, $' + r2 + '$ алим үлдэнэ.',
    key: '305dr:' + tot2 + '/10'
  };
}

// ══════════ 3-р хуудас: хэмжээний нэгж шилжүүлэх ══════════

// 659: том нэгжээс жижиг нэгж рүү — үржүүлнэ
function g_105_unitTo() {
  var u = pick(h3_105_units()), n = h3_105_n(u.k), v = n * u.k;
  if (v > 10000) return null;
  return {
    q: '$' + nf(n) + h3_105_u(u.b) + '=\\square' + h3_105_u(u.s) + '$',
    a: '$1' + h3_105_u(u.b) + '=' + nf(u.k) + h3_105_u(u.s) + '$ тул $' + nf(n) + '\\times ' + nf(u.k) + '=' + nf(v) + '$ → $' + nf(v) + h3_105_u(u.s) + '$',
    key: '305u:' + u.b + u.s + ':' + n
  };
}

// 659: жижиг нэгжээс том нэгж рүү — хуваана
function g_105_unitFrom() {
  var u = pick(h3_105_units()), n = h3_105_n(u.k), v = n * u.k;
  if (v > 10000) return null;
  return {
    q: '$' + nf(v) + h3_105_u(u.s) + '=\\square' + h3_105_u(u.b) + '$',
    a: '$' + nf(u.k) + h3_105_u(u.s) + '=1' + h3_105_u(u.b) + '$ тул $' + nf(v) + '\\div ' + nf(u.k) + '=' + nf(n) + '$ → $' + nf(n) + h3_105_u(u.b) + '$',
    key: '305u:' + u.b + u.s + ':' + n
  };
}

// 659 «8 кг 405 г = ? г», «5805 г = ? кг ? г»: холимог хэмжээг хөрвүүлэх
function g_105_unitMix() {
  var u = pick([
    { b: 'кг', s: 'г', k: 1000 }, { b: 'л', s: 'мл', k: 1000 },
    { b: 'км', s: 'м', k: 1000 }, { b: 'м', s: 'см', k: 100 }, { b: 'м', s: 'дм', k: 10 }
  ]);
  var n, r;
  if (u.k === 1000) { n = rnd(2, 9); r = rnd(1, 999); }
  else if (u.k === 100) { n = rnd(2, 99); r = rnd(1, 99); }
  else { n = rnd(12, 999); r = rnd(1, 9); }
  var v = n * u.k + r;
  if (v > 10000) return null;
  var mix = nf(n) + h3_105_u(u.b) + '\\ ' + nf(r) + h3_105_u(u.s);
  if (pick([0, 1]) === 0) return {
    q: '$' + mix + '=\\square' + h3_105_u(u.s) + '$',
    a: '$' + nf(n) + '\\times ' + nf(u.k) + '=' + nf(n * u.k) + '$, дараа нь $' + nf(n * u.k) + '+' + nf(r) + '=' + nf(v) + '$ → $' + nf(v) + h3_105_u(u.s) + '$',
    key: '305um:' + u.s + ':' + v
  };
  return {
    q: '$' + nf(v) + h3_105_u(u.s) + '=\\square' + h3_105_u(u.b) + '\\ \\square' + h3_105_u(u.s) + '$',
    a: '$' + nf(v) + '\\div ' + nf(u.k) + '=' + nf(n) + '\\text{ (үлд }' + nf(r) + '\\text{)}$ → $' + mix + '$',
    key: '305um:' + u.s + ':' + v
  };
}

// 660 «320 см ☐ 32 дм»: нэгжийг нэгтгэж жиших
// Өмнө нь баруун талд ӨӨР тоо (m = n±2) тавьдаг байсан. Тэр үед бодлого ХОЁР
// шилжүүлэлтийн факт (n ба m) хөндөх ч key нь зөвхөн n-ийг барьдаг тул нэг хуудсан
// дээр «$7000$ г ☐ $5$ кг» ба «$5$ кг $=\square$ г» хоёр зэрэг гарч, хариуг илчилдэг.
// Одоо баруун талд ЯГ n-ийг тавьж, зүүн талын жижиг нэгжийн утгыг л хазайлгана:
// L = n·k + δ, δ нь k/10-ийн 1,2,5 дахин (хэзээ ч k-ийн карат болохгүй) → цорын
// ганц факт нь n·k тул key түүнийг бүрэн барина. Жиших нь бас илүү бодитой болов.
function g_105_unitCmp() {
  var u = pick(h3_105_units()), n = h3_105_n(u.k);
  var d = pick([0, 0, 1, 2, 5, -1, -2, -5]) * (u.k / 10);
  var L = n * u.k + d, R = n * u.k;
  if (L < 1 || L > 10000 || R > 10000) return null;
  var sg = L > R ? '\\gt' : (L < R ? '\\lt' : '=');
  return {
    q: '$' + nf(L) + h3_105_u(u.s) + '\\ \\square\\ ' + nf(n) + h3_105_u(u.b) + '$',
    a: '$' + nf(n) + h3_105_u(u.b) + '=' + nf(R) + h3_105_u(u.s) + '$ тул $' + nf(L) + h3_105_u(u.s) + '\\ ' + sg + '\\ ' + nf(n) + h3_105_u(u.b) + '$',
    key: '305u:' + u.b + u.s + ':' + n
  };
}

// 649: хоногийн хэрэглээг 10, 30 хоногоор үржүүлэх + үнийн тооцоо
// KEY: зөвхөн d. Өмнө '305ww:d:p' байсан тул нэг d-тэй, өөр p-тэй хоёр бодлого нэг
// хуудсан дээр зэрэг гарч (cap=2) асуултын гурван мөрөөс хоёр нь үг үгээрээ давхардаж
// байв. Хоногийн хэрэглээг 60-150 болгож өргөтгөв (key-ийн сан 7 → 13).
function g_105_wordWater() {
  var d = pick([60, 70, 80, 90, 100, 110, 120, 130, 140, 150]), p = pick([2, 3]);
  var m10 = d * 10, m30 = d * 30, cost = m30 * p;
  if (cost > 10000) return null;
  return {
    q: 'Нэг айл хоногт $' + d + '$ литр ус хэрэглэдэг. $10$ хоногт, мөн $30$ хоногт хэдэн литр ус хэрэглэх вэ? Нэг литр ус $' + p + '$ төгрөг бол $30$ хоногийн усны төлбөр хэд болох вэ?',
    a: '$' + d + '\\times 10=' + nf(m10) + '$ л; $' + d + '\\times 30=' + nf(m30) + '$ л; $' + nf(m30) + '\\times ' + p + '=' + nf(cost) + '$ төгрөг',
    key: '305ww:' + d
  };
}

// 645, 652: хэмжээний нэгж бүхий үгэн бодлого
// KEY-ийг нэгжийн НИЙТЛЭГ орон зайд тавина — эс тэгвэл нэг хуудсан дээр
//   «$3$ л $=\square$ мл» ба «$3$ хайрцаг × $1$ л», мөн
//   «$5000$ г $=\square$ кг» ба «$50$ уут × $100$ г» зэрэг гарч байв.
function g_105_wordUnit() {
  var v = rnd(0, 2);
  if (v === 0) {
    var n = rnd(3, 9);
    return {
      q: 'Жүүсний нэг хайрцагт $1$ литр жүүс багтана. $' + n + '$ хайрцагт нийт хэдэн миллилитр жүүс байх вэ?',
      a: '$1$ л $=1000$ мл тул $' + n + '\\times 1000=' + nf(n * 1000) + '$ мл',
      key: '305u:лмл:' + n
    };
  }
  if (v === 1) {
    var k = rnd(2, 9) * 10;
    return {
      q: 'Нэг уут элсэн чихрийн жин $100$ грамм. $' + k + '$ уут чихэр нийт хэдэн грамм, хэдэн килограмм вэ?',
      a: '$' + k + '\\times 100=' + nf(k * 100) + '$ г; $' + nf(k * 100) + '\\div 1000=' + (k / 10) + '$ кг',
      key: '305u:кгг:' + (k / 10)
    };
  }
  var L = rnd(2, 4), M = rnd(1, 9) * 50, tot = L * 1000 + M;
  return {
    q: 'Нэг савны багтаамж $' + L + '$ л $' + M + '$ мл. Ийм хоёр сав ус нийт хэдэн миллилитр вэ?',
    a: '$' + L + '$ л $' + M + '$ мл $=' + nf(tot) + '$ мл; $' + nf(tot) + '\\times 2=' + nf(tot * 2) + '$ мл',
    key: '305um:мл:' + tot
  };
}

// ───────── g3ch1.sub06.js ─────────
// ─────────────────────────────────────────────────────────────────────────────
// 3-р анги · I бүлэг · 1.06 — Хэд хэдэн үйлдэлтэй илэрхийлэл
// Сурах бичгийн 99, 101–103, 129–136-р хуудас (PDF 5, 7–9, 35–42)
// Номын дасгалын хэлбэр → генератор:
//   454  «3908 ÷ 4 + 7265», «4829 + 4290 − 1925»          → g_106_divAdd, g_106_mulAdd
//   463  «2750 + 399 × 8»                                  → g_106_mulAdd, g_106_colMulAdd
//   463  «5149 − 1750 ÷ 5», «3208 ÷ 8 + 5099»              → g_106_mulSub, g_106_colDivSub
//   463  «5607 + (5110 − 2915)»                            → g_106_parenSum
//   650в «(28 + 15) × 4  ба  28 × 4 + 15 × 4»              → g_106_pairBox, g_106_cmp
//   664  «(□ + □) × 8 — аль илэрхийлэл зөв бэ?»            → g_106_box1, g_106_insParen
//   651  «775 − 55, үлдсэнийг 9 сургуульд тэнцүү хуваав»   → g_106_parenDiv, g_106_wordParen
//   470  «эхний 3 цагт 80 км, дараагийн 3 цагт 75 км»      → g_106_three, g_106_word3
//   479  «4 × 700 + 6 × 650 + 8 × 350»                     → g_106_word3
//   662  «2 өдөр × 40 мин + 3 өдөр × 35 мин»               → g_106_word3
//   671  «4000 г будаг − 20 ширээ × 150 г»                 → g_106_word2
//   672, 635 «хэд хэдэн үйлдэлтэй үгэн бодлого»            → g_106_word2, g_106_wordParen
// Хүрээ: 10 000 хүртэлх бүхэл тоо. Үржих = олон оронтой × нэг оронтой,
//        хуваах = бүтэн хуваагдах, хуваагч нэг оронтой. Сөрөг тоо, бутархай алга.
// g3core.js энэ файлын ӨМНӨ залгагдана.

// ───────── туслахууд ─────────
// b (2–3 оронтой) × c (1 оронтой); үржвэр maxProd-оос хэтрэхгүй
function h3_106_mulPair(maxProd) {
  var c = rnd(2, 9), hi = Math.floor(maxProd / c);
  if (hi < 120) return null;
  var b = rnd(101, Math.min(999, hi));
  return { b: b, c: c, p: b * c };
}
// b ÷ c бүтэн хуваагдана; b нь maxDnd-оос хэтрэхгүй, дор хаяж 3 оронтой
function h3_106_divPair(maxDnd) {
  var c = rnd(2, 9), hi = Math.min(999, Math.floor(maxDnd / c)), lo = Math.max(21, Math.ceil(100 / c));
  if (hi < lo + 5) return null;
  var q = rnd(lo, hi), b = q * c;
  if (b < 100 || b > 9999) return null;
  return { b: b, c: c, q: q };
}
// Монгол ахуйд ойр нэрсийн сан
var H3_106_BOX = ['хайрцаг', 'боодол', 'багц'];
// ── key-ийн НИЙТЛЭГ орон зай ──
// Хуудасны seen-guard нь БҮХ даалгаварт нэг л объект (genPool). Иймд ялгаатай
// функц ижил харагдах асуулт гаргавал key нь ЯГ ижил байж давхардлыг барих ёстой.
// Тийм учраас key-г функцийн нэрээр биш, ХАРАГДАХ асуултаар тодорхойлно.
function h3_106_ek(ex) { return '306e:' + String(ex).replace(/\s+/g, ''); }
function h3_106_wk(q) { return '306w:' + String(q).replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim(); }

// ══════════ 1-р хуудас: хаалтгүй, хоёр үйлдэлтэй ══════════

// 463: «2750 + 399 × 8», 454: «3908 × 4 + 7265» — үржвэрийг эхэлж олно
function g_106_mulAdd() {
  var m = h3_106_mulPair(4200); if (!m) return null;
  var a = rnd(201, 9999 - m.p);
  var fw = rnd(0, 1);
  var ex = fw ? nf(m.b) + '\\times ' + m.c + ' + ' + nf(a) : nf(a) + ' + ' + nf(m.b) + '\\times ' + m.c;
  var st = fw ? nf(m.p) + ' + ' + nf(a) : nf(a) + ' + ' + nf(m.p);
  return {
    q: '$' + ex + '$',
    a: '$' + ex + '=' + st + '=' + nf(a + m.p) + '$',
    key: h3_106_ek(ex)
  };
}

// 463: эхний алхмыг таних — үржих/хуваахыг эхэлж хийгээд дараа нь хасна.
// 1-р хуудасны бусад даалгавар a+b×c, b×c+a, b÷c+a, a+b÷c, a−b×c, a−b÷c хэлбэрийг
// аль хэдийн эзэлсэн. Давхардахгүйн тулд энд ЗӨВХӨН b×c−a ба b÷c−a хэлбэрийг гаргана.
function g_106_firstStep() {
  var t = rnd(0, 1);
  if (t === 0) {
    var m = h3_106_mulPair(4200); if (!m || m.p < 300) return null;
    var a = rnd(101, m.p - 150);
    var ex = nf(m.b) + '\\times ' + m.c + ' - ' + nf(a);
    return {
      q: '$' + ex + '$',
      a: 'Эхэлж үржих: $' + nf(m.b) + '\\times ' + m.c + '=' + nf(m.p) + '$. Бүтэн утга нь $' + ex + '=' + nf(m.p - a) + '$',
      key: h3_106_ek(ex)
    };
  }
  var d = h3_106_divPair(9000); if (!d || d.q < 45) return null;
  var a2 = rnd(21, d.q - 20);
  var ex2 = nf(d.b) + '\\div ' + d.c + ' - ' + nf(a2);
  return {
    q: '$' + ex2 + '$',
    a: 'Эхэлж хуваах: $' + nf(d.b) + '\\div ' + d.c + '=' + nf(d.q) + '$. Бүтэн утга нь $' + ex2 + '=' + nf(d.q - a2) + '$',
    key: h3_106_ek(ex2)
  };
}

// 454: «3908 ÷ 4 + 7265» — ногдворыг эхэлж олно
function g_106_divAdd() {
  var d = h3_106_divPair(9000); if (!d) return null;
  var a = rnd(201, 9999 - d.q);
  var fw = rnd(0, 1);
  var ex = fw ? nf(d.b) + '\\div ' + d.c + ' + ' + nf(a) : nf(a) + ' + ' + nf(d.b) + '\\div ' + d.c;
  var st = fw ? nf(d.q) + ' + ' + nf(a) : nf(a) + ' + ' + nf(d.q);
  return {
    q: '$' + ex + '$',
    a: '$' + ex + '=' + st + '=' + nf(a + d.q) + '$',
    key: h3_106_ek(ex)
  };
}

// 463: «5149 − 1750 ÷ 5» загварын хасах хувилбар — үржвэрийг эхэлж олно
function g_106_mulSub() {
  var m = h3_106_mulPair(4200); if (!m) return null;
  var a = rnd(m.p + 150, 9999);
  var ex = nf(a) + ' - ' + nf(m.b) + '\\times ' + m.c;
  return {
    q: '$' + ex + '$',
    a: '$' + ex + '=' + nf(a) + ' - ' + nf(m.p) + '=' + nf(a - m.p) + '$',
    key: h3_106_ek(ex)
  };
}

// 463: «5149 − 1750 ÷ 5» — ногдворыг БАГАНААР бодоод, дараа нь хасна
function g_106_colDivSub() {
  var d = h3_106_divPair(9000); if (!d) return null;
  if (String(d.b).length < 3) return null;
  var a = rnd(d.q + 200, 9999);
  var c = colDiv(d.b, d.c);
  var ex = nf(a) + ' - ' + nf(d.b) + '\\div ' + d.c;
  return {
    q: '$' + ex + '$',
    a: '$' + nf(d.b) + '\\div ' + d.c + '=' + nf(d.q) + '$, иймд $' + ex + '=' + nf(a) + ' - ' + nf(d.q) + '=' + nf(a - d.q) + '$',
    key: h3_106_ek(ex),
    col: c.q, sol: c.s
  };
}

// 671, 672, 635: хоёр үйлдэлтэй үгэн бодлого
function g_106_word2() {
  var t = rnd(0, 4), qt;
  if (t === 0) {           // 671 загвар: a − n × k
    var g = rnd(30, 60) * 100, n = rnd(8, 24), k = rnd(80, 160);
    if (n * k > g - 200) return null;
    return {
      q: (qt = 'Ангид ' + nt(n) + ' ширээ, ' + nt(g) + ' грамм будаг байв. Нэг ширээг будахад ' + nt(k) + ' грамм будаг ордог. Хэдэн грамм будаг үлдэх вэ?'),
      a: '$' + nf(n) + '\\times ' + nf(k) + '=' + nf(n * k) + '$ (г зарцуулна); $' + nf(g) + ' - ' + nf(n * k) + '=' + nf(g - n * k) + '$ грамм үлдэнэ.',
      key: h3_106_wk(qt)
    };
  }
  if (t === 1) {           // a + n × k
    var a1 = rnd(300, 2500), n1 = rnd(3, 9), k1 = rnd(12, 45), bx = pick(H3_106_BOX);
    if (a1 + n1 * k1 > 9999) return null;
    return {
      q: (qt = 'Номын санд ' + nt(a1) + ' ном байв. Шинээр ' + nt(n1) + ' ' + bx + ' ном авчээ. ' + bx.charAt(0).toUpperCase() + bx.slice(1) + ' тус бүрт ' + nt(k1) + ' ном байсан бол одоо нийт хэдэн ном болсон бэ?'),
      a: '$' + nf(n1) + '\\times ' + nf(k1) + '=' + nf(n1 * k1) + '$ (шинэ ном); $' + nf(a1) + ' + ' + nf(n1 * k1) + '=' + nf(a1 + n1 * k1) + '$ ном болно.',
      key: h3_106_wk(qt)
    };
  }
  if (t === 2) {           // a − n × k (мөнгө)
    var a2 = rnd(40, 95) * 100, n2 = rnd(4, 9), k2 = rnd(3, 9) * 100;
    if (n2 * k2 > a2 - 300) return null;
    return {
      q: (qt = 'Ангийн сурагчид ' + nt(a2) + ' төгрөг цуглуулав. Үүгээрээ ' + nt(n2) + ' ширхэг дэвтэр худалдаж авсан бөгөөд нэг дэвтэр нь ' + nt(k2) + ' төгрөг байв. Хэдэн төгрөг үлдсэн бэ?'),
      a: '$' + nf(n2) + '\\times ' + nf(k2) + '=' + nf(n2 * k2) + '$ төгрөг зарцуулсан; $' + nf(a2) + ' - ' + nf(n2 * k2) + '=' + nf(a2 - n2 * k2) + '$ төгрөг үлдсэн.',
      key: h3_106_wk(qt)
    };
  }
  if (t === 3) {           // 470 загвар: s + n × k
    var s3 = rnd(60, 400), n3 = rnd(2, 6), k3 = rnd(40, 180);
    if (s3 + n3 * k3 > 9999) return null;
    return {
      q: (qt = 'Аялагчид эхний өдөр ' + nt(s3) + ' километр явав. Дараагийн ' + nt(n3) + ' өдөрт өдөр бүр ' + nt(k3) + ' километр явсан бол нийт хэдэн километр замыг туулсан бэ?'),
      a: '$' + nf(n3) + '\\times ' + nf(k3) + '=' + nf(n3 * k3) + '$ км; $' + nf(s3) + ' + ' + nf(n3 * k3) + '=' + nf(s3 + n3 * k3) + '$ км.',
      key: h3_106_wk(qt)
    };
  }
  var c4 = rnd(2, 9), q4 = rnd(20, 120), a4 = c4 * q4, r4 = rnd(5, q4 - 5);   // a ÷ c − r
  if (q4 - r4 < 3) return null;
  return {

  var a3 = rnd(30, 95) * 100, k3 = rnd(20, 60), q1 = rnd(3, 9), q2 = rnd(3, 9);   // a − n1×k − n2×k
  if ((q1 + q2) * k3 > a3 - 300) return null;
  return {
    q: (qt = 'Агуулахад ' + nt(a3) + ' килограмм будаа байв. Өглөө ' + nt(q1) + ' шуудай, оройд ' + nt(q2) + ' шуудай зарсан бөгөөд шуудай бүр ' + nt(k3) + ' килограмм байв. Агуулахад хэдэн килограмм будаа үлдсэн бэ?'),
    a: '$' + nf(a3) + ' - ' + nf(q1) + '\\times ' + nf(k3) + ' - ' + nf(q2) + '\\times ' + nf(k3) + ' = ' + nf(a3) + ' - ' + nf(q1 * k3) + ' - ' + nf(q2 * k3) + ' = ' + nf(a3 - (q1 + q2) * k3) + '$ килограмм.',
    key: h3_106_wk(qt)
  };
}

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);var solo=blocks[g].getAttribute('data-solo')==='1';if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(solo&&qs2.length===1){if(ql)ql.textContent='';map[qs2[i].getAttribute('data-k')]=gr+')';}else{if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk, solo:t.solo};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}

  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.solo?' data-solo="1"':'')+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?(f.col?'<div class="wk wkc">'+f.col+'</div>':'<div class="wk"'+(tk&&tk.wk?' style="height:'+g4wk(tk.wk)+'"':'')+'></div>'):'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+(p.f.sol?'<div class="asol">'+p.f.sol+'</div>':'')+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p||t.solo){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.solo?null:t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
