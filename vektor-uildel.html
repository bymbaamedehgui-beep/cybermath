<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Векторын үйлдэл · зурж нэмэх ба координатаар эмхэтгэх (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--orange:#e0701a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:11mm 13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 24px 2px 4px}
  .rule{font-size:12px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center}
  .sec{font-size:12.5px;font-weight:800;color:#5a32d6;margin:6px 0 8px;display:flex;align-items:center;gap:7px}
  .sec b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;background:var(--purple);color:#fff;font-size:11px}
  .given{font-size:14px;text-align:center;background:#f3eefe;border:1px solid #ddd0fb;border-radius:8px;padding:7px;margin-bottom:10px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:12px}
  .ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .q{break-inside:avoid;page-break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:8px 9px;background:linear-gradient(#fff,#fbf9ff)}
  .q .qn{font-weight:800;color:var(--purple);font-size:12.5px;margin-right:4px}
  .rq{display:flex;gap:8px;align-items:center}.rq .rfig svg{width:138px;height:auto}
  .rq .rt{flex:1;font-size:12.5px}
  .expr{font-size:15px;font-weight:700;margin-bottom:5px}
  .work{height:15mm;border:1.2px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .ansl{font-size:12.5px;font-weight:700;margin-top:5px}.ansl .bl{display:inline-block;min-width:34px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin:0 3px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function vec(x,y){return '\\dbinom{'+x+'}{'+y+'}';}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}

var VB=160, GU=VB/6;
function gx(x){return x*GU;} function gy(y){return VB-y*GU;}
function gridBase(){var s='';
  for(var i=0;i<=6;i++){s+='<line x1="'+gx(i)+'" y1="0" x2="'+gx(i)+'" y2="'+VB+'" stroke="#eceaf6" stroke-width="1"/>';
    s+='<line x1="0" y1="'+gy(i)+'" x2="'+VB+'" y2="'+gy(i)+'" stroke="#eceaf6" stroke-width="1"/>';}
  s+='<line x1="0" y1="'+VB+'" x2="'+(VB+8)+'" y2="'+VB+'" stroke="#555" stroke-width="1.3"/><path d="M'+(VB+8)+' '+VB+' l-5 -3 l0 6 Z" fill="#555"/>';
  s+='<line x1="0" y1="'+VB+'" x2="0" y2="-6" stroke="#555" stroke-width="1.3"/><path d="M0 -6 l-3 5 l6 0 Z" fill="#555"/>';
  s+='<text x="'+(VB+6)+'" y="'+(VB+11)+'" font-size="8" font-style="italic" fill="#666">x</text><text x="4" y="-1" font-size="8" font-style="italic" fill="#666">y</text>';
  for(var k=1;k<=5;k++){s+='<text x="'+(gx(k)-2)+'" y="'+(VB+10)+'" font-size="9" fill="#9a92b5">'+k+'</text>';
    s+='<text x="2" y="'+(gy(k)+3)+'" font-size="9" fill="#9a92b5">'+k+'</text>';}
  return s;
}
function arw(A,B,col){var ax=gx(A[0]),ay=gy(A[1]),bx=gx(B[0]),by=gy(B[1]);
  var dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux;
  return '<line x1="'+ax.toFixed(1)+'" y1="'+ay.toFixed(1)+'" x2="'+bx.toFixed(1)+'" y2="'+by.toFixed(1)+'" stroke="'+col+'" stroke-width="2.2"/>'
    +'<path d="M'+bx.toFixed(1)+' '+by.toFixed(1)+' L'+(bx-8*ux+4*px).toFixed(1)+' '+(by-8*uy+4*py).toFixed(1)+' L'+(bx-8*ux-4*px).toFixed(1)+' '+(by-8*uy-4*py).toFixed(1)+' Z" fill="'+col+'"/>';}
function vlabel(A,B,txt,col){var mx=(gx(A[0])+gx(B[0]))/2,my=(gy(A[1])+gy(B[1]))/2;
  return '<text x="'+(mx+5).toFixed(1)+'" y="'+(my-3).toFixed(1)+'" font-size="11" font-weight="800" font-style="italic" fill="'+col+'">'+txt+'</text>';}
/* Зөвхөн 2 вектор — тэнхлэггүй, сул цэгэн тортой. Сурагч өөрөө нэмж зурна. */
function vecArrow(V,PX,PY,col,lbl){
  var ax=PX(V.tail[0]),ay=PY(V.tail[1]),bx=PX(V.tip[0]),by=PY(V.tip[1]);
  var dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux;
  var s='<line x1="'+ax.toFixed(1)+'" y1="'+ay.toFixed(1)+'" x2="'+bx.toFixed(1)+'" y2="'+by.toFixed(1)+'" stroke="'+col+'" stroke-width="2.4"/>'
    +'<path d="M'+bx.toFixed(1)+' '+by.toFixed(1)+' L'+(bx-9*ux+4.5*px).toFixed(1)+' '+(by-9*uy+4.5*py).toFixed(1)+' L'+(bx-9*ux-4.5*px).toFixed(1)+' '+(by-9*uy-4.5*py).toFixed(1)+' Z" fill="'+col+'"/>';
  var mx=(ax+bx)/2+7*px, my=(ay+by)/2+7*py;
  s+='<text x="'+mx.toFixed(1)+'" y="'+(my+3).toFixed(1)+'" font-size="13" font-weight="800" font-style="italic" fill="'+col+'" text-anchor="middle">'+lbl+'</text>';
  return s;
}
function drawTwo(v){
  var W=7,H=6,u=20,pad=14, ww=(W-1)*u+2*pad, hh=(H-1)*u+2*pad;
  function PX(x){return pad+x*u;} function PY(y){return pad+(H-1-y)*u;}
  var s='<svg viewBox="0 0 '+ww+' '+hh+'" xmlns="http://www.w3.org/2000/svg">';
  for(var i=0;i<W;i++)for(var j=0;j<H;j++)s+='<circle cx="'+PX(i)+'" cy="'+PY(j)+'" r="1" fill="#dcd6ef"/>';
  s+=vecArrow(v.a,PX,PY,'#2f6cae','a')+vecArrow(v.b,PX,PY,'#16a34a','b');
  s+='</svg>';return s;
}
var EXPR=[
 {t:'\\vec a+\\vec b',f:function(a,b){return [a[0]+b[0],a[1]+b[1]];}},
 {t:'\\vec a-\\vec b',f:function(a,b){return [a[0]-b[0],a[1]-b[1]];}},
 {t:'\\vec b-\\vec a',f:function(a,b){return [b[0]-a[0],b[1]-a[1]];}},
 {t:'2\\vec a',f:function(a,b){return [2*a[0],2*a[1]];}},
 {t:'3\\vec b',f:function(a,b){return [3*b[0],3*b[1]];}},
 {t:'-2\\vec a',f:function(a,b){return [-2*a[0],-2*a[1]];}},
 {t:'2\\vec a+\\vec b',f:function(a,b){return [2*a[0]+b[0],2*a[1]+b[1]];}},
 {t:'3\\vec a-2\\vec b',f:function(a,b){return [3*a[0]-2*b[0],3*a[1]-2*b[1]];}},
 {t:'\\vec a+3\\vec b',f:function(a,b){return [a[0]+3*b[0],a[1]+3*b[1]];}},
 {t:'-\\vec a+2\\vec b',f:function(a,b){return [-a[0]+2*b[0],-a[1]+2*b[1]];}}
];
function angBetween(a,b){var d=a[0]*b[0]+a[1]*b[1],la=Math.hypot(a[0],a[1]),lb=Math.hypot(b[0],b[1]);return Math.acos(Math.max(-1,Math.min(1,d/((la*lb)||1))))*180/Math.PI;}
function mkComp(){var dx=nz(-4,4),dy=nz(-4,4);
  if(Math.abs(dx)+Math.abs(dy)<3||Math.hypot(dx,dy)>5)return null;
  return [dx,dy];}
/* Гурвалжны дүрэм: b векторын ЭХЛЭЛ нь a векторын ТӨГСГӨЛД давхцана (тэнхлэггүй) */
function genTwo(){var W=7,H=6,tr=0;
  while(tr++<400){
    var ax=rnd(0,W-1),ay=rnd(0,H-1);
    var ac=mkComp();if(!ac)continue;
    var atip=[ax+ac[0],ay+ac[1]];
    if(atip[0]<0||atip[0]>W-1||atip[1]<0||atip[1]>H-1)continue;
    var bc=mkComp();if(!bc)continue;
    var btip=[atip[0]+bc[0],atip[1]+bc[1]];
    if(btip[0]<0||btip[0]>W-1||btip[1]<0||btip[1]>H-1)continue;
    var ang=angBetween(ac,bc);if(ang<25||ang>155)continue;
    return {a:{tail:[ax,ay],comp:ac,tip:atip},b:{tail:atip,comp:bc,tip:btip},sig:ac.join()+'|'+bc.join()};
  }
  return {a:{tail:[1,1],comp:[3,1],tip:[4,2]},b:{tail:[4,2],comp:[-1,3],tip:[3,5]},sig:'f'};}

function build(){
  var d1='',a1='',o='',ao='',items=[],seen={},n=0,i;
  for(i=0;i<4;i++){var t=0,g;do{g=genTwo();t++;}while(seen[g.sig]&&t<60);seen[g.sig]=1;n++;
    d1+='<div class="q"><div class="rq"><div class="rfig">'+drawTwo(g)+'</div>'
      +'<div class="rt"><span class="qn">'+n+'.</span> <span style="color:#2f6cae;font-weight:800">$\\vec a$</span>-гийн төгсгөлөөс <span style="color:#16a34a;font-weight:800">$\\vec b$</span> эхэлж байна. Гурвалжны дүрмээр <b>нэмж</b> $\\vec a+\\vec b$-г зур.</div></div></div>';
    items.push({q:'Векторыг зурж нэмэх',a:'зурж байгуулна'});}
  var a=[nz(-5,5),nz(-5,5)],b=[nz(-5,5),nz(-5,5)];
  var ex=shuffle(EXPR.slice()).slice(0,8);
  for(i=0;i<ex.length;i++){var e=ex[i],r=e.f(a,b);n++;
    o+='<div class="q"><span class="qn">'+n+'.</span> <span class="expr">$'+e.t+'=$</span>'
      +'<div class="work"></div><div class="ansl">= (<span class="bl"></span>,<span class="bl"></span>)</div></div>';
    ao+='<div class="a"><span class="an">'+n+'.</span><span>$'+e.t+'='+vec(r[0],r[1])+'$</span></div>';
    items.push({q:e.t,a:'('+r[0]+','+r[1]+')'});}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Векторын үйлдэл</h1><div class="sub">Векторыг зурж нэмэх · координатаар нэмэх·хасах·тоогоор үржүүлж эмхэтгэх · 9-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$\\vec a\\pm\\vec b=\\dbinom{a_1\\pm b_1}{a_2\\pm b_2}$ &nbsp;·&nbsp; $k\\vec a=\\dbinom{k\\,a_1}{k\\,a_2}$</div>'
    +'<div class="sec"><b>1</b> Векторыг гурвалжны дүрмээр нэмэх ($\\vec a+\\vec b$-г байгуул)</div><div class="dgrid">'+d1+'</div>'
    +'<div class="sec"><b>2</b> Координатаар үйлдэл хийж эмхэтгэ</div>'
    +'<div class="given">$\\vec a='+vec(a[0],a[1])+'$ &nbsp;&nbsp; $\\vec b='+vec(b[0],b[1])+'$</div>'
    +'<div class="ogrid">'+o+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2>'
      +'<div style="font-size:12.5px;font-weight:700;margin-bottom:6px">$\\vec a='+vec(a[0],a[1])+'$, $\\vec b='+vec(b[0],b[1])+'$</div>'
      +'<div class="ans-grid">'+a1+ao+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Векторын үйлдэл';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=18"></script>
</body>
</html>
