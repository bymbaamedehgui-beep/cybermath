<!DOCTYPE html>
<html lang="mn">

<title>III бүлэг — Жишиг даалгавар 1 (8-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 8-р анги · III бүлэг. Магадлал — Жишиг даалгавар 1 (3.1 Олонлог, түүн дээрх үйлдэл · 3.2 Нийцтэй ба нийцгүй үзэгдлүүд) */
// ── олонлог: тоон элемент шууд, үсгэн элемент (СТ, ССТ …) \text{}-д ──
function el(x) { return typeof x === 'number' ? String(x) : '\\text{' + x + '}'; }
function setTex(a) { return a.length ? '\\{' + a.map(el).join(',\\ ') + '\\}' : '\\varnothing'; }
function byNum(x, y) { return x - y; }
function inter(a, b) { return a.filter(function (x) { return b.indexOf(x) >= 0; }); }
function minus(a, b) { return a.filter(function (x) { return b.indexOf(x) < 0; }); }
// нэгдэл: om өгвөл түүний дарааллаар, эс бөгөөс өсөхөөр
function union(a, b, om) { var r = a.concat(minus(b, a)); return om ? om.filter(function (x) { return r.indexOf(x) >= 0; }) : r.sort(byNum); }
function rset(lo, hi, k) { var s = []; while (s.length < k) { var v = rnd(lo, hi); if (s.indexOf(v) < 0) s.push(v); } return s.sort(byNum); }
function divs(n) { var r = []; for (var d = 1; d <= n; d++) if (n % d === 0) r.push(d); return r; }
function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }
function S(nm, a) { return '$' + nm + '=' + setTex(a) + '$'; }          // «A∪B={…}» хариуны хэсэг
// «нэр» — нэр томьёогоор эхэлбэл нээх хашилтыг томьёотой нь нэг мөрөнд үлдээнэ («» мөрийн төгсгөлд ганцаараа үлдэхгүй)
function qt(s) { if (s.charAt(0) !== '$') return '«' + s + '»'; var k = s.indexOf('$', 1) + 1; return '<span style="white-space:nowrap">«' + s.slice(0, k) + '</span>' + s.slice(k) + '»'; }
// Шоо орхих үзэгдлүүд: [нэр («… буух»-ийн өмнөх хэсэг), эгэл үзэгдлүүд]
var DIEV = [['тэгш тоо', [2, 4, 6]], ['сондгой тоо', [1, 3, 5]], ['анхны тоо', [2, 3, 5]], ['$3$ тоонд хуваагдах тоо', [3, 6]],
  ['$4$ тооноос их тоо', [5, 6]], ['$3$ тооноос их тоо', [4, 5, 6]], ['$3$ тооноос бага тоо', [1, 2]], ['$4$ тооноос бага тоо', [1, 2, 3]],
  ['$2$ тооноос их тоо', [3, 4, 5, 6]], ['$6$', [6]], ['$1$', [1]], ['$5$ тооноос бага тоо', [1, 2, 3, 4]], ['$2$ эсвэл $5$', [2, 5]]];
// Хоёр зоос: С — сүлд, Т — тоо (эхний үсэг — эхний зоос)
var COIN = ['СС', 'СТ', 'ТС', 'ТТ'];
var COINEV = [['хоёулаа сүлд буух', ['СС']], ['яг нэг сүлд буух', ['СТ', 'ТС']], ['ядаж нэг сүлд буух', ['СС', 'СТ', 'ТС']], ['сүлд огт буухгүй байх', ['ТТ']],
  ['хоёулаа ижил талаараа буух', ['СС', 'ТТ']], ['ядаж нэг тоо буух', ['СТ', 'ТС', 'ТТ']], ['эхний зоос сүлд буух', ['СС', 'СТ']], ['хоёр дахь зоос тоо буух', ['СТ', 'ТТ']]];

// 1. [3.1] Олонлог дээрх үйлдэл: нэгдэл, огтлолцол, ялгавар — жагсаасан олонлог, хуваагчдын олонлог, гурван олонлог (Жишээ 2, Дасгал 4)
function g1() {
  var t = rnd(1, 5);
  if (t <= 3) {
    var A = rset(1, 15, rnd(4, 6)), B = rset(1, 15, rnd(3, 5)), I = inter(A, B); if (!I.length || I.length === A.length || I.length === B.length) return null;
    return { stem: '${A=' + setTex(A) + '}$, ${B=' + setTex(B) + '}$; $\\ {A\\cup B}$, ${A\\cap B}$, ${A\\setminus B}$',
      a: S('{A\\cup B}', union(A, B)) + '; ' + S('{A\\cap B}', I) + '; ' + S('{A\\setminus B}', minus(A, B)) };
  }
  if (t === 4) {
    var P = pick([[12, 18], [12, 20], [18, 24], [16, 24], [20, 30], [15, 20], [18, 30], [12, 30], [14, 21], [10, 25], [9, 12], [8, 20], [15, 25], [20, 24]]), A2 = divs(P[0]), B2 = divs(P[1]);
    return { stem: '$A$ — $' + P[0] + '$ тооны бүх хуваагчийн, $B$ — $' + P[1] + '$ тооны бүх хуваагчийн олонлог; $\\ {A\\cap B}$, ${A\\setminus B}$, ${B\\setminus A}$',
      a: S('{A\\cap B}', inter(A2, B2)) + '; ' + S('{A\\setminus B}', minus(A2, B2)) + '; ' + S('{B\\setminus A}', minus(B2, A2)) };
  }
  var A3 = rset(1, 10, rnd(4, 5)), B3 = rset(1, 10, rnd(4, 5)), C3 = rset(1, 10, rnd(3, 5));
  var E = pick([['({A\\cup B})\\cap C', function () { return inter(union(A3, B3), C3); }], ['({A\\cap B})\\cup C', function () { return union(inter(A3, B3), C3); }],
    ['A\\cap(B\\cup C)', function () { return inter(A3, union(B3, C3)); }], ['({A\\setminus B})\\cup C', function () { return union(minus(A3, B3), C3); }],
    ['A\\setminus(B\\cup C)', function () { return minus(A3, union(B3, C3)); }], ['({A\\cap B})\\setminus C', function () { return minus(inter(A3, B3), C3); }]]);
  var R = E[1](); if (!R.length || R.length >= 9) return null;
  return { stem: '${A=' + setTex(A3) + '}$, ${B=' + setTex(B3) + '}$, ${C=' + setTex(C3) + '}$; $\\ {' + E[0] + '}$', a: S(E[0], R) };
}

// 2. [3.1] Чадлын томьёо |A∪B|=|A|+|B|−|A∩B|, |A∖B|=|A|−|A∩B| ба n элементтэй олонлогийн дэд олонлогийн тоо 2ⁿ (Дасгал 2, 5)
function g2() {
  var t = rnd(1, 4);
  if (t === 4) { var n = rnd(2, 8); return { stem: '$|A|=' + n + '$ бол $A$ олонлогийн дэд олонлогийн тоо', a: '2^{' + n + '}=' + Math.pow(2, n) }; }
  var i = rnd(1, 12), a = i + rnd(2, 15), b = i + rnd(2, 15), u = a + b - i;
  if (t === 1) return { stem: '$|A|=' + a + ',\\ |B|=' + b + ',\\ |{A\\cap B}|=' + i + '$; $\\ |{A\\cup B}|$', a: '|{A\\cup B}|=' + a + '+' + b + '-' + i + '=' + u };
  if (t === 2) return { stem: '$|A|=' + a + ',\\ |B|=' + b + ',\\ |{A\\cup B}|=' + u + '$; $\\ |{A\\cap B}|$', a: '|{A\\cap B}|=' + a + '+' + b + '-' + u + '=' + i };
  return { stem: '$|{A\\cup B}|=' + u + ',\\ |B|=' + b + ',\\ |{A\\cap B}|=' + i + '$; $\\ |{A\\setminus B}|$', a: '|A|=' + u + '-' + b + '+' + i + '=' + a + ',\\ |{A\\setminus B}|=' + a + '-' + i + '=' + (a - i) };
}

// 3. [3.2] Туршилтын хоёр үзэгдлийн нэгдэл, огтлолцлыг бичиж, нийцтэй эсэхийг тогтоох — шоо, тоо сонгох, хоёр зоос (Дасгал 12, 18)
function g3() {
  var t = rnd(1, 4), om, e1, e2, name;
  if (t <= 2) {
    om = range(1, 6); e1 = pick(DIEV); e2 = pick(DIEV); name = 'Шоо орхих';
    e1 = [e1[0] + ' буух', e1[1]]; e2 = [e2[0] + ' буух', e2[1]];
  } else if (t === 3) {
    var N = pick([10, 12]), k = rnd(N / 2 - 2, N / 2 + 2);
    var NE = [['тэгш тоо', function (x) { return x % 2 === 0; }], ['сондгой тоо', function (x) { return x % 2 === 1; }], ['$3$ тоонд хуваагдах тоо', function (x) { return x % 3 === 0; }],
      ['$4$ тоонд хуваагдах тоо', function (x) { return x % 4 === 0; }], ['$5$ тоонд хуваагдах тоо', function (x) { return x % 5 === 0; }],
      ['анхны тоо', function (x) { if (x < 2) return false; for (var d = 2; d * d <= x; d++) if (x % d === 0) return false; return true; }],
      ['$' + k + '$ тооноос их тоо', function (x) { return x > k; }]];
    om = range(1, N); name = '$1, 2, \\dots, ' + N + '$ тоонуудаас нэгийг сонгох';
    e1 = pick(NE); e2 = pick(NE); e1 = [e1[0] + ' байх', om.filter(e1[1])]; e2 = [e2[0] + ' байх', om.filter(e2[1])];
  } else {
    om = COIN; e1 = pick(COINEV); e2 = pick(COINEV); name = 'Хоёр зоос зэрэг орхих (С — сүлд, Т — тоо)';
  }
  if (e1[0] === e2[0] || setTex(e1[1]) === setTex(e2[1])) return null;
  var I = inter(e1[1], e2[1]);
  return { stem: name + '; $A$ — ' + qt(e1[0]) + ', $B$ — ' + qt(e2[0]),
    a: S('{A\\cup B}', union(e1[1], e2[1], om)) + '; ' + S('{A\\cap B}', I) + ' — ' + (I.length ? 'нийцтэй' : 'нийцгүй') };
}

// 4. Өгүүлбэртэй бодлого — 4 төрлийг ээлжлэн: судалгаа (3.1) · хуваагдах тоонуудын олонлог (3.1) · эгэл үзэгдэл тоолох (3.2) · нийцтэй эсэх (3.2)
// Судалгааны бодлого — Эйлер-Веннийн диаграм (Жишээ 3)
function wSurvey() {
  var C = pick([['англи хэл', 'хятад хэл', 'сурдаг', 'сурдаггүй'], ['шатар', 'даам', 'тоглодог', 'тоглодоггүй'], ['хөл бөмбөг', 'сагсан бөмбөг', 'тоглодог', 'тоглодоггүй'], ['гитар', 'төгөлдөр хуур', 'тоглодог', 'тоглодоггүй']]);
  var both = rnd(3, 12), oa = rnd(4, 12), ob = rnd(4, 12), nei = rnd(2, 9), a = both + oa, b = both + ob, un = a + b - both, T = un + nei;
  var head = 'Ангийн $' + T + '$ сурагчийн $' + a + '$ нь ' + C[0] + ', $' + b + '$ нь ' + C[1] + ' ' + C[2] + ', $' + nei + '$ нь алийг нь ч ' + C[3] + '. ';
  var base = '$|{A\\cup B}|=' + T + '-' + nei + '=' + un + '$; $\\ |{A\\cap B}|=' + a + '+' + b + '-' + un + '=' + both + '$', q = rnd(1, 3);
  if (q === 1) return { stem: head + 'Хоёуланг нь ' + C[2] + ' сурагч хэд вэ?', a: base };
  if (q === 2) return { stem: head + 'Зөвхөн ' + C[0] + ' ' + C[2] + ' сурагч хэд вэ?', a: base + '; зөвхөн ' + C[0] + ': $' + a + '-' + both + '=' + oa + '$' };
  return { stem: head + 'Яг нэгийг нь ' + C[2] + ' сурагч хэд вэ?', a: base + '; яг нэг: $' + un + '-' + both + '=' + (oa + ob) + '$' };
}
// 1, 2, …, N тоонуудаас хуваагддаг тоонуудын олонлог (Дасгал 5в)
function wDiv() {
  var pr = pick([[2, 3], [2, 5], [3, 4], [3, 5], [4, 6], [2, 7], [3, 7], [4, 5], [5, 6], [4, 10], [6, 8], [6, 9], [6, 10]]), a = pr[0], b = pr[1], L = lcm(a, b), N = pick([30, 40, 50, 60, 80, 100, 120]);
  if (L > N) return null;
  var A = Math.floor(N / a), B = Math.floor(N / b), AB = Math.floor(N / L), un = A + B - AB;
  return { stem: '$1, 2, \\dots, ' + N + '$ тоонуудаас $' + a + '$ тоонд хуваагддаг нь $A$, $' + b + '$ тоонд хуваагддаг нь $B$ олонлог. $|{A\\cap B}|$, $|{A\\cup B}|$ ба $|{A\\setminus B}|$ чадлуудыг ол.',
    a: '$|A|=' + A + '$, $|B|=' + B + '$; ${A\\cap B}$ нь $' + L + '$ тоонд хуваагдах тоонууд: $|{A\\cap B}|=' + AB + '$; $|{A\\cup B}|=' + A + '+' + B + '-' + AB + '=' + un + '$; $|{A\\setminus B}|=' + A + '-' + AB + '=' + (A - AB) + '$' };
}
// Туршилтын эгэл үзэгдлийн тоо ба үзэгдэлд харьяалагдах эгэл үзэгдлүүд (Дасгал 7, 9, 10, 11)
function wElem() {
  var t = rnd(1, 3);
  if (t === 1) {
    var s = rnd(3, 11), prs = [];
    for (var x = 1; x <= 6; x++) for (var y = 1; y <= 6; y++) if (x + y === s) prs.push('(' + x + ';\\ ' + y + ')');
    return { stem: 'Хоёр шоо зэрэг орхих туршилт хэдэн эгэл үзэгдэлтэй вэ? «Нүднүүдийн нийлбэр $' + s + '$ байх» үзэгдэлд харьяалагдах эгэл үзэгдлүүдийг бич.',
      a: '$6\\cdot 6=36$; $' + prs.join(',\\ ') + '$ — $' + prs.length + '$ эгэл үзэгдэл' };
  }
  if (t === 2) {
    var e = pick(DIEV.filter(function (d) { return d[1].length >= 2; })), side = pick(['сүлд', 'тоо']), L1 = side === 'сүлд' ? 'С' : 'Т';
    return { stem: 'Шоо ба зоос зэрэг орхих туршилт хэдэн эгэл үзэгдэлтэй вэ? «Шоо ' + e[0] + ', зоос ' + side + ' буух» үзэгдэлд харьяалагдах эгэл үзэгдлүүдийг бич.',
      a: '$6\\cdot 2=12$; $' + e[1].map(function (v) { return '(' + v + ';\\ \\text{' + L1 + '})'; }).join(',\\ ') + '$ — $' + e[1].length + '$ эгэл үзэгдэл' };
  }
  var OM3 = ['ССС', 'ССТ', 'СТС', 'СТТ', 'ТСС', 'ТСТ', 'ТТС', 'ТТТ'], hs = function (w) { return w.split('С').length - 1; };
  var EV3 = pick([['яг хоёр сүлд буух', function (w) { return hs(w) === 2; }], ['яг нэг сүлд буух', function (w) { return hs(w) === 1; }], ['ядаж хоёр сүлд буух', function (w) { return hs(w) >= 2; }],
    ['бүх зоос ижил талаараа буух', function (w) { return hs(w) === 0 || hs(w) === 3; }], ['эхний зоос сүлд, сүүлийн зоос тоо буух', function (w) { return w.charAt(0) === 'С' && w.charAt(2) === 'Т'; }]]);
  var R = OM3.filter(EV3[1]);
  return { stem: 'Гурван зоос зэрэг орхих туршилт (С — сүлд, Т — тоо) хэдэн эгэл үзэгдэлтэй вэ? «' + cap(EV3[0]) + '» үзэгдэлд харьяалагдах эгэл үзэгдлүүдийг бич.',
    a: '$2\\cdot 2\\cdot 2=8$; ' + S('A', R) + ' — $' + R.length + '$ эгэл үзэгдэл' };
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
// Үзэгдлүүд нийцтэй эсэхийг судалгаа, хөзрөөр тогтоох (Дасгал 19, 45)
function wCompat() {
  if (rnd(0, 2)) {
    var T = pick([60, 80, 100, 120, 150]), n = rnd(5, 25), un = T - n, both = rnd(0, 2) ? rnd(3, 20) : 0; if (un - 5 < both + 5) return null;
    var a = rnd(both + 5, un - 5), b = un + both - a; if (b < both + 5 || a === b) return null;
    var C = pick([['морь', 'тэмээ', 'унасан', 'унаагүй'], ['завь', 'дугуй', 'унасан', 'унаагүй'], ['музей', 'театр', 'үзсэн', 'үзээгүй']]);
    return { stem: 'Аялалд $' + T + '$ хүн оролцов. Тэдний $' + a + '$ нь ' + C[0] + ', $' + b + '$ нь ' + C[1] + ' ' + C[2] + ', $' + n + '$ нь алийг нь ч ' + C[3] + '. Таамгаар сонгосон хүний хувьд «' + C[0] + ' ' + C[2] + '», «' + C[1] + ' ' + C[2] + '» үзэгдлүүд нийцтэй юу?',
      a: '$|{A\\cup B}|=' + T + '-' + n + '=' + un + '$; $\\ |{A\\cap B}|=' + a + '+' + b + '-' + un + '=' + both + '$ — ' + (both ? 'нийцтэй' : 'нийцгүй') };
  }
  var RK = ['туз', 'ноён', 'хатан', 'боол'], SU = ['тамга', 'бундан', 'гил', 'дөрвөлжин'], k = rnd(1, 3), e1, e2, c;
  if (k === 1) { e1 = pick(RK); e2 = pick(SU); c = 1; }
  else if (k === 2) { e1 = pick(RK); e2 = pick(RK); c = 0; }
  else { e1 = pick(SU); e2 = pick(SU); c = 0; }
  if (e1 === e2) return null;
  return { stem: '$52$ хөзрөөс нэгийг сугалах туршилтад «' + e1 + ' таарах», «' + e2 + ' таарах» үзэгдлүүд нийцтэй юу? Хоёуланд нь харьяалагдах эгэл үзэгдэл хэд вэ?',
    a: c ? 'нийцтэй: хоёуланд нь $1$ хөзөр харьяалагдана' : 'нийцгүй: нийтлэг эгэл үзэгдэлгүй ($0$)' };
}
var K4 = 0;
function g4() {
  var r = [wSurvey, wDiv, wElem, wCompat][K4 % 4]();
  if (r) K4++;
  return r;
}

CMX.jishig({
  title: 'III бүлэг — Жишиг даалгавар 1',
  sub: 'Олонлог ба түүн дээрх үйлдэл · олонлогийн чадал · нийцтэй ба нийцгүй үзэгдэл',
  grade: '8-р анги',
  rule: '$|{A\\cup B}|=|A|+|B|-|{A\\cap B}|$ &nbsp;·&nbsp; $|{A\\setminus B}|=|A|-|{A\\cap B}|$ &nbsp;·&nbsp; $n$ элементтэй олонлог $2^{n}$ дэд олонлогтой &nbsp;·&nbsp; ${A\\cap B}=\\varnothing$ бол $A$, $B$ нийцгүй',
  tasks: [
    { label: 'Олонлог дээрх үйлдлийг гүйцэтгэ.', gen: g1, n: 8, nw: 4, cols: 2, wk: 12 },
    { label: 'Томьёо ашиглан ол.', gen: g2, n: 8, nw: 4, cols: 2, wk: 8 },
    { label: 'Үзэгдлүүдийн нэгдэл, огтлолцлыг бичиж, нийцтэй эсэхийг тогтоо.', gen: g3, n: 8, nw: 4, cols: 2, wk: 12 },
    { label: 'Бодлогыг бод.', gen: g4, n: 6, nw: 2, cols: 2, wk: 18 }
  ]
});
</script>
