<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CyberMath — Уралдаан</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    font-family:'Baloo 2', sans-serif;
    background:linear-gradient(135deg, #7B52EE 0%, #A855F7 100%);
    color:#2B2542;
    overflow-x:hidden;
  }
  .center {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card {
    background:#fff;
    border-radius:24px;
    padding:32px;
    box-shadow:0 24px 60px rgba(43,37,66,0.25);
    max-width:500px;
    width:100%;
  }
  .card h1 {
    font-size:1.6rem;
    font-weight:900;
    color:#2B2542;
    margin-bottom:6px;
    text-align:center;
  }
  .card .sub {
    font-size:0.86rem;
    color:#6B6280;
    text-align:center;
    margin-bottom:20px;
    font-weight:700;
  }
  .form-label {
    font-size:0.78rem;
    color:#7A6E5C;
    font-weight:800;
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .form-group { margin-bottom:14px; }
  .form-input, .form-textarea {
    width:100%;
    padding:12px 14px;
    border:1.5px solid #ECE6F8;
    border-radius:12px;
    font-family:inherit;
    font-size:1rem;
    outline:none;
    color:#2B2542;
    background:#FAF8FE;
    box-sizing:border-box;
  }
  .form-input:focus, .form-textarea:focus {
    border-color:#7B52EE;
    background:#fff;
  }
  .form-textarea {
    min-height:80px;
    resize:vertical;
  }
  .btn {
    width:100%;
    padding:14px;
    background:linear-gradient(135deg, #7B52EE, #A855F7);
    color:#fff;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-weight:900;
    font-size:1.05rem;
    cursor:pointer;
    letter-spacing:0.3px;
    box-shadow:0 4px 14px rgba(123,82,238,0.35);
  }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-alt {
    background:#fff;
    color:#7B52EE;
    border:1.5px solid #7B52EE;
    box-shadow:none;
  }
  .btn-danger {
    background:#E45A6B;
    color:#fff;
    box-shadow:0 4px 14px rgba(228,90,107,0.35);
  }
  .btn-row { display:flex; gap:8px; }

  /* ── PRESENTER VIEW ── */
  .presenter {
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 20px;
    color:#fff;
    text-align:center;
  }
  .pres-title {
    font-size:2rem;
    font-weight:900;
    margin-bottom:6px;
    letter-spacing:0.5px;
  }
  .pres-sub {
    font-size:1rem;
    opacity:0.9;
    font-weight:700;
    margin-bottom:30px;
  }
  .qr-wrap {
    background:#fff;
    border-radius:24px;
    padding:24px;
    box-shadow:0 24px 60px rgba(0,0,0,0.3);
    margin-bottom:28px;
  }
  .qr-wrap canvas, .qr-wrap img { display:block; }
  .pres-instr {
    font-size:1.3rem;
    font-weight:800;
    margin-bottom:12px;
    background:rgba(255,255,255,0.15);
    padding:14px 28px;
    border-radius:14px;
    backdrop-filter:blur(10px);
  }
  .pres-question {
    font-size:1rem;
    color:#FFF;
    opacity:0.85;
    max-width:680px;
    margin:16px auto 0;
    padding:14px 22px;
    border:1.5px dashed rgba(255,255,255,0.4);
    border-radius:14px;
    font-weight:700;
  }
  .pres-count {
    margin-top:24px;
    font-size:0.94rem;
    font-weight:700;
    opacity:0.9;
  }
  .pres-count strong {
    font-size:1.2rem;
    color:#FFE9A8;
  }

  /* ── WINNER REVEAL ── */
  .winner-reveal {
    text-align:center;
    color:#fff;
    animation:winSlide 0.7s ease-out;
  }
  @keyframes winSlide {
    from { opacity:0; transform:translateY(40px) scale(0.85); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  .winner-trophy {
    font-size:11rem;
    line-height:1;
    margin-bottom:8px;
    animation:bounce 1.6s ease-in-out infinite;
  }
  @keyframes bounce {
    0%,100% { transform:translateY(0) rotate(-5deg); }
    50% { transform:translateY(-22px) rotate(5deg); }
  }
  .winner-label {
    font-size:2rem;
    font-weight:900;
    margin-bottom:8px;
    letter-spacing:6px;
    text-transform:uppercase;
    opacity:0.85;
  }
  .winner-name {
    font-size:8.5rem;
    font-weight:900;
    line-height:1;
    margin-bottom:22px;
    color:#FFE9A8;
    text-shadow:0 6px 32px rgba(0,0,0,0.35), 0 0 60px rgba(255,233,168,0.35);
    word-break:break-word;
    letter-spacing:-1px;
  }
  .winner-msg {
    font-size:1.7rem;
    font-weight:800;
    opacity:0.95;
    margin-bottom:26px;
  }
  .winner-prize-label {
    font-size:0.95rem;
    letter-spacing:4px;
    opacity:0.85;
    margin-bottom:6px;
  }
  .winner-prize-text {
    font-size:1.55rem;
    font-weight:900;
    color:#FFE9A8;
    line-height:1.25;
  }
  .winner-contest-name {
    font-size:0.95rem;
    opacity:0.55;
    margin-top:22px;
  }
  .confetti {
    position:fixed;
    pointer-events:none;
    top:0; left:0; width:100%; height:100%;
    overflow:hidden;
    z-index:9;
  }
  .confetti span {
    position:absolute;
    width:12px; height:12px;
    background:#FFE9A8;
    top:-20px;
    animation:fall 5s linear infinite;
  }
  @keyframes fall {
    to { transform:translateY(110vh) rotate(720deg); }
  }

  /* ── PLAYER VIEW ── */
  .player-card .result-msg {
    text-align:center;
    padding:28px 20px;
    border-radius:16px;
    font-size:1.2rem;
    font-weight:900;
    margin-bottom:14px;
  }
  .result-msg.win {
    background:linear-gradient(135deg, #10B981, #059669);
    color:#fff;
  }
  .result-msg.lose {
    background:linear-gradient(135deg, #E45A6B, #DC2626);
    color:#fff;
  }
  .result-msg.late {
    background:#FAF6EE;
    color:#7A6E5C;
    border:1px solid #ECE4D8;
  }

  .question-box {
    background:#F5F0FF;
    border:1.5px solid #ECE6F8;
    border-left:5px solid #7B52EE;
    border-radius:12px;
    padding:14px 18px;
    margin-bottom:18px;
  }
  .question-box .qlbl {
    font-size:0.74rem;
    color:#7B52EE;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:4px;
  }
  .question-box .qtxt {
    font-size:1.15rem;
    color:#2B2542;
    font-weight:800;
    line-height:1.4;
  }

  @media (max-width:520px) {
    .winner-name { font-size:3rem; }
    .winner-trophy { font-size:6rem; }
    .pres-title { font-size:1.5rem; }
    .pres-instr { font-size:1rem; padding:10px 20px; }
  }

  /* ── SUM ANIMATION ── */
  .start-btn-huge {
    padding:24px 60px;
    background:#FFE9A8;
    color:#2B2542;
    border:none;
    border-radius:18px;
    font-family:inherit;
    font-weight:900;
    font-size:1.8rem;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    letter-spacing:1px;
  }
  .start-btn-huge:hover { transform:scale(1.05); transition:transform 0.2s; }
  .countdown {
    font-size:18rem;
    font-weight:900;
    color:#FFE9A8;
    line-height:1;
    text-shadow:0 0 80px rgba(255,233,168,0.7);
    animation:cntPop 0.8s ease-out;
  }
  @keyframes cntPop {
    0% { opacity:0; transform:scale(0.3); }
    30% { opacity:1; transform:scale(1.3); }
    100% { opacity:0.8; transform:scale(1); }
  }
  .num-flash {
    font-size:22rem;
    font-weight:900;
    color:#FFE9A8;
    line-height:1;
    text-shadow:0 0 100px rgba(255,233,168,0.6), 0 0 200px rgba(255,233,168,0.3);
    animation:numFlash 1.4s ease-out;
  }
  @keyframes numFlash {
    0% { opacity:0; transform:scale(0.4) rotate(-10deg); }
    15% { opacity:1; transform:scale(1.15) rotate(2deg); }
    40% { opacity:1; transform:scale(1) rotate(0deg); }
    100% { opacity:0.9; transform:scale(0.95); }
  }
  .num-progress {
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    font-size:1.4rem;
    font-weight:900;
    color:#fff;
    opacity:0.7;
    letter-spacing:2px;
    z-index:10;
  }

  /* Distractor шувуунууд — хаа хамаагүй гарна */
  .distractor {
    position:fixed;
    pointer-events:none;
    z-index:50;
    will-change:transform, opacity;
    user-select:none;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,0.3));
  }
  .distractor svg, .distractor img { display:block; width:100%; height:auto; }

  @keyframes popFade {
    0% { opacity:0; transform:scale(0) rotate(var(--r0)); }
    20% { opacity:1; transform:scale(1.25) rotate(var(--r1)); }
    50% { opacity:1; transform:scale(1) rotate(var(--r2)); }
    100% { opacity:0; transform:scale(0.8) rotate(var(--r3)); }
  }
  @keyframes flyLR {
    from { transform:translateX(-180px) translateY(0) rotate(0); }
    to { transform:translateX(calc(100vw + 180px)) translateY(var(--dy)) rotate(var(--rot)); }
  }
  @keyframes flyRL {
    from { transform:translateX(180px) translateY(0) rotate(0); }
    to { transform:translateX(calc(-100vw - 180px)) translateY(var(--dy)) rotate(var(--rot)); }
  }
  @keyframes flyTB {
    from { transform:translateY(-180px) translateX(0) rotate(0); }
    to { transform:translateY(calc(100vh + 180px)) translateX(var(--dx)) rotate(var(--rot)); }
  }
  @keyframes bounceJump {
    0%,100% { transform:translateY(0) rotate(var(--r0)); }
    50% { transform:translateY(-60px) rotate(var(--r1)); }
  }
  .d-pop { animation:popFade 2.6s ease-in-out forwards; }
  .d-fly-lr { animation:flyLR 3.5s linear forwards; }
  .d-fly-rl { animation:flyRL 3.5s linear forwards; }
  .d-fly-tb { animation:flyTB 3.5s linear forwards; }
  .d-bounce { animation:bounceJump 1.4s ease-in-out 2; }

  .num-flash, .countdown {
    position:relative;
    z-index:60;
  }
  @media (max-width:520px) {
    .countdown { font-size:10rem; }
    .num-flash { font-size:12rem; }
    .start-btn-huge { font-size:1.2rem; padding:18px 40px; }
  }
</style>
</head>
<body>

<div id="confetti-host"></div>
<div id="root" class="center"></div>

<script>
const API = '/api/contest';
const root = document.getElementById('root');
const params = new URLSearchParams(location.search);

const view = (params.has('presenter')) ? 'presenter'
           : (params.has('id') || params.has('contest')) ? 'player'
           : 'setup';

if (view === 'setup') renderSetup();
else if (view === 'presenter') renderPresenter(parseInt(params.get('presenter')));
else renderPlayer(parseInt(params.get('id') || params.get('contest')));

// ═══════════════════════════════════════════
// SETUP — Админ уралдаан үүсгэх
// ═══════════════════════════════════════════
async function renderSetup() {
  // Шалгах: одоо идэвхтэй уралдаан байна уу?
  let active = null;
  try {
    const r = await fetch(API);
    const d = await r.json();
    if (d.ok && d.contest && d.contest.active) active = d.contest;
  } catch(e) {}

  if (active) {
    root.innerHTML = `
      <div class="card">
        <h1>Идэвхтэй уралдаан байна</h1>
        <div class="sub">"${esc(active.title)}" #${active.id}</div>
        <div class="question-box">
          <div class="qlbl">Асуулт</div>
          <div class="qtxt">${esc(active.question)}</div>
        </div>
        <div style="background:#F0FDF4;border:1px solid #86EFAC;border-radius:10px;padding:10px;font-size:0.84rem;color:#065F46;font-weight:700;margin-bottom:14px;">
          ${active.winner_name ? '🏆 Ялагч: <b>' + esc(active.winner_name) + '</b>' : 'Хариу хүлээж байна...'}
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="btn" onclick="location.href='?presenter=${active.id}'">📺 Том дэлгэцэн дээр үргэлжлүүлэх</button>
          <button class="btn btn-alt" onclick="location.href='/poster?id=${active.id}'">🎨 Постер татах (A4 PDF)</button>
          <button class="btn btn-alt" onclick="resetContest(${active.id})">↻ Уралдааныг шинээр эхлүүлэх</button>
          <button class="btn btn-danger" onclick="closeContest(${active.id})">✕ Уралдааныг бүрэн дуусгах</button>
        </div>
      </div>`;
    return;
  }

  root.innerHTML = `
    <div class="card">
      <h1 style="font-size:1.4rem;line-height:1.2;">⚡ ХЭН ХАМГИЙН ХУРДАН БОДОХ ВЭ?</h1>
      <div class="sub" style="text-align:left;background:#F5F0FF;border-left:4px solid #7B52EE;border-radius:10px;padding:12px 14px;font-size:0.86rem;color:#2B2542;font-weight:700;line-height:1.5;margin-bottom:18px;">
        Дэлгэцэнд <b>10 тоо</b> дараалан гарна. Түүнийг <b>цээжээр</b> хамгийн түрүүнд зөв бодсон оролцогч ялагч болж <b>CYBERMATH платформын бүтэн жилийн эрх</b> авна.
      </div>
      <div class="form-group">
        <div class="form-label">Уралдааны нэр</div>
        <input id="title" class="form-input" placeholder="Эцэг эхийн өдөрлөг 2026" value="Эцэг эхийн өдөрлөг 2026"/>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="form-group" style="flex:1;">
          <div class="form-label">Тооны тоо</div>
          <input id="num-count" class="form-input" type="number" min="2" max="20" value="10"/>
        </div>
        <div class="form-group" style="flex:1;">
          <div class="form-label">Хамгийн их</div>
          <input id="num-max" class="form-input" type="number" min="2" max="99" value="20"/>
        </div>
      </div>
      <button class="btn" onclick="createContest()">🔢 Уралдаан үүсгэх</button>
    </div>`;
}

async function createContest() {
  const title = document.getElementById('title').value.trim();
  const body = {
    action:'create',
    title,
    contest_type: 'sum',
    count: parseInt(document.getElementById('num-count').value) || 10,
    max_num: parseInt(document.getElementById('num-max').value) || 20
  };
  try {
    const r = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!d.ok) { alert('Алдаа: ' + (d.error||'?')); return; }
    location.href = '?presenter=' + d.contest.id;
  } catch(e) { alert('Network: ' + e.message); }
}

async function resetContest(id) {
  if (!confirm('Ялагчийг устгаад уралдааныг шинээр эхлүүлэх үү?')) return;
  await fetch(API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'reset', id })
  });
  location.href = '?presenter=' + id;
}

async function closeContest(id) {
  if (!confirm('Уралдааныг бүрэн дуусгаж шинээр эхлэх үү?')) return;
  await fetch(API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'close', id })
  });
  location.href = '/contest';
}

// ═══════════════════════════════════════════
// PRESENTER — Том дэлгэц (QR + Live winner)
// ═══════════════════════════════════════════
let _pollTimer = null;
async function renderPresenter(id) {
  // Initial fetch
  const r = await fetch(API + '?id=' + id);
  const d = await r.json();
  if (!d.ok || !d.contest) {
    root.innerHTML = '<div class="card"><h1>Уралдаан олдсонгүй</h1><button class="btn" onclick="location.href=\'/contest\'">Шинээр үүсгэх</button></div>';
    return;
  }
  showPresenterScreen(d.contest);
  // Polling
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(async () => {
    try {
      const r2 = await fetch(API + '?id=' + id);
      const d2 = await r2.json();
      if (d2.ok && d2.contest) showPresenterScreen(d2.contest);
    } catch(e) {}
  }, 1500);
}

function showPresenterScreen(contest) {
  document.body.style.background = 'linear-gradient(135deg, #7B52EE 0%, #A855F7 100%)';

  // Animation running — server state-ыг хэрэглэхгүй
  if (root.dataset.state === 'sum-playing') return;

  if (contest.winner_name) {
    if (root.dataset.state !== 'winner') {
      root.dataset.state = 'winner';
      root.classList.remove('center');
      root.className = 'presenter';
      root.innerHTML = `
        <div class="winner-reveal">
          <div class="winner-trophy">🏆</div>
          <div class="winner-label">Ялагч</div>
          <div class="winner-name">${esc(contest.winner_name)}</div>
          <div class="winner-msg">🎉 Баяр хүргэе! Та хамгийн анх зөв хариулсан байна!</div>
          <div style="background:rgba(255,233,168,0.18);border:2px solid rgba(255,233,168,0.5);border-radius:18px;padding:18px 34px;display:inline-block;">
            <div class="winner-prize-label">🎁 ШАГНАЛ</div>
            <div class="winner-prize-text">CYBERMATH платформын<br>бүтэн жилийн эрх</div>
          </div>
          <div class="winner-contest-name">"${esc(contest.title || 'Уралдаан')}"</div>
        </div>`;
      makeConfetti();
      if (_pollTimer) clearInterval(_pollTimer);
    }
    return;
  }

  // Тоон уралдаан + хараахан эхлээгүй → "Эхлүүлэх" товч
  const numbers = parseNumbers(contest.numbers);
  if (contest.contest_type === 'sum' && !contest.numbers_shown_at && numbers.length) {
    if (root.dataset.state !== 'sum-start') {
      root.dataset.state = 'sum-start';
      root.classList.remove('center');
      root.className = 'presenter';
      root.innerHTML = `
        <div class="pres-title" style="font-size:2.4rem;">⚡ ХЭН ХАМГИЙН ХУРДАН БОДОХ ВЭ?</div>
        <div class="pres-sub" style="max-width:760px;font-size:1.1rem;line-height:1.5;">Дэлгэцэнд <b>${numbers.length} тоо</b> дараалан гарна. Түүнийг <b>цээжээр</b> хамгийн түрүүнд зөв бодсон оролцогч <b>CYBERMATH платформын бүтэн жилийн эрх</b> авна.</div>
        <button class="start-btn-huge" onclick="playSumAnimation(${contest.id})">▶ ЭХЛҮҮЛЭХ</button>
        <div style="margin-top:24px;font-size:0.84rem;opacity:0.7;">⚠️ Эхэлсний дараа тооноос нь сарьнуулах зүйлс гарах болно</div>
        <div style="position:fixed;bottom:14px;right:18px;font-size:0.74rem;color:#fff;opacity:0.5;">#${contest.id}</div>`;
    }
    return;
  }

  // Хариулах хугацаа дууссан — ялагчгүй
  const deadline = contest.answer_deadline ? new Date(contest.answer_deadline).getTime() : 0;
  const remaining = deadline ? Math.max(0, Math.floor((deadline - Date.now()) / 1000)) : null;
  if (deadline && remaining === 0 && !contest.winner_name) {
    if (root.dataset.state !== 'expired') {
      root.dataset.state = 'expired';
      root.className = 'presenter';
      root.innerHTML = `
        <div style="font-size:7rem;line-height:1;margin-bottom:14px;">⏰</div>
        <div class="pres-title">Хугацаа дууссан</div>
        <div class="pres-sub" style="margin-top:8px;">Хариулсан хүн алга. Дахин уралдаан зохион байгуулаарай.</div>
        <div style="margin-top:20px;background:rgba(255,233,168,0.18);border:2px solid rgba(255,233,168,0.5);border-radius:14px;padding:10px 18px;color:#FFE9A8;font-weight:800;font-size:0.9rem;">"${esc(contest.title || 'Уралдаан')}"</div>`;

      <div style="margin-top:8px;background:rgba(255,233,168,0.18);border:2px solid rgba(255,233,168,0.5);border-radius:14px;padding:10px 18px;color:#FFE9A8;font-weight:800;font-size:0.95rem;">🎁 Шагнал: CYBERMATH платформын бүтэн жилийн эрх</div>
      <div class="pres-count">Оролдсон тоо: <strong id="atc">${contest.attempt_count || 0}</strong></div>
      <div style="position:fixed;bottom:14px;right:18px;font-size:0.74rem;color:#fff;opacity:0.5;">#${contest.id}</div>`;
    new QRCode(document.getElementById('qr-canvas'), {
      text: playerUrl,
      width: 280, height: 280,
      colorDark : '#2B2542',
      colorLight : '#ffffff',
      correctLevel : QRCode.CorrectLevel.H
    });
  } else {
    const atc = document.getElementById('atc');
    if (atc) atc.textContent = contest.attempt_count || 0;
  }

  // Countdown timer-ыг 1 сек тутамд update хийх
  if (deadline) {
    if (window._presTimerInt) clearInterval(window._presTimerInt);
    const tick = () => {
      const r = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
      const tEl = document.getElementById('pres-timer');
      if (tEl) {
        tEl.textContent = '⏱ ' + r + ' сек';
        if (r <= 10) tEl.style.color = '#FF7E36';
        if (r <= 5) tEl.style.color = '#FF4A4A';
        if (r === 0) {
          clearInterval(window._presTimerInt);
          // Polling-аар expired view рүү шилжинэ
        }
      }
    };
    tick();
    window._presTimerInt = setInterval(tick, 1000);
  }
}

function parseNumbers(n) {
  if (!n) return [];
  if (Array.isArray(n)) return n;
  try { return JSON.parse(n); } catch(e) { return []; }
}

let _audioCtx = null;
function getAudio() {
  if (!_audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    _audioCtx = new AC();
  }
  return _audioCtx;
}
function beep(freq, dur) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.05);
  } catch(e) {}
}

// ─── Distractor — нүдгэлтэй шар шувуунууд (inline SVG) хаа хамаагүй гарна ───
function chickSVG(opts) {
  opts = opts || {};
  const bodyA = opts.bodyA || '#FFE85E';
  const bodyB = opts.bodyB || '#FFC113';
  const beak = opts.beak || '#FF9A1F';
  const eyeRing = opts.eyeRing || '#3DA9E0';
  const expr = opts.expr != null ? opts.expr : Math.floor(Math.random() * 4);
  let eyes;
  if (expr === 0) {
    eyes = '<circle cx="36" cy="51" r="5" fill="#241a44"/><circle cx="64" cy="51" r="5" fill="#241a44"/>'
         + '<circle cx="37.5" cy="49.5" r="1.5" fill="#fff"/><circle cx="65.5" cy="49.5" r="1.5" fill="#fff"/>';
  } else if (expr === 1) {
    eyes = '<path d="M30 50 Q36 45 42 50" stroke="#241a44" stroke-width="3" fill="none" stroke-linecap="round"/>'
         + '<path d="M58 50 Q64 45 70 50" stroke="#241a44" stroke-width="3" fill="none" stroke-linecap="round"/>';
  } else if (expr === 2) {
    eyes = '<circle cx="36" cy="50" r="6" fill="#241a44"/><circle cx="64" cy="50" r="6" fill="#241a44"/>'
         + '<circle cx="37.5" cy="48" r="1.6" fill="#fff"/><circle cx="65.5" cy="48" r="1.6" fill="#fff"/>';
  } else {
    eyes = '<path d="M28 50 L44 50" stroke="#241a44" stroke-width="3" stroke-linecap="round"/>'
         + '<path d="M56 50 L72 50" stroke="#241a44" stroke-width="3" stroke-linecap="round"/>';
  }
  const beakHtml = (expr === 2)
    ? '<ellipse cx="50" cy="68" rx="5" ry="6" fill="' + beak + '"/>'
    : '<path d="M45 65 L55 65 L50 73 Z" fill="' + beak + '"/>';
  const glasses = opts.noGlasses ? '' : (
    '<circle cx="36" cy="50" r="15" fill="none" stroke="' + eyeRing + '" stroke-width="3"/>'
    + '<circle cx="64" cy="50" r="15" fill="none" stroke="' + eyeRing + '" stroke-width="3"/>'
    + '<line x1="48" y1="50" x2="52" y2="50" stroke="' + eyeRing + '" stroke-width="3"/>'
  );
  const sclera = '<circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>';
  const extras = [
    '<path d="M50 22 Q47 8 50 6 Q53 8 50 22" fill="#FFB800"/>',
    '<path d="M52 8 L48 22 L54 22 L50 32 L60 18 L54 18 L58 6 Z" fill="#F5A623"/>',
    '<path d="M44 20 L56 20 L52 8 L48 8 Z" fill="#FFB800"/>'
  ];
  const extra = extras[Math.floor(Math.random() * extras.length)];
  const wings = '<ellipse cx="14" cy="65" rx="6" ry="11" fill="' + bodyB + '" transform="rotate(-25 14 65)"/>'
              + '<ellipse cx="86" cy="65" rx="6" ry="11" fill="' + bodyB + '" transform="rotate(25 86 65)"/>';
  const feet = '<ellipse cx="40" cy="100" rx="6" ry="2.8" fill="#FF7E36"/>'
             + '<ellipse cx="60" cy="100" rx="6" ry="2.8" fill="#FF7E36"/>';
  const gradId = 'g' + Math.random().toString(36).slice(2, 8);
  return '<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;overflow:visible;">'
    + '<defs><radialGradient id="' + gradId + '" cx="0.5" cy="0.3" r="0.7">'
    +   '<stop offset="0" stop-color="' + bodyA + '"/>'
    +   '<stop offset="1" stop-color="' + bodyB + '"/>'
    + '</radialGradient></defs>'
    + feet + wings
    + '<ellipse cx="50" cy="58" rx="40" ry="38" fill="url(#' + gradId + ')"/>'
    + extra + sclera + glasses + eyes + beakHtml
    + '</svg>';
}

let _distractorTimer = null;
function spawnDistractor() {
  const el = document.createElement('div');
  const variant = CHICK_VARIANTS[Math.floor(Math.random() * CHICK_VARIANTS.length)];
  el.innerHTML = chickSVG(variant);

  // Хэмжээ — өргөнд тулгуурлана, өндөр нь aspect-ийн дагуу
  const size = 90 + Math.random() * 170; // 90..260px
  el.style.width = size + 'px';
  el.style.height = 'auto';

  // Animation төрөл — 4 төрлөөс санамсаргүй
  const mode = Math.random();
  if (mode < 0.45) {
    // Pop in random position
    el.className = 'distractor d-pop';
    el.style.left = (Math.random() * 90) + '%';
    el.style.top = (Math.random() * 80 + 5) + '%';
    el.style.setProperty('--r0', ((Math.random()-0.5)*60) + 'deg');
    el.style.setProperty('--r1', ((Math.random()-0.5)*120) + 'deg');
    el.style.setProperty('--r2', ((Math.random()-0.5)*120) + 'deg');
    el.style.setProperty('--r3', ((Math.random()-0.5)*240) + 'deg');
  } else if (mode < 0.65) {
    // Fly left → right
    el.className = 'distractor d-fly-lr';
    el.style.top = (Math.random() * 80 + 5) + '%';
    el.style.left = '0';
    el.style.setProperty('--dy', ((Math.random()-0.5)*200) + 'px');
    el.style.setProperty('--rot', ((Math.random()-0.5)*720) + 'deg');
  } else if (mode < 0.8) {
    // Fly right → left
    el.className = 'distractor d-fly-rl';
    el.style.top = (Math.random() * 80 + 5) + '%';
    el.style.right = '0';
    el.style.setProperty('--dy', ((Math.random()-0.5)*200) + 'px');
    el.style.setProperty('--rot', ((Math.random()-0.5)*720) + 'deg');
  } else if (mode < 0.92) {
    // Fall top → bottom
    el.className = 'distractor d-fly-tb';
    el.style.left = (Math.random() * 85 + 2) + '%';
    el.style.top = '0';
    el.style.setProperty('--dx', ((Math.random()-0.5)*200) + 'px');
    el.style.setProperty('--rot', ((Math.random()-0.5)*720) + 'deg');
  } else {
    // Bounce in place
    el.className = 'distractor d-bounce';
    el.style.left = (Math.random() * 90) + '%';
    el.style.top = (Math.random() * 80 + 5) + '%';
    el.style.setProperty('--r0', ((Math.random()-0.5)*40) + 'deg');
    el.style.setProperty('--r1', ((Math.random()-0.5)*120) + 'deg');
  }

  document.body.appendChild(el);
  setTimeout(() => el.remove(), 5500);
}
function startDistractors() {
  stopDistractors();
  // Эхэндээ хэд хэдэн дороор гаргах
  for (let i = 0; i < 6; i++) setTimeout(spawnDistractor, i * 150);
  // Дараа нь тогтмол интервалаар
  _distractorTimer = setInterval(spawnDistractor, 280);
}
function stopDistractors() {
  if (_distractorTimer) { clearInterval(_distractorTimer); _distractorTimer = null; }
  document.querySelectorAll('.distractor').forEach(d => d.remove());
}

window.playSumAnimation = async function(id) {
  // Сервер хуудсан POST start
  try {
    await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'start', id }) });
  } catch(e) {}

  // Бүс хийгээд server state буцаах
  const r = await fetch(API + '?id=' + id);
  const d = await r.json();
  if (!d.ok) return;
  const contest = d.contest;
  const numbers = parseNumbers(contest.numbers);
  if (!numbers.length) return;

  // Animation эхэлж байгаа гэж тэмдэглээд polling-ыг түр зогсоох
  root.dataset.state = 'sum-playing';
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  root.className = 'presenter';

  // 3-2-1 countdown
  for (let n = 3; n >= 1; n--) {
    root.innerHTML = '<div class="countdown">' + n + '</div>';
    beep(440 + (3-n)*100, 0.25);
    await sleep(800);
  }
  // GO!
  root.innerHTML = '<div class="countdown" style="font-size:10rem;color:#fff;">ЭХЭЛ!</div>';
  beep(880, 0.4);
  await sleep(700);

  // Distractor шувуудыг эхлүүлэх
  startDistractors();

  // Тоон animation
  for (let i = 0; i < numbers.length; i++) {
    const v = numbers[i];
    root.innerHTML = ''
      + '<div class="num-flash">' + v + '</div>'
      + '<div class="num-progress">' + (i+1) + ' / ' + numbers.length + '</div>';
    beep(NOTES[i % NOTES.length], 0.28);
    await sleep(1400);
  }

  // Distractor-ыг зогсоох
  stopDistractors();

  // Дууссан — QR харагдах төлөв
  root.innerHTML = '<div style="font-size:8rem;color:#FFE9A8;font-weight:900;animation:cntPop 0.6s;">📱</div>'
    + '<div style="font-size:1.5rem;color:#fff;margin-top:14px;font-weight:800;">QR ачаалж байна...</div>';
  await sleep(900);

  // 60 секундын хариулах хугацаа эхлэх
  try {
    await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'beginAnswering', id, seconds: 60 }) });
  } catch(e) {}

  // State-ыг waiting болгож polling-ыг сэргээх
  root.dataset.state = '';
  const r2 = await fetch(API + '?id=' + id);
  const d2 = await r2.json();
  if (d2.ok && d2.contest) showPresenterScreen(d2.contest);
  _pollTimer = setInterval(async () => {
    try {
      const rr = await fetch(API + '?id=' + id);
      const dd = await rr.json();
      if (dd.ok && dd.contest) showPresenterScreen(dd.contest);
    } catch(e) {}
  }, 1500);
};

async function submitAnswer(id) {
  const name = document.getElementById('p-name').value.trim();
  const ans = document.getElementById('p-ans').value.trim();
  if (!name) { alert('Нэрээ оруулна уу'); return; }
  if (!ans) { alert('Нийлбэрээ оруулна уу'); return; }
  const btn = document.getElementById('p-submit');
  btn.disabled = true;
  btn.textContent = 'Илгээж байна...';
  try {
    const r = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'submit', id, name, answer: ans })
    });
    const d = await r.json();
    if (!d.ok) {
      alert(d.error || 'Алдаа гарлаа');
      btn.disabled = false; btn.textContent = '🚀 Илгээх';
      return;
    }
    showResult(d, name);
  } catch(e) {
    alert('Network: ' + e.message);
    btn.disabled = false; btn.textContent = '🚀 Илгээх';
  }
}

      </div>
      <div style="background:#FFF5E0;border:2px solid #F5A623;border-radius:14px;padding:14px;text-align:center;margin-top:14px;">
        <div style="font-size:0.74rem;font-weight:800;color:#7A6E5C;letter-spacing:1px;margin-bottom:4px;">🎁 ТАНЫ ШАГНАЛ</div>
        <div style="font-size:1.05rem;font-weight:900;color:#2B2542;line-height:1.3;">CYBERMATH платформын<br>бүтэн жилийн эрх</div>
      </div>
      <div style="text-align:center;font-size:0.86rem;color:#7A6E5C;font-weight:700;margin-top:14px;">Нэрээ том дэлгэцээс харна уу 🎉</div>
    </div>`;
  } else if (d.correct && !d.winner) {
    root.innerHTML = `<div class="card player-card">
      <div class="result-msg late">
        ✓ Зөв хариулт<br>
        <span style="font-size:0.94rem;display:block;margin-top:6px;">Гэвч "<b>${esc(d.winner_name || 'хэн нэгэн')}</b>" Танаас түрүүлсэн.</span>
      </div>
    </div>`;
  } else {
    root.innerHTML = `<div class="card player-card">
      <div class="result-msg lose">
        ✕ Хариулт буруу<br>
        <span style="font-size:0.94rem;display:block;margin-top:6px;">Дахин оролдох боломжгүй.</span>
      </div>
    </div>`;
  }
}

function esc(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
