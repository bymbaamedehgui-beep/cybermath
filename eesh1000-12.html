<script>
/* ЭЕШ 1000 3-4 — ЭЕШ-ийн 1000 бодлого, 3-р хэсэг (76–100-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 76. (50-ын ихэр) ∫ₐᵇ (mx + n)/(x² − (p + q)x + pq) dx = ∫ₐᵇ (A/(x − p) + B/(x − q)) dx (бүхэл A, B; m = A + B, n = −(Aq + Bp))
//     = ln( |b − p|ᴬ·|b − q|ᴮ / (|a − p|ᴬ·|a − q|ᴮ) ) — нэг ln, хураасан бутархай; [a; b] нь p, q-г агуулахгүй
//     (эх: ∫₃⁴ (x + 4)/(x² − x − 2) dx = ln 16/5).
function p76_pw(n, e) { var r = 1; for (var i = 0; i < e; i++) r *= n; return r; }
// Бодолт: хуваарь (x − p)(x − q) → A/(x − p) + B/(x − q) (язгуурыг орлуулж A, B) → A ln|x − p| + B ln|x − q| → F(b) − F(a)
//   → логарифмын чанараар нэг ln (зэрэг эерэг хүчин зүйлсийг хүртвэр/хуваарьт хуваарилна; 1-ийг алгасна) = хариу
function p76_sol(p, q, A, B, m, n, a, b, fin) {
  var X = function (r) { return poly([1, -r]); }, F = function (r) { return r === 0 ? 'x' : '(' + X(r) + ')'; };
  var den = poly([1, -(p + q), p * q]), num = poly([m, n]), lim = '_{' + a + '}^{' + (b === 1 ? '{1}' : b) + '}';
  var fac = p * q === 0 ? 'x(' + X(p || q) + ')' : '(' + X(p) + ')(' + X(q) + ')';
  var fr2 = function (c, r, first) { return (c < 0 ? '-' : first ? '' : '+') + '\\dfrac{' + Math.abs(c) + '}{' + X(r) + '}'; };
  var at = function (x) { return tm(A, '\\ln ' + Math.abs(x - p), true) + tm(B, '\\ln ' + Math.abs(x - q)); };
  var nf = [], df = [], one = false;
  [[A, Math.abs(b - p), Math.abs(a - p)], [B, Math.abs(b - q), Math.abs(a - q)]].forEach(function (z) {
    var e = Math.abs(z[0]), up = z[0] > 0 ? z[1] : z[2], dn = z[0] > 0 ? z[2] : z[1];
    if (z[1] === 1 || z[2] === 1) one = true;
    if (up !== 1) nf.push(e === 1 ? String(up) : up + '^' + e);
    if (dn !== 1) df.push(e === 1 ? String(dn) : dn + '^' + e);
  });
  var NS = nf.length ? nf.join('\\cdot ') : '1', comb = df.length ? '\\ln\\dfrac{' + NS + '}{' + df.join('\\cdot ') + '}' : /\^|\\cdot/.test(NS) ? '\\ln\\left(' + NS + '\\right)' : '\\ln ' + NS;
  return [
    (p * q === 0 ? 'Хуваарийг үржигдэхүүнд задалъя ($x$-ийг хаалтны өмнө гаргана):'
      : 'Хуваарийн язгуурууд Виетийн теоремоор $x_1=' + p + '$, $x_2=' + q + '$ ($x_1+x_2=' + (p + q) + '$, $x_1x_2=' + p * q + '$) тул') + ' $$' + den + '=' + fac + '.$$',
    'Хялбар бутархайн нийлбэрт задалъя: $$\\dfrac{' + num + '}{' + fac + '}=\\dfrac{A}{' + X(p) + '}+\\dfrac{B}{' + X(q) + '}\\ \\Rightarrow\\ ' + num + '=A' + F(q) + '+B' + F(p) + '.$$'
      + ' $x=' + p + '$ үед $' + (m * p + n) + '=' + tm(p - q, 'A', true) + '\\Rightarrow A=' + A + '$; $x=' + q + '$ үед $' + (m * q + n) + '=' + tm(q - p, 'B', true) + '\\Rightarrow B=' + B + '$.',
    '$\\int\\frac{dx}{x-c}=\\ln|x-c|+C$ ба Ньютон–Лейбницийн томьёогоор $$\\int' + lim + '\\left(' + fr2(A, p, true) + fr2(B, q) + '\\right)dx=\\Big('
      + tm(A, '\\ln|' + X(p) + '|', true) + tm(B, '\\ln|' + X(q) + '|') + '\\Big)\\Big|' + lim + '$$ $$=\\Big(' + at(b) + '\\Big)-\\Big(' + at(a) + '\\Big).$$',
    'Логарифмын чанаруудаар (' + (one ? '$\\ln 1=0$, ' : '') + '$k\\ln u=\\ln u^k$, $\\ln u+\\ln v=\\ln(uv)$, $\\ln u-\\ln v=\\ln\\dfrac{u}{v}$) $$=' + comb + (comb === fin ? '' : '=' + fin) + '.$$'
  ];
}
function p76() {
  var p = rnd(-4, 5), q = rnd(-4, 4);
  if (p <= q || p * q === 0 && rnd(0, 2)) return null;        // p > q; x² + kx хэлбэр цөөн
  var mm = pick([1, 1, 1, 1, 1, 2, 3]), A = nz(-3, 3), B = mm - A, n = -(A * q + B * p);
  if (!B || !n || Math.abs(n) > 12) return null;
  var L = pick([1, 1, 1, 1, 2]), w = rnd(1, 7), a;
  if (w <= 5) a = p + rnd(1, 2);                                // хоёр язгуураас баруун (эх шиг)
  else if (w === 6) a = q - L - rnd(1, 2);                      // хоёр язгуураас зүүн
  else { if (p - q < L + 2) return null; a = q + rnd(1, p - q - L - 1); }   // язгууруудын хооронд
  var b = a + L, N = 1, D = 1;
  if (Math.abs(a) > 7 || Math.abs(b) > 7) return null;
  [[A, Math.abs(b - p), Math.abs(a - p)], [B, Math.abs(b - q), Math.abs(a - q)]].forEach(function (z) {
    if (z[0] > 0) { N *= p76_pw(z[1], z[0]); D *= p76_pw(z[2], z[0]); } else { N *= p76_pw(z[2], -z[0]); D *= p76_pw(z[1], -z[0]); }
  });
  var g = gcd(N, D); N /= g; D /= g;
  if (N === D || N > 400 || D > 400) return null;
  return {
    q: '$\\displaystyle\\int_{' + a + '}^{' + (b === 1 ? '{1}' : b) + '}\\dfrac{' + poly([mm, n]) + '}{' + poly([1, -(p + q), p * q]) + '}\\,dx$ тодорхой интеграл бод.',
    a: '$\\ln' + (D === 1 ? ' ' + N : '\\dfrac{' + N + '}{' + D + '}') + '$',
    wk: 30,
    s: p76_sol(p, q, A, B, mm, n, a, b, '\\ln' + (D === 1 ? ' ' + N : '\\dfrac{' + N + '}{' + D + '}')),
    t: { p: p, q: q, A: A, B: B, m: mm, n: n, a: a, b: b }
  };
}

// 77. (51-ийн ихэр) y = e^{px}, y = H (хэвтээ шулуун), x = 0: огтлолцол x₀ = ln H / p;
//     S = |∫₀^{x₀}(H − e^{px})dx| = (H·ln H − H + 1)/p   (H > 1 ба 0 < H < 1 хоёуланд ижил томьёо)
//     H = e^j ⇒ ((j − 1)e^j + 1)/p;  H = k ⇒ (k ln k − k + 1)/p;  H = 1/e^j ⇒ (e^j − j − 1)/(p·e^j);  H = 1/k ⇒ (k − 1 − ln k)/(kp)
//     (эх: y = eˣ, y = e, x = 0 → 1).
function p77_lb(k) { return k === 4 ? [2, 2] : k === 8 ? [2, 3] : k === 9 ? [3, 2] : [k, 1]; }   // ln k = e·ln b
function p77_E(j) { return 'e' + (j === 1 ? '' : '^' + j); }
// Бодолтын зураг (x, y масштаб тусдаа): y = e^{px} муруй, y = H шулуун, y тэнхлэг; хашигдсан хэсэг будсан, x₀ тэнхлэг дээр.
//   H > 1: хэсэг [0; x₀]-д шулууны доор; H < 1: [x₀; 0]-д шулууны дээр (y тэнхлэгийн зүүн талд).
function p77_fig(p, Hv, Hl) {
  var x0 = Math.log(Hv) / p, up = Hv > 1, L = Math.abs(x0), top = up ? Hv : 1, ex = function (x) { return Math.exp(p * x); };
  var X0 = up ? -0.5 * L : -1.5 * L, X1 = up ? 1.5 * L : 0.5 * L, reg = [], i;
  var f = Fig({ free: true, w: 200, h: 165, view: [X0, X1, -0.14 * top, 1.32 * top], padT: 14, padB: 18, padL: 12, padR: 18 });
  for (i = 0; i <= 60; i++) { var x = up ? x0 * i / 60 : x0 * (1 - i / 60); reg.push([x, ex(x)]); }
  reg.push([0, Hv]);
  f.poly(reg, { fill: '#5a32d6', op: 0.22, c: 'none' }).axes({ ext: 8 })
    .curve(ex, X0, up ? X1 : Math.min(X1, Math.log(1.18) / p), { w: 1.6 }).seg([X0, Hv], [X1, Hv], { w: 1.4 })   // H < 1: y тэнхлэгийн «y»-тэй давхцахгүй
    .seg([x0, 0], [x0, Hv], { dash: '3 3', w: 0.9, c: '#666' }).dot([x0, Hv], { r: 2.3 })
    .text([x0, 0], 'x_0', { pos: 's', size: 11, halo: true, off: 4 });
  // муруйн нэр — муруйн зүүн дээд талд (хэсгийн гадна), шулууны нэр — хэсгээс зайдуу
  var xc = up ? Math.log(1.16 * Hv) / p : x0 / 2;
  f.text([xc, ex(xc)], p === 1 ? 'y=e^x' : 'y=e^{' + p + 'x}', { pos: 'nw', size: 11, halo: true, off: 5 });
  f.text(up ? [X1, Hv] : [X0, Hv], 'y=' + Hl, up ? { pos: 'sw', size: 11, halo: true, off: 4 } : { pos: 'ne', size: 11, halo: true, off: 4 });
  return f.svg();
}
function p77() {
  var w = rnd(1, 20), p = pick([1, 1, 1, 1, 2, 2, 3, 4]), H, S, g;
  if (w <= 7) {                                              // H = e^j
    var j = pick([1, 1, 2, 2, 3, 4]);
    H = p77_E(j);
    S = j === 1 ? fr(1, p) : tm(j - 1, p77_E(j), true) + '+1';
    if (j > 1 && p > 1) S = '\\dfrac{' + S + '}{' + p + '}';
  } else if (w <= 14) {                                      // H = k (бүхэл)
    var k = rnd(2, 9), lb = p77_lb(k), cl = k * lb[1], c0 = k - 1, d = p;
    g = gcd(gcd(cl, c0), d); cl /= g; c0 /= g; d /= g;           // (18 ln 3 − 8)/2 → 9 ln 3 − 4
    H = String(k);
    S = (cl === 1 ? '' : cl) + '\\ln ' + lb[0] + '-' + c0;
    if (d > 1) S = '\\dfrac{' + S + '}{' + d + '}';
  } else if (w <= 16) {                                      // H = 1/e^j
    var j2 = rnd(1, 3);
    H = '\\dfrac{1}{' + p77_E(j2) + '}';
    S = p === 1 ? '1-\\dfrac{' + (j2 + 1) + '}{' + p77_E(j2) + '}' : '\\dfrac{' + p77_E(j2) + '-' + (j2 + 1) + '}{' + p + p77_E(j2) + '}';
  } else {                                                   // H = 1/k
    var k2 = rnd(2, 6), lb2 = p77_lb(k2);
    H = '\\dfrac{1}{' + k2 + '}';
    S = '\\dfrac{' + (k2 - 1) + '-' + (lb2[1] === 1 ? '' : lb2[1]) + '\\ln ' + lb2[0] + '}{' + k2 * p + '}';
  }
  // Бодолт: огтлолцол e^{px} = H ⇒ x₀ = ln H/p; e^{px} өсөх тул H > 1 бол [0; x₀]-д e^{px} ≤ H, H < 1 бол [x₀; 0]-д e^{px} ≥ H;
  //   S = H·x₀ − ∫₀^{x₀}e^{px}dx  эсвэл  ∫_{x₀}^0 e^{px}dx − H·|x₀|  (∫e^{px}dx = e^{px}/p, e^{px₀} = H) — хариутай ижил хэлбэрт хураана
  var E = p === 1 ? 'e^x' : 'e^{' + p + 'x}', PX = p === 1 ? 'x' : p + 'x', P1 = p === 1 ? '' : '\\dfrac{1}{' + p + '}';
  var cs = w <= 7 ? 1 : w <= 14 ? 2 : w <= 16 ? 3 : 4, up = cs <= 2, Hv, Hl, x1, xd, xl, xa, mult, HX, ev, note = '', gg;
  if (cs === 1) {
    gg = gcd(j, p); var jn = j / gg, jd = p / gg;
    Hv = Math.exp(j); Hl = p77_E(j); xd = fr(j, p); xl = jd === 1 ? (jn === 1 ? '{{1}}' : '{' + jn + '}') : '{\\frac{' + jn + '}{' + jd + '}}';
    x1 = E + '=' + H + '\\Rightarrow ' + (p === 1 ? '' : PX + '=' + j + '\\Rightarrow ') + 'x=' + xd;
    mult = xd === '1' ? H : H + '\\cdot ' + xd;
    HX = jd === 1 ? (jn === 1 ? '' : jn) + H : '\\dfrac{' + (jn === 1 ? '' : jn) + H + '}{' + jd + '}';
    ev = p === 1 ? '(' + H + '-1)' : '\\dfrac{' + H + '-1}{' + p + '}';
  } else if (cs === 2) {
    gg = gcd(k, p); var kn = k / gg, kd = p / gg;
    Hv = k; Hl = String(k); xd = p === 1 ? '\\ln ' + k : '\\dfrac{\\ln ' + k + '}{' + p + '}'; xl = '{' + xd.replace('\\dfrac', '\\frac') + '}';
    x1 = E + '=' + k + '\\Rightarrow ' + (p === 1 ? '' : PX + '=\\ln ' + k + '\\Rightarrow ') + 'x=' + xd;
    mult = k + (p === 1 ? '' : '\\cdot ') + xd;
    HX = kd === 1 ? (kn === 1 ? '' : kn) + '\\ln ' + k : '\\dfrac{' + (kn === 1 ? '' : kn) + '\\ln ' + k + '}{' + kd + '}';
    ev = fr(k - 1, p);
    note = ', $e^{\\ln ' + k + '}=' + k + '$' + (lb[1] > 1 ? ', $\\ln ' + k + '=' + lb[1] + '\\ln ' + lb[0] + '$' : '');
  } else if (cs === 3) {
    gg = gcd(j2, p);
    Hv = Math.exp(-j2); Hl = 'e^{-' + j2 + '}'; xd = fr(-j2, p); xa = fr(j2, p); xl = '{' + xd.replace('\\dfrac', '\\frac') + '}';
    x1 = E + '=' + H + '=e^{-' + j2 + '}\\Rightarrow ' + (p === 1 ? '' : PX + '=-' + j2 + '\\Rightarrow ') + 'x=' + xd;
    mult = H + (xa === '1' ? '' : '\\cdot ' + xa);
    HX = '\\dfrac{' + j2 / gg + '}{' + (p / gg === 1 ? '' : p / gg) + p77_E(j2) + '}';
    ev = P1 + '\\left(1-' + H + '\\right)';
  } else {
    Hv = 1 / k2; Hl = '1/' + k2; xa = p === 1 ? '\\ln ' + k2 : '\\dfrac{\\ln ' + k2 + '}{' + p + '}'; xd = '-' + xa; xl = '{' + xd.replace('\\dfrac', '\\frac') + '}';
    x1 = E + '=' + H + '\\Rightarrow ' + PX + '=\\ln' + H + '=-\\ln ' + k2 + (p === 1 ? '' : '\\Rightarrow x=' + xd);
    mult = H + (p === 1 ? '' : '\\cdot ') + xa;
    HX = '\\dfrac{\\ln ' + k2 + '}{' + k2 * p + '}';
    ev = fr(k2 - 1, k2 * p);
    note = ', $e^{-\\ln ' + k2 + '}=\\dfrac{1}{' + k2 + '}$' + (lb2[1] > 1 ? ', $\\ln ' + k2 + '=' + lb2[1] + '\\ln ' + lb2[0] + '$' : '');
  }
  var crv = P1 + E + '\\Big|' + (up ? '_0^' + xl : '_' + xl + '^0'), A2 = up ? HX + '-' + ev : ev + '-' + HX;
  return {
    q: '$y=' + (p === 1 ? 'e^x' : 'e^{' + p + 'x}') + '$, $y=' + H + '$, $x=0$ муруйнуудаар хүрээлэгдэх дүрсийн талбайг олоорой.',
    a: '$S=' + S + '$',
    wk: 26,
    s: [
      'Муруй ба шулууны огтлолцох цэгийн абсцисс: $$' + x1 + '.$$',
      '$y=' + E + '$ өсөх функц тул ' + (up
        ? '$0\\le x\\le ' + xd + '$ үед $' + E + '\\le ' + H + '$: дүрс муруйгаас дээш, $y=' + H + '$ шулуунаас доош оршино. Иймд $$S=\\int_0^' + xl + '\\left(' + H + '-' + E + '\\right)dx.$$'
        : '$' + xd + '\\le x\\le 0$ үед $' + E + '\\ge ' + H + '$: дүрс $y=' + H + '$ шулуунаас дээш, муруйгаас доош оршино. Иймд $$S=\\int_' + xl + '^0\\left(' + E + '-' + H + '\\right)dx.$$'),
      '$\\int ' + E + '\\,dx=' + P1.replace('dfrac', 'frac') + E + '+C$' + note + ' тул $$S=' + (up ? mult + '-' + crv : crv + '-' + mult) + '$$ $$=' + A2 + (A2 === S ? '' : '=' + S) + '.$$'
    ],
    sfig: p77_fig(p, Hv, Hl),
    t: { p: p, w: w }
  };
}

// 78. (52-ын ихэр) X: x₁, x₂, x₃; нэг магадлал мэдэгдэх, хоёр нь a, b (зүүнээс баруун тийш); E(X) өгөгдсөн ⇒
//     a + b = 1 − p, x_a·a + x_b·b = E(X) − x_p·p ⇒ a (заримдаа b)  (эх: X 2, 3, 4; P 0.3, a, b; E(X) = 3 → a = 0.4, b = 0.3).
//     Мэдэгдэх магадлал голдуу 1-р баганад (эх шиг), заримдаа 2, 3-р баганад; X — дараалсан (заримдаа 2-ын алхамтай) бүхэл;
//     магадлал 0.1-ийн (заримдаа 0.05-ын) алхамтай, зууны нэгжээр бүхэл тооцоо.
function p78() {
  var x0 = pick([0, 1, 1, 2, 2, 2, 3, 4, 5]), st = rnd(1, 6) === 1 ? 2 : 1, xs = [x0, x0 + st, x0 + 2 * st];
  var step = rnd(1, 10) <= 7 ? 10 : 5, U = 100 / step, cut = [], t;
  for (t = 1; t < U; t++) cut.push(t);
  cut = shuffle(cut).slice(0, 2).sort(function (x, y) { return x - y; });
  var P = [cut[0] * step, (cut[1] - cut[0]) * step, (U - cut[1]) * step];   // зууны нэгжээр, Σ = 100
  if (step === 5 && P.every(function (v) { return v % 10 === 0; })) return null;
  var kp = rnd(1, 10) <= 6 ? 0 : rnd(1, 2), row = ['$P(X=x)$'], at = [], L = ['a', 'b'];
  for (t = 0; t < 3; t++) {
    if (t === kp) row.push(dec(P[t] / 100));
    else { row.push('$' + L[at.length] + '$'); at.push(t); }
  }
  var E = xs[0] * P[0] + xs[1] * P[1] + xs[2] * P[2], k = rnd(1, 4) === 1 ? 1 : 0;   // 100·E(X); асуух үсэг
  // Бодолт: Σp = 1 ⇒ a + b = 1 − p;  E(X) = Σx·p ⇒ x_a·a + x_b·b = E − x_p·p;  системээс асуусан үсгийг (зууны нэгжээр бүхэл тооцоо)
  var xa = xs[at[0]], xb = xs[at[1]], xp = xs[kp], pp = P[kp], S1 = 100 - pp, S2 = E - xp * pp, Dx = xb - xa, Av = P[at[0]], Bv = P[at[1]];
  var d2 = function (v) { return dec(v / 100); }, cols = [0, 1, 2];
  var sumRow = cols.map(function (i) { return i === kp ? d2(pp) : L[at.indexOf(i)]; }).join('+');
  var eRow = cols.map(function (i) { var x = xs[i]; return i === kp ? x + '\\cdot ' + d2(pp) : (x === 0 ? '0\\cdot ' : x === 1 ? '' : x) + L[at.indexOf(i)]; }).join('+');
  var lhs = (xa ? tm(xa, 'a', true) : '') + tm(xb, 'b', !xa), rhs = xp ? d2(E) + '-' + (xp === 1 ? '' : xp + '\\cdot ') + d2(pp) + '=' + d2(S2) : d2(E), s3;
  if (!xa) s3 = k ? (xb === 1 ? 'Иймд $b=' + d2(Bv) + '$.' : 'Эндээс $$b=' + d2(S2) + ':' + xb + '=' + d2(Bv) + '.$$')
    : (xb === 1 ? 'Иймд' : 'Эндээс $b=' + d2(S2) + ':' + xb + '=' + d2(Bv) + '$, иймд') + ' эхний тэгшитгэлээс $$a=' + d2(S1) + '-' + d2(Bv) + '=' + d2(Av) + '.$$';
  else if (!k) s3 = 'Эхний тэгшитгэлийг $' + xb + '$-' + suf(xb, 'аар') + ' үржүүлээд хоёр дахь тэгшитгэлийг хасвал $$' + (Dx === 1 ? '' : Dx) + 'a=' + xb + '\\cdot ' + d2(S1) + '-' + d2(S2)
    + '=' + d2(Dx * Av) + (Dx === 1 ? '' : '\\Rightarrow a=' + d2(Av)) + '.$$';

// 79. (53-ын ихэр) Зоосыг n удаа орхиход (эсвэл n зоосыг нэгэн зэрэг) тоогүй (сүлд) талаар буусан зоосны тоо X ~ B(n, ½):

      '$X^2$-ийн дундаж: $$E(X^2)=' + M2 + (n >= 4 ? '$$ $$' : '') + '=\\dfrac{' + S2 + '}{' + N + '}=' + E2 + '.$$',

// 80. (54-ийн ихэр) |z₁/z₂| = |z₁|/|z₂|.  z₁ = p·u·g, z₂ = q·v: |v| = |u| (v — u-гийн хосмог/эргүүлсэн хувилбар, v ≠ ±u),

  var g = rnd(1, 5) === 1 ? pick([[3, 4], [4, 3], [3, -4], [4, -3]]) : [1, 0], G = g[1] ? 5 : 1;

  if (z2[0] < 0 && rnd(0, 3)) z2 = [-z2[0], -z2[1]];                                 // эх шиг бодит хэсэг голдуу эерэг
  var ex = '\\dfrac{' + p80_c(z1[0], z1[1]) + '}{' + p80_c(z2[0], z2[1]) + '}';

// 81. (55-ын ихэр) z² = w ба Re(z) > 0: z₀ = a + bi (a > 0, b ≠ 0, a ≠ |b|) ⇒ w = (a² − b²) + 2ab·i; Re > 0 шийд нь z₀

  for (j = -1; j >= -5; j--) if (E[j]) out += (E[j] < 0 ? '-' : out ? '+' : '') + '\\dfrac{' + Math.abs(E[j]) + '}{' + p83_E(-j) + '}';
  if (L) out += tm(L, '\\ln ' + c, !out);
  if (C) out += out ? sgn(C) : String(C);
  // Бодолт: модулийн доторх илэрхийлэл x₀-д (k эсвэл ln c) тэмдгээ солино → [a; x₀], [x₀; b] хэсгүүдэд задалж Ньютон–Лейбницийн томьёо.
  //   F(t) = H·t − e^t ((H − eˣ)-ийн эх функц), I₁ = F(x₀) − F(a), I₂ = F(x₀) − F(b); нийлбэр нь хариутай ижил (2F(x₀) − F(a) − F(b))
  var Hs = c ? String(c) : p83_ex(k), X0 = c ? '\\ln ' + c : String(k), Hx = c ? c + 'x' : k === 0 ? 'x' : p83_E(k) + 'x';
  var lim = function (t) { return t === 1 ? '{1}' : String(t); };          // ^{1} → ^{{1}} (асуулттай адил)
  var X0u = c ? X0 : lim(k), Iab = '\\int_{' + a + '}^{' + lim(b) + '}|' + inner + '|\\,dx';
  var Ht = function (t) { return t === 'x0' ? (c ? c + '\\ln ' + c : tm(k, p83_E(k), true) || '') : c ? (c * t ? String(c * t) : '') : k === 0 ? (t ? String(t) : '') : tm(t, p83_E(k), true); };

        + X0 + '$ үед $e^x\\lt ' + Hs + '$, $x\\gt ' + X0 + '$ үед $e^x\\gt ' + Hs + '$. Иймд модулийг задалж интегралыг хоёр хэсэгт хуваая: $$' + Iab + '$$ $$=\\int_{' + a + '}^{' + X0u + '}('
        + Hs + '-e^x)\\,dx+\\int_{' + X0 + '}^{' + lim(b) + '}(e^x-' + Hs + ')\\,dx.$$',

// 84. (59-ийн ихэр) z − z̄ = 2bi ⇒ Im z = b; z нь x² + Bx + k = 0-ийн шийд (бодит коэффициент) ⇒ z̄ мөн шийд ⇒ Re z = −B/2,
//     k = z·z̄ = (B/2)² + b²  (эх: z − z̄ = 4i, x² + 10x + k = 0 → z = −5 ± 2i, k = 25 + 4 = 29).  B тэгш (бүхэл хариу).
function p84() {
  var b = rnd(1, 5), p = nz(-8, 8);
  if (Math.abs(p) === 1 && rnd(0, 1)) return null;
  if (rnd(1, 6) === 1) b = -b;
  // Бодолт: z = a + bi → z − z̄ = 2bi → b; бодит коэффициенттэй тул z̄ мөн шийд → Виет: z + z̄ = 2a = −2p, k = z·z̄ = a² + b²
  //   (x нь тэгшитгэлийн хувьсагч тул бодит/хуурмаг хэсгийг a, b гэж тэмдэглэнэ)
  var zc = function (re, im) { return (re ? String(re) : '') + (im < 0 ? '-' : re ? '+' : '') + (Math.abs(im) === 1 ? '' : Math.abs(im)) + 'i'; };
  return {
    q: '$z-\\bar z=' + 2 * b + 'i$ байх $z$ комплекс тоо $x^2' + tm(2 * p, 'x') + '+k=0$ тэгшитгэлийн шийд болно. Тэгвэл $k$ бодит тоог олоорой.',
    a: '$k=' + (p * p + b * b) + '$',
    wk: 26,
    s: [
      '$z=a+bi$ ($a$, $b$ — бодит тоо) гэвэл $\\bar z=a-bi$ ба $z-\\bar z=2bi$. Иймд $2bi=' + 2 * b + 'i$, $b=' + b + '$.',
      'Тэгшитгэлийн коэффициентүүд бодит тул түүний комплекс шийдүүд хосмог: $z$ ба $\\bar z$. Виетийн теоремоор $$z+\\bar z=2a=' + -2 * p + '\\ \\Rightarrow\\ a=' + -p + '.$$',
      'Иймд $z=' + zc(-p, b) + '$, $\\bar z=' + zc(-p, -b) + '$. Виетийн теоремоор $$k=z\\cdot\\bar z=a^2+b^2=' + par(-p) + '^2+' + par(b) + '^2=' + p * p + '+' + b * b + '=' + (p * p + b * b) + '.$$'

// 85. (60-ын ихэр) Олон гишүүнтийн адилтгал: (x² − ax + m)(bx − n) = bx³ − (n + ab)x² + (an + mb)x − mn.
//     x³-ээс b, нөгөө мэдэгдэх коэффициентоос a-г олоод c-г бодно. c нь x-ийн коэффициент (эх) эсвэл x²-ийн коэффициент.
//     (эх: (x² − ax + 2)(bx − 3) = 2x³ − 13x² + cx − 6 ⇒ b = 2, a = 5, c = 19)
function p85() {
  var m = nz(-5, 5), n = nz(-5, 5), b = pick([2, 2, 3, 3, 4, 5, -2, -3]), a = nz(-6, 6);
  var C3 = b, C2 = -(n + a * b), C1 = a * n + m * b, C0 = -m * n;
  if (!C2 || !C1 || Math.abs(C2) > 30 || Math.abs(C1) > 40) return null;
  if (m < 0 && n < 0 && b < 0) return null;
  var pos = rnd(1, 10) <= 7 ? 1 : 2;                       // c-ийн байр: 1 → x-ийн коэффициент, 2 → x²-ийн коэффициент
  var rhs = tm(C3, 'x^3', true) + (pos === 2 ? '+cx^2' : tm(C2, 'x^2')) + (pos === 1 ? '+cx' : tm(C1, 'x')) + sgn(C0);
  // Бодолт: зүүн талыг задалж бүлэглэнэ → x³-ын коэффициентээс b, нөгөө мэдэгдэх коэффициентээс a → c
  var lhs = '(x^2-ax' + sgn(m) + ')(bx' + sgn(-n) + ')', ba = tm(b, 'a', true), na = tm(n, 'a', true);
  var ml = function (u, v) { return u === 1 ? par(v) : u === -1 ? '-' + par(v) : par(u) + '\\cdot ' + par(v); };   // u·v
  var pl = function (s) { return s[0] === '-' ? s : '+' + s; };
  var s2 = pos === 1
    ? '$x^2$-ын коэффициентээс: $$-(' + ba + sgn(n) + ')=' + C2 + '\\ \\Rightarrow\\ ' + ba + '=' + (-C2 - n) + '\\ \\Rightarrow\\ a=' + a + '.$$'
    : '$x$-ийн коэффициентээс: $$' + na + pl(ml(m, b)) + '=' + C1 + (n === 1 ? '' : '\\ \\Rightarrow\\ ' + na + '=' + (C1 - m * b)) + '\\ \\Rightarrow\\ a=' + a + '.$$';   // n = 1 бол «a = … ⇒ a = …» давхардахгүй
  var c1m = ml(n, a) + pl(ml(m, b)), c1p = n * a + sgn(m * b);   // орлуулга ба үржвэрүүд (ижил бол нэг удаа: «3+2=3+2» биш)
  var s3 = pos === 1
    ? '$c$ нь $x$-ийн коэффициент тул $$c=' + na + tm(m, 'b') + '=' + c1m + (c1m === c1p ? '' : '=' + c1p) + '=' + C1 + '.$$'
    : '$c$ нь $x^2$-ын коэффициент тул $$c=-(ab' + sgn(n) + ')=-(' + par(a) + '\\cdot ' + par(b) + sgn(n) + ')=-(' + a * b + sgn(n) + ')=' + C2 + '.$$';
  return {
    q: '$(x^2-ax' + sgn(m) + ')(bx' + sgn(-n) + ')=' + rhs + '$ бол $c=?$',
    a: '$c=' + (pos === 1 ? C1 : C2) + '$',
    wk: 24,
    s: [
      'Зүүн талыг задалж, $x$-ийн зэргээр бүлэглэе: $$' + lhs + '$$ $$=bx^3-(ab' + sgn(n) + ')x^2+(' + na + tm(m, 'b') + ')x' + sgn(C0) + '.$$',
      'Адилтгалын хоёр талын харгалзах коэффициентүүд тэнцүү. $x^3$-ын коэффициентээс $b=' + b + '$ (сул гишүүн $-' + par(m) + '\\cdot ' + par(n) + '=' + C0 + '$ таарч байна); ' + s2,
      s3

    t: { a: a, b: b, m: m, n: n, pos: pos }
  };
}

// 86. Олон гишүүнтийг олон гишүүнтэд хуваах: P(x) = D(x)·Q(x) + R(x), D = ax² + bx + c, deg R < 2 ⇒ ноогдвор Q(x).
//     Q нь ихэвчлэн шугаман (P куб), заримдаа квадрат (P 4-р зэргийн); үлдэгдэл R ихэвчлэн 0, заримдаа шугаман/тогтмол.
//     (эх: 6x³ − 11x² + 5x − 3 = (3x² − x + 1)(2x − 3) ⇒ ноогдвор 2x − 3)
function p86() {
  var D = [pick([1, 2, 2, 3, 3, 4]), nz(-5, 5), nz(-6, 6)];
  var Q = rnd(1, 4) === 1 ? [pick([1, 1, 2]), nz(-4, 4), nz(-5, 5)] : [pick([1, 2, 2, 3]), nz(-6, 6)];
  if (gcd(gcd(D[0], D[1]), D[2]) !== 1 || Q.reduce(function (s, c) { return gcd(s, c); }, 0) !== 1) return null;   // 2x²+4x−6 мэт биш
  var R = rnd(1, 10) <= 6 ? [0, 0] : [rnd(-4, 4), nz(-6, 6)];
  var P = [], i, j;
  for (i = 0; i < D.length + Q.length - 1; i++) P.push(0);
  for (i = 0; i < D.length; i++) for (j = 0; j < Q.length; j++) P[i + j] += D[i] * Q[j];
  P[P.length - 2] += R[0]; P[P.length - 1] += R[1];
  for (i = 0; i < P.length; i++) if (!P[i] || Math.abs(P[i]) > 40) return null;
  if (P[0] > 12) return null;
  // Бодолт: булангаар хуваах — ахлах гишүүнийг хуваагчийн ахлах гишүүнд хувааж ноогдворын гишүүн, түүнийг хуваагчаар үржүүлж хасна (давтана)
  var cur = P.slice(), ss = [], dg, k, mono = function (c, p) { return tm(c, p === 0 ? '' : p === 1 ? 'x' : 'x^{' + p + '}', true); };
  var nth = ['Булангаар хуваая. Ноогдворын эхний гишүүн', 'Ноогдворын дараагийн гишүүн', 'Ноогдворын дараагийн гишүүн'];
  for (k = 0; k < Q.length; k++) {
    dg = cur.length - 1;
    var qk = cur[0] / D[0], tq = mono(qk, dg - 2), prod = [qk * D[0], qk * D[1], qk * D[2]], nxt = cur.slice(1);
    for (j = 3; j < cur.length; j++) prod.push(0);
    nxt[0] -= prod[1]; nxt[1] -= prod[2];
    ss.push(nth[k] + ': $\\dfrac{' + mono(cur[0], dg) + '}{' + mono(D[0], 2) + '}=' + tq + '$. $' + tq + '\\cdot(' + poly(D) + ')=' + poly(prod) + '$ үржвэрийг '
      + (k ? 'өмнөх үлдэгдлээс' : 'хуваагдагчаас') + ' хасвал: $$(' + poly(cur) + ')-(' + poly(prod) + ')$$ $$=' + poly(nxt) + '.$$');
    cur = nxt;
  }
  var Rz = !cur[0] && !cur[1];
  ss.push((Rz ? 'Үлдэгдэл $0$ тул ' + 'хуваагдагч хуваагчид үлдэгдэлгүй хуваагдана.' : 'Гарсан $R(x)=' + poly(cur) + '$ олон гишүүнтийн зэрэг хуваагчийнхаас бага тул энэ нь үлдэгдэл болж, хуваалт дуусна.')
    + ' Иймд ноогдвор олон гишүүнт: $' + poly(Q) + '$.');
  return {
    q: '$' + poly(P) + '$ олон гишүүнтийг $' + poly(D) + '$ олон гишүүнтэд хуваахад гарах ноогдвор олон гишүүнтийг ол.',
    a: '$' + poly(Q) + '$',
    wk: 28,
    s: ss,

  };
}

// 87. (61-ийн ихэр) f(x) = a^{x+p} + q ⇒ урвуу функц g(x) = log_a(x − q) − p (x > q).  g(g(x₀)) = z ⇔ x₀ = f(f(z)):
//     z-ээс эхэлж y₁ = f(z), x₀ = f(y₁); илтгэгч z + p ≥ 0, y₁ + p ≥ 0 тул y₁, x₀ бүхэл ба x₀, y₁ > q (g тодорхойлогдоно).
//     (эх: f(x) = 3^{x−1} + 1: g(4) = 2, g(2) = 1 ⇒ g(g(4)) = 1)
function p87() {
  var a = pick([3, 3, 3, 2, 2, 4, 5]), p, q, z, y1, x0, ok = false;   // суурийг эхэлж сонгоно (их суурьт тохирох хувилбар цөөн)
  for (var t = 0; t < 80 && !ok; t++) {
    p = pick([-1, -1, -2, 0, 1, 1, 2]); q = nz(-4, 4); z = rnd(-2, 3);
    if (z + p < 0) continue;
    y1 = Math.pow(a, z + p) + q;
    if (y1 + p < 0) continue;
    x0 = Math.pow(a, y1 + p) + q;
    ok = Math.abs(x0) <= 70 && y1 !== z && x0 !== y1 && x0 !== z;
  }
  if (!ok) return null;
  var fx = a + '^' + (p ? '{x' + sgn(p) + '}' : 'x') + sgn(q), G = 'g\\big(g(' + x0 + ')\\big)';
  // Бодолт: y = a^{x+p} + q-ээс x-ийг илэрхийлж g(x) = log_a(x − q) − p; дотроос нь эхэлж g(x₀) = y₁, дараа нь g(y₁) = z
  var ex = p ? '{x' + sgn(p) + '}' : 'x', sp = p ? sgn(-p) : '', lg = '\\log_' + a;
  var gv = function (u, w) {   // g(u) = log_a(u − q) − p = w  (u − q = a^{w+p})
    var e = w + p;
    return '$$g(' + u + ')=' + lg + '(' + u + sgn(-q) + ')' + sp + '=' + lg + ' ' + (u - q) + sp + '=' + e + (p ? sp + '=' + w : '') + '.$$';
  };
  return {
    q: '$f(x)=' + fx + '$ функцийн урвуу функц нь $y=g(x)$ бол $' + G + '=?$',
    a: '$' + G + '=' + z + '$',
    wk: 26,
    s: [
      'Урвуу функцийг олъё: $y=' + fx + '$ тэгшитгэлээс $x$-ийг илэрхийлбэл $$' + a + '^' + ex + '=y' + sgn(-q) + '\\ \\Rightarrow\\ ' + (p ? 'x' + sgn(p) + '=' + lg + '(y' + sgn(-q) + ')\\ \\Rightarrow\\ ' : '')
        + 'x=' + lg + '(y' + sgn(-q) + ')' + sp + '.$$ $x$, $y$-ийн байрыг сольвол $g(x)=' + lg + '(x' + sgn(-q) + ')' + sp + '$ $(x\\gt ' + q + ')$.',
      'Эхлээд дотор талын утга: ' + gv(x0, y1),
      'Дараа нь: ' + gv(y1, z),
      'Иймд $' + G + '=g(' + y1 + ')=' + z + '$.'
    ],
    t: { a: a, p: p, q: q, x0: x0, y1: y1, z: z }
  };
}

// 88. (62-ын ихэр) Илтгэгч тэгшитгэл: t = B^x > 0 гэвэл B^{2x+k} − m×B^{x+j} + n = 0 ⇔ B^k·t² − m·B^j·t + n = 0 (j ≠ 0).
//     Язгуурууд t₁ = B^u, t₂ = B^v (u > v бүхэл) ⇒ x₁ + x₂ = u + v;  m = B^{k−j+u} + B^{k−j+v}, n = B^{k+u+v}
//     (бүхэл: k − j + v ≥ 0, k + u + v ≥ 0).  (эх: 2^{2x+1} − 9×2^{x−1} + 1 = 0 → 4t² − 9t + 2 = 0 → t = 2; ¼ → x = 1; −2 → нийлбэр −1)
function p88() {
  var B = rnd(1, 4) === 1 ? 3 : 2;
  var k = B === 2 ? pick([1, 1, 1, 0, 2, 2, 3]) : pick([0, 1, 1, 2]), j = B === 2 ? pick([-1, -1, -1, -2, 1, 2]) : pick([-1, -1, 1]);
  var v = rnd(-3, 2), u = v + rnd(1, B === 2 ? 4 : 3);
  if (k - j + v < 0 || k + u + v < 0) return null;
  var m = Math.pow(B, k - j + u) + Math.pow(B, k - j + v), n = Math.pow(B, k + u + v);
  if (m < 2 || m > 40 || n > 81) return null;
  // Бодолт: t = B^x > 0 → B^k·t² − m·B^j·t + n = 0; бүхэл, хураасан коэффициенттэй болгож (×L эсвэл :g) дискриминантаар t₁ = B^u, t₂ = B^v
  var pw = Math.pow, Bk = pw(B, k), Bs = pw(B, Math.abs(j)), L = 1, A2, A1, A0, g0, ss = [];
  var T2 = (k ? Bk : '') + 't^2', T1 = j > 0 ? Bs + 't' : '\\dfrac{t}{' + Bs + '}';
  if (j > 0) { A2 = Bk; A1 = -m * Bs; A0 = n; }
  else { L = Bs / gcd(m, Bs); A2 = Bk * L; A1 = -m * L / Bs; A0 = n * L; }
  g0 = gcd(gcd(A2, A1), A0); A2 /= g0; A1 /= g0; A0 /= g0;
  var eq0 = T2 + (j > 0 ? tm(-m * Bs, 't') : '-' + m + '\\cdot\\dfrac{t}{' + Bs + '}') + '+' + n, eq1 = poly([A2, A1, A0], 't');
  ss.push('$t=' + B + '^x$ $(t\\gt 0)$ гэвэл $' + B + '^{2x' + (k ? sgn(k) : '') + '}=' + T2 + '$, $' + B + '^{x' + sgn(j) + '}=' + T1 + '$. Тэгшитгэл: $$' + eq0 + '=0.$$');
  if (L > 1) ss.push('Хоёр талыг $' + L + '$-' + suf(L, 'аар') + ' үржүүлбэл: $$' + eq1 + '=0.$$');
  else if (g0 > 1) ss.push((j < 0 ? 'Хялбарчилж, хоёр талыг' : 'Хоёр талыг') + ' $' + g0 + '$-' + suf(g0, 'д') + ' хуваавал: $$' + eq1 + '=0.$$');
  else if (j < 0) ss.push('Хялбарчилбал: $$' + eq1 + '=0.$$');
  var D = A1 * A1 - 4 * A2 * A0, sq = Math.round(Math.sqrt(D)), den = A2 === 1 ? '2' : '2\\cdot ' + A2;
  var tv = function (e) { return e >= 0 ? String(pw(B, e)) : '\\dfrac{1}{' + pw(B, -e) + '}'; };

    + tv(u) + ',\\quad t_2=\\dfrac{' + -A1 + '-' + sq + '}{' + den + '}=' + tv(v) + '.$$ Хоёр язгуур хоёулаа эерэг тул $t\\gt 0$ нөхцөлийг хангана.');
  ss.push(bk(u, 1) + ', ' + bk(v, 2) + '. Иймд $x_1+x_2=' + (v ? u + '+' + par(v) + '=' : '') + (u + v) + '$.');

// 89. (63-ын ихэр) Логарифм тэнцэтгэл биш log_B(p − x) − log_{B²}(x − q) ≤ k, муж q < x < p.  log_{B²}(x − q) = ½·log_B(x − q) тул
//     2·log_B(p − x) − log_B(x − q) ≤ 2k ⇔ (p − x)² ≤ K(x − q), K = B^{2k} ⇔ r₁ ≤ x ≤ r₂, r₁,₂ = p + (K ∓ s)/2, s = √(K² + 4K(p − q)).
//     Үргэлж q < r₁ < p < r₂ ⇒  ≤: r₁ ≤ x < p;  <: r₁ < x < p;  ≥: q < x ≤ r₁;  >: q < x < r₁  (s бүхэл, r₁ бүхэл байхаар p − q-г сонгоно).
//     Эхийн бичлэг: «Логарифм тэнцэтгэл биш бодоорой.» дараагийн мөрөнд тэнцэтгэл биш.
//     (эх: log₂(2 − x) − log₄(x + 1) ≤ 1 → (2 − x)² ≤ 4(x + 1) → 0 ≤ x ≤ 8 → 0 ≤ x < 2)
function p89() {
  var B = rnd(1, 4) === 1 ? 3 : 2, k = B === 2 ? pick([1, 1, 1, 1, 0, 2]) : pick([1, 1, 0]), K = Math.pow(B, 2 * k), ds = [], d, s;
  for (d = 1; d <= 16; d++) {

  // Бодолт: муж q < x < p; log_{B²}(x − q) = ½·log_B(x − q) → ×2 → log_B((p − x)²/(x − q)) ⋚ log_B K (K = B^{2k}) →

  var b1 = 2 * p + K, c0 = p * p + K * q, r2 = p + (K + s) / 2, fx = function (r) { return r ? '(x' + sgn(-r) + ')' : 'x'; };
  var quad = poly([1, -b1, c0]), le = rel === 'le' || rel === 'lt', w = rel === 'le' || rel === 'ge' ? '\\le' : '\\lt';
  var sol = le ? '$' + r1 + w + ' x' + w + ' ' + r2 + '$' : '$x' + (rel === 'ge' ? '\\le ' : '\\lt ') + r1 + '$ эсвэл $x' + (rel === 'ge' ? '\\ge ' : '\\gt ') + r2 + '$';
  return {
    q: 'Логарифм тэнцэтгэл биш бодоорой.<br>&emsp;$' + ineq + '$',
    a: '$' + ans + '$',
    wk: 32,
    s: [
      'Тодорхойлогдох муж: $' + p + '-x\\gt 0$ ба $' + xq + '\\gt 0$, өөрөөр хэлбэл $' + q + '\\lt x\\lt ' + p + '$.',
      'Логарифмын чанараар $\\log_{' + B * B + '}' + Xq + '=\\dfrac{1}{2}' + lB + Xq + '$. Хоёр талыг $2$-оор үржүүлбэл $$2' + lB + px + '-' + lB + Xq + R + 2 * k + '.$$ $'
        + 2 * k + '=' + lB + ' ' + K + '$ гэж бичээд логарифмуудыг нэгтгэвэл $$' + lB + '\\dfrac{' + px + '^2}{' + xq + '}' + R + lB + ' ' + K + '.$$',
      'Суурь $' + B + '\\gt 1$ (функц өсөх) ба $' + xq + '\\gt 0$ тул $$' + px + '^2' + R + (K === 1 ? xq : K + Xq) + '$$ $$\\Rightarrow\\ ' + quad + R + '0.$$',
      (c0 ? 'Язгуурууд: $$D=' + b1 + '^2-4\\cdot ' + par(c0) + '=' + s * s + '=' + s + '^2,$$ $$x_{1,2}=\\dfrac{' + b1 + '\\mp ' + s + '}{2}\\ \\Rightarrow\\ x_1=' + r1 + ',\\ x_2=' + r2 + '.$$ '
        : 'Үржигдэхүүнд задалбал $' + quad + '=x(x-' + r2 + ')$, язгуурууд $x_1=0$, $x_2=' + r2 + '$. ')
        + 'Интервалын аргаар $' + fx(r1) + fx(r2) + R + '0$ тэнцэтгэл бишийн шийд: ' + sol + '.',
      'Мужтай огтлолцуулбал ($' + q + '\\lt ' + r1 + '\\lt ' + p + '\\lt ' + r2 + '$): $' + ans + '$.'

// 90. O(0;0) төвтэй θ өнцгийн эргүүлэлтийн матриц: A = (cos θ  −sin θ; sin θ  cos θ).
//     θ голдуу 90°-ын үржвэр (±90°, ±180°, ±270° — бүхэл элементтэй), заримдаа 30°, 45°, 60°, 120°, … (язгууртай яг утга).
//     Эхийн үг хэллэг («эргүүлэлтийг A хувиргалтын матриц аль вэ?») хэвээр.
function p90_neg(t) { return t === '0' ? '0' : t[0] === '-' ? t.slice(1) : '-' + t; }
function p90_cs(deg) {   // [cos, sin] TeX (яг утга); deg — 30 эсвэл 45-ын үржвэр
  var B = { 0: ['1', '0'], 30: ['\\frac{\\sqrt{3}}{2}', '\\frac{1}{2}'], 45: ['\\frac{1}{\\sqrt{2}}', '\\frac{1}{\\sqrt{2}}'],
    60: ['\\frac{1}{2}', '\\frac{\\sqrt{3}}{2}'], 90: ['0', '1'] };
  var a = ((deg % 360) + 360) % 360, q = Math.floor(a / 90), cs = B[a - 90 * q];
  return q === 0 ? [cs[0], cs[1]] : q === 1 ? [p90_neg(cs[1]), cs[0]] : q === 2 ? [p90_neg(cs[0]), p90_neg(cs[1])] : [cs[1], p90_neg(cs[0])];
}
function p90_mx(rows) {   // бутархайтай матрицад мөр хооронд зай (√-тэй хуваарь давхцахгүй)
  return '\\begin{pmatrix}' + rows.map(function (r) { return r.join('&'); }).join(/frac/.test(rows.join()) ? '\\\\[6pt]' : '\\\\') + '\\end{pmatrix}';
}
function p90() {
  var deg = rnd(1, 5) <= 3 ? pick([90, 90, 180, 270, -90, -90, -180, -270])
    : pick([30, 45, 60, 120, 135, 150, 210, 225, 240, 300, 315, 330, -30, -45, -60, -120, -135, -150]);
  var cs = p90_cs(deg), M = [[cs[0], p90_neg(cs[1])], [cs[1], cs[0]]];
  // Бодолт: R(θ) = (cos θ  −sin θ; sin θ  cos θ); cos, sin-ийг (сөрөг өнцөгт тэгш/сондгой чанар, бусад үед 180°/360°-аас) олж орлуулна
  var D = function (t) { return t < 0 ? '(' + t + '^\\circ)' : t + '^\\circ'; }, df = function (s) { return s.replace(/\\frac/g, '\\dfrac'); };
  var ad = Math.abs(deg), qd = ad % 90 === 0;
  var red = function (fn) {   // θ > 90° (90-ийн үржвэр биш): θ = 180° − α, 180° + α, 360° − α
    if (qd || ad < 90) return '';
    var al = ad < 180 ? 180 - ad : ad < 270 ? ad - 180 : 360 - ad, sh = ad < 180 ? '180^\\circ-' : ad < 270 ? '180^\\circ+' : '360^\\circ-';
    var sv = fn === 'cos' ? (ad < 270 ? '-' : '') : (ad < 180 ? '' : '-');
    return '=\\' + fn + '(' + sh + al + '^\\circ)=' + sv + '\\' + fn + ' ' + al + '^\\circ';
  };
  var line = function (fn) {   // сөрөг өнцөгт: cos(−α) = cos α, sin(−α) = −sin α
    var val = df(fn === 'cos' ? cs[0] : cs[1]);
    if (deg > 0) return '\\' + fn + ' ' + D(deg) + red(fn) + '=' + val;
    return '\\' + fn + D(deg) + '=' + (fn === 'cos' ? '' : '-') + '\\' + fn + ' ' + ad + '^\\circ=' + val;
  };
  return {
    q: '$O(0;\\,0)$ төвтэй $' + deg + '^\\circ$ өнцгөөр эргүүлэх эргүүлэлтийг $A$ хувиргалтын матриц аль вэ?',
    a: '$A=' + p90_mx(M) + '$',
    wk: 20,
    s: [
      'Координатын эх дээр төвтэй $\\theta$ өнцгийн эргүүлэлтийн матриц $$A=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}.$$'
        + (deg < 0 ? ' $\\theta=' + deg + '^\\circ$ нь цагийн зүүний дагуу $' + ad + '^\\circ$ эргүүлэлт.' : ' $\\theta=' + deg + '^\\circ\\gt 0$ — цагийн зүүний эсрэг эргүүлэлт.'),
      '$\\theta=' + deg + '^\\circ$ үед $$' + line('cos') + ',$$ $$' + line('sin') + '.$$',
      'Орлуулбал ($-\\sin\\theta=' + df(p90_neg(cs[1])) + '$) $$A=' + p90_mx(M) + '.$$'
    ],
    t: { deg: deg }

// 91. Хувиргалтын үржвэрийн дараалал: E, F хувиргалтын матриц харгалзан A, B бол FE (= эхлээд E, дараа нь F) хувиргалтын
//     матриц BA. Үсгийн хос/гурвал, FE эсвэл EF бичлэг, эсвэл «эхлээд …, дараа нь …» өгүүлбэр; заримдаа гурван хувиргалт.
//     Дүрэм: XY…Z бичлэгийн матриц = M_X·M_Y·…·M_Z (баруун талын хувиргалт эхэлж хийгдэнэ).
var p91_TR = [['E', 'F', 'G'], ['P', 'Q', 'R'], ['S', 'T', 'U'], ['F', 'G', 'H'], ['K', 'L', 'N']];
var p91_MX = [['A', 'B', 'C'], ['M', 'N', 'K'], ['X', 'Y', 'Z'], ['C', 'D', 'K']];
function p91() {
  var n = rnd(1, 4) === 1 ? 3 : 2, T = pick(p91_TR).slice(0, n), M = pick(p91_MX).slice(0, n), i;
  for (i = 0; i < n; i++) if (M.indexOf(T[i]) >= 0) return null;   // хувиргалт ба матрицын үсэг давхцахгүй
  // ord — бичлэгийн дараалал (зүүнээс баруун): хамгийн баруун талынх эхэлж хийгдэнэ
  var ord = n === 2 ? pick([[1, 0], [1, 0], [0, 1]]) : pick([[2, 1, 0], [0, 1, 2], [1, 2, 0], [2, 0, 1], [0, 2, 1], [1, 0, 2]]);
  var lst = function (a) { return n === 2 ? '$' + a[0] + '$ ба $' + a[1] + '$' : '$' + a[0] + '$, $' + a[1] + '$ ба $' + a[2] + '$'; };
  var what;
  if (rnd(1, 3) < 3) what = '$' + ord.map(function (j) { return T[j]; }).join('') + '$ хувиргалтын матриц';
  else {
    var ap = ord.slice().reverse();   // хийгдэх дараалал
    what = 'эхлээд $' + T[ap[0]] + '$, дараа нь $' + T[ap[1]] + '$' + (n === 3 ? ', эцэст нь $' + T[ap[2]] + '$' : '') + ' хувиргалт хийхэд гарах хувиргалтын матриц';
  }
  // Бодолт: хувиргалт бүр координатын баганыг матрицаар (зүүнээс) үржүүлнэ; бичлэгийн баруун талынх эхэлж үйлчилнэ →
  // F(E(v)) = B(Av) = (BA)v (бүлэх чанар); сүүлд хийсэн хувиргалтын матриц зүүн талд
  var wr = what.charAt(0) === '$', ap0 = ord.slice().reverse(), mw = ord.map(function (j) { return M[j]; }).join('');
  var nT = '\\vec v', nM = M[ord[n - 1]] + '\\vec v';
  for (i = n - 1; i >= 0; i--) nT = T[ord[i]] + '(' + nT + ')';
  for (i = n - 2; i >= 0; i--) nM = M[ord[i]] + '\\,(' + nM + ')';
  var defs = T.map(function (t, j) { return '$' + t + '(\\vec v)=' + M[j] + '\\vec v$'; });
  var seq = 'эхлээд $' + T[ap0[0]] + '$, дараа нь $' + T[ap0[1]] + '$' + (n === 3 ? ', эцэст нь $' + T[ap0[2]] + '$' : '');
  var sol = ['Хувиргалт бүр цэгийн координатын $\\vec v=\\begin{pmatrix}x\\\\y\\end{pmatrix}$ баганыг өөрийн матрицаар зүүн талаас нь үржүүлнэ: '
    + defs.slice(0, -1).join(', ') + ' ба ' + defs[n - 1] + '.'];
  if (wr) sol.push('$' + ord.map(function (j) { return T[j]; }).join('') + '$ бичлэгт баруун талын хувиргалт эхэлж үйлчилнэ: ' + seq + '.');
  sol.push((wr ? 'Иймд' : seq.charAt(0).toUpperCase() + seq.slice(1) + ' хувиргалт хийхэд') + ' $\\vec v$ цэг $$' + nT + '=' + nM + '=(' + mw + ')\\,\\vec v$$ цэгт шилжинэ (матрицын үржвэр бүлэх чанартай).');
  sol.push('Сүүлд хийсэн хувиргалтын матриц зүүн талд бичигдэнэ. Матрицын үржвэр ерөнхийдөө солигдох чанаргүй тул энэ дараалал чухал. Иймд хувиргалтын матриц $' + mw + '$.');
  return {
    q: 'Хэрэв ' + lst(T) + ' хувиргалтын матриц харгалзан ' + lst(M) + ' бол ' + what + ' ... байна.',
    a: '$' + ord.map(function (j) { return M[j]; }).join('') + '$',
    wk: 14,
    s: sol,
    t: { T: T, M: M, ord: ord }

}

// 92. E — M матрицтай (шугаман) хувиргалт, F — v вектороор параллель зөөлт. FE (эхлээд E, дараа нь F): X' = M·X + v;
//     EF (эхлээд F, дараа нь E): X' = M·(X + v) = M·X + M·v (M·v-г тооцоолж бичнэ). Эхэд үсгэн (a, b, …) — энд тодорхой тоо.
function p92_col(u, v) { return '\\begin{pmatrix}' + u + '\\\\' + v + '\\end{pmatrix}'; }
function p92() {
  var a = rnd(-5, 5), b = rnd(-5, 5), c = rnd(-5, 5), d = rnd(-5, 5);
  if ([a, b, c, d].filter(function (x) { return !x; }).length > 1) return null;   // хэт энгийн (диагональ г.м) биш
  if (!(a * d - b * c)) return null;                                             // хувиргалт доройтоогүй
  var e = nz(-6, 6), f = nz(-6, 6), fe = rnd(1, 5) <= 3;

  var M = mat([[a, b], [c, d]]);
  // Бодолт: FE — эхлээд E (M·X), дараа нь F (+v) ⇒ X' = M·X + v;  EF — эхлээд F (X + v), дараа нь E ⇒ M(X + v) = M·X + M·v
  var X = p92_col('x', 'y'), Xp = p92_col("x'", "y'"), V = p92_col(e, f), sol;
  var dot = function (p, q, r, s) {   // p·q + r·s (тэг гишүүнийг бичихгүй)
    var t1 = p ? dec(p) + '\\cdot ' + par(q) : '', t2 = r ? (r < 0 ? '-' : t1 ? '+' : '') + dec(Math.abs(r)) + '\\cdot ' + par(s) : '';
    return t1 + t2;
  };
  if (fe) sol = [
    '$FE$ гэдэг нь эхлээд $E$, дараа нь $F$ хувиргалт хийх (баруун талынх эхэлж үйлчилнэ). $E$ хувиргалт $(x;\\,y)$ цэгийг $$' + M + X + '$$ цэгт шилжүүлнэ.',
    'Дараа нь $F$ хувиргалт уг цэгийг $' + V + '$ вектороор зөөнө, өөрөөр хэлбэл энэ векторыг нэмнэ. Иймд $$' + Xp + '=' + M + X + '+' + V + '.$$'
  ];
  else sol = [
    '$EF$ гэдэг нь эхлээд $F$, дараа нь $E$ хувиргалт хийх (баруун талынх эхэлж үйлчилнэ). $F$ хувиргалт $(x;\\,y)$ цэгийг $$' + X + '+' + V + '$$ цэгт зөөнө.',
    'Дараа нь $E$ хувиргалт уг цэгийн баганыг $E$-ийн матрицаар үржүүлнэ. Матрицын үржвэрийн хаалт задлах чанараар $$' + Xp + '=' + M + '\\left(' + X + '+' + V + '\\right)$$ $$=' + M + X + '+' + M + V + '.$$',
    'Сүүлийн үржвэрийг бодъё: $$' + M + V + '=' + p92_col(dot(a, e, b, f), dot(c, e, d, f)) + '=' + p92_col(w[0], w[1]) + '.$$',
    'Иймд $$' + Xp + '=' + M + X + '+' + p92_col(w[0], w[1]) + '.$$'
  ];
  return {
    q: '$E$ нь $' + M + '$ матрицтай хувиргалт ба $F$ нь $' + p92_col(e, f) + '$ вектороор параллель зөөлт байг. $' + (fe ? 'FE' : 'EF')
      + '$ хувиргалтын томьёог матрицан хэлбэрт бичээрэй.',
    a: '$' + p92_col("x'", "y'") + '=' + M + p92_col('x', 'y') + '+' + p92_col(w[0], w[1]) + '$',
    wk: 28,
    s: sol,
    t: { M: [[a, b], [c, d]], v: [e, f], fe: fe }
  };
}

// 93. Хоёр хувиргалтыг A ба B гэж нэрлээд, «эхлээд A, дараа нь B» дараалсан хувиргалтын матриц = (B-ийн матриц)·(A-ийн матриц).
//     Хувиргалтууд: O төвтэй 90°, 180°, 270°, −90° эргүүлэлт; Ox, Oy, y = x, y = −x тэгш хэм; O төвтэй тэгш хэм; O төвтэй
//     k ∈ {±2, ±3} гомотет. Хоёулаа эргүүлэлт биш, матриц нь ялгаатай.

      if ((!p[0] && !q[0]) || (!p[1] && !q[1])) return true;
      if (p[0] === q[0] && Math.min(p[1], q[1]) <= -1 && Math.max(p[1], q[1]) >= 0) return true;
      if (p[1] === q[1] && Math.min(p[0], q[0]) <= -1 && Math.max(p[0], q[0]) >= 0) return true;
      return false;
    });
  });
  if (bad) return null;
  // Харах муж: гурвалжнууд, координатын эх, төв + 1 нүдний зай; 9..13 нүд
  var all = A.concat(B, [S, [0, 0]]), xs = all.map(function (p) { return p[0]; }), ys = all.map(function (p) { return p[1]; });
  var X0 = Math.min.apply(null, xs) - 1, X1 = Math.max.apply(null, xs) + 1, Y0 = Math.min.apply(null, ys) - 1, Y1 = Math.max.apply(null, ys) + 1;
  if (X1 - X0 > 13 || Y1 - Y0 > 13) return null;
  while (X1 - X0 < 9) { X1++; if (X1 - X0 < 9) X0--; }
  while (Y1 - Y0 < 9) { Y1++; if (Y1 - Y0 < 9) Y0--; }
  var u = Math.min(24, 270 / (X1 - X0 + 0.9), 280 / (Y1 - Y0 + 0.9));

  var IA = p100_inc(A), IB = p100_inc(B);
  if (Math.min(IA.r, IB.r) * u < 10) return null;
  if ([IA.c, IB.c].some(function (c) { var dx = c[0] * u, dy = c[1] * u; return (dy > -22 && dy < 9) || (dx > -33 && dx < 9); })) return null;
  var f = Fig({ view: [X0 - 0.3, X1 + 0.6, Y0 - 0.3, Y1 + 0.6], unit: u, pad: 14, padR: 24 }), tx = [], ty = [], j;   // padR: «x» нэр SVG-д багтана
  for (j = X0; j <= X1; j++) { f.seg([j, Y0], [j, Y1], { c: '#c9c9c9', w: 0.7 }); if (j) tx.push(j); }
  for (j = Y0; j <= Y1; j++) { f.seg([X0, j], [X1, j], { c: '#c9c9c9', w: 0.7 }); if (j) ty.push(j); }
  f.poly(A, { fill: '#dcdcdc', op: 0.6, w: 1.5 }).poly(B, { fill: '#dcdcdc', op: 0.6, w: 1.5 });
  f.axes({ o: '0' }).ticks(tx, ty, { size: 10, len: 2.5 });
  A.concat(B).forEach(function (p) { f.dot(p, { r: 2.3 }); });
  f.text(IA.c, 'A', { size: 14, halo: true }).text(IB.c, 'B', { size: 14, halo: true });
  return {
    q: 'Зурагт $A$ дүрсийг $B$ дүрсэд гомотетоор хувиргажээ. Гомотетын төв ба коэффициентийг олоорой.',
    a: 'Төв $' + pt(S[0], S[1]) + '$, $k=' + (k === 0.5 ? '\\dfrac{1}{2}' : k) + '$',
    fig: f.svg(), side: false, wk: 30,
    s: p100_sol(A, B, S, k),

    t: { A: A, B: B }
  };
