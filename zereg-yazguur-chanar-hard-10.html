<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>n зэргийн язгуурын чанар-2 (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.cols3{grid-template-columns:repeat(3,1fr);gap:8px 16px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:15px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.sm{height:14mm}.work.md{height:22mm}.work.lg{height:27mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var LAB=['а','б','в','г','д','е','ё','ж','з','и','й','к','л','м','н','о','п','р'];
function rad(n,inner){return n===2?('\\sqrt{'+inner+'}'):('\\sqrt['+n+']{'+inner+'}');}
function ipow(b,e){var r=1;for(var i=0;i<e;i++)r*=b;return r;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function isFree(m,n){var mm=m;for(var p=2;p*p<=mm;p++){var e=0;while(mm%p===0){mm/=p;e++;}if(e>=n)return false;}return true;}
var FREE={};function freeList(n){if(FREE[n])return FREE[n];var a=[];for(var m=2;m<=20;m++)if(isFree(m,n))a.push(m);FREE[n]=a;return a;}
function nthFree(N,n){var out=1,inn=1,m=N;for(var p=2;p*p<=m;p++){if(m%p===0){var e=0;while(m%p===0){m/=p;e++;}var q=Math.floor(e/n),r=e%n;out*=ipow(p,q);inn*=ipow(p,r);}}if(m>1)inn*=m;return [out,inn];}
var ORD='abcmnxy';
function varsTex(vs){var ks=Object.keys(vs).sort(function(a,b){return ORD.indexOf(a)-ORD.indexOf(b);});var s='';for(var i=0;i<ks.length;i++){var e=vs[ks[i]];if(e>0)s+=ks[i]+(e>1?'^{'+e+'}':'');}return s;}
function sideTex(c,vs){var v=varsTex(vs);if(c===1)return v||'1';return c+v;}

// Ерөнхий хялбарчлагч: coefC · ∏v^coefExp · ⁿ√( kNum/kDen · ∏v^radExp )
function simp(n,kNum,kDen,radExp,coefNum,coefDen,coefExp){
  var oNum=coefNum,oDen=coefDen;
  // тогтмол хуваарийг рационалжуулах: ⁿ√(a/b)=ⁿ√(a·bⁿ⁻¹)/b
  if(kDen>1){kNum=kNum*ipow(kDen,n-1);oDen*=kDen;kDen=1;}
  var fr=nthFree(kNum,n);oNum*=fr[0];var iC=fr[1];
  var oExp={},iExp={},vars={},k;
  for(k in radExp)vars[k]=1; for(k in coefExp)vars[k]=1;
  for(k in vars){var a=radExp[k]||0,q=Math.floor(a/n),r=a-q*n,oe=(coefExp[k]||0)+q;if(oe!==0)oExp[k]=oe;if(r>0)iExp[k]=r;}
  var g=gcd(oNum,oDen);if(g>1){oNum/=g;oDen/=g;}
  // tex
  var pos={},neg={};for(k in oExp){if(oExp[k]>0)pos[k]=oExp[k];else neg[k]=-oExp[k];}
  var hasInside=(iC!==1)||Object.keys(iExp).length>0;
  var radTex=hasInside?rad(n,sideTex(iC,iExp)):'';
  var num=sideTex(oNum,pos);
  if(radTex){num=(num==='1')?radTex:(num+radTex);}
  var den=sideTex(oDen,neg);
  var tex=(den==='1')?num:('\\dfrac{'+num+'}{'+den+'}');
  return {tex:tex,n:n,oNum:oNum,oDen:oDen,oExp:oExp,iC:iC,iExp:iExp,hasInside:hasInside};
}
function simpVal(r,vals){var v=r.oNum/r.oDen,k;for(k in r.oExp)v*=Math.pow(vals[k],r.oExp[k]);if(r.hasInside){var ins=r.iC;for(k in r.iExp)ins*=Math.pow(vals[k],r.iExp[k]);v*=Math.pow(ins,1/r.n);}return v;}
function rv(){return 1.3+Math.random()*3.4;}   // санамсаргүй эерэг утга
function chkVals(vars,orig,simplified){for(var t=0;t<4;t++){var vals={};for(var i=0;i<vars.length;i++)vals[vars[i]]=rv();var o=orig(vals),s=simpVal(simplified,vals);if(!isFinite(o)||!isFinite(s)||Math.abs(o-s)>1e-6*Math.max(1,Math.abs(o)))return false;}return true;}

// 1) Хувьсагчтай хялбарчил:  ⁿ√( cⁿ·f · ∏v^e )
function gVarSimp(){
  var n=pick([2,2,3,3,4]);
  var vs=pick([['x','y'],['a','b'],['x'],['a'],['x','y'],['m','n']]);
  var c=rnd(2,{2:12,3:5,4:3}[n]),f=pick([1,1].concat(freeList(n).slice(0,6)));
  var kNum=ipow(c,n)*f;
  var radExp={};for(var i=0;i<vs.length;i++)radExp[vs[i]]=rnd(1,2*n);
  var res=simp(n,kNum,1,radExp,1,1,{});
  var origInner=kNum;var orig=function(vals){var p=Math.pow(kNum,1/n);for(var k in radExp)p*=Math.pow(vals[k],radExp[k]/n);return p;};
  if(!chkVals(vs,orig,res))return null;
  var q=rad(n,sideTex(kNum,radExp));
  if(q===res.tex)return null;
  return {q:q,a:res.tex,ok:true};
}
// 2) Давхар язгуурыг дан язгуур болго
function gNested(){
  var cnt=pick([2,2,3]),idx=[],prod=1;
  for(var i=0;i<cnt;i++){var x=pick([2,3]);if(prod*x>24)x=2;idx.push(x);prod*=x;}
  if(prod<4)return null;
  var kind=pick(['var','num','num']);
  if(kind==='var'){
    var e=pick([1,1,1,prod,Math.max(1,Math.floor(prod/2))]);
    var inner=(e===1)?'x':('x^{'+e+'}');
    var tex=inner;for(var j=idx.length-1;j>=0;j--)tex=rad(idx[j],tex);
    var g=gcd(e,prod),e2=e/g,P2=prod/g,ans;
    if(P2===1)ans=(e2===1?'x':'x^{'+e2+'}');else ans=rad(P2,(e2===1?'x':'x^{'+e2+'}'));
    var orig=function(vals){return Math.pow(vals.x,e/prod);};
    var sv=function(vals){return (P2===1)?Math.pow(vals.x,e2):Math.pow(vals.x,e2/P2);};
    for(var t=0;t<4;t++){var xv=rv();if(Math.abs(orig({x:xv})-sv({x:xv}))>1e-9)return null;}
    return {q:tex,a:ans,ok:true};
  }
  var base=pick([2,3,5,7,10]),e3=pick([1,1,2,3,prod,Math.max(1,Math.floor(prod/2))]);
  if(ipow(base,e3)>1e7)return null;
  var inner2=(e3===1)?(''+base):(base+'^{'+e3+'}');
  var tex2=inner2;for(var j2=idx.length-1;j2>=0;j2--)tex2=rad(idx[j2],tex2);
  var g2=gcd(e3,prod),e4=e3/g2,P3=prod/g2,ans2;
  var inside=ipow(base,e4),fr=nthFree(inside,P3),coef=fr[0],ii=fr[1];
  if(P3===1)ans2=''+ipow(base,e4);
  else if(ii===1)ans2=''+coef;
  else ans2=(coef===1?'':''+coef)+rad(P3,''+ii);
  var ov=Math.pow(base,e3/prod),av=(P3===1)?ipow(base,e4):coef*Math.pow(ii,1/P3);
  if(!isFinite(av)||Math.abs(ov-av)>1e-6*Math.max(1,ov))return null;
  return {q:tex2,a:ans2,ok:true};
}
// 3) Бутархайн хуваарийг язгуураас чөлөөл:  coef · ⁿ√(P/Q)
function gRationalize(){
  var n=pick([2,2,3,4]);
  var pool=pick([['x','y'],['a','b'],['m','n']]);
  var nv=pool[0],dv=pool[1];
  var dexp=rnd(1,n-1);              // хуваарийн язгуурын доорх зэрэг (n-ийн үржвэр биш)
  var nexp=rnd(1,n);               // хүртвэрийн хувьсагчийн зэрэг
  var radExp={};radExp[nv]=nexp;radExp[dv]=-dexp;
  var kNum=pick([1,1,1,2,3]),kDen=pick([1,1,1,2]),gk=gcd(kNum,kDen);kNum/=gk;kDen/=gk;
  var coefExp={};if(pick([0,1,1]))coefExp[dv]=1;             // жишээ: x·, b·, n·
  var coefNum=pick([1,1,1,2,3]);
  var res=simp(n,kNum,kDen,radExp,coefNum,1,coefExp);
  // хуваарь язгуургүй мөн үнэхээр рационалжуулах шаардлагатай эсэх
  if(res.hasInside){var insHasDen=false;for(var k in res.iExp){/*inside always numerator*/}}
  var orig=function(vals){var p=coefNum;for(var kk in coefExp)p*=Math.pow(vals[kk],coefExp[kk]);var inr=kNum/kDen;for(var k2 in radExp)inr*=Math.pow(vals[k2],radExp[k2]);return p*Math.pow(inr,1/n);};
  if(!chkVals(pool,orig,res))return null;
  // өгсөн илэрхийлэл
  var inTex=rad(n,'\\dfrac{'+sideTex(kNum,(function(){var o={};o[nv]=nexp;return o;})())+'}{'+sideTex(kDen,(function(){var o={};o[dv]=dexp;return o;})())+'}');
  var cf=sideTex(coefNum,coefExp);
  var q=(cf==='1')?inTex:(cf+'\\cdot '+inTex);
  if(q===res.tex||!res.hasInside)return null;   // хялбарчлагдаагүй бол алгасна
  return {q:q,a:res.tex,ok:true};
}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){
  var qs=sheet.querySelectorAll('.grid .q');
  for(var i=0;i<qs.length;i++){var el=qs[i].querySelector('.ql');if(el)el.textContent=(LAB[i]||('#'+(i+1)))+')';}
  var as=sheet.querySelectorAll('#answers .a');
  for(var j=0;j<as.length;j++){var e2=as[j].querySelector('.an');if(e2)e2.textContent=(LAB[j]||('#'+(j+1)))+')';}
}
function trimToFitBalanced(sheet,target){
  var guard=0,h=probeH(sheet);
  while(h>target&&guard++<300){
    var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;
    for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>4){bestN=n;best=s;}}
    if(best<0)break;
    var qs=grids[best].querySelectorAll('.q'),last=qs[qs.length-1],k=last.getAttribute('data-k');
    var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);
    last.parentNode.removeChild(last);
    relabel(sheet);h=probeH(sheet);
  }
}
function build(){
  var WORK=!!window.WS_WORK;
  var S=[[],[],[]],seen={};window.__PROB=[];
  function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<1500){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;S[idx].push(f);c++;}}
  var per=WORK?10:16;
  fill(0,gVarSimp,per);fill(1,gNested,per);fill(2,gRationalize,per);
  var gcls=WORK?'':' cols3',K=0;
  function block(arr,cls,sec){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'" data-sec="'+sec+'"><div class="qeq"><span class="ql"></span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work '+cls+'"></div>':'')+'</div>';}).join('');}
  var b1=block(S[0],'md',1),b2=block(S[1],'md',2),b3=block(S[2],'md',3);
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>$'+p.f.a+'$</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>n зэргийн язгуурын чанар-2</h1><div class="sub">Хувьсагчтай хялбарчлах · давхар язгуур · хуваарийг чөлөөлөх · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$\\sqrt[n]{a}\\cdot\\sqrt[n]{b}=\\sqrt[n]{ab}$ &nbsp;·&nbsp; $\\sqrt[n]{\\sqrt[k]{a}}=\\sqrt[nk]{a}$ &nbsp;·&nbsp; $\\sqrt[n]{k^{n}m}=k\\sqrt[n]{m}$ &nbsp;·&nbsp; $a,b,x,y,m,n>0$</div>'
    +'<div class="task">1. Хувьсагчтай илэрхийллийг хялбарчил ($x,y,a,b,m,n>0$).</div>'
    +'<div class="grid'+gcls+'" data-sec="1">'+b1+'</div>'
    +'<div class="task">2. Давхар язгуурыг дан язгуур болго.</div>'
    +'<div class="grid'+gcls+'" data-sec="2">'+b2+'</div>'
    +'<div class="task">3. Бутархайн хуваарийг язгуураас чөлөөл.</div>'
    +'<div class="grid'+gcls+'" data-sec="3">'+b3+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='n зэргийн язгуурын чанар-2 (10-р анги)';
  relabel(document.getElementById('sheet'));
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFitBalanced(document.getElementById('sheet'),1035);}catch(e){}
}
build();
</script>
