<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЭЕШ 1000 2-1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/e1k.js?v=4"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* ЭЕШ 1000 2-1 — ЭЕШ-ийн 1000 бодлого, 2-р хэсэг (1–25-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 1. Модультай илэрхийлэл, 0 < a < b нь дараалал нь мэдэгдэж буй тогтмолууд (e, π, √n, бүхэл, 1.5):
//    |a − b| + s₁|±a| + s₂|±b| = (b − a) + s₁a + s₂b  →  2b, 2b − 2a эсвэл −2a  (s₁ = +, s₂ = − → 0 тул хасна);
//    |a − b| + |b − c| (a < b < c, дунд нь иррационал) = c − a.   (эх: |e − π| + |e| + |−π| = 2π)
var p1_C = [   // [TeX, утга, рационал эсэх]
  ['1', 1, 1], ['\\sqrt{2}', Math.SQRT2, 0], ['1.5', 1.5, 1], ['\\sqrt{3}', Math.sqrt(3), 0], ['2', 2, 1],
  ['\\sqrt{5}', Math.sqrt(5), 0], ['\\sqrt{6}', Math.sqrt(6), 0], ['\\sqrt{7}', Math.sqrt(7), 0], ['e', Math.E, 0],
  ['3', 3, 1], ['\\pi', Math.PI, 0], ['\\sqrt{10}', Math.sqrt(10), 0], ['\\sqrt{11}', Math.sqrt(11), 0], ['4', 4, 1]
];
// x < y дараалал сурагчдад ойлгомжтой эсэх: алгебрын тоонууд (квадратаар жишнэ) эсвэл зөрүү ≥ 0.3,
// мөн мэдэгдэж буй 2 < e < 3 < π < 4
function p1_ok(x, y) {
  if (x[1] >= y[1]) return false;
  if (x[0] !== 'e' && x[0] !== '\\pi' && y[0] !== 'e' && y[0] !== '\\pi') return true;
  return y[1] - x[1] >= 0.3 || /^(2<e|e<3|3<\\pi|\\pi<4)$/.test(x[0] + '<' + y[0]);
}
// Σ kᵢ·Cᵢ → TeX (рационал хэсгийг нэгтгэж, эерэг гишүүнийг түрүүлж бичнэ)
function p1_lin(ts) {
  var r = 0, irr = {}, ord = [];
  ts.forEach(function (t) {
    if (t[1][2]) r += t[0] * t[1][1];
    else { if (!(t[1][0] in irr)) { irr[t[1][0]] = 0; ord.push(t[1][0]); } irr[t[1][0]] += t[0]; }
  });
  r = Math.round(r * 100) / 100;
  var parts = ord.filter(function (k) { return irr[k]; }).map(function (k) { return [irr[k], k]; });
  if (r) parts.push([r, null]);
  if (!parts.length) return '0';
  parts.sort(function (A, B) { return (B[0] > 0) - (A[0] > 0); });
  return parts.map(function (p, i) { return p[1] ? tm(p[0], p[1], i === 0) : (i === 0 ? dec(p[0]) : sgn(p[0])); }).join('');
}
function p1_abs(s) { return '\\lvert ' + s + '\\rvert'; }
// Бодолт: иррационал тогтмолуудыг ойролцоо утгаар жишиж модулийн доторх илэрхийллийн тэмдгийг тогтооно → |u| = u эсвэл −u.
var p1_AP = { '\\sqrt{2}': '1.41', '\\sqrt{3}': '1.73', '\\sqrt{5}': '2.24', '\\sqrt{6}': '2.45', '\\sqrt{7}': '2.65', 'e': '2.72',
  '\\pi': '3.14', '\\sqrt{10}': '3.16', '\\sqrt{11}': '3.32' };
function p1_ap(cs) {   // '$\\sqrt{3}\\approx 1.73$, $\\pi\\approx 3.14$ тул'
  return cs.filter(function (c) { return !c[2]; }).map(function (c) { return '$' + c[0] + '\\approx ' + p1_AP[c[0]] + '$'; }).join(', ') + ' тул';
}
// |u| — u сөрөг бол −(u) = …, эерэг бол шууд
function p1_md(u, neg, val) { return '$' + u + (neg ? '\\lt 0' : '\\gt 0') + '$ тул $' + p1_abs(u) + '=' + (neg ? '-(' + u + ')=' : '') + val + '$'; }
function p1() {
  var C = p1_C, fam = pick(['A', 'A', 'A', 'A', 'A', 'B', 'B', 'C', 'D', 'D']), expr, ans;
  if (fam !== 'D') {
    // тал хувь нь e эсвэл π-тэй (эх шиг); хоёр тоо хэт холгүй (≤ 1.6)
    var u = rnd(0, 1) ? pick([C[8], C[10]]) : pick(C), w = pick(C), a = u[1] < w[1] ? u : w, b = u[1] < w[1] ? w : u;
    if (!p1_ok(a, b) || (a[2] && b[2]) || b[1] - a[1] > 1.6) return null;
    var s1 = fam === 'A' ? 1 : -1, s2 = fam === 'C' ? -1 : 1;
    var n1 = rnd(0, 2) === 0, n2 = rnd(0, 2) > 0;   // модулийн доторх тэмдэг (эх: |e|, |−π|)
    expr = p1_abs(a[0] + '-' + b[0]) + (s1 > 0 ? '+' : '-') + p1_abs((n1 ? '-' : '') + a[0]) + (s2 > 0 ? '+' : '-') + p1_abs((n2 ? '-' : '') + b[0]);
    // |a − b| = b − a (a < b)
    ans = p1_lin([[1, b], [-1, a], [s1, a], [s2, b]]);
  } else {
    var x = pick(C), y = pick(C), z = pick(C);
    if (!p1_ok(x, y) || !p1_ok(y, z) || !p1_ok(x, z) || y[2] || z[1] - x[1] > 2.1) return null;
    var o1 = rnd(0, 3) > 0, o2 = rnd(0, 3) > 0;           // true: доторх нь сөрөг (x − y, y − z)
    if (!o1 && !o2) return null;
    expr = p1_abs(o1 ? x[0] + '-' + y[0] : y[0] + '-' + x[0]) + '+' + p1_abs(o2 ? y[0] + '-' + z[0] : z[0] + '-' + y[0]);
    ans = p1_lin([[1, z], [-1, x]]);
  }
  if (ans === '0') return null;
  var sol;
  if (fam !== 'D') {
    var A0 = a[0], B0 = b[0];
    sol = [
      p1_ap([a, b]) + ' $0\\lt ' + A0 + '\\lt ' + B0 + '$.',
      'Модулийн тодорхойлолтоор: ' + p1_md(A0 + '-' + B0, true, B0 + '-' + A0) + '. Мөн $' + A0 + '\\gt 0$, $' + B0 + '\\gt 0$ тул $'
        + p1_abs((n1 ? '-' : '') + A0) + '=' + A0 + '$, $' + p1_abs((n2 ? '-' : '') + B0) + '=' + B0 + '$.',
      'Иймд $$A=(' + B0 + '-' + A0 + ')' + (s1 > 0 ? '+' : '-') + A0 + (s2 > 0 ? '+' : '-') + B0 + '=' + ans + '.$$'
    ];
  } else {
    var X0 = x[0], Y0 = y[0], Z0 = z[0];
    sol = [
      p1_ap([x, y, z]) + ' $' + X0 + '\\lt ' + Y0 + '\\lt ' + Z0 + '$.',
      'Модулийн тодорхойлолтоор: ' + (o1 ? p1_md(X0 + '-' + Y0, true, Y0 + '-' + X0) : p1_md(Y0 + '-' + X0, false, Y0 + '-' + X0)) + '; '
        + (o2 ? p1_md(Y0 + '-' + Z0, true, Z0 + '-' + Y0) : p1_md(Z0 + '-' + Y0, false, Z0 + '-' + Y0)) + '.',
      'Иймд $$A=(' + Y0 + '-' + X0 + ')+(' + Z0 + '-' + Y0 + ')=' + ans + '.$$'
    ];
  }
  return {
    q: '$A=' + expr + '$ илэрхийллийн утгыг ол.',
    a: '$A=' + ans + '$',
    wk: 18,
    s: sol,
    t: { fam: fam }
  };
}

// 2. x < r (эсвэл x > r) үед c₁√((m₁x+n₁)²) − c₂√((m₂x+n₂)²), c₁m₁ = c₂m₂ (язгуурын доорхыг задалж бичнэ).
//    √(u²) = |u|; r нь хоёр язгуураас (−n₁/m₁, −n₂/m₂) зүүн (баруун) талд тул модулиуд ижил тэмдэгтэй σ = ∓1
//    → x устаж σ(c₁n₁ − c₂n₂) тогтмол үлдэнэ.  (эх: x < −1, 2√(x²−2x+1) − √(4x²+4x+1) = 3)
function p2() {
  var m1 = pick([1, 1, 1, 1, 2]), m2 = pick([2, 2, 2, 3, 3, 4]);
  if (m1 === m2) return null;
  var g = gcd(m1, m2), c1 = m2 / g, c2 = m1 / g, n1 = nz(-5, 5), n2 = nz(-5, 5);
  if (gcd(m1, n1) > 1 || gcd(m2, n2) > 1) return null;      // (2x+4)² = 4(x+2)² гэх мэт хэлбэрээс зайлсхийнэ
  var z1 = -n1 / m1, z2 = -n2 / m2;
  if (Math.abs(z1 - z2) < 1e-9) return null;                 // ижил язгуур → илэрхийлэл тэгтэй адил
  var left = rnd(1, 3) > 1, r = left ? Math.floor(Math.min(z1, z2)) - pick([0, 0, 1, 2]) : Math.ceil(Math.max(z1, z2)) + pick([0, 0, 1, 2]);
  if (Math.abs(r) > 6) return null;
  var val = (left ? -1 : 1) * (c1 * n1 - c2 * n2);
  var T1 = tm(c1, '\\sqrt{' + poly([m1 * m1, 2 * m1 * n1, n1 * n1]) + '}', true), T2 = tm(c2, '\\sqrt{' + poly([m2 * m2, 2 * m2 * n2, n2 * n2]) + '}', true);
  var sw = rnd(1, 4) === 1;                                   // дарааллыг солих → утгын тэмдэг эсрэг
  if (sw) val = -val;
  if (Math.abs(val) > 16) return null;
  // Бодолт: √(u²) = |u|; x < r (x > r) үед mx + n < mr + n ≤ 0 (> … ≥ 0) тул модулийг тэмдгээр нь задална → x-тэй гишүүд устана.
  var F = sw ? [c2, m2, n2] : [c1, m1, n1], S = sw ? [c1, m1, n1] : [c2, m2, n2];   // [коэф., m, n] — эхний ба хоёр дахь гишүүн
  var U = function (t) { return poly([t[1], t[2]]); }, sq = function (t) { return poly([t[1] * t[1], 2 * t[1] * t[2], t[2] * t[2]]); };
  var sg = left ? -1 : 1, rel = left ? '\\lt ' : '\\gt ';
  var rt1 = function (t) { return '\\sqrt{' + sq(t) + '}=\\sqrt{(' + U(t) + ')^2}=|' + U(t) + '|'; };
  var bnd = function (t) { var v = t[1] * r + t[2]; return '$' + U(t) + rel + v + (v ? rel + '0' : '') + '$'; };
  var opn = function (t) { return '$|' + U(t) + '|=' + (left ? '-(' + U(t) + ')' : U(t)) + '$'; };
  return {
    q: '$x' + (left ? '\\lt ' : '\\gt ') + r + '$ бол $' + (sw ? T2 + '-' + T1 : T1 + '-' + T2) + '$ илэрхийллийн утгыг ол.',
    a: '$' + val + '$',
    wk: 24,
    s: [
      'Язгуурын доорх илэрхийллүүд бүтэн квадрат бөгөөд $\\sqrt{u^2}=|u|$ тул $$' + rt1(F) + ',$$ $$' + rt1(S) + '.$$',
      '$x' + rel + r + '$ үед ' + bnd(F) + ', ' + bnd(S) + ' тул модулийн тодорхойлолтоор ' + opn(F) + ', ' + opn(S) + '.',
      'Иймд $$' + tm(F[0], '|' + U(F) + '|', true) + tm(-S[0], '|' + U(S) + '|') + '=' + tm(sg * F[0], '(' + U(F) + ')', true) + tm(-sg * S[0], '(' + U(S) + ')')
        + '$$ $$=' + tm(sg * F[0] * F[1], 'x', true) + sgn(sg * F[0] * F[2]) + tm(-sg * S[0] * S[1], 'x') + sgn(-sg * S[0] * S[2]) + '=' + val + '.$$'
    ],
    t: { m1: m1, n1: n1, m2: m2, n2: n2, c1: c1, c2: c2, r: r, left: left, sw: sw }
  };
}

// 3. αP(x) + βQ(x), P — шугаман, Q — квадрат олон гишүүнт; ижил зэргийн гишүүдийн коэффициентүүдийг нэмнэ.
//    (эх: P = 2x − 1, Q = x² − 3x + 4, 3P − 2Q = −2x² + 12x − 11)
function p3() {
  var a1 = pick([1, 2, 2, 3, 4, 5, -1, -2, -3]), b1 = nz(-6, 6);
  var a2 = pick([1, 1, 1, 1, 2, 3, -1, -2]), b2 = nz(-6, 6), c2 = nz(-7, 7);
  var al = pick([1, 2, 3, 3, 4, 5, -1, -2, -3]), be = pick([1, 2, 2, 3, 4, -1, -2, -2, -3, -4]);
  if (Math.abs(al) === 1 && Math.abs(be) === 1) return null;
  if (al < 0 && be < 0) return null;
  var R = [be * a2, al * a1 + be * b2, al * b1 + be * c2];
  if (!R[1] || !R[2] || Math.abs(R[0]) > 12 || Math.abs(R[1]) > 30 || Math.abs(R[2]) > 30) return null;
  var pf = al > 0 ? rnd(1, 4) > 1 : false;                 // ихэвчлэн P түрүүлнэ (сөрөг коэф. түрүүлэхгүй)
  var E = pf ? tm(al, 'P(x)', true) + tm(be, 'Q(x)') : tm(be, 'Q(x)', true) + tm(al, 'P(x)');
  if (!pf && be < 0) return null;
  // Бодолт: орлуулж хаалтыг задлаад төсөөтэй гишүүдийг эмхэтгэнэ (x-ийн коэффициент, сул гишүүн).
  var Pt = '(' + poly([a1, b1]) + ')', Qt = '(' + poly([a2, b2, c2]) + ')';
  var sub = pf ? tm(al, Pt, true) + tm(be, Qt) : tm(be, Qt, true) + tm(al, Pt);
  var eP = function (f) { return tm(al * a1, 'x', f) + tm(al * b1, ''); }, eQ = function (f) { return tm(be * a2, 'x^2', f) + tm(be * b2, 'x') + tm(be * c2, ''); };
  var cx = pf ? (al * a1) + sgn(be * b2) : (be * b2) + sgn(al * a1), c0 = pf ? (al * b1) + sgn(be * c2) : (be * c2) + sgn(al * b1);
  return {
    q: '$P(x)=' + poly([a1, b1]) + ',\\ Q(x)=' + poly([a2, b2, c2]) + '$ олон гишүүнтүүд өгөгдсөн бол $' + E + '$ олон гишүүнтийг олоорой.',
    a: '$' + E + '=' + poly(R) + '$',
    wk: 22,
    s: [
      'Олон гишүүнтүүдийг орлуулж, хаалтыг задалъя: $$' + E + '=' + sub + '$$ $$=' + (pf ? eP(true) + eQ(false) : eQ(true) + eP(false)) + '.$$',
      'Төсөөтэй гишүүдийг эмхэтгэвэл ($x$-ийн коэффициент $' + cx + '=' + R[1] + '$, сул гишүүн $' + c0 + '=' + R[2] + '$): $$' + E + '=' + poly(R) + '.$$'
    ],
    t: { P: [a1, b1], Q: [a2, b2, c2], al: al, be: be }
  };
}

// 4. P(x) = x³ + ax² + cx + b; (x − u)-д хуваахад r₁, (x − v)-д хуваахад r₂ үлдэнэ ⇔ P(u) = r₁, P(v) = r₂ (Безу):
//    a(u² − v²) = r₁ − r₂ − (u³ − v³) − c(u − v),  b = r₁ − u³ − au² − cu  (u² ≠ v²). Хариу бутархай байж болно.
//    (эх: c = −4, (x − 1) → 1, (x + 2) → −1  ⇒  a = −5/3)
function p4() {
  var u = pick([1, 1, 1, 2, -1, -2, 3, -3]), v = pick([1, -1, 2, -2, -2, 3, -3]);
  if (u === v || u === -v) return null;
  var c = nz(-6, 6), r1 = nz(-5, 5), r2 = nz(-5, 5);
  if (rnd(0, 1)) {                       // заримдаа бүхэл a, b-ээс үлдэгдлүүдийг тооцно (бүхэл хариу)
    var a0 = nz(-4, 4), b0 = nz(-6, 6);
    r1 = u * u * u + a0 * u * u + c * u + b0; r2 = v * v * v + a0 * v * v + c * v + b0;
    if (!r1 || !r2 || Math.abs(r1) > 15 || Math.abs(r2) > 15) return null;
  }
  var D = u * u - v * v, N = r1 - r2 - (u * u * u - v * v * v) - c * (u - v);   // a = N/D
  var bN = D * (r1 - u * u * u - c * u) - N * u * u;                              // b = bN/D
  var ask = pick(['a', 'a', 'a', 'a', 'b', 'a+b']), vN = ask === 'a' ? N : ask === 'b' ? bN : N + bN;
  var den = Math.abs(D) / gcd(vN, D);
  if (den > 6 || Math.abs(vN / D) > 12) return null;
  if (ask === 'a' && !N) return null;
  // дагаврыг томьёоноос тасрахгүй байлгана (nw)
  var dv = function (w) { return '<span class="nw">$(' + poly([1, -w]) + ')$-' + suf(Math.abs(w), 'д') + '</span>'; };
  // Бодолт: Безугийн теоремоор P(u) = r₁, P(v) = r₂ → u²a + b = R₁, v²a + b = R₂; хасаж a-г, орлуулж b-г олно.
  //         a + b асуусан ба u² = 1 (эсвэл v² = 1) бол тэр тэгшитгэл шууд a + b-г өгнө.
  var R1 = r1 - u * u * u - c * u, R2 = r2 - v * v * v - c * v, aT = fr(N, D), bT = fr(bN, D);
  var eqn = function (w, rr, RR) { return 'P(' + w + ')=' + (w * w * w) + tm(w * w, 'a') + sgn(c * w) + '+b=' + rr + '\\ \\Rightarrow\\ ' + tm(w * w, 'a', true) + '+b=' + RR; };
  var pr = function (t) { return t.charAt(0) !== '-' ? t : t.indexOf('frac') >= 0 ? '\\left(' + t + '\\right)' : '(' + t + ')'; };
  var ss = ['Безугийн теоремоор $P(x)$-ийг $x-x_0$ хоёр гишүүнтэд хуваахад гарах үлдэгдэл нь $P(x_0)$ байна. Иймд $$' + eqn(u, r1, R1) + ',$$ $$' + eqn(v, r2, R2) + '.$$'];
  if (ask === 'a+b' && (u * u === 1 || v * v === 1)) ss.push((u * u === 1 ? 'Эхний' : 'Хоёр дахь') + ' тэгшитгэлээс шууд $a+b=' + (u * u === 1 ? R1 : R2) + '$.');
  else {
    ss.push('Эхний тэгшитгэлээс хоёр дахийг хасвал $$' + tm(D, 'a', true) + '=' + (R1 && R2 ? R1 + '-' + par(R2) + '=' : '') + N + '\\ \\Rightarrow\\ a=' + aT + '.$$');
    if (ask !== 'a') ss.push(!N ? '$a=0$ тул эхний тэгшитгэлээс $b=' + R1 + '$.'
      : 'Эхний тэгшитгэлээс $$b=' + (R1 ? R1 : '') + '-' + (u * u === 1 ? '' : u * u + '\\cdot ') + pr(aT) + '=' + bT + '.$$');
    if (ask === 'a+b') ss.push('Иймд $$a+b=' + aT + (bT.charAt(0) === '-' ? '' : '+') + bT + '=' + fr(vN, D) + '.$$');
  }
  return {
    q: '$P(x)=x^3+ax^2' + tm(c, 'x') + '+b$ олон гишүүнтийг ' + dv(u) + ' хуваахад $' + r1 + '$ үлддэг ба ' + dv(v) + ' хуваахад $' + r2
      + '$ үлддэг бол <span class="nw">$' + ask + '$-гийн</span> утгыг олоорой.',
    a: '$' + ask + '=' + fr(vN, D) + '$',
    wk: 28,
    s: ss,
    t: { u: u, v: v, c: c, r1: r1, r2: r2, ask: ask }
  };
}

// 5. (mx + n)/((x − p)(x − q)) = A/(x − p) − B/(x − q)  ⇔  mx + n = A(x − q) − B(x − p)  (хуваарийг задалж бичнэ):
//    x = p → A = (mp + n)/(p − q),  x = q → B = (mq + n)/(p − q).  Бүхэл A, B-ээс m = A − B, n = Bp − Aq.
//    [ЗАС: эхийн хуваарь x² − x + 2 нь (x+1)(x−2)-той таарахгүй → x² − x − 2]  (эх: (x−8)/(x²−x−2) → A = 3, B = 2, A·B = 6)
function p5() {
  var p = nz(-5, 5), q = nz(-5, 5);
  if (p === q) return null;
  var A = pick([1, 2, 2, 3, 3, 4, 5, -1, -2, -3]), B = pick([1, 2, 2, 3, 4, 5, -1, -2, -3]);
  var m = A - B, n = B * p - A * q;
  if (!m || !n || Math.abs(m) > 5 || Math.abs(n) > 20) return null;
  if (m < 0 && rnd(0, 2)) return null;                    // эх шиг хүртвэрийн ахлах коэффициент голдуу эерэг
  var ask = pick([0, 0, 0, 1, 2]), E = ['A\\cdot B', 'A+B', 'A-B'][ask], V = [A * B, A + B, A - B][ask];
  // Бодолт: ерөнхий хуваарьт шилжүүлж хүртвэрүүдийг тэнцүүлнэ: mx + n = A(x − q) − B(x − p); x = p, x = q гэж орлуулна.
  var Lp = poly([1, -p]), Lq = poly([1, -q]), d = p - q;
  var fnd = function (val, nm, res) { return d === 1 ? '$' + nm + '=' + val + '$' : '$' + val + '=' + tm(d, nm, true) + '$, эндээс $' + nm + '=' + res + '$'; };
  return {
    q: '$\\dfrac{' + poly([m, n]) + '}{' + poly([1, -(p + q), p * q]) + '}=\\dfrac{A}{' + poly([1, -p]) + '}-\\dfrac{B}{' + poly([1, -q]) + '}$ бол $' + E + '=?$',
    a: '$A=' + A + ',\\ B=' + B + ';\\ ' + E + '=' + V + '$',
    wk: 28,
    s: [
      'Хуваарийг задалбал $' + poly([1, -(p + q), p * q]) + '=(' + Lp + ')(' + Lq + ')$. Баруун талыг ерөнхий хуваарьт шилжүүлж, хүртвэрүүдийг тэнцүүлбэл $$'
        + poly([m, n]) + '=A(' + Lq + ')-B(' + Lp + ').$$',
      'Энэ тэнцэтгэл $x$-ийн бүх утгад биелэх тул: $x=' + p + '$ гэвэл ' + fnd(m * p + n, 'A', A) + '; $x=' + q + '$ гэвэл ' + fnd(m * q + n, 'B', B) + '.',
      'Иймд $$' + E + '=' + [A + '\\cdot ' + par(B), A + sgn(B), A + '-' + par(B)][ask] + '=' + V + '.$$'
    ],
    t: { p: p, q: q, A: A, B: B, ask: ask }
  };
}

// 6. N(x)/(x³ + rx²) = A/(x + r) − (Cx + B)/x²  ⇔  N(x) = Ax² − (Cx + B)(x + r) = (A − C)x² − (Cr + B)x − Br.
//    N-д x² байхгүй → A = C = j;  N = −(jr + B)x − Br.  j = 1 үед эхийн загвар (x + B)/x² (асуулт A + B),
//    заримдаа j ≠ 1 → (Cx + B)/x² (асуулт A + B + C).  B = −jr үед N = jr² тогтмол.
//    [ЗАС: эхийн 1/(x³ + x) нь өгсөн задаргаатай таарахгүй → 1/(x³ + x²)]  (эх: 1/(x³+x²) = 1/(x+1) − (x−1)/x² → A + B = 0)
function p6() {
  var r = pick([1, 1, 2, 2, 3, 4, -1, -2, -3]), gen2 = rnd(1, 5) === 1, j = gen2 ? pick([2, 2, 3, -1, -2]) : 1;
  var B = rnd(1, 5) <= 2 ? -j * r : nz(-6, 6);
  var n1 = -(j * r + B), n0 = -B * r;
  if (!B || Math.abs(n1) > 9 || Math.abs(n0) > 24) return null;
  var xr = poly([1, r]), ask, E, V, ans;
  if (!gen2) {
    ask = pick([0, 0, 0, 0, 1, 2]); E = ['A+B', 'A\\cdot B', 'A-B'][ask]; V = [j + B, j * B, j - B][ask];
    ans = 'A=' + j + ',\\ B=' + B + ';\\ ' + E + '=' + V;
  } else {
    E = 'A+B+C'; V = 2 * j + B;
    ans = 'A=' + j + ',\\ B=' + B + ',\\ C=' + j + ';\\ ' + E + '=' + V;
  }
  // Бодолт: x³ + rx² = x²(x + r); хүртвэрүүдийг тэнцүүлж N(x) = Ax² − (Cx + B)(x + r);
  //         x = −r → r²A = N(−r),  x = 0 → −rB = N(0);  (gen2) x²-ийн коэффициент: 0 = A − C.
  var Nr = n1 * (-r) + n0, Nsub = n1 ? (n1 === 1 ? '' : n1 === -1 ? '-' : n1 + '\\cdot ') + par(-r) + sgn(n0) + '=' + Nr : String(n0);
  var fA = r * r === 1 ? '$A=' + Nsub + '$' : '$' + r * r + 'A=' + Nsub + '$, эндээс $A=' + j + '$';
  var fB = r === -1 ? '$B=' + n0 + '$' : '$' + tm(-r, 'B', true) + '=' + n0 + '$, эндээс $B=' + B + '$';
  var vx = !gen2 ? [j + sgn(B), j + '\\cdot ' + par(B), j + '-' + par(B)][ask] : j + sgn(B) + sgn(j);
  var ss = [
    'Хуваарийг задалбал $' + poly([1, r, 0, 0]) + '=x^2(' + xr + ')$. Баруун талыг ерөнхий хуваарьт шилжүүлж, хүртвэрүүдийг тэнцүүлбэл $$'
      + poly([n1, n0]) + '=Ax^2-(' + (gen2 ? 'Cx' : 'x') + '+B)(' + xr + ').$$',
    'Энэ тэнцэтгэл $x$-ийн бүх утгад биелэх тул: $x=' + (-r) + '$ гэвэл ' + fA + '; $x=0$ гэвэл ' + fB + '.'
  ];
  if (gen2) ss.push('Зүүн талд $x^2$ гишүүн байхгүй тул хоёр талын $x^2$ гишүүний коэффициентүүдийг тэнцүүлбэл $$0=A-C\\ \\Rightarrow\\ C=A=' + j + '.$$');
  ss.push('Иймд $$' + E + '=' + vx + '=' + V + '.$$');
  return {
    q: '$\\dfrac{' + poly([n1, n0]) + '}{' + poly([1, r, 0, 0]) + '}=\\dfrac{A}{' + xr + '}-\\dfrac{' + (gen2 ? 'Cx' : 'x') + '+B}{x^2}$ бол $' + E + '=?$',
    a: '$' + ans + '$',
    wk: 28,
    s: ss,
    t: { r: r, j: j, B: B }
  };
}

// 7. P (dp зэрэг), Q (dq зэрэг) олон гишүүнт: P(xᵐ) ± Q(xⁿ)-ийн зэрэг = max(dp·m, dq·n); тэнцүү бөгөөд ахлах
//    коэффициентүүд уствал дараагийн гишүүнээр тодорхойлогдоно (задалж тооцно). P(xᵐ)·Q(xⁿ)-ийн зэрэг = dp·m + dq·n.
//    (эх: P = 2x − 1, Q = x² − 3x + 1, P(x³) + Q(x²) → 4)
var p7_EQ = [[1, 4, 2, 2], [2, 2, 1, 4], [1, 2, 1, 2], [1, 3, 1, 3], [2, 2, 2, 2], [2, 3, 3, 2], [1, 4, 1, 4], [2, 3, 2, 3]];   // dp·m = dq·n
function p7_rand(d) {   // d зэргийн бүхэл коэффициенттэй олон гишүүнт (их зэргээс)
  var c = [pick([1, 1, 2, 2, 3, -1, -2])];
  for (var i = 1; i <= d; i++) c.push(rnd(-5, 5));
  if (!c[d]) c[d] = nz(-5, 5);
  return c;
}
function p7_sub(c, m) {   // P(xᵐ) — өсөх зэргийн массив
  var d = c.length - 1, out = [];
  for (var i = 0; i <= d * m; i++) out.push(0);
  c.forEach(function (k, i) { out[(d - i) * m] = k; });
  return out;
}
function p7() {
  var op = pick(['+', '+', '+', '+', '+', '-', '\\cdot']), cancel = op !== '\\cdot' && rnd(1, 4) === 1, dp, dq, m, n;
  if (cancel) { var e = pick(p7_EQ); dp = e[0]; m = e[1]; dq = e[2]; n = e[3]; }
  else { dp = pick([1, 1, 1, 2]); dq = pick([2, 2, 1, 3]); m = rnd(2, 5); n = rnd(2, 5); }
  if (m === n && rnd(0, 2)) return null;
  var P = p7_rand(dp), Q = p7_rand(dq);
  if (cancel) Q[0] = op === '+' ? -P[0] : P[0];
  var A = p7_sub(P, m), B = p7_sub(Q, n), R = [], i, j;
  if (op === '\\cdot') {
    for (i = 0; i < A.length + B.length - 1; i++) R.push(0);
    for (i = 0; i < A.length; i++) for (j = 0; j < B.length; j++) R[i + j] += A[i] * B[j];
  } else {
    for (i = 0; i < Math.max(A.length, B.length); i++) R.push((A[i] || 0) + (op === '+' ? 1 : -1) * (B[i] || 0));
  }
  var deg = R.length - 1;
  while (deg >= 0 && !R[deg]) deg--;
  if (deg < 1) return null;
  var word = op === '+' ? 'нийлбэр' : op === '-' ? 'ялгавар' : 'үржвэр';
  // Бодолт: орлуулж P(xᵐ), Q(xⁿ)-ийн зэрэг (dp·m, dq·n); үржвэрт ахлах гишүүд үржигдэнэ; нийлбэр/ялгаварт зэрэг ялгаатай бол
  //         их зэргийн гишүүн үлдэнэ, тэнцүү бол ахлах гишүүдийг нэмж (хасаж) — уствал бүх гишүүнийг эмхэтгэнэ.
  var dA = dp * m, dB = dq * n, lA = P[0], lB = Q[0], PX = 'P(x^' + m + ')', QX = 'Q(x^' + n + ')';
  var dsc = function (a) { return poly(a.slice().reverse()); }, lt = function (c, d) { return tm(c, 'x^{' + d + '}', true); };
  var pa = function (t) { return t.charAt(0) === '-' ? '\\left(' + t + '\\right)' : t; };
  var ss = ['Орлуулбал $$' + PX + '=' + dsc(A) + ',$$ $$' + QX + '=' + dsc(B) + '.$$',
    '$' + PX + '$ нь $' + dp + '\\cdot ' + m + '=' + dA + '$, $' + QX + '$ нь $' + dq + '\\cdot ' + n + '=' + dB + '$ зэргийн олон гишүүнт.'];
  if (op === '\\cdot') {
    ss.push('Үржвэрийн ахлах гишүүн нь ахлах гишүүдийн үржвэр: $$' + lt(lA, dA) + '\\cdot ' + pa(lt(lB, dB)) + '=' + lt(lA * lB, dA + dB) + '.$$');
    ss.push('Иймд үржвэр $' + dA + '+' + dB + '=' + deg + '$ зэргийн олон гишүүнт.');
  } else {
    if (dA !== dB) ss.push('Зэргүүд нь ялгаатай тул ' + (op === '+' ? 'нийлбэрийн' : 'ялгаврын') + ' ахлах гишүүн нь их зэргийн гишүүн $' + lt(dA > dB ? lA : op === '+' ? lB : -lB, Math.max(dA, dB)) + '$ болно.');
    else {
      var L = lA + (op === '+' ? lB : -lB);
      ss.push('Зэргүүд тэнцүү тул ахлах гишүүдийг ' + (op === '+' ? 'нэмье' : 'хасъя') + ': $$' + lt(lA, dA) + op + pa(lt(lB, dB)) + '=' + (L ? lt(L, dA) + '\\ne 0' : '0') + '.$$');
      if (!L) ss.push('Ахлах гишүүд устах тул бусад гишүүдийг эмхэтгэе: $$' + PX + op + QX + '=' + dsc(R) + '.$$');
    }
    ss.push('Иймд ' + word + ' $' + deg + '$ зэргийн олон гишүүнт.');
  }
  return {
    q: '$P(x)=' + poly(P) + ',\\ Q(x)=' + poly(Q) + '$ бол $P(x^' + m + ')' + op + (op === '\\cdot' ? ' ' : '') + 'Q(x^' + n + ')$ ' + word + ' олон гишүүнт хэдэн зэргийн байх вэ?',
    a: '$' + deg + '$',
    wk: 20,
    s: ss,
    t: { P: P, Q: Q, m: m, n: n, op: op, cancel: cancel }
  };
}

// 8. x² + px + c (c > 0, бүтэн квадрат биш) олон гишүүнтийн язгуурууд x₁x₂ = c, p = −(x₁ + x₂) (Виет).
//    Натурал язгууруудын хос {x₁ < x₂} = c-ийн хуваагчдын хос → τ(c)/2; бүхэл язгуур бол сөрөг хосууд нэмэгдэж τ(c).
//    (эх: c = 12 → (1; 12), (2; 6), (3; 4) — 3 хос)
var p8_C = [6, 8, 10, 12, 12, 12, 14, 15, 18, 18, 20, 20, 21, 22, 24, 24, 28, 30, 32, 40, 42, 44, 45, 48, 50, 52, 54, 56, 60, 63, 66, 70, 72, 75, 80, 84, 90, 96];
function p8() {
  var c = pick(p8_C), nat = rnd(1, 4) > 1, pairs = [], d;
  for (d = 1; d * d < c; d++) if (c % d === 0) pairs.push([d, c / d]);
  if (!nat && pairs.length > 4) return null;
  if (nat && pairs.length < 2) return null;
  var all = nat ? pairs : pairs.concat(pairs.map(function (q) { return [-q[0], -q[1]]; }));
  // Бодолт: Виетийн теоремоор x₁x₂ = c, x₁ + x₂ = −p (p дурын) → c-г хоёр натурал тооны үржвэрт задлах арга бүр нэг хос;
  //         бүхэл язгуурт x₁x₂ = c > 0 тул ижил тэмдэгтэй → натурал хос бүрийн тэмдгийг сольсон хос нэмэгдэнэ.
  var k = pairs.length, neg = pairs.map(function (q) { return [-q[0], -q[1]]; });
  var lst = function (ps) { return ps.map(function (q) { return '$' + pt(q[0], q[1]) + '$'; }).join(', '); };
  var pv = function (ps) { return '$p\\in\\{' + ps.map(function (q) { return -(q[0] + q[1]); }).join(',\\ ') + '\\}$'; };
  var ss = [
    'Виетийн теоремоор $x_1x_2=' + c + '$, $x_1+x_2=-p$. $p$ дурын тул үржвэр нь $' + c + '$ байх тоонуудын хос бүрт харгалзах $p=-(x_1+x_2)$ олдоно.',
    '$' + c + '$-' + suf(c, 'ыг') + ' хоёр натурал тооны үржвэрт задлах бүх арга ($' + c + '$ бүтэн квадрат биш тул $x_1\\ne x_2$): $$' + c + '='
      + pairs.map(function (q) { return q[0] + '\\cdot ' + q[1]; }).join('=') + '.$$'
  ];
  if (nat) ss.push('Иймд $' + k + '$ хос натурал язгуур: ' + lst(pairs) + ' (харгалзан ' + pv(pairs) + ').');
  else {
    ss.push('$x_1x_2=' + c + '\\gt 0$ тул бүхэл язгуурууд ижил тэмдэгтэй. Натурал хос бүрийн тэмдгийг сольж сөрөг хосууд гарна: ' + lst(neg) + ' (харгалзан ' + pv(neg) + ').');
    ss.push('Иймд нийт $' + k + '+' + k + '=' + 2 * k + '$ хос бүхэл язгуур.');
  }
  return {
    q: '$P(x)=x^2+px+' + c + '$ олон гишүүнт хичнээн хос ' + (nat ? 'натурал' : 'бүхэл') + ' язгууруудтай вэ?',
    a: '$' + all.length + '$ хос: ' + all.map(function (q) { return '$' + pt(q[0], q[1]) + '$'; }).join(', '),
    wk: 22,
    s: ss,
    t: { c: c, nat: nat }
  };
}

// 9. ∫ k/((x − p)(x − q)) dx = k/(p − q) · ln|(x − p)/(x − q)| + C  (хуваарийг задалж бичнэ; хялбар бутархайд задлах:
//    k/((x−p)(x−q)) = k/(p−q)·(1/(x−p) − 1/(x−q))). p > q байхаар эрэмбэлж коэффициентийг эерэг болгоно.
//    (эх: ∫ 1/(x² + x) dx = ln|x/(x + 1)| + C)
function p9() {
  var p = rnd(-5, 5), q = rnd(-5, 5);
  if (p === q) return null;
  if (rnd(1, 5) <= 2) { if (rnd(0, 1)) p = 0; else q = 0; }     // эх шиг x² + bx хэлбэр
  if (p === q) return null;
  if (p < q) { var t = p; p = q; q = t; }
  var k = pick([1, 1, 1, 1, 2, 3, 4, 5, 6]), d = p - q;
  if (d / gcd(k, d) > 8 || Math.abs(p * q) > 24) return null;
  var den = poly([1, -(p + q), p * q]);
  // Бодолт: хялбар бутархайд задлах k/((x−p)(x−q)) = A/(x−p) + B/(x−q) → k = A(x − q) + B(x − p): x = p → A = k/(p − q),
  //         x = q → B = −k/(p − q); ∫ dx/(x − a) = ln|x − a| + C; ln|u| − ln|w| = ln|u/w|.
  var Lp = poly([1, -p]), Lq = poly([1, -q]), I0 = '\\int\\dfrac{' + k + '}{' + den + '}\\,dx';
  var fac = q === 0 ? 'x(' + Lp + ')' : p === 0 ? 'x(' + Lq + ')' : '(' + Lp + ')(' + Lq + ')';
  var mul = function (L, v) { return v === 0 ? L : '(' + L + ')'; };
  var fA = d === 1 ? '$A=' + k + '$' : '$' + k + '=' + tm(d, 'A', true) + '$, $A=' + fr(k, d) + '$';
  return {
    q: '$\\displaystyle\\int\\dfrac{' + k + '}{' + den + '}\\,dx$ тодорхой бус интегралыг бод.',
    a: '$' + tm([k, d], '\\ln\\left|\\dfrac{' + poly([1, -p]) + '}{' + poly([1, -q]) + '}\\right|', true) + '+C$',
    wk: 26,
    s: [
      'Хуваарийг задалбал $' + den + '=' + fac + '$. Интегралын доорх бутархайг хялбар бутархайд задалъя: $$\\dfrac{' + k + '}{' + fac + '}=\\dfrac{A}{' + Lp + '}+\\dfrac{B}{' + Lq + '}.$$',
      'Ерөнхий хуваарьт шилжүүлж хүртвэрүүдийг тэнцүүлбэл $' + k + '=A' + mul(Lq, q) + '+B' + mul(Lp, p) + '$. Эндээс $x=' + p + '$ гэвэл ' + fA
        + '; $x=' + q + '$ гэвэл $' + k + '=' + tm(-d, 'B', true) + '$, $B=' + fr(-k, d) + '$.',
      '$\\int\\frac{dx}{x-a}=\\ln|x-a|+C$ тул $$' + I0 + '=' + tm([k, d], '\\int\\dfrac{dx}{' + Lp + '}', true) + tm([-k, d], '\\int\\dfrac{dx}{' + Lq + '}')
        + '$$ $$=' + tm([k, d], '\\ln|' + Lp + '|', true) + tm([-k, d], '\\ln|' + Lq + '|') + '+C.$$',
      'Логарифмын $\\ln a-\\ln b=\\ln\\dfrac{a}{b}$ чанараар $$' + I0 + '=' + tm([k, d], '\\ln\\left|\\dfrac{' + Lp + '}{' + Lq + '}\\right|', true) + '+C.$$'
    ],
    t: { p: p, q: q, k: k }
  };
}

// 10. x = R·cos t, y = R·sin t (заримдаа x = R·sin t, y = R·cos t) хэрчим дээр: x² + y² = R².
//     Завсарт тэмдэг нь тогтмол координатыг нөгөөгөөр нь илэрхийлнэ: y = ±√(R² − x²) (эсвэл x = ±√(R² − y²)),
//     нөгөө координатын мужийг cos, sin-ийн утгын мужаас.  (эх: x = cos t, y = sin t, 0 ≤ t ≤ π → y = √(1 − x²), −1 ≤ x ≤ 1)
var p10_I = [   // [t₀ TeX, t₁ TeX, cos-ийн муж, sin-ий муж, жин]
  ['0', '\\pi', [-1, 1], [0, 1], 4], ['\\pi', '2\\pi', [-1, 1], [-1, 0], 3],
  ['-\\dfrac{\\pi}{2}', '\\dfrac{\\pi}{2}', [0, 1], [-1, 1], 3], ['\\dfrac{\\pi}{2}', '\\dfrac{3\\pi}{2}', [-1, 0], [-1, 1], 2],
  ['0', '\\dfrac{\\pi}{2}', [0, 1], [0, 1], 1], ['\\dfrac{\\pi}{2}', '\\pi', [-1, 0], [0, 1], 1],
  ['\\pi', '\\dfrac{3\\pi}{2}', [-1, 0], [-1, 0], 1], ['\\dfrac{3\\pi}{2}', '2\\pi', [0, 1], [-1, 0], 1]
];
// Бодолтод: завсрын төгсгөл t = k·π/2 (k — TeX-ээс), cos/sin-ийн утга k·π/2 цэгт

// 12. x = x₀ + a·cos t, y = y₀ + b·sin t, 0 ≤ t ≤ 2π  →  cos²t + sin²t = 1  ⇒  (x − x₀)²/a² + (y − y₀)²/b² = 1 (эллипс).

// 15. x = at + b, y = C/(Mt) (+ d), t > 0: t = (x − b)/a → y = Ca/(M(x − b)) (+ d), M ∈ {1, |a|} тул хүртвэр бүхэл;

function p15() {

  var yA = (K < 0 ? '-' : '') + '\\dfrac{' + Math.abs(K) + '}{' + xb + '}' + dT, Cs = C < 0 ? '-' : '', s1;

  else if (M === A) s1 = '$x=' + xt + '$ тэгшитгэлээс $' + tm(a, 't', true) + '=' + xb + '$, өөрөөр хэлбэл $' + tm(M, 't', true) + '=-(' + xb + ')$. Үүнийг орлуулбал: $$y='
    + yt + '=' + Cs + '\\dfrac{' + Math.abs(C) + '}{-(' + xb + ')}' + dT + '=' + yA + '.$$';
  else s1 = '$x=' + xt + '$ тэгшитгэлээс $t=' + (a < 0 ? '-' : '') + '\\dfrac{' + xb + '}{' + A + '}$, иймд $\\dfrac{1}{t}=' + (a < 0 ? '-' : '') + '\\dfrac{' + A + '}{' + xb
    + '}$. Үүнийг орлуулбал: $$y=' + yt + '=' + (Math.abs(C) === 1 ? '' : C + '\\cdot ' + (a < 0 ? '\\left(-\\dfrac{' + A + '}{' + xb + '}\\right)' : '\\dfrac{' + A + '}{' + xb + '}') + dT + '=')
    + yA + '.$$';
  return {

    a: '$y=' + (K < 0 ? '-' : '') + '\\dfrac{' + Math.abs(K) + '}{' + poly([1, -b]) + '}' + (d ? sgn(d) : '') + ',\\ x' + (a > 0 ? '\\gt ' : '\\lt ') + b + '$',

// 16. Ерөнхий гишүүнээрээ өгөгдсөн дараалал a_n = pn² + qn + r: a_i − a_j (заримдаа a_i + a_j, a_i·a_j)-г ол

// 17. r-ээс эхлээд m-д хуваахад r үлдэгдэл өгөх натурал тоонууд: r, r + m, r + 2m, … → a_k = r + (k − 1)m

      'Арифметик прогрессийн ерөнхий гишүүний $a_n=a_1+(n-1)d$ томьёогоор: $$a_{' + k + '}=' + r + '+(' + k + '-1)\\cdot ' + m + '=' + r + '+' + (k - 1) * m + '='

// 18. Хязгааргүй буурах геометр прогрессийн нийлбэр S = b₁/(1 − q), |q| < 1 (эх: 1/2 + 1/4 + 1/8 + ⋯ = 1).

// 19. Эхний n гишүүний нийлбэр S_n = pn² + qn (+ r) → a_k = S_k − S_{k−1} (k ≥ 3) (эх: S_n = n², a_7 = 49 − 36 = 13).
function p19() {

// 20. (a + bx)ⁿ бином задаргааны x^k-ийн коэффициент = C(n, k)·a^{n−k}·b^k (эх: (1 − 2x)⁵).

function p20() {
  var a = pick([1, 1, 1, 2, 2, 3]), b = pick([-3, -2, -2, -1, 1, 2, 2, 3]), n = rnd(4, 10), k = rnd(2, n - 1);
  if (a === 1 && Math.abs(b) === 1 && rnd(0, 2)) return null;   // (1 ± x)ⁿ — цөөн
  if (gcd(a, b) > 1) return null;                              // (2 + 2x)ⁿ гэх мэт ерөнхий үржигдэхүүнгүй
  var c = p20_C(n, k) * Math.pow(a, n - k) * Math.pow(b, k);
  if (Math.abs(c) > 20000) return null;
  // Бодолт: Ньютоны бином T_{m+1} = C_n^m·a^{n−m}·(bx)^m; x^k гишүүн m = k үед ⇒ коэффициент C_n^k·a^{n−k}·b^k.
  //   C_n^k = n(n − 1)…/(1·2·…) (k > n − k бол C_n^k = C_n^{n−k}); k = n − 1 үед n!/((n − 1)!·1!).

    : Cn + '=' + (j < k ? 'C_{' + n + '}^{' + j + '}=' : '') + '\\dfrac{' + num.join('\\cdot ') + '}{' + den.join('\\cdot ') + '}=' + Cv;

  if (b !== 1) { fT.push(par(b) + '^{' + k + '}'); fV.push(Math.pow(b, k)); }
  var ss = [
    'Ньютоны биномын томьёогоор задаргааны ерөнхий гишүүн: $$T_{m+1}=C_{' + n + '}^{m}' + (a > 1 ? '\\cdot ' + a + '^{' + n + '-m}' : '') + '\\cdot ' + bx + '^{m}.$$',
    '$x^{' + k + '}$ гишүүн $m=' + k + '$ үед гарна. Биномын коэффициент: $$' + Ct + '.$$'
  ];
  ss.push(fT.length > 1 ? 'Иймд $x^{' + k + '}$-' + suf(k, 'ын') + ' өмнөх коэффициент: $$' + fT.join('\\cdot ') + '=' + fV.map(par).join('\\cdot ') + '=' + c + '.$$'
    : 'Иймд $x^{' + k + '}$-' + suf(k, 'ын') + ' өмнөх коэффициент $' + c + '$.');
  return {
    q: '$(' + a + tm(b, 'x') + ')^{' + n + '}$ бином задаргааны $x^{' + k + '}$-' + suf(k, 'ын') + ' өмнөх коэффициентийг ол.',
    a: '$' + c + '$', wk: 22,

// 21. (1 + kx)^α функцийг x³ хүртэл цуваанд задлах: 1 + αk·x + α(α−1)/2!·k²x² + α(α−1)(α−2)/3!·k³x³

// Бодолт: F = (1 + kx)^α; биномын цуваа (1 + t)^α ≈ 1 + αt + α(α−1)/2!·t² + α(α−1)(α−2)/3!·t³ — коэффициентийг α-аас тооцож,
// дараа нь t = kx орлуулна (k = 1 бол шууд). ser — генераторын эцсийн задаргаа (хариутай ижил бичлэг).
function p21_sol(F, B, an, ad, k, ser) {
  var fac = function (i) {                   // α − i хүчин зүйл (сөрөг бол хаалтад)
    var n = an - i * ad;
    return ad === 1 ? par(n) : n < 0 ? '\\left(' + frs(n, ad) + '\\right)' : frs(n, ad);
  };
  var C = [[an, ad], [an * (an - ad), 2 * ad * ad], [an * (an - ad) * (an - 2 * ad), 6 * ad * ad * ad]];
  var kx = tm(k, 'x', true);
  var term = function (j) {                  // c_j·(kx)^j, c_j — биномын коэффициент (t-ийн өмнөх)
    var n = C[j - 1][0], d = C[j - 1][1], g = gcd(n, d); n /= g; d /= g;
    var base = j === 1 ? (k < 0 ? '(' + kx + ')' : kx) : '(' + kx + ')^' + j;
    return (n < 0 ? '-' : '+') + (Math.abs(n) === 1 && d === 1 ? '' : fr(Math.abs(n), d) + '\\cdot ') + base;
  };
  return [
    'Функцийг зэргийн хэлбэрт бичье: $$' + F + '=(' + B + ')^{' + frs(an, ad) + '}.$$',
    'Биномын цувааны задаргаа ($|t|\\lt 1$): $$(1+t)^{\\alpha}=1+\\alpha t+\\dfrac{\\alpha(\\alpha-1)}{2!}t^2+\\dfrac{\\alpha(\\alpha-1)(\\alpha-2)}{3!}t^3+\\ldots$$'
      + ' Энд $\\alpha=' + fr(an, ad) + '$, $t=' + kx + '$.',
    'Коэффициентүүдийг бодъё: $$\\dfrac{\\alpha(\\alpha-1)}{2!}=\\dfrac{' + fac(0) + '\\cdot ' + fac(1) + '}{2}=' + fr(C[1][0], C[1][1]) + ',$$ $$\\dfrac{\\alpha(\\alpha-1)(\\alpha-2)}{3!}=\\dfrac{'
      + fac(0) + '\\cdot ' + fac(1) + '\\cdot ' + fac(2) + '}{6}=' + fr(C[2][0], C[2][1]) + '.$$',
    k === 1 ? 'Иймд $$' + F + '\\approx ' + ser + '.$$'
      : '$t=' + kx + '$-ийг орлуулбал: $$' + F + '\\approx 1' + term(1) + term(2) + term(3) + '$$ $$=' + ser + '.$$'
  ];
}

// 22. Нийлбэрийг олох (эх: 1 + 2 + 3 + ⋯ + n = n(n+1)/2).
//     A: a + (a+d) + (a+2d) + ⋯ + (dn + a − d) = n(dn + 2a − d)/2;  Q: 1² + ⋯ + n²;  C: 1³ + ⋯ + n³;  P: 1·2 + 2·3 + ⋯ + n(n+1);
//     N: 1 + 2 + ⋯ + m (тоо);  M: тоон арифметик прогресс a + (a+d) + ⋯ + L.
function p22() {
  var kind = pick(['A', 'A', 'A', 'A', 'A', 'Q', 'C', 'P', 'N', 'M', 'M']), s, ans, sol;
  // Бодолт: арифметик прогресс → S_n = (a₁ + a_n)·n/2 (гишүүний тоог a_n-ээс); Q — (k+1)³ − k³ = 3k² + 3k + 1-ийг нэмэх;
  //   C, P — k³ = (T_k − T_{k−1})/4, k(k+1) = (T_k − T_{k−1})/3 телескоп нийлбэр; N, M — тоон нийлбэр (хуваагдах хүчин зүйлийг эхэлж хураана)
  var SN = 'Арифметик прогрессийн эхний $n$ гишүүний нийлбэрийн томьёогоор ';
  if (kind === 'A') {
    var a = rnd(1, 5), d = rnd(1, 5), e = 2 * a - d, c = gcd(d, e), inn = [d / c, e / c], cn = c, cd = 2, h = gcd(cn, cd);
    cn /= h; cd /= h;
    var body = inn[0] === 1 && inn[1] === 0 ? 'n^2' : 'n(' + poly(inn, 'n') + ')', num = (cn === 1 ? '' : cn) + body;
    var last = a === d ? (d === 1 ? 'n' : d + 'n') : '(' + poly([d, a - d], 'n') + ')';
    s = a + '+' + (a + d) + '+' + (a + 2 * d) + '+\\cdots+' + last;
    ans = cd === 1 ? num : '\\dfrac{' + num + '}{' + cd + '}';
    var mid = e === 0 ? '\\dfrac{' + d + 'n\\cdot n}{2}' : '\\dfrac{n(' + poly([d, e], 'n') + ')}{2}';
    sol = [
      'Нэмэгдэхүүнүүд $a_1=' + a + '$, $d=' + d + '$ арифметик прогресс үүсгэнэ: $$a_n=a_1+(n-1)d=' + a + tm(d, '(n-1)') + '=' + poly([d, a - d], 'n') + ',$$'
        + ' өөрөөр хэлбэл сүүлийн нэмэгдэхүүн нь $n$-р гишүүн (нийт $n$ гишүүн).',
      SN + '$$S_n=\\dfrac{a_1+a_n}{2}\\cdot n=\\dfrac{' + a + '+' + last + '}{2}\\cdot n$$ $$=' + mid + (mid !== ans ? '=' + ans : '') + '.$$'
    ];
  } else if (kind === 'Q') {
    s = '1^2+2^2+3^2+\\cdots+n^2'; ans = '\\dfrac{n(n+1)(2n+1)}{6}';
    sol = [
      '$S=1^2+2^2+\\cdots+n^2$ гэе. $(k+1)^3-k^3=3k^2+3k+1$ адилтгалыг $k=1,\\ 2,\\ \\ldots,\\ n$ үед бичиж нэмбэл зүүн талд дунд гишүүд устана: '
        + '$$(n+1)^3-1=3S+3\\cdot\\dfrac{n(n+1)}{2}+n$$ ($1+2+\\cdots+n=\\dfrac{n(n+1)}{2}$).',
      '$2$-оор үржүүлж $6S$-ийг илэрхийлбэл: $$6S=2(n+1)^3-2(n+1)-3n(n+1)$$ $$=(n+1)(2n^2+4n+2-2-3n)=(n+1)(2n^2+n).$$',
      '$2n^2+n=n(2n+1)$ тул $$S=' + ans + '.$$'
    ];
  } else if (kind === 'C') {
    s = '1^3+2^3+3^3+\\cdots+n^3'; ans = '\\dfrac{n^2(n+1)^2}{4}';
    sol = [
      '$T_k=k^2(k+1)^2$ гэж тэмдэглэе. Квадратуудын ялгаврын томьёогоор $$T_k-T_{k-1}=k^2\\big((k+1)^2-(k-1)^2\\big)=k^2\\cdot 4k=4k^3.$$',
      'Иймд $k^3=\\dfrac{T_k-T_{k-1}}{4}$. Үүнийг $k=1,\\ 2,\\ \\ldots,\\ n$ үед нэмбэл дунд гишүүд устана (телескоп нийлбэр), $T_0=0$: '
        + '$$1^3+2^3+\\cdots+n^3=\\dfrac{T_n-T_0}{4}=' + ans + '.$$'
    ];
  } else if (kind === 'P') {
    s = '1\\cdot 2+2\\cdot 3+3\\cdot 4+\\cdots+n(n+1)'; ans = '\\dfrac{n(n+1)(n+2)}{3}';
    sol = [
      '$T_k=k(k+1)(k+2)$ гэж тэмдэглэе. $$T_k-T_{k-1}=k(k+1)\\big((k+2)-(k-1)\\big)=3k(k+1).$$',
      'Иймд $k(k+1)=\\dfrac{T_k-T_{k-1}}{3}$. Үүнийг $k=1,\\ 2,\\ \\ldots,\\ n$ үед нэмбэл дунд гишүүд устана (телескоп нийлбэр), $T_0=0$: '
        + '$$1\\cdot 2+2\\cdot 3+\\cdots+n(n+1)=\\dfrac{T_n-T_0}{3}=' + ans + '.$$'
    ];
  } else if (kind === 'N') {
    var m = rnd(15, 100); s = '1+2+3+\\cdots+' + m; ans = String(m * (m + 1) / 2);
    sol = [
      'Нэмэгдэхүүнүүд $a_1=1$, $d=1$ арифметик прогресс, $a_n=n$ тул нийт $' + m + '$ гишүүн.',
      SN + '$$S_{' + m + '}=\\dfrac{a_1+a_{' + m + '}}{2}\\cdot ' + m + '=\\dfrac{1+' + m + '}{2}\\cdot ' + m + '='
        + ((m + 1) % 2 ? (m + 1) + '\\cdot ' + m / 2 : (m + 1) / 2 + '\\cdot ' + m) + '=' + ans + '.$$'
    ];
  } else {
    var a0 = rnd(1, 9), d0 = rnd(2, 7), N = rnd(8, 30), L = a0 + (N - 1) * d0;
    s = a0 + '+' + (a0 + d0) + '+' + (a0 + 2 * d0) + '+\\cdots+' + L; ans = String(N * (a0 + L) / 2);
    sol = [
      'Нэмэгдэхүүнүүд $a_1=' + a0 + '$, $d=' + d0 + '$ арифметик прогресс. $a_n=a_1+(n-1)d$ томьёогоор сүүлийн гишүүний дугаарыг олъё: $$'
        + a0 + '+(n-1)\\cdot ' + d0 + '=' + L + '\\ \\Rightarrow\\ n-1=\\dfrac{' + L + '-' + a0 + '}{' + d0 + '}=' + (N - 1) + '\\ \\Rightarrow\\ n=' + N + '.$$',
      SN + '$$S_{' + N + '}=\\dfrac{a_1+a_{' + N + '}}{2}\\cdot ' + N + '=\\dfrac{' + a0 + '+' + L + '}{2}\\cdot ' + N + '='
        + ((a0 + L) % 2 ? (a0 + L) + '\\cdot ' + N / 2 : (a0 + L) / 2 + '\\cdot ' + N) + '=' + ans + '.$$'
    ];
  }
  return { q: '$' + s + '$ нийлбэрийг олоорой.', a: '$' + ans + '$', wk: 20, s: sol, t: { kind: kind } };
}

// 23. Эхний таван гишүүнээр нь ерөнхий гишүүний томьёо: арифметик a_n = dn + (a₁ − d) эсвэл геометр a_n = a₁·q^{n−1}
//     (эх: 5, 9, 13, 17, 21, … → a_n = 4n + 1). a₁ = ±q^j (j = 0, 1, 2) бол ±q^{n−1}, ±qⁿ, ±q^{n+1} хэлбэрт хялбарчилна.
function p23() {
  var terms = [], f, i, sol;
  // Бодолт: хөрш гишүүдийн ялгавар (харьцаа) тогтмол → арифметик (геометр) прогресс → a_n = a₁ + (n−1)d  (a_n = a₁qⁿ⁻¹);
  //   a₁ = ±q^j бол зэргийн чанараар q^{n−1+j} болгон хялбарчилна
  if (rnd(0, 2)) {                                             // арифметик
    var a1 = rnd(-9, 12), d = nz(-6, 7), b = a1 - d;
    if (Math.abs(d) === 1 && rnd(0, 1)) return null;
    for (i = 0; i < 5; i++) terms.push(a1 + i * d);
    f = d < 0 && b > 0 ? b + tm(d, 'n') : poly([d, b], 'n');
    sol = [
      'Хөрш гишүүдийн ялгавар тогтмол: $$' + terms[1] + '-' + par(terms[0]) + '=' + terms[2] + '-' + par(terms[1]) + '=' + d + ',$$ тул энэ нь $a_1=' + a1 + '$, $d=' + d
        + '$ арифметик прогресс.',
      'Арифметик прогрессийн ерөнхий гишүүний томьёогоор $$a_n=a_1+(n-1)d=' + (a1 ? a1 + tm(d, '(n-1)') : tm(d, '(n-1)', true)) + '=' + f + '.$$'
    ];
  } else {                                                     // геометр
    var q = pick([2, 2, 3, 3, 4, 5, -2, -2, -3]), c = pick([1, 1, 2, 3, 5, -1, -2, -3, q, q * q, -q]);
    for (i = 0; i < 5; i++) terms.push(c * Math.pow(q, i));
    if (Math.abs(terms[4]) > 1300) return null;
    var Q = q < 0 ? '(' + q + ')' : String(q), P = [1, q, q * q], j = -1, sg = '', k;
    for (k = 0; k < 3 && j < 0; k++) { if (c === P[k]) j = k; else if (c === -P[k]) { j = k; sg = '-'; } }
    f = j >= 0 ? sg + Q + '^{' + ['n-1', 'n', 'n+1'][j] + '}' : c + '\\cdot ' + Q + '^{n-1}';
    // a₁ = ±q^j: q² эсвэл (q < 0 үед) −q-г зэрэг хэлбэрээр бичиж нэгтгэнэ
    var raw = c + '\\cdot ' + Q + '^{n-1}', mid = j === 2 ? sg + Q + '^2\\cdot ' + Q + '^{n-1}' : j === 1 && sg && q < 0 ? '-' + Q + '\\cdot ' + Q + '^{n-1}' : '';
    // a₁ = ±1 бол «÷1» бутархай бичихгүй — хуваах тэмдэг (:) ашиглана
    var rat = Math.abs(c) === 1 ? par(terms[1]) + ':' + par(terms[0]) + '=' + par(terms[2]) + ':' + par(terms[1])
      : '\\dfrac{' + terms[1] + '}{' + terms[0] + '}=\\dfrac{' + terms[2] + '}{' + terms[1] + '}';
    sol = [
      'Хөрш гишүүдийн харьцаа тогтмол: $$' + rat + '=' + q + ',$$ тул энэ нь $a_1=' + c + '$, $q=' + q + '$ геометр прогресс.',
      'Геометр прогрессийн ерөнхий гишүүний томьёогоор $$a_n=a_1q^{n-1}=' + raw + (mid ? '=' + mid : '') + (f !== raw ? '=' + f : '') + '.$$'
    ];
  }
  return {
    q: '$' + terms.join(',') + ',\\ldots$ дарааллын ерөнхий гишүүний томьёог бичээрэй.',
    a: '$a_n=' + f + '$', wk: 18, s: sol, t: { terms: terms }
  };
}

// 24. Геометр прогрессийн эхний n гишүүний нийлбэр S_n = b₁(qⁿ − 1)/(q − 1) (эх: 1 + 2 + 4 + ⋯ + 2^{n−1} = 2ⁿ − 1).
//     G1: 1 + q + ⋯ + q^{n−1};  G1−: 1 − q + q² − ⋯ + (−q)^{n−1};  G2: q + q² + ⋯ + qⁿ;  G3: c + cq + ⋯ + c·q^{n−1};  N: тоон нийлбэр.
function p24() {
  var kind = pick(['G1', 'G1', 'G1', 'A', 'G2', 'G2', 'G3', 'G3', 'N', 'N']), s, ans, q, sol;
  // Бодолт: нэмэгдэхүүнүүд b₁, q геометр прогресс; сүүлийн гишүүн b₁qⁿ⁻¹ → гишүүний тоо; S_n = b₁(qⁿ − 1)/(q − 1)
  //   (тэмдэг ээлжлэх A-д q < 0: S_n = b₁(1 − qⁿ)/(1 − q)); тоон N-д qⁿ⁻¹ = L/b₁-ээс n-ийг олж, нийлбэрийг тоогоор бодно
  var SN = 'Геометр прогрессийн эхний $n$ гишүүний нийлбэрийн томьёогоор ', FS = 'S_n=\\dfrac{b_1(q^n-1)}{q-1}=';
  if (kind === 'G1') {
    q = pick([2, 2, 3, 4, 5, 6, 7]);
    s = '1+' + q + '+' + q * q + '+\\cdots+' + q + '^{n-1}';
    ans = q === 2 ? '2^n-1' : '\\dfrac{' + q + '^n-1}{' + (q - 1) + '}';
    sol = [
      'Нэмэгдэхүүнүүд $b_1=1$, $q=' + q + '$ геометр прогресс үүсгэнэ. Сүүлийн нэмэгдэхүүн $' + q + '^{n-1}=b_1q^{n-1}$ нь $n$-р гишүүн тул нийт $n$ гишүүн.',
      SN + '$$' + FS + '\\dfrac{' + q + '^n-1}{' + q + '-1}=' + ans + '.$$'
    ];
  } else if (kind === 'A') {
    q = pick([2, 2, 3, 4]);
    s = '1-' + q + '+' + q * q + '-' + q * q * q + '+\\cdots+(-' + q + ')^{n-1}';
    ans = '\\dfrac{1-(-' + q + ')^n}{' + (q + 1) + '}';
    sol = [
      'Нэмэгдэхүүнүүдийн тэмдэг ээлжилнэ: энэ нь $b_1=1$, $q=-' + q + '$ геометр прогресс. Сүүлийн нэмэгдэхүүн $(-' + q + ')^{n-1}=b_1q^{n-1}$ нь $n$-р гишүүн тул нийт $n$ гишүүн.',
      SN + '$$S_n=\\dfrac{b_1(1-q^n)}{1-q}=\\dfrac{1-(-' + q + ')^n}{1-(-' + q + ')}=' + ans + '.$$'
    ];
  } else if (kind === 'G2') {
    q = pick([2, 2, 3, 4, 5, 6, 7]);
    s = q + '+' + q * q + '+' + q * q * q + '+\\cdots+' + q + '^n';
    ans = q === 2 ? '2^{n+1}-2' : '\\dfrac{' + q + '^{n+1}-' + q + '}{' + (q - 1) + '}';
    sol = [
      'Нэмэгдэхүүнүүд $b_1=' + q + '$, $q=' + q + '$ геометр прогресс үүсгэнэ. Сүүлийн нэмэгдэхүүн $' + q + '^n=b_1q^{n-1}$ нь $n$-р гишүүн тул нийт $n$ гишүүн.',
      SN + '$$' + FS + '\\dfrac{' + q + '(' + q + '^n-1)}{' + q + '-1}=' + ans + '.$$'
    ];
  } else if (kind === 'G3') {
    q = rnd(2, 5); var c = rnd(2, 9);
    if (c === q || c === q * q || c === q * q * q) return null;                  // c = q^j бол G2 хэлбэр
    var g = gcd(c, q - 1), cc = c / g, dd = (q - 1) / g, inner = q + '^n-1';
    s = c + '+' + c * q + '+' + c * q * q + '+\\cdots+' + c + '\\cdot ' + q + '^{n-1}';
    ans = dd === 1 ? (cc === 1 ? inner : cc + '(' + inner + ')') : '\\dfrac{' + (cc === 1 ? inner : cc + '(' + inner + ')') + '}{' + dd + '}';
    sol = [
      'Нэмэгдэхүүнүүд $b_1=' + c + '$, $q=' + q + '$ геометр прогресс үүсгэнэ. Сүүлийн нэмэгдэхүүн $' + c + '\\cdot ' + q + '^{n-1}=b_1q^{n-1}$ нь $n$-р гишүүн тул нийт $n$ гишүүн.',
      SN + '$$' + FS + '\\dfrac{' + c + '(' + q + '^n-1)}{' + q + '-1}=' + ans + '.$$'
    ];
  } else {
    var b = pick([1, 1, 2, 3, 4, 5, 6, 7]), r = rnd(2, 5), K = rnd(5, 10), L = b * Math.pow(r, K - 1);
    if (L > 5000 || L < 60) return null;
    s = b + '+' + b * r + '+' + b * r * r + '+\\cdots+' + L;
    ans = String(b * (Math.pow(r, K) - 1) / (r - 1));
    var RK = Math.pow(r, K) - 1, bm = b === 1 ? '' : b + '\\cdot ';
    var E1 = '\\dfrac{' + (b === 1 ? r + '^{' + K + '}-1' : b + '(' + r + '^{' + K + '}-1)') + '}{' + r + '-1}';
    var E2 = r === 2 ? (b === 1 ? '' : bm + RK) : '\\dfrac{' + bm + RK + '}{' + (r - 1) + '}';
    sol = [
      'Нэмэгдэхүүнүүд $b_1=' + b + '$, $q=' + r + '$ геометр прогресс. $b_n=b_1q^{n-1}$ томьёогоор сүүлийн гишүүний дугаарыг олъё: $$'
        + (b === 1 ? '' : b + '\\cdot ' + r + '^{n-1}=' + L + '\\ \\Rightarrow\\ ') + r + '^{n-1}=' + L / b + '=' + r + '^{' + (K - 1) + '}\\ \\Rightarrow\\ n=' + K + '.$$',
      SN + '$$S_{' + K + '}=\\dfrac{b_1(q^{' + K + '}-1)}{q-1}=' + E1 + (E2 ? '=' + E2 : '') + '=' + ans + '.$$'
    ];
  }
  return { q: '$' + s + '$ нийлбэрийг олоорой.', a: '$' + ans + '$', wk: 20, s: sol, t: { kind: kind } };
}

// 25. Рекуррент томьёогоор өгөгдсөн дарааллын ерөнхий гишүүн (эх: a₁ = 1/2, a_{n+1} = 1/(2 − a_n) → a_n = n/(n+1)).
//     R1: a_{n+1} = 1/(2 − a_n): b_n = 1/(1 − a_n) нь 1 ялгавартай арифметик → b₁ = u/v үед a_n = (vn − 2v + u)/(vn − v + u);
//     R2: a_{n+1} = a_n/(1 + k·a_n), a₁ = p/m → 1/a_n арифметик → a_n = p/(kpn − kp + m);
//     R3: a_{n+1} = c·a_n + d → a_n + s = (a₁ + s)c^{n−1}, s = d/(c − 1);  R4: a_{n+1} = a_n + kn + e → квадрат олон гишүүнт.
var p25_R1 = [[1, 2], [1, 2], [2, 3], [1, 3], [0, 1], [3, 4], [-1, 1], [1, 4], [2, 5], [3, 5], [-1, 2], [-2, 1], [4, 5]];
function p25() {
  var kind = pick(['R1', 'R1', 'R1', 'R1', 'R2', 'R2', 'R3', 'R3', 'R4', 'R4']), A1, rec, ans, sol;
  // Бодолт: R1 — b_n = 1/(1 − a_n) нь d = 1 арифметик; R2 — c_n = 1/a_n нь d = k арифметик; R3 — тогтмол шийд x = −s,
  //   b_n = a_n + s нь q = c геометр; R4 — a_{i+1} − a_i = k·i + e-г i = 1..n−1-ээр нэмж (телескоп), 1 + ⋯ + (n−1) = (n−1)n/2.
  if (kind === 'R1') {
    var a = pick(p25_R1), g = gcd(a[1], a[1] - a[0]), u = a[1] / g, v = (a[1] - a[0]) / g;   // b₁ = 1/(1 − a₁) = u/v
    A1 = fr(a[0], a[1]); rec = '\\dfrac{1}{2-a_n}';
    ans = '\\dfrac{' + poly([v, u - 2 * v], 'n') + '}{' + poly([v, u - v], 'n') + '}';
    var a1s = a[0] < 0 ? (a[1] === 1 ? '(' + a[0] + ')' : '\\left(' + frs(a[0], a[1]) + '\\right)') : frs(a[0], a[1]), bn = poly([v, u - v], 'n');
    sol = [
      '$b_n=\\dfrac{1}{1-a_n}$ гэж тэмдэглэе. Рекуррент томьёогоор $$1-a_{n+1}=1-\\dfrac{1}{2-a_n}=\\dfrac{1-a_n}{2-a_n}$$ тул $$b_{n+1}=\\dfrac{2-a_n}{1-a_n}=1+\\dfrac{1}{1-a_n}=b_n+1.$$',
      'Иймд $(b_n)$ нь $d=1$ ялгавартай арифметик прогресс, $b_1=\\dfrac{1}{1-a_1}=' + (a[0] ? '\\dfrac{1}{1-' + a1s + '}=' : '') + fr(u, v) + '$: $$b_n=b_1+(n-1)='
        + fr(u, v) + '+n-1=' + (v === 1 ? bn : '\\dfrac{' + bn + '}{' + v + '}') + '.$$',
      '$a_n=1-\\dfrac{1}{b_n}$ тул $$a_n=1-\\dfrac{' + v + '}{' + bn + '}=' + ans + '.$$'
    ];
  } else if (kind === 'R2') {
    var p = pick([1, 1, 1, 2]), m = rnd(1, 4), k = rnd(1, 4);
    if (gcd(p, m) !== 1 || p === 2 && m === 1 && k > 2) return null;
    A1 = fr(p, m); rec = '\\dfrac{a_n}{1' + tm(k, 'a_n') + '}';
    ans = '\\dfrac{' + p + '}{' + poly([k * p, m - k * p], 'n') + '}';
    var cn = poly([k * p, m - k * p], 'n');
    sol = [
      'Урвуу утгуудыг авъя: $$\\dfrac{1}{a_{n+1}}=\\dfrac{1' + tm(k, 'a_n') + '}{a_n}=\\dfrac{1}{a_n}+' + k + '.$$ Иймд $c_n=\\dfrac{1}{a_n}$ нь $d=' + k + '$ ялгавартай арифметик прогресс.',
      '$c_1=\\dfrac{1}{a_1}=' + fr(m, p) + '$ тул $$c_n=c_1+(n-1)d=' + fr(m, p) + tm(k, '(n-1)') + '=' + (p === 1 ? cn : '\\dfrac{' + cn + '}{' + p + '}') + '.$$',
      'Иймд $$a_n=\\dfrac{1}{c_n}=' + ans + '.$$'
    ];
  } else if (kind === 'R3') {
    var c = pick([2, 2, 3]), s = pick([1, 1, 2, 3, -1, -2]), d = s * (c - 1), a1 = rnd(1, 5), K = a1 + s;
    if (K <= 0) return null;
    A1 = String(a1); rec = c + 'a_n' + sgn(d);
    var j = [1, c, c * c].indexOf(K), pw = j >= 0 ? c + '^{' + ['n-1', 'n', 'n+1'][j] + '}' : K + '\\cdot ' + c + '^{n-1}';
    if (j < 0 && K > 4) return null;
    ans = pw + sgn(-s);
    sol = [
      'Тогтмол шийдийг олъё ($a_{n+1}=a_n=x$): $$x=' + c + 'x' + sgn(d) + '\\ \\Rightarrow\\ x=' + (-s) + '.$$ Иймд $b_n=a_n' + sgn(s) + '$ гэж тэмдэглэе.',
      '$$b_{n+1}=a_{n+1}' + sgn(s) + '=' + c + 'a_n' + sgn(c * s) + '=' + c + '(a_n' + sgn(s) + ')=' + c + 'b_n,$$ тул $(b_n)$ нь $q=' + c + '$ хуваарьтай геометр прогресс, $b_1=a_1'
        + sgn(s) + '=' + a1 + sgn(s) + '=' + K + '$.',
      '$$b_n=b_1q^{n-1}=' + K + '\\cdot ' + c + '^{n-1}' + (j === 2 ? '=' + c + '^2\\cdot ' + c + '^{n-1}' : '') + (j >= 0 ? '=' + pw : '') + '.$$ Иймд $a_n=b_n' + sgn(-s) + '=' + ans + '$.'
    ];
  } else {
    var k2 = pick([2, 2, 4]), e = rnd(-1, 3), b1 = rnd(-3, 5);
    A1 = String(b1); rec = 'a_n' + tm(k2, 'n') + (e ? sgn(e) : '');
    ans = poly([k2 / 2, e - k2 / 2, b1 - e], 'n');
    var en = tm(e, '(n-1)'), mid = (b1 ? b1 + tm(k2 / 2, '(n^2-n)') : tm(k2 / 2, '(n^2-n)', true)) + en;
    if (mid === '(n^2-n)') mid = '';                           // a₁ = 0, e = 0, k = 2: шууд n² − n
    sol = [
      'Рекуррент томьёогоор $a_{i+1}-a_i=' + k2 + 'i' + (e ? sgn(e) : '') + '$. Үүнийг $i=1,\\ 2,\\ \\ldots,\\ n-1$ үед бичиж нэмбэл зүүн талд дунд гишүүд устана: $$a_n-a_1='
        + k2 + '\\big(1+2+\\cdots+(n-1)\\big)' + en + '.$$',
      '$1+2+\\cdots+(n-1)=\\dfrac{(n-1)n}{2}$ ба $a_1=' + b1 + '$ тул $$a_n=' + (b1 ? b1 + '+' : '') + k2 + '\\cdot\\dfrac{(n-1)n}{2}' + en + '$$ $$='
        + (mid ? mid + '=' : '') + ans + '.$$'
    ];
  }
  return {
    q: '$a_1=' + A1 + ',\\ a_{n+1}=' + rec + '$ бол $a_n=?$',
    a: '$a_n=' + ans + '$', wk: 28, s: sol, t: { kind: kind }
  };
}
