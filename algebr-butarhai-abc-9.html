<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Алгебрын бутархай — 7 томьёо ба ax²+bx+c задлал (бүүр хүнд)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--line:#e7ddff;--green:#16a34a;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.6}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:17px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .formulas{background:#f7f4ff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:10px}
  .formulas h3{font-size:11px;color:#5a32d6;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
  .fg{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 22px;font-size:12px}
  .fg .fi{display:flex;gap:7px}.fg .fn{color:var(--purple);font-weight:800;min-width:16px}
  .guide{background:#f6f2ff;border:1px solid #e2d6ff;border-radius:12px;padding:9px 16px;margin-bottom:14px;font-size:11.6px;text-align:center}
  .guide b{color:#5a32d6}
  .q{break-inside:avoid;page-break-inside:avoid;padding:9px 4px 10px;border-bottom:1px dashed #efeaff}
  .qh{display:flex;gap:8px;align-items:baseline}.qn{font-weight:800;color:var(--purple);min-width:26px}.qm{font-size:14px}
  .bl{margin:16px 0 2px 30px;border-bottom:1.4px solid #b9accf;height:1.05em}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .sol{break-inside:avoid;page-break-inside:avoid;margin-bottom:12px;padding-bottom:8px;border-bottom:1px dashed #eee}
  .sol .sh{font-weight:800;color:var(--purple);font-size:13px;margin-bottom:3px}
  .sol .step{font-size:13px;margin:2px 0 2px 14px}
  .sol .fin{font-size:13.5px;margin:3px 0 0 14px;color:var(--green);font-weight:700}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(lo,hi){var v=0;while(v===0)v=rnd(lo,hi);return v;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function fr(t,b){return '\\dfrac{'+t+'}{'+b+'}';}

// —— шугаман үржигдэхүүн ба гурвон гишүүнт форматлагч ——
function lin(f){return (f.p===1?'x':f.p+'x')+(f.q>0?'+'+f.q:'-'+(-f.q));}
function linP(f){return '('+lin(f)+')';}
function tA(a){return (a===1?'':a)+'x^{2}';}
function tB(b){var m=Math.abs(b);return (b>0?'+':'-')+(m===1?'':m)+'x';}
function tC(c){return (c>0?'+'+c:'-'+(-c));}
function trin(A,B){var a=A.p*B.p,b=A.p*B.q+B.p*A.q,c=A.q*B.q;return tA(a)+tB(b)+tC(c);} // b≠0 шаардана
function mid(A,B){return A.p*B.q+B.p*A.q;}
function pickLin(used){while(true){var p=rnd(1,2),q=nz(-5,5),key=p+'|'+q;if(used.indexOf(key)>=0)continue;used.push(key);return {p:p,q:q};}}

// —— ax²+bx+c задлалын загварууд (гурвон гишүүнт) ——
function M1(){ // reduce + multiply → шугаман үржигдэхүүн
  var A,B,C,u;do{u=[];A=pickLin(u);B=pickLin(u);C=pickLin(u);}while(mid(A,B)===0||mid(C,B)===0);
  return {q:fr(trin(A,B),trin(C,B))+'\\cdot '+linP(C),
    steps:['='+fr(linP(A)+linP(B),linP(C)+linP(B))+'\\cdot '+linP(C),
           '='+fr(linP(A),linP(C))+'\\cdot '+linP(C)],
    ans:lin(A)};
}
function M2(){ // divide (2 гурвон гишүүнт) → 1
  var A,B,C,u;do{u=[];A=pickLin(u);B=pickLin(u);C=pickLin(u);}while(mid(A,B)===0||mid(A,C)===0);
  return {q:fr(trin(A,B),trin(A,C))+'\\div '+fr(lin(B),lin(C)),
    steps:['='+fr(linP(A)+linP(B),linP(A)+linP(C))+'\\cdot '+fr(linP(C),linP(B)),
           '='+fr(linP(B),linP(C))+'\\cdot '+fr(linP(C),linP(B))],
    ans:'1'};
}
function M3(){ // трином ÷ шугаман - шугаман → 0
  var A,B,u;do{u=[];A=pickLin(u);B=pickLin(u);}while(mid(A,B)===0);
  return {q:fr(trin(A,B),lin(A))+'-'+linP(B),
    steps:['='+fr(linP(A)+linP(B),linP(A))+'-'+linP(B),
           '='+linP(B)+'-'+linP(B)],
    ans:'0'};
}
function M4(){ // трином + квадратуудын ялгавар (7 томьёо холилдсон) → 1
  var k=rnd(2,6),A={p:1,q:k},B,u;do{u=['1|'+k];B=pickLin(u);}while(mid(A,B)===0);
  var dsq='x^{2}-'+(k*k);
  return {q:fr(trin(A,B),dsq)+'\\cdot '+fr('x-'+k,lin(B)),
    steps:['='+fr(linP(A)+linP(B),'(x-'+k+')(x+'+k+')')+'\\cdot '+fr('x-'+k,linP(B)),
           '='+fr(linP(B),'x-'+k)+'\\cdot '+fr('x-'+k,linP(B))],
    ans:'1'};
}

// —— 7 томьёоны загварууд (куб ба квадрат) ——
function F1(){var a=rnd(2,7),a2=a*a,da=2*a,sqp='x^{2}+'+da+'x+'+a2,dsq='x^{2}-'+a2;
  return {q:fr(dsq,sqp)+'\\div '+fr('x-'+a,sqp),
    steps:['='+fr(dsq,'(x+'+a+')^{2}')+'\\cdot '+fr('(x+'+a+')^{2}','x-'+a),
           '='+fr('(x-'+a+')(x+'+a+')','(x+'+a+')^{2}')+'\\cdot '+fr('(x+'+a+')^{2}','x-'+a)],
    ans:'x+'+a};}
function F2(){var a=rnd(2,7),a2=a*a,a3=a*a*a,dsq='x^{2}-'+a2,scof='x^{2}-'+a+'x+'+a2;
  return {q:fr('x^{3}+'+a3,dsq)+'\\cdot '+fr('x-'+a,scof),
    steps:['='+fr('(x+'+a+')('+scof+')','(x-'+a+')(x+'+a+')')+'\\cdot '+fr('x-'+a,scof),
           '='+fr(scof,'x-'+a)+'\\cdot '+fr('x-'+a,scof)],
    ans:'1'};}
function F3(){var a=rnd(2,7),a2=a*a,a3=a*a*a;
  return {q:fr('x^{3}-'+a3,'x-'+a)+'-x^{2}',
    steps:['=(x^{2}+'+a+'x+'+a2+')-x^{2}'],
    ans:''+a+'x+'+a2};}
function F4(){var a=rnd(2,7),a2=a*a,a3=a*a*a,scof='x^{2}-'+a+'x+'+a2;
  return {q:fr('x^{3}+'+a3,scof)+'\\div '+fr('x+'+a,'x-'+a),
    steps:['='+fr('(x+'+a+')('+scof+')',scof)+'\\cdot '+fr('x-'+a,'x+'+a),
           '=(x+'+a+')\\cdot '+fr('x-'+a,'x+'+a)],
    ans:'x-'+a};}

var TEMPLATES=[M1,M2,M3,M4,F1,F2,F3,F4];

var FORMULAS=[
  '(a\\pm b)^{2}=a^{2}\\pm 2ab+b^{2}',
  'a^{2}-b^{2}=(a-b)(a+b)',
  'a^{3}+b^{3}=(a+b)(a^{2}-ab+b^{2})',
  'a^{3}-b^{3}=(a-b)(a^{2}+ab+b^{2})',
  'ax^{2}+bx+c=a(x-x_{1})(x-x_{2})',
  'x_{1,2}=\\dfrac{-b\\pm\\sqrt{b^{2}-4ac}}{2a}',
];

var N=8;
function build(){
  var order=[];for(var i=0;i<TEMPLATES.length;i++)order.push(i);
  for(var i=order.length-1;i>0;i--){var j=rnd(0,i);var t=order[i];order[i]=order[j];order[j]=t;}
  var probs='',sols='',WS=[];
  for(var i=0;i<N;i++){
    var pr=TEMPLATES[order[i%order.length]]();
    var k=i+1;
    probs+='<div class="q"><div class="qh"><span class="qn">'+k+'.</span><span class="qm">$'+pr.q+'=$</span></div><div class="bl"></div></div>';
    var stepHtml=pr.steps.map(function(s){return '<div class="step">$'+s+'$</div>';}).join('');
    sols+='<div class="sol"><div class="sh">'+k+'-р бодлого</div>'
      +'<div class="step">$'+pr.q+'$</div>'+stepHtml
      +'<div class="fin">$\\Rightarrow\\ '+pr.ans+'$</div></div>';
    WS.push({q:pr.q+'=',a:pr.ans});
  }
  var fg=FORMULAS.map(function(f,i){return '<div class="fi"><span class="fn">'+(i+1)+'.</span><span>$'+f+'$</span></div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Алгебрын бутархай — 7 томьёо ба ax²+bx+c задлал (бүүр хүнд)</h1>'
    +'<div class="sub">9-р анги · гурвон гишүүнтийг задлах → хорого → хуваах·үржих·нэмэх·хасах · бодолттой · '+N+' бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="formulas"><h3>Задлалын томьёо</h3><div class="fg">'+fg+'</div></div>'
    +'<div class="guide">Гурвон гишүүнт <b>ax²+bx+c</b>-г <b>a·c задлах арга</b> буюу дискриминантаар үржигдэхүүнд задал → тоологч·хуваарийн <b>нийтлэг үржигдэхүүнийг хорого</b> → хуваахыг урвуугаар үржүүл.</div>'
    +'<div>'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Бодолт</h2>'+sols+'</div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='Алгебрын бутархай — 7 томьёо ба ax²+bx+c (бүүр хүнд)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=36"></script>
</body>
</html>
