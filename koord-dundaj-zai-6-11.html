<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Координатын арга — дундаж цэг ба зай (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .grid.g3{grid-template-columns:1fr 1fr 1fr}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:22mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function frTeX(n,d){if(d===0)return '0';if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;return (n<0?'-':'')+'\\dfrac{'+Math.abs(n)+'}{'+d+'}';}
function co(v){return '('+v[0]+';'+v[1]+')';}
function pmb(n){return n<0?'('+n+')':''+n;}
function plane(pts,segs){var xs=pts.map(function(p){return p.x;}),ys=pts.map(function(p){return p.y;});
  var xmin=Math.min.apply(null,xs.concat([0]))-1,xmax=Math.max.apply(null,xs.concat([0]))+1;
  var ymin=Math.min.apply(null,ys.concat([0]))-1,ymax=Math.max.apply(null,ys.concat([0]))+1;
  var W=178,H=168,pad=10,xspan=xmax-xmin,yspan=ymax-ymin,u=Math.min((W-2*pad)/xspan,(H-2*pad)/yspan);
  var ox=pad+((W-2*pad)-u*xspan)/2,oy=pad+((H-2*pad)-u*yspan)/2;
  function X(x){return (ox+(x-xmin)*u).toFixed(1);}function Y(y){return (oy+(ymax-y)*u).toFixed(1);}
  var g='';
  for(var gx=Math.ceil(xmin);gx<=xmax;gx++)g+='<line x1="'+X(gx)+'" y1="'+Y(ymin)+'" x2="'+X(gx)+'" y2="'+Y(ymax)+'" stroke="#eef" stroke-width="1"/>';
  for(var gy=Math.ceil(ymin);gy<=ymax;gy++)g+='<line x1="'+X(xmin)+'" y1="'+Y(gy)+'" x2="'+X(xmax)+'" y2="'+Y(gy)+'" stroke="#eef" stroke-width="1"/>';
  g+='<line x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
  g+='<line x1="'+X(0)+'" y1="'+Y(ymin)+'" x2="'+X(0)+'" y2="'+Y(ymax)+'" stroke="#555" stroke-width="1.3"/>';
  g+='<polygon points="'+X(xmax)+','+Y(0)+' '+(X(xmax)-5)+','+(+Y(0)-3)+' '+(X(xmax)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
  g+='<polygon points="'+X(0)+','+Y(ymax)+' '+(+X(0)-3)+','+(+Y(ymax)+5)+' '+(+X(0)+3)+','+(+Y(ymax)+5)+'" fill="#555"/>';
  g+='<text x="'+(X(xmax)-2)+'" y="'+(+Y(0)+11)+'" font-size="9" fill="#555">x</text><text x="'+(+X(0)+4)+'" y="'+(+Y(ymax)+8)+'" font-size="9" fill="#555">y</text>';
  (segs||[]).forEach(function(s){var a=pts[s[0]],b=pts[s[1]];g+='<line x1="'+X(a.x)+'" y1="'+Y(a.y)+'" x2="'+X(b.x)+'" y2="'+Y(b.y)+'" stroke="'+(s[2]||'#7B52EE')+'" stroke-width="2"/>';});
  pts.forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="'+(p.c||'#dc2626')+'"/><text x="'+(+X(p.x)+5)+'" y="'+(+Y(p.y)-4)+'" font-size="10" font-weight="700" fill="'+(p.c||'#b91c1c')+'">'+p.l+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="150" height="142">'+g+'</svg>';}
var PYT=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17]];
// 1. Дундаж цэг
function g_midpoint(){var A=[nz(-6,6),nz(-6,6)],B=[nz(-6,6),nz(-6,6)];var mx=A[0]+B[0],my=A[1]+B[1];
  return {q:'$A'+co(A)+',\\ B'+co(B)+'$ хэрчмийн дундаж цэг $M$-ийг ол.',
    a:'$M\\left(\\dfrac{x_1+x_2}{2};\\dfrac{y_1+y_2}{2}\\right)=\\left(\\dfrac{'+A[0]+sg(B[0])+'}{2};\\dfrac{'+A[1]+sg(B[1])+'}{2}\\right)=('+frTeX(mx,2)+';'+frTeX(my,2)+')$.',
    fig:plane([{x:A[0],y:A[1],l:'A'},{x:B[0],y:B[1],l:'B'},{x:mx/2,y:my/2,l:'M',c:'#16a34a'}],[[0,1]]),key:'m'+A+B};}
// 2. Хоёр цэгийн хоорондох зай
function g_distance(){var A=[nz(-5,3),nz(-5,3)],t=pick(PYT),sx=pick([1,-1]),sy=pick([1,-1]);var B=[A[0]+sx*t[0],A[1]+sy*t[1]];
  var dx=B[0]-A[0],dy=B[1]-A[1],d2=dx*dx+dy*dy;var bigfig=(t[2]<=13);
  return {q:'$A'+co(A)+',\\ B'+co(B)+'$ цэгүүдийн хоорондох зай $|AB|$-г ол.',
    a:'$|AB|=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}=\\sqrt{'+pmb(dx)+'^2+'+pmb(dy)+'^2}=\\sqrt{'+(dx*dx)+'+'+(dy*dy)+'}=\\sqrt{'+d2+'}='+t[2]+'$.',
    fig:bigfig?plane([{x:A[0],y:A[1],l:'A'},{x:B[0],y:B[1],l:'B'}],[[0,1]]):null,key:'d'+A+B};}
// 3. Дундаж цэгээс нөгөө үзүүр
function g_findB(){var A=[nz(-6,6),nz(-6,6)],M=[nz(-4,4),nz(-4,4)];var B=[2*M[0]-A[0],2*M[1]-A[1]];
  return {q:'$AB$ хэрчмийн дундаж цэг нь $M'+co(M)+'$, нэг үзүүр нь $A'+co(A)+'$ бол нөгөө үзүүр $B$-г ол.',
    a:'$M=\\dfrac{A+B}{2}\\Rightarrow B=2M-A=(2\\cdot'+pmb(M[0])+'-'+pmb(A[0])+';\\ 2\\cdot'+pmb(M[1])+'-'+pmb(A[1])+')='+co(B)+'$.',key:'fb'+A+M};}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р'];
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={};for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var P=[[],[],[]];var seen={};function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<5000){tr++;var f=gen(fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[idx].push(f);c++;}}
  fill(0,g_midpoint,6);fill(1,g_distance,6);fill(2,g_findB,6);return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,g3){var use=WK?arr.slice(0,cap):arr;return '<div class="grid'+(g3?' g3':'')+'">'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(WK?'<div class="wk"></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Дундаж цэг ба хэрчмийн урт</h1><div class="sub">$M\\left(\\dfrac{x_1+x_2}{2};\\dfrac{y_1+y_2}{2}\\right)$ · $|AB|=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$ · V бүлэг · 5.1 · 11-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule"><b>Санамж:</b> Хэрчмийн <b>дундаж цэг</b> $M\\left(\\dfrac{x_1+x_2}{2};\\dfrac{y_1+y_2}{2}\\right)$. Хоёр цэгийн хоорондох <b>зай</b> $|AB|=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$.</div>'
    +'<div class="task">1. Хэрчмийн дундаж цэгийг ол.</div>'+block(S[0],3,true)
    +'<div class="task">2. Хоёр цэгийн хоорондох зайг ол.</div>'+block(S[1],3,true)
    +'<div class="task">3. Дундаж цэг ба нэг үзүүрээр нөгөө үзүүрийг ол.</div>'+block(S[2],4)
    +'<div class="ans-page" id="answers"><h2>Хариу ба дэлгэрэнгүй бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Дундаж цэг ба хэрчмийн урт';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
