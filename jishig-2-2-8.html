<script>
/* 8-р анги · II бүлэг. Процент, харьцаа, пропорц — Жишиг даалгавар 2 (2.2 Масштаб, харьцаа · 2.3 Урвуу пропорционал хамаарал) */
function ok2(v) { return Math.abs(v * 100 - Math.round(v * 100)) < 1e-7; }
function nf(v) { return Math.abs(v - Math.round(v)) < 1e-9 ? th(Math.round(v)) : dFmt(Math.round(v * 1000), 3); }
function cop(a, b) { return a !== b && gcd(a, b) === 1; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// 1. [2.2 Харьцаа] Харьцааг хялбар хэлбэрт бичих: бүхэл тоо, нэгжтэй хэмжигдэхүүн, аравтын бутархай, энгийн бутархай
function g1() {
  var t = rnd(1, 4);
  if (t === 1) {
    var a = rnd(1, 9), b = rnd(2, 12), k = rnd(3, 15); if (!cop(a, b) || a * k > 150 || b * k > 150) return null;
    return { stem: '$' + (a * k) + ':' + (b * k) + '$', a: (a * k) + ':' + (b * k) + '=' + a + ':' + b };
  }
  if (t === 2) {
    // [том нэгж, бага нэгж, хувиргах тоо, бага утгын алхам]
    var U = pick([['м', 'см', 100, 5], ['кг', 'г', 1000, 50], ['цаг', 'минут', 60, 5], ['км', 'м', 1000, 50], ['л', 'мл', 1000, 50]]);
    var big = U[2] === 60 ? pick([1, 1.5, 2, 2.5, 3]) : pick([1, 1.2, 1.5, 2, 2.4, 2.5, 3, 0.6, 0.8, 0.4]), A = Math.round(big * U[2]), B = U[3] * rnd(1, U[2] === 60 ? 11 : 19);
    var g = gcd(A, B); if (A === B || A / g > 40 || B / g > 40) return null;
    return { stem: '$' + nf(big) + '$ ' + U[0] + ' $:$ $' + B + '$ ' + U[1], a: A + ':' + B + '=' + (A / g) + ':' + (B / g) };
  }
  if (t === 3) {
    var p = rnd(1, 9), q = rnd(2, 9), K = rnd(1, 9), sc = rnd(1, 2); if (!cop(p, q)) return null;
    var x = p * K, y = q * K; if (x % 10 === 0 && y % 10 === 0) return null;
    return { stem: '$' + dFmt(x, sc) + ':' + dFmt(y, sc) + '$', a: dFmt(x, sc) + ':' + dFmt(y, sc) + '=' + p + ':' + q };
  }
  var b1 = rnd(2, 9), d1 = rnd(2, 9), a1 = rnd(1, b1 - 1), c1 = rnd(1, d1 - 1);
  if (gcd(a1, b1) !== 1 || gcd(c1, d1) !== 1 || a1 * d1 === b1 * c1) return null;
  var L = lcm(b1, d1), P = a1 * L / b1, Q = c1 * L / d1, h = gcd(P, Q);       // хоёуланг ХБЕХ-оор үржүүлнэ
  return { stem: '$\\dfrac{' + a1 + '}{' + b1 + '}:\\dfrac{' + c1 + '}{' + d1 + '}$',
    a: '\\dfrac{' + a1 + '}{' + b1 + '}:\\dfrac{' + c1 + '}{' + d1 + '}=' + P + ':' + Q + (h > 1 ? '=' + (P / h) + ':' + (Q / h) : '') };
}

// 2. [2.2 Масштаб] Масштабыг олох, зураг дээрх ба бодит зайг хооронд нь шилжүүлэх, загварын масштаб, талбайн масштаб
function g2() {
  var t = rnd(1, 5);
  if (t === 1) {            // бодит км ба зураг дээрх см → масштаб
    var n = pick([20000, 25000, 50000, 100000, 200000, 250000, 500000, 1000000, 2000000, 5000000]), cm = pick([2, 3, 4, 5, 6, 8, 1.5, 2.5, 3.5, 4.5]);
    var rc = Math.round(cm * n), km = rc / 100000; if (!ok2(km)) return null;
    return { stem: 'Бодит $' + nf(km) + '$ км зайг газрын зураг дээр $' + nf(cm) + '$ см‑ээр дүрсэлжээ. Масштабыг ол.',
      a: '$' + nf(km) + '$ км $=' + th(rc) + '$ см; $\\ ' + th(rc) + '\\div ' + nf(cm) + '=' + th(n) + '$; масштаб $1:' + th(n) + '$' };
  }
  if (t === 2) {            // зураг дээрх см → бодит км
    var n2 = pick([10000, 20000, 25000, 50000, 100000, 200000, 500000, 1000000]), c2 = pick([2, 3, 4, 5, 6, 7, 8, 9, 12, 1.5, 2.5, 3.6, 4.5]);
    var r2 = Math.round(c2 * n2), k2 = r2 / 100000; if (!ok2(k2)) return null;
    return { stem: '$1:' + th(n2) + '$ масштабтай газрын зураг дээрх $' + nf(c2) + '$ см зай бодит байдалд хэдэн км вэ?',
      a: '$' + nf(c2) + '\\cdot ' + th(n2) + '=' + th(r2) + '$ см $=' + nf(k2) + '$ км' };
  }
  if (t === 3) {            // бодит м → план зураг дээрх см
    var n3 = pick([50, 100, 200, 250, 400, 500]), m3 = pick([3, 4, 5, 6, 8, 10, 12, 15, 18, 20, 24, 25, 30]), c3 = m3 * 100 / n3; if (!ok2(c3) || c3 < 1 || c3 > 30) return null;
    return { stem: '$1:' + n3 + '$ масштабтай план зураг дээр $' + m3 + '$ м урт ханыг хэдэн см‑ээр дүрслэх вэ?',
      a: '$' + m3 + '$ м $=' + th(m3 * 100) + '$ см; $\\ ' + th(m3 * 100) + '\\div ' + n3 + '=' + nf(c3) + '$ см' };
  }
  if (t === 4) {            // загварын масштаб (сурах бичгийн №33)
    var n4 = pick([50, 100, 200, 250, 500, 1000]), c4 = pick([4, 5, 6, 8, 10, 12, 15, 20, 25]), m4 = c4 * n4 / 100; if (!ok2(m4) || m4 > 300 || m4 === c4) return null;
    return { stem: '$' + nf(m4) + '$ м өндөр байшингийн загвар $' + c4 + '$ см өндөртэй. Загварын масштабыг ол.',
      a: '$' + nf(m4) + '$ м $=' + th(c4 * n4) + '$ см; $\\ ' + th(c4 * n4) + '\\div ' + c4 + '=' + th(n4) + '$; масштаб $1:' + th(n4) + '$' };
  }
  // талбай: уртын масштаб 1:n бол талбайнх 1:n² (сурах бичгийн №35)
  var n5 = pick([100, 200, 500, 1000]), s5 = pick([2, 3, 4, 5, 6, 8, 12, 15]), cm2 = s5 * n5 * n5;
  return { stem: '$1:' + n5 + '$ масштабтай план зураг дээр $' + s5 + '$ см$^2$ талбайтай дүрс бодит байдалд хэдэн м$^2$ талбайтай вэ?',
    a: '$' + s5 + '\\cdot ' + n5 + '^{2}=' + th(cm2) + '$ см$^2=' + nf(cm2 / 10000) + '$ м$^2$' };
}

// 3. [2.3 Урвуу пропорционал хамаарал] y = k/x: k-г олох, утга олох, хүснэгтийн дутуу утгыг нөхөх
// k тооны 1 ба k-аас ялгаатай, ex-ээс ялгаатай хуваагчдаас санамсаргүй нэгийг (≤ 30)
function dvr(k, ex) { var r = []; for (var d = 2; d < k && d <= 30; d++) if (k % d === 0 && d !== ex) r.push(d); return r.length ? pick(r) : null; }
function g3() {
  var t = rnd(1, 3);
  if (t === 1) {
    var x1 = rnd(2, 9), y1 = rnd(3, 20), k = x1 * y1, x2 = dvr(k, x1); if (!x2 || x1 === y1 || x2 === y1) return null;   // x, y-ийг сольсон төдий биш
    return { stem: '$y$ нь $x$-тэй урвуу пропорционал, $x=' + x1 + '$ үед $y=' + y1 + '$. $x=' + x2 + '$ үед $y$-ийг ол.',
      a: 'k=' + x1 + '\\cdot ' + y1 + '=' + k + ',\\ y=\\dfrac{' + k + '}{' + x2 + '}=' + (k / x2) };
  }
  if (t === 2) {
    var a = rnd(2, 9), b = rnd(2, 12), K = a * b, c = dvr(K, b); if (!c || c === a || a === b) return null;   // x, y-ийг сольсон төдий биш
    return { stem: '$y=\\dfrac{k}{x}$ хамааралд $x=' + a + '$ үед $y=' + b + '$. $k$-г олж, $y=' + c + '$ үед $x$-ийг ол.',
      a: 'k=' + K + ',\\ x=\\dfrac{' + K + '}{' + c + '}=' + (K / c) };
  }
  var k3 = pick([12, 24, 36, 48, 60, 72, 90, 120, 144, 180]), dv = [];
  for (var i = 1; i <= 20; i++) if (k3 % i === 0) dv.push(i);
  var xs = shuffle(dv).slice(0, 4).sort(function (p, q) { return p - q; });
  return { stem: '$x$, $y$ урвуу пропорционал. Хүснэгтийг нөх: $\\begin{array}{c|c|c|c|c}x&' + xs.join('&') + '\\\\\\hline y&' + (k3 / xs[0]) + '&?&?&?\\end{array}$',
    a: 'xy=' + k3 + ';\\ ' + xs.slice(1).map(function (x) { return k3 / x; }).join(',\\ ') };
}

// 4. Өгүүлбэртэй бодлого — 4 төрлийг ээлжлэн: ажил ба цорго (2.3) · харьцаагаар хуваах (2.2) · хурд, түлш (2.3) · план зураг, загвар (2.2)
// Ажилчид ба хоног, цорго ба цаг (сурах бичгийн №44, 45, 48, Өөрийгөө сорих №7)
function wWork() {
  var t = rnd(1, 3);
  if (t === 1) {
    var w = rnd(6, 15), d = rnd(10, 30), c = rnd(2, 4), d2 = w * d / (w - c); if (d2 !== Math.round(d2)) return null;
    return { stem: '$' + w + '$ хүнтэй баг ажлыг $' + d + '$ хоногт гүйцэтгэх ёстой байв. Хүний тоо $' + c + '$ хүнээр цөөрвөл ажлыг хэдэн хоногт гүйцэтгэх вэ?',
      a: '$' + w + '\\cdot ' + d + '=' + (w * d) + '$; $\\ ' + (w * d) + '\\div ' + (w - c) + '=' + d2 + '$ хоног' };
  }
  if (t === 2) {
    var w2 = rnd(4, 15), dd = rnd(10, 30), nd = rnd(Math.ceil(dd / 2), dd - 2), need = w2 * dd / nd; if (need !== Math.round(need) || need === w2) return null;
    return { stem: 'Төлөвлөгөөт ажлыг $' + w2 + '$ хүн $' + dd + '$ хоногт хийх ёстой. Ажлыг $' + nd + '$ хоногт дуусгахын тулд ижил бүтээмжтэй хэдэн хүн нэмж авах вэ?',
      a: '$' + w2 + '\\cdot ' + dd + '\\div ' + nd + '=' + need + '$ хүн; $\\ ' + need + '-' + w2 + '=' + (need - w2) + '$ хүн нэмнэ' };
  }
  var n1 = rnd(2, 9), t1 = pick([12, 18, 20, 24, 30, 36, 40, 48, 60]), t3 = pick([10, 12, 15, 18, 20, 24, 30, 36]); if (t3 === t1) return null;
  var n3 = n1 * t1 / t3; if (n3 !== Math.round(n3) || n3 === n1) return null;
  return { stem: '$' + n1 + '$ ижил цоргоор усан санг $' + t1 + '$ минутад дүүргэдэг. Уг санг $' + t3 + '$ минутад дүүргэхийн тулд ийм хэдэн цорго хэрэгтэй вэ?',
    a: '$' + n1 + '\\cdot ' + t1 + '=' + (n1 * t1) + '$; $\\ ' + (n1 * t1) + '\\div ' + t3 + '=' + n3 + '$ цорго' };
}
// Харьцаагаар хуваах: нийлбэр, ялгавар эсвэл нэг хэсэг нь өгөгдсөн (сурах бичгийн №14, 59, 61, 67)
function wRatio() {
  var t = rnd(1, 3);
  if (t === 1) {
    var a = rnd(1, 5), b = rnd(2, 6), c = rnd(3, 8); if (a === b || b === c || a === c || gcd(gcd(a, b), c) !== 1) return null;
    var u = pick([2, 3, 4, 5, 6, 8, 10, 12, 15]) * 1000, S = (a + b + c) * u;
    return { stem: 'Ах, эгч, дүү гурав $' + th(S) + '$ төгрөгийг $' + a + ':' + b + ':' + c + '$ харьцаагаар хуваан авчээ. Хүн бүр хэдэн төгрөг авсан бэ?',
      a: 'нэг хэсэг $' + th(S) + '\\div ' + (a + b + c) + '=' + th(u) + '$; $\\ ' + th(a * u) + '$, $' + th(b * u) + '$, $' + th(c * u) + '$ төгрөг' };
  }
  if (t === 2) {
    var p = rnd(3, 11), q = rnd(2, 9); if (p <= q || gcd(p, q) !== 1) return null;
    var k = rnd(4, 40), D = (p - q) * k;
    return { stem: 'Номын санд байгаа уран зохиолын ном ба сурах бичгийн тооны харьцаа $' + p + ':' + q + '$. Уран зохиолын ном сурах бичгээс $' + D + '$ ширхэгээр олон бол тус бүр хэдэн ширхэг вэ?',
      a: 'нэг хэсэг $' + D + '\\div ' + (p - q) + '=' + k + '$; уран зохиол $' + (p * k) + '$, сурах бичиг $' + (q * k) + '$' };
  }
  var X = pick([['цемент', 'элс', 'кг'], ['ус', 'сироп', 'мл'], ['гурил', 'элсэн чихэр', 'г'], ['хөх будаг', 'шар будаг', 'мл']]), m = rnd(2, 5), n = rnd(2, 7); if (!cop(m, n)) return null;
  var kk = pick([5, 6, 8, 10, 12, 15, 20, 25, 30, 40]), given = rnd(0, 1);
  var gv = given ? n * kk : m * kk, ans = given ? m * kk : n * kk, gName = given ? X[1] : X[0], aName = given ? X[0] : X[1];
  return { stem: 'Хольцод ' + X[0] + ', ' + X[1] + ' хоёрыг $' + m + ':' + n + '$ харьцаагаар хийнэ. ' + cap(gName) + ' $' + gv + '$ ' + X[2] + ' хэрэглэвэл ' + aName + ' хэдэн ' + X[2] + ' хийх вэ?',
    a: 'нэг хэсэг $' + gv + '\\div ' + (given ? n : m) + '=' + kk + '$; $\\ ' + kk + '\\cdot ' + (given ? m : n) + '=' + ans + '$ ' + X[2] };
}
// Хурд ба хугацаа, түлшний зарцуулалт (сурах бичгийн №41, 46, 47, 71)
function wSpeed() {
  var t = rnd(1, 3);
  if (t === 1) {
    var D = pick([120, 180, 240, 300, 360, 420, 480, 600, 720]), v = pick([40, 50, 60, 80, 90]); if (D % v) return null;
    var h = D / v, k = rnd(1, 3); if (h - k < 2 || D % (h - k)) return null;
    var v2 = D / (h - k); if (v2 > 120) return null;
    return { stem: '$' + D + '$ км замыг $' + v + '$ км/ц хурдтай явахад $' + h + '$ цаг зарцуулна. Хугацааг $' + k + '$ цагаар багасгахын тулд хурдыг хэд болгох вэ?',
      a: '$' + D + '\\div ' + (h - k) + '=' + v2 + '$ км/ц' };
  }
  if (t === 2) {
    var tt = pick([4, 6, 8, 9, 10, 12, 15]), f = pick([1.5, 2, 3, 2.5, 4]), up = rnd(0, 1), t2 = up ? tt / f : tt * f;
    if (!ok2(t2) || t2 !== Math.round(t2 * 2) / 2 || (!up && (f > 2 || tt > 8))) return null;
    return { stem: 'Дугуйчин тодорхой зайг $' + tt + '$ цагт туулав. Хурдаа $' + nf(f) + '$ дахин ' + (up ? 'ихэсгэвэл' : 'багасгавал') + ' уг зайг хэдэн цагт туулах вэ?',
      a: 'зам тогтмол тул хугацаа $' + nf(f) + '$ дахин ' + (up ? 'багасна' : 'ихэснэ') + ': $' + nf(t2) + '$ цаг' };
  }
  var a1 = pick([6, 7.5, 8, 9, 10, 12]), b1 = pick([9, 10, 12, 12.5, 15, 18, 20]), D1 = pick([180, 240, 300, 360, 450, 600]); if (b1 <= a1) return null;
  var fuel = D1 * a1 / 100, D2 = fuel * 100 / b1; if (!ok2(fuel) || D2 !== Math.round(D2)) return null;
  return { stem: '$100$ км замд $' + nf(a1) + '$ л түлш зарцуулдаг машин $' + D1 + '$ км явжээ. $100$ км замд $' + nf(b1) + '$ л түлш зарцуулдаг машин ийм хэмжээний түлшээр хэдэн км явах вэ?',
    a: 'түлш $' + D1 + '\\cdot\\dfrac{' + nf(a1) + '}{100}=' + nf(fuel) + '$ л; $\\ ' + nf(fuel) + '\\cdot\\dfrac{100}{' + nf(b1) + '}=' + D2 + '$ км' };
}
// План зураг ба загвар (сурах бичгийн №33, 35)
function wPlan() {
  if (rnd(0, 1)) {
    var n = pick([100, 200, 250, 400, 500]), a = pick([2, 2.5, 3, 4, 5, 6, 8]), b = pick([1.5, 2, 2.5, 3, 4]); if (b >= a) return null;
    var A = a * n / 100, B = b * n / 100, S = A * B; if (!ok2(A) || !ok2(B) || !ok2(S)) return null;
    return { stem: '$1:' + n + '$ масштабтай план зураг дээр байшингийн урт, өргөнийг $' + nf(a) + '$ см ба $' + nf(b) + '$ см‑ээр зуржээ. Байшингийн бодит урт, өргөн ба суурийн талбайг ол.',
      a: 'урт $' + nf(A) + '$ м, өргөн $' + nf(B) + '$ м; талбай $' + nf(S) + '$ м$^2$' };
  }
  var T = pick([[300, 6], [450, 9], [250, 5], [400, 8], [360, 12], [240, 8], [320, 8], [280, 14], [150, 6], [330, 11], [540, 18]]), H = T[0], hc = T[1], sc = H * 100 / hc, pm = pick([50, 60, 75, 90, 100, 120, 150, 200]);
  if (pm >= H) return null;
  var mc = pm * 100 / sc; if (!ok2(mc)) return null;
  return { stem: '$' + H + '$ м өндөр цамхгийн загвар $' + hc + '$ см өндөртэй. Загварын масштабыг олж, бодит $' + pm + '$ м өндөрт байгаа тавцан загвар дээр хэдэн см өндөрт байхыг ол.',
    a: 'масштаб $1:' + th(sc) + '$; $\\ ' + th(pm * 100) + '\\div ' + th(sc) + '=' + nf(mc) + '$ см' };
}
var K4 = 0;
function g4() {
  var r = [wWork, wRatio, wSpeed, wPlan][K4 % 4]();
  if (r) K4++;
  return r;
}

CMX.jishig({
  title: 'II бүлэг — Жишиг даалгавар 2',
  sub: 'Харьцаа · масштаб · урвуу пропорционал хамаарал',
  grade: '8-р анги',
  rule: '$a:b=ka:kb$ &nbsp;·&nbsp; Масштаб $1:n$: бодит хэмжээ $=$ зураг дээрх хэмжээ $\\cdot\\, n$, талбайнх $n^{2}$ дахин &nbsp;·&nbsp; Урвуу пропорционал: $y=\\dfrac{k}{x}$, $\\ x_1y_1=x_2y_2$',
  tasks: [
    { label: 'Харьцааг хялбар хэлбэрт бич.', gen: g1, n: 12, nw: 4, cols: 4, wk: 12 },
    { label: 'Масштабыг ашиглан ол.', gen: g2, n: 8, nw: 4, cols: 2, wk: 14 },
    { label: 'Урвуу пропорционал хамаарлыг ашиглан ол.', gen: g3, n: 8, nw: 4, cols: 2, wk: 14 },
    { label: 'Бодлогыг бод.', gen: g4, n: 6, nw: 2, cols: 2, wk: 22 }
  ]
});
</script>
