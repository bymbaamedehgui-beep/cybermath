<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЭЕШ 1000 бодлого-6</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/e1k.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* ЭЕШ 1000 бодлого-6 — ЭЕШ-ийн 1000 бодлого, 2-р хэсэг (26–50-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 26. Телескоп үржвэр (эх: (1 − 1/2²)(1 − 1/3²)⋯(1 − 1/8²) = 9/16).
//     ∏_{k=s}^{N}(1 − 1/k²) = (s − 1)(N + 1)/(sN);  ∏_{k=s}^{N}(1 − 1/k) = (s − 1)/N;  ∏_{k=s}^{N}(1 + 1/k) = (N + 1)/s.
function p26() {
  var kind = pick(['Q', 'Q', 'Q', 'Q', 'M', 'P']), s = kind === 'Q' ? pick([2, 2, 2, 3, 4]) : pick([2, 2, 3]), N = rnd(s + 4, 20), num, den;
  var sg = kind === 'P' ? '+' : '-', sq = kind === 'Q' ? '^2' : '';
  var F = function (k) { return '\\left(1' + sg + '\\dfrac{1}{' + k + sq + '}\\right)'; };
  if (kind === 'Q') { num = (s - 1) * (N + 1); den = s * N; }
  else if (kind === 'M') { num = s - 1; den = N; }
  else { num = N + 1; den = s; }
  return {
    q: '$' + F(s) + F(s + 1) + '\\cdot\\ldots\\cdot' + F(N) + '$ үржвэрийн утгыг олоорой.',
    a: '$' + fr(num, den) + '$', wk: 22, t: { kind: kind, s: s, N: N }
  };
}

// 27. Ax + By + Cz + D = 0 хавтгайн нормал вектор n = (A; B; C) (эх: 2x + y − z + 1 = 0 → (2; 1; −1)).
//     Коэффициентүүд ерөнхий хуваагчгүй (хариу цор ганц хэлбэртэй); заримдаа нэг коэффициент нь 0.
function p27() {
  var A = nz(-6, 6), B = nz(-6, 6), C = nz(-6, 6), D = rnd(-9, 9), z = rnd(0, 8), lhs = '';
  if (z === 0) A = 0; else if (z === 1) B = 0; else if (z === 2) C = 0;
  if (gcd(gcd(A, B), C) !== 1) return null;
  if ((A || B) < 0 && rnd(0, 3)) { A = -A; B = -B; C = -C; D = -D; }   // ихэвчлэн эхний коэффициент эерэг (эх шиг)
  [A, B, C].forEach(function (c, i) { lhs += tm(c, 'xyz'[i], lhs === ''); });
  return {
    q: '$' + lhs + (D ? sgn(D) : '') + '=0$ хавтгайн нормал векторыг ол.',
    a: '$\\vec n=' + pt(A, B, C) + '$', wk: 16, t: { A: A, B: B, C: C, D: D }
  };
}

// 28. (x − x₀)/p = (y − y₀)/q = (z − z₀)/r шулууны чиглүүлэгч вектор s = (p; q; r) (эх: (x−1)/2 = (y+1)/3 = (z−2)/(−1) → (2; 3; −1)).
//     Хуваарь +1 гаргахгүй (x/1 хэлбэрээс зайлсхийнэ), −1 болно; p, q, r ерөнхий хуваагчгүй.
var p28_S = [-5, -4, -3, -2, -1, 2, 3, 4, 5, 2, 3, 4];
function p28() {
  var P = [rnd(-6, 6), rnd(-6, 6), rnd(-6, 6)], d = [pick(p28_S), pick(p28_S), pick(p28_S)];
  if (gcd(gcd(d[0], d[1]), d[2]) !== 1 || (!P[0] && !P[1] && !P[2])) return null;
  var q = ['x', 'y', 'z'].map(function (v, i) { return '\\dfrac{' + v + (P[i] ? sgn(-P[i]) : '') + '}{' + d[i] + '}'; }).join('=');
  return { q: '$' + q + '$ шулууны чиглүүлэгч векторыг ол.', a: '$\\vec s=' + pt(d[0], d[1], d[2]) + '$', wk: 16, t: { P: P, d: d } };
}

// 29. Хоёр шулууны хоорондох өнцөг: cos φ = |u·v|/(|u||v|), u, v — чиглүүлэгч векторууд (каноник тэгшитгэлийн хуваарь)
//     (эх: (x−2)/1 = y/1 = (z+√2)/(−2), x/2 = (y+1)/2 = (z+1/2)/(−4) → чиглэлүүд параллель, 0°).
//     Хуваарь ∈ {−5..5} \ {0, 1} (тэг ба +1 хуваарь гаргахгүй); өнцөг 90°, 60°, 45°, 30° эсвэл 0° (параллель, ялгаатай шулуунууд).
//     30°-аас бусад өнцөгт |координат| ≤ 4. Зарим цэгийн координат эх шиг √2, √3 эсвэл бутархай.
var p29_L = null;
function p29_init() {
  var S = [-5, -4, -3, -2, -1, 2, 3, 4, 5], V = [], L = { 0: [], 30: [], 45: [], 60: [], 90: [] }, i, j;
  S.forEach(function (a) { S.forEach(function (b) { S.forEach(function (c) { V.push([a, b, c]); }); }); });
  var mx = function (w) { return Math.max(Math.abs(w[0]), Math.abs(w[1]), Math.abs(w[2])); };
  for (i = 0; i < V.length; i++) {
    var u = V[i];
    if (gcd(gcd(u[0], u[1]), u[2]) !== 1) continue;
    var nu = u[0] * u[0] + u[1] * u[1] + u[2] * u[2], mu = mx(u);
    for (j = 0; j < V.length; j++) {
      var v = V[j], d = u[0] * v[0] + u[1] * v[1] + u[2] * v[2], nv = v[0] * v[0] + v[1] * v[1] + v[2] * v[2], key;
      var cx = u[1] * v[2] - u[2] * v[1], cy = u[2] * v[0] - u[0] * v[2], cz = u[0] * v[1] - u[1] * v[0];
      if (!cx && !cy && !cz) key = 0;
      else if (!d) key = 90;
      else if (4 * d * d === nu * nv) key = 60;
      else if (2 * d * d === nu * nv) key = 45;
      else if (4 * d * d === 3 * nu * nv) key = 30;
      else continue;
      if (key !== 30 && Math.max(mu, mx(v)) > 4) continue;
      L[key].push([u, v]);
    }
  }
  return L;
}
function p29_c(v) {                          // координат: { tex: тоологчийн бичиг, val: утга }
  var r = rnd(0, 11), s = pick([1, -1]);
  if (r === 0) { var k = pick([2, 3]); return { tex: v + (s > 0 ? '+' : '-') + '\\sqrt{' + k + '}', val: -s * Math.sqrt(k) }; }
  if (r === 1) { var n = pick([1, 1, 3]); return { tex: v + (s > 0 ? '+' : '-') + '\\frac{' + n + '}{2}', val: -s * n / 2 }; }
  var c = rnd(-5, 5);
  return { tex: v + (c ? sgn(-c) : ''), val: c };
}
function p29() {
  if (!p29_L) p29_L = p29_init();
  var ang = pick([90, 90, 60, 60, 45, 45, 30, 30, 0]), pr = pick(p29_L[ang]), u = pr[0], v = pr[1];
  if (rnd(0, 1)) { var w = u; u = v; v = w; }
  if (rnd(0, 1) && v.indexOf(-1) < 0) v = v.map(function (x) { return -x; });
  var P = [], Q = [], i;
  for (i = 0; i < 3; i++) { P.push(p29_c('xyz'[i])); Q.push(p29_c('xyz'[i])); }
  if (ang === 0) {                           // параллель шулуунууд давхцахгүй
    var dw = [Q[0].val - P[0].val, Q[1].val - P[1].val, Q[2].val - P[2].val];
    var cr = [dw[1] * u[2] - dw[2] * u[1], dw[2] * u[0] - dw[0] * u[2], dw[0] * u[1] - dw[1] * u[0]];
    if (Math.abs(cr[0]) + Math.abs(cr[1]) + Math.abs(cr[2]) < 1e-9) return null;
  }
  var line = function (C, d) { return [0, 1, 2].map(function (k) { return '\\dfrac{' + C[k].tex + '}{' + d[k] + '}'; }).join('='); };
  return {
    q: '$' + line(P, u) + ',\\ ' + line(Q, v) + '$ шулуунуудын хооронд үүсэх өнцгийг ол.',
    a: ang ? '$' + ang + '^\\circ$' : '$0^\\circ$ (шулуунууд параллель)', wk: 24, t: { u: u, v: v }
  };
}

// 30. Огторгуйн хоёр цэгийн хоорондох зай |AB| = √(Δx² + Δy² + Δz²) (эх: A(1, −2, 4), B(1, 1, 0) → 5).
//     Ихэвчлэн Пифагорын дөрвөлөөс (бүхэл хариу), заримдаа хялбарчилсан язгуур хариу.
var p30_Q = [[1, 2, 2], [2, 3, 6], [1, 4, 8], [4, 4, 7], [2, 6, 9], [6, 6, 7], [0, 3, 4], [0, 5, 12], [0, 6, 8], [2, 4, 4],
  [3, 4, 12], [2, 5, 14], [2, 10, 11], [0, 8, 6], [3, 6, 6], [0, 4, 3], [1, 8, 4], [4, 8, 8]];
function p30() {
  var D;
  if (rnd(0, 4)) D = shuffle(pick(p30_Q)).map(function (x) { return rnd(0, 1) ? -x : x; });
  else {
    D = [rnd(-5, 5), rnd(-5, 5), rnd(-5, 5)];
    var s2 = D[0] * D[0] + D[1] * D[1] + D[2] * D[2], r = Math.round(Math.sqrt(s2));
    if (r * r === s2 || s2 < 5) return null;              // язгуур хувилбар: бүхэл биш
  }
  var A = [rnd(-6, 6), rnd(-6, 6), rnd(-6, 6)], B = [A[0] + D[0], A[1] + D[1], A[2] + D[2]];
  if (B.some(function (x) { return Math.abs(x) > 12; })) return null;
  var L = surd(D[0] * D[0] + D[1] * D[1] + D[2] * D[2]);
  return {
    q: '$A(' + A.join(',\\,') + '),\\ B(' + B.join(',\\,') + ')$ цэгүүдийн хоорондох зайг ол.',
    a: '$|AB|=' + L.tex + '$', wk: 18, t: { A: A, B: B }
  };
}

// 31. Параллель шулуунууд: чиглүүлэгч векторууд коллинеар d₂ = λ·d₁ → үл мэдэгдэх хуваарь a = λ·d₁[i]
//     (эх: (x+3)/2 = (y−1)/4 = z/3 ба (x−3)/1 = (y+1)/2 = z/a → λ = 1/2, a = 3/2).
//     Хуваарь 0 ба +1 гаргахгүй; шулуунууд давхцахгүй.
var p31_S = [-5, -4, -3, -2, -1, 2, 3, 4, 5, 6, 2, 4, 6];
var p31_LAM = [[1, 2], [1, 2], [2, 1], [3, 1], [1, 3], [-1, 2], [-2, 1], [3, 2], [2, 3], [-1, 1], [-3, 2], [-1, 3], [-3, 1]];
function p31_line(P, d) {
  return [0, 1, 2].map(function (i) { return '\\dfrac{' + 'xyz'[i] + (P[i] ? sgn(-P[i]) : '') + '}{' + d[i] + '}'; }).join('=');
}
function p31() {
  var lam = pick(p31_LAM), pos = rnd(0, 3) ? 2 : rnd(0, 1), d1 = [pick(p31_S), pick(p31_S), pick(p31_S)], d2 = [], i;
  for (i = 0; i < 3; i++) {
    if (i === pos) { d2.push('a'); continue; }
    if ((d1[i] * lam[0]) % lam[1]) return null;
    var v = d1[i] * lam[0] / lam[1];
    if (v === 1 || Math.abs(v) > 9) return null;
    d2.push(v);
  }
  var P = [rnd(-5, 5), rnd(-5, 5), rnd(-5, 5)], Q = [rnd(-5, 5), rnd(-5, 5), rnd(-5, 5)];
  var w = [Q[0] - P[0], Q[1] - P[1], Q[2] - P[2]];
  if (!(w[1] * d1[2] - w[2] * d1[1]) && !(w[2] * d1[0] - w[0] * d1[2]) && !(w[0] * d1[1] - w[1] * d1[0])) return null;   // давхцах
  return {
    q: '$' + p31_line(P, d1) + '$ болон $' + p31_line(Q, d2) + '$ шулуунууд параллель бол $a$ тоог ол.',
    a: '$a=' + fr(d1[pos] * lam[0], lam[1]) + '$', wk: 22, t: { d1: d1, pos: pos }
  };
}

// 32. Шулуун ба хавтгай: s = (p; q; a), n = (A; B; C).
//     [ЗАС] эхийн нөхцөл боломжгүй ((1; 2; a) ∥ (3; −2; 2) байж чадахгүй) → нийцтэй хоёр хувилбар:
//     П: перпендикуляр ⇔ s ∥ n (s = λn) → a = λ·n[i];  Л: параллель ⇔ s·n = 0 → a = −(бусад гишүүд)/n[i], шулууны цэг хавтгай дээр биш.
//     Хуваарь 0 ба +1 гаргахгүй.
var p32_S = [-4, -3, -2, -1, 2, 3, 4, 5, 2, 3];
var p32_LAM = [[1, 2], [2, 1], [1, 1], [-1, 1], [3, 1], [1, 3], [-2, 1], [3, 2], [-1, 2]];
function p32_lin(c) {                        // Ax + By + Cz
  var s = '';
  c.forEach(function (k, i) { s += tm(k, 'xyz'[i], s === ''); });
  return s;
}
function p32() {
  var perp = rnd(0, 1) === 1, pos = rnd(0, 3) ? 2 : rnd(0, 1), N = [nz(-5, 5), nz(-5, 5), nz(-5, 5)], D = rnd(-9, 9), d = [], i, an, ad;
  if (gcd(gcd(N[0], N[1]), N[2]) !== 1) return null;
  if (N[0] < 0 && rnd(0, 3)) { N = N.map(function (x) { return -x; }); D = -D; }
  if (perp) {
    var lam = pick(p32_LAM);
    for (i = 0; i < 3; i++) {
      if (i === pos) { d.push('a'); continue; }
      if ((N[i] * lam[0]) % lam[1]) return null;
      d.push(N[i] * lam[0] / lam[1]);
    }
    an = N[pos] * lam[0]; ad = lam[1];
  } else {
    var sm = 0;
    for (i = 0; i < 3; i++) { if (i === pos) { d.push('a'); continue; } var v = pick(p32_S); d.push(v); sm += v * N[i]; }
    an = -sm; ad = N[pos];
    var gg = gcd(an, ad); if (!an || Math.abs(ad / gg) > 5 || Math.abs(an / ad) > 10) return null;
  }
  if (d.some(function (x) { return x === 1 || x === 0 || Math.abs(x) > 9; })) return null;
  var P = [rnd(-4, 5), rnd(-4, 5), rnd(-4, 5)];
  if (!perp && N[0] * P[0] + N[1] * P[1] + N[2] * P[2] + D === 0) return null;   // шулуун хавтгай дээр оршихгүй
  var line = [0, 1, 2].map(function (k) { return '\\dfrac{' + 'xyz'[k] + (P[k] ? sgn(-P[k]) : '') + '}{' + d[k] + '}'; }).join('=');
  return {
    q: '$' + line + '$ шулуун $' + p32_lin(N) + (D ? sgn(D) : '') + '=0$ хавтгайтай ' + (perp ? 'перпендикуляр' : 'параллель') + ' бол $a=?$',
    a: '$a=' + fr(an, ad) + '$', wk: 22, t: { N: N, D: D, perp: perp }
  };
}

// 33. Цэгээс хавтгай хүртэлх зай d = |Ax₀ + By₀ + Cz₀ + D| / √(A² + B² + C²)
//     (эх: A(1, 1, 1), x + y + z − 4 = 0 → 1/√3 = √3/3). Ихэвчлэн |n| бүхэл (1,2,2), (2,3,6) …; заримдаа √3, √2 (хуваарийг иррационалгүй болгоно).
var p33_N = [[1, 2, 2], [1, 2, 2], [2, 3, 6], [1, 4, 8], [4, 4, 7], [2, 6, 9], [0, 3, 4], [0, 3, 4], [0, 5, 12], [1, 1, 1], [1, 1, 1], [0, 1, 1]];
function p33() {
  var N = shuffle(pick(p33_N)).map(function (x) { return rnd(0, 2) ? x : -x; }), D = rnd(-12, 12), P = [rnd(-5, 5), rnd(-5, 5), rnd(-5, 5)], pl = '';
  if ((N[0] || N[1]) < 0 && rnd(0, 3)) N = N.map(function (x) { return -x; });
  var m2 = N[0] * N[0] + N[1] * N[1] + N[2] * N[2], L = Math.round(Math.sqrt(m2)), num = Math.abs(N[0] * P[0] + N[1] * P[1] + N[2] * P[2] + D), ans;
  if (!num || num > 40) return null;
  if (L * L === m2) { if (num / L > 9) return null; ans = fr(num, L); }
  else {                                     // num/√m = num√m/m
    var g = gcd(num, m2), k = num / g, dd = m2 / g;
    if (k > 12) return null;
    ans = dd === 1 ? rt(k, m2) : '\\dfrac{' + rt(k, m2) + '}{' + dd + '}';
  }
  N.forEach(function (c, i) { pl += tm(c, 'xyz'[i], pl === ''); });
  return {
    q: '$A(' + P.join(',\\,') + ')$ цэгээс $' + pl + (D ? sgn(D) : '') + '=0$ хавтгай хүртэлх зайг ол.',
    a: '$d=' + ans + '$', wk: 20, t: { N: N, D: D, P: P }
  };
}

// 34. AB ба CD шулуунуудын хоорондох өнцөг: cos φ = |AB·CD| / (|AB|·|CD|)
//     (эх: A(1,1,3), B(2,2,1), C(2,−1,1), D(3,−1,0) → AB = (1,1,−2), CD = (1,0,−1), cos φ = √3/2 → 30°).
//     [ЗАС] эхэд A үсэг дутуу → «A(…), B(…), C(…), D(…)». Өнцөг 30°, 45°, 60°, 90° (координатын зөрөө −3..3).
var p34_L = null;
function p34_init() {
  var S = [-3, -2, -1, 0, 1, 2, 3], V = [], L = { 30: [], 45: [], 60: [], 90: [] }, i, j;
  S.forEach(function (a) { S.forEach(function (b) { S.forEach(function (c) { if (a || b || c) V.push([a, b, c]); }); }); });
  for (i = 0; i < V.length; i++) for (j = 0; j < V.length; j++) {
    var u = V[i], v = V[j], d = u[0] * v[0] + u[1] * v[1] + u[2] * v[2], nu = u[0] * u[0] + u[1] * u[1] + u[2] * u[2], nv = v[0] * v[0] + v[1] * v[1] + v[2] * v[2], key;
    if (!(u[1] * v[2] - u[2] * v[1]) && !(u[2] * v[0] - u[0] * v[2]) && !(u[0] * v[1] - u[1] * v[0])) continue;   // параллель биш
    if (!d) key = 90; else if (4 * d * d === nu * nv) key = 60; else if (2 * d * d === nu * nv) key = 45; else if (4 * d * d === 3 * nu * nv) key = 30; else continue;
    L[key].push([u, v]);
  }
  return L;
}
function p34() {
  if (!p34_L) p34_L = p34_init();
  var ang = pick([30, 30, 45, 45, 60, 60, 90]), pr = pick(p34_L[ang]), u = pr[0], v = pr[1];
  var A = [rnd(-4, 5), rnd(-4, 5), rnd(-4, 5)], C = [rnd(-4, 5), rnd(-4, 5), rnd(-4, 5)];
  var B = [A[0] + u[0], A[1] + u[1], A[2] + u[2]], D = [C[0] + v[0], C[1] + v[1], C[2] + v[2]];
  if (A.join() === C.join() || B.join() === D.join() || A.join() === D.join() || B.join() === C.join()) return null;
  var P = function (nm, X) { return nm + '(' + X.join(',\\,') + ')'; };
  return {
    q: '$' + P('A', A) + ',\\ ' + P('B', B) + ',\\ ' + P('C', C) + ',\\ ' + P('D', D) + '$ байвал $AB,\\ CD$ шулуунуудын хоорондох өнцгийг ол.',
    a: '$' + ang + '^\\circ$', wk: 24, t: { A: A, B: B, C: C, D: D }
  };
}

// 35. Шулуун ба координатын хавтгайн огтлолцол: (x − x₀)/p = (y − y₀)/q = (z − z₀)/r = t; Oxy: z = 0 → t = −z₀/r
//     (эх: (x−1)/1 = (y+1)/1 = (z−1)/2, Oxy → (1/2; −3/2; 0)). Хавтгай Oxy (ихэвчлэн), Oxz, Oyz; хуваарь 0 ба +1 гаргахгүй.
var p35_S = [-4, -3, -2, -1, 2, 3, 4, 2, 2, 3];
function p35() {
  var k = pick([2, 2, 2, 1, 0]), P = [rnd(-6, 6), rnd(-6, 6), rnd(-6, 6)], d = [pick(p35_S), pick(p35_S), pick(p35_S)];
  if (!P[k] || gcd(gcd(d[0], d[1]), d[2]) !== 1) return null;

  };
}

// 44. y = (ax² + bx + c)ⁿ ⇒ y' = n(ax² + bx + c)ⁿ⁻¹·(2ax + b) ⇒ y'(0) = n·b·cⁿ⁻¹.
//     Их бол зэргийн хэлбэрээр үлдээнэ (эх: (5x² − x + 5)³⁰ → −30·5²⁹).
function p44() {
  var a = nz(-9, 9), b = nz(-9, 9), c = pick([2, 2, 3, 3, 4, 5, 5, 6, 7, 1]), n = rnd(0, 5) ? rnd(6, 40) : pick([50, 60, 100]);
  var K = n * b, P = Math.pow(c, n - 1);
  var v = c === 1 || Math.abs(K * P) < 1e5 ? String(K * P) : K + '\\cdot ' + c + '^{' + (n - 1) + '}';
  return {
    q: '$y=(' + poly([a, b, c]) + ')^{' + n + "}$ бол $y'(0)=?$",
    a: "$y'(0)=" + v + '$',
    wk: 20,
    t: { a: a, b: b, c: c, n: n }
  };
}

// 45. y = (ax² + bx + c)·e^{kx} ⇒ y' = (2ax + b + k(ax² + bx + c))·e^{kx}:
//     y'(0) = b + kc;  y'(1) = (2a + b + k(a + b + c))·e^k  (эх: (x² − 5x + 6)eˣ, y'(0) = 1).
function p45() {
  var a = pick([1, 1, 1, 2, -1, 3]), b = nz(-9, 9), c = nz(-9, 9), x0 = rnd(0, 3) ? 0 : 1, k = x0 ? pick([1, 1, 2, -1]) : pick([1, 1, 1, 2, 3, -1, -2]), M, v;
  if (!x0) { M = b + k * c; v = String(M); }
  else {
    M = 2 * a + b + k * (a + b + c);
    v = k === -1 ? (M < 0 ? '-' : '') + '\\dfrac{' + Math.abs(M) + '}{e}' : tm(M, k === 1 ? 'e' : 'e^{' + k + '}', true);
  }
  if (!M || Math.abs(M) > 40) return null;
  return {
    q: '$y=(' + poly([a, b, c]) + ')e^{' + tm(k, 'x', true) + "}$ бол $y'(" + x0 + ')=?$',
    a: "$y'(" + x0 + ')=' + v + '$',
    wk: 20,
    t: { a: a, b: b, c: c, k: k }
  };
}

// 46. y = p·sin x/(a + b·cos x) ⇒ y' = p(a·cos x + b)/(a + b·cos x)²:  y'(0) = p/(a + b),  y'(π/2) = pb/a²;
//     y = p·cos x/(a + b·sin x) ⇒ y' = −p(a·sin x + b)/(a + b·sin x)²:  y'(0) = −pb/a²,  y'(π/2) = −p/(a + b).
//     (эх: sin x/(1 + cos x), y'(0) = 1/2)
function p46() {
  var S = rnd(0, 2) > 0, p = pick([1, 1, 1, 1, 2, 3]), a = rnd(1, 5), b = pick([1, 1, 1, 2, -1, -1, 3, -2]), h = rnd(0, 3) === 0, n, d;   // h: x₀ = π/2
  if (a + b === 0) return null;
  if (S) { if (h) { n = p * b; d = a * a; } else { n = p; d = a + b; } }
  else { if (h) { n = -p; d = a + b; } else { n = -p * b; d = a * a; } }
  if (Math.abs(d) / gcd(n, d) > 36) return null;
  var yp = h ? "y'\\left(\\dfrac{\\pi}{2}\\right)" : "y'(0)";
  return {
    q: '$y=\\dfrac{' + tm(p, S ? '\\sin x' : '\\cos x', true) + '}{' + a + tm(b, S ? '\\cos x' : '\\sin x') + '}$ бол $' + yp + '=?$',
    a: '$' + yp + '=' + fr(n, d) + '$',
    wk: 22,
    t: { S: S, p: p, a: a, b: b }
  };
}

// 47. y = (ax + b)/(cx + d) ⇒ y' = (ad − bc)/(cx + d)²  (эх: (x − 1)/(x + 1), y'(1) = 1/2).
function p47() {
  var a = pick([1, 1, 1, 2, 3, -1, -2]), b = nz(-9, 9), c = pick([1, 1, 1, 2, 3]), d = nz(-9, 9), x0 = rnd(-2, 3);
  if ((a < 0 && b < 0) || gcd(a, b) > 1 || gcd(c, d) > 1) return null;   // хүртвэр, хуваарь ерөнхий үржигдэхүүнгүй
  var det = a * d - b * c, den = c * x0 + d;
  if (!det || !den || Math.abs(den) > 6) return null;
  return {
    q: '$y=\\dfrac{' + (a > 0 ? poly([a, b]) : b + tm(a, 'x')) + '}{' + poly([c, d]) + "}$ бол $y'(" + x0 + ')=?$',
    a: "$y'(" + x0 + ')=' + fr(det, den * den) + '$',
    wk: 20,
    t: { a: a, b: b, c: c, d: d }
  };
}

// 48. ∫(p·sin(ax + b) + q·cos(ax + b))dx = −(p/a)·cos(ax + b) + (q/a)·sin(ax + b) + C
//     (эх: ∫(sin(2x + 1) − cos(2x + 1))dx = −½cos(2x + 1) − ½sin(2x + 1) + C). Заримдаа cos гишүүн эхэнд.
function p48() {
  var a = pick([2, 2, 3, 3, 4, 5, -2, -3]), b = a > 0 ? nz(-5, 5) : rnd(1, 5), p = pick([1, 1, 1, -1, 2, -2, 3, 4]), q = pick([1, -1, -1, 2, -2, 3, -3, 4]);
  if (gcd(a, b) > 1) return null;                                       // 3x + 3 г.м. ерөнхий үржигдэхүүнгүй
  var u = a > 0 ? poly([a, b]) : b + tm(a, 'x'), S = '\\sin(' + u + ')', Co = '\\cos(' + u + ')';
  var T = [{ c: p, f: S, F: [-p, a], G: Co }, { c: q, f: Co, F: [q, a], G: S }];
  if (rnd(0, 3) === 0) T.reverse();
  return {
    q: '$\\displaystyle\\int\\left(' + tm(T[0].c, T[0].f, true) + tm(T[1].c, T[1].f) + '\\right)dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm(T[0].F, T[0].G, true) + tm(T[1].F, T[1].G) + '+C$',
    wk: 24,
    t: { a: a, b: b, p: p, q: q }
  };
}

// 49. ∫ k/(α + βx) dx = (k/β)·ln|α + βx| + C  (эх: ∫ 1/(1 − 3x) dx = −(1/3)·ln|1 − 3x| + C).
function p49() {
  var be = pick([-3, -2, -4, -5, -1, 2, 3, 4, 5, 6, 7]), al = be < 0 ? rnd(1, 9) : nz(-9, 9), k = pick([1, 1, 1, 1, 2, 3, 4, 5, 6]);
  if (gcd(al, be) > 1) return null;                                     // 7x − 7 г.м. хуваарийг хасна
  var u = be < 0 ? al + tm(be, 'x') : poly([be, al]);
  return {
    q: '$\\displaystyle\\int\\dfrac{' + k + '}{' + u + '}\\,dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm([k, be], '\\ln|' + u + '|', true) + '+C$',
    wk: 20,
    t: { k: k, al: al, be: be }
  };
}

// 50. ∫ₐᵇ c/(x² + kx) dx: 1/(x(x + k)) = (1/k)(1/x − 1/(x + k)) ⇒ (c/k)·ln(b(a + k)/(a(b + k)))  (эх: ∫₁² 1/(x² + x) dx = ln 4/3).
//     k < 0 бол ln-ийн аргументыг урвуулж коэффициентыг эерэг болгоно; (1/m)·ln(rᵐ) = ln r гэж хялбарчилна.
function p50_root(v, j) { var r = Math.round(Math.pow(v, 1 / j)); return Math.pow(r, j) === v ? r : 0; }
function p50() {
  var k = pick([1, 1, 1, 2, 2, 3, 4, -1, -1, -2]), a = rnd(1, 4), b = a + rnd(1, 3), c = Math.abs(k) > 1 && rnd(0, 2) === 0 ? Math.abs(k) : 1;
  if (b > 6 || a + k <= 0) return null;                                   // [a; b] дээр x² + kx ≠ 0
  var P = b * (a + k), Q = a * (b + k), g = gcd(P, Q), t;
  P /= g; Q /= g;
  if (k < 0) { t = P; P = Q; Q = t; }
  var cn = c, cd = Math.abs(k), g2 = gcd(cn, cd);
  cn /= g2; cd /= g2;
  for (var j = cd; j > 1; j--) if (cd % j === 0 && cn === 1 && p50_root(P, j) && p50_root(Q, j)) { P = p50_root(P, j); Q = p50_root(Q, j); cd /= j; break; }
  if (P === Q) return null;
  var coef = cd === 1 ? (cn === 1 ? '' : String(cn)) : '\\dfrac{' + cn + '}{' + cd + '}';
  return {
    q: '$\\displaystyle\\int_{' + a + '}^{' + b + '}\\dfrac{' + c + '}{' + poly([1, k, 0]) + '}\\,dx$ тодорхой интегралыг бод.',
    a: '$' + coef + '\\ln' + (Q === 1 ? ' ' + P : '\\dfrac{' + P + '}{' + Q + '}') + '$',
    wk: 26,
    t: { a: a, b: b, k: k, c: c }
  };
}
