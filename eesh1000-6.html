<script>
/* ЭЕШ 1000 2-2 — ЭЕШ-ийн 1000 бодлого, 2-р хэсэг (26–50-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 26. Телескоп үржвэр (эх: (1 − 1/2²)(1 − 1/3²)⋯(1 − 1/8²) = 9/16).
//     ∏_{k=s}^{N}(1 − 1/k²) = (s − 1)(N + 1)/(sN);  ∏_{k=s}^{N}(1 − 1/k) = (s − 1)/N;  ∏_{k=s}^{N}(1 + 1/k) = (N + 1)/s.
function p26() {
  var kind = pick(['Q', 'Q', 'Q', 'Q', 'M', 'P']), s = kind === 'Q' ? pick([2, 2, 2, 3, 4]) : pick([2, 2, 3]), N = rnd(s + 4, 20), num, den;
  var sg = kind === 'P' ? '+' : '-', sq = kind === 'Q' ? '^2' : '';
  var F = function (k) { return '\\left(1' + sg + '\\dfrac{1}{' + k + sq + '}\\right)'; };
  if (kind === 'Q') { num = (s - 1) * (N + 1); den = s * N; }
  else if (kind === 'M') { num = s - 1; den = N; }
  else { num = N + 1; den = s; }
  // Бодолт: 1 − 1/k² = (k−1)/k · (k+1)/k (квадратуудын ялгавар), 1 ∓ 1/k = (k ∓ 1)/k → хөрш үржигдэхүүний хүртвэр, хуваарь хураагдана
  //   (телескоп үржвэр): ∏(k−1)/k = (s−1)/N, ∏(k+1)/k = (N+1)/s.
  var D = function (a, b) { return '\\dfrac{' + a + '}{' + b + '}'; }, X = '\\cdot\\ldots\\cdot ', sol;
  var Pm = D(s - 1, s) + '\\cdot ' + D(s, s + 1) + '\\cdot ' + D(s + 1, s + 2) + X + D(N - 1, N);   // ∏ (k−1)/k
  var Pp = D(s + 1, s) + '\\cdot ' + D(s + 2, s + 1) + '\\cdot ' + D(s + 3, s + 2) + X + D(N + 1, N); // ∏ (k+1)/k
  var red = function (a, b) { return gcd(a, b) > 1 ? '=' + fr(a, b) : ''; };
  // Q: хаалт бүрийн үлдэгдлийг хураана — gcd(s − 1, s) = gcd(N + 1, N) = 1 тул тэдгээрийн үржвэр нэмж хураагдахгүй (= хариу)
  if (kind === 'Q') sol = [
    'Үржигдэхүүн бүрийг квадратуудын ялгаврын томьёогоор задалъя: $$1-\\dfrac{1}{k^2}=\\dfrac{(k-1)(k+1)}{k^2}=\\dfrac{k-1}{k}\\cdot\\dfrac{k+1}{k}.$$',
    'Иймд үржвэр хоёр үржвэрт хуваагдана: $$\\left(' + D(s - 1, s) + '\\cdot ' + D(s, s + 1) + X + D(N - 1, N) + '\\right)\\cdot\\left(' + D(s + 1, s) + '\\cdot ' + D(s + 2, s + 1) + X + D(N + 1, N) + '\\right).$$',
    'Хаалт бүрт хөрш үржигдэхүүний хүртвэр, хуваарь хураагдана (телескоп үржвэр): эхний хаалтад $' + D(s - 1, N) + red(s - 1, N) + '$, хоёр дахь хаалтад $' + D(N + 1, s) + red(N + 1, s)
      + '$ үлдэнэ. Иймд $$' + fr(s - 1, N) + '\\cdot ' + fr(N + 1, s) + '=' + fr(num, den) + '.$$'
  ];
  else if (kind === 'M') sol = [
    '$1-\\dfrac{1}{k}=\\dfrac{k-1}{k}$ тул үржвэр $$' + Pm + '.$$',
    'Үржигдэхүүн бүрийн хуваарь дараагийн үржигдэхүүний хүртвэртэй хураагдана (телескоп үржвэр): эхний хүртвэр $' + (s - 1) + '$, сүүлийн хуваарь $' + N + '$ үлдэнэ. Иймд $$'
      + D(s - 1, s) + X + D(N - 1, N) + '=' + D(s - 1, N) + red(s - 1, N) + '.$$'
  ];
  else sol = [
    '$1+\\dfrac{1}{k}=\\dfrac{k+1}{k}$ тул үржвэр $$' + Pp + '.$$',
    'Үржигдэхүүн бүрийн хүртвэр дараагийн үржигдэхүүний хуваарьтай хураагдана (телескоп үржвэр): сүүлийн хүртвэр $' + (N + 1) + '$, эхний хуваарь $' + s + '$ үлдэнэ. Иймд $$'
      + D(s + 1, s) + X + D(N + 1, N) + '=' + D(N + 1, s) + red(N + 1, s) + '.$$'
  ];
  return {
    q: '$' + F(s) + F(s + 1) + '\\cdot\\ldots\\cdot' + F(N) + '$ үржвэрийн утгыг олоорой.',
    a: '$' + fr(num, den) + '$', wk: 22, s: sol, t: { kind: kind, s: s, N: N }
  };
}

// 27. Ax + By + Cz + D = 0 хавтгайн нормал вектор n = (A; B; C) (эх: 2x + y − z + 1 = 0 → (2; 1; −1)).
//     Коэффициентүүд ерөнхий хуваагчгүй (хариу цор ганц хэлбэртэй); заримдаа нэг коэффициент нь 0.
function p27() {
  var A = nz(-6, 6), B = nz(-6, 6), C = nz(-6, 6), D = rnd(-9, 9), z = rnd(0, 8), lhs = '';
  if (z === 0) A = 0; else if (z === 1) B = 0; else if (z === 2) C = 0;
  if (gcd(gcd(A, B), C) !== 1) return null;
  if ((A || B) < 0 && rnd(0, 3)) { A = -A; B = -B; C = -C; D = -D; }   // ихэвчлэн эхний коэффициент эерэг (эх шиг)
  [A, B, C].forEach(function (c, i) { lhs += tm(c, 'xyz'[i], lhs === ''); });
  // Бодолт: хавтгайн дурын M₀, M цэгийн тэгшитгэлүүдийг хасвал A(x−x₀) + B(y−y₀) + C(z−z₀) = 0 ⇒ (A; B; C) ⟂ M₀M;
  //   коэффициентүүдийг уншина (байхгүй хувьсагчийн коэффициент 0), сул гишүүн D нөлөөлөхгүй.
  var zi = [A, B, C].indexOf(0);
  return {
    q: '$' + lhs + (D ? sgn(D) : '') + '=0$ хавтгайн нормал векторыг ол.',
    a: '$\\vec n=' + pt(A, B, C) + '$', wk: 16,
    s: [
      'Хавтгайн $Ax+By+Cz+D=0$ ерөнхий тэгшитгэлийн хувьд $\\vec n=(A;\\,B;\\,C)$ нь нормал вектор: хавтгайн дурын $M_0$, $M$ цэгийн тэгшитгэлүүдийг хасвал'
        + ' $$A(x-x_0)+B(y-y_0)+C(z-z_0)=0,$$ өөрөөр хэлбэл $\\vec n\\perp\\overrightarrow{M_0M}$. Сул гишүүн $D$ нөлөөлөхгүй.',
      '$x$, $y$, $z$-ийн өмнөх коэффициентүүд: $A=' + A + '$, $B=' + B + '$, $C=' + C + '$' + (zi >= 0 ? ' (тэгшитгэлд $' + 'xyz'[zi] + '$ байхгүй тул $' + 'ABC'[zi] + '=0$)' : '')
        + '. Иймд $\\vec n=' + pt(A, B, C) + '$.'
    ],
    t: { A: A, B: B, C: C, D: D }
  };
}

// 28. (x − x₀)/p = (y − y₀)/q = (z − z₀)/r шулууны чиглүүлэгч вектор s = (p; q; r) (эх: (x−1)/2 = (y+1)/3 = (z−2)/(−1) → (2; 3; −1)).
//     Хуваарь +1 гаргахгүй (x/1 хэлбэрээс зайлсхийнэ), −1 болно; p, q, r ерөнхий хуваагчгүй.
var p28_S = [-5, -4, -3, -2, -1, 2, 3, 4, 5, 2, 3, 4];
function p28() {
  var P = [rnd(-6, 6), rnd(-6, 6), rnd(-6, 6)], d = [pick(p28_S), pick(p28_S), pick(p28_S)];
  if (gcd(gcd(d[0], d[1]), d[2]) !== 1 || (!P[0] && !P[1] && !P[2])) return null;
  var q = ['x', 'y', 'z'].map(function (v, i) { return '\\dfrac{' + v + (P[i] ? sgn(-P[i]) : '') + '}{' + d[i] + '}'; }).join('=');
  // Бодолт: каноник тэгшитгэлийн харьцаа бүрийг t гэвэл M = M₀ + t·s ⇒ хуваарь = чиглүүлэгч векторын координат; M₀-ийг тоологчоос уншина.
  return {
    q: '$' + q + '$ шулууны чиглүүлэгч векторыг ол.', a: '$\\vec s=' + pt(d[0], d[1], d[2]) + '$', wk: 16,
    s: [
      'Шулууны каноник тэгшитгэл $$\\dfrac{x-x_0}{p}=\\dfrac{y-y_0}{q}=\\dfrac{z-z_0}{r}$$ нь $M_0(x_0;\\,y_0;\\,z_0)$ цэгийг дайрч $\\vec s=(p;\\,q;\\,r)$ векторт параллель шулуун:'
        + ' харьцаа бүрийг $t$ гэвэл $\\overrightarrow{M_0M}=t\\,\\vec s$.',
      'Хуваарийг уншвал $p=' + d[0] + '$, $q=' + d[1] + '$, $r=' + d[2] + '$ (шулуун $M_0' + pt(P[0], P[1], P[2]) + '$ цэгийг дайрна). Иймд $\\vec s=' + pt(d[0], d[1], d[2]) + '$.'
    ],
    t: { P: P, d: d }
  };
}

// 29. Хоёр шулууны хоорондох өнцөг: cos φ = |u·v|/(|u||v|), u, v — чиглүүлэгч векторууд (каноник тэгшитгэлийн хуваарь)
//     (эх: (x−2)/1 = y/1 = (z+√2)/(−2), x/2 = (y+1)/2 = (z+1/2)/(−4) → чиглэлүүд параллель, 0°).
//     Хуваарь ∈ {−5..5} \ {0, 1} (тэг ба +1 хуваарь гаргахгүй); өнцөг 90°, 60°, 45°, 30° эсвэл 0° (параллель, ялгаатай шулуунууд).
//     30°-аас бусад өнцөгт |координат| ≤ 4. Зарим цэгийн координат эх шиг √2, √3 эсвэл бутархай.
var p29_L = null;
function p29_init() {
  var S = [-5, -4, -3, -2, -1, 2, 3, 4, 5], V = [], L = { 0: [], 30: [], 45: [], 60: [], 90: [] }, i, j;
  S.forEach(function (a) { S.forEach(function (b) { S.forEach(function (c) { V.push([a, b, c]); }); }); });
  var mx = function (w) { return Math.max(Math.abs(w[0]), Math.abs(w[1]), Math.abs(w[2])); };
  for (i = 0; i < V.length; i++) {
    var u = V[i];
    if (gcd(gcd(u[0], u[1]), u[2]) !== 1) continue;
    var nu = u[0] * u[0] + u[1] * u[1] + u[2] * u[2], mu = mx(u);
    for (j = 0; j < V.length; j++) {
      var v = V[j], d = u[0] * v[0] + u[1] * v[1] + u[2] * v[2], nv = v[0] * v[0] + v[1] * v[1] + v[2] * v[2], key;
      var cx = u[1] * v[2] - u[2] * v[1], cy = u[2] * v[0] - u[0] * v[2], cz = u[0] * v[1] - u[1] * v[0];
      if (!cx && !cy && !cz) key = 0;
      else if (!d) key = 90;
      else if (4 * d * d === nu * nv) key = 60;
      else if (2 * d * d === nu * nv) key = 45;
      else if (4 * d * d === 3 * nu * nv) key = 30;
      else continue;
      if (key !== 30 && Math.max(mu, mx(v)) > 4) continue;
      L[key].push([u, v]);
    }
  }
  return L;
}
function p29_c(v) {                          // координат: { tex: тоологчийн бичиг, val: утга }
  var r = rnd(0, 11), s = pick([1, -1]);
  if (r === 0) { var k = pick([2, 3]); return { tex: v + (s > 0 ? '+' : '-') + '\\sqrt{' + k + '}', val: -s * Math.sqrt(k) }; }
  if (r === 1) { var n = pick([1, 1, 3]); return { tex: v + (s > 0 ? '+' : '-') + '\\frac{' + n + '}{2}', val: -s * n / 2 }; }
  var c = rnd(-5, 5);
  return { tex: v + (c ? sgn(-c) : ''), val: c };
}
function p29() {
  if (!p29_L) p29_L = p29_init();
  var ang = pick([90, 90, 60, 60, 45, 45, 30, 30, 0]), pr = pick(p29_L[ang]), u = pr[0], v = pr[1];
  if (rnd(0, 1)) { var w = u; u = v; v = w; }
  if (rnd(0, 1) && v.indexOf(-1) < 0) v = v.map(function (x) { return -x; });
  var P = [], Q = [], i;
  for (i = 0; i < 3; i++) { P.push(p29_c('xyz'[i])); Q.push(p29_c('xyz'[i])); }
  if (ang === 0) {                           // параллель шулуунууд давхцахгүй
    var dw = [Q[0].val - P[0].val, Q[1].val - P[1].val, Q[2].val - P[2].val];
    var cr = [dw[1] * u[2] - dw[2] * u[1], dw[2] * u[0] - dw[0] * u[2], dw[0] * u[1] - dw[1] * u[0]];
    if (Math.abs(cr[0]) + Math.abs(cr[1]) + Math.abs(cr[2]) < 1e-9) return null;
  }
  var line = function (C, d) { return [0, 1, 2].map(function (k) { return '\\dfrac{' + C[k].tex + '}{' + d[k] + '}'; }).join('='); };
  return {
    q: '$' + line(P, u) + ',\\ ' + line(Q, v) + '$ шулуунуудын хооронд үүсэх өнцгийг ол.',
    a: ang ? '$' + ang + '^\\circ$' : '$0^\\circ$ (шулуунууд параллель)', wk: 24,
    s: p29_sol(u, v, ang),
    t: { u: u, v: v }
  };
}
// Бодолт: чиглүүлэгч векторууд u, v (хуваарь). 0° — v = λu (коллинеар); 90° — u·v = 0; бусад үед
// cos φ = |u·v|/(|u|·|v|) = |u·v|/√(|u|²·|v|²), язгуурыг хялбарчилж 1/2, √2/2, √3/2-той тулгана.
function p29_sol(u, v, ang) {
  var V = function (w) { return pt(w[0], w[1], w[2]); };
  var s1 = 'Шулуунуудын хоорондох өнцөг нь тэдгээрийн чиглүүлэгч векторуудын (каноник тэгшитгэлийн хуваарь) хоорондох өнцөг: $\\vec u=' + V(u) + '$, $\\vec v=' + V(v) + '$.'
    + ' Тоологч дахь тогтмолууд (цэгийн координат) өнцөгт нөлөөлөхгүй.';
  if (ang === 0) {
    var lam = v[0] / u[0], m, big, small, rel;
    if (lam === Math.round(lam)) { m = lam; big = v; small = u; rel = '\\vec v=' + (m === 1 ? '' : m === -1 ? '-' : m) + '\\vec u'; }
    else { m = u[0] / v[0]; big = u; small = v; rel = '\\vec u=' + (m === -1 ? '-' : m) + '\\vec v'; }
    return [s1, (Math.abs(m) === 1 ? 'Харгалзах координатууд ' + (m > 0 ? 'тэнцүү' : 'эсрэг тэмдэгтэй') + ': $' + rel + '$.'
      : 'Харгалзах координатууд пропорциональ: $$' + V(big) + '=' + m + '\\cdot ' + V(small) + ',$$ өөрөөр хэлбэл $' + rel + '$.')
      + ' Векторууд коллинеар тул шулуунууд параллель: $\\varphi=0^\\circ$.'];
  }
  var dot = u[0] * v[0] + u[1] * v[1] + u[2] * v[2], nu = u[0] * u[0] + u[1] * u[1] + u[2] * u[2], nv = v[0] * v[0] + v[1] * v[1] + v[2] * v[2];
  var dA = '\\vec u\\cdot\\vec v=' + [0, 1, 2].map(function (i) { return par(u[i]) + '\\cdot ' + par(v[i]); }).join('+'), dB = u[0] * v[0] + sgn(u[1] * v[1]) + sgn(u[2] * v[2]) + '=' + dot;
  // слайдад багтаах: харагдах өргөн (\vec, \cdot-гүй) их бол хоёр мөрөнд (2 дахь нь «=»-ээр эхэлнэ)
  var dl = dA + ((dA + dB).replace(/\\vec /g, '').replace(/\\cdot /g, '.').length > 40 ? '$$ $$=' : '=') + dB;
  if (ang === 90) return [s1, 'Скаляр үржвэр: $$' + dl + '.$$ Иймд $\\vec u\\perp\\vec v$ ба $\\varphi=90^\\circ$.'];
  var sq = function (w) { return w.map(function (x) { return x * x; }).join('+'); };
  var S = surd(nu * nv), ad = Math.abs(dot), g = gcd(ad, S.k), ch = ['\\dfrac{' + ad + '}{\\sqrt{' + nu + '\\cdot ' + nv + '}}', '\\dfrac{' + ad + '}{' + S.tex + '}'];
  if (S.r !== 1 && g > 1) ch.push('\\dfrac{' + ad / g + '}{' + rt(S.k / g, S.r) + '}');
  ch.push({ 60: '\\dfrac{1}{2}', 45: '\\dfrac{\\sqrt{2}}{2}', 30: '\\dfrac{\\sqrt{3}}{2}' }[ang]);
  ch = ch.filter(function (x, i) { return !i || x !== ch[i - 1]; });
  return [
    s1,
    'Скаляр үржвэр ба уртын квадратууд: $$' + dl + ',$$ $$|\\vec u|^2=' + sq(u) + '=' + nu + ',\\quad |\\vec v|^2=' + sq(v) + '=' + nv + '.$$',
    'Шулуун хоорондын өнцөг мохоо байдаггүй тул скаляр үржвэрийн модулийг авна: $$\\cos\\varphi=\\dfrac{|\\vec u\\cdot\\vec v|}{|\\vec u|\\cdot|\\vec v|}=' + ch.join('=') + '.$$'
      + ' Иймд $\\varphi=' + ang + '^\\circ$.'
  ];
}

// 30. Огторгуйн хоёр цэгийн хоорондох зай |AB| = √(Δx² + Δy² + Δz²) (эх: A(1, −2, 4), B(1, 1, 0) → 5).
//     Ихэвчлэн Пифагорын дөрвөлөөс (бүхэл хариу), заримдаа хялбарчилсан язгуур хариу.
var p30_Q = [[1, 2, 2], [2, 3, 6], [1, 4, 8], [4, 4, 7], [2, 6, 9], [6, 6, 7], [0, 3, 4], [0, 5, 12], [0, 6, 8], [2, 4, 4],
  [3, 4, 12], [2, 5, 14], [2, 10, 11], [0, 8, 6], [3, 6, 6], [0, 4, 3], [1, 8, 4], [4, 8, 8]];
function p30() {
  var D;
  if (rnd(0, 4)) D = shuffle(pick(p30_Q)).map(function (x) { return rnd(0, 1) ? -x : x; });
  else {
    D = [rnd(-5, 5), rnd(-5, 5), rnd(-5, 5)];
    var s2 = D[0] * D[0] + D[1] * D[1] + D[2] * D[2], r = Math.round(Math.sqrt(s2));
    if (r * r === s2 || s2 < 5) return null;              // язгуур хувилбар: бүхэл биш
  }
  var A = [rnd(-6, 6), rnd(-6, 6), rnd(-6, 6)], B = [A[0] + D[0], A[1] + D[1], A[2] + D[2]];
  if (B.some(function (x) { return Math.abs(x) > 12; })) return null;
  var L = surd(D[0] * D[0] + D[1] * D[1] + D[2] * D[2]);
  // Бодолт: |AB| = √(Δx² + Δy² + Δz²) — координатын ялгавар, квадратуудын нийлбэр, язгуурыг хялбарчилна
  var S2 = D[0] * D[0] + D[1] * D[1] + D[2] * D[2], X = ['x', 'y', 'z'];
  return {
    q: '$A(' + A.join(',\\,') + '),\\ B(' + B.join(',\\,') + ')$ цэгүүдийн хоорондох зайг ол.',
    a: '$|AB|=' + L.tex + '$', wk: 18,
    s: [
      'Огторгуйн хоёр цэгийн хоорондох зайн томьёо: $$|AB|=\\sqrt{(x_B-x_A)^2+(y_B-y_A)^2+(z_B-z_A)^2}.$$',

// 47. y = (ax + b)/(cx + d) ⇒ y' = (ad − bc)/(cx + d)²  (эх: (x − 1)/(x + 1), y'(1) = 1/2).
function p47() {
  var a = pick([1, 1, 1, 2, 3, -1, -2]), b = nz(-9, 9), c = pick([1, 1, 1, 2, 3]), d = nz(-9, 9), x0 = rnd(-2, 3);
  if ((a < 0 && b < 0) || gcd(a, b) > 1 || gcd(c, d) > 1) return null;   // хүртвэр, хуваарь ерөнхий үржигдэхүүнгүй
  var det = a * d - b * c, den = c * x0 + d;
  if (!det || !den || Math.abs(den) > 6) return null;

  var sol = [

  return {
    q: '$\\displaystyle\\int\\left(' + tm(T[0].c, T[0].f, true) + tm(T[1].c, T[1].f) + '\\right)dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm(T[0].F, T[0].G, true) + tm(T[1].F, T[1].G) + '+C$',
    wk: 24,
    s: sol,
    t: { a: a, b: b, p: p, q: q }
  };
}

// 49. ∫ k/(α + βx) dx = (k/β)·ln|α + βx| + C  (эх: ∫ 1/(1 − 3x) dx = −(1/3)·ln|1 − 3x| + C).
function p49() {
  var be = pick([-3, -2, -4, -5, -1, 2, 3, 4, 5, 6, 7]), al = be < 0 ? rnd(1, 9) : nz(-9, 9), k = pick([1, 1, 1, 1, 2, 3, 4, 5, 6]);
  if (gcd(al, be) > 1) return null;                                     // 7x − 7 г.м. хуваарийг хасна
  var u = be < 0 ? al + tm(be, 'x') : poly([be, al]);
  // Бодолт: t = α + βx орлуулга, dt = β·dx → ∫k/(α + βx)dx = (k/β)∫dt/t = (k/β)·ln|t| + C
  var D = function (z) { return z.replace(/\\frac\{/g, '\\dfrac{'); }, B = Math.abs(be);
  var dtx = be === -1 ? 'dt=-dx' : 'dt=' + be + '\\,dx', dxt = be === -1 ? 'dx=-dt' : 'dx=' + (be < 0 ? '-' : '') + '\\dfrac{dt}{' + B + '}';
  var dxf = be === -1 ? '(-dt)' : be < 0 ? '\\left(-\\dfrac{dt}{' + B + '}\\right)' : '\\dfrac{dt}{' + B + '}';
  var sol = [
    'Интегралыг $I$ гэж тэмдэглээд $t=' + u + '$ орлуулга хийе: $' + dtx + '$, эндээс $' + dxt + '$.',
    '$\\int\\dfrac{dt}{t}=\\ln|t|+C$ тул $$I=\\int\\dfrac{' + k + '}{t}\\cdot ' + dxf + '=' + D(tm([k, be], '\\int\\dfrac{dt}{t}', true)) + '$$ $$=' + D(tm([k, be], '\\ln|t|', true)) + '+C.$$',
    '$t=' + u + '$ гэж буцааж орлуулбал $$I=' + D(tm([k, be], '\\ln|' + u + '|', true)) + '+C.$$'
  ];
  return {
    q: '$\\displaystyle\\int\\dfrac{' + k + '}{' + u + '}\\,dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm([k, be], '\\ln|' + u + '|', true) + '+C$',
    wk: 20,
    s: sol,
    t: { k: k, al: al, be: be }
  };
}

// 50. ∫ₐᵇ c/(x² + kx) dx: 1/(x(x + k)) = (1/k)(1/x − 1/(x + k)) ⇒ (c/k)·ln(b(a + k)/(a(b + k)))  (эх: ∫₁² 1/(x² + x) dx = ln 4/3).
//     k < 0 бол ln-ийн аргументыг урвуулж коэффициентыг эерэг болгоно; (1/m)·ln(rᵐ) = ln r гэж хялбарчилна.
function p50_root(v, j) { var r = Math.round(Math.pow(v, 1 / j)); return Math.pow(r, j) === v ? r : 0; }
function p50() {
  var k = pick([1, 1, 1, 2, 2, 3, 4, -1, -1, -2]), a = rnd(1, 4), b = a + rnd(1, 3), c = Math.abs(k) > 1 && rnd(0, 2) === 0 ? Math.abs(k) : 1;
  if (b > 6 || a + k <= 0) return null;                                   // [a; b] дээр x² + kx ≠ 0
  var P = b * (a + k), Q = a * (b + k), g = gcd(P, Q), t;
  P /= g; Q /= g;
  if (k < 0) { t = P; P = Q; Q = t; }
  var cn = c, cd = Math.abs(k), g2 = gcd(cn, cd);
  cn /= g2; cd /= g2;
  for (var j = cd; j > 1; j--) if (cd % j === 0 && cn === 1 && p50_root(P, j) && p50_root(Q, j)) { P = p50_root(P, j); Q = p50_root(Q, j); cd /= j; break; }
  if (P === Q) return null;
  var coef = cd === 1 ? (cn === 1 ? '' : String(cn)) : '\\dfrac{' + cn + '}{' + cd + '}';
  // Бодолт: c/(x(x + k)) = (c/k)(1/x − 1/(x + k)) (хялбар бутархай; k < 0 бол (c/|k|)(1/(x + k) − 1/x)); [a; b]-д x > 0, x + k > 0 тул
  //   эх функц F = (c/|k|)·ln(x/(x + k)) (k < 0: ln((x + k)/x)); Ньютон–Лейбниц + ln A − ln B = ln(A/B).
  var mk = Math.abs(k), neg = k < 0, cf = fr(c, mk), cfT = cf === '1' ? '' : cf, xk = 'x' + sgn(k);
  var pf = neg ? '\\dfrac{1}{' + xk + '}-\\dfrac{1}{x}' : '\\dfrac{1}{x}-\\dfrac{1}{' + xk + '}';
  var lnd = neg ? '\\ln(' + xk + ')-\\ln x' : '\\ln x-\\ln(' + xk + ')', rf = neg ? '\\dfrac{' + xk + '}{x}' : '\\dfrac{x}{' + xk + '}';
  var rat = function (x) { return neg ? fr(x + k, x) : fr(x, x + k); };
  var P0 = b * (a + k), Q0 = a * (b + k), g0 = gcd(P0, Q0), sw;
  P0 /= g0; Q0 /= g0;
  if (neg) { sw = P0; P0 = Q0; Q0 = sw; }
  var L0 = Q0 === 1 ? ' ' + P0 : '\\dfrac{' + P0 + '}{' + Q0 + '}', L1 = Q === 1 ? ' ' + P : '\\dfrac{' + P + '}{' + Q + '}';
  var wrap = function (z) { return cfT ? cfT + '\\left(' + z + '\\right)' : z; };
  var sol = [
    'Интегралыг $I$ гэе. $' + poly([1, k, 0]) + '=x(' + xk + ')$ тул хялбар бутархайд задалбал $$\\dfrac{' + c + '}{' + poly([1, k, 0]) + '}=' + wrap(pf) + '.$$',
    '$[' + a + ';\\,' + b + ']$ завсарт $x\\gt 0$ ба $' + xk + '\\gt 0$ тул эх функц нь $$F(x)=' + wrap(lnd) + '=' + cfT + '\\ln' + rf + '.$$',
    'Ньютон–Лейбницийн томьёо ба $\\ln A-\\ln B=\\ln\\dfrac{A}{B}$ чанараар $$I=F(' + b + ')-F(' + a + ')=' + wrap('\\ln' + rat(b) + '-\\ln' + rat(a)) + '$$ $$='
      + cfT + '\\ln\\left(' + rat(b) + ':' + rat(a) + '\\right)=' + cfT + '\\ln' + L0 + '.$$'
  ];
  if (P !== P0 || Q !== Q0) {   // (1/m)·ln(rᵐ) = ln r (энэ мужид гардаггүй ч генераторын салаатай нийцүүлэв)
    var jj = Math.round(P > 1 ? Math.log(P0) / Math.log(P) : Math.log(Q0) / Math.log(Q));
    sol.push('$\\ln A^{m}=m\\ln A$ тул $$I=' + cfT + '\\ln\\left(' + (Q === 1 ? String(P) : '\\dfrac{' + P + '}{' + Q + '}') + '\\right)^{' + jj + '}=' + coef + '\\ln' + L1 + '.$$');
  }
  return {
    q: '$\\displaystyle\\int_{' + a + '}^{' + b + '}\\dfrac{' + c + '}{' + poly([1, k, 0]) + '}\\,dx$ тодорхой интегралыг бод.',
    a: '$' + coef + '\\ln' + (Q === 1 ? ' ' + P : '\\dfrac{' + P + '}{' + Q + '}') + '$',
    wk: 26,
    s: sol,
    t: { a: a, b: b, k: k, c: c }
  };
}
