// cap=6. Өмнө нь t-г rnd(1,4)-ээр сонгодог тул нэг хуудсанд ижил төрөл 2-3 удаа
// давтагдаж, тэр төрөлд 1-2 өгүүлбэр л байсан учир ЯГ ижил бодлого гардаг байв.
// Одоо 4 төрөл × 2 өгүүлбэр = 8 хувилбарыг ЭЭЛЖЛЭН гаргана → 6 нүд бүгд өөр.
function g_308_wTblWord() { return h308_rot('w', 8, h308_wTblWord); }
function h308_wTblWord(v) {
  var t = v % 4 + 1, j = (v >> 2) % 2, c1, c2, a, b, S, lim;

  if (t === 1) {                                        // 622 — даацын хязгаар
    S = [
      { t: 'Гүүрэн дээр даацын хязгаарыг', ask: 'Ачаатай машины нийт жин хэд вэ?', o: 'Гүүрээр гарч болох уу?',
        h: 'Хоосон машин', w: 'Ачаа',
        yes: 'Нийт жин даацаас бага тул гүүрээр гарч болно.', no: 'Нийт жин даацаас их тул гүүрээр гарч болохгүй.' },
      { t: 'Ачааны шат өргөгчийн даацыг', ask: 'Хоёр хайрцгийн нийт жин хэд вэ?', o: 'Хоёуланг нэг дор өргөж болох уу?',
        h: 'Нэгдүгээр хайрцаг', w: 'Хоёрдугаар хайрцаг',
        yes: 'Нийт жин даацаас бага тул нэг дор өргөж болно.', no: 'Нийт жин даацаас их тул нэг дор өргөж болохгүй.' }
    ][j];
    // Даац 7–9 т: нийт жин 5300–9990 тул «болно»/«болохгүй» хоёр хариу хоёул гарна
    // (өмнө 10 т байхад нийт жин хэзээ ч хүрдэггүй тул хариу үргэлж «болно» байв).
    lim = pick([7000, 8000, 9000]);
    a = rnd(2800, 5200); b = rnd(2500, 9990 - a);
    if (b < 2500) return null;
    c1 = colAdd(a, b);
    return {
      q: S.t + ' $' + (lim / 1000) + '$ т гэж бичжээ. ' + S.ask + ' ' + S.o + ' ($1$ т $=1000$ кг)',
      fig: h308_tbl(['Юу', 'Жин (кг)'], [[S.h, nt(a)], [S.w, nt(b)]], 300),
      a: 'Нийт $' + nf(a) + '+' + nf(b) + '=' + nf(a + b) + '$ кг. Даац $' + (lim / 1000) + '$ т $=' + nf(lim) + '$ кг. ' +
         (a + b <= lim ? S.yes : S.no),
      // Баганан НЭМЭХ нь colAdd10k / tblSum2-тай ижил орон зайд (нэг хуудсанд
      // ижил нэмэх үйлдэл хоёр удаа гарахгүй)
      key: '308add:' + a + '+' + b, col: c1.q, sol: c1.s
    };
  }

  if (t === 2) {                                        // нийлбэр ба зөрөө хоёулаа
    S = [
      { t: 'Хоёр агуулахад байгаа гурилын хэмжээ', h: ['Агуулах', 'Гурил (кг)'], r: ['Төв агуулах', 'Салбар агуулах'], u: 'кг' },
      { t: 'Хоёр дэлгүүрийн нэг өдрийн борлуулалт', h: ['Дэлгүүр', 'Борлуулалт'], r: ['Наран дэлгүүр', 'Саран дэлгүүр'], u: '₮' }
    ][j];
    a = rnd(2600, 6200); b = rnd(1050, 2500);
    if (a + b > 9990 || a - b < 900) return null;
    c1 = colAdd(a, b); c2 = colSub(a, b);
    return {
      q: S.t + '. а) Нийт хэд вэ? б) Хоёрын зөрөө хэд вэ?',
      fig: h308_tbl(S.h, [[S.r[0], nt(a)], [S.r[1], nt(b)]], 300),
      a: 'а) $' + nf(a) + '+' + nf(b) + '=' + nf(a + b) + '$ ' + S.u + '. б) $' + nf(a) + '-' + nf(b) + '=' + nf(a - b) + '$ ' + S.u + '.',
      key: '308add:' + a + '+' + b, col: c1.q + c2.q, sol: c1.s + c2.s
    };
  }

  if (t === 3) {
    // 628 — УРВУУ үйлдэл: нийт ба нэг хэсэг өгөгдсөн, нөгөө хэсгийг ол.
    // (Өмнө нь энэ хувилбар «гурван тооны нийлбэр» байсан — 4-р даалгавар
    //  g_308_tbl3Sum-тай ЯГ ижил бодлого, бас key нь өөр орон зайд байсан тул
    //  нэг хуудсанд хоёул гарч байв.)
    S = [
      { t: 'Хоёр өдөрт зарагдсан ном', h: ['Юу', 'Номын тоо'], r0: 'Хоёр өдрийн нийт', r1: 'Эхний өдөр',
        q: 'Хоёрдугаар өдөр хэдэн ном зарагдсан бэ?', u: 'ном' },
      { t: 'Хоёр багийн цуглуулсан хаягдал цаас', h: ['Юу', 'Хэмжээ (кг)'], r0: 'Хоёр багийн нийт', r1: 'Хүчит баг',
        q: 'Найрсаг баг хэдэн килограмм цуглуулсан бэ?', u: 'кг' }
    ][j];
    var tot = rnd(3100, 9950), p1 = rnd(1050, tot - 1000);
    if (tot - p1 < 1000 || p1 === tot - p1) return null;
    c1 = colSub(tot, p1);
    return {
      q: S.t + '. ' + S.q,
      fig: h308_tbl(S.h, [[S.r0, nt(tot)], [S.r1, nt(p1)]], 300),
      a: '$' + nf(tot) + '-' + nf(p1) + '=' + nf(tot - p1) + '$ ' + S.u +
         '. Шалгалт: $' + nf(p1) + '+' + nf(tot - p1) + '=' + nf(tot) + '$.',
      key: '308sub:' + tot + '-' + p1, col: c1.q, sol: c1.s
    };
  }

  // t === 4: 625 — хоёр барааны үнийн зөрөө, нийт хэмнэлт
  S = [
    { q: 'Дэлгүүр хичээлийн хэрэгслийн үнийг хямдруулжээ. Бараа тус бүрийн үнийн зөрөөг ол. Хоёуланг нь авбал нийт хэдэн төгрөг хэмнэх вэ?',
      IT: ['Цүнх', 'Зузаан дэвтэр', 'Усан будаг', 'Бөмбөг', 'Хуванцар сав'] },
    { q: 'Гэр ахуйн дэлгүүр хоёр барааны үнийг буулгав. Бараа тус бүр хэдэн төгрөгөөр хямдарсныг ол. Хоёуланг нь авбал нийт хэдэн төгрөг хэмнэх вэ?',
      IT: ['Хөнжил', 'Цайны аяга', 'Дэнлүү', 'Алчуур', 'Шүүгээ'] }
  ][j];
  var IT = shuffle(S.IT).slice(0, 2);
  var A1 = 100 * rnd(32, 95), D1 = 100 * rnd(4, 22), B1 = A1 - D1;
  var A2 = 100 * rnd(15, 60), D2 = 50 * rnd(5, 28), B2 = A2 - D2;
  if (B1 < 1000 || B2 < 800 || D1 === D2) return null;
  if (D1 === B1 || D2 === B2) return null;              // зөрөө нь хүснэгтэд бэлэн харагдахгүй
  c1 = colSub(A1, B1); c2 = colSub(A2, B2);
  return {
    q: S.q,
    fig: h308_tbl(['Бараа', 'Анхны үнэ', 'Хямдарсан'],
                  [[IT[0], nt(A1) + '₮', nt(B1) + '₮'], [IT[1], nt(A2) + '₮', nt(B2) + '₮']], 320),
    a: IT[0] + ': $' + nf(A1) + '-' + nf(B1) + '=' + nf(D1) + '$₮. ' + IT[1] + ': $' + nf(A2) + '-' + nf(B2) + '=' + nf(D2) + '$₮. ' +
       'Нийт хэмнэлт $' + nf(D1) + '+' + nf(D2) + '=' + nf(D1 + D2) + '$₮.',
    key: '308sub:' + A1 + '-' + B1, col: c1.q + c2.q, sol: c1.s + c2.s
  };
}
var WSPEC={"title":"Арван мянга хүртэлх тоо-3","sub":"Тоймлох, дараалал, ойр тоог тодорхойлох · 3-р анги","rule":"<b>Санамж:</b> Тоймлохдоо тоймлох орноос <b>нэг доод орны</b> цифрийг харна. $5$-аас бага бол тоймлох орноос хойших цифрүүдийг тэг болгоно, $5$ ба түүнээс их бол тоймлох орны цифрийг нэгээр нэмэгдүүлнэ. Жишээ нь $3672$ тоог аравтаар $3672 \\approx 3670$ ($2 \\lt 5$), зуутаар $3672 \\approx 3700$ ($7 \\gt 5$), мянгатаар $3672 \\approx 4000$ ($6 \\gt 5$) гэж тоймлоно. Дарааллыг үргэлжлүүлэхдээ хоёр хөрш тооны <b>зөрөөг</b> ол: $6318,\\ 6328,\\ 6338,\\ \\dots$ дараалалд алхам нь $10$ байна.","ref":"","tasks":[{"label":"Заасан орноор тоймлон бич.","fn":"g_302_round","cap":6,"cols":3,"wk":8},{"label":"Дарааллын мэдэгдэхгүй байгаа тоонуудыг ол.","fn":"g_302_seq","cap":5,"cols":1,"wk":10},{"label":"Заасан алхмаар тоолж бич.","fn":"g_302_countBy","cap":4,"cols":1,"wk":12},{"label":"Тоон шулууныг ашиглан аль тоонд ойр болохыг тайлбарла.","fn":"g_302_nearer","cap":3,"cols":1,"wk":14},{"label":"Ямар тоонуудыг тоймловол өгсөн тоо болохыг ол.","fn":"g_302_roundRange","cap":4,"cols":1,"wk":12},{"label":"Бодлогын тоог хоёр янзаар тоймлон бич.","fn":"g_302_wRound","cap":3,"cols":1,"wk":18}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
