<!DOCTYPE html>
<html lang="mn">

<title>Арван мянга хүртэлх тоо-3 (3-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1px solid #c3d6ee;border-radius:2px;background-color:#fff;background-image:linear-gradient(to right,#dbe6f5 1px,transparent 1px),linear-gradient(to bottom,#dbe6f5 1px,transparent 1px);background-size:19px 19px;height:16mm;margin-top:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wk.wkc{height:auto;overflow:hidden}
  .cg{--c:19px;position:relative;margin:19px 0 19px 19px}
  .cg span{position:absolute;width:var(--c);height:var(--c);line-height:var(--c);text-align:center;font-size:13.5px;font-weight:600;color:#1a1030;font-family:'Segoe UI',Arial,sans-serif}
  .cg span.sg{transform:translateY(-50%);font-weight:700;color:#5a32d6}
  .cg .hl{position:absolute;height:0;border-top:1.6px solid #1a1030;margin-top:-0.8px}
  .cg .vl{position:absolute;width:0;border-left:1.6px solid #1a1030;margin-left:-0.8px}
  .cg.sm{--c:15px;margin:3px 0 1px;border:1px solid #d3e1f3;box-sizing:content-box;background-color:#fff;background-image:linear-gradient(to right,#dfe9f6 1px,transparent 1px),linear-gradient(to bottom,#dfe9f6 1px,transparent 1px);background-size:15px 15px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cg.sm span{font-size:10.5px}
  .asol{display:inline-block;vertical-align:top;margin:0 0 0 12px}
  .task{break-after:avoid;page-break-after:avoid}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
// ══════════ g3core.js — 3-р ангийн нийтлэг хөдөлгүүр (g5core + баганан бичиглэл) ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}

// ══════════ 4-р анги: тоо бичих, дөрвөлжин тор, баганан бичиглэл ══════════
// nf(n): KaTeX доторх тоо — 5+ оронтойг мянгатаар \, зайтай (24\,175), 4 оронтойг зайгүй (1734) — сурах бичгийн дагуу
function nf(n){var neg=n<0,s=String(Math.abs(n));if(s.length>=5)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,'\\,');return (neg?'-':'')+s;}
// nt(n): энгийн текстэд (үгэн бодлого, $-гүй) — 24 175 (тасрахгүй зай)
function nt(n){var neg=n<0,s=String(Math.abs(n));if(s.length>=5)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'−':'')+s;}
// Бодолтын зайн өндөр (мм) → торны 19px нүдний бүхэл тоо (дэвтрийн ~5 мм дөрвөлжин)
function g4wk(mm){return Math.max(2,Math.round((+mm||20)*3.7795/19))*19+'px';}

// ── Нүдний тор: cells [{r,c,t,cls}], lines [{t:'h'|'v',r,c,len}] ──
//   h: r-р мөрний ДООД ирмэг дээр c-ээс len нүд; v: c-р баганын ЗҮҮН ирмэг дээр r-ээс len мөр.
//   cls:'sg' — тэмдэг (×, +, −) хагас мөр дээш (хоёр мөрийн дунд).
function cgHtml(R,C,cells,lines,cls){
  var h='<div class="cg'+(cls?' '+cls:'')+'" style="width:calc(var(--c)*'+C+');height:calc(var(--c)*'+R+')">';
  cells.forEach(function(x){h+='<span class="'+(x.cls||'d')+'" style="left:calc(var(--c)*'+x.c+');top:calc(var(--c)*'+x.r+')">'+x.t+'</span>';});
  lines.forEach(function(l){
    if(l.t==='h')h+='<i class="hl" style="left:calc(var(--c)*'+l.c+');top:calc(var(--c)*'+(l.r+1)+');width:calc(var(--c)*'+l.len+')"></i>';
    else h+='<i class="vl" style="left:calc(var(--c)*'+l.c+');top:calc(var(--c)*'+l.r+');height:calc(var(--c)*'+l.len+')"></i>';
  });
  return h+'</div>';
}
// s мөрийн цифрүүдийг r-р мөрөнд, сүүлийн цифр нь end баганад байхаар (баруун тийш тэгшилж) байрлуулна
function cgPut(cells,s,r,end){s=String(s);for(var i=0;i<s.length;i++)cells.push({r:r,c:end-(s.length-1-i),t:s[i]});}

// ── Баганан үржүүлэх (сурах бичиг 33–34, 40: хэсэгчилсэн үржвэрийг ТЭГТЭЙ нь бичнэ: 990, 1980) ──
// Буцаах: {q: асуултын тор (2 үржигдэхүүн + зураас), s: бүрэн бодолт, R: бодолтын мөрийн тоо}
function colMul(a,b){
  var A=String(a),B=String(b),P=String(a*b),m=B.length,parts=[];
  for(var i=0;i<m;i++){var d=+B[m-1-i];if(d)parts.push(String(a*d*Math.pow(10,i)));}
  var many=parts.length>1,W=Math.max(A.length,B.length+1,P.length);
  parts.forEach(function(p){W=Math.max(W,p.length);});
  var C=W+1,end=W;
  function head(cells,lines){cgPut(cells,A,0,end);cgPut(cells,B,1,end);cells.push({r:1,c:end-Math.max(A.length,B.length),t:'×',cls:'sg'});
    lines.push({t:'h',r:1,c:end-Math.max(A.length,B.length,P.length)+1,len:Math.max(A.length,B.length,P.length)});}
  var R=many?3+parts.length:3;
  var qc=[],ql=[];head(qc,ql);
  var sc=[],sl=[];head(sc,sl);
  if(many){
    parts.forEach(function(p,i){cgPut(sc,p,2+i,end);});
    sc.push({r:3,c:end-Math.max.apply(null,parts.map(function(p){return p.length;})),t:'+',cls:'sg'});
    sl.push({t:'h',r:1+parts.length,c:end-P.length+1,len:P.length});
    cgPut(sc,P,2+parts.length,end);
  } else cgPut(sc,P,2,end);
  return {q:cgHtml(R+1,C+1,qc,ql),s:cgHtml(R,C,sc,sl,'sm'),R:R};
}

// ── Баганан (булангаар) хуваах — товч арга (сурах бичиг 40, 43: хасагдахуун мөр бүрт буулгасан цифртэй) ──
// a ≥ b > 0. Үлдэгдэлтэй байж болно. Буцаах: {q, s, R, quo, rem}
function colDiv(a,b){
  var A=String(a),n=A.length,Bs=String(b),quo=Math.floor(a/b),Q=String(quo),rem=a%b;
  var pos=0,cur=+A[0];
  while(cur<b&&pos<n-1){pos++;cur=cur*10+(+A[pos]);}
  var seq=[],prevV=cur,prevEnd=pos,guard=0;
  while(guard++<40){

    cur=r*10+(+A[pos]);

    if(cur<b){seq.push({k:'r',v:cur,end:n-1});break;}
    seq.push({k:'c',v:cur,end:pos});prevV=cur;
  }
  var qw=Math.max(Bs.length,Q.length),qwMax=Math.max(Bs.length,n-Bs.length+1);
  var C=1+n+Math.max(qw,qwMax)+1,R=1+seq.length;
  function col(i){return 1+i;}                        // A-ийн i-р цифрийн багана
  function head(cells,lines,lw){cgPut(cells,A,0,col(n-1));cgPut(cells,Bs,0,col(n-1)+Bs.length);
    lines.push({t:'v',r:0,c:col(n-1)+1,len:2});lines.push({t:'h',r:0,c:col(n-1)+1,len:lw});}
  var qc=[],ql=[];head(qc,ql,qwMax);
  var sc=[],sl=[];head(sc,sl,qw);
  cgPut(sc,Q,1,col(n-1)+Q.length);
  seq.forEach(function(x,i){

    cgPut(sc,x.v,rr,e);
    if(x.k==='p'){var w=Math.max(String(x.v).length,String(x.above).length);

  return {q:cgHtml(R+1,C,qc,ql),s:cgHtml(R,C,sc,sl,'sm'),R:R,quo:quo,rem:rem};
}

// ── Баганан нэмэх / хасах (2–3 нэмэгдэхүүн; хасахад a ≥ b) ──
function colAddSub(nums,op){
  var res=op==='+'?nums.reduce(function(s,x){return s+x;},0):nums[0]-nums[1];
  var S=nums.map(String),Rs=String(res),W=Math.max(Rs.length,Math.max.apply(null,S.map(function(s){return s.length;})));
  var C=W+1,end=W,k=S.length,R=k+1;
  function head(cells,lines){S.forEach(function(s,i){cgPut(cells,s,i,end);});
    cells.push({r:k-1,c:end-W,t:op==='+'?'+':'−',cls:'sg'});lines.push({t:'h',r:k-1,c:1,len:W});}
  var qc=[],ql=[];head(qc,ql);
  var sc=[],sl=[];head(sc,sl);cgPut(sc,Rs,k,end);
  return {q:cgHtml(R+1,C+1,qc,ql),s:cgHtml(R,C,sc,sl,'sm'),R:R,res:res};

var NM301 = ['Болд', 'Сараа', 'Батаа', 'Дулмаа', 'Анар', 'Оюунаа', 'Тэмүүлэн', 'Намуун',
             'Хулан', 'Ганбат', 'Энхжин', 'Мөнхөө', 'Цэцэгмаа', 'Дорж', 'Сувд', 'Амар', 'Туяа'];

// ── Баганаар нэмэхэд ШИЛЖҮҮЛЭЛТ гарч байгаа эсэх ────────────────────────────
function h301_carry(nums) {
  var mx = 0, i, j, p, c = 0, has = false;
  for (i = 0; i < nums.length; i++) mx = Math.max(mx, String(nums[i]).length);
  for (i = 0, p = 1; i < mx; i++, p *= 10) {
    var s = c;
    for (j = 0; j < nums.length; j++) s += Math.floor(nums[j] / p) % 10;
    if (s >= 10) { has = true; c = Math.floor(s / 10); } else c = 0;
  }
  return has;
}

// ── Баганаар хасахад ЗЭЭЛЭЛТ гарах эсэх (аль нэг орны цифр доогуур байх) ────
function h301_borrow(a, b) {
  var mx = String(a).length, i, p;
  for (i = 0, p = 1; i < mx; i++, p *= 10)
    if ((Math.floor(a / p) % 10) < (Math.floor(b / p) % 10)) return true;
  return false;
}

// ── h301_bl(тор, тоо): АСУУЛТЫН торноос ӨМНӨХ АЛХМЫН ҮР ДҮН-г хоосолно ──────
//   Хоёр алхамт бодлогод 2-р тор нь 1-р алхмын хариуг агуулдаг (ж. 90+160 →
//   «410−250»). Тэгвэл сурагч 1-р үйлдлийг бодохгүйгээр хариуг уншина. Иймд
//   тухайн тооны нүднүүдийг хасна — тор, тэмдэг, зураас хэвээр үлдэнэ.
//   Зөвхөн БҮТЭН тоог (хоёр талд зэргэлдээ цифргүй) олно.
function h301_bl(html, v) {
  var s = String(v), h = String(html);
  var vlm = h.match(/<i class="vl" style="left:calc\(var\(--c\)\*(\d+)\)/);
  var cut = vlm ? +vlm[1] : Infinity;
  var re = /<span class="d" style="left:calc\(var\(--c\)\*(\d+)\);top:calc\(var\(--c\)\*(\d+)\)">(\d)<\/span>/g;
  var items = [], m, byRow = {};
  while ((m = re.exec(h))) items.push({ all: m[0], c: +m[1], r: +m[2], t: m[3] });
  items.forEach(function (x) { (byRow[x.r] = byRow[x.r] || []).push(x); });
  function side(c) { return c >= cut; }
  var kill = null;
  Object.keys(byRow).map(Number).sort(function (a, b) { return a - b; }).forEach(function (r) {
    if (kill) return;
    var ds = byRow[r].slice().sort(function (a, b) { return a.c - b.c; });
    for (var i = 0; i + s.length <= ds.length && !kill; i++) {
      var ok = true;
      for (var j = 0; j < s.length; j++) {
        if (ds[i + j].t !== s.charAt(j)) { ok = false; break; }
        if (j && (ds[i + j].c !== ds[i + j - 1].c + 1 || side(ds[i + j].c) !== side(ds[i + j - 1].c))) { ok = false; break; }
      }
      if (!ok) continue;
      var A = ds[i - 1], B = ds[i + s.length], a0 = ds[i], b0 = ds[i + s.length - 1];
      if (A && A.c === a0.c - 1 && side(A.c) === side(a0.c)) continue;
      if (B && B.c === b0.c + 1 && side(B.c) === side(b0.c)) continue;
      kill = ds.slice(i, i + s.length);
    }
  });
  if (!kill) return h;
  kill.forEach(function (x) { h = h.replace(x.all, ''); });
  return h;
}

// ── 1. Дөрвөн оронтой тоонуудыг шилжүүлэлттэй нэмэх (627 а, б) ──────────────
function g_301_addCol() {
  var a = rnd(1234, 8765), b = rnd(1111, 9999 - a);
  if (b < 1000 || a + b > 9999) return null;
  if (!h301_carry([a, b])) return null;
  var c = colAdd(a, b);
  return {
    q: '$' + nf(a) + '+' + nf(b) + '$',
    a: '$' + nf(a) + '+' + nf(b) + '=' + nf(a + b) + '$',
    key: '301add:' + a + '+' + b, col: c.q, sol: c.s
  };
}

// ── 2. Өөр оронтой тоо, дундаа тэгтэй тоо нэмэх (631 а, б) ─────────────────
function g_301_addColMix() {

  if (t === 1) { a = rnd(1234, 8999); b = rnd(234, 999); }

  else { a = rnd(1, 8) * 1000 + rnd(0, 9) * 10 + rnd(0, 9); b = rnd(1000, 9999 - a); }

  if (!h301_carry([a, b])) return null;
  var c = colAdd(a, b);
  return {
    q: '$' + nf(a) + '+' + nf(b) + '$',
    a: '$' + nf(a) + '+' + nf(b) + '=' + nf(a + b) + '$',

  };
}

// ── 3. Гурван нэмэгдэхүүнтэй нийлбэр (635) ─────────────────────────────────
function g_301_add3() {

// ── 5. Оновчтой арга: дугуй тоонд шилжүүлж нэмэх (630 а, б) ────────────────
function g_301_addOpt() {

function g_301_subCol() {

// ── 2. Хасагдагч дотор тэг байх үеийн зээлэлт (631 в: 9006−6500) ───────────
function g_301_subZero() {

// ── 3. Оновчтой арга: дугуй тоонд шилжүүлж хасах (630 в, г) ────────────────
function g_301_subOpt() {
  var t = rnd(1, 2), r, d, a, b;
  if (t === 1) { r = rnd(2, 9) * 100; d = pick([1, 2, 3, 4, 5]); b = r - d; a = rnd(r + 150, 9800); }

  if (a === 2 * b) return null;                 // ялгавар = хасагч → хариу асуултад бэлэн

// ── 4. Хасахын өгүүлбэртэй бодлого (625, 629 б) ────────────────────────────
function g_301_wSubSimple() {
  var t = rnd(1, 4), a, b, q, u;
  if (t === 1) {
    a = rnd(4200, 9600); b = rnd(1300, 3900); u = 'ширхэг';
    q = 'Агуулахад ' + nt(a) + ' ширхэг тоосго байв. Үүнээс ' + nt(b) + ' ширхэгийг нь ачиж явлаа. Хэдэн тоосго үлдсэн бэ?';
  } else if (t === 2) {
    a = rnd(5200, 9500); b = rnd(1200, 4200); u = 'төгрөг';
    q = 'Нэг хос бээлийн анхны үнэ ' + nt(a) + ' төгрөг байсан бол хямдралын дараа ' + nt(a - b) + ' төгрөг болов. Үнэ хэдэн төгрөгөөр хямдарсан бэ?';
  } else if (t === 3) {
    a = rnd(3500, 8800); b = rnd(1200, 3200); u = 'хүн';
    q = 'Хоёр сумын нэгэнд нь ' + nt(a) + ', нөгөөд нь ' + nt(a - b) + ' хүн оршин суудаг. Эхний суманд хэдэн хүнээр олон вэ?';
  } else {
    a = rnd(4500, 9800); b = rnd(1500, 4000); u = 'м';
    q = 'Нэг уулын өндөр ' + nt(a) + ' м, нөгөө уулын өндөр ' + nt(a - b) + ' м байв. Өндрийн зөрөө хэд вэ?';
  }
  if (b >= a || a > 9999) return null;
  if (a === 2 * b) return null;                 // зөрөө = өгөгдсөн тоо → асуултын торонд хариу харагдана
  var c = (t === 1) ? colSub(a, b) : colSub(a, a - b);

function g_301_findErr() {

// ── 6. Илэрхийллүүдийг харьцуулах (634) ────────────────────────────────────
function g_301_cmpExpr() {

  if (t === 1) {

    if (d < 1000 || d > 5200) return null;
    L = a + b; R = c + d;

    sg = L < R ? '\\lt ' : (L > R ? '\\gt ' : '=');
    return {
      q: '$' + nf(a) + '+' + nf(b) + '\\ \\square\\ ' + nf(c) + '+' + nf(d) + '$',

  };

  var a = rnd(350, 900), d = rnd(80, 250), b = a - d;
  var tot = rnd(a + b + 200, 3500), c = tot - a - b;
  var t = rnd(1, 3), q, u = (t === 1 ? 'мод' : (t === 2 ? 'км' : 'ширхэг'));
  if (c < 150 || tot > 9999) return null;
  if (c === d || c === a || c === b) return null;         // хариу өгөгдөлтэй давхцахгүй
  if (t === 1)
    // (өмнө нь «гурван анги хаягдал цаас» байсан — g_301_wThree t=1-тэй нэг
    //  хуудсан дээр бараг ижил өгүүлбэр болж давхардаж байв)
    q = 'Гурван баг нийлээд нийт ' + nt(tot) + ' мод тарив. Эхний баг ' + nt(a) + ' мод, хоёр дахь баг эхний багаас ' + nt(d) + ' модоор бага тарьсан бол гурав дахь баг хэдэн мод тарьсан бэ?';
  else if (t === 2)
    q = 'Аялагчид гурван өдөрт нийт ' + nt(tot) + ' км зам туулав. Эхний өдөр ' + nt(a) + ' км, хоёр дахь өдөр эхний өдрөөс ' + nt(d) + ' км-аар бага явжээ. Гурав дахь өдөр хэдэн километр явсан бэ?';
  else
    q = 'Дэлгүүр гурван өдөрт нийт ' + nt(tot) + ' ширхэг талх зарав. Эхний өдөр ' + nt(a) + ', хоёр дахь өдөр эхний өдрөөс ' + nt(d) + ' ширхэгээр бага зарсан бол гурав дахь өдөр хэд зарсан бэ?';
  var c1 = colSub(a, d), c2 = colAdd(a, b), c3 = colSub(tot, a + b);
  return {
    q: q,
    a: '$' + nf(a) + '-' + nf(d) + '=' + nf(b) + '$ ' + u + '; $' + nf(a) + '+' + nf(b) + '=' + nf(a + b) + '$ ' + u +
       '; $' + nf(tot) + '-' + nf(a + b) + '=' + nf(c) + '$ ' + u + '.',
    key: '301wtl:' + t + ':' + tot + ':' + a + ':' + d,
    col: c1.q + h301_bl(c2.q, b) + h301_bl(c3.q, a + b), sol: c1.s + c2.s + c3.s
  };
}

// ───────── g3ch3.sub02.js ─────────
// ─────────────────────────────────────────────────────────────────────────────
// 3-р анги · III бүлэг · 3.02 — Арван мянга хүртэлх тоо
// Сурах бичиг х.124–126 (PDF 30–32) «НЭГДСЭН БАТАТГАЛ — АРВАН МЯНГА ХҮРТЭЛХ
// ТООГ УНШИХ, БИЧИХ, ЖИШИХ, ТОЙМЛОХ»
//
//   587а  үгээр бичсэн тоог цифрээр                        → g_302_wordToNum
//   589, 612а  тоог үгээр бичих                            → g_302_numToWord
//   591  онцолсон цифрийн орны утга                        → g_302_digitVal
//   587б, 612б  орны нэмэгдэхүүний нийлбэрт задлах         → g_302_expand
//   587в, 609г  хэдэн бүтэн аравт, зуут, мянгат            → g_302_placeCount
//   606  40 арав + 3 зуу + 4 арав + 3 нэгж                 → g_302_fromParts
//   592  жиших (\lt, \gt, =)                               → g_302_cmp
//   588, 589  тоон шулуун дээрх цэгийг унших               → g_302_readLine
//   588, 601, 610а  өсөх / буурах эрэмбэ                   → g_302_order
//   600  хоёр тооны хооронд байх тоонуудыг ялгах           → g_302_between
//   595  68*4 > 6809 — * -ны оронд ямар цифр               → g_302_starDigit
//   607, 609  цифрүүдээр хамгийн их / бага тоо зохиох      → g_302_makeNum
//   594, 612в  аравт, зуут, мянгатаар тоймлох              → g_302_round
//   602  дарааллын мэдэгдэхгүй тоог олох                   → g_302_seq
//   596, 597, 611  10, 100, 1000-аар нэмэгдүүлж/хорогдуулж → g_302_countBy
//   593, 598  аль тоонд ойр вэ (тоон шулуун)               → g_302_nearer
//   608  ямар тоонуудыг тоймловол 7000 болох вэ            → g_302_roundRange
//   594, 612в  өгүүлбэртэй тоймлолт                        → g_302_wRound
//   603  баганаар нэмэх                                    → g_302_addCol
//   603  баганаар хасах                                    → g_302_subCol
//   603  гурван нэмэгдэхүүнийг баганаар нэмэх              → g_302_add3Col
//   603  нийлбэр БА зөрөөг хоёуланг олох                   → g_302_sumDiff
//   590  хүнсний барааны үнэ (7000, 5250, 3500, 850, …)    → g_302_wShop
//   610  УБ-аас сумын төв хүртэлх зай (1709, 1023, …)      → g_302_wDist
// ─────────────────────────────────────────────────────────────────────────────

// ══════════ Туслахууд ══════════

var H302_POW = [1, 10, 100, 1000];
var H302_PN  = ['нэгжийн орон', 'аравтын орон', 'зуутын орон', 'мянгатын орон'];
var H302_PU  = ['нэгж', 'аравт', 'зуут', 'мянгат'];
var H302_RN  = ['', 'аравтаар', 'зуутаар', 'мянгатаар'];

// ── Тоог монгол үгээр (сурах бичиг 587: «гурван мянга долоон зуун дөчин ес») ──
//   Эцсийн (төгсгөлийн) хэлбэр: ес, тавь, зуу … ; дагаврын хэлбэр: есөн, тавин, зуун …
//   1 зуу-г «нэг» -гүйгээр бичнэ: 150 → «зуун тавь» (сурах бичгийн дагуу).
var H302_UA = ['', 'нэг', 'хоёр', 'гурван', 'дөрвөн', 'таван', 'зургаан', 'долоон', 'найман', 'есөн'];
var H302_UF = ['', 'нэг', 'хоёр', 'гурав', 'дөрөв', 'тав', 'зургаа', 'долоо', 'найм', 'ес'];
var H302_TA = ['', 'арван', 'хорин', 'гучин', 'дөчин', 'тавин', 'жаран', 'далан', 'наян', 'ерэн'];
var H302_TF = ['', 'арав', 'хорь', 'гуч', 'дөч', 'тавь', 'жар', 'дал', 'ная', 'ер'];

function h302_grp(v, fin) {
  var h = Math.floor(v / 100), t = Math.floor(v / 10) % 10, u = v % 10, p = [];
  if (h) p.push((h === 1 ? '' : H302_UA[h] + ' ') + 'зуу' + ((fin && t === 0 && u === 0) ? '' : 'н'));
  if (t) p.push((fin && u === 0) ? H302_TF[t] : H302_TA[t]);
  if (u) p.push(fin ? H302_UF[u] : H302_UA[u]);
  return p.join(' ');
}
function h302_words(n) {
  if (n === 10000) return 'арван мянга';
  var th = Math.floor(n / 1000), r = n % 1000, o = [];
  if (th) o.push(th === 1 ? 'мянга' : H302_UA[th] + ' мянга');
  if (r) o.push(h302_grp(r, true));
  return o.join(' ');
}
function h302_cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
// Мянгаттай тоонд зуутын цифр 1 бол «мянга нэг зуун …» / «мянга зуун …» хоёрдмол
// утгатай болох тул үгээр бичих даалгаварт ийм тоог хэрэглэхгүй.
function h302_sayOk(n) { return !(n >= 1000 && Math.floor((n % 1000) / 100) === 1); }

// L оронтой санамсаргүй тоо; эхнийхээс бусад цифр zp магадлалтай 0 (4030, 6005 мэт)
function h302_num(L, zp) {
  var s = '' + rnd(1, 9);
  for (var i = 1; i < L; i++) s += (Math.random() < zp ? 0 : rnd(0, 9));
  return +s;
}
// idx-р цифрийг доогуур зураастай, бүдүүн болгоно
function h302_mark(n, idx) {
  var s = String(n), out = '';
  for (var i = 0; i < s.length; i++) out += (i === idx ? '\\underline{\\mathbf{' + s.charAt(i) + '}}' : s.charAt(i));
  return out;
}

// ── Тоон шулуун (хуваарьтай, сонголтоор А/Б/В цэгтэй) ──────────────────────
//   marks: [{v:утга, t:'А'}] эсвэл null. labEvery: хэдэн хуваарь тутамд тоо бичих.
function h302_nl(lo, hi, step, marks, labEvery) {
  var W = 420, H = 58, pad = 26, u = (W - 2 * pad - 14) / (hi - lo), y = 36;
  function X(v) { return Math.round((pad + (v - lo) * u) * 10) / 10; }
  var g = '<line x1="' + (pad - 10) + '" y1="' + y + '" x2="' + (W - pad + 4) + '" y2="' + y + '" stroke="#555" stroke-width="1.4"/>';
  g += '<polygon points="' + (W - pad + 12) + ',' + y + ' ' + (W - pad + 3) + ',' + (y - 4) + ' ' + (W - pad + 3) + ',' + (y + 4) + '" fill="#555"/>';
  var i = 0, le = labEvery || 1;
  for (var v = lo; v <= hi; v += step) {
    var x = X(v), big = (i % le === 0);
    g += '<line x1="' + x + '" y1="' + (y - (big ? 7 : 4)) + '" x2="' + x + '" y2="' + (y + (big ? 7 : 4)) + '" stroke="#555" stroke-width="' + (big ? 1.3 : 1) + '"/>';
    if (big) g += '<text x="' + x + '" y="' + (y + 19) + '" font-size="10" text-anchor="middle" fill="#555">' + nt(v) + '</text>';
    i++;
  }
  if (marks) marks.forEach(function (m) {
    var x = X(m.v);
    g += '<polygon points="' + x + ',' + (y - 3) + ' ' + (x - 4) + ',' + (y - 11) + ' ' + (x + 4) + ',' + (y - 11) + '" fill="#5a32d6"/>';
    g += '<text x="' + x + '" y="' + (y - 14) + '" font-size="11" text-anchor="middle" fill="#5a32d6">' + m.t + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' + g + '</svg>';
}

// ═══════════ I ХУУДАС — унших, бичих, орны утга ═══════════

// [587а] Үгээр бичсэн тоог цифрээр
function g_302_wordToNum() {
  var L = pick([3, 4, 4, 4, 4]), n = h302_num(L, Math.random() < 0.4 ? 0.4 : 0.1);
  if (!h302_sayOk(n)) return null;
  if (n < 100) return null;
  return { q: h302_cap(h302_words(n)), a: '$' + nf(n) + '$', key: '302n:' + n };
}

// [589, 612а] Тоог үгээр бичих
function g_302_numToWord() {
  var L = pick([3, 4, 4, 4]), n = h302_num(L, Math.random() < 0.35 ? 0.35 : 0.1);
  if (!h302_sayOk(n)) return null;
  if (n < 100) return null;
  return { q: '$' + nf(n) + '$', a: h302_cap(h302_words(n)), key: '302n:' + n };
}

// [591] Доогуур зураастай цифр ямар утга илэрхийлж байна вэ
function g_302_digitVal() {
  var n = rnd(1000, 9999), s = String(n), idx = rnd(0, 3), d = +s.charAt(idx), p = 3 - idx;
  if (d === 0 && Math.random() < 0.8) return null;       // тэг цөөхөн таарна (сурах бичгийн 7900, 1094 мэт)
  if (p === 0 && Math.random() < 0.65) return null;      // нэгжийн орон хэт хялбар тул цөөн
  return {
    q: '$' + h302_mark(n, idx) + '$',
    a: '$' + nf(d * H302_POW[p]) + '$ — ' + H302_PN[p],
    key: '302n:' + n
  };
}

// [587б, 612б] Орны нэмэгдэхүүний нийлбэрт задлах
function g_302_expand() {
  var n = h302_num(4, 0.18), s = String(n), t = [];
  for (var i = 0; i < 4; i++) { var d = +s.charAt(i); if (d) t.push(d * H302_POW[3 - i]); }
  if (t.length < 2) return null;
  return { q: '$' + nf(n) + '$', a: '$' + nf(n) + '=' + t.map(nf).join('+') + '$', key: '302n:' + n };
}

// [587в, 609г] Тоонд хэдэн бүтэн аравт, зуут, мянгат байна вэ
function g_302_placeCount() {
  var n = h302_num(4, 0.15), p = rnd(1, 3), c = Math.floor(n / H302_POW[p]);
  return {
    q: '$' + nf(n) + '$ тоонд хэдэн бүтэн ' + H302_PU[p] + ' байна вэ?',
    a: '$' + nf(c) + '$ ' + H302_PU[p],
    key: '302n:' + n
  };
}

// [606] Орны нэмэгдэхүүнээс тоог сэргээх (коэффициент 10-аас их байж болно)
function g_302_fromParts() {
  var ty = rnd(1, 4), a, b, c, d, v;
  if (ty === 1) {                                        // 40 аравт + 3 зуут + 4 аравт + 3 нэгж
    a = rnd(11, 60); b = rnd(1, 9); c = rnd(1, 9); d = rnd(1, 9);
    v = a * 10 + b * 100 + c * 10 + d;
    return {
      q: '$' + a + '\\text{ аравт}+' + b + '\\text{ зуут}+' + c + '\\text{ аравт}+' + d + '\\text{ нэгж}$',
      a: '$' + nf(a * 10) + '+' + nf(b * 100) + '+' + (c * 10) + '+' + d + '=' + nf(v) + '$',
      key: '302fp1:' + a + ':' + b + ':' + c + ':' + d
    };
  }
  if (ty === 2) {                                        // 24 зуут + 7 аравт + 5 нэгж
    a = rnd(11, 45); b = rnd(1, 9); c = rnd(1, 9);
    v = a * 100 + b * 10 + c;
    return {
      q: '$' + a + '\\text{ зуут}+' + b + '\\text{ аравт}+' + c + '\\text{ нэгж}$',
      a: '$' + nf(a * 100) + '+' + (b * 10) + '+' + c + '=' + nf(v) + '$',
      key: '302fp2:' + a + ':' + b + ':' + c
    };
  }
  if (ty === 3) {                                        // «8 аравт дээр 9 аравтыг нэмэх» (606б)
    a = rnd(6, 45); b = rnd(6, 45);
    if (a === b) return null;
    v = (a + b) * 10;
    return {
      q: '$' + a + '\\text{ аравт}$ дээр $' + b + '\\text{ аравт}$ нэмсэнтэй тэнцэх тоо',
      a: '$' + a + '+' + b + '=' + (a + b) + '$ аравт, энэ нь $' + nf(v) + '$',
      key: '302fp3:' + Math.min(a, b) + ':' + Math.max(a, b)
    };
  }
  a = rnd(1, 7); b = rnd(11, 25); c = rnd(1, 9);         // 5 мянгат + 14 зуут + 6 нэгж
  v = a * 1000 + b * 100 + c;
  if (v > 9999) return null;
  return {
    q: '$' + a + '\\text{ мянгат}+' + b + '\\text{ зуут}+' + c + '\\text{ нэгж}$',
    a: '$' + nf(a * 1000) + '+' + nf(b * 100) + '+' + c + '=' + nf(v) + '$',
    key: '302fp4:' + a + ':' + b + ':' + c
  };
}

// ═══════════ II ХУУДАС — жиших, эрэмбэлэх, тоон шулуун ═══════════

// [592] Жиших: \lt, \gt, =
function g_302_cmp() {
  var ty = pick([1, 1, 2, 2, 2, 3, 4, 4, 5]), a, b, base;
  if (ty === 1) { a = rnd(880, 999); b = rnd(1000, 1120); }                 // оронтойн тоо ялгаатай
  else if (ty === 2) { base = rnd(1, 9) * 1000 + rnd(0, 9) * 100; a = base + rnd(0, 99); b = base + rnd(0, 99); }
  else if (ty === 3) { a = rnd(1000, 9999); b = +String(a).split('').reverse().join(''); if (b < 1000) return null; }
  else if (ty === 4) { a = rnd(100, 9999); b = rnd(100, 9999); }
  else { a = rnd(1000, 9999); b = a; }
  if (ty !== 5 && a === b) return null;
  if ((ty === 1 || ty === 3) && rnd(0, 1)) { var sw = a; a = b; b = sw; }   // их нь зүүн талд ч байж болно
  var sg = a < b ? '\\lt ' : (a > b ? '\\gt ' : '=');
  return { q: '$' + nf(a) + '\\ \\square\\ ' + nf(b) + '$', a: '$' + nf(a) + sg + nf(b) + '$', key: '302cmp:' + Math.min(a, b) + ':' + Math.max(a, b) };
}

// [588, 589] Тоон шулуун дээрх цэгүүд ямар тоог заана вэ
function g_302_readLine() {
  var lo = rnd(0, 9) * 1000, hi = lo + 1000;
  var pos = shuffle([1, 2, 3, 4, 6, 7, 8, 9]).slice(0, 3).sort(function (x, y) { return x - y; });
  var L = ['А', 'Б', 'В'];
  var marks = pos.map(function (p, i) { return { v: lo + p * 100, t: L[i] }; });
  return {
    q: 'Тоон шулуун дээрх А, Б, В цэгүүд ямар тоог заана вэ?',
    fig: h302_nl(lo, hi, 100, marks, 5),
    a: marks.map(function (m) { return m.t + ' $=' + nf(m.v) + '$'; }).join(', '),
    key: '302rl:' + lo
  };
}

// [588, 601, 610а] Өсөх / буурах эрэмбэ
function g_302_order() {
  var cnt = rnd(4, 5), N = [], i, j;
  for (i = 0; i < cnt; i++) {
    var L = pick([2, 3, 3, 4, 4, 4]);
    N.push(L === 2 ? rnd(10, 99) : (L === 3 ? rnd(100, 999) : rnd(1000, 9999)));
  }
  for (i = 0; i < cnt; i++) for (j = i + 1; j < cnt; j++) if (N[i] === N[j]) return null;
  var dir = rnd(0, 1);
  var S = N.slice().sort(function (x, y) { return dir ? y - x : x - y; });
  return {
    q: '$' + N.map(nf).join(',\\ \\ ') + '$ — ' + (dir ? 'буурах' : 'өсөх') + ' эрэмбээр',
    a: '$' + S.map(nf).join(dir ? '\\gt ' : '\\lt ') + '$',
    key: '302or:' + S.join(',') + ':' + dir
  };
}

// [600] Хоёр тооны хооронд байх тоонуудыг ялгах
function g_302_between() {
  var A = rnd(400, 7800), B = A + rnd(40, 1200), i;
  if (B > 9990) return null;
  var ins = [], out = [];
  for (i = 0; i < 3; i++) ins.push(rnd(A + 1, B - 1));
  for (i = 0; i < 3; i++) out.push(Math.random() < 0.5 ? rnd(20, A - 1) : rnd(B + 1, 9999));
  var all = shuffle(ins.concat(out)), seen = {}, ok = true;
  all.forEach(function (v) { if (seen[v]) ok = false; seen[v] = 1; });
  if (!ok) return null;
  var res = all.filter(function (v) { return v > A && v < B; });
  if (res.length < 2 || res.length > 4) return null;
  return {
    q: '$' + nf(A) + '$ ба $' + nf(B) + '$ хоёрын хооронд: $' + all.map(nf).join(',\\ ') + '$',
    a: '$' + res.map(nf).join(',\\ ') + '$',
    key: '302bt:' + A + ':' + B + ':' + all.join(',')
  };
}

// [595] 68*4 > 6809 — $\square$-ны оронд ямар цифрүүд байж болох вэ
function g_302_starDigit() {
  var dg = [rnd(1, 9), rnd(0, 9), rnd(0, 9), rnd(0, 9)], idx = rnd(1, 3);
  var mid = dg.slice(); mid[idx] = rnd(1, 8);
  var T = +mid.join('') + rnd(-9, 9);
  if (T < 1000 || T > 9999) return null;
  var op = rnd(0, 1), ok = [], d;
  for (d = 0; d <= 9; d++) {
    var b = dg.slice(); b[idx] = d;
    var v = +b.join('');
    if (op ? v < T : v > T) ok.push(d);
  }
  if (ok.length < 1 || ok.length > 9) return null;
  var qs = dg.map(function (x, i) { return i === idx ? '\\square ' : x; }).join('');
  return {
    q: '$' + qs + (op ? '\\lt ' : '\\gt ') + nf(T) + '$',
    a: '$\\square=' + ok.join(',\\ ') + '$',
    key: '302sd:' + qs + ':' + op + ':' + T
  };
}

// [607, 609] Өгсөн цифрүүдээр тоо зохиох (цифр давтагдахгүй)
function g_302_makeNum() {
  var d = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, 4);
  var s = d.slice().sort(function (a, b) { return a - b; });
  var mx = +s.slice().reverse().join(''), mn = +s.join('');
  var mode = rnd(1, 3), lst = '$' + d.join(',\\ ') + '$';
  if (mode === 1) return { q: lst + ' — хамгийн их $4$ оронтой тоо', a: '$' + nf(mx) + '$', key: '302mk:' + s.join('') };
  if (mode === 2) return { q: lst + ' — хамгийн бага $4$ оронтой тоо', a: '$' + nf(mn) + '$', key: '302mk:' + s.join('') };
  var sec = +(s[3] + '' + s[2] + s[0] + s[1]);           // хамгийн их тооны сүүлийн хоёр цифрийг сольсон
  return { q: lst + ' — хоёр дахь том $4$ оронтой тоо', a: '$' + nf(sec) + '$', key: '302mk:' + s.join('') };
}

// [594, 612в] Заасан орноор тоймлох
function g_302_round() {
  var n = h302_num(4, 0.12), p = rnd(1, 3), P = H302_POW[p];
  var d = Math.floor(n / (P / 10)) % 10;
  if (d === 5 || n % P === 0) return null;
  var r = Math.round(n / P) * P;
  return { q: '$' + nf(n) + '$ — ' + H302_RN[p], a: '$' + nf(n) + '\\approx ' + nf(r) + '$', key: '302rn:' + n };
}

// [602] Дарааллын мэдэгдэхгүй тоог олох
function g_302_seq() {
  var st = pick([10, 10, 100, 100, 1000]), dir = pick([1, 1, -1]), step = st * dir, i;
  var start = h302_num(4, 0.1), T = [];
  for (i = 0; i < 6; i++) { var v = start + i * step; if (v < 10 || v > 10000) return null; T.push(v); }
  var bl = shuffle([1, 2, 3, 4, 5]).slice(0, rnd(2, 3)).sort(function (a, b) { return a - b; });
  var qa = T.map(function (v, i) { return bl.indexOf(i) >= 0 ? '\\square' : nf(v); });
  return {
    q: '$' + qa.join(',\\ ') + '$',
    a: '$' + bl.map(function (i) { return nf(T[i]); }).join(',\\ ') + '$',
    key: '302sq:' + start + ':' + step
  };
}

// [596, 597, 611] 10, 100, 1000-аар нэмэгдүүлж / хорогдуулж тоолох
function g_302_countBy() {
  var st = pick([10, 100, 1000]), dir = pick([1, -1]), k = rnd(4, 5), i;
  var start = h302_num(4, 0.12), T = [];
  for (i = 1; i <= k; i++) { var v = start + i * st * dir; if (v < 10 || v > 10000) return null; T.push(v); }
  return {
    q: '$' + nf(start) + '$ тооноос эхлэн $' + nf(st) + '$-аар ' + (dir > 0 ? 'нэмэгдүүлж' : 'хорогдуулж') + ' $' + k + '$ тоо бич.',
    a: '$' + T.map(nf).join(',\\ ') + '$',
    key: '302sq:' + start + ':' + (st * dir)
  };
}

// [593, 598] Тоо аль хөрш тоонд ойр вэ (тоон шулуунтай)
function g_302_nearer() {
  var ty = rnd(1, 2), lo, hi, n, step, le;
  if (ty === 1) { lo = rnd(0, 9) * 1000; hi = lo + 1000; n = lo + rnd(1, 999); step = 100; le = 5; if (n % 1000 === 500) return null; }
  else { lo = rnd(1, 98) * 100; hi = lo + 100; n = lo + rnd(1, 99); step = 10; le = 5; if (n % 100 === 50) return null; }
  var dLo = n - lo, dHi = hi - n, near = dLo < dHi ? lo : hi;
  return {
    q: '$' + nf(n) + '$ нь $' + nf(lo) + '$, $' + nf(hi) + '$ тооны алинд ойр вэ?',
    fig: h302_nl(lo, hi, step, null, le),
    a: 'Ойр нь $' + nf(near) + '$. Учир нь $' + nf(n) + '-' + nf(lo) + '=' + nf(dLo) + '$, $' + nf(hi) + '-' + nf(n) + '=' + nf(dHi) + '$.',
    key: '302nr:' + lo + '-' + hi
  };
}

// [608] Ямар тоонуудыг тоймловол өгсөн тоо болох вэ
function g_302_roundRange() {
  var p = rnd(1, 3), P = H302_POW[p];
  var T = rnd(1, Math.floor(9900 / P)) * P;
  var lo = T - P / 2, hi = T + P / 2 - 1;
  if (lo < 10 || hi > 9999) return null;
  return {
    q: 'Ямар тоонуудыг ' + H302_RN[p] + ' тоймловол $' + nf(T) + '$ болох вэ?',
    a: '$' + nf(lo) + '$ ба $' + nf(hi) + '$ хоёрын хоорондох бүх тоо (хоёул ороод).',
    key: '302rr:' + T + ':' + p
  };
}

// [594, 612в] Өгүүлбэртэй тоймлолт — зуутаар ба мянгатаар
var H302_WR = [

// [603] Баганаар нэмэх
function g_302_addCol() {
  var a = rnd(1234, 8600), b = rnd(1000, 9999 - a);
  if (b < 600) return null;
  var c = colAdd(a, b);
  return {
    q: '$' + nf(a) + '+' + nf(b) + '$',
    a: '$' + nf(a) + '+' + nf(b) + '=' + nf(a + b) + '$',
    key: '302ab:' + Math.min(a, b) + ':' + Math.max(a, b), col: c.q, sol: c.s
  };
}

// [603] Баганаар хасах (тэгээс зээлэх тохиолдлыг тусгайлан олшруулав)
function g_302_subCol() {
  var a, b;
  if (Math.random() < 0.3) a = rnd(2, 9) * 1000;         // 4000 − 1234 мэт
  else a = rnd(2000, 9999);
  b = rnd(1000, a - 200);
  if (b < 1000) return null;
  if (a - b === b) return null;                           // зөрөө нь хасагчтай тэнцвэл хариу хоосон торонд БЭЛЭН харагдана
  var c = colSub(a, b);
  return {
    q: '$' + nf(a) + '-' + nf(b) + '$',
    a: '$' + nf(a) + '-' + nf(b) + '=' + nf(a - b) + '$',
    key: '302ab:' + Math.min(a, b) + ':' + Math.max(a, b), col: c.q, sol: c.s
  };
}

// [603] Гурван нэмэгдэхүүнийг баганаар нэмэх
function g_302_add3Col() {
  var a = rnd(1000, 4200), b = rnd(900, 3400), c = rnd(400, 2600);
  if (a + b + c > 9999) return null;
  var g = colAdd(a, b, c);
  return {
    q: '$' + nf(a) + '+' + nf(b) + '+' + nf(c) + '$',
    a: '$' + nf(a) + '+' + nf(b) + '+' + nf(c) + '=' + nf(a + b + c) + '$',
    key: '302a3:' + [a, b, c].slice().sort(function (x, y) { return x - y; }).join(':'), col: g.q, sol: g.s
  };
}

// [603] Хоёр тооны нийлбэр БА зөрөөг хоёуланг олох
function g_302_sumDiff() {
  var a = rnd(1500, 7800), b = rnd(1000, 9999 - a);
  if (b < 800 || a === b) return null;
  var mx = Math.max(a, b), mn = Math.min(a, b);
  if (mx - mn === mn) return null;                       // зөрөө нь бага тоотой тэнцвэл хариу асуултад БЭЛЭН байна
  var c1 = colAdd(a, b), c2 = colSub(mx, mn);
  return {
    q: '$' + nf(a) + '$ ба $' + nf(b) + '$',
    a: 'Нийлбэр $' + nf(a) + '+' + nf(b) + '=' + nf(a + b) + '$; зөрөө $' + nf(mx) + '-' + nf(mn) + '=' + nf(mx - mn) + '$.',
    key: '302ab:' + mn + ':' + mx, col: c1.q + c2.q, sol: c1.s + c2.s
  };
}

// [590] Хүнсний барааны үнэ — сурах бичгийн бодит үнүүд
var H302_PR = [

];

}

// [610] Улаанбаатараас сумын төв хүртэлх зай — сурах бичгийн бодит тоонууд
var H302_DS = [

}

var D303  = [3, 4, 5, 6, 8, 10];          // үндсэн хуваарьнууд

var NWA303 = ['', 'нэг', 'хоёр', 'гурван', 'дөрвөн', 'таван', 'зургаан', 'долоон',
              'найман', 'есөн', 'арван'];
function say303(n, d) { return DW303[d] + ' ' + NW303[n]; }           // "аравны долоо"

function Say303(n, d) { var s = say303(n, d); return s.charAt(0).toUpperCase() + s.slice(1); }

// ── SVG: тэнцүү хуваасан тууз (эхний k хэсгийг будсан) ──────────────────────
function h303_bar(n, k, lab) {
  var W = 272, H = lab ? 44 : 30, x0 = 4, y0 = lab ? 18 : 4, h = 22,
      w = W - 8, u = w / n, g = '', i;
  if (lab) {
    g += '<line x1="' + x0 + '" y1="10" x2="' + (x0 + w) + '" y2="10" ' +
         'stroke="#7a7298" stroke-width="1" stroke-dasharray="3 2"/>';
    g += '<text x="' + (x0 + w / 2).toFixed(1) + '" y="8" font-size="9" ' +
         'text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" fill="#5b5280">' +
         lab + '</text>';
  }
  for (i = 0; i < n; i++) {
    g += '<rect x="' + (x0 + i * u).toFixed(1) + '" y="' + y0 + '" width="' + u.toFixed(1) +
         '" height="' + h + '" fill="' + (i < k ? '#f3a47c' : '#ffffff') +
         '" stroke="#3b3160" stroke-width="1.2"/>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W +
         '" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>';
}

// ── SVG: тэнцүү хуваасан дугуй (эхний k сектор будсан) ──────────────────────
function h303_pie(n, k) {
  var R = 46, cx = R + 5, cy = R + 5, S = 2 * R + 10, g = '', i;
  for (i = 0; i < n; i++) {
    var a0 = -Math.PI / 2 + 2 * Math.PI * i / n,
        a1 = -Math.PI / 2 + 2 * Math.PI * (i + 1) / n,
        x1 = (cx + R * Math.cos(a0)).toFixed(1), y1 = (cy + R * Math.sin(a0)).toFixed(1),
        x2 = (cx + R * Math.cos(a1)).toFixed(1), y2 = (cy + R * Math.sin(a1)).toFixed(1);
    g += '<path d="M' + cx + ',' + cy + ' L' + x1 + ',' + y1 + ' A' + R + ',' + R +
         ' 0 0,1 ' + x2 + ',' + y2 + ' Z" fill="' + (i < k ? '#f3a47c' : '#ffffff') +
         '" stroke="#3b3160" stroke-width="1.2"/>';
  }
  return '<svg viewBox="0 0 ' + S + ' ' + S + '" width="' + S +
         '" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>';
}

      LB = labs || ['а', 'б', 'в', 'г'];
  g += '<line x1="' + pad + '" y1="' + y + '" x2="' + (W - pad) + '" y2="' + y +
       '" stroke="#3b3160" stroke-width="1.4"/>';
  for (i = 0; i <= n; i++) {
    var x = (pad + i * u).toFixed(1);
    g += '<line x1="' + x + '" y1="' + (y - 5) + '" x2="' + x + '" y2="' + (y + 5) +
         '" stroke="#3b3160" stroke-width="1"/>';
  }
  g += '<text x="' + pad + '" y="' + (y + 16) + '" font-size="10" text-anchor="middle" ' +
       'font-family="Segoe UI, Arial, sans-serif" fill="#2a2140">0</text>';
  g += '<text x="' + (W - pad) + '" y="' + (y + 16) + '" font-size="10" text-anchor="middle" ' +
       'font-family="Segoe UI, Arial, sans-serif" fill="#2a2140">1</text>';
  for (i = 0; i < marks.length; i++) {
    var mx = pad + marks[i] * u;
    g += '<polygon points="' + mx.toFixed(1) + ',' + (y - 6) + ' ' + (mx - 4).toFixed(1) +
         ',' + (y - 16) + ' ' + (mx + 4).toFixed(1) + ',' + (y - 16) + '" fill="#b91c1c"/>';
    g += '<text x="' + mx.toFixed(1) + '" y="' + (y - 20) + '" font-size="10" ' +
         'text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" fill="#b91c1c">' +
         LB[i] + '</text>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W +
         '" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>';
}

// ═════════ 1-р хуудас — Энгийн бутархайг унших, бичих ════════════════════════

// 1. «k ширхэг 1/d»-ээс тогтох бутархай (528, 529, 531, 551)

// 6. Тоон шулуун дээрх цэгүүд (535, 548, 684)

// ═════════ 2-р хуудас — Энгийн бутархайг жиших ═══════════════════════════════
// cmpSameDen / cmpOne / cmpSameNum — бүгд «A ба B» хэлбэртэй тул key-ийн орон зайг хуваана

function h303_cmpKey(an, ad, bn, bd) {
  var A = an + '/' + ad, B = bn + '/' + bd;
  return '303cmp:' + (A < B ? A + '|' + B : B + '|' + A);
}

// 1. Ижил хуваарьтай бутархайг жиших (536, 549, 553, 680, 681)
function g_303_cmpSameDen() {
  var d = pick(D303), a = rnd(1, d), b = rnd(1, d);
  if (a === b) return null;
  var lo = Math.min(a, b), hi = Math.max(a, b);
  return {
    q: '$' + t303(a, d) + '$ ба $' + t303(b, d) + '$',
    a: '$' + t303(lo, d) + ' \\lt ' + t303(hi, d) + '$ — хуваарь ижил бол хүртвэр нь их бутархай их.',
    key: h303_cmpKey(lo, d, hi, d)
  };
}

// 2. Бутархайг 1-тэй жиших (549в,г, 553д)
function g_303_cmpOne() {
  var d = pick(D303), a = rnd(1, d);
  return {
    q: '$' + t303(a, d) + '$ ба $1$',
    a: a === d ? '$' + t303(d, d) + '=1$ — хүртвэр, хуваарь тэнцүү бол $1$ болно.'
               : '$' + t303(a, d) + ' \\lt 1$ — хүртвэр нь хуваариасаа бага бол $1$-ээс бага.',
    key: h303_cmpKey(a, d, 1, 1)
  };
}

// 3. Ижил хүртвэртэй бутархайг жиших (687, 688, 689)
function g_303_cmpSameNum() {
  var i = rnd(0, DA303.length - 2), j = rnd(i + 1, DA303.length - 1),
      d1 = DA303[i], d2 = DA303[j], k = rnd(1, d1);
  return {
    q: '$' + t303(k, d1) + '$ ба $' + t303(k, d2) + '$',
    a: '$' + t303(k, d1) + ' \\gt ' + t303(k, d2) +
       '$ — хүртвэр ижил бол хуваарь нь бага бутархай их (нэгжийг цөөн хуваахад хэсэг нь том).',
    key: h303_cmpKey(k, d1, k, d2)
  };
}

// 4. Өсөх эрэмбээр бичих (537, 682, 684)
function g_303_orderAsc() {
  var d = pick([5, 6, 8, 10]), all = [], i;
  for (i = 1; i <= d; i++) all.push(i);
  var s = shuffle(all).slice(0, 4), useOne = rnd(0, 1) === 1;
  var asc = s.slice().sort(function (x, y) { return x - y; });
  var same = true;
  for (i = 0; i < 4; i++) if (s[i] !== asc[i]) { same = false; break; }
  if (same) return null;
  function wr(arr) {
    return arr.map(function (n) { return useOne ? t303one(n, d) : t303(n, d); }).join(';\\ \\ ');
  }
  // key нь ХАРАГДАХ агуулгаар: (1) ижил олонлогийг зөвхөн дарааллаар сольсон хувилбар
  // нэг хуудсанд хоёр удаа гарч болохгүй; (2) useOne нь d ∈ s үед л харагдац сольдог тул
  // d ∉ s бол түүнийг key-д оруулбал ЯГ ИЖИЛ асуулт хоёр key-тэй болж давхардана.
  var effOne = (useOne && s.indexOf(d) >= 0) ? '1' : '0';
  return {
    q: '$' + wr(s) + '$',
    a: '$' + wr(asc) + '$ — хуваарь ижил тул хүртвэрээр нь эрэмбэлнэ.',
    key: '303oa:' + d + ':' + effOne + ':' + asc.join(',')
  };
}

// 5. Нүдэнд тохирох тоог олох (538, 685)
// Жагсаалт ганц тоотой үед «тоонуудын аль нь ч» гэж бичвэл хэллэг буруу болно.
function h303_boxAns(list) {
  if (list.length === 1) return 'Нүдэнд зөвхөн $' + list[0] + '$ орно (нийт $1$ тоо).';
  return 'Нүдэнд $' + list.join(',\\ ') + '$ тоонуудын аль нь ч тохирно (нийт $' +
         list.length + '$ тоо).';
}
function g_303_boxIneq() {
  var d = pick(D303), v = rnd(0, 2), a, list = [], i;
  if (v === 0) {                                    // a/d < □/d
    a = rnd(1, d - 1);
    for (i = a + 1; i <= d; i++) list.push(i);
    return {
      q: '$' + t303(a, d) + ' \\lt ' + t303('\\square', d) + '$',
      a: h303_boxAns(list),
      // key нь ХАРИУНЫ жагсаалтаар: «a/d > □/d» хэлбэрт жагсаалт нь 1…a−1 буюу d-ээс
      // ХАМААРАХГҮЙ тул өөр хуваарьтай хоёр бодлого ЯГ ИЖИЛ хариутай гарч болно.
      key: '303bi:' + list.join(',')
    };
  }
  if (v === 1) {                                    // a/d > □/d
    a = rnd(2, d);
    for (i = 1; i < a; i++) list.push(i);
    return {
      q: '$' + t303(a, d) + ' \\gt ' + t303('\\square', d) + '$',
      a: h303_boxAns(list),
      key: '303bi:' + list.join(',')        // ижил хариут хувилбарууд нэг key-тэй
    };
  }
  return {                                          // □/d = 1
    q: '$' + t303('\\square', d) + '=1$',
    a: 'Нүдэнд $' + d + '$ орно: $' + t303(d, d) + '=1$. Өөр тоо тохирохгүй.',
    key: '303bi:2:' + d
  };
}

// 6. Зүй тогтол — дараагийн 2 тоо (539)
function g_303_pattern() {
  var d = pick([5, 6, 8, 10]), s = pick([1, 1, 2]), up = rnd(0, 1) === 1, a0, i, t = [];
  if (up) { if (d - 4 * s < 1) return null; a0 = rnd(1, d - 4 * s); }
  else     { if (1 + 4 * s > d) return null; a0 = rnd(1 + 4 * s, d); }
  for (i = 0; i < 5; i++) t.push(a0 + (up ? 1 : -1) * s * i);
  return {
    q: '$' + t303(t[0], d) + ';\\ \\ ' + t303(t[1], d) + ';\\ \\ ' + t303(t[2], d) +
       ';\\ \\ \\square;\\ \\ \\square$',
    a: '$' + t303(t[3], d) + ';\\ \\ ' + t303(t[4], d) + '$ — тоо бүр $' + t303(s, d) +
       '$-ээр ' + (up ? 'нэмэгдэж' : 'багасаж') + ' байна.',
    key: '303pt:' + d + ':' + t[0] + ':' + (up ? '+' : '-') + s
  };
}

// ═════════ 3-р хуудас — Энгийн бутархайг нэмэх, хасах ════════════════════════

// 1. Нэмэх (541, 550)
function g_303_addSame() {
  var d = pick(D303), a = rnd(1, d - 1), b = rnd(1, d - a);
  var lo = Math.min(a, b), hi = Math.max(a, b);
  return {
    q: '$' + t303(a, d) + '+' + t303(b, d) + '$',
    a: '$' + t303(a, d) + '+' + t303(b, d) + '=' + t303(a + b, d) +
       (a + b === d ? '=1' : '') + '$',
    // a+b=d бол энэ нь «a/d + □ = 1» (g_303_oneOps v=1)-тэй ИЖИЛ факт тул нэг орон зайд
    key: (a + b === d) ? '303cpl:' + lo + '/' + d : '303as:' + lo + '+' + hi + '/' + d
  };
}

// 2. Хасах (541, 550)
function g_303_subSame() {
  var d = pick(D303), a = rnd(2, d), b = rnd(1, a - 1);
  return {
    q: '$' + t303(a, d) + '-' + t303(b, d) + '$',
    a: '$' + t303(a, d) + '-' + t303(b, d) + '=' + t303(a - b, d) + '$',
    // a=d бол «d/d − b/d» нь «1 − b/d» (g_303_oneOps v=0)-тэй ИЖИЛ бодолт тул нэг орон зайд
    key: (a === d) ? '303m1:' + b + '/' + d : '303ss:' + a + '-' + b + '/' + d
  };
}

// 3. 1-тэй холбоотой үйлдэл (550г,е, 542в)
function g_303_oneOps() {
  var d = pick(D303), a = rnd(1, d - 1), v = rnd(0, 1);
  if (v === 0) return {
    q: '$1-' + t303(a, d) + '$',
    a: '$1=' + t303(d, d) + '$ тул $' + t303(d, d) + '-' + t303(a, d) + '=' +
       t303(d - a, d) + '$',
    key: '303m1:' + a + '/' + d          // subSame-ийн a=d тохиолдолтой нэг орон зай
  };
  return {
    q: '$' + t303(a, d) + '+\\square=1$',
    a: '$\\square=' + t303(d - a, d) + '$, учир нь $' + t303(a, d) + '+' + t303(d - a, d) +
       '=' + t303(d, d) + '=1$',
    key: '303cpl:' + Math.min(a, d - a) + '/' + d   // addSame-ийн a+b=d тохиолдолтой нэг орон зай
  };
}

// 4. Нүдэнд тохирох хүртвэрийг олох (538, 541)
function g_303_missing() {
  var d = pick(D303), c = rnd(2, d), a = rnd(1, c - 1), v = rnd(0, 1);
  if (v === 0) return {
    q: '$' + t303(a, d) + '+' + t303('\\square', d) + '=' + t303(c, d) + '$',
    a: '$\\square=' + (c - a) + '$, учир нь $' + t303(a, d) + '+' + t303(c - a, d) + '=' +
       t303(c, d) + '$',
    key: '303ms:0:' + a + '/' + c + '/' + d
  };
  return {
    q: '$' + t303(c, d) + '-' + t303('\\square', d) + '=' + t303(a, d) + '$',
    a: '$\\square=' + (c - a) + '$, учир нь $' + t303(c, d) + '-' + t303(c - a, d) + '=' +
       t303(a, d) + '$',
    key: '303ms:1:' + a + '/' + c + '/' + d
  };
}

// 5. Савны шингэний бодлого (540, 542, 543)
var DR303 = [['цай', 'уув'], ['сүү', 'уув'], ['жимсний шүүс', 'уув'], ['ус', 'хэрэглэв']];
function g_303_wDrink() {
  var d = pick([4, 5, 6, 8, 10]), v = rnd(0, 2), nm = pick(NM303), it = pick(DR303);
  if (v === 0) {
    // a=d бол «Саванд 8/8 л цай байв» гэж бичигдэх тул ЗОХИОМОЛ БУС бутархайгаар л авна
    var a = rnd(2, d - 1), b = rnd(1, a - 1);
    return {
      q: 'Саванд $' + t303(a, d) + '$ л ' + it[0] + ' байв. ' + nm + ' $' + t303(b, d) +
         '$ л-ийг нь ' + it[1] + '. Саванд хэдэн литр ' + it[0] + ' үлдсэн бэ?',
      a: '$' + t303(a, d) + '-' + t303(b, d) + '=' + t303(a - b, d) + '$ (л). Хариу: $' +
         t303(a - b, d) + '$ л.',
      // subSame-тай ижил ялгавар гарахгүй байх
      key: (a === d) ? '303m1:' + b + '/' + d : '303ss:' + a + '-' + b + '/' + d
    };
  }
  if (v === 1) {
    var p = rnd(1, d - 1), q2 = rnd(1, d - p);
    return {
      q: 'Нэг саванд $' + t303(p, d) + '$ л, нөгөө саванд $' + t303(q2, d) + '$ л ' + it[0] +
         ' байна. Хоёр саванд нийт хэдэн литр ' + it[0] + ' байна вэ?',
      a: '$' + t303(p, d) + '+' + t303(q2, d) + '=' + t303(p + q2, d) + '$ (л). Хариу: $' +
         t303(p + q2, d) + '$ л' + (p + q2 === d ? ' буюу $1$ л' : '') + '.',
      // wTwoStep-ийн 1-р алхамтай ижил нийлбэр тул нэг орон зайд
      // addSame / wTwoStep-тай ижил нийлбэр гарахгүй байх
      key: (p + q2 === d) ? '303cpl:' + Math.min(p, q2) + '/' + d
                          : '303as:' + Math.min(p, q2) + '+' + Math.max(p, q2) + '/' + d
    };
  }
  var c = rnd(1, d - 1);
  return {
    q: '$1$ л багтаамжтай саванд $' + t303(c, d) + '$ л ус байна. Савыг дүүргэхэд хэдэн литр ус нэмэх вэ?',
    a: '$1-' + t303(c, d) + '=' + t303(d, d) + '-' + t303(c, d) + '=' + t303(d - c, d) +
       '$ (л). Хариу: $' + t303(d - c, d) + '$ л.',
    key: '303m1:' + c + '/' + d          // «1 − c/d» нь oneOps v0 / subSame(a=d)-тэй ижил
  };
}

// 6. Хоёр хэсгийг нэмээд үлдсэнийг олох (683, 686, 546)
var TS303 = [
  ['Бялууг тэнцүү хэсэгт хуваав. ', 'идэв', 'Бялууны хэдэн хэсэг үлдсэн бэ?'],
  ['Талхыг тэнцүү хэсэгт хуваав. ', 'идэв', 'Талхны хэдэн хэсэг үлдсэн бэ?'],
  ['Ногооны талбайг нэг бүхэл гэж үзье. ', 'тарив', 'Талбайн хэдэн хэсэг сул үлдсэн бэ?']
];
function g_303_wTwoStep() {
  var d = pick([5, 6, 8, 10]), a = rnd(1, d - 2), b = rnd(1, d - a - 1),

  if (n1 === n2) return null;
  var who = t[1] === 'тарив'
    ? '$' + t303(a, d) + '$-д нь төмс, $' + t303(b, d) + '$-д нь лууван тарив. '
    : '$' + t303(a, d) + '$ хэсгийг ' + n1 + ', $' + t303(b, d) + '$ хэсгийг ' + n2 + ' идэв. ';

    q: t[0] + who + 'Нийт хэдэн хэсэг ' + (t[1] === 'тарив' ? 'эзэлсэн' : 'идсэн') +
       ' бэ? ' + t[2],
    a: '1) $' + t303(a, d) + '+' + t303(b, d) + '=' + t303(a + b, d) + '$<br>' +

// ── АСУУЛТЫН торноос ӨМНӨХ АЛХМЫН ҮР ДҮН-г хоосолно (хариуг урьдчилж харуулахгүй) ──
function h304_bl(html, v) {
  var s = String(v), h = String(html);
  var vlm = h.match(/<i class="vl" style="left:calc\(var\(--c\)\*(\d+)\)/);
  var cut = vlm ? +vlm[1] : Infinity;
  var re = /<span class="d" style="left:calc\(var\(--c\)\*(\d+)\);top:calc\(var\(--c\)\*(\d+)\)">(\d)<\/span>/g;
  var items = [], m, byRow = {};
  while ((m = re.exec(h))) items.push({ all: m[0], c: +m[1], r: +m[2], t: m[3] });
  items.forEach(function (x) { (byRow[x.r] = byRow[x.r] || []).push(x); });
  function side(c) { return c >= cut; }
  var kill = null;
  Object.keys(byRow).map(Number).sort(function (a, b) { return a - b; }).forEach(function (r) {
    if (kill) return;
    var ds = byRow[r].slice().sort(function (a, b) { return a.c - b.c; });
    for (var i = 0; i + s.length <= ds.length && !kill; i++) {
      var ok = true;
      for (var j = 0; j < s.length; j++) {
        if (ds[i + j].t !== s.charAt(j)) { ok = false; break; }
        if (j && (ds[i + j].c !== ds[i + j - 1].c + 1 || side(ds[i + j].c) !== side(ds[i + j - 1].c))) { ok = false; break; }
      }
      if (!ok) continue;
      var A = ds[i - 1], B = ds[i + s.length], a0 = ds[i], b0 = ds[i + s.length - 1];
      if (A && A.c === a0.c - 1 && side(A.c) === side(a0.c)) continue;
      if (B && B.c === b0.c + 1 && side(B.c) === side(b0.c)) continue;
      kill = ds.slice(i, i + s.length);
    }
  });
  if (!kill) return h;
  kill.forEach(function (x) { h = h.replace(x.all, ''); });
  return h;
}

  var S = SHP304[k], g;
  if (S.circ) {
    g = '<circle cx="60" cy="50" r="42" fill="' + C304F + '" stroke="' + C304S + '" stroke-width="1.8"/>';
  } else {
    g = '<polygon points="' + S.pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' ') +
        '" fill="' + C304F + '" stroke="' + C304S + '" stroke-width="1.8" stroke-linejoin="round"/>';
  }
  return '<svg viewBox="0 0 120 100" width="112" height="93">' + g + '</svg>';
}

// ── Тойрог: радиус эсвэл диаметр тэмдэглэсэн ──
function h304_circ(kind, label) {
  var g = '<circle cx="60" cy="52" r="42" fill="' + C304F + '" stroke="' + C304S + '" stroke-width="1.7"/>';

// ── Квадратад багтсан тойрог (тоо бичигдээгүй) ──
function h304_sqCirc() {
  var g = '<circle cx="54" cy="50" r="42" fill="' + C304F + '" stroke="' + C304S + '" stroke-width="1.7"/>';

// ── Тэгш өнцөгтөд эгнүүлсэн n тойрог (тоо бичигдээгүй) ──
function h304_rowCirc(n) {
  var R = 24, W = n * 2 * R + 8, H = 2 * R + 8, g = '', i;
  for (i = 0; i < n; i++) {
    g += '<circle cx="' + (4 + R + i * 2 * R) + '" cy="' + (4 + R) + '" r="' + R +
         '" fill="' + C304F + '" stroke="' + C304S + '" stroke-width="1.6"/>';
  }
  g += '<rect x="4" y="4" width="' + (n * 2 * R) + '" height="' + (2 * R) +
       '" fill="none" stroke="' + C304R + '" stroke-width="1.6"/>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' + g + '</svg>';
}

// ── Биетүүд ──  v: орой, e: ирмэг, f: тал
var SOL304 = {
  cube:   { nm: 'шоо (куб)', v: 8, e: 12, f: 6 },
  box1:   { nm: 'тэгш өнцөгт параллелепипед', v: 8, e: 12, f: 6 },
  box2:   { nm: 'тэгш өнцөгт параллелепипед', v: 8, e: 12, f: 6 },
  sphere: { nm: 'бөмбөрцөг', v: 0, e: 0, f: 0 },
  cyl:    { nm: 'цилиндр', v: 0, e: 0, f: 0 },
  cone:   { nm: 'конус', v: 1, e: 0, f: 0 },
  pyr4:   { nm: 'дөрвөн өнцөгт пирамид', v: 5, e: 8, f: 5 },
  pyr3:   { nm: 'гурвалжин пирамид', v: 4, e: 6, f: 4 },
  prism3: { nm: 'гурвалжин призм', v: 6, e: 9, f: 5 }
};
var SOK304 = ['cube', 'box1', 'box2', 'sphere', 'cyl', 'cone', 'pyr4', 'pyr3', 'prism3'];
var SOP304 = ['cube', 'box1', 'box2', 'pyr4', 'pyr3', 'prism3'];   // орой/ирмэгтэй биетүүд

function h304_prism(F, dx, dy) {
  // F = урд дөрвөлжингийн [зүүн, дээд, өргөн, өндөр]; (dx,dy) — ар тийш шилжилт
  var x = F[0], y = F[1], w = F[2], h = F[3];
  var A = [x, y], B = [x + w, y], C = [x + w, y + h], D = [x, y + h];
  var A2 = [x + dx, y + dy], B2 = [x + w + dx, y + dy], C2 = [x + w + dx, y + h + dy], D2 = [x + dx, y + h + dy];
  var g = h304_sil(A[0] + ',' + A[1] + ' ' + A2[0] + ',' + A2[1] + ' ' + B2[0] + ',' + B2[1] + ' ' +
                   C2[0] + ',' + C2[1] + ' ' + C[0] + ',' + C[1] + ' ' + D[0] + ',' + D[1]);
  g += h304_ln(D2[0], D2[1], A2[0], A2[1], 1);
  g += h304_ln(D2[0], D2[1], C2[0], C2[1], 1);
  g += h304_ln(D[0], D[1], D2[0], D2[1], 1);
  g += h304_ln(A[0], A[1], B[0], B[1]) + h304_ln(B[0], B[1], C[0], C[1]) +
       h304_ln(C[0], C[1], D[0], D[1]) + h304_ln(D[0], D[1], A[0], A[1]);
  g += h304_ln(A2[0], A2[1], B2[0], B2[1]) + h304_ln(B2[0], B2[1], C2[0], C2[1]);
  g += h304_ln(A[0], A[1], A2[0], A2[1]) + h304_ln(B[0], B[1], B2[0], B2[1]) +
       h304_ln(C[0], C[1], C2[0], C2[1]);
  return g;
}

function h304_sfig(k) {
  var g = '';
  if (k === 'cube') g = h304_prism([18, 34, 56, 56], 26, -22);
  else if (k === 'box1') g = h304_prism([10, 48, 76, 40], 24, -20);
  else if (k === 'box2') g = h304_prism([28, 22, 40, 70], 20, -16);
  else if (k === 'sphere') {
    g = '<circle cx="60" cy="52" r="40" fill="' + C304F + '" stroke="' + C304S + '" stroke-width="1.7"/>';
    g += '<ellipse cx="60" cy="52" rx="40" ry="13" fill="none" stroke="' + C304H +
         '" stroke-width="1.4" stroke-dasharray="4 3"/>';
    g += '<circle cx="60" cy="52" r="2.4" fill="' + C304S + '"/>';
  } else if (k === 'cyl') {
    g = '<path d="M 26 26 L 26 76 A 34 11 0 0 0 94 76 L 94 26 Z" fill="' + C304F + '" stroke="none"/>';
    g += '<path d="M 26 76 A 34 11 0 0 1 94 76" fill="none" stroke="' + C304H +
         '" stroke-width="1.5" stroke-dasharray="4 3"/>';
    g += '<path d="M 26 76 A 34 11 0 0 0 94 76" fill="none" stroke="' + C304S + '" stroke-width="1.7"/>';
    g += h304_ln(26, 26, 26, 76) + h304_ln(94, 26, 94, 76);
    g += '<ellipse cx="60" cy="26" rx="34" ry="11" fill="' + C304F + '" stroke="' + C304S + '" stroke-width="1.7"/>';
  } else if (k === 'cone') {
    g = '<path d="M 60 10 L 26 78 A 34 11 0 0 0 94 78 Z" fill="' + C304F + '" stroke="none"/>';
    g += '<path d="M 26 78 A 34 11 0 0 1 94 78" fill="none" stroke="' + C304H +
         '" stroke-width="1.5" stroke-dasharray="4 3"/>';
    g += '<path d="M 26 78 A 34 11 0 0 0 94 78" fill="none" stroke="' + C304S + '" stroke-width="1.7"/>';
    g += h304_ln(60, 10, 26, 78) + h304_ln(60, 10, 94, 78);
  } else if (k === 'pyr4') {
    g = h304_sil('60,10 106,62 74,86 14,86');
    g += h304_ln(60, 10, 46, 62, 1) + h304_ln(106, 62, 46, 62, 1) + h304_ln(46, 62, 14, 86, 1);
    g += h304_ln(60, 10, 14, 86) + h304_ln(60, 10, 74, 86) + h304_ln(60, 10, 106, 62);
    g += h304_ln(14, 86, 74, 86) + h304_ln(74, 86, 106, 62);
  } else if (k === 'pyr3') {
    g = h304_sil('56,10 100,86 12,86');
    g += h304_ln(56, 10, 64, 62, 1) + h304_ln(12, 86, 64, 62, 1) + h304_ln(100, 86, 64, 62, 1);
    g += h304_ln(56, 10, 12, 86) + h304_ln(56, 10, 100, 86) + h304_ln(12, 86, 100, 86);
  } else {   // prism3
    g = h304_sil('26,22 60,8 100,68 66,82 8,82');
    g += h304_ln(60, 8, 42, 68, 1) + h304_ln(42, 68, 100, 68, 1) + h304_ln(8, 82, 42, 68, 1);
    g += h304_ln(26, 22, 8, 82) + h304_ln(8, 82, 66, 82) + h304_ln(66, 82, 26, 22);
    g += h304_ln(26, 22, 60, 8) + h304_ln(66, 82, 100, 68) + h304_ln(60, 8, 100, 68);
  }
  return '<svg viewBox="0 0 120 100" width="112" height="93">' + g + '</svg>';
}

// 573, 574, 576, 586: радиусаар диаметрийг ол
function g_304_rToD() {
  var ty = rnd(1, 3), r, un;
  if (ty === 1) { un = 'мм'; r = rnd(125, 4800); }
  else if (ty === 2) { un = 'см'; r = rnd(12, 480); }
  else { un = 'м'; r = rnd(12, 980); }
  return {
    q: 'Радиус $r=' + nf(r) + '\\,\\text{' + un + '}$ бол диаметр $d=\\square\\,\\text{' + un + '}$',
    a: '$d=2\\times ' + nf(r) + '=' + nf(2 * r) + '\\,\\text{' + un + '}$',
    // key-д НЭГЖ оруулахгүй: «r=420 см» ба «r=420 м» нь ЯГ ижил тооцоо ($2\times 420$) тул
    // нэг хуудсан дээр хоёулаа гарч болохгүй. g_304_rSumCol ty2-той ч нэг орон зайд байна.
    key: '304rd:' + r
  };
}

// 582: диаметрээр радиусыг ол
function g_304_dToR() {
  var ty = rnd(1, 3), r, un;

  else if (ty === 2) { un = 'см'; r = rnd(12, 480); }
  else { un = 'м'; r = rnd(12, 980); }
  return {
    q: 'Диаметр $d=' + nf(2 * r) + '\\,\\text{' + un + '}$ бол радиус $r=\\square\\,\\text{' + un + '}$',
    a: '$r=' + nf(2 * r) + '\\div 2=' + nf(r) + '\\,\\text{' + un + '}$',

}

// 578, 580, 583: зурагт өгсөн хэмжээгээр нөгөөг нь ол

// 571, 584: цэг дугуйн дотор / гадна / тойрог дээр
function g_304_pointPos() {
  var r = rnd(3, 19) * 5, L = pick(['А', 'Б', 'В', 'К', 'М', 'Т', 'Е', 'Р']);
  var dmm = rnd(1, 20) * 5;
  var dtx;
  if (dmm < 10) dtx = dmm + ' мм';
  else if (dmm % 10 === 0) dtx = (dmm / 10) + ' см';
  else dtx = Math.floor(dmm / 10) + ' см ' + (dmm % 10) + ' мм';
  var pos = dmm < r ? 'дугуйн дотор' : (dmm > r ? 'дугуйн гадна' : 'тойрог дээр');
  var sg = dmm < r ? '\\lt ' : (dmm > r ? '\\gt ' : '=');
  return {
    q: 'Тойргийн радиус ' + nt(r) + ' мм. Төвөөс ' + dtx + ' зайд орших ' + L +
       ' цэг хаана байрлах вэ?',
    a: dtx + ' $=' + dmm + '\\,\\text{мм}$, $' + dmm + sg + r + '$ тул ' + L + ' цэг ' + pos + ' байна.',
    key: '304pp:' + r + '_' + dmm
  };
}

// 579, 585а: радиус, диаметрийг баганаар нэмэх / хасах
function g_304_rSumCol() {
  var ty = rnd(1, 3);
  if (ty === 1) {
    var r1 = rnd(125, 4700), r2 = rnd(125, 9900 - r1);
    if (r2 < 125) return null;
    var c1 = colAdd(r1, r2);
    return {
      q: 'Хоёр тойрог гадна талаасаа хүрэлцэн байна. Нэгнийх нь радиус ' + nt(r1) +
         ' мм, нөгөөгийнх ' + nt(r2) + ' мм. Төв хоорондын зай хэд вэ?',
      a: '$' + nf(r1) + '+' + nf(r2) + '=' + nf(r1 + r2) + '\\,\\text{мм}$',
      key: '304rc1:' + r1 + '+' + r2, col: c1.q, sol: c1.s
    };
  }
  if (ty === 2) {
    var r = rnd(125, 4800), c2 = colAdd(r, r);
    return {
      q: 'Тойргийн радиус ' + nt(r) + ' мм. Диаметр нь хэд вэ?',
      a: '$' + nf(r) + '+' + nf(r) + '=' + nf(2 * r) + '\\,\\text{мм}$',
      key: '304rd:' + r, col: c2.q, sol: c2.s   // g_304_rToD-той НЭГ орон зай (ижил тооцоо)
    };
  }
  var D = rnd(2000, 9800), d = rnd(150, D - 150);
  if (D - d === d) return null;        // зөрөө нь өгөгдсөн диаметртэй тэнцвэл хариу асуултад бэлэн болно
  var c3 = colSub(D, d);
  return {
    q: 'Том тойргийн диаметр ' + nt(D) + ' мм, жижиг тойргийнх ' + nt(d) +
       ' мм. Диаметрүүдийн зөрөө хэд вэ?',
    a: '$' + nf(D) + '-' + nf(d) + '=' + nf(D - d) + '\\,\\text{мм}$',
    key: '304rc3:' + D + '-' + d, col: c3.q, sol: c3.s
  };
}

// 579в, 585б,в: квадратад багтсан тойрог; эгнүүлсэн тойргууд
function g_304_wCircSq() {
  if (rnd(1, 2) === 1) {
    var sd = rnd(2, 15) * 2, P = 4 * sd, r = sd / 2;
    return {

         sd + '\\div 2=' + r + '\\,\\text{см}$',
      key: '304cq1:' + P
    };
  }

       d + ' см бол тэгш өнцөгтийн периметр, талбайг ол.',
    fig: h304_rowCirc(n),
    a: 'Урт $' + d + '\\times ' + n + '=' + Lg + '$ см, өргөн ' + Wd + ' см. Периметр $\\left(' +
       Lg + '+' + Wd + '\\right)\\times 2=' + P2 + '$ см, талбай $' + Lg + '\\times ' + Wd +
       '=' + S + '$ кв.см.',
    key: '304cq2:' + n + '_' + d
  };
}

  return {

       ' удаа тойрон гүйв. Нийт хэдэн метр зам туулсан бэ?',
    a: 'Нэг тойрог $' + a + '\\times 4=' + nf(P) + '$ м, нийт $' + nf(P) + '\\times ' + k +

  };
}

    };

// 705, 709: бүх ирмэгийн уртын нийлбэр
function g_304_cubeEdge() {
  var ty = rnd(1, 2), n = ty === 1 ? 12 : 6;
  var a = rnd(5, Math.min(800, Math.floor(9999 / n)));
  if (a * n > 9999) return null;
  var nm = ty === 1 ? 'Шоо' : 'Гурвалжин пирамид';
  var c = colMul(a, n);
  return {
    q: nm + ' хэлбэртэй биетийн ирмэг бүр ' + nt(a) + ' см урт. ' + nm + ' нь ' + n + ' ирмэгтэй.',
    a: '$' + nf(a) + '\\times ' + n + '=' + nf(a * n) + '\\,\\text{см}$',
    key: '304ce:' + ty + ':' + a, col: c.q, sol: c.s
  };
}

// 705б: шооны гадаргуугийн талбай
function g_304_wSurf() {
  var a = rnd(2, 12), q;
  if (rnd(1, 2) === 1) {
    q = 'Ирмэг нь ' + nt(a) + ' см урттай шоо хэлбэртэй хайрцгийн бүх талыг цаасаар бүрэв. ' +
        'Хэдэн квадрат сантиметр цаас зарцуулсан бэ?';

        'Шооны гадаргуугийн талбай хэдэн квадрат сантиметр вэ?';
  }
  var c1 = colMul(a, a), c2 = colMul(a * a, 6);
  return {
    q: q, fig: h304_sfig('cube'),
    a: 'Нэг тал $' + a + '\\times ' + a + '=' + (a * a) + '$ кв.см, бүгд $' + (a * a) +
       '\\times 6=' + nf(a * a * 6) + '$ кв.см.',
    key: '304ws:' + a,
    col: c1.q + h304_bl(c2.q, a * a), sol: c1.s + c2.s
  };
