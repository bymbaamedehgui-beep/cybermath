<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>III бүлэг — Жишиг даалгавар 1 (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.packed{display:flex;gap:20px;align-items:flex-start}
  .grid.packed .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:11px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:15px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.sm{height:12mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){var t=a%b;a=b;b=t;}return a;}
function frac(p,q){if(q<0){p=-p;q=-q;}var g=gcd(Math.abs(p),q)||1;return {p:p/g,q:q/g};}
function subf(a,b){return frac(a.p*b.q-b.p*a.q,a.q*b.q);}
function fv(f){return f.p/f.q;}
function vp(v,f){if(f.p===0)return '1';var neg=f.p<0,p=Math.abs(f.p),q=f.q,body;
  if(q===1){body=(p===1)?v:(v+'^{'+p+'}');}
  else{var whole=Math.floor(p/q),rem=p-whole*q,inside=(rem===1)?v:(v+'^{'+rem+'}'),radp=(q===2)?('\\sqrt{'+inside+'}'):('\\sqrt['+q+']{'+inside+'}');body=(whole===0)?radp:((whole===1)?(v+radp):(v+'^{'+whole+'}'+radp));}
  return neg?('\\dfrac{1}{'+body+'}'):body;}
var ORD='abcdmnpqrstuvwxyz';
function kv(v,f){var o={};o[v]=f;return o;}
function vkeys(vs){return Object.keys(vs).sort(function(a,b){return ORD.indexOf(a)-ORD.indexOf(b);});}
function varsTex(vs){var s='';vkeys(vs).forEach(function(k){var e=vs[k];if(e.p!==0)s+=vp(k,e);});return s;}
function coefVars(c,vs){var v=varsTex(vs);if(v==='')return ''+c;return (c===1?'':''+c)+v;}
function mulMon(a,b){var vv={},k;for(k in a.vars)vv[k]=a.vars[k];for(k in b.vars)vv[k]=vv[k]?{p:vv[k].p*b.vars[k].q+b.vars[k].p*vv[k].q,q:vv[k].q*b.vars[k].q}:b.vars[k];for(k in vv)vv[k]=frac(vv[k].p,vv[k].q);return {c:a.c*b.c,vars:vv};}
function monEval(m,vals){var r=m.c;for(var k in m.vars)r*=Math.pow(vals[k],fv(m.vars[k]));return r;}
function fracInputTex(f){return '\\dfrac{'+coefVars(f.num.c,f.num.vars)+'}{'+coefVars(f.den.c,f.den.vars)+'}';}
function fracAns(numM,denM){var vars={},k;for(k in numM.vars)vars[k]=1;for(k in denM.vars)vars[k]=1;var nv={},dv={};for(k in vars){var e=subf(numM.vars[k]||frac(0,1),denM.vars[k]||frac(0,1));if(e.p>0)nv[k]=e;else if(e.p<0)dv[k]=frac(-e.p,e.q);}var g=gcd(numM.c,denM.c)||1,nc=numM.c/g,dc=denM.c/g;var numT=coefVars(nc,nv),denT=coefVars(dc,dv);return {tex:(denT==='1')?numT:('\\dfrac{'+numT+'}{'+denT+'}'),eval:function(vals){var r=nc/dc,kk;for(kk in nv)r*=Math.pow(vals[kk],fv(nv[kk]));for(kk in dv)r/=Math.pow(vals[kk],fv(dv[kk]));return r;}};}
function fracIsOne(f){if(f.num.c!==f.den.c)return false;var kn=Object.keys(f.num.vars),kd=Object.keys(f.den.vars);if(kn.length!==kd.length)return false;for(var i=0;i<kn.length;i++){var k=kn[i];if(!f.den.vars[k]||f.num.vars[k].p!==f.den.vars[k].p||f.num.vars[k].q!==f.den.vars[k].q)return false;}return true;}
function monHasVar(numM,denM){var vs={},k;for(k in numM.vars)vs[k]=1;for(k in denM.vars)vs[k]=1;for(k in vs){var e=subf(numM.vars[k]||frac(0,1),denM.vars[k]||frac(0,1));if(e.p!==0)return true;}return false;}
function mkVars(n){var pool=['a','b','c','d','x','y','p','q','m','n'],vars=[],tr=0;while(vars.length<n&&tr++<60){var v=pick(pool);if(vars.indexOf(v)<0)vars.push(v);}return vars;}
function chkEq(vars,fa,fb){for(var i=0;i<4;i++){var vals={};vars.forEach(function(k){vals[k]=1.3+Math.random()*3;});var a=fa(vals);if(!isFinite(a)||Math.abs(a-fb(vals))>1e-6*Math.max(1,Math.abs(a)))return false;}return true;}
// ── полином (коэфф) ──
function pe(c,x){var r=0;for(var i=c.length-1;i>=0;i--)r=r*x+c[i];return r;}
function padd(a,b){var n=Math.max(a.length,b.length),r=[];for(var i=0;i<n;i++)r[i]=(a[i]||0)+(b[i]||0);return r;}
function psc(a,k){return a.map(function(c){return c*k;});}
function pmul(a,b){var r=[];for(var i=0;i<a.length;i++)for(var j=0;j<b.length;j++)r[i+j]=(r[i+j]||0)+a[i]*b[j];for(var k=0;k<r.length;k++)r[k]=r[k]||0;return r;}
function ptrim(a){a=a.slice();while(a.length>1&&Math.abs(a[a.length-1])<1e-7)a.pop();return a;}
function pdeg(a){return ptrim(a).length-1;}
function pdivroot(a,r){var A=a.slice().reverse(),out=[A[0]];for(var i=1;i<A.length;i++)out.push(A[i]+out[i-1]*r);out.pop();return out.reverse();}
function introots(a){a=ptrim(a);var rs=[],ch=true;while(ch&&pdeg(a)>=1){ch=false;for(var r=-15;r<=15;r++){if(pdeg(a)<1)break;if(Math.abs(pe(a,r))<1e-6){a=ptrim(pdivroot(a,r));rs.push(r);ch=true;break;}}}return {roots:rs,rest:a};}
function content(a){var g=0;a.forEach(function(c){g=gcd(g,c);});return g||1;}
function reduceFrac(num,den){var fn=introots(num),fd=introots(den),nr=fn.roots.slice(),dr=fd.roots.slice();for(var i=nr.length-1;i>=0;i--){var idx=dr.indexOf(nr[i]);if(idx>=0){dr.splice(idx,1);nr.splice(i,1);}}var np=fn.rest.slice(),dp=fd.rest.slice();nr.forEach(function(r){np=pmul(np,[-r,1]);});dr.forEach(function(r){dp=pmul(dp,[-r,1]);});var g=gcd(content(np),content(dp));if(g>1){np=psc(np,1/g);dp=psc(dp,1/g);}var dl=ptrim(dp);if(dl[dl.length-1]<0){np=psc(np,-1);dp=psc(dp,-1);}return {num:ptrim(np),den:ptrim(dp)};}
function cTex(c,v){c=ptrim(c);var out='',first=true;for(var i=c.length-1;i>=0;i--){var co=Math.round(c[i]);if(co===0)continue;var vpp=(i===0)?'':(i===1?v:v+'^{'+i+'}');var mag=Math.abs(co),t=(mag===1&&i>0)?vpp:(''+mag+vpp);if(first){out+=(co<0?'-':'')+t;first=false;}else out+=(co<0?' - ':' + ')+t;}return first?'0':out;}
function cfracTex(fr,v){var nt=cTex(fr.num,v);if(nt==='0')return '0';var dt=cTex(fr.den,v);return (dt==='1')?nt:('\\dfrac{'+nt+'}{'+dt+'}');}
function cmonTex(k,v,m){var vv=(m===0)?'':(m===1?v:v+'^{'+m+'}');if(vv==='')return ''+k;return (k===1?'':''+k)+vv;}
function monPoly(k,m){var p=[];for(var i=0;i<=m;i++)p[i]=0;p[m]=k;return p;}
function chkFr(v,evalLHS,ans){for(var i=0;i<5;i++){var x=1.7+Math.random()*4,a=evalLHS(x),b=pe(ans.num,x)/pe(ans.den,x);if(!isFinite(a)||!isFinite(b)||Math.abs(a-b)>1e-6*Math.max(1,Math.abs(a)))return false;}return true;}

// 3.1 — Товчилсон үржвэрийн томьёо (рационал илтгэгч)
function g31(){
  var v=pick(['x','y','a','b','c','m']),p=frac(1,pick([2,2,3])),k=nz(2,7),mode=pick(['diffsq','sq','sq']),e2=frac(2*p.p,p.q);
  if(mode==='diffsq'){
    var q='\\left('+vp(v,p)+' - '+k+'\\right)\\left('+vp(v,p)+' + '+k+'\\right)',a=vp(v,e2)+' - '+(k*k);
    for(var i=0;i<4;i++){var x=1.3+Math.random()*3;if(Math.abs((Math.pow(x,fv(p))-k)*(Math.pow(x,fv(p))+k)-(Math.pow(x,fv(e2))-k*k))>1e-6*Math.max(1,1))return null;}
    return {q:q,a:a,ok:true};
  }
  var s=pick([1,-1]),cross=2*k;
  var q2='\\left('+vp(v,p)+(s<0?' - ':' + ')+k+'\\right)^{2}',a2=vp(v,e2)+(s<0?' - ':' + ')+cross+vp(v,p)+' + '+(k*k);
  for(var i2=0;i2<4;i2++){var x2=1.3+Math.random()*3;if(Math.abs(Math.pow(Math.pow(x2,fv(p))+s*k,2)-(Math.pow(x2,fv(e2))+s*cross*Math.pow(x2,fv(p))+k*k))>1e-6*Math.max(1,1))return null;}
  return {q:q2,a:a2,ok:true};
}
// 3.2 — Квадрат гурван гишүүнт задлах
function g32(){
  var sq=pick([0,1,1]),v=pick(['x','y','a','b','m','z','t']),p=nz(-6,6),q=nz(-6,6);
  if(p===0||q===0)return null;var B=p+q,C=p*q,half=frac(1,2),tt=sq?vp(v,half):v,tsq=sq?vp(v,frac(1,1)):(v+'^{2}');
  var qs=tsq;if(B!==0)qs+=(B<0?' - ':' + ')+(Math.abs(B)===1?'':Math.abs(B))+tt;qs+=(C<0?' - ':' + ')+Math.abs(C);
  function bin(r){return '\\left('+tt+(r<0?' - ':' + ')+Math.abs(r)+'\\right)';}
  for(var i=0;i<4;i++){var xv=1.3+Math.random()*3,t=sq?Math.sqrt(xv):xv;if(Math.abs((t*t+B*t+C)-(t+p)*(t+q))>1e-9*Math.max(1,Math.abs(t*t+B*t+C)))return null;}
  return {q:qs,a:(p===q)?(bin(p)+'^{2}'):(bin(p)+bin(q)),ok:true};
}
// 3.3 — Моном бутархай үржүүлэх/хуваах
function g33(){
  var vars=mkVars(pick([2,2,3])),op=pick(['mul','div']);
  function mk(){var nc=pick([2,3,4,5,6,8,9]),dc=pick([2,3,4,5,6,8,9]),nn={},dd={};vars.forEach(function(v){var en=rnd(0,4),ed=rnd(0,4);if(en)nn[v]=frac(en,1);if(ed)dd[v]=frac(ed,1);});return {num:{c:nc,vars:nn},den:{c:dc,vars:dd}};}
  var f1=mk(),f2=mk();if(fracIsOne(f1)||fracIsOne(f2))return null;
  var numM,denM;if(op==='mul'){numM=mulMon(f1.num,f2.num);denM=mulMon(f1.den,f2.den);}else{numM=mulMon(f1.num,f2.den);denM=mulMon(f1.den,f2.num);}
  if(!monHasVar(numM,denM))return null;var ans=fracAns(numM,denM);
  var lhs=function(vl){var a=monEval(f1.num,vl)/monEval(f1.den,vl),b=monEval(f2.num,vl)/monEval(f2.den,vl);return op==='mul'?a*b:a/b;};
  if(!chkEq(vars,lhs,ans.eval))return null;
  return {q:fracInputTex(f1)+(op==='mul'?'\\cdot ':' : ')+fracInputTex(f2),a:ans.tex,ok:true};
}
// 3.4 — Бутархай нэмэх/хасах (моном хуваарь)
function g34(){
  var v=pick(['x','y','z','a','b','p','t']),op=pick([1,-1]),k1=pick([2,3,4,5,6]),m1=pick([1,2]),k2=pick([2,3,4,5,6,10]),m2=pick([1,2,3]);
  if(k1===k2&&m1===m2)return null;var c1=nz(1,9),c2=nz(1,9),d1=monPoly(k1,m1),d2=monPoly(k2,m2);
  var num=padd(psc(pmul([c1],d2),1),psc(pmul([c2],d1),op)),den=pmul(d1,d2),ans=reduceFrac(num,den);
  if(cfracTex(ans,v)==='0')return null;
  var q='\\dfrac{'+c1+'}{'+cmonTex(k1,v,m1)+'}'+(op<0?' - ':' + ')+'\\dfrac{'+c2+'}{'+cmonTex(k2,v,m2)+'}';
  if(!chkFr(v,function(x){return c1/pe(d1,x)+op*c2/pe(d2,x);},ans))return null;
  return {q:q,a:cfracTex(ans,v),ok:true};
}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var qs=sheet.querySelectorAll('.grid .q');for(var i=0;i<qs.length;i++){var el=qs[i].querySelector('.ql');if(el)el.textContent=(i+1)+'.';}var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var e2=as[j].querySelector('.an');if(e2)e2.textContent=(j+1)+'.';}}
function trimToFitBalanced(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<400){var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>3){bestN=n;best=s;}}if(best<0)break;var qs=grids[best].querySelectorAll('.q'),last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function packColumns(sheet){[].forEach.call(sheet.querySelectorAll('.grid'),function(g){if(g.classList.contains('packed'))return;var qs=[].slice.call(g.children).filter(function(c){return c.classList&&c.classList.contains('q');});if(qs.length<2)return;var half=Math.ceil(qs.length/2),c1=document.createElement('div'),c2=document.createElement('div');c1.className='col';c2.className='col';qs.forEach(function(q,i){(i<half?c1:c2).appendChild(q);});g.appendChild(c1);g.appendChild(c2);g.classList.add('packed');});}
function build(){
  var WORK=!!window.WS_WORK;
  var S=[[],[],[],[]],seen={};window.__PROB=[];
  function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<1500){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;S[idx].push(f);c++;}}
  var per=WORK?5:11;
  fill(0,g31,per);fill(1,g32,per);fill(2,g33,per);fill(3,g34,per);
  var K=0;
  function block(arr,sec){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'" data-sec="'+sec+'"><div class="qeq"><span class="ql"></span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work sm"></div>':'')+'</div>';}).join('');}
  var b1=block(S[0],1),b2=block(S[1],2),b3=block(S[2],3),b4=block(S[3],4);
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>$'+p.f.a+'$</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>III бүлэг — Жишиг даалгавар 1</h1><div class="sub">Рационал илтгэгч · үржигдэхүүн болгон задлах · бутархай үржүүлэх · бутархай нэмэх · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$(a\\pm b)^{2}=a^{2}\\pm2ab+b^{2}$ &nbsp;·&nbsp; $x^{2}+(p+q)x+pq=(x+p)(x+q)$ &nbsp;·&nbsp; $\\dfrac{a}{b}\\cdot\\dfrac{c}{d}=\\dfrac{ac}{bd}$ &nbsp;·&nbsp; $\\dfrac{a}{c}\\pm\\dfrac{b}{c}=\\dfrac{a\\pm b}{c}$</div>'
    +'<div class="task">1. Товчилсон үржвэрийн томьёо ашиглан хялбарчил.</div>'
    +'<div class="grid" data-sec="1">'+b1+'</div>'
    +'<div class="task">2. Үржигдэхүүн болгон задал.</div>'
    +'<div class="grid" data-sec="2">'+b2+'</div>'
    +'<div class="task">3. Моном бутархайн үйлдлийг гүйцэтгэ.</div>'
    +'<div class="grid" data-sec="3">'+b3+'</div>'
    +'<div class="task">4. Бутархайг нэмж/хасаж хураа.</div>'
    +'<div class="grid" data-sec="4">'+b4+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
