<script>
// ══════════ g7core.js — 7-р ангийн нийтлэг хөдөлгүүр (бүх бүлэгт залгагдана) ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ g7ch1.js — I БҮЛЭГ. Бүхэл тоон олонлог, зэрэг, язгуур ══════════
// Сурах бичгийн 5–16 хуудасны ДАСГАЛУУДЫН хэлбэрээр зохиогдсон.
// ЗАРЧИМ: тооцооллын бодлогод q нь ЗӨВХӨН илэрхийлэл. Заавар нь plan.json дахь task.label-д ганц удаа бичигдэнэ.
// g7core.js доторх helper-үүд (rnd,nz,pick,shuffle,gcd,lcm,sgn,paren,isPrime,
// primeFactors,primeFactExp,pfTex,powClean,isqrt,icbrt,numline,venn2 ...) энэ файлын ӨМНӨ залгагдана.

// ═══════════ ЗУРГИЙН ТУСЛАХУУД (цэвэрхэн, хариу илчлэхгүй) ═══════════
// Хүснэгт: rows — мөр бүр нүдний массив. Эхний багана нь толгой.
function figTbl(rows){
 var h='<table style="border-collapse:collapse;margin:2px auto;font-size:12.5px;line-height:1.15">';
 for(var i=0;i<rows.length;i++){
  h+='<tr>';
  for(var j=0;j<rows[i].length;j++){
   var hd=(j===0);
   h+='<td style="border:1px solid #7B52EE;padding:2px 7px;text-align:center;min-width:'+(hd?22:34)+'px;height:19px;'
     +(hd?'background:#f3f0ff;font-style:italic;color:#4c2fb5;':'color:#221;')+'">'+rows[i][j]+'</td>';
  }
  h+='</tr>';
 }
 return h+'</table>';
}

// Дараалсан үйлдлийн схем: [эхлэл] →op1→ [ ] →op2→ [ ]
function figChain(start,ops){

 function cell(x,label){
  g+='<rect x="'+x+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+(label?'#f3f0ff':'#fff')+'" stroke="#7B52EE" stroke-width="1.3"/>';

 cell(bx[0],''+start); cell(bx[1],''); cell(bx[2],'');

// ═════════════════ 1.1 Тооны модул ═════════════════
// [дасгал 1] Модулыг ол.
function g_modulAbs(){
 var mag=rnd(12,999), a=pick([-1,1])*mag;
 return {q:'$|'+a+'|$', a:'$|'+a+'|='+Math.abs(a)+'$', key:'ma-'+a, nv:Math.abs(a)};
}
// [дасгал 3] Эсрэг тоог ол.
function g_modulOpp(){
 var mag=rnd(12,999), a=pick([-1,1])*mag;
 return {q:'$'+a+'$', a:'$'+a+'$ тооны эсрэг тоо нь $'+(-a)+'$', key:'mo-'+a, nv:-a};
}
// [дасгал 2] Модул нь өгөгдсөн тоо байх бүх бүхэл тоог ол.
function g_modulInverse(){
 var m=pick([rnd(2,99),rnd(100,999),rnd(1000,2999)]);
 return {q:'$|x|='+m+'$', a:'$x='+m+'$ буюу $x='+(-m)+'$', key:'mi-'+m, nv:m};
}
// [сорилт 2] Модулуудыг жиш.
function g_modulCompare(){
 var a=nz(-199,199), b=nz(-199,199);
 if(a===b) return null;
 var A=Math.abs(a), B=Math.abs(b);
 var rel=A>B?'\\gt ':(A<B?'\\lt ':'=');
 return {q:'$|'+a+'|$ ба $|'+b+'|$',
         a:'$|'+a+'|='+A+'$, $|'+b+'|='+B+'$ тул $|'+a+'|'+rel+'|'+b+'|$',

}
// [дасгал 4] Утгыг ол (үүрлэсэн модул ба эсрэг тоо).
function g_modulNested(){

 if(t==='t1'){ q='-(-'+a+')'; v=a; }
 else if(t==='t2'){ q='-|-'+a+'|'; v=-a; }
 else if(t==='t3'){ q='|-(-'+a+')|'; v=a; }
 else if(t==='t4'){ q='-\\bigl(-|-'+a+'|\\bigr)'; v=a; }
 else { q='-|'+a+'|'; v=-a; }

// [сорилт 1] Хоёр тооны хооронд орших бүхэл тооны тоог ол.

}
// [дасгал 5] Цэгүүдийг тоон шулуун дээр тэмдэглэж, хоорондох зайг ол.
function g_distanceTwoPts(){

// [дасгал 7, 10] Гурван цэгийн хос бүрийн хоорондох зай.
function g_distanceThree(){

 if(a===b||b===c||a===c) return null;
 if((a<0)+(b<0)+(c<0)<2) return null;
 var AB=Math.abs(a-b), BC=Math.abs(b-c), AC=Math.abs(a-c);
 return {q:'$A('+a+')$, $B('+b+')$, $C('+c+')$',
         a:'$|AB|=|'+a+'-'+paren(b)+'|='+AB+'$, $|BC|=|'+b+'-'+paren(c)+'|='+BC+'$, $|AC|=|'+a+'-'+paren(c)+'|='+AC+'$',
         fig:numline(-9,9), key:'d3-'+a+'-'+b+'-'+c};
}

// [дасгал 6б] Заасан завсрын бүх бүхэл тооны модулын нийлбэр.
function g_modulAbsSum(){

// [дасгал 8, сорилт 3] Илэрхийллийн утгыг ол (3 гишүүнт, том тоо).
function g_modulExpr(){
 var t=pick(['s3','md','dv']), a, b, c, v, q;
 if(t==='s3'){
  a=nz(-199,199); b=nz(-199,199); c=nz(-199,199);
  v=Math.abs(a)+Math.abs(b)-Math.abs(c);
  q='|'+a+'|+|'+b+'|-|'+c+'|';
  return {q:'$'+q+'$', a:'$'+q+'='+Math.abs(a)+'+'+Math.abs(b)+'-'+Math.abs(c)+'='+v+'$',
          key:'me-s-'+a+'-'+b+'-'+c, nv:v};
 }
 if(t==='md'){
  a=nz(-199,199); b=nz(-99,99); c=nz(-199,199);
  if(Math.abs(a)<11||Math.abs(b)<11) return null;
  v=Math.abs(a)*Math.abs(b)-Math.abs(c);
  q='|'+a+'|\\times |'+b+'|-|'+c+'|';
  return {q:'$'+q+'$', a:'$'+q+'='+Math.abs(a)+'\\times '+Math.abs(b)+'-'+Math.abs(c)+'='+v+'$',
          key:'me-m-'+a+'-'+b+'-'+c, nv:v};
 }
 var d=rnd(11,60), k=rnd(11,60), A=d*k;
 a=pick([A,-A]); b=pick([d,-d]); c=nz(-99,99);
 var q1=Math.abs(a)/Math.abs(b);
 v=q1+Math.abs(c);
 q='|'+a+'|\\div |'+b+'|+|'+c+'|';
 return {q:'$'+q+'$', a:'$'+q+'='+q1+'+'+Math.abs(c)+'='+v+'$',
         key:'me-d-'+a+'-'+b+'-'+c, nv:v};
}
// [дасгал 8в өргөтгөл] Хаалттай, олон алхамт модулын илэрхийлэл.
function g_modulExprMixed(){

 if(inner===0) return null;
 var v=inner*Math.abs(c);
 var q='\\bigl(|'+a+'|-|'+b+'|\\bigr)\\times |'+c+'|';
 return {q:'$'+q+'$', a:'$'+q+'='+paren(inner)+'\\times '+Math.abs(c)+'='+v+'$',
         key:'mem-'+a+'-'+b+'-'+c, nv:v};
}

// [дасгал 20] Хялбар аргаар гүйцэтгэ (эерэг, сөрөг гишүүдийг бүлэглэх).
function g_easyGroup(){
 var n=rnd(8,10), arr=[], i;
 for(i=0;i<n;i++) arr.push(nz(-90,90));
 var pos=arr.filter(function(x){return x>0;});

 if(pos.length<3||neg.length<3) return null;
 var sp=pos.reduce(function(s,x){return s+x;},0);
 var sn=neg.reduce(function(s,x){return s+Math.abs(x);},0);

 for(i=1;i<n;i++) q+=(arr[i]<0?'':'+')+arr[i];
 return {q:'$'+q+'$',
         a:'$('+pos.join('+')+')-('+neg.map(function(x){return Math.abs(x);}).join('+')+')='+sp+'-'+sn+'='+v+'$',
         key:'eg-'+arr.join('_'), nv:v};
}
// [дасгал 13] Зүй тогтол: зууван доторх хоёр тооны нийлбэр нь гурвалжинд бичигдэнэ.

 var val=(miss===0?a:(miss===1?b:s));

// [дасгал 18*] Блоклосон ээлжлэх нийлбэр.
function g_altBlockSum(){

// [дасгал 19*] Дундажтай холбоотой урвуу бодлого.

// [дасгал 20в] Сондгой тоонуудын урт нийлбэрийг хялбар аргаар.
function g_sumRangeInt(){

 if(hi<=-lo+2) return null;

 if(t==='mul'){

 }

// [дасгал 22ж, 31б] Хэд хэдэн үржигдэхүүн (тэмдгийн дүрэм).
function g_signParity(){

// [дасгал 24] □-ийн оронд тохирох бүхэл тоог ол.
function g_unknownFactor(){

 } else {

// [дасгал 25] □×□=n байх БҮХ бүхэл хосыг ол.
function g_boxAllPairs(){
 var n=pick([12,15,18,20,24,28,-12,-15,-18,-20,-24,-28]);
 var N=Math.abs(n), out=[], d, e;
 for(d=1;d*d<=N;d++){
  if(N%d) continue;
  e=N/d;
  if(n>0){ out.push('$'+d+'\\cdot '+e+'$'); out.push('$'+paren(-d)+'\\cdot '+paren(-e)+'$'); }
  else { out.push('$'+paren(-d)+'\\cdot '+e+'$'); out.push('$'+d+'\\cdot '+paren(-e)+'$'); }
 }
 return {q:'$\\square\\cdot \\square='+n+'$', a:out.join(';  ')+' — нийт $'+out.length+'$ хос',
         key:'bap-'+n, nv:out.length};
}
// [дасгал 27] Хүснэгтийг нөх: a·b = P.
function g_prodTableFill(){
 var P=pick([-810,-720,720,-360,540,-504,600,-900,840,-840]);
 var N=Math.abs(P), divs=[], d, i;
 for(d=1;d<=N;d++) if(N%d===0) divs.push(d);
 var chosen=shuffle(divs).slice(0,6);
 if(chosen.length<6) return null;
 var as=[], bs=[];
 for(i=0;i<6;i++){ var s=pick([-1,1]); as.push(s*chosen[i]); bs.push(P/(s*chosen[i])); }
 var row1=['a'], row2=['b'], pairs=[];
 for(i=0;i<6;i++){ row1.push(as[i]); row2.push(''); pairs.push('$'+as[i]+'\\to '+bs[i]+'$'); }
 return {q:'$a\\cdot b='+P+'$', fig:figTbl([row1,row2]), a:pairs.join(';  '),
         key:'ptf-'+P+'-'+as.join('_'), nv:P};
}
// [дасгал 26] Үржвэр нь хамгийн их / хамгийн бага байх хос тоо.
function g_extremeProduct(){
 var arr=[], seen={}, v, i, j;
 while(arr.length<7){ v=rnd(-60,60); if(seen[v]) continue; seen[v]=1; arr.push(v); }
 var neg=arr.filter(function(x){return x<0;}), pos=arr.filter(function(x){return x>0;});
 if(neg.length<2||pos.length<2) return null;
 var maxV=null, maxP=null, minV=null, minP=null;
 for(i=0;i<arr.length;i++) for(j=i+1;j<arr.length;j++){
  var pr=arr[i]*arr[j];
  if(maxV===null||pr>maxV){ maxV=pr; maxP=[arr[i],arr[j]]; }
  if(minV===null||pr<minV){ minV=pr; minP=[arr[i],arr[j]]; }
 }
 return {q:'$'+arr.join(';\\ ')+'$',
         a:'Хамгийн их: $'+paren(maxP[0])+'\\cdot '+paren(maxP[1])+'='+maxV+'$. Хамгийн бага: $'
           +paren(minP[0])+'\\cdot '+paren(minP[1])+'='+minV+'$.',
         key:'ep-'+arr.join('_'), nv:maxV};
}
// [дасгал 28] Үржвэрийн пирамид: дээд нүд нь доорх хоёр нүдний үржвэр.
function g_prodPyramid(){
 var b0=nz(-9,9), b1=nz(-9,9), b2=nz(-9,9);
 if(Math.abs(b0)<2||Math.abs(b1)<2||Math.abs(b2)<2) return null;

// [дасгал 50] Задаргаа анхны тоон үржигдэхүүн мөн эсэхийг шалга.
function g_fixFactorization(){

// [дасгал 52] Задалж ХИЕХ, ХБЕХ-ийг ол.
function g_gcdLcmTwo(){
 var a=rnd(24,300), b=rnd(24,300);
 if(a===b) return null;
 var fa=primeFactors(a), fb=primeFactors(b);

         key:'gl-'+a+'-'+b, nv:g};
}
// [дасгал 55] Задаргаа хэлбэрээр өгөгдсөн тоонууд.
function g_gcdLcmFactored(){
 var primes=[2,3,5,7], ea=[], eb=[], i;
 for(i=0;i<4;i++){ ea.push(rnd(0,3)); eb.push(rnd(0,3)); }
 if(ea.reduce(function(s,x){return s+x;},0)===0) return null;
 if(eb.reduce(function(s,x){return s+x;},0)===0) return null;
 function tex(ex){ var out=[], j; for(j=0;j<4;j++) if(ex[j]>0) out.push(powClean(primes[j],ex[j])); return out.length?out.join('\\times '):'1'; }
 function val(ex){ var v=1, j; for(j=0;j<4;j++) v*=Math.pow(primes[j],ex[j]); return v; }
 var A=val(ea), B=val(eb);
 if(A===B) return null;
 var gE=[], lE=[];
 for(i=0;i<4;i++){ gE.push(Math.min(ea[i],eb[i])); lE.push(Math.max(ea[i],eb[i])); }
 return {q:'$'+tex(ea)+'$ ба $'+tex(eb)+'$',
         a:'ХИЕХ$='+tex(gE)+'='+val(gE)+'$, ХБЕХ$='+tex(lE)+'='+val(lE)+'$.',
         key:'glf-'+ea.join('')+'-'+eb.join(''), nv:val(gE)};
}
// [дасгал 48, 49] Эйлер-Веннийн диаграммаар дүрсэл.
function g_gcdLcmVenn(){
 var a=rnd(12,120), b=rnd(12,120);
 if(a===b) return null;
 var fa=primeFactors(a), fb=primeFactors(b);
 if(fa.length<2||fb.length<2) return null;
 if(fa[fa.length-1]>13||fb[fb.length-1]>13) return null;
 var g=gcd(a,b);
 if(g===1) return null;
 return {q:'$'+a+'$ ба $'+b+'$', fig:venn2(''+a,''+b),
         a:'$'+a+'='+pfTex(a)+'$, $'+b+'='+pfTex(b)+'$. Огтлолцолд нийтлэг үржигдэхүүн: ХИЕХ$='+g
           +'$. Нийт талбайн үржвэр: ХБЕХ$='+lcm(a,b)+'$.',
         key:'glv-'+a+'-'+b, nv:g};
}
// [сорилт 11в] Гурван тооны ХИЕХ, ХБЕХ.
function g_gcdLcmThree(){
 var a=rnd(8,72), b=rnd(8,72), c=rnd(8,72);
 if(a===b||b===c||a===c) return null;
 var g=gcd(gcd(a,b),c), l=lcm(lcm(a,b),c);
 if(g===1||l>6000) return null;
 return {q:'$'+a+'$, $'+b+'$, $'+c+'$',
         a:'$'+a+'='+pfTex(a)+'$, $'+b+'='+pfTex(b)+'$, $'+c+'='+pfTex(c)+'$. ХИЕХ$='+g+'$, ХБЕХ$='+l+'$.',
         key:'gl3-'+a+'-'+b+'-'+c, nv:g};
}
// [дасгал 59] Том тоонуудын ХИЕХ, ХБЕХ.
function g_gcdLcmBig(){
 var a=rnd(300,3600), b=rnd(300,3600);
 if(a===b) return null;
 var fa=primeFactors(a), fb=primeFactors(b);
 if(fa.length<3||fb.length<3) return null;
 if(fa[fa.length-1]>19||fb[fb.length-1]>19) return null;
 var g=gcd(a,b);
 if(g<2) return null;
 var l=lcm(a,b);
 return {q:'$'+a+'$ ба $'+b+'$',
         a:'$'+a+'='+pfTex(a)+'$, $'+b+'='+pfTex(b)+'$. ХИЕХ$='+g+'$, ХБЕХ$='+l+'$.',
         key:'glb-'+a+'-'+b, nv:l};
}
// [дасгал 51 өргөтгөл] ХИЕХ·ХБЕХ = a·b (урвуу бодлого).
function g_gcdLcmInverse(){
 var g=rnd(2,30), m=rnd(2,17), n=rnd(2,17);
 if(m===n||gcd(m,n)!==1) return null;
 var a=g*m, b=g*n, l=g*m*n;
 return {q:'ХИЕХ$='+g+'$, ХБЕХ$='+l+'$, $a='+a+'$',
         a:'ХИЕХ$\\cdot$ХБЕХ$=a\\cdot b$ тул $b=\\dfrac{'+g+'\\cdot '+l+'}{'+a+'}='+b+'$',
         key:'gli-'+g+'-'+m+'-'+n, nv:b};
}
// [дасгал 58] Тойрог замын бодлого (ХБЕХ).
function g_wordLcm(){
 var p1=rnd(2,12), p2=rnd(2,12), p3=rnd(2,12);
 if(p1===p2||p2===p3||p1===p3) return null;
 var ans=lcm(lcm(p1,p2),p3);
 if(ans>2000) return null;
 var t=pick(['track','rest']), q, unit;
 if(t==='track'){
  unit='минут';
  q='Гурван машин тойрог замаар уралдав. Ногоон машин '+p1+' минутад, цэнхэр машин '+p2+' минутад, улаан машин '
    +p3+' минутад тойргийг нэг бүтэн туулна. Хэдэн минутын дараа гурвуулаа гарааны шугам дээр зэрэг байх вэ?';
 } else {
  unit='хоног';
  q='Гурван ажилтан тус бүр '+p1+', '+p2+', '+p3+' хоног тутам нэг удаа амардаг. Өнөөдөр гурвуулаа зэрэг амарсан бол хамгийн багадаа хэдэн хоногийн дараа дахин зэрэг амрах вэ?';
 }
 return {q:q, a:'ХБЕХ$('+p1+','+p2+','+p3+')='+ans+'$ '+unit, key:'wl-'+t+'-'+p1+'-'+p2+'-'+p3, nv:ans};
}
// [Жишээ 10] Ижил бүрэлдэхүүнтэй багт хуваах (ХИЕХ).
function g_wordGcd(){
 var g=rnd(8,60), b=rnd(8,60);
 var G=gcd(g,b);
 if(G<3||g===b) return null;
 return {q:'Ангид '+g+' эмэгтэй, '+b+' эрэгтэй сурагч байв. Баг бүр ижил бүрэлдэхүүнтэй байхаар хамгийн олондоо хэдэн багт хуваах вэ? Нэг багт хэдэн эмэгтэй, эрэгтэй орох вэ?',
         a:'ХИЕХ$('+g+','+b+')='+G+'$ баг. Нэг багт '+(g/G)+' эмэгтэй, '+(b/G)+' эрэгтэй орно.',
         key:'wg-'+g+'-'+b, nv:G};
}
// [дасгал 57] Хөлийн мөрийн давхцал.
function g_wordJumps(){
 var p=rnd(2,7), q=rnd(2,9);
 if(p===q||gcd(p,q)!==1) return null;
 var L=lcm(p,q), D=L*rnd(8,30);
 var cnt=D/L;
 return {q:'Туулай нэг харайхад '+p+' м, чоно нэг харайхад '+q+' м харайдаг. '+D
          +' метр зайд тэдний хөлийн мөр хэдэн удаа давхцах вэ?',
         a:'ХБЕХ$('+p+','+q+')='+L+'$ м тутамд давхцана. $'+D+'\\div '+L+'='+cnt+'$ удаа.',
         key:'wj-'+p+'-'+q+'-'+D, nv:cnt};
}
// [дасгал 61*] Ажлын хуваарийн давхцал (шилжилттэй).
function g_wordWorkRest(){
 var c1=rnd(4,10), c2=rnd(3,9), T1=c1+1, T2=c2+1;
 if(T1===T2) return null;
 var off=rnd(1,Math.min(3,T2-1)), d=-1, x;
 for(x=1;x<=30000;x++){ if(x%T1===0 && (x-off)%T2===0){ d=x; break; } }
 if(d<0) return null;
 var n1=pick(['Бат','Дорж','Тэмүүлэн']), n2=pick(['Цэцэг','Сараа','Ану']);
 return {q:n1+', '+n2+' хоёр хамт үйлдвэрт ажилладаг. '+n1+' '+c1+' хоног ажиллаад 1 хоног амардаг, '+n2+' '+c2
          +' хоног ажиллаад 1 хоног амардаг. Өнөөдөр '+n1+' амарч байгаа бөгөөд '+off+' хоногийн дараа '+n2
          +' амарна. Хамгийн багадаа хэдэн өдрийн дараа тэд зэрэг амрах вэ?',
         a:'$x$ нь $'+T1+'$-д хуваагдаж, $x-'+off+'$ нь $'+T2+'$-д хуваагдана. Эндээс $x='+d+'$ хоног.',
         key:'wwr-'+c1+'-'+c2+'-'+off, nv:d};
}
var WSPEC={"title":"Тооны модул-3","sub":"Жиших, эрэмбэлэх, модулын муж · I бүлэг · 7-р анги","rule":"<b>Санамж:</b> Тоолын эхээс $A(a)$ цэг хүртэлх зайг $a$ тооны <b>модул</b> гээд $|a|$ гэж тэмдэглэнэ. Модул ямагт сөрөг биш: $|a|\\ge 0$, мөн $|-a|=|a|$. Тоон шулуун дээрх $A(a)$ ба $B(b)$ цэгийн хоорондох зай $AB=|a-b|$ (их тооноос багыг хасна).","ref":"","tasks":[{"label":"Модулуудыг жиш.","fn":"g_modulCompare","cap":7,"cols":3,"wk":9},{"label":"Өсөх эрэмбээр жагсаа.","fn":"g_modulOrder","cap":5,"cols":2,"wk":12},{"label":"Нөхцөлийг хангах бүх бүхэл тоог жагсаа.","fn":"g_modulRange","cap":4,"cols":2,"wk":12},{"label":"Заасан завсрын бүх бүхэл тооны модулын нийлбэрийг ол.","fn":"g_modulAbsSum","cap":3,"cols":2,"wk":14},{"label":"Илэрхийллийн утгыг ол.","fn":"g_modulExpr","cap":3,"cols":2,"wk":14}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
