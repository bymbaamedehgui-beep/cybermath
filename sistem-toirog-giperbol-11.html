<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тойрог, гипербол ба шулууны харилцан байршил (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:17px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:12.5px;flex:1}
  .plw{display:flex;gap:10px;align-items:flex-start;margin-top:5px}
  .wk{flex:1;border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);min-height:52mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:10px;font-size:12px}.ans-grid .a{padding-bottom:9px;border-bottom:1px dotted #e6e0f5;overflow:hidden}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  .ans-grid .a svg{float:right;margin:0 0 4px 10px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function lineTex(m,k){var t;if(m===0)t='y='+k;else{t='y='+(m===1?'x':m===-1?'-x':m+'x');if(k>0)t+='+'+k;else if(k<0)t+='-'+(-k);}return t;}
function parabTex(p,q){var t='y=x^2';if(p===1)t+='+x';else if(p===-1)t+='-x';else if(p>0)t+='+'+p+'x';else if(p<0)t+='-'+(-p)+'x';if(q>0)t+='+'+q;else if(q<0)t+='-'+(-q);return t;}
function qform(B,C){var t='x^2';if(B===1)t+='+x';else if(B===-1)t+='-x';else if(B>0)t+='+'+B+'x';else if(B<0)t+='-'+(-B)+'x';if(C>0)t+='+'+C;else if(C<0)t+='-'+(-C);return t;}
// ── Координатын хавтгайд муруй+шулуун зурах ──
function plane(curves,pts,win){var W=196,H=182,pad=6;var xlo=win.xlo,xhi=win.xhi,ylo=win.ylo,yhi=win.yhi;
  var ux=(W-2*pad)/(xhi-xlo),uy=(H-2*pad)/(yhi-ylo);
  function PX(x){return pad+(x-xlo)*ux;}function PY(y){return pad+(yhi-y)*uy;}
  var xstep=(xhi-xlo>16)?2:1,ystep=(yhi-ylo>16)?2:1;
  function fx(f){var d='',pen=false,N=140;for(var i=0;i<=N;i++){var x=xlo+(xhi-xlo)*i/N,y=f(x);if(!isFinite(y)||y<ylo-1||y>yhi+1){pen=false;continue;}d+=(pen?'L':'M')+PX(x).toFixed(1)+' '+PY(y).toFixed(1)+' ';pen=true;}return d;}
  var g='';
  for(var gx=Math.ceil(xlo/xstep)*xstep;gx<=xhi+0.01;gx+=xstep)g+='<line x1="'+PX(gx).toFixed(1)+'" y1="0" x2="'+PX(gx).toFixed(1)+'" y2="'+H+'" stroke="#eef" stroke-width="1"/>';
  for(var gy=Math.ceil(ylo/ystep)*ystep;gy<=yhi+0.01;gy+=ystep)g+='<line x1="0" y1="'+PY(gy).toFixed(1)+'" x2="'+W+'" y2="'+PY(gy).toFixed(1)+'" stroke="#eef" stroke-width="1"/>';
  var y0=PY(0),x0=PX(0);
  g+='<line x1="0" y1="'+y0.toFixed(1)+'" x2="'+W+'" y2="'+y0.toFixed(1)+'" stroke="#888" stroke-width="1.2"/><line x1="'+x0.toFixed(1)+'" y1="0" x2="'+x0.toFixed(1)+'" y2="'+H+'" stroke="#888" stroke-width="1.2"/>';
  for(var tx=Math.ceil(xlo/xstep)*xstep;tx<=xhi+0.01;tx+=xstep){if(Math.round(tx)===0)continue;g+='<text x="'+PX(tx).toFixed(1)+'" y="'+(y0+8).toFixed(1)+'" font-size="6.5" fill="#b7b3ca" text-anchor="middle">'+tx+'</text>';}
  for(var ty=Math.ceil(ylo/ystep)*ystep;ty<=yhi+0.01;ty+=ystep){if(Math.round(ty)===0)continue;g+='<text x="'+(x0-3).toFixed(1)+'" y="'+(PY(ty)+2.4).toFixed(1)+'" font-size="6.5" fill="#b7b3ca" text-anchor="end">'+ty+'</text>';}
  curves.forEach(function(c){var col=c.color||'#16a34a';
    if(c.parab)g+='<path d="'+fx(function(x){return x*x+c.parab.p*x+(c.parab.q||0);})+'" fill="none" stroke="'+col+'" stroke-width="1.7"/>';
    else if(c.line)g+='<path d="'+fx(function(x){return c.line.m*x+c.line.k;})+'" fill="none" stroke="'+(c.color||'#2563eb')+'" stroke-width="1.7"/>';
    else if(c.vline!=null)g+='<line x1="'+PX(c.vline).toFixed(1)+'" y1="0" x2="'+PX(c.vline).toFixed(1)+'" y2="'+H+'" stroke="'+(c.color||'#2563eb')+'" stroke-width="1.7"/>';
    else if(c.circle)g+='<ellipse cx="'+x0.toFixed(1)+'" cy="'+y0.toFixed(1)+'" rx="'+(c.circle*ux).toFixed(1)+'" ry="'+(c.circle*uy).toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="1.7"/>';
    else if(c.hyper)g+='<path d="'+fx(function(x){return c.hyper/x;})+'" fill="none" stroke="'+col+'" stroke-width="1.7"/>';});
  (pts||[]).forEach(function(pt){g+='<circle cx="'+PX(pt.x).toFixed(1)+'" cy="'+PY(pt.y).toFixed(1)+'" r="2.9" fill="#dc2626"/>';});
  g+='<text x="'+(W-6)+'" y="'+(y0-4).toFixed(1)+'" font-size="8" fill="#999" font-style="italic">x</text><text x="'+(x0+4).toFixed(1)+'" y="10" font-size="8" fill="#999" font-style="italic">y</text>';
  return '<svg width="'+W+'" height="'+H+'" style="flex-shrink:0;border:1px solid #ece7fb;border-radius:6px;background:#fff">'+g+'</svg>';}
function winFor(xs,ys){var xlo=Math.floor(Math.min.apply(null,xs.concat([0]))-1.5),xhi=Math.ceil(Math.max.apply(null,xs.concat([0]))+1.5);
  var ylo=Math.floor(Math.min.apply(null,ys.concat([0]))-1.5),yhi=Math.ceil(Math.max.apply(null,ys.concat([0]))+1.5);
  if(xhi-xlo<8){var e=8-(xhi-xlo);xlo-=Math.ceil(e/2);xhi+=Math.floor(e/2);}
  if(yhi-ylo<8){var e2=8-(yhi-ylo);ylo-=Math.ceil(e2/2);yhi+=Math.floor(e2/2);}
  return {xlo:xlo,xhi:xhi,ylo:ylo,yhi:yhi};}
// ── Тойрог/гипербол ба шулууны тохиолдлууд (бүгд шалгагдсан) ──
var CIRC=[
 {R2:25,eq:'x+y=7',line:{m:-1,k:7},sub:'x^2+(7-x)^2=25\\Rightarrow x^2-7x+12=0',pts:[[3,4],[4,3]],pos:'two'},
 {R2:25,eq:'y=x+1',line:{m:1,k:1},sub:'x^2+(x+1)^2=25\\Rightarrow x^2+x-12=0',pts:[[3,4],[-4,-3]],pos:'two'},
 {R2:25,eq:'y=3',line:{m:0,k:3},sub:'x^2+9=25\\Rightarrow x^2=16',pts:[[4,3],[-4,3]],pos:'two'},
 {R2:25,eq:'x=4',line:{vx:4},sub:'16+y^2=25\\Rightarrow y^2=9',pts:[[4,3],[4,-3]],pos:'two'},
 {R2:20,eq:'y=2x',line:{m:2,k:0},sub:'x^2+4x^2=20\\Rightarrow x^2=4',pts:[[2,4],[-2,-4]],pos:'two'},
 {R2:25,eq:'x-y=1',line:{m:1,k:-1},sub:'x^2+(x-1)^2=25\\Rightarrow x^2-x-12=0',pts:[[4,3],[-3,-4]],pos:'two'},
 {R2:25,eq:'y=5',line:{m:0,k:5},sub:'x^2+25=25\\Rightarrow x^2=0',pts:[[0,5]],pos:'one'},
 {R2:16,eq:'x=4',line:{vx:4},sub:'16+y^2=16\\Rightarrow y^2=0',pts:[[4,0]],pos:'one'},
 {R2:25,eq:'y=7',line:{m:0,k:7},sub:'x^2+49=25\\Rightarrow x^2=-24',pts:[],pos:'none'}
];
var HYP=[
 {k:6,eq:'y=9-3x',line:{m:-3,k:9},sub:'\\dfrac{6}{x}=9-3x\\Rightarrow x^2-3x+2=0',pts:[[1,6],[2,3]],pos:'two'},
 {k:6,eq:'y=x+1',line:{m:1,k:1},sub:'\\dfrac{6}{x}=x+1\\Rightarrow x^2+x-6=0',pts:[[2,3],[-3,-2]],pos:'two'},
 {k:6,eq:'y=5-x',line:{m:-1,k:5},sub:'\\dfrac{6}{x}=5-x\\Rightarrow x^2-5x+6=0',pts:[[2,3],[3,2]],pos:'two'},
 {k:12,eq:'y=7-x',line:{m:-1,k:7},sub:'\\dfrac{12}{x}=7-x\\Rightarrow x^2-7x+12=0',pts:[[3,4],[4,3]],pos:'two'},
 {k:4,eq:'y=x',line:{m:1,k:0},sub:'\\dfrac{4}{x}=x\\Rightarrow x^2=4',pts:[[2,2],[-2,-2]],pos:'two'}
];
function ptsXY(arr){return arr.map(function(p){return {x:p[0],y:p[1]};});}
function coordStr(arr){return arr.map(function(p){return '('+p[0]+','+p[1]+')';}).join(',\\ ');}
function g_circLine(){var c=pick(CIRC);var R=Math.sqrt(c.R2);var lineObj=c.line.vx!=null?{vline:c.line.vx}:{line:{m:c.line.m,k:c.line.k}};
  var curves=[{circle:R},lineObj];var pts=ptsXY(c.pts);
  var xs=pts.map(function(P){return P.x;}).concat([R,-R,0]),ys=pts.map(function(P){return P.y;}).concat([R,-R,0]);
  var win=winFor(xs,ys);
  var q='$x^2+y^2='+c.R2+'$ тойрог ба $'+c.eq+'$ шулууны харилцан байршлыг тодорхойлж, огтлолцлын цэгийг ол.';
  var a=(c.pos==='two')?'<b>Хоёр цэгээр огтолсон.</b> $'+c.sub+'$. Цэгүүд: $'+coordStr(c.pts)+'$'
    :(c.pos==='one')?'<b>Шүргэсэн (нэг цэг).</b> $'+c.sub+'$. Цэг: $'+coordStr(c.pts)+'$'
    :'<b>Огтлолцоогүй (цэггүй).</b> $'+c.sub+'<0$ тул бодит шийдгүй.';
  return {q:q,graph:plane(curves,[],win),ans:a+' '+plane(curves,pts,win),ok:true,key:'c'+c.eq+c.R2};}
function g_hypLine(){var c=pick(HYP);var curves=[{hyper:c.k},{line:{m:c.line.m,k:c.line.k}}];var pts=ptsXY(c.pts);
  var xs=pts.map(function(P){return P.x;}).concat([0]),ys=pts.map(function(P){return P.y;}).concat([0]);
  var win=winFor(xs,ys);
  var q='$y=\\dfrac{'+c.k+'}{x}$ гипербол ба $'+c.eq+'$ шулууны харилцан байршлыг тодорхойлж, огтлолцлын цэгийг ол.';
  var a='<b>Хоёр цэгээр огтолсон.</b> $'+c.sub+'$. Цэгүүд: $'+coordStr(c.pts)+'$';
  return {q:q,graph:plane(curves,[],win),ans:a+' '+plane(curves,pts,win),ok:true,key:'h'+c.eq+c.k};}
function g_curveLine(){return pick([g_circLine,g_circLine,g_hypLine])();}
function gen(fn){for(var t=0;t<200;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө'];
function relabel(sheet){var qs=sheet.querySelectorAll('.grid .q');for(var i=0;i<qs.length;i++){var ql=qs[i].querySelector('.ql');if(ql)ql.textContent=(i+1)+'.';}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=(j+1)+'.';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<40){var qs=sheet.querySelectorAll('.grid .q');if(qs.length<=2)break;var last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var seen={},P=[],c=0,tr=0;while(c<10&&tr<600){tr++;var f=gen(g_curveLine);if(!f||seen[f.key])continue;seen[f.key]=1;P.push(f);c++;}return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());var K=0;
  var qs=S.map(function(f){var k=K++;return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div><div class="plw">'+f.graph+(WK?'<div class="wk"></div>':'')+'</div></div>';}).join('');
  var ans=S.map(function(f,i){return '<div class="a" data-k="'+i+'"><span class="an"></span>'+f.ans+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тойрог, гипербол ба шулууны харилцан байршил</h1><div class="sub">График ашиглан харилцан байршил ба огтлолцлын цэгийг ол · 11-р анги · 2.1</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule"><b>Санамж:</b> Муруй ($x^2+y^2=R^2$ тойрог, $y=\\dfrac{k}{x}$ гипербол) ба шулуун <b>2 цэгээр огтолсон</b>, <b>шүргэсэн</b> (1 цэг) эсвэл <b>цэггүй</b> байж болно. Огтлолцлын цэгийг олохдоо тэгшитгэлийн системийг <b>орлуулах аргаар</b> бодож, квадрат тэгшитгэлд шилжүүлнэ.</div>'
    +'<div class="task">График ашиглан харилцан байршлыг тодорхойлж, ерөнхий цэгийн координатыг бич.</div>'
    +'<div class="grid">'+qs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Тойрог, гипербол ба шулууны харилцан байршил';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFit(document.getElementById('sheet'),WK?1010:1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
