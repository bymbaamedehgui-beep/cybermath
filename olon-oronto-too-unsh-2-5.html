// ═══════════ ЗУРГИЙН ТУСЛАХУУД ═══════════
// Өгөгдсөн өнцгүүдээр ҮНЭН зөв байгуулсан гурвалжин. labs — орой тус бүрийн бичиглэл.
function h5_c1s16_triFig(A,B,labs){
 var C=180-A-B,r=Math.PI/180,i;
 if(A<18||B<18||C<18)return '';
 var bb=Math.sin(B*r)/Math.sin(C*r);
 var P=[[0,0],[1,0],[bb*Math.cos(A*r),bb*Math.sin(A*r)]];
 var minx=P[0][0],maxx=P[0][0],miny=P[0][1],maxy=P[0][1];
 for(i=1;i<3;i++){
  if(P[i][0]<minx)minx=P[i][0];
  if(P[i][0]>maxx)maxx=P[i][0];
  if(P[i][1]<miny)miny=P[i][1];
  if(P[i][1]>maxy)maxy=P[i][1];
 }
 var s=Math.min(150/(maxx-minx),84/(maxy-miny)),pad=14,S=[];
 for(i=0;i<3;i++)S.push([pad+(P[i][0]-minx)*s,pad+(maxy-P[i][1])*s]);
 var gx=(S[0][0]+S[1][0]+S[2][0])/3,gy=(S[0][1]+S[1][1]+S[2][1])/3;
 var pl=[];
 for(i=0;i<3;i++)pl.push(S[i][0].toFixed(1)+','+S[i][1].toFixed(1));
 var g='<polygon points="'+pl.join(' ')+'" fill="#f7f5ff" stroke="#7B52EE" stroke-width="1.5"/>';
 for(i=0;i<3;i++){
  var lx=S[i][0]+(gx-S[i][0])*0.32,ly=S[i][1]+(gy-S[i][1])*0.32+3.5;
  var isq=(labs[i]==='?');
  g+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" font-size="10.5" font-weight="'+(isq?'700':'500')+'" text-anchor="middle" fill="'+(isq?'#b91c1c':'#4c2fb5')+'">'+labs[i]+'</text>';
 }
 var VW=2*pad+(maxx-minx)*s,VH=2*pad+(maxy-miny)*s;
 return '<svg viewBox="0 0 '+VW.toFixed(1)+' '+VH.toFixed(1)+'" width="'+Math.round(Math.min(VW,190))+'">'+g+'</svg>';
}
// Зөв n өнцөгт (өнцгийн хэмжээг бичихгүй тул хариу илчлэхгүй).
// Олон талтай үед дугуйтай андуурагдах тул зөвхөн n<=12 үед зурна.
function h5_c1s16_regFig(n){
 if(n>12)return '';
 var R=42,cx=50,cy=50,pts=[],i,t;
 for(i=0;i<n;i++){
  t=-Math.PI/2+2*Math.PI*i/n+(n%2===0?Math.PI/n:0);
  pts.push((cx+R*Math.cos(t)).toFixed(1)+','+(cy+R*Math.sin(t)).toFixed(1));
 }
 return '<svg viewBox="0 0 100 100" width="96"><polygon points="'+pts.join(' ')+'" fill="#f7f5ff" stroke="#7B52EE" stroke-width="1.5"/></svg>';
}

// ═══════════ ГЕНЕРАТОРУУД ═══════════

// [дасгал 229] Гурвалжны мэдэгдэхгүй байгаа өнцгийг ол.
function g_c1s16_triThird(){
 var A=rnd(5,24)*5,B=rnd(5,24)*5,C=180-A-B;
 if(A>120||B>120)return null;
 if(C<25||C>120)return null;
 var f=h5_c1s16_triFig(A,B,[A+'°',B+'°','?']);
 if(!f)return null;
 return {q:'$'+A+'^\\circ$ ба $'+B+'^\\circ$',
  a:'$180^\\circ-'+A+'^\\circ-'+B+'^\\circ='+C+'^\\circ$',
  key:'t316-'+A+'-'+B,
  fig:f};
}
// [дасгал 230] Тэгш өнцөгт гурвалжны нөгөө хурц өнцөг.
function g_c1s16_rightTri(){
 var a=rnd(10,80);
 return {q:'нэг хурц өнцөг нь $'+a+'^\\circ$',
  a:'$180^\\circ-90^\\circ-'+a+'^\\circ='+(90-a)+'^\\circ$',
  key:'rt16-'+a};
}
// [дасгал 231] Адил хажуут гурвалжны өнцгүүд.
function g_c1s16_isoAny(){
 if(rnd(0,1)===0){
  var ap=2*rnd(10,70),base=(180-ap)/2;
  return {q:'оройн өнцөг нь $'+ap+'^\\circ$',
   a:'Суурийн хоёр өнцөг тэнцүү тул тус бүр нь $(180^\\circ-'+ap+'^\\circ)\\div 2='+base+'^\\circ$.',
   key:'iso16a-'+ap};
 }
 var b=rnd(20,80),apex=180-2*b;
 return {q:'суурийн нэг өнцөг нь $'+b+'^\\circ$',
  a:'Суурийн нөгөө өнцөг нь мөн $'+b+'^\\circ$, оройн өнцөг нь $180^\\circ-'+b+'^\\circ\\cdot 2='+apex+'^\\circ$.',
  key:'iso16b-'+b};
}
// [дасгал 232] Ийм хэмжээтэй өнцгүүд гурвалжинд байж болох уу?
function g_c1s16_triValid(){
 var A=rnd(20,110),B=rnd(20,110),C;
 if(rnd(0,1)===0){
  C=180-A-B;
  if(C<15||C>140)return null;
  return {q:'$'+A+'^\\circ$, $'+B+'^\\circ$, $'+C+'^\\circ$',
   a:'Байж болно, учир нь $'+A+'^\\circ+'+B+'^\\circ+'+C+'^\\circ=180^\\circ$.',
   key:'tv16-'+A+'-'+B+'-'+C};
 }
 C=180-A-B+pick([-30,-25,-20,-15,-10,10,15,20,25,30]);
 if(C<15||C>140)return null;
 var sum=A+B+C;
 return {q:'$'+A+'^\\circ$, $'+B+'^\\circ$, $'+C+'^\\circ$',
  a:'Байж болохгүй, учир нь $'+A+'^\\circ+'+B+'^\\circ+'+C+'^\\circ='+sum+'^\\circ$ бөгөөд $180^\\circ$-аас '+(sum>180?'их':'бага')+' байна.',
  key:'tv16-'+A+'-'+B+'-'+C};
}
// [229-ийн хүндрүүлсэн хувилбар] Нэг өнцөг ба үлдсэн хоёрын ялгавраар олох.
function g_c1s16_triDiffPair(){
 var A=2*rnd(10,50),S=180-A,d=2*rnd(2,16);
 if(S-d<30)return null;
 if((S+d)/2>130)return null;
 var big=(S+d)/2,small=(S-d)/2;
 return {q:'нэг өнцөг нь $'+A+'^\\circ$, үлдсэн хоёрын нэг нь нөгөөгөөсөө $'+d+'^\\circ$-аар их',
  a:'Үлдсэн хоёрын нийлбэр: $180^\\circ-'+A+'^\\circ='+S+'^\\circ$. Их өнцөг: $('+S+'^\\circ+'+d+'^\\circ)\\div 2='+big+'^\\circ$, бага өнцөг: $('+S+'^\\circ-'+d+'^\\circ)\\div 2='+small+'^\\circ$.',
  key:'tdp16-'+A+'-'+d};
}
// [дасгал 235, 237] Дөрвөн өнцөгтийн мэдэгдэхгүй өнцөг.
function g_c1s16_quadFourth(){
 var a=rnd(8,28)*5,b=rnd(8,28)*5,c=rnd(8,28)*5,d=360-a-b-c;
 if(d<35||d>165)return null;
 return {q:'$'+a+'^\\circ$, $'+b+'^\\circ$, $'+c+'^\\circ$',
  a:'$360^\\circ-'+a+'^\\circ-'+b+'^\\circ-'+c+'^\\circ='+d+'^\\circ$',
  key:'q416-'+a+'-'+b+'-'+c};
}
// [237-ийн ерөнхий дүгнэлт] n өнцөгтийн дотоод өнцгүүдийн нийлбэр.
function g_c1s16_polySum(){
 var n=rnd(3,15),S=(n-2)*180;
 return {q:'$'+n+'$ өнцөгт',
  a:'$('+n+'-2)\\cdot 180^\\circ='+(n-2)+'\\cdot 180^\\circ='+S+'^\\circ$',
  key:'ps16-'+n};
}
// [дасгал 233] Дэлгэмэл өнцгийн хэсэг нь хэдэн градус, ямар өнцөг вэ?
function g_c1s16_straightPart(){
 var n=pick([2,3,4,5,6,9,10,12]),m=rnd(1,n-1);
 if(gcd(m,n)!==1)return null;
 var v=180/n*m,t=(v<90?'хурц':v===90?'тэгш':'мохоо');
 return {q:'дэлгэмэл өнцгийн $\\dfrac{'+m+'}{'+n+'}$',
  a:'$180^\\circ\\div '+n+'\\cdot '+m+'='+v+'^\\circ$ — '+t+' өнцөг.',
  key:'sp16-'+m+'-'+n};
}
// [235-ийн хүндрүүлсэн хувилбар] Дөрвөн өнцөгтийн хоёр өнцөг тэнцүү.
function g_c1s16_quadTwoEq(){
 var a=rnd(9,29)*5,b=rnd(9,29)*5,rest=360-a-b;
 if(rest%2!==0)return null;
 var h=rest/2;
 if(h<35||h>160)return null;
 return {q:'хоёр өнцөг нь $'+a+'^\\circ$ ба $'+b+'^\\circ$, үлдсэн хоёр өнцөг нь хоорондоо тэнцүү',
  a:'Үлдсэн хоёрын нийлбэр: $360^\\circ-'+a+'^\\circ-'+b+'^\\circ='+rest+'^\\circ$. Тэнцүү тул тус бүр нь $'+rest+'^\\circ\\div 2='+h+'^\\circ$.',
  key:'q2e16-'+a+'-'+b};
}
// [223, 237-ийн холимог] Зөв олон өнцөгтийн нэг дотоод өнцөг.
function g_c1s16_regPolyOne(){
 var n=pick([3,4,5,6,8,9,10,12,15,18,20]),S=(n-2)*180,v=S/n;
 var r={q:'зөв $'+n+'$ өнцөгт',
  a:'Нийлбэр: $('+n+'-2)\\cdot 180^\\circ='+S+'^\\circ$. Бүх өнцөг тэнцүү тул нэг өнцөг нь $'+S+'^\\circ\\div '+n+'='+v+'^\\circ$.',
  key:'rp16-'+n};
 var f=h5_c1s16_regFig(n);
 if(f)r.fig=f;
 return r;
}
var WSPEC={"title":"Олон оронтой тоог унших, бичих-2","sub":"Унших, үгээр бичих, орон анги · I бүлэг · 5-р анги","rule":"<b>Санамж:</b> Олон оронтой тоог уншихдаа баруун талаас нь гурав гурван цифрээр ангилж, анги бүрийг нэрлэнэ: $22\\,582\\,703$ — хорин хоёр сая таван зуун наян хоёр мянга долоон зуун гурав. $1$ түм $=10\\,000$, $1$ сая $=1\\,000\\,000$ тул $835$ мянга $=835\\,000$, $4$ сая $=4\\,000\\,000$ гэж стандарт бичлэгт шилжүүлнэ. Нэг тоон дотор ижил цифр давтагдвал зүүн талынх нь орон бүрээр $10$ дахин их утгыг илэрхийлнэ.","ref":"","tasks":[{"label":"Тоог стандарт бичлэгээр бич.","fn":"g_c1s02_scaleToStd","cap":4,"cols":2,"wk":10},{"label":"Үгээр бичсэн тоог цифрээр бич.","fn":"g_c1s02_wordToNum","cap":3,"cols":1,"wk":12},{"label":"Тоог уншиж, үгээр бич.","fn":"g_c1s02_numToWord","cap":6,"cols":1,"wk":14},{"label":"Тоог орон ангийн хүснэгтэд байрлуулж, ангиудаар нь задлан бич.","fn":"g_c1s02_placeTable","cap":3,"cols":1,"wk":18},{"label":"Доогуур нь зураастай хоёр цифрийн орны утгыг олж, хэд дахин ялгаатайг тогтоо.","fn":"g_c1s02_valueTimes","cap":6,"cols":2,"wk":12}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);var solo=blocks[g].getAttribute('data-solo')==='1';if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(solo&&qs2.length===1){if(ql)ql.textContent='';map[qs2[i].getAttribute('data-k')]=gr+')';}else{if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk, solo:t.solo};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.solo?' data-solo="1"':'')+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p||t.solo){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.solo?null:t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
