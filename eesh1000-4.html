<title>ЭЕШ 1000 1-4</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/e1k.js?v=1"></script>

<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* ЭЕШ 1000 1-4 — ЭЕШ-ийн 1000 бодлого, 1-р хэсэг (76–100-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 76. kA⁻¹ ± A: A⁻¹ = adj(A)/det A. det A = d ∈ {±1, ±2, ±3, ±4}, k нь d-д хуваагдана → kA⁻¹ бүхэл.
function p76() {
  var p = rnd(1, 9), q = rnd(-3, 8), r = rnd(-3, 9), s = rnd(1, 9);
  if (!q || !r) return null;
  var d = p * s - q * r;
  if (!d || Math.abs(d) > 4) return null;
  var k = rnd(2, 8);
  if (k % d) return null;
  var e = k / d, sg = pick([1, 1, 1, -1]);
  var M = [[e * s + sg * p, -e * q + sg * q], [-e * r + sg * r, e * p + sg * s]];
  if (M.some(function (row) { return row.some(function (x) { return Math.abs(x) > 40; }); })) return null;
  var ex = k + 'A^{-1}' + (sg > 0 ? '+' : '-') + 'A';
  return {
    q: '$A=' + mat([[p, q], [r, s]]) + '$ бол $' + ex + '$ ол.',
    a: '$' + ex + '=' + mat(M) + '$',
    wk: 26,
    t: { A: [[p, q], [r, s]], k: k, sg: sg }
  };
}

// 77. f(x) = x³ + mx² + px + q, x₁ = r язгуур: f(r) = 0 → m = −(r³ + pr + q)/r²; Виет: x₁+x₂+x₃ = −m.
//     Язгуурууд r, s, t — ялгаатай бүхэл тоо (p = rs+rt+st, q = −rst).
function p77() {
  var r = pick([-3, -2, -1, 1, 2, 2, 3]), s = nz(-4, 4), t = nz(-4, 4);
  if (s === t || s === r || t === r) return null;
  var p = r * s + r * t + s * t, q = -r * s * t, S = r + s + t;
  if (!p || Math.abs(p) > 15 || Math.abs(q) > 24 || !S) return null;
  return {
    q: '$f(x)=x^3+mx^2' + tm(p, 'x') + sgn(q) + '$ олон гишүүнтийн язгуурууд нь $x_1=' + r + ';\\ x_2;\\ x_3$ бол $x_1+x_2+x_3$ нийлбэрийг олоорой.',
    a: '$x_1+x_2+x_3=' + S + '$',
    wk: 26,
    t: { r: r, p: p, q: q }
  };
}

// 78. ∫ₐᵇ(k·f(x) + αx + β)dx = k·S + α(b² − a²)/2 + β(b − a)   (эсвэл αx²: α(b³ − a³)/3).
function p78() {
  var a = pick([0, 0, 0, 0, 1, 1, -1, 2]), L = rnd(1, 4), b = a + L;
  if (b < 2 || b > 5) return null;
  var S = nz(-9, 12), k = pick([1, 1, 1, 1, 1, 2, 3, -1]), pw = pick([1, 1, 1, 2]), al = nz(-4, 4), be = rnd(-6, 6);
  var I = pw === 1 ? al * (b * b - a * a) / 2 : al * (b * b * b - a * a * a) / 3;
  if (I !== Math.round(I)) return null;
  var V = k * S + I + be * L;
  var lim = '_{' + a + '}^{' + b + '}';
  var fx = tm(k, 'f(x)', true) + tm(al, pw === 1 ? 'x' : 'x^2') + (be ? sgn(be) : '');
  return {
    q: 'Хэрэв $\\displaystyle\\int' + lim + ' f(x)\\,dx=' + S + '$ бол $\\displaystyle\\int' + lim + '\\left(' + fx + '\\right)dx$-ийн утгыг олоорой.',
    a: '$' + V + '$',
    wk: 22,
    t: { a: a, b: b, S: S, k: k, pw: pw, al: al, be: be }
  };
}

// 79. Трапецийн (параллелограммын) хажуу талд налсан хоёр өнцгийн нийлбэр 180° → тэдгээрийн биссектрисүүд
//     K цэгт 90°-аар огтлолцоно → тэр тал нь ABK гурвалжныг багтаасан тойргийн диаметр: AB = 2R.
function p79() {
  var par = rnd(0, 4) === 0, pairs, head;
  if (par) { pairs = ['AB', 'BC', 'CD', 'AD']; head = '$ABCD$ параллелограммын'; }
  else if (rnd(0, 2)) { pairs = ['AB', 'AB', 'CD']; head = '$AD,\\ BC$ суурьтай $ABCD$ трапецийн'; }
  else { pairs = ['AD', 'BC']; head = '$AB,\\ CD$ суурьтай $ABCD$ трапецийн'; }
  var sd = pick(pairs), X = sd[0], Y = sd[1], D2 = rnd(3, 18), askR = rnd(0, 3) === 0;
  var q = head + ' $' + X + '$ ба $' + Y + '$ оройн биссектрисүүдийн огтлолцлын цэг $K$ байв. ';
  if (!askR) q += '$' + sd + 'K$ гурвалжныг багтаасан тойргийн радиус $R=' + dec(D2 / 2) + '$ бол $' + sd + '$ талын уртыг ол.';
  else q += '$' + sd + '=' + D2 + '$ бол $' + sd + 'K$ гурвалжныг багтаасан тойргийн радиусыг ол.';
  return {
    q: q,
    a: askR ? '$R=' + dec(D2 / 2) + '$' : '$' + sd + '=' + D2 + '$',
    wk: 24,
    t: { par: par, bases: par ? '' : head.indexOf('AD,') >= 0 ? 'AD' : 'AB', sd: sd, askR: askR }
  };
}

// 80. f'(x)-ийн графикаас: f' нь x₀ цэгт тэмдгээ «−»-ээс «+» болгон солих тул f нь [a; x₀]-д буурч,
//     [x₀; b]-д өснө → хамгийн бага утга x = x₀ (толин хувилбар: −f', хамгийн их утга).
//     f'(x) = g(x) = x³ − 1.5(e₁+e₂)x² + 3e₁e₂x + d (экстремумууд e₁ < e₂), g(x₀) = 0;
//     x₀ нь e₂-оос баруун (эх: g(e₁), g(e₂) < 0) эсвэл e₁-ээс зүүн (g(e₁), g(e₂) > 0).
function p80_h(e1, e2) { return function (x) { return x * x * x - 1.5 * (e1 + e2) * x * x + 3 * e1 * e2 * x; }; }
function p80_inv(g, y, lo, hi) { for (var i = 0; i < 60; i++) { var m = (lo + hi) / 2; if ((g(m) - y) * (g(lo) - y) > 0) lo = m; else hi = m; } return (lo + hi) / 2; }
function p80() {
  var right = rnd(0, 2) > 0, mir = rnd(0, 2) === 0;
  var e1 = rnd(-5, 3) / 2, e2 = e1 + pick([1.5, 2, 2.5, 3]), x0, a, b;
  if (right) { x0 = e2 + pick([1.5, 2]); b = x0 + pick([0.5, 0.5, 1]); a = e1 - pick([1, 1.5, 2]); }
  else { x0 = e1 - pick([1.5, 2]); a = x0 - pick([0.5, 0.5, 1]); b = e2 + pick([1, 1.5, 2]); }
  var X = [a, e1, e2, x0, b];
  if (a > -0.5 || b < 0.5 || b - a > 7.5) return null;
  for (var i = 0; i < 5; i++) if (X[i] === 0) return null;
  var h = p80_h(e1, e2), dd = -h(x0), g0 = function (x) { return h(x) + dd; };
  var ga = g0(a), g1 = g0(e1), g2 = g0(e2), gb = g0(b), lo = Math.min(ga, g2), hi = Math.max(gb, g1), R = hi - lo;
  if (right) { if (g1 > -0.14 * R || g1 - g2 < 0.14 * R || gb < 0.14 * R || ga > -0.14 * R) return null; }
  else { if (g2 < 0.14 * R || g1 - g2 < 0.14 * R || ga > -0.14 * R || gb - g1 < 0.2 * R) return null; }
  var sg = mir ? -1 : 1, g = function (x) { return sg * g0(x); }, Y0 = mir ? -hi : lo, Y1 = mir ? -lo : hi;
  var f = Fig({ view: [a - 0.5, b + 0.6, Y0 - 0.06 * R, Y1 + 0.1 * R], free: true, w: 260, h: 220 });
  f.axes({ o: false }).ticks(X.map(function (x) { return [x, '']; }), [], { len: 3 }).curve(g, a, b, { w: 1.6 });
  [a, e1, e2, b].forEach(function (x) { var P = [x, g(x)]; f.arrow(P, [x, 0], { dash: '4 3', w: 1, h: 6 }).dot(P, { r: 2.2 }); });
  X.forEach(function (x, i) {
    var pos = i === 3 ? (right ? (mir ? 'sw' : 'nw') : (mir ? 'ne' : 'se')) : g(x) < 0 ? 'n' : 's';
    f.text([x, 0], dec(x), { pos: pos, size: 11, off: 5, halo: true });
  });
  // f'(x) шошго: эх хувилбарт x₀-ийн өмнөх өсөх хэсгийн баруун талд, нөгөөд нь сүүлийн өсөх хэсгийн зүүн талд
  var yl = right ? 0.6 * g2 : g1 + 0.6 * (gb - g1), xl = right ? p80_inv(g0, yl, e2, x0) : p80_inv(g0, yl, e2, b);
  f.raw(function (T) {   // «f′(x)»: зураасыг f-ээс бага зэрэг баруун тийш, дээш
    var x = T.X(xl) + (right ? 8 : -8), y = T.Y(sg * yl) + 4.4;
    return '<text x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" font-size="12.5" font-family="\'KaTeX_Main\',\'Times New Roman\',serif" text-anchor="' + (right ? 'start' : 'end') + '" fill="#1b1b1b">'
      + '<tspan font-style="italic">f</tspan><tspan dx="1.6" dy="-4.8" font-size="10">′</tspan><tspan dy="4.8">(</tspan><tspan font-style="italic">x</tspan>)</text>';
  });
  return {
    q: 'Зураг дээр $f(x)$ функцийн уламжлал болох $f\'(x)$ функцийн график $[' + dec(a) + ';\\,' + dec(b) + ']$ завсарт өгөв. Энэ завсрын ямар утганд $f(x)$ функц хамгийн ' + (mir ? 'их' : 'бага') + ' утгаа авах вэ?',
    a: '$x=' + dec(x0) + '$',
    fig: f.svg(), wk: 24,
    t: { g: g, a: a, b: b, mir: mir }
  };
}

// 81. n сектор, өнцгүүд a, a+d, …, a+(n−1)d — арифметик прогресс; нийлбэр n(a + ka)/2 = 360°, хамгийн том = k·a
//     → a = 720/(n(k+1)), хамгийн том ka, d = (k−1)a/(n−1). (n, k) нь a ба d бүхэл байхаар сонгогдсон.
var p81_T = [[3, 2], [4, 2], [4, 3], [4, 4], [4, 5], [4, 9], [4, 11], [5, 2], [5, 3], [5, 5], [5, 5], [5, 7], [5, 11],
  [6, 2], [6, 3], [6, 5], [6, 7], [6, 11], [9, 3], [9, 4], [9, 9], [10, 3], [10, 7]];
var p81_W = { 3: 'гурван', 4: 'дөрвөн', 5: 'таван', 6: 'зургаан', 9: 'есөн', 10: 'арван' };
function p81() {
  var nk = pick(p81_T), n = nk[0], k = nk[1], a = 720 / (n * (k + 1)), L = k * a, d = (L - a) / (n - 1);
  if (a !== Math.round(a) || d !== Math.round(d)) return null;
  var big = rnd(0, 3) > 0;
  return {
    q: 'Дугуйг өнцгүүд нь арифметик прогресс үүсгэдэг байхаар ' + p81_W[n] + ' секторт хуваажээ. Хэрэв хамгийн том секторын өнцөг нь хамгийн бага секторын өнцгөөс ' + k + ' дахин их бол хамгийн ' + (big ? 'том' : 'бага') + ' секторын өнцгийг ол.',
    a: '$' + (big ? L : a) + DEG + '$',
    wk: 26,
    t: { n: n, k: k, big: big }
  };
}

// 82. y = c·xⁿ, P(p; c·pⁿ): OAPB-ийн талбай c·pⁿ⁺¹, графикийн доорх хэсэг ∫₀ᵖ c·xⁿdx = c·pⁿ⁺¹/(n+1)
//     → доод : дээд = 1 : n. y = c·ᵐ√x бол доод хэсэг m/(m+1) → m : 1. Харьцаа c, P-ээс хамаарахгүй.
function p82() {
  var root = rnd(0, 4) === 0, c = pick([1, 1, 1, 1, 2, 3]), k, tex, lbl, u, v, cc = c > 1 ? String(c) : '';
  if (!root) { k = rnd(2, 8); tex = cc + 'x^' + k; lbl = 'y = ' + cc + 'x^' + k; u = 1; v = k; }
  else { k = pick([2, 2, 3]); tex = cc + (k === 2 ? '\\sqrt{x}' : '\\sqrt[3]{x}'); lbl = 'y = ' + cc + (k === 2 ? '√x' : '∛x'); u = k; v = 1; }
  var e = root ? 1 / k : k, F = function (x) { return x <= 0 ? 0 : Math.pow(x, e); };
  // ерөнхий зураг: P(1; 1) болгон хэмжээсжүүлсэн (x/p, y/(c·pⁿ)) — хэлбэр нь c, p-ээс үл хамаарна
  var f = Fig({ view: [-0.14, 1.62, -0.14, 1.48], free: true, w: 214, h: 160, padR: 24 });
  f.axes({ o: 'O' }).curve(F, 0, 1.62, { w: 1.6 })
    .seg([1, 0], [1, 1], { w: 1.1 }).seg([0, 1], [1, 1], { w: 1.1 }).dot([1, 1], { r: 2.2 })
    .text([1, 0], 'A', { pos: 's' }).text([0, 1], 'B', { pos: 'w' }).text([1, 1], 'P', { pos: 'se' });
  if (!root) f.text([Math.pow(1.3, 1 / k), 1.3], lbl, { pos: 'e', size: 12.5, off: 6 });
  else f.text([1.26, F(1.26)], lbl, { pos: 'nw', size: 12.5, off: 5 });
  return {
    q: '$y=' + tex + '$ функцийн график дээр орших $P$ цэгийн $Ox,\\ Oy$ тэнхлэгт буулгасан перпендикулярын суурь харгалзан $A,\\ B$ бол $OAPB$ тэгш өнцөгтийн талбайг $y=' + tex + '$ функцийн график ямар харьцаагаар хуваах вэ?',
    a: '$' + u + ':' + v + '$ (графикийн доорх хэсэг : дээрх хэсэг)',
    fig: f.svg(), side: true, wk: 26,
    t: { c: c, e: e }
  };
}

// 83. f(x) = ax² + bx + c нь x ≥ m (x ≤ m) үед харилцан нэгэн утгатай ⇔ параболын орой x₀ = −b/(2a)
//     завсрын дотор орохгүй → m-ийн хамгийн бага (их) утга m = x₀.
function p83() {
  var A = pick([1, 2, 3, 3, 4, -1, -2, -3]), xn, xd = 1;
  if (rnd(0, 3)) xn = nz(-4, 4);
  else { xd = pick([2, 3]); xn = nz(-5, 5); if (gcd(xn, xd) !== 1) return null; }
  var B = -2 * A * xn / xd, C = rnd(-6, 6);
  if (B !== Math.round(B) || Math.abs(B) > 16) return null;
  var ge = rnd(0, 2) > 0;
  return {
    q: '$x' + (ge ? '\\ge' : '\\le') + ' m$ үед $f(x)=' + poly([A, B, C]) + '$ гэж тодорхойлогдсон функц харилцан нэгэн утгатай бол $m$-ийн хамгийн ' + (ge ? 'бага' : 'их') + ' утгыг олоорой.',
    a: '$m=' + fr(xn, xd) + '$',
    wk: 22,
    t: { A: A, B: B, C: C, ge: ge }
  };
}

// 84. P(x) = (x − r)·q(x), q(x) = αx² + βx + γ: ноогдворын коэффициентүүдийн нийлбэр q(1) = P(1)/(1 − r).
function p84() {
  var r = pick([-3, -2, -2, -1, 2, 3]), al = pick([1, 2, 2, 3]), be = rnd(-5, 5), ga = nz(-5, 5);
  var P = [al, be - r * al, ga - r * be, -r * ga];
  if (P.some(function (c) { return !c || Math.abs(c) > 20; })) return null;
  return {
    q: '$Q(x)=' + poly([1, -r]) + '$ олон гишүүнт нь $P(x)=' + poly(P) + '$ олон гишүүнтийг хуваадаг бол ноогдвор олон гишүүнтийн коэффициентүүдийн нийлбэрийг ол.',
    a: '$' + (al + be + ga) + '$',
    wk: 26,
    t: { r: r, P: P }
  };
}

// 85. N(x)/(x²(x+r)) = A/x + B/x² + C/(x+r) ⇔ N(x) = Ax(x+r) + B(x+r) + Cx²:
//     x = 0 → B = N(0)/r, x = −r → C = N(−r)/r², x²-ийн коэффициент → A = u − C (эх: u = 0 → A + B + C = B).
function p85() {
  var r = pick([1, 1, 2, -1, -2, 3]), B = nz(-4, 4), C = nz(-3, 3), u = rnd(0, 9) < 7 ? 0 : pick([1, 2, -1]);
  var A = u - C;
  if (!A) return null;
  var n2 = A + C, n1 = A * r + B, n0 = B * r;            // N(x) = n2·x² + n1·x + n0
  if (!n1 || Math.abs(n1) > 12 || Math.abs(n0) > 12) return null;
  var ask = pick([0, 0, 0, 0, 1, 2]), E = ['A+B+C', 'A\\cdot B\\cdot C', 'A-B+C'][ask], V = [A + B + C, A * B * C, A - B + C][ask];
  var xr = 'x' + sgn(r);
  return {
    q: '$\\dfrac{' + poly([n2, n1, n0]) + '}{x^2(' + xr + ')}=\\dfrac{A}{x}+\\dfrac{B}{x^2}+\\dfrac{C}{' + xr + '}$ бол $' + E + '$-ийг олоорой.',
    a: '$' + E + '=' + V + '$',
    wk: 30,
    t: { r: r, N: [n2, n1, n0], ask: ask }
  };
}

// 86. αr + βh = s, V = πr²h = πr²(s − αr)/β; V'(r) = 0 → r = 2s/(3α), h = s/(3β) → V_max = 4πs³/(27α²β).
//     s нь 3-ын үржвэр; V_max/π бүхэл эсвэл 2, 3 хуваарьтай энгийн бутархай.
function p86() {
  var al = pick([1, 1, 1, 2, 3]), be = pick([1, 1, 1, 2, 3]), s = 3 * rnd(1, 5);
  if (gcd(al, be) > 1) return null;                      // 2r+2h=12 гэх мэт хураагдах нөхцөлгүй
  var num = 4 * s * s * s, den = 27 * al * al * be, g0 = gcd(num, den), n = num / g0, d = den / g0;
  if (d > 3 || n / d < 1 || n / d > 300) return null;
  if (d > 1 && rnd(0, 1)) return null;                  // бутархай хариуг цөөн
  var nn = n === 1 ? '' : String(n), V = d === 1 ? nn + '\\pi' : '\\dfrac{' + nn + '\\pi}{' + d + '}';
  return {
    q: '$' + tm(al, 'r', true) + tm(be, 'h') + '=' + s + '$ байх $r$ радиустай, $h$ өндөртэй цилиндрийн эзлэхүүний хамгийн их утгыг ол.',
    a: '$V_{max}=' + V + '$',
    wk: 30,
    t: { al: al, be: be, s: s }
  };
}

// 87. y = a + b·sin x (cos x)-ийн графикаас: a = (max + min)/2, |b| = (max − min)/2,
//     b-ийн тэмдэг x = 90° (cos бол x = 0°) дээрх утгаар (дээд цэг → b > 0) → a·b.
function p87() {
  var cs = rnd(0, 2) === 0, a = pick([1, 1, 2, 2, 2, 3, -1, -2]), b = nz(-3, 3), lo = a - Math.abs(b), hi = a + Math.abs(b);
  if (lo < -3 || hi > 5) return null;
  var fn = function (x) { return a + b * (cs ? Math.cos(x * Math.PI / 180) : Math.sin(x * Math.PI / 180)); };
  var Y0 = Math.min(0, lo), Y1 = Math.max(0, hi), ys = [];
  for (var i = Y0; i <= Y1; i++) if (i) ys.push(i);
  // график бүхэлдээ x тэнхлэгээс доош бол x-ийн бичгүүдийг тэнхлэгийн дээд талд (муруйтай давхцахгүй)
  var up = hi <= 0, XL = [[-90, '-90°'], [90, '90°'], [180, '180°'], [270, '270°']];
  var f = Fig({ view: [-135, 325, Y0 - (up ? 0.45 : 0.55), Y1 + (up ? 0.75 : 0.55)], free: true, w: 300, h: 34 + 25 * (Y1 - Y0 + 1.2) });
  f.grid({ x: 90, y: 1 }).axes({ o: false })

  if (!mid) { rp = rnd(1, 4); rq = rnd(1, 4); if (rp === rq || gcd(rp, rq) !== 1) return null; }
  var onAC = rnd(1, 100) <= 65, Dn = 2 * rp + rq, ka = onAC ? rp + rq : rp, kb = onAC ? rp : rp + rq;
  var nm = { sq: 'квадратын', rect: 'тэгш өнцөгтийн', par: 'параллелограммын' }[sh];
  var sd = onAC ? 'AC' : 'BC', s1 = onAC ? 'A' : 'B';
  var mtx = mid ? '$' + sd + '$ талын дундаж цэг $M$'
    : '$' + sd + '$ талыг ${' + s1 + 'M:MC=' + rp + ':' + rq + '}$ харьцаагаар хуваах цэг $M$';
  // Зураг: O(0;0), B — баруун доод, A — зүүн дээд, C = A + B
  var O = [0, 0], Bv = sh === 'rect' ? [1.45, 0] : sh === 'par' ? [1.25, 0] : [1, 0], Av = sh === 'par' ? [0.38, 0.95] : [0, 1];
  var C = [Av[0] + Bv[0], Av[1] + Bv[1]], t = rp / (rp + rq);
  var M = onAC ? [Av[0] + t * Bv[0], Av[1] + t * Bv[1]] : [Bv[0] + t * Av[0], Bv[1] + t * Av[1]];
  var P = [ka / Dn * Av[0] + kb / Dn * Bv[0], ka / Dn * Av[1] + kb / Dn * Bv[1]];
  // P-ийн шошго: PM-тэй хөрш хоёр өнцгийн томд нь (PB–PM эсвэл PM–PA), биссектрисийн дагуу
  var nr = function (v) { var l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l]; };
  var u = nr([Bv[0] - P[0], Bv[1] - P[1]]), v = nr([M[0] - P[0], M[1] - P[1]]), w = nr([Av[0] - P[0], Av[1] - P[1]]);
  var bis = (u[0] * v[0] + u[1] * v[1]) < (v[0] * w[0] + v[1] * w[1]) ? [u[0] + v[0], u[1] + v[1]] : [v[0] + w[0], v[1] + w[1]];
  var angP = Math.round(Math.atan2(bis[1], bis[0]) * 180 / Math.PI);
  var f = Fig({ w: sh === 'rect' ? 228 : sh === 'par' ? 220 : 196, pad: 22 }), G = '#8a8a8a';
  f.poly([O, Bv, C, Av], { w: 1.5 })
    .seg(Av, Bv, { c: G, w: 1.3 }).seg(P, M, { c: G, w: 1.3 })
    .arrow(O, Av, { w: 1.6, h: 8 }).arrow(O, Bv, { w: 1.6, h: 8 }).arrow(O, P, { w: 1.6, h: 8 })
    .dot(M, { r: 2.3 }).dot(P, { r: 2.3 })
    .text(O, 'O', { pos: 'sw' }).text(Av, 'A', { pos: 'nw' }).text(C, 'C', { pos: 'ne' }).text(Bv, 'B', { pos: 'se' })
    .text(M, 'M', { pos: onAC ? 'n' : 'e' }).text(P, 'P', { pos: angP });
  p91_vec(f, [Av[0] / 2, Av[1] / 2], 'a', -12, 0);
  p91_vec(f, [Bv[0] / 2, 0], 'b', 0, 13);
  return {
    q: '$OACB$ ' + nm + ' ' + mtx + ' ба $AB$ диагональ $OM$ хэрчимтэй $P$ цэгт огтлолцдог. '
      + 'Хэрэв <span class="nw">${\\overrightarrow{OA}=\\vec a}$,</span> ${\\overrightarrow{OB}=\\vec b}$ бол <span class="nw">$\\overrightarrow{OP}$-ийг</span> '
      + '<span class="nw">$\\vec a,\\ \\vec b$-ээр</span> илэрхийл.',
    a: '$\\overrightarrow{OP}=' + fr(ka, Dn) + '\\vec a+' + fr(kb, Dn) + '\\vec b$',
    fig: f.svg(), side: true, wk: 28,
    t: { rp: rp, rq: rq, onAC: onAC, sh: sh }
  };
}

// 92. y = n·ax² парабол y = m·ax + k шулуунтай яг хоёр цэгээр огтлолцох a-ийн утгууд.
//     n·a·x² − m·a·x − k = 0, a ≠ 0: D = m²a² + 4nak = a(m²a + 4nk) > 0 ⇒ хилүүд 0 ба −4nk/m².
//     k > 0: a ∈ (−∞; −4nk/m²) ∪ (0; +∞);  k < 0: a ∈ (−∞; 0) ∪ (4n|k|/m²; +∞).
function p92() {
  var n = pick([1, 1, 1, 2]), m = pick([1, 1, 2, 3]), k = nz(-4, 4);
  var B = fr(-4 * n * k, m * m);
  var ans = k > 0 ? 'a\\in(-\\infty;\\,' + B + ')\\cup(0;\\,+\\infty)' : 'a\\in(-\\infty;\\,0)\\cup(' + B + ';\\,+\\infty)';
  return {
    q: '${y=' + tm(n, 'ax^2', true) + '}$ парабол ${y=' + tm(m, 'ax', true) + sgn(k) + '}$ шулуунтай яг хоёр цэгээр огтлолцдог байх '
      + '<span class="nw">$a$-ийн</span> бүх бодит тоон утгын олонлогийг ол.',
    a: '$' + ans + '$', wk: 28,
    t: { n: n, m: m, k: k }
  };
}

// 93. Цөөрөм ABCD: D-ээс завиар AB дээрх M хүртэл, цааш AB дагуу явганаар B хүртэл.
//     T(x) = √(d² + x²)/v₁ + (L − x)/v₂, T'(x) = 0 ⇒ x/√(d² + x²) = v₁/v₂ ⇒ x* = d·v₁/w, w = √(v₂² − v₁²).
//     (v₁, w, v₂) Пифагорын гурвал: (4,3,5) эх, (3,4,5), (8,6,10), (6,8,10) (10 км/ц → «гүйдэг»).
//     T_min = L/v₂ + d·w/(v₁v₂); x* нь 0.5-ын үржвэр, L > x*, минут бүхэл.
var p93_F = [[4, 5, 3], [4, 5, 3], [3, 5, 4], [3, 5, 4], [8, 10, 6], [6, 10, 8]];
function p93() {
  var F = pick(p93_F), v1 = F[0], v2 = F[1], w = F[2], run = v2 > 5;
  var d = pick([2, 3, 4, 6, 8]), L = rnd(3, 12);
  if ((2 * d * v1) % w) return null;
  var xs = d * v1 / w;
  if (L - xs < 0.9 || L - xs > 6 || L / d < 1.25 || L / d > 3) return null;
  var num = 60 * (L * v1 + d * w), den = v1 * v2;           // T_min (минут) = num/den
  if (num % den) return null;
  var mins = num / den, hh = Math.floor(mins / 60), mm = mins % 60;
  var hStr = mins % 3 === 0 ? dec(mins / 60) : fr(mins, 60);
  var hm = mm === 0 ? '' : ' (' + (hh ? hh + ' ц ' : '') + mm + ' мин)';
  // Зураг (масштабтай, M — ерөнхий байрлалд, хариуг илчлэхгүй)
  var A = [0, 0], B = [L, 0], C = [L, d], D = [0, d], xm = (xs > 0.5 * L ? 0.34 : 0.6) * L, M = [xm, 0];
  var f = Fig({ w: 250, h: 150, pad: 18 });
  f.poly([A, B, C, D], { w: 1.5 }).seg(D, M, { dash: '5 4', w: 1.3 })
    .dot(A).dot(B).dot(C).dot(D).dot(M)
    .text(D, 'D', { pos: 'nw' }).text(C, 'C', { pos: 'ne' }).text(A, 'A', { pos: 'sw' }).text(B, 'B', { pos: 'se' }).text(M, 'M', { pos: 's' })
    .text([0, d / 2], dec(d), { pos: 'w' }).text([xm / 2, 0], 'x', { pos: 'n' }).text([(xm + L) / 2, 0], dec(L) + ' − x', { pos: 'n' });
  var go = run ? ['гүйдэг', 'гүйж'] : ['алхдаг', 'алхаж'];
  return {
    q: '$ABCD$ тэгш өнцөгт хэлбэртэй цөөрмийн $D$ цэгт завьтай хүн байв. Завьчин $B$ цэгт очихоор төлөвлөжээ. '
      + 'Завь $' + v1 + '$ км/ц хурдтай хөвөх бөгөөд завьнаасаа буугаад $' + v2 + '$ км/ц хурдтай ' + go[0] + '. '
      + 'Хэрэв ${AD=' + d + '}$ км, ${AB=' + L + '}$ км бол $AB$ хэрчмийн аль цэг дээр завиа орхиод цааш ' + go[1]
      + ' $B$ цэгт хүрэхэд нийт зарцуулсан хугацаа хамгийн багадаа хэд байх вэ?',
    a: '${AM=' + dec(xs) + '}$ км үед ${T_{\\min}=' + hStr + '}$ ц' + hm,
    fig: f.svg(), wk: 34,
    t: { v1: v1, v2: v2, d: d, L: L, xs: xs, mins: mins }
  };
}

// 94. R радиустай тойрогт багтсан ABCDE: AB хөвч, ∠ABE, ∠EBD, BC = CD → талбай.
//     Нумууд (төвийн өнцөг): AB = 2·arcsin(AB/2R) ∈ {60, 90, 120}, EA = 2∠ABE, DE = 2∠EBD,
//     BC = CD = (360 − AB − EA − DE)/2 ∈ {30, 45, 60, 90}. S = (R²/2)·Σ sin(нум) = a + b√2 + c√3 (R тэгш → бүхэл).
var p94_S2 = { 30: [1, 0, 0], 45: [0, 1, 0], 60: [0, 0, 1], 90: [2, 0, 0], 120: [0, 0, 1] };   // 2·sin θ = [бүхэл, √2, √3]
function p94() {
  var R = pick([2, 4, 4, 6]), ab = pick([60, 90, 120]), ea = pick([60, 90, 120]), de = pick([60, 90, 120]);
  var bc = (360 - ab - ea - de) / 2;
  if ([30, 45, 60, 90].indexOf(bc) < 0) return null;
  var s2 = [0, 0, 0];
  [ab, bc, bc, de, ea].forEach(function (t) { for (var i = 0; i < 3; i++) s2[i] += p94_S2[t][i]; });
  var co = s2.map(function (v) { return R * R * v / 4; }), S = '';
  if (co[0]) S += co[0];
  if (co[1]) S += (S ? '+' : '') + rt(co[1], 2);
  if (co[2]) S += (S ? '+' : '') + rt(co[2], 3);
  var AB = ab === 60 ? String(R) : rt(R, ab === 90 ? 2 : 3);
  // Зураг (масштабтай): цагийн зүүний дагуу A → B → C → D → E
  var an = { B: 195 - ab / 2 }; an.A = an.B + ab; an.C = an.B - bc; an.D = an.C - bc; an.E = an.D - de;
  var P = {}, f = Fig({ w: 206, pad: 20 });
  'ABCDE'.split('').forEach(function (k) { var t = an[k] * Math.PI / 180; P[k] = [R * Math.cos(t), R * Math.sin(t)]; });
  f.circle([0, 0], R, { w: 1.4 }).poly([P.A, P.B, P.C, P.D, P.E], { w: 1.5 }).seg(P.B, P.E, { w: 1.4 }).seg(P.B, P.D, { w: 1.4 });
  'ABCDE'.split('').forEach(function (k) { f.dot(P[k], { r: 2.3 }).text(P[k], k, { pos: ((an[k] % 360) + 360) % 360, off: 5 }); });
  return {
    q: '${R=' + R + '}$ радиустай тойрогт багтсан $ABCDE$ таван өнцөгтийн <span class="nw">${AB=' + AB + '}$,</span> '
      + '<span class="nw">${\\angle ABE=' + ea / 2 + '^\\circ}$,</span> ${\\angle EBD=' + de / 2 + '^\\circ}$ ба ${BC=CD}$ бол таван өнцөгтийн талбайг ол.',
    a: '$S=' + S + '$',
    fig: f.svg(), side: true, wk: 34,
    t: { R: R, arcs: [ab, bc, bc, de, ea] }
  };
}

// 95. (2-р хэсэг) f(x)=x²−2kx+k²+αk+β = (x−k)²+α(k−kt), kt=−β/α → орой (k; α(k−kt)).
//   (1) k=k1 → орой (k1; α(k1−kt)) > 0; [u; v] завсарт (u<k1<v): хамгийн бага = оройн y, их = төгсгөлийн их утга.
//   (2) x тэнхлэгийг шүргэх: α(k−kt)=0 → k=kt, шүргэлтийн цэг (kt; 0).
//   (3) x тэнхлэгийн дагуу s нэгжээр зүүн, y тэнхлэгийн дагуу g нэгжээр доош: f(x+s)−g=(x−u0)²+v0 → k=u0+s, g=α(k−kt)−v0.
//       Эхийн (3) зөрүүтэй (k=5 үед 1 нэгжээр ДЭЭШ болдог) — энд g>0 бол «доош», g<0 бол |g| нэгжээр «дээш» (үргэлж тууштай).
//   Бүх нүд 0–9; хасах тэмдэг нүдний гадна.
function p95() {
  var al = pick([-1, -1, 1, -2, 2]), kt = rnd(1, 6), be = -al * kt;
  var k1 = nz(-4, 6), vy = al * (k1 - kt);
  if (vy < 1 || vy > 9) return null;
  var dl = pick([[2, 1], [1, 2], [2, 1], [1, 2], [2, 2], [1, 1]]), u = k1 - dl[0], v = k1 + dl[1], m = Math.max(dl[0], dl[1]);
  var mx = vy + m * m;
  if (mx > 9) return null;
  var s = rnd(1, 4), u0 = nz(-3, 4), v0 = rnd(-4, 4), k3 = u0 + s, g = al * (k3 - kt) - v0;
  if (k3 < 1 || k3 > 9 || k3 === kt || k3 === k1 || !g || Math.abs(g) > 9 || u0 * u0 + v0 === 0) return null;
  var b = Bx();
  // {…} — KaTeX тэнцүүгийн ард мөр таслахгүй (ж: «k =» / «−1»)
  var q = '${f(x)=x^2-2kx+k^2' + tm(al, 'k') + sgn(be) + '}$ функц өгөв.' + steps([
    '${k=' + k1 + '}$ бол функцийн график нь $(' + (k1 < 0 ? '-' : '') + b('A', Math.abs(k1)) + ',\\ ' + b('B', vy) + ')$ цэгт оройтой парабол байна. '
      + 'Энэ үед функцийн $[' + u + ';\\,' + v + ']$ завсар дахь хамгийн бага утга нь $' + b('C', vy) + '$, их утга нь $' + b('D', mx) + '$ байна.',
    '$f(x)$ функцийн график нь ${k=' + b('E', kt) + '}$ үед $x$ тэнхлэгтэй $(' + b('F', kt) + ',\\ 0)$ цэгээр шүргэлцэнэ.',
    '$f(x)$ функцийн графикийг $x$ тэнхлэгийн дагуу $' + s + '$ нэгжээр зүүн, $y$ тэнхлэгийн дагуу $' + b('G', Math.abs(g)) + '$ нэгжээр '
      + (g > 0 ? 'доош' : 'дээш') + ' зөөхөд ${y=' + poly([1, -2 * u0, u0 * u0 + v0]) + '}$ функцийн график гарах бол ${k=' + b('H', k3) + '}$ байна.'
  ]);
  return { q: q, a: b.key(), wide: true, wk: 60, t: { al: al, be: be, k1: k1, u: u, v: v, s: s, u0: u0, v0: v0 } };
}

// 96. (2-р хэсэг) Ирмэгийн нийлбэр 4T, нэг хэмжээс нь нөгөөгөөсөө m дахин их тэгш өнцөгт параллелопипедийн хамгийн их эзлэхүүн.
//   Урт+өргөн+өндөр = T; бага хэмжээсийг x гэвэл V = m·x²·(T−(m+1)x) = mT·x² − m(m+1)·x³, 0 < x < T/(m+1).
//   V' = 0 → x* = 2T/(3(m+1)); бүхэл x*, бүхэл T/(m+1) байхын тулд T = 3j(m+1) → x* = 2j, Vmax = 4m(m+1)j³.
//   (m, j): Vmax ≤ 999. Эх: m=2, j=1 (36; 9; 18, 6, 3; 2; 24). Олон янз байдлын тулд «урт/өргөн», «урт/өндөр», «өндөр/өргөн» хос.
var p96_V = [[2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [2, 2], [3, 2], [4, 2], [5, 2], [2, 3]];
var p96_W = [['урт нь өргөнөөсөө', 'Өргөнийг'], ['урт нь өндрөөсөө', 'Өндрийг'], ['өндөр нь өргөнөөсөө', 'Өргөнийг']];
function p96() {
  var o = pick(p96_V), m = o[0], j = o[1], T = 3 * j * (m + 1), x0 = 2 * j, Vm = 4 * m * (m + 1) * j * j * j;
  var w = pick([p96_W[0], p96_W[0], p96_W[1], p96_W[2]]), b = Bx();
  var q = 'Бүх ирмэгүүдийн нийлбэр нь $' + 4 * T + '$ байх тэгш өнцөгт параллелопипедийн ' + w[0] + ' $' + m + '$ дахин их байв. '
    + 'Энэ параллелопипедийн эзлэхүүний хамгийн их утгыг олъё.' + steps([
      'Урт, өргөн, өндрийн нийлбэр $' + b('S', T) + '$ байна.',
      // {…} — KaTeX «<», «=»-ийн ард мөр таслахгүй («(0 < x <» / «[e])» болохоос сэргийлнэ)
      w[1] + ' $x$ гээд эзлэхүүнийг $x$-ээр илэрхийлбэл ${V(x)=' + b('P', m * T) + 'x^2-' + b('Q', m * (m + 1)) + 'x^3}$, ${(0\\lt x\\lt ' + b('E', T / (m + 1)) + ')}$ байна.',
      '$V(x)$ функцийг уламжлалаар шинжлэхэд ${x=' + b('X', x0) + '}$ үед эзлэхүүний хамгийн их утга нь ${V=' + b('V', Vm) + '}$ байна.'
    ]);
  return { q: q, a: b.key(), wide: true, wk: 55, t: { m: m, T: T } };
}

// 97. (2-р хэсэг) Гурвалжин пирамид: суурь ABC (a, b, c талууд), хажуу талс бүр суурьтай 60° → оройн проекц = багтсан тойргийн төв O.
//   S = Heron, r = S/p (p — хагас периметр); хажуу талсын талбай = (суурийн хэсэг)/cos60° → нийт хажуу = 2S, бүтэн гадаргуу = 3S;
//   өндөр h = r·tg60° = r√3 → V = S·r√3/3. Гурвалжин: бүхэл тал, бүхэл S, бүхэл r, S·r ⋮ 3 (Vmax коэффициент бүхэл).
//   (4)-ийн нүд эх шиг нэг хүрээнд: [fg√h]. Зураг: ерөнхий (тоогүй) пирамид — эх шиг, O нь проекцолсон гурвалжны багтсан төв, D, E — шүргэлтийн цэг.
var p97_T = [[3, 4, 5], [5, 12, 13], [6, 8, 10], [6, 25, 29], [7, 15, 20], [7, 24, 25], [8, 15, 17], [8, 26, 30], [9, 10, 17],
  [9, 12, 15], [10, 10, 12], [10, 24, 26], [11, 13, 20], [12, 16, 20], [13, 14, 15], [15, 15, 24], [15, 20, 25]];
function p97_fig() {
  var A = [900, -1400], B = [1228, -1348], C = [1180, -1585];
  var la = Math.hypot(B[0] - C[0], B[1] - C[1]), lb = Math.hypot(A[0] - C[0], A[1] - C[1]), lc = Math.hypot(A[0] - B[0], A[1] - B[1]), ps = la + lb + lc;
  var O = [(la * A[0] + lb * B[0] + lc * C[0]) / ps, (la * A[1] + lb * B[1] + lc * C[1]) / ps];
  var foot = function (P, Q) { var dx = Q[0] - P[0], dy = Q[1] - P[1], t = ((O[0] - P[0]) * dx + (O[1] - P[1]) * dy) / (dx * dx + dy * dy); return [P[0] + t * dx, P[1] + t * dy]; };
  var D = foot(B, C), E = foot(A, C), S = [O[0], -1185], hid = { dash: '4 3', w: 1.1 };
  var f = Fig({ w: 215, pad: 18 });
  f.seg(A, B, hid).seg(S, O, hid).seg(O, D, hid).seg(O, E, hid)
    .path([A, C, B], { w: 1.4 }).seg(S, A, { w: 1.4 }).seg(S, B, { w: 1.4 }).seg(S, C, { w: 1.4 }).seg(S, E, { w: 1.2 }).seg(S, D, { w: 1.2 })
    .right(O, S, D, { s: 6 }).angle(D, O, S, { r: 11 })
    .dot(O, { r: 1.8 }).dot(D, { r: 1.8 }).dot(E, { r: 1.8 })
    .text(S, 'S', { pos: 'n' }).text(A, 'A', { pos: 'w' }).text(B, 'B', { pos: 'e' }).text(C, 'C', { pos: 's' })
    .text(O, 'O', { pos: 'nw', size: 12 }).text(D, 'D', { pos: 'se', size: 12 }).text(E, 'E', { pos: 'sw', size: 12 });
  // 60° бичиг ∠ODS-ийн биссектрис дээр; SC ирмэг дундуур нь гардаг тул цагаан хүрээтэй (halo)
  f.raw(function (T) {

// 98. (2-р хэсэг) Тойрогт багтсан ABCD: AB, BC, CD, ∠ABC=60° → ∠ADC=120°.

// 99. (2-р хэсэг) y = x³/3 − ((p+q)/2)x² + pq·x + C, q = p+3 → y' = (x−p)(x−q); y(p) = d (их), y(q) = d − (q−p)³/6 = d − 4.5 (бага, сөрөг).
//   C = d − p³/3 − 3p²/2. Буурах завсар p < x < q. y = k гурван шийдтэй ⇔ d − 4.5 < k < d → −(9−2d)/2 < k < d.
//   p ∈ {−2, −1, 1, 2, 3} (p = 0 үед их утга y тэнхлэг дээр буюу зураг давхцана — хассан), d ∈ {1…4}.
//   p сөрөг бол x = −[b] (тэмдэг нүдний гадна); p+q сөрөг бол y' = x² + [a]x − … .

      + '<text x="' + (bb[0] + 6.5).toFixed(2) + '" y="' + (bb[1] + 12.3).toFixed(2) + '" font-size="12.5" font-family="\'KaTeX_Main\',\'Times New Roman\',serif" font-style="italic" text-anchor="middle" fill="#1b1b1b">' + letter + '</text>';

  return { q: qs, a: b.key(), fig: p99_fig(p, q, d, C0, sd.slice(4, -1)), side: true, wide: true, wk: 55, t: { p: p, d: d } };

// 100. (2-р хэсэг) f(x) = (αx+β)/(x−γ): муж x ≠ γ; f(t) = v, f⁻¹(v) = t; f⁻¹(x) = (γx+β)/(x−α) → утгын муж y ≠ α.
//   f = f⁻¹ ⇔ (α−γ)(x² − (α+γ)x − β) = 0 → α ≠ γ үед огтлолцол зөвхөн y = x дээр: x² − (α+γ)x − β = 0 → r1, r2.

function p100() {
  var r1 = rnd(1, 5), r2 = rnd(r1 + 1, 7), sm = r1 + r2, al = rnd(1, sm - 1), ga = sm - al, be = -r1 * r2;

  return { q: q, a: b.key(), wide: true, wk: 55, t: { al: al, be: be, ga: ga, t: tv[0] } };
}
