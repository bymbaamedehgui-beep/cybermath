<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>II бүлэг — Жишиг даалгавар 1 (8-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 8-р анги · II бүлэг. Процент, харьцаа, пропорц — Жишиг даалгавар 1 (2.1 Процент: хөрвүүлэлт, үндсэн 3 бодлого, үнэ ба хүү, уусмал ба хайлш) */
function ok1(v) { return Math.abs(v * 10 - Math.round(v * 10)) < 1e-7; }
function ok2(v) { return Math.abs(v * 100 - Math.round(v * 100)) < 1e-7; }
function nf(v) { return Math.abs(v - Math.round(v)) < 1e-9 ? th(Math.round(v)) : dFmt(Math.round(v * 1000), 3); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
// холимог бутархай TeX: 1\dfrac{1}{4}
function mix(n, d) { var g = gcd(n, d); n /= g; d /= g; var w = Math.floor(n / d), r = n % d; return r ? (w ? w : '') + '\\dfrac{' + r + '}{' + d + '}' : String(w); }

// 1. [2.1 Процент] Энгийн бутархай, холимог тоо ба аравтын бутархайг процентоор илэрхийлэх
//    (1/3, 5/6 гэх мэт нь холимог процент: 33\dfrac{1}{3}\% — сурах бичгийн №1)
function g1() {
  if (rnd(0, 1)) {
    var d = pick([2, 3, 4, 5, 6, 8, 10, 20, 25, 40, 50]), n = rnd(1, 2 * d - 1); if (gcd(n, d) !== 1 || n === d) return null;
    if (d % 3 === 0 && n > d) return null;                          // 3, 6 хуваарьтайг зөвхөн энгийн бутархайгаар
    var pct = d % 3 === 0 ? mix(100 * n, d) : nf(100 * n / d);      // 33\dfrac{1}{3} эсвэл 37.5, 150
    return { stem: '$' + mix(n, d) + '$', a: mix(n, d) + '=' + pct + '\\%' };
  }
  // аравтын бутархай: нэг орон (1.2, 4.5), хоёр орон (0.07, 2.34), гурван орон (0.125, 0.005)
  var sc = pick([1, 2, 2, 3]), X = sc === 1 ? rnd(11, 59) : sc === 2 ? (rnd(0, 2) ? rnd(1, 99) : rnd(101, 299)) : rnd(1, 999); if (X % 10 === 0) return null;
  return { stem: '$' + dFmt(X, sc) + '$', a: dFmt(X, sc) + '=' + dFmt(X * 100, sc) + '\\%' };
}
// 2. [2.1 Процент] Процентын үндсэн гурван бодлого: тооны процент, хэдэн процент болох, процентоор нь тоог олох
function g2() {
  var t = rnd(1, 3);
  if (t === 1) {
    var A = rnd(2, 90) * 10, p = pick([4, 5, 8, 12, 15, 20, 25, 35, 40, 45, 60, 75, 125, 150]), v = A * p / 100; if (!ok1(v)) return null;
    return { stem: '$' + A + '$ тооны $' + p + '\\%$ нь хэд вэ?', a: '$' + A + '\\cdot\\dfrac{' + p + '}{100}=' + nf(v) + '$' };
  }
  if (t === 2) {
    var B = rnd(2, 40) * 10, q = pick([2, 4, 5, 8, 12, 15, 25, 35, 40, 45, 55, 65, 75, 80, 120]), Aa = B * q / 100; if (Aa !== Math.round(Aa) || Aa === q) return null;
    return { stem: '$' + Aa + '$ тоо $' + B + '$ тооны хэдэн процент вэ?', a: '$\\dfrac{' + Aa + '}{' + B + '}\\cdot 100\\%=' + q + '\\%$' };
  }
  var W = rnd(2, 60) * 10, r = pick([4, 5, 8, 12, 15, 20, 25, 30, 35, 40, 60, 75, 80]), part = W * r / 100; if (part !== Math.round(part)) return null;
  return { stem: 'Тооны $' + r + '\\%$ нь $' + part + '$ бол уг тоог ол.', a: '$' + part + '\\cdot\\dfrac{100}{' + r + '}=' + W + '$' };
}
// 3. [2.1 Процент] Үнийн хямдрал, өсөлт, хямдралын өмнөх үнэ, энгийн хүү, татвар, дараалсан өөрчлөлт
function g3() {
  var t = rnd(1, 6), it = pick([['цүнх', 'цүнхний'], ['гутал', 'гутлын'], ['хүрэм', 'хүрэмний'], ['дугуй', 'дугуйн'], ['гар утас', 'гар утасны'], ['ширээ', 'ширээний']]);
  var P0 = rnd(12, 96) * 1000, d = pick([10, 15, 20, 25, 30, 40]);
  if (t === 1 || t === 3) {
    var r = P0 * (100 - d) / 100; if (r !== Math.round(r)) return null;
    if (t === 1) return { stem: cap(it[1]) + ' үнэ $' + th(P0) + '$ төгрөг байв. Үнэ нь $' + d + '\\%$ хямдарвал хэдэн төгрөг болох вэ?', a: '$' + th(P0) + '\\cdot\\dfrac{' + (100 - d) + '}{100}=' + th(r) + '$ төгрөг' };
    return { stem: '$' + d + '\\%$ хямдарсны дараа ' + it[1] + ' үнэ $' + th(r) + '$ төгрөг болжээ. Хямдралаас өмнө хэдэн төгрөг байсан бэ?', a: '$' + th(r) + '\\div\\dfrac{' + (100 - d) + '}{100}=' + th(P0) + '$ төгрөг' };
  }
  if (t === 2) {
    var u = pick([5, 10, 15, 20, 25, 30]), r2 = P0 * (100 + u) / 100; if (r2 !== Math.round(r2)) return null;
    return { stem: cap(it[1]) + ' үнэ $' + th(P0) + '$ төгрөг байсан бөгөөд $' + u + '\\%$ нэмэгджээ. Одоо хэдэн төгрөг болсон бэ?', a: '$' + th(P0) + '\\cdot\\dfrac{' + (100 + u) + '}{100}=' + th(r2) + '$ төгрөг' };
  }
  if (t === 4) {
    var M = pick([200, 300, 400, 500, 600, 800, 1000]) * 1000, k = pick([6, 8, 9, 10, 12, 15]), Y = rnd(2, 4), I = M * k * Y / 100;
    return { stem: '$' + th(M) + '$ төгрөгийг жилийн $' + k + '\\%$ энгийн хүүтэйгээр банкинд $' + Y + '$ жил хадгалуулбал нийт хэдэн төгрөгтэй болох вэ?', a: 'хүү $' + th(I) + '$, нийт $' + th(M + I) + '$ төгрөг' };
  }
  if (t === 5) {
    var G = pick([500, 600, 800, 900, 1000, 1200, 1500]) * 1000, x = pick([5, 10, 15, 20]), net = G * (100 - x) / 100;
    return { stem: 'Ажилчны цалингаас $' + x + '\\%$ татвар суутгаад $' + th(net) + '$ төгрөг олгожээ. Ажилчны цалин хэдэн төгрөг байсан бэ?', a: '$' + th(net) + '\\div\\dfrac{' + (100 - x) + '}{100}=' + th(G) + '$ төгрөг' };
  }
  var p = pick([10, 20, 25, 30, 40, 50]), q = pick([10, 20, 25, 30, 40, 50]), f = (100 + p) * (100 - q) / 100; if (!ok2(f)) return null;
  var ch = Math.round((f - 100) * 100) / 100;
  return { stem: 'Барааны үнэ эхлээд $' + p + '\\%$ өсөөд, дараа нь $' + q + '\\%$ буурчээ. Эцсийн үнэ анхныхаасаа хэрхэн өөрчлөгдсөн бэ?',
    a: '$\\dfrac{' + (100 + p) + '}{100}\\cdot\\dfrac{' + (100 - q) + '}{100}=' + nf(f / 100) + '$, ' + (ch === 0 ? 'өөрчлөгдөөгүй' : '$' + nf(Math.abs(ch)) + '\\%$ ' + (ch > 0 ? 'өссөн' : 'буурсан')) };
}
// 4. [2.1 Процент] Уусмал ба хайлш: агууламж олох, ус нэмэх, ус ууршуулах, хоёр уусмал холих, цэвэр металл нэмэх
function g4() {
  var t = rnd(1, 5);
  if (t === 1) {
    var M = pick([200, 250, 300, 400, 500, 600, 800]), c = pick([4, 5, 6, 8, 10, 12, 15, 20, 25]), S = M * c / 100; if (S !== Math.round(S)) return null;
    return { stem: '$' + M + '$ г уусмалд $' + S + '$ г давс уусгасан байв. Уусмал дахь давсны агууламжийг ол.', a: '$\\dfrac{' + S + '}{' + M + '}\\cdot 100\\%=' + c + '\\%$' };
  }
  if (t === 2) {
    var M2 = pick([100, 150, 200, 250, 300, 400, 500, 600]), p = pick([10, 12, 15, 20, 24, 25, 30, 40]), W = pick([20, 25, 50, 75, 100, 150, 200, 300]);
    var S2 = M2 * p / 100, q = S2 * 100 / (M2 + W); if (S2 !== Math.round(S2) || !ok2(q)) return null;
    return { stem: 'Давсны агууламж нь $' + p + '\\%$ байх $' + M2 + '$ г уусмалд $' + W + '$ г ус нэмэв. Шинэ уусмалын давсны агууламжийг ол.', a: '$\\dfrac{' + S2 + '}{' + (M2 + W) + '}\\cdot 100\\%=' + nf(q) + '\\%$' };
  }
  if (t === 3) {
    var M3 = pick([300, 400, 500, 600, 800, 1000, 1200]), p3 = pick([10, 12, 15, 20, 24, 25, 30]), q3 = pick([20, 25, 30, 40, 50, 60]); if (q3 <= p3) return null;
    var S3 = M3 * p3 / 100, T3 = S3 * 100 / q3, w = M3 - T3; if (!ok1(w) || !ok1(S3) || w <= 0) return null;
    return { stem: 'Давсны агууламж нь $' + p3 + '\\%$ байх $' + M3 + '$ г уусмалаас хэдэн грамм ус ууршуулбал агууламж $' + q3 + '\\%$ болох вэ?', a: 'давс $' + nf(S3) + '$ г; $' + nf(S3) + '\\div\\dfrac{' + q3 + '}{100}=' + nf(T3) + '$; $' + M3 + '-' + nf(T3) + '=' + nf(w) + '$ г' };
  }
  if (t === 4) {
    var p1 = pick([10, 15, 20, 25, 30]), p2 = pick([35, 40, 45, 50, 60]), V1 = pick([100, 150, 200, 300, 400]), V2 = pick([100, 200, 250, 300, 600]);
    var acid = (V1 * p1 + V2 * p2) / 100, c4 = acid * 100 / (V1 + V2); if (!ok2(c4) || !ok2(acid) || V1 === V2) return null;
    return { stem: 'Хүчлийн агууламж нь $' + p1 + '\\%$ байх $' + V1 + '$ г уусмал дээр агууламж нь $' + p2 + '\\%$ байх $' + V2 + '$ г уусмал нэмж холив. Хольцын хүчлийн агууламжийг ол.',
      a: 'хүчил $' + nf(acid) + '$ г; $\\dfrac{' + nf(acid) + '}{' + (V1 + V2) + '}\\cdot 100\\%=' + nf(c4) + '\\%$' };
  }
  var M5 = pick([40, 48, 50, 60, 80, 100, 120]), p5 = pick([20, 25, 30, 40, 10]), q5 = pick([40, 50, 60, 75, 80]); if (q5 <= p5) return null;
  var x = M5 * (q5 - p5) / (100 - q5); if (x !== Math.round(x) || x <= 0 || x > 2 * M5 || !ok1(M5 * p5 / 100)) return null;
  return { stem: 'Зэсийн агууламж нь $' + p5 + '\\%$ байх $' + M5 + '$ кг хайлшид хэдэн кг цэвэр зэс нэмбэл зэсийн агууламж $' + q5 + '\\%$ болох вэ?',
    a: '$\\dfrac{' + nf(M5 * p5 / 100) + '+x}{' + M5 + '+x}=\\dfrac{' + q5 + '}{100}$, $\\ x=' + nf(x) + '$ кг' };
}

CMX.jishig({
  title: 'II бүлэг — Жишиг даалгавар 1',
  sub: 'Процент · процентын үндсэн бодлогууд · үнэ, хүү · уусмалын агууламж',
  grade: '8-р анги',
  rule: '$p\\%=\\dfrac{p}{100}$ &nbsp;·&nbsp; $a$ тооны $p\\%$: $\\ a\\cdot\\dfrac{p}{100}$ &nbsp;·&nbsp; $b$ тоо $a$ тооны $\\dfrac{b}{a}\\cdot 100\\%$ &nbsp;·&nbsp; $p\\%$ нь $b$ бол тоо $=b\\cdot\\dfrac{100}{p}$ &nbsp;·&nbsp; агууламж $=\\dfrac{\\text{бодис}}{\\text{уусмал}}\\cdot 100\\%$',
  tasks: [
    { label: 'Процентоор илэрхийл.', gen: g1, n: 12, nw: 4, cols: 4, wk: 10 },
    { label: 'Тооцоолж ол.', gen: g2, n: 10, nw: 4, cols: 2, wk: 14 },
    { label: 'Үнэ, хүүгийн бодлогыг бод.', gen: g3, n: 6, nw: 2, cols: 2, wk: 20 },
    { label: 'Уусмал, хайлшийн бодлогыг бод.', gen: g4, n: 6, nw: 2, cols: 2, wk: 22 }
  ]
});
</script>
<script src="/ws-store.js?v=40"></script>
</body>
