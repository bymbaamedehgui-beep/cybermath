<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>II бүлэг — Жишиг даалгавар-2 (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.cols2{grid-template-columns:1fr 1fr;gap:9px 18px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:15px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.md{height:15mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function rad(n,inner){return n===2?('\\sqrt{'+inner+'}'):('\\sqrt['+n+']{'+inner+'}');}
function ipow(b,e){var r=1;for(var i=0;i<e;i++)r*=b;return r;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function rootF(A,n){if(A<0)return (n%2===1)?-Math.pow(-A,1/n):NaN;return Math.pow(A,1/n);}
function isFree(m,n){var mm=m;for(var p=2;p*p<=mm;p++){var e=0;while(mm%p===0){mm/=p;e++;}if(e>=n)return false;}return true;}
var FREE={};function freeList(n){if(FREE[n])return FREE[n];var a=[];for(var m=2;m<=12;m++)if(isFree(m,n))a.push(m);FREE[n]=a;return a;}
function fr(p,q){if(q<0){p=-p;q=-q;}var g=gcd(Math.abs(p),q)||1;return {p:p/g,q:q/g};}
function fadd(a,b){return fr(a.p*b.q+b.p*a.q,a.q*b.q);}
function fsub(a,b){return fr(a.p*b.q-b.p*a.q,a.q*b.q);}
function fracTex(f){if(f.q===1)return ''+f.p;if(f.p<0)return '-\\tfrac{'+(-f.p)+'}{'+f.q+'}';return '\\tfrac{'+f.p+'}{'+f.q+'}';}
function pw(base,f){if(f.q===1&&f.p===1)return ''+base;return base+'^{'+fracTex(f)+'}';}
function rexp(){for(;;){var q=pick([2,3,4]),p=nz(-4,4),f=fr(p,q);if(f.q>1)return f;}}
function sigLen(m){var s=(''+Math.abs(m)).replace(/0+$/,'');return s.length||1;}
function dispME(m,e){if(m===0)return '0';var sign=m<0?'-':'',ds=''+Math.abs(m),s=ds.length,P=e+s-1,rest=ds.slice(1).replace(/0+$/,'');return sign+ds[0]+(rest?('.'+rest):'')+'\\cdot 10^{'+P+'}';}
function mkS(P,neg){var len=pick([2,2,3]),lo=ipow(10,len-1),hi=ipow(10,len)-1,sig;do{sig=rnd(lo,hi);}while(sig%10===0);var sign=neg?pick([1,1,-1]):1;return {m:sign*sig,e:P-(len-1)};}
function fval(x){return x.m*Math.pow(10,x.e);}
function divisorsOf(x){x=Math.abs(x);var r=[];for(var i=1;i*i<=x;i++){if(x%i===0){r.push(i);if(i!==x/i)r.push(x/i);}}return r;}

// 1) Нийлмэл тоон илэрхийлэл (хэд хэдэн гишүүн) → тодорхой утга
function termGen(){
  var kind=pick(['pow','pow','neg','root','one']);
  if(kind==='one'){return {tex:rnd(2,99)+'^{0}',val:{p:1,q:1},fv:1};}
  if(kind==='root'){var n=pick([2,3]),c=rnd(2,{2:9,3:4}[n]);return {tex:rad(n,''+ipow(c,n)),val:{p:c,q:1},fv:c};}
  var n2=pick([2,3,4]),c2=rnd(2,{2:9,3:4,4:3}[n2]),k=rnd(1,3);if(gcd(k,n2)!==1)return null;
  var base=ipow(c2,n2);if(base>1e7)return null;var v=ipow(c2,k);
  if(kind==='neg')return {tex:pw(base,fr(-k,n2)),val:{p:1,q:v},fv:1/v};
  return {tex:pw(base,fr(k,n2)),val:{p:v,q:1},fv:v};
}
function gMultiTerm(){
  var nT=pick([3,3,4]),parts=[],tot={p:0,q:1},fvTot=0;
  for(var i=0;i<nT;i++){var t=termGen();if(!t)return null;
    var op=(i===0)?'':pick(['+','-']),sgn=(op==='-')?-1:1;
    parts.push((op?(' '+op+' '):'')+t.tex);
    tot=(sgn<0)?fsub(tot,t.val):fadd(tot,t.val);fvTot+=sgn*t.fv;}
  if(tot.q>8||Math.abs(tot.p/tot.q)>500)return null;
  if(Math.abs(fvTot-tot.p/tot.q)>1e-6*Math.max(1,Math.abs(fvTot)))return null;
  var a=(tot.q===1)?(''+tot.p):((tot.p<0?'-':'')+'\\dfrac{'+Math.abs(tot.p)+'}{'+tot.q+'}');
  return {q:parts.join(''),a:a,ok:true};
}
// 2) Рационал илтгэгчтэй нийлмэл (олон суурь) → бүхэл тоо
function gRatMulti(){
  var pr=pick([[2,3],[3,5],[2,5]]),p1=pr[0],p2=pr[1];
  var Af=fr(0,1),Bf=fr(0,1),chk=1;
  var nd=pick([1,2]);   // хуваарийн гишүүний тоо
  function mkTerm(sgn){var ii=rnd(0,2),jj=rnd(0,2);if(ii===0&&jj===0)ii=1;var bv=ipow(p1,ii)*ipow(p2,jj),f=rexp();
    Af=fadd(Af,fr(sgn*ii*f.p,f.q));Bf=fadd(Bf,fr(sgn*jj*f.p,f.q));chk*=Math.pow(bv,sgn*f.p/f.q);return pw(bv,f);}
  var n1=mkTerm(1),n2=mkTerm(1),d1=mkTerm(-1),d2=(nd===2)?mkTerm(-1):null;
  if(Af.q!==1||Bf.q!==1)return null;
  var Ai=Af.p,Bi=Bf.p;if(Ai<0||Bi<0||(Ai===0&&Bi===0)||Ai>4||Bi>4)return null;
  var val=ipow(p1,Ai)*ipow(p2,Bi);
  if(Math.abs(chk-val)>1e-6*val)return null;
  var den=d1+(d2?('\\cdot '+d2):'');
  return {q:'\\left('+n1+'\\cdot '+n2+'\\right):\\left('+den+'\\right)',a:''+val,ok:true};
}
// 3) Язгуурын нийлбэр/ялгаварыг хялбарчил → k·ⁿ√d
function gRadSum(){
  var n=pick([2,2,3]),d=pick(freeList(n)),nT=pick([2,3]);
  var maxA={2:6,3:3}[n],avail=[];for(var x=1;x<=maxA;x++)avail.push(x);if(avail.length<nT)return null;
  shuffle(avail);var as=avail.slice(0,nT),parts=[],totCoef=0,fSum=0;
  for(var i=0;i<nT;i++){var a=as[i],radicand=ipow(a,n)*d,c=pick([1,1,2,3]),op=(i===0)?'':pick(['+','-']),sgn=(op==='-')?-1:1;
    totCoef+=sgn*c*a;fSum+=sgn*c*rootF(radicand,n);
    parts.push((op?(' '+op+' '):'')+(c===1?'':''+c)+rad(n,''+radicand));}
  var a2;if(totCoef===0)a2='0';else{var s=(totCoef<0?'-':''),ac=Math.abs(totCoef);a2=s+(ac===1?'':''+ac)+rad(n,''+d);}
  var want=totCoef*rootF(d,n);
  if(Math.abs(fSum-want)>1e-6*Math.max(1,Math.abs(want)))return null;
  return {q:parts.join(''),a:a2,ok:true};
}
// 4) Стандарт хэлбэрийн олон үйлдэл
function gStdMulti(){
  if(pick([0,1])){
    var A=mkS(rnd(-4,4),false),B=mkS(rnd(-4,4),false),C=mkS(rnd(-3,3),false),mr=A.m*B.m*C.m,e=A.e+B.e+C.e;
    if(sigLen(mr)>4||Math.abs(mr)>1e9)return null;
    var av=mr*Math.pow(10,e);if(Math.abs(fval(A)*fval(B)*fval(C)-av)>1e-3*Math.max(1,Math.abs(av)))return null;
    return {q:dispME(A.m,A.e)+'\\cdot '+dispME(B.m,B.e)+'\\cdot '+dispME(C.m,C.e),a:dispME(mr,e),ok:true};
  }
  var C=mkS(rnd(-3,3),false),R=mkS(rnd(-3,3),false),mN=C.m*R.m,eN=C.e+R.e;
  var divs=divisorsOf(mN).filter(function(d){return d>1&&d<Math.abs(mN);});if(!divs.length)return null;
  var mA=pick(divs),mB=Math.abs(mN)/mA;if(mA>999||mB>999)return null;
  if(sigLen(mA)>3||sigLen(mB)>3)return null;
  var eA=rnd(-2,2),eB=eN-eA,A2={m:mA,e:eA},B2={m:mB,e:eB};
  var val=(fval(A2)*fval(B2))/fval(C);
  if(Math.abs(val-fval(R))>1e-3*Math.max(1,Math.abs(fval(R))))return null;
  return {q:'\\left('+dispME(A2.m,A2.e)+'\\cdot '+dispME(B2.m,B2.e)+'\\right):\\left('+dispME(C.m,C.e)+'\\right)',a:dispME(R.m,R.e),ok:true};
}
function gen(fn){for(var t=0;t<400;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){
  var qs=sheet.querySelectorAll('.grid .q');
  for(var i=0;i<qs.length;i++){var el=qs[i].querySelector('.ql');if(el)el.textContent=(i+1)+'.';}
  var as=sheet.querySelectorAll('#answers .a');
  for(var j=0;j<as.length;j++){var e2=as[j].querySelector('.an');if(e2)e2.textContent=(j+1)+'.';}
}
function trimToFitBalanced(sheet,target){
  var guard=0,h=probeH(sheet);
  while(h>target&&guard++<400){
    var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;
    for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>3){bestN=n;best=s;}}
    if(best<0)break;
    var qs=grids[best].querySelectorAll('.q'),last=qs[qs.length-1],k=last.getAttribute('data-k');
    var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);
    last.parentNode.removeChild(last);
    relabel(sheet);h=probeH(sheet);
  }
}
function build(){
  var WORK=!!window.WS_WORK;
  var S=[[],[],[],[]],seen={};window.__PROB=[];
  function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<1600){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;S[idx].push(f);c++;}}
  var per=WORK?4:9;
  fill(0,gMultiTerm,per);fill(1,gRatMulti,per);fill(2,gRadSum,per);fill(3,gStdMulti,per);
  var gcls=WORK?'':' cols2',K=0;
  function block(arr,sec){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'" data-sec="'+sec+'"><div class="qeq"><span class="ql"></span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work md"></div>':'')+'</div>';}).join('');}
  var b1=block(S[0],1),b2=block(S[1],2),b3=block(S[2],3),b4=block(S[3],4);
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>$'+p.f.a+'$</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>II бүлэг — Жишиг даалгавар-2</h1><div class="sub">Олон үйлдэлтэй нийлмэл бодлогууд · зэрэг · язгуур · рационал илтгэгч · стандарт хэлбэр · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Үйлдлийн дараалал: зэрэг/язгуур $\\to$ үржүүлэх·хуваах $\\to$ нэмэх·хасах &nbsp;·&nbsp; хариуг хамгийн энгийн хэлбэрт оруул</div>'
    +'<div class="task">1. Нийлмэл тоон илэрхийллийн утгыг ол.</div>'
    +'<div class="grid'+gcls+'" data-sec="1">'+b1+'</div>'
    +'<div class="task">2. Рационал илтгэгчтэй илэрхийллийг хялбарчил.</div>'
    +'<div class="grid'+gcls+'" data-sec="2">'+b2+'</div>'
    +'<div class="task">3. Язгуурын нийлбэр/ялгаварыг хялбарчил.</div>'
    +'<div class="grid'+gcls+'" data-sec="3">'+b3+'</div>'
    +'<div class="task">4. Стандарт хэлбэрийн олон үйлдлийг гүйцэтгэ.</div>'
    +'<div class="grid'+gcls+'" data-sec="4">'+b4+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='II бүлэг — Жишиг даалгавар-2 (10-р анги)';
  relabel(document.getElementById('sheet'));
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFitBalanced(document.getElementById('sheet'),1035);}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
