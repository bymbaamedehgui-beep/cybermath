<style>

  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}

  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}

  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}

<script>
// ══════════ g7core.js — 7-р ангийн нийтлэг хөдөлгүүр (бүх бүлэгт залгагдана) ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ g7ch3.js — III БҮЛЭГ. ХАРЬЦАА, ПРОПОРЦ ══════════
// g7core.js доторх helper-үүдийг шууд дуудна (rnd,pick,gcd,decStr,...).

// ── туслах: харьцангуй анхны хос сонгох ──
function coprimePair(set){
 for(var i=0;i<40;i++){var p=pick(set),q=pick(set);if(p!==q&&gcd(p,q)===1)return [p,q];}
 return null;
}
function redRatio2(a,b){var g=gcd(a,b)||1;return [a/g,b/g];}
function redRatio3(a,b,c){var g=gcd(gcd(a,b),c)||1;return [a/g,b/g,c/g];}

// ───────────────────────── 3.1 Харьцааг хялбар хэлбэрт ─────────────────────────
function g_ratioSimplifyInt(){
 var pr=coprimePair([2,3,4,5,7,8,9]);if(!pr)return null;
 var p=pr[0],q=pr[1],k=rnd(3,12);
 var a=k*p,b=k*q;
 if(a>200||b>200)return null;
 var q1='Харьцааг хамгийн хялбар хэлбэрт бич: $'+a+':'+b+'$';
 var g=gcd(a,b);
 var ans='ХИЯ$('+a+','+b+')='+g+'$. $'+a+':'+b+'='+(a/g)+':'+(b/g)+'$';
 return {q:q1,a:ans,key:'rsi:'+a+':'+b,nv:p/q,chk:{a:a,b:b,rp:p,rq:q}};
}

function g_ratioSimplifyUnits(){
 var PAIRS=[
  {big:'цаг',small:'минут',f:60,step:5,smax:115},
  {big:'кг',small:'г',f:1000,step:50,smax:950},
  {big:'м',small:'см',f:100,step:5,smax:250},
  {big:'литр',small:'мл',f:1000,step:50,smax:950},
  {big:'км',small:'м',f:1000,step:50,smax:950},
  {big:'өдөр',small:'цаг',f:24,step:1,smax:23},
  {big:'сар',small:'долоо хоног',f:4,step:1,smax:3}
 ];
 var P=pick(PAIRS);
 var bigVal=rnd(1,6);
 var steps=Math.floor(P.smax/P.step);
 var smallVal=rnd(1,steps)*P.step;
 var totBig=bigVal*P.f;      // big-ийг small нэгжид
 var totSmall=smallVal;
 if(totBig===totSmall)return null;
 var r=redRatio2(totSmall,totBig);
 // хэвлэх дараалал: firstIsSmall
 var firstSmall=rnd(0,1)===0;
 var q1,rr;
 if(firstSmall){
  q1='$'+smallVal+'\\ \\text{'+P.small+'}:'+bigVal+'\\ \\text{'+P.big+'}$';
  rr=redRatio2(totSmall,totBig);
 }else{
  q1='$'+bigVal+'\\ \\text{'+P.big+'}:'+smallVal+'\\ \\text{'+P.small+'}$';
  rr=redRatio2(totBig,totSmall);
 }
 var qq='Хэмжээнүүдийг ижил нэгжид оруулж, харьцааг хялбар хэлбэрт бич: '+q1;
 var ans;
 if(firstSmall)
  ans='$'+bigVal+'\\ \\text{'+P.big+'}='+totBig+'\\ \\text{'+P.small+'}$. Харьцаа $'+totSmall+':'+totBig+'='+rr[0]+':'+rr[1]+'$';
 else
  ans='$'+bigVal+'\\ \\text{'+P.big+'}='+totBig+'\\ \\text{'+P.small+'}$. Харьцаа $'+totBig+':'+totSmall+'='+rr[0]+':'+rr[1]+'$';
 return {q:qq,a:ans,key:'rsu:'+P.small+':'+smallVal+':'+bigVal+':'+firstSmall,
  chk:{first:firstSmall?totSmall:totBig,second:firstSmall?totBig:totSmall,rp:rr[0],rq:rr[1]}};
}

function g_ratioSimplifyDecimalFrac(){
 // operand -> {fr:{n,d}, tex}
 function decOp(scale){
  var t=rnd(1,scale*2-1);
  return {fr:Fr(t,scale),tex:decStr(t/scale,3)};
 }
 function fracOp(){
  var num=rnd(1,2),den=rnd(2,9);
  if(gcd(num,den)!==1)return null;
  return {fr:Fr(num,den),tex:'\\tfrac{'+num+'}{'+den+'}'};
 }
 function mixOp(){
  var w=rnd(1,3),c=rnd(2,7),b=rnd(1,c-1);
  return {fr:Fr(w*c+b,c),tex:w+'\\tfrac{'+b+'}{'+c+'}'};
 }
 var mode=pick(['dec','frac','mix']);
 var x,y;
 if(mode==='dec'){var sc=pick([10,100]);x=decOp(sc);y=decOp(sc);}
 else if(mode==='frac'){x=fracOp();y=fracOp();if(!x||!y)return null;}
 else{x=mixOp();y=pick([0,1])?decOp(10):fracOp();if(!y)return null;}
 if(x.fr.n===0||y.fr.n===0)return null;
 // ижил бүхэл руу: L=lcm(хуваарь)
 var L=lcm(x.fr.d,y.fr.d);
 var A=x.fr.n*(L/x.fr.d),B=y.fr.n*(L/y.fr.d);
 if(A===B)return null;
 var r=redRatio2(A,B);
 var q1='Харьцааг хамгийн хялбар (бүхэл тоон) хэлбэрт бич: $'+x.tex+':'+y.tex+'$';
 var mid=(A===r[0]&&B===r[1])?'':('='+A+':'+B);
 var ans='$'+x.tex+':'+y.tex+mid+'='+r[0]+':'+r[1]+'$';
 return {q:q1,a:ans,key:'rsd:'+x.tex+':'+y.tex,
  chk:{xn:x.fr.n,xd:x.fr.d,yn:y.fr.n,yd:y.fr.d,rp:r[0],rq:r[1]}};
}

// ───────────────────────── 3.2 / 3.3 Пропорц ба процент ─────────────────────────
function g_propCheck(){
 var a=rnd(4,15),b=rnd(4,15),k=rnd(2,6);
 var isProp=rnd(0,1)===0;
 var c=k*a,d=k*b;
 if(!isProp){
  var off=pick([-3,-2,-1,1,2,3]);
  d=d+off;
  if(d<=0)return null;
  if(a*d===b*c)return null;
 }
 if(c>90||d>90)return null;
 var ad=a*d,bc=b*c;
 var qq='$'+a+':'+b+'$ ба $'+c+':'+d+'$ харьцаанууд пропорц үүсгэх үү? Пропорцын үндсэн чанараар шалга.';
 var ans;
 if(ad===bc)
  ans='Тийм, пропорц мөн. $'+a+'\\cdot'+d+'='+b+'\\cdot'+c+'='+ad+'$';
 else
  ans='Үгүй, пропорц биш. $'+a+'\\cdot'+d+'='+ad+'$, $'+b+'\\cdot'+c+'='+bc+'$ тэнцэхгүй.';

function g_divideByRatio2(){

 var UNITS=[{u:'марк',lo:5,hi:60},{u:'кг',lo:4,hi:50},{u:'литр',lo:4,hi:50},{u:'м',lo:5,hi:60},{u:'мл',lo:20,hi:200},{u:'₮',lo:100,hi:2000}];
 var U=pick(UNITS);

 if(Q<100||Q>3000)return null;
 var p1=m*u,p2=n*u;
 var qq='$'+Q+'$ '+U.u+'-ийг $'+m+':'+n+'$ харьцаагаар хуваа. Хэсэг тус бүрийг ол.';
 var ans='Нийт $'+m+'+'+n+'='+s+'$ хэсэг. 1 хэсэг $='+Q+':'+s+'='+u+'$ '+U.u+'. Хэсгүүд: $'+m+'\\cdot'+u+'='+p1+'$ ба $'+n+'\\cdot'+u+'='+p2+'$ '+U.u+'.';
 return {q:qq,a:ans,key:'dr2:'+Q+':'+m+':'+n+':'+U.u,nv:p1,chk:{Q:Q,m:m,n:n,p1:p1,p2:p2}};
}

function g_divideByRatio3(){
 var UNITS=[{u:'₮',mul:1000},{u:'мл',mul:5},{u:'литр',mul:2},{u:'кг',mul:3},{u:'см',mul:4}];
 var U=pick(UNITS);
 var decMode=rnd(0,1)===0;
 var t=[],disp=[];
 if(decMode){
  // тэрбумтын хэлбэр: ti = аравтын тоо *10
  for(var i=0;i<3;i++){t.push(rnd(10,90));}
  // дор хаяж нэг нь 10-д хуваагдахгүй байх (аравтын оронтой)
  if(t[0]%10===0&&t[1]%10===0&&t[2]%10===0)t[rnd(0,2)]+=rnd(1,9);
  for(var j=0;j<3;j++)disp.push(decStr(t[j]/10,2));
 }else{
  for(var a=0;a<3;a++){t.push(rnd(1,9)*10);disp.push(''+(t[a]/10));}
 }
 var r=redRatio3(t[0],t[1],t[2]);
 var s=r[0]+r[1]+r[2];
 var u=rnd(4,40)*U.mul;
 var Q=s*u;
 if(Q<1000||Q>3000000)return null;
 var parts=[r[0]*u,r[1]*u,r[2]*u];
 var qq='$'+Q+'$ '+U.u+'-ийг $'+disp[0]+':'+disp[1]+':'+disp[2]+'$ харьцаагаар хуваа. Хэсэг тус бүрийг ол.';
 var ans='';
 if(decMode){
  var mid=(t[0]===r[0]&&t[1]===r[1]&&t[2]===r[2])?'':('='+t[0]+':'+t[1]+':'+t[2]);
  ans+='Эхлээд бүхэл тоон харьцаа болгоно: $'+disp[0]+':'+disp[1]+':'+disp[2]+mid+'='+r[0]+':'+r[1]+':'+r[2]+'$. ';
 }
 ans+='Нийт $'+r[0]+'+'+r[1]+'+'+r[2]+'='+s+'$ хэсэг. 1 хэсэг $='+Q+':'+s+'='+u+'$ '+U.u+'. Хэсгүүд: $'+parts[0]+',\\ '+parts[1]+',\\ '+parts[2]+'$ '+U.u+'.';
 return {q:qq,a:ans,key:'dr3:'+Q+':'+r.join(':')+':'+U.u+':'+decMode,nv:parts[0],
  chk:{Q:Q,r:r,parts:parts}};
}
