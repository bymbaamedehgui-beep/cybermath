<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тэг ба сөрөг илтгэгчтэй зэрэг — хүндэвтэр (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:5px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:15px}
  .work{height:26mm;border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 16px;font-size:13px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var LAB=['а','б','в','г','д','е','ё','ж','з','и','й','к','л','м'];
// ── BigInt рационал ──
function bgcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){var t=b;b=a%b;a=t;}return a||1n;}
function bf(n,d){n=BigInt(n);d=(d===undefined?1n:BigInt(d));if(d<0n){n=-n;d=-d;}var g=bgcd(n,d);return {n:n/g,d:d/g};}
function bmul(a,b){return bf(a.n*b.n,a.d*b.d);}
function bdiv(a,b){return bf(a.n*b.d,a.d*b.n);}
function badd(a,b){return bf(a.n*b.d+b.n*a.d,a.d*b.d);}
function bsub(a,b){return bf(a.n*b.d-b.n*a.d,a.d*b.d);}
function bpow(base,e){var r=bf(1),b=(e<0)?bdiv(bf(1),base):base,k=Math.abs(e),i;for(i=0;i<k;i++)r=bmul(r,b);return r;}
function bfTex(f){if(f.d===1n)return f.n.toString();var neg=f.n<0n;var nn=(neg?-f.n:f.n);return (neg?'-':'')+'\\dfrac{'+nn.toString()+'}{'+f.d.toString()+'}';}
function bfNum(f){return Number(f.n)/Number(f.d);}
function tooBig(f){return (f.n<0n?-f.n:f.n)>200000n||f.d>200000n;}
function fpw(p,q,e){return e===1?('\\dfrac{'+p+'}{'+q+'}'):('\\left(\\dfrac{'+p+'}{'+q+'}\\right)^{'+e+'}');}
function pe(b,e){return e===1?(''+b):(b+'^{'+e+'}');}   // зэрэг 1 бол бичихгүй
function ppMap(c){if(c===2)return [[2,1],[4,2],[8,3],[16,4],[32,5]];if(c===3)return [[3,1],[9,2],[27,3],[81,4]];return [[5,1],[25,2],[125,3]];}
function factorC(c,lo,hi){var pr=pick(ppMap(c));var e=nz(lo,hi);return {base:pr[0],e:e,tex:pe(pr[0],e)};}
// ── Хүнд генераторууд ──
// H1: анхны тооны зэргийн нийлмэл бутархай (хариу нь p^A·q^B бутархай)
function gH1(){
  var cs=pick([[2,3],[3,2],[2,5],[3,5],[5,2]]),c1=cs[0],c2=cs[1];
  function facs(c,k,lo,hi){var a=[];for(var i=0;i<k;i++)a.push(factorC(c,lo,hi));return a;}
  var nt=facs(c1,pick([1,2]),-3,3).concat(facs(c2,pick([0,1]),-3,3));
  var dt=facs(c1,pick([1,2]),-3,3).concat(facs(c2,pick([0,1]),-3,3));
  if(!nt.length||!dt.length)return null;
  var val=bf(1),fv=1;
  nt.forEach(function(f){val=bmul(val,bpow(bf(f.base),f.e));fv*=Math.pow(f.base,f.e);});
  dt.forEach(function(f){val=bdiv(val,bpow(bf(f.base),f.e));fv/=Math.pow(f.base,f.e);});
  if(tooBig(val)||val.n===1n&&val.d===1n)return null;
  return {q:'\\dfrac{'+nt.map(function(f){return f.tex;}).join(' \\cdot ')+'}{'+dt.map(function(f){return f.tex;}).join(' \\cdot ')+'}',ans:val,fv:fv};
}
// H2: тоологч нь нийлбэр/ялгавар, хуваарь нэг зэрэг
function gH2(){
  var a=pick([2,3,5]),c1=rnd(1,9),c2=rnd(1,9),op=pick(['+','-']);
  var k=rnd(3,7),dm=rnd(-1,3),dn=rnd(-1,3);if(dm===dn)return null;
  var m=k+dm,n=k+dn;if(m<1||n<1)return null;
  var t1=bmul(bf(c1),bpow(bf(a),dm)),t2=bmul(bf(c2),bpow(bf(a),dn));
  var val=(op==='+')?badd(t1,t2):bsub(t1,t2);if(tooBig(val))return null;
  var num=(c1===1?'':c1+'\\cdot ')+pe(a,m)+' '+op+' '+(c2===1?'':c2+'\\cdot ')+pe(a,n);
  var fv=(op==='+'?c1*Math.pow(a,dm)+c2*Math.pow(a,dn):c1*Math.pow(a,dm)-c2*Math.pow(a,dn));
  return {q:'\\dfrac{'+num+'}{'+pe(a,k)+'}',ans:val,fv:fv};
}
// H3: тоологч, хуваарь ижил зэрэгт хүрнэ → коэффициентийн нийлбэр
function gH3(){
  var c=pick([2,3,5]),S=rnd(6,12);
  var reps=ppMap(c).filter(function(pr){return S%pr[1]===0;});if(reps.length<2)return null;
  function rp(){var pr=pick(reps);return {base:pr[0],e:S/pr[1]};}
  var t1=rp(),t2=rp(),dd=rp(),c1=rnd(2,9),c2=rnd(2,9),op=pick(['+','-']);
  var val=bf(op==='+'?c1+c2:c1-c2);
  var num=c1+'\\cdot '+pe(t1.base,t1.e)+' '+op+' '+c2+'\\cdot '+pe(t2.base,t2.e);
  var fv=(op==='+'?c1+c2:c1-c2);
  return {q:'\\dfrac{'+num+'}{'+pe(dd.base,dd.e)+'}',ans:val,fv:fv};
}
// H4: бутархай суурь ба сөрөг илтгэгч холилдсон нийлмэл бутархай
function gH4(){
  var a=pick([2,3]),b=pick([2,3]),m=nz(-3,4),n=nz(-3,4);
  var pr=pick([[2,3],[3,4],[2,5],[3,2],[1,2]]),k=nz(1,3);
  var val=bdiv(bmul(bpow(bf(a),m),bpow(bf(pr[0],pr[1]),-k)),bpow(bf(b),n));
  if(tooBig(val)||val.n===1n&&val.d===1n)return null;
  var fv=Math.pow(a,m)*Math.pow(pr[0]/pr[1],-k)/Math.pow(b,n);
  return {q:'\\dfrac{'+pe(a,m)+' \\cdot '+fpw(pr[0],pr[1],-k)+'}{'+pe(b,n)+'}',ans:val,fv:fv};
}
function gen(){var fns=[gH1,gH1,gH2,gH2,gH3,gH4];for(var t=0;t<300;t++){var f=pick(fns)();if(f&&Math.abs(bfNum(f.ans)-f.fv)<1e-6)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function trimToFit(sheet,target){var g=0,h=probeH(sheet);while(h>target&&g++<120){var qs=sheet.querySelectorAll('.q');if(qs.length<=4)break;var i=qs.length-1;var ans=sheet.querySelectorAll('#answers .a');if(ans[i])ans[i].parentNode.removeChild(ans[i]);qs[i].parentNode.removeChild(qs[i]);h=probeH(sheet);}}
function build(){
  var WORK=!!window.WS_WORK;
  var arr=[],seen={},i;window.__PROB=[];var c=0,tr=0,N=WORK?24:40;   // элбэг үүсгээд A4-т тааруулна
  while(c<N&&tr<2200){tr++;var f=gen();if(!f||seen[f.q])continue;seen[f.q]=1;arr.push(f);window.__PROB.push(f);c++;}
  var probs=arr.map(function(f,idx){var lb=LAB[idx]||('#'+(idx+1));
    return '<div class="q"><div class="qeq"><span class="ql">'+lb+')</span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work"></div>':'')+'</div>';}).join('');
  var ans=arr.map(function(f,idx){var lb=LAB[idx]||('#'+(idx+1));
    return '<div class="a"><span class="an">'+lb+')</span><span>$'+bfTex(f.ans)+'$</span></div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тэг ба сөрөг илтгэгчтэй зэрэг</h1><div class="sub">Нийлмэл илэрхийллийн утгыг ол · хүндэвтэр · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$a^{-n}=\\dfrac{1}{a^{n}}$ &nbsp;·&nbsp; $a^{m}\\cdot a^{n}=a^{m+n}$ &nbsp;·&nbsp; $\\dfrac{a^{m}}{a^{n}}=a^{m-n}$ &nbsp;·&nbsp; $(a^m)^n=a^{mn}$ &nbsp;·&nbsp; ерөнхий суурьт хөрвүүлж хялбарчил</div>'
    +'<div class="task">Илэрхийллийн утгыг ол.</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Тэг ба сөрөг илтгэгчтэй зэрэг — хүндэвтэр (10-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFit(document.getElementById('sheet'),1035);}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
