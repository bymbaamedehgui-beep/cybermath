<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Огтлолцсон хөвч, огтлогч, шүргэгчийн чадал (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:10px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
  .dcard{break-inside:avoid;page-break-inside:avoid;border:1px solid #eee7fb;border-radius:9px;padding:6px 7px;background:linear-gradient(#fff,#fcfbff)}
  .dcard .dq{font-size:10.5px;margin-bottom:2px;min-height:15px}.dcard .dq b{color:var(--purple)}
  .dsvg{width:100%;height:auto;display:block}
  .aline{margin-top:3px;font-size:10.5px;color:var(--soft);text-align:center}.aline b{color:var(--ink);border-bottom:1px solid #cdbff0;padding:0 20px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function divisors(n){var d=[];for(var i=1;i<=n;i++)if(n%i===0)d.push(i);return d;}
function dist(P,Q){return Math.hypot(P[0]-Q[0],P[1]-Q[1]);}
function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];}
function circumcenter(A,B,C){var ax=A[0],ay=A[1],bx=B[0],by=B[1],cx=C[0],cy=C[1],d=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));return [((ax*ax+ay*ay)*(by-cy)+(bx*bx+by*by)*(cy-ay)+(cx*cx+cy*cy)*(ay-by))/d,((ax*ax+ay*ay)*(cx-bx)+(bx*bx+by*by)*(ax-cx)+(cx*cx+cy*cy)*(bx-ax))/d];}
function seg(a,b,col,w){return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+col+'" stroke-width="'+(w||1.4)+'"/>';}
function dot(p,col){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="1.6" fill="'+(col||'#7B52EE')+'"/>';}
function fitMap(pts,O0,r0){var xs=pts.map(function(p){return p[0];}).concat([O0[0]-r0,O0[0]+r0]),ys=pts.map(function(p){return p[1];}).concat([O0[1]-r0,O0[1]+r0]);
  var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys),W=maxx-minx,H=maxy-miny,S=126,pad=15,sc=Math.min((S-2*pad)/W,(S-2*pad)/H),ex=(S-2*pad-W*sc)/2,ey=(S-2*pad-H*sc)/2;
  return {S:S,sc:sc,M:function(p){return [pad+ex+(p[0]-minx)*sc,S-pad-ey-(p[1]-miny)*sc];}};}
function ptLbl(p,cen,s){var dx=p[0]-cen[0],dy=p[1]-cen[1],L=Math.hypot(dx,dy)||1;return '<text x="'+(p[0]+dx/L*8).toFixed(1)+'" y="'+(p[1]+dy/L*8+2).toFixed(1)+'" font-size="8.5" fill="#1a1030" text-anchor="middle" font-weight="700">'+s+'</text>';}
function segLbl(a,b,cen,s,col){var m=mid(a,b),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,tc=[cen[0]-m[0],cen[1]-m[1]];if(nx*tc[0]+ny*tc[1]>0){nx=-nx;ny=-ny;}return '<text x="'+(m[0]+nx*7).toFixed(1)+'" y="'+(m[1]+ny*7+2).toFixed(1)+'" font-size="8" fill="'+col+'" text-anchor="middle" font-weight="800">'+s+'</text>';}
function circleSvg(O0,r0){return '<circle cx="'+O0[0].toFixed(1)+'" cy="'+O0[1].toFixed(1)+'" r="'+r0.toFixed(1)+'" fill="none" stroke="#4a4470" stroke-width="1.3"/>';}
function svgW(g,S){return '<svg class="dsvg" viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';}
// 1) Огтлолцсон хөвч
function figChords(pa,pb,pc,pd,lab){var t1=rnd(0,359)*Math.PI/180,t2=t1+rnd(72,108)*Math.PI/180,u1=[Math.cos(t1),Math.sin(t1)],u2=[Math.cos(t2),Math.sin(t2)];
  var P=[0,0],A=[-pa*u1[0],-pa*u1[1]],B=[pb*u1[0],pb*u1[1]],C=[-pc*u2[0],-pc*u2[1]],D=[pd*u2[0],pd*u2[1]],O0=circumcenter(A,B,C),r0=dist(O0,A);
  var f=fitMap([P,A,B,C,D],O0,r0),Pm=f.M(P),Am=f.M(A),Bm=f.M(B),Cm=f.M(C),Dm=f.M(D),Om=f.M(O0),ce=[(Am[0]+Bm[0]+Cm[0]+Dm[0])/4,(Am[1]+Bm[1]+Cm[1]+Dm[1])/4];
  var g=circleSvg(Om,r0*f.sc)+seg(Am,Bm,'#7B52EE',1.4)+seg(Cm,Dm,'#16a34a',1.4)+dot(Pm,'#e0562d')+dot(Am)+dot(Bm)+dot(Cm)+dot(Dm);
  g+=ptLbl(Am,ce,'A')+ptLbl(Bm,ce,'B')+ptLbl(Cm,ce,'C')+ptLbl(Dm,ce,'D')+ptLbl(Pm,ce,'P');
  g+=segLbl(Pm,Am,ce,lab.a,'#7B52EE')+segLbl(Pm,Bm,ce,lab.b,'#7B52EE')+segLbl(Pm,Cm,ce,lab.c,'#16a34a')+segLbl(Pm,Dm,ce,lab.d,'#16a34a');
  return svgW(g,f.S);}
function gChords(){for(var t=0;t<200;t++){var pa=rnd(2,9),pb=rnd(2,9),prod=pa*pb,ds=divisors(prod).filter(function(x){return x>=2&&prod/x>=2&&prod/x<=13&&x!==prod/x;});if(!ds.length)continue;var pc=pick(ds),pd=prod/pc;
    return {svg:figChords(pa,pb,pc,pd,{a:''+pa,b:''+pb,c:''+pc,d:'?'}),q:'Огтлолцсон хөвч: $PA='+pa+',\\ PB='+pb+',\\ PC='+pc+'$. $PD=?$',a:'$PD='+pd+'$',key:'ch'+pa+'-'+pb+'-'+pc,ok:true};}
  return null;}
// 2) Тойргийн огтлогч (гадна цэгээс)
function figSecants(pa,pb,pc,pd,lab){var t1=rnd(0,359)*Math.PI/180,t2=t1+rnd(30,55)*Math.PI/180,u1=[Math.cos(t1),Math.sin(t1)],u2=[Math.cos(t2),Math.sin(t2)];
  var P=[0,0],A=[pa*u1[0],pa*u1[1]],B=[pb*u1[0],pb*u1[1]],C=[pc*u2[0],pc*u2[1]],D=[pd*u2[0],pd*u2[1]],O0=circumcenter(A,B,C),r0=dist(O0,A);
  var f=fitMap([P,A,B,C,D],O0,r0),Pm=f.M(P),Am=f.M(A),Bm=f.M(B),Cm=f.M(C),Dm=f.M(D),Om=f.M(O0),ce=f.M(O0);
  var g=circleSvg(Om,r0*f.sc)+seg(Pm,Bm,'#7B52EE',1.4)+seg(Pm,Dm,'#16a34a',1.4)+dot(Pm,'#e0562d')+dot(Am)+dot(Bm)+dot(Cm)+dot(Dm);
  g+=ptLbl(Am,ce,'A')+ptLbl(Bm,ce,'B')+ptLbl(Cm,ce,'C')+ptLbl(Dm,ce,'D')+ptLbl(Pm,ce,'P');
  g+=segLbl(Pm,Am,ce,lab.a,'#7B52EE')+segLbl(Am,Bm,ce,lab.b,'#7B52EE')+segLbl(Pm,Cm,ce,lab.c,'#16a34a')+segLbl(Cm,Dm,ce,lab.d,'#16a34a');
  return svgW(g,f.S);}
function gSecants(){for(var t=0;t<200;t++){var pa=rnd(2,6),k=rnd(2,4),pb=pa+rnd(3,9),prod=pa*pb,ds=divisors(prod).filter(function(x){return x>=2&&prod/x>x&&prod/x<=16;});if(!ds.length)continue;var pc=pick(ds),pd=prod/pc;if(pc>=pd)continue;
    return {svg:figSecants(pa,pb,pc,pd,{a:''+pa,b:''+(pb-pa),c:''+pc,d:'?'}),q:'Огтлогч: $PA='+pa+',\\ AB='+(pb-pa)+',\\ PC='+pc+'$. $CD=?$',a:'$CD='+(pd-pc)+'$',key:'sc'+pa+'-'+pb+'-'+pc,ok:true};}
  return null;}
// 3) Шүргэгч ба огтлогч
function figTanSec(pa,pb,pk,lab){var t1=rnd(0,359)*Math.PI/180,u1=[Math.cos(t1),Math.sin(t1)];
  var P=[0,0],A=[pa*u1[0],pa*u1[1]],B=[pb*u1[0],pb*u1[1]],mAB=mid(A,B),nrm=[-u1[1],u1[0]],h=rnd(4,8),O0=[mAB[0]+h*nrm[0],mAB[1]+h*nrm[1]],r0=dist(O0,A);
  var d=dist(P,O0),L=Math.sqrt(Math.max(0,d*d-r0*r0)),wx=(P[0]-O0[0])/d,wy=(P[1]-O0[1])/d,K=[O0[0]+(r0*r0/d)*wx-(r0*L/d)*(-wy),O0[1]+(r0*r0/d)*wy-(r0*L/d)*(wx)];
  var f=fitMap([P,A,B,K],O0,r0),Pm=f.M(P),Am=f.M(A),Bm=f.M(B),Km=f.M(K),Om=f.M(O0),ce=f.M(O0);
  var g=circleSvg(Om,r0*f.sc)+seg(Pm,Bm,'#7B52EE',1.4)+seg(Pm,Km,'#e0562d',1.5)+dot(Pm,'#e0562d')+dot(Am)+dot(Bm)+dot(Km,'#c2451f');
  g+=ptLbl(Am,ce,'A')+ptLbl(Bm,ce,'B')+ptLbl(Km,ce,'K')+ptLbl(Pm,ce,'P');
  g+=segLbl(Pm,Am,ce,lab.a,'#7B52EE')+segLbl(Am,Bm,ce,lab.b,'#7B52EE')+segLbl(Pm,Km,ce,lab.k,'#c2451f');
  return svgW(g,f.S);}
function gTanSec(){for(var t=0;t<200;t++){var pk=rnd(3,10),sq=pk*pk,ds=divisors(sq).filter(function(x){return x>=1&&sq/x>x&&sq/x<=32;});if(!ds.length)continue;var pa=pick(ds),pb=sq/pa;
    return {svg:figTanSec(pa,pb,pk,{a:''+pa,b:''+(pb-pa),k:'?'}),q:'Шүргэгч-огтлогч: $PA='+pa+',\\ AB='+(pb-pa)+'$. Шүргэгч $PK=?$',a:'$PK='+pk+'$',key:'ts'+pa+'-'+pb,ok:true};}
  return null;}
// build: power of a point (3 diagram sections)
function build(){
  var seen={},K=0;window.__A=[];
  function fillD(fn,n){var arr=[],tr=0;while(arr.length<n&&tr++<600){var f=fn();if(!f||seen[f.key])continue;seen[f.key]=1;arr.push(f);}return arr;}
  var s1=fillD(gChords,3),s2=fillD(gSecants,3),s3=fillD(gTanSec,3);
  function card(f){var k=K++;window.__A.push({k:k,a:f.a});return '<div class="dcard"><div class="dq"><b>'+(k+1)+'.</b> '+f.q+'</div>'+f.svg+'<div class="aline">Хариу: <b>&nbsp;</b></div></div>';}
  var b1=s1.map(card).join(''),b2=s2.map(card).join(''),b3=s3.map(card).join('');
  var ans='<div class="ans-grid">'+window.__A.map(function(a){return '<div class="a"><span class="an">'+(a.k+1)+'.</span><span>'+a.a+'</span></div>';}).join('')+'</div>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Огтлолцсон хөвч, огтлогч, шүргэгч</h1><div class="sub">Цэгийн чадал: $PA\\cdot PB=PC\\cdot PD$ · $PK^2=PA\\cdot PB$ · 7.3 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Огтлолцсон хөвч ($P$ дотор) ба гадна цэгийн хоёр огтлогчид: $PA\\cdot PB=PC\\cdot PD$. Гадна цэгийн шүргэгч ба огтлогчид: $PK^2=PA\\cdot PB$.</div>'
    +'<div class="task">1. Огтлолцсон хөвчийн дутуу хэрчмийг ол ($PA\\cdot PB=PC\\cdot PD$).</div><div class="dgrid">'+b1+'</div>'
    +'<div class="task">2. Гадна цэгээс татсан огтлогчийн дутуу хэрчмийг ол.</div><div class="dgrid">'+b2+'</div>'
    +'<div class="task">3. Шүргэгчийн уртыг ол ($PK^2=PA\\cdot PB$).</div><div class="dgrid">'+b3+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2>'+ans+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Огтлолцсон хөвч, огтлогч, шүргэгчийн чадал (10-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
