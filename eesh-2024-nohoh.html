<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЭЕШ 2024 — Нөхөх даалгавар</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  /* «Эх хувилбар» — шинэ хувилбар дээр байхад л харагдана (.btn биш: ws-store хэвлэх товчийг .btn-ээр олдог) */
  .e24-orig{font-weight:800;border:1.4px solid #d9cff5;background:#faf7ff;color:#5a32d6;border-radius:999px;padding:.5rem 1rem;font-size:.85rem;cursor:pointer;font-family:inherit}
  .e24-orig[hidden]{display:none}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .e24-ver{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:800;color:#5a32d6;border:1.3px solid #d9cff5;border-radius:999px;padding:1px 11px;letter-spacing:.3px}
  .meta{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  /* ws-store.js нь "#sheet .rule"-ийг бүх хуудсанд нуудаг тул эх шалгалтын Санамж/томьёог тусдаа классаар (.san, .frm) харуулна */
  .san,.frm{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .san b{color:#5a32d6}
  /* ── Томьёоны хайрцаг (эвхэгддэг) ── */
  .frm{color:#3a3350}
  .frm summary{font-weight:800;color:#5a32d6;font-size:11.5px;cursor:pointer;list-style-position:inside}
  .frm[open] summary{margin-bottom:4px}
  .frm ol{padding-left:18px}
  .frm li{padding-left:2px;margin:2px 0}
  .frm .katex{font-size:1.1em}
  .frm table{border-collapse:collapse;margin:4px auto 3px;font-size:11px}
  .frm td{border:1px solid #bdb5d6;padding:1px 12px;text-align:center}
  .frm .ctr{text-align:center;margin-top:3px}
  /* ── Эх шалгалтын 1-р хуудасны координатын тор: зөвхөн бодолтын зайтай хэвлэхэд (дэлгэцэнд харагдахгүй) ── */
  .cgrid{display:none;text-align:center}
  .cgrid .cg>svg{display:block;width:160mm;max-width:100%;height:auto;margin:0 auto}
  .cgrid .gl{margin-top:3mm;font-size:12px}
  .ttl{text-align:center;font-weight:800;font-size:13px;margin:2px 0 8px;letter-spacing:.2px}
  /* ── Даалгавар ── */
  .grid{display:grid;grid-template-columns:1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid;margin:12px 0 4px}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:30px;flex-shrink:0}.qm{font-size:13px;flex:1;min-width:0}
  .stmt{display:flow-root;margin-bottom:3px}
  .pt{float:right;white-space:nowrap;margin-left:12px;color:#333}
  .sp{display:flex;gap:8px;align-items:baseline;margin:4px 0}
  .sp .sn{min-width:24px;flex-shrink:0}
  .sp .st{flex:1;min-width:0}
  .it{font-style:italic;margin-left:32px}
  .row{display:flex;gap:10px 16px;align-items:flex-start;flex-wrap:wrap}
  .row>.col{flex:1 1 300px;min-width:0}
  .row>.fig{flex:0 1 auto;margin:2px auto 0}
  .fig{text-align:center;margin:4px 0}
  /* Зургийн SVG-г зөвхөн ШУУД хүүхдээр (>) — KaTeX-ийн дотоод <svg> (\sqrt г.м.)-д height:auto үйлчилбэл өндөр нь ≈0 болно */
  .fig>svg{display:block;max-width:100%;height:auto}
  /* ── Нүдний хайрцаг (ЭЕШ-ийн [a] хэлбэр) ── */
  .bx{display:inline-block;min-width:1.25em;padding:0 .2em;margin:0 .1em;border:1px solid #222;line-height:1.12;text-align:center;font-family:KaTeX_Math,'Times New Roman',serif;font-style:italic;font-size:1.12em;color:#111;white-space:nowrap}
  .nw{display:inline-block;white-space:nowrap}
  .pt2{white-space:nowrap;color:#555}
  /* √[нүд] — нүдтэй язгуур (KaTeX-д HTML нүд оруулах боломжгүй тул HTML-ээр) */
  .rt{display:inline-flex;align-items:flex-start;white-space:nowrap;vertical-align:middle;margin:0 .1em}
  .rt .rts{font-family:KaTeX_Main,'Times New Roman',serif;font-size:1.3em;line-height:1.05;margin-right:-1px}
  .rt .rtv{border-top:1.3px solid #222;padding:3px .12em 0;margin-top:.12em}
  /* Хэсэгчилсэн функц: |…| = { мөр1 ; мөр2 } (мөр бүрт нүд) */
  .pwz{display:inline-flex;align-items:center;gap:.2em;vertical-align:middle;margin:.25em 0;max-width:100%}
  .pwz .pwb{font-size:2.7em;line-height:1;font-weight:300;transform:scaleX(.6);margin:0 -.1em}
  .pwz .pwr{display:inline-grid;gap:.4em}
  .pwz .pwrow{display:grid;grid-template-columns:7.2em auto;gap:.6em;white-space:nowrap;align-items:center}
  @media (max-width:600px){.pwz{flex-wrap:wrap}.pwz .pwrow{grid-template-columns:auto;gap:.15em}}
  .bf{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;line-height:1.15}
  .bf>.n{display:flex;align-items:baseline;justify-content:center;border-bottom:1px solid #222;padding:0 .15em 2px}
  .bf>.d{display:flex;align-items:baseline;justify-content:center;padding:2px .15em 0}
  .bf .bx{font-size:.98em}
  /* Бодолтын зай: .wk биш .wz — ws-store-ийн fitWork .wk хайрцгийг жижигрүүлдэг, харин энэ хуудас эх шалгалтын
     хуудаслалтыг (томьёо+тор | 2.1+2.2 | 2.3+2.4) .pgb-ээр тогтоосон тул хайрцгийн өндрийг энд л тодорхойлно. */
  .wz{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:22mm;margin-top:6px}
  /* ── Хариу ── */
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15.5px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}
  .ans-grid .a{padding:7px 11px 8px;background:#fbfaff;border:1px solid #ece6fb;border-radius:9px;break-inside:avoid;page-break-inside:avoid}
  .ans-grid .an{color:#5a32d6;font-weight:800;margin-right:5px}
  .chips{display:inline-flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 4px;font-weight:700}
  .chips .ch{white-space:nowrap}
  .chips .ch b{color:#16a34a}
  .sl{margin:3px 0;padding-left:9px;border-left:2px solid #e6ddfa}
  .sl .sn{font-weight:700;color:#5a32d6;margin-right:4px}
  /* бутархайтай мөрүүд (утсанд ороож шилжихэд) хоорондоо наалдахгүй */
  .sl .katex-html>.base{margin:3px 0}
  /* томьёоны ард залгасан цэг/таслал (gluePunct) — энгийн текстийн фонтоор */
  .katex .kp{font-family:'Segoe UI',Arial,sans-serif;font-size:.8264em;font-style:normal;font-weight:normal}
  #answers{display:none}
  /* Хуучин хувилбарын холбоосоор нээсэн үеийн сануулга (зөвхөн дэлгэцэнд) */
  .e24-stale{max-width:210mm;margin:0 auto 12px;font-size:13px;line-height:1.45;color:#7f1d1d;background:transparent;border-left:3px solid #dc2626;border-radius:8px;padding:8px 12px}
  .e24-stale[hidden]{display:none}
  /* «Ангиар хэвлэх»-ийн хариуны түлхүүр (зөвхөн хэвлэхэд гарна) */
  .e24-kt-h{font-size:15px;font-weight:800;color:#5a32d6;text-align:center}
  .e24-kt-s{font-size:11px;color:var(--soft);text-align:center;margin:2px 0 9px}
  .e24-kt-t{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed}
  .e24-kt-t th,.e24-kt-t td{border:1px solid #d9cff5;padding:3px 4px;line-height:1.35;vertical-align:top}
  .e24-kt-t thead th{background:#f4f0ff;color:#5a32d6;font-weight:800;text-align:center}
  .e24-kt-t thead{display:table-header-group}
  .e24-kt-t tr{break-inside:avoid;page-break-inside:avoid}
  .e24-kt-t tbody tr:nth-child(even) td{background:#fbfaff}
  .e24-kt-t td.e24-kt-n{text-align:center;font-weight:700}
  .e24-kt-t td.e24-kt-v{font-weight:800;color:#5a32d6;word-break:break-word}
  .e24-kt-t td.e24-kt-v span{display:block;font-weight:600;color:var(--ink);font-size:9.5px}
  .e24-kt-t td.e24-kt-a{word-break:break-word}
  .e24-kt-t td.e24-kt-a i{font-family:KaTeX_Math,'Times New Roman',serif;color:#5a32d6;margin-right:1px}
  .e24-kt-t td.e24-kt-a b{margin-right:6px;white-space:nowrap}
  .e24-kt-t col.e24-kt-c0{width:8mm}.e24-kt-t col.e24-kt-c1{width:28mm}
  @media (max-width:600px){
    body{padding:8px}
    .sheet{padding:14px 12px;min-height:0}
    .it{margin-left:0}
  }
  @media print{.frm summary{list-style:none}.frm summary::-webkit-details-marker{display:none}.frm summary{text-align:center}}
  @media print{body{background:#fff;padding:0}.bar,.e24-stale{display:none!important}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
  /* Бодолтын зайтай хэвлэхэд эх шалгалтын хуудаслалт: 1) томьёо + координатын тор, 2) 2.1 + 2.2, 3) 2.3 + 2.4.
     "Бодолтын зай" унтраавал layout() .cgrid-ийг хасч .pgb-г арилгана (тэгэхэд нэг хуудсанд жижигрүүлж багтана). */
  @media print{.cgrid{display:block;break-inside:avoid;margin-top:4mm}.pgb{break-before:page;page-break-before:always}}
  /* KaTeX язгуурын тэмдгийн SVG-г дээрх svg хэмжээний дүрмээс хамгаална */
  .katex svg{max-width:none!important;height:inherit!important}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()" title="Шинэ хувилбар үүсгэх"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ хувилбар</button>
  <button type="button" class="e24-orig" id="e24-orig" onclick="build('orig')" title="2024 оны эх даалгавар руу буцах" hidden>Эх хувилбар</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="e24-stale" id="e24-stale" role="alert" hidden></div>
<div class="sheet" id="sheet"></div>

<!-- Хувилбараас үл хамаарах хэсэг: нэр/анги, томьёо, координатын тор, хэсгийн гарчиг, Санамж (эх шалгалтынхаар) -->
<template id="tpl">
<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>

<details class="frm" open>
  <summary>Даалгаварт хэрэглэгдэх зарим томьёо</summary>
  <ol>
    <li>$(p,q)$ цэгт оройтой параболын тэгшитгэл: ${y=a(x-p)^2+q}$</li>
    <li>Пирамидын эзлэхүүн: ${V=\dfrac{1}{3}\cdot S_{\text{суурь}}\cdot h}$</li>
    <li>Конусын хажуу гадаргуун талбай: ${S_{\text{х.г}}=\pi\cdot R\cdot l}$</li>
    <li class="w">Математик дундаж: $X$ дискрет санамсаргүй хувьсагчийн магадлалын тархалтын хүснэгт нь
      <table>
        <tr><td>$x$</td><td>$x_1$</td><td>$x_2$</td><td>$\dots$</td><td>$x_n$</td></tr>
        <tr><td>$P(X=x)$</td><td>$p_1$</td><td>$p_2$</td><td>$\dots$</td><td>$p_n$</td></tr>
      </table>
      бол математик дундаж $E(X)=x_1\cdot p_1+x_2\cdot p_2+\cdots+x_n\cdot p_n$ байна.
      <div class="ctr">${p_1+p_2+\cdots+p_n=1}$</div>
    </li>
    <li class="w">Стандарт хазайлт: ${\text{С.Х}=\sqrt{\dfrac{\sum x^2}{n}-\overline{x}^2}=\sqrt{\dfrac{\sum(x-\overline{x})^2}{n}}}$. Энд ${\overline{x}=\dfrac{\sum x}{n}}$</li>
    <li>${\displaystyle\int_{x_1}^{x_2}a(x-x_1)(x-x_2)\,dx=-\dfrac{a}{6}(x_2-x_1)^3}$</li>
  </ol>
  <div class="ctr">Шаардлагатай бол координатын хавтгайг ашиглаарай.</div>
</details>
<div class="cgrid"><div class="cg"></div><div class="gl">Эрхэм шалгуулагч танд амжилт хүсье!</div></div>

<div class="ttl pgb">Хоёрдугаар хэсэг. НӨХӨХ ДААЛГАВАР</div>
<div class="san"><b>Санамж:</b> Даалгавруудын хариултыг бөглөхдөө хариултын хуудасны 2-р хэсгийг бөглөх заавартай сайтар танилцаарай. Зургийг бодит хэмжээгээр өгөөгүй гэдгийг санаарай. <b>Хоёрдугаар хэсгийн бодлого бүр 7 оноотой.</b></div>
</template>

<script>
// ЭЕШ ажлын хуудсын НИЙТЛЭГ туслахууд (jishig-daalgavar-1-11.html-ээс). Генераторууд эдгээрийг ашиглана — ДАХИН БҮҮ ТОДОРХОЙЛ.
// ══════════ g10core.js — 10-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
