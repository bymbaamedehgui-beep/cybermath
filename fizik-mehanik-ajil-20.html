<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Механик ажил — 20 бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--blue:#1e40af}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .rule{font-size:12px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:14px}
  .rule b{color:var(--blue)}
  .grid{display:grid;grid-template-columns:1fr;gap:6px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:8px 4px 8px;border-bottom:1px dashed #efeaff}
  .qh{font-size:13.5px;font-weight:700;margin-bottom:3px;line-height:1.5}
  .qh .qn{color:var(--purple);font-weight:800;margin-right:6px;display:inline-block;min-width:22px}
  .qh .qgiven{color:#555;font-weight:600;font-size:12.5px;display:block;margin:2px 0 0 28px}
  .qh .qask{color:#c4680d;font-weight:800;font-size:12.5px;display:block;margin:2px 0 0 28px}
  .work{margin:6px 0 4px 28px;height:32mm;border:1.3px solid #cdbfee;border-radius:6px;background-image:linear-gradient(#eee 1px,transparent 1px);background-size:100% 5mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm;break-before:page;page-break-before:always}
  .ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-list{display:grid;grid-template-columns:1fr;gap:8px;font-size:12px}
  .ans-list .a{padding:8px 10px;border-left:3px solid var(--purple);background:#f8f5ff;border-radius:4px}
  .ans-list .an{color:var(--purple);font-weight:800;margin-right:4px}
  .ans-list .a b{color:#0f7a33}
  .ans-list .step{color:#555;margin-top:3px;font-size:11.5px;line-height:1.55}
  #answers{display:none}
  @media print{
    body{background:#fff;padding:0}
    .bar{display:none}
    .sheet{box-shadow:none;width:auto;padding:0;margin:0}
    @page{size:A4;margin:12mm}
    .grid{gap:4px}
    .q{padding:5px 2px 5px}
    .work{height:28mm}
  }
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>

<script>
// ═══ Helpers ═══
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function fmt(n){ if(Math.abs(n)>=1000) return Math.round(n).toLocaleString('en'); if(Number.isInteger(n)) return n.toString(); return n.toFixed(2).replace(/\.?0+$/,''); }
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}

const G = 10; // m/s² — тохиромжтой болгохын тулд 10 авав

// ═══ 20 бодлогын генераторууд ═══
const GEN = [
  // 1. Шууд ажил W = F·s (хэвтээ хүчээр)
  () => {
    var F = rnd(20,60)*5, s = rnd(4,12);
    var W = F*s;
    return {
      given: 'F = '+F+' Н,   s = '+s+' м',
      ask: 'Хийсэн ажил W-ийг ол.',
      story: 'Хэвтээ гадаргуу дээр биетэд '+F+' Н хүчийг хөдөлгөөнтэй чиглэлд үйлчлүүлэн '+s+' м зайд шилжүүлэв.',
      steps: [
        '$W = F \\cdot s$',
        '$W = '+F+' \\cdot '+s+' = '+fmt(W)+'$ Ж'
      ],
      ans: fmt(W)+' Ж'
    };
  },
  // 2. Өнцөгтэй хүчээр ажил W = F·s·cos(θ)
  () => {
    var F = rnd(25,80)*4, s = rnd(5,12), ang = [30,45,60][rnd(0,2)];
    var cosV = {30:'\\tfrac{\\sqrt{3}}{2}',45:'\\tfrac{\\sqrt{2}}{2}',60:'\\tfrac{1}{2}'}[ang];
    var cosN = {30:0.866,45:0.707,60:0.5}[ang];
    var W = F*s*cosN;
    return {
      given: 'F = '+F+' Н,   s = '+s+' м,   α = '+ang+'°',
      ask: 'Хүчний хийсэн ажил W?',
      story: F+' Н хүч биетийн шилжилтийн чиглэлтэй '+ang+'° өнцөг үүсгэн үйлчлэхэд бие '+s+' м шилжив.',
      steps: [
        '$W = F \\cdot s \\cdot \\cos\\alpha$',
        '$\\cos '+ang+'° = '+cosV+' \\approx '+cosN.toFixed(3)+'$',
        '$W = '+F+' \\cdot '+s+' \\cdot '+cosN.toFixed(3)+' \\approx '+fmt(W)+'$ Ж'
      ],
      ans: '≈ '+fmt(W)+' Ж'
    };
  },
  // 3. Үрэлтийн эсрэг ажил
  () => {
    var m = rnd(4,15), s = rnd(6,15), mu = [0.2,0.25,0.3,0.35,0.4][rnd(0,4)];
    var Ff = mu*m*G, W = Ff*s;
    return {
      given: 'm = '+m+' кг,   s = '+s+' м,   μ = '+mu+',   g = 10 м/с²',
      ask: 'Үрэлтийн хүчний хийсэн ажил W_үр?',
      story: m+' кг масстай биетийг хэвтээ гадаргуугаар '+s+' м зайд шилжүүлэв. Үрэлтийн коэффициент μ='+mu+'.',
      steps: [
        '$F_{үр} = \\mu \\cdot m \\cdot g = '+mu+' \\cdot '+m+' \\cdot 10 = '+fmt(Ff)+'$ Н',
        '$W_{үр} = -F_{үр} \\cdot s = -'+fmt(Ff)+' \\cdot '+s+' = -'+fmt(W)+'$ Ж',
        'Хөдөлгөөний эсрэг тул сөрөг тэмдэгтэй.'
      ],
      ans: '−'+fmt(W)+' Ж'
    };
  },
  // 4. Хүнд өргөх ажил
  () => {
    var m = rnd(5,25), h = rnd(2,8);
    var W = m*G*h;
    return {
      given: 'm = '+m+' кг,   h = '+h+' м,   g = 10 м/с²',
      ask: 'Тогтмол хурдтай өргөх үед хийсэн ажил?',
      story: m+' кг ачааг '+h+' м өндөрт нэгэн жигд өргөж авав.',
      steps: [
        '$W = m \\cdot g \\cdot h$',
        '$W = '+m+' \\cdot 10 \\cdot '+h+' = '+fmt(W)+'$ Ж'
      ],
      ans: fmt(W)+' Ж'
    };
  },
  // 5. Хүчний чадал P = W/t
  () => {
    var W = rnd(4,20)*500, t = rnd(5,30);
    var P = W/t;
    return {
      given: 'W = '+fmt(W)+' Ж,   t = '+t+' с',
      ask: 'Хийсэн ажлын чадал P?',
      story: 'Мотор '+fmt(W)+' Ж ажлыг '+t+' секундэд гүйцэтгэв.',
      steps: [
        '$P = \\dfrac{W}{t}$',
        '$P = \\dfrac{'+fmt(W)+'}{'+t+'} = '+fmt(P)+'$ Вт'
      ],
      ans: fmt(P)+' Вт'
    };
  },
  // 6. Кинетик энерги Ek = mv²/2
  () => {
    var m = rnd(2,10), v = rnd(3,20);
    var Ek = m*v*v/2;
    return {
      given: 'm = '+m+' кг,   v = '+v+' м/с',
      ask: 'Биетийн кинетик энерги E_к?',
      story: m+' кг масстай бие '+v+' м/с хурдтай хөдөлж байна.',
      steps: [
        '$E_к = \\dfrac{m v^2}{2}$',
        '$E_к = \\dfrac{'+m+' \\cdot '+v+'^2}{2} = \\dfrac{'+(m*v*v)+'}{2} = '+fmt(Ek)+'$ Ж'
      ],
      ans: fmt(Ek)+' Ж'
    };
  },
  // 7. Потенциаль энерги Ep = mgh
  () => {
    var m = rnd(3,15), h = rnd(4,20);
    var Ep = m*G*h;
    return {
      given: 'm = '+m+' кг,   h = '+h+' м,   g = 10 м/с²',
      ask: 'Биетийн потенциаль энерги E_п?',
      story: m+' кг масстай биетийг газраас '+h+' м өндөрт байрлуулав.',
      steps: [
        '$E_п = m \\cdot g \\cdot h$',
        '$E_п = '+m+' \\cdot 10 \\cdot '+h+' = '+fmt(Ep)+'$ Ж'
      ],
      ans: fmt(Ep)+' Ж'
    };
  },
  // 8. Ажил-энергийн теорем (тайван байдлаас хурдасгах)
  () => {
    var m = rnd(2,8), v = rnd(5,15);
    var Ek = m*v*v/2;
    return {
      given: 'm = '+m+' кг,   v₀ = 0,   v = '+v+' м/с',
      ask: 'Хийгдсэн ажил W?',
      story: m+' кг масстай биетийг тайван байдлаас '+v+' м/с хурд хүртэл хурдасгасан.',
      steps: [
        '$W = \\Delta E_к = \\dfrac{m v^2}{2} - \\dfrac{m v_0^2}{2}$',
        '$W = \\dfrac{'+m+' \\cdot '+v+'^2}{2} - 0 = '+fmt(Ek)+'$ Ж'
      ],
      ans: fmt(Ek)+' Ж'
    };
  },
  // 9. Тоормослох (KE → 0)
  () => {
    var m = rnd(500,1500), v = rnd(10,30);
    var Ek = m*v*v/2;
    return {
      given: 'm = '+m+' кг,   v = '+v+' м/с',
      ask: 'Автомашиныг зогсоох тоормосны хийх ажил?',
      story: m+' кг масстай авто '+v+' м/с хурдтай явж, гэнэт зогсох ёстой болов.',
      steps: [
        '$W_{тор} = 0 - \\dfrac{m v^2}{2} = -\\dfrac{m v^2}{2}$',
        '$W_{тор} = -\\dfrac{'+m+' \\cdot '+v+'^2}{2} = -'+fmt(Ek)+'$ Ж',
        'Хөдөлгөөний эсрэг үйлчлэх тул сөрөг.'
      ],
      ans: '−'+fmt(Ek)+' Ж'
    };
  },
  // 10. Тогтмол хурдаар хэвтээ гадаргаар зөөх (үрэлттэй)
  () => {
    var m = rnd(6,20), s = rnd(5,15), mu = [0.15,0.2,0.25,0.3][rnd(0,3)];
    var F = mu*m*G, W = F*s;
    return {
      given: 'm = '+m+' кг,   s = '+s+' м,   μ = '+mu+',   v = const',
      ask: 'Хүний хийсэн ажил W?',
      story: m+' кг ачааг '+s+' м зайд тогтмол хурдтайгаар татаж авав. Үрэлтийн коэффициент μ='+mu+'.',
      steps: [
        'Тогтмол хурдтай тул F = F_үр',
        '$F = \\mu m g = '+mu+' \\cdot '+m+' \\cdot 10 = '+fmt(F)+'$ Н',
        '$W = F \\cdot s = '+fmt(F)+' \\cdot '+s+' = '+fmt(W)+'$ Ж'
      ],
      ans: fmt(W)+' Ж'
    };
  },
  // 11. Пүрш (нум)-т хийгдсэн ажил
  () => {
    var k = rnd(50,300)*4, x = rnd(4,15)/100; // x in meters (0.04-0.15)
    var W = k*x*x/2;
    return {
      given: 'k = '+k+' Н/м,   x = '+(x*100)+' см = '+x+' м',
      ask: 'Пүршийг сунгахад хийгдсэн ажил W?',
      story: 'Хатан чанар k='+k+' Н/м пүршийг '+(x*100)+' см сунгав.',
      steps: [
        '$W = \\dfrac{k x^2}{2}$',
        '$W = \\dfrac{'+k+' \\cdot '+x+'^2}{2} = \\dfrac{'+(k*x*x).toFixed(3)+'}{2} = '+fmt(W)+'$ Ж'
      ],
      ans: fmt(W)+' Ж'
    };
  },
  // 12. Хазайлт руу дээшлүүлэх (үрэлтгүй, өнцөгтэй)
  () => {
    var m = rnd(5,15), L = rnd(4,10), ang = [30,45,60][rnd(0,2)];
    var h = L * {30:0.5,45:0.707,60:0.866}[ang];
    var W = m*G*h;
    return {
      given: 'm = '+m+' кг,   L = '+L+' м,   α = '+ang+'°,   үрэлтгүй',
      ask: 'Хазайлтын дагуу дээшлүүлэх ажил W?',
      story: m+' кг биетийг '+ang+'° налуу хавтгайгаар '+L+' м зайд дээш дээшлүүлэв.',
      steps: [
        '$h = L \\sin\\alpha = '+L+' \\sin '+ang+'° \\approx '+h.toFixed(2)+'$ м',
        '$W = m g h = '+m+' \\cdot 10 \\cdot '+h.toFixed(2)+' \\approx '+fmt(W)+'$ Ж'
      ],
      ans: '≈ '+fmt(W)+' Ж'
    };
  },
  // 13. Дундаж хүчээр ажил (шугаман өсөх)
  () => {
    var Fmax = rnd(10,50)*4, s = rnd(3,10);
    var Fav = Fmax/2, W = Fav*s;
    return {
      given: 'F: 0-с '+Fmax+' Н хүртэл шугаман өсөв,   s = '+s+' м',
      ask: 'Хийгдсэн ажил W?',
      story: 'Биет дээр үйлчлэх хүч 0-с '+Fmax+' Н хүртэл '+s+' м зайд шугаман нэмэгдэв.',
      steps: [
        'Дундаж хүч: $F_{дунд} = \\dfrac{F_0 + F_{max}}{2} = \\dfrac{'+Fmax+'}{2} = '+Fav+'$ Н',
        '$W = F_{дунд} \\cdot s = '+Fav+' \\cdot '+s+' = '+fmt(W)+'$ Ж'
      ],
      ans: fmt(W)+' Ж'
    };
  },
  // 14. Цахилгаан краны чадал
  () => {
    var m = rnd(200,800), h = rnd(5,20), t = rnd(4,15);
    var W = m*G*h, P = W/t;
    return {
      given: 'm = '+m+' кг,   h = '+h+' м,   t = '+t+' с',
      ask: 'Краны чадал P?',
      story: m+' кг ачааг '+h+' м өндөрт '+t+' секундэд өргөх кран.',
      steps: [
        '$W = m g h = '+m+' \\cdot 10 \\cdot '+h+' = '+fmt(W)+'$ Ж',
        '$P = \\dfrac{W}{t} = \\dfrac{'+fmt(W)+'}{'+t+'} = '+fmt(P)+'$ Вт'
      ],
      ans: fmt(P)+' Вт'
    };
  },
  // 15. Хазайлт руу дээшлүүлэх (үрэлттэй)
  () => {
    var m = rnd(4,12), L = rnd(4,8), ang = 30, mu = 0.2;
    var h = L*0.5, cos = 0.866;
    var Wg = m*G*h;
    var Wf = mu*m*G*cos*L;
    var W = Wg + Wf;
    return {
      given: 'm = '+m+' кг,   L = '+L+' м,   α = 30°,   μ = 0.2',
      ask: 'Дээш чиглэсэн ажлын нийт хэмжээ W?',
      story: m+' кг биетийг 30° налуу хавтгайгаар '+L+' м дээш зөөв. μ='+mu+'.',
      steps: [
        'Өндөр: $h = L\\sin30° = '+L+' \\cdot 0.5 = '+h+'$ м',
        'Хүндийн эсрэг: $W_g = mgh = '+m+' \\cdot 10 \\cdot '+h+' = '+fmt(Wg)+'$ Ж',
        'Үрэлт: $W_{үр} = \\mu m g \\cos\\alpha \\cdot L = '+mu+' \\cdot '+m+' \\cdot 10 \\cdot 0.866 \\cdot '+L+' \\approx '+fmt(Wf)+'$ Ж',
        'Нийт: $W = W_g + W_{үр} \\approx '+fmt(W)+'$ Ж'
      ],
      ans: '≈ '+fmt(W)+' Ж'
    };
  },
  // 16. Хүн чадал (алхаж явж)
  () => {
    var m = rnd(50,80), t = rnd(3,8), floors = rnd(2,5);
    var h = floors*3;
    var W = m*G*h, P = W/t;
    return {
      given: 'm = '+m+' кг,   давхар = '+floors+' (h = '+h+' м),   t = '+t+' с',
      ask: 'Хүний хөгжүүлсэн чадал?',
      story: m+' кг хүн '+floors+' давхарт (нэг давхар 3м) '+t+' секундэд гарав.',
      steps: [
        '$W = m g h = '+m+' \\cdot 10 \\cdot '+h+' = '+fmt(W)+'$ Ж',
        '$P = \\dfrac{W}{t} = \\dfrac{'+fmt(W)+'}{'+t+'} = '+fmt(P)+'$ Вт'
      ],
      ans: fmt(P)+' Вт'
    };
  },
  // 17. Радиус тойргоор хөдлөх — Wн = 0
  () => {
    var m = rnd(2,8), v = rnd(3,10), r = rnd(1,5);
    var Fc = m*v*v/r;
    return {
      given: 'm = '+m+' кг,   v = '+v+' м/с,   r = '+r+' м',
      ask: 'Төвд чиглэсэн хүчний хийсэн ажил W_ц?',
      story: m+' кг бие '+r+' м радиустай тойргоор '+v+' м/с тогтмол хурдаар эргэлддэг.',
      steps: [
        'Центростремитив хүч: $F_c = \\dfrac{m v^2}{r} = \\dfrac{'+m+' \\cdot '+v+'^2}{'+r+'} = '+fmt(Fc)+'$ Н',
        'Гэвч $F_c \\perp v$ (хурдны чиглэлд перпендикуляр)',
        '$W_ц = F_c \\cdot s \\cdot \\cos 90° = 0$ Ж'
      ],
      ans: '0 Ж'
    };
  },
  // 18. Хурдны өөрчлөлт ажил-энергийн теорем
  () => {
    var m = rnd(2,6), v0 = rnd(5,12), v1 = rnd(15,25);
    var Ek0 = m*v0*v0/2, Ek1 = m*v1*v1/2;
    var W = Ek1 - Ek0;
    return {
      given: 'm = '+m+' кг,   v₀ = '+v0+' м/с,   v = '+v1+' м/с',
      ask: 'Хийгдсэн ажил W?',
      story: m+' кг биетийг '+v0+' м/с-ээс '+v1+' м/с хүртэл хурдасгав.',
      steps: [
        '$W = \\Delta E_к = \\dfrac{m v^2}{2} - \\dfrac{m v_0^2}{2}$',
        '$W = \\dfrac{'+m+'('+v1+'^2 - '+v0+'^2)}{2} = \\dfrac{'+m+' \\cdot '+(v1*v1-v0*v0)+'}{2} = '+fmt(W)+'$ Ж'
      ],
      ans: fmt(W)+' Ж'
    };
  },
  // 19. Хамгийн бага ажил (хүнд өргөх)
  () => {
    var m = rnd(30,80), h = rnd(3,10), t = rnd(6,15);
    var W = m*G*h, P = W/t;
    return {
      given: 'm = '+m+' кг,   h = '+h+' м,   t = '+t+' с',
      ask: 'Ачааг өргөх ажил W ба чадал P?',
      story: m+' кг ачааг тогтмол хурдтайгаар '+h+' м өндөрт '+t+' секундэд өргөв.',
      steps: [
        '$W = m g h = '+m+' \\cdot 10 \\cdot '+h+' = '+fmt(W)+'$ Ж',
        '$P = \\dfrac{W}{t} = \\dfrac{'+fmt(W)+'}{'+t+'} = '+fmt(P)+'$ Вт'
      ],
      ans: 'W = '+fmt(W)+' Ж,  P = '+fmt(P)+' Вт'
    };
  },
  // 20. Тэнцвэрт байдлаас хазайлт руу гулгах (энергийн хадгаламж)
  () => {
    var h = rnd(1,5), m = rnd(2,6);
    var Ep = m*G*h;
    var v = Math.sqrt(2*G*h);
    return {
      given: 'h = '+h+' м,   m = '+m+' кг,   үрэлтгүй',
      ask: 'Хазайлтын өмнөх хурд v болон кинетик энерги?',
      story: m+' кг бие '+h+' м өндрөөс тайван байдлаас доош гулгав. Үрэлтгүй.',
      steps: [
        'Энергийн хадгаламж: $E_п = E_к$',
        '$m g h = \\dfrac{m v^2}{2} \\Rightarrow v = \\sqrt{2gh}$',
        '$v = \\sqrt{2 \\cdot 10 \\cdot '+h+'} = \\sqrt{'+(2*G*h)+'} \\approx '+v.toFixed(2)+'$ м/с',
        '$E_к = m g h = '+m+' \\cdot 10 \\cdot '+h+' = '+fmt(Ep)+'$ Ж'
      ],
      ans: 'v ≈ '+v.toFixed(2)+' м/с,  E_к = '+fmt(Ep)+' Ж'
    };
  },
];

function build() {
  var probs = '', answs = '';
  var items = GEN.map(function(g){ return g(); });
  items.forEach(function(it, i){
    var k = i + 1;
    probs +=
      '<div class="q">' +
      '  <div class="qh"><span class="qn">'+k+'.</span>'+it.story+
      '    <span class="qgiven"><b>Өгсөн:</b> '+it.given+'</span>' +
      '    <span class="qask"><b>Ол:</b> '+it.ask+'</span>' +
      '  </div>' +
      '  <div class="work"></div>' +
      '</div>';
    var stepsHtml = it.steps.map(function(s){ return '<div class="step">'+s+'</div>'; }).join('');
    answs +=
      '<div class="a">' +
      '  <span class="an">'+k+'.</span>' +
      '  <div style="display:inline-block;vertical-align:top;">'+
      '    <b>Хариу:</b> '+it.ans+
      '    <div style="margin-top:4px;">'+stepsHtml+'</div>' +
      '  </div>' +
      '</div>';
  });

  document.getElementById('sheet').innerHTML =
    '<div class="head"><h1>Физик — Механик ажил</h1><div class="sub">20 бодлого · Хэвлэж болно · Бодолт хавсаргах боломжтой</div></div>'
    + '<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    + '<div class="rule">Үндсэн томьёо: <b>$W = F \\cdot s \\cdot \\cos\\alpha$</b>, <b>$P = \\dfrac{W}{t}$</b>, <b>$E_к = \\dfrac{m v^2}{2}$</b>, <b>$E_п = mgh$</b>, <b>$W = \\Delta E_к$</b>.  &nbsp; g = 10 м/с² гэж авав.</div>'
    + '<div class="grid">'+probs+'</div>'
    + '<div class="ans-page" id="answers"><h2>Бодолт ба хариу</h2><div class="ans-list">'+answs+'</div></div>';

  toggleAns();
  try {
    renderMathInElement(document.getElementById('sheet'), {
      delimiters: [
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError: false
    });
  } catch(e) {}
}

build();
</script>
</body>
</html>
