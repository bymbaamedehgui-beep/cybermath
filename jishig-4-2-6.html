<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IV бүлэг — Жишиг даалгавар 2 (6-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 6-р анги · IV бүлэг. Магадлал — Жишиг даалгавар 2 (4.2 Үзэгдлийн магадлал · 4.3 Сонгон судлах — хүнд даалгавар, хөнгөн хэлбэрээр) */
function isPr(n) { if (n < 2) return false; for (var i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
function cnt(lo, hi, f) { var c = 0; for (var x = lo; x <= hi; x++) if (f(x)) c++; return c; }
function ucf(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
// P = c/n (хураасан хэлбэр нь өөр бол хоёуланг нь)
function pAns(c, n) { var raw = '\\dfrac{' + c + '}{' + n + '}', r = fr(c, n); return 'P=' + raw + (r === raw ? '' : '=' + r); }
var COL3 = [['улаан', 'хөх', 'шар'], ['цагаан', 'хар', 'ногоон'], ['улаан', 'ногоон', 'цэнхэр'], ['шар', 'хөх', 'ягаан']];
var WORDS = ['МОНГОЛ', 'ХАРАНДАА', 'ДЭВТЭР', 'ЦАГИРАГ', 'НАРАН', 'ЗУРАГ', 'ТООЛУУР', 'ГУРВАЛЖИН', 'МАГАДЛАЛ', 'ОЛОНЛОГ', 'ҮРЖВЭР', 'ДАДЛАГА', 'ХУРДАН', 'ШАТАР', 'ЦЭЦЭГ', 'ДӨРВӨЛЖИН'];
var VOW = 'АЭИОӨУҮ';
// n тэнцүү хэсэгтэй, 1..n дугаартай ээрүүл (зөвхөн дугаар — хариу илчлэхгүй)
function figSpin(n) {
  var R = 38, c = 42, g = '<circle cx="' + c + '" cy="' + c + '" r="' + R + '" fill="#fff" stroke="#1a1030" stroke-width="1.2"/>', i, a;
  for (i = 0; i < n; i++) {
    a = (-90 + i * 360 / n) * Math.PI / 180;
    g += '<line x1="' + c + '" y1="' + c + '" x2="' + (c + R * Math.cos(a)).toFixed(1) + '" y2="' + (c + R * Math.sin(a)).toFixed(1) + '" stroke="#1a1030" stroke-width="0.9"/>';
    a = (-90 + (i + 0.5) * 360 / n) * Math.PI / 180;
    g += '<text x="' + (c + 0.68 * R * Math.cos(a)).toFixed(1) + '" y="' + (c + 0.68 * R * Math.sin(a) + 4).toFixed(1) + '" font-size="11" text-anchor="middle" fill="#1a1030">' + (i + 1) + '</text>';
  }
  g += '<line x1="' + c + '" y1="' + c + '" x2="' + (c + 20) + '" y2="' + (c - 16) + '" stroke="#1a1030" stroke-width="1.8"/><circle cx="' + c + '" cy="' + c + '" r="2.6" fill="#1a1030"/>';
  return '<svg viewBox="0 0 84 84" width="70" height="70">' + g + '</svg>';
}

// 1. Шоо нэг удаа орхих: үзэгдлийн магадлал, гарцаагүй ба боломжгүй үзэгдэл (4.2)
function g1() {
  var t = rnd(0, 9), k, a, b, txt, f;
  if (t === 0) { txt = 'тэгш тоо буух'; f = function (x) { return x % 2 === 0; }; }
  else if (t === 1) { txt = 'сондгой тоо буух'; f = function (x) { return x % 2 === 1; }; }
  else if (t === 2) { txt = 'анхны тоо буух'; f = isPr; }
  else if (t === 3) { k = rnd(2, 7); txt = '$' + k + '$ тооноос бага тоо буух'; f = function (x) { return x < k; }; }
  else if (t === 4) { k = rnd(1, 5); txt = '$' + k + '$ тооноос их тоо буух'; f = function (x) { return x > k; }; }
  else if (t === 5) { k = rnd(2, 5); txt = '$' + k + '$ тоонд хуваагдах тоо буух'; f = function (x) { return x % k === 0; }; }
  else if (t === 6) { a = rnd(1, 5); b = rnd(a + 1, 6); txt = '$' + a + '$ эсвэл $' + b + '$ буух'; f = function (x) { return x === a || x === b; }; }
  else if (t === 7) { k = rnd(7, 9); txt = '$' + k + '$ буух'; f = function (x) { return x === k; }; }
  else if (t === 8) { k = rnd(1, 6); txt = '$' + k + '$ буух'; f = function (x) { return x === k; }; }
  else { txt = 'анхны биш тоо буух'; f = function (x) { return !isPr(x); }; }
  var c = cnt(1, 6, f);
  return { stem: ucf(txt), a: '$' + pAns(c, 6) + '$' + (c === 0 ? ' (боломжгүй үзэгдэл)' : c === 6 ? ' (гарцаагүй үзэгдэл)' : '') };
}
// 2. Таамгаар авах, сонгох туршилт: бөмбөг, харандаа, дугаартай карт, ээрүүл, тоонуудын олонлог, хоёр оронтой тоо, үгийн үсэг (4.2)
function g2() {
  var t = rnd(1, 7), k, txt, f, c;
  if (t <= 2) {
    var col = pick(COL3), a = rnd(2, 9), b = rnd(2, 9), cc = rnd(2, 9), n = a + b + cc, u = rnd(0, 3);
    if (u === 0) { k = b; txt = col[1]; } else if (u === 1) { k = n - a; txt = col[0] + ' биш'; } else if (u === 2) { k = a + cc; txt = col[0] + ' эсвэл ' + col[2]; } else { k = 0; txt = 'бор'; }
    var obj = t === 1 ? ['Хайрцагт', 'бөмбөг'] : ['Саванд', 'харандаа'];
    return { stem: obj[0] + ' $' + a + '$ ' + col[0] + ', $' + b + '$ ' + col[1] + ', $' + cc + '$ ' + col[2] + ' ' + obj[1] + ' бий. Таамгаар авсан ' + obj[1] + ' ' + txt + ' байх',
      a: 'Нийт $' + n + '$, таатай $' + k + '$; $' + pAns(k, n) + '$' };
  }
  if (t === 3) {
    var N = pick([10, 12, 15, 16, 18, 20, 24, 25, 30]), v = rnd(0, 3);
    if (v === 0) { txt = 'тэгш'; f = function (x) { return x % 2 === 0; }; } else if (v === 1) { txt = 'анхны'; f = isPr; }
    else if (v === 2) { k = pick([3, 4, 5]); txt = '$' + k + '$ тоонд хуваагдах'; f = function (x) { return x % k === 0; }; } else { txt = 'нэг оронтой'; f = function (x) { return x < 10; }; }
    c = cnt(1, N, f);
    return { stem: '$1,\\ 2,\\ \\ldots,\\ ' + N + '$ дугаартай картаас нэгийг таамгаар авахад ' + txt + ' дугаартай карт гарах', a: 'Нийт $' + N + '$, таатай $' + c + '$; $' + pAns(c, N) + '$' };
  }
  if (t === 4) {
    var S = pick([4, 5, 6, 8, 10]), w = rnd(0, 3);
    if (w === 0) { txt = 'тэгш тоон дээр'; f = function (x) { return x % 2 === 0; }; } else if (w === 1) { txt = 'анхны тоон дээр'; f = isPr; }
    else if (w === 2) { k = rnd(2, S - 1); txt = '$' + k + '$ тооноос их тоон дээр'; f = function (x) { return x > k; }; } else { txt = '$3$ тоонд хуваагдах тоон дээр'; f = function (x) { return x % 3 === 0; }; }
    c = cnt(1, S, f);
    return { stem: 'Зурагт үзүүлсэн ээрүүлийг эргүүлэхэд зүү ' + txt + ' зогсох', fig: figSpin(S), a: 'Нийт $' + S + '$, таатай $' + c + '$; $' + pAns(c, S) + '$' };
  }
  if (t === 5) {
    var M = pick([20, 24, 25, 30, 36, 40, 50]), z = rnd(0, 3);
    if (z === 0) { txt = 'анхны тоо'; f = isPr; } else if (z === 1) { k = pick([3, 4, 6, 7, 8, 9]); txt = '$' + k + '$ тоонд хуваагдах тоо'; f = function (x) { return x % k === 0; }; }
    else if (z === 2) { txt = 'бүтэн квадрат тоо'; f = function (x) { var r = Math.round(Math.sqrt(x)); return r * r === x; }; } else { txt = '$5$ цифрээр төгссөн тоо'; f = function (x) { return x % 10 === 5; }; }
    c = cnt(1, M, f);
    return { stem: '$1,\\ 2,\\ 3,\\ \\ldots,\\ ' + M + '$ тоонуудаас нэгийг санамсаргүйгээр сонгоход ' + txt + ' гарах', a: 'Нийт $' + M + '$, таатай $' + c + '$; $' + pAns(c, M) + '$' };
  }
  if (t === 6) {
    var y = rnd(0, 4);
    if (y === 0) { k = pick([3, 4, 6, 9, 11, 15]); txt = '$' + k + '$ тоонд хуваагдах'; f = function (x) { return x % k === 0; }; }
    else if (y === 1) { txt = 'цифрүүд нь ижил'; f = function (x) { return Math.floor(x / 10) === x % 10; }; }
    else if (y === 2) { k = rnd(5, 12); txt = 'цифрүүдийн нийлбэр нь $' + k + '$ байх'; f = function (x) { return Math.floor(x / 10) + x % 10 === k; }; }
    else if (y === 3) { k = rnd(1, 9); txt = '$' + k + '$ цифрээр эхэлсэн'; f = function (x) { return Math.floor(x / 10) === k; }; }
    else { txt = 'хоёр цифр нь хоёулаа сондгой'; f = function (x) { return Math.floor(x / 10) % 2 === 1 && x % 2 === 1; }; }
    c = cnt(10, 99, f);
    return { stem: 'Хоёр оронтой бүх тооноос нэгийг сонгоход ' + txt + ' тоо гарах', a: 'Нийт $90$, таатай $' + c + '$; $' + pAns(c, 90) + '$' };
  }
  var W = pick(WORDS), q = rnd(0, 2), L = W.charAt(rnd(0, W.length - 1)), i, ch; c = 0;
  for (i = 0; i < W.length; i++) { ch = W.charAt(i); if (q === 0 ? ch === L : q === 1 ? VOW.indexOf(ch) >= 0 : ch !== L) c++; }
  txt = q === 0 ? '«' + L + '» үсэг' : q === 1 ? 'эгшиг үсэг' : '«' + L + '» биш үсэг';
  return { stem: '«' + W + '» үгийн үсгүүдээс нэгийг санамсаргүйгээр сонгоход ' + txt + ' гарах', a: 'Нийт $' + W.length + '$, таатай $' + c + '$; $' + pAns(c, W.length) + '$' };
}
// 3. Нийлмэл ба урвуу бодлого: зоос, магадлалаас тоо олох, бөмбөг нэмэх, ахлагч-орлогч (4.2 · 4.3)
function g3() {
  var t = rnd(1, 4), c = 0;
  if (t === 1) {
    var n = rnd(2, 3), u = rnd(0, 3), tot = Math.pow(2, n), m, k, b;
    for (m = 0; m < tot; m++) { k = 0; for (b = 0; b < n; b++) if ((m >> b) & 1) k++; if (u === 0 ? k === n : u === 1 ? k >= 1 : u === 2 ? k === 1 : (k === 0 || k === n)) c++; }
    var tx = ['бүгд сүлдээрээ буух', 'ядаж нэг нь сүлдээрээ буух', 'яг нэг нь сүлдээрээ буух', 'бүгд ижил талаараа буух'][u];
    return { stem: (n === 2 ? 'Хоёр' : 'Гурван') + ' зоосыг зэрэг орхиход ' + tx + ' магадлалыг ол.', a: 'Нийт $' + tot + '$ боломж, таатай $' + c + '$; $' + pAns(c, tot) + '$' };
  }
  if (t === 2) {
    var N = pick([20, 24, 30, 36, 40, 50, 60]), q = pick([3, 4, 5, 6, 10]), p = rnd(1, q - 1); if (N % q || gcd(p, q) !== 1) return null;
    var col = pick(['улаан', 'хөх', 'ногоон', 'шар']);
    return { stem: 'Уутанд $' + N + '$ бөмбөг бий. ' + ucf(col) + ' бөмбөг гарах магадлал $\\dfrac{' + p + '}{' + q + '}$ бол ' + col + ' бөмбөг хэд вэ? Өөр өнгийнх гарах магадлал хэд вэ?',
      a: '$' + N + '\\cdot \\dfrac{' + p + '}{' + q + '}=' + (N * p / q) + '$ бөмбөг; $1-\\dfrac{' + p + '}{' + q + '}=' + fr(q - p, q) + '$' };
  }
  if (t === 3) {
    var a = rnd(2, 8), bb = rnd(3, 10), xx = rnd(1, 8), num = a + xx, den = a + bb + xx, g = gcd(num, den);
    if (den / g > 9 || den / g === 1) return null;
    return { stem: 'Хайрцагт $' + a + '$ улаан, $' + bb + '$ хөх бөмбөг байв. Хэдэн улаан бөмбөг нэмбэл улаан бөмбөг гарах магадлал $' + fr(num, den) + '$ болох вэ?',
      a: '$\\dfrac{' + a + '+x}{' + (a + bb) + '+x}=' + fr(num, den) + '$, $x=' + xx + '$' };
  }
  var nn = rnd(8, 15), kk = rnd(3, nn - 3), w = rnd(0, 1), fav = w ? (nn - kk) * (nn - kk - 1) : kk * (kk - 1);
  return { stem: 'Ангийн $' + nn + '$ сурагчийн $' + kk + '$ нь охин. Ахлагч, орлогч хоёрыг санамсаргүйгээр сонгоход хоёулаа ' + (w ? 'хөвгүүн' : 'охин') + ' байх магадлалыг ол.',
    a: 'Нийт $' + nn + '\\cdot ' + (nn - 1) + '=' + (nn * (nn - 1)) + '$, таатай $' + fav + '$; $' + pAns(fav, nn * (nn - 1)) + '$' };
}
// 4. Хоёр шоо зэрэг орхих — 36 боломжоос тоолох (4.3 сонгон, хөнгөн хэлбэр)
function g4() {
  var t = rnd(0, 9), s = rnd(2, 12), d = rnd(1, 4), m = rnd(4, 10), c = 0, x, y, txt, f;
  if (t === 0) { txt = 'Нийлбэр нь $' + s + '$ байх'; f = function (a, b) { return a + b === s; }; }
  else if (t === 1) { txt = 'Нийлбэр нь $' + m + '$ тооноос их байх'; f = function (a, b) { return a + b > m; }; }
  else if (t === 2) { txt = 'Нийлбэр нь $' + m + '$ тооноос бага байх'; f = function (a, b) { return a + b < m; }; }
  else if (t === 3) { txt = 'Хоёулаа ижил тоо буух'; f = function (a, b) { return a === b; }; }
  else if (t === 4) { txt = 'Үржвэр нь тэгш байх'; f = function (a, b) { return (a * b) % 2 === 0; }; }
  else if (t === 5) { txt = 'Нийлбэр нь тэгш байх'; f = function (a, b) { return (a + b) % 2 === 0; }; }
  else if (t === 6) { txt = 'Ядаж нэг нь $6$ буух'; f = function (a, b) { return a === 6 || b === 6; }; }
  else if (t === 7) { txt = 'Хоёулаа тэгш тоо буух'; f = function (a, b) { return a % 2 === 0 && b % 2 === 0; }; }
  else if (t === 8) { txt = 'Нийлбэр нь $3$ тоонд хуваагдах'; f = function (a, b) { return (a + b) % 3 === 0; }; }
  else { txt = 'Ялгавар нь $' + d + '$ байх'; f = function (a, b) { return Math.abs(a - b) === d; }; }
  for (x = 1; x <= 6; x++) for (y = 1; y <= 6; y++) if (f(x, y)) c++;
  if (c === 0) return null;
  return { stem: txt, a: 'Таатай $' + c + '$; $' + pAns(c, 36) + '$' };
}

CMX.jishig({
  title: 'IV бүлэг — Жишиг даалгавар 2',
  sub: 'Үзэгдлийн магадлал · шоо, зоос, бөмбөг · тоо ба үсэг сонгох · нийлмэл бодлого',
  grade: '6-р анги',
  rule: '$P=\\dfrac{m}{n}$: $m$ — таатай, $n$ — нийт боломжийн тоо &nbsp;·&nbsp; Гарцаагүй үзэгдэл $P=1$, боломжгүй үзэгдэл $P=0$ &nbsp;·&nbsp; $0\\le P\\le 1$',
  tasks: [
    { label: 'Шоог нэг удаа орхиход үзэгдлийн магадлалыг ол.', gen: g1, n: 8, nw: 4, cols: 4, wk: 12 },
    { label: 'Үзэгдлийн магадлалыг ол.', gen: g2, n: 8, nw: 2, cols: 2, wk: 14 },
    { label: 'Бодлогыг бод.', gen: g3, n: 4, nw: 2, cols: 2, wk: 20 },
    { label: 'Хоёр шоог зэрэг орхив. Үзэгдлийн магадлалыг ол.', gen: g4, n: 6, nw: 2, cols: 2, wk: 18 }
  ]
});
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
