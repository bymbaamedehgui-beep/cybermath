<script>
// ══════════ g6core.js — 6-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';

 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';

// ══════════ g6ch5.js — V БҮЛЭГ. АЛГЕБРЫН ИЛЭРХИЙЛЭЛ, ТЭГШИТГЭЛ (6-р анги) ══════════
// Сурах бичгийн 70–82 хуудасны ДАСГАЛУУДЫН хэлбэрээр зохиогдсон.
// ЗАРЧИМ: тооцооллын бодлогод q нь ЗӨВХӨН илэрхийлэл. Заавар нь plan.json дахь task.label-д ганц удаа.

// ═══════════ НИЙТЛЭГ ТУСЛАХУУД ═══════════
// Гишүүдийн массиваас илэрхийлэл: [{c:2,v:'x'},{c:-3,v:''}] → '2x-3'
function pl(terms){
 var s='',first=true,i,c,v,body;
 for(i=0;i<terms.length;i++){
  c=terms[i].c; v=terms[i].v||'';
  if(c===0) continue;
  if(v===''){ body=''+Math.abs(c); }
  else { body=(Math.abs(c)===1?'':''+Math.abs(c))+v; }
  if(first){ s+=(c<0?'-':'')+body; first=false; }
  else { s+=(c<0?'-':'+')+body; }
 }
 return s===''?'0':s;
}
// Ганц гишүүн: 1x→x, -1x→-x
function tm(c,v){ if(c===0) return '0'; if(v==='') return ''+c; if(c===1) return v; if(c===-1) return '-'+v; return c+v; }
// Гишүүдийг нэгтгэх: [{c,v}] → {v:c} нэгтгэсэн массив (v-ийн дараалал хадгална)
function collect(terms){
 var order=[],map={},i,v;
 for(i=0;i<terms.length;i++){ v=terms[i].v||''; if(map[v]===undefined){map[v]=0;order.push(v);} map[v]+=terms[i].c; }
 return order.map(function(k){return {c:map[k],v:k};});
}
// Хувьсагчтай гишүүдийг эхэнд, сул гишүүнийг сүүлд
function sortTerms(ts){
 var a=[],b=[],i;
 for(i=0;i<ts.length;i++){ if((ts[i].v||'')==='') b.push(ts[i]); else a.push(ts[i]); }
 return a.concat(b);
}
// Түлхүүр: асуултын мөрөөс шууд (нэг хуудсан дээр давхардахгүй байх баталгаа)
function ucf(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function kq(pref,s){ return pref+'|'+String(s).replace(/\s+/g,''); }

var NSUF={2:{i:'-оор',a:'-ыг',d:'-т'},3:{i:'-аар',a:'-ыг',d:'-т'},4:{i:'-өөр',a:'-ийг',d:'-т'},
 5:{i:'-аар',a:'-ыг',d:'-д'},6:{i:'-гаар',a:'-г',d:'-д'},7:{i:'-гоор',a:'-г',d:'-д'},

 12:{i:'-оор',a:'-ыг',d:'-т'},15:{i:'-аар',a:'-ыг',d:'-д'},20:{i:'-оор',a:'-ыг',d:'-д'}};
var NPOOL=[2,3,4,5,6,7,8,9,10,12,15,20];
function sfI(n){return NSUF[n].i;}
function sfA(n){return NSUF[n].a;}
function sfD(n){return NSUF[n].d;}

// [дасгал 1, 2] Үгэн илэрхийллийг алгебрын илэрхийлэл болгох.
function g_alg_wordToExpr(){
 var V=pick(VARS), W=pick(VARS), n=pick(NPOOL), m=pick(NPOOL), t=rnd(0,9), q, e;
 if(t===0){ q='$'+V+'$ тоог $'+n+'$'+sfI(n)+' нэмэгдүүлэв.'; e=pl([{c:1,v:V},{c:n,v:''}]); }
 else if(t===1){ q='$'+V+'$ тооноос $'+n+'$'+sfA(n)+' хасав.'; e=pl([{c:1,v:V},{c:-n,v:''}]); }
 else if(t===2){ q='$'+V+'$ тоог $'+n+'$ дахин нэмэгдүүлэв.'; e=tm(n,V); }
 else if(t===3){ q='$'+V+'$ тоог $'+n+'$'+sfD(n)+' хуваав.'; e='\\dfrac{'+V+'}{'+n+'}'; }
 else if(t===4){ q='$'+V+'$ тоог $'+n+'$'+sfI(n)+' үржүүлж, $'+m+'$'+sfA(m)+' нэмэв.'; e=pl([{c:n,v:V},{c:m,v:''}]); }
 else if(t===5){ q='$'+V+'$ тоог $'+n+'$'+sfI(n)+' үржүүлж, $'+m+'$'+sfA(m)+' хасав.'; e=pl([{c:n,v:V},{c:-m,v:''}]); }
 else if(t===6){ q='$'+V+'$ тоон дээр $'+m+'$'+sfA(m)+' нэмж, $'+n+'$ дахин нэмэгдүүлэв.'; e=n+'\\bigl('+pl([{c:1,v:V},{c:m,v:''}])+'\\bigr)'; }
 else if(t===7){ q='$'+V+'$ тооноос $'+n+'$ дахин бага тоо.'; e='\\dfrac{'+V+'}{'+n+'}'; }
 else if(t===8){ if(V===W) return null; q='$'+V+'$ ба $'+W+'$ тооны нийлбэрийг $'+n+'$'+sfI(n)+' үржүүлэв.'; e=n+'\\bigl('+V+'+'+W+'\\bigr)'; }
 else { if(V===W) return null; q='$'+V+'$ ба $'+W+'$ тооны нийлбэрийн хагас.'; e='\\dfrac{'+V+'+'+W+'}{2}'; }
 return {q:q, a:'$'+e+'$', key:kq('w2e',q)};
}

// [дасгал 2б] Алгебрын илэрхийллийг үгээр илэрхийлэх.
function g_alg_exprToWord(){

 if(t===0){ q='$'+pl([{c:1,v:V},{c:n,v:''}])+'$'; a='$'+V+'$ тоог $'+n+'$'+sfI(n)+' нэмэгдүүлсэн тоо.'; }
 else if(t===1){ q='$'+pl([{c:1,v:V},{c:-n,v:''}])+'$'; a='$'+V+'$ тооноос $'+n+'$'+sfA(n)+' хассан тоо.'; }
 else if(t===2){ q='$'+tm(n,V)+'$'; a='$'+V+'$ тоог $'+n+'$ дахин нэмэгдүүлсэн тоо.'; }
 else if(t===3){ q='$\\dfrac{'+V+'}{'+n+'}$'; a='$'+V+'$ тоог $'+n+'$'+sfD(n)+' хуваасан ноогдвор.'; }
 else if(t===4){ q='$'+pl([{c:n,v:V},{c:m,v:''}])+'$'; a='$'+V+'$ тоог $'+n+'$ дахин нэмэгдүүлж, $'+m+'$'+sfA(m)+' нэмсэн тоо.'; }
 else { q='$'+n+'\\bigl('+pl([{c:1,v:V},{c:-m,v:''}])+'\\bigr)$'; a='$'+V+'$ тооноос $'+m+'$'+sfA(m)+' хасаад, $'+n+'$ дахин нэмэгдүүлсэн тоо.'; }

}

// [дасгал 1а] Сагсан дахь зүйлийн тоо — илэрхийлэл зохиох.
var WPOBJ=[['алим','гадил','лийр'],['улаан бал','цэнхэр бал','ногоон бал'],['дэвтэр','ном','харандаа'],['сарнай','лиш','цахирмаа']];

// [дасгал 15] Хөлийн тоог олох илэрхийлэл (зараа 4, туулай 4, болжмор 2).
var ANIM=[['зараа',4],['туулай',4],['болжмор',2],['тахиа',2],['үнэг',4],['галуу',2]];
function g_alg_legsExpr(){

// [дасгал 15б] Хөлийн тооны тоон утга.
function g_alg_legsValue(){

// [Жишээ 2] Нийт үнийг олох илэрхийлэл зохиох.
var GOODS=[['дэвтэр','үзэг'],['ном','харандаа'],['талх','сүү'],['алим','жүрж'],['бал','баллуур'],['цаас','цавуу']];
function g_alg_costExpr(){

// [Жишээ 3] Нийт үнийн илэрхийллийн тоон утга.
function g_alg_costValue(){

 var q='Нэг бүр нь $'+A+'$ төгрөгийн үнэтэй '+g[0]+'-ээс $a$ ширхэг, нэг бүр нь $'+B+'$ төгрөгийн үнэтэй '+g[1]+'-ээс $b$ ширхэг авав. $a='+a+'$, $b='+b+'$ үед нийт үнийг ол.';

   a:'$'+pl([{c:A,v:'a'},{c:B,v:'b'}])+'$; $'+A+'\\cdot '+a+'+'+B+'\\cdot '+b+'='+v+'$ төгрөг.',

// [дасгал 3а] Хариулт мөнгийг олох илэрхийлэл.
function g_alg_changeExpr(){

// [Жишээ 4, дасгал 4] Илэрхийлэл хэдэн гишүүнтэй вэ? Гишүүдийг нэрлэ.
function g_alg_terms(){
 var n=rnd(2,4), vs=shuffle(['x','y','a','b','m']).slice(0,n), ts=[], i;
 for(i=0;i<n;i++){ ts.push({c:nz(-9,9),v:vs[i]}); }
 if(rnd(0,1)) ts.push({c:nz(-30,30),v:''});

 for(i=0;i<ts.length;i++) parts.push('$'+(ts[i].v===''?''+ts[i].c:tm(ts[i].c,ts[i].v))+'$');
 return {q:'$'+q+'$', a:parts.length+' гишүүнтэй: '+parts.join(', ')+'.',
         key:kq('tr',q), nv:parts.length};
}

// [Жишээ 4-ийн тайлбар] Коэффициент ба сул гишүүн.
function g_alg_coef(){

 if(Math.abs(c1)===1||Math.abs(c2)===1) return null;
 var q=pl([{c:c1,v:v1},{c:c0,v:''},{c:c2,v:v2}]);
 return {q:'$'+q+'$', a:'$'+v1+'$-ийн коэффициент $'+c1+'$, $'+v2+'$-ийн коэффициент $'+c2+'$, сул гишүүн $'+c0+'$.',
         key:kq('cf',q)};
}

// [дасгал 6] Илэрхийллийн тоон утгыг олох (шугаман).
function g_alg_value1(){
 var V=pick(VARS), t=rnd(0,3), a=nz(-9,9), b=nz(-20,20), v=nz(-9,9), q, st, val;
 if(Math.abs(a)===1&&t!==2) return null;
 if(t===0){ q=pl([{c:a,v:V},{c:b,v:''}]); val=a*v+b; st=a+'\\cdot '+paren(v)+(b<0?'-'+(-b):'+'+b); }
 else if(t===1){ q=pl([{c:b,v:''},{c:a,v:V}]); val=b+a*v; st=b+(a<0?'-'+(-a):'+'+a)+'\\cdot '+paren(v); }
 else if(t===2){ a=nz(2,9); q=a+'\\bigl('+pl([{c:1,v:V},{c:b,v:''}])+'\\bigr)'; val=a*(v+b); st=a+'\\cdot '+paren(v+b); }
 else { a=nz(2,9); b=nz(2,20); q=a+'\\bigl('+pl([{c:b,v:''},{c:-1,v:V}])+'\\bigr)'; val=a*(b-v); st=a+'\\cdot '+paren(b-v); }
 return {q:'$'+q+'$, $'+V+'='+v+'$', a:'$'+st+'='+val+'$', key:kq('v1',q+'@'+V+v), nv:val};
}

// [дасгал 6д, е] Зэрэгтэй ба аравтын бутархайтай илэрхийллийн утга.
function g_alg_value2(){
 var V=pick(VARS), t=rnd(0,3), v, k, c, val, q, st;
 if(t===0){ k=rnd(2,6); v=nz(-8,8); val=k*v*v; q=tm(k,V)+'^{2}'; st=k+'\\cdot '+paren(v)+'^{2}='+k+'\\cdot '+(v*v); }
 else if(t===1){ c=nz(-20,20); v=nz(-8,8); val=v*v+c; q=pl([{c:1,v:V+'^{2}'},{c:c,v:''}]); st=paren(v)+'^{2}'+(c<0?'-'+(-c):'+'+c)+'='+(v*v)+(c<0?'-'+(-c):'+'+c); }
 else if(t===2){ c=nz(-20,20); k=rnd(2,5); v=nz(-6,6); val=c+k*v*v; q=pl([{c:c,v:''},{c:k,v:V+'^{2}'}]); st=c+'+'+k+'\\cdot '+paren(v)+'^{2}='+c+'+'+(k*v*v); }
 else { var d10=pick([50,25,20]), f={50:2,25:4,20:5}[d10], mm=nz(-12,12), ten=f*mm;
  c=rnd(2,30); val=c+mm/10;
  q=''+c+'+'+decStr(d10/100,2)+V;
  st=c+'+'+decStr(d10/100,2)+'\\cdot '+paren(ten/10)+'='+c+(mm<0?'-'+decStr(-mm/10,1):'+'+decStr(mm/10,1));
  return {q:'$'+q+'$, $'+V+'='+decStr(ten/10,2)+'$', a:'$'+st+'='+decStr(val,2)+'$', key:kq('v2d',q+'@'+ten), nv:val}; }
 return {q:'$'+q+'$, $'+V+'='+v+'$', a:'$'+st+'='+val+'$', key:kq('v2',q+'@'+V+v), nv:val};
}

// [дасгал 8] Адилтгал тэнцүү илэрхийлэл мөн үү?
function g_alg_identEq(){
 var t=rnd(0,7), V=pick(['x','a','m','b']), W=pick(['y','n','c','d']), k=rnd(2,9), n=rnd(2,12), q, a;
 if(V===W) return null;
 if(t===0){ q='$0+'+V+'$ ба $'+V+'$'; a='Тийм. Тэгийг нэмэхэд тоо өөрчлөгдөхгүй: $0+'+V+'='+V+'$.'; }
 else if(t===1){ q='$'+V+'\\cdot 1$ ба $'+V+'$'; a='Тийм. Нэгээр үржүүлэхэд тоо өөрчлөгдөхгүй: $'+V+'\\cdot 1='+V+'$.'; }
 else if(t===2){ var p=rnd(2,9); q='$'+tm(p,V)+'+'+tm(k,V)+'$ ба $'+tm(p+k,V)+'$'; a='Тийм. Төсөөтэй гишүүдийг эмхэтгэвэл $'+tm(p,V)+'+'+tm(k,V)+'='+tm(p+k,V)+'$.'; }
 else if(t===3){ q='$'+V+'+'+W+'$ ба $'+W+'+'+V+'$'; a='Тийм. Нэмэхийн байр солих хууль ёсоор $'+V+'+'+W+'='+W+'+'+V+'$.'; }
 else if(t===4){ q='$'+k+'\\bigl('+V+'+'+W+'\\bigr)$ ба $'+tm(k,V)+'+'+tm(k,W)+'$'; a='Тийм. Гишүүнчлэн үржүүлэх дүрмээр $'+k+'\\bigl('+V+'+'+W+'\\bigr)='+tm(k,V)+'+'+tm(k,W)+'$.'; }
 else if(t===5){ var p2=rnd(2,9); if(p2===k) return null;
  q='$'+tm(p2,V)+'+'+tm(k,W)+'$ ба $'+tm(k,V)+'+'+tm(p2,W)+'$';
  a='Үгүй. $'+V+'=1$, $'+W+'=0$ үед эхнийх $'+p2+'$, хоёр дахь нь $'+k+'$ болно.'; }
 else if(t===6){ q='$'+V+'-'+W+'$ ба $'+W+'-'+V+'$';
  a='Үгүй. $'+V+'=1$, $'+W+'=0$ үед эхнийх $1$, хоёр дахь нь $-1$ болно.'; }
 else { q='$'+k+'\\bigl('+V+'+'+n+'\\bigr)$ ба $'+tm(k,V)+'+'+n+'$';
  a='Үгүй. $'+V+'=0$ үед эхнийх $'+(k*n)+'$, хоёр дахь нь $'+n+'$ болно.'; }
 return {q:q, a:a, key:kq('ie',q)};
}

// [дасгал 9, 10] Нэг утга дээр тэнцүү гарсан нь адилтгал тэнцүүг батлах уу?
function g_alg_identTest(){
 var t=rnd(0,2), c=rnd(2,9), k=rnd(2,6), q, a, v0=rnd(1,6);
 if(t===0){ var b1=rnd(2,15), val=v0+b1, k2=rnd(2,5); var b2=val-k2*v0;
  if(b2<=0||b2===b1||k2===1) return null;
  q='$'+pl([{c:1,v:'x'},{c:b1,v:''}])+'$ ба $'+pl([{c:k2,v:'x'},{c:b2,v:''}])+'$ илэрхийллүүд $x='+v0+'$ үед адилхан $'+val+'$ гэсэн утгатай. Эдгээрийг адилтгал тэнцүү илэрхийлэл гэж болох уу?';
  a='Үгүй. $x=0$ үед эхнийх $'+b1+'$, хоёр дахь нь $'+b2+'$ болж ялгаатай гарна.'; }
 else if(t===1){ var A=rnd(2,6), B=A+k;
  q='$'+tm(A,'x')+'+'+tm(k,'x^{2}')+'$ ба $'+tm(B,'x^{2}')+'$ илэрхийллүүд $x=0$ ба $x='+1+'$ үед адилхан утгатай. Эдгээрийг адилтгал тэнцүү илэрхийлэл гэж болох уу?';
  a='Үгүй. $x=2$ үед эхнийх $'+(2*A+4*k)+'$, хоёр дахь нь $'+(4*B)+'$ болж ялгаатай гарна.'; }
 else { var p=rnd(2,9), r=rnd(2,9); if(p===r) return null;
  q='$'+tm(p,'x')+'+'+tm(r,'y')+'$ ба $'+tm(r,'x')+'+'+tm(p,'y')+'$ илэрхийллүүд $x=y='+c+'$ үед адилхан $'+((p+r)*c)+'$ гэсэн утгатай. Эдгээрийг адилтгал тэнцүү илэрхийлэл гэж болох уу?';
  a='Үгүй. $x=1$, $y=0$ үед эхнийх $'+p+'$, хоёр дахь нь $'+r+'$ болж ялгаатай гарна.'; }
 return {q:q, a:a, key:kq('it',q)};
}

// [дасгал 5, 16] Дүрсийн периметрийг олох илэрхийлэл.
function g_alg_perim(){
 var t=rnd(0,5), V=pick(['a','x','m','b']), W=pick(['b','y','n','c']), n=rnd(1,9), fig, e;
 if(V===W) return null;
 if(t===0){ fig=figTri(V,V,V); e=tm(3,V); }
 else if(t===1){ fig=figTri(V+'+'+n,V+'+'+n,V); e=pl([{c:3,v:V},{c:2*n,v:''}]); }
 else if(t===2){ fig=figTri(V,W,V+'+'+W); e=pl([{c:2,v:V},{c:2,v:W}]); }
 else if(t===3){ fig=figSq(V+'+'+n); e=pl([{c:4,v:V},{c:4*n,v:''}]); }
 else if(t===4){ fig=figRect(V,W); e=pl([{c:2,v:V},{c:2,v:W}]); }
 else { fig=figKite(V,W); e=pl([{c:2,v:V},{c:2,v:W}]); }
 return {q:'', fig:fig, a:'$P='+e+'$', key:'pm-'+t+'-'+V+W+'-'+n};
}

// [дасгал 5 + 6 хосолсон] Дүрсийн периметрийн тоон утга.
function g_alg_perimValue(){
 var t=rnd(0,3), n=rnd(1,9), v=rnd(2,12), fig, e, val;
 if(t===0){ fig=figTri('x','x','x'); e='3x'; val=3*v; }
 else if(t===1){ fig=figSq('x+'+n); e=pl([{c:4,v:'x'},{c:4*n,v:''}]); val=4*(v+n); }
 else if(t===2){ fig=figRect('x','x+'+n); e=pl([{c:4,v:'x'},{c:2*n,v:''}]); val=4*v+2*n; }
 else { fig=figTri('x','x+'+n,'x'); e=pl([{c:3,v:'x'},{c:n,v:''}]); val=3*v+n; }
 return {q:'$x='+v+'$', fig:fig, a:'$P='+e+'$; $P='+val+'$', key:'pv-'+t+'-'+n+'-'+v, nv:val};
}

// [Тоон пирамид] Пирамидын дээд нүдний илэрхийлэл.
function g_alg_pyramidExpr(){
 var t=rnd(0,2), V=pick(['a','x','m']), W=pick(['b','y','n']), n=rnd(1,9), b1,b2,b3, e;
 if(V===W) return null;
 if(t===0){ b1=V; b2=''+n; b3=W; e=pl([{c:1,v:V},{c:1,v:W},{c:2*n,v:''}]); }
 else if(t===1){ var m=rnd(1,9); if(m===n) return null; b1=''+n; b2=V; b3=''+m; e=pl([{c:2,v:V},{c:n+m,v:''}]); }
 else { b1=V; b2=W; b3=V; e=pl([{c:2,v:V},{c:2,v:W}]); }
 return {q:'', fig:figPyr3(b1,b2,b3), a:'$'+e+'$', key:'py-'+t+'-'+V+W+'-'+n+'-'+b1+b2+b3};
}

// [Тоон пирамид г] Дээд нүд өгөгдсөн үед доод мөрийн боломжит бүх хувилбар.
function g_alg_pyramidBack(){
 var top=rnd(8,26), a=rnd(1,6), b;
 // top = a + 2b + c;  a, b, c натурал
 var out=[], bb;
 for(bb=1;2*bb<top-1;bb++){ /* тоолол */ }
 b=rnd(1,Math.floor((top-2)/2));
 var c=top-a-2*b;
 if(c<1) return null;
 var cnt=0, x, y;
 for(y=1;y<=Math.floor((top-2)/2);y++) for(x=1;x<=top-2*y-1;x++) cnt++;
 return {q:'', fig:figPyr3('a','b','c',''+top),
   a:'$a+2b+c='+top+'$. Жишээ нь $a='+a+'$, $b='+b+'$, $c='+c+'$. Нийт $'+cnt+'$ хувилбар байна.',
   key:'pyb-'+top, nv:cnt};
}

// [Тоон пирамид] Доод мөр тоонуудаар өгөгдсөн — дээд нүдийг ол.
function g_alg_pyramidNum(){
 var a=rnd(1,20), b=rnd(1,20), c=rnd(1,20);
 if(a===b&&b===c) return null;
 var m1=a+b, m2=b+c, top=m1+m2;
 return {q:'', fig:figPyr3(''+a,''+b,''+c),
   a:'$'+a+'+'+b+'='+m1+'$, $'+b+'+'+c+'='+m2+'$, $'+m1+'+'+m2+'='+top+'$.',
   key:'pyn-'+a+'-'+b+'-'+c, nv:top};
}

// [дасгал 3б] Насны бодлого — илэрхийлэл зохиож бодох.
function g_alg_ageProb(){
 var k=rnd(3,6), x=rnd(6,15), S=x*(k+1), name=pick(['Бат','Дорж','Сүх','Оюун','Түмэн']);
 return {q:name+' $x$ настай, аав нь түүнээс $'+k+'$ дахин их настай. Хэрэв тэр хоёрын насны нийлбэр $'+S+'$ бол '+name+'-ыг төрөхөд аав нь хэдэн настай байсан бэ?',
         a:'$x+'+tm(k,'x')+'='+S+'$; $'+tm(k+1,'x')+'='+S+'$; $x='+x+'$. Аавын нас $'+(k*x)+'$, ялгавар $'+(k*x-x)+'$ нас.',
         key:'ag-'+k+'-'+x+'-'+name, nv:k*x-x};

// 5.2 АЛГЕБРЫН ИЛЭРХИЙЛЛИЙГ ХЯЛБАРЧЛАХ (х.72–74)
// ═══════════════════════════════════════════════════════════════════

// Хялбарчилсан хариу: гишүүдийг нэгтгээд хувьсагчтайг эхэнд
function simp(terms){ return pl(sortTerms(collect(terms))); }
// Бутархай коэффициенттэй гишүүн: 3/4·x → \dfrac{3}{4}x, 1·x → x
function fcTm(fr,v){
 if(fr.n===0) return '0';
 if(v==='') return fTex(fr);
 if(fr.d===1){ return tm(fr.n,v); }
 return (fr.n<0?'-':'')+'\\dfrac{'+Math.abs(fr.n)+'}{'+fr.d+'}'+v;
}
function fPl(list){ // [{f:Fr,v:'x'}]
 var s='',first=true,i,body,fr;
 for(i=0;i<list.length;i++){
  fr=list[i].f; if(fr.n===0) continue;
  body=fcTm(Fr(Math.abs(fr.n),fr.d),list[i].v);
  if(first){ s+=(fr.n<0?'-':'')+body; first=false; }
  else { s+=(fr.n<0?'-':'+')+body; }
 }
 return s===''?'0':s;
}

// [дасгал 11] Давтагдсан нэмэгдэхүүнийг үржвэрээр бич.
function g_smp_repeatAdd(){
 var t=rnd(0,2), V=pick(['x','y','a','m','n']), W=pick(['b','c','k','p']), k=rnd(3,9), j=rnd(2,5), q, a;
 if(t===0){ q=new Array(k+1).join(V+'+'); q=q.slice(0,-1); a=tm(k,V); }
 else if(t===1){ q=new Array(k+1).join(V+'+')+new Array(j+1).join(W+'+'); q=q.slice(0,-1); a=pl([{c:k,v:V},{c:j,v:W}]); }
 else { q=new Array(k+1).join(V+'\\cdot '); q=q.slice(0,-6); a=powTex(V,k); }
 return {q:'$'+q+'$', a:'$'+a+'$', key:kq('ra',q)};
}

// [дасгал 12] Нэг хувьсагчтай төсөөтэй гишүүдийг эмхэтгэх.
function g_smp_like1(){
 var V=pick(['n','a','m','y','x','p']), k=rnd(3,4), ts=[], i, c;
 for(i=0;i<k;i++){ c=nz(-12,12); ts.push({c:c,v:V}); }
 var s=0; for(i=0;i<k;i++) s+=ts[i].c;
 if(Math.abs(s)>14) return null;
 var q=pl(ts);
 return {q:'$'+q+'$', a:'$'+tm(s,V)+'$', key:kq('l1',q), nv:s};
}

// [дасгал 13а] Хоёр хувьсагчтай төсөөтэй гишүүдийг эмхэтгэх.
function g_smp_like2(){
 var V=pick(['a','x','m','p']), W=pick(['b','y','n','q']), ts=[], i;
 if(V===W) return null;
 for(i=0;i<2;i++){ ts.push({c:nz(-9,9),v:V}); ts.push({c:nz(-9,9),v:W}); }
 var c=collect(ts);
 if(c[0].c===0&&c[1].c===0) return null;
 var q=pl(ts);
 return {q:'$'+q+'$', a:'$'+simp(ts)+'$', key:kq('l2',q)};
}

// [дасгал 13д, е] Сул гишүүнтэй эмхэтгэл.
function g_smp_like3(){
 var V=pick(['p','n','x','a']), W=pick(['q','m','y','b']), ts, q;
 if(V===W) return null;
 ts=[{c:nz(-9,9),v:''},{c:nz(-9,9),v:V},{c:nz(-9,9),v:W},{c:nz(-9,9),v:V},{c:nz(-9,9),v:''}];
 var cc=collect(ts), z=0, i;
 for(i=0;i<cc.length;i++) if(cc[i].c===0) z++;
 if(z>1) return null;
 q=pl(ts);
 return {q:'$'+q+'$', a:'$'+simp(ts)+'$', key:kq('l3',q)};
}

// [дасгал 13в] Хоёр үсэгт үржвэр бүхий гишүүдийг эмхэтгэх.
function g_smp_likeProd(){
 var p=shuffle(['x','y','z','a','b']).slice(0,3), A=p[0]+p[1], B=p[1]+p[2];
 var a1=rnd(11,90), a2=rnd(11,90), b1=rnd(11,90), b2=rnd(11,90);
 if(a1===a2||b1===b2) return null;
 var ts=[{c:a1,v:A},{c:b1,v:B},{c:-a2,v:A},{c:-b2,v:B}];
 var q=pl(ts);
 return {q:'$'+q+'$', a:'$'+simp(ts)+'$', key:kq('lp',q)};
}

// [дасгал 13г] Бутархай коэффициенттэй эмхэтгэл.
function g_smp_likeFrac(){
 var V=pick(['x','a','m']), W=pick(['y','b','n']), d1=pick([2,3,4,5,6]), d2=pick([2,3,4,5,6]);
 if(V===W||d1===d2) return null;
 var n1=rnd(1,d1-1), n2=rnd(1,d1-1), m1=rnd(1,d2-1), m2=rnd(1,d2-1), c0=rnd(1,9);
 var fx=fAdd(Fr(n1,d1),Fr(n2,d1)), fy=fAdd(Fr(m1,d2),Fr(m2,d2));
 var q=fPl([{f:Fr(n1,d1),v:V},{f:Fr(m1,d2),v:W},{f:Fr(n2,d1),v:V},{f:Fr(m2,d2),v:W},{f:Fr(c0,1),v:''}]);
 var a=fPl([{f:fx,v:V},{f:fy,v:W},{f:Fr(c0,1),v:''}]);
 return {q:'$'+q+'$', a:'$'+a+'$', key:kq('lf',q)};
}

// [дасгал 13б] Урт нийлбэрийг эмхэтгэх
function g_smp_bigSum(){
 var V=pick(['m','a','x','k','y']), N=pick([20,30,40,50,60,80,100,120]);
 var s=N*(N+1)/2;
 var q=V+'+'+tm(2,V)+'+'+tm(3,V)+'+\\dots+'+tm(N,V);
 return {q:'$'+q+'$', a:'$1+2+3+\\dots+'+N+'=\\dfrac{'+N+'\\cdot '+(N+1)+'}{2}='+s+'$, иймд $'+tm(s,V)+'$.',
         key:'bs-'+V+'-'+N, nv:s};
}

// [дасгал 19*] Их коэффициенттэй илэрхийллийг хялбарчилж утгыг олох.
function g_smp_cancelPair(){
 var A=rnd(101,899), B=rnd(101,899), x=rnd(11,199), y=rnd(1000,9999), d=rnd(1,4);
 var ts=[{c:A,v:'x'},{c:B,v:'y'},{c:-(A-d),v:'x'},{c:-B,v:'y'}];
 var q=pl(ts);
 return {q:'$'+q+'$, $x='+x+'$, $y='+y+'$', a:'$'+simp(ts)+'$; $'+d+'\\cdot '+x+'='+(d*x)+'$.',
         key:kq('cp',q+'@'+x+'_'+y), nv:d*x};
}

// [Жишээ 3а] Үйлдлийн дарааллаар тоон илэрхийллийн утгыг ол.
function g_smp_orderOps(){
 var a=rnd(1,9), b=rnd(2,6), c=rnd(30,90), d=rnd(2,9), e=pick([2,3]);
 var inner=c-d*Math.pow(2,e);
 if(inner<=0) return null;
 var val=a+b*inner;
 var q=a+'+'+b+'\\cdot \\bigl('+c+'-'+d+'\\cdot 2^{'+e+'}\\bigr)';
 return {q:'$'+q+'$', a:'$'+a+'+'+b+'\\cdot \\bigl('+c+'-'+(d*Math.pow(2,e))+'\\bigr)='+a+'+'+b+'\\cdot '+inner+'='+val+'$',
         key:'oo-'+a+'-'+b+'-'+c+'-'+d+'-'+e, nv:val};
}

// [дасгал 14] Үнэн тэнцэтгэл үүсэхээр хаалт байрлуул.
function g_smp_bracket(){
 var t=rnd(0,1), a=rnd(2,20), b=rnd(6,20), c=rnd(1,5), d=rnd(2,6), T, q, ans;
 if(b<=c) return null;
 if(t===0){ T=a+(b-c)*d; if(T===a+b-c*d) return null;
  q=a+'+'+b+'-'+c+'\\cdot '+d+'='+T;
  ans='$'+a+'+\\bigl('+b+'-'+c+'\\bigr)\\cdot '+d+'='+a+'+'+((b-c)*d)+'='+T+'$'; }
 else { T=a-(b-c)*d; if(T===a-b-c*d) return null;
  q=a+'-'+b+'-'+c+'\\cdot '+d+'='+T;
  ans='$'+a+'-\\bigl('+b+'-'+c+'\\bigr)\\cdot '+d+'='+a+'-'+((b-c)*d)+'='+T+'$'; }
 return {q:'$'+q+'$', a:ans, key:'br-'+t+'-'+a+'-'+b+'-'+c+'-'+d, nv:T};
}

// [дасгал 17*] Эмхэтгэхэд өгөгдсөн илэрхийлэл гарах гурван өөр илэрхийлэл бич.
function g_smp_threeWays(){
 var t=rnd(0,1), V=pick(['x','a','m','y','n']), k=pick([6,8,10,12,14,15,18,20]), q, a;
 if(t===0){ var p=rnd(2,k-2);
  q=tm(k,V);
  a='Жишээ нь $'+tm(p,V)+'+'+tm(k-p,V)+'$; $'+tm(k+p,V)+'-'+tm(p,V)+'$; $'+tm(2*k,V)+'-'+tm(k,V)+'$.'; }
 else { var W=pick(['b','y','c','q']); if(W===V) return null;
  var r=rnd(2,6);
  q=k+'\\bigl('+V+'-'+W+'\\bigr)';
  a='Жишээ нь $'+tm(k,V)+'-'+tm(k,W)+'$; $'+tm(k+r,V)+'-'+tm(k,W)+'-'+tm(r,V)+'$; $'+tm(2*k,V)+'-'+tm(2*k,W)+'-'+k+'\\bigl('+V+'-'+W+'\\bigr)$.'; }
 return {q:'$'+q+'$', a:a, key:'tw-'+t+'-'+V+'-'+k};
}

// [дасгал 20] Хялбарчилж, өгсөн утганд илэрхийллийн утгыг ол.
function g_smp_valueAfter(){
 var a1=nz(-9,9), a2=nz(-9,9), b1=pick([-15,-10,-5,5,10,15]), c0=nz(-9,9), x=nz(-6,6), yn=nz(-45,45);
 var A=a1+a2;
 if(A===0) return null;
 var valH=A*x*10+b1*yn+c0*10;
 if(valH%10!==0) return null;
 var val=valH/10;
 var ts=[{c:a1,v:'x'},{c:b1,v:'y'},{c:a2,v:'x'},{c:c0,v:''}];
 var q=pl(ts);
 var st=A+'\\cdot '+paren(x)+(b1<0?'-'+(-b1):'+'+b1)+'\\cdot '+paren(decStr(yn/10,2))+(c0<0?'-'+(-c0):'+'+c0);
 return {q:'$'+q+'$, $x='+x+'$, $y='+decStr(yn/10,2)+'$',
   a:'$'+simp(ts)+'$; $'+st+'='+decStr(val,2)+'$',
   key:kq('va',q+'@'+x+'_'+yn), nv:val};
}

// [дасгал 21] Хялбарчлал зөв үү? Алдааг ол.
function g_smp_checkSimplify(){
 var V=pick(['x','a','m','p']), W=pick(['y','b','n','q']), ok=rnd(0,1);
 if(V===W) return null;
 var ts=[{c:nz(-9,9),v:V},{c:nz(-9,9),v:W},{c:nz(-9,9),v:V},{c:nz(-9,9),v:W}];
 var cc=sortTerms(collect(ts));
 if(cc[0].c===0||cc[1].c===0) return null;
 var right=pl(cc), shown;
 if(ok){ shown=right; }
 else { shown=pl([{c:cc[0].c,v:cc[0].v},{c:-cc[1].c,v:cc[1].v}]); if(shown===right) return null; }
 var q=pl(ts)+'='+shown;
 return {q:'$'+q+'$', a:(ok?'Зөв.':'Буруу. Зөв хариу нь $'+right+'$.'), key:kq('cs',q)};
}

// [дасгал 16] Дүрсийн периметрийг олох илэрхийлэл зохиож хялбарчил.
function g_smp_perim(){
 var t=rnd(0,3), n=rnd(1,9), m=rnd(1,9), fig, e;
 if(n===m) return null;
 if(t===0){ fig=figTri('x','x','x+'+n); e=pl([{c:3,v:'x'},{c:n,v:''}]); }
 else if(t===1){ fig=figRect('2x+'+n,'x'); e=pl([{c:6,v:'x'},{c:2*n,v:''}]); }
 else if(t===2){ fig=figSq('x+'+n); e=pl([{c:4,v:'x'},{c:4*n,v:''}]); }
 else { fig=figKite('x+'+n,'x+'+m); e=pl([{c:4,v:'x'},{c:2*(n+m),v:''}]); }
 return {q:'', fig:fig, a:'$P='+e+'$', key:'sp-'+t+'-'+n+'-'+m};
}

// [дасгал 22] Хайрцгийн эзлэхүүнийг харьцуулах (хүснэгттэй).
function g_smp_boxCompare(){
 var k1=rnd(1,4), k2=rnd(1,4), k3=rnd(1,4), j1=rnd(1,4), j2=rnd(1,4), j3=rnd(1,4);
 var P1=k1*k2*k3, P2=j1*j2*j3;
 if(P1===P2) return null;
 var rows=[['хэмжээ','урт','өргөн','өндөр'],
  ['I баг','$'+tm(k1,'a')+'$','$'+tm(k2,'b')+'$','$'+tm(k3,'c')+'$'],
  ['II баг','$'+tm(j1,'a')+'$','$'+tm(j2,'b')+'$','$'+tm(j3,'c')+'$']];
 return {q:'', fig:figTbl(rows,54),
   a:'$V_1='+tm(P1,'abc')+'$, $V_2='+tm(P2,'abc')+'$. '+(P1>P2?'I':'II')+' баг илүү эзлэхүүнтэй.',
   key:'bc-'+k1+k2+k3+'-'+j1+j2+j3, nv:Math.max(P1,P2)};
}

// ═══════════════════════════════════════════════════════════════════
// 5.3 ГИШҮҮНЧЛЭН ҮРЖҮҮЛЭХ БА ХААЛТААС ЕРӨНХИЙ ҮРЖИГДЭХҮҮН ГАРГАХ (х.74–77)
// ═══════════════════════════════════════════════════════════════════

// Үржүүлэгчийн бичлэг: 1→'', -1→'-', бусад→тоо
function kf(k){ return k===1?'':(k===-1?'-':''+k); }
// k(...) хэлбэр
function brk(k,inner){ return kf(k)+'\\bigl('+inner+'\\bigr)'; }
// Өмнөх гишүүний ард залгах: k>0 бол "+k(...)", k<0 бол "-|k|(...)"
function pbrk(k,inner){ return k<0?('-'+brk(-k,inner)):('+'+brk(k,inner)); }

// [дасгал 25, 26] Гишүүнчлэн үржүүлж, хаалт задлах.
function g_dst_single(){
 var V=pick(['x','y','a','b','m','c','k','d']), t=rnd(0,3), k=nz(-12,12), n=nz(1,12), q, e;
 if(Math.abs(k)===1) return null;
 if(t===0){ q=brk(k,pl([{c:1,v:V},{c:n,v:''}])); e=pl([{c:k,v:V},{c:k*n,v:''}]); }
 else if(t===1){ q=brk(k,pl([{c:1,v:V},{c:-n,v:''}])); e=pl([{c:k,v:V},{c:-k*n,v:''}]); }
 else if(t===2){ q=brk(k,pl([{c:n,v:''},{c:-1,v:V}])); e=pl([{c:k*n,v:''},{c:-k,v:V}]); }
 else { var W=pick(['y','b','n','q','t']); if(W===V) return null;
  q=brk(k,pl([{c:1,v:V},{c:-1,v:W}])); e=pl([{c:k,v:V},{c:-k,v:W}]); }
 return {q:'$'+q+'$', a:'$'+e+'$', key:kq('ds',q)};
}

// [дасгал 26б, 30в] Гурван гишүүнт хаалтыг задлах.
function g_dst_three(){
 var p=shuffle(['x','y','z','a','b','c','m','n']).slice(0,3);
 var k=nz(-9,9), a=nz(-9,9), b=nz(-9,9), c=nz(-15,15);
 if(Math.abs(k)===1) return null;
 var q=brk(k,pl([{c:a,v:p[0]},{c:b,v:p[1]},{c:c,v:''}]));
 var e=pl([{c:k*a,v:p[0]},{c:k*b,v:p[1]},{c:k*c,v:''}]);
 return {q:'$'+q+'$', a:'$'+e+'$', key:kq('d3',q)};
}

// [дасгал 23, 28] Хоёр хаалт задалж, хялбарчлах.
function g_dst_two(){
 var V=pick(['x','y','a','b','m','k','c']), t=rnd(0,3);
 var k1=nz(-9,9), k2=nz(-9,9), n1=nz(1,9), n2=nz(1,9), q, ts;
 if(Math.abs(k1)===1||Math.abs(k2)===1) return null;
 if(t===0){ q=brk(k1,pl([{c:1,v:V},{c:n1,v:''}]))+pbrk(k2,pl([{c:1,v:V},{c:-n2,v:''}]));
  ts=[{c:k1,v:V},{c:k1*n1,v:''},{c:k2,v:V},{c:-k2*n2,v:''}]; }
 else if(t===1){ if(k2<0) return null;
  q=brk(k1,pl([{c:1,v:V},{c:-n1,v:''}]))+'-'+brk(k2,pl([{c:1,v:V},{c:-n2,v:''}]));

// Үйлдлийн загвар: [?] →op1→ [ ] →op2→ [үр дүн]
function figChain(ops,endv){
 var n=ops.length, bw=52, bh=24, gap=46, by=14, ym=by+bh/2, g='', i, x;
 var W=(n+1)*bw+n*gap+12;
 function cell(xx,label,fill){
  g+='<rect x="'+xx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+fill+'" stroke="#4f46e5" stroke-width="1.3"/>';
  if(label) g+='<text x="'+(xx+bw/2)+'" y="'+(by+16.5)+'" font-size="12.5" text-anchor="middle" fill="#3730a3">'+label+'</text>';
 }
 cell(6,'?','#f5f3ff');
 for(i=0;i<n;i++){
  var x1=6+i*(bw+gap)+bw+2, x2=x1+gap-4;
  g+='<line x1="'+x1+'" y1="'+ym+'" x2="'+(x2-7)+'" y2="'+ym+'" stroke="#4f46e5" stroke-width="1.2"/>';
  g+='<polygon points="'+x2+','+ym+' '+(x2-8)+','+(ym-4)+' '+(x2-8)+','+(ym+4)+'" fill="#4f46e5"/>';
  g+='<text x="'+((x1+x2)/2)+'" y="'+(ym-8)+'" font-size="11.5" text-anchor="middle" fill="#4f46e5">'+ops[i]+'</text>';
  x=6+(i+1)*(bw+gap);
  cell(x,(i===n-1?''+endv:''),(i===n-1?'#eef3ff':'#fff'));
 }
 return '<svg viewBox="0 0 '+W+' 46" width="'+Math.min(W,330)+'">'+g+'</svg>';
}
var EVARS=['x','y','a','b','m','n','s','t','e','f','c','d'];

function g_eq_add(){

 else if(t===1){ b=a+x0; q=a+'+'+V+'='+b; st=V+'='+b+'-'+a+'='+x0; }
 else if(t===2){ b=x0+a; q=b+'='+V+'+'+a; st=V+'='+b+'-'+a+'='+x0; }
 else { b=x0-a; q=b+'=-'+a+'+'+V; st=V+'='+b+'+'+a+'='+x0; }
 return {q:'$'+q+'$', a:'$'+st+'$', key:kq('ea',q), nv:x0};

function g_eq_chain(){

// [Өөрийгөө сориорой 5б] Хоёр талдаа хувьсагчтай тэгшитгэл.

 else { q=pl([{c:c,v:V},{c:d,v:''}])+'='+tm(a,V); }

function g_eq_negLead(){

 if(t===0){ q=A+'-'+tm(k,V)+'='+B; }
 else { q=pl([{c:-A,v:''},{c:k,v:V}])+'='+(-B); }
 st=(t===0? '-'+tm(k,V)+'='+B+'-'+paren(A)+'='+(-k*x0)+'$; $'+V+'='+paren(-k*x0)+'\\div '+paren(-k)+'='+x0
          : tm(k,V)+'='+(-B)+'+'+paren(A)+'='+(k*x0)+'$; $'+V+'='+paren(k*x0)+'\\div '+k+'='+x0);
 return {q:'$'+q+'$', a:'$'+st+'$', key:kq('enl',q), nv:x0};

// [Өөрийгөө сориорой 4] Хаалтын өмнөх үржигдэхүүнийг ол.
function g_hd_findFactor(){
 var p=shuffle(['x','y','z','a','b','m']).slice(0,2);
 var k=nz(-9,9), a=nz(2,25), b=nz(2,25);
 if(Math.abs(k)===1||gcd(a,b)!==1) return null;
 var q='\\square \\cdot \\bigl('+pl([{c:a,v:p[0]},{c:b,v:p[1]}])+'\\bigr)='+pl([{c:k*a,v:p[0]},{c:k*b,v:p[1]}]);
 return {q:'$'+q+'$', a:'$\\square ='+k+'$', key:kq('hff',q), nv:k};
}

// [Өөрийгөө сориорой 6] Илэрхийллийн утга өгсөн нөхцөлийг хангах хувьсагчийн утга.
var TARG=[{n:99,d:'хамгийн их хоёр оронтой тоотой'},{n:100,d:'хамгийн бага гурван оронтой тоотой'},
 {n:10,d:'хамгийн бага хоёр оронтой тоотой'},{n:999,d:'хамгийн их гурван оронтой тоотой'},
 {n:-99,d:'хамгийн бага хоёр оронтой сөрөг тоотой'},{n:0,d:'тэгтэй'}];
function g_hd_condValue(){
 var T=pick(TARG), k=nz(-9,9), b=nz(-40,40);
 if(Math.abs(k)===1) return null;
 if((T.n-b)%k!==0) return null;
 var x0=(T.n-b)/k;
 if(Math.abs(x0)>200) return null;
 var e=pl([{c:k,v:'x'},{c:b,v:''}]);
 var q='$x$-ийн ямар утгад $'+e+'$ илэрхийллийн утга '+T.d+' тэнцүү болох вэ?';
 return {q:q, a:'$'+e+'='+T.n+'$; $'+tm(k,'x')+'='+(k*x0)+'$; $x='+x0+'$.',
         key:'hcv-'+T.n+'-'+k+'-'+b, nv:x0};
}

// [Өөрийгөө сориорой 7] Тэгш, сондгой байх нөхцөл.
function g_hd_parity(){
 var k=pick([2,4,6,8,10]), b=nz(-15,15), t=rnd(0,1);
 var e=pl([{c:k,v:'x'},{c:b,v:''}]);
 var isOdd=(Math.abs(b)%2===1);
 var want=t?'сондгой':'тэгш';
 var ok=(t? isOdd : !isOdd);
 var q='$x$ бүхэл тоо байхад $'+e+'$ илэрхийллийн утга '+want+' байх уу?';
 return {q:q,
  a:(ok?'Тийм. $'+tm(k,'x')+'$ үргэлж тэгш, $'+b+'$ нь '+(isOdd?'сондгой':'тэгш')+' тул нийлбэр нь үргэлж '+want+'.'
      :'Үгүй. $'+tm(k,'x')+'$ үргэлж тэгш, $'+b+'$ нь '+(isOdd?'сондгой':'тэгш')+' тул нийлбэр нь үргэлж '+(isOdd?'сондгой':'тэгш')+'.'),
  key:'hpr-'+k+'-'+b+'-'+t};
}

// [Өөрийгөө сориорой 10] Хүснэгтийг нөхөх (хоёр илэрхийллийн утга).
function g_hd_table(){
 var k=nz(-5,5), b=nz(-9,9), lo=-rnd(2,4), hi=rnd(2,4), i, head=['$a$'], r1=[], r2=[], v1=[], v2=[];
 if(Math.abs(k)===1) return null;
 var e1=tm(k,'a'), e2=pl([{c:k,v:'a'},{c:b,v:''}]);
 r1.push('$'+e1+'$'); r2.push('$'+e2+'$');
 for(i=lo;i<=hi;i++){ head.push('$'+i+'$'); r1.push(''); r2.push('');
  v1.push(k*i); v2.push(k*i+b); }
 return {q:'', fig:figTbl([head,r1,r2],40),
  a:'$'+e1+'$: $'+v1.join(',\\ ')+'$;  $'+e2+'$: $'+v2.join(',\\ ')+'$.',
  key:'htb-'+k+'-'+b+'-'+lo+'-'+hi};
}

// [Өөрийгөө сориорой 12] Ачааны бодлого — олон алхамт тэгшитгэл.
function g_hd_loads(){
 var t=rnd(2,5), s=rnd(3,8), d=rnd(2,12), x=rnd(6,25), T=t*x+s*(x-d);
 if(x-d<1) return null;
 var q='Аялалд яваа $'+t+'$ багш тус бүр тэнцүү жинтэй ачаа, $'+s+'$ сурагч тус бүр мөн тэнцүү жинтэй ачаа үүрч явна. Сурагчийн ачаа багшийнхаас $'+d+'$ кг-аар хөнгөн байв. Тэдний бүх ачаа нийлээд $'+T+'$ кг жинтэй бол багш, сурагч тус бүр хэдэн кг ачаа үүрсэн бэ?';
 return {q:q,
  a:'$'+tm(t,'x')+'+'+s+'\\bigl(x-'+d+'\\bigr)='+T+'$; $'+tm(t+s,'x')+'='+(T+s*d)+'$; $x='+x+'$. Багш $'+x+'$ кг, сурагч $'+(x-d)+'$ кг.',
  key:'hld-'+t+'-'+s+'-'+d+'-'+x, nv:x};
}

// Үүрлэсэн хаалттай тэгшитгэл (олон алхамт).
function g_hd_nestedEq(){
 var V=pick(['x','y','a','m']), k=rnd(2,6), m=rnd(2,6), a=nz(-9,9), b=nz(-15,15), x0=rnd(1,10);
 var inner=m*(x0+a)+b, c=k*inner;
 if(Math.abs(c)>2000) return null;
 var q=k+'\\bigl('+m+'\\bigl('+pl([{c:1,v:V},{c:a,v:''}])+'\\bigr)'+(b<0?'-'+(-b):'+'+b)+'\\bigr)='+c;
 var st=m+'\\bigl('+pl([{c:1,v:V},{c:a,v:''}])+'\\bigr)'+(b<0?'-'+(-b):'+'+b)+'='+inner
   +'$; $'+m+'\\bigl('+pl([{c:1,v:V},{c:a,v:''}])+'\\bigr)='+(inner-b)
   +'$; $'+pl([{c:1,v:V},{c:a,v:''}])+'='+(x0+a)+'$; $'+V+'='+x0;
 return {q:'$'+q+'$', a:'$'+st+'$', key:kq('hne',q), nv:x0};
}

// Хоёр хаалт задалж, хялбарчилсны дараа утгыг олох.
function g_hd_simpValue(){
 var k1=nz(-9,9), k2=nz(-9,9), a=nz(-9,9), b=nz(-9,9), c=nz(-20,20), x=nz(-8,8);
 if(Math.abs(k1)===1||Math.abs(k2)===1) return null;
 var A=k1+k2, C=k1*a+k2*b+c;
 if(A===0) return null;
 var q=brk(k1,pl([{c:1,v:'x'},{c:a,v:''}]))+pbrk(k2,pl([{c:1,v:'x'},{c:b,v:''}]))+(c<0?'-'+(-c):'+'+c);
 var res=pl([{c:A,v:'x'},{c:C,v:''}]);
 var val=A*x+C;
 return {q:'$'+q+'$, $x='+x+'$', a:'$'+res+'$; $'+A+'\\cdot '+paren(x)+(C<0?'-'+(-C):'+'+C)+'='+val+'$',
   key:kq('hsv',q+'@'+x), nv:val};
}

// Тоон пирамид — доод мөрийн үл мэдэгдэх нүдийг ол.
function g_hd_pyramidInv(){
 var a=rnd(2,30), b=rnd(2,30), x=rnd(2,30), T=a+2*x+b;
 if(a===b) return null;
 return {q:'', fig:figPyr3(''+a,'x',''+b,''+T),
  a:'$'+a+'+2x+'+b+'='+T+'$; $2x='+(2*x)+'$; $x='+x+'$.',
  key:'hpi-'+a+'-'+b+'-'+x, nv:x};
}

// [Өөрийгөө сориорой 1б] Хавтангаар шал хучих — илэрхийлэл ба утга.
function g_hd_floorPlank(){
 var n=rnd(4,12), d=rnd(1,9)*10, x=rnd(20,90);
 var L=n*x+d;
 var q='Шалны урт $'+n+'$ ширхэг хавтангийн уртаас $'+d+'$ см-ээр илүү байв. Хавтангийн урт $x$ см бол шалны уртыг олох илэрхийлэл бичээд, шалны урт $'+L+'$ см үед $x$-ийг ол.';
 return {q:q, a:'$'+pl([{c:n,v:'x'},{c:d,v:''}])+'$; $'+tm(n,'x')+'='+(L-d)+'$; $x='+x+'$ см.',
   key:'hfp-'+n+'-'+d+'-'+x, nv:x};
}

// [дасгал 35 хэлбэр] Гурван гишүүнт хялбар тооцоолол.
function g_hd_smartMulti(){
 var a=pick([4,5,8,12,25,50,125]), b=rnd(11,60), c=rnd(11,60), d=rnd(2,20);
 if(b+c-d<=0) return null;
 var val=a*(b+c-d);
 var q=a+'\\cdot '+b+'+'+a+'\\cdot '+c+'-'+a+'\\cdot '+d;
 return {q:'$'+q+'$', a:'$'+a+'\\cdot \\bigl('+b+'+'+c+'-'+d+'\\bigr)='+a+'\\cdot '+(b+c-d)+'='+val+'$',
   key:'hsm-'+a+'-'+b+'-'+c+'-'+d, nv:val};
}

// Гурван үл мэдэгдэхтэй үгэн бодлого (нийлбэр, ялгавар, дахин).
function g_hd_threeMix(){
 var k=rnd(2,5), d=rnd(3,25), x=rnd(4,30), N=x+k*x+(k*x-d);
 var obj=pick([{a:'алим',b:'жүрж',c:'лийр',ab:'алимнаас',bb:'жүржээс',id:'aj'},
   {a:'сарнай',b:'лиш',c:'цахирмаа',ab:'сарнайнаас',bb:'лишээс',id:'sl'},
   {a:'ном',b:'дэвтэр',c:'сэтгүүл',ab:'номноос',bb:'дэвтрээс',id:'nd'},
   {a:'хонь',b:'ямаа',c:'үхэр',ab:'хонинооос'.replace('оооо','оо'),bb:'ямаанаас',id:'hy'}]);
 var q='Дэлгүүрт нийт $'+N+'$ ширхэг бараа байв. '+ucf(obj.b)+' нь '+obj.ab+' $'+k+'$ дахин олон, '+obj.c+' нь '+obj.bb+' $'+d+'$ ширхгээр цөөн байв. Бараа тус бүр хэд байсан бэ?';
 return {q:q,
  a:'$x+'+tm(k,'x')+'+\\bigl('+tm(k,'x')+'-'+d+'\\bigr)='+N+'$; $'+tm(2*k+1,'x')+'='+(N+d)+'$; $x='+x+'$. Тоонууд: $'+x+'$, $'+(k*x)+'$, $'+(k*x-d)+'$.',
  key:'htm-'+k+'-'+d+'-'+x+'-'+obj.id, nv:x};
}
var WSPEC={"title":"Илэрхийлэл хялбарчлах-4","sub":"Хялбарчилсны дараа утгыг олох · V бүлэг · 6-р анги","rule":"<b>Санамж:</b> Хувьсагч ба хувьсагчийн зэрэг нь ижил, зөвхөн коэффициентээрээ ялгаатай гишүүдийг <b>төсөөтэй гишүүд</b> гэнэ. Төсөөтэй гишүүдийн коэффициентүүдийг нэмж (хасаж) эмхэтгэхийг илэрхийллийг <b>хялбарчлах</b> гэнэ: $6a+5b+2a+3b=8a+8b$. Үйлдлийн дараалал: хаалт задлах, зэрэг дэвшүүлэх, хуваах ба үржүүлэх, хасах ба нэмэх.","ref":"","tasks":[{"label":"Төсөөтэй гишүүдийг эмхэтгэ.","fn":"g_smp_like2","cap":5,"cols":2,"wk":11},{"label":"Илэрхийллийг хялбарчил.","fn":"g_smp_like3","cap":4,"cols":2,"wk":12},{"label":"Дүрсийн периметрийн илэрхийллийг зохиож хялбарчил.","fn":"g_smp_perim","cap":3,"cols":2,"wk":16},{"label":"Хялбарчилж, өгсөн утганд илэрхийллийн утгыг ол.","fn":"g_smp_valueAfter","cap":3,"cols":1,"wk":18},{"label":"Аль баг илүү эзлэхүүнтэй хайрцаг хийсэн бэ?","fn":"g_smp_boxCompare","cap":2,"cols":1,"wk":22}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
