<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тоон шулуун дээрх нэмэх/хасах — 12 бодлого</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#16241c;--soft:#5a7064;--line:#cfe0d6;--forest:#13502e;--green:#16a34a;--red:#b3261e;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-family:inherit;font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;color:#fff;font-size:.9rem;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #9bb3a6;padding:0 30px 2px 4px}
  .top{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .guide{flex:1;min-width:240px;background:#fff7e6;border:1px solid #f3dca6;border-radius:10px;padding:10px 14px;font-size:12px;color:#8a5a00}
  .signs{background:#f6f2ff;border:1px solid #e2d6ff;border-radius:10px;padding:10px 14px}
  .signs h3{font-size:12px;color:#5a32d6;margin-bottom:6px}
  .signs table{border-collapse:collapse;font-size:13px;font-weight:700}
  .signs td{border:1px solid #e2d6ff;padding:4px 9px;text-align:center}
  .pos{color:var(--green)}.neg{color:var(--red)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:6px 4px 8px;border-bottom:1px dashed #efeaff}
  .qh{font-size:16px;font-weight:700}.qh .qn{color:var(--purple);font-weight:800;margin-right:6px}.qh .bl{display:inline-block;min-width:40px;border-bottom:1.4px solid #6f8a7c;height:1em;margin-left:6px}
  .nl{margin-top:6px}.nl svg{max-width:100%}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 14px;font-size:13px}.ans-grid .a .n{color:var(--soft);font-weight:700}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(lo,hi){var v=0;while(v===0)v=rnd(lo,hi);return v;}
var M='−';
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function startS(s){return s<0?M+(-s):''+s;}
function numLine(){
  var lo=-6,hi=6,u=18,pad=14,W=pad*2+(hi-lo)*u,H=34,y=20;
  var x0=pad,x1=pad+(hi-lo)*u;
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="#444" stroke-width="1.5"/>';
  s+='<polygon points="'+x1+','+y+' '+(x1-6)+','+(y-3)+' '+(x1-6)+','+(y+3)+'" fill="#444"/>';
  s+='<polygon points="'+x0+','+y+' '+(x0+6)+','+(y-3)+' '+(x0+6)+','+(y+3)+'" fill="#444"/>';
  for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;
    s+='<line x1="'+x+'" y1="'+(y-4)+'" x2="'+x+'" y2="'+(y+4)+'" stroke="#444" stroke-width="'+(v===0?'2':'1.1')+'"/>';
    s+='<text x="'+x+'" y="'+(y+14)+'" font-size="8.5" text-anchor="middle" fill="#666">'+v+'</text>';}
  return s+'</svg>';
}
function build(){
  var probs='',answs='',ITEMS=[];
  for(var i=0;i<12;i++){
    var s=rnd(-6,6), d=nz(-6,6), e=s+d;
    if(e<-6||e>6){i--;continue;}
    // илэрхийлэл: эерэг d → "+ d" эсвэл "+ (−|d|)"-ийн эсрэг; сөрөг d → "− |d|"
    var expr=startS(s), par=rnd(0,1)===0;
    if(d>0){ expr+= par? ' + '+d : ' '+M+' ('+M+d+')'; if(par===false){/*a−(−d)=a+d*/} }
    else   { expr+= par? ' '+M+' '+(-d) : ' + ('+M+(-d)+')'; }
    var n=i+1;
    probs+='<div class="q"><div class="qh"><span class="qn">'+n+'.</span>'+expr+' =<span class="bl"></span></div><div class="nl">'+numLine()+'</div></div>';
    answs+='<div class="a"><span class="n">'+n+'.</span> '+(e<0?M+(-e):''+e)+'</div>';
    ITEMS.push({q:'\\text{'+expr.replace(/−/g,'-')+' =}',a:''+(e<0?'-'+(-e):e)});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тоон шулуун дээрх нэмэх, хасах</h1><div class="sub">Эхний тооноос эхэлж сум зурж бод · 12 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Анги: </span></div>'
    +'<div class="top">'
    + '<div class="guide"><b>Тоон шулуун:</b> эхний тоон дээр зогс. <b>Нэмэх (+)</b> → баруун тийш, <b>Хасах (−)</b> → зүүн тийш тухайн тооны тоогоор алхана. Сумны төгсгөл нь хариу.<br><i>Жнь: −3 − 2 → −3-аас зүүн тийш 2 алхвал −5</i></div>'
    + '<div class="signs"><h3>Үржихийн тэмдгийн дүрэм</h3><table>'
    +   '<tr><td>(+)·(+)</td><td>=</td><td class="pos">+</td><td style="border:0;width:8px"></td><td>(+)·(−)</td><td>=</td><td class="neg">−</td></tr>'
    +   '<tr><td>(−)·(−)</td><td>=</td><td class="pos">+</td><td style="border:0"></td><td>(−)·(+)</td><td>=</td><td class="neg">−</td></tr>'
    +   '</table><div style="font-size:10.5px;color:#7a7390;margin-top:5px">Ижил тэмдэг → <b class="pos">+</b>, &nbsp; ялгаатай тэмдэг → <b class="neg">−</b> &nbsp;(хуваахад мөн ижил)</div></div>'
    +'</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=ITEMS; window.WS_TITLE='Тоон шулуун дээрх нэмэх/хасах';
  try{if(window.renderMathInElement)renderMathInElement(document.getElementById('answers'),{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=16"></script>
</body>
</html>
