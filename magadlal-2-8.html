<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Магадлал — хос туршилт ба эсрэг үзэгдэл (8-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:20mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
// ── 8-р анги III бүлэг (Магадлал: олонлог, үзэгдэл, магадлал) ──
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.n===0)return '0';if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function setTex(arr){return '\\{'+arr.join(';\\ ')+'\\}';}
function uniq(a){var s={},r=[];a.forEach(function(x){if(!s[x]){s[x]=1;r.push(x);}});return r;}
function sortN(a){return a.slice().sort(function(x,y){return x-y;});}

// ════════ Олонлог WS1 ════════
function g_subsetCount(){var mode=pick(['num','num','expr']);
 if(mode==='num'){var n=rnd(2,7);return {q:'$'+n+'$ элементтэй олонлогийн ялгаатай дэд олонлогийн тоог ол.',a:'$2^{'+n+'}='+Math.pow(2,n)+'$',key:'sc'+n,nv:Math.pow(2,n)};}
 var forms=[['3n','2^{3n}=8^{n}'],['n+2','2^{n+2}'],['2n','2^{2n}=4^{n}'],['n+1','2^{n+1}']];var f=pick(forms);
 return {q:'$|A|='+f[0]+'$ бол $A$-гийн дэд олонлогийн тоог ол.',a:'$2^{'+f[0]+'}='+f[1].split('=').pop()+'$',key:'sce'+f[0]};}
function g_listSubsets(){var els=pick([['a','b'],['a','b','c'],['1','2','3'],['x','y','z']]);var n=els.length;var subs=[];for(var m=0;m<(1<<n);m++){var s=[];for(var i=0;i<n;i++)if(m&(1<<i))s.push(els[i]);subs.push(s.length?setTex(s):'\\varnothing');}
 return {q:'$A='+setTex(els)+'$ олонлогийн бүх дэд олонлогийг бич.',a:'$'+subs.join(',\\ ')+'$ (нийт $2^{'+n+'}='+(1<<n)+'$)',key:'ls'+els.join(),nv:1<<n};}
function g_setOps(){var univ=[];for(var i=1;i<=12;i++)univ.push(i);var A=sortN(uniq(Array.from({length:rnd(3,5)},function(){return rnd(1,12);}))),B=sortN(uniq(Array.from({length:rnd(3,5)},function(){return rnd(1,12);})));
 var op=pick(['∪','∩','\\']);var res;if(op==='∪')res=sortN(uniq(A.concat(B)));else if(op==='∩')res=A.filter(function(x){return B.indexOf(x)>=0;});else res=A.filter(function(x){return B.indexOf(x)<0;});
 var sym=op==='∪'?' \\cup ':op==='∩'?' \\cap ':' \\setminus ';
 return {q:'$A='+setTex(A)+',\\ B='+setTex(B)+'$ бол $A'+sym+'B$ ба $|A'+sym+'B|$-г ол.',a:'$A'+sym+'B='+(res.length?setTex(res):'\\varnothing')+'$; $\\ |A'+sym+'B|='+res.length+'$',key:'so'+A.join()+op+B.join(),nv:res.length};}

// ════════ Олонлог WS2 — чадал ба судалгаа ════════
function g_unionFormula(){var mode=pick(['union','inter']);var inter=rnd(2,8),a=inter+rnd(1,8),b=inter+rnd(1,8);var uni=a+b-inter;
 if(mode==='union')return {q:'$|A|='+a+',\\ |B|='+b+',\\ |A\\cap B|='+inter+'$ бол $|A\\cup B|$-г ол.',a:'$|A\\cup B|=|A|+|B|-|A\\cap B|='+a+'+'+b+'-'+inter+'='+uni+'$',key:'uf1'+a+b+inter,nv:uni};
 return {q:'$|A|='+a+',\\ |B|='+b+',\\ |A\\cup B|='+uni+'$ бол $|A\\cap B|$-г ол.',a:'$|A\\cap B|=|A|+|B|-|A\\cup B|='+a+'+'+b+'-'+uni+'='+inter+'$',key:'uf2'+a+b+uni,nv:inter};}
function g_survey(){var both=rnd(5,20),onlyA=rnd(8,30),onlyB=rnd(8,30),neither=rnd(3,20);var A=both+onlyA,B=both+onlyB,T=A+B-both+neither;var ask=pick(['both','union','onlyA','neither']);
 var base='Нийт $'+T+'$ хүнээс $'+A+'$ нь $X$-ийг, $'+B+'$ нь $Y$-г сонирхдог, $'+neither+'$ нь алийг нь ч сонирхдоггүй. ';
 if(ask==='both')return {q:base+'Хоёуланг нь сонирхдог хэдэн хүн байна вэ?',a:'$|X\\cup Y|='+T+'-'+neither+'='+(A+B-both)+'$; хоёулаа $=|X|+|Y|-|X\\cup Y|='+A+'+'+B+'-'+(A+B-both)+'='+both+'$',key:'sv'+T+A+B+neither+ask,nv:both};
 if(ask==='onlyA')return {q:base+'Зөвхөн $X$-ийг сонирхдог хэдэн хүн байна вэ?',a:'Хоёулаа $='+both+'$; зөвхөн $X$ $='+A+'-'+both+'='+onlyA+'$',key:'sv'+T+A+B+neither+ask,nv:onlyA};
 if(ask==='union')return {q:base+'Ядаж нэгийг нь сонирхдог хэдэн хүн байна вэ?',a:'$|X\\cup Y|='+T+'-'+neither+'='+(A+B-both)+'$',key:'sv'+T+A+B+neither+ask,nv:A+B-both};
 return {q:base+'Диаграм ашиглан зөвхөн нэгийг нь сонирхдог хүний тоог ол.',a:'Хоёулаа $='+both+'$; зөвхөн нэг $=('+A+'-'+both+')+('+B+'-'+both+')='+(onlyA+onlyB)+'$',key:'sv'+T+A+B+neither+ask,nv:onlyA+onlyB};}

// ════════ Үзэгдэл WS3 — нийцтэй/нийцгүй, магадлалын хуваарь ════════
var PROPS=[['тэгш тоо',function(x){return x%2===0;}],['сондгой тоо',function(x){return x%2===1;}],['3-т хуваагдах',function(x){return x%3===0;}],['4-т хуваагдах',function(x){return x%4===0;}],['5-аас их',function(x){return x>5;}],['анхны тоо',function(x){return [2,3,5,7,11].indexOf(x)>=0;}],['4-өөс бага',function(x){return x<4;}]];
function g_compatIncompat(){var N=12,i1=rnd(0,PROPS.length-1),i2;do{i2=rnd(0,PROPS.length-1);}while(i2===i1);var p1=PROPS[i1],p2=PROPS[i2];var common=[];for(var x=1;x<=N;x++)if(p1[1](x)&&p2[1](x))common.push(x);var compat=common.length>0;
 return {q:'$1$-ээс $'+N+'$ хүртэлх тоо шидэх туршилтад «'+p1[0]+'» ба «'+p2[0]+'» гэсэн хоёр үзэгдэл нийцтэй юу, нийцгүй юу?',a:compat?('Нийтлэг эгэл үзэгдэл $'+setTex(common)+'$ байгаа тул <b>нийцтэй</b>.'):('Нийтлэг эгэл үзэгдэлгүй тул <b>нийцгүй</b> (хамт биелэх боломжгүй).'),key:'ci'+i1+i2};}
function g_eventProbDist(){var els=['a','b','c','d','e'];var probs=[0.12,0.24,0.26,0.18,0.20];var k=rnd(2,3);var idx=[];while(idx.length<k){var j=rnd(0,4);if(idx.indexOf(j)<0)idx.push(j);}idx.sort();var sub=idx.map(function(j){return els[j];});var sum=idx.reduce(function(s,j){return s+probs[j];},0);sum=Math.round(sum*100)/100;
 return {q:'$\\Omega='+setTex(els)+'$ бөгөөд $P(a)=0.12,\\ P(b)=0.24,\\ P(c)=0.26,\\ P(d)=0.18,\\ P(e)=0.20$. $A='+setTex(sub)+'$ үзэгдлийн магадлалыг ол.',a:'$P(A)='+idx.map(function(j){return probs[j];}).join('+')+'='+sum+'$',key:'ep'+idx.join(),nv:sum};}
function g_complementDist(){var p=pick([0.3,0.45,0.62,0.15,0.8,0.25]);var c=Math.round((1-p)*100)/100;
 return {q:'$P(A)='+p+'$ бол эсрэг үзэгдэл $\\bar A$-ийн магадлалыг ол.',a:'$P(\\bar A)=1-P(A)=1-'+p+'='+c+'$',key:'cd'+p,nv:c};}

// ════════ Магадлал WS4 — сонгодог магадлал ════════
function g_die(){var evs=[['тэгш тоо',[2,4,6]],['сондгой тоо',[1,3,5]],['$4$-өөс их',[5,6]],['$3$-аас бага',[1,2]],['анхны тоо',[2,3,5]],['$3$-т хуваагдах',[3,6]],['$5$-аас их биш',[1,2,3,4,5]]];var e=pick(evs);var fr=Fr(e[1].length,6);
 return {q:'Тэгш шоо шидэхэд «'+e[0]+'» буух магадлалыг ол.',a:'$P=\\dfrac{'+e[1].length+'}{6}='+fTex(fr)+'$',key:'die'+e[0],nv:fVal(fr)};}
function g_balls(){var r=rnd(2,6),b=rnd(2,6),g=rnd(2,6);var tot=r+b+g;var c=pick([['улаан',r],['цэнхэр',b],['ногоон',g]]);var fr=Fr(c[1],tot);
 return {q:'Хайрцагт $'+r+'$ улаан, $'+b+'$ цэнхэр, $'+g+'$ ногоон бөмбөг байв. Санамсаргүй нэгийг авахад '+c[0]+' өнгийн бөмбөг гарах магадлалыг ол.',a:'$P=\\dfrac{'+c[1]+'}{'+tot+'}='+fTex(fr)+'$',key:'bl'+r+b+g+c[0],nv:fVal(fr)};}
function g_cards(){var evs=[['тамга (♥/♦/♣/♠-ийн аль нэг өнгө)',13,'тодорхой нэг тамга'],['улаан хөзөр',26],['ноён (K)',4],['тамгын ноён',1],['зурагт хөзөр (K, Q, J)',12],['тэгш тоот (2–10)-ийн аль нэг... ',0]];var pool=[['улаан хөзөр гарах',26],['ноён (K) гарах',4],['гил (♥) тамгатай хөзөр гарах',13],['тамгын ноён гарах',1],['зурагт хөзөр (K, Q, J) гарах',12],['тэг биш зурагт бус (2-10)',36]];var e=pick(pool);var fr=Fr(e[1],52);
 return {q:'$52$ хөзрөөс нэгийг санамсаргүй сугалахад «'+e[0]+'» магадлалыг ол.',a:'$P=\\dfrac{'+e[1]+'}{52}='+fTex(fr)+'$',key:'cd'+e[0],nv:fVal(fr)};}
function g_spinner(){var n=pick([8,10,12,16]);var cnt=rnd(1,n-1);var fr=Fr(cnt,n);
 return {q:'$'+n+'$ тэнцүү сектортой хүрдийг эргүүлэхэд заагч $'+cnt+'$ секторын аль нэг дээр (тодорхой өнгө) зогсох магадлалыг ол.',a:'$P=\\dfrac{'+cnt+'}{'+n+'}='+fTex(fr)+'$',key:'sp'+n+cnt,nv:fVal(fr)};}

// ════════ Магадлал WS5 — хос туршилт, эсрэг, боломж ════════
function g_twoDice(){var mode=pick(['sum','same','sumGt','sumLt']);var cnt=0,desc,tot=36;
 if(mode==='sum'){var k=pick([5,6,7,8,9,10]);for(var a=1;a<=6;a++)for(var b=1;b<=6;b++)if(a+b===k)cnt++;desc='нийлбэр нь $'+k+'$ байх';}
 else if(mode==='same'){cnt=6;desc='хоёр нүд ижил байх';}
 else if(mode==='sumGt'){var k2=pick([8,9,10]);for(var a=1;a<=6;a++)for(var b=1;b<=6;b++)if(a+b>k2)cnt++;desc='нийлбэр нь $'+k2+'$-аас их байх';}
 else {var k3=pick([4,5,6]);for(var a=1;a<=6;a++)for(var b=1;b<=6;b++)if(a+b<k3)cnt++;desc='нийлбэр нь $'+k3+'$-аас бага байх';}
 var fr=Fr(cnt,tot);
 return {q:'Хоёр шоог зэрэг шидэхэд '+desc+' үзэгдлийн магадлалыг ол.',a:'Нийт $36$ эгэл үзэгдэл; таатай $'+cnt+'$; $P=\\dfrac{'+cnt+'}{36}='+fTex(fr)+'$',key:'td'+mode+cnt,nv:fVal(fr)};}
function g_twoCoins(){var evs=[['хоёулаа сүлд',1],['яг нэг сүлд',2],['ядаж нэг сүлд',3],['сүлд гарахгүй',1]];var e=pick(evs);var fr=Fr(e[1],4);
 return {q:'Хоёр зоос зэрэг шидэхэд «'+e[0]+'» гарах магадлалыг ол.',a:'Нийт $4$ эгэл үзэгдэл (СС, СТ, ТС, ТТ); таатай $'+e[1]+'$; $P=\\dfrac{'+e[1]+'}{4}='+fTex(fr)+'$',key:'tc'+e[0],nv:fVal(fr)};}
function g_complement(){var fav=rnd(1,5),tot=pick([6,8,10,12]);if(fav>=tot)return null;var fr=Fr(fav,tot),cr=Fr(tot-fav,tot);
 return {q:'Аль нэг үзэгдлийн магадлал $'+fTex(fr)+'$ бол эсрэг үзэгдлийн магадлалыг ол.',a:'$P(\\bar A)=1-'+fTex(fr)+'='+fTex(cr)+'$',key:'cm'+fav+tot,nv:fVal(cr)};}
function g_possible(){var pool=[['\\dfrac{3}{5}',true],['1.5',false],['0.8',true],['\\dfrac{7}{4}',false],['0',true],['-0.2',false],['\\dfrac{5}{6}',true],['1',true]];var e=pick(pool);
 return {q:'Аль нэг үзэгдлийн магадлал $'+e[0]+'$ байж болох уу? Учрыг тайлбарла.',a:e[1]?('$0\\le '+e[0]+'\\le1$ тул <b>болно</b>.'):('Магадлал $[0;1]$ завсарт байх ёстой, $'+e[0]+'$ энэ завсарт үл багтах тул <b>болохгүй</b>.'),key:'ps'+e[0]};}
var WSPEC={"title":"Магадлал — хос туршилт ба эсрэг үзэгдэл","sub":"Үзэгдлийн магадлал · III бүлэг · 8-р анги","rule":"<b>Санамж:</b> Тэнцүү боломжтой үед $P(A)=dfrac{\text{таатай тохиолдол}}{\text{нийт тохиолдол}}$. $0le P(A)le1$; $ P(Omega)=1, P(\u000barnothing)=0$; $ P(\bar A)=1-P(A)$.","ref":"","tasks":[{"label":"Хоёр шоо шидэх туршилтын магадлалыг ол.","fn":"g_twoDice","cap":4},{"label":"Хоёр зоос шидэх туршилтын магадлалыг ол.","fn":"g_twoCoins","cap":3},{"label":"Эсрэг үзэгдлийн магадлалыг ол.","fn":"g_complement","cap":3},{"label":"Өгсөн утга магадлал байж болох эсэхийг тодорхойл.","fn":"g_possible","cap":3}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={};for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap){var use=WK?arr.slice(0,cap):arr;return '<div class="grid">'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  TASKS.forEach(function(t,i){html+='<div class="task">'+(i+1)+'. '+t.label+'</div>'+block(S[i],t.cap);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
