<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2×2 матриц — тодорхойлогч ба урвуу</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--line:#ece6fb;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;
    background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)}
  .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}

  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:6px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}
  .head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:9px 2px 14px}
  .meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:8px 6px 0;border-bottom:1px dashed #efeaff;margin-bottom:6px}
  .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .qn{font-weight:800;color:var(--purple);min-width:24px}
  .qm{font-size:15px}
  .ask{font-size:12px;color:var(--soft);margin:4px 0 0 30px;font-weight:600}
  .work{margin:6px 0 8px 30px;height:26mm;border:1.4px solid #c7bce8;border-radius:6px;
    background-image:linear-gradient(#eee 1px,transparent 1px);background-size:100% 6mm}

  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}
  .ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;font-size:12.5px}
  .ans-grid .a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ans-grid .an{color:var(--soft);font-weight:800}
  #answers{display:none}

  @media print{
    body{background:#fff;padding:0}
    .bar{display:none}
    .sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}
    @page{size:A4;margin:12mm}
    .ans-page{break-before:page}
  }
</style>
</head>
<body>

<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>

<div class="sheet" id="sheet"></div>

<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(){var v=0;while(v===0)v=rnd(-9,9);return v;} // тэг биш

function mat(a,b,c,d){return '\\begin{pmatrix}'+a+' & '+b+' \\\\ '+c+' & '+d+'\\end{pmatrix}';}
// бутархайг хялбарчлах
function gcd(x,y){x=Math.abs(x);y=Math.abs(y);while(y){var t=y;y=x%y;x=t;}return x||1;}
function frac(num,den){
  if(num===0)return '0';
  var s=(num*den<0)?'-':'';num=Math.abs(num);den=Math.abs(den);
  var g=gcd(num,den);num/=g;den/=g;
  if(den===1)return s+num;
  return s+'\\frac{'+num+'}{'+den+'}';
}
function invMatrix(a,b,c,d,det){
  // (1/det)*[[d,-b],[-c,a]]  →  элемент бүрийг бутархайгаар
  return '\\begin{pmatrix}'+frac(d,det)+' & '+frac(-b,det)+' \\\\ '+frac(-c,det)+' & '+frac(a,det)+'\\end{pmatrix}';
}

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}

function build(){
  var probs='',answs='';
  for(var i=0;i<20;i++){
    var a=nz(),b=rnd(-9,9),c=rnd(-9,9),d=nz();
    var det=a*d-b*c;
    if(det===0){i--;continue;} // урвуутай байхын тулд det≠0
    var n=i+1;
    probs+='<div class="q"><div class="qh"><span class="qn">'+n+'.</span>'
      +'<span class="qm">$A='+mat(a,b,c,d)+'$</span></div>'
      +'<div class="ask">Ол: $\\det A$ ба $A^{-1}$</div>'
      +'<div class="work"></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span>'
      +'<span>$\\det A='+det+',\\;\\; A^{-1}='+invMatrix(a,b,c,d,det)+'$</span></div>';
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>2×2 матриц — тодорхойлогч ба урвуу</h1>'
    +'<div class="sub">Матриц бүрийн $\\det A$ ба урвуу $A^{-1}$-г ол · 20 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  ;(function(){try{var as=document.querySelectorAll("#answers .ans-grid .a");var ps=document.querySelectorAll("#sheet .grid .q");var st=function(s){return (s||"").replace(/\$/g,"").trim();};var arr=[];for(var i=0;i<as.length;i++){var ae=as[i],asp=ae.querySelector("span:last-child");var av=st(asp?asp.textContent:ae.textContent);var qv="";var pe=ps[i];if(pe){var qm=pe.querySelector(".qm");qv=st(qm?qm.textContent:"");}qv=qv.replace(/=\s*$/,"").trim();if(av.indexOf("=")>=0)arr.push({q:av,a:""});else arr.push({q:qv,a:av});}window.WS_ITEMS=arr;var h1=document.querySelector("#sheet .head h1");window.WS_TITLE=h1?h1.textContent:document.title;}catch(e){}})();
      try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=7"></script>
</body>
</html>
