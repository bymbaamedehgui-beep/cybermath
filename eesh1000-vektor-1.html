<script>
/* ЭЕШ 1000 — Вектор, огторгуйн координат-1 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Вектор, скаляр үржвэр, огторгуйн цэг, шулуун ба хавтгай.
   Эх: 1.28, 1.67, 1.8, 1.55, 1.91, 1.13, 1.39, 1.60, 2.30, 2.27, 2.28, 2.31, 2.32, 2.29, 2.33, 2.34, 2.35, 4.3, 4.58, 4.46 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 1.28 */
var e1_28 = (function () {
// 28. (p·a + q·b)·(r·a + s·b) скаляр үржвэр (эх: a=(3,2), b=(−1,2); (a+b)·(2a−b) = 22).
function p28() {
  var a = [rnd(-5, 5), rnd(-5, 5)], b = [rnd(-5, 5), rnd(-5, 5)];
  if (a[0] * b[1] - a[1] * b[0] === 0) return null;
  var C = [1, 1, 2, 3, -1, -2], p = pick([1, 1, 2, 3]), q = pick(C), r = pick([1, 2, 2, 3]), s = pick(C);
  if (p * s - q * r === 0) return null;
  var u = [p * a[0] + q * b[0], p * a[1] + q * b[1]], w = [r * a[0] + s * b[0], r * a[1] + s * b[1]], v = u[0] * w[0] + u[1] * w[1];
  if (v === 0 || Math.abs(v) > 150) return null;
  var cb = function (x, y) { return tm(x, '\\vec a', true) + tm(y, '\\vec b'); }, P = cb(p, q), Q = cb(r, s);
  // Бодолт (гар бичмэл): хоёр векторын координатыг олж, скаляр үржвэр = x₁x₂ + y₁y₂.
  var co = function (k1, k2) { return '(' + p28_lin(k1, a[0], k2, b[0]) + ',\\ ' + p28_lin(k1, a[1], k2, b[1]) + ')'; };
  var vc = function (z) { return '(' + z[0] + ',' + z[1] + ')'; }, pr = [], sm = [];
  [0, 1].forEach(function (i) { if (u[i] && w[i]) { pr.push(par(u[i]) + '\\cdot ' + par(w[i])); sm.push(u[i] * w[i]); } });
  var dot = pr.join('+') + (sm.length > 1 ? '=' + sm[0] + sgn(sm[1]) : '') + '=' + v;
  return {
    q: '$\\vec a=(' + a[0] + ',' + a[1] + '),\\ \\vec b=(' + b[0] + ',' + b[1] + ')$ векторууд өгчээ. $' + P + '$ ба $' + Q + '$ векторуудын скаляр үржвэрийг ол.',
    a: '$(' + P + ')\\cdot(' + Q + ')=' + v + '$', wk: 22,
    s: [
      'Векторуудын координатыг олъё: $$' + P + '=' + co(p, q) + '=' + vc(u) + ',$$ $$' + Q + '=' + co(r, s) + '=' + vc(w) + '.$$',
      'Скаляр үржвэр нь харгалзах координатуудын үржвэрийн нийлбэр: $$' + vc(u) + '\\cdot ' + vc(w) + '=' + dot + '.$$'
    ],
    t: { a: a, b: b, p: p, q: q, r: r, s: s }
  };
}
// k₁·x + k₂·y-ийн бичлэг (гар бичмэлийн «3−1», «6+1» маягаар): ±1 коэффициенттэй гишүүнийг шууд тоогоор, 0-ийг алгасна
function p28_lin(k1, x, k2, y) {
  var out = '';
  [[k1, x], [k2, y]].forEach(function (t) {
    var c = t[0], z = t[1], neg, body;
    if (!z) return;
    if (Math.abs(c) === 1) { neg = c * z < 0; body = String(Math.abs(z)); }
    else { neg = c < 0; body = Math.abs(c) + '\\cdot ' + par(z); }
    out += neg ? '-' + body : (out ? '+' : '') + body;
  });
  return out || '0';
}
return p28;
})();

/* 1.67 */
var e1_67 = (function () {
// 67. a ⟂ b ⇔ a·b = 0; нэг координат (x, y эсвэл z) үл мэдэгдэх → шугаман тэгшитгэл.
function p67() {
  var P = [nz(-5, 5), nz(-5, 5), nz(-5, 5)], Q = [nz(-5, 5), nz(-5, 5), nz(-5, 5)], k = pick([0, 1, 1, 1, 2]), inA = !rnd(0, 4);
  var s = 0;
  for (var i = 0; i < 3; i++) if (i !== k) s += P[i] * Q[i];
  if (s % P[k]) return null;
  var u = -s / P[k];                       // Q[k] = u
  if (!u || Math.abs(u) > 20) return null;
  var nm = ['x', 'y', 'z'][k], Qs = Q.slice();
  Qs[k] = nm;
  var X = pt(P[0], P[1], P[2]), Y = pt(Qs[0], Qs[1], Qs[2]);
  // Бодолт (гар бичмэл): a ⟂ b ⇒ a·b = a1b1 + a2b2 + a3b3 = 0 → шугаман тэгшитгэл.
  var va = inA ? Qs : P, vb = inA ? P : Qs, fc = function (z) { return typeof z === 'string' ? z : par(z); };
  var t1 = [0, 1, 2].map(function (i) { return fc(va[i]) + '\\cdot ' + fc(vb[i]); }).join('+');
  var t2 = [0, 1, 2].map(function (i) { return i === k ? tm(P[k], nm, i === 0) : i === 0 ? String(P[i] * Q[i]) : sgn(P[i] * Q[i]); }).join('');
  return {
    q: '$\\vec a=' + (inA ? Y : X) + ',\\ \\vec b=' + (inA ? X : Y) + '$ ба $\\vec a,\\ \\vec b$ векторууд перпендикуляр бол $' + nm + '$-ийн утгыг ол.',
    a: '$' + nm + '=' + u + '$',
    wk: 20,
    s: [
      '$\\vec a\\perp\\vec b$ тул скаляр үржвэр нь тэг: $\\vec a\\cdot\\vec b=0$. Координатаар бичвэл $$\\vec a\\cdot\\vec b=' + t1 + '=' + t2 + '=0.$$',
      'Эндээс ' + (P[k] === 1 ? '' : '$' + tm(P[k], nm, true) + '=' + (-s) + '$, ') + '$' + nm + '=' + u + '$.'
    ],
    t: {}
  };
}
return p67;
})();

/* 1.8 */
var e1_8 = (function () {
// 8. OABC параллелограмм, E ∈ BC: BE:EC = p:q, AC ∩ OE = M.  OE = q/(p+q)·a + c;
//    M = t·OE нь AC дээр: (1 − s)a + s·c → t = (p+q)/(p+2q)  ⇒  OM = q/(p+2q)·a + (p+q)/(p+2q)·c.
function p8() {
  var p = rnd(1, 5), q = rnd(1, 5);
  if (p === q || gcd(p, q) !== 1) return null;
  var d = p + 2 * q, u = p / (p + q), t = (p + q) / d;
  // Зураг (эхийнх шиг налуу): O(0;0), C(5;0), A(1.5;3.8), B = A + C
  var O = [0, 0], C = [5, 0], A = [1.5, 3.8], B = [6.5, 3.8];
  var E = [B[0] + (C[0] - B[0]) * u, B[1] + (C[1] - B[1]) * u], M = [E[0] * t, E[1] * t];
  var f = Fig({ w: 230, padB: 24 });
  f.seg(A, B).seg(B, C).seg(A, C, { w: 1.2 }).seg(O, E, { w: 1.2 })
    .arrow(O, A, { w: 1.4 }).arrow(O, C, { w: 1.4 })
    .dot(E, { r: 2.3 }).dot(M, { r: 2.3 });
  // M-ийн шошгыг AC ба OE-ийн хоорондох өнцгийн биссектрисс дээр (дээш) байрлуулна
  var aA = Math.atan2(A[1] - M[1], A[0] - M[0]), aE = Math.atan2(E[1] - M[1], E[0] - M[0]), bis = (aA + aE) / 2 * 180 / Math.PI;
  f.text(O, 'O', { pos: 'sw' }).text(C, 'C', { pos: 'se' }).text(A, 'A', { pos: 'nw' }).text(B, 'B', { pos: 'ne' })
    .text(E, 'E', { pos: 'e' }).text(M, 'M', { pos: bis, off: 6 });
  p8_vec(f, [(O[0] + A[0]) / 2, (O[1] + A[1]) / 2], 'a', -13, 0);
  p8_vec(f, [(O[0] + C[0]) / 2, 0], 'c', 0, 15);
  // Бодолт (гар бичмэл): △OAM ∼ △ECM → OM:ME = OA:EC = (p+q):q → OM = (p+q)/(p+2q)·OE; OE = c + q/(p+q)·a.
  var pq = p + q, qf = fr(q, pq);
  // E оройн нумын радиус: жижиг ECM гурвалжинд багтаана (px ≈ 27.4/нэгж); E-ийн шошгыг богино хэрчмийн эсрэг талд
  var rE = Math.max(6, Math.min(15, 0.42 * 27.4 * Math.min(Math.hypot(E[0] - M[0], E[1] - M[1]), Math.hypot(E[0] - C[0], E[1] - C[1]))));
  var g = Fig({ w: 210, padB: 20 });
  g.poly([O, A, M], { fill: '#e6e6e6', op: 0.9, w: 0.01 }).poly([E, C, M], { fill: '#e6e6e6', op: 0.9, w: 0.01 })
    .poly([O, A, B, C], { w: 1.4 }).seg(A, C, { w: 1.2 }).seg(O, E, { w: 1.2 })
    .angle(O, A, E, { r: 15, n: 2 }).angle(E, C, O, { r: rE, n: 2 })
    .dot(E, { r: 2.2 }).dot(M, { r: 2.2 })
    .text(O, 'O', { pos: 'sw' }).text(C, 'C', { pos: 'se' }).text(A, 'A', { pos: 'nw' }).text(B, 'B', { pos: 'ne' })
    .text(M, 'M', { pos: bis, off: 6 }).text([(O[0] + A[0]) / 2, (O[1] + A[1]) / 2], String(pq), { pos: 'w', size: 12 });
  // E ба BE, EC-ийн уртын шошгыг хэрчим/бусад шошготой давхцахгүй байрлалд (Fig-ийн хувиргалтыг px-ээр давтана)
  var sp = 178 / 6.5, X = function (P) { return [16 + P[0] * sp, 16 + (3.8 - P[1]) * sp]; }, sg = function (P, Q) { return X(P).concat(X(Q)); };
  var L = p8_lay([sg(O, A), sg(A, B), sg(B, C), sg(C, O), sg(A, C), sg(O, E)], []);
  [[O, 'O', 'sw'], [C, 'C', 'se'], [A, 'A', 'nw'], [B, 'B', 'ne']].forEach(function (t) { var P = X(t[0]); L.boxes.push(L.box(P[0], P[1], t[1], t[2])); });
  [E, M].forEach(function (P) { var Q = X(P); L.boxes.push([Q[0] - 2.5, Q[1] - 2.5, Q[0] + 2.5, Q[1] + 2.5]); });
  var Mx = X(M); L.boxes.push(L.box(Mx[0], Mx[1], 'M', bis));
  var mBE = [(B[0] + E[0]) / 2, (B[1] + E[1]) / 2], mEC = [(E[0] + C[0]) / 2, (E[1] + C[1]) / 2];
  g.text(E, 'E', { pos: L.pick(X(E), 'E', ['e', -18, 18, 'se', 'nw', 'ne', 'sw', 'w']), halo: true })
    .text(mBE, String(p), { pos: L.pick(X(mBE), String(p), ['e', 'ne', 'se', -35, 35], 12), size: 12 })
    .text(mEC, String(q), { pos: L.pick(X(mEC), String(q), ['e', 'se', 'ne', -35, 35, 's'], 12), size: 12 });
  return {
    q: '$OABC$ параллелограммын $BC$ талыг $BE:EC=' + p + ':' + q + '$ харьцаагаар хуваах цэгийг $E$ гэе. $AC$ диагональ $OE$ хэрчимтэй $M$ цэгт огтлолцдог байв. '
      + '$\\overrightarrow{OA}=\\vec a$ ба $\\overrightarrow{OC}=\\vec c$ вектороор $\\overrightarrow{OM}$ векторыг илэрхийлээрэй.',
    a: '$\\overrightarrow{OM}=' + fr(q, d) + '\\vec a+' + fr(p + q, d) + '\\vec c$',
    fig: f.svg(), wk: 30,
    s: [
      '$OA\\parallel CE$ тул $\\triangle OAM\\sim\\triangle ECM$ ($\\angle AOM=\\angle CEM$ — дотоод солбисон, $\\angle OMA=\\angle EMC$ — босоо өнцгүүд). $BC=OA$ ба $BE:EC=' + p + ':' + q + '$ тул $EC=' + qf + 'OA$. Иймд '
        + '$$\\dfrac{OM}{ME}=\\dfrac{OA}{EC}=' + fr(pq, q) + '\\Rightarrow \\overrightarrow{OM}=' + fr(pq, d) + '\\overrightarrow{OE}.$$',
      'Мөн $$\\begin{aligned}\\overrightarrow{CE}&=' + qf + '\\overrightarrow{CB}=' + qf + '\\vec a,\\\\'
        + '\\overrightarrow{OE}&=\\overrightarrow{OC}+\\overrightarrow{CE}=\\vec c+' + qf + '\\vec a.\\end{aligned}$$',
      'Иймд $$\\overrightarrow{OM}=' + fr(pq, d) + '\\left(\\vec c+' + qf + '\\vec a\\right)=' + fr(q, d) + '\\vec a+' + fr(pq, d) + '\\vec c.$$'
    ],
    sfig: g.svg(),
    t: { p: p, q: q }
  };
}
// Шошго байрлуулагч (px): Fig-ийн textAt-ийн байрлал ба үсгийн хэмжээг (getBBox-оор хэмжсэн) дуурайж,
// cands-ын дарааллаар хэрчим ба өмнөх шошготой давхцахгүй эхний (эс бөгөөс хамгийн бага давхцах) байрлалыг сонгоно
function p8_lay(segs, boxes) {
  var WD = { A: 9, B: 9, C: 10, O: 10, E: 9, M: 12 };
  function box(x, y, txt, pos, size, off) {   // үсгийн бодит хүрээнээс ирмэг бүрт 1.5/2.5px хассан тэгш өнцөгт
    size = size || 13; off = off == null ? 6 : off;
    var w = (WD[txt] || 6.6 * txt.length) * size / 13, an = 'middle', dy = 0.35 * size;
    if (typeof pos === 'number') {
      var r = pos * Math.PI / 180, cx = Math.cos(r), cy = Math.sin(r);
      x += (off + size * 0.35) * cx; y -= (off + size * 0.35) * cy;
      an = cx > 0.35 ? 'start' : cx < -0.35 ? 'end' : 'middle';
      if (an !== 'middle') x -= cx * size * 0.3;
    } else {
      if (/n/.test(pos)) { y -= off + (pos === 'n' ? 0.1 * size : 0); dy = 0; }
      if (/s/.test(pos)) { y += off + (pos === 's' ? 0.1 * size : 0); dy = 0.72 * size; }
      if (/e/.test(pos)) { x += off * (pos === 'e' ? 1 : 0.6); an = 'start'; }
      if (/w/.test(pos)) { x -= off * (pos === 'w' ? 1 : 0.6); an = 'end'; }
    }
    var x0 = an === 'start' ? x : an === 'end' ? x - w : x - w / 2, yb = y + dy;
    return [x0 + 1.5, yb - 0.92 * size + 2.5, x0 + w - 1.5, yb + 0.23 * size - 2.5];
  }
  function hit(sg, b) {   // хэрчим ∩ тэгш өнцөгт (Liang–Barsky)
    var t0 = 0, t1 = 1, dx = sg[2] - sg[0], dy = sg[3] - sg[1], p = [-dx, dx, -dy, dy], q = [sg[0] - b[0], b[2] - sg[0], sg[1] - b[1], b[3] - sg[1]];
    for (var i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; }
      else { var r = q[i] / p[i]; if (p[i] < 0) { if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; } }
    }
    return true;
  }
  function cost(c) {
    var n = 0;
    segs.forEach(function (sg) { if (hit(sg, c)) n++; });
    boxes.forEach(function (o) { if (c[0] < o[2] && o[0] < c[2] && c[1] < o[3] && o[1] < c[3]) n += 2; });
    return n;
  }
  return {
    box: box, boxes: boxes,
    pick: function (P, txt, cands, size) {
      var best = cands[0], bn = 1e9;
      for (var i = 0; i < cands.length && bn; i++) { var n = cost(box(P[0], P[1], txt, cands[i], size)); if (n < bn) { bn = n; best = cands[i]; } }
      boxes.push(box(P[0], P[1], txt, best, size));
      return best;
    }
  };
}
// Векторын шошго: налуу үсэг + дээр нь жижиг сум (P — ертөнцийн цэг, dx/dy — пикселийн шилжилт)
function p8_vec(f, P, s, dx, dy) {
  f.raw(function (T) {
    var x = T.X(P[0]) + dx, yb = T.Y(P[1]) + dy + 4.5, ya = yb - 10.5, r2 = function (v) { return +v.toFixed(2); };
    return '<text x="' + r2(x) + '" y="' + r2(yb) + '" font-size="14" font-style="italic" font-family="\'KaTeX_Main\',\'Times New Roman\',serif" text-anchor="middle" fill="#1b1b1b">' + s + '</text>'
      + '<line x1="' + r2(x - 4.2) + '" y1="' + r2(ya) + '" x2="' + r2(x + 2.6) + '" y2="' + r2(ya) + '" stroke="#1b1b1b" stroke-width="0.9"/>'
      + '<polygon points="' + r2(x + 4.8) + ',' + r2(ya) + ' ' + r2(x + 1.6) + ',' + r2(ya - 2.1) + ' ' + r2(x + 1.6) + ',' + r2(ya + 2.1) + '" fill="#1b1b1b"/>';
  });
}
return p8;
})();

/* 1.55 */
var e1_55 = (function () {
// 55. OAB гурвалжны AB тал дээр AC : CB = p : q байх C: OC⃗ = OA⃗ + (p/(p+q))·AB⃗ = q/(p+q)·a⃗ + p/(p+q)·b⃗.
//     Зураг: O зүүн доод, A дээд (бага зэрэг баруун), B баруун доод; C — AB дээр харьцаагаар; O→A, O→B, O→C сум.
function p55_vl(f, P, ch, dx, dy) {   // векторын нэр: налуу үсэг + дээр нь жижиг сум (пикселийн шилжилт dx, dy)
  f.raw(function (T) {
    var x = T.X(P[0]) + dx, y = T.Y(P[1]) + dy, ay = y - (ch === 'b' ? 14.5 : 11), x0 = x - 4.5, x1 = x + 5.5;
    return '<text x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" font-size="15" font-family="\'KaTeX_Main\',\'Times New Roman\',serif" font-style="italic" text-anchor="middle" fill="#1b1b1b">' + ch + '</text>'
      + '<line x1="' + x0.toFixed(2) + '" y1="' + ay.toFixed(2) + '" x2="' + (x1 - 2).toFixed(2) + '" y2="' + ay.toFixed(2) + '" stroke="#1b1b1b" stroke-width="1"/>'
      + '<polygon points="' + x1.toFixed(2) + ',' + ay.toFixed(2) + ' ' + (x1 - 3.6).toFixed(2) + ',' + (ay - 2).toFixed(2) + ' ' + (x1 - 3.6).toFixed(2) + ',' + (ay + 2).toFixed(2) + '" fill="#1b1b1b"/>';
  });
}
function p55() {
  var p = rnd(1, 5), q = rnd(1, 5);
  if (gcd(p, q) !== 1 || (p === q && rnd(1, 3) > 1)) return null;
  var s = p + q;
  var O = [0, 0], A = [1.25, 3.1], B = [6, 0], C = [A[0] + (B[0] - A[0]) * p / s, A[1] + (B[1] - A[1]) * p / s];
  var f = Fig({ w: 230, pad: 14 });
  f.seg(A, B, { w: 1.4 })
    .arrow(O, A, { w: 1.5, h: 8 }).arrow(O, B, { w: 1.5, h: 8 }).arrow(O, C, { w: 1.5, h: 8 })
    .dot(C, { r: 2.2 })
    .text(O, 'O', { pos: 'sw', size: 14 }).text(A, 'A', { pos: 'n', size: 14 }).text(B, 'B', { pos: 'se', size: 14 })
    .text(C, 'C', { pos: 'ne', size: 14 });
  p55_vl(f, [A[0] / 2, A[1] / 2], 'a', -12, 2);
  p55_vl(f, [B[0] / 2, 0], 'b', 0, 18);
  f.ext([-0.35, -0.6]).ext([6.35, A[1] + 0.35]);   // шошгонд зай
  // Бодолт (гар бичмэл): q·AC⃗ + p·BC⃗ = 0⃗ (эсрэг чиглэлтэй, урт тэнцүү); OC⃗ = OB⃗ + BC⃗ (·p), OC⃗ = OA⃗ + AC⃗ (·q) — нэмнэ.
  var vA = tm(q, '\\overrightarrow{AC}', true), vB = tm(p, '\\overrightarrow{BC}', true);
