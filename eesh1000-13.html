<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЭЕШ 1000 4-1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/e1k.js?v=4"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* ЭЕШ 1000 4-1 — ЭЕШ-ийн 1000 бодлого, 4-р хэсэг (1–27-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 1. f(x) = √g(x) ⇒ f'(x) = g'(x)/(2√g(x)). x₀ цэгт g(x₀) = k² (бүтэн квадрат) байхаар сонгоно ⇒ налалт f'(x₀) = g'(x₀)/(2k) рационал.
//    Төрөл: √(ax + b) (голдуу, a сөрөг ч байж болно: √(b − ax)), √(x² + c), √(c − x²), √(x² + px + q). Хариу хураасан бутархай.
function p1() {
  var T = rnd(1, 20), x0, k, inner, num, den;
  if (T <= 12) {                                   // √(ax + b)
    var a = rnd(1, 5) === 1 ? -rnd(2, 9) : rnd(2, 9), b;
    x0 = nz(-4, 9); k = rnd(2, 9); b = k * k - a * x0;
    if (!b || Math.abs(b) > 45 || (b < 0 && (a < 0 || rnd(0, 1)))) return null;
    if (a === 4 && b === 5 && x0 === 5) return null;   // эх тоо тогтмол хувилбар болохгүй
    inner = a < 0 && b > 0 ? b + '-' + (-a) + 'x' : poly([a, b]);
    num = a; den = 2 * k;
  } else if (T <= 16) {                            // √(x² + c)
    x0 = nz(-6, 6); k = rnd(2, 10);
    var c = k * k - x0 * x0;
    if (!c || Math.abs(c) > 60) return null;
    inner = 'x^2' + sgn(c); num = x0; den = k;
  } else if (T <= 18) {                            // √(c − x²)
    x0 = nz(-6, 6); k = rnd(1, 8);
    var c2 = k * k + x0 * x0;
    if (c2 > 80) return null;
    inner = c2 + '-x^2'; num = -x0; den = k;
  } else {                                         // √(x² + px + q)
    x0 = nz(-4, 5); k = rnd(2, 8);
    var pp = nz(-6, 6), qq = k * k - x0 * x0 - pp * x0;
    if (!qq || Math.abs(qq) > 40) return null;
    inner = poly([1, pp, qq]).replace('x^{2}', 'x^2'); num = 2 * x0 + pp; den = 2 * k;
    if (!num) return null;
  }
  if (num % den === 0 && rnd(0, 2)) return null;   // голдуу бутархай налалт (эх шиг)
  // Бодолт: (√u)' = u'/(2√u) → f'(x) (2-оор хураана); x₀ дээр √u(x₀) = √(k²) = k; f'(x₀)-ийг орлуулж бодно
  var P = par(x0), sq = '\\sqrt{' + inner + '}', fx, uS, fS, h;
  if (T <= 12) {
    h = a / 2;
    fx = (a < 0 ? '-' : '') + '\\dfrac{' + Math.abs(a) + '}{2' + sq + '}'
      + (a % 2 ? '' : '=' + (h < 0 ? '-' : '') + '\\dfrac{' + Math.abs(h) + '}{' + sq + '}');
    uS = a < 0 ? b + '-' + (-a) + '\\cdot ' + P : a + '\\cdot ' + P + sgn(b);
    fS = (a < 0 ? '-' : '') + '\\dfrac{' + Math.abs(a % 2 ? a : h) + '}{' + (a % 2 ? '2\\cdot ' : '') + k + '}';
  } else if (T <= 16) {
    fx = '\\dfrac{2x}{2' + sq + '}=\\dfrac{x}{' + sq + '}'; uS = P + '^2' + sgn(c); fS = '\\dfrac{' + x0 + '}{' + k + '}';
  } else if (T <= 18) {
    fx = '-\\dfrac{2x}{2' + sq + '}=-\\dfrac{x}{' + sq + '}'; uS = c2 + '-' + P + '^2'; fS = k === 1 ? '-' + P : '-\\dfrac{' + x0 + '}{' + k + '}';
  } else {
    h = pp / 2;
    fx = '\\dfrac{2x' + sgn(pp) + '}{2' + sq + '}' + (pp % 2 ? '' : '=\\dfrac{x' + sgn(h) + '}{' + sq + '}');
    uS = P + '^2' + (pp < 0 ? '-' : '+') + (Math.abs(pp) === 1 ? '' : Math.abs(pp) + '\\cdot ') + P + sgn(qq);
    fS = pp % 2 ? '\\dfrac{2\\cdot ' + P + sgn(pp) + '}{2\\cdot ' + k + '}' : '\\dfrac{' + x0 + sgn(h) + '}{' + k + '}';
  }
  var fv = fr(num, den);
  return {
    q: '$f(x)=\\sqrt{' + inner + '}$ функцийн $x=' + x0 + '$ цэг дээрх налалтыг олоорой.',
    a: "$f'(" + x0 + ')=' + fr(num, den) + '$',
    wk: 22,
    s: [
      "Функцийн $x_0$ цэг дээрх налалт нь уламжлалын утга $f'(x_0)$-тэй тэнцүү. Нийлмэл функцийн уламжлалын $(\\sqrt{u})'=\\dfrac{u'}{2\\sqrt{u}}$ томьёогоор $$f'(x)=" + fx + '.$$',
      '$x=' + x0 + '$ үед язгуурын утгыг олъё: $$\\sqrt{' + uS + '}=\\sqrt{' + k * k + '}=' + k + '.$$',
      "Иймд $$f'(" + x0 + ')=' + fS + (fS === fv ? '' : '=' + fv) + '.$$'
    ],
    t: { inner: inner, x0: x0 }
  };
}

// 2. N модтой хөзөр (36 эсвэл 52), «сайн» хөзөр K ширхэг: тамга/ноён/хатан — 4, улаан — N/2.
//    Буцааж хийлгүйгээр: хоёул K(K−1)/(N(N−1)), аль нь ч биш (N−K)(N−K−1)/(N(N−1)), ядаж нэг = 1 − (аль нь ч биш),
//    яг нэг 2K(N−K)/(N(N−1)), эхнийх X, хоёр дахь нь Y (өөр дүрс) 4·4/(N(N−1)). Буцааж хийвэл хуваарь N², тоологч K², …
var p2_C = [['тамга', 4], ['ноён', 4], ['хатан', 4], ['улаан', 0]];   // улаан: N/2
function p2() {
  var N = pick([36, 36, 52]), rep = rnd(1, 3) === 1, ev = pick(['both', 'both', 'both', 'both', 'any', 'any', 'one', 'none', 'xy']);
  var ci = rnd(0, ev === 'xy' ? 2 : 3), name = p2_C[ci][0], K = ci === 3 ? N / 2 : 4, L = N - K;
  var D = rep ? N * N : N * (N - 1), num, txt;
  if (ev === 'both') { num = rep ? K * K : K * (K - 1); txt = 'Уг 2 хөзөр хоёул ' + name + ' хөзөр байх'; }
  else if (ev === 'none') { num = rep ? L * L : L * (L - 1); txt = 'Уг 2 хөзрийн аль нь ч ' + name + ' хөзөр биш байх'; }
  else if (ev === 'any') { num = D - (rep ? L * L : L * (L - 1)); txt = 'Уг 2 хөзрийн ядаж нэг нь ' + name + ' хөзөр байх'; }
  else if (ev === 'one') { num = 2 * K * L; txt = 'Уг 2 хөзрийн яг нэг нь ' + name + ' хөзөр байх'; }
  else {
    var cj = (ci + rnd(1, 2)) % 3;
    num = 16; txt = 'Эхний хөзөр ' + name + ', хоёр дахь хөзөр ' + p2_C[cj][0] + ' байх';
  }
  if (N === 36 && !rep && ev === 'both' && ci === 0) return null;   // эх бодлогын тохиолдол тогтмол биш
  // Бодолт: магадлалын үржүүлэх дүрэм (буцааж хийхгүй бол 2-р удаад N − 1 хөзөр, «сайн» хөзөр нэгээр цөөрнө);
  //   ядаж нэг — эсрэг үзэгдлээр, яг нэг — үл нийцэх хоёр тохиолдлын нийлбэр
  var ss = (function () {
    var N1 = N - 1, M = rep ? N : N1, f = function (u, w) { return '\\dfrac{' + u + '}{' + w + '}'; };
    var R = function (u, w) { return f(u, w) + (gcd(u, w) > 1 ? '=' + fr(u, w) : ''); };   // u/w (= хураасан)
    var deck = ci === 3 ? '$' + N + '$ хөзрийн хагас буюу $' + K + '$ нь улаан хөзөр' : '$' + N + '$ хөзрийн $' + K + '$ нь ' + name + ' хөзөр (өнгө бүрд нэг)';
    var rp = rep ? 'Буцааж хийх тул хоёр дахь удаад мөн $' + N + '$ хөзрөөс сугална.' : 'Буцааж хийхгүй тул хоёр дахь удаад $' + N1 + '$ хөзөр үлдэнэ.';
    var oth = ', бусад $' + L + '$ нь ' + name + ' биш. ';
    var Kb = rep ? K : K - 1, Lb = rep ? L : L - 1;
    var second = function (cnt, cnt2, what) {   // 2-р хөзрийн магадлалын тайлбар
      return rep ? 'хоёр дахь удаад ч мөн $' + f(cnt, N) + '$' : 'дараа нь үлдсэн $' + N1 + '$ хөзрийн $' + cnt2 + '$ нь ' + what + ' тул $' + f(cnt2, N1) + '$';
    };
    if (ev === 'both') return [deck + '. ' + rp,
      'Эхний хөзөр ' + name + ' байх магадлал $' + f(K, N) + '$, ' + second(K, Kb, name) + '. Үржүүлэх дүрмээр $$P=' + f(K, N) + '\\cdot ' + f(Kb, M) + '=' + R(num, D) + '.$$'];
    if (ev === 'none') return [deck + oth + rp,
      'Эхний хөзөр ' + name + ' биш байх магадлал $' + f(L, N) + '$, ' + second(L, Lb, name + ' биш') + '. Үржүүлэх дүрмээр $$P=' + f(L, N) + '\\cdot ' + f(Lb, M) + '=' + R(num, D) + '.$$'];
    if (ev === 'any') return [deck + oth + rp,
      '«Ядаж нэг нь ' + name + '» үзэгдлийг $A$ гэвэл эсрэг үзэгдэл $\\overline{A}$ нь «хоёулаа ' + name + ' биш». Эхний хөзөр ' + name + ' биш байх магадлал $' + f(L, N) + '$, '
        + second(L, Lb, name + ' биш') + '. Үржүүлэх дүрмээр $$P(\\overline{A})=' + f(L, N) + '\\cdot ' + f(Lb, M) + '=' + R(L * Lb, D) + '.$$',
      'Эсрэг үзэгдлийн магадлалаар $$P(A)=1-P(\\overline{A})=1-' + fr(L * Lb, D) + '=' + fr(num, D) + '.$$'];
    if (ev === 'one') return [deck + oth + rp,
      '«Яг нэг нь ' + name + '» гэдэг нь «эхнийх нь ' + name + ', хоёр дахь нь биш» эсвэл «эхнийх нь биш, хоёр дахь нь ' + name + '» гэсэн үл нийцэх хоёр тохиолдол. Нэмэх ба үржүүлэх дүрмээр '
        + '$$P=' + f(K, N) + '\\cdot ' + f(L, M) + '+' + f(L, N) + '\\cdot ' + f(K, M) + '$$ $$=2\\cdot ' + fr(K * L, D) + '=' + fr(num, D) + '.$$'];
    var nm2 = p2_C[cj][0];
    return ['$' + N + '$ хөзрийн $4$ нь ' + name + ', $4$ нь ' + nm2 + ' (өнгө бүрд нэг). ' + rp,
      'Эхний хөзөр ' + name + ' байх магадлал $' + f(4, N) + '$, ' + (rep ? 'хоёр дахь нь ' + nm2 + ' байх магадлал $' + f(4, N) + '$'
        : 'дараа нь үлдсэн $' + N1 + '$ хөзрийн $4$ нь ' + nm2 + ' тул $' + f(4, N1) + '$') + '. Үржүүлэх дүрмээр $$P=' + f(4, N) + '\\cdot ' + f(4, M) + '=' + R(16, D) + '.$$'];
  })();
  return {
    q: N + ' модтой хөзрөөс нэг хөзөр сугалж, буцааж ' + (rep ? 'хийгээд' : 'хийлгүйгээр') + ' дахин нэг хөзөр сугалав. ' + txt + ' магадлалыг олоорой.',
    a: '$P=' + fr(num, D) + '$',
    wk: 24,
    s: ss,
    t: { N: N, rep: rep, ev: ev, ci: ci }
  };
}

// 3. OAB гурвалжин, OA дээр OC:CA = m:n ⇒ OC⃗ = m/(m+n)·a⃗;  AB дээр AD:DB = p:q (голдуу дундаж цэг) ⇒
//    OD⃗ = OA⃗ + p/(p+q)·AB⃗ = q/(p+q)·a⃗ + p/(p+q)·b⃗;  CD⃗ = OD⃗ − OC⃗ = (q/(p+q) − m/(m+n))·a⃗ + p/(p+q)·b⃗.
//    a⃗-ийн коэффициент 0 (CD ∥ OB) бол алгасна. Зураг эх шиг: O→A, O→B, C→D сум, 5 цэг, a⃗, b⃗ шошго (хариу бичихгүй).
var p3_CR = [[1, 2], [2, 1], [1, 3], [3, 1], [2, 3], [3, 2], [1, 4], [4, 1], [3, 4], [4, 3]];
var p3_DR = [[1, 1], [1, 1], [1, 1], [1, 2], [2, 1], [1, 3], [3, 1], [2, 3], [3, 2]];
function p3_vl(f, P, Q, u, ch, off) {   // P→Q хэрчмийн u хэсгийн цэгээс (дэлгэцийн) зүүн нормалын дагуу off px зайд налуу үсэг + дээр нь жижиг сум
  f.raw(function (T) {
    var x1 = T.X(P[0]), y1 = T.Y(P[1]), x2 = T.X(Q[0]), y2 = T.Y(Q[1]), L = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
    var nx = (y2 - y1) / L, ny = -(x2 - x1) / L;
    var x = x1 + (x2 - x1) * u + nx * off, y = y1 + (y2 - y1) * u + ny * off + 5;
    var ay = y - (ch === 'b' ? 14.5 : 11), x0 = x - 4.5, xe = x + 5.5;
    return '<text x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" font-size="15" font-family="\'KaTeX_Main\',\'Times New Roman\',serif" font-style="italic" text-anchor="middle" fill="#1b1b1b">' + ch + '</text>'
      + '<line x1="' + x0.toFixed(2) + '" y1="' + ay.toFixed(2) + '" x2="' + (xe - 2).toFixed(2) + '" y2="' + ay.toFixed(2) + '" stroke="#1b1b1b" stroke-width="1"/>'
      + '<polygon points="' + xe.toFixed(2) + ',' + ay.toFixed(2) + ' ' + (xe - 3.6).toFixed(2) + ',' + (ay - 2).toFixed(2) + ' ' + (xe - 3.6).toFixed(2) + ',' + (ay + 2).toFixed(2) + '" fill="#1b1b1b"/>';
  });
}
function p3() {
  var cr = pick(p3_CR), dr = pick(p3_DR), m = cr[0], n = cr[1], p = dr[0], q = dr[1];
  var an = q * (m + n) - m * (p + q), ad = (p + q) * (m + n);   // a⃗-ийн коэффициент an/ad
  if (!an) return null;
  if (m === 1 && n === 2 && p === q) return null;                 // эх тоо тогтмол хувилбар болохгүй
  var t = m / (m + n), s = p / (p + q);
  var O = [0, 0], A = [3.3, 3.4], B = [5.8, 0];
  var C = [A[0] * t, A[1] * t], D = [A[0] + (B[0] - A[0]) * s, A[1] + (B[1] - A[1]) * s];
  var f = Fig({ w: 220, pad: 14 });
  f.seg(A, B, { w: 1.4 })
    .arrow(O, A, { w: 1.5, h: 8 }).arrow(O, B, { w: 1.5, h: 8 }).arrow(C, D, { w: 1.5, h: 8 });
  [O, A, B, C, D].forEach(function (P) { f.dot(P, { r: 2.3 }); });
  f.text(O, 'O', { pos: 'sw', size: 14 }).text(A, 'A', { pos: 'n', size: 14 }).text(B, 'B', { pos: 'se', size: 14 })
    .text(C, 'C', { pos: 'nw', size: 14 }).text(D, 'D', { pos: 'e', size: 14 });
  p3_vl(f, O, A, t >= 0.5 ? t / 2 : (1 + t) / 2, 'a', 13);       // a⃗ шошго OA-ийн урт хэсгийн дунд (C-ээс хол)
  p3_vl(f, O, B, 0.5, 'b', -16);
  f.ext([-0.45, -0.75]).ext([6.3, 3.85]);
  var dtxt = p === q ? '$D$ цэг нь $AB$ талын дундаж цэг бөгөөд ' : '$AB$ тал дээр $AD:DB=' + p + ':' + q + '$ байх $D$ цэг авав. ';
  // Бодолт: OC⃗ = m/(m+n)·a⃗;  AD⃗ = p/(p+q)·AB⃗, AB⃗ = b⃗ − a⃗ → OD⃗ = OA⃗ + AD⃗;  CD⃗ = OD⃗ − OC⃗, a⃗-ийн коэффициентийг ерөнхий хуваарьт
  var kC = fr(m, m + n), kA = fr(q, p + q), kB = fr(p, p + q), Ld = lcm(p + q, m + n);
  var V = function (P, Q) { return '\\overrightarrow{' + P + Q + '}'; };
  return {
    q: '$OAB$ гурвалжны $OA$ тал дээр $OC:CA=' + m + ':' + n + '$ байх $C$ цэг' + (p === q ? ' авав. ' : ', ') + dtxt
      + '$\\overrightarrow{OA}=\\vec a$, $\\overrightarrow{OB}=\\vec b$ бол $\\overrightarrow{CD}$ векторыг $\\vec a$ ба $\\vec b$ векторуудаар илэрхийлээрэй.',
    a: '$\\overrightarrow{CD}=' + fr(an, ad) + '\\vec a+' + fr(p, p + q) + '\\vec b$',
    fig: f.svg(), side: true, wk: 30,
    s: [
      '$OC:CA=' + m + ':' + n + '$ тул $OC=' + kC + 'OA$ ба $' + V('O', 'C') + '$, $\\vec a$ ижил чиглэлтэй: $$' + V('O', 'C') + '=' + kC + '\\vec a.$$',
      (p === q ? '$D$ нь $AB$ талын дундаж цэг тул' : '$AD:DB=' + p + ':' + q + '$ тул') + ' $AD=' + kB + 'AB$. Энд $' + V('A', 'B') + '=\\vec b-\\vec a$ тул гурвалжны дүрмээр '
        + '$$' + V('O', 'D') + '=' + V('O', 'A') + '+' + V('A', 'D') + '=\\vec a+' + kB + '(\\vec b-\\vec a)$$ $$=' + kA + '\\vec a+' + kB + '\\vec b.$$',
      'Иймд $$' + V('C', 'D') + '=' + V('O', 'D') + '-' + V('O', 'C') + '=\\left(' + kA + '-' + kC + '\\right)\\vec a+' + kB + '\\vec b.$$',
      '$\\vec a$ векторын коэффициентийг ерөнхий хуваарьт оруулж бодъё: $$' + kA + '-' + kC + '=\\dfrac{' + q * Ld / (p + q) + '-' + m * Ld / (m + n) + '}{' + Ld + '}=' + fr(an, ad)
        + '.$$ Эндээс $$' + V('C', 'D') + '=' + fr(an, ad) + '\\vec a+' + kB + '\\vec b.$$'
    ],
    t: { m: m, n: n, p: p, q: q }
  };
}

// 4. n тамирчны нас x: σ² = Σx²/n − x̄²  ⇒  Σx² = n(σ² + x̄²).  x̄, σ бүхэл (бодит нас: x̄ 15–32, σ ≤ x̄/4).
//    Голдуу Σx² ба σ өгч дундаж насыг (x̄ = √(Σx²/n − σ²)), заримдаа Σx² ба x̄ өгч стандарт хазайлтыг асууна.
function p4() {
  var n = pick([4, 5, 5, 5, 6, 8, 10]), mu = rnd(15, 32), sg = rnd(1, 6), ask = rnd(1, 10) <= 7 ? 'm' : 's';
  if (sg * 4 > mu) return null;
  var S2 = n * (sg * sg + mu * mu);
  if (n === 5 && mu === 16 && sg === 3) return null;   // эх тоо тогтмол хувилбар болохгүй
  var cond = ask === 'm' ? 'стандарт хазайлт нь ' + sg + ' бол тэдгээрийн дундаж насыг олоорой.'
    : 'дундаж нас нь ' + mu + ' бол тэдний насны стандарт хазайлтыг олоорой.';
  // Бодолт: σ² = Σx²/n − x̄² томьёонд өгөгдлийг орлуулж үл мэдэгдэгчийн квадратыг олно → эерэг язгуур
  var Sn = S2 / n;
  return {
    q: 'Нэгэн багийн ' + n + ' тамирчнаас судалгаа авчээ. Тэдний насны тоог $x$-ээр тэмдэглэе. Хэрэв $\\sum x^2=' + S2 + '$, ' + cond,
    a: ask === 'm' ? '$\\overline{x}=' + mu + '$' : '$\\sigma=' + sg + '$',

var p8_S = [[1, 5, 1], [2, 5, 1], [1, 2, 1], [3, 5, 1], [4, 5, 1], [6, 5, 1], [7, 5, 1], [3, 10, 1], [7, 10, 1], [11, 10, 1], [13, 10, 1],
  [1, 2, 0], [1, 3, 0], [2, 3, 0], [1, 4, 0], [3, 4, 0], [4, 3, 0], [5, 4, 0], [6, 5, 0], [7, 5, 0], [3, 5, 0], [4, 5, 0], [5, 6, 0], [7, 6, 0]];
var p8_X = { S6: '\\sin^6\\alpha+\\cos^6\\alpha', S4: '\\sin^4\\alpha+\\cos^4\\alpha', TC: '\\operatorname{tg}\\alpha+\\operatorname{ctg}\\alpha',
  T2: '\\operatorname{tg}^2\\alpha+\\operatorname{ctg}^2\\alpha', P: '\\sin\\alpha\\cdot\\cos\\alpha', S3: '\\sin^3\\alpha+\\cos^3\\alpha', D3: '\\sin^3\\alpha-\\cos^3\\alpha' };
function p8_r(n, d) { if (d < 0) { n = -n; d = -d; } var g = gcd(n, d); return [n / g, d / g]; }
function p8_add(a, b) { return p8_r(a[0] * b[1] + b[0] * a[1], a[1] * b[1]); }
function p8_mul(a, b) { return p8_r(a[0] * b[0], a[1] * b[1]); }
function p8() {
  var G = pick(['p', 'p', 'p', 'p', 's', 's', 'd']), v = pick(G === 'p' ? p8_T : p8_S), neg = rnd(0, 1) === 1;

  else if (tgt === 'S4') ans = p8_add(one, p8_mul([-2, 1], tt));

  //   a² + b² = 1 − 2ab, a³ + b³ = 1 − 3ab;  tg + ctg = 1/(sin cos), tg² + ctg² = (tg + ctg)² − 2;  кубуудын нийлбэр/ялгавар

  var SC = '\\sin\\alpha\\cos\\alpha', TC = p8_X.TC, ss = [], it = t[0] ? p8_r(t[1], t[0]) : null;

    ss.push('Нөхцлийн хоёр талыг квадрат зэрэгт дэвшүүлье ($\\sin^2\\alpha+\\cos^2\\alpha=1$): $$(' + lhs + ')^2=1' + (pl ? '+' : '-') + '2' + SC + '=' + Vq(x) + '^2=' + V(xx) + '.$$');
    ss.push('Эндээс $$2' + SC + '=' + (pl ? V(xx) + '-1' : '1-' + V(xx)) + '=' + V(t2) + '\\ \\Rightarrow\\ ' + SC + '=' + V(t) + '.$$');
  }
  if (tgt === 'S6' || tgt === 'S4') {
    var k6 = tgt === 'S6' ? 3 : 2;
    ss.push('$a=\\sin^2\\alpha$, $b=\\cos^2\\alpha$ гэвэл $a+b=1$, $ab=(' + SC + ')^2$. ' + (k6 === 3 ? 'Кубуудын нийлбэрийн $a^3+b^3=(a+b)^3-3ab(a+b)$' : '$a^2+b^2=(a+b)^2-2ab$')
      + ' томьёогоор $$' + p8_X[tgt] + '=1-' + k6 + '(' + SC + ')^2.$$');
    ss.push('Иймд $$' + p8_X[tgt] + '=1-' + k6 + '\\cdot ' + Vq(t) + '^2=1-' + V(p8_mul([k6, 1], tt)) + '=' + V(ans) + '.$$');

    if (tgt === 'TC') ss.push('Иймд $$' + TC + '=' + inv(t) + '=' + V(it) + '.$$');
    else {
      ss.push('$\\operatorname{tg}\\alpha\\cdot\\operatorname{ctg}\\alpha=1$ тул $$' + p8_X.T2 + '=(' + TC + ')^2-2.$$');
      ss.push('Иймд $$' + TC + '=' + inv(t) + '=' + V(it) + ',$$ $$' + p8_X.T2 + '=' + Vq(it) + '^2-2=' + V(p8_mul(it, it)) + '-2=' + V(ans) + '.$$');

    q: '$' + lhs + '=' + show(x, v[2]) + '$ бол $' + p8_X[tgt] + '=?$',
    a: '$' + p8_X[tgt] + '=' + show(ans, v[2]) + '$',

}

// 9. x = a·cos α + p, y = b·sin α + q (заримдаа sin ↔ cos солих) ⇒ cos²α + sin²α = 1 ⇒ (x − p)²/a² + (y − q)²/b² = 1 (эллипс);
//    a = b бол тойрог (x − p)² + (y − q)² = a².
function p9() {
  var a = rnd(2, 7), b = rnd(2, 7), sh = rnd(1, 10) <= 4, p = sh ? rnd(-4, 4) : 0, q = sh ? rnd(-4, 4) : 0, sw = rnd(1, 5) === 1;
  if (a === b && rnd(0, 2)) return null;                            // тойрог хааяа

  return {
    q: '$x=' + a + fx + (p ? sgn(p) : '') + '$, $y=' + b + fy + (q ? sgn(q) : '') + '$ бол $x;\\,y$-ын хамаарлыг ол.',
    a: '$' + ans + '$',
    wk: 20,
    s: [
      'Өгөгдсөн тэнцэтгэлүүдээс тригонометрийн функцүүдийг илэрхийлье: $$' + fx + '=' + cx + ',\\qquad ' + fy + '=' + cy + '.$$',

// 10. Хурц θ-ийн sin θ ≈ s (эсвэл cos θ ≈ c, 2 оронтой ЗӨВ тоймлосон) өгнө ⇒ нөгөө нь √(1 − s²) ⇒ tg = s/√(1 − s²), ctg = √(1 − s²)/s.

//     тоймлолттой ижил байх θ-г л сонгоно (тооцоолуураар шалгасан сурагч ч мөн адил хариу авна). Аравтын таслалыг цэгээр.
var p10_N = { s: '\\sin', c: '\\cos', t: '\\operatorname{tg}', k: '\\operatorname{ctg}' };
function p10() {
  var th = rnd(15, 75), ty = pick(['st', 'st', 'st', 'st', 'sk', 'sk', 'ct', 'ct', 'ck', 'sc', 'cs']), gv = ty[0], av = ty[1];

  var x = tv[gv] * 100, gx = Math.round(x);

  var G = gx / 100, O = Math.sqrt(1 - G * G), s = gv === 's' ? G : O, c = gv === 's' ? O : G;

    t: { th: th, ty: ty }

}

// 11. (a·sin x + b·cos x)/(c·sin x + d·cos x) = p/q ⇒ q(a·sin x + b·cos x) = p(c·sin x + d·cos x) ⇒ (qa − pc)·sin x = (pd − qb)·cos x
//     ⇒ tg x = (pd − qb)/(qa − pc), ctg x = урвуу. Нөхцөл: ad ≠ bc, qa ≠ pc (cos x = 0 шийд биш), pd ≠ qb, хуваарь ≠ 0 (c·tg x + d ≠ 0).
var p11_PQ = [[1, 3], [1, 2], [2, 1], [3, 1], [2, 3], [3, 2], [1, 4], [3, 4], [4, 3], [2, 5], [5, 2], [3, 5], [4, 1], [-1, 1], [-1, 2], [-2, 1], [-1, 3], [-3, 2]];
function p11() {
  var a = rnd(1, 5), b = rnd(1, 10) <= 2 ? -rnd(1, 4) : rnd(1, 7), c = rnd(1, 5), d = rnd(1, 10) <= 2 ? -rnd(1, 4) : rnd(1, 7), pq = pick(p11_PQ), p = pq[0], q = pq[1];
  if (a * d === b * c) return null;
  var N = p * d - q * b, D = q * a - p * c;
  if (!N || !D) return null;
  if (c * N + d * D === 0) return null;                               // хуваарь 0 (0/0)
  var g = gcd(N, D); N /= g; D /= g;
  if (D < 0) { N = -N; D = -D; }
  if (Math.abs(N) > 20 || D > 20) return null;
  var ask = rnd(0, 1) ? 'ctg' : 'tg';
  if (a === 2 && b === 1 && c === 2 && d === 6 && p === 1 && q === 3) return null;   // эх тоо тогтмол хувилбар болохгүй
  var val = ask === 'tg' ? fr(N, D) : fr(D, N);
  // Бодолт: пропорцын чанараар хөндлөн үржүүлж sin x, cos x-тэй гишүүдийг цуглуулна: (qa − pc)·sin x = (pd − qb)·cos x;
  //   cos x ≠ 0 (sin x ≠ 0) тул хуваана → tg x (ctg x). Хуваарь автоматаар ≠ 0 (ad ≠ bc).
  var Nr = p * d - q * b, Dr = q * a - p * c;
  var NUM = tm(a, '\\sin x', true) + tm(b, '\\cos x'), DEN = tm(c, '\\sin x', true) + tm(d, '\\cos x');
  var LH = q === 1 ? NUM : q + '(' + NUM + ')', RH = p === 1 ? DEN : p === -1 ? '-(' + DEN + ')' : p + '(' + DEN + ')';
  var sol = [
    'Пропорцын үндсэн чанараар (хөндлөн үржүүлбэл): $$' + LH + '=' + RH + '.$$',
    'Хаалтыг задалж, $\\sin x$ ба $\\cos x$-тэй гишүүдийг тус тусад нь цуглуулъя: $$' + tm(q * a, '\\sin x', true) + tm(q * b, '\\cos x') + '='
      + tm(p * c, '\\sin x', true) + tm(p * d, '\\cos x') + '$$ $$\\Rightarrow\\ ' + tm(Dr, '\\sin x', true) + '=' + tm(Nr, '\\cos x', true) + '.$$',
    ask === 'tg'
      ? '$\\cos x\\ne 0$ (эс бөгөөс $\\sin x=0$ болж $\\sin^2x+\\cos^2x=1$ зөрчигдөнө). Хоёр талыг $' + tm(Dr, '\\cos x', true) + '$-д хуваавал $$\\operatorname{tg}x=' + p11_fq(Nr, Dr) + '.$$'
      : '$\\sin x\\ne 0$ (эс бөгөөс $\\cos x=0$ болж $\\sin^2x+\\cos^2x=1$ зөрчигдөнө). Хоёр талыг $' + tm(Nr, '\\sin x', true) + '$-д хуваавал $$\\operatorname{ctg}x=' + p11_fq(Dr, Nr) + '.$$'
  ];
  return {
    q: '$\\dfrac{' + tm(a, '\\sin x', true) + tm(b, '\\cos x') + '}{' + tm(c, '\\sin x', true) + tm(d, '\\cos x') + '}=' + fr(p, q) + '$ бол $\\operatorname{' + ask + '}x=?$',
    a: '$\\operatorname{' + ask + '}x=' + val + '$',
    wk: 22,
    s: sol,
    t: { a: a, b: b, c: c, d: d, p: p, q: q }
  };
}
// n/d → TeX: хураахаас өмнөх хэлбэр (тэмдэг урд) ба хураасан нь: -\dfrac{4}{6}=-\dfrac{2}{3};  хураах шаардлагагүй бол ганц
function p11_fq(n, d) {
  var s = (n < 0) !== (d < 0) ? '-' : '', A = Math.abs(n), B = Math.abs(d), raw = B === 1 ? s + A : s + '\\dfrac{' + A + '}{' + B + '}', red = fr(n, d);
  return raw === red ? red : raw + '=' + red;

// 12. sin, cos-ийн нэгийг ба мөчийг өгнө ⇒ нөгөөг нь sin²+cos² = 1 ба мөчийн тэмдгээр олно (Пифагорын гурвал: 3-4-5, 5-12-13, 8-15-17,
//     7-24-25; язгууртай 1-2√2-3, 2-√5-3, 1-√3-2, 1-√15-4, 3-√7-4, 1-2√6-5). sin(α ± β) = sin α cos β ± cos α sin β,
//     cos(α ± β) = cos α cos β ∓ sin α sin β. Хоёулаа рационал, эсвэл ижил язгууртай (хариу рационал/c√r), эсвэл холимог ((A + B√r)/D).

// 18. u = px, v = q (ЕХБ(p, q) = 1):  (u² − uv + v²)(u² − v²) / (u³ + v³) = u − v,   (u² + uv + v²)(u² − v²) / (u³ − v³) = u + v

function p18_asc(cs) {   // [c₀, c₁, c₂, …] → сул гишүүнээс эхлэн бичнэ (ж: 1-4x^{2})

}
function p18() {

  var s = (rN ? -1 : 1) * (rD ? -1 : 1), A = s * p, B = s * (sum ? -q : q);   // хариу Ax + B

  // Бодолт: u = px, v = q. Квадратуудын ялгавар u² − v² = (u − v)(u + v); кубуудын нийлбэр/ялгавар u³ ± v³ = (u ± v)(u² ∓ uv + v²)
  //   (v² − u², v³ − u³ үед (v − u) хүчин зүйлтэй); ижил хүчин зүйлүүдийг хураана, v − u = −(u − v).

    'Кубуудын ' + (sum ? 'нийлбэрийн $a^3+b^3=(a+b)(a^2-ab+b^2)$' : 'ялгаврын $a^3-b^3=(a-b)(a^2+ab+b^2)$') + ' томьёогоор: $$' + D + '=(' + Fd + ')(' + N1 + ').$$',
    (!sum && rN !== rD ? '$' + vmu + '=-(' + umv + ')$ тул ижил' : 'Ижил') + ' хүчин зүйлүүдийг хураавал $$\\dfrac{(' + Fn + ')(' + upv + ')(' + N1 + ')}{(' + Fd + ')(' + N1 + ')}='
      + res + (res === ans ? '' : '=' + ans) + '.$$'
  ];
  return {
    q: '$\\dfrac{' + num + '}{' + D + '}$ бутархайг хураагаарай.',
    a: '$' + ans + '$',
    wk: 22,
    s: sol,
    t: { p: p, q: q, sum: sum, rN: rN, rD: rD }

// 19. (p√a ± q√b)²·(√(p²a) ∓ √(q²b))² = ((p√a + q√b)(p√a − q√b))² = (p²a − q²b)²: хоёр дахь хүчин зүйлийн язгуурыг
//     хялбарчлаагүйгээр (√(p²a)) бичнэ. a ≠ b — квадрат хүчин зүйлгүй, |p²a − q²b| ≤ 12; гишүүдийн/хүчин зүйлийн дараалал холимог.

  var u = rt(p, a), v = rt(q, b), sm = [];

  return {
    q: '$' + (rnd(0, 3) === 0 ? f2 + '\\times' + f1 : f1 + '\\times' + f2) + '$ илэрхийллийг хялбарчил.',

        + '$$(' + u + '+' + v + ')^2(' + u + '-' + v + ')^2$$ $$=\\left(\\left(' + u + '\\right)^2-\\left(' + v + '\\right)^2\\right)^2.$$',
      '$\\left(' + u + '\\right)^2=' + A + '$ ба $\\left(' + v + '\\right)^2=' + B + '$ тул $$\\left(' + A + '-' + B + '\\right)^2=' + par(d) + '^2=' + d * d + '.$$'
    ],

}

// 20. Суурь солих томьёо: log_{α^e₁}β^{f₁}·log_{β^e₂}γ^{f₂}·log_{γ^e₃}α^{f₃} = (f₁f₂f₃)/(e₁e₂e₃)·log_αβ·log_βγ·log_γα = f₁f₂f₃/(e₁e₂e₃)
//     (α, β, γ — ялгаатай анхны тоо). Өмнөх коэффициент C-г хариу бүхэл байхаар (заримдаа бутархай) сонгоно;

function p20() {

  for (i = 0; i < 3; i++) {
    var X = pr[i], Y = pr[(i + 1) % 3], e = rnd(1, 4), f = rnd(1, 4), Xe = Math.pow(X, e), Yf = Math.pow(Y, f);
    if (Xe > p20_MX[X] || Yf > p20_MX[Y]) return null;

  var C = fd === 1 ? pick([1, 1, 2, 3]) : rnd(0, 4) === 0 ? 1 : fd * pick([1, 1, 2]);
  if (C > 12) return null;
  var vn = C * fn, vd = fd; g = gcd(vn, vd); vn /= g; vd /= g;
  if (vn / vd > 40 || (vd === 1 && vn === 1 && rnd(0, 1))) return null;
  if (rnd(0, 3) === 0) L = shuffle(L);
  // Бодолт: log_{X^e}Y^f = (f/e)·log_X Y (зэргийн чанар); log_α β·log_β γ·log_γ α = 1 (суурь солих томьёо) ⇒ утга = C·Π(f/e)
  var pp = function (N) { for (var b0 = 2; b0 <= 7; b0++) { var e0 = 0, m0 = N; while (m0 % b0 === 0) { m0 /= b0; e0++; } if (m0 === 1 && e0) return [b0, e0]; } return null; };
  var pw = function (b0, e0) { return e0 === 1 ? String(b0) : b0 + '^' + e0; }, cf = function (s0) { return s0 === '1' ? '' : s0; };
  var lines = [], cl = C > 1 ? [String(C)] : [];

    var raw = e0 === 1 ? String(f0) : '\\dfrac{' + f0 + '}{' + e0 + '}', red = fr(f0, e0);

      + '=\\dfrac{\\lg ' + B0 + '}{\\lg ' + A0 + '}\\cdot\\dfrac{\\lg ' + G0 + '}{\\lg ' + B0 + '}\\cdot\\dfrac{\\lg ' + A0 + '}{\\lg ' + G0 + '}=1.$$',
    'Логарифмуудын үржвэр $1$ тул илэрхийллийн утга нь коэффициентүүдийн үржвэртэй тэнцүү: $$' + cl.join('\\cdot ') + '=' + val + '.$$'
  ];
  return {

// 21. f(x) = a^x: f(x₀) = k·f(m) ⇔ a^{x₀} = k·a^m ⇔ x₀ = m + log_a k.  k = a^j·r (r нь a-д хуваагдахгүй) гэвэл
//     x₀ = (m + j) + log_a r (r = 1 бол бүхэл);  s = m + j > 0 бол мөн x₀ = log_a(a^s·r), s < 0 бол log_a(r/a^{|s|}).

  else if (s === 0) x0 = L + r;

  var P = function (e) { return e === 1 ? String(a) : a + '^{' + e + '}'; }, last = x0.split('=').pop(), shown;
  var sol = ['$f(x_0)=' + a + '^{x_0}$, $f(' + m + ')=' + P(m) + '$ тул $$' + a + '^{x_0}=' + k + '\\cdot ' + P(m) + '.$$'];
  if (r === 1) {

  } else {

      + L + k + sgn(m) + '.$$' : 'Логарифмын тодорхойлолтоор $$x_0=' + L + k + '.$$');

    sv = 'Квадрат тэгшитгэлийг бодъё: $$D=' + par(K[1]) + '^2-4\\cdot ' + K[0] + '\\cdot ' + par(K[2]) + '=' + D + ',$$ $$t_1=\\dfrac{' + (-K[1]) + '-' + r + '}{' + 2 * K[0] + '}=' + fr(-K[1] - r, 2 * K[0])
      + ',\\quad t_2=\\dfrac{' + (-K[1]) + '+' + r + '}{' + 2 * K[0] + '}=' + fr(-K[1] + r, 2 * K[0]) + '.$$';
  }
  var lines = ts.map(function (t) {
    var v = p25_xs(t, I);
    return '$\\operatorname{tg}x=' + fr(t[0], t[1]) + '$: ' + (v.length ? v.map(function (x) { return '$x=' + x + '$'; }).join(', ') : 'завсарт шийдгүй');
  });
  return [
    'Үндсэн адилтгалаар $' + dT + '=' + (d === 1 ? '\\sin^2x+\\cos^2x' : dT + '(\\sin^2x+\\cos^2x)') + '$. Үүнийг орлуулж бүх гишүүнийг нэг тал руу шилжүүлбэл нэгэн төрлийн тэгшитгэл гарна: $$' + hom + '.$$',
    '$\\cos x=0$ бол $\\sin^2x=1$ ба зүүн тал $' + dec(cs[0]) + '\\ne 0$ болох тул $\\cos x\\ne 0$. Хоёр талыг $\\cos^2x$-д хувааж $t=\\operatorname{tg}x$ гэвэл $$' + qd + (qi !== qd ? '\\ \\Rightarrow\\ ' + qi : '') + '.$$',
    sv + ' Иймд $\\operatorname{tg}x=' + fr(ts[0][0], ts[0][1]) + '$ эсвэл $\\operatorname{tg}x=' + fr(ts[1][0], ts[1][1]) + '$.',
    '$\\operatorname{tg}x=a$ тэгшитгэлийн шийд $x=\\operatorname{arctg}a+\\pi k$ $(k\\in\\mathbb{Z})$. Энд $a\\gt 0$ бол $0\\lt\\operatorname{arctg}a\\lt\\dfrac{\\pi}{2}$, мөн $\\operatorname{arctg}(-a)=-\\operatorname{arctg}a$.',
    '$' + IT + '$ завсарт орох шийдүүд:<br>' + lines.join('<br>') + '<br>Иймд тэгшитгэл энэ завсарт ' + (cnt ? '$' + cnt + '$ шийдтэй.' : 'шийдгүй, өөрөөр хэлбэл шийдийн тоо $0$.')

}
function p25() {
  var t1 = pick(p25_T), t2 = pick(p25_T);
  if (t1[0] * t2[1] === t2[0] * t1[1]) return null;
  var Sn = t1[0] * t2[1] + t2[0] * t1[1], Pn = t1[0] * t2[0], Dd = t1[1] * t2[1];   // t₁ + t₂ = Sn/Dd, t₁t₂ = Pn/Dd
  var F2 = rnd(0, 3) === 0, cands = [], L, a, b, d10;
  if (!Sn) return null;                                               // b ≠ 0
  for (L = -50; L <= 50; L++) {                                       // λ = L/10
    if (!L) continue;
    if (!F2) {                                                        // d = λ, b = λ(t₁ + t₂), a = λ(1 − t₁t₂)
      if (L < 0 || (L * Sn) % (10 * Dd) || (L * (Dd - Pn)) % (10 * Dd)) continue;
      b = L * Sn / (10 * Dd); a = L * (Dd - Pn) / (10 * Dd); d10 = L;
    } else {                                                          // a − d = λ, b = −λ(t₁ + t₂), d = −λt₁t₂
      if ((L * Sn) % (10 * Dd) || (L * Pn) % Dd) continue;

  [t1, t2].forEach(function (t) {
    var k, u0 = 2 * Math.atan(t[0] / t[1]) / Math.PI;                  // arctg t, π/2-ийн нэгжээр
    for (k = -4; k <= 4; k++) {

  var ts = [t1, t2].sort(function (u, v) { return u[0] / u[1] - v[0] / v[1]; });
  var lhs = F2 ? tm(a, '\\sin^2x', true) + tm(b, '\\sin x\\cdot\\cos x') : tm(a, '\\cos^2x', true) + tm(b, '\\cos x\\cdot\\sin x');
  return {
    q: '$' + lhs + '=' + dec(d10 / 10) + '$ тэгшитгэл $\\left[' + p25_pi(I[0]) + ';\\ ' + p25_pi(I[1]) + '\\right]$ завсарт хэдэн шийдтэй вэ?',
    a: '$' + cnt + '$ $\\left(\\operatorname{tg}x=' + fr(ts[0][0], ts[0][1]) + ';\\ ' + fr(ts[1][0], ts[1][1]) + '\\right)$',
    wk: 30,
    s: p25_sol(a, b, d10, F2, I, ts, cnt),
    t: { a: a, b: b, d: d10 / 10, F2: F2, I: I, t: ts }

}

// 26. Биссектрисын чанар: BN : NC = AB : AC.  BN = α₁x + β₁, NC = α₂x + β₂ ⇒ AC(α₁x + β₁) = AB(α₂x + β₂) ⇒ x (хураасан бутархай).
//     Шалгана: x > 0, BN > 0, NC > 0, гурвалжны тэнцэтгэл биш |AB − AC| < BC < AB + AC.
//     Зураг: ерөнхий хэлбэр (масштабгүй) — AB : AC-г ойролцоогоор, A өнцгийг санамсаргүй авч N-ийг зурсан гурвалжны биссектрисын
//     суурь болгоно (BC-ийн урт x-ийг илчлэхгүй); тоо, x бичихгүй.
function p26_fig(c, b) {
  var M = Math, rho = M.max(0.7, M.min(1.55, c / b)), al = rnd(38, 56) * M.PI / 180, be = rnd(0, 8) * M.PI / 180;
  var A = [0, 0], C = [3 * M.cos(be), -3 * M.sin(be)], B = [3 * rho * M.cos(al - be), 3 * rho * M.sin(al - be)];
  var lb = 3, lc = 3 * rho, N = [(lb * B[0] + lc * C[0]) / (lb + lc), (lb * B[1] + lc * C[1]) / (lb + lc)];
  var G = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3], f = Fig({ w: 200, h: 165, pad: 18 });
  var dir = function (P, O) { return M.atan2(P[1] - O[1], P[0] - O[0]) * 180 / M.PI; };
  f.poly([A, B, C], { w: 1.5 }).seg(A, N, { w: 1.3 });
  f.text(A, 'A', { pos: dir(A, G), size: 14 }).text(B, 'B', { pos: dir(B, G), size: 14 }).text(C, 'C', { pos: dir(C, G), size: 14 })
    .text(N, 'N', { pos: dir(N, A), size: 14 });
  return f.svg();
}
function p26() {
  var c = rnd(3, 12), b = rnd(3, 12);                                 // AB = c, AC = b
  if (b === c) return null;
  var a1 = pick([1, 1, 1, 1, 2, 2, 3]), a2 = pick([1, 1, 1, 1, 2, 3]), b1 = rnd(-3, 5), b2 = rnd(-3, 5);
  if (a1 === a2 && b1 === b2) return null;
  if (a1 > 1 && a2 > 1) return null;
  if (b1 && b2 && (a1 > 1 || a2 > 1) && rnd(0, 1)) return null;
  if (!b1 && !b2) return null;
  var den = b * a1 - c * a2, num = c * b2 - b * b1;                  // x = num/den
  if (!den) return null;
  var g = gcd(num, den); if (den < 0) { num = -num; den = -den; }
  num /= g; den /= g;
  if (num <= 0 || den > 9) return null;
  var x = num / den, BN = a1 * x + b1, NC = a2 * x + b2, BC = BN + NC;
  if (BN <= 0 || NC <= 0 || BC >= b + c || BC <= Math.abs(b - c)) return null;
  if (Math.min(BN, NC) < 0.5) return null;
  var nw = function (s) { return '<span class="nw">' + s + '</span>'; };   // томьёо мөр хооронд тасрахгүй
  // Бодолт: биссектрисын чанар BN : NC = AB : AC → хөндлөн үржүүлж шугаман тэгшитгэл → шалгалт
  var BNt = poly([a1, b1]), NCt = poly([a2, b2]), rD = b * a1 - c * a2, rN = c * b2 - b * b1, K = Math.abs(rD), M = rD < 0 ? -rN : rN;
  var side = function (k, al, be) { return be ? k + '(' + poly([al, be]) + ')' : k + (al === 1 ? '' : '\\cdot ' + al) + 'x'; };
  var BNv = a1 * num + b1 * den, NCv = a2 * num + b2 * den;                  // BN, NC (den-д хуваахаас өмнө)
  var r1 = den === 1 ? '\\dfrac{' + BNv + '}{' + NCv + '}' : fr(BNv, den) + ':' + fr(NCv, den), r2 = fr(BNv, NCv);
  var sol = [
    '$AN$ биссектрис тул биссектрисын чанараар $$\\dfrac{BN}{NC}=\\dfrac{AB}{AC}\\ \\Rightarrow\\ \\dfrac{' + BNt + '}{' + NCt + '}=\\dfrac{' + c + '}{' + b + '}.$$',
    'Пропорцийн хөндлөн үржвэрүүд тэнцүү: $$' + side(b, a1, b1) + '=' + side(c, a2, b2) + '\\ \\Rightarrow\\ ' + poly([b * a1, b * b1]) + '=' + poly([c * a2, c * b2]) + '$$ $$\\Rightarrow\\ '
      + tm(K, 'x', true) + '=' + M + (K === 1 ? '' : '\\ \\Rightarrow\\ x=' + fr(num, den)) + '.$$',
    'Шалгалт: $BN=' + fr(BNv, den) + '$, $NC=' + fr(NCv, den) + '$ (хоёулаа эерэг) ба $$\\dfrac{BN}{NC}=' + r1 + (r1 === r2 ? '' : '=' + r2) + '=\\dfrac{AB}{AC}.$$ Иймд $x=' + fr(num, den) + '$.'
  ];
  return {
    q: '$ABC$ гурвалжны $AN$ нь биссектрис, ' + nw('$AB=' + c + '$,') + ' ' + nw('$AC=' + b + '$,') + ' ' + nw('$BN=' + poly([a1, b1]) + '$,') + ' '
      + nw('$NC=' + poly([a2, b2]) + '$') + ' бол $x=?$',
    a: '$x=' + fr(num, den) + '$',
    fig: p26_fig(c, b),
    side: true,
    wk: 24,
    s: sol,
    t: { c: c, b: b, a1: a1, b1: b1, a2: a2, b2: b2 }
  };
}

// 27. Виетийн теорем: ax² + bx + c = 0 (D = b² − 4ac > 0) ⇒ x₁ + x₂ = −b/a, x₁x₂ = c/a.  Тэгш хэмт илэрхийллийг эдгээрээр:
//     x₁x₂ ± (x₁ + x₂), x₁² + x₂² = (x₁ + x₂)² − 2x₁x₂, 1/x₁ + 1/x₂, x₁²x₂ + x₁x₂², x₁/x₂ + x₂/x₁, (x₁ − x₂)², (x₁ + 1)(x₂ + 1),
//     x₁³ + x₂³ = (x₁ + x₂)³ − 3x₁x₂(x₁ + x₂).  Хариу хураасан бутархай.
var p27_E = [
  // [TeX, (a, b, c) → [хүртвэр, хуваарь]]
  ['x_1x_2+x_1+x_2', function (a, b, c) { return [c - b, a]; }],
  ['x_1x_2+x_1+x_2', function (a, b, c) { return [c - b, a]; }],
  ['x_1x_2-x_1-x_2', function (a, b, c) { return [c + b, a]; }],
  ['x_1^2+x_2^2', function (a, b, c) { return [b * b - 2 * a * c, a * a]; }],
  ['\\dfrac{1}{x_1}+\\dfrac{1}{x_2}', function (a, b, c) { return [-b, c]; }],
  ['x_1^2x_2+x_1x_2^2', function (a, b, c) { return [-b * c, a * a]; }],
  ['\\dfrac{x_1}{x_2}+\\dfrac{x_2}{x_1}', function (a, b, c) { return [b * b - 2 * a * c, a * c]; }],
  ['(x_1-x_2)^2', function (a, b, c) { return [b * b - 4 * a * c, a * a]; }],
  ['(x_1+1)(x_2+1)', function (a, b, c) { return [a - b + c, a]; }],
  ['x_1^3+x_2^3', function (a, b, c) { return [3 * a * b * c - b * b * b, a * a * a]; }]
];
// Бодолт: бутархайн үйлдэл [хүртвэр, хуваарь] (хуваарь > 0, хураасан)
function p27_f(n, d) { if (d < 0) { n = -n; d = -d; } var g = gcd(n, d); return [n / g, d / g]; }
function p27_add(x, y) { return p27_f(x[0] * y[1] + y[0] * x[1], x[1] * y[1]); }
function p27_mul(x, y) { return p27_f(x[0] * y[0], x[1] * y[1]); }
function p27_T(x) { return fr(x[0], x[1]); }
function p27_P(x) { return x[0] >= 0 ? p27_T(x) : x[1] > 1 ? '\\left(' + p27_T(x) + '\\right)' : '(' + x[0] + ')'; }   // сөрөг бол хаалтанд
function p27_W(x, e) { return (x[1] > 1 ? '\\left(' + p27_T(x) + '\\right)' : x[0] < 0 ? '(' + x[0] + ')' : p27_T(x)) + '^' + e; }   // зэрэг
function p27_sum(arr) { return arr.map(function (x, i) { return i && x[0] >= 0 ? '+' + p27_T(x) : p27_T(x); }).join(''); }
// Виетийн теорем → тэгш хэмт илэрхийллийг x₁ + x₂ = S, x₁x₂ = P-ээр илэрхийлж орлуулна
function p27_sol(a, b, c, key, val) {
  var S = p27_f(-b, a), P = p27_f(c, a), D = b * b - 4 * a * c, m2 = function (k, x) { return p27_mul([k, 1], x); };
  var S2 = p27_mul(S, S), id, sub, terms = null, pre = '';
  if (key === 'x_1x_2+x_1+x_2') { id = 'x_1x_2+(x_1+x_2)'; sub = p27_T(P) + '+' + p27_P(S); }
  else if (key === 'x_1x_2-x_1-x_2') { id = 'x_1x_2-(x_1+x_2)'; sub = p27_T(P) + '-' + p27_P(S); }
  else if (key === 'x_1^2+x_2^2') { id = '(x_1+x_2)^2-2x_1x_2'; sub = p27_W(S, 2) + '-2\\cdot ' + p27_P(P); terms = [S2, m2(-2, P)]; }
  else if (key === '\\dfrac{1}{x_1}+\\dfrac{1}{x_2}') { id = '\\dfrac{x_1+x_2}{x_1x_2}'; sub = p27_T(S) + ':' + p27_P(P); }
  else if (key === 'x_1^2x_2+x_1x_2^2') { id = 'x_1x_2(x_1+x_2)'; sub = p27_T(P) + '\\cdot ' + p27_P(S); }
  else if (key === '\\dfrac{x_1}{x_2}+\\dfrac{x_2}{x_1}') {
    var Q = p27_add(S2, m2(-2, P));
    pre = 'Эхлээд квадратуудын нийлбэрийг олъё: $$x_1^2+x_2^2=(x_1+x_2)^2-2x_1x_2$$ $$=' + p27_W(S, 2) + '-2\\cdot ' + p27_P(P) + '=' + p27_sum([S2, m2(-2, P)]) + '=' + p27_T(Q) + '.$$';
    id = '\\dfrac{x_1^2+x_2^2}{x_1x_2}'; sub = p27_T(Q) + ':' + p27_P(P);
  }
  else if (key === '(x_1-x_2)^2') { id = '(x_1+x_2)^2-4x_1x_2'; sub = p27_W(S, 2) + '-4\\cdot ' + p27_P(P); terms = [S2, m2(-4, P)]; }
  else if (key === '(x_1+1)(x_2+1)') { id = 'x_1x_2+(x_1+x_2)+1'; sub = p27_T(P) + '+' + p27_P(S) + '+1'; }
  else { id = '(x_1+x_2)^3-3x_1x_2(x_1+x_2)'; sub = p27_W(S, 3) + '-3\\cdot ' + p27_P(P) + '\\cdot ' + p27_P(S); terms = [p27_mul(S2, S), m2(-3, p27_mul(P, S))]; }
  return [
    'Дискриминант $$D=' + par(b) + '^2-4\\cdot ' + a + '\\cdot ' + par(c) + '=' + D + '\\gt 0$$ тул тэгшитгэл ялгаатай хоёр бодит язгууртай.',
    'Виетийн теоремоор $$x_1+x_2=-\\dfrac{b}{a}=' + p27_T(S) + ',\\qquad x_1x_2=\\dfrac{c}{a}=' + p27_T(P) + '.$$'
  ].concat(pre ? [pre, 'Иймд $$' + key + '=' + id + '$$ $$=' + sub + '=' + val + '.$$']
    : ['Илэрхийллийг $x_1+x_2$ ба $x_1x_2$-оор илэрхийлж орлуулбал $$' + key + '=' + id + '$$ $$=' + sub + (terms ? '=' + p27_sum(terms) : '') + '=' + val + '.$$']);
}
function p27() {
  var a = pick([1, 1, 2, 2, 3, 3, 4, 5]), b = nz(-12, 12), c = nz(-12, 12), E = pick(p27_E);
  if (b * b - 4 * a * c <= 0 || gcd(gcd(a, b), c) !== 1) return null;
  var v = E[1](a, b, c), n = v[0], d = v[1];
  if (d < 0) { n = -n; d = -d; }
  var g = gcd(n, d); n /= g; d /= g;
  if (Math.abs(n) > 400 || d > 64) return null;
  return {
    q: '$' + poly([a, b, c]) + '=0$ тэгшитгэлийн хувьд $' + E[0] + '$ утгыг олоорой.',
    a: '$' + E[0] + '=' + fr(n, d) + '$',
    wk: 20,
    s: p27_sol(a, b, c, E[0], fr(n, d)),
    t: { a: a, b: b, c: c }
  };
}
