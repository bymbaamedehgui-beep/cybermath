<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Гурвалжны медианы чанар · зурагтай ажлын хуудас</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--orange:#e0701a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:11mm 13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 22px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .sec{font-size:12.5px;font-weight:800;color:#5a32d6;margin:4px 0 8px;display:flex;align-items:center;gap:7px}
  .sec b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;background:var(--purple);color:#fff;font-size:11px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px 12px;margin-bottom:11px}
  .q{break-inside:avoid;page-break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:6px 7px 7px;background:linear-gradient(#fff,#fbf9ff)}
  .qh{font-weight:800;color:var(--purple);font-size:12.5px;margin-bottom:1px}
  .dfig{display:flex;justify-content:center}
  .dfig svg{width:100%;max-width:186px;height:auto}
  .xline{font-size:12px;font-weight:700;margin-top:3px}.xline .bl{display:inline-block;min-width:56px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .wgrid{display:grid;grid-template-columns:1fr;gap:8px}
  .wq{break-inside:avoid;page-break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:8px 11px;background:linear-gradient(#fff,#fbf9ff);display:flex;gap:9px}
  .wq .wn{font-weight:800;color:var(--purple);min-width:20px;font-size:13px}
  .wq .wt{font-size:12.7px}.wq .wt .ask{color:#5a32d6;font-weight:700}
  .wans{font-size:12px;font-weight:700;margin-top:5px}.wans .bl{display:inline-block;min-width:150px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:20px}
  .ans-w{margin-top:8px;font-size:12.5px;display:grid;gap:5px}.ans-w .an{color:var(--soft);font-weight:800}
  #answers{display:none}
  /* svg */
  .s-side{fill:none;stroke:#2f6cae;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .s-med{fill:none;stroke:#6b6480;stroke-width:1.1;stroke-linecap:round}
  .s-medhl{fill:none;stroke:var(--orange);stroke-width:2;stroke-linecap:round}
  .s-tick{stroke:#2f6cae;stroke-width:1.3;stroke-linecap:round}
  .s-vtx{fill:#3a2d5e}.s-o{fill:var(--orange)}
  .s-vl{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:11px;fill:#3a2d5e}
  .s-ol{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:11px;fill:var(--orange)}
  .s-len{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;font-size:10.5px;fill:#333}
  .s-x{fill:var(--orange);font-weight:800;font-style:italic;font-family:Georgia,serif;font-size:12px}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function mid(P,Q){return [(P[0]+Q[0])/2,(P[1]+Q[1])/2];}
function unit(P,Q){var dx=Q[0]-P[0],dy=Q[1]-P[1],L=Math.hypot(dx,dy)||1;return [dx/L,dy/L];}
var NAMESETS=[['A','B','C'],['K','L','M'],['P','Q','R'],['D','E','F']];

function baseTri(){
  var B=[20,132],C=[190,132],A=[rnd(78,132),rnd(16,30)];
  return {A:A,B:B,C:C,Ma:mid(B,C),Mb:mid(A,C),Mc:mid(A,B),
    G:[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3]};
}
function svgHead(){return '<svg viewBox="0 0 210 160" xmlns="http://www.w3.org/2000/svg">';}
function vtx(P,letter,dx,dy,anch,cls){
  return '<circle class="'+(cls==='s-o'?'s-o':'s-vtx')+'" cx="'+P[0].toFixed(1)+'" cy="'+P[1].toFixed(1)+'" r="2.3"/>'
    +'<text class="'+(cls==='s-o'?'s-ol':'s-vl')+'" x="'+(P[0]+dx).toFixed(1)+'" y="'+(P[1]+dy).toFixed(1)+'" text-anchor="'+anch+'">'+letter+'</text>';
}
function line(cls,P,Q){return '<path class="'+cls+'" d="M'+P[0].toFixed(1)+' '+P[1].toFixed(1)+' L'+Q[0].toFixed(1)+' '+Q[1].toFixed(1)+'"/>';}
/* талын дундажийн тэмдэг: хагас тус бүрийн голд n зураас */
function sideTicks(P,Q,n){
  var m=mid(P,Q),dir=unit(P,Q),perp=[-dir[1],dir[0]],s='';
  [mid(P,m),mid(m,Q)].forEach(function(c){for(var i=0;i<n;i++){var off=(i-(n-1)/2)*2.3,
    b=[c[0]+off*dir[0],c[1]+off*dir[1]];
    s+='<line class="s-tick" x1="'+(b[0]-3*perp[0]).toFixed(1)+'" y1="'+(b[1]-3*perp[1]).toFixed(1)+'" x2="'+(b[0]+3*perp[0]).toFixed(1)+'" y2="'+(b[1]+3*perp[1]).toFixed(1)+'"/>';}});
  return s;
}

/* ===== 1) Медианы уртыг ол (төвийн цэг 2:1) ===== */
function genCentroid(){
  var t=rnd(2,6),nm=pick(NAMESETS),mode=pick(['short','long']);
  // бүтэн медиан = 3t;  O→дундаж = t;  орой→O = 2t
  return {kind:'C',t:t,nm:nm,mode:mode,given:(mode==='short'?t:2*t),x:3*t,med:nm[0]+'M'};
}
function drawCentroid(g){
  var T=baseTri(),A=T.A,B=T.B,C=T.C,Ma=T.Ma,G=T.G,nm=g.nm;
  var s=svgHead();
  s+=line('s-side',A,B)+line('s-side',B,C)+line('s-side',C,A);
  s+=sideTicks(B,C,1)+sideTicks(A,C,2)+sideTicks(A,B,3);
  s+=line('s-med',B,T.Mb)+line('s-med',C,T.Mc);
  s+=line('s-medhl',A,Ma);                    // үндсэн медиан A→M
  // өгөгдсөн хэсгийн утга
  var d=unit(A,Ma),perp=[-d[1],d[0]]; if(perp[0]<0){perp=[-perp[0],-perp[1]];}
  var pos=(g.mode==='short')?mid(G,Ma):mid(A,G);
  var lp=[pos[0]+11*perp[0],pos[1]+11*perp[1]];
  s+='<text class="s-len" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3).toFixed(1)+'" text-anchor="middle">'+g.given+'</text>';
  s+=vtx(A,nm[0],0,-5,'middle')+vtx(B,nm[1],-8,9,'end')+vtx(C,nm[2],8,9,'start');
  s+=vtx(Ma,'M',0,13,'middle')+vtx(G,'O',6,-3,'start','s-o');
  s+='</svg>';return s;
}

/* ===== 2) Медиан талыг тэн хуваана ===== */
function genMid(){
  var k=rnd(3,9),nm=pick(NAMESETS),mode=pick(['half','whole']);
  return {kind:'M',k:k,nm:nm,mode:mode,x:k,med:nm[0]+'M'};
}
function drawMid(g){
  var T=baseTri(),A=T.A,B=T.B,C=T.C,Ma=T.Ma,nm=g.nm,k=g.k;
  var s=svgHead();
  s+=line('s-side',A,B)+line('s-side',B,C)+line('s-side',C,A);
  s+=line('s-medhl',A,Ma);
  s+=sideTicks(B,C,1);
  if(g.mode==='half'){
    s+='<text class="s-len" x="'+((B[0]+Ma[0])/2).toFixed(1)+'" y="126" text-anchor="middle">'+k+'</text>';
    s+='<text class="s-x" x="'+((Ma[0]+C[0])/2).toFixed(1)+'" y="126" text-anchor="middle">x</text>';
  } else {
    s+='<text class="s-x" x="'+((B[0]+Ma[0])/2).toFixed(1)+'" y="126" text-anchor="middle">x</text>';
    s+='<text class="s-len" x="105" y="153" text-anchor="middle">'+nm[1]+nm[2]+' = '+(2*k)+'</text>';
  }
  s+=vtx(A,nm[0],0,-5,'middle')+vtx(B,nm[1],-8,9,'end')+vtx(C,nm[2],8,9,'start');
  s+=vtx(Ma,'M',0,(g.mode==='whole'?-4:13),(g.mode==='whole'?'start':'middle'));
  s+='</svg>';return s;
}

/* ===== Үг бодлого ===== */
function wpCentroid(){
  var t=rnd(4,10),nm=pick(NAMESETS),give=pick(['AG','GM']);
  if(give==='AG')
    return {t:'△'+nm.join('')+'-ийн медиануд O цэгт огтлолцоно. '+nm[0]+'M медиан дээр '+nm[0]+'O = '+(2*t)+' см. <span class="ask">OM хэрчмийн уртыг ол.</span>',
            a:'OM = '+nm[0]+'O ÷ 2 = '+(2*t)+' ÷ 2 = '+t+' см  ('+nm[0]+'O : OM = 2 : 1)'};
  return {t:'△'+nm.join('')+'-ийн медиануд O цэгт огтлолцоно. '+nm[0]+'M медиан дээр OM = '+t+' см. <span class="ask">'+nm[0]+'O хэрчмийн уртыг ол.</span>',
          a:nm[0]+'O = 2·OM = 2·'+t+' = '+(2*t)+' см'};
}
function wpWhole(){
  var t=rnd(3,8),nm=pick(NAMESETS),AM=3*t;
  return {t:'Гурвалжны '+nm[0]+'M медианы урт '+AM+' см. Төвийн цэг O нь медианыг оройноос 2 : 1 харьцаагаар хуваадаг. <span class="ask">'+nm[0]+'O ба OM-ийн уртыг ол.</span>',
          a:nm[0]+'O = ⅔·'+AM+' = '+(2*t)+' см,  OM = ⅓·'+AM+' = '+t+' см'};
}
function wpArea(){
  var S=pick([24,30,36,48,54,60,72]),nm=pick(NAMESETS);
  return {t:'△'+nm.join('')+'-ийн талбай '+S+' см². '+nm[0]+' оройгоос татсан медиан гурвалжныг тэнцүү талбайтай хоёр хэсэгт хуваадаг. <span class="ask">Хэсэг тус бүрийн талбайг ол.</span>',
          a:'хэсэг бүр = '+S+' ÷ 2 = '+(S/2)+' см²  (медиан талбайг тэн хуваана)'};
}

function build(){
  var pattern=['C','C','M','C','C','M'];
  var dcards='',dans='',items=[];
  var seen={};
  for(var i=0;i<6;i++){
    var isC=pattern[i]==='C';
    var g,sg,tr=0;do{g=isC?genCentroid():genMid();sg=g.kind+'_'+(g.t||g.k)+'_'+g.mode;tr++;}while(seen[sg]&&tr<80);seen[sg]=1;
    var svg=isC?drawCentroid(g):drawMid(g);
    var ask=isC?(g.med+' медиан: x ='):'x =';
    var note=isC?'(бүтэн медиан = 3× богино хэсэг)':'(талыг тэн хуваана)';
    var n=i+1;
    dcards+='<div class="q"><div class="qh">'+n+'.</div><div class="dfig">'+svg+'</div>'
      +'<div class="xline">'+ask+'<span class="bl"></span></div></div>';
    dans+='<div class="a"><span class="an">'+n+'.</span><span>x = '+g.x+' <span style="color:#9891b3">'+note+'</span></span></div>';
    items.push({q:'Медиан ('+(isC?'2:1 харьцаа':'дундаж')+')',a:'x='+g.x});
  }
  var W=[wpCentroid(),wpWhole(),wpArea()];
  var wcards='',wans='';
  for(var j=0;j<W.length;j++){var w=W[j];var n2=j+7;
    wcards+='<div class="wq"><div class="wn">'+n2+'.</div><div class="wt">'+w.t
      +'<div class="wans">Хариу:<span class="bl"></span></div></div></div>';
    wans+='<div><span class="an">'+n2+'.</span> '+w.a+'</div>';
    items.push({q:'Бодлого '+n2,a:w.a});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Гурвалжны медианы чанар</h1><div class="sub">Медианы уртыг ол — төвийн цэг O медианыг оройноос 2:1 хуваана · 9-р анги · зурагтай + бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Медиан → оройг эсрэг талын дунджтай холбоно · 3 медиан <b>төвийн цэг O</b>-д огтлолцоно · $AO:OM = 2:1$ буюу $AO=\\dfrac{2}{3}AM,\\ OM=\\dfrac{1}{3}AM$ · медиан талыг тэн хуваана</div>'
    +'<div class="sec"><b>1</b> Мэдэгдэхгүй байгаа хэмжигдэхүүнийг ол</div>'
    +'<div class="dgrid">'+dcards+'</div>'
    +'<div class="sec"><b>2</b> Бодлого бод</div>'
    +'<div class="wgrid">'+wcards+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+dans+'</div><div class="ans-w">'+wans+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Гурвалжны медианы чанар';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=18"></script>
</body>
</html>
