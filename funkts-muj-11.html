<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Функц, тодорхойлогдох муж ба адилтгал тэнцүү функц (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#7a4f00}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .col1{display:grid;grid-template-columns:1fr;gap:10px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:22mm;margin-top:5px}
  .wk.tall{height:28mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function qs(a,b,c){var t=(a===1?'x^2':a===-1?'-x^2':a+'x^2');if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
function ca(n){return n===1?'':n===-1?'-':''+n;}
// 1. Тодорхойлогдох муж
function g_domain(){var kind=pick(['rat','rat','sqrtGe','sqrtLe','sqrtStrict','rat2']);
  if(kind==='rat'){var a=nz(-6,6),c=nz(-5,5);return {q:'$f(x)=\\dfrac{x'+sg(c)+'}{x'+sg(-a)+'}$ функцийн тодорхойлогдох мужийг ол.',a:'Хуваарь $\\ne0$: $x'+sg(-a)+'\\ne0\\Rightarrow x\\ne'+a+'$. $D=\\mathbb{R}\\setminus\\{'+a+'\\}$'};}
  if(kind==='rat2'){var a2=rnd(2,6);return {q:'$f(x)=\\dfrac{1}{x^2-'+(a2*a2)+'}$ функцийн тодорхойлогдох мужийг ол.',a:'$x^2-'+(a2*a2)+'=(x-'+a2+')(x+'+a2+')\\ne0\\Rightarrow x\\ne\\pm'+a2+'$. $D=\\mathbb{R}\\setminus\\{-'+a2+';'+a2+'\\}$'};}
  if(kind==='sqrtGe'){var a3=nz(-5,5);return {q:'$f(x)=\\sqrt{x'+sg(-a3)+'}$ функцийн тодорхойлогдох мужийг ол.',a:'Язгуур доор $\\ge0$: $x'+sg(-a3)+'\\ge0\\Rightarrow x\\ge'+a3+'$. $D=['+a3+';+\\infty[$'};}
  if(kind==='sqrtLe'){var a4=nz(-5,5);return {q:'$f(x)=\\sqrt{'+a4+'-x}$ функцийн тодорхойлогдох мужийг ол.',a:'$'+a4+'-x\\ge0\\Rightarrow x\\le'+a4+'$. $D=\\,]{-}\\infty;'+a4+']$'};}
  var a5=nz(-5,5);return {q:'$f(x)=\\dfrac{1}{\\sqrt{x'+sg(-a5)+'}}$ функцийн тодорхойлогдох мужийг ол.',a:'Язгуур доор $>0$: $x'+sg(-a5)+'>0\\Rightarrow x>'+a5+'$. $D=\\,]'+a5+';+\\infty[$'};}
// 2. Адилтгал тэнцүү болгох a,b
function g_equalAB(){for(var t=0;t<400;t++){var p=nz(-3,3),q=nz(-3,3);if(p===q)continue;var B=rnd(-4,4),C=rnd(-4,4);
  function Fv(x){return x*x+B*x+C;}var a=(Fv(q)-Fv(p))/(q-p);if(a!==Math.round(a))continue;var b=Fv(p)-a*p;if(Math.abs(a)>9||Math.abs(b)>13)continue;
  var lo=Math.min(p,q),hi=Math.max(p,q);
  return {q:'$D=\\{'+lo+';'+hi+'\\}$ мужид $f(x)='+qs(1,B,C)+'$ ба $g(x)=ax+b$ адилтгал тэнцүү бол $a,\\ b$-г ол.',a:'$f('+lo+')='+Fv(lo)+',\\ f('+hi+')='+Fv(hi)+'$; систем $\\begin{cases}'+ca(lo)+'a+b='+Fv(lo)+'\\\\ '+ca(hi)+'a+b='+Fv(hi)+'\\end{cases}\\Rightarrow a='+a+',\\ b='+b+'$'};}return null;}
// 3. Тэнцүү эсэх ба D-ийн элемент
function g_equalCheck(){var kind=pick(['ratNo','finiteYes']);
  if(kind==='ratNo'){var a=nz(-4,4);return {q:'$f(x)=\\dfrac{x^2-'+(a*a)+'}{x'+sg(-a)+'}$ ба $g(x)=x'+sg(a)+'$ функцүүд ($\\mathbb{R}$ дээр) адилтгал тэнцүү эсэхийг шалга.',a:'$f$ нь $x='+a+'$ үед тодорхойлогдохгүй (хуваарь 0), $g$ тодорхойлогдоно. Тодорхойлогдох муж өөр тул <b>тэнцүү биш</b>.'};}
  return {q:'$D=\\{-1;1\\}$ мужид $f(x)=x$ ба $g(x)=x^3$ функцүүд адилтгал тэнцүү эсэхийг шалга.',a:'$f(-1)=-1=g(-1),\\ f(1)=1=g(1)$; муж ижил, утга тохирно — <b>тэнцүү</b>.'};}
function g_Dcount(){for(var t=0;t<200;t++){var r1=nz(-4,4),r2=nz(-4,4);if(r1===r2)continue;var m=r1+r2,c=r1*r2;if(m===0)continue;var lo=Math.min(r1,r2),hi=Math.max(r1,r2);
  return {q:'$f(x)=x^2$ ба $g(x)='+m+'x'+sg(-c)+'$ функцүүд адилтгал тэнцүү болох $D$-ийн элементийн тоог ол.',a:'$x^2='+m+'x'+sg(-c)+'\\Rightarrow x^2-'+m+'x'+sg(c)+'=0\\Rightarrow x='+lo+';'+hi+'$. $D=\\{'+lo+';'+hi+'\\}$ — <b>2 элемент</b>.'};}return null;}
// 4. Хүснэгтээр өгсөн функц
function g_table(){var k=nz(-4,4),b=rnd(-3,3),xs=[-2,-1,0,1,2];var ys=xs.map(function(x){return k*x+b;});
  var tbl='<table style="border-collapse:collapse;font-size:11px;margin-top:3px"><tr><td style="border:1px solid #ccc;padding:2px 7px;font-weight:700">x</td>'+xs.map(function(x){return '<td style="border:1px solid #ccc;padding:2px 7px">'+x+'</td>';}).join('')+'</tr><tr><td style="border:1px solid #ccc;padding:2px 7px;font-weight:700">y</td>'+ys.map(function(y){return '<td style="border:1px solid #ccc;padding:2px 7px">'+y+'</td>';}).join('')+'</tr></table>';
  return {q:'Хүснэгтээр өгсөн функцийг томьёогоор илэрхийл.'+tbl,a:'$x$ нэмэгдэхэд $y$ нь тогтмол $'+k+'$-аар өөрчлөгдөнө (шугаман). $y='+ca(k)+'x'+(b?sg(b):'')+'$'};}
function gen(fn){for(var t=0;t<250;t++){var f=fn();if(f)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө'];
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid,.col1'),map={};for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<80){var blocks=sheet.querySelectorAll('.grid,.col1'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var P=[[],[],[],[]];var seen={};function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<4000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;P[idx].push(f);c++;}}
  fill(0,g_domain,8);fill(1,g_equalAB,6);var mix2=[];for(var i=0;i<6;i++){mix2.push(gen(i%2?g_Dcount:g_equalCheck));}P[2]=mix2;fill(3,g_table,4);return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,col,tall){var use=WK?arr.slice(0,cap):arr;return '<div class="'+(col||'grid')+'">'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(WK?'<div class="wk'+(tall?' tall':'')+'"></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Функц · тодорхойлогдох муж · адилтгал тэнцүү функц</h1><div class="sub">III бүлэг · 3.1 Функц, функцийг өгөх арга · 11-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule"><b>Санамж:</b> <b>Тодорхойлогдох муж</b> $D$ — $x$-ийн боломжит бүх утга (хуваарь $\\ne0$, язгуур доор $\\ge0$). Хоёр функц <b>адилтгал тэнцүү</b> ($f=g$) байх нь: 1) $D_f=D_g$; 2) мужийн бүх $x$-д $f(x)=g(x)$.</div>'
    +'<div class="task">1. Функцийн тодорхойлогдох мужийг ол.</div>'+block(S[0],4,'grid')
    +'<div class="task">2. Функцүүдийг адилтгал тэнцүү болгох $a,\\ b$-г ол.</div>'+block(S[1],4,'grid',true)
    +'<div class="task">3. Адилтгал тэнцүү эсэхийг шалга / $D$-ийн элементийг ол.</div>'+block(S[2],4,'col1',true)
    +'<div class="task">4. Хүснэгтээр өгсөн функцийг томьёогоор илэрхийл.</div>'+block(S[3],2,'grid')
    +'<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Функц · тодорхойлогдох муж · адилтгал тэнцүү';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
