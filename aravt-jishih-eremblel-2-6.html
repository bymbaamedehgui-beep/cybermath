  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}

  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:12mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}

<script>
// ══════════ g6core.js — 6-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ g6ch2.js — II БҮЛЭГ. АРАВТЫН БА ЭНГИЙН БУТАРХАЙ, ПРОЦЕНТ ══════════
// Сурах бичгийн 23–54 хуудасны ДАСГАЛУУДЫН хэлбэрээр зохиогдсон.
// ЗАРЧИМ: тооцооллын бодлогод q нь ЗӨВХӨН илэрхийлэл. Заавар нь plan.json дахь task.label-д ганц удаа.
// g6core.js доторх туслахууд (rnd,nz,pick,shuffle,gcd,lcm,Fr,fAdd,fSub,fMul,fDiv,fTex,fMix,
// decStr,longDiv,decLatex,primeFactors,isqrt,icbrt,powTex,numline,plane,venn2 ...) энэ файлын ӨМНӨ залгагдана.

// ═══════════ АРАВТЫН БУТАРХАЙН ЯГ ТООЦООЛОХ ХӨДӨЛГҮҮР ═══════════
// Тоог "бүхэл мантисс + масштаб" хэлбэрээр барина (float алдаа гаргахгүй).
function p10(k){ var r=1; while(k-->0) r*=10; return r; }
function dFmt(i,sc){                       // i/10^sc — сүүлийн тэгүүдийг хасна
 var neg=i<0; i=Math.abs(Math.round(i)); var s=''+i;
 while(s.length<=sc) s='0'+s;
 var ip=s.slice(0,s.length-sc), fp=sc?s.slice(s.length-sc):'';
 fp=fp.replace(/0+$/,'');
 return (neg?'-':'')+ip+(fp?'.'+fp:'');
}
function dFix(i,sc,dec){                   // i/10^sc — яг dec орон гаргана (dec>=sc)
 var neg=i<0; i=Math.abs(Math.round(i)); var s=''+i;
 while(s.length<=sc) s='0'+s;
 var ip=s.slice(0,s.length-sc), fp=sc?s.slice(s.length-sc):'';
 while(fp.length<dec) fp+='0';
 fp=fp.slice(0,dec);
 return (neg?'-':'')+ip+(dec>0?'.'+fp:'');
}
function hUp(n,P){ return Math.floor(n/P+0.5)*P; }         // хагасыг дээш тоймлох
// 1 буюу 2 орны бутархайтай эерэг тоо {v: 100-т үржүүлсэн бүхэл, t: текст}
function rd2(wlo,whi){
 var w=rnd(wlo,whi), s=pick([1,2]), f;
 if(s===1){ f=rnd(1,9)*10; } else { f=rnd(1,99); if(f%10===0) f++; }
 var v=w*100+f;
 return {v:v, t:dFmt(v,2)};
}
// 1 буюу 2 орны бутархайтай тоо, бүхэл хэсэг заавал 0 (0.07 ... 0.99, 0.1 ... 0.9)
function rd2s(){
 var s=pick([1,2]), f;
 if(s===1){ f=rnd(1,9)*10; } else { f=rnd(1,99); if(f%10===0) f++; }
 return {v:f, t:dFmt(f,2)};
}

// ═══════════ ЗУРГИЙН ТУСЛАХУУД (цэвэрхэн, хариу илчлэхгүй) ═══════════
function figTbl(rows){
 var h='<table style="border-collapse:collapse;margin:2px auto;font-size:12.5px;line-height:1.15">';
 for(var i=0;i<rows.length;i++){
  h+='<tr>';
  for(var j=0;j<rows[i].length;j++){
   var hd=(j===0);
   h+='<td style="border:1px solid #7B52EE;padding:2px 7px;text-align:center;min-width:'+(hd?26:40)+'px;height:19px;'
     +(hd?'background:#f3f0ff;color:#4c2fb5;':'color:#221;')+'">'+rows[i][j]+'</td>';
  }
  h+='</tr>';
 }
 return h+'</table>';
}
// Бутархай хуваарьтай тоон шулуун (зөвхөн хуваарь, цэг тэмдэглэхгүй)
function figDecLine(lo,hi,n,dec){
 var W=340,H=44,pad=20,u=(W-2*pad)/n, g='';
 g+='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var i=0;i<=n;i++){
  var x=(pad+i*u).toFixed(1), val=lo+Math.round((hi-lo)*i/n);
  g+='<line x1="'+x+'" y1="21" x2="'+x+'" y2="31" stroke="#555" stroke-width="1"/>';
  if(i%2===0) g+='<text x="'+x+'" y="41" font-size="8.5" text-anchor="middle" fill="#555">'+dFmt(val,dec)+'</text>';
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="316">'+g+'</svg>';
}
// Тэгш өнцөгт (талын урт бичигдсэн, талбай бичигдэхгүй)
function figRect(a,b,ua){
 var W=210,H=110,x=52,y=14,w=118,h=70,g='';
 g+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#f3f0ff" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<text x="'+(x+w/2)+'" y="'+(y+h+15)+'" font-size="11" text-anchor="middle" fill="#4c2fb5">'+a+' '+ua+'</text>';
 g+='<text x="'+(x-6)+'" y="'+(y+h/2+4)+'" font-size="11" text-anchor="end" fill="#4c2fb5">'+b+' '+ua+'</text>';
 return '<svg viewBox="0 0 '+W+' '+H+'" width="196">'+g+'</svg>';
}
// Тэгш өнцөгтийг тэнцүү хэсэгт хуваасан зурвас (энгийн бутархайн загвар, будалгүй)
function figStrip(n,shade){
 var W=260,H=44,x=8,y=8,w=244,h=28,g='';
 g+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#fff" stroke="#7B52EE" stroke-width="1.4"/>';
 for(var i=1;i<n;i++){ var xx=(x+w*i/n).toFixed(1);
  g+='<line x1="'+xx+'" y1="'+y+'" x2="'+xx+'" y2="'+(y+h)+'" stroke="#7B52EE" stroke-width="1"/>'; }
 if(shade){ for(var k=0;k<shade;k++){
  g+='<rect x="'+(x+w*k/n).toFixed(1)+'" y="'+y+'" width="'+(w/n).toFixed(1)+'" height="'+h+'" fill="rgba(123,82,238,0.20)"/>'; } }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="242">'+g+'</svg>';

// ═════════════════ 2.1 Тоог жиших, эрэмбэлэх ═════════════════
// [дасгал 1] Заасан цифр ямар орны нэгжийг илэрхийлэх вэ?
var PLACE_INT=['нэгжийн','аравтын','зуутын','мянгатын'];
var PLACE_FR=['аравны','зууны','мянганы'];
function g_placeValue(){

 var pool=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,ipn+fpn);
 var ip=pool.slice(0,ipn).join(''), fp=pool.slice(ipn).join('');
 var idx=rnd(0,ipn+fpn-1), dig=pool[idx], nm, valS;
 if(idx<ipn){ var pr=ipn-1-idx; nm=PLACE_INT[pr]; valS=''+(dig*p10(pr)); }
 else { var k=idx-ipn+1; nm=PLACE_FR[k-1]; valS=dFmt(dig,k); }
 return {q:'$'+ip+'.'+fp+'$ доторх $'+dig+'$',
         a:'$'+dig+'$ цифр '+nm+' орныг илэрхийлж, утга нь $'+valS+'$',
         key:'pv-'+ip+'.'+fp+'-'+idx, nv:dig};
}
// [дасгал 12, давтах 12] Хоёр аравтын бутархайг жиших

 var A=(w*p10(s1)+f1)*p10(3-s1), B=(w*p10(s2)+f2)*p10(3-s2);
 if(A===B) return null;
 var at=dFmt(w*p10(s1)+f1,s1), bt=dFmt(w*p10(s2)+f2,s2);
 if(at===bt) return null;
 var rel=A<B?'\\lt ':'\\gt ';
 return {q:'$'+at+'$ ба $'+bt+'$', a:'$'+at+rel+bt+'$',
         key:'cd-'+at+'-'+bt, nv:Math.max(A,B)};
}

// [дасгал 43] Гурван гишүүнт нэмэх, хасах гинж
function g_decChain3(){
 var A=rd2(1,29), B=rd2(0,19), C=rd2(0,19);
 var o1=pick(['+','-']), o2=pick(['+','-']);
 var v1=o1==='+'? A.v+B.v : A.v-B.v;
 if(v1<0) return null;
 var v2=o2==='+'? v1+C.v : v1-C.v;
 if(v2<0) return null;
 return {q:'$'+A.t+o1+B.t+o2+C.t+'$',
         a:'$'+A.t+o1+B.t+o2+C.t+'='+dFmt(v1,2)+o2+C.t+'='+dFmt(v2,2)+'$',
         key:'dc3-'+A.v+o1+B.v+o2+C.v, nv:v2};
}
// [дасгал 35] Нэмэх үйлдлийн чанарыг хэрэглэн хоосон нүдийг нөх
function g_decPropBox(){
 var A=rd2(0,9), B=rd2(0,9), t=pick(['t1','t2','t3','t4']), q, v;
 if(t==='t1'){ q=A.t+'+'+B.t+'=\\square+'+A.t; v=B.v; }
 else if(t==='t2'){ var C=rd2(0,9);
   q='\\bigl('+A.t+'+'+B.t+'\\bigr)+'+C.t+'='+A.t+'+\\bigl('+B.t+'+\\square\\bigr)'; v=C.v; }
 else if(t==='t3'){ q=A.t+'+'+B.t+'+\\square='+dFmt(A.v+B.v,2); v=0; }
 else { q=A.t+'+\\square='+dFmt(A.v+B.v,2); v=B.v; }
 return {q:'$'+q+'$', a:'$\\square='+dFmt(v,2)+'$', key:'dpb-'+t+'-'+A.v+'-'+B.v, nv:v};
}
// [дасгал 37] Хялбар аргаар бодох (бүлэглэх)
function g_decEasyGroup(){
 var t=pick(['t1','t2','t3']), A=rd2(0,9), B=rd2(0,9), q, res, steps;
 if(t==='t1'){                                  // (A+B)+C, B+C нь бүхэл
  var cv=((100-B.v%100)%100)+rnd(1,9)*100;
  q='\\bigl('+A.t+'+'+B.t+'\\bigr)+'+dFmt(cv,2);
  res=A.v+B.v+cv;
  steps='='+A.t+'+\\bigl('+B.t+'+'+dFmt(cv,2)+'\\bigr)='+A.t+'+'+dFmt(B.v+cv,2)+'='+dFmt(res,2);
 } else if(t==='t2'){                            // A+B-A
  q=A.t+'+'+B.t+'-'+A.t;
  res=B.v;
  steps='=\\bigl('+A.t+'-'+A.t+'\\bigr)+'+B.t+'='+dFmt(res,2);
 } else {                                        // A+(B+C), A+B нь бүхэл
  var bv=((100-A.v%100)%100)+rnd(1,9)*100, C2=rd2(0,9);
  q=A.t+'+\\bigl('+dFmt(bv,2)+'+'+C2.t+'\\bigr)';
  res=A.v+bv+C2.v;
  steps='=\\bigl('+A.t+'+'+dFmt(bv,2)+'\\bigr)+'+C2.t+'='+dFmt(A.v+bv,2)+'+'+C2.t+'='+dFmt(res,2);
 }
 return {q:'$'+q+'$', a:'$'+q+steps+'$', key:'deg-'+t+'-'+A.v+'-'+B.v+'-'+res, nv:res};
}
// [дасгал 31] Мэдэгдэхгүй нэмэгдэхүүн, хасагдагчийг ол
function g_decFindMissing(){
 var A=rd2(0,19), B=rd2(0,19), t=pick(['t1','t2','t3']), q, v;
 if(t==='t1'){ q='\\square+'+B.t+'='+dFmt(A.v+B.v,2); v=A.v; }
 else if(t==='t2'){ if(A.v<=B.v) return null; q=A.t+'-\\square='+dFmt(A.v-B.v,2); v=B.v; }
 else { q='\\square-'+B.t+'='+A.t; v=A.v+B.v; }
 return {q:'$'+q+'$', a:'$\\square='+dFmt(v,2)+'$', key:'dfm-'+t+'-'+A.v+'-'+B.v, nv:v};
}
// [дасгал 39] Хэсгүүдийн нийлбэр (утас, туузан бодлого)
var PIECE=[{o:'төмөр утас',u:'см'},{o:'даавуу',u:'м'},{o:'тууз',u:'см'},{o:'мод',u:'м'},{o:'зэс утас',u:'см'}];

         a:'нийт $'+A.t+'+'+B.t+'+'+C.t+'='+dFmt(S,2)+'$ '+P.u+'; зөрөө $'+dFmt(mx,2)+'-'+dFmt(mn,2)+'='+dFmt(mx-mn,2)+'$ '+P.u,
         key:'wp-'+A.v+'-'+B.v+'-'+C.v+'-'+P.o, nv:S};

// [дасгал 40] Хоёр хэмжигдэхүүний нийлбэр ба зөрөө
var PAIR=[{a:'Эхний сагстай алимны жин',b:'Хоёр дахь сагстай алимны жин',u:'кг'},
          {a:'Эхний савны ус',b:'Хоёр дахь савны ус',u:'л'},

// [дасгал 41, 42] Өсөлт, өөрчлөлт
function g_wordGrow(){

 if(t==='t1'){
  A=rd2(1,3); B=rd2(1,3);

          a:'$'+A.t+'+'+B.t+'='+dFmt(A.v+B.v,2)+'$ м', key:'wg1-'+A.v+'-'+B.v, nv:A.v+B.v};
 }
 A=rd2(1,2); B=rd2(2,4);
 if(B.v<=A.v) return null;
 return {q:'Наранцэцэг долоо хоногийн эхэнд $'+A.t+'$ м өндөртэй байсан бөгөөд долоо хоногийн төгсгөлд $'+B.t+'$ м болов. $7$ хоногийн турш хэдэн метр ургасан бэ?',
         a:'$'+B.t+'-'+A.t+'='+dFmt(B.v-A.v,2)+'$ м', key:'wg2-'+A.v+'-'+B.v, nv:B.v-A.v};

// [дасгал 48] Даацад багтах эсэхийг шалгах
var LOADS=[{n:'хэрэм'},{n:'туулай'},{n:'сармагчин'},{n:'үнэг'},{n:'халиу'}];
function g_wordCapacity(){
 var cap=rnd(8,20);
 var A=rd2(1,cap-3), B=rd2(1,cap-3), C=rd2(1,cap-3);
 var an=shuffle(LOADS).slice(0,3);
 var pairs=[[0,1],[0,2],[1,2]], val=[A,B,C], ok=[], no=[], i;
 for(i=0;i<3;i++){
  var s=val[pairs[i][0]].v+val[pairs[i][1]].v;
  var nm=an[pairs[i][0]].n+' ба '+an[pairs[i][1]].n;
  if(s<=cap*100) ok.push(nm+' ($'+dFmt(s,2)+'$)'); else no.push(nm+' ($'+dFmt(s,2)+'$)');
 }
 if(ok.length===0||no.length===0) return null;
 return {q:'Амьтад $'+cap+'$ кг-ын даацтай гүүрээр гарах болов. '+an[0].n+' $'+A.t+'$ кг, '+an[1].n+' $'+B.t+'$ кг, '+an[2].n+' $'+C.t+'$ кг жинтэй. Аль хоёр нь хамтдаа гүүрээр гарч чадах вэ?',
         a:'гарч чадна: '+ok.join(', ')+'; гарч чадахгүй: '+no.join(', '),
         key:'wc-'+cap+'-'+A.v+'-'+B.v+'-'+C.v, nv:ok.length};
}
// [дасгал 46] Хүснэгтэн өгөгдлийн нийлбэр ба хамгийн их/бага зөрөө (нэгж холилдсон)
var DAYS=['Даваа','Мягмар','Лхагва','Пүрэв','Баасан'];
function g_wordWeekRun(){
 var arr=[], seen={}, i, g=0;
 while(arr.length<5 && g++<300){
  var m=rnd(2500,9800);            // метрээр
  if(seen[m]) continue; seen[m]=1;
  var asKm=pick([0,1]);
  arr.push({m:m, t:asKm? dFmt(m,3)+' км' : m+' м'});
 }
 if(arr.length<5) return null;
 var sum=0, mx=-1, mn=1e9;
 for(i=0;i<5;i++){ sum+=arr[i].m; if(arr[i].m>mx)mx=arr[i].m; if(arr[i].m<mn)mn=arr[i].m; }
 return {q:'Болдын $5$ өдөр дараалан гүйсэн зам: '+arr.map(function(x,k){return DAYS[k]+' — '+x.t;}).join(', ')
           +'. Нийт хэдэн километр гүйсэн бэ? Хамгийн хол ба хамгийн ойр гүйсэн зайнуудын зөрөөг ол.',
         a:'нийт $'+dFmt(sum,3)+'$ км, зөрөө $'+dFmt(mx-mn,3)+'$ км',
         key:'wwr-'+arr.map(function(x){return x.m;}).join('_'), nv:sum};
}

// [дасгал 64] Мэдэгдэхгүй үржигдэхүүн, хуваагдагчийг ол

 var t=pick(['t1','t2','t3']), A=rd2s(), n=rnd(2,20), q, v;

// p10, dFmt, dFix, hUp, rd2, rd2s, figTbl, figDecLine, figRect, figStrip зэргийг ДАХИН ТОДОРХОЙЛОХГҮЙ.

// ═══════════ АРАВТЫН БУТАРХАЙН ЯГ ТООЦООЛОХ ХӨДӨЛГҮҮР (dm_) ═══════════
// Тоо = {v: бүхэл мантисс, s: аравтын орны тоо}  →  утга нь v/10^s. Хөвөгч цэгийн алдаа гарахгүй.
function dm_N(v,s){ v=Math.round(v); while(s>0 && v%10===0){ v=v/10; s--; } return {v:v,s:s}; }
function dm_int(n){ return {v:Math.round(n),s:0}; }
function dm_t(A){ return dFmt(A.v,A.s); }
function dm_al(A,B){ var s=A.s>B.s?A.s:B.s; return [A.v*p10(s-A.s), B.v*p10(s-B.s), s]; }
function dm_add(A,B){ var z=dm_al(A,B); return dm_N(z[0]+z[1],z[2]); }
function dm_sub(A,B){ var z=dm_al(A,B); return dm_N(z[0]-z[1],z[2]); }
function dm_mul(A,B){ return dm_N(A.v*B.v, A.s+B.s); }
function dm_div(A,B){                       // яг хуваагдвал үр дүн, эс бөгөөс null
 if(B.v===0) return null;
 var num=A.v*p10(B.s), den=B.v*p10(A.s), k, t;
 for(k=0;k<=6;k++){ t=num*p10(k); if(t%den===0) return dm_N(t/den,k); }
 return null;
}
function dm_val(A){ return A.v/p10(A.s); }
function dm_eq(A,B){ var z=dm_al(A,B); return z[0]===z[1]; }
function dm_cmp(A,B){ var z=dm_al(A,B); return z[0]<z[1]?-1:(z[0]>z[1]?1:0); }
function dm_shift(A,k){ return k>=0 ? dm_N(A.v*p10(k),A.s) : dm_N(A.v, A.s-k); }  // 10^k дахин
// яг s оронтой бутархайтай санамсаргүй тоо (сүүлийн цифр 0 болохоос сэргийлнэ)
function dm_rd(s,lo,hi){ var v=rnd(lo,hi); if(s>0 && v%10===0) v=(v<hi)?v+1:v-1; return {v:v,s:s}; }

// ═════════════════ 2.5 Аравтын бутархайн үржүүлэх, хуваах үйлдэл ═════════════════

// [дасгал 77, 83 ж,з,и,к,л,м] Аравтын бутархайг аравтын бутархайгаар үржүүлэх
function g_dmMulDec(){
 var t=pick(['t1','t2','t3']), A, B;
 if(t==='t1'){ A=dm_rd(1,11,99);  B=dm_rd(1,11,99); }
 else if(t==='t2'){ A=dm_rd(2,101,999); B=dm_rd(1,11,99); }
 else { A=dm_rd(1,1,9); B=dm_rd(2,11,99); }
 var P=dm_mul(A,B);
 return {q:'$'+dm_t(A)+'\\times '+dm_t(B)+'$',
         a:'$'+dm_t(A)+'\\times '+dm_t(B)+'='+dm_t(P)+'$',
         key:'dmd-'+t+'-'+A.v+'-'+A.s+'-'+B.v+'-'+B.s, nv:dm_val(P)};
}
// [дасгал 83 а,б,в,г,д,е] Бүхэл тоог аравтын бутархайгаар үржүүлэх
function g_dmMulIntDec(){
 var n=rnd(2,99), t=pick(['t1','t2']);
 var A=(t==='t1')?dm_rd(1,11,99):dm_rd(1,1,9);
 var first=pick([0,1]);
 var qs=first ? (n+'\\times '+dm_t(A)) : (dm_t(A)+'\\times '+n);
 var P=dm_mul(dm_int(n),A);
 return {q:'$'+qs+'$', a:'$'+qs+'='+dm_t(P)+'$',
         key:'dmid-'+t+'-'+n+'-'+A.v+'-'+first, nv:dm_val(P)};
}
// [дасгал 78] Цифрүүдийн үржвэрийг ашиглан аравтын бутархайн цэгийг зөв байрлуулах
function g_dmPlacePoint(){
 var m=rnd(11,99); if(m%10===0) m++;
 var n=rnd(2,9), P0=m*n;
 var sa=rnd(0,2), sb=rnd(0,1);
 if(sa+sb===0) return null;
 var A={v:m,s:sa}, B={v:n,s:sb}, P=dm_N(P0,sa+sb);
 return {q:'$'+m+'\\times '+n+'='+P0+'$ бол $'+dm_t(A)+'\\times '+dm_t(B)+'$',
         a:'$'+dm_t(A)+'\\times '+dm_t(B)+'='+dm_t(P)+'$',
         key:'dpp-'+m+'-'+n+'-'+sa+'-'+sb, nv:dm_val(P)};
}
// [дасгал 82 а,б,в] Бүхэл тоог аравтын бутархайд хуваах
function g_dmDivWholeByDec(){
 var b=rnd(2,99); if(b%10===0) b++;
 var step=10/gcd(b,10);                    // ноогдвор ийм алхамтай бол хуваагдагч бүхэл болно
 var Q=step*rnd(1,Math.floor(80/step));
 if(Q<2) return null;
 var Nv=b*Q, N=Nv/10;
 if(N>900) return null;
 var B={v:b,s:1};
 return {q:'$'+N+'\\div '+dm_t(B)+'$',
         a:'$'+N+'\\div '+dm_t(B)+'='+(N*10)+'\\div '+b+'='+Q+'$',
         key:'ddw-'+N+'-'+b, nv:Q};
}
// [дасгал 82 г,д,е,ж,з,к,л,м] Аравтын бутархайг аравтын бутархайд хуваах
function g_dmDivDecByDec(){
 var b=rnd(12,99); if(b%10===0) b++;
 var t=pick(['t1','t2']), Q;
 if(t==='t1') Q=dm_int(rnd(2,12));
 else { var qv=rnd(11,95); if(qv%10===0) qv++; Q={v:qv,s:1}; }
 var B={v:b,s:1}, A=dm_mul(B,Q);
 if(dm_val(A)>600) return null;
 var A10=dm_shift(A,1);
 return {q:'$'+dm_t(A)+'\\div '+dm_t(B)+'$',
         a:'$'+dm_t(A)+'\\div '+dm_t(B)+'='+dm_t(A10)+'\\div '+b+'='+dm_t(Q)+'$',
         key:'dddd-'+t+'-'+b+'-'+Q.v+'-'+Q.s, nv:dm_val(Q)};
}
// [дасгал 85 а,б] Аравтын бутархайг бүхэл тоонд хуваах
function g_dmDivDecByInt(){
 var d=rnd(11,99), sq=pick([1,2]);
 var qv=(sq===1)?rnd(11,99):rnd(101,999);
 if(qv%10===0) qv++;

 if(A.s===0) return null;                  // хуваагдагч нь заавал аравтын бутархай байна
 return {q:'$'+dm_t(A)+'\\div '+d+'$', a:'$'+dm_t(A)+'\\div '+d+'='+dm_t(Q)+'$',

// [дасгал 85 в,г] Гурван оронтой бутархайг хуваах (цэгийг ижил орноор шилжүүлэх)
function g_dmDivSmallDec(){
 var t=pick(['t1','t2']), B, Q, k;
 if(t==='t1'){
  var bv=rnd(11,99); if(bv%10===0) bv++;
  var qv=rnd(11,99); if(qv%10===0) qv++;
  B={v:bv,s:2}; Q={v:qv,s:1}; k=2;
 } else {
  var bw=rnd(11,99); if(bw%10===0) bw++;
  var qw=rnd(101,999); if(qw%10===0) qw++;
  B={v:bw,s:1}; Q={v:qw,s:2}; k=1;
 }
 var A=dm_mul(B,Q), Ak=dm_shift(A,k), Bk=dm_shift(B,k);
 return {q:'$'+dm_t(A)+'\\div '+dm_t(B)+'$',
         a:'$'+dm_t(A)+'\\div '+dm_t(B)+'='+dm_t(Ak)+'\\div '+dm_t(Bk)+'='+dm_t(Q)+'$',
         key:'dsd-'+t+'-'+B.v+'-'+Q.v, nv:dm_val(Q)};

// [дасгал 86] Тооцооллын хариу зөв эсэхийг шалгах
function g_dmCheckResult(){
 var t=pick(['mul','div']), A, B, V, op;
 if(t==='mul'){ A=dm_rd(1,11,99); B=dm_rd(1,11,99); V=dm_mul(A,B); op='\\times '; }
 else { B=dm_rd(1,11,99); var Q=dm_int(rnd(2,40)); A=dm_mul(B,Q); V=Q; op='\\div '; }
 var wrong=pick([0,1]);
 var S=wrong ? dm_shift(V,pick([1,-1])) : V;
 if(wrong && dm_eq(S,V)) return null;
 return {q:'$'+dm_t(A)+op+dm_t(B)+'='+dm_t(S)+'$',
         a:(wrong?'Буруу. ':'Зөв. ')+'$'+dm_t(A)+op+dm_t(B)+'='+dm_t(V)+'$',
         key:'dcr-'+t+'-'+A.v+'-'+A.s+'-'+B.v+'-'+wrong+'-'+S.v+'-'+S.s, nv:(wrong?0:1)};
}
// [дасгал 95] 10, 100, 1000-д үржүүлэх ба хуваах гинж
function g_dmPow10Chain(){

 var A={v:v,s:s};

 var d1=dm_shift(A,-1), d2=dm_shift(A,-2), d3=dm_shift(A,-3);
 return {q:'$'+dm_t(A)+'$',
         a:'$\\times 10='+dm_t(r1)+'$, $\\times 100='+dm_t(r2)+'$, $\\times 1000='+dm_t(r3)+'$; '+
           '$\\div 10='+dm_t(d1)+'$, $\\div 100='+dm_t(d2)+'$, $\\div 1000='+dm_t(d3)+'$',

// [дасгал 98 а] Мэдэгдэхгүй үржигдэхүүн, хуваагдагч, хуваагчийг ол
function g_dmFindBox(){
 var t=pick(['t1','t2','t3','t4']);
 var B=dm_rd(1,11,99);
 var C=(t==='t4')?dm_int(rnd(2,40)):dm_rd(1,11,99);
 var P=dm_mul(B,C), q, X;
 if(t==='t1'){ q='\\square\\div '+dm_t(B)+'='+dm_t(C); X=P; }
 else if(t==='t2'){ q=dm_t(P)+'\\div\\square='+dm_t(C); X=B; }
 else if(t==='t3'){ q='\\square\\times '+dm_t(B)+'='+dm_t(P); X=C; }
 else { q=dm_t(B)+'\\times\\square='+dm_t(P); X=C; }
 return {q:'$'+q+'$', a:'$\\square='+dm_t(X)+'$',
         key:'dfb-'+t+'-'+B.v+'-'+C.v+'-'+C.s, nv:dm_val(X)};
}
// [дасгал 87] Өгсөн тоонуудаас сонгож ноогдворыг гаргах
var DMCARD=[{v:2,s:0},{v:3,s:0},{v:4,s:0},{v:5,s:0},{v:6,s:0},{v:8,s:0},
            {v:12,s:1},{v:15,s:1},{v:24,s:1},{v:25,s:1},{v:32,s:1},{v:36,s:1},{v:45,s:1},{v:64,s:1}];
function g_dmCardsQuotient(){
 var T=pick([{v:3,s:1},{v:5,s:1},{v:8,s:1},{v:12,s:1},{v:16,s:1},{v:25,s:1},{v:2,s:0},{v:4,s:0}]);
 var B=pick(DMCARD), A=dm_mul(B,T);
 if(dm_val(A)>60 || dm_val(A)<0.1) return null;
 var cards=[A,B], i, j, tries=0;
 while(cards.length<6 && tries<80){ tries++;
  var c=pick(DMCARD), dup=false;
  for(i=0;i<cards.length;i++) if(dm_eq(cards[i],c)) dup=true;
  if(!dup) cards.push(c);
 }
 if(cards.length<6) return null;
 var cnt=0;
 for(i=0;i<6;i++) for(j=0;j<6;j++){
  if(i===j) continue;
  var Qd=dm_div(cards[i],cards[j]);
  if(Qd && dm_eq(Qd,T)) cnt++;
 }
 if(cnt!==1) return null;
 var sh=shuffle(cards);
 var lst=sh.map(function(c){return '$'+dm_t(c)+'$';}).join(', ');
 var srt=cards.map(function(c){return c.v+'_'+c.s;}).slice().sort().join('-');
 return {q:'Өгсөн тоонууд: '+lst+'. Эдгээрээс хоёрыг сонгож $\\square\\div\\square='+dm_t(T)+'$ тэнцэтгэлийг үнэн болго.',
         a:'$'+dm_t(A)+'\\div '+dm_t(B)+'='+dm_t(T)+'$',
         key:'dcq-'+T.v+'_'+T.s+'-'+srt, nv:dm_val(A)};
}
// [жишээ 1, дасгал 79] Тэгш өнцөгт шалны талбай
function g_dmWordFloor(){

 var S=dm_mul(L,W);
 return {q:'Ангийн шалыг хэмжихэд урт нь $'+dm_t(L)+'$ м, өргөн нь $'+dm_t(W)+'$ м байв. Шаланд хэдэн квадрат метр хулдаас хэрэгтэй вэ?',
         a:'$'+dm_t(L)+'\\times '+dm_t(W)+'='+dm_t(S)+'$ м$^2$',

}
// [дасгал 90] Тогтмол хурдаар өөр өөр хугацаанд явах зам
function g_dmWordSpeeds(){
 var V=dm_rd(1,405,995);
 var T=[dm_int(rnd(2,6)), {v:rnd(1,9),s:1}, {v:rnd(11,49),s:1}, {v:rnd(11,29),s:1}];
 var i,j;
 for(i=0;i<4;i++) for(j=i+1;j<4;j++) if(dm_eq(T[i],T[j])) return null;
 T=shuffle(T);
 var res=T.map(function(t){return dm_mul(V,t);});
 return {q:'Галт тэрэг цаг тутам $'+dm_t(V)+'$ км явдаг. $'+T.map(function(t){return dm_t(t);}).join('$ цаг, $')+'$ цаг тус бүрд хэдэн километр явах вэ?',
         a:'$'+res.map(function(x){return dm_t(x);}).join('$ км, $')+'$ км',
         key:'dwsp-'+V.v+'-'+T.map(function(t){return t.v+'_'+t.s;}).join('-'), nv:dm_val(res[0])};

// [дасгал 91, 96] Хоёр хэсэгт өөр хурдтай явсан замын нийт урт
var DMTRAVEL=['Мотоциклтой хүн','Автомашин','Ачааны машин','Аялагчдын автобус'];
function g_dmWordTwoLegs(){
 var V1=dm_rd(1,405,899), V2=dm_rd(1,405,899), h1=rnd(2,5), h2=rnd(2,5);

         key:'dwtl-'+V1.v+'-'+h1+'-'+V2.v+'-'+h2+'-'+W, nv:dm_val(tot)};

// [дасгал 97] Тэгш өнцөгтийг тэнцүү квадратуудаар бүрэх
function g_dmWordSquares(){
 var s=dm_rd(1,2,9), p=rnd(4,12), q=rnd(4,15);
 if(p===q) return null;
 if(q<p){ var tmp=p; p=q; q=tmp; }          // урт нь өргөнөөс заавал их байна
 var W=dm_mul(s,dm_int(p)), L=dm_mul(s,dm_int(q)), n=p*q;
 return {q:'Өргөн нь $'+dm_t(W)+'$ м, урт нь $'+dm_t(L)+'$ м байх тэгш өнцөгтийг $'+dm_t(s)+'$ м талтай хэчнээн квадратаар бүрэн бүрж болох вэ?',
         a:'өргөн дагуу $'+dm_t(W)+'\\div '+dm_t(s)+'='+p+'$, урт дагуу $'+dm_t(L)+'\\div '+dm_t(s)+'='+q+'$; нийт $'+p+'\\times '+q+'='+n+'$ квадрат',
         fig:figRect(dm_t(L),dm_t(W),'м'),
         key:'dwsq-'+s.v+'-'+p+'-'+q, nv:n};
}
// [дасгал 98 б] Хоёр алхамт тэнцэтгэлээс хоосон нүдийг ол
function g_dmTwoStepBox(){
 var t=pick(['t1','t2']), B=dm_rd(1,11,99), C=dm_rd(2,11,99), q, a, X;
 if(t==='t1'){
  var Q=dm_rd(2,101,999), Xv=dm_mul(Q,B), R=dm_sub(Q,C);
  if(R.v<=0) return null;
  q='\\square\\div '+dm_t(B)+'-'+dm_t(C)+'='+dm_t(R);
  a='$\\square\\div '+dm_t(B)+'='+dm_t(R)+'+'+dm_t(C)+'='+dm_t(Q)+'$; $\\square='+dm_t(Q)+'\\times '+dm_t(B)+'='+dm_t(Xv)+'$';
  X=Xv;
 } else {
  var X2=dm_rd(1,11,99), P=dm_mul(X2,B), R2=dm_add(P,C);
  q='\\square\\times '+dm_t(B)+'+'+dm_t(C)+'='+dm_t(R2);
  a='$\\square\\times '+dm_t(B)+'='+dm_t(R2)+'-'+dm_t(C)+'='+dm_t(P)+'$; $\\square='+dm_t(P)+'\\div '+dm_t(B)+'='+dm_t(X2)+'$';
  X=X2;
 }
 return {q:'$'+q+'$', a:a, key:'dtb-'+t+'-'+B.v+'-'+C.v+'-'+X.v+'-'+X.s, nv:dm_val(X)};
}
// [дасгал 96] Нийт зам ба дундаж хурд
function g_dmWordAvgSpeed(){
 var h1=rnd(2,5), h2=rnd(2,5), H=h1+h2;
 if(h1===h2) return null;                  // тэнцүү хугацаа бол дундаж нь энгийн дундаж болчихно
 var V1=dm_rd(1,405,899), V2=null, st=rnd(405,899), i, w;
 for(i=0;i<495;i++){                        // дундаж хурд яг гарах хоёр дахь хурдыг хайна
  w=405+((st-405+i)%495);

         key:'dwas-'+V1.v+'-'+h1+'-'+V2.v+'-'+h2, nv:dm_val(avg)};
}

// [дасгал 109] Нийлбэр нь өгсөн тоо байх хос тоонуудыг ол
function g_dmPairSum(){
 var mode=pick([1,10]), s=(mode===1?2:1);
 var used={}, pairs=[], dis=[], t=0, i;
 while(pairs.length<3 && t<200){ t++;
  var v=(mode===1)?rnd(9,91):rnd(12,88), c=100-v;
  if(v===c || used[v] || used[c]) continue;
  used[v]=1; used[c]=1; pairs.push([v,c]);
 }
 if(pairs.length<3) return null;
 t=0;
 while(dis.length<2 && t<200){ t++;
  var d=rnd(6,94);
  if(used[d] || used[100-d] || d===50) continue;
  used[d]=1; dis.push(d);
 }
 if(dis.length<2) return null;
 var all=[];
 for(i=0;i<3;i++){ all.push(pairs[i][0]); all.push(pairs[i][1]); }
 all=shuffle(all.concat(dis));
 var lst=all.map(function(x){return '$'+dFmt(x,s)+'$';}).join(', ');
 var ans=pairs.map(function(p){return '$'+dFmt(p[0],s)+'+'+dFmt(p[1],s)+'='+mode+'$';}).join('; ');
 return {q:'Өгсөн тоонууд: '+lst+'. Эдгээрээс нийлбэр нь $'+mode+'$ байх хос тоонуудыг ол.',
         a:ans, key:'dps-'+mode+'-'+all.slice().sort(function(x,y){return x-y;}).join('_'), nv:mode};
}

 var q2=dm_t(A2)+'-\\bigl('+dm_t(B2)+'-'+dm_t(C2)+'\\bigr)\\times '+dm_t(D2)+'+'+dm_t(E2);
 var a2='$'+dm_t(B2)+'-'+dm_t(C2)+'='+dm_t(df)+'$; $'+dm_t(df)+'\\times '+dm_t(D2)+'='+dm_t(pr2)+'$; $'+dm_t(A2)+'-'+dm_t(pr2)+'='+dm_t(rest)+'$; $'+dm_t(rest)+'+'+dm_t(E2)+'='+dm_t(V2)+'$';
 return {q:'$'+q2+'$', a:a2, key:'del-t2-'+df.v+'-'+D2.v+'-'+C2.v+'-'+rest.v+'-'+E2.v, nv:dm_val(V2)};
}
// [дасгал 104] Талыг өөрчлөхөд талбай хэрхэн өөрчлөгдөх вэ
function g_dmRectScale(){
 var a=rnd(2,6), b=rnd(2,6), t=pick(['t1','t2']);
 if(a===b) return null;
 var up, dn, q, a1;
 if(t==='t1'){ up=b; dn=a;
  q='Тэгш өнцөгтийн уртыг $'+a+'$ дахин багасгаад, өргөнийг $'+b+'$ дахин ихэсгэвэл талбай нь хэрхэн өөрчлөгдөх вэ?';
  a1='урт нь $x$, өргөн нь $y$ бол анхны талбай $xy$; шинэ талбай $\\dfrac{x}{'+a+'}\\times '+b+'y='+frTeX(b,a)+'xy$';
 } else { up=a; dn=b;
  q='Тэгш өнцөгтийн уртыг $'+a+'$ дахин ихэсгээд, өргөнийг $'+b+'$ дахин багасгавал талбай нь хэрхэн өөрчлөгдөх вэ?';
  a1='урт нь $x$, өргөн нь $y$ бол анхны талбай $xy$; шинэ талбай $'+a+'x\\times\\dfrac{y}{'+b+'}='+frTeX(a,b)+'xy$';
 }
 var txt=(up>dn) ? (' тул талбай $'+fMix(Fr(up,dn))+'$ дахин ихэснэ')
                 : (' тул талбай $'+fMix(Fr(dn,up))+'$ дахин багасна');
 return {q:q, a:a1+txt, key:'drs-'+t+'-'+a+'-'+b, nv:up/dn};
}
// ══════════ g6ch2.c.js — II БҮЛЭГ (2.7 ба 2.8 дэд сэдэв) ══════════
// Сурах бичгийн 40–45 хуудасны ДАСГАЛУУДЫН хэлбэрээр зохиогдсон.
// ЗАРЧИМ: тооцооллын бодлогод q нь ЗӨВХӨН илэрхийлэл. Заавар нь plan.json дахь task.label-д ганц удаа.
// g6core.js (rnd,pick,shuffle,gcd,lcm,Fr,fAdd,fSub,fMul,fDiv,fVal,fTex,fMix,frTeX ...) ба
// g6ch2.a.js (p10,dFmt,dFix,hUp,rd2,rd2s,figTbl,figDecLine,figRect,figStrip) энэ файлын ӨМНӨ залгагдана.
// ЭНД БАЙГАА ТУСЛАХУУД БҮГД "fr_" угтвартай, генераторууд "g_fr" угтвартай.

// ═══════════ ТУСЛАХ ФУНКЦУУД ═══════════
// Хураагаагүй бутархай (яг өгсөн хэлбэрээр)
function fr_raw(n,d){ return '\\dfrac{'+n+'}{'+d+'}'; }
// Хураагаагүй холимог бутархай (w=0 бол зөвхөн бутархай хэсэг)
function fr_rawMix(w,n,d){ return (w?''+w:'')+'\\dfrac{'+n+'}{'+d+'}'; }
// L тооны 2-оос эхлэх хуваагчид
function fr_divs(L){ var out=[],i; for(i=2;i<=L;i++) if(L%i===0) out.push(i); return out; }
// L хуваарьтай хүртвэрүүдийн ХБЕХ (хамгийн бага ерөнхий хуваарь)
function fr_cd(nums,L){ var LL=1,i; for(i=0;i<nums.length;i++) LL=lcm(LL,Fr(nums[i],L).d); return LL; }
// Харилцан анхны хос (a<b)
function fr_coPair(lo,hi){
 for(var t=0;t<80;t++){ var b=rnd(lo,hi), a=rnd(1,b-1); if(gcd(a,b)===1) return [a,b]; }
 return [1,lo];
}

// ═══════════ ЗУРГИЙН ТУСЛАХУУД (цэвэрхэн, хариу илчлэхгүй) ═══════════
// 0..W хүртэлх зурвас, нэгжийг den хэсэгт хуваасан, эхний sh хэсгийг будсан
function fr_figBar(W,den,sh){
 var Wd=324,x0=16,x1=Wd-16,y=10,h=26,n=W*den,u=(x1-x0)/n,g='',i;
 g+='<rect x="'+x0+'" y="'+y+'" width="'+(x1-x0)+'" height="'+h+'" fill="#fff" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<rect x="'+x0+'" y="'+y+'" width="'+(sh*u).toFixed(1)+'" height="'+h+'" fill="rgba(123,82,238,0.22)"/>';
 for(i=1;i<n;i++){ var xx=(x0+i*u).toFixed(1);
  g+='<line x1="'+xx+'" y1="'+y+'" x2="'+xx+'" y2="'+(y+h)+'" stroke="#7B52EE" stroke-width="'+((i%den===0)?'1.4':'0.6')+'"/>'; }
 for(i=0;i<=W;i++){ var X=(x0+i*den*u).toFixed(1);
  g+='<text x="'+X+'" y="'+(y+h+13)+'" font-size="9" text-anchor="middle" fill="#555">'+i+'</text>'; }
 return '<svg viewBox="0 0 '+Wd+' '+(y+h+18)+'" width="304">'+g+'</svg>';
}
// 0..W тооны шулуун, нэгжийг den хэсэгт хуваасан; pts=[{v:<den-ийн нэгжээр>,l:'A'}]
function fr_figLine(W,den,pts){
 var Wd=340,x0=20,x1=Wd-20,y=34,n=W*den,u=(x1-x0)/n,g='',i;
 g+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+x1+','+y+' '+(x1-6)+','+(y-3)+' '+(x1-6)+','+(y+3)+'" fill="#555"/>';
 for(i=0;i<=n;i++){ var big=(i%den===0), xx=(x0+i*u).toFixed(1);
  g+='<line x1="'+xx+'" y1="'+(y-(big?7:4))+'" x2="'+xx+'" y2="'+(y+(big?7:4))+'" stroke="#555" stroke-width="1"/>';
  if(big) g+='<text x="'+xx+'" y="'+(y+20)+'" font-size="9" text-anchor="middle" fill="#555">'+(i/den)+'</text>'; }
 for(i=0;i<pts.length;i++){ var X=(x0+pts[i].v*u).toFixed(1);
  g+='<circle cx="'+X+'" cy="'+y+'" r="3" fill="#dc2626"/>';
  g+='<text x="'+X+'" y="'+(y-11)+'" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">'+pts[i].l+'</text>'; }
 return '<svg viewBox="0 0 '+Wd+' '+(y+26)+'" width="316">'+g+'</svg>';
}

// ═════════════════ 2.7 Энгийн бутархайг хураах, жиших ═════════════════

// [дасгал 110, 111, 113] Зурвас дээрх будсан хэсгийг холимог бутархайгаар илэрхийлэх
function g_frStripMixed(){
 var den=pick([2,3,4,5,6,8,10,12]), W=rnd(2,4);
 var s=rnd(den+1,W*den-1);
 if(s%den===0) return null;
 var w=Math.floor(s/den), r=s%den;
 return {q:'', fig:fr_figBar(W,den,s),
  a:'$'+fr_rawMix(w,r,den)+'$ буюу $'+fr_raw(s,den)+'$',
  key:'fsm-'+den+'-'+W+'-'+s, nv:s/den};
}

// [дасгал 118 а] Засагдах бутархайг холимог бутархай болгох
function g_frImpToMix(){
 var d=rnd(3,16), w=rnd(1,9), r=rnd(1,d-1);
 if(gcd(r,d)!==1) return null;
 var n=w*d+r;
 return {q:'$'+fr_raw(n,d)+'$',
  a:'$'+n+'\\div '+d+'='+w+'$ (үлдэгдэл $'+r+'$) тул $'+fr_raw(n,d)+'='+fr_rawMix(w,r,d)+'$',
  key:'fi2m-'+n+'-'+d, nv:n/d};
}

// [дасгал 118 б] Холимог бутархайг засагдах бутархай болгох
function g_frMixToImp(){
 var d=rnd(3,16), w=rnd(2,10), r=rnd(1,d-1);
 if(gcd(r,d)!==1) return null;
 var n=w*d+r;
 return {q:'$'+fr_rawMix(w,r,d)+'$',
  a:'$'+fr_rawMix(w,r,d)+'=\\dfrac{'+w+'\\cdot '+d+'+'+r+'}{'+d+'}='+fr_raw(n,d)+'$',
  key:'fm2i-'+w+'-'+r+'-'+d, nv:n/d};
}

// [дасгал 117] Ногдворыг холимог бутархайгаар илэрхийлэх
function g_frDivMix(){
 var b=rnd(3,20), w=rnd(1,9), r=rnd(1,b-1), a=w*b+r;
 var F=Fr(a,b), s='$'+a+'\\div '+b+'='+fr_raw(a,b);
 if(gcd(a,b)>1) s+='='+fTex(F);
 s+='='+fMix(F)+'$';
 return {q:'$'+a+'\\div '+b+'$', a:s, key:'fdm-'+a+'-'+b, nv:a/b};
}

// [дасгал 115 а,б,в,г] Бутархайг хураах
function g_frReduce(){
 var pr=fr_coPair(3,15), p=pr[0], q0=pr[1], g=rnd(2,12);
 var n=p*g, d=q0*g;
 if(d>200) return null;
 return {q:'$'+fr_raw(n,d)+'$',
  a:'ХИЕХ$('+n+';'+d+')='+g+'$ тул $'+fr_raw(n,d)+'=\\dfrac{'+n+'\\div '+g+'}{'+d+'\\div '+g+'}='+fr_raw(p,q0)+'$',
  key:'fred-'+n+'-'+d, nv:p/q0};
}

// [дасгал 115 д,е,ж] Том тоотой бутархайг хураах
function g_frReduceHard(){
 var pr=fr_coPair(4,25), p=pr[0], q0=pr[1];
 var g=pick([8,9,11,12,13,14,15,16,18,20,21,22,24,25]);
 var n=p*g, d=q0*g;
 if(d<100||d>600) return null;
 return {q:'$'+fr_raw(n,d)+'$',
  a:'ХИЕХ$('+n+';'+d+')='+g+'$ тул $'+fr_raw(n,d)+'=\\dfrac{'+n+'\\div '+g+'}{'+d+'\\div '+g+'}='+fr_raw(p,q0)+'$',
  key:'frdh-'+n+'-'+d, nv:p/q0};
}

// [дасгал 114] Тэнцүү бутархайн хоосон нүдийг нөхөх
function g_frEquivFill(){
 var pr=fr_coPair(2,12), p=pr[0], q0=pr[1], k=rnd(2,12), m=rnd(0,3);
 var qs,as;
 if(m===0){      qs=fr_raw(p,q0)+'='+'\\dfrac{\\square}{'+(q0*k)+'}';      as=''+(p*k); }
 else if(m===1){ qs=fr_raw(p,q0)+'='+'\\dfrac{'+(p*k)+'}{\\square}';       as=''+(q0*k); }
 else if(m===2){ qs=fr_raw(p*k,q0*k)+'='+'\\dfrac{\\square}{'+q0+'}';      as=''+p; }
 else {          qs=fr_raw(p*k,q0*k)+'='+'\\dfrac{'+p+'}{\\square}';       as=''+q0; }
 return {q:'$'+qs+'$', a:'$\\square='+as+'$', key:'feqf-'+p+'-'+q0+'-'+k+'-'+m, nv:+as};
}

// [дасгал 124] Тэнцүү бутархайн гинжин хэлхээг нөхөх
function g_frEquivChain(){
 var pr=fr_coPair(3,12), p=pr[0], q0=pr[1];
 var cand=[], i;
 for(i=1;i<=42;i++) if(q0*i<=400) cand.push(i);
 if(cand.length<4) return null;
 var ks=shuffle(cand).slice(0,4);
 var terms=[fr_raw(p*ks[0],q0*ks[0])], ans=[];
 for(i=1;i<4;i++){
  if(rnd(0,1)===0){ terms.push('\\dfrac{\\square}{'+(q0*ks[i])+'}'); ans.push(p*ks[i]); }
  else            { terms.push('\\dfrac{'+(p*ks[i])+'}{\\square}');  ans.push(q0*ks[i]); }
 }
 return {q:'$'+terms.join('=')+'$',
  a:'Бүх бутархай $'+fr_raw(p,q0)+'$-тэй тэнцүү. Хоосон нүднүүд: $'+ans.join(';\\ ')+'$',
  key:'fech-'+p+'-'+q0+'-'+ks.join('_')};
}

// [дасгал 116] Өгсөн бутархайнуудаас хоорондоо тэнцүүг олох
function g_frEqualFind(){
 var pr=fr_coPair(3,10), p=pr[0], q0=pr[1];
 var k1=rnd(2,6), k2=rnd(2,6);
 if(k1===k2) return null;
 var list=[{n:p*k1,d:q0*k1},{n:p*k2,d:q0*k2}], seen={}, guard=0;
 seen[p+'/'+q0]=1;
 while(list.length<6 && guard++<300){
  var d=rnd(3,20), n=rnd(1,d-1), F=Fr(n,d), kk=F.n+'/'+F.d;
  if(seen[kk]) continue;
  seen[kk]=1; list.push({n:n,d:d});
 }
 if(list.length<6) return null;
 list=shuffle(list);
 var txt=list.map(function(x){return fr_raw(x.n,x.d);}).join(';\\ ');
 return {q:'$'+txt+'$',
  a:'$'+fr_raw(p*k1,q0*k1)+'='+fr_raw(p*k2,q0*k2)+'='+fr_raw(p,q0)+'$',
  key:'feqd-'+list.map(function(x){return x.n+'v'+x.d;}).join('_')};
}

// [Жишээ 3 а,б; дасгал 120 а,б] Ижил хуваарьтай эсвэл ижил хүртвэртэй бутархайг жиших
function g_frCmpSame(){
 var n1,d1,n2,d2,rel;
 if(rnd(0,1)===0){
  d1=rnd(4,20); d2=d1;
  n1=rnd(1,d1-1); n2=rnd(1,d1-1);
  if(n1===n2) return null;
  rel=(n1<n2)?'\\lt ':'\\gt ';
  return {q:'$'+fr_raw(n1,d1)+'\\ \\square\\ '+fr_raw(n2,d2)+'$',
   a:'Хуваарь ижил тул хүртвэрээр жишнэ: $'+fr_raw(n1,d1)+rel+fr_raw(n2,d2)+'$',
   key:'fcs-d'+d1+'-'+n1+'-'+n2};
 }
 n1=rnd(1,9); n2=n1;
 d1=rnd(n1+1,20); d2=rnd(n1+1,20);
 if(d1===d2) return null;
 rel=(d1>d2)?'\\lt ':'\\gt ';
 return {q:'$'+fr_raw(n1,d1)+'\\ \\square\\ '+fr_raw(n2,d2)+'$',
  a:'Хүртвэр ижил тул бага хуваарьтай нь их байна: $'+fr_raw(n1,d1)+rel+fr_raw(n2,d2)+'$',
  key:'fcn-n'+n1+'-'+d1+'-'+d2};
}

// [дасгал 120 в,г,д] Ерөнхий хуваарь ашиглан бутархайг жиших
function g_frCompare(){
 var d1,d2,n1,n2,L,A,B,t;
 for(t=0;t<60;t++){
  if(rnd(0,1)===0){ d2=rnd(3,15); d1=d2*rnd(2,9); }
  else { d1=rnd(3,18); d2=rnd(3,18); }
  if(d1===d2) continue;
  n1=rnd(1,d1-1); n2=rnd(1,d2-1);
  if(n1===n2) continue;
  if(gcd(n1,d1)!==1||gcd(n2,d2)!==1) continue;
  L=lcm(d1,d2);
  if(L>400) continue;
  A=n1*(L/d1); B=n2*(L/d2);
  if(A===B) continue;
  var rel=(A<B)?'\\lt ':'\\gt ';
  return {q:'$'+fr_raw(n1,d1)+'\\ \\square\\ '+fr_raw(n2,d2)+'$',
   a:'Ерөнхий хуваарь $'+L+'$: $'+fr_raw(A,L)+'$ ба $'+fr_raw(B,L)+'$ тул $'+fr_raw(n1,d1)+rel+fr_raw(n2,d2)+'$',
   key:'fcmp-'+n1+'v'+d1+'-'+n2+'v'+d2};
 }
 return null;
}

// [дасгал 120 е] Холимог бутархайг жиших
function g_frCmpMixed(){
 var w1=rnd(1,6), w2=(rnd(0,1)===0)?w1:rnd(1,6);
 var d1=rnd(2,12), n1=rnd(1,d1-1), d2=rnd(2,12), n2=rnd(1,d2-1);
 if(gcd(n1,d1)!==1||gcd(n2,d2)!==1) return null;
 var V1=Fr(w1*d1+n1,d1), V2=Fr(w2*d2+n2,d2);
 var c=V1.n*V2.d-V2.n*V1.d;
 if(c===0) return null;
 var rel=(c<0)?'\\lt ':'\\gt ';
 var t1=fr_rawMix(w1,n1,d1), t2=fr_rawMix(w2,n2,d2);
 var a;
 if(w1!==w2) a='Бүхэл хэсгүүд нь ялгаатай тул $'+t1+rel+t2+'$';
 else { var L=lcm(d1,d2);
  a='Бүхэл хэсэг тэнцүү тул бутархай хэсгийг жишнэ: $'+fr_raw(n1*(L/d1),L)+'$ ба $'+fr_raw(n2*(L/d2),L)+'$ тул $'+t1+rel+t2+'$'; }
 return {q:'$'+t1+'\\ \\square\\ '+t2+'$', a:a, key:'fcmx-'+w1+'v'+n1+'v'+d1+'-'+w2+'v'+n2+'v'+d2};
}

// [дасгал 119, 126] Бутархайг өсөх эрэмбээр бичих
function g_frOrderAsc(){
 var L=pick([8,12,16,18,20,24,30,36,40]);
 var top=(rnd(0,1)===0)?(L-1):(2*L);
 var nums=[], seen={}, guard=0;
 while(nums.length<5 && guard++<400){
  var v=rnd(1,top);
  if(seen[v]||v%L===0) continue;
  seen[v]=1; nums.push(v);
 }
 if(nums.length<5) return null;
 var sorted=nums.slice().sort(function(a,b){return a-b;});
 return {q:'$'+nums.map(function(v){return fTex(Fr(v,L));}).join(';\\ ')+'$',
  a:'Ерөнхий хуваарь $'+L+'$: $'+sorted.map(function(v){return fTex(Fr(v,L));}).join('\\lt ')+'$',
  key:'foa-'+L+'-'+nums.join('_')};
}

// [дасгал 112] Тооны шулуун дээрх цэгийн координатыг бутархайгаар бичих
function g_frNumLinePts(){
 var den=pick([2,3,4,5,6,8]), W=rnd(3,5), N=W*den;
 var idx=[], seen={}, guard=0;
 while(idx.length<3 && guard++<300){
  var v=rnd(1,N-1);
  if(seen[v]||v%den===0) continue;
  seen[v]=1; idx.push(v);
 }
 if(idx.length<3) return null;
 idx.sort(function(a,b){return a-b;});
 var LB=['A','B','C'];
 return {q:'', fig:fr_figLine(W,den,[{v:idx[0],l:'A'},{v:idx[1],l:'B'},{v:idx[2],l:'C'}]),
  a:idx.map(function(v,i){return '$'+LB[i]+'='+fMix(Fr(v,den))+'$';}).join('; '),
  key:'fnl-'+den+'-'+W+'-'+idx.join('_')};
}

// [хуудас 40 танилцуулга] Малын тоог энгийн бутархайгаар илэрхийлэх
var FR_HERD=[['ямаа','хонь'],['үхэр','адуу'],['хонь','тэмээ'],['адуу','ямаа'],['тэмээ','үхэр']];
function g_frWordHerd(){
 var pr=fr_coPair(3,12), p=pr[0], q0=pr[1], u=rnd(6,40);
 var A=p*u, B=(q0-p)*u, T=q0*u, an=pick(FR_HERD);
 return {q:'Малчны хотонд $'+A+'$ '+an[0]+', $'+B+'$ '+an[1]+' байв. Нийт малын хэдэн хэсэг нь '+an[0]+' болохыг энгийн бутархайгаар илэрхийл.',
  a:'Нийт $'+A+'+'+B+'='+T+'$ мал. Үүний $\\dfrac{'+A+'}{'+T+'}='+fr_raw(p,q0)+'$ хэсэг нь '+an[0],
  key:'fwh-'+A+'-'+B, nv:p/q0};
}

// [дасгал 122, 123] Ижил хэмжээнээс авсан хэсгийг жиших (үгэн бодлого)
var FR_SPEND=[
 {t:'Эгч дүү хоёр ижил хэмжээний мөнгөтэй байв. Эгч нь мөнгөнийхөө @1@ хэсгийг, дүү нь мөнгөнийхөө @2@ хэсгийг зарцуулжээ. Хэн нь илүү мөнгө зарцуулсан бэ?', a:'эгч', b:'дүү', more:true},
 {t:'Хоёр хөхүүрт ижил хэмжээний айраг байв. Эхний хөхүүрт байгаа айргийн @1@ хэсгийг, хоёр дахь хөхүүрт байгаа айргийн @2@ хэсгийг сувиллын газарт өгчээ. Аль хөхүүрт их айраг үлдсэн бэ?', a:'эхний хөхүүрт', b:'хоёр дахь хөхүүрт', more:false},
 {t:'Болд, Дулмаа хоёр ижил хуудастай ном уншив. Болд номынхоо @1@ хэсгийг, Дулмаа номынхоо @2@ хэсгийг уншжээ. Хэн нь илүү их уншсан бэ?', a:'Болд', b:'Дулмаа', more:true},
 {t:'Хоёр ижил талбайд ногоо тарив. Эхний талбайн @1@ хэсэгт, хоёр дахь талбайн @2@ хэсэгт төмс тарьжээ. Аль талбайд төмсний талбай бага байна вэ?', a:'эхний талбайд', b:'хоёр дахь талбайд', more:false}
];
function g_frWordSpend(){
 var d1,n1,d2,n2,L,A,B,t;
 for(t=0;t<60;t++){
  d1=rnd(9,20); n1=rnd(3,d1-1); d2=rnd(9,20); n2=rnd(3,d2-1);
  if(gcd(n1,d1)!==1||gcd(n2,d2)!==1) continue;
  if(d1===d2&&n1===n2) continue;
  L=lcm(d1,d2);
  if(L>400) continue;
  A=n1*(L/d1); B=n2*(L/d2);
  if(A===B) continue;
  var C=pick(FR_SPEND), first=(A>B);
  var who=(C.more===first)?C.a:C.b;
  return {q:C.t.replace('@1@','$'+fr_raw(n1,d1)+'$').replace('@2@','$'+fr_raw(n2,d2)+'$'),
   a:'Ерөнхий хуваарь $'+L+'$: $'+fr_raw(A,L)+'$ ба $'+fr_raw(B,L)+'$ тул $'+fr_raw(n1,d1)+(A<B?'\\lt ':'\\gt ')+fr_raw(n2,d2)+'$. Хариу: '+who,
   key:'fws-'+n1+'v'+d1+'-'+n2+'v'+d2+'-'+FR_SPEND.indexOf(C)};
 }
 return null;
}

// [дасгал 127] Гүйсэн хугацааг жишиж, байр эзлүүлэх
var FR_NAMES=['Амар','Бат','Гэрэл','Дэлгэр','Энхээ','Насан','Оюун','Сараа','Төмөр','Уянга','Ганбат','Мөнхөө'];
function g_frRunRank(){
 var L=pick([12,20,24,30,60]);
 var nums=[], seen={}, guard=0;
 while(nums.length<5 && guard++<400){
  var v=rnd(2,L-1);
  if(seen[v]) continue;
  seen[v]=1; nums.push(v);
 }
 if(nums.length<5) return null;
 var nm=shuffle(FR_NAMES).slice(0,5);
 var arr=nm.map(function(x,i){return {nm:x,v:nums[i]};});
 var srt=arr.slice().sort(function(a,b){return a.v-b.v;});
 return {q:'$5$ сурагчийн гүйж туулсан хугацаа: '+arr.map(function(x){return x.nm+' $'+fTex(Fr(x.v,L))+'$ мин';}).join(', ')+'.',
  a:'Ерөнхий хуваарь $'+L+'$. Байр: '+srt.map(function(x,i){return (i+1)+'. '+x.nm+' $'+fTex(Fr(x.v,L))+'$';}).join('; '),
  key:'frr-'+L+'-'+nums.join('_')};
}

function g_frWordVeg(){

  LL=lcm(lcm(d1,d2),d3);

}

// [дасгал 140] Гурвалжны периметр
function g_frTriPerim(){

 for(t=0;t<80;t++){

  a:'Гурав дахь тал: $'+fTex(Fr(A,L))+'-'+fTex(Fr(D,L))+'='+fMix(Fr(C,L))+'$ '+un+'. Периметр: $'+fr_raw(aa,LL)+'+'+fr_raw(bb,LL)+'+'+fr_raw(cc,LL)+'='+Ptail+'$ '+un,
  key:'ftp-'+L+'-'+A+'-'+B+'-'+D, nv:fVal(P)};
}

// [дасгал 141] Тэгш өнцөгтийн периметр
function g_frRectPerim(){
 var L=pick([10,12,15,20,24,30]);
 var W=rnd(2,2*L), D=rnd(1,L), LN=W+D;
 if(W%L===0||D%L===0) return null;
 var P=Fr(2*(W+LN),L), un=pick(['м','дм','см']);
 var LL=fr_cd([W,LN],L), ww=W*LL/L, ll=LN*LL/L;
 var Ptot=fr_raw(2*(ww+ll),LL), Pmix=fMix(P), Ptail=(Ptot===Pmix)?Ptot:(Ptot+'='+Pmix);
 return {q:'Тэгш өнцөгтийн өргөн нь $'+fTex(Fr(W,L))+'$ '+un+' бөгөөд уртаасаа $'+fTex(Fr(D,L))+'$ '+un+'-ээр богино байв. Тэгш өнцөгтийн периметрийг ол.',
  a:'Урт: $'+fTex(Fr(W,L))+'+'+fTex(Fr(D,L))+'='+fMix(Fr(LN,L))+'$ '+un+'. Периметр: $2\\cdot\\bigl('+fr_raw(ww,LL)+'+'+fr_raw(ll,LL)+'\\bigr)='+Ptail+'$ '+un,
  key:'frp-'+L+'-'+W+'-'+D, nv:fVal(P)};
}

// [дасгал 143, 144] Хамтарсан ажлын хугацаа (нэгж хугацааны хэсгийг нэмэх)
var FR_WORK=[
 {t:'Усан санг $A$ цоргоор @1@ минутад, $B$ цоргоор @2@ минутад дүүргэдэг байжээ. Хоёр цоргыг зэрэг ажиллуулбал усан санг ямар хугацаанд дүүргэх вэ?', u:'усан сан'},
 {t:'Тодорхой хэмжээтэй ханыг ах нь ганцаараа @1@ минутад, дүү нь ганцаараа @2@ минутад будаж дуусгадаг. Тэд хамтдаа будвал ямар хугацаанд дуусгах вэ?', u:'хана'},
 {t:'Нэг хэсэг ажлыг эхний машин @1@ минутад, хоёр дахь машин @2@ минутад гүйцэтгэдэг. Хоёр машин хамт ажиллавал уг ажлыг ямар хугацаанд гүйцэтгэх вэ?', u:'ажил'}
];
function g_frTaps(){
 var T=pick([4,6,8,10,12,15,20,24]), dv=[], i;
 // d1<T: a=T+d1 ба b=T+T^2/d1 нь ЗААВАЛ ялгаатай (d1=T бол a=b болно);
 // b<=240 нөхцөлийг сонголтын үедээ шүүнэ — null буцаахгүй.
 for(i=1;i<T;i++) if((T*T)%i===0 && T+(T*T)/i<=240) dv.push(i);
 if(!dv.length) return null;
 var d1=pick(dv), a=T+d1, b=T+(T*T)/d1;
 var C=pick(FR_WORK), Lc=lcm(a,b);
 return {q:C.t.replace('@1@','$'+a+'$').replace('@2@','$'+b+'$'),
  a:'$1$ минутад $\\dfrac{1}{'+a+'}+\\dfrac{1}{'+b+'}=\\dfrac{'+(Lc/a)+'}{'+Lc+'}+\\dfrac{'+(Lc/b)+'}{'+Lc+'}=\\dfrac{'+(Lc/a+Lc/b)+'}{'+Lc+'}=\\dfrac{1}{'+T+'}$ хэсэг гүйцэтгэнэ. Тиймээс $'+T+'$ минут.',
  key:'ftap-'+a+'-'+b+'-'+FR_WORK.indexOf(C), nv:T};
}

// 2.9 Энгийн бутархайн үржүүлэх үйлдэл (46–48), 2.10 Энгийн бутархайн хуваах үйлдэл (49–50).
// g6core.js + g6ch2.a.js доторх туслахууд (rnd,pick,Fr,fAdd,fSub,fMul,fTex,fMix,frTeX,gcd,figTbl,figStrip ...)
// энэ файлын ӨМНӨ залгагдана — дахин тодорхойлохгүй.

// ═══════════ ТУСЛАХУУД (fd_ угтвартай) ═══════════
function fd_f(n,d){ return '\\dfrac{'+n+'}{'+d+'}'; }
function fd_m(w,n,d){ if(!w) return fd_f(n,d); if(!n) return ''+w; return w+fd_f(n,d); }
// Санамсаргүй жинхэнэ (proper), ХУРААГДСАН бутархай
function fd_prop(dlo,dhi){ var d,n,g=0; do{ d=rnd(dlo,dhi); n=rnd(1,d-1); g++; }while(gcd(n,d)!==1&&g<60); return {n:n,d:d}; }
// Санамсаргүй холимог тоо (бутархай хэсэг нь хураагдсан): N = w*d+n
function fd_mixed(wlo,whi,dlo,dhi){ var p=fd_prop(dlo,dhi), w=rnd(wlo,whi); return {w:w,n:p.n,d:p.d,N:w*p.d+p.n,f:Fr(w*p.d+p.n,p.d)}; }
// Хуваарийг өгсөн жагсаалтаас сонгосон холимог тоо
function fd_mixD(wlo,whi,ds){ var d,n,g=0; do{ d=pick(ds); n=rnd(1,d-1); g++; }while(gcd(n,d)!==1&&g<60); var w=rnd(wlo,whi); return {w:w,n:n,d:d,N:w*d+n,f:Fr(w*d+n,d)}; }
// n/d-ийн урвуу тоо (хүртвэр нь 1 бол бүхэл тоогоор)
function fd_rec(n,d){ return n===1?''+d:fd_f(d,n); }
// N/D-г хураасан хэлбэрээр нэмж бичих (ижил бол хоосон)
function fd_red(N,D,mix){ var raw=fd_f(N,D), fr=Fr(N,D), red=mix?fMix(fr):fTex(fr); return raw===red?'':'='+red; }

// [дасгал 150 а, б] Жинхэнэ бутархайг жинхэнэ бутархайгаар үржүүлэх
function g_fdMulProper(){

  a:'$'+ex+'='+fd_f(x.n+'\\times '+y.n, x.d+'\\times '+y.d)+'='+fd_f(N,D)+fd_red(N,D,false)+'$',
  nv:fVal(r), key:'fdmp-'+x.n+'-'+x.d+'-'+y.n+'-'+y.d};

 var st=o?fd_f('1\\times '+y.n, m+'\\times '+y.d):fd_f(y.n+'\\times 1', y.d+'\\times '+m);
 var N=y.n, D=m*y.d, r=Fr(N,D);
 return {q:'$'+ex+'$', a:'$'+ex+'='+st+'='+fd_f(N,D)+fd_red(N,D,false)+'$', nv:fVal(r),

 var a='$'+mt+'\\times '+n+'='+fd_f(M.N,M.d)+'\\times '+n+'='+fd_f(M.N+'\\times '+n,M.d)+'='+fd_f(N,M.d)+fd_red(N,M.d,true)+'$';

function g_fdDivChain(){

 var k2=rnd(1, Math.floor((A-1)/q2));

 return {q:'$'+n1+'\\div'+fd_f(p,q1)+'-'+n2+'\\div'+fd_f(r,q2)+'$',
  a:'$'+n1+'\\div'+fd_f(p,q1)+'='+n1+'\\times'+fd_f(q1,p)+'='+A+'$, $'+n2+'\\div'+fd_f(r,q2)+'='+n2+'\\times'+fd_f(q2,r)+'='+B+'$, $'+A+'-'+B+'='+val+'$',
  nv:val, key:'fddch-'+n1+'-'+p+'-'+q1+'-'+n2+'-'+r+'-'+q2};
}

// ═══════════ ТУСЛАХУУД (pc_ угтвартай) ═══════════
var PC_NAMES = ['Туяа', 'Дулмаа', 'Сараа', 'Оюун', 'Хулан', 'Наран', 'Сувд', 'Энхжин', 'Мөнхзул', 'Ариунаа'];
function pc_name() { return pick(PC_NAMES); }

// Будсан нүдтэй тор (r мөр × c багана, эхний k нүд будсан). Хариуг илчилдэггүй — асуулт нь энэ зураг өөрөө.
function pc_figGrid(r, c, k) {
 var s = (r >= 8 || c >= 8) ? 13 : 18, W = c * s + 4, H = r * s + 4, g = '', i, j, n = 0;
 for (i = 0; i < r; i++) for (j = 0; j < c; j++) {
  n++;
  g += '<rect x="' + (2 + j * s) + '" y="' + (2 + i * s) + '" width="' + s + '" height="' + s + '" fill="'
    + (n <= k ? 'rgba(123,82,238,0.42)' : '#fff') + '" stroke="#7B52EE" stroke-width="1"/>';
 }
 var wd = Math.min(Math.round(W * 1.05), 200);
 return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + wd + '">' + g + '</svg>';
}

// [дасгал 179] Энгийн бутархайг процентоор илэрхийлэх
var PC_DEN = [4, 5, 8, 10, 12, 16, 20, 24, 25, 32, 40, 50, 60, 80, 125, 200, 250, 300, 400, 500];
function g_pcFrToPercent() {
 var b = pick(PC_DEN), m = b / gcd(b, 10000), tmax = Math.floor((b - 1) / m);
 if (tmax < 1) return null;
 var a = m * rnd(1, tmax), hp = a * 10000 / b;             // hp = хувь·100
 return {
  q: '$\\dfrac{' + a + '}{' + b + '}$',
  a: '$\\dfrac{' + a + '}{' + b + '}\\cdot 100\\%=' + dFmt(hp, 2) + '\\%$',
  key: 'f2p-' + a + '-' + b, nv: hp / 100
 };
}

// [дасгал 180] Аравтын бутархайг процентоор илэрхийлэх
function g_pcDecToPercent() {
 var sc = pick([1, 2, 2, 3, 3]), v;
 if (sc === 1) v = rnd(1, 39); else if (sc === 2) v = rnd(2, 399); else v = rnd(2, 3999);
 if (v % 10 === 0) v++;
 var pt = v * p10(3 - sc);                                 // pt = хувь·10
 return {
  q: '$' + dFmt(v, sc) + '$',
  a: '$' + dFmt(v, sc) + '\\cdot 100\\%=' + dFmt(pt, 1) + '\\%$',
  key: 'd2p-' + sc + '-' + v, nv: pt / 10
 };
}

// [дасгал 181] Процентыг энгийн бутархайгаар илэрхийлэх
function g_pcToFraction() {
 var pt;
 if (rnd(1, 4) === 1) pt = rnd(1, 39) * 10 + 5;            // 1.5% ... 39.5%
 else { do { pt = rnd(2, 199) * 10; } while (pt % 1000 === 0); }
 var fr = Fr(pt, 1000);
 if (pt % 10 === 0) {
  var P0 = pt / 10, red = (gcd(P0, 100) > 1);                // хураагдахгүй бол давхар алхам бичихгүй
  return {
   q: '$' + P0 + '\\%$',
   a: '$' + P0 + '\\%=\\dfrac{' + P0 + '}{100}' + (red ? '=' + fTex(fr) : '') + '$',
   key: 'p2f-' + pt, nv: pt / 1000
  };
 }
 return {
  q: '$' + dFmt(pt, 1) + '\\%$',
  a: '$' + dFmt(pt, 1) + '\\%=\\dfrac{' + pt + '}{1000}=' + fTex(fr) + '$',
  key: 'p2f-' + pt, nv: pt / 1000
 };
}

// [дасгал 182] Процентыг аравтын бутархайгаар илэрхийлэх
function g_pcToDecimal() {
 var pt;
 if (rnd(1, 3) === 1) { pt = rnd(2, 199); if (pt % 10 === 0) pt++; }
 else pt = rnd(1, 199) * 10;
 return {
  q: '$' + dFmt(pt, 1) + '\\%$',
  a: '$' + dFmt(pt, 1) + '\\%=' + dFmt(pt, 1) + '\\div 100=' + dFmt(pt, 3) + '$',
  key: 'p2d-' + pt, nv: pt / 1000
 };
}

function g_pcGridShade() {

// [дасгал 178, давтах 12] Энгийн бутархай — аравтын бутархай — процентын харгалзаа
var PC_DEN2 = [4, 5, 8, 10, 16, 20, 25, 40, 50, 100, 125, 200, 250, 500];
function g_pcTriple() {
 var b = pick(PC_DEN2), m = b / gcd(b, 10000), tmax = Math.floor((b - 1) / m);
 if (tmax < 1) return null;
 var a = m * rnd(1, tmax), hp = a * 10000 / b;
 var frT = fTex(Fr(a, b)), decT = dFmt(hp, 4), pcT = dFmt(hp, 2);
 var t = pick(['fr', 'dec', 'pc']);
 if (t === 'fr') return {
  q: '$' + frT + '$', a: 'Аравтын бутархай $' + decT + '$, процент $' + pcT + '\\%$',
  key: 'tt-fr-' + hp, nv: hp / 100

}

// Сурах бичгийн 23–54 хуудасны дасгалуудын (ялангуяа одтой дасгал ба 53–54-ийн "Давтах",
// "Өөрийгөө сориорой" хэсгийн) хэлбэрээр зохиогдсон. БҮХ бодлого hard түвшин.
// g6core.js ба g6ch2.a.js доторх туслахууд (rnd, pick, gcd, lcm, Fr, fAdd, fSub, fMul, fDiv,
// fVal, fMix, frTeX, dFmt, dFix, p10 ...) энэ файлын өмнө залгагдана — дахин тодорхойлохгүй.

// ═══ 2.12 Сонгон судлах — хүнд даалгавар ═══

var EB_NAMES = ['Болд', 'Дорж', 'Сараа', 'Батаа', 'Оюун', 'Ганаа', 'Мөнхөө', 'Цэцгээ'];

// 10-д хуваагдахгүй санамсаргүй бүхэл (аравтын бутархайн сүүлийн орон 0 болохоос сэргийлнэ)
function eb_nz10(lo, hi){ var v; for(var i=0;i<40;i++){ v=rnd(lo,hi); if(v%10!==0) return v; } return lo+1; }
// хуваарь нь qArr-аас, хүртвэр нь харилцан анхны жинхэнэ бутархай
function eb_proper(qArr){
 for(var i=0;i<80;i++){ var q=pick(qArr), p=rnd(1,q-1); if(gcd(p,q)===1) return [p,q]; }
 return [1,pick(qArr)];
}

// [дасгал 1, 2 (Давтах, 53)] Талбайг яг тооцоолж, тоймлосон талуудаар олсонтой жиших
function g_ebRoundEstimate(){
 var A=rnd(205,995), B=rnd(205,995);
 if(A%10===0) A++;
 if(B%10===0) B++;
 if(A===B) return null;
 var P=A*B;                                    // талбай, 10^{-4}
 var Ar=Math.floor((A+50)/100), Br=Math.floor((B+50)/100);
 var Pa=Ar*Br;                                 // ойролцоо талбай (бүхэл)
 var d=Math.abs(P-Pa*10000);
 if(d===0) return null;
 return {q:'Тэгш өнцөгтийн талууд $'+dFmt(A,2)+'$ см ба $'+dFmt(B,2)+'$ см байв. Талбайг яг тооцоолоод, дараа нь тал бүрийг бүхэл тоо болгон тоймлож талбайг ойролцоогоор ол. Хоёр үр дүнгийн зөрөөг олоорой.',
  a:'Яг талбай нь $'+dFmt(A,2)+'\\cdot '+dFmt(B,2)+'='+dFmt(P,4)+'$ см$^2$. Талуудыг тоймловол $'+Ar+'$ см ба $'+Br+'$ см тул ойролцоо талбай нь $'+Ar+'\\cdot '+Br+'='+Pa+'$ см$^2$. Зөрөө нь $'+dFmt(d,4)+'$ см$^2$.',
  key:'ebre-'+A+'-'+B, nv:P/10000};
}

// [дасгал 10 (Өөрийгөө сориорой, 54), 104 (39)] Талын хувь ба дахин өөрчлөлт — талбайн хувь
function g_ebRectPercent(){
 var p, k, i;
 for(i=0;i<60;i++){ p=pick([20,25,40,50,60,75,80]); k=pick([2,3,4]); if(((100+p)*10)%k===0) break; }
 if(i>=60) return null;
 var L=rnd(1,10)*20, W=k*rnd(2,9);
 var L2=L*(100+p)/100, W2=W/k;
 if(L2!==Math.round(L2)) return null;
 var A1=L*W, A2=L2*W2;
 var pt=(100+p)*10/k;                          // шинэ талбай нь анхныхаас хэдэн хувь (аравт)
 return {q:'Тэгш өнцөгтийн урт $'+L+'$ м, өргөн $'+W+'$ м байв. Уртыг нь $'+p+'\\%$-оор ихэсгэж, өргөнийг нь $'+k+'$ дахин багасгав. Шинэ талбайг олоод, тэр нь анхны талбайн хэдэн хувь болохыг тодорхойл.',
  a:'Шинэ урт нь $'+L+'\\cdot\\dfrac{'+(100+p)+'}{100}='+L2+'$ м, шинэ өргөн нь $'+W+'\\div '+k+'='+W2+'$ м. Анхны талбай $'+A1+'$ м$^2$, шинэ талбай $'+A2+'$ м$^2$. $'+A2+'\\div '+A1+'='+dFmt(pt,3)+'$ буюу $'+dFmt(pt,1)+'\\%$ тул талбай нь $'+dFmt(1000-pt,1)+'\\%$-оор багассан.',
  key:'ebrp-'+p+'-'+k+'-'+L+'-'+W, nv:A2};
}

// [дасгал 106 (39), 11 (Давтах, 53), 1 (Өөрийгөө сориорой, 54)] Хуваарилах хууль — хялбар аргаар
function g_ebDistrib(){
 var As=eb_nz10(12,98);
 var S=rnd(3,12), d, lo, hi, b, c, i;
 for(i=0;i<80;i++){
  d=rnd(105,495);
  if(d%100===0) continue;
  lo=Math.max(105,S*100+d-995); hi=Math.min(995,S*100+d-105);
  if(lo>hi) continue;
  b=rnd(lo,hi); c=S*100+d-b;
  if(b%100===0||c%100===0||b===c) continue;
  break;
 }
 if(i>=80) return null;
 return {q:'$'+dFmt(As,1)+'\\cdot '+dFmt(b,2)+'+'+dFmt(As,1)+'\\cdot '+dFmt(c,2)+'-'+dFmt(As,1)+'\\cdot '+dFmt(d,2)+'$',
  a:'$'+dFmt(As,1)+'\\cdot\\bigl('+dFmt(b,2)+'+'+dFmt(c,2)+'-'+dFmt(d,2)+'\\bigr)='+dFmt(As,1)+'\\cdot '+S+'='+dFmt(As*S,1)+'$',
  key:'ebds-'+As+'-'+b+'-'+c+'-'+d, nv:As*S/10};
}

// [дасгал 105 (39), 13 (Давтах, 53)] Үйлдлийн дараалал — олон алхамт аравтын илэрхийлэл
function g_ebOrderOps(){
 var Cs=eb_nz10(21,99);
 var Q=rnd(2,9), Bs=Cs*Q;
 var As=rnd(Q*10+11,600), Rs=As-Q*10;
 var Ds=eb_nz10(15,95);
 var Es=rnd(51,999);
 var Th=Rs*Ds+Es*10;
 return {q:'$\\bigl('+dFmt(As,1)+'-'+dFmt(Bs,1)+'\\div '+dFmt(Cs,1)+'\\bigr)\\cdot '+dFmt(Ds,1)+'+'+dFmt(Es,1)+'$',
  a:'$'+dFmt(Bs,1)+'\\div '+dFmt(Cs,1)+'='+Q+'$; $'+dFmt(As,1)+'-'+Q+'='+dFmt(Rs,1)+'$; $'+dFmt(Rs,1)+'\\cdot '+dFmt(Ds,1)+'='+dFmt(Rs*Ds,2)+'$; $'+dFmt(Rs*Ds,2)+'+'+dFmt(Es,1)+'='+dFmt(Th,2)+'$',
  key:'ebop-'+As+'-'+Bs+'-'+Cs+'-'+Ds+'-'+Es, nv:Th/100};
}

// [дасгал 103 (39)] Санасан тоог урвуу үйлдлээр олох
function g_ebThinkNumber(){
 var xs=eb_nz10(11,99);
 var k=rnd(3,9), d=rnd(2,5), a0=rnd(11,99);
 var as=a0+((d-((k*xs+a0)%d))%d);
 var RD=k*xs+as, R=RD/d;
 if(R!==Math.round(R)) return null;
 var nm=pick(EB_NAMES);
 return {q:nm+' нэг тоо санажээ. Тэр тоог $'+k+'$ дахин ихэсгээд, $'+dFmt(as,1)+'$-г нэмж, гарсан үр дүнг $'+d+'$-т хуваахад $'+dFmt(R,1)+'$ гарав. '+nm+' ямар тоо санасан бэ?',
  a:'Урвуу үйлдэл хийвэл $'+dFmt(R,1)+'\\cdot '+d+'='+dFmt(RD,1)+'$, дараа нь $'+dFmt(RD,1)+'-'+dFmt(as,1)+'='+dFmt(k*xs,1)+'$, эцэст нь $'+dFmt(k*xs,1)+'\\div '+k+'='+dFmt(xs,1)+'$',
  key:'ebtn-'+xs+'-'+k+'-'+d+'-'+as, nv:xs/10};
}

// [дасгал 72в (35)] Хоёр тооны дундаж ба "хэд дахин бага" нөхцөл
function g_ebAvgRatio(){
 var k=rnd(2,6), xs, sum, i;
 for(i=0;i<80;i++){
  xs=eb_nz10(105,995);
  sum=xs*(k+1);
  if(sum%2===0) break;
 }
 if(i>=80) return null;
 var M=sum/2, big=k*xs;
 return {q:'Хоёр тооны арифметик дундаж нь $'+dFmt(M,2)+'$ байв. Тэдгээрийн нэг нь нөгөөгөөсөө $'+k+'$ дахин бага бол хоёр тоог ол.',
  a:'Нийлбэр нь $'+dFmt(M,2)+'\\cdot 2='+dFmt(sum,2)+'$. Бага тоог $x$ гэвэл $x+'+k+'x='+dFmt(sum,2)+'$ тул $x='+dFmt(sum,2)+'\\div '+(k+1)+'='+dFmt(xs,2)+'$, их тоо нь $'+k+'\\cdot '+dFmt(xs,2)+'='+dFmt(big,2)+'$',
  key:'ebar-'+k+'-'+xs, nv:big/100};
}

// [дасгал 160 (48), 4 (Давтах, 53)] Үлдсэн хэсгээс дахин хэсэг авах — гинжин бодлого
function g_ebFracRemain(){
 var f1=eb_proper([4,5,8,10,12,20]), p1=f1[0], q1=f1[1];
 var f2=eb_proper([3,4,5,6,7,8,9,11]), p2=f2[0], q2=f2[1];
 var base=q1*q2;
 var lo=Math.ceil(200/base), hi=Math.floor(1200/base);
 if(lo>hi) return null;
 var N=base*rnd(lo,hi);
 var novel=N*p1/q1, rest=N-novel;
 var essay=rest*p2/q2, poem=rest-essay;
 if(poem<=0||essay<=0) return null;
 return {q:'Ном $'+N+'$ хуудастай. Нийт хуудасныхаа $'+frTeX(p1,q1)+'$-д нь тууж, үлдсэн хуудасныхаа $'+frTeX(p2,q2)+'$-д нь өгүүлэл, бусад хуудсанд нь шүлэг хэвлэгджээ. Хэдэн хуудсанд шүлэг байгаа вэ? Энэ нь номын нийт хуудасны ямар хэсэг вэ?',
  a:'Тууж $'+N+'\\cdot '+frTeX(p1,q1)+'='+novel+'$ хуудас эзэлсэн тул үлдсэн нь $'+N+'-'+novel+'='+rest+'$ хуудас. Өгүүлэл $'+rest+'\\cdot '+frTeX(p2,q2)+'='+essay+'$ хуудас. Шүлэг $'+rest+'-'+essay+'='+poem+'$ хуудас буюу нийт хуудасны $'+frTeX(poem,N)+'$ хэсэг.',
  key:'ebfr-'+p1+'-'+q1+'-'+p2+'-'+q2+'-'+N, nv:poem};
}

// [дасгал 157 (48), 138 (45)] Гурван хэсэг ба үлдэгдлийг олох
function g_ebTreeMix(){
 var D=pick([10,12,15,20,24,25]);
 var n1, n2, n3, rest, i;
 for(i=0;i<80;i++){
  n1=rnd(1,D-4); n2=rnd(1,D-3-n1); n3=rnd(1,D-2-n1-n2);
  rest=D-n1-n2-n3;
  if(rest<1) continue;
  if(n1===n2||n2===n3||n1===n3) continue;
  break;
 }
 if(i>=80) return null;
 var lo=Math.ceil(300/D), hi=Math.floor(1500/D);
 if(lo>hi) return null;
 var N=D*rnd(lo,hi);
 var c1=N*n1/D, c2=N*n2/D, c3=N*n3/D, c4=N*rest/D;
 return {q:'Залуучууд $'+N+'$ мод суулгажээ. Үүний $'+frTeX(n1,D)+'$ нь нарс, $'+frTeX(n2,D)+'$ нь гацуур, $'+frTeX(n3,D)+'$ нь улиас, бусад нь хус байв. Тэд хэдэн хус мод суулгасан бэ?',
  a:'Нарс $'+N+'\\cdot '+frTeX(n1,D)+'='+c1+'$, гацуур $'+N+'\\cdot '+frTeX(n2,D)+'='+c2+'$, улиас $'+N+'\\cdot '+frTeX(n3,D)+'='+c3+'$ ширхэг. Хус нь $'+N+'-\\bigl('+c1+'+'+c2+'+'+c3+'\\bigr)='+c4+'$ ширхэг буюу нийтийн $'+frTeX(rest,D)+'$ хэсэг.',
  key:'ebtm-'+D+'-'+n1+'-'+n2+'-'+n3+'-'+N, nv:c4};
}

// [дасгал 162* (48)] Хоёр саван дахь хөх бөмбөлгийн тоо тэнцүү — харьцаа сэргээх
function g_ebTwoBoxes(){
 var a, b, c, d, u, v, g, st, n, A, B, T, i, ok=false;
 for(i=0;i<120;i++){
  var f1=eb_proper([3,4,5,6,7,8]), f2=eb_proper([3,4,5,6,7,8]);
  a=f1[0]; b=f1[1]; c=f2[0]; d=f2[1];
  if(a*d===c*b) continue;
  u=b*(d-c); v=d*(b-a); g=gcd(u,v); u/=g; v/=g;
  st=lcm(b/gcd(u,b), d/gcd(v,d));
  var nmax=Math.floor(420/((u+v)*st));
  if(nmax<1) continue;
  n=st*rnd(1,Math.min(4,nmax));
  A=u*n; B=v*n; T=A+B;
  if(T<40||T>420) continue;
  if(A%b!==0||B%d!==0) continue;
  ok=true; break;
 }
 if(!ok) return null;
 var redA=A*a/b, redB=B*c/d;
 if(A-redA!==B-redB) return null;
 return {q:'А ба Б саванд нийт $'+T+'$ ширхэг бөмбөлөг байв. А сав дахь бөмбөлгийн $'+frTeX(a,b)+'$ нь улаан, бусад нь хөх; Б сав дахь бөмбөлгийн $'+frTeX(c,d)+'$ нь улаан, бусад нь хөх бөмбөлөг байжээ. А ба Б савны хөх бөмбөлгийн тоо тэнцүү байсан бол нийт хэчнээн улаан бөмбөлөг байсан бэ?',
  a:'А савны бөмбөлгийн $'+frTeX(b-a,b)+'$ нь, Б савных $'+frTeX(d-c,d)+'$ нь хөх. Эдгээр тоо тэнцүү тул А ба Б савны бөмбөлгийн харьцаа $'+u+':'+v+'$ болно. Нэг хэсэг нь $'+T+'\\div '+(u+v)+'='+n+'$ тул А саванд $'+A+'$, Б саванд $'+B+'$ бөмбөлөг байна. Улаан бөмбөлөг $'+A+'\\cdot '+frTeX(a,b)+'+'+B+'\\cdot '+frTeX(c,d)+'='+redA+'+'+redB+'='+(redA+redB)+'$ ширхэг.',
  key:'ebtb-'+a+'-'+b+'-'+c+'-'+d+'-'+n, nv:redA+redB};
}

// [дасгал 143, 144 (45)] Хамтын ажлын хугацаа — бутархайн хуваах үйлдэл
function g_ebTaps(){
 var arr=[10,12,15,18,20,24,30,36,40,45,60];
 var m=pick(arr), n=pick(arr);
 if(m===n) return null;
 if(m>n){ var t0=m; m=n; n=t0; }
 var t=Fr(m*n, m+n);
 return {q:'Усан санг $A$ цоргоор $'+m+'$ минутад, $B$ цоргоор $'+n+'$ минутад дүүргэдэг. Хоёр цоргыг зэрэг нээвэл усан сан хэдэн минутад дүүрэх вэ?',
  a:'$1$ минутад $A$ цорго савны $'+frTeX(1,m)+'$-ыг, $B$ цорго $'+frTeX(1,n)+'$-ыг дүүргэнэ. Хамтдаа $'+frTeX(1,m)+'+'+frTeX(1,n)+'='+frTeX(m+n,m*n)+'$ хэсгийг дүүргэх тул шаардагдах хугацаа нь $1\\div '+frTeX(m+n,m*n)+'='+fMix(t)+'$ минут.',
  key:'ebtp-'+m+'-'+n, nv:t.n/t.d};
}

// [дасгал 175* (50)] Хоёр лаа — 2 цагийн дараа шатаагүй хэсэг тэнцүү
function g_ebCandles(){
 var t, h1, T1, T2, r1, r2, rat, i, ok=false;
 for(i=0;i<120;i++){
  t=pick([1,2,3]);
  h1=2*t+1+2*rnd(0,4);
  T1=Fr(h1,2);
  T2=Math.ceil(fVal(T1))+rnd(0,6);
  if(T2>15||fVal(T1)>=T2) continue;
  r1=fDiv(fSub(T1,Fr(t,1)),T1);
  r2=fDiv(Fr(T2-t,1),Fr(T2,1));
  rat=fDiv(r2,r1);
  if(fVal(rat)<1.2||fVal(rat)>8) continue;
  ok=true; break;
 }
 if(!ok) return null;
 return {q:'Уртаараа ижил биш хоёр лааг зэрэг асаав. Эхний лаа $'+fMix(T1)+'$ цагт, хоёр дахь лаа $'+T2+'$ цагт бүрэн шатаж дуусдаг. Асаагаад $'+t+'$ цаг өнгөрөхөд хоёр лааны шатаагүй үлдсэн хэсгийн урт тэнцүү болжээ. Анх эхний лаа хоёр дахь лаанаас хэд дахин урт байсан бэ?',
  a:'$'+t+'$ цагийн дараа эхний лаанаас уртынхаа $1-'+t+'\\div '+fMix(T1)+'='+fTex(r1)+'$ хэсэг, хоёр дахь лаанаас $1-'+t+'\\div '+T2+'='+fTex(r2)+'$ хэсэг үлдэнэ. Үлдсэн урт тэнцүү тул анхны уртуудын харьцаа нь $'+fTex(r2)+'\\div '+fTex(r1)+'='+fMix(rat)+'$ болно. Эхний лаа $'+fMix(rat)+'$ дахин урт байсан.',
  key:'ebcd-'+t+'-'+h1+'-'+T2, nv:rat.n/rat.d};
}

// [дасгал 174* (50)] Замын хэсэг ба хугацааны харьцаагаар хурдыг жиших
function g_ebCyclist(){
 var p1, q1, k, rat, i, ok=false;
 for(i=0;i<80;i++){
  var fp=eb_proper([3,4,5,6,7,8,9]); p1=fp[0]; q1=fp[1];
  k=rnd(2,4);
  rat=Fr(k*p1, q1-p1);
  if(rat.n===rat.d) continue;

 }

  a:'Дугуйгаар явсан хугацааг $t$ гэвэл явганаар явсан хугацаа нь $'+k+'t$ болно. Дугуйн хурд $'+frTeX(p1,q1)+'\\div t$, явганы хурд $'+frTeX(q1-p1,q1)+'\\div\\bigl('+k+'t\\bigr)$. Харьцаа нь $'+frTeX(p1,q1-p1)+'\\cdot '+k+'='+fMix(rat)+'$ тул дугуйгаар $'+fMix(rat)+'$ дахин хурдан явсан.',
  key:'ebcy-'+p1+'-'+q1+'-'+k, nv:rat.n/rat.d};

// [дасгал 190, 192 (52)] Дараалсан хоёр хувийн өөрчлөлт
function g_ebPercentChain(){
 var p=pick([10,15,20,25,30,40,50]), r=pick([10,15,20,25,30,40]);

  a:'Нэмэгдсэний дараах үнэ $'+V+'\\cdot\\dfrac{'+(100+p)+'}{100}='+V1+'$ төгрөг. Буурсны дараах үнэ $'+V1+'\\cdot\\dfrac{'+(100-r)+'}{100}='+V2+'$ төгрөг. Энэ нь анхны үнээс $'+dFmt(Math.abs(dh),2)+'\\%$-оор '+(dh>0?'их':'бага')+'.',
  key:'ebpc-'+p+'-'+r+'-'+V, nv:V2};

// [дасгал 187 (52), 11 (Өөрийгөө сориорой, 54)] Хэсгээр нь бүтнийг олох урвуу бодлого
function g_ebPercentInverse(){
 var p=pick([20,25,40,50,60,75,80]);
 var step=100/gcd(p,100);
 var area=0, L=0, Wt=0, i, ok=false;
 for(i=0;i<300;i++){
  area=step*rnd(Math.ceil(60/step), Math.floor(900/step));
  L=rnd(5,60);
  if((area*10)%L!==0) continue;
  Wt=area*10/L;
  if(Wt<15||Wt>300) continue;
  if(Wt===L*10) continue;
  ok=true; break;
 }
 if(!ok) return null;
 var S=area*p/100;
 if(S!==Math.round(S)) return null;
 return {q:'Тэгш өнцөгтийн урт нь $'+L+'$ см бөгөөд түүний талбайн $'+p+'\\%$ нь $'+S+'$ см$^2$ байв. Тэгш өнцөгтийн өргөнийг олоорой.',
  a:'Бүтэн талбай нь $'+S+'\\div '+p+'\\cdot 100='+area+'$ см$^2$. Өргөн нь $'+area+'\\div '+L+'='+dFmt(Wt,1)+'$ см.',
  key:'ebpi-'+p+'-'+area+'-'+L, nv:Wt/10};
}

// [дасгал 15 (Давтах, 53)] Хэсгийн хэсгийг процентоор олох
function g_ebWaterBlood(){
 var fr=pick([[2,3],[3,5],[7,10],[5,8],[13,20]]);
 var p=pick([8,10,12,15,20,25]);
 var f=fMul(Fr(fr[0],fr[1]), Fr(p,100));
 var cand=[], M;
 for(M=40;M<=95;M++){
  if((M*fr[0]*10)%fr[1]!==0) continue;
  if((M*f.n*10)%f.d!==0) continue;
  cand.push(M);
 }
 if(!cand.length) return null;
 M=pick(cand);
 var wt=M*fr[0]*10/fr[1], bt=M*f.n*10/f.d;
 if(bt<=0) return null;
 return {q:'Ойролцоогоор хүний биеийн жингийн $'+frTeX(fr[0],fr[1])+'$ нь ус байдаг. Бие дэх нийт усны $'+p+'\\%$ нь цус байдаг бол $'+M+'$ кг жинтэй хүний биед хэдэн кг цус байх вэ?',
  a:'Биеийн ус нь $'+M+'\\cdot '+frTeX(fr[0],fr[1])+'='+dFmt(wt,1)+'$ кг. Цус нь $'+dFmt(wt,1)+'\\cdot\\dfrac{'+p+'}{100}='+dFmt(bt,1)+'$ кг.',
  key:'ebwb-'+fr[0]+'-'+fr[1]+'-'+p+'-'+M, nv:bt/10};
}

// [дасгал 13 (Өөрийгөө сориорой, 54)] Аравтын ба энгийн бутархайг нэгтгэж процент олох
function g_ebMoneyPercent(){
 var d1, a, b, used, rest, pt, i, ok=false;
 for(i=0;i<120;i++){
  d1=pick([15,20,24,25,30,35,40,45]);
  var fp=eb_proper([4,5,8,10,20,25]); a=fp[0]; b=fp[1];
  used=fAdd(Fr(d1,100), Fr(a,b));
  rest=fSub(Fr(1,1), used);
  if(rest.n<=0) continue;
  pt=rest.n*1000/rest.d;
  if(pt!==Math.round(pt)||pt<50) continue;
  ok=true; break;
 }
 if(!ok) return null;
 var nm=pick(EB_NAMES);
 return {q:nm+' гурил, будаа, элсэн чихэр худалдан авчээ. Өөрт байсан мөнгөнийхөө $'+dFmt(d1,2)+'$ хэсгээр гурил, $'+frTeX(a,b)+'$ хэсгээр элсэн чихэр худалдан авсан бол нийт мөнгөнийхөө хэдэн хувийг будаанд зарцуулсан бэ?',
  a:'Гурил ба элсэн чихэрт $'+dFmt(d1,2)+'+'+frTeX(a,b)+'='+fTex(used)+'$ хэсгийг зарцуулсан. Үлдсэн нь $1-'+fTex(used)+'='+fTex(rest)+'$ буюу $'+dFmt(pt,1)+'\\%$ болно.',
  key:'ebmp-'+d1+'-'+a+'-'+b, nv:pt/10};
}
var WSPEC={"title":"Тоог жиших, эрэмбэлэх-2","sub":"Хооронд орших тоо, нөхцөлөөр ялгах, нэгж шилжүүлэх · II бүлэг · 6-р анги","rule":"<b>Санамж:</b> Аравтын бутархайг жишихдээ эхлээд бүхэл хэсгийг харьцуулна. Бүхэл хэсэг тэнцүү бол аравны, дараа нь зууны, мянганы хэсгийн цифрүүдийг дараалан жишнэ. Орны тоог тэнцүүлэхийн тулд бутархай хэсгийн сүүлд тэг нэмж болно: $0.5$ ба $0.50$ тэнцүү. Өөр өөр нэгжтэй хэмжигдэхүүнийг эхлээд нэг нэгжид шилжүүлж байж жишнэ.","ref":"","tasks":[{"label":"Хоёр тоог жиш.","fn":"g_cmpDec","cap":6,"cols":3,"wk":9},{"label":"Өгсөн хоёр тооны хооронд орших гурван тоог бич.","fn":"g_between3","cap":4,"cols":2,"wk":11},{"label":"Нөхцөлд тохирох тоонуудыг ял.","fn":"g_filterDec","cap":4,"cols":1,"wk":12},{"label":"Ижил нэгжид шилжүүлж жиш.","fn":"g_cmpUnits","cap":6,"cols":2,"wk":12}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
