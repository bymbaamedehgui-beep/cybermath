<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадратад шилждэг тэгшитгэл 1 — биквадрат ба бутархай (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.packed{display:flex;gap:20px;align-items:flex-start}
  .grid.packed .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:11px}
  .plist{display:flex;flex-direction:column;gap:10px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:15px}
  .q.wide .qm{font-size:14px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.sm{height:13mm}.work.md{height:17mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function isSq(n){if(n<0)return false;var r=Math.round(Math.sqrt(n));return r*r===n;}
function bqTex(b,c){var s='x^4';if(b!==0){var ab=Math.abs(b);s+=(b>0?'+':'-')+(ab===1?'':ab)+'x^2';}if(c!==0)s+=(c>0?'+':'-')+Math.abs(c);return s+'=0';}
// Биквадрат тэгшитгэл (mix: 4 шийд / 2 шийд / шийдгүй)
function gBiquad(){var t=pick(['full','full','two','two','none']);
  if(t==='full'){var p=rnd(1,6),q=rnd(1,6);if(p>=q)return null;var b=-(p*p+q*q),c=p*p*q*q;
    return {q:bqTex(b,c),a:'$x=\\pm '+p+',\\ x=\\pm '+q+'$',ok:true};}
  if(t==='two'){var p=rnd(1,6),m=rnd(1,9),b=m-p*p,c=-p*p*m;
    return {q:bqTex(b,c),a:'$x=\\pm '+p+'$',ok:true};}
  var m=rnd(1,6),n=rnd(1,6),b=m+n,c=m*n;
  return {q:bqTex(b,c),a:'бодит шийдгүй',ok:true};}
// Квадратад шилждэг бутархай тэгшитгэл
function gFrac(){var p=rnd(2,7),A=nz(-6,6),C=nz(-6,6),B=nz(-24,24);
  var b=A+p-C,c=A*p+B+C*p,D=b*b-4*c;
  if(!isSq(D))return null;var s=Math.round(Math.sqrt(D));if((-b+s)%2!==0)return null;
  var r1=(-b+s)/2,r2=(-b-s)/2;if(r1===r2)return null;
  if(r1===p||r1===-p||r2===p||r2===-p)return null;
  var lo=Math.min(r1,r2),hi=Math.max(r1,r2);
  var t1='\\dfrac{x'+(A>0?'+'+A:'-'+(-A))+'}{x-'+p+'}';
  var t2=(B>0?'+':'-')+'\\dfrac{'+Math.abs(B)+'}{x^2-'+(p*p)+'}';
  var t3=(C<0?'-':'')+'\\dfrac{'+Math.abs(C)+'}{x+'+p+'}';
  return {q:t1+t2+'='+t3,a:'$x='+lo+',\\ x='+hi+'$',wide:true,ok:true};}
function gen(fn){for(var t=0;t<400;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function build(){
  var WORK=window.WS_WORK!==false;
  var bi=[],fr=[],seen={},K=0;window.__PROB=[];
  function fill(arr,fn,n){var c=0,tr=0;while(c<n&&tr<3000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;arr.push(f);c++;}}
  fill(bi,gBiquad,WORK?10:18);fill(fr,gFrac,WORK?6:10);
  function q2(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'"><div class="qeq"><span class="ql"></span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work sm"></div>':'')+'</div>';}
  function qw(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q wide" data-k="'+k+'"><div class="qeq"><span class="ql"></span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work md"></div>':'')+'</div>';}
  var b1=bi.map(q2).join(''),b2=fr.map(qw).join('');
  var ans=window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>'+p.f.a+'</span></div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадратад шилждэг тэгшитгэл 1</h1><div class="sub">Биквадрат тэгшитгэл · квадратад шилждэг бутархай тэгшитгэл · 6.3 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Биквадрат: $x^2=y$ орлуулгаар $ay^2+by+c=0$ болгож бод, дараа нь $x=\\pm\\sqrt{y}$ ($y\\ge 0$). Бутархайг ерөнхий хуваарьт хөрвүүлж квадрат тэгшитгэл гарга; хуваарийг тэгүүлэх $x$-г хас.</div>'
    +'<div class="task">1. Биквадрат тэгшитгэлийг бод.</div><div class="grid" data-sec="1">'+b1+'</div>'
    +'<div class="task">2. Тэгшитгэлийг квадрат тэгшитгэлд шилжүүлж бод.</div><div class="plist" data-sec="2">'+b2+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Квадратад шилждэг тэгшитгэл 1 — биквадрат ба бутархай (10-р анги)';
  var s=document.getElementById('sheet');
  toggleAns();
  try{renderMathInElement(s,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimTail(s,1035);}catch(e){}
  try{packCols(s.querySelector('.grid'));}catch(e){}
  relabel(s);
}
function relabel(s){var qs=s.querySelectorAll('.q');for(var i=0;i<qs.length;i++)qs[i].querySelector('.ql').textContent=(i+1)+'.';var as=s.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++)as[j].querySelector('.an').textContent=(j+1)+'.';}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function trimTail(sheet,target){var h=probeH(sheet),g=0;while(h>target&&g++<300){var qs=sheet.querySelectorAll('.q');if(qs.length<=6)break;var last=qs[qs.length-1],k=last.getAttribute('data-k');var a=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(a)a.parentNode.removeChild(a);last.parentNode.removeChild(last);h=probeH(sheet);}}
function packCols(g){if(!g||g.classList.contains('packed'))return;var qs=[].slice.call(g.children).filter(function(c){return c.classList&&c.classList.contains('q');});if(qs.length<2)return;var half=Math.ceil(qs.length/2),c1=document.createElement('div'),c2=document.createElement('div');c1.className='col';c2.className='col';qs.forEach(function(q,i){(i<half?c1:c2).appendChild(q);});g.appendChild(c1);g.appendChild(c2);g.classList.add('packed');}
build();
</script>
<script src="/ws-store.js?v=37"></script>
</body>
</html>
