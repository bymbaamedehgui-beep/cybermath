<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Алгебрын бутархайн нэмэх, хасах 2 (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.packed{display:flex;gap:18px;align-items:flex-start}
  .grid.packed .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:15px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.sm{height:13mm}.work.md{height:15mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){var t=a%b;a=b;b=t;}return a;}
function pe(c,x){var r=0;for(var i=c.length-1;i>=0;i--)r=r*x+c[i];return r;}
function padd(a,b){var n=Math.max(a.length,b.length),r=[];for(var i=0;i<n;i++)r[i]=(a[i]||0)+(b[i]||0);return r;}
function psc(a,k){return a.map(function(c){return c*k;});}
function pmul(a,b){var r=[];for(var i=0;i<a.length;i++)for(var j=0;j<b.length;j++)r[i+j]=(r[i+j]||0)+a[i]*b[j];for(var k=0;k<r.length;k++)r[k]=r[k]||0;return r;}
function ptrim(a){a=a.slice();while(a.length>1&&Math.abs(a[a.length-1])<1e-7)a.pop();return a;}
function pdeg(a){return ptrim(a).length-1;}
function pdivroot(a,r){var A=a.slice().reverse(),out=[A[0]];for(var i=1;i<A.length;i++)out.push(A[i]+out[i-1]*r);out.pop();return out.reverse();}
function introots(a){a=ptrim(a);var rs=[],ch=true;while(ch&&pdeg(a)>=1){ch=false;for(var r=-15;r<=15;r++){if(pdeg(a)<1)break;if(Math.abs(pe(a,r))<1e-6){a=ptrim(pdivroot(a,r));rs.push(r);ch=true;break;}}}return {roots:rs,rest:a};}
function content(a){var g=0;a.forEach(function(c){g=gcd(g,c);});return g||1;}
function reduceFrac(num,den){
  var fn=introots(num),fd=introots(den),nr=fn.roots.slice(),dr=fd.roots.slice();
  for(var i=nr.length-1;i>=0;i--){var idx=dr.indexOf(nr[i]);if(idx>=0){dr.splice(idx,1);nr.splice(i,1);}}
  var np=fn.rest.slice(),dp=fd.rest.slice();
  nr.forEach(function(r){np=pmul(np,[-r,1]);});dr.forEach(function(r){dp=pmul(dp,[-r,1]);});
  var g=gcd(content(np),content(dp));if(g>1){np=psc(np,1/g);dp=psc(dp,1/g);}
  var dl=ptrim(dp);if(dl[dl.length-1]<0){np=psc(np,-1);dp=psc(dp,-1);}
  return {num:ptrim(np),den:ptrim(dp)};
}
function polyTex(c,v){c=ptrim(c);var out='',first=true;for(var i=c.length-1;i>=0;i--){var co=Math.round(c[i]);if(co===0)continue;var vp=(i===0)?'':(i===1?v:v+'^{'+i+'}');var mag=Math.abs(co),t=(mag===1&&i>0)?vp:(''+mag+vp);if(first){out+=(co<0?'-':'')+t;first=false;}else out+=(co<0?' - ':' + ')+t;}return first?'0':out;}
function fracTexP(fr,v){var nt=polyTex(fr.num,v);if(nt==='0')return '0';var dt=polyTex(fr.den,v);return (dt==='1')?nt:('\\dfrac{'+nt+'}{'+dt+'}');}
function addFrac2(f1,s1,f2,s2){var num=padd(psc(pmul(f1.num,f2.den),s1),psc(pmul(f2.num,f1.den),s2)),den=pmul(f1.den,f2.den);return reduceFrac(num,den);}
function mulFrac2(f1,f2){return reduceFrac(pmul(f1.num,f2.num),pmul(f1.den,f2.den));}
function divFrac2(f1,f2){return reduceFrac(pmul(f1.num,f2.den),pmul(f1.den,f2.num));}
function chkFrac(v,evalLHS,ans){for(var i=0;i<5;i++){var x=1.7+Math.random()*4,a=evalLHS(x),b=pe(ans.num,x)/pe(ans.den,x);if(!isFinite(a)||!isFinite(b)||Math.abs(a-b)>1e-6*Math.max(1,Math.abs(a)))return false;}return true;}

// 1) Олон гишүүнт + бутархай  (v±c ± N/(v-a))
function gPolyPlusFrac(){
  var v=pick(['x','y','b','a','h','t','m','p']),c=nz(2,6),a=nz(-6,6),N=nz(2,9),op=pick([1,-1]);
  if(a===0)return null;
  var poly=[c,1],f1={num:poly,den:[1]},f2={num:[N],den:[-a,1]},ans=addFrac2(f1,1,f2,op);
  if(fracTexP(ans,v)==='0')return null;
  var q=polyTex(poly,v)+(op<0?' - ':' + ')+'\\dfrac{'+N+'}{'+polyTex([-a,1],v)+'}';
  if(!chkFrac(v,function(x){return pe(poly,x)+op*N/pe([-a,1],x);},ans))return null;
  return {q:q,a:fracTexP(ans,v),ok:true};
}
// 2) Задлагдах хуваарь (ялгаврын квадрат) — ерөнхий хуваарь ол
function gFactorLCD(){
  var v=pick(['x','y','t','s','a','b','m']),a=rnd(2,7),op=pick([1,-1]),c=pick([1,1,2]),d=nz(-6,6),N=nz(-9,9);
  if(pe([d,c],a)===0)return null;   // (cv+d) нь (v-a)-д хуваагдахгүй
  var d1=[-a,1],d2=pmul([-a,1],[a,1]);
  var f1={num:[d,c],den:d1},f2={num:[N],den:d2},ans=addFrac2(f1,1,f2,op);
  if(fracTexP(ans,v)==='0')return null;
  var q='\\dfrac{'+polyTex([d,c],v)+'}{'+v+' - '+a+'}'+(op<0?' - ':' + ')+'\\dfrac{'+N+'}{'+polyTex(d2,v)+'}';
  if(!chkFrac(v,function(x){return pe([d,c],x)/pe(d1,x)+op*N/pe(d2,x);},ans))return null;
  return {q:q,a:fracTexP(ans,v),ok:true};
}
// 3) Хоёр өөр линер хуваарьтай
function gTwoLinDen(){
  var v=pick(['x','y','b','a','t','m','p']),a=nz(-6,6),b=nz(-6,6),op=pick([1,-1]);
  if(a===b)return null;
  var N1=[nz(-6,6),pick([0,1,1])],N2=[nz(-6,6),pick([0,1])];
  if(polyTex(N1,v)==='0'||polyTex(N2,v)==='0')return null;
  if(pe(N1,a)===0||pe(N2,b)===0)return null;   // оролтын бутархай хураагдахгүй
  var d1=[-a,1],d2=[-b,1],f1={num:N1,den:d1},f2={num:N2,den:d2},ans=addFrac2(f1,1,f2,op);
  if(fracTexP(ans,v)==='0')return null;
  var q='\\dfrac{'+polyTex(N1,v)+'}{'+polyTex(d1,v)+'}'+(op<0?' - ':' + ')+'\\dfrac{'+polyTex(N2,v)+'}{'+polyTex(d2,v)+'}';
  if(!chkFrac(v,function(x){return pe(N1,x)/pe(d1,x)+op*pe(N2,x)/pe(d2,x);},ans))return null;
  return {q:q,a:fracTexP(ans,v),ok:true};
}
// 3б) Нэмэх/хасах + үржих/хуваах хосолсон:  (N1/(v-a) ± N2/(v-a)) [·/:] f3
function gCombined(){
  var v=pick(['x','y','b','a','t','m','p']),a=nz(-6,6),b=nz(-6,6),op1=pick([1,-1]),mul=pick([true,false]);
  if(a===b)return null;
  var d1=[-a,1],N1=[nz(-5,5),1],N2=[rnd(2,6)];
  if(pe(N1,a)===0)return null;   // эхний бутархай хураагдахгүй ((v-a)/(v-a) гарахгүй)
  var innerNum=padd(N1,psc(N2,op1));if(polyTex(innerNum,v)==='0'||pe(innerNum,a)===0)return null;
  var inner={num:innerNum,den:d1},f3=mul?{num:[-a,1],den:[-b,1]}:{num:[-b,1],den:[-a,1]};
  var fin=mul?mulFrac2(inner,f3):divFrac2(inner,f3);
  if(fracTexP(fin,v)==='0')return null;
  var frac1='\\dfrac{'+polyTex(N1,v)+'}{'+polyTex(d1,v)+'}',frac2='\\dfrac{'+polyTex(N2,v)+'}{'+polyTex(d1,v)+'}',f3tex='\\dfrac{'+polyTex(f3.num,v)+'}{'+polyTex(f3.den,v)+'}';
  var q='\\left('+frac1+(op1<0?' - ':' + ')+frac2+'\\right)'+(mul?'\\cdot ':' : ')+f3tex;
  var evalLHS=function(x){var inn=pe(N1,x)/pe(d1,x)+op1*pe(N2,x)/pe(d1,x),f3v=pe(f3.num,x)/pe(f3.den,x);return mul?inn*f3v:inn/f3v;};
  if(!chkFrac(v,evalLHS,fin))return null;
  return {q:q,a:fracTexP(fin,v),ok:true};
}
function gMix3(){return pick([gCombined,gCombined,gTwoLinDen])();}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var qs=sheet.querySelectorAll('.grid .q');for(var i=0;i<qs.length;i++){var el=qs[i].querySelector('.ql');if(el)el.textContent=(i+1)+'.';}var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var e2=as[j].querySelector('.an');if(e2)e2.textContent=(j+1)+'.';}}
function trimToFitBalanced(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<300){var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>4){bestN=n;best=s;}}if(best<0)break;var qs=grids[best].querySelectorAll('.q'),last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function packColumns(sheet){[].forEach.call(sheet.querySelectorAll('.grid'),function(g){if(g.classList.contains('packed'))return;var qs=[].slice.call(g.children).filter(function(c){return c.classList&&c.classList.contains('q');});if(qs.length<2)return;var half=Math.ceil(qs.length/2),c1=document.createElement('div'),c2=document.createElement('div');c1.className='col';c2.className='col';qs.forEach(function(q,i){(i<half?c1:c2).appendChild(q);});g.appendChild(c1);g.appendChild(c2);g.classList.add('packed');});}
function build(){
  var WORK=!!window.WS_WORK;
  var S=[[],[],[]],seen={};window.__PROB=[];
  function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<1600){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;S[idx].push(f);c++;}}
  var per=WORK?9:15;
  fill(0,gPolyPlusFrac,per);fill(1,gFactorLCD,per);fill(2,gMix3,per);
  var K=0;
  function block(arr,cls,sec){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'" data-sec="'+sec+'"><div class="qeq"><span class="ql"></span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work '+cls+'"></div>':'')+'</div>';}).join('');}
  var b1=block(S[0],'sm',1),b2=block(S[1],'sm',2),b3=block(S[2],'sm',3);
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>$'+p.f.a+'$</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Алгебрын бутархайн нэмэх, хасах 2</h1><div class="sub">Олон гишүүнт + бутархай · задлагдах хуваарь · хоёр линер хуваарь · 3.4 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Олон гишүүнтийг $\\dfrac{\\ldots}{1}$ болго &nbsp;·&nbsp; хуваарийг задалж ерөнхий хуваарь ол &nbsp;·&nbsp; $\\dfrac{a}{b}\\pm\\dfrac{c}{d}=\\dfrac{ad\\pm bc}{bd}$ &nbsp;·&nbsp; хариуг хураа</div>'
    +'<div class="task">1. Олон гишүүнт ба бутархайг нэгтгэж хураа.</div>'
    +'<div class="grid" data-sec="1">'+b1+'</div>'
    +'<div class="task">2. Хуваарийг задалж, ерөнхий хуваарьт оруулан хураа.</div>'
    +'<div class="grid" data-sec="2">'+b2+'</div>'
    +'<div class="task">3. Нэмэх/хасах, үржих/хуваах хосолсон илэрхийллийг хялбарчил.</div>'
    +'<div class="grid" data-sec="3">'+b3+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Алгебрын бутархайн нэмэх, хасах 2 (10-р анги)';
  relabel(document.getElementById('sheet'));
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFitBalanced(document.getElementById('sheet'),1035);}catch(e){}
  try{packColumns(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=35"></script>
</body>
</html>
