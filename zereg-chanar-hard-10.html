<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Зэргийн чанар (хүндэрсэн) — 10 бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:13px;text-align:center}
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:12px 22px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:center;margin-bottom:4px}.qn{font-weight:800;color:var(--purple);min-width:22px;font-size:14px}.qm{font-size:15px}
  .work{height:24mm;border:1.2px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 16px;font-size:14px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var COMPOSITES={2:[{num:4,k:2},{num:8,k:3},{num:16,k:4},{num:32,k:5},{num:64,k:6}],3:[{num:9,k:2},{num:27,k:3},{num:81,k:4}],5:[{num:25,k:2},{num:125,k:3}]};
function bp(p,m){return m===1?(''+p):(p+'^{'+m+'}');}
function factor(p,comps){
  var t=rnd(1,7),latex,exp,sign=1,num;
  if(t===1){var e=rnd(2,8);latex=p+'^{'+e+'}';exp=e;num=Math.pow(p,e);}
  else if(t===2){var m=rnd(2,4),e2=rnd(2,3);if(m*e2>10)e2=2;latex='\\left('+bp(p,m)+'\\right)^{'+e2+'}';exp=m*e2;num=Math.pow(p,exp);}
  else if(t===3){var c=pick(comps),e3=rnd(1,2);latex=(e3===1?(''+c.num):'\\left('+c.num+'\\right)^{'+e3+'}');exp=c.k*e3;num=Math.pow(p,exp);}
  else if(t===4){var a=rnd(2,5),b=rnd(1,4);latex='\\left('+bp(p,a)+' \\times '+bp(p,b)+'\\right)';exp=a+b;num=Math.pow(p,exp);}
  else if(t===5){var a2=rnd(4,8),b2=rnd(1,3);latex='\\left('+bp(p,a2)+' \\div '+bp(p,b2)+'\\right)';exp=a2-b2;num=Math.pow(p,exp);}
  else if(t===6){var e6=rnd(2,7);latex='\\left(-'+p+'\\right)^{'+e6+'}';exp=e6;sign=(e6%2===0)?1:-1;num=Math.pow(-p,e6);}
  else {var c7=pick(comps),e7=2;latex='\\left(-'+c7.num+'\\right)^{'+e7+'}';exp=c7.k*e7;sign=1;num=Math.pow(-c7.num,e7);}
  return {latex:latex,exp:exp,sign:sign,num:num};
}
function sumExp(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i].exp;return s;}
function prodSign(a){var s=1;for(var i=0;i<a.length;i++)s*=a[i].sign;return s;}
function prodNum(a){var s=1;for(var i=0;i<a.length;i++)s*=a[i].num;return s;}
function genOne(){
  var p=pick([2,3,5]),comps=COMPOSITES[p],numF,denF,numExp,denExp,E,S,tr=0;
  do{
    numF=[factor(p,comps),factor(p,comps)];if(rnd(0,1))numF.push(factor(p,comps));
    denF=[factor(p,comps)];if(rnd(0,1))denF.push(factor(p,comps));
    numExp=sumExp(numF);denExp=sumExp(denF);E=numExp-denExp;S=prodSign(numF)*prodSign(denF);tr++;
  }while((E<1||E>6||numExp>15||denExp>11)&&tr<400);
  var q='\\dfrac{'+numF.map(function(f){return f.latex;}).join(' \\times ')+'}{'+denF.map(function(f){return f.latex;}).join(' \\times ')+'} =';
  var val=S*Math.pow(p,E);
  var a=(S<0?'-':'')+p+'^{'+E+'} = '+val;
  return {q:q,a:a,_num:prodNum(numF)/prodNum(denF),_val:val};
}
function build(){
  var probs='',answs='',items=[];
  for(var i=0;i<10;i++){
    var e=genOne();var n=i+1;
    probs+='<div class="q"><div class="qeq"><span class="qn">'+n+'.</span><span class="qm">$'+e.q+'$</span></div><div class="work"></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>$'+e.a+'$</span></div>';
    items.push({q:e.q.replace(/=$/,'').trim(),a:e.a});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Зэргийн чанар — хүндэрсэн (тооцоол)</h1><div class="sub">Илэрхийллийг нэг анхны тооны зэрэг болгон хураа · 10 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Бүх суурийг нэг анхны тоонд шилжүүл (27=3³, 125=5³, 64=2⁶…) · $a^m\\cdot a^n=a^{m+n}$ , $\\dfrac{a^m}{a^n}=a^{m-n}$ , $(a^m)^n=a^{mn}$ · тэмдэгт анхаар</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Зэргийн чанар — хүндэрсэн';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=3"></script>
</body>
</html>
