<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>y=ax^n функцийн график — 10-р анги (5.4)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:6px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 28px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:4px}
  .qh{display:flex;gap:6px;align-items:baseline;margin-bottom:3px}.qn{font-weight:800;color:var(--purple)}.qm{font-size:14px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:8px}
  .sol{break-inside:avoid;page-break-inside:avoid;display:flex;gap:10px;align-items:flex-start;padding:7px 9px;margin-bottom:8px;border:1px solid #eee;border-left:3px solid var(--purple);border-radius:8px;font-size:12px}
  .sol .sn{font-weight:800;color:var(--purple)}
  table.vt{border-collapse:collapse;font-size:10.5px;margin-top:4px}
  table.vt td{border:1px solid #cfc7ea;padding:1px 5px;text-align:center;font-family:'Roboto Mono',monospace}
  table.vt td.h{background:#efeaff;font-weight:700}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function svg(fn,draw){
  var m=8,UN=9,W=2*m*UN,H=2*m*UN;
  function PX(x){return ((x+m)*UN).toFixed(1);}function PY(y){return ((m-y)*UN).toFixed(1);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:'+W+'px">';
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff" stroke="#d9d2f0"/>';
  for(var g=-m;g<=m;g++){s+='<line x1="'+PX(g)+'" y1="0" x2="'+PX(g)+'" y2="'+H+'" stroke="'+(g===0?'#8f83c9':'#eee7fb')+'" stroke-width="'+(g===0?1.2:1)+'"/>';
    s+='<line x1="0" y1="'+PY(g)+'" x2="'+W+'" y2="'+PY(g)+'" stroke="'+(g===0?'#8f83c9':'#eee7fb')+'" stroke-width="'+(g===0?1.2:1)+'"/>';}
  for(var t=-m+2;t<m;t+=2){if(t===0)continue;s+='<text x="'+PX(t)+'" y="'+(+PY(0)+8)+'" font-size="6" fill="#9a92b5" text-anchor="middle">'+t+'</text>';
    s+='<text x="'+(+PX(0)-3)+'" y="'+(+PY(t)+2)+'" font-size="6" fill="#9a92b5" text-anchor="end">'+t+'</text>';}
  s+='<text x="'+(W-6)+'" y="'+(+PY(0)-3)+'" font-size="7" fill="#6b5fb0">x</text><text x="'+(+PX(0)+3)+'" y="9" font-size="7" fill="#6b5fb0">y</text>';
  if(draw){var pts='';for(var x=-m;x<=m+1e-9;x+=0.1){var y=fn(x);if(y<-m-0.4||y>m+0.4){if(pts){s+='<polyline points="'+pts+'" fill="none" stroke="#7B52EE" stroke-width="1.8"/>';pts='';}continue;}pts+=PX(x)+','+PY(y)+' ';}if(pts)s+='<polyline points="'+pts+'" fill="none" stroke="#7B52EE" stroke-width="1.8"/>';}
  return s+'</svg>';
}
function make(){
  var n=pick([2,3]),a=pick(n===2?[1,-1,2,-2]:[1,-1]);
  var fn=function(x){return a*Math.pow(x,n);};
  var xs=n===2?[-3,-2,-1,0,1,2,3]:[-2,-1,0,1,2];
  var r1='<tr><td class="h">x</td>',r2='<tr><td class="h">y</td>';
  xs.forEach(function(x){r1+='<td>'+x+'</td>';r2+='<td>'+(a*Math.pow(x,n))+'</td>';});
  var desc=n===2?'парабол ('+(a>0?'дээш':'доош')+' нээлттэй)':'куб парабол ('+(a>0?'өсөх':'буурах')+')';
  return {fn:fn,func:'y='+(a===1?'':(a===-1?'-':a))+'x^{'+n+'}',table:'<table class="vt">'+r1+'</tr>'+r2+'</tr></table>',desc:desc};
}
function build(){
  var probs='',sols='',WS=[];
  for(var i=0;i<6;i++){var p=make(),k=i+1;
    probs+='<div class="q"><div class="qh"><span class="qn">'+k+'.</span><span class="qm">$'+p.func+'$ графикийг байгуул</span></div>'+svg(p.fn,false)+'</div>';
    sols+='<div class="sol"><div style="flex:1"><div><span class="sn">'+k+'.</span> $'+p.func+'$ — '+p.desc+'</div>'+p.table+'</div><div style="width:130px;flex-shrink:0">'+svg(p.fn,true)+'</div></div>';
    WS.push({q:'\\text{График: }'+p.func,a:'\\text{'+p.desc+'}'});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>y = ax^n зэрэгт функцийн график</h1><div class="sub">10-р анги · 5.4 · цэгийн хүснэгтээр байгуул · 6 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$n$ тэгш ($x^2$) → парабол, тэнхлэгт тэгш хэм. $n$ сондгой ($x^3$) → эх цэгт төвтэй хэм. $a<0$ бол тэнхлэгээр толилно. Цэгийн хүснэгт зохиож холбо.</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Цэгийн хүснэгт ба график</h2>'+sols+'</div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='y=ax^n зэрэгт функц (10-р анги 5.4)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js"></script>
</body>
</html>
