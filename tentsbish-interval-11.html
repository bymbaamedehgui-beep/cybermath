<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат тэнцэтгэл биш — Интервалын арга (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:17px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .ex{background:#f4f0ff;border:1px solid #ddd0f7;border-radius:9px;padding:9px 12px;margin-bottom:11px}
  .ex h3{font-size:12px;color:#5a32d6;margin-bottom:7px}
  .ex .exrow{font-size:11.5px;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:5px;line-height:1.55}
  .ex .exrow:last-child{margin-bottom:0}
  .ex .tag{display:inline-block;background:var(--purple);color:#fff;border-radius:6px;font-weight:800;font-size:10.5px;padding:1px 7px;margin-right:4px}
  .ex .stp{color:#5a32d6;font-weight:800;font-size:15px;margin:0 3px 0 8px}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:13.5px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:26mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5;display:flex;align-items:center;flex-wrap:wrap;gap:5px}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:3px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function qs(a,b,c){var t=(a===1?'x^2':a===-1?'-x^2':a+'x^2');if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
function opD(op){return {'>':'>','<':'<','ge':'\\ge','le':'\\le'}[op];}
var NEG=-1e9,POS=1e9;
// Интервалын аргын шийд: roots=[{x,pole}] эрэмбэлсэн, тэргүүлэх эерэг
function solveFactors(roots,op){var n=roots.length,pos=(op==='>'||op==='ge'),incEq=(op==='ge'||op==='le');
  var bounds=[NEG].concat(roots.map(function(r){return r.x;})).concat([POS]);var parts=[],shaded=[];
  for(var i=0;i<=n;i++){var sign=((n-i)%2===0)?1:-1;if((pos&&sign>0)||(!pos&&sign<0)){
    var lo=bounds[i],hi=bounds[i+1];
    var loOpen=(lo===NEG)|| !(incEq&&i>=1&&!roots[i-1].pole);
    var hiOpen=(hi===POS)|| !(incEq&&i<=n-1&&!roots[i].pole);
    shaded.push({lo:lo,hi:hi});
    var L=(loOpen?']':'[')+(lo===NEG?'{-}\\infty':lo);var R=(hi===POS?'{+}\\infty':hi)+(hiOpen?'[':']');
    parts.push(L+','+R);}}
  return {str:'x\\in\\,'+parts.join('\\,\\cup\\,'),shaded:shaded,incEq:incEq};}
function numLine(roots,shaded,incEq){var W=256,H=58,axisY=24,amp=12,pad=32;var xs=roots.map(function(r){return r.x;});var mn=Math.min.apply(null,xs)-1.3,mx=Math.max.apply(null,xs)+1.3;
  function px(x){if(x===NEG)return 6;if(x===POS)return W-6;return pad+(x-mn)/(mx-mn)*(W-2*pad);}
  var n=roots.length,rpx=roots.map(function(r){return px(r.x);});var pts=[6].concat(rpx).concat([W-6]);
  var g='';
  // ногоон шийдийн зурвас (тэнхлэг дээр)
  shaded.forEach(function(s){var a=px(s.lo),b=px(s.hi);g+='<line x1="'+a.toFixed(1)+'" y1="'+axisY+'" x2="'+b.toFixed(1)+'" y2="'+axisY+'" stroke="#16a34a" stroke-width="4" opacity="0.5"/>';});
  // тэнхлэг
  g+='<line x1="4" y1="'+axisY+'" x2="'+(W-4)+'" y2="'+axisY+'" stroke="#555" stroke-width="1.1"/><path d="M'+(W-4)+','+axisY+' l-5,-3 l0,6 z" fill="#555"/><path d="M4,'+axisY+' l5,-3 l0,6 z" fill="#555"/>';
  // тэмдгийн долгион муруй
  var signs=[];for(var i=0;i<=n;i++)signs.push(((n-i)%2===0)?1:-1);
  var path='M '+pts[0]+' '+(axisY-signs[0]*amp*0.55).toFixed(1);
  for(var i2=0;i2<=n;i2++){var midx=((pts[i2]+pts[i2+1])/2).toFixed(1);var peak=(axisY-signs[i2]*amp).toFixed(1);var endY=(i2===n)?(axisY-signs[i2]*amp*0.55).toFixed(1):axisY;path+=' Q '+midx+' '+peak+' '+pts[i2+1].toFixed(1)+' '+endY;}
  g+='<path d="'+path+'" fill="none" stroke="#e0559b" stroke-width="1.6" opacity="0.85"/>';
  // +/- тэмдэг
  for(var i3=0;i3<=n;i3++){var cx=((pts[i3]+pts[i3+1])/2),pos=signs[i3]>0;g+='<text x="'+cx.toFixed(1)+'" y="'+(pos?(axisY-amp+4):(axisY+amp+1))+'" font-size="13" font-weight="700" fill="'+(pos?'#16a34a':'#dc2626')+'" text-anchor="middle">'+(pos?'+':'−')+'</text>';}
  // тэг цэгүүд
  roots.forEach(function(r){var X=px(r.x),cl=incEq&&!r.pole;var lab=(r.disp!==undefined?r.disp:r.x);g+='<circle cx="'+X.toFixed(1)+'" cy="'+axisY+'" r="3.3" fill="'+(cl?'#5a32d6':'#fff')+'" stroke="#5a32d6" stroke-width="1.5"/><text x="'+X.toFixed(1)+'" y="'+(H-4)+'" font-size="8.5" fill="#333" text-anchor="middle">'+lab+'</text>';});
  return '<svg width="'+W+'" height="'+H+'" style="vertical-align:middle;flex-shrink:0">'+g+'</svg>';}
function roots2(){for(var t=0;t<200;t++){var r1=nz(-6,6),r2=nz(-6,6);if(r1===r2)continue;return [Math.min(r1,r2),Math.max(r1,r2)];}return [-2,3];}
// 1. Квадрат — интервалын арга
function g_quad(){var rr=roots2(),r1=rr[0],r2=rr[1],op=pick(['>','ge','lt','le']);if(op==='lt')op='<';var b=-(r1+r2),c=r1*r2;
  var R=[{x:r1,pole:false},{x:r2,pole:false}],sol=solveFactors(R,op);
  return {q:'$'+qs(1,b,c)+' '+opD(op)+' 0$',a:'$(x'+sg(-r1)+')(x'+sg(-r2)+') '+opD(op)+' 0$, язгуур $x='+r1+';\\ '+r2+'$. '+numLine(R,sol.shaded,sol.incEq)+' Шийд: $'+sol.str+'$',ok:true};}
// 2. Рационал
function g_rat(){for(var t=0;t<200;t++){var z=nz(-6,6),p=nz(-6,6);if(z===p)continue;var op=pick(['>','ge','lt','le']);if(op==='lt')op='<';
  var R=[{x:z,pole:false},{x:p,pole:true}].sort(function(a,b){return a.x-b.x;}),sol=solveFactors(R,op);
  var num='x'+sg(-z),den='x'+sg(-p);
  return {q:'$\\dfrac{'+num+'}{'+den+'} '+opD(op)+' 0$',a:'Тодорхойлогдох муж $x\\ne'+p+'$; язгуур $x='+z+'$. '+numLine(R,sol.shaded,sol.incEq)+' Шийд: $'+sol.str+'$',ok:true};}return null;}
// 3. Өндөр зэрэг (кубик задалгаа)
function g_cubic(){for(var t=0;t<200;t++){var a=nz(-5,5),b=nz(-5,5);if(a===b||a===0||b===0)continue;var op=pick(['>','ge','lt','le']);if(op==='lt')op='<';
  var arr=[0,a,b].sort(function(x,y){return x-y;});var R=arr.map(function(x){return {x:x,pole:false};}),sol=solveFactors(R,op);
  var p=-(a+b),q=a*b;var poly='x^3'+(p?(p>0?'+'+p:p)+'x^2':'')+(q?(q>0?'+'+q:q)+'x':'');
  return {q:'$'+poly+' '+opD(op)+' 0$',a:'$x(x'+sg(-a)+')(x'+sg(-b)+') '+opD(op)+' 0$, язгуур $'+arr.join(';\\ ')+'$. '+numLine(R,sol.shaded,sol.incEq)+' Шийд: $'+sol.str+'$',ok:true};}return null;}
// 4. Бүрэн квадрат — ирраци язгуур (хүнд)
function g_sqrt(){var p=rnd(-3,3),k=pick([2,3,5,6,7]),op=pick(['<','le','>','ge']);var s=Math.sqrt(k);var r1v=p-s,r2v=p+s;var incEq=(op==='le'||op==='ge');
  var symLo=(p===0?'':p)+'-\\sqrt{'+k+'}',symHi=(p===0?'':p)+'+\\sqrt{'+k+'}';
  var dispLo=(p===0?'':p)+'−√'+k,dispHi=(p===0?'':p)+'+√'+k;
  var R=[{x:r1v,disp:dispLo},{x:r2v,disp:dispHi}];
  var b=-2*p,c=p*p-k;var poly='x^2'+(b?(b>0?'+'+b:b)+'x':'')+(c?(c>0?'+'+c:c):'');
  var shaded,str;
  if(op==='<'||op==='le'){shaded=[{lo:r1v,hi:r2v}];str='x\\in\\,'+(incEq?'[':']')+symLo+',\\,'+symHi+(incEq?']':'[');}
  else{shaded=[{lo:NEG,hi:r1v},{lo:r2v,hi:POS}];str='x\\in\\,]{-}\\infty,\\,'+symLo+(incEq?']':'[')+'\\,\\cup\\,'+(incEq?'[':']')+symHi+',\\,{+}\\infty[';}
  return {q:'$'+poly+' '+opD(op)+' 0$',a:'$(x'+sg(-p)+')^2'+sg(-k)+' '+opD(op)+' 0$, язгуур $x='+(p===0?'':p)+'\\pm\\sqrt{'+k+'}$. '+numLine(R,shaded,incEq)+' Шийд: $'+str+'$',ok:true};}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f&&f.ok)return f;}return null;}
// Динамик жишээ (Шинэ бодлого дарахад солигдоно)
function signPatStr(n){var s='';for(var i=0;i<=n;i++)s+=(((n-i)%2===0)?'(+)':'(-)');return s;}
function exQuad(){var rr=roots2(),r1=rr[0],r2=rr[1],op=pick(['>','ge','<','le']);var b=-(r1+r2),c=r1*r2;
  var R=[{x:r1,pole:false},{x:r2,pole:false}],sol=solveFactors(R,op);
  return '$'+qs(1,b,c)+' '+opD(op)+' 0$'
    +'<b class="stp">①</b>$(x'+sg(-r1)+')(x'+sg(-r2)+') '+opD(op)+' 0$, язгуур $x='+r1+';\\ '+r2+'$'
    +'<b class="stp">②</b>тэмдэг $'+signPatStr(2)+'$'+numLine(R,sol.shaded,sol.incEq)
    +'<b class="stp">③</b><b>Хариу:</b> $'+sol.str+'$';}
function exRat(){for(var t=0;t<200;t++){var z=nz(-6,6),p=nz(-6,6);if(z===p)continue;var op=pick(['<','le','>','ge']);
  var R=[{x:z,pole:false},{x:p,pole:true}].sort(function(a,b){return a.x-b.x;}),sol=solveFactors(R,op);
  return '$\\dfrac{x'+sg(-z)+'}{x'+sg(-p)+'} '+opD(op)+' 0$'
    +'<b class="stp">①</b>Тодорхойлогдох муж $x\\ne'+p+'$; язгуур $x='+z+'$'
    +'<b class="stp">②</b>тэмдэг $'+signPatStr(2)+'$'+numLine(R,sol.shaded,sol.incEq)
    +'<b class="stp">③</b><b>Хариу:</b> $'+sol.str+'$';}return exRat();}
function exCubic(){for(var t=0;t<200;t++){var a=nz(-5,5),b=nz(-5,5);if(a===b||a===0||b===0)continue;var op=pick(['>','ge','<','le']);
  var arr=[0,a,b].sort(function(x,y){return x-y;}),R=arr.map(function(x){return {x:x,pole:false};}),sol=solveFactors(R,op);
  var p=-(a+b),q=a*b,poly='x^3'+(p?(p>0?'+'+p:p)+'x^2':'')+(q?(q>0?'+'+q:q)+'x':'');
  return '$'+poly+' '+opD(op)+' 0$'
    +'<b class="stp">①</b>$x(x'+sg(-a)+')(x'+sg(-b)+')$-ийн язгуур $'+arr.join(';\\ ')+'$'
    +'<b class="stp">②</b>тэмдэг $'+signPatStr(3)+'$'+numLine(R,sol.shaded,sol.incEq)
    +'<b class="stp">③</b><b>Хариу:</b> $'+sol.str+'$';}return exCubic();}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т','у','ү'];
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={};for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<80){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var P=[[],[],[]];var seen={};function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<4000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;P[idx].push(f);c++;}}
  function fillMix(idx,fns,n){var c=0,tr=0,i=0;while(c<n&&tr<8000){tr++;var f=gen(fns[i%fns.length]);i++;if(!f||seen[f.q])continue;seen[f.q]=1;P[idx].push(f);c++;}}
  fillMix(0,[g_quad,g_sqrt],14);fill(1,g_rat,10);fill(2,g_cubic,10);window.__EX={q:exQuad(),r:exRat(),c:exCubic()};return P;}
function exBox(){var ex=window.__EX||(window.__EX={q:exQuad(),r:exRat(),c:exCubic()});
  return '<div class="ex"><h3>Тэмдгийн аргаар бодох 3 жишээ</h3>'
    +'<div class="exrow"><span class="tag">Жишээ 1</span><span>'+ex.q+'</span></div>'
    +'<div class="exrow"><span class="tag">Жишээ 2</span><span>'+ex.r+'</span></div>'
    +'<div class="exrow"><span class="tag">Жишээ 3</span><span>'+ex.c+'</span></div></div>';}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap){var use=WK?arr.slice(0,cap):arr;return use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(WK?'<div class="wk"></div>':'')+'</div>';}).join('');}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>'+p.f.a+'</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадрат тэнцэтгэл биш — Интервалын арга</h1><div class="sub">Тэг цэгүүдийг тоон шулуунд тэмдэглэж, тэмдгээр шийдийг ол · 11-р анги · I бүлэг 1.2</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule"><b>Алхам:</b> 1) Тэг болгодог цэгүүдийг (рационалд <b>тодорхойлогдохгүй</b> цэгийг нээлттэй) ол. 2) Тоон шулуун дээр тэмдэглэ. 3) Баруун захын завсарт тэмдэг нь тэргүүлэх коэффициентийн тэмдэг; цэг бүрээр тэмдэг <b>солигдоно</b>. 4) Тэнцэтгэл бишид тохирох завсрыг сонго.</div>'
    +exBox()
    +'<div class="task">1. Квадрат тэнцэтгэл бишийг интервалын аргаар бод (бүхэл ба ирраци язгуур).</div><div class="grid">'+block(S[0],4)+'</div>'
    +'<div class="task">2. Рационал тэнцэтгэл бишийг бод.</div><div class="grid">'+block(S[1],4)+'</div>'
    +'<div class="task">3. Өндөр зэргийн тэнцэтгэл бишийг задлаад бод.</div><div class="grid">'+block(S[2],4)+'</div>'
