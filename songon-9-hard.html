<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>9-р ангийн сонгон — хүнд бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.55}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 14px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:7px 4px 9px;border-bottom:1px dashed #efeaff}
  .qt{font-size:13.5px}.qt .qn{font-weight:800;color:var(--purple);margin-right:5px}
  .bl{margin:12px 0 2px 28px;border-bottom:1.4px solid #b9accf;height:1.05em}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var P=[
  {q:'$\\dfrac{1}{1\\cdot2}+\\dfrac{1}{2\\cdot3}+\\cdots+\\dfrac{1}{9\\cdot10}$-ийг бод.',a:'$\\dfrac{9}{10}$'},
  {q:'$x+\\dfrac{1}{x}=3$ бол $x^{2}+\\dfrac{1}{x^{2}}=?$',a:'$7$'},
  {q:'$\\sqrt{7+4\\sqrt{3}}$-ийг хялбарчил.',a:'$2+\\sqrt{3}$'},
  {q:'$2^{10}+2^{10}+2^{10}+2^{10}=2^{n}$ бол $n=?$',a:'$n=12$'},
  {q:'$a+b=5,\\ ab=6$ бол $a^{3}+b^{3}=?$',a:'$35$'},
  {q:'$\\dfrac{2^{2024}+2^{2022}}{2^{2022}}=?$',a:'$5$'},
  {q:'1-ээс 99 хүртэлх бүх сондгой тоонуудын нийлбэрийг ол.',a:'$2500$'},
  {q:'Хоёр оронтой тооны цифрүүдийн нийлбэр 12. Орон солиход уг тоо 18-аар их болдог. Тоог ол.',a:'$57$'},
  {q:'$x^{2}-5|x|+6=0$ тэгшитгэл хэдэн язгууртай вэ?',a:'$4$ (x=±2, ±3)'},
  {q:'$\\dfrac{x}{2}=\\dfrac{y}{3}=\\dfrac{z}{5}$ ба $x+y+z=20$ бол $z=?$',a:'$z=10$'},
  {q:'$\\sqrt{x}+\\sqrt{x+5}=5$ бол $x=?$',a:'$x=4$'},
  {q:'$1+2+3+\\cdots+n=120$ бол $n=?$',a:'$n=15$'},
  {q:'Барааг эхлээд 20%-иар нэмж, дараа нь 20%-иар хямдруулав. Анхны үнээс хэдэн хувиар өөрчлөгдсөн бэ?',a:'4%-иар буурсан'},
  {q:'$a=\\sqrt{2}+1,\\ b=\\sqrt{2}-1$ бол $a^{2}+b^{2}=?$',a:'$6$'},
  {q:'Цаг 3:15 болоход цагийн ба минутын зүүний хоорондох өнцгийг ол.',a:'$7.5^{\\circ}$'},
  {q:'$\\dfrac{1}{2}+\\dfrac{1}{4}+\\dfrac{1}{8}+\\cdots+\\dfrac{1}{256}=?$',a:'$\\dfrac{255}{256}$'}
];
function build(){
  var probs='',answs='';
  P.forEach(function(it,i){var n=i+1;
    probs+='<div class="q"><div class="qt"><span class="qn">'+n+'.</span>'+it.q+'</div><div class="bl"></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>'+it.a+'</span></div>';});
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>9-р ангид орох сонгон — хүнд бодлого</h1><div class="sub">Гүнзгий сэтгэлгээ шаардсан · '+P.length+' бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=P.map(function(it){return {q:it.q.replace(/<[^>]+>/g,''),a:it.a};});
  window.WS_TITLE='9-р анги сонгон — хүнд бодлого';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js"></script>
</body>
</html>
