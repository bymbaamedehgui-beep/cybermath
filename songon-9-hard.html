<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>9-р ангийн сонгон — хүнд бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--green:#0b6b2e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.55}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 14px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:7px 4px 9px;border-bottom:1px dashed #efeaff}
  .qt{font-size:13.5px}.qt .qn{font-weight:800;color:var(--purple);margin-right:5px}
  .bl{margin:12px 0 2px 28px;border-bottom:1.4px solid #b9accf;height:1.05em}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:var(--green);margin-bottom:10px}
  .sol{padding:7px 4px 8px;border-bottom:1px dashed #eef;font-size:12.5px}.sol .sn{font-weight:800;color:var(--green);margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
// q = бодлого, s = бодолт (хариутайгаа)
var POOL=[
  {q:'$\\dfrac{1}{1\\cdot2}+\\dfrac{1}{2\\cdot3}+\\cdots+\\dfrac{1}{9\\cdot10}$-ийг бод.',s:'$\\dfrac{1}{k(k+1)}=\\dfrac1k-\\dfrac1{k+1}$ тул нийлбэр $=1-\\dfrac1{10}=\\dfrac{9}{10}$.'},
  {q:'$x+\\dfrac1x=3$ бол $x^{2}+\\dfrac1{x^{2}}=?$',s:'$\\left(x+\\dfrac1x\\right)^2=x^2+2+\\dfrac1{x^2}=9\\Rightarrow x^2+\\dfrac1{x^2}=7$.'},
  {q:'$\\sqrt{7+4\\sqrt{3}}$-ийг хялбарчил.',s:'$7+4\\sqrt3=(2+\\sqrt3)^2$ тул $=2+\\sqrt3$.'},
  {q:'$2^{10}+2^{10}+2^{10}+2^{10}=2^{n}$ бол $n=?$',s:'$4\\cdot2^{10}=2^2\\cdot2^{10}=2^{12}\\Rightarrow n=12$.'},
  {q:'$a+b=5,\\ ab=6$ бол $a^{3}+b^{3}=?$',s:'$a^3+b^3=(a+b)^3-3ab(a+b)=125-90=35$.'},
  {q:'$\\dfrac{2^{2024}+2^{2022}}{2^{2022}}=?$',s:'$=\\dfrac{2^{2022}(2^2+1)}{2^{2022}}=5$.'},
  {q:'1-ээс 99 хүртэлх бүх сондгой тоонуудын нийлбэрийг ол.',s:'$1+3+\\cdots+99=50^2=2500$ (50 гишүүн).'},
  {q:'Хоёр оронтой тооны цифрүүдийн нийлбэр 12. Орон солиход тоо 18-аар их болно. Тоог ол.',s:'$10b+a-(10a+b)=18\\Rightarrow 9(b-a)=18\\Rightarrow b-a=2$. $a+b=12$ тул $a=5,b=7\\Rightarrow 57$.'},
  {q:'$x^{2}-5|x|+6=0$ хэдэн язгууртай вэ?',s:'$|x|=2$ эсвэл $|x|=3\\Rightarrow x=\\pm2,\\pm3$ → $4$ язгуур.'},
  {q:'$\\dfrac{x}{2}=\\dfrac{y}{3}=\\dfrac{z}{5}$ ба $x+y+z=20$ бол $z=?$',s:'$x=2t,y=3t,z=5t\\Rightarrow 10t=20\\Rightarrow t=2$, $z=10$.'},
  {q:'$\\sqrt{x}+\\sqrt{x+5}=5$ бол $x=?$',s:'$\\sqrt{x+5}=5-\\sqrt x\\Rightarrow x+5=25-10\\sqrt x+x\\Rightarrow\\sqrt x=2\\Rightarrow x=4$.'},
  {q:'$1+2+3+\\cdots+n=120$ бол $n=?$',s:'$\\dfrac{n(n+1)}2=120\\Rightarrow n^2+n-240=0\\Rightarrow n=15$.'},
  {q:'Барааг 20%-иар нэмж дараа нь 20%-иар хямдруулав. Нийт хэдэн % өөрчлөгдсөн бэ?',s:'$1.2\\times0.8=0.96$ → $4\\%$-иар буурсан.'},
  {q:'$a=\\sqrt{2}+1,\\ b=\\sqrt{2}-1$ бол $a^{2}+b^{2}=?$',s:'$a^2=3+2\\sqrt2,\\ b^2=3-2\\sqrt2$ → нийлбэр $=6$.'},
  {q:'Цаг 3:15 болоход цаг ба минутын зүүний хоорондох өнцгийг ол.',s:'Цагийн зүү $3\\cdot30+15\\cdot0.5=97.5^{\\circ}$, минут $90^{\\circ}$ → зөрүү $7.5^{\\circ}$.'},
  {q:'$\\dfrac{1}{2}+\\dfrac{1}{4}+\\dfrac{1}{8}+\\cdots+\\dfrac{1}{256}=?$',s:'Геометр цуваа: $1-\\dfrac1{256}=\\dfrac{255}{256}$.'},
  {q:'$\\dfrac{a}{b}=\\dfrac23$ бол $\\dfrac{a+b}{b}=?$',s:'$\\dfrac{a}{b}+1=\\dfrac23+1=\\dfrac53$.'},
  {q:'Хоёр тооны нийлбэр 20, үржвэр 96. Тоонуудыг ол.',s:'$x^2-20x+96=0\\Rightarrow(x-8)(x-12)=0\\Rightarrow 8,\\ 12$.'},
  {q:'$2^{x}=3$ бол $4^{x}=?$',s:'$4^x=(2^x)^2=3^2=9$.'},
  {q:'$\\sqrt{50}+\\sqrt{18}-\\sqrt{8}=?$',s:'$5\\sqrt2+3\\sqrt2-2\\sqrt2=6\\sqrt2$.'},
  {q:'$\\left(1-\\dfrac12\\right)\\left(1-\\dfrac13\\right)\\cdots\\left(1-\\dfrac1{10}\\right)=?$',s:'$\\dfrac12\\cdot\\dfrac23\\cdot\\dfrac34\\cdots\\dfrac9{10}=\\dfrac1{10}$ (телескоп).'},
  {q:'Тэгш өнцөгтийн периметр 24, талбай 35. Талуудыг ол.',s:'$x+y=12,\\ xy=35\\Rightarrow x^2-12x+35=0\\Rightarrow 5,\\ 7$.'},
  {q:'$\\dfrac{1}{2-\\sqrt3}$-ийг рационалчил.',s:'$\\dfrac{2+\\sqrt3}{(2-\\sqrt3)(2+\\sqrt3)}=\\dfrac{2+\\sqrt3}{1}=2+\\sqrt3$.'},
  {q:'100-аас бага хэдэн натурал тоо 7-д хуваагдах вэ?',s:'$\\lfloor99/7\\rfloor=14$ (7,14,…,98).'},
  {q:'$\\dfrac{3^{2024}-3^{2023}}{3^{2023}}=?$',s:'$=\\dfrac{3^{2023}(3-1)}{3^{2023}}=2$.'},
  {q:'$a-b=4,\\ ab=5$ бол $a^{2}+b^{2}=?$',s:'$(a-b)^2+2ab=16+10=26$.'},
  {q:'Дугуйн радиус 2 дахин нэмэгдвэл талбай хэдэн дахин нэмэгдэх вэ?',s:'$S=\\pi r^2$ тул $(2r)^2=4r^2$ → $4$ дахин.'},
  {q:'$|x-3|=5$ бол $x=?$',s:'$x-3=5$ эсвэл $x-3=-5\\Rightarrow x=8$ эсвэл $x=-2$.'},
  {q:'$2+4+6+\\cdots+50=?$',s:'$2(1+2+\\cdots+25)=2\\cdot\\dfrac{25\\cdot26}2=650$.'},
  {q:'$\\sqrt{x}=x-6$ бол $x=?$',s:'$x=x^2-12x+36\\Rightarrow x^2-13x+36=0\\Rightarrow x=9$ ($x=4$ шалгахад гээгдэнэ).'},
  {q:'Гурвалжны өнцгүүд $2:3:4$ харьцаатай. Хамгийн их өнцгийг ол.',s:'$\\dfrac{4}{9}\\cdot180^{\\circ}=80^{\\circ}$.'}
];
function build(){
  var picked=shuffle(POOL).slice(0,16);
  var probs='',sols='';
  picked.forEach(function(it,i){var n=i+1;
    probs+='<div class="q"><div class="qt"><span class="qn">'+n+'.</span>'+it.q+'</div><div class="bl"></div></div>';
    sols+='<div class="sol"><span class="sn">'+n+'.</span>'+it.s+'</div>';});
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>9-р ангид орох сонгон — хүнд бодлого</h1><div class="sub">Гүнзгий сэтгэлгээ шаардсан · 16 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Бодолтууд</h2>'+sols+'</div>';
  toggleAns();
  window.WS_ITEMS=picked.map(function(it){return {q:it.q.replace(/<[^>]+>/g,''),a:it.s};});
  window.WS_TITLE='9-р анги сонгон — хүнд бодлого';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=5"></script>
</body>
</html>
