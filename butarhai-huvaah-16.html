<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Бутархай хуваах — эргүүлж үржүүлэх · 16 бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--copy:#2f5fd0;--res:#9b3a3a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:13px;text-align:center}
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(8,auto);grid-auto-flow:column;gap:11px 20px}
  .q{display:flex;align-items:center;gap:5px;flex-wrap:wrap;break-inside:avoid;page-break-inside:avoid}
  .qn{font-weight:800;color:var(--purple);min-width:22px;font-size:13px}
  .given{font-size:17px}
  .op{font-size:16px;color:#555;font-weight:700}
  .bf{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
  .bx{min-width:20px;height:20px;padding:0 3px;border:1px solid #c9d2f0;background:#eef2fc;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:transparent}
  .bl{width:26px;height:0;border-top:1.6px solid #333;margin:1.5px 0}
  .bf.copy .bx{color:var(--copy)}
  .bf.res .bx{color:var(--res);background:#fdeef0;border-color:#f0c9d0}
  .capwrap{display:inline-flex;flex-direction:column;align-items:center}
  .cap{font-size:8px;color:#999;margin-top:2px;font-weight:700}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;font-size:14px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}.bx{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
function reduce(n,d){var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function rf(){var d,n,t=0;do{d=rnd(3,9);n=rnd(1,d-1);t++;}while(gcd(n,d)!==1&&t<50);return {n:n,d:d};}
function bf(num,den,cls){
  return '<span class="bf '+(cls||'')+'"><span class="bx">'+(num===''?'&nbsp;':num)+'</span><span class="bl"></span><span class="bx">'+(den===''?'&nbsp;':den)+'</span></span>';
}
function cap(inner,label){return '<span class="capwrap">'+inner+'<span class="cap">'+label+'</span></span>';}
function build(){
  var probs='',answs='',items=[];
  for(var i=0;i<16;i++){
    var A=rf(),B=rf();
    var invN=B.d,invD=B.n;              // 2 дахь бутархайг эргүүлэх
    var pr=reduce(A.n*invN, A.d*invD);  // үржвэрийн хариу (хураасан)
    var ex=(i<2);                       // эхний 2 нь бодсон жишээ
    var n=i+1;
    var given='<span class="given">$\\dfrac{'+A.n+'}{'+A.d+'}\\div\\dfrac{'+B.n+'}{'+B.d+'}=$</span>';
    var f1=bf(ex?A.n:'', ex?A.d:'', 'copy');
    var f2=bf(ex?invN:'', ex?invD:'', 'copy');
    var fr=bf(ex?pr.n:'', ex?pr.d:'', 'res');
    if(i===0){ f2=cap(f2,'эргүүлсэн'); fr=cap(fr,'хариу'); }
    probs+='<div class="q"><span class="qn">'+n+'.</span>'+given
      +f1+'<span class="op">×</span>'+f2+'<span class="op">=</span>'+fr+'</div>';
    var pl=pr.d===1?(''+pr.n):'\\dfrac{'+pr.n+'}{'+pr.d+'}';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>$\\dfrac{'+A.n+'}{'+A.d+'}\\times\\dfrac{'+invN+'}{'+invD+'}='+pl+'$</span></div>';
    items.push({q:'\\dfrac{'+A.n+'}{'+A.d+'}\\div\\dfrac{'+B.n+'}{'+B.d+'}',a:pl});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Бутархай хуваах — эргүүлж үржүүлэх</h1><div class="sub">Хуваахыг урвуу үржүүлэхээр бод · 16 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">1-р бутархайг хэвээр бич · 2-р бутархайг <b style="color:var(--copy)">эргүүл (урвуул)</b> · үржүүл · <b style="color:var(--res)">хариу</b>-г энгийн хэлбэрт хураа</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Бутархай хуваах';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=39"></script>
</body>
</html>
