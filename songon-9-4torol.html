<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>9-р анги сонгон — 4 төрлийн бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .grp{margin-top:12px}
  .gh{font-weight:800;color:#5a32d6;font-size:13.5px;margin:10px 0 3px;display:flex;align-items:center;gap:8px}
  .gh .tag{background:#efeaff;color:#5a32d6;border-radius:6px;font-size:11px;padding:2px 7px}
  .note{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:7px;padding:5px 10px;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 22px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:5px 4px 7px;border-bottom:1px dashed #efeaff}
  .qeq{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.qn{font-weight:800;color:var(--purple);min-width:24px}.qm{font-size:14.5px}
  .bl{display:block;min-width:120px;border-bottom:1.4px solid #b9accf;height:1.05em;margin-top:7px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;font-size:13px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}

/* ---------- I. Радикал хялбарчлах ба нэгтгэх ---------- */
function makeRadical(){
  var D=[2,3,5,6,7,10], d=pick(D);
  var c1,c2,c3,s2,s3,coeff;
  do{ c1=rnd(2,6); c2=rnd(2,6); c3=rnd(2,5); s2=rnd(0,1)?1:-1; s3=rnd(0,1)?1:-1;
      coeff=c1+s2*c2+s3*c3; }while(coeff<2);
  var r1=c1*c1*d, r2=c2*c2*d, r3=c3*c3*d;
  var q='\\sqrt{'+r1+'}'+(s2>0?'+':'-')+'\\sqrt{'+r2+'}'+(s3>0?'+':'-')+'\\sqrt{'+r3+'}';
  var a=(coeff===1?'':coeff)+'\\sqrt{'+d+'}';
  return {qhtml:'$'+q+' =$', ans:a, wsq:q+' ='};
}

/* ---------- II. Зэргийн илэрхийлэл хялбарчлах ---------- */
function makePower(){
  var b=pick([2,3,5,7]), N=rnd(2018,2030), form=rnd(0,2), q,a;
  if(form===0){            // (b^N + b^{N-k})/b^{N-k} = b^k + 1
    var k=rnd(1,3); q='\\dfrac{'+b+'^{'+N+'}+'+b+'^{'+(N-k)+'}}{'+b+'^{'+(N-k)+'}}'; a=''+(Math.pow(b,k)+1);
  }else if(form===1){      // (b^N - b^{N-k})/b^{N-k} = b^k - 1
    var k=rnd(1,3); q='\\dfrac{'+b+'^{'+N+'}-'+b+'^{'+(N-k)+'}}{'+b+'^{'+(N-k)+'}}'; a=''+(Math.pow(b,k)-1);
  }else{                   // (b^N + b^{N-1} + b^{N-2})/b^{N-2} = b^2 + b + 1
    q='\\dfrac{'+b+'^{'+N+'}+'+b+'^{'+(N-1)+'}+'+b+'^{'+(N-2)+'}}{'+b+'^{'+(N-2)+'}}'; a=''+(b*b+b+1);
  }
  return {qhtml:'$'+q+' =$', ans:a, wsq:q+' ='};
}

/* ---------- III. x ± 1/x нөхцөлт ---------- */
function makeRecip(){
  var k=rnd(3,7), form=rnd(0,2), cond,target,a;
  if(form===0){            // x+1/x=k → x²+1/x² = k²-2
    cond='x+\\dfrac{1}{x}='+k; target='x^{2}+\\dfrac{1}{x^{2}}'; a=''+(k*k-2);
  }else if(form===1){      // x-1/x=k → x²+1/x² = k²+2
    cond='x-\\dfrac{1}{x}='+k; target='x^{2}+\\dfrac{1}{x^{2}}'; a=''+(k*k+2);
  }else{                   // x+1/x=k → x³+1/x³ = k³-3k
    cond='x+\\dfrac{1}{x}='+k; target='x^{3}+\\dfrac{1}{x^{3}}'; a=''+(k*k*k-3*k);
  }
  return {qhtml:'$'+cond+'$ бол $'+target+'=?$', ans:a, wsq:cond+',\\ '+target+'=?'};
}

/* ---------- IV. Телескоп нийлбэр ---------- */
function makeTele(){
  if(rnd(0,2)>0){          // 1/(1·2)+...+1/(n(n+1)) = n/(n+1)
    var n=rnd(7,30);
    var q='\\dfrac{1}{1\\cdot2}+\\dfrac{1}{2\\cdot3}+\\cdots+\\dfrac{1}{'+n+'\\cdot'+(n+1)+'}';
    return {qhtml:'$'+q+' =$', ans:'\\dfrac{'+n+'}{'+(n+1)+'}', wsq:q+' ='};
  }else{                   // 1/(1·3)+...+1/((2n-1)(2n+1)) = n/(2n+1)
    var n=rnd(5,20);
    var q='\\dfrac{1}{1\\cdot3}+\\dfrac{1}{3\\cdot5}+\\cdots+\\dfrac{1}{'+(2*n-1)+'\\cdot'+(2*n+1)+'}';
    return {qhtml:'$'+q+' =$', ans:'\\dfrac{'+n+'}{'+(2*n+1)+'}', wsq:q+' ='};
  }
}

var TYPES=[
  {name:'I. Радикал хялбарчлах ба нэгтгэх', note:'√n-г a²·b болгож задлаад √b-ийн өмнө a гарга, дараа нь ижил язгууртайг нь нэгтгэ.', gen:makeRadical},
  {name:'II. Зэргийн илэрхийлэл хялбарчлах', note:'Хамгийн бага зэргийг нийтлэг үржигдэхүүн болгож хаалтанд гарга.', gen:makePower},
  {name:'III. x ± 1/x нөхцөлт илэрхийлэл', note:'(x + 1/x)² = x² + 2 + 1/x² томьёог ашиглан үнэлэ.', gen:makeRecip},
  {name:'IV. Телескоп (задрах) нийлбэр', note:'1/(k(k+1)) = 1/k − 1/(k+1) гэж задалбал гишүүд хоорондоо хорогдоно.', gen:makeTele},
];

function build(){
  var groups='',answs='',WS=[],n=0;
  for(var t=0;t<TYPES.length;t++){
    var T=TYPES[t], qs='';
    for(var j=0;j<3;j++){
      n++; var p=T.gen();
      qs+='<div class="q"><div class="qeq"><span class="qn">'+n+'.</span><span class="qm">'+p.qhtml+'</span></div><div class="bl"></div></div>';
      answs+='<div class="a"><span class="an">'+n+'.</span><span>$'+p.ans+'$</span></div>';
      WS.push({q:p.wsq,a:p.ans});
    }
    groups+='<div class="grp"><div class="gh"><span class="tag">'+(t+1)+'</span>'+T.name+'</div>'
      +'<div class="note">'+T.note+'</div><div class="grid">'+qs+'</div></div>';
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>9-р анги · Сонгон бодлого</h1><div class="sub">4 төрлийн арга · радикал · зэрэг · x+1/x · телескоп нийлбэр · 12 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +groups
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='9-р анги сонгон — 4 төрлийн бодлого';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=29"></script>
</body>
</html>
