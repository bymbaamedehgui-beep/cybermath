<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="/">
<title>Дасгал ажлын дэвтэр — CyberMath</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14214A">
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
<!-- Дасгал ажлын дэвтрийн цахим ном (эзэмшигч 2026-11-16): /devter/<анги> — хэн ч нэвтрэлтгүй ЗӨВХӨН уншина; хэвлэх, татах,
     хуулах, засах боломжгүй. Агуулгыг админ дэвтрийн попапаас нийтэлдэг (ws-book.js publishEbook → api/_ebook.js); хуудас бүр нь
     «Ном шиг харах»-ын хуудас: ажлын хуудсыг .wsx-pb таслалуудаар хэрчинэ (үзэгчийн фонт өөр байсан ч бодлого хуваагдахгүй). -->
<style id="evcss">
html,body{height:100%}
body.ev{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:#34305a;color:#fff;font-family:'Segoe UI',Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.ev-bar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#14214A;box-shadow:0 2px 12px rgba(0,0,0,.25);z-index:5}
.ev-brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1;color:#fff;text-decoration:none}
.ev-brand img{width:28px;height:28px;border-radius:8px;flex:none}
.ev-ttl{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.ev-ttl b{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-ttl small{font-size:11.5px;font-weight:700;color:#C9C4E0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-btn{flex:none;display:grid;place-items:center;width:38px;height:38px;padding:0;border:0;border-radius:10px;background:#22305e;color:#fff;cursor:pointer}
.ev-btn:hover:not(:disabled){background:#2d3d75}.ev-btn:disabled{opacity:.35;cursor:default}
.ev-btn svg{width:20px;height:20px}
.ev-btn.on{background:#FFC93C;color:#14214A}
.ev-pn{flex:none;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#C9C4E0}
.ev-pn input{width:52px;height:34px;box-sizing:border-box;border:0;border-radius:9px;padding:0 6px;text-align:center;font:inherit;font-size:14px;font-weight:900;color:#14214A;-webkit-user-select:text;user-select:text}
.ev-sep{flex:none;width:1px;height:24px;background:#3B4A80;margin:0 2px}
.ev-stage{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y pinch-zoom;outline:0}
.ev-stage.pan{touch-action:auto}
.ev-box{position:relative;margin:12px auto}
.ev-book{position:absolute;left:0;top:0;display:flex;transform-origin:0 0}
.ev-book>.fp-w,.ev-book>.fp-l,.ev-book>.fp-r{flex:none}
.ev-book.in{animation:evin .22s ease-out}
@keyframes evin{from{opacity:.25}to{opacity:1}}
.ev-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:15px;font-weight:700;color:#E4E0F5;line-height:1.5}
.ev-msg[hidden]{display:none}
.ev-msg b{display:block;font-size:19px;font-weight:900;color:#fff;margin-bottom:6px}
.ev-msg a{color:#FFC93C;font-weight:900}
.ev-bar2{width:220px;height:6px;margin:14px auto 0;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.ev-bar2 i{display:block;height:100%;width:0;background:#FFC93C;transition:width .2s}
/* ном доторх: хэвлэлтийн харагдац (засварын хэрэгсэлгүй), агуулгын мөрөөр хуудас руу */
.ev .wsx-pb,.ev .toc-pb{margin-top:0!important}
.ev .toc-ch,.ev .toc-tp,.ev .toc-fm{cursor:pointer}
.ev .fp-pg{-webkit-user-select:none;user-select:none}
/* Номын хуудас дэвтрийн попапын body-тэй ижил бичгийн өнгөтэй — эс бөгөөс body.ev-ийн цагаан өнгийг өвлөж, өнгө заагаагүй
   бичиг (жишээ нь ажлын хуудасны .qm бодлого) цагаан дээр цагаанаар үл харагдана (эзэмшигч 2026-11-16 «бодлогууд харагдахгүй») */
.ev-book{color:#1a1530}
@media (max-width:640px){.ev-ttl small,.ev-hide-s{display:none!important}.ev-btn{width:34px;height:34px}.ev-pn input{width:46px}}
@media (max-width:899px){.ev-wide{display:none!important}}
/* хэвлэх боломжгүй */
@media print{body.ev>*{display:none!important}body.ev:after{content:"Цахим номыг хэвлэх боломжгүй — cyber-math.com";display:block;padding:40mm 10mm;color:#000;font:700 16pt Arial,sans-serif;text-align:center}}
</style>
</head>
<body class="ev">
<header class="ev-bar">
  <a class="ev-brand" href="/dasgal" target="_blank" rel="noopener" title="CyberMath · Дасгалын төв"><img src="/favicon-32.png" alt="CyberMath"><span class="ev-ttl"><b id="ttl">Дасгал ажлын дэвтэр</b><small id="sub">CyberMath · цахим ном</small></span></a>
  <button type="button" class="ev-btn" data-f="toc" title="Агуулга" aria-label="Агуулга"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg></button>
  <button type="button" class="ev-btn" data-f="prev" title="Өмнөх (←)" aria-label="Өмнөх хуудас"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <label class="ev-pn"><input id="go" type="number" inputmode="numeric" min="1" step="1" aria-label="Хуудасны дугаар"><span id="tot">/ –</span></label>
  <button type="button" class="ev-btn" data-f="next" title="Дараах (→)" aria-label="Дараах хуудас"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <span class="ev-sep ev-hide-s"></span>
  <button type="button" class="ev-btn ev-hide-s" data-f="zout" title="Жижигрүүлэх (−)" aria-label="Жижигрүүлэх"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M8 11h6"/></svg></button>
  <button type="button" class="ev-btn ev-hide-s" data-f="zin" title="Томруулах (+)" aria-label="Томруулах"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M8 11h6M11 8v6"/></svg></button>
  <button type="button" class="ev-btn" data-f="fit" id="fitb" title="Өргөнөөр / бүтэн хуудсаар" aria-label="Өргөнөөр харах"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
  <button type="button" class="ev-btn ev-wide" data-f="mode" id="modeb" title="Хоёр нүүрээр" aria-label="Хоёр нүүрээр"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"/></svg></button>
  <button type="button" class="ev-btn ev-wide" data-f="full" id="fullb" title="Бүтэн дэлгэц" aria-label="Бүтэн дэлгэц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
</header>
<main class="ev-stage" id="stage" tabindex="-1">
  <div class="ev-box" id="box"><div class="ev-book" id="book"></div></div>
  <div class="ev-msg" id="msg"><div><b>Цахим номыг ачаалж байна…</b><span id="pct"></span><div class="ev-bar2"><i id="bar"></i></div></div></div>
</main>
<script>
(function () {
  'use strict';
  var MM = 96 / 25.4, DIMS = { a4: { w: 210, h: 297, m: 11 }, b5: { w: 176, h: 250, m: 10 } };
  var $ = function (id) { return document.getElementById(id); };
  var STAGE = $('stage'), BOX = $('box'), BOOK = $('book'), MSG = $('msg');
  var DATA = null, P = [], DIM = DIMS.a4, PAGE_H = 0, I = 0, MODE = 1, FIT = 'page', Z = 1, ZS = [1, 1.25, 1.5, 2, 2.5, 3];
  var TPL = {}, CUTS = {};

  /* ── хамгаалалт: хэвлэх (@media print), хуулах, сонгох, баруун товш, чирэх, Ctrl+P/S/C/A/U ── */
  ['contextmenu', 'dragstart', 'copy', 'cut', 'selectstart'].forEach(function (t) {
    document.addEventListener(t, function (e) { if (!(e.target && e.target.closest && e.target.closest('input'))) e.preventDefault(); });
  });

  function show(html) { MSG.hidden = false; MSG.innerHTML = '<div>' + html + '</div>'; }
  function keyOf() {
    var m = /\/devter\/([A-Za-z0-9-]{1,20})\/?$/.exec(location.pathname);
    return ((m && m[1]) || new URLSearchParams(location.search).get('g') || '').toLowerCase();
  }
  // Хэсэг: хөтөч Content-Encoding: gzip-ээр өөрөө задалсан эсвэл gzip хэвээр (1f 8b) ирвэл DecompressionStream
  function unz(u8) {
    if (u8[0] !== 0x1f || u8[1] !== 0x8b) return Promise.resolve(u8);
    if (typeof DecompressionStream !== 'function') return Promise.reject(new Error('Хөтчөө шинэчилнэ үү'));
    return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function load() {
    var key = keyOf();
    if (!key) return show('<b>Цахим ном олдсонгүй</b>Холбоосоо шалгана уу.');
    fetch('/api/worksheets?ebook=' + encodeURIComponent(key)).then(function (r) { return r.json(); }).then(function (m) {
      if (!m || !m.ok) throw new Error((m && m.error) || 'Цахим ном олдсонгүй');
      $('ttl').textContent = 'Дасгал ажлын дэвтэр · ' + m.label;
      document.title = 'Дасгал ажлын дэвтэр · ' + m.label + ' — CyberMath';
      var parts = [], done = 0;
      var one = function (i) {
        return fetch('/api/worksheets?ebook=' + encodeURIComponent(key) + '&up=' + encodeURIComponent(m.up) + '&i=' + i)
          .then(function (r) { if (!r.ok) throw new Error('Хэсэг ачаалагдсангүй (' + r.status + ')'); return r.arrayBuffer(); })
          .then(function (b) { return unz(new Uint8Array(b)); })
          .then(function (u8) { parts[i] = u8; done++; $('bar').style.width = Math.round(done / m.n * 100) + '%'; });
      };
      var all = []; for (var i = 0; i < m.n; i++) all.push(one(i));
      return Promise.all(all).then(function () {
        var len = parts.reduce(function (s, p) { return s + p.length; }, 0), buf = new Uint8Array(len), o = 0;
        parts.forEach(function (p) { buf.set(p, o); o += p.length; });
        return JSON.parse(new TextDecoder().decode(buf));
      });
    }).then(start, function (e) {
      show('<b>' + esc(e.message || 'Алдаа гарлаа') + '</b>Дасгалын төв: <a href="/dasgal" target="_blank" rel="noopener">cyber-math.com/dasgal</a>');
    });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function start(d) {
    DATA = d; DIM = DIMS[d.paper] || DIMS.a4; PAGE_H = (DIM.h - 2 * DIM.m) * MM;
    if (d.paper === 'b5') document.documentElement.classList.add('b5');
    var st = document.createElement('style'); st.textContent = (d.css || []).join('\n');
    document.head.insertBefore(st, $('evcss'));                         // номын CSS эхэнд, үзэгчийнх давамгайлна
    var tq = 0;
    P = (d.pages || []).map(function (p) { if (p.k === 'toc') p.q = tq++; return p; });
    $('sub').textContent = P.length + ' хуудас · CyberMath цахим ном';
    $('tot').textContent = '/ ' + P.length;
    $('go').max = P.length;
    MODE = STAGE.clientWidth >= 1100 && STAGE.clientWidth > STAGE.clientHeight ? 2 : 1;
    FIT = STAGE.clientWidth < 700 ? 'width' : 'page';
    var h = parseInt((location.hash || '').slice(1), 10);
    MSG.hidden = true;
    goPage(h > 0 ? h - 1 : 0, true);
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { render(); });
  }

  /* ── хуудас зурах ── */
  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function frag(k, html) {
    var t = TPL[k];
    if (!t) { t = TPL[k] = document.createElement('template'); t.innerHTML = html || ''; }
    var f = t.content.firstElementChild; return f ? f.cloneNode(true) : null;
  }
  // q-р хуудас = sel (.wsx-pb / .toc-pb) таслалуудын хоорондох элементүүд; бусад нь нуугдана
  function slice(root, sel, q) {
    var cuts = [].slice.call(root.querySelectorAll(sel)), a = q > 0 ? cuts[q - 1] : null, b = q < cuts.length ? cuts[q] : null;
    (function walk(par) {
      for (var c = par.firstElementChild; c; c = c.nextElementSibling) {
        if ((a && c !== a && c.contains(a)) || (b && c !== b && c.contains(b))) { walk(c); continue; }
        var afterA = !a || c === a || !!(a.compareDocumentPosition(c) & 4), beforeB = !b || (c !== b && !!(c.compareDocumentPosition(b) & 4));
        if (!(afterA && beforeB)) c.style.display = 'none';
      }
    })(root);
  }
  function cutsOf(i) { if (CUTS[i] == null) { var f = frag('p' + i, DATA.papers[i]); CUTS[i] = f ? f.querySelectorAll('.wsx-pb').length : 0; } return CUTS[i]; }
  function numEl(no) { var n = el('div', 'fp-no'); n.textContent = no || ''; return n; }
  function pageEl(p) {
    var w = el('div', 'fp-w'), pg = el('div', 'fp-pg'); w.appendChild(pg);
    if (!p) { pg.classList.add('fp-blank'); return w; }
    if (p.k === 'cover' || p.k === 'back') { var cv = frag(p.k, p.k === 'back' ? DATA.back : DATA.cover); if (cv) pg.appendChild(cv); return w; }
    if (p.k === 'fm') { var fe = frag('fm' + p.no, p.h); if (fe) pg.appendChild(fe); pg.appendChild(numEl(p.no)); return w; }
    var src = p.k === 'toc' ? frag('toc', DATA.toc) : frag('p' + p.p, DATA.papers[p.p]); if (!src) return w;
    src.classList.add('fp-src');
    var vp = el('div', 'fp-vp');
    var px = p.k === 'ws' && p.n !== cutsOf(p.p) + 1;                    // байгалийн таслалтай (ховор) — хэвлэлийн px хэрчмээр
    if (px) { src.style.top = (-p.from) + 'px'; vp.style.height = Math.max(0, Math.min(PAGE_H, p.to - p.from)) + 'px'; }
    else {
      slice(src, p.k === 'toc' ? '.toc-pb' : '.wsx-pb', p.k === 'toc' ? p.q : p.q);
      src.style.top = '0px'; vp.style.height = PAGE_H + 'px'; w._fitSrc = src;
      // CyberMath тамга: хуудас бүрд нэг, голд нь
      var wms = [].slice.call(src.querySelectorAll('.wsx-wm'));
      if (wms.length) {
        var sh = wms[0].parentNode, zm = parseFloat(sh && sh.style.zoom) || 1;
        wms.sort(function (x, y) { return (parseFloat(x.style.top) || 0) - (parseFloat(y.style.top) || 0); });
        wms.forEach(function (m, i) { m.style.display = i === 0 ? '' : 'none'; });
        wms[0].style.top = Math.round(PAGE_H / 2 / zm) + 'px';
      }
    }
    vp.appendChild(src); pg.appendChild(vp); pg.appendChild(numEl(p.no));
    return w;
  }
  // Фонт өөр (Windows биш) төхөөрөмжид агуулга хуудаснаас бага зэрэг урт бол хуудсанд багтаан жижигрүүлнэ
  function fitSrc(w) {
    var s = w._fitSrc; if (!s) return;
    var h = s.offsetHeight;
    if (h > PAGE_H + 2) { var k = PAGE_H / h; s.style.transformOrigin = '0 0'; s.style.transform = 'scale(' + k + ')'; }
  }
  function spread(s) { return s === 0 ? [null, P[0]] : [P[2 * s - 1], P[2 * s] || null]; }
  function smax() { return Math.ceil((P.length - 1) / 2); }
  function render() {
    if (!P.length) return;
    var v = MODE === 2 ? spread(Math.floor((I + 1) / 2)) : [P[I]];
    BOOK.textContent = '';
    v.forEach(function (p, j) {
      var w = pageEl(p);
      if (MODE === 2) { var side = el('div', j ? 'fp-r' : 'fp-l'); side.appendChild(w); BOOK.appendChild(side); } else BOOK.appendChild(w);
    });
    [].forEach.call(BOOK.querySelectorAll('.fp-w'), fitSrc);
    BOOK.classList.remove('in'); void BOOK.offsetWidth; BOOK.classList.add('in');
    var nos = v.filter(Boolean).map(function (p) { return P.indexOf(p) + 1; });
    $('go').value = nos[0] || 1;
    $('tot').textContent = (nos.length > 1 ? '–' + nos[1] : '') + ' / ' + P.length;
    var first = MODE === 2 ? Math.floor((I + 1) / 2) <= 0 : I <= 0, last = MODE === 2 ? Math.floor((I + 1) / 2) >= smax() : I >= P.length - 1;
    document.querySelector('[data-f="prev"]').disabled = first;
    document.querySelector('[data-f="next"]').disabled = last;
    $('modeb').classList.toggle('on', MODE === 2);
    $('fitb').classList.toggle('on', FIT === 'width');
    try { history.replaceState(null, '', location.pathname + location.search + '#' + (I + 1)); } catch (e) {}
    fit();
  }
  function fit() {
    var W = (MODE === 2 ? 2 : 1) * DIM.w * MM, H = DIM.h * MM, cw = STAGE.clientWidth - 24, ch = STAGE.clientHeight - 24;
    var base = FIT === 'width' ? cw / W : Math.min(cw / W, ch / H), k = Math.max(0.1, base * Z);
    BOOK.style.transform = 'scale(' + k + ')';
    BOX.style.width = Math.round(W * k) + 'px'; BOX.style.height = Math.round(H * k) + 'px';
    BOX.style.margin = Math.max(12, Math.round((STAGE.clientHeight - H * k) / 2)) + 'px auto 12px';
    STAGE.classList.toggle('pan', W * k > STAGE.clientWidth + 1);
  }
  function goPage(i, quiet) {
    I = Math.max(0, Math.min(P.length - 1, i | 0));
    if (MODE === 2 && I > 0 && I % 2 === 0) I--;                        // хоёр нүүрт: зүүн талын (сондгой индекс) хуудас
    STAGE.scrollTop = 0; STAGE.scrollLeft = 0;
    if (!quiet || DATA) render();
  }
  function turn(dir) {
    if (MODE === 2) { var s = Math.floor((I + 1) / 2) + dir; if (s < 0 || s > smax()) return; goPage(s ? 2 * s - 1 : 0); return; }
    goPage(I + dir);
  }
  function tocIndex() { for (var i = 0; i < P.length; i++) if (P[i].k === 'toc') return i; return 0; }
  function zoom(dir) {
    var j = ZS.indexOf(Z); j = Math.max(0, Math.min(ZS.length - 1, (j < 0 ? 0 : j) + dir));
    if (ZS[j] === Z) return; Z = ZS[j]; fit();
  }

  /* ── удирдлага ── */
  document.querySelector('.ev-bar').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-f]'); if (!b || !DATA) return;
    var f = b.getAttribute('data-f');
    if (f === 'prev') turn(-1); else if (f === 'next') turn(1); else if (f === 'toc') goPage(tocIndex());
    else if (f === 'zin') zoom(1); else if (f === 'zout') zoom(-1);
    else if (f === 'fit') { FIT = FIT === 'width' ? 'page' : 'width'; Z = 1; render(); }
    else if (f === 'mode') { MODE = MODE === 2 ? 1 : 2; Z = 1; goPage(I); }
    else if (f === 'full') {
      var de = document.documentElement;
      if (document.fullscreenElement) document.exitFullscreen(); else if (de.requestFullscreen) de.requestFullscreen().catch(function () {});
    }
  });
  if (!document.documentElement.requestFullscreen) $('fullb').hidden = true;
  $('go').addEventListener('change', function () { goPage((+this.value || 1) - 1); this.blur(); });
  // Агуулгын мөр дээр дарвал тэр хуудас руу
  BOOK.addEventListener('click', function (e) {
    var r = e.target.closest && e.target.closest('.toc-ch, .toc-tp, .toc-fm'); if (!r) return;
    var n = parseInt((r.querySelector('em') || {}).textContent, 10); if (n > 0) goPage(n - 1);
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && /^[psacu]$/i.test(e.key)) { e.preventDefault(); return; }
    if (!DATA || (e.target && e.target.tagName === 'INPUT')) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !STAGE.classList.contains('pan'))) { e.preventDefault(); turn(1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); turn(-1); }
    else if (k === 'Home') { e.preventDefault(); goPage(0); } else if (k === 'End') { e.preventDefault(); goPage(P.length - 1); }
    else if (k === '+' || k === '=') zoom(1); else if (k === '-') zoom(-1);
  });
  // Хуруугаар шударч эргүүлнэ (томруулаагүй үед)
  var T = null;
  STAGE.addEventListener('pointerdown', function (e) { T = e.isPrimary ? { x: e.clientX, y: e.clientY, t: Date.now() } : null; });
  STAGE.addEventListener('pointerup', function (e) {
    if (!T || !DATA) return;
    var dx = e.clientX - T.x, dy = e.clientY - T.y, quick = Date.now() - T.t < 700; T = null;
    if (quick && Math.abs(dx) > 60 && Math.abs(dx) > 1.6 * Math.abs(dy) && !STAGE.classList.contains('pan')) turn(dx < 0 ? 1 : -1);
  });
  STAGE.addEventListener('pointercancel', function () { T = null; });
  window.addEventListener('resize', function () { if (DATA) fit(); });
  window.addEventListener('hashchange', function () { var h = parseInt(location.hash.slice(1), 10); if (DATA && h > 0 && h - 1 !== I) goPage(h - 1); });
  load();
})();
</script>
