/* ЭЕШ 1000 — Тригонометр-1 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Тригонометр функцийн утга, адилтгал, хялбарчлах, урвуу тригонометр функц.

/* 2.38 */
var e2_38 = (function () {
// 38. cosec, sec, ctg-ийн утга: θ-г [0°; 360°)-д шилжүүлж, хамаарах өнцөг ρ ∈ {30°, 45°, 60°} ба мөчлөгийн тэмдгээр.
//     cosec = 1/sin, sec = 1/cos, ctg = cos/sin; сурах бичгийн хэлбэрээр 1/√3, 2/√3 (рационалчлахгүй). Эх: cosec 30° = 2.
var p38_V = {
  cosec: { 30: '2', 45: '\\sqrt{2}', 60: '\\dfrac{2}{\\sqrt{3}}' },
  sec: { 30: '\\dfrac{2}{\\sqrt{3}}', 45: '\\sqrt{2}', 60: '2' },
  ctg: { 30: '\\sqrt{3}', 45: '1', 60: '\\dfrac{1}{\\sqrt{3}}' }

var p38_N = { cosec: '\\operatorname{cosec}', sec: '\\sec', ctg: '\\operatorname{ctg}' };

function p38() {
  var fn = pick(['cosec', 'sec', 'ctg']), th = pick(p38_TH);

  var sS = q < 2 ? 1 : -1, sC = q === 0 || q === 3 ? 1 : -1, s = fn === 'cosec' ? sS : fn === 'sec' ? sC : sS * sC;
  var lhs = p38_N[fn] + (th < 0 ? '(' + th + DEG + ')' : ' ' + th + DEG);
  return {
    q: '$' + lhs + '$ утгыг ол.',
    a: '$' + lhs + '=' + (s < 0 ? '-' : '') + p38_V[fn][rho] + '$',
    wk: 16,
    t: { fn: fn, th: th }
  };
}
return p38;
})();

/* 2.39 */
var e2_39 = (function () {
// 39. 15°-ийн сондгой үржвэр өнцгүүд: sin(45° ± 30°) томьёо → sin 15° = cos 75° = (√6 − √2)/4, sin 75° = cos 15° = (√6 + √2)/4,
//     tg 15° = ctg 75° = 2 − √3, tg 75° = ctg 15° = 2 + √3; бусад мөчлөгт хамаарах өнцөг ба тэмдгээр (эх: sin 75°).
function p39() {
  var fn = pick(['sin', 'sin', 'sin', 'cos', 'cos', 'cos', 'tg', 'tg', 'ctg']), th = pick([15, 75, 105, 165, 15, 75, 105, 165, 195, 255, 285, 345, -15, -75]);
  var u = ((th % 360) + 360) % 360, q = Math.floor(u / 90), rho = [u, 180 - u, u - 180, 360 - u][q];
  var sS = q < 2 ? 1 : -1, sC = q === 0 || q === 3 ? 1 : -1, s = fn === 'sin' ? sS : fn === 'cos' ? sC : sS * sC;
  var big = fn === 'sin' || fn === 'tg' ? rho === 75 : rho === 15, val;    // big: (√6 + √2)/4 эсвэл 2 + √3
  if (fn === 'sin' || fn === 'cos') val = big ? (s > 0 ? '' : '-') + '\\dfrac{\\sqrt{6}+\\sqrt{2}}{4}' : '\\dfrac{' + (s > 0 ? '\\sqrt{6}-\\sqrt{2}' : '\\sqrt{2}-\\sqrt{6}') + '}{4}';
  else val = big ? (s > 0 ? '2+\\sqrt{3}' : '-2-\\sqrt{3}') : (s > 0 ? '2-\\sqrt{3}' : '\\sqrt{3}-2');
  var lhs = (fn === 'sin' || fn === 'cos' ? '\\' + fn : '\\operatorname{' + fn + '}') + (th < 0 ? '(' + th + DEG + ')' : ' ' + th + DEG);
  return {
    q: '$' + lhs + '$ утгыг ол.',
    a: '$' + lhs + '=' + val + '$',
    wk: 20,
    t: { fn: fn, th: th }

})();

/* 2.40 */
var e2_40 = (function () {
// 40. sin a·cos b ∓ cos a·sin b = sin(a ∓ b),  cos a·cos b ∓ sin a·sin b = cos(a ± b);  a ± b нь стандарт өнцөг,
//     a, b нь 15°-д хуваагдахгүй (эх: sin 51°·cos 21° − cos 51°·sin 21° = sin 30° = 1/2).

function p40_v(v) {   // стандарт утгыг TeX болгох
  for (var i = 0; i < p40_T.length; i++) if (Math.abs(Math.abs(v) - p40_T[i][0]) < 1e-9) return (v < -1e-9 ? '-' : '') + p40_T[i][1];

}
function p40() {
  var type = rnd(0, 3), sum = type === 1 || type === 2, a, b, s;     // 0: sin(a−b) · 1: sin(a+b) · 2: cos(a+b) · 3: cos(a−b)
  if (sum) { s = pick([30, 45, 60, 90, 120, 135, 150]); a = rnd(4, s - 4); b = s - a; }
  else { s = pick([30, 45, 60, 90, 30, 45, 60, -30, -45, -60]); b = rnd(5, 80); a = b + s; }
  if (a < 4 || a > 176 || a % 15 === 0 || a === b) return null;

  if (val == null) return null;
  var A = a + DEG, B = b + DEG;
  var e = type < 2 ? '\\sin ' + A + '\\cos ' + B + (type ? '+' : '-') + '\\cos ' + A + '\\sin ' + B
    : '\\cos ' + A + '\\cos ' + B + (type === 2 ? '-' : '+') + '\\sin ' + A + '\\sin ' + B;
  return {
    q: '$' + e + '$ илэрхийллийн утгыг ол.',

})();

/* 1.34 */
var e1_34 = (function () {
// 34. sin x·cos x = p, x ∈ ]0; π/4[ эсвэл ]π/4; π/2[ → (sin x ∓ cos x)² = 1 ∓ 2p, тэмдгийг мужаар
//     (sin x − cos x нь ]0; π/4[ дээр сөрөг; sin x + cos x үргэлж эерэг). Эх: p = 1/4, ]0; π/4[ → −√2/2.

function p34_sq(n, d) {   // √(n/d) хялбарчилсан TeX (n, d > 0)
  var s = surd(n * d), g = gcd(s.k, d), k = s.k / g, dd = d / g, num = s.r === 1 ? String(k) : rt(k, s.r);
  return dd === 1 ? num : '\\dfrac{' + num + '}{' + dd + '}';

  var P = pick(p34_P), low = rnd(0, 1) === 1, minus = rnd(0, 3) > 0;
  var I = low ? '\\left]0,\\ \\dfrac{\\pi}{4}\\right[' : '\\left]\\dfrac{\\pi}{4},\\ \\dfrac{\\pi}{2}\\right[';
  var E = minus ? '\\sin x-\\cos x' : '\\sin x+\\cos x', val = p34_sq(minus ? P[1] - 2 * P[0] : P[1] + 2 * P[0], P[1]);
  // Бодолт (гар бичмэл): (sin x ± cos x)² = sin²x + cos²x ± 2 sin x cos x = 1 ± 2p; тэмдгийг мужаас (нэгж тойрог дээр y = x шулуунтай харьцуулж).
  var sq = fr(minus ? P[1] - 2 * P[0] : P[1] + 2 * P[0], P[1]), neg = minus && low, pv = fr(P[0], P[1]);
  var why = !minus ? '$x\\in' + I + '$ үед $\\sin x\\gt 0$, $\\cos x\\gt 0$ тул $\\sin x+\\cos x\\gt 0$.'
    : '$x\\in' + I + '$ үед нэгж тойргийн $M(\\cos x;\\,\\sin x)$ цэг $y=x$ шулуунаас ' + (low ? 'доор' : 'дээр') + ' оршино (зураг), өөрөөр хэлбэл '
      + (low ? '$\\cos x\\gt\\sin x$ (жишээ нь $\\cos 30' + DEG + '=\\dfrac{\\sqrt{3}}{2}\\gt\\sin 30' + DEG + '=\\dfrac{1}{2}$) тул $\\sin x-\\cos x\\lt 0$.'
        : '$\\sin x\\gt\\cos x$ (жишээ нь $\\sin 60' + DEG + '=\\dfrac{\\sqrt{3}}{2}\\gt\\cos 60' + DEG + '=\\dfrac{1}{2}$) тул $\\sin x-\\cos x\\gt 0$.');
  return {
    q: '$x\\in' + I + '$ ба $\\sin x\\cdot\\cos x=' + fr(P[0], P[1]) + '$ бол $' + E + '=?$',
    a: '$' + E + '=' + (minus && low ? '-' : '') + val + '$', wk: 26,
    s: [
      'Квадрат зэрэгт дэвшүүлж $\\sin^2x+\\cos^2x=1$-ийг ашиглая: $$(' + E + ')^2=\\sin^2x+\\cos^2x' + (minus ? '-' : '+') + '2\\sin x\\cos x=1' + (minus ? '-' : '+')
        + '2\\cdot ' + pv + '=' + sq + '.$$ Эндээс $' + E + '=\\pm\\sqrt{' + sq + '}$.',
      why + ' Иймд $$' + E + '=' + (neg ? '-' : '') + '\\sqrt{' + sq + '}=' + (neg ? '-' : '') + val + '.$$'
    ],

// Бодолтын зураг: нэгж тойрог, y = x шулуун, x-ийн муж (нум) ба M(cos x; sin x) цэгийн проекцууд
function p34_fig(low, x0) {
  var x = low ? x0 : Math.PI / 2 - x0, M = [Math.cos(x), Math.sin(x)], K = '#5a32d6';
  var f = Fig({ w: 160, view: [-0.45, 1.3, -0.32, 1.3], pad: 10, padR: 18 });
  // «cos x», «sin x»: функцийн нэр босоо, x налуу
  var fx = function (P, nm, anc, dx, dy) {
    return function (T) {
      return '<text x="' + (T.X(P[0]) + dx).toFixed(2) + '" y="' + (T.Y(P[1]) + dy).toFixed(2) + '" font-size="11" font-family="\'KaTeX_Main\',\'Times New Roman\',serif" text-anchor="'

    };
  };
  f.axes({ ext: 6 }).arc([0, 0], 1, 0, 90, { w: 1.1, c: '#888' }).seg([0, 0], [1.18, 1.18], { dash: '5 3', w: 1 })
    .arc([0, 0], 1, low ? 0 : 45, low ? 45 : 90, { w: 3.2, c: K })
    .seg([0, 0], M, { w: 1 }).seg(M, [M[0], 0], { dash: '3 2', w: 0.9 }).seg(M, [0, M[1]], { dash: '3 2', w: 0.9 }).dot(M, { r: 2.4 })
    .text(M, 'M', { pos: low ? 'e' : 'ne', size: 12 }).text([1.16, 1.16], 'y=x', { pos: 'w', size: 11 })
    .raw(fx([M[0], 0], 'cos', 'middle', 0, 13)).raw(fx([0, M[1]], 'sin', 'end', -4, 4));

return p34;
})();

/* 1.75 */
var e1_75 = (function () {
// 75. Өгсөн завсарт sin x ба cos x-ийг жиших: (45°; 225°)-д sin x > cos x,
//     [0°; 45°) ба (225°; 360°]-д sin x < cos x (45°, 225°-д тэнцүү тул тэдгээр нь завсарт орохгүй).
var p75_ANG = [0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330, 360];
// Бодолтын зургийн шошго (дэлгэцийн px): тэнхлэг, биссектрис, тойрог (segs) ба өмнөх шошго/цэгээс (taken) хамгийн хол,

function p75_lab(P, s, pref, segs, taken, box) {
  var M = Math, size = 11, wpx = 6 * s.length, hpx = 9, best = null, a, ring, k;
  function pseg(q, A, B) {
    var vx = B[0] - A[0], vy = B[1] - A[1], L = vx * vx + vy * vy, t = L ? ((q[0] - A[0]) * vx + (q[1] - A[1]) * vy) / L : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return M.hypot(q[0] - A[0] - t * vx, q[1] - A[1] - t * vy);
  }
  function dist(A, B, R) {   // хэрчмээс тэгш өнцөгт хүртэл (огтолбол 0)
    var C = [[R[0], R[2]], [R[1], R[2]], [R[1], R[3]], [R[0], R[3]]], d = Infinity, i, n = 24;
    for (i = 0; i <= n; i++) {
      var x = A[0] + (B[0] - A[0]) * i / n, y = A[1] + (B[1] - A[1]) * i / n;
      if (x >= R[0] && x <= R[1] && y >= R[2] && y <= R[3]) return 0;
    }
    for (i = 0; i < 4; i++) d = M.min(d, pseg(C[i], A, B));
    [A, B].forEach(function (q) { d = M.min(d, M.hypot(M.max(R[0] - q[0], 0, q[0] - R[1]), M.max(R[2] - q[1], 0, q[1] - R[3]))); });
    return d;
  }

    var anc = cx > 0.35 ? 1 : cx < -0.35 ? -1 : 0;

    for (k = 0; k < segs.length && sc > 0; k++) sc = M.min(sc, dist(segs[k][0], segs[k][1], R));
    for (k = 0; k < taken.length; k++) sc = M.min(sc, M.max(M.abs(bx - taken[k][0]) - (wpx + taken[k][2]) / 2, M.abs(y - taken[k][1]) - (hpx + taken[k][3]) / 2));
    if (R[0] < box[0] || R[1] > box[1] || R[2] < box[2] || R[3] > box[3]) sc -= 6;
    var dif = M.abs(((a - pref) % 360 + 540) % 360 - 180), v = M.min(sc, 5) - dif / 900 - ring * 0.8;
    if (!best || v > best.v) best = { v: v, a: a, off: r0 - 0.35 * size, c: [bx, y, wpx, hpx] };
  }

}
// Бодолт: «$…$-дагавар»-ыг нэг мөрөнд байлгах (мөр таслалт дагаврын өмнө орохгүй)
function p75_nw(t) { return t.replace(/\$[^$]+\$-[А-Яа-яЁёӨөҮү]+/g, function (m) { return '<span class="nw">' + m + '</span>'; }); }
function p75() {
  var reg = pick([0, 0, 1, 1, 1, 2, 2]);               // 0: [0°;45°) · 1: (45°;225°) · 2: (225°;360°]
  var L = [0, 45, 225][reg], R = [45, 225, 360][reg];
  var los = p75_ANG.filter(function (x) { return x >= L && x < R; }), lo = pick(los);
  var his = p75_ANG.filter(function (x) { return x > lo && x <= R; }), hi = pick(his);
  if (reg && hi - lo < 30) return null;
  // 45°, 225° дээр sin x = cos x → тэр төгсгөлийг оруулахгүй
  var loIn = lo !== 45 && lo !== 225 && rnd(0, 2) > 0, hiIn = hi !== 45 && hi !== 225 && rnd(0, 2) === 0;
  var deg = function (x) { return x === 0 ? '0' : x + DEG; };

  var U = function (a) { return [Math.cos(a * Math.PI / 180), Math.sin(a * Math.PI / 180)]; }, sg = Fig({ view: [-1.6, 1.6, -1.35, 1.35], w: 170 });
  // шошгыг тэнхлэг, биссектрис, тойргоос холдуулна (масштаб: (170 − 32) / 3.2 px нэгжид, Fig-ийн адил)

    .dot(U(lo), { r: 2.8, open: !loIn, c: '#7B52EE' }).dot(U(hi), { r: 2.8, open: !hiIn, c: '#7B52EE' });

    a: reg === 1 ? '$\\sin x\\gt\\cos x$' : '$\\sin x\\lt\\cos x$',
    wk: 18,
    s: [
      'Нэгж тойргийн $x$ өнцөгт харгалзах цэгийн абсцисс нь $\\cos x$, ординат нь $\\sin x$. I ба III мөчийн биссектрис тойргийг $45^\\circ$, $225^\\circ$-д огтлох ба тэнд $\\sin x=\\cos x$.',
      'Биссектрисээс дээш орших $45^\\circ\\lt x\\lt 225^\\circ$ нуманд ординат нь абсциссаас их $(\\sin x\\gt\\cos x)$, доош орших $0\\le x\\lt 45^\\circ$, $225^\\circ\\lt x\\le 360^\\circ$ нумуудад бага $(\\sin x\\lt\\cos x)$.',
      'Өгсөн $' + intv + '$ завсарт харгалзах нум (зурагт тодруулсан) биссектрисээс ' + (reg === 1 ? 'дээш' : 'доош') + ' оршино. Иймд $\\sin x' + (reg === 1 ? '\\gt' : '\\lt') + '\\cos x$.'
    ].map(p75_nw),
    sfig: sg.svg(),
    t: { lo: lo, hi: hi }

}
return p75;
})();

/* 1.87 */
var e1_87 = (function () {
// 87. y = a + b·sin x (cos x)-ийн графикаас: a = (max + min)/2, |b| = (max − min)/2,
//     b-ийн тэмдэг x = 90° (cos бол x = 0°) дээрх утгаар (дээд цэг → b > 0) → a·b.
// Бодолтын мөр доторх ($…$) томьёог мөр хооронд таслахгүй ($$…$$-д хүрэхгүй)
function p87_nw(s) { return s.split(/(\$\$[\s\S]*?\$\$)/).map(function (p, i) { return i % 2 ? p : p.replace(/\$[^$]+\$(-[А-Яа-яЁёӨөҮү]+)?[.,;:)]*/g, function (m) { return '<span class="nw">' + m + '</span>'; }); }).join(''); }
function p87() {

  if (lo < -3 || hi > 5) return null;
