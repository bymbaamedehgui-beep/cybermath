<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>n зэргийн язгуур ба арифметик язгуур (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px}
  .grid.cols3{grid-template-columns:repeat(3,1fr);gap:7px 16px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:15px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.sm{height:13mm}.work.md{height:17mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var LAB=['а','б','в','г','д','е','ё','ж','з','и','й','к','л','м','н','о','п','р','с','т','у'];
function rad(n,inner){return n===2?('\\sqrt{'+inner+'}'):('\\sqrt['+n+']{'+inner+'}');}
function ipow(b,n){var r=1;for(var i=0;i<n;i++)r*=b;return r;}
function numFmt(v){if(Math.abs(v-Math.round(v))<1e-9)return ''+Math.round(v);var s=v.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');return s;}
function rootFloat(A,n){if(A<0){return (n%2===1)?-Math.pow(-A,1/n):NaN;}return Math.pow(A,1/n);}
var BMAX={2:31,3:12,4:6,5:4,6:3};
// ── Генераторууд ──
// 1) n зэргийн язгуурыг ол (бүх бодит язгуур)
function gRoots(){
  var n=pick([2,2,3,3,4,4,5,6]),b=rnd(2,BMAX[n]),a,ans;
  if(n%2===1){var s=pick([1,-1]);a=ipow(s*b,n);ans=''+(s*b);}
  else if(rnd(0,3)===0){a=-ipow(b,n);ans='\\text{бодит язгуургүй}';}
  else {a=ipow(b,n);ans='\\pm '+b;}
  if(Math.abs(a)>3000)return null;
  return {type:'roots',q:'a = '+a+',\\ \\ n = '+n,a:ans};
}
// 2) Илэрхийллийн утгыг ол (арифметик язгуур: коэфф, зэрэг доторлосон, аравт)
function gEval(){
  var sub=pick(['plain','plain','coef','powin','dec','coefdec']);
  var n=pick([2,3,4,5]);
  if(sub==='dec'||sub==='coefdec'){
    var base=pick([0.1,0.2,0.5,0.3,0.4,1.5,2.5]);
    var A=Math.pow(base,n);var Adisp=numFmt(A);
    var k=(sub==='coefdec')?pick([2,3,4,5,0.5,10]):1;
    var v=k*base;
    return {type:'eval',q:(k===1?'':numFmt(k)+'\\cdot ')+rad(n,Adisp),a:numFmt(v),fv:k*rootFloat(A,n)};
  }
  var m=rnd(2,BMAX[n]);
  if(sub==='powin'){
    // зэрэг доторлосон: ⁿ√((±m)^n)
    var neg=pick([1,-1]);
    var innerVal=ipow(neg*m,n);
    var innerDisp=(neg===-1?'(-'+m+')':(''+m))+'^{'+n+'}';
    var v2=(n%2===1)?neg*m:m;
    var k2=(rnd(0,1))?pick([2,3,0.5,-2,-3]):1;
    return {type:'eval',q:(k2===1?'':numFmt(k2)+'\\cdot ')+rad(n,innerDisp),a:numFmt(k2*v2),fv:k2*rootFloat(innerVal,n)};
  }
  // plain / coef: ⁿ√(m^n) буюу коэфф·ⁿ√(том тоо)
  var s2=(n%2===1)?pick([1,-1]):1;   // сондгойд сөрөг байж болно
  var A2=ipow(s2*m,n),v3=(n%2===1)?s2*m:m;
  if(Math.abs(A2)>3000)return null;
  var k3=(sub==='coef')?pick([2,3,4,5,-2,-3]):1;
  return {type:'eval',q:(k3===1?'':numFmt(k3)+'\\cdot ')+rad(n,''+A2),a:numFmt(k3*v3),fv:k3*rootFloat(A2,n)};
}
// 3) Бодит утгатай юу? (Тийм/Үгүй)
function gReal(){
  var n=pick([2,3,4,5,6]),m=rnd(2,9);
  var forms=[
    {q:rad(n,'-'+ipow(m,2)),A:-ipow(m,2)},            // ⁿ√(-25)
    {q:rad(n,'-'+m+'^{'+n+'}'),A:-ipow(m,n)},         // ⁿ√(-m^n)
    {q:rad(n,'(-'+m+')^{'+n+'}'),A:ipow(-m,n)},       // ⁿ√((-m)^n)
    {q:rad(n,''+ipow(m,2)),A:ipow(m,2)}               // ⁿ√(25)
  ];
  var f=pick(forms);
  var real=(n%2===1)||(f.A>=0);
  return {type:'real',q:f.q,a:real?'\\text{Тийм}':'\\text{Үгүй}'};
}
function okFv(f){return f&&(f.fv===undefined||f.fv===null||(isFinite(f.fv)&&Math.abs(parseFloat((''+f.a).replace(/[^0-9.\-]/g,''))-f.fv)<1e-4)||/text/.test(f.a));}
function gen(fn){for(var t=0;t<200;t++){var f=fn();if(f&&okFv(f))return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
// бодлого/хариуг DOM дэс дарааллаар нь дахин дугаарлана
function relabel(sheet){
  var qs=sheet.querySelectorAll('.grid .q');
  for(var i=0;i<qs.length;i++){var el=qs[i].querySelector('.ql');if(el)el.textContent=(LAB[i]||('#'+(i+1)))+')';}
  var as=sheet.querySelectorAll('#answers .a');
  for(var j=0;j<as.length;j++){var e2=as[j].querySelector('.an');if(e2)e2.textContent=(LAB[j]||('#'+(j+1)))+')';}
}
// хамгийн олон бодлоготой хэсгээс нь тэнцвэртэй хасаж А4-т багтаана (3 хэсэг ижил үлдэнэ)
function trimToFitBalanced(sheet,target){
  var guard=0,h=probeH(sheet);
  while(h>target&&guard++<300){
    var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;
    for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>4){bestN=n;best=s;}}
    if(best<0)break;
    var qs=grids[best].querySelectorAll('.q'),last=qs[qs.length-1],k=last.getAttribute('data-k');
    var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);
    last.parentNode.removeChild(last);
    relabel(sheet);h=probeH(sheet);
  }
}
function build(){
  var WORK=!!window.WS_WORK;
  var S=[[],[],[]],seen={};window.__PROB=[];
  function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<1000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;S[idx].push(f);c++;}}
  var per=WORK?9:26;   // 3 хэсэгт ижил тоогоор эхэлж, багтахгүйг тэнцвэртэй хасна
  fill(0,gRoots,per);fill(1,gEval,per);fill(2,gReal,per);
  var gcls=WORK?'':' cols3',K=0;
  function block(arr,cls,sec,noWork){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'" data-sec="'+sec+'"><div class="qeq"><span class="ql"></span><span class="qm">$'+f.q+'$</span></div>'+((WORK&&!noWork)?'<div class="work '+cls+'"></div>':'')+'</div>';}).join('');}
  var b1=block(S[0],'sm',1,true),b2=block(S[1],'md',2,false),b3=block(S[2],'sm',3,true);
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>$'+p.f.a+'$</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>n зэргийн язгуур ба арифметик язгуур</h1></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$b^{n}=a\\Leftrightarrow b=\\sqrt[n]{a}$ &nbsp;·&nbsp; $n$ тэгш: $a\\ge0$ бол $\\pm$; $a<0$ бол язгуургүй &nbsp;·&nbsp; $n$ сондгой: нэг язгуур &nbsp;·&nbsp; арифметик $\\sqrt[n]{a}\\ge0$</div>'
    +'<div class="task">1. n зэргийн язгуурыг (бүх бодит) ол.</div>'
    +'<div class="grid'+gcls+'" data-sec="1">'+b1+'</div>'
    +'<div class="task">2. Илэрхийллийн утгыг ол.</div>'
    +'<div class="grid'+gcls+'" data-sec="2">'+b2+'</div>'
    +'<div class="task">3. Бодит утгатай эсэхийг тодорхойл (Тийм / Үгүй).</div>'
    +'<div class="grid'+gcls+'" data-sec="3">'+b3+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='n зэргийн язгуур ба арифметик язгуур (10-р анги)';
  relabel(document.getElementById('sheet'));
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFitBalanced(document.getElementById('sheet'),1035);}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=35"></script>
</body>
</html>
