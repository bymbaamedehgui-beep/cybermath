<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Огтлогчуудын чанар (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:13.5px}
  .qfig{display:flex;gap:10px;align-items:center;margin-top:4px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:40mm;margin-top:5px;flex:1}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:28px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="toggleWork()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function toggleWork(){layout();}
function lineCircle(K,ang){var c=Math.cos(ang),s=Math.sin(ang);var b=2*(K[0]*c+K[1]*s);var cc=K[0]*K[0]+K[1]*K[1]-1;var disc=Math.sqrt(Math.max(0,b*b-4*cc));var t1=(-b+disc)/2,t2=(-b-disc)/2;return [[K[0]+t1*c,K[1]+t1*s],[K[0]+t2*c,K[1]+t2*s]];}
// Хоёр огтлогч гадна M цэгээс — A,B (ойр,алс) ба C,D (ойр,алс)
function twoSecSVG(seed){
  var om=[1.8,2.0,2.2,2.4][seed%4],M=[-om,0],maxP=Math.asin(0.9/om);
  var up=maxP*[0.55,0.72][(seed>>1)%2],dn=maxP*[0.52,0.7][(seed>>2)%2];
  var s1=lineCircle(M,up),s2=lineCircle(M,-dn);
  function d2(p){return (p[0]-M[0])*(p[0]-M[0])+(p[1]-M[1])*(p[1]-M[1]);}
  var A=d2(s1[0])<d2(s1[1])?s1[0]:s1[1],B=d2(s1[0])<d2(s1[1])?s1[1]:s1[0];
  var C=d2(s2[0])<d2(s2[1])?s2[0]:s2[1],D=d2(s2[0])<d2(s2[1])?s2[1]:s2[0];
  var phi=[0,55,100,150,210,300,335][seed%7]*Math.PI/180;
  function rot(p){return [p[0]*Math.cos(phi)-p[1]*Math.sin(phi),p[0]*Math.sin(phi)+p[1]*Math.cos(phi)];}
  var pM=rot(M),pA=rot(A),pB=rot(B),pC=rot(C),pD=rot(D),pO=[0,0];
  var all=[pM,pA,pB,pC,pD,[1,0],[-1,0],[0,1],[0,-1]];
  var xs=all.map(function(p){return p[0];}),ys=all.map(function(p){return p[1];});
  var minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs),minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
  var W=204,H=150,pad=17,sc=Math.min((W-2*pad)/(maxX-minX),(H-2*pad)/(maxY-minY));
  function px(p){return (pad+(p[0]-minX)*sc);}function py(p){return (H-pad-(p[1]-minY)*sc);}
  function line(p,q,col,w){return '<line x1="'+px(p).toFixed(1)+'" y1="'+py(p).toFixed(1)+'" x2="'+px(q).toFixed(1)+'" y2="'+py(q).toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+'"/>';}
  function dot(p){return '<circle cx="'+px(p).toFixed(1)+'" cy="'+py(p).toFixed(1)+'" r="2.1" fill="#111"/>';}
  function lab(p,t){var ox=px(p)-px(pO),oy=py(p)-py(pO),n=Math.max(1,Math.sqrt(ox*ox+oy*oy));return '<text x="'+(px(p)+ox/n*11).toFixed(1)+'" y="'+(py(p)+oy/n*11+4).toFixed(1)+'" font-size="11.5" font-weight="700" text-anchor="middle">'+t+'</text>';}
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="flex-shrink:0">'
   +'<circle cx="'+px(pO).toFixed(1)+'" cy="'+py(pO).toFixed(1)+'" r="'+sc.toFixed(1)+'" fill="none" stroke="#2b7fd4" stroke-width="1.5"/>'
   +line(pM,pB,'#7B52EE',1.6)+line(pM,pD,'#16a34a',1.6)
   +dot(pM)+dot(pA)+dot(pB)+dot(pC)+dot(pD)
   +lab(pM,'M')+lab(pA,'A')+lab(pB,'B')+lab(pC,'C')+lab(pD,'D')
   +'</svg>';}
function g1(){for(var t=0;t<300;t++){var MA=rnd(3,10),MB=rnd(MA+2,20),P=MA*MB,MC=rnd(3,18);if(P%MC)continue;var MD=P/MC;if(MD<=MC||MD>44||MC===MA)continue;return {q:'$M$ цэгээс хоёр огтлогч татав. $MA='+MA+'$, $MC='+MC+'$, $MD='+MD+'$ бол $MB=?$',a:'$MB=\\dfrac{MC\\cdot MD}{MA}=\\dfrac{'+MC+'\\cdot'+MD+'}{'+MA+'}='+MB+'$',seed:rnd(0,34),ok:true};}return null;}
function g2(){for(var t=0;t<300;t++){var MA=rnd(3,10),MB=rnd(MA+2,20),P=MA*MB,MC=rnd(3,18);if(P%MC)continue;var MD=P/MC;if(MD<=MC||MD>44||MC===MA)continue;return {q:'$M$ цэгээс хоёр огтлогч татав. $MA='+MA+'$, $MB='+MB+'$, $MC='+MC+'$ бол $MD=?$',a:'$MD=\\dfrac{MA\\cdot MB}{MC}=\\dfrac{'+MA+'\\cdot'+MB+'}{'+MC+'}='+MD+'$',seed:rnd(0,34),ok:true};}return null;}
function g3(){for(var t=0;t<300;t++){var MA=rnd(3,10),MB=rnd(MA+2,20),P=MA*MB,MC=rnd(3,18);if(P%MC)continue;var MD=P/MC;if(MD<=MC||MD>44||MC===MA)continue;return {q:'$M$ цэгээс хоёр огтлогч татав. $MB='+MB+'$, $MC='+MC+'$, $MD='+MD+'$ бол $MA=?$',a:'$MA=\\dfrac{MC\\cdot MD}{MB}=\\dfrac{'+MC+'\\cdot'+MD+'}{'+MB+'}='+MA+'$',seed:rnd(0,34),ok:true};}return null;}
function gen(fn){for(var t=0;t<400;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т','у','ү'];
function relabel(sheet){var grids=sheet.querySelectorAll('.grid'),map={};
  for(var g=0;g<grids.length;g++){var qs=grids[g].querySelectorAll('.q');
    for(var i=0;i<qs.length;i++){var letter=LET[i]||('#'+(i+1));var ql=qs[i].querySelector('.ql');if(ql)ql.textContent=letter+')';map[qs[i].getAttribute('data-k')]=(g+1)+letter+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFitBalanced(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<60){var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs=grids[best].querySelectorAll('.q');var last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var P=[[],[],[]];
  function fill(idx,fn,n){var seen={},c=0,tr=0;while(c<n&&tr<6000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;P[idx].push(f);c++;}}
  fill(0,g1,4);fill(1,g2,4);fill(2,g3,4);return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){
  var WK=document.getElementById('sw').checked;
  var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div><div class="qfig">'+twoSecSVG(f.seed)+(WK?'<div class="wk"></div>':'')+'</div></div>';}).join('');}
  var b=[block(S[0]),block(S[1]),block(S[2])];
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>'+p.f.a+'</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Огтлогчуудын чанар</h1><div class="sub">Гадна цэгээс татсан хоёр огтлогч · $MA\\cdot MB=MC\\cdot MD$ · 9-р анги · 6.3</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$M$ цэгээс тойрогт хоёр огтлогч татахад нэг огтлогчийн ойр ба алс хэрчмүүдийн үржвэр нөгөө огтлогчийнхтэй тэнцүү: $MA\\cdot MB=MC\\cdot MD$ ($A,C$ — ойр; $B,D$ — алс цэгүүд).</div>'
    +'<div class="task">1. Эхний огтлогчийн алс хэрчмийг ($MB$) ол.</div><div class="grid">'+b[0]+'</div>'
    +'<div class="task">2. Хоёр дахь огтлогчийн алс хэрчмийг ($MD$) ол.</div><div class="grid">'+b[1]+'</div>'
    +'<div class="task">3. Эхний огтлогчийн ойр хэрчмийг ($MA$) ол.</div><div class="grid">'+b[2]+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Огтлогчуудын чанар';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFitBalanced(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
