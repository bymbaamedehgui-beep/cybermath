<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Дасгалын төв — Промо код</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root{--bg:#0E0B2B;--bg2:#171243;--card:#1c1650;--line:#2c2470;--yellow:#FFC113;--yellow2:#FFF587;--cyan:#5AC5F1;--ink:#F3F0FF;--soft:#a99fe0;--red:#ff6b6b;--green:#4ade80}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#221a5c 0%,var(--bg) 60%);color:var(--ink);min-height:100vh;padding:22px 16px 60px}
  .wrap{max-width:1080px;margin:0 auto}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--yellow),#ff9d2e);display:grid;place-items:center;flex:none;box-shadow:0 10px 26px -10px rgba(255,193,19,.7)}
  .logo svg{width:26px;height:26px}
  h1{font-size:1.5rem;font-weight:900;letter-spacing:.3px}
  .sub{color:var(--soft);font-size:.86rem;margin-top:2px}
  .clock{margin-left:auto;text-align:right}
  .clock .now{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:1.05rem;font-weight:800;color:var(--yellow2)}
  .clock .lbl{font-size:.72rem;color:var(--soft)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 20px;align-items:center}
  .chip{border:1px solid var(--line);background:var(--bg2);color:var(--soft);border-radius:999px;padding:6px 14px;font-size:.8rem;font-weight:700;cursor:pointer;user-select:none}
  .chip.on{background:var(--yellow);color:#241B00;border-color:var(--yellow)}
  .refresh,.newbtn{border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:999px;padding:6px 15px;font-size:.8rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .newbtn{background:linear-gradient(135deg,var(--yellow),#ff9d2e);color:#241B00;border:0}
  .refresh{margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
  .card.dead{opacity:.5;filter:grayscale(.55)}
  .card::before{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--cyan);opacity:.10}
  .row1{display:flex;align-items:flex-start;gap:12px}
  .qrbox{width:92px;height:92px;flex:none;background:#fff;border-radius:12px;padding:6px;display:grid;place-items:center}
  .qrbox canvas{width:100%;height:100%;image-rendering:pixelated;border-radius:6px}
  .qrfail{font-size:.6rem;color:#888;text-align:center;padding:4px}
  .cinfo{flex:1;min-width:0}
  .disc{display:inline-flex;align-items:baseline;gap:4px;font-weight:900;color:#241B00;background:var(--yellow);border-radius:9px;padding:3px 10px;margin-bottom:8px}
  .disc b{font-size:1.15rem;line-height:1}
  .disc span{font-size:.72rem;font-weight:800}
  .plan{display:inline-block;font-size:.68rem;font-weight:800;color:var(--cyan);background:rgba(90,197,241,.14);border:1px solid rgba(90,197,241,.35);border-radius:999px;padding:2px 9px;vertical-align:middle;margin-bottom:8px}
  .plan.any{color:var(--soft);background:rgba(169,159,224,.12);border-color:rgba(169,159,224,.3)}
  .code{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:1.3rem;font-weight:800;color:var(--yellow);letter-spacing:1.5px;word-break:break-all;line-height:1.15}
  .note-t{font-size:.78rem;color:var(--soft);margin-top:4px}
  .cd-wrap{background:#0c0922;border:1px solid var(--line);border-radius:13px;padding:9px 12px;text-align:center}
  .cd{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:1.45rem;font-weight:800;color:var(--yellow2);letter-spacing:1px}
  .cd.soon{color:var(--yellow)}
  .cd.dead{color:var(--red);font-size:1.02rem;letter-spacing:.5px}
  .cd.forever{color:var(--cyan);font-size:1.02rem}
  .cd-lbl{font-size:.66rem;color:var(--soft);margin-top:3px;text-transform:uppercase;letter-spacing:1px}
  .meta{display:flex;gap:10px;align-items:center;font-size:.74rem;color:var(--soft)}
  .uses{flex:1}
  .usebar{height:6px;border-radius:99px;background:#0c0922;border:1px solid var(--line);overflow:hidden;margin-top:4px}
  .usebar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#ff9d2e)}
  .badge-off{font-size:.68rem;font-weight:800;color:var(--red);border:1px solid rgba(255,107,107,.4);border-radius:999px;padding:1px 8px}
  .acts{display:flex;gap:8px}
  .act{flex:1;border:0;border-radius:11px;padding:9px 8px;font-size:.78rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .act svg{width:14px;height:14px}
  .usebtn{width:100%;border:0;border-radius:12px;padding:11px;font-size:.9rem;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#4ade80,#22c55e);color:#052e16;box-shadow:0 8px 20px -10px rgba(34,197,94,.8)}
  .usebtn svg{width:16px;height:16px}
  .usebtn:active{transform:scale(.98)}
  .usebtn.off{background:#2c2470;color:var(--soft);box-shadow:none;cursor:not-allowed;opacity:.85}
  .usebtn.off:active{transform:none}
  .act.copy{background:var(--yellow);color:#241B00}
  .act.qr{background:#2c2470;color:var(--ink);border:1px solid #3d349a}
  .act:active{transform:scale(.97)}
  .act.done{background:var(--green)!important;color:#052e16!important}
  .empty,.loading{text-align:center;color:var(--soft);padding:50px 12px;font-size:.95rem}
  .note{margin-top:26px;font-size:.76rem;color:var(--soft);background:rgba(255,193,19,.06);border:1px solid rgba(255,193,19,.2);border-radius:12px;padding:11px 14px;line-height:1.5}
  .gate{max-width:420px;margin:60px auto;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center}
  .gate h2{font-size:1.15rem;margin-bottom:8px}
  .gate p{color:var(--soft);font-size:.86rem;margin-bottom:16px;line-height:1.5}
  .gate input{width:100%;background:#0c0922;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:.7rem .9rem;font-size:.9rem;margin-bottom:12px;font-family:ui-monospace,monospace}
  .gate .g-btn{display:inline-block;width:100%;background:linear-gradient(135deg,var(--yellow),#ff9d2e);color:#241B00;font-weight:800;border:0;border-radius:999px;padding:.72rem;font-size:.92rem;cursor:pointer;text-decoration:none}
  .gate a.alt{display:inline-block;margin-top:12px;color:var(--cyan);font-size:.82rem;text-decoration:none;font-weight:700}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--yellow);color:#241B00;font-weight:800;padding:11px 20px;border-radius:999px;font-size:.86rem;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:1.25rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#241B00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.6a2 2 0 0 1-2.83 0L3 13V3h10l7.59 7.59a2 2 0 0 1 0 2.82Z"/><circle cx="7.5" cy="7.5" r="1.5" fill="#241B00" stroke="none"/></svg></div>
    <div>
      <h1>Дасгалын төв · Промо код</h1>
      <div class="sub">Захиалгын (3–12 сар) хямдралын кодууд · хугацаа бүхий</div>
    </div>
    <div class="clock"><div class="now" id="now">--:--:--</div><div class="lbl">Одоогийн цаг</div></div>
  </div>
  <div id="app"><div class="loading">Ачааллаж байна…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
var CODES=[];
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},1600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function moLabel(m){return {3:'3 сар',6:'6 сар',9:'9 сар',12:'1 жил'}[m]||null;}
function useCode(code,months){var u='/worksheets?promo='+encodeURIComponent(code);if(months)u+='&months='+months;location.href=u;}
function pad(n){return String(n).padStart(2,'0');}
function fmtLeft(exp){
  if(!exp)return {kind:'forever',txt:'Хугацаагүй',lbl:'Байнгын код'};
  var ms=new Date(exp).getTime()-Date.now();
  if(ms<=0)return {kind:'dead',txt:'Хугацаа дууссан',lbl:'Дууссан'};
  var s=Math.floor(ms/1000),d=Math.floor(s/86400);s-=d*86400;
  var h=Math.floor(s/3600);s-=h*3600;var m=Math.floor(s/60);s-=m*60;
  var soon=ms<24*3600*1000;
  return {kind:soon?'soon':'live',txt:(d>0?d+' хоног ':'')+pad(h)+':'+pad(m)+':'+pad(s),lbl:'Хугацаа дуустал'};
}
function dead(c){
  if(c.active===false)return true;
  if(c.expires_at && new Date(c.expires_at).getTime()<=Date.now())return true;
  if(c.max_uses && c.used_count>=c.max_uses)return true;
  return false;
}
function drawQR(canvas,text){
  try{
    var qr=qrcode(0,'M');qr.addData(text);qr.make();
    var n=qr.getModuleCount(),size=88,cell=Math.floor(size/(n+2)),off=Math.floor((size-cell*n)/2);
    canvas.width=size;canvas.height=size;var ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#0E0B2B';
    for(var r=0;r<n;r++)for(var col=0;col<n;col++)if(qr.isDark(r,col))ctx.fillRect(off+col*cell,off+r*cell,cell,cell);
    return true;
  }catch(e){return false;}
}
function copyCode(code){
  navigator.clipboard.writeText(code).then(function(){toast('Код хууллаа: '+code);}).catch(function(){
    var ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Код хууллаа');}catch(e){toast('Хуулж чадсангүй');}ta.remove();
  });
}
function copyQR(canvas,code,btn){
  if(!canvas){toast('QR бэлэн биш');return;}
  canvas.toBlob(function(blob){
    if(!blob){toast('QR гаргаж чадсангүй');return;}
    if(navigator.clipboard && window.ClipboardItem){
      navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){
        toast('QR зургийг хууллаа'); if(btn){btn.classList.add('done');setTimeout(function(){btn.classList.remove('done');},1200);}
      }).catch(function(){downloadBlob(blob,code);});
    } else downloadBlob(blob,code);
  },'image/png');
}
function downloadBlob(blob,code){
  var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='promo-'+code+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1500);toast('QR татагдлаа');
}
function chrome(){
  return '<div class="bar">'
    +'<span class="chip on">'+CODES.length+' идэвхтэй код</span>'
    +'<button class="refresh" onclick="loadPromo(true)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэчлэх</button>'
    +'</div>';
}
function render(){
  var app=document.getElementById('app');
  var arr=CODES;
  var cards;
  if(!arr.length){cards='<div class="empty">Идэвхтэй промо код алга.</div>';}
  else cards='<div class="grid">'+arr.map(function(c){
    var uses,pct=0,showBar=false,full=false;
    if(c.fake_uses){
      var fm=String(c.fake_uses).match(/^(\d+)\s*\/\s*(\d+)$/);
      if(fm){var fu=+fm[1],fx=+fm[2];uses=fu+' / '+fx;pct=fx>0?Math.min(100,Math.round(100*fu/fx)):100;showBar=true;full=fu>=fx;}
      else if(/^\d+$/.test(String(c.fake_uses))){var v=+c.fake_uses;uses=c.max_uses?(v+' / '+c.max_uses):(v+' удаа');pct=c.max_uses?Math.min(100,Math.round(100*v/c.max_uses)):0;showBar=!!c.max_uses;full=!!c.max_uses&&v>=c.max_uses;}
      else{uses=String(c.fake_uses);}
    }else{
      uses=(c.max_uses?(c.used_count+' / '+c.max_uses):(c.used_count+' удаа'));
      pct=c.max_uses?Math.min(100,Math.round(100*c.used_count/c.max_uses)):0;showBar=!!c.max_uses;full=!!c.max_uses&&c.used_count>=c.max_uses;
    }
    var off=(c.active===false)?'<span class="badge-off">Идэвхгүй</span>':(full?'<span class="badge-off">Дууссан</span>':'');
    var mol=moLabel(c.months);
    var moChip=mol?'<span class="plan">'+mol+' багц</span>':'<span class="plan any">Аль ч багц</span>';
    return '<div class="card'+(dead(c)?' dead':'')+'" data-exp="'+(c.expires_at||'')+'">'
      +'<div class="row1"><div class="qrbox"><canvas class="qc"></canvas></div>'
      +'<div class="cinfo"><span class="disc"><b>'+c.pct+'%</b><span>ХӨНГӨЛӨЛТ</span></span> '+moChip
      +'<div class="code">'+esc(c.code)+'</div>'+(c.note?'<div class="note-t">'+esc(c.note)+'</div>':'')+'</div></div>'
      +'<div class="cd-wrap"><div class="cd">—</div><div class="cd-lbl">Хугацаа</div></div>'
      +'<div class="meta"><div class="uses">'+uses+(showBar?'<div class="usebar"><i style="width:'+pct+'%"></i></div>':'')+'</div>'+off+'</div>'
      +(full
        ? '<button class="usebtn off" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Бүх эрх дууссан</button>'
        : '<button class="usebtn" onclick="useCode(\''+esc(c.code)+'\','+(c.months||0)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>АШИГЛАХ'+(mol?' · '+mol:'')+' · '+c.pct+'% авах</button>')
      +'<div class="acts"><button class="act copy" onclick="copyCode(\''+esc(c.code)+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Код хуулах</button>'
      +'<button class="act qr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h.01M17 21h4v-4"/></svg>QR хуулах</button></div>'
      +'</div>';
  }).join('')+'</div>';
  app.innerHTML=chrome()+cards
    +'<div class="note"><b>АШИГЛАХ</b> дарвал Дасгалын төвийн худалдан авах цонх нээгдэж, код автоматаар нөхөгдөж, хямдрал тооцогдоно — бүртгэлгүй бол нэвтэрсний дараа шууд QPay QR үүсгэхэд бэлэн болно. <b>Код хуулах</b>/<b>QR хуулах</b> — кодоо бусадтай хуваалцахад. Хугацаа ба ашиглалт шууд шинэчлэгдэнэ.</div>';
  [].forEach.call(app.querySelectorAll('.card'),function(card){
    var code=card.querySelector('.code').textContent;
    var cv=card.querySelector('.qc');var ok=drawQR(cv,code);
    if(!ok)cv.parentNode.innerHTML='<div class="qrfail">QR<br>алдаа</div>';
    var qb=card.querySelector('.act.qr');if(qb)qb.onclick=function(){copyQR(ok?cv:null,code,qb);};
  });
  tick();
}
function tick(){
  [].forEach.call(document.querySelectorAll('#app .card'),function(card){
    var st=fmtLeft(card.getAttribute('data-exp')||null);
    var cd=card.querySelector('.cd');if(!cd)return;
    cd.textContent=st.txt;cd.className='cd '+st.kind;
    var lbl=card.querySelector('.cd-lbl');if(lbl)lbl.textContent=st.lbl;
    if(st.kind==='dead')card.classList.add('dead');
  });
}
function loadPromo(manual){
  fetch('/api/qpay?action=ws_promo_public')
    .then(function(r){return r.json();})
    .then(function(d){
      CODES=(d&&d.promos)||[];
      CODES.sort(function(a,b){
        var ta=a.expires_at?new Date(a.expires_at).getTime():Infinity;
        var tb=b.expires_at?new Date(b.expires_at).getTime():Infinity;
        return ta-tb;
      });
      render();
      if(manual)toast('Шинэчиллээ ('+CODES.length+' код)');
    }).catch(function(e){
      document.getElementById('app').innerHTML=chrome()+'<div class="empty">Алдаа: '+esc((e&&e.message)||'холбогдож чадсангүй')+'</div>';
    });
}
function clockTick(){var n=new Date();document.getElementById('now').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());}
setInterval(function(){clockTick();tick();},1000);
setInterval(function(){loadPromo(false);},60000);
clockTick();loadPromo(false);
</script>
</body>
</html>
