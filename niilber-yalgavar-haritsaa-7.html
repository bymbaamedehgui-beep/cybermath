<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}

  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}

  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}

  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:16mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}

<script>
// ══════════ g7core.js — 7-р ангийн нийтлэг хөдөлгүүр (бүх бүлэгт залгагдана) ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ g7ch3.js — III БҮЛЭГ. ХАРЬЦАА, ПРОПОРЦ ══════════
// Сурах бичгийн 46-50 хуудсын дасгалуудын хэлбэрээр зохиов.
// g7core.js доторх helper-үүдийг шууд дуудна (rnd,pick,gcd,lcm,decStr,Fr,...).
// АНХААР: q нь ЗӨВХӨН бодлогын өгөгдөл. Заавар (label) нь plan.json-д нэг л удаа бичигдэнэ.

// ───────────────────────── туслах функцууд ─────────────────────────
function coprimePair(set){
 for(var i=0;i<40;i++){var p=pick(set),q=pick(set);if(p!==q&&gcd(p,q)===1)return [p,q];}
 return null;
}
function redRatio2(a,b){var g=gcd(a,b)||1;return [a/g,b/g];}
function redRatio3(a,b,c){var g=gcd(gcd(a,b),c)||1;return [a/g,b/g,c/g];}
function gcdArr(v){var g=v[0],i;for(i=1;i<v.length;i++)g=gcd(g,v[i]);return g||1;}
// k ширхэг эерэг бүхэл, нийлбэр нь s, гишүүн бүр minPart-аас багагүй, ХИЯ=1
function tupleWithSum(k,s,minPart){
 for(var i=0;i<400;i++){
  var v=[],rem=s,ok=true,j;
  for(j=0;j<k-1;j++){
   var maxv=rem-(k-1-j)*minPart;
   if(maxv<minPart){ok=false;break;}
   var x=rnd(minPart,maxv);v.push(x);rem-=x;
  }
  if(!ok||rem<minPart)continue;
  v.push(rem);
  if(gcdArr(v)!==1)continue;
  var same=true;for(j=1;j<v.length;j++)if(v[j]!==v[0])same=false;
  if(same)continue;
  return v;
 }
 return null;
}
// 3 гишүүнт харьцаа (ХИЯ=1, бүгд ижил биш)
function randRatio3(){
 for(var i=0;i<200;i++){
  var v=[rnd(1,9),rnd(1,9),rnd(1,9)];
  if(gcdArr(v)!==1)continue;
  if(v[0]===v[1]&&v[1]===v[2])continue;
  return v;
 }
 return null;
}
// мянгатаар тусгаарлах (SVG хүснэгтэд)
function nfmt(n){var s=''+n,out='',c=0,i;for(i=s.length-1;i>=0;i--){out=s.charAt(i)+out;c++;if(c%3===0&&i>0)out=' '+out;}return out;}
// өгүүлбэрийн эхний үсгийг том болгох
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
// "12:8=3:2" эсвэл аль хэдийн хураагдсан бол зөвхөн "5:19"
function ratShow(a,b){var r=redRatio2(a,b);return (r[0]===a&&r[1]===b)?(a+':'+b):(a+':'+b+'='+r[0]+':'+r[1]);}

// ───────────────────────── SVG зурагууд (хариу илчлэхгүй) ─────────────────────────
// Хэсэгчилсэн зурвас: 1.8 метр → 5 хэсэг | 3 хэсэг | 2 хэсэг
function barParts(r,totLbl){
 var s=0,i;for(i=0;i<r.length;i++)s+=r[i];
 var x0=22,x1=298,W=x1-x0,y=26,h=17,g='',acc=0;
 g+='<rect x="'+x0+'" y="'+y+'" width="'+W+'" height="'+h+'" rx="3" fill="#f3f0fd" stroke="#7B52EE" stroke-width="1.3"/>';
 for(i=0;i<r.length;i++){
  var w=W*r[i]/s;
  g+='<text x="'+(x0+acc+w/2).toFixed(1)+'" y="20" font-size="10" text-anchor="middle" fill="#5a32d6">'+r[i]+' хэсэг</text>';
  acc+=w;
  if(i<r.length-1)g+='<line x1="'+(x0+acc).toFixed(1)+'" y1="'+y+'" x2="'+(x0+acc).toFixed(1)+'" y2="'+(y+h)+'" stroke="#7B52EE" stroke-width="1.3"/>';
 }
 g+='<line x1="'+x0+'" y1="54" x2="'+x1+'" y2="54" stroke="#555" stroke-width="1"/>';
 g+='<line x1="'+x0+'" y1="50" x2="'+x0+'" y2="58" stroke="#555" stroke-width="1"/>';
 g+='<line x1="'+x1+'" y1="50" x2="'+x1+'" y2="58" stroke="#555" stroke-width="1"/>';
 g+='<text x="'+((x0+x1)/2)+'" y="69" font-size="10" text-anchor="middle" fill="#333">'+totLbl+'</text>';
 return '<svg viewBox="0 0 320 76" width="300">'+g+'</svg>';
}
// Өнгөт нүдний тор
function gridCells(cells,cols){
 var CM={b:'#60a5fa',g:'#4ade80',y:'#fde047',w:'#ffffff'};
 var s=17,rows=Math.ceil(cells.length/cols),g='',i;
 for(i=0;i<cells.length;i++){
  var cx=(i%cols)*s+1,cy=Math.floor(i/cols)*s+1;
  g+='<rect x="'+cx+'" y="'+cy+'" width="'+s+'" height="'+s+'" fill="'+CM[cells[i]]+'" stroke="#94a3b8" stroke-width="1"/>';
 }
 var W=cols*s+2,H=rows*s+2;
 return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'">'+g+'</svg>';
}
// Хоёр тэгш өнцөгт гурвалжин (катетуудын шошготой)
function twoRightTri(h1,v1,v2,h2){
 var g='';
 g+='<polygon points="42,100 102,100 42,58" fill="rgba(96,165,250,0.18)" stroke="#2563eb" stroke-width="1.6"/>';
 g+='<rect x="42" y="94" width="6" height="6" fill="none" stroke="#2563eb" stroke-width="1"/>';
 g+='<text x="72" y="114" font-size="10" text-anchor="middle" fill="#1e40af">'+h1+'</text>';
 g+='<text x="37" y="82" font-size="10" text-anchor="end" fill="#1e40af">'+v1+'</text>';
 g+='<polygon points="186,100 268,100 186,30" fill="rgba(248,113,113,0.18)" stroke="#dc2626" stroke-width="1.6"/>';
 g+='<rect x="186" y="94" width="6" height="6" fill="none" stroke="#dc2626" stroke-width="1"/>';
 g+='<text x="227" y="114" font-size="10" text-anchor="middle" fill="#b91c1c">'+h2+'</text>';
 g+='<text x="181" y="68" font-size="10" text-anchor="end" fill="#b91c1c">'+v2+'</text>';
 return '<svg viewBox="0 0 290 122" width="278">'+g+'</svg>';
}
// Ерөнхий хүснэгт (эхний багана өргөн)
function tableSVG(head,rows){
 var w0=64,w=42,H=21,g='',i,j,cols=head.length;
 function cx(j){return j===0?0:w0+(j-1)*w;}
 function cw(j){return j===0?w0:w;}
 var W=w0+(cols-1)*w,Hh=H*(rows.length+1);
 for(j=0;j<cols;j++){
  g+='<rect x="'+cx(j)+'" y="0" width="'+cw(j)+'" height="'+H+'" fill="#ede9fe" stroke="#7B52EE" stroke-width="1"/>';
  g+='<text x="'+(cx(j)+cw(j)/2)+'" y="14" font-size="8.5" text-anchor="middle" fill="#4c1d95">'+head[j]+'</text>';
 }
 for(i=0;i<rows.length;i++)for(j=0;j<cols;j++){
  var y=H*(i+1);
  g+='<rect x="'+cx(j)+'" y="'+y+'" width="'+cw(j)+'" height="'+H+'" fill="#fff" stroke="#7B52EE" stroke-width="1"/>';
  var t=rows[i][j];
  if(t)g+='<text x="'+(cx(j)+cw(j)/2)+'" y="'+(y+14)+'" font-size="8.5" text-anchor="middle" fill="#111">'+t+'</text>';
 }
 return '<svg viewBox="-1 -1 '+(W+2)+' '+(Hh+2)+'" width="'+(W+2)+'">'+g+'</svg>';
}

// Дасгал 19: 2 6/7 : 30, 1.6:1.8, 1/2:1/3, 1 1/3 : 2.4 ...
function g_ratioSimplifyDecimalFrac(){
 function decOp(scale){var t=rnd(1,scale*2-1);return {fr:Fr(t,scale),tex:decStr(t/scale,3)};}
 function fracOp(){var num=rnd(1,3),den=rnd(2,9);if(gcd(num,den)!==1)return null;return {fr:Fr(num,den),tex:'\\tfrac{'+num+'}{'+den+'}'};}
 function mixOp(){var w=rnd(1,3),c=rnd(2,7),b=rnd(1,c-1);if(gcd(b,c)!==1)return null;return {fr:Fr(w*c+b,c),tex:w+'\\tfrac{'+b+'}{'+c+'}'};}
 function intOp(){var v=rnd(2,30);return {fr:Fr(v,1),tex:''+v};}
 var mode=pick(['dec','frac','mix','mixint','decfrac']);
 var x,y;
 if(mode==='dec'){var sc=pick([10,100]);x=decOp(sc);y=decOp(sc);}
 else if(mode==='frac'){x=fracOp();y=fracOp();}
 else if(mode==='mix'){x=mixOp();y=fracOp();}
 else if(mode==='mixint'){x=mixOp();y=intOp();}
 else{x=decOp(10);y=fracOp();}
 if(!x||!y)return null;
 if(x.fr.n===0||y.fr.n===0)return null;
 var L=lcm(x.fr.d,y.fr.d);
 var A=x.fr.n*(L/x.fr.d),B=y.fr.n*(L/y.fr.d);
 if(A===B)return null;
 if(A>4000||B>4000)return null;
 var r=redRatio2(A,B);
 var mid=(A===r[0]&&B===r[1])?'':('='+A+':'+B);
 return {q:'$'+x.tex+':'+y.tex+'$',
  a:'$'+x.tex+':'+y.tex+mid+'='+r[0]+':'+r[1]+'$',
  key:'rsd:'+x.tex+':'+y.tex,
  chk:{xn:x.fr.n,xd:x.fr.d,yn:y.fr.n,yd:y.fr.d,rp:r[0],rq:r[1]}};
}

 var a=rnd(1,b-1);
 if(gcd(a,b)===b)return null;
 var target=(100%b===0)?100:1000;
 if(b>100&&1000%b!==0)return null;
 if(b<=100&&100%b!==0)return null;
 var k=target/b;
 var num=a*k;
 var pct=a/b*100;
 var qq='$\\dfrac{'+a+'}{'+b+'}=\\dfrac{\\square}{'+target+'}=\\square\\%$';
 var ans='$\\dfrac{'+a+'}{'+b+'}=\\dfrac{'+num+'}{'+target+'}='+decStr(pct,4)+'\\%$';
 return {q:qq,a:ans,key:'ftp:'+a+':'+b,nv:pct,chk:{a:a,b:b,target:target,num:num,pct:pct}};
}

function g_ratioPercentOf(){

  {t:'Жимсний шүүсэнд',a:'алим',b:'нимбэг',bg:'нимбэгний'},
  {t:'Хольцонд',a:'элс',b:'цемент',bg:'цементийн'},

  {t:'Хайлшинд',a:'цагаан тугалга',b:'зэс',bg:'зэсийн'},

 ];
 var C=pick(CTX);
 var toTotal=rnd(0,1)===0;
 var p,q,base,pct,qq,ans;
 if(toTotal){
  var s=pick([4,5,8,10,20,25,40,50]);

  if(q<2)return null;

  qq=C.t+' '+C.a+' ба '+C.b+' $'+p+':'+q+'$ харьцаатай орсон. '+cap(C.a)+' нь нийт хольцын хэдэн процентыг эзлэх вэ?';
  ans='Нийт $'+p+'+'+q+'='+s+'$ хэсэг. $\\dfrac{'+p+'}{'+s+'}\\cdot 100\\%='+decStr(pct,4)+'\\%$';
 }else{

  p=rnd(1,2*q-1);
  if(p===q)return null;
  if(gcd(p,q)!==1)return null;

  qq=C.t+' '+C.a+' ба '+C.b+' $'+p+':'+q+'$ харьцаатай орсон. '+cap(C.a)+' нь '+C.bg+' хэдэн процент болох вэ?';
  ans='$\\dfrac{'+p+'}{'+q+'}\\cdot 100\\%='+decStr(pct,4)+'\\%$';
 }
 return {q:qq,a:ans,key:'rpo:'+C.a+':'+p+':'+q+':'+toTotal,nv:pct,
  chk:{p:p,q:q,base:base,pct:pct,toTotal:toTotal}};

function g_divideRatioUnitConv(){
 var UN=[
  {big:'цаг',acc:'цагийг',small:'минут',ins:'минутаар',f:60,mod:30,lo:60,hi:720},
  {big:'га',acc:'га-г',small:'м$^2$',ins:'м$^2$-аар',f:10000,mod:100,lo:800,hi:60000},
  {big:'тонн',acc:'тонныг',small:'кг',ins:'кг-аар',f:1000,mod:100,lo:500,hi:20000},

  {big:'литр',acc:'литрийг',small:'мл',ins:'мл-ээр',f:1000,mod:100,lo:500,hi:20000},
  {big:'кг',acc:'кг-ийг',small:'г',ins:'граммаар',f:1000,mod:100,lo:500,hi:20000}
 ];
 var U=pick(UN);
 var three=rnd(0,1)===0;
 var r=three?randRatio3():coprimePair([2,3,4,5,6,7,8,9,11,13]);
 if(!r)return null;
 var s=0,i;for(i=0;i<r.length;i++)s+=r[i];
 if(s<4||s>25)return null;
 var base=U.mod/gcd(s,U.mod);
 var step=s*base;
 var mlo=Math.ceil(U.lo/step),mhi=Math.floor(U.hi/step);
 if(mhi<mlo)return null;
 var m=rnd(mlo,mhi);
 var u=base*m;
 var T=s*u;
 var bigVal=T/U.f;
 if(bigVal<0.05||bigVal>60)return null;
 var bs=decStr(bigVal,4);
 var parts=[];for(i=0;i<r.length;i++)parts.push(r[i]*u);
 var qq='$'+bs+'$ '+U.acc+' $'+r.join(':')+'$ харьцаатай (хариуг '+U.ins+')';
 var ans='$'+bs+'$ '+U.big+' $='+T+'$ '+U.small+'. Нийт $'+r.join('+')+'='+s+'$ хэсэг, $1$ хэсэг $='+T+':'+s+'='+u+'$. '+
  'Хэсгүүд: $'+parts.join(',\\ ')+'$ '+U.small+'.';
 return {q:qq,a:ans,key:'druc:'+U.big+':'+T+':'+r.join(':'),nv:parts[0],
  chk:{f:U.f,T:T,r:r,s:s,u:u,parts:parts,bigVal:bigVal}};
}

 var I=[d0*10,d1*10,d2t];

 if(khi-klo<4)return null;

 while(ks.length<3&&tries++<80){var k=rnd(klo,khi);if(ks.indexOf(k)<0)ks.push(k);}
 if(ks.length<3)return null;
 ks.sort(function(p,q){return p-q;});
 var Ts=ks.map(function(k){return s*k;});
 var cem=ks.map(function(k){return r[0]*k;});
 var disp=[''+d0,''+d1,decStr(d2t/10,2)];
 var qq=cap(C.n)+' бэлтгэхэд '+C.c[0]+', '+C.c[1]+', '+C.c[2]+' $'+disp.join(':')+'$ харьцаатай ордог. '+
  'а) $'+Ts[0]+'$ '+C.u+' б) $'+Ts[1]+'$ '+C.u+' в) $'+Ts[2]+'$ '+C.u+' '+C.n+' бэлтгэхэд хэдэн '+C.u+' '+C.c[0]+' орох вэ?';
 var ans='Бүхэл тоон харьцаа: $'+disp.join(':')+'='+I.join(':')+'='+r.join(':')+'$, нийт $'+s+'$ хэсэг. '+

  function block(arr,cap,tk){var use=WK?arr.slice(0,cap):arr;return '<div class="grid"'+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  TASKS.forEach(function(t,i){html+='<div class="task">'+(i+1)+'. '+t.label+'</div>'+block(S[i],t.cap,t);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
