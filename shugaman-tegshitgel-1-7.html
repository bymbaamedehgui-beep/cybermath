<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Шугаман тэгшитгэл-1 (7-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:14mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
// ══════════ g7core.js — 7-р ангийн нийтлэг хөдөлгүүр (бүх бүлэгт залгагдана) ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ── 7-р анги V бүлэг (Алгебрын илэрхийлэл, тэгшитгэл) ──
// Асуулт (q) нь ЗӨВХӨН илэрхийлэл. Заавар нь plan.json дахь task.label-д ганц удаа бичигдэнэ.
// g7core.js доторх helper-үүдийг (rnd,nz,pick,shuffle,gcd,sgn,paren,powClean,decStr...) шууд дуудна.

// ── тусгай туслах (g7core-т байхгүй нэрс) ──
function vp(v,e){return e===0?'':e===1?v:v+'^{'+e+'}';}
function co(c,w){if(w==='')return ''+c;if(c===0)return '0';if(c===1)return w;if(c===-1)return '-'+w;return c+w;}
function coS(c,w){if(c===0)return '';if(w===''){return c>0?'+'+c:''+c;}if(c===1)return '+'+w;if(c===-1)return '-'+w;return (c>0?'+':'')+c+w;}
function mono2(k,v1,e1,v2,e2){return co(k,vp(v1,e1)+vp(v2,e2));}
function wrapNeg(s){return s.charAt(0)==='-'?'('+s+')':s;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function joinT(list){return list.map(function(t,i){return i===0?co(t.c,t.w):coS(t.c,t.w);}).join('');}
function halfTex(h){return (h%2===0)?''+(h/2):decStr(h/2,1);}   // 3 -> '1.5', 4 -> '2'

// ── цэвэрхэн SVG зурагууд ──
var _FC='#7B52EE',_FF='rgba(123,82,238,0.07)',_FT='#4b2fb5',_FG='#94a3b8';
function _t(x,y,s,an,sz){return '<text x="'+x+'" y="'+y+'" font-size="'+(sz||12.5)+'" text-anchor="'+(an||'middle')+'" fill="'+_FT+'" font-family="Georgia,serif" font-style="italic">'+s+'</text>';}
function figRect2(top,right){
 var g='<rect x="46" y="26" width="146" height="80" rx="2" fill="'+_FF+'" stroke="'+_FC+'" stroke-width="1.7"/>';
 g+=_t(119,18,top);g+=_t(200,71,right,'start');
 return '<svg viewBox="0 0 258 118" width="224">'+g+'</svg>';
}
function figRectIn(top,right,inside){
 var g='<rect x="46" y="26" width="152" height="82" rx="2" fill="'+_FF+'" stroke="'+_FC+'" stroke-width="1.7"/>';
 g+=_t(122,18,top);g+=_t(206,72,right,'start');
 g+='<text x="122" y="72" font-size="11.5" text-anchor="middle" fill="'+_FT+'" font-family="Georgia,serif">'+inside+'</text>';
 return '<svg viewBox="0 0 272 120" width="238">'+g+'</svg>';
}
function figTri3(la,lb,lc){
 var g='<polygon points="40,108 190,108 130,30" fill="'+_FF+'" stroke="'+_FC+'" stroke-width="1.7"/>';
 g+=_t(74,64,la,'end');g+=_t(166,66,lb,'start');g+=_t(115,126,lc);
 return '<svg viewBox="0 0 214 136" width="214">'+g+'</svg>';
}
function figBox(wl,dl,hl){
 var x0=32,y0=50,W=118,H=62,ox=32,oy=-26;
 function P(x,y){return x+','+y;}
 var g='';
 g+='<polyline points="'+P(x0,y0+H)+' '+P(x0+ox,y0+oy+H)+' '+P(x0+W+ox,y0+oy+H)+'" fill="none" stroke="'+_FC+'" stroke-width="1.1" stroke-dasharray="4 3" opacity="0.55"/>';
 g+='<line x1="'+(x0+ox)+'" y1="'+(y0+oy+H)+'" x2="'+(x0+ox)+'" y2="'+(y0+oy)+'" stroke="'+_FC+'" stroke-width="1.1" stroke-dasharray="4 3" opacity="0.55"/>';
 g+='<rect x="'+x0+'" y="'+y0+'" width="'+W+'" height="'+H+'" fill="'+_FF+'" stroke="'+_FC+'" stroke-width="1.7"/>';
 g+='<polyline points="'+P(x0,y0)+' '+P(x0+ox,y0+oy)+' '+P(x0+W+ox,y0+oy)+' '+P(x0+W,y0)+'" fill="none" stroke="'+_FC+'" stroke-width="1.7"/>';
 g+='<line x1="'+(x0+W+ox)+'" y1="'+(y0+oy)+'" x2="'+(x0+W+ox)+'" y2="'+(y0+oy+H)+'" stroke="'+_FC+'" stroke-width="1.7"/>';
 g+='<line x1="'+(x0+W)+'" y1="'+(y0+H)+'" x2="'+(x0+W+ox)+'" y2="'+(y0+oy+H)+'" stroke="'+_FC+'" stroke-width="1.7"/>';
 g+=_t(x0+W/2,y0+H+18,wl);
 g+=_t(x0+W+ox+5,y0+oy+H+13,dl,'start');
 g+=_t(x0+W+5,y0+H/2+4,hl,'start');
 return '<svg viewBox="0 0 222 140" width="206">'+g+'</svg>';
}
function figSeg(labels,weights,total){
 var x0=20,x1=282,y=44,i,sw=0;
 for(i=0;i<weights.length;i++)sw+=weights[i];
 var g='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="'+_FC+'" stroke-width="2"/>';
 var x=x0;
 g+='<line x1="'+x0+'" y1="'+(y-8)+'" x2="'+x0+'" y2="'+(y+8)+'" stroke="'+_FC+'" stroke-width="1.6"/>';
 for(i=0;i<labels.length;i++){
  var w=(x1-x0)*weights[i]/sw;
  g+=_t(x+w/2,y-13,labels[i]);
  x+=w;
  g+='<line x1="'+x.toFixed(1)+'" y1="'+(y-8)+'" x2="'+x.toFixed(1)+'" y2="'+(y+8)+'" stroke="'+_FC+'" stroke-width="1.6"/>';
 }
 g+='<line x1="'+x0+'" y1="'+(y+22)+'" x2="'+x1+'" y2="'+(y+22)+'" stroke="'+_FG+'" stroke-width="1.1"/>';
 g+='<line x1="'+x0+'" y1="'+(y+18)+'" x2="'+x0+'" y2="'+(y+26)+'" stroke="'+_FG+'" stroke-width="1.1"/>';
 g+='<line x1="'+x1+'" y1="'+(y+18)+'" x2="'+x1+'" y2="'+(y+26)+'" stroke="'+_FG+'" stroke-width="1.1"/>';
 g+='<text x="151" y="'+(y+38)+'" font-size="11.5" text-anchor="middle" fill="'+_FT+'" font-family="Georgia,serif">'+total+'</text>';
 return '<svg viewBox="0 0 302 92" width="288">'+g+'</svg>';
}
function figAngles(l1,l2){
 var g='<line x1="18" y1="88" x2="266" y2="88" stroke="'+_FC+'" stroke-width="1.8"/>';

 var base=pick(['a','b','c','x','y']);
 if(mode==='sym'){
  var cm=rnd(3,7), cn=rnd(2,cm-1), evar=pick(['n','k','m']);
  if(base===evar)return null;
  var resC=cm-cn;
  return {q:'$\\dfrac{'+base+'^{'+cm+evar+'}}{'+base+'^{'+cn+evar+'}}$',
   a:'$='+base+'^{'+(resC===1?evar:resC+evar)+'}$', key:'pdS'+base+cm+cn+evar};
 }
 var m=rnd(3,10), n=rnd(1,m-1);
 return {q:'$\\dfrac{'+vp(base,m)+'}{'+vp(base,n)+'}$', a:'$='+powClean(base,m-n)+'$', key:'pdN'+base+m+n};
}
function g_powPower(){
 var form=pick(['single','prod','frac']);
 if(form==='single'){
  var b=pick(['a','x','m','c','y']), inner=rnd(2,6), outer=rnd(2,4);
  return {q:'$('+vp(b,inner)+')^{'+outer+'}$', a:'$='+vp(b,inner*outer)+'$', key:'ppS'+b+inner+outer};
 }
 if(form==='prod'){
  var Q=pick([['a','b'],['x','y'],['m','n']]),u1=Q[0],u2=Q[1];
  var m1=rnd(1,6), n1=rnd(1,6), p=rnd(2,3);
  if(m1===1&&n1===1&&p===1)return null;
  return {q:'$('+vp(u1,m1)+vp(u2,n1)+')^{'+p+'}$', a:'$='+vp(u1,m1*p)+vp(u2,n1*p)+'$', key:'ppP'+u1+m1+n1+p};
 }
 var R=pick([['a','b'],['x','y'],['m','n']]),w1=R[0],w2=R[1];
 var m2=rnd(1,6), n2=rnd(1,6), p2=rnd(2,3);
 if(m2*p2===1||n2*p2===1)return null;
 return {q:'$\\bigl(\\dfrac{'+vp(w1,m2)+'}{'+vp(w2,n2)+'}\\bigr)^{'+p2+'}$',
  a:'$=\\dfrac{'+vp(w1,m2*p2)+'}{'+vp(w2,n2*p2)+'}$', key:'ppF'+w1+m2+n2+p2};
}
function g_powMixed(){

  if(r<2)return null;
  return {q:'$\\dfrac{'+vp(base,m)+'\\cdot '+vp(base,n)+'}{'+vp(base,p)+'}$', a:'$='+powClean(base,r)+'$', key:'pxD'+base+m+n+p};
 }
 if(form==='powtimes'){
  var a1=rnd(2,5), b1=rnd(2,3), c1=rnd(1,5);
  return {q:'$('+vp(base,a1)+')^{'+b1+'}\\cdot '+vp(base,c1)+'$', a:'$='+powClean(base,a1*b1+c1)+'$', key:'pxP'+base+a1+b1+c1};

  if(r2<2)return null;
  return {q:'$\\dfrac{('+vp(base,u)+')^{'+w+'}}{('+vp(base,y)+')^{'+z+'}}$', a:'$='+powClean(base,r2)+'$', key:'pxQ'+base+u+w+y+z};
 }

}
function g_powFillBlank(){
 var form=pick(['expand','negbase','count','root','bigpow','zerobase']);
 var SQ='\\square';
 if(form==='expand'){
  var b=pick([2,3,5,7,'a','x','m']), e=rnd(3,6);
  var chain=[];for(var i=0;i<e;i++)chain.push(''+b);
  return {q:'$'+b+'^{'+SQ+'}='+chain.join('\\cdot ')+'$', a:'$'+SQ+'='+e+'$',
   key:'pfE'+b+e, solved:''+b+'^{'+e+'}='+chain.join('\\cdot ')};
 }
 if(form==='negbase'){
  var nb=pick([2,3,4,5]), ne=pick([3,5]);
  var val=Math.pow(nb,ne)*(ne%2?-1:1);
  return {q:'$'+val+'=('+(-nb)+')^{'+SQ+'}$', a:'$'+SQ+'='+ne+'$',
   key:'pfN'+nb+ne, solved:''+val+'=('+(-nb)+')^{'+ne+'}'};
 }
 if(form==='count'){
  var cb=pick([2,3,4,5,6,10]), ce=rnd(3,5), cv=Math.pow(cb,ce);
  var ch=[];for(var j=0;j<ce;j++)ch.push(''+cb);
  return {q:'$'+cv+'='+ch.join('\\cdot ')+'='+cb+'^{'+SQ+'}$', a:'$'+SQ+'='+ce+'$',
   key:'pfC'+cb+ce, solved:''+cv+'='+ch.join('\\cdot ')+'='+cb+'^{'+ce+'}'};
 }
 if(form==='root'){
  var rb=pick([-5,-4,-3,-2,2,3,4,5]), re=pick([2,3]);
  if(rb<0&&re===2)return null;
  var rv=Math.pow(Math.abs(rb),re)*((rb<0&&re%2)?-1:1);
  return {q:'$'+SQ+'^{'+re+'}='+rv+'$', a:'$'+SQ+'='+rb+'$',
   key:'pfR'+rb+re, solved:'('+rb+')^{'+re+'}='+rv};
 }
 if(form==='bigpow'){
  var pb=pick([2,4,8,3,9,5]), pe=rnd(2,4), pv=Math.pow(pb,pe);
  if(pv>4096)return null;
  return {q:'$'+pv+'='+SQ+'^{'+SQ+'}$', a:'жишээ нь $'+pv+'='+pb+'^{'+pe+'}$',
   key:'pfB'+pb+pe, solved:''+pv+'='+pb+'^{'+pe+'}'};
 }
 var ze=pick([4,5,6,10,100]), zb=pick([0,1,-1]);
 var zv=(zb===0)?0:(zb===1?1:(ze%2?-1:1));
 var zt=(zb<0)?'('+zb+')':''+zb;
 return {q:'$'+zt+'^{'+ze+'}='+SQ+'$', a:'$'+SQ+'='+zv+'$',
  key:'pfZ'+zb+ze, solved:zt+'^{'+ze+'}='+zv};
}
function g_powSameExp(){

function g_powDivCompound(){

  var b=pick(['x','a','y','m']), ev=pick(['n','k']);

  return {q:'$'+b+'^{'+m1+ev+'}\\div '+b+'^{'+m2+ev+'}$',
   a:'$='+b+'^{'+(d===1?ev:d+ev)+'}$', key:'pdcS'+b+m1+m2+ev};

  var k=rnd(2,5), v=pick(['x','a','b','y']);
  var e1=rnd(4,9), e2=rnd(2,e1-1), r=e1-e2;
  if(r>3)return null;
  var inner=k+v;
  var num=Math.pow(k,r);
  return {q:'$('+inner+')^{'+e1+'}\\div ('+inner+')^{'+e2+'}$',

   key:'pdcC'+k+v+e1+e2,

  key:'pdcB'+kk+P[0]+ev2+gap,

function g_powCheckError(){
 var good=pick([true,false,false]);
 var b1=pick([2,3,4,5]), b2=pick([2,3,4,5]), e=rnd(2,3);
 if(b1===b2)return null;
 if(good){
  var L='('+b1+'\\cdot '+b2+')^{'+e+'}', R=''+(b1*b2)+'^{'+e+'}';
  return {q:'$'+b1+'^{'+e+'}\\cdot '+b2+'^{'+e+'}='+L+'='+R+'$',
   a:'Зөв. Ижил илтгэгчтэй тул $('+b1+'\\cdot '+b2+')^{'+e+'}='+(b1*b2)+'^{'+e+'}='+Math.pow(b1*b2,e)+'$',
   key:'pceG'+b1+b2+e, good:true,
   cmp:{l:''+b1+'^{'+e+'}\\cdot '+b2+'^{'+e+'}', r:R, eq:true}};
 }
 var e1=rnd(2,4), e2=rnd(2,4);
 if(e1===e2)return null;
 var wrong=''+(b1+b2)+'^{'+(e1+e2)+'}';
 var lhs=''+b1+'^{'+e1+'}\\cdot '+b2+'^{'+e2+'}';
 return {q:'$'+lhs+'=('+b1+'+'+b2+')^{'+e1+'+'+e2+'}='+wrong+'$',
  a:'Буруу. Суурь ба илтгэгчийг нэмж болохгүй: $'+lhs+'='+Math.pow(b1,e1)+'\\cdot '+Math.pow(b2,e2)+'='+(Math.pow(b1,e1)*Math.pow(b2,e2))+'$',
  key:'pceB'+b1+b2+e1+e2, good:false,
  cmp:{l:lhs, r:wrong, eq:false}};
}

function g_monoMult(){
 var v=pick(['a','x','z','n','b']);
 var k1=nz(-7,7), k2=nz(-7,7), m=rnd(1,5), nn=rnd(1,5);
 return {q:'$'+wrapNeg(co(k1,vp(v,m)))+'\\cdot '+wrapNeg(co(k2,vp(v,nn)))+'$',
  a:'$='+co(k1*k2,vp(v,m+nn))+'$', key:'mm1'+v+k1+k2+m+nn,
  f0:function(x){return k1*Math.pow(x,m)*k2*Math.pow(x,nn);},
  f1:function(x){return k1*k2*Math.pow(x,m+nn);}};
}
function g_monoMultTwoVar(){

}
function g_monoTripleMult(){
 var P=pick([['a','b'],['x','y'],['m','n'],['p','q']]),v1=P[0],v2=P[1];
 var ks=[nz(-5,5),nz(-5,5),nz(-5,5)];
 var ex=[rnd(0,3),rnd(0,3),rnd(0,3)], ey=[rnd(0,3),rnd(0,3),rnd(0,3)];
 var i, tot=0;
 for(i=0;i<3;i++){if(ex[i]+ey[i]===0&&Math.abs(ks[i])===1)return null;tot+=ex[i]+ey[i];}
 if(tot<3)return null;
 var rc=ks[0]*ks[1]*ks[2];
 if(Math.abs(rc)>150)return null;
 var parts=[];for(i=0;i<3;i++)parts.push(wrapNeg(mono2(ks[i],v1,ex[i],v2,ey[i])));

  a:'$='+mono2(rc,v1,ex[0]+ex[1]+ex[2],v2,ey[0]+ey[1]+ey[2])+'$',
  key:'mt3'+v1+ks.join(',')+ex.join(',')+ey.join(','),
  f0:function(x,y){var s=1;for(var j=0;j<3;j++)s*=ks[j]*Math.pow(x,ex[j])*Math.pow(y,ey[j]);return s;},
  f1:function(x,y){return rc*Math.pow(x,ex[0]+ex[1]+ex[2])*Math.pow(y,ey[0]+ey[1]+ey[2]);}};
}
function g_monoDiv(){

 var k2=pick([2,3,4,5]), mult=nz(-7,7), k1=k2*mult;

 var r1=a1-a2, r2=b1-b2;

  f1:function(x,y){return mult*Math.pow(x,r1)*Math.pow(y,r2);}};

function g_monoPowDiv(){

 var k1=pick([2,3,4,5]), p=pick([2,3]);

  f1:function(x,y){return (K/k2)*Math.pow(x,r1)*Math.pow(y,r2);}};

function g_monoTimesPoly(){
