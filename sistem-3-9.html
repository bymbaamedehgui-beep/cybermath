<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Систем — алхам алхмаар бодолт (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:9px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:9px 12px;margin-bottom:13px}
  .rule ol{margin:4px 0 0 18px}.rule li{margin:1px 0}
  .method{font-weight:800;color:#5a32d6;font-size:14.5px;margin:14px 0 8px;padding:4px 0 4px 10px;border-left:5px solid var(--purple2)}
  .prob{break-inside:avoid;page-break-inside:avoid;margin-bottom:13px;border:1.4px solid #e2daf5;border-radius:11px;padding:10px 13px}
  .pn{display:inline-block;font-weight:800;color:#fff;background:var(--purple);border-radius:6px;padding:1px 9px;font-size:12px;margin-bottom:6px}
  .step{font-size:13.5px;margin:4px 0 4px 6px;color:#241a3d}
  .step .lb{color:var(--soft);font-weight:700;margin-right:5px}
  .res{font-size:14px;font-weight:800;color:var(--green);margin:6px 0 0 6px}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ жишээ</button>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function eqStr(a,b,c){var lhs='';if(a!==0)lhs+=(a===1?'':(a===-1?'-':a))+'x';if(b!==0){var bm=Math.abs(b),bs=b<0?'-':(lhs?'+':'');lhs+=bs+(bm===1?'':bm)+'y';}if(lhs==='')lhs='0';return lhs+'='+c;}
function sysStr(e1,e2){return '\\begin{cases}'+e1+'\\\\'+e2+'\\end{cases}';}
function coefT(c,vs){return (c===1?'':(c===-1?'-':c))+vs;}
function step(lb,t){return '<div class="step"><span class="lb">'+lb+'</span>'+t+'</div>';}
function res(t){return '<div class="res">Хариу: '+t+'</div>';}
function makeSystem(){var x0=nz(-5,5),y0=nz(-5,5),a1=rnd(1,4),b1=rnd(2,4),a2=rnd(1,4),b2=rnd(2,4);
  if(a1*b2-a2*b1===0)return null;if(b1===b2&&a1===a2)return null;
  var c1=a1*x0+b1*y0,c2=a2*x0+b2*y0;return {a1:a1,b1:b1,c1:c1,a2:a2,b2:b2,c2:c2,x0:x0,y0:y0};}
function solveHtml(S){
  var L=lcm(S.b1,S.b2),m1=L/S.b1,m2=L/S.b2;
  var A1=m1*S.a1,A2=m2*S.a2,C1=m1*S.c1,C2=m2*S.c2;
  var h='';
  h+=step('Систем:','$'+sysStr(eqStr(S.a1,S.b1,S.c1)+'\\quad(1)',eqStr(S.a2,S.b2,S.c2)+'\\quad(2)')+'$');
  if(m1>1||m2>1){
    var mul=(m1>1?'$(1)\\times'+m1+'$':'')+(m1>1&&m2>1?', ':'')+(m2>1?'$(2)\\times'+m2+'$':'');
    h+=step('1.','$y$-ийн коэффициентийг тэнцүүлье ('+mul+'):');
    h+=step('','$'+sysStr(eqStr(A1,L,C1),eqStr(A2,L,C2))+'$');
  } else {
    h+=step('1.','$y$-ийн коэффициент аль хэдийн тэнцүү.');
  }
  var xc=A1-A2,xr=C1-C2;
  h+=step('2.','Хасаж $y$-г арилгая: $'+eqStr(xc,0,xr)+'\\ \\Rightarrow\\ x='+S.x0+'$');
  var by=S.c1-S.a1*S.x0;
  h+=step('3.','$(1)$-д $x='+S.x0+'$ орлуулж: $'+coefT(S.b1,'y')+'='+by+'\\ \\Rightarrow\\ y='+S.y0+'$');
  h+=res('$x='+S.x0+',\\ y='+S.y0+'$');
  return h;
}
function tS(c,v){if(c===0)return '';return (c<0?'-':'+')+(Math.abs(c)===1?'':Math.abs(c))+v;}
// Орлуулах аргад тохирсон систем ($x$-ийн коэффициент 1)
function subSystem(){var x0=nz(-5,5),y0=nz(-5,5),b1=nz(-3,3),a2=rnd(2,4),b2=nz(-3,3);
  if(b2-a2*b1===0)return null;var c1=x0+b1*y0,c2=a2*x0+b2*y0;
  return {b1:b1,a2:a2,b2:b2,c1:c1,c2:c2,x0:x0,y0:y0};}
function solveSubHtml(S){
  var h='';
  h+=step('Систем:','$'+sysStr(eqStr(1,S.b1,S.c1)+'\\quad(1)',eqStr(S.a2,S.b2,S.c2)+'\\quad(2)')+'$');
  var yc=-S.b1,iso=''+S.c1+(yc!==0?((yc<0?'-':'+')+(Math.abs(yc)===1?'':Math.abs(yc))+'y'):'');
  h+=step('1.','$(1)$-ээс $x$-ийг илэрхийлье: $x='+iso+'$');
  h+=step('2.','$(2)$-т орлуулбал: $'+S.a2+'\\left('+iso+'\\right)'+tS(S.b2,'y')+'='+S.c2+'$');
  var yc2=S.b2-S.a2*S.b1,yr=S.c2-S.a2*S.c1;
  h+=step('','$'+coefT(yc2,'y')+'='+yr+'\\ \\Rightarrow\\ y='+S.y0+'$');
  h+=step('3.','$y='+S.y0+'$-г орлуулж: $x='+S.x0+'$');
  h+=res('$x='+S.x0+',\\ y='+S.y0+'$');
  return h;
}
function build(){
  var subs=[],elims=[],seen={},tr=0;
  while(subs.length<3&&tr<600){tr++;var Ss=subSystem();if(!Ss)continue;var k1='s'+eqStr(1,Ss.b1,Ss.c1)+eqStr(Ss.a2,Ss.b2,Ss.c2);if(seen[k1])continue;seen[k1]=1;subs.push(Ss);}
  tr=0;while(elims.length<3&&tr<600){tr++;var Se=makeSystem();if(!Se)continue;var k2='e'+eqStr(Se.a1,Se.b1,Se.c1)+eqStr(Se.a2,Se.b2,Se.c2);if(seen[k2])continue;seen[k2]=1;elims.push(Se);}
  var subHtml=subs.map(function(S,i){return '<div class="prob"><span class="pn">Жишээ '+(i+1)+'</span>'+solveSubHtml(S)+'</div>';}).join('');
  var elimHtml=elims.map(function(S,i){return '<div class="prob"><span class="pn">Жишээ '+(i+1)+'</span>'+solveHtml(S)+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Систем бодох — алхам алхмаар</h1><div class="sub">Орлуулах ба нэмэх арга · бодолтыг дагаж алхам бүрийг гүйцэтгээрэй · 9-р анги · 4.3</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span> </span></div>'
    +'<div class="method">A. Орлуулах арга</div>'
    +'<div class="rule"><b>Орлуулах аргын алхмууд:</b><ol><li>Нэг тэгшитгэлээс коэффициент нь $1$ хувьсагчийг илэрхийл (ж: $x=\\ldots$).</li><li>Илэрхийллийг нөгөө тэгшитгэлд орлуулж, нэг хувьсагчтай тэгшитгэл гарган бод.</li><li>Гарсан утгыг $x=\\ldots$-д орлуулж нөгөө хувьсагчийг ол.</li></ol></div>'
    +subHtml
    +'<div class="method">Б. Нэмэх арга</div>'
    +'<div class="rule"><b>Нэмэх аргын алхмууд:</b><ol><li>Нэг хувьсагчийн коэффициентийг тохирох тоогоор үржүүлж тэнцүү болго.</li><li>Тэгшитгэлүүдийг хасаж (эсвэл нэмж) уг хувьсагчийг арилга → нэг хувьсагчтай тэгшитгэл бод.</li><li>Гарсан утгыг эхний тэгшитгэлд орлуулж нөгөө хувьсагчийг ол.</li></ol></div>'
    +elimHtml;
  window.WS_ITEMS=[];window.WS_TITLE='Систем — алхам алхмаар';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
