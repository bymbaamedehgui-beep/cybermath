// ══════════ g10core.js — 10-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ g12ch3.js — 12-р анги III БҮЛЭГ. ФУНКЦ БА ГРАФИК ══════════
// Сурах бичгийн 43–94 хуудасны жишээ, дасгалын хэлбэрээр.
// 3.1 Тооны логарифм · 3.2 Логарифмын чанар · 3.3 Хялбар илтгэгч тэгшитгэл, тэнцэтгэл биш · 3.4 Логарифм функц
// 3.5 y = e^x ба y = ln x функц · 3.6 Рационал функц · 3.7 Тоон аргументтай тригонометр функц · 3.8 Бүлгийн нэмэлт даалгавар
// merge_g12ch.js-ээр g12ch3.s31…s38.js хэсгүүдээс нэгтгэв — засварыг хэсгийн файлд хийгээд дахин нэгтгэ.
// g12core.js энэ файлын ӨМНӨ залгагдана.

// ───────── g12ch3.s31.js ─────────
// ── 12-р анги III БҮЛЭГ «ФУНКЦ БА ГРАФИК» · 3.1 ТООНЫ ЛОГАРИФМ (сурах бичгийн 43–46 хуудас) ──
// Хэлбэрүүд (сурах бичгээс):
//   Жишээ 1, Дасгал 2  — зэргийн тэнцэтгэлийг логарифм ашиглан бичих   (g_31_expToLog, g_31_expToLogR)
//   Жишээ 2, Дасгал 1  — логарифмтай тэнцэтгэлийг зэрэг хэлбэрт бичих  (g_31_logToExp, g_31_logToExpR)
//   Жишээ 3            — тодорхойлолт ашиглан логарифмын утга олох     (g_31_evalInt, g_31_evalFrac)
//   Жишээ 4            — тригонометр утгын логарифм                     (g_31_evalTrig)
//   Дасгал 4           — нөхцөлийг хангах x (утга / аргумент / суурь)   (g_31_solveA, g_31_solveB, g_31_solveC)
//   Бодлого 1          — бактерийн өсөлт, t = log_2 60                  (g_31_word)
//   Дасгал 5           — логарифм агуулсан илэрхийллийн утга            (g_31_exprA, g_31_exprB, g_31_exprC)
//   Жишээ 5, Дасгал 3  — логарифм утгатай (тодорхойлогдох) байх муж      (g_31_dom1, g_31_dom2, g_31_dom3)
// g12core.js-ийн дараа залгагдана. Нэрс: g_31_* (генератор), h31_* (туслах).

// ════════ Тоог p^{t} хэлбэрээр (p — атом суурь, t — рационал илтгэгч) ════════
var h31_LIM = { 2: 1024, 3: 729, 5: 625, 6: 216, 7: 343, 10: 10000, 11: 121 };

function h31_ok(p, t) {
  if ([1, 2, 3, 4].indexOf(t.d) < 0) return false;
  if (t.d > 1 && [2, 3, 5, 7].indexOf(p) < 0) return false;
  if (t.d === 4 && p > 3) return false;
  return Math.pow(p, Math.abs(t.n / t.d)) <= h31_LIM[p] + 1e-9;
}
// p^{N/d}, N>0 :  8,  \sqrt{2},  2\sqrt{2},  \sqrt[3]{4},  3\sqrt[4]{3}
function h31_body(p, N, d) {
  if (d === 1) return '' + Math.pow(p, N);
  var m = Math.floor(N / d), r = N % d, c = m ? '' + Math.pow(p, m) : '';
  if (d === 2) return c + '\\sqrt{' + p + '}';
  return c + '\\sqrt[' + d + ']{' + Math.pow(p, r) + '}';
}
function h31_dec(p, k) { return trimZeros((1 / Math.pow(p, k)).toFixed(k)); }      // 2^{-2} → 0.25
// Логарифмын доорх тоо / хариуны тоо (display хэлбэр)
function h31_num(p, t, dec) {
  if (t.n === 0) return '1';
  if (t.n > 0) return h31_body(p, t.n, t.d);
  if (dec && t.d === 1 && -t.n <= 4 && (p === 2 || p === 5 || p === 10)) return h31_dec(p, -t.n);
  return '\\dfrac{1}{' + h31_body(p, -t.n, t.d) + '}';
}
// Логарифмын суурь (доод индекс)
function h31_sub(p, s) {
  if (s.d === 1) return s.n > 0 ? '' + Math.pow(p, s.n) : '\\frac{1}{' + Math.pow(p, -s.n) + '}';
  var b = h31_body(p, Math.abs(s.n), s.d);
  return s.n > 0 ? b : '\\frac{1}{' + b + '}';
}
// Зэргийн суурь: 4,  \left(\dfrac{1}{2}\right),  \left(\sqrt{5}\right)
function h31_par(p, s) {
  if (s.d === 1 && s.n > 0) return '' + Math.pow(p, s.n);
  return '\\left(' + h31_num(p, s, false) + '\\right)';
}
function h31_log(p, s, arg) {
  if (p === 10 && s.n === 1 && s.d === 1) return '\\lg ' + arg;
  return '\\log_{' + h31_sub(p, s) + '}' + arg;
}
function h31_exp(f) { return f.d === 1 ? '' + f.n : (f.n < 0 ? '-' : '') + '\\frac{' + Math.abs(f.n) + '}{' + f.d + '}'; }
function h31_canDec(P) { return P.t.d === 1 && P.t.n < 0 && -P.t.n <= 4 && (P.p === 2 || P.p === 5 || P.p === 10); }

// Суурийн сангууд: [p, n] → p^n ;  [p, n, d] → p^{n/d}
var h31_BE = [[2, 1], [2, 2], [2, 3], [2, 4], [3, 1], [3, 2], [3, 3], [5, 1], [5, 2], [6, 1], [7, 1], [7, 2], [10, 1], [11, 1],
  [2, -1], [2, -2], [2, -3], [3, -1], [3, -2], [5, -1]];
var h31_BE2 = [[2, 2], [2, 3], [2, 4], [2, 5], [2, 6], [2, 8], [3, 2], [3, 3], [3, 4], [5, 2], [5, 3], [7, 2],
  [2, -2], [2, -3], [2, -4], [3, -2], [3, -3], [5, -2]];
var h31_BR = [[2, 1, 2], [3, 1, 2], [5, 1, 2], [7, 1, 2], [2, -1, 2], [3, -1, 2]];

// Жишээ 1: a^x = b  →  x = log_a b
function g_33_eqBasic() {
  var B = pick([h33_B(2), h33_B(3), h33_B(5), h33_B(6), h33_B(7), h33_B(10), h33_B(2, 1), h33_B(3, 1), h33_B(5, 1)]);

  var raw = h33_lb(B) + h33_arg(n, d, dec), L = h33_logB(B, n, d);
  return { q: '$' + lhs + '=' + bt + '$', a: '$x=' + raw + (raw === L.t ? '' : '=' + L.t) + '$', key: h33_kx(B, L.v) };   // огтлолцлын бодлоготой нийтлэг key
}

// Жишээ 2: y = f(x) ба y = b графикууд огтлолцох уу, огтлолцлын цэгийн абсцисс
function g_33_intersect() {

  var b = rnd(1, 20) <= 2 ? -rnd(0, 8) : rnd(2, 24);              // огтлолцохгүй тохиолдол ~10–13%
  if (form === 0) f = h33_bp(B, 'x');
  else if (form === 1) { m = nz(-2, 2); f = h33_bp(B, h33_lin(1, m)); }
  else { c = rnd(2, 5); if (h33_isPow(B.p, c, 1) !== null) return null; f = c + '\\cdot ' + h33_bp(B, 'x'); }   // 2·2^x = 2^{x+1} (form 1-тэй давхцахгүй)
  // b ≤ 0: «y=B^{x+m}, y=b» нь «B^{x+m}=b» тэгшитгэлтэй (eqBasic, eqLin1) нэг key-тэй
  var q = '$y=' + f + '$, $y=' + b + '$';
  if (b <= 0) return { q: q, a: '$' + f + '\\gt 0$ тул $' + f + '=' + b + '$ тэгшитгэл шийдгүй<br>Огтлолцохгүй', key: h33_kxn(B, 1, m, c, b) };
  var R, step = '$' + f + '=' + b + '$', mid = '';

  // eqBasic, eqLin1-тэй нийтлэг (7^x=7 ба «y=7^x, y=7» нэг хуудсан дээр давхардахгүй)
  return { q: q, a: step + '<br>Огтлолцоно: $x=' + xt + '$', key: h33_kx(B, L.v) };
}

// Жишээ 3: a^{x+m} = b,  a^{m-x} = b,  c·a^{x+m} = N
function g_33_eqLin1() {
  var B = pick([h33_B(2), h33_B(3), h33_B(5), h33_B(6), h33_B(7), h33_B(2), h33_B(3), h33_B(3, 1), h33_B(2, 1)]);
  var s = B.inv ? -1 : 1, form = rnd(0, 2), m = nz(-3, 3), c = 1, b, r = rnd(1, 10);

  else if (r >= 9) { b = h33_pw(B.p, rnd(0, 3)); if (b > 400) return null; }
  else { b = rnd(2, 30); if (h33_isPow(B.p, b, 1) !== null) return null; }

  if (b <= 0) return { q: '$' + q + '$', a: (form === 2 ? '$' + lhs + '=' + b + '$, ' : '') + '$' + lhs + '\\gt 0$ тул шийдгүй', key: key };
  var Lb = h33_logB(B, b, 1), raw = h33_lb(B) + b, R, mid;

  // key: суурь p ба шийд x ижил бол тэгшитгэлүүд нь p^{x}=const хэлбэрт адил (3^{x+1}=15 ба 3^{x+2}=45; (1/3)^{1-x}=3 ба 3^{x-2}=1);
  // eqBasic, intersect-тэй нийтлэг (3^{x+1}=15 ба «y=3^{x+1}, y=15» нэг хуудсан дээр давхардахгүй)
  return { q: '$' + q + '$', a: a, key: h33_kx(B, L.v) };
}

// Жишээ 7 (тэгшитгэл): a^{kx+m} = a^m·c^k → x = log_a c ;  a^{m-kx} = a^m/c^k ;  a^{kx+m} = a^j
function g_33_eqLin2() {
  // hard түвшин: нэг алхмын «a^{kx+m}=a^j» салаа ~10–15% л (үлдсэн нь Жишээ 7-ийн логарифмтай хэлбэр)
  var a = pick([2, 3, 5, 6, 7]), k = pick([2, 2, 3]), m = rnd(-2, 2), form = rnd(1, 20), ex = h33_lin(k, m), q, ans, key;

    var Pj = h33_pw(a, Math.abs(j)); if (Pj > 2500) return null;

    key = '33l2r:' + a + ':' + k + ':' + (j - m);          // a^{kx+m}=a^j ⇔ a^{kx}=a^{j-m}

    ans = '$' + ex + '=' + lg + b.n + '$<br>' + (m ? '$' + k + 'x=' + lg + b.n + (m > 0 ? '-' + m : '+' + (-m)) + '=' + lg + ck + '$<br>' : '')
      + '$x=\\dfrac{1}{' + k + '}' + lg + ck + '=' + lg + c + '$';
    key = '33l2:' + a + ':' + k + ':' + c;                  // бүх хэлбэр a^{kx}=c^k-тэй тэнцүү чанартай
  } else {
    if (m <= 0) m = rnd(1, 2);
    var bb = fDiv(h33_rp(a, m), Fr(ck, 1)); if (bb.d > 5000) return null;
    var ex2 = h33_lin(-k, m, 'x', true);
    q = '$' + a + '^{' + ex2 + '}=' + h33_q(bb.n, bb.d) + '$';
    ans = '$' + ex2 + '=' + lg + h33_arg(bb.n, bb.d) + '=' + m + '-' + lg + ck + '$<br>$' + k + 'x=' + lg + ck + '$<br>$x=' + lg + c + '$';
    key = '33l2:' + a + ':' + k + ':' + c;
  }

}

// Дасгал 64: a^{sin x} = b, a^{cos x} = b  (муж дотор)
function g_33_eqTrig() {
  var fn = pick(['sin', 'cos']), V = pick([[0, 1], [1, 2], [1, 2], [-1, 2], [1, 1], [-1, 1]]), a, rhs, s;
  if (V[1] === 2) {

    if (rnd(0, 1)) { a = s * s; rhs = V[0] > 0 ? '' + s : '\\dfrac{1}{' + s + '}'; }
    else { a = s; rhs = V[0] > 0 ? '\\sqrt{' + s + '}' : '\\dfrac{1}{\\sqrt{' + s + '}}'; }
  } else if (V[0] === 0) { a = pick([2, 3, 4, 5, 7]); rhs = '1'; }
  else { a = pick([2, 3, 4, 5]); rhs = V[0] > 0 ? '' + a : '\\dfrac{1}{' + a + '}'; }
  var D = pick([1, 2]), v = V[0] / V[1], sols = [];
  for (var k = 0; k <= 6 * D; k++) {

  }

  var et = V[0] === 0 ? '0' : (V[1] === 1 ? '' + V[0] : (V[0] < 0 ? '-' : '') + '\\frac{1}{2}');
  var vt = V[1] === 1 ? '' + V[0] : (V[0] < 0 ? '-' : '') + '\\dfrac{1}{2}';

    q: '$' + a + '^{\\' + fn + ' x}=' + rhs + '$ $\\left(' + dom + '\\right)$',

// Жишээ 4: (a²)^x + p·a^x + q = 0
function g_33_eqQuad() {
  var a = pick([2, 3, 5]), u1 = rnd(-6, 9), u2 = rnd(-6, 9);
  if (!u1 || !u2 || u1 === u2) return null;
  if (u1 < 0 && u2 < 0 && rnd(0, 5)) return null;
  if (u1 > u2) { var t = u1; u1 = u2; u2 = t; }

// Жишээ 5: a^x - c/a^x = p ;  a^x + c·a^{-x} = p ;  a^x + a^{k-x} = p
function g_33_eqRecip() {

    q = a + '^{x}+' + c + '\\cdot ' + a + '^{-x}=' + p;

  return {
    q: '$' + q + '$',
    a: '$u=' + a + '^{x}\\gt 0$' + (form === 2 ? ', $' + a + '^{' + k + '-x}=\\dfrac{' + c + '}{u}$' : '') + ': $' + poly + '=0$<br>$u=' + lo + '$ эсвэл $u=' + hi + '$'
      + (lo < 0 ? ' ($u=' + lo + '\\lt 0$ тохирохгүй)' : '') + '<br>' + h33_set(sols),
    key: '33rc:' + a + ':' + lo + ':' + hi             // form 1, 2 нэг тэгшитгэлийг өөрөөр бичиж болох тул форм оруулахгүй
  };

// Дасгал 58г: A·a^{2x(+1)} + B·a^{x(+1)} + C = 0, язгуур нь бутархай
function g_33_eqQuadC() {
  var a = pick([2, 3, 5]);
  var s1 = rnd(1, 5), r1 = nz(-3, 6), s2 = rnd(1, 5), r2 = nz(-3, 6);
  if (gcd(r1, s1) !== 1 || gcd(r2, s2) !== 1) return null;
  if (r1 * s2 === r2 * s1 || (s1 === 1 && s2 === 1) || (r1 < 0 && r2 < 0)) return null;
  var A = s1 * s2, Bc = -(s1 * r2 + s2 * r1), C = r1 * r2;
  if (!Bc) return null;
  if (rnd(0, 1)) { A = -A; Bc = -Bc; C = -C; }

  if (h33_natC(Bc, a, false)) OB.push([Bc, a + '^{x}', 0]);
  if (Bc % a === 0 && h33_natC(Bc / a, a, true)) OB.push([Bc / a, a + '^{x+1}', 1]);
  if (!OA.length || !OB.length) return null;
  var TA = OA.length > 1 ? OA[rnd(0, 1)] : OA[0], TB = OB.length > 1 ? (rnd(0, 3) ? OB[1] : OB[0]) : OB[0], sh = TA[2] + TB[2];
  if (!sh && rnd(0, 1)) return null;
  // илтгэгчтэй хоёр гишүүний дарааллыг холино, тогтмол гишүүн сүүлд (сурах бичгийн дагуу)
  var T = shuffle([TA, TB]).concat([[C, '']]), lhs = '';
  T.forEach(function (t, i) { lhs += h33_ct(t[0], t[1], i === 0); });
  var roots = [[r1, s1], [r2, s2]].sort(function (x, y) { return x[0] / x[1] - y[0] / y[1]; }), sols = [], rej = [];
  roots.forEach(function (R) { if (R[0] > 0) sols.push(h33_L(a, R[0], R[1])); else rej.push(h33_q(R[0], R[1])); });
  return {
    q: '$' + lhs + '=0$',
    a: '$u=' + a + '^{x}\\gt 0$: $' + h33_poly(A, Bc, C, 'u') + '=0$<br>$u=' + h33_q(roots[0][0], roots[0][1]) + '$ эсвэл $u=' + h33_q(roots[1][0], roots[1][1]) + '$'
      + (rej.length ? ' ($u=' + rej[0] + '\\lt 0$ тохирохгүй)' : '') + '<br>' + h33_set(sols),
    key: '33qc:' + a + ':' + roots.join('|')            // 6·9^x ба 2·3^{2x+1}, ±1 үржигдэхүүн — нэг тэгшитгэл
  };
}

// Дасгал 58ж: k(a²ˣ+a⁻²ˣ) + M(aˣ+a⁻ˣ) + n = 0  (t = aˣ + a⁻ˣ)

  var P2 = '\\left(' + a2 + '^{x}+' + a2 + '^{-x}\\right)', P1 = '\\left(' + a + '^{x}+' + a + '^{-x}\\right)';
  var q = '$' + h33_cp(k, P2, true) + h33_cp(M, P1, false) + (n ? h33_ct(n, '', false) : '') + '=0$';
  ts.sort(function (x, y) { return fVal(x) - fVal(y); });
  var sols = [];
  vs.forEach(function (v) { var L = h33_L(a, v, 1); sols.push(L); sols.push(h33_neg(L)); });
  var ans = '$t=' + a + '^{x}+' + a + '^{-x}\\ (t\\ge 2)$ гэвэл $' + a2 + '^{x}+' + a2 + '^{-x}=t^{2}-2$<br>$'
    + h33_poly(k, M, n - 2 * k, 't') + '=0$, $t=' + fTex(ts[0]) + '$ эсвэл $t=' + fTex(ts[1]) + '$'

// Дасгал 63: (a²ˣ+a⁻²ˣ) - m(aˣ+a⁻ˣ) + K = 0-ийн шийд α, β бол a^α + a^β (эсвэл a^{2α}+a^{2β})

  var val = ask === 1 ? t1 : t1 * t1 - 2;
  var q = '$\\left(' + a2 + '^{x}+' + a2 + '^{-x}\\right)' + h33_cp(-m, '\\left(' + a + '^{x}+' + a + '^{-x}\\right)', false) + (K ? h33_ct(K, '', false) : '') + '=0$; $\\quad ' + ex + '=\\ ?$';
  var ans = '$t=' + a + '^{x}+' + a + '^{-x}\\ (t\\ge 2)$: $' + h33_poly(1, -m, K - 2, 't') + '=0$, $t=' + t1 + '$ ($t=' + t2 + '\\lt 2$ тохирохгүй)<br>'
    + '$' + a + '^{x}+' + a + '^{-x}=' + t1 + '$, $u=' + a + '^{x}$: $' + h33_poly(1, -t1, 1, 'u') + '=0$ тул $' + a + '^{\\alpha}+' + a + '^{\\beta}=' + t1 + '$, $' + a + '^{\\alpha}\\cdot ' + a + '^{\\beta}=1$<br>'

// Дасгал 58а: a^{x+m}·b^{x+n} = N  →  (ab)^x = R
function g_33_eqProd() {
  var pr = pick([[2, 5], [5, 2], [2, 3], [3, 2], [3, 5], [5, 3], [2, 7], [4, 5], [5, 4]]);

  if (r > 1 && h33_isPow(c, r, 1) !== null) return null;
  var R = h33_pw(c, k) * r; if (R === 1) return null;
  var K = fMul(h33_rp(a, m), h33_rp(b, n)), N = fMul(Fr(R, 1), K);
  if (N.d !== 1 || N.n > 2000) return null;            // хялбар түвшин: сурах бичгийн 58а (400) хэмжээнд
  var L = h33_L(c, R, 1), fin = L.t;
  if (!L.nice && k >= 1) fin += '=' + k + '+' + h33_lg(c) + r;
  return {
    q: '$' + a + '^{' + h33_lin(1, m) + '}\\cdot ' + b + '^{' + h33_lin(1, n) + '}=' + N.n + '$',
    a: '$' + h33_q(K.n, K.d) + '\\cdot ' + c + '^{x}=' + N.n + '$, $' + c + '^{x}=' + R + '$<br>$x=' + fin + '$',
    key: '33pr:' + c + ':' + R                          // шилжилт (m, n) өөр ч (ab)^x = R нэг бол давхардал
  };
}

// Дасгал 58б, в: p^x·q^{m-x} = r^x ;  P^x = c·b^{kx} ;  c1·A^x = c2·B^x
function g_33_eqRatio() {
  var f = rnd(1, 20), q, ans, key;
  if (f <= 8) {
    var pq = shuffle([2, 3, 5]), p = pq[0], b = pq[1], s = pick([1, 1, 2]), r = p * h33_pw(b, s);
    if (r > 75) return null;

    q = rnd(0, 1) ? '$' + p + '^{x}\\cdot ' + b + '^{' + m + '-x}=' + r + '^{x}$' : '$' + b + '^{' + m + '-x}\\cdot ' + p + '^{x}=' + r + '^{x}$';
    ans = '$' + r + '^{x}=' + p + '^{x}\\cdot ' + b + '^{' + sx + '}$ тул $' + b + '^{' + m + '-x}=' + b + '^{' + sx + '}$<br>$' + m + '-x=' + sx + '$<br>$x=' + fTex(X) + '$';

      else { cc = rnd(2, 12); if (h33_isPow(t, cc, 1) !== null) return null; }
      if (!h33_natC(cc, b2, false)) return null;           // 6^x=9·3^x (= 3^{x+2}) зохиомол
      var bk = k === 1 ? b2 + '^{x}' : b2 + '^{' + k + 'x}';

      ans = (k === 1 ? '' : '$' + bk + '=' + Q + '^{x}$, ') + '$\\dfrac{' + P + '^{x}}{' + Q + '^{x}}=' + cc + '$, $' + t + '^{x}=' + cc + '$<br>$x=' + h33_L(t, cc, 1).t + '$';
      key = '33rb:' + P + ':' + Q + ':' + cc;                // 2^{2x} ба 4^{x} — нэг тэгшитгэл
    } else {
      var tri = pick([[3, 2, 3], [5, 2, 2], [3, 2, 2], [5, 3, 2], [2, 3, 1], [5, 2, 3], [3, 5, 1], [2, 5, 1]]);

      key = '33rc3:' + p3 + ':' + b3 + ':' + k3;
    }

    // kk < 0 бол c1 = A^{|kk|} болж 4·2^x (= 2^{x+2}) зохиомол бичлэг гарна — зөвхөн kk > 0
    var ab = pick([[3, 2], [2, 3], [5, 2], [2, 5], [5, 3], [3, 5]]), A = ab[0], Bb = ab[1], kk = pick([1, 2, 2, 3]);
    var c1 = kk > 0 ? h33_pw(Bb, kk) : h33_pw(A, -kk), c2 = kk > 0 ? h33_pw(A, kk) : h33_pw(Bb, -kk);

    ans = '$\\left(\\dfrac{' + A + '}{' + Bb + '}\\right)^{x}=' + h33_q(c2, c1) + (kk === 1 ? '' : '=\\left(\\dfrac{' + A + '}{' + Bb + '}\\right)^{' + kk + '}') + '$<br>$x=' + kk + '$';
    key = '33rd:' + Math.min(A, Bb) + ':' + Math.max(A, Bb) + ':' + kk;   // A, B-г сольж бичсэн нь ижил тэгшитгэл
  }
  return { q: q, a: ans, key: key };
}

// Дасгал 58д, е: √(a^x) ± c·√(a^{-x}) = p
function g_33_eqSqrt() {

      + (lo < 0 ? ' ($u=' + lo + '\\lt 0$ тохирохгүй)' : '') + '<br>$' + a + '^{\\frac{x}{2}}=u$ тул $x=2' + h33_lg(a) + 'u$<br>' + h33_set(sols),

// Дасгал 58ё: A^x + B^x = R, A·B = 1

// Дасгал 67: 2^{|x-p|} - |2^{x-q} - 1| = 2^{x-q} + 1  (x=p, x=q цэгүүдээр муж хуваана)
//   x≥q: 2^{|x-p|}=2^{x-q+1};  x<q: 2^{|x-p|}=2.  q=p+1 (сурах бичиг) → {p-1} ∪ [q; +∞[
function g_33_eqAbs() {
  var p = rnd(-3, 3), r = rnd(1, 4), d = r <= 2 ? 1 : (r === 3 ? -rnd(1, 3) : rnd(2, 4)), q = p + d;
  if (Math.abs(q) > 4) return null;
  var XP = h33_lin(1, -p), XQ = h33_lin(1, -q), PX = h33_lin(-1, p, 'x', p > 0);   // x-p, x-q, p-x
  var EB = '2^{' + XQ + '}', rhs = rnd(0, 2) ? EB + '+1' : '1+' + EB;
  var q0 = '$2^{\\left|' + XP + '\\right|}-\\left|' + EB + '-1\\right|=' + rhs + '$';
  var m1 = Math.min(p, q), m2 = Math.max(p, q), lines = [], pts = [], ray = false;
  var R1 = h33_lin(1, 1 - q);                                                         // x-q+1
  var regs = [
    { t: 'x\\lt ' + m1, lo: -Infinity, hi: m1, sA: -1, sB: -1 },
    { t: m1 + '\\le x\\lt ' + m2, lo: m1, hi: m2, sA: p === m1 ? 1 : -1, sB: q === m1 ? 1 : -1 },
    { t: 'x\\ge ' + m2, lo: m2, hi: Infinity, sA: 1, sB: 1 }
  ];
  regs.forEach(function (G) {
    // E = R (адилтгал) бол «$E=R$»-г, E = x (p = 0) бол давхар «$x=X$»-г бичихгүй
    var E = G.sA > 0 ? XP : PX, R = G.sB > 0 ? R1 : '1', s = '$' + G.t + '$ үед: $2^{' + E + '}=' + h33_pow(2, R) + '$' + (E === R ? '' : ', $' + E + '=' + R + '$');
    var X = null;
    if (G.sB > 0 && G.sA > 0) {                       // x-p = x-q+1
      if (q - p === 1) { lines.push(s + ' — адилтгал тул бүх $' + G.t + '$ шийд'); ray = true; return; }
      lines.push(s + ' — шийдгүй'); return;

  else fin = h33_set(pts);
  return { q: q0, a: lines.join('<br>') + '<br>' + fin, key: '33ab:' + p + ':' + q };
}

// Дасгал 59б: P^{L1(x)} = Q^{L2(y)},  R^{L3(y)} = S^{L4(x)}
function g_33_sysLin() {
  var BP = [[2, 1, 3], [2, 1, 2], [2, 2, 3], [2, 3, 2], [3, 1, 2], [3, 2, 1], [3, 1, 3], [5, 1, 2], [2, 2, 1], [2, 3, 1]];
  var E1 = pick(BP), E2 = pick(BP); if (E1[0] === E2[0]) return null;
  var x0 = rnd(-2, 5), y0 = rnd(-3, 5), e1 = E1[1], e2 = E1[2], e3 = E2[1], e4 = E2[2];
  var a1 = nz(-8, 8), c2 = rnd(-6, 6), num = e2 * (y0 + c2);
  if (num % e1 !== 0) return null;
  var c1 = num / e1 - a1 * x0;
  var a2 = pick([1, 1, 2]), c3 = rnd(-5, 5), num2 = e3 * (y0 + c3);
  if (num2 % e4 !== 0) return null;
  var c4 = num2 / e4 - a2 * x0;
  if (e1 * a1 * e3 - e2 * e4 * a2 === 0) return null;
  if (Math.abs(c1) > 15 || Math.abs(c4) > 12) return null;
  var P = h33_pw(E1[0], e1), Q = h33_pw(E1[0], e2), R = h33_pw(E2[0], e3), S = h33_pw(E2[0], e4);
  var L1 = h33_lin(a1, c1, 'x', a1 < 0 && c1 > 0), L2 = h33_lin(1, c2, 'y'), L3 = h33_lin(1, c3, 'y'), L4 = h33_lin(a2, c4, 'x');
  return {
    q: '$\\begin{cases}' + P + '^{' + L1 + '}=' + Q + '^{' + L2 + '}\\\\ ' + R + '^{' + L3 + '}=' + S + '^{' + L4 + '}\\end{cases}$',
    a: 'Зэргүүдийг ижил суурьтай болгож илтгэгчийг тэнцүүлбэл<br>$\\begin{cases}' + h33_mulLin(e1, a1, c1, L1, 'x') + '=' + h33_mulLin(e2, 1, c2, L2, 'y') + '\\\\ '
      + h33_mulLin(e3, 1, c3, L3, 'y') + '=' + h33_mulLin(e4, a2, c4, L4, 'x') + '\\end{cases}$<br>$(x;\\ y)=' + h33_pair(x0, y0) + '$',
    key: '33sl:' + [P, Q, R, S, a1, c1, c2, c3, a2, c4].join(',')

}

// Дасгал 59а: x + y = s,  a^x + a^y = N

      + '$(x;\\ y)\\in\\left\\{' + h33_pair(m, n) + ';\\ ' + h33_pair(n, m) + '\\right\\}$',

// Дасгал 59в, г, д, е
function g_33_sysHard() {
  var mode = rnd(0, 2), q, ans, key;
  if (mode === 0) {                                   // 59д: xy=10^p, x^{lg y}=10^q
    var u1 = rnd(-1, 4), u2 = rnd(-1, 4); if (u1 >= u2) return null;
    var p = u1 + u2, qq = u1 * u2, sw = rnd(0, 1);
    var tp = function (e) { return e === 0 ? '1' : h33_pow(10, e); };
    var num = function (e) { return e >= 0 ? '' + h33_pw(10, e) : '0.1'; };
    q = '$\\begin{cases}xy=' + tp(p) + '\\\\ ' + (sw ? 'x^{\\lg y}' : 'y^{\\lg x}') + '=' + tp(qq) + '\\end{cases}$';
    ans = 'Логарифмчилбал $\\lg x+\\lg y=' + p + '$, $\\lg x\\cdot\\lg y=' + qq + '$<br>$\\lg x=' + u1 + ',\\ \\lg y=' + u2 + '$ эсвэл $\\lg x=' + u2 + ',\\ \\lg y=' + u1 + '$<br>'
      + '$(x;\\ y)\\in\\left\\{' + h33_pair(num(u1), num(u2)) + ';\\ ' + h33_pair(num(u2), num(u1)) + '\\right\\}$';
    key = '33sh0:' + u1 + ':' + u2 + ':' + sw;
  } else if (mode === 1) {                            // 59е: y²·10^{1+lg x}=10^{2+lg c}, A^{αx+βy}=(A^e)^{γy-δx}
    var sqY = rnd(0, 1) === 1, x0 = rnd(1, 10), y0 = rnd(1, 10);
    if (x0 === y0) return null;
    var prod = sqY ? x0 * y0 * y0 : x0 * x0 * y0;
    if (prod % 10 !== 0 || prod / 10 > 30) return null;
    var c = prod / 10, BE = pick([[2, 3], [2, 2], [3, 2], [3, 3], [5, 2]]), Ab = BE[0], e = BE[1], al, be, ga, de, ok = false;
    for (var t = 0; t < 200 && !ok; t++) {

    var eq1 = (sqY ? 'y^{2}\\cdot 10^{1+\\lg x}' : 'x^{2}\\cdot 10^{1+\\lg y}') + '=' + rhs;
    var eq2 = Ab + '^{' + h33_lin2(al, 'x', be, 'y') + '}=' + h33_pw(Ab, e) + '^{' + h33_lin2(ga, 'y', -de, 'x') + '}';
    q = '$\\begin{cases}' + eq1 + '\\\\ ' + eq2 + '\\end{cases}$';
    ans = '$' + (sqY ? '10x\\cdot y^{2}' : '10y\\cdot x^{2}') + '=' + (100 * c) + '$ тул $' + (sqY ? 'xy^{2}' : 'x^{2}y') + '=' + (10 * c) + '$<br>'
      + '$' + h33_lin2(al, 'x', be, 'y') + '=' + e + '\\left(' + h33_lin2(ga, 'y', -de, 'x') + '\\right)$ тул $' + h33_lin2(al + e * de, 'x', 0, 'y') + '=' + h33_lin2(e * ga - be, 'y', 0, 'x') + '$<br>'
      + '$(x;\\ y)=' + h33_pair(x0, y0) + '$';

    var pq = pick([[2, 5], [5, 2], [2, 3], [3, 2], [3, 5], [5, 3], [2, 7], [7, 2]]), pp = pq[0], qv = pq[1], cc = pp * qv;
    var lg = h33_lg(cc), LP = lg + pp, LQ = lg + qv, form = rnd(0, 1), sol;
    var take = cc === 10 ? 'аравтын логарифм ав' : '$' + cc + '$ суурьтай логарифм ав';    // нөхцөл залгавар тоон дээр залгахгүй
    if (form === 0) {
      q = '$\\begin{cases}' + pp + '^{x}\\cdot ' + qv + '^{y}=1\\\\ ' + qv + '^{x+1}\\cdot ' + pp + '^{y}=' + pp + '\\end{cases}$';
      ans = 'Хоёр талаас ' + take + 'бал $x' + LP + '+y' + LQ + '=0$, $(x+1)' + LQ + '+y' + LP + '=' + LP + '$<br>'
        + '$' + LP + '+' + LQ + '=1$ болохыг ашиглавал<br>$(x;\\ y)=' + h33_pair('-' + LQ, LP) + '$';
    } else {

      ans = 'Хоёр талаас ' + take + 'ч хоёрт хуваавал $x' + LP + '+(y+1)' + LQ + '=' + LP + '$, $x' + LQ + '+y' + LP + '=0$<br>'
        + '$' + LP + '+' + LQ + '=1$ болохыг ашиглавал<br>$(x;\\ y)=' + h33_pair(LP, '-' + LQ) + '$';

// Дасгал 61, 62: бүхэл шийд
function g_33_intSol() {
  var q, ans, key;
  if (rnd(0, 4) < 3) {                                // 61: P^x·Q^y = N
    var pr = pick([[2, 3], [2, 3], [2, 5], [3, 5]]), s = pr[0], t = pr[1];
    var a1 = rnd(0, 3), b1 = rnd(0, 2), a2 = rnd(0, 3), b2 = rnd(0, 2);
    var P = h33_pw(s, a1) * h33_pw(t, b1), Q = h33_pw(s, a2) * h33_pw(t, b2);
    if (P < 2 || Q < 2 || P === Q || P > 75 || Q > 75) return null;
    if (a1 * b2 - a2 * b1 === 0 || (!(a1 && b1) && !(a2 && b2))) return null;
    var x0 = rnd(-2, 4), y0 = rnd(-3, 3), E1 = a1 * x0 + a2 * y0, E2 = b1 * x0 + b2 * y0;
    if (E1 < 0 || E2 < 0) return null;
    var N = h33_pw(s, E1) * h33_pw(t, E2); if (N > 50000 || N < 2) return null;
    var X1 = h33_lin2(a1, 'x', a2, 'y'), X2 = h33_lin2(b1, 'x', b2, 'y');
    q = '$' + P + '^{x}\\cdot ' + Q + '^{y}=' + N + '$';
    ans = '$' + s + '^{' + X1 + '}\\cdot ' + t + '^{' + X2 + '}=' + h33_pow(s, E1) + '\\cdot ' + h33_pow(t, E2) + '$<br>$\\begin{cases}' + X1 + '=' + E1 + '\\\\ ' + X2 + '=' + E2 + '\\end{cases}$<br>$(x;\\ y)=' + h33_pair(x0, y0) + '$';
    key = '33is:' + P + ':' + Q + ':' + N;
  } else {                                            // 62: (x²+bx+c)^{x+d} = 1
    var r1 = rnd(-4, 4), r2 = rnd(-4, 4); if (r1 >= r2) return null;
    var b = -(r1 + r2), c = r1 * r2 + 1, d = rnd(-4, 4);
    var base = function (x) { return x * x + b * x + c; };
    var bt = 'x^{2}' + (b ? (b > 0 ? '+' : '-') + (Math.abs(b) === 1 ? '' : Math.abs(b)) + 'x' : '') + (c ? (c > 0 ? '+' + c : '' + c) : '');
    var S = {}, lines = [];
    S[r1] = 1; S[r2] = 1;
    lines.push('Суурь $1$: $' + bt + '=1$, $x=' + r1 + '$ эсвэл $x=' + r2 + '$');
    if (base(-d) !== 0) { S[-d] = 1; lines.push('Илтгэгч $0$: $x=' + (-d) + '$ (суурь $' + base(-d) + '\\neq 0$)'); }
    else lines.push('Илтгэгч $0$ үед $x=' + (-d) + '$, суурь $0$ тул тохирохгүй');
    var D = b * b - 4 * (c + 1), sq = isqrt(D), m1 = [];
    if (sq !== null) [(-b - sq) / 2, (-b + sq) / 2].forEach(function (x) { if (x === Math.round(x) && m1.indexOf(x) < 0) m1.push(x); });
    var good = m1.filter(function (x) { return Math.abs(x + d) % 2 === 0; });
    good.forEach(function (x) { S[x] = 1; });
    lines.push('Суурь $-1$, илтгэгч тэгш: ' + (good.length ? '$x=' + good.join('$, $x=') + '$' : 'бүхэл шийд алга'));
    var xs = Object.keys(S).map(Number).sort(function (u, v) { return u - v; });
    q = '$\\left(' + bt + '\\right)^{' + h33_lin(1, d) + '}=1$';
    ans = lines.join('<br>') + '<br>' + h33_set(xs.map(function (x) { return { t: '' + x, v: x }; }));
    key = '33ib2:' + b + ':' + c + ':' + d;
  }
  return { q: q, a: ans, key: key };
}

// Дасгал 65, 66: параметртэй тэгшитгэл (u = s^x орлуулга)
function g_33_param() { return rnd(0, 4) < 3 ? h33_paramTwo() : h33_paramOne(); }
// 65: s^{2x} ± 2a·s^{x} + q0 - r·a = 0 ялгаатай хоёр шийдтэй байх a  (D/4 = (a-a1)(a-a2))
function h33_paramTwo() {
  var s = pick([2, 2, 3, 5]), a1 = rnd(-6, 4), a2 = rnd(-4, 6), sg = pick([1, 1, -1]);
  if (a1 >= a2) return null;
  var r = -(a1 + a2), q0 = -a1 * a2;                 // a^2 + r·a - q0 = (a-a1)(a-a2);  u1·u2 = q0 - r·a
  var cst = (q0 ? h33_ct(q0, '', false) : '') + (r ? h33_cp(-r, 'a', false) : '');
  if (!cst) return null;
  var P = cst.charAt(0) === '+' ? cst.slice(1) : cst;                                 // u1·u2 илэрхийлэл
  var first = s === 2 ? pick(['2^{2x}', '4^{x}']) : pick([s + '^{2x}', (s * s) + '^{x}']);
  var mid = (sg > 0 ? '+' : '-') + (s === 2 ? '2^{x+1}\\cdot a' : '2a\\cdot ' + s + '^{x}');
  // Нөхцөлүүд: D>0: a<a1 эсвэл a>a2;  -2·sg·a>0;  q0 - r·a > 0
  var bp = [{ t: '' + a1, v: a1 }, { t: '' + a2, v: a2 }, { t: '0', v: 0 }], pc;
  var conds = ['$a\\lt ' + a1 + '$ эсвэл $a\\gt ' + a2 + '$', '$a' + (sg > 0 ? '\\lt ' : '\\gt ') + '0$'];
  if (r) { pc = Fr(q0, r); bp.push({ t: fTex(pc), v: fVal(pc) }); var c3 = '$a' + (r > 0 ? '\\lt ' : '\\gt ') + fTex(pc) + '$'; if (conds.indexOf(c3) < 0) conds.push(c3); }
  else conds.push('$u_{1}u_{2}=' + P + '\\gt 0$ үргэлж биелнэ');
  bp.sort(function (x, y) { return x.v - y.v; });
  bp = bp.filter(function (z, i) { return !i || Math.abs(z.v - bp[i - 1].v) > 1e-9; });
  function ok(a) { return (a - a1) * (a - a2) > 0 && -2 * sg * a > 0 && q0 - r * a > 0; }
  var ivs = [], i;
  for (i = 0; i <= bp.length; i++) {
    var lo = i ? bp[i - 1] : null, hi = i < bp.length ? bp[i] : null;
    var tv = lo && hi ? (lo.v + hi.v) / 2 : (lo ? lo.v + 1 : hi.v - 1);
    if (ok(tv)) ivs.push([lo, hi]);
  }
  if (!ivs.length) return null;
  var ansSet = ivs.map(function (I) { return h33_iv(I[0], 0, I[1], 0); }).join('\\cup ');
  var eq = first + mid + cst;
  var poly = 'u^{2}' + (sg > 0 ? '+' : '-') + '2au' + cst;
  return {
    q: '$' + eq + '=0$ тэгшитгэл ялгаатай хоёр шийдтэй байх бүх $a$ тоог ол.',
    a: '$u=' + s + '^{x}\\ (u\\gt 0)$ гэвэл $' + poly + '=0$ тэгшитгэл ялгаатай хоёр эерэг шийдтэй байх ёстой.<br>'
      + '$\\dfrac{D}{4}=' + h33_poly(1, r, -q0, 'a') + '\\gt 0$, $u_{1}+u_{2}=' + (sg > 0 ? '-' : '') + '2a\\gt 0$, $u_{1}u_{2}=' + P + '\\gt 0$<br>'
      + conds.join('; ') + '<br>'
      + '$a\\in' + ansSet + '$',
    key: '33pa:' + s + ':' + a1 + ':' + a2 + ':' + sg
  };
}
// 66: (s²)^{x+a} - k·s^{x+b} + s^{2a+c} = 0 ганц шийдтэй бол түүнийг ол  →  u1·u2 = s^c, D=0 үед u0² = s^c, x = c/2
function h33_paramOne() {
  var s = pick([2, 2, 3, 5]), c = pick([-2, -1, 1, 2, 2, 3, 4]), k = s === 2 ? 1 : pick([1, 2]), s2 = s * s;
  var ce = c ? h33_lin(2, c, 'a') : '2a';                                            // 2a+c
  var cstT = (c % 2 === 0 && rnd(0, 1)) ? s2 + '^{' + h33_lin(1, c / 2, 'a') + '}' : s + '^{' + ce + '}';
  var firstT = rnd(0, 2) ? s2 + '^{x+a}' : s + '^{2x+2a}';
  var midT = (k === 1 ? '' : k + '\\cdot ') + s + '^{x+b}';
  var prodT = h33_q(c >= 0 ? h33_pw(s, c) : 1, c >= 0 ? 1 : h33_pw(s, -c));
  var X = Fr(c, 2), u0 = c % 2 === 0 ? h33_q(c >= 0 ? h33_pw(s, c / 2) : 1, c >= 0 ? 1 : h33_pw(s, -c / 2)) : s + '^{' + h33_ef(X) + '}';
  return {
    q: 'Хэрэв $' + firstT + '-' + midT + '+' + cstT + '=0$ тэгшитгэл ганц шийдтэй бол түүнийг ол. Энд $a$, $b$ нь бодит тоо.',
    a: '$u=' + s + '^{x}\\gt 0$ гэвэл $' + s2 + '^{a}u^{2}-' + (k === 1 ? '' : k + '\\cdot ') + s + '^{b}u+' + cstT + '=0$<br>'
      + '$u_{1}u_{2}=\\dfrac{' + cstT + '}{' + s2 + '^{a}}=' + prodT + '\\gt 0$, $u_{1}+u_{2}=\\dfrac{' + (k === 1 ? '' : k + '\\cdot ') + s + '^{b}}{' + s2 + '^{a}}\\gt 0$ тул бодит шийд нь хоёулаа эерэг байна.<br>'
      + 'Ганц шийдтэй байх нь $D=0$ буюу $u_{1}=u_{2}=u_{0}$ үед: $u_{0}^{2}=' + prodT + '$, $u_{0}=' + u0 + '$<br>'
      + '$' + s + '^{x}=' + u0 + '$, $x=' + fTex(X) + '$',

// Бодлого 1, 2: y=B^x графикийг ашиглан
function g_33_ineqGraph() {
  var B = pick([h33_B(2), h33_B(3), h33_B(2, 1), h33_B(3, 1)]), op = pick(h33_OPS), lhs = h33_bp(B, 'x'), bt, ans, key;
  // key нь g_33_ineqBasic-ийн key-тэй ижил хэлбэртэй ('33ib:' + суурь + тэмдэг + b-ийн хураангуй утга) — нэг хуудсан дээр
  // «(1/3)^x > 1/3» графиктай ба графикгүй хоёр удаа гарахгүй
  if (rnd(1, 6) === 1) {
    var b = -rnd(0, 2); bt = '' + b;
    ans = (op === '<' || op === '<=') ? 'Муруй $Ox$ тэнхлэгээс дээр орших тул шийдгүй' : 'Муруй бүхэлдээ $y=' + b + '$ шулуунаас дээр<br>$x\\in' + h33_ALL + '$';
    key = '33ib:' + B.p + B.inv + ':' + op + ':' + b;
  } else {
    var e = rnd(-1, 3), P = h33_pw(B.p, Math.abs(e)); if (P > 9) return null;
    bt = e >= 0 ? '' + P : '\\dfrac{1}{' + P + '}';
    var k = B.inv ? -e : e, op2 = B.inv ? h33_FLIP[op] : op, L = { t: '' + k, v: k };
    ans = 'Огтлолцлын цэгийн абсцисс $x=' + k + '$<br>$x' + h33_OP[op2] + k + '$, $x\\in' + h33_ray(op2, L) + '$';
    key = '33ib:' + B.p + B.inv + ':' + op + ':' + (e >= 0 ? P + '/1' : '1/' + P);
  }
  return { q: '$' + lhs + h33_OP[op] + bt + '$', a: ans, fig: h33_expFig(B), key: key };
}

// Жишээ 6, 8, Дасгал 60б: a^x ⋚ b
function g_33_ineqBasic() {
  var B = pick([h33_B(2), h33_B(3), h33_B(5), h33_B(6), h33_B(7), h33_B(8), h33_B(10), h33_B(2, 1), h33_B(3, 1), h33_B(5, 1), h33_B(7, 1)]);
  var op = pick(h33_OPS), lhs = h33_bp(B, 'x'), r = rnd(1, 20), n = 1, d = 1;
  if (r <= 2) {                                        // b ≤ 0 (тривиал) ~10–12%
    var b = -rnd(0, 6), q = '$' + lhs + h33_OP[op] + b + '$', key = '33ib:' + B.p + B.inv + ':' + op + ':' + b;
    if (op === '<' || op === '<=') return { q: q, a: '$' + lhs + '\\gt 0$ тул шийдгүй', key: key };
    return { q: q, a: '$' + lhs + '\\gt 0$ тул бүх бодит $x$ шийд болно<br>$x\\in' + h33_ALL + '$', key: key };
  }
  if (r <= 7) { var k = nz(-2, 3), P = h33_pw(B.p, Math.abs(k)); if (P > 1000) return null; if (k > 0) n = P; else d = P; }
  else if (r <= 16) { n = rnd(2, 30); if (h33_isPow(B.p, n, 1) !== null) return null; }
  else { d = rnd(2, 12); if (h33_isPow(B.p, 1, d) !== null) return null; }
  var dec = (d > 1 && rnd(0, 2) === 0) ? h33_dec(n, d) : null, bt = dec || h33_q(n, d);
  var raw = h33_lb(B) + h33_arg(n, d, dec), L = h33_logB(B, n, d), op2 = B.inv ? h33_FLIP[op] : op;
  return {
    q: '$' + lhs + h33_OP[op] + bt + '$',
    a: h33_cmp(B) + '$x' + h33_OP[op2] + raw + (raw === L.t ? '' : '=' + L.t) + '$<br>$x\\in' + h33_ray(op2, L) + '$',
    key: '33ib:' + B.p + B.inv + ':' + op + ':' + n + '/' + d
  };
}

// Жишээ 7: B^{kx+m} ⋚ b
function g_33_ineqLin() {
  var p = pick([2, 3, 5, 6, 7]), inv = rnd(0, 3) === 0, B = h33_B(p, inv), k = pick([2, 2, 3]), m = rnd(-2, 2), op = pick(h33_OPS);
  // hard түвшин: b ≤ 0 (тривиал) ~5%, нэг алхмын «B^{kx+m} ⋚ B^j» ~10–15%, үлдсэн нь Жишээ 7-ийн логарифмтай хэлбэр
  var ex = h33_lin(k, m), lhs = h33_bp(B, ex), op2 = inv ? h33_FLIP[op] : op, r = rnd(1, 60), q, ans, key;
  if (r <= 2) {
    var bn = -rnd(0, 5);
    q = '$' + lhs + h33_OP[op] + bn + '$';
    ans = (op === '<' || op === '<=') ? '$' + lhs + '\\gt 0$ тул шийдгүй' : '$' + lhs + '\\gt 0$ тул бүх бодит $x$ шийд болно<br>$x\\in' + h33_ALL + '$';
    // p^{±kx} op V (V = bn·p^{∓m}): 2^{2x}<-2 ба 2^{2x+1}<-4 нэг тэнцэтгэл биш
    var VN = fMul(Fr(bn, 1), h33_rp(p, inv ? m : -m));
    if (p === 2 && k === 3 && !inv && VN.d === 1) return { q: q, a: ans, key: '33ib:8false:' + op + ':' + (VN.n === 0 ? 0 : VN.n) };   // 8^x ≥ -1 ≡ 2^{3x+2} ≥ -4 (ineqBasic-ийн key)
    return { q: q, a: ans, key: '33il:n' + p + ':' + (inv ? -k : k) + ':' + op + ':' + (VN.n === 0 ? 0 : VN.n) + '/' + VN.d };
  }
  if (r <= 8) {
    var j = rnd(-2, 4); if (j === m) return null;
    var e = inv ? -j : j, P = h33_pw(p, Math.abs(e)); if (P > 1000) return null;
    var bt = e >= 0 ? '' + P : '\\dfrac{1}{' + P + '}', X = Fr(j - m, k), XT = { t: fTex(X), v: fVal(X) };
    q = '$' + lhs + h33_OP[op] + bt + '$';
    ans = (j === 1 ? h33_cmp(B) : '$' + bt + '=' + h33_bp(B, j) + '$, ' + h33_cmp(B, 1)) + '$' + ex + h33_OP[op2] + j + '$<br>$x' + h33_OP[op2] + XT.t + '$, $x\\in' + h33_ray(op2, XT) + '$';
    if (p === 2 && k === 3 && !inv) return { q: q, a: ans, key: h33_k8(op, j - m >= 0 ? h33_pw(2, j - m) : 1, j - m >= 0 ? 1 : h33_pw(2, m - j)) };
    return { q: q, a: ans, key: '33il:r' + p + inv + ':' + k + ':' + op + ':' + (j - m) };   // B^{kx+m} op B^j ⇔ B^{kx} op B^{j-m}
  }
  var c = rnd(2, 12); if (h33_isPow(p, c, 1) !== null) return null;
  var ck = h33_pw(c, k), s = inv ? -1 : 1;
  var bF = fMul(h33_rp(p, s * m), s > 0 ? Fr(ck, 1) : Fr(1, ck));       // b = B^m·C^k, C = c эсвэл 1/c
  if (bF.n > 20000 || bF.d > 20000 || (!inv && bF.d !== 1)) return null;
  var raw = h33_lb(B) + h33_arg(bF.n, bF.d), Lb = h33_logB(B, bF.n, bF.d), L = h33_L(p, c, 1);
  q = '$' + lhs + h33_OP[op] + h33_q(bF.n, bF.d) + '$';
  ans = h33_cmp(B) + '$' + ex + h33_OP[op2] + raw + (raw === Lb.t ? '' : '=' + Lb.t) + '$<br>' + (m ? '$' + k + 'x' + h33_OP[op2] + h33_lg(p) + ck + '$, ' : '') + '$x' + h33_OP[op2] + L.t + '$<br>$x\\in' + h33_ray(op2, L) + '$';
  if (p === 2 && k === 3 && !inv) return { q: q, a: ans, key: h33_k8(op, ck, 1) };
  return { q: q, a: ans, key: '33il:' + p + inv + ':' + k + ':' + op + ':' + c };          // m ялгаатай ч B^{kx} op C^k нэг
}
// 2^{3x+m} op 2^m·V ⇔ 8^x op V: g_33_ineqBasic-ийн 8 суурьтай key-тэй ижил (8^x ≤ 4 ба 2^{3x-1} ≤ 2 нэг хуудсан дээр давхардахгүй)
function h33_k8(op, n, d) { return '33ib:8false:' + op + ':' + n + '/' + d; }

// Жишээ 9: a^x ⋚ (логарифмтай илэрхийлэл)

// |u| op T (u = kx+m) — шийдийн хэсэг. T = {t, v, F?}

// Жишээ 10, 11, Дасгал 60г, 60д: B^{|kx+m|} ⋚ R

// Дасгал 68: бүх эерэг x-ийн хувьд x^{log_2 x} ≥ ax² үргэлж биелэх бүх эерэг a  (→ 0 < a ≤ 1/2)

// ════════════ Туслах: хялбар бутархайн гишүүд ════════════

// ════════════ Туслах: y=(cx+d)/(ax+b) = q + k/(x-p) ════════════
function h36_qk(c, d, a, b) { return { p: Fr(-b, a), q: Fr(c, a), k: Fr(a * d - b * c, a * a) }; }

// ════════════ Туслах: гиперболын зураг (хариу илчлэхгүй — зөвхөн өгөгдөл) ════════════
// o: {p,q,k, x0,x1,y0,y1 (бүхэл цонх), u, grid, xl:[{v,t,up}], yl:[{v,t}], dots:[[x,y]]}

    for (i = y0; i <= y1; i++) g += '<line x1="' + X(x0) + '" y1="' + Y(i) + '" x2="' + X(x1) + '" y2="' + Y(i) + '" stroke="#ece8f7" stroke-width="1"/>';
  }
  g += '<line x1="' + X(x0) + '" y1="' + Y(0) + '" x2="' + (X(x1) + 8) + '" y2="' + Y(0) + '" stroke="#555" stroke-width="1.2"/>';
  g += '<polygon points="' + (X(x1) + 12) + ',' + Y(0) + ' ' + (X(x1) + 6) + ',' + (Y(0) - 3) + ' ' + (X(x1) + 6) + ',' + (Y(0) + 3) + '" fill="#555"/>';
  g += '<line x1="' + X(0) + '" y1="' + Y(y0) + '" x2="' + X(0) + '" y2="' + (Y(y1) - 8) + '" stroke="#555" stroke-width="1.2"/>';
  g += '<polygon points="' + X(0) + ',' + (Y(y1) - 12) + ' ' + (X(0) - 3) + ',' + (Y(y1) - 6) + ' ' + (X(0) + 3) + ',' + (Y(y1) - 6) + '" fill="#555"/>';
  g += '<text x="' + (X(x1) + 4) + '" y="' + (Y(0) + 11) + '" font-size="9" font-style="italic" fill="#555">x</text>';
  g += '<text x="' + (X(0) + 5) + '" y="' + (Y(y1) - 4) + '" font-size="9" font-style="italic" fill="#555">y</text>';

    for (i = y0; i <= y1; i++) if (i) g += '<text x="' + (X(0) - 3) + '" y="' + (Y(i) + 3) + '" text-anchor="end"' + T + '>' + i + '</text>';

// Зөв/зөв биш эсэх + муж; хуваарь квадрат
function g_36_domQuad() {
  var r = Math.random(), D, rs = [];
  if (r < 0.15) {

// Хуваарь 3-р зэргийн эсвэл бүхэл биш язгууртай квадрат
function g_36_domHigh() {
  var v = rnd(0, 3), D, rs = [], fact, show = null;
  if (v === 0) {                                   // (x-r)(sx²+px+q), дискриминант < 0
    var r = nz(-4, 4), s = pick([1, 1, 2]), p = rnd(-5, 5), q = nz(-9, 9);
    if (p * p - 4 * s * q >= 0) return null;

  } else if (v === 1) {                            // гурван бүхэл язгуур

    var R = [a, b, c].sort(function (x, y) { return (x === 0 ? -99 : x) - (y === 0 ? -99 : y); });
    D = h36_mul(h36_mul([-R[0], 1], [-R[1], 1]), [-R[2], 1]);
    rs = R.map(function (z) { return h36_root(1, z); });
    fact = h36_fac(1, R[0]) + h36_fac(1, R[1]) + h36_fac(1, R[2]);
    if (R[0] === 0 && Math.random() < 0.6) show = 'x\\left(' + h36_tex(h36_mul([-R[1], 1], [-R[2], 1])) + '\\right)';

// Биквадрат, x⁶, x⁸ хэлбэрийн хуваарь (Дасгал 100е), (x-r)²(x²+c) (Дасгал 100д)
function g_36_domBiq() {
  var v = rnd(0, 3), D, rs = [], fact, a, b, A, B;
  function pm(u) {
    var s = isqrt(u);
    if (s !== null) return [{ v: -s, t: '-' + s }, { v: s, t: '' + s }];

  }

    rs = [h36_root(1, r)];
    fact = h36_fac(1, r) + '^{2}\\left(x^{2}+' + c + '\\right)';
  }

  return {

// Хуваарь квадрат (Дасгал 101а,б)

// Хуваарь 3–4-р зэргийн (Дасгал 101в,г,д,е; Жишээ 4)

    var a1 = nz(-4, 4), a2 = nz(-4, 4), pp = rnd(-3, 3), qq = rnd(1, 7);
    if (a1 === a2 || pp * pp - 4 * qq >= 0) return null;
    D = h36_mul(h36_mul([-a1, 1], [-a2, 1]), [qq, pp, 1]);
    if (D.some(function (z) { return Math.abs(z) > 40; })) return null;
    rs = [h36_root(1, a1), h36_root(1, a2)];
  }
  var n = D.length - 1, m = pick([1, 2, n, n]);
  var N = h36_rnum(m);
  for (var i = 0; i < rs.length; i++) if (Math.abs(h36_ev(N, rs[i].v)) < 1e-9) return null;
  rs = h36_sortR(rs);
  var hz = m < n ? '0' : frTeX(N[m], D[n]);
  return {
    q: '$y=' + h36_ratTex(N, D) + '$',
    a: 'Босоо: ' + rs.map(function (r) { return '$x=' + r.t + '$'; }).join(', ') + '; хэвтээ: $y=' + hz + '$',
    key: '36ac:' + N.join(',') + '|' + D.join(',')
  };
}

// ════════════════════════════════════════════════════════════
// 3. ОЛОН ГИШҮҮНТ БА ХЯЛБАР БУТАРХАЙН НИЙЛБЭРТ ЗАДЛАХ (Жишээ 2, 3, Дасгал 102)
// ════════════════════════════════════════════════════════════

function h36_twoFac() {                         // (s1x-t1)(s2x-t2), ялгаатай язгуур
  var s1 = pick([1, 1, 2, 3]), t1 = nz(-6, 6), s2 = pick([1, 1, 2, 3]), t2 = nz(-6, 6);
  if (gcd(s1, t1) !== 1 || gcd(s2, t2) !== 1 || t1 * s2 === t2 * s1) return null;
  return { s1: s1, t1: t1, s2: s2, t2: t2, F1: [-t1, s1], F2: [-t2, s2], sg: pick([1, 1, 1, -1]) };
}

// Зөв бутархай: A/(s1x-t1) + B/(s2x-t2)  (Дасгал 102а)
function g_36_pfLin() {
  var o = h36_twoFac(); if (!o) return null;
  var A = nz(-5, 5), B = nz(-5, 5);
  var N = h36_sc(h36_add(h36_sc(o.F2, A), h36_sc(o.F1, B)), o.sg), D = h36_sc(h36_mul(o.F1, o.F2), o.sg);
  var fact = (o.sg < 0 ? '-' : '') + h36_fac(o.s1, o.t1) + h36_fac(o.s2, o.t2);
  return {
    q: '$y=' + h36_ratTex(N, D) + '$',
    a: '$' + h36_tex(D) + '=' + fact + '$<br>$y=' + h36_sum('', [{ c: Fr(A, 1), den: h36_tex(o.F1) }, { c: Fr(B, 1), den: h36_tex(o.F2) }]) + '$',
    key: '36pl:' + N.join(',') + '|' + D.join(',')
  };
}

// Зөв биш, зэрэг тэнцүү: k + A/F1 + B/F2  (Жишээ 2, Дасгал 102б)
function g_36_pfImpConst() {
  var o = h36_twoFac(); if (!o) return null;
  var k = nz(-4, 4), D = h36_sc(h36_mul(o.F1, o.F2), o.sg), A, B, R;
  if (Math.random() < 0.5) {                       // бүхэл коэффициент
    var a0 = nz(-5, 5), b0 = nz(-5, 5);
    A = Fr(a0, 1); B = Fr(b0, 1);
    R = h36_sc(h36_add(h36_sc(o.F2, a0), h36_sc(o.F1, b0)), o.sg);
  } else {                                         // Жишээ 2 шиг бутархай коэффициент: үлдэгдэл R=r1·x+r0
    var r1 = rnd(-4, 4), r0 = nz(-6, 6), dd = o.s2 * o.t1 - o.s1 * o.t2;
    A = Fr(r1 * o.t1 + r0 * o.s1, o.sg * dd);
    B = Fr(r1 * o.t2 + r0 * o.s2, -o.sg * dd);
    if (A.n === 0 || B.n === 0 || (A.d === 1 && B.d === 1) || A.d > 30 || B.d > 30) return null;
    R = h36_trim([r0, r1]);
  }
  var N = h36_add(h36_sc(D, k), R);
  if (h36_deg(N) !== 2) return null;
  var fact = (o.sg < 0 ? '-' : '') + h36_fac(o.s1, o.t1) + h36_fac(o.s2, o.t2);
  return {
    q: '$y=' + h36_ratTex(N, D) + '$',
    a: '$y=' + k + '+' + h36_ratTex(R, D) + '$, $' + h36_tex(D) + '=' + fact + '$<br>$y='
      + h36_sum('' + k, [{ c: A, den: h36_tex(o.F1) }, { c: B, den: h36_tex(o.F2) }]) + '$',
    key: '36pc:' + N.join(',') + '|' + D.join(',')
  };
}

// Зөв биш, хүртвэр 3-р зэргийн: (mx+n) + A/(x-p) + B/(x-q)  (Дасгал 102г,д)
function g_36_pfImpLin() {
  var p = rnd(-5, 5), q = rnd(-5, 5);
  if (p === q) return null;
  if (p !== 0 && q === 0) { var t = p; p = q; q = t; }
  var m = nz(-3, 3), n = rnd(-5, 5), A = nz(-6, 6), B = nz(-6, 6);
  var F1 = [-p, 1], F2 = [-q, 1], D = h36_mul(F1, F2);
  var R = h36_add(h36_sc(F2, A), h36_sc(F1, B));
  var N = h36_add(h36_mul([n, m], D), R);
  return {
    q: '$y=' + h36_ratTex(N, D) + '$',
    a: '$y=' + h36_tex([n, m]) + '+' + h36_ratTex(R, D) + '$, $' + h36_tex(D) + '=' + h36_fac(1, p) + h36_fac(1, q) + '$<br>$y='
      + h36_sum(h36_tex([n, m]), [{ c: Fr(A, 1), den: h36_tex(F1), mono: p === 0 }, { c: Fr(B, 1), den: h36_tex(F2) }]) + '$',
    key: '36pi:' + N.join(',') + '|' + D.join(',')
  };
}

// Гурван үржигдэхүүн: x(x²-5x+6), (x-a)(x-b)(x-c), x²(sx-t); зөв биш x²(sx-t)  (Дасгал 102в,г)
function g_36_pf3() {
  if (Math.random() < 0.35) return h36_pfX2Imp();
  var v = rnd(0, 2), A = nz(-4, 4), B = nz(-4, 4), C = nz(-4, 4), N, D, Dshow, items, fact;
  if (v < 2) {
    var r1 = v === 0 ? 0 : nz(-4, 4), r2 = nz(-4, 4), r3 = nz(-4, 4);
    if (r1 === r2 || r2 === r3 || r1 === r3) return null;
    var F1 = [-r1, 1], F2 = [-r2, 1], F3 = [-r3, 1];
    D = h36_mul(h36_mul(F1, F2), F3);
    N = h36_add(h36_add(h36_sc(h36_mul(F2, F3), A), h36_sc(h36_mul(F1, F3), B)), h36_sc(h36_mul(F1, F2), C));
    Dshow = (v === 0 && Math.random() < 0.6) ? 'x\\left(' + h36_tex(h36_mul(F2, F3)) + '\\right)' : h36_tex(D);
    items = [{ c: Fr(A, 1), den: h36_tex(F1), mono: r1 === 0 }, { c: Fr(B, 1), den: h36_tex(F2) }, { c: Fr(C, 1), den: h36_tex(F3) }];
    fact = h36_fac(1, r1) + h36_fac(1, r2) + h36_fac(1, r3);
  } else {
    var s = pick([1, 2, 3]), t = nz(-5, 5);
    if (gcd(s, t) !== 1) return null;
    var F = [-t, s];
    D = h36_mul([0, 0, 1], F);
    N = h36_add(h36_add(h36_sc(h36_mul([0, 1], F), A), h36_sc(F, B)), [0, 0, C]);
    Dshow = h36_tex(D);
    items = [{ c: Fr(A, 1), den: 'x', mono: true }, { c: Fr(B, 1), den: 'x^{2}', mono: true }, { c: Fr(C, 1), den: h36_tex(F) }];
    fact = 'x^{2}' + h36_fac(s, t);
  }
  if (N.length === 1 && N[0] === 0) return null;
  return {
    q: '$y=\\dfrac{' + h36_tex(N) + '}{' + Dshow + '}$',
    a: 'Хуваарь $=' + fact + '$<br>$y=' + h36_sum('', items) + '$',
    key: '36p3:' + N.join(',') + '|' + D.join(',')
  };
}

// Зөв биш: P(x) + A/x + B/x² + C/(sx-t), хуваарь x²(sx-t)  (Дасгал 102г: (x⁵-1)/(2x³-x²))
function h36_pfX2Imp() {
  var s = pick([1, 1, 2]), t = nz(-5, 5);
  if (gcd(s, t) !== 1) return null;
  var A = rnd(-4, 4), B = nz(-4, 4), C = nz(-4, 4);
  var F = [-t, s], D = h36_mul([0, 0, 1], F);
  var R = h36_add(h36_add(h36_sc(h36_mul([0, 1], F), A), h36_sc(F, B)), [0, 0, C]);
  var P = Math.random() < 0.5 ? [rnd(-4, 4), nz(-3, 3)] : [rnd(-4, 4), rnd(-3, 3), pick([1, 1, 2, -1])];
  P = h36_trim(P);
  if (h36_deg(P) < 1) return null;
  var N = h36_add(h36_mul(P, D), R);
  var items = [{ c: Fr(A, 1), den: 'x', mono: true }, { c: Fr(B, 1), den: 'x^{2}', mono: true }, { c: Fr(C, 1), den: h36_tex(F) }];
  return {
    q: '$y=' + h36_ratTex(N, D) + '$',
    a: '$y=' + h36_tex(P) + '+' + h36_ratTex(R, D) + '$, хуваарь $=x^{2}' + h36_fac(s, t) + '$<br>$y='
      + h36_sum(h36_tex(P), items) + '$',
    key: '36px:' + N.join(',') + '|' + D.join(',')
  };
}

// (x²-a²)(x²+b²) хуваарьтай: A/(x-a)+B/(x+a)+(Cx+D)/(x²+b²)  (Жишээ 3, Дасгал 102е);
// (x-r)(x²+px+q) хуваарьтай, зөв биш байж болно  (Дасгал 102д)
function g_36_pf4() {
  if (Math.random() < 0.5) return h36_pfLinQuad();
  var a = rnd(1, 3), b = pick([a, a, 1, 2, 3]);
  var n2 = pick([0, 0, 0, 1, -1]), n1 = rnd(-6, 6), n0 = rnd(-6, 6);
  if (n2 === 0 && n1 === 0) return null;
  if (n1 === 0 && n0 === n2 * b * b) return null;           // x²+b²-тэй хураагдана
  var N = h36_trim([n0, n1, n2]);
  var Na = h36_ev(N, a), Nm = h36_ev(N, -a);
  if (Na === 0 && Nm === 0) return null;
  if ((Na === 0 || Nm === 0) && Math.random() < 0.6) return null;   // x+2 хураагдах тохиолдол (102е) цөөн
  var S = a * a + b * b, a2 = a * a, b2 = b * b;
  var A = Fr(Na, 2 * a * S), B = Fr(Nm, -2 * a * S), C = Fr(-n1, S), Dd = Fr(-(n0 - n2 * b2), S);
  var D = [-a2 * b2, 0, b2 - a2, 0, 1];
  var qd = 'x^{2}+' + b2;
  var head = h36_sum('', [{ c: A, den: 'x-' + a }, { c: B, den: 'x+' + a }]);
  if (head === '0') head = '';
  return {
    q: '$y=' + h36_ratTex(N, D) + '$',
    a: 'Хуваарь $=\\left(x-' + a + '\\right)\\left(x+' + a + '\\right)\\left(' + qd + '\\right)$<br>$y='
      + head + h36_tmQ(C, Dd, qd, head === '') + '$',
    key: '36p4:' + a + ',' + b + '|' + N.join(',')
  };
}

// (x-r)(x²+px+q):  [P(x) +] A/(x-r) + (Bx+C)/(x²+px+q)  (Дасгал 102д: (2x⁴-x³)/(x³+x²-x+2))
function h36_pfLinQuad() {
  var r = rnd(-4, 4), p = rnd(-3, 3), q = rnd(1, 6);
  if (p * p - 4 * q >= 0) return null;
  var A = nz(-4, 4), B = rnd(-3, 3), C = rnd(-4, 4);
  if (B === 0 && C === 0) return null;
  var Q = [q, p, 1], L = [-r, 1], D = h36_mul(L, Q);
  var R = h36_add(h36_sc(Q, A), h36_mul([C, B], L));
  var imp = Math.random() < 0.55, P = imp ? h36_trim([rnd(-4, 4), nz(-3, 3)]) : [0];
  var N = h36_add(h36_mul(P, D), R);
  if (N.some(function (z) { return Math.abs(z) > 60; })) return null;
  var qd = h36_tex(Q), fact = h36_fac(1, r) + '\\left(' + qd + '\\right)';
  var tail = h36_sum(imp ? h36_tex(P) : '', [{ c: Fr(A, 1), den: h36_tex(L), mono: r === 0 }]) + h36_tmQ(Fr(B, 1), Fr(C, 1), qd, false);
  return {
    q: '$y=' + h36_ratTex(N, D) + '$',
    a: (imp ? '$y=' + h36_tex(P) + '+' + h36_ratTex(R, D) + '$, х' : 'Х') + 'уваарь $=' + fact + '$<br>$y=' + tail + '$',
    key: '36pq:' + N.join(',') + '|' + D.join(',')
  };
}

// ════════════════════════════════════════════════════════════
// 4. y = q + k/(x-p) ХЭЛБЭР, ГРАФИК (Жишээ 5–9, Дасгал 103–106)
// ════════════════════════════════════════════════════════════

// q + k/(x-p) хэлбэрт шилжүүлж асимптот, төв
function g_36_toQK() {
  var a = pick([1, 1, 1, 2]), b, c, d, k;
  if (a === 1) {
    c = nz(-5, 5); b = nz(-6, 6); k = nz(-8, 8); d = k + c * b;
    if (Math.abs(d) > 24) return null;
  } else {
    b = pick([-7, -5, -3, -1, 1, 3, 5, 7]);
    var c2 = nz(-3, 3); c = 2 * c2; k = nz(-5, 5); d = 2 * k + b * c2;
    if (Math.abs(d) > 20) return null;
  }
  var o = h36_qk(c, d, a, b), P = fTex(o.p), Q = fTex(o.q);
  return {
    q: '$y=' + h36_ratTex([d, c], [b, a]) + '$',
    a: '$y=' + h36_qkTex(o) + '$<br>Асимптот: $x=' + P + '$, $y=' + Q + '$; төв $\\left(' + P + ';\\ ' + Q + '\\right)$',
    key: '36tq:' + a + ',' + b + ',' + c + ',' + d
  };
}

// Асимптот, тэнхлэгтэй огтлолцол → график тоймлох (Жишээ 8, Дасгал 103)
function g_36_sketch() {
  var a = pick([1, 1, 2]), b = rnd(-4, 4), c = rnd(-4, 4), d = rnd(-8, 8);
  if (!h36_ok(a, b, c, d)) return null;
  var o = h36_qk(c, d, a, b);
  if (Math.abs(fVal(o.p)) > 4 || Math.abs(fVal(o.q)) > 4) return null;
  var P = fTex(o.p), Q = fTex(o.q), cut;
  if (d === 0) cut = 'Координатын эх $\\left(0;\\ 0\\right)$ цэгийг дайрна';
  else cut = (c !== 0 ? '$Ox$-тэй $\\left(' + frTeX(-d, c) + ';\\ 0\\right)$' : '$Ox$-ийг огтлохгүй') + ', '
    + (b !== 0 ? '$Oy$-тэй $\\left(0;\\ ' + frTeX(d, b) + '\\right)$' : '$Oy$-ийг огтлохгүй');
  return {
    q: '$y=' + h36_ratTex([d, c], [b, a]) + '$',
    fig: plane({ blank: true, xr: 6 }),
    a: 'Асимптот: $x=' + P + '$, $y=' + Q + '$; төв $\\left(' + P + ';\\ ' + Q + '\\right)$<br>' + cut,
    key: '36sk:' + a + ',' + b + ',' + c + ',' + d
  };
}

// y=x+p ба y=-x+q шулуунуудын хувьд тэгш хэм (Жишээ 9)
function g_36_symLines() {
  var a = pick([1, 1, 1, 2]), b = nz(-5, 5), c = nz(-4, 4), d = rnd(-9, 9);
  if (!h36_ok(a, b, c, d)) return null;
  var o = h36_qk(c, d, a, b);
  var P = fSub(o.q, o.p), Q = fAdd(o.q, o.p);
  if (P.n === 0 || Q.n === 0) return null;
  var mul = Math.random() < 0.6, res = mul ? fMul(P, Q) : fAdd(P, Q);
  return {
    q: 'Хэрэв $y=' + h36_ratTex([d, c], [b, a]) + '$ функцийн график нь $y=x+p$ ба $y=-x+q$ шулуунуудын хувьд тэгш хэмтэй бол '
      + (mul ? '$p\\cdot q$ үржвэрийг' : '$p+q$ нийлбэрийг') + ' ол.',
    a: '$y=' + h36_qkTex(o) + '$, төв $\\left(' + fTex(o.p) + ';\\ ' + fTex(o.q) + '\\right)$ хоёр шулуун дээр оршино<br>$p=' + fTex(P) + '$, $q=' + fTex(Q) + '$; '
      + (mul ? '$p\\cdot q=' : '$p+q=') + fTex(res) + '$',
    key: '36sl:' + a + ',' + b + ',' + c + ',' + d + (mul ? '*' : '+')
  };
}

// Графикт тохирох функцийг сонгох (Дасгал 104)
function g_36_match() {
  var p = nz(-3, 3), q = nz(-3, 3), k = nz(-6, 6);
  var tru = [p, q, k];
  var opts = shuffle([tru].concat(shuffle([[p, q, -k], [-p, q, k], [p, -q, k], [-p, -q, -k]]).slice(0, 3)));
  var L = ['A', 'B', 'C', 'D'], ans = opts.indexOf(tru);
  function ft(o) { return '\\dfrac{' + h36_tex([o[2] - o[1] * o[0], o[1]]) + '}{' + h36_tex([-o[0], 1]) + '}'; }
  var txt = opts.map(function (o, i) { return L[i] + ') $y=' + ft(o) + '$'; });
  var fig = h36_hyp({ p: p, q: q, k: k, grid: true, u: 14,
    x0: Math.min(0, p) - 4, x1: Math.max(0, p) + 4, y0: Math.min(0, q) - 4, y1: Math.max(0, q) + 4 });
  return {
    q: txt[0] + '&emsp;' + txt[1] + '<br>' + txt[2] + '&emsp;' + txt[3],
    fig: fig,
    a: L[ans] + ') $y=' + ft(tru) + '=' + h36_qkTex({ p: Fr(p, 1), q: Fr(q, 1), k: Fr(k, 1) }) + '$: асимптот $x=' + p + '$, $y=' + q + '$',
    key: '36mt:' + p + ',' + q + ',' + k
  };
}

// Графикаас тогтмолуудыг олох (Дасгал 105, 106)
function g_36_fromGraph() {
  var xs, ys, fig, qq, aa, key, p, q, k, xl, yl, dots;
  if (Math.random() < 0.6) {                        // y = k/(x+a) + b
    p = nz(-4, 4); q = nz(-3, 3);
    var useX = Math.random() < 0.5;
    xl = [{ v: p, t: '' + p }]; yl = [{ v: q, t: '' + q }]; dots = []; xs = [0, p]; ys = [0, q];
    var sub;
    if (useX) {
      var x0 = nz(-5, 5);
      if (Math.abs(x0 - p) < 1) return null;
      k = -q * (x0 - p);
      xl.push({ v: x0, t: '' + x0 }); dots.push([x0, 0]); xs.push(x0);
      sub = '$\\left(' + x0 + ';\\ 0\\right)$ цэгийг дайрах тул $0=\\dfrac{k}{' + h36_tex([-p, 1]).replace('x', '' + paren(x0)) + '}' + (q > 0 ? '+' : '') + q + '$';
    } else {
      var y0 = nz(-5, 5);
      if (y0 === q) return null;
      k = -p * (y0 - q);
      yl.push({ v: y0, t: '' + y0 }); dots.push([0, y0]); ys.push(y0);
      sub = '$\\left(0;\\ ' + y0 + '\\right)$ цэгийг дайрах тул $' + y0 + '=' + (p === -1 ? 'k' : (p === 1 ? '-k' : '\\dfrac{k}{' + (-p) + '}')) + (q > 0 ? '+' : '') + q + '$';
    }
    if (Math.abs(k) > 12) return null;
    var A = -p, B = q;
    qq = 'Хэрэв $y=\\dfrac{k}{x+a}+b$ функцийн график зурагт өгсөн бол $a$, $b$, $k$ тогтмол тоонуудын нийлбэрийг ол.';
    aa = 'Асимптот $x=' + p + '$ тул $a=' + A + '$, $y=' + q + '$ тул $b=' + B + '$<br>' + sub + ', $k=' + k + '$<br>$a+b+k=' + (A + B + k) + '$';
    key = '36fgA:' + p + ',' + q + ',' + k + (useX ? 'x' : 'y');
  } else {                                          // y = (bx+c)/(ax-1)
    var a = pick([1, 2, 2, 3, -2, -1]);
    q = nz(-3, 3);
    var yi = nz(-4, 4);
    if (yi === q) return null;
    var b = q * a, c = -yi;
    p = 1 / a; k = (q - yi) / a;
    var pt = a === 1 ? '1' : (a === -1 ? '-1' : (a > 0 ? '1/' + a : '-1/' + (-a)));
    xl = [{ v: p, t: pt, up: a < 0 }]; yl = [{ v: q, t: '' + q }, { v: yi, t: '' + yi }]; dots = [[0, yi]];
    xs = [0, p]; ys = [0, q, yi];
    qq = 'Хэрэв $y=\\dfrac{bx+c}{ax-1}$ функцийн график зурагт өгсөн бол $a$, $b$, $c$ тогтмол тоонуудын нийлбэрийг ол.';
    aa = 'Босоо асимптот $x=\\dfrac{1}{a}=' + frTeX(1, a) + '$ тул $a=' + a + '$; хэвтээ асимптот $y=\\dfrac{b}{a}=' + q + '$ тул $b=' + b + '$<br>'
      + '$x=0$ үед $y=-c=' + yi + '$ тул $c=' + c + '$; $a+b+c=' + (a + b + c) + '$';
    key = '36fgB:' + a + ',' + q + ',' + yi;
  }
  var X0 = Math.floor(Math.min.apply(null, xs)) - 2, X1 = Math.ceil(Math.max.apply(null, xs)) + 3;
  var Y0 = Math.floor(Math.min.apply(null, ys)) - 3, Y1 = Math.ceil(Math.max.apply(null, ys)) + 3;
  // хоёр салбар хоёулаа цонхонд харагдах ёстой (сурах бичгийн зураг 3.28, 3.29 шиг)
  var up = Y1 - q - 0.6, dn = q - Y0 - 0.6, K = Math.abs(k);
  X0 = Math.min(X0, Math.floor(p - K / (k > 0 ? dn : up) - 1));
  X1 = Math.max(X1, Math.ceil(p + K / (k > 0 ? up : dn) + 1));
  if (X1 - X0 > 16 || Y1 - Y0 > 16) return null;
  var u = Math.max(11, Math.min(16, Math.floor(185 / Math.max(X1 - X0, Y1 - Y0))));
  fig = h36_hyp({ p: p, q: q, k: k, grid: false, u: u, x0: X0, x1: X1, y0: Y0, y1: Y1, xl: xl, yl: yl, dots: dots });
  return { q: qq, fig: fig, a: aa, key: key };
}

// f^{-1}(x)-ийг олох
function g_36_inv() {
  var a = pick([1, 1, 2, 3]), b = rnd(-6, 6), c = rnd(-5, 5), d = rnd(-7, 7);
  if (!h36_ok(a, b, c, d)) return null;

  var f = h36_ratTex([d, c], [b, a]);
  return {
    q: '$f(x)=' + f + '$',
    a: '$y=' + f + '$-аас $x=\\dfrac{' + h36_tex([d, -b], 'y') + '}{' + h36_tex([-c, a], 'y') + '}$<br>$f^{-1}(x)=' + h36_ratTex([d, -b], [-c, a]) + '$',
    key: '36iv:' + a + ',' + b + ',' + c + ',' + d
  };
}

// f^{-1}(g(a)) = m  (Жишээ 12)
function g_36_invComp() {
  var v = nz(-5, 5), m = rnd(-4, 4), b = rnd(-4, 4), c = nz(-4, 4);
  if (m + b === 0 || v === c) return null;
  var d = v * (m + b) - c * m;
  if (Math.abs(d) > 15) return null;
  var t = rnd(-4, 4), e = rnd(-4, 4), gm = nz(-4, 4);
  if (t + e === 0 || v === gm) return null;
  var dl = v * (t + e) - gm * t;
  if (Math.abs(dl) > 15) return null;
  var Fo = h36_ratTex([d, c], [b, 1]), Go = h36_ratTex([dl, gm], [e, 1]);
  var Ga = '\\dfrac{' + h36_tex([dl, gm], 'a') + '}{' + h36_tex([e, 1], 'a') + '}';
  var sw = Math.random() < 0.5;                    // sw: g^{-1}(f(a))=m
  var F = sw ? Go : Fo, G = sw ? Fo : Go;
  var cond = sw ? 'g^{-1}\\left(f(a)\\right)=' + m : 'f^{-1}\\left(g(a)\\right)=' + m;
  var step = sw ? 'f(a)=g(' + m + ')' : 'g(a)=f(' + m + ')';
  return {
    q: 'Хэрэв $f(x)=' + F + '$, $g(x)=' + G + '$ функцийн урвуу нь харгалзан $f^{-1}(x)$, $g^{-1}(x)$ бол $' + cond + '$ байх $a$ тоог ол.',
    a: '$' + step + '=' + v + '$<br>$' + Ga + '=' + v + '$, $a=' + t + '$',
    key: '36ic:' + [v, m, b, c, t, e, gm, sw ? 1 : 0].join(',')
  };
}

// g(f(x))=x бол g(m);  f^{-1}(f(f^{-1}(m)))  (Дасгал 112, 113)
function g_36_invEval() {
  var a = pick([1, 1, 2, 3]), b = rnd(-5, 5), c = rnd(-5, 5), d = rnd(-6, 6);
  if (!h36_ok(a, b, c, d)) return null;
  var m = rnd(-5, 5);

         : 'Хэрэв $f(x)=' + F + '$ функцийн урвуу функц нь $f^{-1}(x)$ бол $f^{-1}\\left(f\\left(f^{-1}(' + m + ')\\right)\\right)$ утгыг ол.',
    a: (v ? '$g=f^{-1}$ тул $g(' + m + ')=f^{-1}(' + m + ')$' : '$f\\left(f^{-1}(t)\\right)=t$ тул илэрхийлэл $=f^{-1}(' + m + ')$')
      + '<br>$' + F + '=' + m + '$-аас $x=' + fTex(res) + '$',
    key: '36ie:' + [a, b, c, d, m, v ? 1 : 0].join(',')
  };
}

// f(x)=(ax+b)/(kx+c), урвуу нь өгөгдсөн → a, b, c  (Дасгал 111)
function g_36_invCoef() {
  var k = pick([1, 2, 2, 3]), a = nz(-5, 5), b = nz(-6, 6), c = nz(-5, 5);
  if (a * c - b * k === 0 || gcd(gcd(a, b), gcd(k, c)) !== 1) return null;
  var kx = k === 1 ? 'x' : k + 'x';
  return {
    q: 'Хэрэв $f(x)=\\dfrac{ax+b}{' + kx + '+c}$ функцийн урвуу функц нь $f^{-1}(x)=' + h36_ratTex([b, -c], [-a, k]) + '$ бол $a$, $b$, $c$ тогтмол тоонуудыг ол.',
    a: '$f^{-1}(x)=\\dfrac{-cx+b}{' + kx + '-a}$ тул<br>$a=' + a + '$, $b=' + b + '$, $c=' + c + '$',

  };
}

// f⁻¹=f чанар: Дасгал 114 (тогтмол олох) ба Дасгал 115 (f(f(x)) агуулсан тэгшитгэл)
function g_36_selfInv() { return Math.random() < 0.5 ? h36_si114() : h36_fe115(); }

// D={x | x>-a} дээрх f(x)=(b-ax)/(x+a) (f∘f=x), f(f(x))=h(x)  (Дасгал 115)
function h36_fe115() {
  var a = nz(-3, 3), b = nz(-6, 6), K = b + a * a;
  if (K <= 0) return null;
  var A = Math.abs(a), ax = (A === 1 ? '' : A) + 'x';
  var num = b + (a > 0 ? '-' : '+') + ax, den = a > 0 ? a + '+x' : 'x-' + A;
  var F = '\\dfrac{' + num + '}{' + den + '}', rhs, eq, roots, key;
  if (Math.random() < 0.45) {                      // h(x)=n²/x  →  x²=n²
    var n = rnd(1, 5);
    if (!(n > -a && n >= a)) return null;
    rhs = '\\dfrac{' + n * n + '}{x}';
    eq = 'x^{2}=' + n * n; roots = [n, -n]; key = 'R0,' + n * n;   // түлхүүр h(x)-ээр: B хувилбарын s=0 тохиолдолтой давхцахгүй
  } else {                                         // h(x)=(sx+m)/x  →  x²-sx-m=0
    var r1 = nz(-6, 6), r2 = nz(-6, 6);
    if (r1 === r2 || !(r1 > -a) || r2 > -a) return null;
    var s = r1 + r2, m = -r1 * r2;
    rhs = h36_ratTex([m, s], [0, 1]);
    eq = h36_tex([-m, -s, 1]) + '=0'; roots = [r1, r2]; key = 'R' + s + ',' + m;
  }
  return {
    q: '$D=\\left\\{x\\mid x\\gt ' + (-a) + '\\right\\}$ олонлог дээр тодорхойлогдсон $f(x)=' + F + '$ функцийн хувьд $f\\left(' + F + '\\right)=' + rhs + '$ нөхцөлийг хангах $x$-ийн утгыг ол.',
    a: '$f\\left(f(x)\\right)=' + (K === 1 ? '' : '\\dfrac{' + K + 'x}{' + K + '}=') + 'x$ тул $x=' + rhs + '$, $' + eq + '$<br>$x=' + roots[0] + '$ эсвэл $x=' + roots[1] + '$; $x\\gt ' + (-a) + '$ тул $x=' + roots[0] + '$',
    key: '36fe:' + a + ',' + b + ',' + key
  };
}

// f^{-1}=f, цэг дайрна → b-a, a+b, ab  (Дасгал 114)
function h36_si114() {
  var e = nz(-4, 4), x0 = rnd(-4, 4), y0 = rnd(-5, 5);
  if (x0 + e === 0) return null;
  var a = -e, b = y0 * (x0 + e) - a * x0;
  if (a * e - b === 0 || Math.abs(b) > 25) return null;
  var ask = pick(['b-a', 'a+b', 'ab']);
  var res = ask === 'b-a' ? b - a : (ask === 'a+b' ? a + b : a * b);
  var askT = ask === 'ab' ? 'a\\cdot b' : ask;
  return {
    q: 'Хэрэв $f(x)=\\dfrac{ax+b}{' + h36_tex([e, 1]) + '}$ функцийн график нь $\\left(' + x0 + ';\\ ' + y0 + '\\right)$ цэгийг дайрдаг ба $f^{-1}(x)=f(x)$ бол $' + askT + '$ утгыг ол.',
    a: '$f^{-1}(x)=\\dfrac{' + h36_tex([0, -e]) + '+b}{x-a}$ ба $f^{-1}=f$ тул $a=' + a + '$<br>$f(' + x0 + ')=' + y0 + '$-аас $b=' + b + '$; $' + askT + '=' + res + '$',
    key: '36si:' + [e, x0, y0, ask].join(',')
  };
}

// y=(bx+c)/(x+a), асимптот ба цэг → a+b+c  (Дасгал 107)
function g_36_constAsym() {
  var p = nz(-5, 5), q = nz(-5, 5), x0 = rnd(-5, 5), y0 = rnd(-5, 5);
  if (x0 === p || y0 === q) return null;
  var a = -p, b = q, c = y0 * (x0 - p) - q * x0;

  return {
    q: 'Хэрэв $y=\\dfrac{bx+c}{x+a}$ функцийн график нь $\\left(' + x0 + ';\\ ' + y0 + '\\right)$ цэгийг дайрдаг, асимптот нь $x=' + p + '$, $y=' + q + '$ шулуунууд бол $a$, $b$, $c$ тогтмол тоонуудын нийлбэрийг ол.',
    a: '$a=' + a + '$, $b=' + b + '$; цэгийг орлуулбал $c=' + c + '$<br>$a+b+c=' + (a + b + c) + '$',
    key: '36ca:' + [p, q, x0, y0].join(',')
  };
}

// y=(ax+N)/(bx+c), бутархай асимптот ба цэг → a+b+c  (Дасгал 108)
function g_36_constAsym2() {
  var a = nz(-6, 6), b = nz(-6, 6), c = nz(-6, 6), N = nz(-9, 9);
  if (a * c - N * b === 0) return null;
  if (a % b === 0 && c % b === 0) return null;        // ядаж нэг асимптот бутархай
  var cand = [];
  for (var x = -3; x <= 3; x++) {
    var den = b * x + c; if (den === 0) continue;
    var num = a * x + N; if (num % den === 0) cand.push([x, num / den]);
  }
  if (!cand.length) return null;
  var P = pick(cand), pT = frTeX(-c, b), qT = frTeX(a, b);
  return {
    q: 'Хэрэв $y=\\dfrac{ax' + (N > 0 ? '+' : '-') + Math.abs(N) + '}{bx+c}$ функцийн график нь $\\left(' + P[0] + ';\\ ' + P[1] + '\\right)$ цэгийг дайрдаг, асимптот нь $x=' + pT + '$, $y=' + qT + '$ шулуунууд бол $a$, $b$, $c$ тогтмол тоонуудын нийлбэрийг ол.',
    a: '$\\dfrac{a}{b}=' + qT + '$, $-\\dfrac{c}{b}=' + pT + '$, цэгийг орлуулбал $b=' + b + '$<br>$a=' + a + '$, $b=' + b + '$, $c=' + c + '$; $a+b+c=' + (a + b + c) + '$',
    key: '36cb:' + [a, b, c, N, P[0]].join(',')
  };
}

// Хэрчим эсвэл |x|≥r дээрх хамгийн их, бага утга  (Дасгал 110)
function g_36_minmax() {
  var a = pick([1, 1, 2]), b = rnd(-5, 5), c = rnd(-4, 4), d = rnd(-8, 8);
  if (!h36_ok(a, b, c, d)) return null;
  var pv = -b / a, F = h36_ratTex([d, c], [b, a]);
  function f(x) { return Fr(c * x + d, a * x + b); }
  if (Math.random() < 0.55) {
    var m = rnd(-6, 5), n = m + rnd(2, 5);
    if (pv >= m && pv <= n) return null;
    var fm = f(m), fn = f(n), up = fVal(fm) > fVal(fn);
    return {
      q: 'Тодорхойлогдох муж нь $\\left[' + m + ';\\ ' + n + '\\right]$ хэрчим байх $f(x)=' + F + '$ функцийн хамгийн их ба хамгийн бага утгыг ол.',
      a: 'Хэрчим дээр монотон: $f(' + m + ')=' + fTex(fm) + '$, $f(' + n + ')=' + fTex(fn) + '$<br>$f_{\\max}=' + fTex(up ? fm : fn) + '$, $f_{\\min}=' + fTex(up ? fn : fm) + '$',
      key: '36mmA:' + [a, b, c, d, m, n].join(',')
    };
  }
  var r = rnd(2, 6);
  if (!(pv > -r && pv < r)) return null;
  var fr = f(r), fl = f(-r), hi = fVal(fr) > fVal(fl);
  return {
    q: 'Тодорхойлогдох муж нь $\\left|x\\right|\\geq ' + r + '$ байх $f(x)=' + F + '$ функцийн хамгийн их ба хамгийн бага утгын нийлбэрийг ол.',
    a: '$f(x)=' + h36_qkTex(h36_qk(c, d, a, b)) + '$ салбар бүр дээр монотон<br>$f_{\\max}=' + fTex(hi ? fr : fl) + '$, $f_{\\min}=' + fTex(hi ? fl : fr) + '$, нийлбэр $=' + fTex(fAdd(fr, fl)) + '$',
    key: '36mmB:' + [a, b, c, d, r].join(',')
  };
}

// Муж өгөгдөхөд дүр, дүр өгөгдөхөд муж  (Жишээ 10, Дасгал 109)
function g_36_rangeDom() {
  var a = pick([1, 1, 2]), b = rnd(-5, 5), c = nz(-4, 4), d = rnd(-8, 8);
  if (!h36_ok(a, b, c, d)) return null;
  var P = Fr(-b, a), pv = -b / a, pT = fTex(P), F = h36_ratTex([d, c], [b, a]);
  function f(x) { return Fr(c * x + d, a * x + b); }
  var L = Math.floor(pv) - rnd(1, 3), R = Math.ceil(pv) + rnd(1, 3);
  if (L === pv) L--; if (R === pv) R++;
  var fL = f(L), fR = f(R), lo = fVal(fL) < fVal(fR) ? fL : fR, hi = lo === fL ? fR : fL;
  if (lo.d > 12 || hi.d > 12) return null;
  if (Math.random() < 0.5) {
    return {
      q: 'Хэрэв $f(x)=' + F + '$ функцийн тодорхойлогдох муж нь $D=\\left\\{x\\mid ' + L + '\\leq x\\lt ' + pT + ',\\ ' + pT + '\\lt x\\leq ' + R + '\\right\\}$ бол дүрийг ол.',
      a: '$f(' + L + ')=' + fTex(fL) + '$, $f(' + R + ')=' + fTex(fR) + '$, $x=' + pT + '$ — босоо асимптот<br>$E=\\left]-\\infty;\\ ' + fTex(lo) + '\\right]\\cup\\left[' + fTex(hi) + ';\\ +\\infty\\right[$',
      key: '36rdA:' + [a, b, c, d, L, R].join(',')
    };
  }
  return {
    q: 'Хэрэв $f(x)=' + F + '$ функцийн дүр нь $I=\\left\\{y\\mid y\\leq ' + fTex(lo) + ',\\ y\\geq ' + fTex(hi) + '\\right\\}$ бол тодорхойлогдох мужийг ол.',
    a: '$f(x)=' + fTex(fL) + '$-аас $x=' + L + '$, $f(x)=' + fTex(fR) + '$-аас $x=' + R + '$<br>$D=\\left[' + L + ';\\ ' + pT + '\\right[\\cup\\left]' + pT + ';\\ ' + R + '\\right]$',
    key: '36rdB:' + [a, b, c, d, L, R].join(',')
  };
}

// Огтлолцлын хэрчмийн урт (Дасгал 116) ба төвөөс хамгийн бага зай (Дасгал 117)
function g_36_dist() {
  if (Math.random() < 0.5) {
    var p = rnd(-3, 3), q = rnd(-3, 3), Lh = rnd(2, 6), neg = Math.random() < 0.65, s, k, m, j;
    if (neg) { j = rnd(1, 3); s = pick([1, -1]) * (Lh + 2 * j); k = (s * s - Lh * Lh) / 4; m = s + p + q; }
    else { j = rnd(1, Lh - 1); s = Lh - 2 * j; k = (Lh * Lh - s * s) / 4; m = s - p + q; }
    if (k <= 0 || Math.abs(m) > 15) return null;
    var fy = '\\dfrac{k}{' + h36_tex([-p, 1]) + '}' + (q === 0 ? '' : (q > 0 ? '+' : '') + q);
    var line = (neg ? '-x' : 'x') + (m === 0 ? '' : (m > 0 ? '+' : '') + m);
    var tq = neg ? 't^{2}' + (s === 0 ? '' : (s > 0 ? '-' : '+') + (Math.abs(s) === 1 ? '' : Math.abs(s)) + 't') + '+k=0'
                 : 't^{2}' + (s === 0 ? '' : (s > 0 ? '+' : '-') + (Math.abs(s) === 1 ? '' : Math.abs(s)) + 't') + '-k=0';
    return {
      q: 'Хэрэв $y=' + fy + '$ функцийн график ба $y=' + line + '$ шулууны огтлолцлын цэгүүдийг $P$, $Q$ гэе. $PQ$ хэрчмийн урт нь $' + Lh + '\\sqrt{2}$ бол $k$ эерэг тоог ол.',
      a: '$t=' + h36_tex([-p, 1]) + '$ гэвэл $' + tq + '$, $PQ=\\sqrt{2}\\left|t_1-t_2\\right|$<br>$\\left(t_1-t_2\\right)^{2}=' + (Lh * Lh) + '$ тул $k=' + k + '$',
      key: '36dsA:' + [p, q, Lh, s, neg ? 1 : 0].join(',')
    };
  }
  var b = nz(-4, 4), c = nz(-3, 3), kk = nz(-8, 8), d = kk + b * c;
  if (Math.abs(d) > 14) return null;
  var o = h36_qk(c, d, 1, b), mm = 2 * Math.abs(kk);
  return {
    q: 'Координатын хавтгайд $P\\left(' + (-b) + ';\\ ' + c + '\\right)$ цэг өгөв. $Q$ нь $f(x)=' + h36_ratTex([d, c], [b, 1]) + '$ функцийн график дээр орших дурын цэг. $PQ$ хэрчмийн уртын хамгийн бага утгыг $m$ гэвэл $m^{2}$ утгыг ол.',
    a: '$f(x)=' + h36_qkTex(o) + '$ тул $P$ нь тэгш хэмийн төв<br>$t=' + h36_tex([b, 1]) + '$ гэвэл $PQ^{2}=t^{2}+\\dfrac{' + (kk * kk) + '}{t^{2}}\\geq ' + mm + '$ тул $m^{2}=' + mm + '$',
    key: '36dsB:' + [b, c, kk].join(',')
  };
}

// ── n/d·π-г TeX болгох ──
function h37_piTex(n, d) {

// градус (бүхэл) → радиан эсвэл градусын TeX
function h37_angTex(deg, rad) { return rad ? h37_piTex(deg, 180) : deg + '^{\\circ}'; }

// ════════════ Q(√2,√3) дахь яг утга: [r1, r2, r3, r6] (Fr) ════════════
function h37_Z() { return [Fr(0, 1), Fr(0, 1), Fr(0, 1), Fr(0, 1)]; }

// TeX: нийтлэг хуваарьтай нэг бутархай; tg=true бол √3/3 → 1/√3

  if (neg) T = T.map(function (t) { return { c: -t.c, r: t.r }; });

// sin-ийн утга хурц (0..90) өнцөгт

// ── Нэгж тойргийн хоосон зураг (өнцөг, цэг тэмдэглээгүй — хариу илчлэхгүй) ──

// РАДИАН ХЭМЖЭЭ (Жишээ 1, 2, 3; дасгал 119, 120, 121)

// Градус → радиан (Жишээ 1, дасгал 119)

}

// Радиан → градус (Жишээ 2, дасгал 120)
function g_37_radToDeg() {

function h37_rFor(d, hi) { return rnd(1, 10) <= 7 ? d * rnd(1, Math.max(1, Math.floor(hi / d))) : rnd(2, hi); }

// ════════════════════════════════════════════════════════════
// НЭГЖ ТОЙРОГ, ФУНКЦИЙН УТГА (дасгал 118; утгын хүснэгт)
// ════════════════════════════════════════════════════════════

// Хүснэгтийн утга: sin, cos, tg (радиан эсвэл градус). Сурах бичгийн cos-ийн [−π;π], tg-ийн (−π/2;π/2)

  else { deg = pick(h37_STD.concat([360])); rad = rnd(1, 20) <= 13; }

function h37_pt(deg) { return '$P\\left(' + h37_vTex(h37_val('c', deg)) + ',\\ ' + h37_vTex(h37_val('s', deg)) + '\\right)$'; }

// Нэгж тойрог дээрх цэгийн координат, 0 < α ≤ 360° (дасгал 118 а–в)
function g_37_unitPt() {

  return { q: '$\\alpha=' + h37_angTex(deg, rad) + '$', a: h37_pt(deg), key: '37u:' + deg, fig: h37_circ() };   // g_37_unitPtBig-тэй нийтлэг key → ижил өнцөг хуудсанд давхардахгүй
}

// α = 360°·k + β задлах

// Их ба сөрөг өнцөг: 450°, 600°, 1260°, −135°, 13π/6 … (дасгал 118 г)

  else if (m <= 7) { if (b === 0) return null; deg = b - 360 * rnd(1, 2); }

// ════════════════════════════════════════════════════════════
// ТЭГШ, СОНДГОЙ ЧАНАР, ҮЕ, ТЭМДЭГ
// ════════════════════════════════════════════════════════════

// sin(−α)=−sin α, cos(−α)=cos α, tg(−α)=−tg α ба үе (2π, tg-д π)
function g_37_valNeg() {

  var per = f === 't' ? 180 : 360;
  if (rnd(1, 10) <= 5) deg = -(b + 360 * pick([0, 1, 1, 2])); else deg = b + 360 * rnd(1, 3);
  if (deg === 0) return null;
  var v = h37_val(f, deg); if (!v) return null;
  var X = Math.abs(deg), sg = (deg < 0 && f !== 'c') ? '-' : '', st = [];
  if (deg < 0) st.push(sg + h37_fx(f, X, rad));
  if (X >= per) st.push(sg + h37_fx(f, X % per, rad));
  st.push(h37_vTex(v, f === 't'));
  return { q: '$' + h37_fx(f, deg, rad) + '$', a: '$=' + st.join('=') + '$', key: '37v:' + f + deg };   // g_37_val-тэй нийтлэг key → нэг хуудсанд ижил бодлого гарахгүй
}

// Тэнхлэг дээр биш өнцөг
function h37_signAng() {
  if (rnd(1, 10) <= 6) { var d; do { d = 5 * rnd(-40, 140); } while (d % 90 === 0); return { v: d, tex: d + '^{\\circ}', neg: d < 0 }; }

// Илэрхийллийн тэмдэг (функцийн мөч дэх тэмдэг)

  for (var i = 0; i < k; i++) {
    var A = h37_signAng(), f = pick(['s', 'c', 't']);
    var r = ((A.v % 360) + 360) % 360, Q = Math.floor(r / 90) + 1;
    // ижил функц, үеэр ижил өнцөг (40° ба 400°; tg-д 180°-аар) давтагдвал f·f / f:f — тэмдэг нь урьдчилан мэдэгдэх тривиал

// Хэд хэдэн утгатай илэрхийлэл (сөрөг, их аргументтай)

var WSPEC={"title":"Логарифм функц-1","sub":"Тодорхойлогдох муж, адилтгал тэнцүү функц · III бүлэг · 12-р анги","rule":"<b>Санамж:</b> $f(x)=\\log_{a}x\\ (a\\gt 0,\\ a\\neq 1)$ функцийн тодорхойлогдох муж $]0;\\ +\\infty[$, утгын муж $\\mathbb{R}$. $y=\\log_{a}g(x)$ функц $g(x)\\gt 0$ үед тодорхойлогдоно. Хоёр функц адилтгал тэнцүү байхын тулд тодорхойлогдох муж нь ижил бөгөөд мужийн бүх цэгт утга нь тэнцүү байх ёстой.","ref":"","tasks":[{"label":"Функцийн тодорхойлогдох мужийг ол.","fn":"g_34_domLin","cap":6,"cols":2,"wk":12},{"label":"Функцийн тодорхойлогдох мужийг ол.","fn":"g_34_domQuad","cap":8,"cols":2,"wk":16},{"label":"Хоёр функц адилтгал тэнцүү юу? Хариултаа тайлбарла.","fn":"g_34_ident","cap":6,"cols":2,"wk":18}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);var solo=blocks[g].getAttribute('data-solo')==='1';if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(solo&&qs2.length===1){if(ql)ql.textContent='';map[qs2[i].getAttribute('data-k')]=gr+')';}else{if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk, solo:t.solo};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}

  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.solo?' data-solo="1"':'')+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'

    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p||t.solo){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.solo?null:t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
