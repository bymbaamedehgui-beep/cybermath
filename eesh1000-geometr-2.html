/* ЭЕШ 1000 — Геометр-2 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Тойрог ба олон өнцөгт; огторгуйн биет: призм, пирамид, конус, цилиндр, бөмбөрцөг.
   Эх: 1.26, 1.62, 4.81, 4.76, 1.25, 1.1, 4.98, 1.79, 1.94, 1.98, 4.55, 1.52, 1.96, 4.22, 1.97, 1.63, 2.93, 2.95, 2.98, 2.99, 4.52, 4.30, 4.79 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 1.26 */
var e1_26 = (function () {
// 26. R радиустай тойрогт багтсан гурвалжны суурийн өнцгүүд α, β → хажуу талууд 2R·sin β, 2R·sin α
//     (синусын теорем; эх: R=5, 45° ба 60° → 5√2 ба 5√3). Хариуг өсөх дарааллаар.
var p26_S = { 30: 1, 45: 2, 60: 3 };   // 2·sin α = √s
var p26_SIN = { 30: '\\dfrac{1}{2}', 45: '\\dfrac{\\sqrt{2}}{2}', 60: '\\dfrac{\\sqrt{3}}{2}' };
function p26() {
  var R = rnd(2, 10), pr = shuffle([30, 45, 60]).slice(0, 2), al = pr[0], be = pr[1];
  var s = [al, be].sort(function (x, y) { return x - y; }).map(function (t) { return rt(R, p26_S[t]); });
  // Бодолт (гар бичмэл): синусын теорем a/sin α = 2R → хажуу тал = 2R·(эсрэг орших суурийн өнцгийн синус).
  // Зураг: R = 1 тойрог, AB суурь доор; AB нумын төв өнцөг 2γ, BC нум 2α.
  var gm = 180 - al - be, aA = 270 - gm, aB = 270 + gm, aC = 270 + gm + 2 * al;
  var pt26 = function (d) { return [Math.cos(d * Math.PI / 180), Math.sin(d * Math.PI / 180)]; };
  var A = pt26(aA), B = pt26(aB), C = pt26(aC), f = Fig({ w: 150, pad: 20 });
  // 30°-ын өнцгийн нум/бичгийг томруулж бичиг хажуу талд хүрэхгүй байлгана
  var arc = function (d) { return d === 30 ? { r: 19, loff: 9 } : { r: 15, loff: 0 }; };
  f.circle([0, 0], 1, { c: '#8a8a8a', w: 1.1 }).poly([A, B, C])
    .angle(A, B, C, { r: arc(al).r, loff: arc(al).loff, label: al + '°', size: 11 }).angle(B, C, A, { r: arc(be).r, loff: arc(be).loff, label: be + '°', size: 11 })
    .text(A, 'A', { pos: aA }).text(B, 'B', { pos: aB }).text(C, 'C', { pos: aC });
  // Хажуу талын бичиг: хөвч ба нумын зай их (эсрэг өнцөг 60°, ≈0.5R) бол хөвчийн дунд цэгийн гадна талд, бусад үед тойргийн гадна
  var sideLab = function (P, Q, mid, half, nm) {   // mid — нумын дунд цэгийн чиглэл (°), half — нумын хагас = эсрэг өнцөг
    if (half >= 60) f.text([(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2], nm, { pos: mid, size: 12 });
    else f.text(pt26(mid), nm, { pos: mid, size: 12 });
  };
  sideLab(B, C, (aB + aC) / 2, al, 'a');
  sideLab(A, C, (aA + aC + 360) / 2, be, 'b');
  var side = function (nm, ang) { return nm + '&=2R\\sin ' + ang + DEG + '=2\\cdot ' + R + '\\cdot ' + p26_SIN[ang] + '=' + rt(R, p26_S[ang]); };
  return {
    q: R + ' радиустай тойрогт багтсан гурвалжны суурийн өнцгүүд $' + al + DEG + '$ ба $' + be + DEG + '$ байв. Энэ гурвалжны хажуу талуудын урт хэд вэ?',
    a: '$' + s[0] + '$ ба $' + s[1] + '$', wk: 28,
    s: [
      'Гурвалжны суурь $AB$, $\\angle A=' + al + DEG + '$, $\\angle B=' + be + DEG + '$ гэе. Хажуу талууд $a=BC$, $b=AC$ нь $A$, $B$ өнцгүүдийн эсрэг оршино.',
      'Синусын теоремоор $\\dfrac{a}{\\sin A}=\\dfrac{b}{\\sin B}=2R$ тул $$\\begin{aligned}' + side('a', al) + ',\\\\ ' + side('b', be) + '.\\end{aligned}$$'
    ],
    sfig: f.svg(),
    t: { R: R, al: al, be: be }
  };
}
return p26;
})();

/* 1.62 */
var e1_62 = (function () {
// 62. R радиустай тойрогт багтсан тэгш өнцөгт гурвалжин: гипотенуз = 2R, a + b = P − 2R = √m.
//     (a + b)² = a² + b² + 2ab = 4R² + 4S ⇒ S = (m − 4R²)/4;  4R² < m ≤ 8R² (катетууд бодит).
function p62() {
  var R = pick([1, 2, 2, 3, 3]), m = rnd(4 * R * R + 1, 8 * R * R), s = surd(m);
  if (s.r === 1) return null;                     // периметр иррационал байх
  // Бодолт (гар бичмэл): гипотенуз AB = 2R (диаметр); a + b = P − 2R = √m, a² + b² = 4R²; (a + b)² = a² + b² + 2ab ⇒ ab ⇒ S = ab/2.
  //   Зураг: тойрог, AB диаметр, C тойрог дээр (катетуудын жинхэнэ харьцаагаар, хэт нарийн бол ∠A ≥ 20°).
  var Q = 4 * R * R, m4 = m - Q, la = (Math.sqrt(m) + Math.sqrt(Math.max(0, 2 * Q - m))) / 2, lb = Math.sqrt(m) - la;
  var th = Math.max(Math.atan2(lb, la), 20 * Math.PI / 180), thd = th * 180 / Math.PI;
  var A1 = [-1, 0], B1 = [1, 0], C1 = [Math.cos(2 * th), Math.sin(2 * th)], g = Fig({ w: 180, pad: 16 });
  g.circle([0, 0], 1).poly([A1, B1, C1], { w: 1.5 }).right(C1, A1, B1, { s: 7 }).dot([0, 0], { r: 2 })
    .text(A1, 'A', { pos: 'w' }).text(B1, 'B', { pos: 'e' }).text(C1, 'C', { pos: 2 * thd })
    // «a» — AC-ийн гадна (нум хол), «b» — BC-ийн дотор тал (BC богино үед нум ойрхон тул гурвалжин дотор)
    .text([(A1[0] + C1[0]) / 2, C1[1] / 2], 'a', { pos: thd + 90 }).text([(B1[0] + C1[0]) / 2, C1[1] / 2], 'b', { pos: thd + 180 })
    .text([0, 0], String(2 * R), { pos: 's', size: 12 });
  return {
    q: '$' + R + '$ радиустай тойрогт багтсан тэгш өнцөгт гурвалжны периметр $' + (2 * R) + '+' + s.tex + '$ бол гурвалжны талбайг олоорой.',
    a: '$S=' + fr(m - 4 * R * R, 4) + '$',
    wk: 28,
    s: [
      'Тойрогт багтсан тэгш өнцөгт гурвалжны гипотенуз нь диаметр болно: <span class="nw">$AB=2R=' + 2 * R + '$</span>. Катетуудыг $AC=a$, $BC=b$ гэвэл $$a+b=P-AB=' + s.tex
        + ',\\qquad a^2+b^2=AB^2=' + Q + '$$',
      '$(a+b)^2=a^2+b^2+2ab$ тул $$(' + s.tex + ')^2=' + Q + '+2ab\\Rightarrow 2ab=' + m + '-' + Q + '=' + m4 + '\\Rightarrow ab=' + fr(m4, 2) + '$$',
      'Иймд $S=\\dfrac{ab}{2}=' + fr(m4, 4) + '$.'
    ],
    sfig: g.svg(),
    t: { R: R }
  };
}
return p62;
})();

/* 4.81 */
var e4_81 = (function () {
// 81. Гурвалжны XY тал ба түүний эсрэг орших Z өнцөг өгөгдөв, O — багтсан тойргийн төв. XO, YO нь биссектрис тул
//     ∠XOY = 180° − (∠X + ∠Y)/2 = 90° + ∠Z/2 ⇒ O, X, Y-г дайрсан тойргийн радиус R = XY/(2 sin∠XOY) = XY/(2 cos(Z/2)):
//     Z = 60° ⇒ R = XY/√3;  Z = 90° ⇒ R = XY/√2;  Z = 120° ⇒ R = XY.  XY = k√r (r ∈ {1, 2, 3}); R² = k²r/D ⇒ хялбарчилсан язгуур.
var p81_V = [['A', 'C', 'B'], ['A', 'B', 'C'], ['B', 'C', 'A']];
function p81() {
  var V = rnd(1, 10) <= 6 ? p81_V[0] : pick(p81_V), Z = pick([60, 60, 60, 90, 90, 120]), D = Z === 60 ? 3 : Z === 90 ? 2 : 1;
  var k, r = 1, w = rnd(1, 4);
  if (Z === 60) { if (w === 1) { r = 3; k = rnd(2, 12); } else k = rnd(1, 10) <= 7 ? 3 * rnd(1, 12) : rnd(2, 20); }
  else if (Z === 90) { if (w === 1) { r = 2; k = rnd(2, 12); } else k = rnd(1, 10) <= 7 ? 2 * rnd(1, 15) : 2 * rnd(1, 9) + 1; }
  else if (w === 1) { r = pick([2, 3]); k = rnd(2, 10); } else k = rnd(3, 25);
  // R = √(k²r/D) = √(k²rD)/D
  var s = surd(k * k * r * D), g = gcd(s.k, D), sk = s.k / g, sd = D / g;
  var R = s.r === 1 ? fr(s.k, D) : sd === 1 ? rt(sk, s.r) : '\\dfrac{' + rt(sk, s.r) + '}{' + sd + '}';
  var u = pick(['м', 'м', 'см']);
  return {
    q: '$ABC$ гурвалжны $' + V[0] + V[1] + '$ талын урт $' + rt(k, r) + '$ ' + u + ' ба $' + V[2] + '$ өнцөг нь $' + Z + '^\\circ$ болно. $O$ нь энэ гурвалжинд'
      + ' багтсан тойргийн төв бол $O,' + V[0] + ',' + V[1] + '$ цэгийг дайрсан тойргийн радиусыг олоорой.',
    a: '$R=' + R + '$ ' + u,
    wk: 28,
    t: { Z: Z, k: k, r: r }
  };
}
return p81;
})();

/* 4.76 */
var e4_76 = (function () {
// 76. ABCD квадрат (заримдаа тэгш өнцөгт) — оройнууд, талуудын дундаж цэгүүд, төвөөс 3 цэг (нэг шулуун дээр биш) сонгож,
//     тэдгээрийг дайрсан тойргийн радиус R = abc/(4S)-ийг координатаар (давхарласан бүхэл координат, яг бутархай R²) олно.
//     Ихэнхдээ эх шиг «нэг талын дундаж, төв, нэг орой»; R² = N/D ⇒ R = k√r/d хялбарчилсан.
//     Жагсаалтын сүүлийн нэрийг заахын тийн ялгалтай (оройг, төвийг, дундаж цэгийг) бичнэ.
var p76_V = ['A', 'B', 'C', 'D'], p76_S = ['AB', 'BC', 'CD', 'DA'];
function p76_pts(a, b) {   // давхарласан координат: A(0;0), B(2a;0), C(2a;2b), D(0;2b), талын дундаж, төв O(a;b)
  var P = { A: [0, 0], B: [2 * a, 0], C: [2 * a, 2 * b], D: [0, 2 * b], O: [a, b] };
  p76_S.forEach(function (s) { var u = P[s[0]], v = P[s[1]]; P[s] = [(u[0] + v[0]) / 2, (u[1] + v[1]) / 2]; });
  return P;
}
function p76() {
  var sq = rnd(0, 3) > 0, a = pick([2, 4, 4, 6, 6, 8, 8, 10, 12, 3, 5, 9]), b = sq ? a : pick([2, 3, 4, 5, 6, 8, 10, 12]), names;
  if (!sq && (a === b || Math.max(a, b) > 2.2 * Math.min(a, b))) return null;
  if (rnd(0, 9) < 5) names = [pick(p76_S), 'O', pick(p76_V)];          // эх шиг: дундаж, төв, орой
  else {
    names = shuffle(p76_V.concat(p76_S, ['O'])).slice(0, 3);
    if (names.every(function (n) { return n.length === 1 && n !== 'O'; }) && rnd(0, 3)) return null;   // 3 орой цөөн
    if (names.every(function (n) { return n.length === 2; }) && rnd(0, 3)) return null;                // 3 дундаж цэг цөөн
  }
  names.sort(function (x, y) { var X = p76_S.concat(p76_V).indexOf(x), Y = p76_S.concat(p76_V).indexOf(y); return X - Y; });   // AB, BC, … A, B, …
  var P = p76_pts(a, b), X = names.map(function (n) { return P[n]; });
  var cr = (X[1][0] - X[0][0]) * (X[2][1] - X[0][1]) - (X[1][1] - X[0][1]) * (X[2][0] - X[0][0]);
  if (!cr) return null;                                                     // нэг шулуун дээр
  var d2 = function (u, v) { return (u[0] - v[0]) * (u[0] - v[0]) + (u[1] - v[1]) * (u[1] - v[1]); };
  // R = abc/(2|cr|) ⇒ давхарласан координатад R₂² = d1·d2·d3/(4·cr²), R₂ = 2R ⇒ R² = d1·d2·d3/(16·cr²)
  var N = d2(X[0], X[1]) * d2(X[1], X[2]) * d2(X[2], X[0]), D = 16 * cr * cr, g = gcd(N, D);
  N /= g; D /= g;
  var u = surd(N * D), h = gcd(u.k, D), k = u.k / h, d = D / h;
  if (d > 4 || u.r > 80 || k > 40) return null;
  var R = u.r === 1 ? fr(k, d) : d === 1 ? rt(k, u.r) : '\\dfrac{' + rt(k, u.r) + '}{' + d + '}';
  // нэрс: дундаж цэгүүд, төв, оройнууд — сүүлийнх нь заахын тийн ялгалтай
  var fig = sq ? 'квадратын' : 'тэгш өнцөгтийн', mids = names.filter(function (n) { return n.length === 2; }), ver = names.filter(function (n) { return n.length === 1 && n !== 'O'; });
  var items = [], tx = function (L) { return L.map(function (n) { return '$' + n + '$'; }).join(', '); };
  if (mids.length) items.push(mids.length === 1 ? [tx(mids) + ' талын дундаж', tx(mids) + ' талын дундаж цэгийг'] : [tx(mids) + ' талуудын дундаж цэгүүд', tx(mids) + ' талуудын дундаж цэгүүдийг']);
  if (names.indexOf('O') >= 0) items.push(items.length ? [fig + ' төв', fig + ' төвийг'] : ['төв', 'төвийг']);   // эхэнд бол «квадратын» давтахгүй
  if (ver.length) items.push(ver.length === 1 ? [tx(ver) + ' орой', tx(ver) + ' оройг'] : [tx(ver) + ' оройнууд', tx(ver) + ' оройнуудыг']);
  var list = items.map(function (it, j) { return it[j === items.length - 1 ? 1 : 0]; }).join(', ');
  var head = sq ? '$' + a + '$ м талтай $ABCD$ квадратын ' : '$AB=' + a + '$ м, $BC=' + b + '$ м талуудтай $ABCD$ тэгш өнцөгтийн ';
  return {
    q: head + list + ' дайрсан тойргийн радиусыг олоорой.',
    a: '$R=' + R + '$ м',
    wk: 30,
    t: { a: a, b: b, names: names }
  };
}
return p76;
})();

/* 1.25 */
var e1_25 = (function () {
// 25. a, b суурьтай тойрог багтаасан адил хажуут трапец: хажуу тал (a+b)/2, h = √(ab), r = √(ab)/2
//     (эх: 9 ба 25 → r = 7.5). ab — бүтэн квадрат байх хосууд (a < b ≤ 64, b/a ≤ 16; 50 хос).
var p25_P = (function () {
  var o = [];
  for (var a = 2; a <= 64; a++) for (var b = a + 1; b <= Math.min(64, 16 * a); b++) { var h = Math.round(Math.sqrt(a * b)); if (h * h === a * b) o.push([a, b]); }
  return o;
})();
function p25() {
  var pr = pick(p25_P), a = pr[0], b = pr[1], h = Math.round(Math.sqrt(a * b));
  // Бодолт (гар бичмэлийн II арга): BC = a, AD = b; шүргэгч хэрчмүүд a/2, b/2 → AB = (a+b)/2, AH = (b−a)/2,
  //   BH = √(AB² − AH²) = h = 2r.  Зураг: A(0;0), D(b;0), B((b−a)/2;h), C((b+a)/2;h), H — B-гийн проекц.
  var AB = (a + b) / 2, AH = (b - a) / 2, A = [0, 0], D = [b, 0], B = [AH, h], C = [AH + a, h], H = [AH, 0], I = [b / 2, h / 2];
  // радиусыг CD хажуу талын шүргэлтийн цэг рүү (BH-тай давхцахгүй): n = (h; AH)/AB — CD-д перпендикуляр нэгж вектор
  var nx = h / AB, ny = AH / AB, T = [I[0] + nx * h / 2, I[1] + ny * h / 2], th = Math.atan2(ny, nx) * 180 / Math.PI;
  var g = Fig({ w: 200, h: 150 });
  g.poly([A, D, C, B]).circle(I, h / 2).seg(B, H, { dash: '4 3' }).right(H, B, D, { s: 6 })
    .dot(I, { r: 2 }).seg(I, T, { w: 1.1 }).text([(I[0] + T[0]) / 2, (I[1] + T[1]) / 2], 'r', { pos: th - 90, size: 12, off: 2 })
    .text(A, 'A', { pos: 'sw' }).text(B, 'B', { pos: 'nw' }).text(C, 'C', { pos: 'ne' }).text(D, 'D', { pos: 'se' }).text(H, 'H', { pos: 'se' })
    .text([AH / 2, h / 2], dec(AB), { pos: 'nw', size: 12 });
  // AH богино (AH < 0.16·AD: 25–36, 36–49, 49–64) бол A, H үсгүүдтэй шахагдана — тоог зөвхөн текстэд үлдээнэ
  if (AH >= 0.16 * b) g.text([AH / 2, 0], dec(AH), { pos: 's', size: 12 });
  return {
    q: a + ' ба ' + b + ' суурьтай тойрог багтаадаг адил хажуут трапецад багтсан тойргийн радиусыг ол.',
    a: '$r=' + dec(h / 2) + '$', wk: 28,
    s: [
      'Трапецийг $ABCD$ ($BC=' + a + '$, $AD=' + b + '$) гэе. Нэг цэгээс татсан шүргэгч хэрчмүүд тэнцүү бөгөөд трапец адил хажуут тул '
        + '$B$, $C$ оройгоос татсан шүргэгч хэрчим бүр $' + a + ':2=' + dec(a / 2) + '$, $A$, $D$ оройгоос татсан нь $' + b + ':2=' + dec(b / 2) + '$. '
        + 'Иймд $$AB=CD=' + dec(a / 2) + '+' + dec(b / 2) + '=' + dec(AB) + '.$$',
      '$B$ оройгоос $BH$ өндөр буулгавал $$AH=\\dfrac{AD-BC}{2}=\\dfrac{' + b + '-' + a + '}{2}=' + dec(AH) + '.$$',
      // квадратуудын ялгавар: (AB − AH)(AB + AH) = BC·AD — гараар бодоход хялбар
      '$ABH$ тэгш өнцөгт гурвалжинд Пифагорын теоремоор $$\\begin{aligned}BH&=\\sqrt{AB^2-AH^2}=\\sqrt{' + dec(AB) + '^2-' + dec(AH) + '^2}\\\\'
        + '&=\\sqrt{(' + dec(AB) + '-' + dec(AH) + ')(' + dec(AB) + '+' + dec(AH) + ')}=\\sqrt{' + a + '\\cdot ' + b + '}=' + h + '.\\end{aligned}$$',
      'Багтсан тойргийн диаметр трапецийн өндөртэй тэнцүү: $2r=BH=' + h + '$. Иймд $r=' + dec(h / 2) + '$.'
    ],
    sfig: g.svg(),
    t: { a: a, b: b }
  };
}
return p25;
})();

/* 1.1 */
var e1_1 = (function () {
// 1. Тойрог багтаасан тэгш өнцөгт трапец: r, AD − BC өгөгдсөн → периметр.
