<style>

  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}

  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}

  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}

  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:28mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}

<script>
// ══════════ g10core.js — 10-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ 10-р анги · VII БҮЛЭГ · ТОЙРОГ БА ОЛОН ӨНЦӨГТ — ЗӨВХӨН ХҮНД түвшин ══════════
// g10core.js-ийн дараа залгагдана. Сурах бичгийн 87-102 хуудсын агуулгаас гарахгүй:
// тойрогт багтсан өнцөг, багтсан/багтаасан олон өнцөгт, хөвч-шүргэгч-огтлогч,
// хоёр тойргийн харилцан байршил, цэгийн геометр байр.
// Асуулт (q) нь зөвхөн өгөгдөл; заавар нь plan-ийн label дотор.
// Хариулт бүр " Хариу: $...$, $...$." хэлбэрийн төгсгөлтэй (шалгагч үүнийг уншина).

// ────────── тоо/LaTeX туслах ──────────
function f1(v){return (+v).toFixed(1);}
function deg(v){return v+'^{\\circ}';}
function sgn2(b){return b>0?('+'+b):(b<0?('-'+(-b)):'');}
function linTex7(a,b){var s=(a===1?'x':(a===-1?'-x':a+'x'));return s+sgn2(b);}
function sqrtTex(N){var out=1,r=N,f;for(f=2;f*f<=r;f++){while(r%(f*f)===0){out*=f;r=r/(f*f);}}
 if(r===1)return ''+out;return (out===1?'':out)+'\\sqrt{'+r+'}';}
// n*sqrt(r)/d хэлбэрийг хамгийн энгийнээр бичнэ
function rdTex(n,d,r){
 if(r===undefined)r=1;
 var out=1,rr=r,f;
 for(f=2;f*f<=rr;f++){while(rr%(f*f)===0){out*=f;rr=rr/(f*f);}}
 n=n*out;r=rr;
 var g=gcd(n,d)||1;n=n/g;d=d/g;
 if(d<0){n=-n;d=-d;}
 if(r===1){if(d===1)return ''+n;return (n<0?'-':'')+'\\dfrac{'+Math.abs(n)+'}{'+d+'}';}
 var num=(n===1?'':(n===-1?'-':''+n))+'\\sqrt{'+r+'}';
 if(d===1)return num;
 return '\\dfrac{'+num+'}{'+d+'}';
}
function frT(n,d){return frTeX(n,d);}
function pw7(t){return String(t).charAt(0)==='-'?('\\bigl('+t+'\\bigr)'):t;}
// R радиустай тойрог дээрх бүхэл координаттай (x,y) хосууд: x^2+y^2=R^2
function legPairs(R){var o=[],x;for(x=1;x<R;x++){var y=isqrt(R*R-x*x);if(y!==null&&y>0)o.push([x,y]);}return o;}
// r катеттай, бүхэл гипотенузтай нөгөө катетуудын жагсаалт
function legsFor(r,mx){var o=[],l;for(l=1;l<=mx;l++){if(isqrt(r*r+l*l)!==null)o.push(l);}return o;}
// Герон гурвалжнууд (талбай бүхэл)
var HER7=[[3,4,5],[5,5,6],[5,5,8],[4,13,15],[13,14,15],[9,12,15],[6,8,10],[5,12,13],
 [10,13,13],[8,15,17],[11,13,20],[7,15,20],[6,25,29],[3,25,26],[13,20,21],[10,17,21],
 [7,24,25],[9,10,17],[12,17,25],[17,25,26],[17,25,28],[20,21,29],[11,25,30],[15,26,37],[16,25,39]];
function herArea(a,b,c){var P=(a+b+c)*(-a+b+c)*(a-b+c)*(a+b-c);if(P<=0)return null;var s=isqrt(P);if(s===null||s%4)return null;return s/4;}
var TRI7=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41],[12,35,37],[28,45,53],
 [11,60,61],[33,56,65],[16,63,65],[13,84,85],[36,77,85],[39,80,89],[65,72,97],[48,55,73]];
var RLIST7=[5,10,13,15,17,20,25,26,29,30,34,35,37,39,40,41,45,50,51,52,53,55,58,60,61,65,68,73,74,75,78,80,82,85];

// ────────── SVG туслах ──────────
var PC7='#7B52EE', SC7='#0ea5e9', GY7='#94a3b8', TX7='#334155';
function sv7(w,h,b,px){return '<svg viewBox="0 0 '+w+' '+h+'" width="'+px+'">'+b+'</svg>';}
function cir7(c,r,o){o=o||{};return '<circle cx="'+f1(c[0])+'" cy="'+f1(c[1])+'" r="'+f1(r)+'" fill="'+(o.f||'none')+'" stroke="'+(o.c||PC7)+'" stroke-width="'+(o.w||1.4)+'"'+(o.d?' stroke-dasharray="5 4"':'')+'/>';}
function ln7(a,b,o){o=o||{};return '<line x1="'+f1(a[0])+'" y1="'+f1(a[1])+'" x2="'+f1(b[0])+'" y2="'+f1(b[1])+'" stroke="'+(o.c||PC7)+'" stroke-width="'+(o.w||1.2)+'"'+(o.d?' stroke-dasharray="4 3"':'')+'/>';}
function dot7(p,o){o=o||{};return '<circle cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="'+(o.r||2.2)+'" fill="'+(o.c||TX7)+'"/>';}
function tx7(p,s,o){o=o||{};return '<text x="'+f1(p[0])+'" y="'+f1(p[1])+'" font-size="'+(o.fs||10)+'" fill="'+(o.c||TX7)+'" text-anchor="middle" font-style="italic">'+s+'</text>';}
function onC7(c,r,d){var t=d*Math.PI/180;return [c[0]+r*Math.cos(t),c[1]-r*Math.sin(t)];}
function labC7(c,r,d,e){var t=d*Math.PI/180;return [c[0]+(r+(e||11))*Math.cos(t),c[1]-(r+(e||11))*Math.sin(t)+3.5];}
function xsec7(a,b,c,d){
 var A1=b[1]-a[1],B1=a[0]-b[0],C1=A1*a[0]+B1*a[1];
 var A2=d[1]-c[1],B2=c[0]-d[0],C2=A2*c[0]+B2*c[1];
 var dt=A1*B2-A2*B1;if(Math.abs(dt)<1e-9)return [a[0],a[1]];
 return [(B2*C1-B1*C2)/dt,(A1*C2-A2*C1)/dt];
}
// тогтмол схем зурагууд (өгөгдлөөс хамаарахгүй тул хариу илчлэхгүй)
function figCycQuad(){
 var C=[95,95],R=62,dg=[132,212,300,25],P=[0,1,2,3].map(function(i){return onC7(C,R,dg[i]);});
 var X=xsec7(P[0],P[2],P[1],P[3]);
 var g=cir7(C,R,{});
 g+=ln7(P[0],P[2],{c:SC7})+ln7(P[1],P[3],{c:SC7});
 g+=ln7(P[0],P[1],{c:GY7})+ln7(P[1],P[2],{c:GY7})+ln7(P[2],P[3],{c:GY7})+ln7(P[3],P[0],{c:GY7});
 ['A','B','C','D'].forEach(function(L,i){g+=dot7(P[i])+tx7(labC7(C,R,dg[i],11),L);});
 g+=dot7(X,{r:2,c:'#b91c1c'})+tx7([X[0]+10,X[1]-5],'P',{c:'#b91c1c',fs:9});
 return sv7(190,190,g,178);
}
function figChords(){
 var C=[95,95],R=62,dg=[150,205,335,40],P=[0,1,2,3].map(function(i){return onC7(C,R,dg[i]);});
 var X=xsec7(P[0],P[2],P[1],P[3]);
 var g=cir7(C,R,{});
 g+=ln7(P[0],P[2],{c:SC7})+ln7(P[1],P[3],{c:SC7});
 g+=dot7(C,{r:2})+tx7([C[0]-9,C[1]+4],'O',{fs:9});
 ['A','B','C','D'].forEach(function(L,i){g+=dot7(P[i])+tx7(labC7(C,R,dg[i],11),L);});
 g+=dot7(X,{r:2,c:'#b91c1c'})+tx7([X[0]+9,X[1]-6],'P',{c:'#b91c1c',fs:9});
 return sv7(190,190,g,178);
}
function figBisect(){
 var C=[95,95],R=62,dgA=110,dgB=205,dgC=330,dgM=(205+330)/2;
 var A=onC7(C,R,dgA),B=onC7(C,R,dgB),Cp=onC7(C,R,dgC),M=onC7(C,R,dgM);
 var g=cir7(C,R,{});
 g+=ln7(A,B,{c:GY7})+ln7(B,Cp,{c:GY7})+ln7(Cp,A,{c:GY7});
 g+=ln7(A,M,{c:SC7})+ln7(B,M,{c:GY7})+ln7(Cp,M,{c:GY7});
 g+=dot7(A)+tx7(labC7(C,R,dgA,11),'A')+dot7(B)+tx7(labC7(C,R,dgB,11),'B');
 g+=dot7(Cp)+tx7(labC7(C,R,dgC,11),'C')+dot7(M)+tx7(labC7(C,R,dgM,11),'M');
 return sv7(190,190,g,178);
}

// A1. Нумуудын харьцаанаас багтсан дөрвөн өнцөгтийн өнцгүүд ба диагоналын өнцөг
function g_arcRatio4(){
 var t=0,k,s,last;
 for(;;){ if(++t>500)return null;
  k=[rnd(3,14),rnd(3,14),rnd(3,14)]; s=k[0]+k[1]+k[2]; last=36-s;
  if(last>=3&&last<=14){k.push(last);break;} }
 var A=[10*k[0],10*k[1],10*k[2],10*k[3]];
 var abc=(A[2]+A[3])/2, bcd=(A[3]+A[0])/2, apb=(A[0]+A[2])/2;
 var a='Нумуудын нийлбэр $'+deg(360)+'$, харьцааны нэг хэсэгт $\\dfrac{360^{\\circ}}{36}='+deg(10)+'$ ногдоно. '
  +'Иймд нум $AB='+deg(A[0])+'$, нум $BC='+deg(A[1])+'$, нум $CD='+deg(A[2])+'$, нум $DA='+deg(A[3])+'$. '
  +'Багтсан өнцөг тулсан нумынхаа хагастай тэнцүү тул $\\angle ABC=\\dfrac{'+A[2]+'^{\\circ}+'+A[3]+'^{\\circ}}{2}$, '
  +'$\\angle BCD=\\dfrac{'+A[3]+'^{\\circ}+'+A[0]+'^{\\circ}}{2}$. Огтлолцсон хөвчийн өнцөг нь тулсан хоёр нумын хагас нийлбэр тул '
  +'$\\angle APB=\\dfrac{'+A[0]+'^{\\circ}+'+A[2]+'^{\\circ}}{2}$. Шалгалт: $\\angle ABC+\\angle ADC=180^{\\circ}$. '
  +'Хариу: $\\angle ABC='+deg(abc)+'$, $\\angle BCD='+deg(bcd)+'$, $\\angle APB='+deg(apb)+'$.';
 return {q:'$'+k.join(':')+'$',a:a,fig:figCycQuad(),key:'ar4|'+k.join('-')};
}

// A2. Параметртэй: багтсан ба төв өнцөг
function g_incParamX(){
 for(var t=0;t<600;t++){
  var x=rnd(5,20), a=rnd(2,7), b=rnd(-25,25), ang=a*x+b;
  if(ang<18||ang>85)continue;
  var c=rnd(2,9); if(c===2*a)continue;
  var d=2*ang-c*x; if(Math.abs(d)>140||d===0)continue;
  var L=2*a-c, Rr=d-2*b;
  var ans='Багтсан өнцөг харгалзах төв өнцгийнхөө хагастай тэнцүү тул $2\\bigl('+linTex7(a,b)+'\\bigr)='+linTex7(c,d)+'$. '
   +'Эндээс $'+(2*a)+'x'+sgn2(2*b)+'='+linTex7(c,d)+'$ буюу $'+L+'x='+Rr+'$, $x='+x+'$. '
   +'Иймд $\\angle ABC='+a+' \\cdot '+x+sgn2(b)+'='+deg(ang)+'$, $\\angle AOC=2 \\cdot '+ang+'^{\\circ}='+deg(2*ang)+'$. '
   +'Хариу: $x='+x+'$, $\\angle ABC='+deg(ang)+'$, $\\angle AOC='+deg(2*ang)+'$.';
  return {q:'$\\angle ABC=\\bigl('+linTex7(a,b)+'\\bigr)^{\\circ},\\ \\angle AOC=\\bigl('+linTex7(c,d)+'\\bigr)^{\\circ}$',
   a:ans,key:'ipx|'+a+'|'+b+'|'+c+'|'+d};
 }
 return null;
}

// A3. Багтаасан тойргийн төвөөс үүсэх өнцгүүд
function g_ocenterAngles(){
 for(var t=0;t<400;t++){
  var al=rnd(12,55), be=rnd(12,55), z=90-al-be;
  if(z<12)continue;
  var ans='$OA=OB=OC=R$ тул $OAB$, $OBC$, $OCA$ гурвалжнууд адил хажуут: $\\angle OBA='+deg(al)+'$, $\\angle OCB='+deg(be)+'$, '
   +'$\\angle OCA=\\angle OAC=z$. $ABC$ гурвалжны өнцгийн нийлбэрээс $2\\bigl('+al+'^{\\circ}+'+be+'^{\\circ}+z\\bigr)=180^{\\circ}$, '
   +'иймд $z='+deg(z)+'$. Эндээс $\\angle ACB='+be+'^{\\circ}+'+z+'^{\\circ}$, $\\angle BAC='+al+'^{\\circ}+'+z+'^{\\circ}$, $\\angle ABC='+al+'^{\\circ}+'+be+'^{\\circ}$. '
   +'Хариу: $\\angle OCA='+deg(z)+'$, $\\angle ACB='+deg(be+z)+'$, $\\angle BAC='+deg(al+z)+'$, $\\angle ABC='+deg(al+be)+'$.';
  return {q:'$\\angle OAB='+deg(al)+',\\ \\angle OBC='+deg(be)+'$',a:ans,key:'oca|'+al+'|'+be};
 }
 return null;
}

// A4. Диаметрт тулсан багтсан өнцөг (тэгш өнцөгт гурвалжин)
function g_diamRight(){
 var T=pick(TRI7),m=rnd(1,3);
 var a=T[0]*m,b=T[1]*m,c=T[2]*m;
 if(rnd(0,1)){var q0=a;a=b;b=q0;}
 var S=a*b/2;
 var ans='$AB$ диаметр тул $\\angle ACB='+deg(90)+'$. Пифагорын теоремоор $BC=\\sqrt{'+c+'^{2}-'+b+'^{2}}=\\sqrt{'+(c*c-b*b)+'}='+a+'$. '
  +'Талбай $S=\\dfrac{'+a+' \\cdot '+b+'}{2}='+S+'$. Гипотенуз руу буусан өндөр $CH=\\dfrac{'+a+' \\cdot '+b+'}{'+c+'}$. '
  +'Багтаасан тойргийн радиус нь гипотенузын хагас: $R=\\dfrac{'+c+'}{2}$. '
  +'Хариу: $BC='+a+'$, $S='+S+'$, $CH='+frT(a*b,c)+'$, $R='+frT(c,2)+'$.';

}

// A5. Огтлолцсон хөвчийн үүсгэх өнцөг (урвуу)
function g_chordCross(){
 for(var t=0;t<400;t++){
  var m=2*rnd(10,72), cd=2*rnd(10,72);
  if(m+cd>320||m+cd<60)continue;
  var phi=(m+cd)/2;
  if(phi<35||phi>150)continue;
  var ans='$P$ нь $AC$ ба $BD$ хөвчүүдийн огтлолцлын цэг. Огтлолцсон хөвчийн үүсгэх өнцөг нь тулсан хоёр нумын хагас нийлбэртэй тэнцүү: '
   +'$\\angle APB=\\dfrac{\\angle AOB+\\angle COD}{2}$. Эндээс $\\angle COD=2 \\cdot '+phi+'^{\\circ}-'+m+'^{\\circ}$. '
   +'$\\angle ADB$ нь $AB$ нумд тулсан багтсан өнцөг тул $\\angle ADB=\\dfrac{'+m+'^{\\circ}}{2}$, мөн $\\angle BPC=180^{\\circ}-'+phi+'^{\\circ}$. '
   +'Хариу: $\\angle COD='+deg(cd)+'$, $\\angle ADB='+deg(m/2)+'$, $\\angle BPC='+deg(180-phi)+'$.';
  return {q:'$\\angle AOB='+deg(m)+',\\ \\angle APB='+deg(phi)+'$',a:ans,fig:figChords(),key:'cc|'+m+'|'+phi};
 }
 return null;
}

// A6. Биссектрисийн тойрогтой огтлолцол
function g_bisectorArc(){
 for(var t=0;t<400;t++){
  var al=2*rnd(14,44), be=rnd(25,110), ga=180-al-be;
  if(ga<25||be<25)continue;
  var ans='$\\angle ACB=180^{\\circ}-'+al+'^{\\circ}-'+be+'^{\\circ}='+deg(ga)+'$. $AM$ нь $\\angle BAC$-ийн биссектрис тул '
   +'$\\angle BAM=\\angle MAC='+deg(al/2)+'$, эндээс нум $BM=$ нум $MC='+deg(al)+'$. '
   +'$\\angle BCM$ нь $BM$ нумд тулсан тул $\\angle BCM=\\dfrac{'+al+'^{\\circ}}{2}$. '
   +'$B$ ба $M$ цэгүүд $AC$ хөвчийн нэг талд орших тул $\\angle AMC$, $\\angle ABC$ нь ижил нумд тулсан: $\\angle AMC=\\angle ABC='+deg(be)+'$. '
   +'$ABMC$ багтсан дөрвөн өнцөгт тул $\\angle BMC=180^{\\circ}-\\angle BAC$. '
   +'Хариу: $\\angle ACB='+deg(ga)+'$, $\\angle BCM='+deg(al/2)+'$, $\\angle AMC='+deg(be)+'$, $\\angle BMC='+deg(180-al)+'$.';
  return {q:'$\\angle BAC='+deg(al)+',\\ \\angle ABC='+deg(be)+'$',a:ans,fig:figBisect(),key:'ba|'+al+'|'+be};
 }

// A7. Тойрогт багтсан адил хажуут гурвалжны талбай
function g_isoInscribedArea(){
 var th=pick([60,90,120]), R=pick([2,3,4,5,6,8,10,12]);
 var ac,S,note;
 if(th===60){ac=rdTex(R,1,3);S=rdTex(3*R*R,4,3);
  note='$\\angle ABC='+deg(60)+'$ ба $AB=BC$ тул $ABC$ зөв гурвалжин. Нум $AC='+deg(120)+'$, төв өнцөг $\\angle AOC='+deg(120)+'$, эндээс $AC=R\\sqrt{3}$. Зөв гурвалжны талбай $S=\\dfrac{AC^{2}\\sqrt{3}}{4}=\\dfrac{3R^{2}\\sqrt{3}}{4}$.';}
 else if(th===90){ac=''+(2*R);S=''+(R*R);
  note='$\\angle ABC='+deg(90)+'$ тул $AC$ нь диаметр: $AC=2R$. $AB=BC$ учир $AB=BC=R\\sqrt{2}$, $S=\\dfrac{AB \\cdot BC}{2}=R^{2}$.';}
 else{ac=rdTex(R,1,3);S=rdTex(R*R,4,3);
  note='$\\angle ABC='+deg(120)+'$ тул $B$-г агуулаагүй нум $AC='+deg(240)+'$, үлдсэн нумууд $AB=BC='+deg(60)+'$, эндээс $AB=BC=R$ ба $\\angle AOC='+deg(120)+'$, $AC=R\\sqrt{3}$. $ABC$ гурвалжны $B$ орой дахь өндөр $\\dfrac{R}{2}$ тул $S=\\dfrac{AC \\cdot h}{2}=\\dfrac{R^{2}\\sqrt{3}}{4}$.';}
 var ans=note+' $R='+R+'$ орлуулбал үр дүн гарна. Хариу: $AC='+ac+'$, $S='+S+'$.';
 return {q:'$R='+R+',\\ \\angle ABC='+deg(th)+'$',a:ans,key:'iia|'+th+'|'+R};
}

// A8. Зөв n өнцөгтийн багтсан өнцгүүд
function g_regPolyAngles(){
 var n=pick([9,10,12,15,18,20,30,36]);
 var k=rnd(2,n-2), m=rnd(k+1,n);
 if(m<=k)return null;
 var al=360/n, be=(m-k)*180/n, ga=(n-m+1)*180/n;
 if(be<5||ga<5)return null;
 var ans='Зөв $'+n+'$ өнцөгтийн хөрш хоёр оройн хоорондох нум $\\dfrac{360^{\\circ}}{'+n+'}='+deg(al)+'$. '
  +'$\\beta=\\angle A_{'+k+'}A_{1}A_{'+m+'}$ нь $A_{'+k+'}A_{'+m+'}$ нумд тулсан багтсан өнцөг бөгөөд уг нум $'+(m-k)+'$ хэсгээс тогтоно: '
  +'$\\beta=\\dfrac{'+(m-k)+' \\cdot '+al+'^{\\circ}}{2}$. '
  +'$\\gamma=\\angle A_{1}A_{'+k+'}A_{'+m+'}$ нь $A_{'+m+'}$-аас $A_{1}$ хүртэлх, $A_{'+k+'}$-г агуулаагүй нумд тулах ба тэр нь $'+(n-m+1)+'$ хэсэгтэй: '
  +'$\\gamma=\\dfrac{'+(n-m+1)+' \\cdot '+al+'^{\\circ}}{2}$. '
  +'Хариу: $\\alpha='+deg(al)+'$, $\\beta='+deg(be)+'$, $\\gamma='+deg(ga)+'$.';
 return {q:'$n='+n+',\\ k='+k+',\\ m='+m+'$',a:ans,key:'rp|'+n+'|'+k+'|'+m};
}

// B1. Тэгш өнцөгт гурвалжин: гипотенуз ба багтсан тойргийн радиусаас катетууд (урвуу)
function g_rightTriFromInr(){
 var T=pick(TRI7),m=rnd(1,3);
 var a=T[0]*m,b=T[1]*m,c=T[2]*m;
 var r=(a+b-c)/2;
 if(r<=0||r!==Math.round(r))return null;
 var S=a*b/2, sum=a+b, pr=a*b;
 var ans='Тэгш өнцөгт гурвалжинд багтсан тойргийн радиус $r=\\dfrac{a+b-c}{2}$ тул $a+b=2r+c=2 \\cdot '+r+'+'+c+'='+sum+'$. '
  +'Пифагорын теоремоор $a^{2}+b^{2}='+c+'^{2}$, эндээс $2ab=\\bigl(a+b\\bigr)^{2}-\\bigl(a^{2}+b^{2}\\bigr)='+sum+'^{2}-'+c+'^{2}='+(sum*sum-c*c)+'$, $ab='+pr+'$. '
  +'$a$, $b$ нь $t^{2}-'+sum+'t+'+pr+'=0$ тэгшитгэлийн шийдүүд: дискриминант $D='+sum+'^{2}-4 \\cdot '+pr+'='+(sum*sum-4*pr)+'$, $\\sqrt{D}='+Math.abs(a-b)+'$. '
  +'Иймд $t=\\dfrac{'+sum+'\\pm '+Math.abs(a-b)+'}{2}$. Талбай $S=\\dfrac{ab}{2}$, багтаасан тойргийн радиус $R=\\dfrac{c}{2}$. '
  +'Хариу: $a='+Math.min(a,b)+'$, $b='+Math.max(a,b)+'$, $S='+S+'$, $R='+frT(c,2)+'$.';
 return {q:'$c='+c+',\\ r='+r+'$',a:ans,key:'rti|'+c+'|'+r};
}

// B2. Талуудаас талбай, багтсан ба багтаасан тойргийн радиус
function g_heronInr(){
 for(var t=0;t<60;t++){
  var T=pick(HER7),k=pick([1,1,1,2,3]);
  var a=T[0]*k,b=T[1]*k,c=T[2]*k;
  var S=herArea(a,b,c);
  if(S===null)continue;
  var P=a+b+c;
  var ans='Хагас периметр $p=\\dfrac{'+a+'+'+b+'+'+c+'}{2}='+frT(P,2)+'$. Геронын томьёогоор '
   +'$16S^{2}=\\bigl('+a+'+'+b+'+'+c+'\\bigr)\\bigl('+(-a+b+c)+'\\bigr)\\bigl('+(a-b+c)+'\\bigr)\\bigl('+(a+b-c)+'\\bigr)='+(16*S*S)+'$, эндээс $S='+S+'$. '
   +'Багтсан тойргийн радиус $S=p \\cdot r$-аас $r=\\dfrac{S}{p}=\\dfrac{2 \\cdot '+S+'}{'+P+'}$. '
   +'Багтаасан тойргийн радиус $R=\\dfrac{abc}{4S}=\\dfrac{'+a+' \\cdot '+b+' \\cdot '+c+'}{4 \\cdot '+S+'}$. '
   +'Хариу: $S='+S+'$, $r='+frT(2*S,P)+'$, $R='+frT(a*b*c,4*S)+'$.';
  return {q:'$a='+a+',\\ b='+b+',\\ c='+c+'$',a:ans,key:'her|'+a+'-'+b+'-'+c};
 }
 return null;
}

// B3. Тойрог багтаасан тэгш өнцөгт трапец
function g_tangTrapezoid(){
 for(var t=0;t<600;t++){
  var m=rnd(4,40), n=rnd(3,39);
  if(m<=n)continue;
  if((2*m*n)%(m+n))continue;
  var h=2*m*n/(m+n);
  if(h<3||h>=2*n)continue;
  var cd=m+n-h;
  if(cd<=m-n)continue;
  var S=(m+n)*h/2;
  var ans='$ABCD$ трапецад тойрог багтсан тул $AD+BC=AB+CD$, өөрөөр хэлбэл $CD='+m+'+'+n+'-h$. '
   +'Нөгөө талаас $AB\\perp AD$ учир $CD^{2}=h^{2}+\\bigl('+m+'-'+n+'\\bigr)^{2}$. Хоёуланг тэнцүүлбэл '
   +'$\\bigl('+(m+n)+'-h\\bigr)^{2}=h^{2}+'+((m-n)*(m-n))+'$, эндээс $4 \\cdot '+m+' \\cdot '+n+'=2h\\bigl('+m+'+'+n+'\\bigr)$ буюу $h=\\dfrac{2 \\cdot '+m+' \\cdot '+n+'}{'+(m+n)+'}='+h+'$. '
   +'Тойргийн радиус $r=\\dfrac{h}{2}$, хажуу тал $CD='+(m+n)+'-'+h+'$, талбай $S=\\dfrac{\\bigl('+m+'+'+n+'\\bigr)h}{2}$. '
   +'Хариу: $AB='+h+'$, $CD='+cd+'$, $r='+frT(h,2)+'$, $S='+frT((m+n)*h,2)+'$.';
  return {q:'$AD='+m+',\\ BC='+n+'$',a:ans,fig:figTangTrap(),key:'ttz|'+m+'|'+n};
 }
 return null;
}

// B4. Дөрвөн өнцөгт тойрогт багтах эсэх (тохиолдол ялгах)
function g_cyclicTest(){
 for(var t=0;t<400;t++){
  var A=rnd(40,140), B=rnd(40,140), C, D;

   +'Эндээс $'+(a1+a2)+'x'+sgn2(b1+b2)+'=180$, $'+(a1+a2)+'x='+(180-b1-b2)+'$, $x='+x+'$. '

  return {q:'$\\angle A=\\bigl('+linTex7(a1,b1)+'\\bigr)^{\\circ},\\ \\angle C=\\bigl('+linTex7(a2,b2)+'\\bigr)^{\\circ},\\ \\angle B:\\angle D='+p+':'+q+'$',

// B7. Тойрог багтаасан адил хажуут трапец
function g_isoTrapCirc(){
 for(var t=0;t<400;t++){

  if(L.length<2)continue;
  var i=rnd(0,L.length-1), j=rnd(0,L.length-1);
  if(i===j)continue;
  var x1=L[i][0], y1=L[i][1], x2=L[j][0], y2=L[j][1];
  if(x1===x2)continue;
  if(x1<x2){var sx=x1;x1=x2;x2=sx;var sy=y1;y1=y2;y2=sy;}
  var h=(rnd(0,1)? y1+y2 : Math.abs(y1-y2));
  if(h<2)continue;
  var qq=2*x1, pp=2*x2;
  if(qq===pp)continue;
  var side=sqrtTex(h*h+(x1-x2)*(x1-x2));
  var ans='Трапецын тэгш хэмийн тэнхлэг дээр төв оршино. $AD$-г $Ox$ тэнхлэг дээр авч төвийг $O\\bigl(0;\\ y\\bigr)$ гэвэл '
   +'$\\dfrac{'+qq+'^{2}}{4}+y^{2}=\\dfrac{'+pp+'^{2}}{4}+\\bigl('+h+'-y\\bigr)^{2}$. '
   +'Эндээс $y=\\dfrac{'+pp+'^{2}-'+qq+'^{2}+4 \\cdot '+h+'^{2}}{8 \\cdot '+h+'}$ бөгөөд $R^{2}=\\dfrac{'+qq+'^{2}}{4}+y^{2}='+(R*R)+'$. '
   +'Хажуу тал $CD=\\sqrt{'+h+'^{2}+\\bigl(\\dfrac{'+qq+'-'+pp+'}{2}\\bigr)^{2}}$, талбай $S=\\dfrac{\\bigl('+qq+'+'+pp+'\\bigr) \\cdot '+h+'}{2}$. '
   +'Хариу: $R='+R+'$, $CD='+side+'$, $S='+frT((qq+pp)*h,2)+'$.';

 }

}

   +'Тэгш өнцөгт $OHP$, $OHQ$ гурвалжнуудаас $PH=\\sqrt{'+po+'^{2}-'+r+'^{2}}=\\sqrt{'+(po*po-r*r)+'}='+l1+'$, '

 }

// D1. Байршлыг тодорхойлж, ерөнхий шүргэгчийн тоог ол
function g_twoCirclePos(){
 for(var t=0;t<400;t++){
  var r1=rnd(2,16), r2=rnd(2,16);
  if(r1===r2)continue;
  var mode=rnd(1,6), d;
  if(mode===1)d=r1+r2+rnd(1,14);
  else if(mode===2)d=r1+r2;
  else if(mode===3){var lo=Math.abs(r1-r2)+1,hi=r1+r2-1;if(lo>hi)continue;d=rnd(lo,hi);}
  else if(mode===4)d=Math.abs(r1-r2);
  else if(mode===5){if(Math.abs(r1-r2)<2)continue;d=rnd(1,Math.abs(r1-r2)-1);}
  else d=0;
  if(d===0&&mode!==6)continue;
  var s=r1+r2, df=Math.abs(r1-r2), k, name;
  if(d>s){k=4;name='огтлолцоогүй (гадна орших)';}
  else if(d===s){k=3;name='гадаад шүргэлттэй';}
  else if(d>df){k=2;name='огтлолцсон';}
  else if(d===df&&d>0){k=1;name='дотоод шүргэлттэй';}
  else if(d>0){k=0;name='нэг тойрог нөгөөгийнхөө дотор орших';}
  else {k=0;name='ерөнхий төвтэй';}
  var ans='$r_{1}+r_{2}='+s+'$, $\\bigl|r_{1}-r_{2}\\bigr|='+df+'$, $d='+d+'$. '
   +'Эдгээрийг харьцуулбал: $d\\gt r_{1}+r_{2}$ бол огтлолцоогүй, $d=r_{1}+r_{2}$ бол гадаад шүргэлттэй, '
   +'$\\bigl|r_{1}-r_{2}\\bigr|\\lt d\\lt r_{1}+r_{2}$ бол огтлолцсон, $d=\\bigl|r_{1}-r_{2}\\bigr|$ бол дотоод шүргэлттэй, '
   +'$0\\lt d\\lt \\bigl|r_{1}-r_{2}\\bigr|$ бол нэг нь нөгөөгийнхөө дотор, $d=0$ бол ерөнхий төвтэй. '
   +'Өгөгдсөн тоонууд '+name+' тохиолдолд харгалзана. Ерөнхий шүргэгчийн тоо $k='+k+'$. '
   +'Хариу: $k='+k+'$ — '+name+'.';
  return {q:'$r_{1}='+r1+',\\ r_{2}='+r2+',\\ d='+d+'$',a:ans,fig:figTwoCircles(),key:'tcp|'+r1+'|'+r2+'|'+d};
 }
 return null;
}

// D2. Ерөнхий гадаад ба дотоод шүргэгчийн урт
var DH7=[10,20,25,26,30,34,40,50,52,58,60,65,68,70,74,75,78,80,82,85];
function g_commonTangentLen(){
 for(var t=0;t<400;t++){
  var d=pick(DH7), L=[],v;
  for(v=1;v<d;v++){if(isqrt(d*d-v*v)!==null)L.push(v);}
  if(L.length<2)continue;
  var i=rnd(0,L.length-1), j=rnd(0,L.length-1);
  if(i===j)continue;
  var lo=Math.min(L[i],L[j]), hi=Math.max(L[i],L[j]);
  if((hi-lo)%2)continue;
  var r1=(hi+lo)/2, r2=(hi-lo)/2;
  if(r2<1)continue;
  var E=isqrt(d*d-lo*lo), I=isqrt(d*d-hi*hi);
  if(E===null||I===null||I<1)continue;
  var ans='$d='+d+'\\gt r_{1}+r_{2}='+hi+'$ тул тойргууд огтлолцоогүй, $4$ ерөнхий шүргэгчтэй. '
   +'Гадаад шүргэгчийн хувьд бага тойргийн төвөөс том радиуст перпендикуляр буулгавал катет нь $r_{1}-r_{2}='+lo+'$, гипотенуз нь $d$ болно: '
   +'$PQ=\\sqrt{'+d+'^{2}-'+lo+'^{2}}=\\sqrt{'+(d*d-lo*lo)+'}$. '
   +'Дотоод шүргэгчийн хувьд катет нь $r_{1}+r_{2}='+hi+'$: $MN=\\sqrt{'+d+'^{2}-'+hi+'^{2}}=\\sqrt{'+(d*d-hi*hi)+'}$. '
   +'Хариу: $PQ='+E+'$, $MN='+I+'$.';
  return {q:'$r_{1}='+r1+',\\ r_{2}='+r2+',\\ d='+d+'$',a:ans,fig:figTwoCircles(),key:'ctl|'+r1+'|'+r2+'|'+d};
 }
 return null;
}

// D3. Шүргэлттэй хоёр тойргийн радиус харьцаагаар (тохиолдол ялгах)
function g_tangentRatio(){
 for(var t=0;t<400;t++){
  var p=rnd(2,9), q=rnd(1,8), d=rnd(6,40);
  if(p<=q)continue;
  if(gcd(p,q)!==1)continue;
  var cf=function(v){return v===1?'':''+v;};
  var ans='Гадаад шүргэлттэй бол $d=r_{1}+r_{2}$. $r_{1}='+cf(p)+'k$, $r_{2}='+cf(q)+'k$ гэвэл $'+cf(p+q)+'k='+d+'$, $k='+frT(d,p+q)+'$. '
   +'Дотоод шүргэлттэй бол $d=R_{1}-R_{2}$ тул $'+cf(p-q)+'k='+d+'$, $k='+frT(d,p-q)+'$. '
   +'Хариу: $r_{1}='+frT(p*d,p+q)+'$, $r_{2}='+frT(q*d,p+q)+'$, $R_{1}='+frT(p*d,p-q)+'$, $R_{2}='+frT(q*d,p-q)+'$.';
  return {q:'$r_{1}:r_{2}='+p+':'+q+',\\ d='+d+'$',a:ans,key:'tr|'+p+'|'+q+'|'+d};
 }
 return null;
}

// D4. Огтлолцсон хоёр тойргийн ерөнхий хөвч
function g_commonChord(){
 for(var t=0;t<80;t++){
  var T=pick(HER7), k=pick([1,1,2,3]);
  var arr=shuffle([T[0]*k,T[1]*k,T[2]*k]);
  var r1=arr[0], r2=arr[1], d=arr[2];
  var S=herArea(r1,r2,d);
  if(S===null||S<=0)continue;
  var ans='$O_{1}O_{2}$ ба ерөнхий $AB$ хөвч харилцан перпендикуляр бөгөөд бие биенээ хуваана. '
   +'$O_{1}O_{2}A$ гурвалжны талбайг Геронын томьёогоор олбол $S='+S+'$. '
   +'Нөгөө талаас $S=\\dfrac{d \\cdot \\dfrac{AB}{2}}{2}$ тул $AB=\\dfrac{4S}{d}=\\dfrac{4 \\cdot '+S+'}{'+d+'}$. '
   +'$O_{1}$-ээс хөвч хүртэлх зайг $m$ гэвэл $r_{1}^{2}-m^{2}=r_{2}^{2}-\\bigl(d-m\\bigr)^{2}$, эндээс '
   +'$m=\\dfrac{'+d+'^{2}+'+r1+'^{2}-'+r2+'^{2}}{2 \\cdot '+d+'}$. '
   +'Хариу: $AB='+frT(4*S,d)+'$, $m='+frT(d*d+r1*r1-r2*r2,2*d)+'$.';
  return {q:'$r_{1}='+r1+',\\ r_{2}='+r2+',\\ d='+d+'$',a:ans,fig:figCommonChord(),key:'cch|'+r1+'|'+r2+'|'+d};
 }
 return null;
}

// D5. Гурван харилцан гадаад шүргэлттэй тойрог
function g_threeTangentCircles(){
 for(var t=0;t<80;t++){
  var T=pick(HER7), k=pick([1,1,2]);
  var arr=shuffle([T[0]*k,T[1]*k,T[2]*k]);
  var a=arr[0], b=arr[1], c=arr[2];
  var S=herArea(a,b,c);
  if(S===null||S<=0)continue;
  if(b+c-a<=0||a+c-b<=0||a+b-c<=0)continue;
  var ans='Гадаад шүргэлттэй тойргуудын хувьд $O_{1}O_{2}=r_{1}+r_{2}$, $O_{2}O_{3}=r_{2}+r_{3}$, $O_{1}O_{3}=r_{1}+r_{3}$. '
   +'Гурвуулангийн нийлбэр $2\\bigl(r_{1}+r_{2}+r_{3}\\bigr)='+(a+b+c)+'$ тул $r_{1}+r_{2}+r_{3}='+frT(a+b+c,2)+'$. '
   +'Эндээс $r_{1}=\\dfrac{'+b+'+'+c+'-'+a+'}{2}$, $r_{2}=\\dfrac{'+a+'+'+c+'-'+b+'}{2}$, $r_{3}=\\dfrac{'+a+'+'+b+'-'+c+'}{2}$. '
   +'$O_{1}O_{2}O_{3}$ гурвалжны талбайг Геронын томьёогоор олбол $S='+S+'$. '
   +'Хариу: $r_{1}='+frT(b+c-a,2)+'$, $r_{2}='+frT(a+c-b,2)+'$, $r_{3}='+frT(a+b-c,2)+'$, $S='+S+'$.';
  return {q:'$O_{2}O_{3}='+a+',\\ O_{1}O_{3}='+b+',\\ O_{1}O_{2}='+c+'$',a:ans,key:'ttc|'+a+'-'+b+'-'+c};
 }
 return null;
}

// E1. Хоёр цэгээс өгсөн зайд орших цэгийн геометр байр (тохиолдол ялгах)
function g_locusTwoPoints(){
 for(var t=0;t<400;t++){
  var c=rnd(2,16), m=rnd(1,14), n=rnd(1,14);
  var s=m+n, df=Math.abs(m-n);
  var k, name;
  if(df<c&&c<s){k=2;name='хоёр цэг';}
  else if(c===s||(c===df&&df>0)){k=1;name='нэг цэг';}
  else {k=0;name='ийм цэг байхгүй';}
  var ans='Хайх цэг нь $A$ төвтэй $'+m+'$ радиустай тойрог ба $B$ төвтэй $'+n+'$ радиустай тойргийн огтлолцол дээр орших ёстой. '
   +'Хоёр тойргийн харилцан байршлыг шалгая: $r_{1}+r_{2}='+s+'$, $\\bigl|r_{1}-r_{2}\\bigr|='+df+'$, төвүүдийн зай $'+c+'$. '
   +(k===2?'$\\bigl|r_{1}-r_{2}\\bigr|\\lt d\\lt r_{1}+r_{2}$ тул тойргууд огтлолцоно. ':(k===1?'$d$ нь нийлбэр буюу ялгаварт тэнцүү тул тойргууд шүргэлцэнэ. ':'$d$ нь $\\bigl[\\bigl|r_{1}-r_{2}\\bigr|;\\ r_{1}+r_{2}\\bigr]$ завсарт орохгүй тул тойргууд огтлолцохгүй. '))
   +'Хариу: $k='+k+'$ — '+name+'.';
  return {q:'$AB='+c+',\\ AP='+m+',\\ BP='+n+'$',a:ans,fig:figLocusTwoPts(),key:'ltp|'+c+'|'+m+'|'+n};
 }
 return null;
}

// E3. Шулуунаас ба цэгээс өгсөн зайд орших цэгийн тоо

// E4. Тойрог дээрх тогтмол цэгээс татсан хөвчүүдийг харьцаагаар хуваах цэгийн байр
function g_locusChordDiv(){
 for(var t=0;t<400;t++){
  var R=pick([2,3,4,5,6,8,9,10,12,15,18,20]), p=rnd(1,6), q=rnd(1,6);
  if(gcd(p,q)!==1)continue;
  var ans='$A$ нь тойрог дээрх тогтмол цэг, $B$ нь тойрог дээгүүр хөдөлнө. $M$ цэг $AB$-г $'+p+':'+q+'$ харьцаагаар хуваадаг тул '
   +'$AM=\\dfrac{'+p+'}{'+(p+q)+'} \\cdot AB$, өөрөөр хэлбэл $M$ нь $B$-ийн $A$ төвтэй, $k=\\dfrac{'+p+'}{'+(p+q)+'}$ коэффициенттэй гомотетийн дүрс. '
   +'Гомотети тойргийг тойрог руу буулгах тул хайж буй геометр байр нь $r=k \\cdot '+R+'$ радиустай тойрог. '
   +'Түүний төв $O_{1}$ нь $AO$ хэрчим дээр $AO_{1}=k \\cdot '+R+'$ байхаар байрлах тул $OO_{1}='+R+'-k \\cdot '+R+'$. '
   +'Хариу: $r='+frT(p*R,p+q)+'$, $d='+frT(q*R,p+q)+'$.';
  return {q:'$R='+R+',\\ AM:MB='+p+':'+q+'$',a:ans,key:'lcd|'+R+'|'+p+'|'+q};
 }

}

// E5. Хоёр цэгээс ижил зайд орших цэгийн геометр байрын тэгшитгэл
function g_perpBisectorEq(){
 for(var t=0;t<400;t++){
  var x1=rnd(-8,8), y1=rnd(-8,8), x2=rnd(-8,8), y2=rnd(-8,8);
  if(y1===y2||x1===x2)continue;
  var kF=Fr(-(x2-x1),y2-y1);
  var xm=Fr(x1+x2,2), ym=Fr(y1+y2,2);
  var bF=fSub(ym,fMul(kF,xm));
  if(Math.abs(fVal(kF))>12||Math.abs(fVal(bF))>60)continue;
  var ans='Хайж буй геометр байр нь $AB$ хэрчмийн дундаж перпендикуляр. $AB$-ийн дундаж цэг '
   +'$M\\bigl('+fTex(xm)+';\\ '+fTex(ym)+'\\bigr)$. $AB$-ийн налуу $k_{1}='+frT(y2-y1,x2-x1)+'$ тул перпендикулярын налуу '
   +'$k=-\\dfrac{1}{k_{1}}='+fTex(kF)+'$. '
   +'$y=kx+b$ тэгшитгэлд $M$-ийг орлуулбал $b='+fTex(ym)+'-'+pw7(fTex(kF))+' \\cdot '+pw7(fTex(xm))+'$. '
   +'Хариу: $k='+fTex(kF)+'$, $b='+fTex(bF)+'$.';
  return {q:'$A\\bigl('+x1+';\\ '+y1+'\\bigr),\\ B\\bigl('+x2+';\\ '+y2+'\\bigr)$',a:ans,key:'pbe|'+x1+'|'+y1+'|'+x2+'|'+y2};
 }
 return null;
}
var WSPEC={"title":"Тойрогт багтсан ба тойрог багтаасан дөрвөн өнцөгт — хүнд","sub":"Багтсан ба багтаасан олон өнцөгт · VII бүлэг · 10-р анги","rule":"<b>Санамж:</b> Тойрогт багтсан дөрвөн өнцөгтийн эсрэг өнцгүүдийн нийлбэр $180^{\\circ}$. Тойрог багтаасан дөрвөн өнцөгтийн эсрэг талуудын нийлбэр тэнцүү: $AB+CD=BC+AD$. $a$ талтай зөв гурвалжинд $R=\\dfrac{a\\sqrt{3}}{3}$, $r=\\dfrac{a\\sqrt{3}}{6}$; квадратад $R=\\dfrac{a\\sqrt{2}}{2}$, $r=\\dfrac{a}{2}$; зөв зургаан өнцөгтөд $R=a$, $r=\\dfrac{a\\sqrt{3}}{2}$.","ref":"","tasks":[{"label":"$ABCD$ тэгш өнцөгт трапецын ($AB\\perp AD$, $BC\\parallel AD$) дотор тойрог багтжээ. $AB$, $CD$, тойргийн радиус $r$ ба талбай $S$-ийг ол.","fn":"g_tangTrapezoid","cap":3,"cols":1,"wk":30},{"label":"$ABCD$ дөрвөн өнцөгтийн гурван өнцөг өгөгдөв. $\\angle D$-г олоод тойрогт багтах эсэхийг үндэслэлтэй тогтоо.","fn":"g_cyclicTest","cap":3,"cols":1,"wk":28},{"label":"$ABCD$ тойрогт багтсан дөрвөн өнцөгт. $x$ ба дөрвөн өнцгийн хэмжээг ол.","fn":"g_cyclicParamAngles","cap":3,"cols":1,"wk":30},{"label":"$AD\\parallel BC$ байх адил хажуут трапец тойрогт багтжээ. Багтаасан тойргийн радиус $R$, хажуу тал $CD$ ба талбай $S$-ийг ол.","fn":"g_isoTrapCirc","cap":3,"cols":1,"wk":30}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
