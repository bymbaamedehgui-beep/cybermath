<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Азтаны сугалаа · CyberMath</title>
<meta name="description" content="CyberMath — нэг удаа хусаж хөнгөлөлт, үнэгүй эрх хож аваарай." />
<link rel="icon" href="/favicon-32.png" />
<style>
  :root{--gold:#FFC93C;--ink:#1a1030;--pur:#7B52EE}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;min-height:100vh;color:#fff;
    background:linear-gradient(135deg,#3b1e73,#7B52EE 45%,#A855F7 80%,#ec4899);
    background-size:200% 200%;animation:bg 14s ease infinite;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;padding:18px 16px 40px}
  @keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .brand{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-weight:900;font-size:1.05rem;opacity:.95}
  h1{font-size:1.75rem;font-weight:900;letter-spacing:-.4px;text-align:center;margin:4px 0 4px;text-shadow:0 3px 16px rgba(0,0,0,.3)}
  .sub{opacity:.92;font-size:.93rem;text-align:center;margin-bottom:18px;max-width:30rem}

  /* ── Хусдаг карт ── */
  .card{position:relative;width:min(86vw,330px);height:min(112vw,430px);border-radius:22px;
    background:#fff;box-shadow:0 22px 50px -18px rgba(0,0,0,.55);overflow:hidden;flex:none}
  .under{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:22px 18px;text-align:center;color:var(--ink)}
  .under .ico{line-height:0}
  .under .lbl{font-weight:900;font-size:1.22rem;line-height:1.25}
  .under .det{font-size:.86rem;color:#5b5370;font-weight:700;line-height:1.4}
  .codebox{margin-top:4px;display:flex;align-items:center;gap:8px;background:#f3efff;border:2px dashed #b9a6f5;
    border-radius:12px;padding:9px 13px}
  .codebox b{font-family:'Courier New',monospace;font-size:1.18rem;letter-spacing:1.5px;color:#4c23c4}
  .copy{background:var(--pur);border:0;color:#fff;border-radius:9px;padding:7px 11px;cursor:pointer;font-weight:800;font-size:.78rem}
  #scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
  .hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-weight:900;color:#fff;
    font-size:.95rem;text-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none;transition:opacity .25s}

  .btn{margin-top:20px;background:#fff;color:var(--pur);border:0;border-radius:999px;padding:13px 28px;
    font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);
    display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .btn:disabled{opacity:.55;cursor:default}
  .who{display:none;align-items:center;gap:8px;background:rgba(255,255,255,.16);border-radius:999px;
    padding:6px 14px;font-size:.84rem;font-weight:700;margin-bottom:12px}
  .msg{margin-top:14px;font-weight:800;font-size:.9rem;min-height:20px;text-align:center}
  .note{margin-top:18px;font-size:.84rem;opacity:.9;text-align:center;max-width:26rem;line-height:1.55}
  .note a{color:#FFE08A;font-weight:800}
  #fx{position:fixed;inset:0;pointer-events:none;display:none;z-index:50}
</style>
</head>
<body>

<div class="brand">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFC93C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 9l7 .6-5.3 4.6L18.4 21 12 17.3 5.6 21l1.7-6.8L2 9.6 9 9z"/></svg>
  <span>CyberMath</span>
</div>

<div class="who" id="whoBox">
  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  <span id="whoEmail"></span>
</div>

<h1 id="h1">Танд бэлэг байна!</h1>
<div class="sub" id="sub">Картыг хуусаад юу хожсоноо хараарай</div>

<div class="card" id="card">
  <div class="under" id="under">
    <div class="ico" id="pIco"></div>
    <div class="lbl" id="pLabel">…</div>
    <div class="det" id="pDetail"></div>
    <div class="codebox" id="pCodeBox" style="display:none">
      <b id="pCode"></b>
      <button class="copy" id="pCopy" type="button">Хуулах</button>
    </div>
  </div>
  <canvas id="scratch"></canvas>
  <div class="hint" id="hint">Хусаж эхлээрэй</div>
</div>

<div id="loginBox" style="display:none">
  <a class="btn" href="/worksheets.html">Бүртгүүлэх / Нэвтрэх →</a>
</div>

<div class="msg" id="msg"></div>

<a class="btn" id="goWs" href="/worksheets.html" style="display:none">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v6h6"/></svg>
  Дасгалын төв рүү
</a>

<div class="note">
  Нэг имэйлээр <b>нэг удаа</b>. Хожсон хөнгөлөлтөө <a href="/worksheets.html">Дасгалын төв</a>-д
  худалдан авахдаа ашиглана.
</div>

<canvas id="fx"></canvas>

<script>
/* ──────────────────────────────────────────────────────────────
   Хусдаг сугалаа. Серверийн логик өмнөхтэй ижил (wheel_spin) —
   нэг имэйлд нэг удаа, шагналыг сервер сонгоно. Энд зөвхөн
   илчлэх хэлбэр нь өөр.
   ────────────────────────────────────────────────────────────── */
function lsg(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
var WS_TOKEN = lsg('cm_ws_token'), WS_EMAIL = lsg('cm_last_user');
var msg = document.getElementById('msg');
var card = document.getElementById('card'), cv = document.getElementById('scratch');
var hint = document.getElementById('hint');
var ctx = cv.getContext('2d');
var revealed = false, fetching = false, prize = null, started = false;

function applyAuth(){
  var who = document.getElementById('whoBox'), login = document.getElementById('loginBox');
  if (WS_TOKEN && WS_EMAIL) {
    who.style.display = 'flex';
    document.getElementById('whoEmail').textContent = WS_EMAIL;
    login.style.display = 'none';
    card.style.display = '';
  } else {
    who.style.display = 'none';
    login.style.display = 'block';
    card.style.display = 'none';
    document.getElementById('h1').textContent = 'Эхлээд нэвтэрнэ үү';
    document.getElementById('sub').textContent = 'Бүртгэлтэй хүн нэг удаа сугалаа хусна';
  }
}

/* ── Хусах давхарга зурах ── */
function paintCover(){
  var r = card.getBoundingClientRect();
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var g = ctx.createLinearGradient(0, 0, r.width, r.height);
  g.addColorStop(0, '#8E7BEF'); g.addColorStop(.5, '#7B52EE'); g.addColorStop(1, '#5a32d6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
  /* гялалзсан зураасууд */
  ctx.globalAlpha = .13; ctx.fillStyle = '#fff';
  for (var i = -r.height; i < r.width; i += 26) { ctx.fillRect(i, 0, 9, r.height); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.font = '900 20px system-ui,Segoe UI,Arial';
  ctx.textAlign = 'center';
  ctx.fillText('ХУСААРАЙ', r.width / 2, r.height / 2 - 6);
  ctx.font = '700 13px system-ui,Segoe UI,Arial';
  ctx.globalAlpha = .85;
  ctx.fillText('хуруугаараа зурна', r.width / 2, r.height / 2 + 18);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'destination-out';
}

/* ── Шагналыг серверээс авах (эхний хусалт дээр) ── */
function loadPrize(){
  if (fetching || prize) return Promise.resolve(prize);
  fetching = true;
  return fetch('/api/qpay?action=wheel_spin', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: WS_TOKEN })
  }).then(function(r){ return r.json(); }).then(function(d){
    fetching = false;
    if (!d || !d.ok) { msg.style.color = '#ffe08a'; msg.textContent = (d && d.error) || 'Алдаа гарлаа'; return null; }
    prize = d.prize || {};
    prize.already = !!d.already;
    fillUnder(prize);
    return prize;
  }).catch(function(){
    fetching = false;
    msg.style.color = '#ffe08a'; msg.textContent = 'Сүлжээний алдаа';
    return null;
  });
}

var ICO_WIN = '<svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
var ICO_HEART = '<svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#A855F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/></svg>';
function esc(x){ return String(x == null ? '' : x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fillUnder(p){
  var win = (p.type === 'discount' || p.type === 'access');
  document.getElementById('pIco').innerHTML = win ? ICO_WIN : ICO_HEART;
  document.getElementById('pLabel').textContent = p.label || 'Баярлалаа!';
  document.getElementById('pDetail').textContent = p.detail || (win ? '' : 'Дараагийн удаа амжилт хүсье');
  if (p.code) {
    document.getElementById('pCodeBox').style.display = '';
    document.getElementById('pCode').textContent = p.code;
  }
}

/* ── Хусалт ── */
function pos(e){
  var r = cv.getBoundingClientRect();
  var t = (e.touches && e.touches[0]) || e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function scratchAt(p){
  ctx.beginPath();
  ctx.arc(p.x, p.y, 23, 0, Math.PI * 2);
  ctx.fill();
}
var drawing = false, last = null;
function down(e){
  if (revealed) return;
  if (!WS_TOKEN) { applyAuth(); return; }
  drawing = true; last = pos(e);
  if (!started) { started = true; hint.style.opacity = '0'; loadPrize(); }
  scratchAt(last);
  e.preventDefault();
}
function move(e){
  if (!drawing || revealed) return;
  var p = pos(e);
  /* хоёр цэгийн хооронд тасралтгүй зурна */
  var d = Math.hypot(p.x - last.x, p.y - last.y), step = 10;
  for (var i = 0; i < d; i += step) {
    scratchAt({ x: last.x + (p.x - last.x) * (i / d), y: last.y + (p.y - last.y) * (i / d) });
  }
  scratchAt(p); last = p;
  e.preventDefault();
}
function up(){
  if (!drawing) return;
  drawing = false;
  if (cleared() > 0.45) reveal();
}
/* Хэдэн хувь нь хусагдсаныг тооцно */
function cleared(){
  try {
    var w = cv.width, h = cv.height;
    var d = ctx.getImageData(0, 0, w, h).data;
    var n = 0, tot = 0;
    for (var i = 3; i < d.length; i += 4 * 40) { tot++; if (d[i] < 40) n++; }
    return tot ? n / tot : 0;
  } catch (e) { return 0; }
}
function reveal(){
  if (revealed) return;
  revealed = true;
  cv.style.transition = 'opacity .45s';
  cv.style.opacity = '0';
  setTimeout(function(){ cv.style.display = 'none'; }, 460);
  document.getElementById('goWs').style.display = 'inline-flex';
  hint.style.display = 'none';
  var p = prize || {};
  if (p.type === 'discount' || p.type === 'access') { confetti(); }
  if (p.already) { msg.style.color = '#ffe08a'; msg.textContent = 'Та өмнө нь хуссан байна — энэ бол таны шагнал'; }
}

cv.addEventListener('mousedown', down);
cv.addEventListener('mousemove', move);
window.addEventListener('mouseup', up);
cv.addEventListener('touchstart', down, { passive: false });
cv.addEventListener('touchmove', move, { passive: false });
window.addEventListener('touchend', up);

document.getElementById('pCopy').onclick = function(){
  var c = document.getElementById('pCode').textContent;
  try { navigator.clipboard.writeText(c); this.textContent = 'Хуулсан'; } catch (e) {}
};

/* ── Конфетти ── */
function confetti(){
  var fx = document.getElementById('fx');
  fx.style.display = 'block';
  fx.width = innerWidth; fx.height = innerHeight;
  var c2 = fx.getContext('2d'), P = [], t0 = Date.now();
  var cols = ['#FFC93C','#A855F7','#7B52EE','#22c55e','#ec4899','#fff'];
  for (var i = 0; i < 130; i++) P.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * 200,
    vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3, r: 5 + Math.random() * 7,
    rot: Math.random() * 6, vr: -.2 + Math.random() * .4, c: cols[(Math.random() * cols.length) | 0] });
  (function fr(){
    c2.clearRect(0, 0, fx.width, fx.height);
    P.forEach(function(o){ o.y += o.vy; o.x += o.vx; o.rot += o.vr;
      c2.save(); c2.translate(o.x, o.y); c2.rotate(o.rot); c2.fillStyle = o.c;
      c2.fillRect(-o.r / 2, -o.r / 2, o.r, o.r * .6); c2.restore(); });
    if (Date.now() - t0 < 3200) requestAnimationFrame(fr); else fx.style.display = 'none';
  })();
}

applyAuth();
if (WS_TOKEN && WS_EMAIL) { paintCover(); }
window.addEventListener('resize', function(){ if (!revealed && !started) paintCover(); });
</script>
</body>
</html>
