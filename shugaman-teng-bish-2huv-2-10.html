<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Хоёр хувьсагчтай тэнцэтгэл бишийн систем 2 — ахисан (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:17px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:10px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .g2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px 18px}
  .card{break-inside:avoid;page-break-inside:avoid;border:1px solid #eee7fb;border-radius:9px;padding:8px 9px;background:linear-gradient(#fff,#fcfbff)}
  .card .cn{font-weight:800;color:var(--purple);font-size:12.5px;margin-bottom:3px}
  .gsvg{width:100%;height:auto;display:block;max-width:74mm;margin:0 auto}
  .aline{margin-top:6px;font-size:11px;color:var(--soft)}.aline b{color:var(--ink);border-bottom:1px solid #cdbff0;padding:0 46px}
  .sys{font-size:13.5px;margin:2px 0 7px;text-align:center}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-list{display:flex;flex-direction:column;gap:9px;font-size:12.5px;margin-bottom:12px}.ans-list .a{display:flex;gap:7px;align-items:baseline}.ans-list .an{color:var(--soft);font-weight:800;min-width:24px}
  .ans-sys{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var VB=210,P=10,W={x0:-6,x1:6,y0:-6,y1:6};
function Xc(w,x){return P+(x-w.x0)/(w.x1-w.x0)*(VB-2*P);}
function Yc(w,y){return VB-P-(y-w.y0)/(w.y1-w.y0)*(VB-2*P);}
function boxPoly(w){return [[w.x0,w.y0],[w.x1,w.y0],[w.x1,w.y1],[w.x0,w.y1]];}
function sideVal(hp,x,y){return hp.A*x+hp.B*y-hp.C;}
function clipPoly(poly,hp){var res=[];for(var i=0;i<poly.length;i++){var A=poly[i],B=poly[(i+1)%poly.length];var sa=sideVal(hp,A[0],A[1]),sb=sideVal(hp,B[0],B[1]);var ina=hp.ge?sa>=-1e-9:sa<=1e-9;var inb=hp.ge?sb>=-1e-9:sb<=1e-9;if(ina)res.push(A);if(ina!==inb&&sa!==sb){var t=sa/(sa-sb);res.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}}return res;}
function areaP(poly){var a=0;for(var i=0;i<poly.length;i++){var A=poly[i],B=poly[(i+1)%poly.length];a+=A[0]*B[1]-B[0]*A[1];}return Math.abs(a)/2;}
function gridSvg(w){var s='',x,y,x0=Xc(w,0),y0=Yc(w,0);
  for(x=Math.ceil(w.x0);x<=Math.floor(w.x1);x++){var xp=Xc(w,x).toFixed(1);s+='<line x1="'+xp+'" y1="'+Yc(w,w.y0).toFixed(1)+'" x2="'+xp+'" y2="'+Yc(w,w.y1).toFixed(1)+'" stroke="#e7e1f5" stroke-width="0.6"/>';}
  for(y=Math.ceil(w.y0);y<=Math.floor(w.y1);y++){var yp=Yc(w,y).toFixed(1);s+='<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+yp+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+yp+'" stroke="#e7e1f5" stroke-width="0.6"/>';}
  s+='<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+y0.toFixed(1)+'" stroke="#4a4470" stroke-width="1.3"/>';
  s+='<line x1="'+x0.toFixed(1)+'" y1="'+Yc(w,w.y0).toFixed(1)+'" x2="'+x0.toFixed(1)+'" y2="'+Yc(w,w.y1).toFixed(1)+'" stroke="#4a4470" stroke-width="1.3"/>';
  s+='<polygon points="'+Xc(w,w.x1).toFixed(1)+','+y0.toFixed(1)+' '+(Xc(w,w.x1)-5).toFixed(1)+','+(y0-3).toFixed(1)+' '+(Xc(w,w.x1)-5).toFixed(1)+','+(y0+3).toFixed(1)+'" fill="#4a4470"/>';
  s+='<polygon points="'+x0.toFixed(1)+','+Yc(w,w.y1).toFixed(1)+' '+(x0-3).toFixed(1)+','+(Yc(w,w.y1)+5).toFixed(1)+' '+(x0+3).toFixed(1)+','+(Yc(w,w.y1)+5).toFixed(1)+'" fill="#4a4470"/>';
  for(x=w.x0+2;x<=w.x1-1;x+=2){if(x===0)continue;s+='<text x="'+Xc(w,x).toFixed(1)+'" y="'+(y0+8).toFixed(1)+'" font-size="6.5" fill="#8a83a5" text-anchor="middle">'+x+'</text>';}
  for(y=w.y0+2;y<=w.y1-1;y+=2){if(y===0)continue;s+='<text x="'+(x0-4).toFixed(1)+'" y="'+(Yc(w,y)+2.3).toFixed(1)+'" font-size="6.5" fill="#8a83a5" text-anchor="end">'+y+'</text>';}
  s+='<text x="'+(Xc(w,w.x1)-1).toFixed(1)+'" y="'+(y0+9).toFixed(1)+'" font-size="7" fill="#4a4470" font-style="italic">x</text>';
  s+='<text x="'+(x0+4).toFixed(1)+'" y="'+(Yc(w,w.y1)+7).toFixed(1)+'" font-size="7" fill="#4a4470" font-style="italic">y</text>';
  return s;}
function shadeSvg(w,hps){var poly=boxPoly(w);for(var i=0;i<hps.length;i++)poly=clipPoly(poly,hps[i]);if(poly.length<3)return '';
  return '<polygon points="'+poly.map(function(p){return Xc(w,p[0]).toFixed(1)+','+Yc(w,p[1]).toFixed(1);}).join(' ')+'" fill="rgba(123,82,238,0.20)"/>';}
function lineSvg(w,hp){var box=boxPoly(w),pts=[];for(var i=0;i<4;i++){var A=box[i],B=box[(i+1)%4];var sa=sideVal(hp,A[0],A[1]),sb=sideVal(hp,B[0],B[1]);if(sa===sb)continue;if((sa<=0&&sb>=0)||(sa>=0&&sb<=0)){var t=sa/(sa-sb);pts.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}}if(pts.length<2)return '';
  var d=hp.strict?' stroke-dasharray="4 2.5"':'';
  return '<line x1="'+Xc(w,pts[0][0]).toFixed(1)+'" y1="'+Yc(w,pts[0][1]).toFixed(1)+'" x2="'+Xc(w,pts[1][0]).toFixed(1)+'" y2="'+Yc(w,pts[1][1]).toFixed(1)+'" stroke="#7B52EE" stroke-width="1.6"'+d+'/>';}
function dotSvg(w,pt){return '<circle cx="'+Xc(w,pt[0]).toFixed(1)+'" cy="'+Yc(w,pt[1]).toFixed(1)+'" r="2.6" fill="#e0562d"/>';}
function svgWrap(inner){return '<svg class="gsvg" viewBox="0 0 '+VB+' '+VB+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';}
function opTex(ge,strict){return ge?(strict?'\\gt':'\\geq'):(strict?'\\lt':'\\leq');}
function coefT(k,v){return k===1?v:(k===-1?'-'+v:k+v);}
function addT(k,v){if(k>0)return '+'+(k===1?'':k)+v;return '-'+(k===-1?'':-k)+v;}
function linTex(A,B,C,ge,strict){var p='';if(A!==0)p+=coefT(A,'x');if(B!==0)p+=(p?addT(B,'y'):coefT(B,'y'));return p+' '+opTex(ge,strict)+' '+C;}
// гурвалжин систем (3 тэнцэтгэл биш)
function buildTri(){var tr=0;while(tr++<800){
  var Pp=[nz(-5,5),nz(-5,5)],Qp=[nz(-5,5),nz(-5,5)],Rp=[nz(-5,5),nz(-5,5)];
  var ar=Math.abs((Qp[0]-Pp[0])*(Rp[1]-Pp[1])-(Rp[0]-Pp[0])*(Qp[1]-Pp[1]))/2;
  if(ar<7||ar>52)continue;
  var E=[[Pp,Qp,Rp],[Qp,Rp,Pp],[Rp,Pp,Qp]],hps=[],texs=[],ok=true;
  for(var e=0;e<3;e++){var a=E[e][0],b=E[e][1],c=E[e][2],dx=b[0]-a[0],dy=b[1]-a[1];
    var A=dy,B=-dx,C=dy*a[0]-dx*a[1],g=gcd(gcd(A,B),C)||1;A/=g;B/=g;C/=g;
    if(A<0||(A===0&&B<0)){A=-A;B=-B;C=-C;}
    var sc=A*c[0]+B*c[1]-C;if(Math.abs(sc)<1e-9){ok=false;break;}
    var ge=sc>0;hps.push({A:A,B:B,C:C,ge:ge,strict:false});texs.push(linTex(A,B,C,ge,false));}
  if(!ok)continue;
  if(texs[0]===texs[1]||texs[1]===texs[2]||texs[0]===texs[2])continue;
  return {hps:hps,texs:texs,verts:[Pp,Qp,Rp]};}return null;}
// бутархай налалттай шугам
var SLOPES=[[1,2],[3,2],[1,3],[2,3],[-1,2],[-3,2],[-1,3],[-2,3]];
function gSlopeF(){var s=pick(SLOPES),num=s[0],den=s[1],b=nz(-3,3),ge=pick([true,false]),strict=pick([true,false]);
  var mt=(num<0?'-\\dfrac{'+(-num)+'}{'+den+'}x':'\\dfrac{'+num+'}{'+den+'}x');
  var bt=b===0?'':(b>0?'+'+b:'-'+(-b));
  return {hp:{A:-num,B:den,C:b*den,ge:ge,strict:strict},tex:'y '+opTex(ge,strict)+' '+mt+bt};}
function gVert(){var c=nz(-4,4),ge=pick([true,false]),strict=pick([true,false]);return {hp:{A:1,B:0,C:c,ge:ge,strict:strict},tex:'x '+opTex(ge,strict)+' '+c};}
function gHoriz(){var c=nz(-4,4),ge=pick([true,false]),strict=pick([true,false]);return {hp:{A:0,B:1,C:c,ge:ge,strict:strict},tex:'y '+opTex(ge,strict)+' '+c};}
function genWedge(){var tr=0;while(tr++<800){var a=gSlopeF(),b=pick([gSlopeF,gVert,gHoriz])();
  if(a.tex===b.tex)continue;var poly=clipPoly(clipPoly(boxPoly(W),a.hp),b.hp),ar=areaP(poly);
  if(poly.length<3||ar<16||ar>120)continue;
  var a1=areaP(clipPoly(boxPoly(W),a.hp)),a2=areaP(clipPoly(boxPoly(W),b.hp));
  if(ar>a1-2||ar>a2-2)continue;
  return {hps:[a.hp,b.hp],texs:[a.tex,b.tex]};}return null;}
function casesTex(texs){return '\\begin{cases}'+texs.join('\\\\ ')+'\\end{cases}';}
function build(){
  var s1=[],guard=0;
  while(s1.length<2&&guard++<200){var t=buildTri();if(t)s1.push({hps:t.hps,texs:t.texs});}
  guard=0;while(s1.length<4&&guard++<400){var wgd=genWedge();if(wgd)s1.push({hps:wgd.hps,texs:wgd.texs});}
  for(var i=s1.length-1;i>0;i--){var j=rnd(0,i),tmp=s1[i];s1[i]=s1[j];s1[j]=tmp;}
  var s2=[];guard=0;while(s2.length<2&&guard++<400){var t2=buildTri();if(t2)s2.push(t2);}
  var K=0,ans1=[];
  var c1=s1.map(function(it){var k=K++;ans1.push({tex:casesTex(it.texs),k:k});
    var g=gridSvg(W)+shadeSvg(W,it.hps)+it.hps.map(function(h){return lineSvg(W,h);}).join('');
    return '<div class="card"><div class="cn">'+(k+1)+'.</div>'+svgWrap(g)+'<div class="aline">Систем: <b>&nbsp;</b></div></div>';}).join('');
  var c2=s2.map(function(it){var k=K++;
    return '<div class="card"><div class="cn">'+(k+1)+'.</div><div class="sys">$'+casesTex(it.texs)+'$</div>'+svgWrap(gridSvg(W))+'<div class="aline">Орой цэгүүд: <b>&nbsp;</b></div></div>';}).join('');
  var a1='<div class="ans-list">'+ans1.map(function(a){return '<div class="a"><span class="an">'+(a.k+1)+'.</span><span>$'+a.tex+'$</span></div>';}).join('')+'</div>';
  var a2='<div class="ans-sys">'+s2.map(function(it,idx){var k=s1.length+idx;
    var g=gridSvg(W)+shadeSvg(W,it.hps)+it.hps.map(function(h){return lineSvg(W,h);}).join('')+it.verts.map(function(v){return dotSvg(W,v);}).join('');
    var vt=it.verts.map(function(v){return '('+v[0]+',\\ '+v[1]+')';}).join(',\\ ');
    return '<div class="card"><div class="cn">'+(k+1)+'.</div>'+svgWrap(g)+'<div class="aline" style="text-align:center">Орой: $'+vt+'$</div></div>';}).join('')+'</div>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Хоёр хувьсагчтай тэнцэтгэл бишийн систем — ахисан</h1><div class="sub">Мужаас систем унших · гурван тэнцэтгэл бишийн систем · орой цэг · 6.4 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Муж бүрийн хилийн шугамыг тэгшитгэлээр нь олж, будсан тал руу нь тэнцэтгэл бишийн тэмдэг тавь. Тасархай шугам — хатуу ($\\lt,\\gt$), битүү шугам — хатуу бус ($\\leq,\\geq$).</div>'
    +'<div class="task">1. Зураг дээрх будсан мужийг тодорхойлох тэнцэтгэл бишийн системийг бич.</div><div class="g2">'+c1+'</div>'
    +'<div class="task">2. Системийн шийдийн мужийг дүрсэлж, мужийн орой цэгүүдийг ол.</div><div class="g2">'+c2+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="task" style="margin-top:0">Хэсэг 1 — систем</div>'+a1+'<div class="task">Хэсэг 2 — шийдийн муж ба орой</div>'+a2+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Хоёр хувьсагчтай тэнцэтгэл бишийн систем 2 — ахисан (10-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>

</body>
</html>
