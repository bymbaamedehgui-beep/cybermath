<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>4-р анги — өгүүлбэртэй бодлого (хүндэвтэр)</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--ink:#16241c;--soft:#5a7064;--line:#cfe0d6;--forest:#13502e;--amber:#9a6300;--green:#0f7a3d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:#e9f1ec;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-family:inherit;font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;color:#fff;font-size:.9rem;background:var(--forest)}
  .btn.ghost{background:#fff;color:var(--forest);box-shadow:inset 0 0 0 1.5px var(--line)}
  .bar label{font-weight:700;color:var(--forest);display:flex;align-items:center;gap:6px;font-size:.9rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.3)}
  .head{text-align:center;border-bottom:2.5px solid var(--forest);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:var(--forest);font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #9bb3a6;padding:0 30px 2px 4px}
  .guide{background:#fff7e6;border:1px solid #f3dca6;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#8a5a00}
  .guide b{color:#7a4f00}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:7px 4px 8px;border-bottom:1px dashed #e6efe9}
  .qt{font-size:13px}.qt .qn{font-weight:800;color:var(--forest);margin-right:5px}
  .work{margin:7px 0 5px 0;height:20mm;border:1.3px solid #bcd3c4;border-radius:6px;background-image:linear-gradient(#eee 1px,transparent 1px);background-size:100% 6mm}
  .ans2{font-size:12.5px;font-weight:700}.ans2 .bl{display:inline-block;min-width:70px;border-bottom:1.4px solid #6f8a7c;height:1.05em;margin-left:6px}
  .ans-page{margin-top:9mm;border-top:2px dashed var(--line);padding-top:7mm}.ans-page h2{font-size:15px;color:var(--forest);margin-bottom:10px}
  .sol{break-inside:avoid;page-break-inside:avoid;padding:8px 11px;margin-bottom:8px;border:1px solid #e6efe9;border-left:3px solid var(--green);border-radius:8px;font-size:12.5px}
  .sol .sn{font-weight:800;color:var(--green);margin-right:4px}
  .sol .qq{color:#33413a}
  .sol .st{margin:4px 0;color:#1f2d26}
  .sol .fin{color:var(--green);font-weight:800}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn ghost" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sp(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
var NM=['Бат','Болд','Дорж','Сараа','Туяа','Ану','Энх','Мөнх','Оюун','Гэрэл'];
var IT=['алим','ном','дэвтэр','бал','чихэр','бөмбөг','марк','наалт'];
function two(){var a=pick(NM),b=pick(NM);while(b===a)b=pick(NM);return [a,b];}

/* 1. Нийлбэр–зөрүү (хэрчмийн арга) */
function tSumDiff(){
  var x=rnd(14,45), y=rnd(5,x-3), S=x+y, D=x-y;
  var q='Хоёр тооны нийлбэр нь '+S+', зөрүү нь '+D+'. Тэр хоёр тоог ол.';
  var sol='Их тоо $=(нийлбэр+зөрүү)\\div2=('+S+'+'+D+')\\div2='+(S+D)+'\\div2='+x+'$. '
    +'Бага тоо $='+x+'-'+D+'='+y+'$ (эсвэл $('+S+'-'+D+')\\div2='+y+'$).';
  return {q:q, ans:'Их '+x+', бага '+y, sol:sol, chk:x+'+'+y+'='+S+', '+x+'−'+y+'='+D};
}
/* 2. Хэдэн дахин их — нийтийг хуваарилах */
function tRatioTotal(){
  var t=two(),k=rnd(2,4),sm=rnd(6,15),T=sm*(k+1),it=pick(IT);
  var q=t[0]+' болон '+t[1]+' хоёр нийт '+T+' '+it+'-тай. '+t[0]+' нь '+t[1]+'-ээс '+k+' дахин их бол тус бүрт нь хэдэн '+it+' байна вэ?';
  var sol=t[1]+'-ийг 1 хэсэг гэвэл '+t[0]+' нь '+k+' хэсэг, нийт '+(k+1)+' хэсэг. '
    +'1 хэсэг $='+T+'\\div'+(k+1)+'='+sm+'$ ('+t[1]+'). '+t[0]+' $='+sm+'\\times'+k+'='+(sm*k)+'$.';
  return {q:q, ans:t[1]+' '+sm+', '+t[0]+' '+(sm*k), sol:sol, chk:sm+'+'+(sm*k)+'='+T};
}
/* 3. Худалдан авалт + хариулт */
function tBuy(){
  var nm=pick(NM),p=rnd(3,9)*100,qq=rnd(2,6)*100,c=rnd(2,5),d=rnd(2,6),it1='дэвтэр',it2='бал';
  var cost=p*c+qq*d, B=Math.ceil((cost+rnd(300,2500))/1000)*1000, ch=B-cost;
  var q=nm+' нэг '+it1+' '+p+'₮, нэг '+it2+' '+qq+'₮-өөр '+c+' '+it1+', '+d+' '+it2+' авав. '+sp(B)+'₮ өгвөл хэдэн төгрөгний хариулт авах вэ?';
  var sol='Дэвтэрт $'+p+'\\times'+c+'='+sp(p*c)+'$₮, балд $'+qq+'\\times'+d+'='+sp(qq*d)+'$₮. '
    +'Нийт үнэ $='+sp(p*c)+'+'+sp(qq*d)+'='+sp(cost)+'$₮. Хариулт $='+sp(B)+'-'+sp(cost)+'='+sp(ch)+'$₮.';
  return {q:q, ans:sp(ch)+'₮', sol:sol, chk:sp(cost)+'+'+sp(ch)+'='+sp(B)};
}
/* 4. Тэнцүү хуваах + үлдэгдэл */
function tDivRem(){
  var m=rnd(3,7),qv=rnd(4,12),r=rnd(1,m-1),N=m*qv+r,it=pick(IT),box=pick(['хайрцаг','сав','таваг','уут']);
  var q=N+' '+it+'-ыг '+m+' '+box+'т тэнцүү хийв. '+box+' бүрт хэдэн '+it+' ногдож, хэд нь үлдэх вэ?';
  var sol='$'+N+'\\div'+m+'='+qv+'$ ('+box+' бүрт), үлдэгдэл $='+N+'-'+m+'\\times'+qv+'='+N+'-'+(m*qv)+'='+r+'$.';
  return {q:q, ans:box+' бүрт '+qv+', үлдэгдэл '+r, sol:sol, chk:m+'×'+qv+'+'+r+'='+N};
}

var GENS=[tSumDiff,tRatioTotal,tBuy,tDivRem];

function build(){
  var probs='',sols='',WS=[];
  var order=[0,1,2,3,0,1,2,3]; // 4 төрөл × 2
  for(var i=0;i<order.length;i++){
    var p=GENS[order[i]](),n=i+1;
    probs+='<div class="q"><div class="qt"><span class="qn">'+n+'.</span>'+p.q+'</div><div class="work"></div>'
      +'<div class="ans2">Хариу:<span class="bl"></span></div></div>';
    sols+='<div class="sol"><span class="sn">'+n+'.</span><span class="qq">'+p.q+'</span>'
      +'<div class="st">'+p.sol+'</div><div class="fin">Хариу: '+p.ans+'</div>'
      +'<div class="st" style="color:#8a5a00">Шалгалт: '+p.chk+' ✓</div></div>';
    WS.push({q:'\\text{'+p.q+'}',a:'\\text{'+p.ans+'}'});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Өгүүлбэртэй бодлого — хүндэвтэр</h1><div class="sub">4-р анги · олон үйлдэлт бодлого · нийлбэр-зөрүү, харьцаа, худалдан авалт, хуваарилалт · 8 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Анги: </span></div>'
    +'<div class="guide"><b>Санамж:</b> ① Юу асууж байгааг ойлго. ② Хэрчим/зураг зур. ③ Дараалсан үйлдлээ бич. ④ Тооцоол. ⑤ Хариугаа <b>шалга</b>. '
    +'<br><b>Нийлбэр-зөрүү:</b> их=(нийлбэр+зөрүү)÷2 · <b>хэдэн дахин их:</b> нийтийг (хэсгийн тоо)-нд хуваа.</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Бодолт ба хариу</h2>'+sols+'</div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='4-р анги — өгүүлбэртэй бодлого (хүндэвтэр)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=19"></script>
</body>
</html>
