<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Хэрчмийн арга (нийлбэр-зөрүү) — 12 бодлого</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#16241c;--soft:#5a7064;--line:#cfe0d6;--forest:#13502e;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:#e9f1ec;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-family:inherit;font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;color:#fff;font-size:.9rem;background:var(--forest)}
  .btn.ghost{background:#fff;color:var(--forest);box-shadow:inset 0 0 0 1.5px var(--line)}
  .bar label{font-weight:700;color:var(--forest);display:flex;align-items:center;gap:6px;font-size:.9rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.3)}
  .head{text-align:center;border-bottom:2.5px solid var(--forest);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:var(--forest);font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #9bb3a6;padding:0 30px 2px 4px}
  .guide{background:#fff7e6;border:1px solid #f3dca6;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#8a5a00}
  .guide b{color:#7a4f00}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:7px 4px 8px;border-bottom:1px dashed #e6efe9}
  .qt{font-size:13.5px}.qt .qn{font-weight:800;color:var(--forest);margin-right:5px}
  .work{margin:7px 0 5px 0;height:22mm;border:1.3px solid #bcd3c4;border-radius:6px;background-image:linear-gradient(#eef,transparent 0),linear-gradient(#eee 1px,transparent 1px);background-size:100% 100%,100% 6mm}
  .ans2{font-size:12.5px;font-weight:700}.ans2 .bl{display:inline-block;min-width:46px;border-bottom:1.4px solid #6f8a7c;height:1.05em;margin:0 12px 0 4px}
  .ans-page{margin-top:9mm;border-top:2px dashed var(--line);padding-top:7mm}.ans-page h2{font-size:15px;color:var(--forest);margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 18px;font-size:12.5px}.ans-grid .an{color:var(--soft);font-weight:800}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn ghost" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var NAMES=['Бат','Болд','Дорж','Сараа','Туяа','Ану','Энх','Мөнх','Оюун','Тэмүүлэн'];
var ITEMSL=['алим','ном','дэвтэр','бал','чихэр','марк','бөмбөг','цэцэг','зураг'];
function build(){
  var probs='',answs='',WS=[],used={};
  for(var i=0;i<12;i++){
    var b=rnd(5,30),d=rnd(2,12),a=b+d,S=a+b;
    var n1=pick(NAMES),n2=pick(NAMES);while(n2===n1)n2=pick(NAMES);
    var it=pick(ITEMSL);
    var t=n1+', '+n2+' хоёр нийлээд '+S+' '+it+' цуглуулжээ. '+n1+' нь '+n2+'-ээс '+d+' '+it+'-аар илүү цуглуулсан бол тус бүр хэдэн '+it+' цуглуулсан бэ?';
    var k=i+1;
    probs+='<div class="q"><div class="qt"><span class="qn">'+k+'.</span>'+t+'</div><div class="work"></div>'
      +'<div class="ans2">'+n1+':<span class="bl"></span> '+n2+':<span class="bl"></span></div></div>';
    answs+='<div class="a"><span class="an">'+k+'.</span> '+n1+'='+a+', '+n2+'='+b+'</div>';
    WS.push({q:'\\text{'+n1+'+'+n2+'='+S+', зөрүү='+d+'}',a:'\\text{'+n1+'='+a+', '+n2+'='+b+'}'});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Хэрчмийн арга — нийлбэр ба зөрүү</h1><div class="sub">Хоёр хэрчмээр дүрсэлж бод · 12 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Анги: </span></div>'
    +'<div class="guide"><b>Хэрчмийн арга:</b> Их тоог урт хэрчмээр, бага тоог богино хэрчмээр зур. Зөрүү нь илүү гарсан хэсэг.<br>'
    +   '<b>Их тоо</b> = (нийлбэр + зөрүү) ÷ 2 &nbsp;·&nbsp; <b>Бага тоо</b> = (нийлбэр − зөрүү) ÷ 2</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='Хэрчмийн арга (нийлбэр-зөрүү)';
}
build();
</script>
<script src="/ws-store.js?v=9"></script>
</body>
</html>
