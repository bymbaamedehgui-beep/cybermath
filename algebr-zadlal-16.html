<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Үржигдэхүүнд задлах — 10-р анги (3.2)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .grp{margin-top:10px}.gh{font-weight:800;color:#5a32d6;font-size:12.5px;margin:8px 0 4px;display:flex;gap:7px;align-items:center}.gh .tag{background:#efeaff;color:#5a32d6;border-radius:6px;font-size:10.5px;padding:1px 7px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:5px 4px 6px;border-bottom:1px dashed #efeaff}
  .qeq{display:flex;gap:6px;align-items:baseline}.qn{font-weight:800;color:var(--purple);min-width:24px}.qm{font-size:14.5px}
  .bl{display:inline-block;min-width:100px;border-bottom:1.4px solid #b9accf;height:1.05em;margin-left:6px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:5px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function tl(terms){var s='',first=true;for(var i=0;i<terms.length;i++){var co=terms[i][0],sym=terms[i][1];if(co===0)continue;var sign=co<0?'-':'+',a=Math.abs(co),body=(sym==='')?(''+a):((a===1?'':a)+sym);if(first){s+=(co<0?'-':'')+body;first=false;}else{s+=' '+sign+' '+body;}}return s===''?'0':s;}
function lin(f){return tl([[f[0],'x'],[f[1],'']]);}
function mul(f,g){return [f[0]*g[0], f[0]*g[1]+g[0]*f[1], f[1]*g[1]];}
function quad(Q){return tl([[Q[0],'x^2'],[Q[1],'x'],[Q[2],'']]);}
function fp(a){return pick({2:[[1,2],[2,1]],3:[[1,3],[3,1]],4:[[2,2],[1,4],[4,1]],5:[[1,5],[5,1]],6:[[2,3],[3,2]]}[a]);}

function term(co,sym){if(co===0)return '';var a=Math.abs(co),body=(sym==='')?(''+a):((a===1?'':a)+sym);return (co<0?' - ':' + ')+body;}
function tCommon(){ // ерөнхий үржигдэхүүн (нэг гишүүнт, зарим нь радикалтай)
  if(rnd(0,1)){var c=rnd(2,6),d=rnd(2,5),e=nz(-6,6);
    return {q:tl([[c*d,'x^2'],[c*e,'x']]),ans:c+'x('+lin([d,e])+')',sol:'Ерөнхий үржигдэхүүн $'+c+'x$: $'+c+'x('+lin([d,e])+')$'};}
  var c=rnd(2,5),v=pick(['m','n','a']),d=pick([2,3,5]),e=pick([2,3,5]); // gcd(d,e)=1 болгоно
  while(d===e||(d%e===0)||(e%d===0))e=pick([2,3,4,5,7]);
  var cf=c+'x'+v; // максимал ерөнхий үржигдэхүүн
  return {q:(c*d)+'x^3'+v+' - '+(c*e)+'x'+v+'^3',ans:cf+'('+d+'x^2 - '+e+v+'^2)',
    sol:'Ерөнхий үржигдэхүүн $'+cf+'$: $'+cf+'('+d+'x^2 - '+e+v+'^2)$'};}
function tGroup(){ // бүлэглэх арга: (x+m)(x - n√v)
  var m=rnd(2,5),n=rnd(2,5),v=pick(['y','z','a']);
  var q='x^2'+term(m,'x')+' - '+(n===1?'':n)+'x\\sqrt{'+v+'} - '+(m*n)+'\\sqrt{'+v+'}';
  var ans='(x'+term(m,'')+')(x - '+(n===1?'':n)+'\\sqrt{'+v+'})';
  return {q:q,ans:ans,sol:'Бүлэглэвэл $x(x'+term(m,'')+') - '+(n===1?'':n)+'\\sqrt{'+v+'}(x'+term(m,'')+')='+ans+'$'};}
function tDiff2v(){ // квадратуудын ялгавар (2 хувьсагч)
  var p=rnd(1,4),q=rnd(2,6),v=pick(['y','b']);
  var Q=(p*p===1?'':p*p)+'x^2 - '+(q*q===1?'':q*q)+v+'^2';
  var f1=(p===1?'':p)+'x - '+(q===1?'':q)+v,f2=(p===1?'':p)+'x + '+(q===1?'':q)+v;
  return {q:Q,ans:'('+f1+')('+f2+')',sol:'Квадратуудын ялгавар: $('+f1+')('+f2+')$'};}
function tDiffFrac(){ // бутархай илтгэгчтэй ялгавар
  var k=pick([3,5,9]),q=rnd(2,4);
  var base='x^{\\frac{1}{'+k+'}}',sq='x^{\\frac{2}{'+k+'}}';
  return {q:sq+' - '+(q*q),ans:'('+base+' - '+q+')('+base+' + '+q+')',
    sol:'Квадратуудын ялгавар (бутархай илтгэгч, $'+base+'$-ыг суурь болгож): $('+base+' - '+q+')('+base+' + '+q+')$'};}
function tPerf(){var p=rnd(1,4),q=rnd(2,6),s=pick([1,-1]);var Q=quad(mul([p,s*q],[p,s*q]));
  return {q:Q,ans:'('+lin([p,s*q])+')^2',sol:(s>0?'Нийлбэрийн':'Ялгаврын')+' квадрат: $('+lin([p,s*q])+')^2$'};}
function tTri(){var a=pick([2,3,4,5,6]),lp=fp(a),F=[lp[0],nz(-4,4)],G=[lp[1],nz(-4,4)];
  while(F[0]*G[1]===G[0]*F[1]){G=[lp[1],nz(-4,4)];}
  var Q=quad(mul(F,G));return {q:Q,ans:'('+lin(F)+')('+lin(G)+')',sol:'$a='+a+'$ бүхий гурван гишүүнт (гүйцэд квадрат ялгах): $('+lin(F)+')('+lin(G)+')$'};}
function tSubRoot(){ // √x орлуулгатай гурван гишүүнт: (√x+a)(√x+b)
  var a=nz(-5,5),b=nz(-5,5);while(a===b)b=nz(-5,5);var s=a+b,p=a*b;
  var q='x'+term(s,'\\sqrt{x}')+term(p,'');
  var f1='\\sqrt{x}'+(a<0?' - '+(-a):' + '+a),f2='\\sqrt{x}'+(b<0?' - '+(-b):' + '+b);
  return {q:q,ans:'('+f1+')('+f2+')',sol:'$\\sqrt{x}=t$ гэвэл $t^2'+term(s,'t')+term(p,'')+'$-г задлаад буцаана: $('+f1+')('+f2+')$'};}

var SEC=[
  {name:'Ерөнхий үржигдэхүүн гаргах',gen:tCommon},
  {name:'Бүлэглэх арга',gen:tGroup},
  {name:'Квадратуудын ялгавар (хувьсагч/бутархай илтгэгч)',gen:function(){return rnd(0,1)?tDiff2v():tDiffFrac();}},
  {name:'Нийлбэр/ялгаврын квадрат',gen:tPerf},
  {name:'ax²+bx+c задлах (a=2..6)',gen:tTri},
  {name:'√x орлуулгатай гурван гишүүнт',gen:tSubRoot},
];
function build(){
  var groups='',answs='',WS=[],n=0;
  for(var s=0;s<SEC.length;s++){var qs='';
    for(var j=0;j<2;j++){n++;var p=SEC[s].gen();
      qs+='<div class="q"><div class="qeq"><span class="qn">'+n+'.</span><span class="qm">$'+p.q+'=$</span><span class="bl"></span></div></div>';
      answs+='<div class="a"><span class="an">'+n+'.</span><span>'+p.sol+'</span></div>';
      WS.push({q:p.q+'=',a:p.ans});
    }
    groups+='<div class="grp"><div class="gh"><span class="tag">'+(s+1)+'</span>'+SEC[s].name+'</div><div class="grid">'+qs+'</div></div>';
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Алгебрын илэрхийллийг үржигдэхүүнд задлах</h1><div class="sub">10-р анги · 3.2 · ерөнхий үржигдэхүүн · бүлэглэх · ялгавар (хувьсагч/бутархай илтгэгч) · ax²+bx+c · √x орлуулга · 12 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +groups
    +'<div class="ans-page" id="answers"><h2>Бодолт ба хариу</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='Үржигдэхүүнд задлах (10-р анги 3.2)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js"></script>
</body>
</html>
