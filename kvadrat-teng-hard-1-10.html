<style>

  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}

  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}

  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:30mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}

<script>
// ══════════ g10core.js — 10-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ── 10-р анги VI БҮЛЭГ (ТЭГШИТГЭЛ, ТЭНЦЭТГЭЛ БИШ) — ЗӨВХӨН ХҮНД ТҮВШНИЙ генераторууд ──
// g10core.js-ийн дараа залгагдана. Сурах бичгийн 67-86 хуудсын агуулгаас гарахгүй:
// 6.1 шугаман тэнцэтгэл биш ба систем, 6.2 квадрат тэгшитгэл (задлах, бүтэн квадрат,
// дискриминант, томьёо), 6.3 биквадрат ба рационал тэгшитгэл, 6.4 хоёр хувьсагчтай
// тэнцэтгэл биш, шийдийн муж, шугаман программчлал, 6.5 илтгэгч тэгшитгэл.

// ════════ Ерөнхий туслах ════════
var RELT={lt:'\\lt ',gt:'\\gt ',le:'\\le ',ge:'\\ge '};
var RELALL=['lt','gt','le','ge'];
function flipRel(r){return {lt:'gt',gt:'lt',le:'ge',ge:'le'}[r];}
function NEGE(){return {v:-Infinity,t:''};}
function POSE(){return {v:Infinity,t:''};}
function mkE(v,t){return {v:v,t:t};}
function ivTex(I){
 if(!I)return '\\varnothing';
 var L=(I.lo.v===-Infinity)?']-\\infty':((I.li?'[':']')+I.lo.t);
 var R=(I.hi.v===Infinity)?'+\\infty[':(I.hi.t+(I.ri?']':'['));
 return L+';\\ '+R;
}
function ivInt(A,B){
 if(!A||!B)return null;
 var lo,li,hi,ri;
 if(A.lo.v>B.lo.v){lo=A.lo;li=A.li;} else if(B.lo.v>A.lo.v){lo=B.lo;li=B.li;} else {lo=A.lo;li=A.li&&B.li;}
 if(A.hi.v<B.hi.v){hi=A.hi;ri=A.ri;} else if(B.hi.v<A.hi.v){hi=B.hi;ri=B.ri;} else {hi=A.hi;ri=A.ri&&B.ri;}
 if(lo.v>hi.v)return null;
 if(lo.v===hi.v&&!(li&&ri))return null;
 return {lo:lo,hi:hi,li:li,ri:ri};
}
function solveLinIv(a,c,rel){       // a\cdot x REL c, a!==0
 if(a<0)rel=flipRel(rel);
 var f=Fr(c,a),E=mkE(fVal(f),fTex(f));
 if(rel==='lt')return {lo:NEGE(),hi:E,li:false,ri:false};
 if(rel==='le')return {lo:NEGE(),hi:E,li:false,ri:true};
 if(rel==='gt')return {lo:E,hi:POSE(),li:false,ri:false};
 return {lo:E,hi:POSE(),li:true,ri:false};
}
function ivInts(I){                  // завсар доторх бүхэл тоонууд (хязгаарлагдмал)
 if(!I)return [];
 var lo=I.lo.v===-Infinity?null:I.lo.v, hi=I.hi.v===Infinity?null:I.hi.v;
 if(lo===null||hi===null)return null;
 var a=Math.ceil(lo-1e-9); if(!I.li&&Math.abs(a-lo)<1e-9)a+=1;
 var b=Math.floor(hi+1e-9); if(!I.ri&&Math.abs(b-hi)<1e-9)b-=1;
 var o=[];for(var k=a;k<=b;k++)o.push(k);
 return o;
}
// ── илэрхийллийн бичиглэл ──
function linT(a,b){
 var s;
 if(a===1)s='x'; else if(a===-1)s='-x'; else s=a+'x';
 if(b>0)s+='+'+b; else if(b<0)s+='-'+(-b);
 return s;
}
function linTv(a,b,v){
 var s;
 if(a===1)s=v; else if(a===-1)s='-'+v; else s=a+v;
 if(b>0)s+='+'+b; else if(b<0)s+='-'+(-b);
 return s;
}
function quadT(A,B,C){
 var s;
 if(A===1)s='x^{2}'; else if(A===-1)s='-x^{2}'; else s=A+'x^{2}';
 if(B===1)s+='+x'; else if(B===-1)s+='-x'; else if(B>0)s+='+'+B+'x'; else if(B<0)s+='-'+(-B)+'x';
 if(C>0)s+='+'+C; else if(C<0)s+='-'+(-C);
 return s;
}
function quadTv(A,B,C,v){
 var p2=v+'^{2}',s;
 if(A===1)s=p2; else if(A===-1)s='-'+p2; else s=A+p2;
 if(B===1)s+='+'+v; else if(B===-1)s+='-'+v; else if(B>0)s+='+'+B+v; else if(B<0)s+='-'+(-B)+v;
 if(C>0)s+='+'+C; else if(C<0)s+='-'+(-C);
 return s;
}
function br(n){return n<0?'\\bigl('+n+'\\bigr)':''+n;}
function lin2T(a,b,c,rel){          // ax+by REL c
 var s='';
 if(a!==0)s+=(a===1?'x':(a===-1?'-x':a+'x'));
 if(b!==0){
  if(s==='')s+=(b===1?'y':(b===-1?'-y':b+'y'));
  else if(b===1)s+='+y'; else if(b===-1)s+='-y'; else if(b>0)s+='+'+b+'y'; else s+='-'+(-b)+'y';
 }
 return s+RELT[rel]+c;
}
function ptT(x,y){return '\\bigl('+x+';\\ '+y+'\\bigr)';}
// ── язгуур ──
function sqSimp(D){var k=1,r=D;for(var d=2;d*d<=r;d++){while(r%(d*d)===0){r/=(d*d);k*=d;}}return {k:k,r:r};}
function sqT(D){var s=sqSimp(D);if(s.r===1)return ''+s.k;return (s.k===1?'':s.k)+'\\sqrt{'+s.r+'}';}
function setT(list){return list.length?'\\{'+list.join(';\\ ')+'\\}':'\\varnothing';}
// ── квадрат тэгшитгэлийн шийд ──
function quadRoots(a,b,c){           // a\ne 0 → {tex, vals, D}
 if(a<0){a=-a;b=-b;c=-c;}
 var D=b*b-4*a*c;
 if(D<0)return {tex:'\\varnothing',vals:[],D:D};
 if(D===0){var f0=Fr(-b,2*a);return {tex:setT([fTex(f0)]),vals:[fVal(f0)],D:0};}
 var s=isqrt(D);
 if(s!==null){
  var f1=Fr(-b-s,2*a),f2=Fr(-b+s,2*a);
  return {tex:setT([fTex(f1),fTex(f2)]),vals:[fVal(f1),fVal(f2)],D:D};
 }
 var sp=sqSimp(D),K=sp.k,r=sp.r;
 var g=gcd(gcd(Math.abs(b),K),2*a),B=-b/g,K2=K/g,Dn=2*a/g;
 function one(sg){
  var num;
  if(B===0)num=(sg<0?'-':'')+(K2===1?'':K2)+'\\sqrt{'+r+'}';
  else num=B+(sg<0?'-':'+')+(K2===1?'':K2)+'\\sqrt{'+r+'}';
  return Dn===1?num:'\\dfrac{'+num+'}{'+Dn+'}';
 }
 return {tex:setT([one(-1),one(1)]),vals:[(-b-Math.sqrt(D))/(2*a),(-b+Math.sqrt(D))/(2*a)],D:D};
}

// 1) Гурван бутархайтай тэнцэтгэл биш
function g_fracIneq2(){

   +'-\\bigl('+linT(C*(L/q),D*(L/q))+'\\bigr)'+RELT[rel]+linT(E*(L/r),F*(L/r))+'$ болно. '

function g_maxIntIneq(){

   if(K===0)continue;
   qq='\\dfrac{'+linT(a1,0)+'}{'+p+'}-\\dfrac{'+linT(b1,0)+'}{'+q1+'}'+RELT[rel]+c1;
   var Lc=p*q1;

   var iv1=solveLinIv(K,c1*Lc,rel);

   return {q:'$'+qq+'$',a:stp+' Ижил гишүүд цуглуулбал $'+linT(K,0)+RELT[rel]+(c1*Lc)+'$. '

// 8) Бүтэн квадрат ялгах арга
function g_completeSquare(){

  var half=Fr(p,2),hs=fMul(half,half);   // (p/2)^2

  var a='Бүтэн квадрат ялгая: $x^{2}'+(p>0?'+2\\cdot ':'-2\\cdot ')+fTex(Fr(Math.abs(p),2))+'\\cdot x+'
   +fTex(hs)+'-'+fTex(hs)+(q>0?'+':'-')+Math.abs(q)+'=0$ буюу $'+body+'='+fTex(rest)+'$. ';
  if(D<0)a+='Баруун тал сөрөг тул ямар ч бодит тооны квадрат түүнтэй тэнцэхгүй. Шийдийн олонлог: $\\varnothing$.';
  else if(D===0)a+='Баруун тал тэг тул давхардсан хоёр шийдтэй. Шийдийн олонлог: $'+R.tex+'$.';
  else a+='Эндээс $x'+(p>0?'+':'-')+fTex(Fr(Math.abs(p),2))+'=\\pm\\dfrac{'+sqT(D)+'}{2}$ болно. Шийдийн олонлог: $'+R.tex+'$.';

// 9) Хаалт нээж стандарт хэлбэрт шилжүүлэх
function g_quadToStd(){

}

// 10) Давхардсан шийдтэй байх параметр (урвуу бодлого)
function g_discParam(){

 var cst=a*a-b;

// 11) Шийдийн тоог параметрээр ангилах (тохиолдол ялгах)
function g_discCases(){
 for(var t=0;t<200;t++){
  var a=rnd(1,5),b=nz(-8,8),c=nz(-6,6);
  if(b===0)continue;
  var m0f=fAdd(Fr(a,1),Fr(b*b,4*c));     // D=0 ⇔ m = a + b^2/(4c)
  var m0=fVal(m0f);
  if(Math.abs(m0-a)<0.2||Math.abs(m0)>30)continue;
  var qq='$\\bigl(m-'+a+'\\bigr)x^{2}'+(b>0?'+'+b:'-'+(-b))+'x'+(c>0?'+'+c:'-'+(-c))+'=0$';
  // D = b^2 - 4c(m-a);  c>0 → D>0 ⇔ m<m0 ;  c<0 → D>0 ⇔ m>m0
  var lowCnt,highCnt;
  if(c>0){lowCnt=2;highCnt=0;} else {lowCnt=0;highCnt=2;}
  var parts=[],lo=Math.min(a,m0),hi=Math.max(a,m0);
  var loT=(lo===a)?''+a:fTex(m0f), hiT=(hi===a)?''+a:fTex(m0f);
  function cntAt(mv){ // m<m0 бол lowCnt, m>m0 бол highCnt
   return mv<m0?lowCnt:highCnt;
  }
  var segs=[];
  segs.push({cond:'m\\lt '+loT,cnt:(lo===a)?cntAt(lo-1):cntAt(lo-1)});
  segs.push({cond:'m='+loT,cnt:(lo===a)?1:1});
  segs.push({cond:loT+'\\lt m\\lt '+hiT,cnt:cntAt((lo+hi)/2)});
  segs.push({cond:'m='+hiT,cnt:1});

// 16) Рационал тэгшитгэл — квадрат тэгшитгэлд шилжих
function g_ratEqLinear(){
 for(var t=0;t<600;t++){
  var p=nz(-6,6),q=nz(-6,6);
  if(p===-q)continue;
  var A=rnd(-9,9),B=rnd(-9,9),C=nz(-4,4);
  if(A===0&&B===0)continue;
  // A/(x-p) + B/(x+q) = C  →  A(x+q)+B(x-p) = C(x-p)(x+q)
  var a2=C,b2=C*(q-p)-A-B,c2=B*p-A*q-C*p*q;
  if(a2===0)continue;
  var D=b2*b2-4*a2*c2;
  if(D<=0||isqrt(D)===null)continue;
  var R=quadRoots(a2,b2,c2);
  var ok=true;
  R.vals.forEach(function(v){if(Math.abs(v-p)<1e-9||Math.abs(v+q)<1e-9)ok=false;});
  if(!ok)continue;
  var qq='$\\dfrac{'+A+'}{'+linT(1,-p)+'}+\\dfrac{'+B+'}{'+linT(1,q)+'}='+C+'$';
  var aa='ТХМ: $x\\ne '+p+'$, $x\\ne '+(-q)+'$. Хоёр талыг $\\bigl('+linT(1,-p)+'\\bigr)\\bigl('+linT(1,q)+'\\bigr)$-д үржүүлбэл $'
   +br(A)+'\\bigl('+linT(1,q)+'\\bigr)+'+br(B)+'\\bigl('+linT(1,-p)+'\\bigr)='+br(C)+'\\bigl('+linT(1,-p)+'\\bigr)\\bigl('+linT(1,q)+'\\bigr)$ болно. '
   +'Хураавал $'+quadT(a2,b2,c2)+'=0$, $D='+D+'$, $\\sqrt{D}='+isqrt(D)+'$. '
   +'Хоёр шийд хоёулаа ТХМ-д хамаарна. Шийдийн олонлог: $'+R.tex+'$.';
  return {q:qq,a:aa,key:'rel|'+[p,q,A,B,C].join(',')};
 }
 return null;
}

function triRegion(){                        // гурвалжин муж → 3 тэнцэтгэл биш
 for(var t=0;t<400;t++){
  var V=[];
  for(var i=0;i<3;i++)V.push([rnd(-5,6),rnd(-4,6)]);
  var ar=(V[1][0]-V[0][0])*(V[2][1]-V[0][1])-(V[2][0]-V[0][0])*(V[1][1]-V[0][1]);
  if(Math.abs(ar)<8||Math.abs(ar)>60)continue;
  var ineqs=[],ok=true;
  for(var k=0;k<3;k++){
   var P=V[k],Q=V[(k+1)%3],R=V[(k+2)%3];
   var a=Q[1]-P[1],b=P[0]-Q[0],c=a*P[0]+b*P[1];
   var g=gcd(gcd(Math.abs(a),Math.abs(b)),Math.abs(c)||1);
   if(g>1){a/=g;b/=g;c/=g;}
   var val=a*R[0]+b*R[1];
   var rel=(val<c)?'le':'ge';
   if(a<0||(a===0&&b<0)){a=-a;b=-b;c=-c;rel=flipRel(rel);}
   if(Math.abs(a)>9||Math.abs(b)>9||Math.abs(c)>40){ok=false;break;}
   ineqs.push({a:a,b:b,c:c,rel:rel});
  }
  if(!ok)continue;
  var sig={};var dup=false;
  ineqs.forEach(function(I){var kk=I.a+','+I.b;if(sig[kk])dup=true;sig[kk]=1;});
  if(dup)continue;
  V.sort(function(p,q){return p[0]-q[0]||p[1]-q[1];});
  return {V:V,I:ineqs};
 }
 return null;
}
function sysTex(I){
 return '$\\begin{cases}'+I.map(function(x){return lin2T(x.a,x.b,x.c,x.rel);}).join('\\\\ ')+'\\end{cases}$';
}
function inRegion(I,x,y){
 for(var i=0;i<I.length;i++){
  var v=I[i].a*x+I[i].b*y,c=I[i].c;
  if(I[i].rel==='le'&&v>c+1e-9)return false;
  if(I[i].rel==='ge'&&v<c-1e-9)return false;
 }
 return true;
}

// 22) Урвуу — хагас хавтгайг илэрхийлэх тэнцэтгэл биш зохиох
function g_halfPlaneWrite(){
 for(var t=0;t<300;t++){
  var P=[rnd(-6,6),rnd(-6,6)],Q=[rnd(-6,6),rnd(-6,6)];
  if(P[0]===Q[0]&&P[1]===Q[1])continue;
  var a=Q[1]-P[1],b=P[0]-Q[0],c=a*P[0]+b*P[1];
  var g=gcd(gcd(Math.abs(a),Math.abs(b)),Math.abs(c)||1);
  if(g>1){a/=g;b/=g;c/=g;}
  if(a<0||(a===0&&b<0)){a=-a;b=-b;c=-c;}
  var C=[rnd(-6,6),rnd(-6,6)];
  var val=a*C[0]+b*C[1];
  if(val===c)continue;
  if(Math.abs(a)>7||Math.abs(b)>7||Math.abs(c)>30)continue;
  var closed=rnd(0,1)===1;
  var rel=(val<c)?(closed?'le':'lt'):(closed?'ge':'gt');
  var qq='$A'+ptT(P[0],P[1])+'$, $B'+ptT(Q[0],Q[1])+'$ цэгүүдийг дайрсан шулуунаар зааглагдсан, $C'
   +ptT(C[0],C[1])+'$ цэгийг агуулсан '+(closed?'хаалттай':'нээлттэй')+' хагас хавтгай.';
  var aa='$A$, $B$ цэгүүдийг дайрсан шулууны тэгшитгэл нь $'+lin2T(a,b,c,'le').replace(RELT.le,'=')+'$ болно '
   +'(хоёр цэгийн координатыг орлуулж шалгаж болно). $C$ цэгийн координатыг зүүн талд орлуулбал $'
   +val+(val<c?'\\lt ':'\\gt ')+c+'$ гарах тул $C$ нь хилийн '+(val<c?'нэг':'нөгөө')+' талд оршино. '
   +'Хил нь '+(closed?'мужид орох тул тэнцэтгэлтэй':'мужид орохгүй тул эрс')+' тэмдэг авна. '
   +'Хариу: $'+lin2T(a,b,c,rel)+'$.';
  return {q:qq,a:aa,key:'hp|'+[P[0],P[1],Q[0],Q[1],C[0],C[1],closed?1:0].join(',')};
 }
 return null;
}

  return {q:'X тэжээлийн нэгж бүрд $'+p1+'$ г протейн, $'+f1+'$ г тос агуулагдах ба үнэ нь $'+c1
   +'$ төгрөг. Y тэжээлийн нэгжид $'+p2+'$ г протейн, $'+f2+'$ г тос агуулагдах ба үнэ нь $'+c2
   +'$ төгрөг. Хольц бүрд дор хаяж $'+P+'$ г протейн, $'+F+'$ г тос байх ёстой. Хамгийн бага өртгийг ол.',

 }
 var a1=pick([2,3,4]),a2=pick([2,3,4,5]),b1=pick([3,4,5,6]),b2=pick([2,3,4]);
 if(a1===a2&&b1===b2)return null;
 var M=pick([24,30,36,40,48]),R=pick([30,36,40,48,60]);
 var d1=pick([3,4,5,6]),d2=pick([3,4,5,6]);
 var cand2=[[0,0]];
 if(a1!==0)cand2.push([M/a1,0]); if(b1!==0)cand2.push([R/b1,0]);
 if(a2!==0)cand2.push([0,M/a2]); if(b2!==0)cand2.push([0,R/b2]);

 if(det2!==0)cand2.push([(M*b2-a2*R)/det2,(a1*R-M*b1)/det2]);
 var fe=cand2.filter(function(v){return v[0]>=-1e-9&&v[1]>=-1e-9&&a1*v[0]+a2*v[1]<=M+1e-6&&b1*v[0]+b2*v[1]<=R+1e-6;});
 if(!fe.length)return null;

function powNum(b,e){var r=1;for(var i=0;i<e;i++)r*=b;return r;}

// 25) Ижил суурьт шилжүүлэх — квадрат илтгэгчтэй
function g_expSameBaseQuad(){
 for(var t=0;t<300;t++){
  var form=rnd(1,3);
  if(form===1){
   var a=pick([2,3,5,7,10]),b=nz(-7,7),c=nz(-7,7),d=nz(-9,9);
   var A=1,B=b-c,C=-d;
   var D=B*B-4*A*C;
   if(D<0)continue;
   var R=quadRoots(A,B,C);
   return {q:'$'+a+'^{x^{2}'+(b>0?'+'+b:'-'+(-b))+'x}='+a+'^{'+linT(c,d)+'}$',
    a:'Суурь ижил тул илтгэгчүүд тэнцүү: $x^{2}'+(b>0?'+'+b:'-'+(-b))+'x='+linT(c,d)+'$. '
     +'Эндээс $'+quadT(1,B,C)+'=0$, $D='+D+'$. Шийдийн олонлог: $'+R.tex+'$.',
    key:'esb1|'+[a,b,c,d].join(',')};
  }
  if(form===2){
   var u=pick([2,3,5]),i=rnd(2,4),j=rnd(1,3);
   if(i===j)continue;
   var B1=powNum(u,i),B2=powNum(u,j);
   var p=nz(-6,6),q1=nz(-9,9),r=nz(-6,6),s=nz(-9,9);
   var K=i*p-j*r, M=i*q1-j*s;
   if(K===0)continue;
   var f=Fr(-M,K);
   return {q:'$'+B1+'^{'+linT(p,q1)+'}='+B2+'^{'+linT(r,s)+'}$',
    a:'Хоёр талыг $'+u+'$ суурьт шилжүүлбэл $\\bigl('+powTex(''+u,i)+'\\bigr)^{'+linT(p,q1)+'}=\\bigl('+powTex(''+u,j)
     +'\\bigr)^{'+linT(r,s)+'}$ буюу $'+u+'^{'+linT(i*p,i*q1)+'}='+u+'^{'+linT(j*r,j*s)+'}$ болно. '
     +'Илтгэгчүүдийг тэнцүүлбэл $'+linT(i*p,i*q1)+'='+linT(j*r,j*s)+'$, эндээс $'+linT(K,0)+'='+(-M)+'$. '
     +'Шийдийн олонлог: $'+setT([fTex(f)])+'$.',
    key:'esb2|'+[u,i,j,p,q1,r,s].join(',')};
  }
  var a3=pick([2,3,5]),b3=nz(-6,6),c3=nz(-6,6),d3=nz(-9,9);
  // (1/a)^{x^2+bx} = a^{cx+d}  →  -(x^2+bx) = cx+d
  var A3=1,B3=b3+c3,C3=d3;
  var D3=B3*B3-4*A3*C3;
  if(D3<0)continue;
  var R3=quadRoots(A3,B3,C3);
  return {q:'$\\bigl(\\dfrac{1}{'+a3+'}\\bigr)^{x^{2}'+(b3>0?'+'+b3:'-'+(-b3))+'x}='+a3+'^{'+linT(c3,d3)+'}$',
   a:'$\\dfrac{1}{'+a3+'}='+a3+'^{-1}$ тул зүүн тал нь $'+a3+'^{-x^{2}'+(b3>0?'-'+b3:'+'+(-b3))+'x}$ болно. '
    +'Илтгэгчүүдийг тэнцүүлбэл $-x^{2}'+(b3>0?'-'+b3:'+'+(-b3))+'x='+linT(c3,d3)+'$ буюу $'+quadT(1,B3,C3)+'=0$. '
    +'$D='+D3+'$. Шийдийн олонлог: $'+R3.tex+'$.',
   key:'esb3|'+[a3,b3,c3,d3].join(',')};
 }
 return null;
}

// 28) Нэгэн төрлийн илтгэгч тэгшитгэл
function g_expHomogeneous(){
 for(var t=0;t<200;t++){
  var pr=pick([[2,3],[3,2],[2,5],[5,2],[3,5],[5,3],[2,7],[3,4],[4,3],[5,4]]);
  var a=pr[0],b=pr[1],k=rnd(1,2),n=rnd(1,5);
  var A=powNum(b,k),Bc=powNum(b,k)*n-powNum(a,k),C=-powNum(a,k)*n;
  if(Math.abs(A)>60||Math.abs(Bc)>90||Math.abs(C)>90)continue;
  if(Bc===0)continue;
  var qq='$'+A+'\\cdot '+a+'^{2x}'+(Bc>0?'+'+Bc:'-'+(-Bc))+'\\cdot '+(a*b)+'^{x}'+(C>0?'+'+C:'-'+(-C))+'\\cdot '+b+'^{2x}=0$';
  var tt=(k===1?'\\dfrac{'+a+'}{'+b+'}':'\\dfrac{'+powNum(a,k)+'}{'+powNum(b,k)+'}');
  var aa='Хоёр талыг $'+b+'^{2x}\\gt 0$-д хуваавал $'+A+'\\cdot \\bigl(\\dfrac{'+a+'}{'+b+'}\\bigr)^{2x}'
   +(Bc>0?'+'+Bc:'-'+(-Bc))+'\\cdot \\bigl(\\dfrac{'+a+'}{'+b+'}\\bigr)^{x}'+(C>0?'+'+C:'-'+(-C))+'=0$ болно. '
   +'$\\bigl(\\dfrac{'+a+'}{'+b+'}\\bigr)^{x}=y$ орлуулбал $'+quadTv(A,Bc,C,'y')+'=0$, эндээс $y='+tt+'$ эсвэл $y='+(-n)+'$. '
   +'$y='+(-n)+'$ нь сөрөг тул тохирохгүй. $\\bigl(\\dfrac{'+a+'}{'+b+'}\\bigr)^{x}='+tt+'='
   +powTex('\\bigl(\\dfrac{'+a+'}{'+b+'}\\bigr)',k)+'$ тул $x='+k+'$. Шийдийн олонлог: $'+setT([''+k])+'$.';
  return {q:qq,a:aa,key:'eh|'+[a,b,k,n].join(',')};
 }
 return null;
}

// 29) Шийдүүдийн нийлбэр
function g_expSumRoots(){
 for(var t=0;t<300;t++){
  var a=pick([2,3,5,7]),form=rnd(1,3);
  if(form===1){
   var b=nz(-8,8),c=nz(-9,9),d=nz(-9,9);
   var C1=c-d,D1=b*b-4*C1;
   if(D1<=0)continue;
   var R=quadRoots(1,b,C1);
   return {q:'$'+a+'^{x^{2}'+(b>0?'+'+b:'-'+(-b))+'x'+(c>0?'+'+c:'-'+(-c))+'}='+powTex(''+a,d)+'$',
    a:'Суурь ижил тул илтгэгчүүд тэнцүү: $x^{2}'+(b>0?'+'+b:'-'+(-b))+'x'+(c>0?'+'+c:'-'+(-c))+'='+d+'$ буюу $'
     +quadT(1,b,C1)+'=0$. $D='+D1+'\\gt 0$ тул хоёр шийдтэй. Шийдийн олонлог: $'+R.tex
     +'$, нийлбэр: $'+(-b)+'$.',
    key:'esr1|'+[a,b,c,d].join(',')};
  }
  if(form===2){
   var b2=nz(-8,8),d2=rnd(1,9);
   var D2=b2*b2-4*d2;
   if(D2<=0)continue;
   var R2=quadRoots(1,b2,d2);
   return {q:'$'+a+'^{x^{2}'+(b2>0?'+'+b2:'-'+(-b2))+'x}=\\dfrac{1}{'+powTex(''+a,d2)+'}$',
    a:'$\\dfrac{1}{'+powTex(''+a,d2)+'}='+a+'^{-'+d2+'}$ тул илтгэгчүүд тэнцүү: $x^{2}'+(b2>0?'+'+b2:'-'+(-b2))
     +'x=-'+d2+'$ буюу $'+quadT(1,b2,d2)+'=0$. $D='+D2+'$. Шийдийн олонлог: $'+R2.tex+'$, нийлбэр: $'+(-b2)+'$.',
    key:'esr2|'+[a,b2,d2].join(',')};
  }
  var b3=nz(-9,9);
  return {q:'$'+a+'^{x^{2}'+(b3>0?'-'+b3:'+'+(-b3))+'x}=1$',
   a:'$1='+a+'^{0}$ тул илтгэгч нь тэгтэй тэнцүү: $x^{2}'+(b3>0?'-'+b3:'+'+(-b3))+'x=0$ буюу $x\\bigl('
    +linT(1,-b3)+'\\bigr)=0$. Шийдийн олонлог: $'+setT(b3>0?['0',''+b3]:[''+b3,'0'])+'$, нийлбэр: $'+b3+'$.',
   key:'esr3|'+a+','+b3};
 }
 return null;
}

// 30) Графикийн арга — шийдийн тоо
function g_expGraphCount(){
 var T=rnd(1,6);
 if(T===1){
  var a=pick([2,3,5]),c=rnd(2,8);
  return {q:'$'+a+'^{x}='+c+'-x$',fig:blankPlane(6),
   a:'$y='+a+'^{x}$ нь өсөх функц, $y='+c+'-x$ нь буурах шулуун. Өсөх ба буурах функцийн график хамгийн ихдээ нэг цэгт огтлолцоно. '
    +'$x=0$ үед $1\\lt '+c+'$, $x='+c+'$ үед $'+a+'^{'+c+'}\\gt 0$ тул огтлолцол заавал байна. Хариу: $1$ шийдтэй.',
   key:'egc1|'+a+','+c};
 }
 if(T===2){
  var a2=pick([2,3,4,5]);
  return {q:'$\\bigl(\\dfrac{1}{'+a2+'}\\bigr)^{x}=-x^{2}$',fig:blankPlane(6),
   a:'Илтгэгч функцийн утгын муж нь $]0;\\ +\\infty[$ тул зүүн тал үргэлж эерэг. Баруун тал $-x^{2}\\le 0$. '
    +'Иймд графикууд огт огтлолцохгүй. Хариу: $0$ шийдтэй.',key:'egc2|'+a2};
 }
 if(T===3){
  var a3=pick([2,3,5]),k=rnd(2,5);
  return {q:'$'+a3+'^{x}=-\\dfrac{x}{'+k+'}$',fig:blankPlane(6),
   a:'Зүүн тал үргэлж эерэг тул $-\\dfrac{x}{'+k+'}\\gt 0$ буюу $x\\lt 0$ байх ёстой. '
    +'$x\\lt 0$ мужид $y='+a3+'^{x}$ өсөх, $y=-\\dfrac{x}{'+k+'}$ буурах тул яг нэг огтлолцол байна. Хариу: $1$ шийдтэй.',
   key:'egc3|'+a3+','+k};
 }
 if(T===4){
  return {q:'$2^{x}=x^{2}$',fig:blankPlane(6),
   a:'$x=2$ ба $x=4$ үед $4=4$, $16=16$ болж тэнцэнэ. Мөн $x\\lt 0$ мужид $y=2^{x}$ буурч $0$ руу тэмүүлэх ба '
    +'$y=x^{2}$ өсдөг тул нэг огтлолцол байна. Хариу: $3$ шийдтэй.',key:'egc4|0'};
 }
 if(T===5){
  var a5=pick([2,3]),b5=pick([2,3,5]);
  return {q:'$'+a5+'^{x}=\\bigl(\\dfrac{1}{'+b5+'}\\bigr)^{x}+1$',fig:blankPlane(6),
   a:'Зүүн тал өсөх, баруун тал буурах функц тул хамгийн ихдээ нэг огтлолцолтой. '
    +'$x=0$ үед $1\\lt 2$, $x=1$ үед $'+a5+'\\gt 1+\\dfrac{1}{'+b5+'}$ тул завсарт огтлолцол байна. Хариу: $1$ шийдтэй.',
   key:'egc5|'+a5+','+b5};
 }
 var a6=pick([2,3,5,7]),c6=rnd(1,9);
 return {q:'$'+a6+'^{x}=-'+c6+'$',fig:blankPlane(6),
  a:'$y='+a6+'^{x}$ функцийн утгын муж $]0;\\ +\\infty[$ тул сөрөг утга авахгүй. Хариу: $0$ шийдтэй.',
  key:'egc6|'+a6+','+c6};
}
var WSPEC={"title":"Квадрат тэгшитгэл бодох аргууд — хүнд","sub":"Тэгшитгэл, тэнцэтгэл биш · VI бүлэг · 10-р анги","rule":"<b>Санамж:</b> $ax^{2}+bx+c=0$ $\\bigl(a\\ne 0\\bigr)$ тэгшитгэлийн дискриминант $D=b^{2}-4ac$. $D\\gt 0$ бол ялгаатай хоёр, $D=0$ бол давхардсан хоёр, $D\\lt 0$ бол бодит шийдгүй. Шийд нь $x_{1,2}=\\dfrac{-b\\pm\\sqrt{D}}{2a}$. Бүтэн квадрат ялгах арга: $x^{2}+px+q=\\bigl(x+\\dfrac{p}{2}\\bigr)^{2}-\\dfrac{p^{2}}{4}+q$.","ref":"","tasks":[{"label":"Дискриминант олж, томьёогоор бод. Язгуурыг хялбарчилж бич.","fn":"g_quadFormulaIrr","cap":5,"cols":2,"wk":28},{"label":"Бүтэн квадрат ялгах аргаар бод.","fn":"g_completeSquare","cap":5,"cols":2,"wk":30},{"label":"$ax^{2}+bx+c=0$ хэлбэрт шилжүүлж бод.","fn":"g_quadToStd","cap":4,"cols":1,"wk":30}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
