<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тэнцэтгэл биш — график байгуулан бодох (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:17px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#7a4f00}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:13.5px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:28mm;margin-top:5px}
  .wkrow{display:flex;gap:8px;align-items:flex-start;margin-top:5px}
  .vt{border-collapse:collapse;font-size:9px;flex-shrink:0}
  .vt th,.vt td{border:1px solid #d9d0f2;width:23px;height:16.5px;text-align:center}
  .vt th{background:#f3eefe;color:#5a32d6;font-weight:800}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  .ask{display:flex;align-items:center;gap:8px}.ask .g{flex-shrink:0}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function opD(op){return {'>':'>','<':'<','ge':'\\ge','le':'\\le'}[op];}
// Тохирсон алхам сонгох
function niceStep(span,target){var raw=span/target;if(raw<=0)return 1;var pow=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));var fr=raw/pow;var s=fr<1.5?1:fr<3?2:fr<7?5:10;return s*pow;}
// Параболдоо тохирсон координатын хавтгай (домэйн автоматаар өөрчлөгдөнө)
function blankGrid(spec){var W=176,H=152,padL=4,padR=4,padT=4,padB=4;var f,vx,feats;
  if(spec.kind==='two'){f=function(x){return spec.s*(x-spec.r1)*(x-spec.r2);};vx=(spec.r1+spec.r2)/2;feats=[spec.r1,spec.r2];}
  else if(spec.kind==='one'){f=function(x){return spec.s*(x-spec.r0)*(x-spec.r0);};vx=spec.r0;feats=[spec.r0];}
  else{f=function(x){return spec.s*((x-spec.h)*(x-spec.h)+(spec.d||1));};vx=spec.h;feats=[spec.h];}
  var xa=feats.concat([0,vx]);var xmin=Math.floor(Math.min.apply(null,xa)-1.5),xmax=Math.ceil(Math.max.apply(null,xa)+1.5);
  if(xmax-xmin<6){var ext=6-(xmax-xmin);xmin-=Math.ceil(ext/2);xmax+=Math.floor(ext/2);}
  var ys=[0];for(var x=xmin;x<=xmax+0.001;x+=0.5)ys.push(f(x));
  var ylo=Math.min.apply(null,ys),yhi=Math.max.apply(null,ys);var yStep=niceStep(Math.max(yhi-ylo,2),6);
  ylo=Math.floor(ylo/yStep)*yStep-yStep*0.15;yhi=Math.ceil(yhi/yStep)*yStep+yStep*0.15;
  var xStep=Math.max(1,Math.round(niceStep(xmax-xmin,8)));
  function PX(x){return padL+(x-xmin)/(xmax-xmin)*(W-padL-padR);}function PY(y){return padT+(yhi-y)/(yhi-ylo)*(H-padT-padB);}
  var x0=PX(0),y0=PY(0),g='';
  for(var gx=Math.ceil(xmin/xStep)*xStep;gx<=xmax+0.001;gx+=xStep){var px=PX(gx);g+='<line x1="'+px.toFixed(1)+'" y1="0" x2="'+px.toFixed(1)+'" y2="'+H+'" stroke="#eef" stroke-width="1"/>';}
  for(var gy=Math.ceil(ylo/yStep)*yStep;gy<=yhi+0.001;gy+=yStep){var py=PY(gy);g+='<line x1="0" y1="'+py.toFixed(1)+'" x2="'+W+'" y2="'+py.toFixed(1)+'" stroke="#eef" stroke-width="1"/>';}
  g+='<line x1="0" y1="'+y0.toFixed(1)+'" x2="'+W+'" y2="'+y0.toFixed(1)+'" stroke="#8a86a8" stroke-width="1.3"/><line x1="'+x0.toFixed(1)+'" y1="0" x2="'+x0.toFixed(1)+'" y2="'+H+'" stroke="#8a86a8" stroke-width="1.3"/>';
  g+='<path d="M'+(W-1)+' '+y0.toFixed(1)+' l-5,-3 l0,6 z" fill="#8a86a8"/><path d="M'+x0.toFixed(1)+' 1 l-3,5 l6,0 z" fill="#8a86a8"/>';
  for(var tx=Math.ceil(xmin/xStep)*xStep;tx<=xmax+0.001;tx+=xStep){if(tx===0)continue;g+='<text x="'+PX(tx).toFixed(1)+'" y="'+(y0+8).toFixed(1)+'" font-size="6.5" fill="#b7b3ca" text-anchor="middle">'+tx+'</text>';}
  for(var ty=Math.ceil(ylo/yStep)*yStep;ty<=yhi+0.001;ty+=yStep){if(ty===0)continue;g+='<text x="'+(x0-3).toFixed(1)+'" y="'+(PY(ty)+2.4).toFixed(1)+'" font-size="6.5" fill="#b7b3ca" text-anchor="end">'+ty+'</text>';}
  g+='<text x="'+(W-6)+'" y="'+(y0-4).toFixed(1)+'" font-size="8" fill="#999" font-style="italic">x</text><text x="'+(x0+4).toFixed(1)+'" y="9" font-size="8" fill="#999" font-style="italic">y</text><text x="'+(x0-4).toFixed(1)+'" y="'+(y0+8).toFixed(1)+'" font-size="7" fill="#b7b3ca">O</text>';
  return '<svg width="'+W+'" height="'+H+'" style="display:block;margin:0;border:1px solid #ece7fb;border-radius:6px;background:#fff">'+g+'</svg>';}
// Босоо утгын хүснэгт (x | y)
function blankTable(rows){rows=rows||6;var r='';for(var i=0;i<rows;i++)r+='<tr><td></td><td></td></tr>';return '<table class="vt"><tr><th>x</th><th>y</th></tr>'+r+'</table>';}
function qs(a,b,c){var t=(a===1?'x^2':a===-1?'-x^2':a+'x^2');if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
function graphSVG(spec){var W=140,H=104,padL=13,padR=7,padT=7,padB=15;var f,xmin,xmax,inter=[];
  if(spec.kind==='two'){var r1=spec.r1,r2=spec.r2;f=function(x){return spec.s*(x-r1)*(x-r2);};var c=(r1+r2)/2,hh=(r2-r1)/2;xmin=c-hh-1.6;xmax=c+hh+1.6;inter=[r1,r2];}
  else if(spec.kind==='one'){var r0=spec.r0;f=function(x){return spec.s*(x-r0)*(x-r0);};xmin=r0-2.2;xmax=r0+2.2;inter=[r0];}
  else{var h=spec.h;f=function(x){return spec.s*((x-h)*(x-h)+1.3);};xmin=h-2.2;xmax=h+2.2;inter=[];}
  var N=44,xs=[],ys=[];for(var i=0;i<=N;i++){var x=xmin+(xmax-xmin)*i/N;xs.push(x);ys.push(f(x));}
  var ymin=Math.min.apply(null,ys.concat([0])),ymax=Math.max.apply(null,ys.concat([0]));var yr=(ymax-ymin)||1;ymin-=yr*0.13;ymax+=yr*0.13;
  function PX(x){return padL+(x-xmin)/(xmax-xmin)*(W-padL-padR);}function PY(y){return padT+(ymax-y)/(ymax-ymin)*(H-padT-padB);}
  var y0=PY(0),yx=(0>=xmin&&0<=xmax)?PX(0):padL+2;
  var g='<line x1="2" y1="'+y0.toFixed(1)+'" x2="'+(W-2)+'" y2="'+y0.toFixed(1)+'" stroke="#999" stroke-width="1"/><line x1="'+yx.toFixed(1)+'" y1="2" x2="'+yx.toFixed(1)+'" y2="'+(H-2)+'" stroke="#999" stroke-width="1"/>';
  var d='';for(var i=0;i<=N;i++){d+=(i?'L':'M')+PX(xs[i]).toFixed(1)+' '+PY(ys[i]).toFixed(1)+' ';}
  g+='<path d="'+d+'" fill="none" stroke="#16a34a" stroke-width="1.8"/>';
  inter.forEach(function(r){var px=PX(r);g+='<circle cx="'+px.toFixed(1)+'" cy="'+y0.toFixed(1)+'" r="2.3" fill="#dc2626"/><text x="'+px.toFixed(1)+'" y="'+(y0+10).toFixed(1)+'" font-size="8" text-anchor="middle" fill="#b91c1c" font-weight="700">'+r+'</text>';});
  return '<svg width="'+W+'" height="'+H+'" style="vertical-align:middle" class="g">'+g+'</svg>';}
var ALLR='x\\in\\mathbb{R}',NONE='\\varnothing\\ (\\text{шийдгүй})';
function ivOut(r1,r2,cl){return 'x\\in\\,]{-}\\infty,'+r1+(cl?']':'[')+'\\cup'+(cl?'[':']')+r2+',{+}\\infty[';}
function ivBtw(r1,r2,cl){return 'x\\in\\,'+(cl?'[':']')+r1+','+r2+(cl?']':'[');}
function ivNe(r0){return 'x\\in\\mathbb{R},\\ x\\ne'+r0;}
function solveGraph(spec){var s=spec.s;
  if(spec.kind==='two'){var r1=spec.r1,r2=spec.r2;if(s>0)return {gt:ivOut(r1,r2,0),lt:ivBtw(r1,r2,0),ge:ivOut(r1,r2,1),le:ivBtw(r1,r2,1)};return {gt:ivBtw(r1,r2,0),lt:ivOut(r1,r2,0),ge:ivBtw(r1,r2,1),le:ivOut(r1,r2,1)};}
  if(spec.kind==='one'){var r0=spec.r0;if(s>0)return {gt:ivNe(r0),lt:NONE,ge:ALLR,le:'x='+r0};return {gt:NONE,lt:ivNe(r0),ge:'x='+r0,le:ALLR};}
  if(s>0)return {gt:ALLR,lt:NONE,ge:ALLR,le:NONE};return {gt:NONE,lt:ALLR,ge:NONE,le:ALLR};}
function solOf(spec,op){var m=solveGraph(spec);return m[{'>':'gt','<':'lt','ge':'ge','le':'le'}[op]];}
function aTxt(s){return s>0?'$a>0$ тул салаа <b>дээш</b>':'$a<0$ тул салаа <b>доош</b>';}
// D>0 бүхэл язгуур
function gD2(){var r1,r2;do{r1=nz(-5,5);r2=nz(-5,5);}while(r1===r2);r1=Math.min(r1,r2)===r1?Math.min(r1,r2):r1;var lo=Math.min(r1,r2),hi=Math.max(r1,r2);r1=lo;r2=hi;var s=pick([1,-1]),op=pick(['>','<','ge','le']);
  var a=s,b=-s*(r1+r2),c=s*r1*r2;var sp={kind:'two',s:s,r1:r1,r2:r2};
  return {q:'$'+qs(a,b,c)+' '+opD(op)+' 0$',a:aTxt(s)+'. $D>0$, язгуур $x_1='+r1+',\\ x_2='+r2+'$. '+graphSVG(sp)+' Шийд: $'+solOf(sp,op)+'$',ok:true,spec:sp,key:qs(a,b,c)+op};}
// D=0 давхар язгуур
function gD0(){var r0=nz(-4,4),s=pick([1,-1]),op=pick(['>','<','ge','le']);var a=s,b=-2*s*r0,c=s*r0*r0;var sp={kind:'one',s:s,r0:r0};
  return {q:'$'+qs(a,b,c)+' '+opD(op)+' 0$',a:aTxt(s)+'. $D=0$, давхар язгуур $x='+r0+'$. '+graphSVG(sp)+' Шийд: $'+solOf(sp,op)+'$',ok:true,spec:sp,key:qs(a,b,c)+op};}
// D<0 язгуургүй
function gDneg(){var h=rnd(-3,3),d=pick([1,2,3]),s=pick([1,-1]),op=pick(['>','<','ge','le']);var a=s,b=-2*s*h,c=s*(h*h+d);var sp={kind:'none',s:s,h:h,d:d};
  return {q:'$'+qs(a,b,c)+' '+opD(op)+' 0$',a:aTxt(s)+'. $D<0$ (бодит язгуургүй), график $Ox$-ийг огтлохгүй, бүхэлдээ '+(s>0?'<b>дээш</b>':'<b>доош</b>')+'. '+graphSVG(sp)+' Шийд: $'+solOf(sp,op)+'$',ok:true,spec:sp,key:qs(a,b,c)+op};}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т','у','ү'];
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={};for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<80){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var P=[[],[]];var seen={};function fill(idx,fns,n){var c=0,tr=0,i=0;while(c<n&&tr<6000){tr++;var f=gen(fns[i%fns.length]);i++;if(!f||seen[f.key])continue;seen[f.key]=1;P[idx].push(f);c++;}}
  fill(0,[gD2],16);fill(1,[gD0,gDneg],10);return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap){var use=arr;return use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(WK?'<div class="wkrow">'+blankTable()+blankGrid(f.spec)+'</div>':'')+'</div>';}).join('');}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span class="ask">'+p.f.a+'</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тэнцэтгэл биш — график байгуулан бодох</h1><div class="sub">Салааны чиг, дискриминант, язгуур → график → шийд · 11-р анги · I бүлэг 1.3</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule"><b>Алхам:</b> 1) $a$-ийн тэмдгээр салаа дээш/доош. 2) $D=b^2-4ac$-аар $Ox$-тэй огтлолцлын тоо. 3) $f(x)=ax^2+bx+c$-ийн тоймлон график зурна. 4) График ашиглан $f(x)>0,\\ \\ge0,\\ <0,\\ \\le0$ мужийг ол.</div>'
    +'<div class="task">1. График байгуулан бод (хоёр язгууртай).</div><div class="grid">'+block(S[0],4)+'</div>'
    +'<div class="task">2. Тусгай тохиолдол ($D=0$ ба $D<0$).</div><div class="grid">'+block(S[1],4)+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариу ба тоймлон график</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Тэнцэтгэл биш — график байгуулан бодох';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFit(document.getElementById('sheet'),WK?1010:1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
