<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IV бүлэг — Шалгалтын материал (7-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 7-р анги · IV бүлэг. Магадлал (4.1 Эсрэг үзэгдлийн магадлал · 4.2 Нэгдсэн туршилт (шоо, зоос, шагай) · 4.3 Санамсаргүй сонголтын магадлал) */
// Магадлалын сонголт: зөв m/n; төөрөгдүүлэгчид [[a,b],…] — 0 < утга < 1, зөвтэй тэнцүү биш (fr хураадаг тул ижил утга ижил мөр болж хасагдана)
function PMC(m, n, cands) {
  var ok = fr(m, n), seen = {}, out = [];
  seen[ok] = 1;
  cands.forEach(function (p) {
    if (!p || !(p[0] > 0) || !(p[1] > 0) || p[0] >= p[1] || p[0] !== Math.round(p[0]) || p[1] !== Math.round(p[1])) return;
    var t = fr(p[0], p[1]); if (seen[t]) return; seen[t] = 1; out.push(C(t));
  });
  return makeMC(C(ok), out);
}
// бүхэл тоон төөрөгдүүлэгч: эерэг, бүхэл, зөвөөс ялгаатай, давхардаагүй
function IMC(ok, cands) {
  var seen = {}, out = []; seen[ok] = 1;
  cands.forEach(function (v) { if (v > 0 && v === Math.round(v) && !seen[v]) { seen[v] = 1; out.push(C(v)); } });
  return makeMC(C(ok), out);
}
function d2(pred) { var c = 0; for (var a = 1; a <= 6; a++) for (var b = 1; b <= 6; b++) if (pred(a, b)) c++; return c; }   // хоёр шооны 36 үр дүнгээс тоолох
function isPr(n) { if (n < 2) return false; for (var i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
function fact(n) { var r = 1; for (var i = 2; i <= n; i++) r *= i; return r; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
var COL = ['улаан', 'цагаан', 'хөх', 'шар', 'ногоон'];
var NAMES = [['Бат', 'Оюун'], ['Болд', 'Сараа'], ['Дорж', 'Гэрэл'], ['Төгс', 'Номин']];
// нэгдсэн туршилт: [нэр, туршилт бүрийн үр дүн, ялгалгүй тоолсон (буруу) тоо]
var EXP = [['Хоёр шоог', [6, 6], 21], ['Нэг шоо ба нэг зоосыг', [6, 2], 0], ['Гурван зоосыг', [2, 2, 2], 4], ['Нэг шоо ба хоёр зоосыг', [6, 2, 2], 18],
  ['Хоёр шоо ба нэг зоосыг', [6, 6, 2], 42], ['Нэг шоо ба нэг шагайг', [6, 4], 0], ['Хоёр шагайг', [4, 4], 10], ['Дөрвөн зоосыг', [2, 2, 2, 2], 5],
  ['Гурван шоог', [6, 6, 6], 56], ['Нэг шагай ба нэг зоосыг', [4, 2], 0], ['Хоёр зоос ба нэг шагайг', [2, 2, 4], 12]];
// хоёр шооны нийлмэл үзэгдэл
var D2E = [
  ['буусан нүднүүдийн үржвэр тэгш тоо байх', function (a, b) { return a * b % 2 === 0; }],
  ['буусан нүднүүдийн үржвэр сондгой тоо байх', function (a, b) { return a * b % 2 === 1; }],
  ['ядаж нэг шоо $6$ буух', function (a, b) { return a === 6 || b === 6; }],
  ['нэг ч шоо $6$ буухгүй байх', function (a, b) { return a !== 6 && b !== 6; }],
  ['хоёр шоо ялгаатай нүдээр буух', function (a, b) { return a !== b; }],
  ['нүднүүдийн үржвэр $3$ тоонд хуваагдах', function (a, b) { return a * b % 3 === 0; }],
  ['нүднүүдийн нийлбэр анхны тоо байх', function (a, b) { return isPr(a + b); }],
  ['нүднүүдийн ялгаврын модул $2$ байх', function (a, b) { return Math.abs(a - b) === 2; }],
  ['нүднүүдийн нийлбэр $4$ тоонд хуваагдах', function (a, b) { return (a + b) % 4 === 0; }],
  ['нүднүүдийн үржвэр $12$ байх', function (a, b) { return a * b === 12; }]
];

/* ── I. Тест (10) ── */
var TESTS = [
  // 1. [хялбар] Эсрэг үзэгдлийн магадлал P(Ā)=1−P(A) — аравтын ба энгийн бутархай (4.1)
  function () {
    if (rnd(0, 1)) {
      var h = rnd(6, 94), c = 100 - h; if (h % 10 === 0) return null;
      var seen = {}, d = []; seen[c] = 1;
      [h, c + 10, c - 10, c + 5, c - 5, c + 1].forEach(function (x) { if (x > 0 && x < 100 && !seen[x]) { seen[x] = 1; d.push(C(dFmt(x, 2))); } });
      return { stem: '$P(A)=' + dFmt(h, 2) + '$ бол эсрэг үзэгдлийн магадлал $P(\\bar A)$ хэд вэ?', mc: makeMC(C(dFmt(c, 2)), d) };
    }
    var b = rnd(5, 20), a = rnd(1, b - 1); if (gcd(a, b) !== 1 || 2 * a === b) return null;
    return { stem: '$P(A)=\\dfrac{' + a + '}{' + b + '}$ бол эсрэг үзэгдлийн магадлал $P(\\bar A)$ хэд вэ?',
      mc: PMC(b - a, b, [[a, b], [b - a - 1, b], [b - a + 1, b], [1, b], [b - a, b + a], [a, b + a]]) };
  },
  // 2. [хялбар] Нэгдсэн туршилтын бүх үр дүнгийн тоо — үржвэрийн зарчим; төөрөгдүүлэгч: нэмсэн, ялгалгүй тоолсон (4.2)
  function () {
    var e = pick(EXP), P = 1, S = 0; e[1].forEach(function (x) { P *= x; S += x; });
    return { stem: e[0] + ' зэрэг орхиход нийт хэдэн үр дүн гарах вэ?', mc: IMC(P, [S, e[2], P / 2, 2 * P, P + S, P - S]) };
  },
  // 3. [хялбар] 1, 2, …, N тоонуудаас сонгоход d тоонд хуваагдах магадлал (4.3)
  function () {
    var N = pick([20, 24, 30, 36, 40, 48, 50, 60, 80, 100]), d = rnd(2, 10), k = Math.floor(N / d); if (k < 2) return null;
    return { stem: '$1, 2, \\dots, ' + N + '$ тоонуудаас санамсаргүй сонгосон тоо $' + d + '$ тоонд хуваагдах магадлал хэд вэ?',
      mc: PMC(k, N, [[1, d], [N - k, N], [k + 1, N], [k - 1, N], [d, N], [k, N - k]]) };
  },
  // 4. [дунд] Уутнаас авсан бөмбөг тухайн өнгө БИШ байх — эсрэг үзэгдэл (4.1)
  function () {
    if (rnd(0, 1)) {
      var N = rnd(10, 40), k = rnd(2, N - 2), c = pick(COL); if (2 * k === N) return null;
      return { stem: 'Уутны $' + N + '$ бөмбөгийн $' + k + '$ нь ' + c + '. Таамгаар авсан бөмбөг ' + c + ' биш байх магадлал хэд вэ?',
        mc: PMC(N - k, N, [[k, N], [k, N - k], [N - k - 1, N], [N - k, N + k], [1, N - k], [1, k]]) };
    }
    var cs = shuffle(COL).slice(0, 3), a = rnd(2, 9), b = rnd(2, 9), c2 = rnd(2, 9), N2 = a + b + c2;
    if (a === b || b === c2 || a === c2) return null;
    return { stem: 'Уутанд $' + a + '$ ' + cs[0] + ', $' + b + '$ ' + cs[1] + ', $' + c2 + '$ ' + cs[2] + ' бөмбөг бий. ' + cap(cs[2]) + ' биш бөмбөг гарах магадлал хэд вэ?',
      mc: PMC(a + b, N2, [[c2, N2], [a + b, N2 + c2], [a, N2], [b, N2], [a + b - 1, N2], [1, 2]]) };
  },
  // 5. [дунд] Зоосыг n удаа орхих — нэгдсэн туршилт; төөрөгдүүлэгч: 0..n сүлдийг адил гэж үзэх, нэмж тоолох (4.2)
  function () {
    var n = rnd(2, 4), T = Math.pow(2, n), ev = pick([['ядаж нэг удаа сүлд буух', T - 1], ['нэг ч удаа сүлд буухгүй байх', 1], ['яг нэг удаа сүлд буух', n],
      ['бүх удаад ижил талаараа буух', 2], ['яг хоёр удаа сүлд буух', n * (n - 1) / 2]]), m = ev[1];
    if (m <= 0 || m >= T) return null;
    return { stem: 'Зоосыг $' + n + '$ удаа орхив. ' + cap(ev[0]) + ' магадлал хэд вэ?',
      mc: PMC(m, T, [[1, n + 1], [m, 2 * n], [T - m, T], [n, n + 1], [1, 2], [m + 1, T], [m - 1, T]]) };
  },
  // 6. [дунд] Хоёр шоо — нийлбэр s байх магадлал; төөрөгдүүлэгч: эрэмбэгүй хос, 11 нийлбэрийг адил гэж үзэх (4.2)
  function () {
    var s = rnd(3, 11), k = 6 - Math.abs(7 - s), u = Math.floor((k + 1) / 2);
    return { stem: 'Хоёр шоог зэрэг орхив. Буусан нүднүүдийн нийлбэр $' + s + '$ байх магадлал хэд вэ?',
      mc: PMC(k, 36, [[u, 36], [1, 11], [u, 21], [k + 1, 36], [k - 1, 36], [k, 12]]) };
  },
  // 7. [дунд] Хоёр оронтой тоо d тоонд хуваагдах магадлал (90 тоо); төөрөгдүүлэгч: 99, 100 гэж тоолох (4.3)
  function () {
    var d = pick([3, 4, 5, 6, 7, 8, 9, 11, 12, 15]), k = Math.floor(99 / d) - Math.floor(9 / d);
    return { stem: 'Санамсаргүй сонгосон хоёр оронтой тоо $' + d + '$ тоонд хуваагдах магадлал хэд вэ?',
      mc: PMC(k, 90, [[Math.floor(99 / d), 90], [k, 99], [k, 100], [1, d], [k + 1, 90], [k - 1, 90]]) };
  },
  // 8. [хүнд] Хоёр шоо — нийлмэл нөхцөлтэй үзэгдэл (4.2)
  function () {
    var e = pick(D2E), k = d2(e[1]);
    return { stem: 'Хоёр шоог зэрэг орхив. ' + cap(e[0]) + ' магадлал хэд вэ?',
      mc: PMC(k, 36, [[36 - k, 36], [1, 2], [k + 1, 36], [k - 1, 36], [k, 21], [1, 6], [k, 12]]) };
  },
  // 9. [хүнд] n хүүхэд санамсаргүй эгнэх — n! байрлал (4.3)
  function () {
    var n = rnd(3, 5), nm = pick(NAMES), T = fact(n), ev = pick([
      [nm[0] + ' хамгийн түрүүнд зогсох', fact(n - 1)],
      [nm[0] + ', ' + nm[1] + ' хоёр зэрэгцэн зогсох', 2 * fact(n - 1)],
      [nm[0] + ' хамгийн түрүүнд, ' + nm[1] + ' хамгийн сүүлд зогсох', fact(n - 2)],
      [nm[0] + ' хамгийн түрүүнд эсвэл хамгийн сүүлд зогсох', 2 * fact(n - 1)]
    ]), m = ev[1];
    if (m >= T) return null;
    return { stem: '$' + n + '$ хүүхэд санамсаргүй эгнэв. ' + ev[0] + ' магадлал хэд вэ?',
      mc: PMC(m, T, [[1, T], [2, T], [1, n], [2, n], [1, n - 1], [1, 2], [n - 1, n]]) };
  },
  // 10. [хүнд] n сурагчаас хоёрыг санамсаргүй сонгох — n(n−1)/2 хос; төөрөгдүүлэгч: эрэмбэтэй тоолох (4.3)
  function () {
    var n = rnd(4, 8), nm = pick(NAMES), T = n * (n - 1) / 2, ev = pick([
      [nm[0] + ' сонгогдох', n - 1],
      [nm[0] + ', ' + nm[1] + ' хоёулаа сонгогдох', 1],
      [nm[0] + ', ' + nm[1] + ' хоёрын аль нь ч сонгогдохгүй байх', (n - 2) * (n - 3) / 2],
      [nm[0] + ', ' + nm[1] + ' хоёрын яг нэг нь сонгогдох', 2 * (n - 2)]
    ]), m = ev[1];
    if (m <= 0 || m >= T) return null;
    return { stem: '$' + n + '$ сурагчаас хоёрыг санамсаргүй сонгов. ' + ev[0] + ' магадлал хэд вэ?',
      mc: PMC(m, T, [[m, n * (n - 1)], [1, n], [T - m, T], [m + 1, T], [m - 1, T], [1, n - 1], [2, n * (n - 1)]]) };
  }
];

/* ── II. Задгай (5) ── */
var FREE = [
  // 11. [2 оноо] Уутны бөмбөг — магадлал ба эсрэг үзэгдэл, эсвэл эсрэг үзэгдлээр бөмбөгийн тоог олох (4.1)
  function () {
    if (rnd(0, 1)) {
      var cs = shuffle(COL).slice(0, 3), a = rnd(2, 12), b = rnd(2, 12), c = rnd(2, 12), N = a + b + c;
      if (a === b || b === c || a === c) return null;
      return { stem: 'Уутанд $' + a + '$ ' + cs[0] + ', $' + b + '$ ' + cs[1] + ', $' + c + '$ ' + cs[2] + ' бөмбөг бий. Таамгаар авсан бөмбөг а) ' + cs[0] + ' байх; б) ' + cs[0] + ' биш байх магадлалыг ол.',
        a: 'а) $' + fr(a, N) + '$; б) $1-' + fr(a, N) + '=' + fr(b + c, N) + '$' };
    }
    var N2 = pick([20, 25, 40, 50]), k = rnd(2, N2 - 2), q = 100 * (N2 - k) / N2, col = pick(COL);
    if (q !== Math.round(q) || q === 50) return null;
    return { stem: 'Уутанд нийт $' + N2 + '$ бөмбөг бий. Таамгаар авсан бөмбөг ' + col + ' биш байх магадлал $' + dFmt(q, 2) + '$ бол уутанд хэдэн ' + col + ' бөмбөг байгаа вэ?',
      a: col + ' гарах магадлал $1-' + dFmt(q, 2) + '=' + dFmt(100 - q, 2) + '$; $' + dFmt(100 - q, 2) + '\\cdot ' + N2 + '=' + k + '$ бөмбөг' };
  },
  // 12. [2 оноо] Нэгдсэн туршилт: шоо ба зоос, эсвэл зоосыг 3 удаа — үр дүнгийн тоо ба магадлал (4.2)
  function () {
    if (rnd(0, 1)) {
      var e = pick([['тэгш тоо', 3], ['сондгой тоо', 3], ['анхны тоо', 3], ['$6$', 1], ['$3$ тоонд хуваагдах тоо', 2], ['$1$ буюу $2$', 2], ['$5$ буюу $6$', 2]]);
      return { stem: 'Шоо ба зоосыг зэрэг орхив. а) Нийт хэдэн үр дүн гарах вэ? б) Шоо ' + e[0] + ', зоос ' + pick(['сүлд', 'тоо']) + ' буух магадлалыг ол.',
        a: 'а) $6\\cdot 2=12$; б) $' + fr(e[1], 12) + '$' };
    }
    var ev = pick([['нэг ч удаа сүлд буухгүй байх', 1], ['ядаж нэг удаа сүлд буух', 7], ['яг нэг удаа сүлд буух', 3], ['яг хоёр удаа сүлд буух', 3], ['бүх удаад ижил талаараа буух', 2]]);
    return { stem: 'Зоосыг $3$ удаа орхив. а) Нийт хэдэн үр дүн гарах вэ? б) ' + cap(ev[0]) + ' магадлалыг ол.',
      a: 'а) $2\\cdot 2\\cdot 2=8$; б) $' + fr(ev[1], 8) + '$' };
  },
  // 13. [3 оноо] Хоёр шоо — хүснэгт ашиглан олон алхамт магадлал (4.2)
  function () {
    var s = rnd(3, 11), k = 6 - Math.abs(7 - s), e = pick([['хоёр шоо ижил нүдээр буух', 6], ['нүднүүдийн үржвэр сондгой тоо байх', 9], ['ядаж нэг шоо $6$ буух', 11], ['нүднүүдийн үржвэр $6$ байх', 4]]);
    return { stem: 'Хоёр шоог зэрэг орхив. а) Нүднүүдийн нийлбэр $' + s + '$ байх; б) нийлбэр $' + s + '$ биш байх; в) ' + e[0] + ' магадлалыг ол.',
      a: 'а) $' + fr(k, 36) + '$; б) $' + fr(36 - k, 36) + '$; в) $' + fr(e[1], 36) + '$' };
  },
  // 14. [3 оноо] a ба b тоонуудын ядаж нэгэнд нь хуваагдах — нэгдлийн магадлал |A∪B|=|A|+|B|−|A∩B| (4.3)
  function () {
    var pr = pick([[2, 3], [2, 5], [3, 4], [3, 5], [4, 6], [2, 7], [3, 7], [4, 5], [5, 6], [4, 10], [6, 8], [6, 9]]), a = pr[0], b = pr[1], L = lcm(a, b);
    var N = pick([30, 40, 50, 60, 100]); if (L > N) return null;
    var A = Math.floor(N / a), B = Math.floor(N / b), AB = Math.floor(N / L), k = A + B - AB;
    return { stem: '$1, 2, \\dots, ' + N + '$ тоонуудаас нэгийг санамсаргүйгээр сонгов. Тэр нь $' + a + '$ ба $' + b + '$ тоонуудын ядаж нэгэнд нь хуваагдах магадлалыг ол.',
      a: '$' + A + '+' + B + '-' + AB + '=' + k + '$ тоо; $P=' + fr(k, N) + '$' };
  },
  // 15. [3 оноо] Эгнэх (n!) эсвэл хоёрыг сонгох (n(n−1)/2) — тооллого ба магадлал (4.3)
  function () {
    var nm = pick(NAMES);
    if (rnd(0, 1)) {
      var n = rnd(4, 6);
      return { stem: '$' + n + '$ хүүхэд санамсаргүй эгнэв. а) Хэдэн янзаар эгнэж болох вэ? б) ' + nm[0] + ' түрүүнд зогсох; в) ' + nm[0] + ', ' + nm[1] + ' хоёр зэрэгцэн зогсох магадлалыг ол.',
        a: 'а) $' + n + '!=' + fact(n) + '$; б) $' + fr(1, n) + '$; в) $' + fr(2, n) + '$' };
    }
    var m = rnd(5, 8), T = m * (m - 1) / 2;
    return { stem: '$' + m + '$ сурагчаас хоёрыг санамсаргүйгээр сонгов. а) Хэдэн янзаар сонгож болох вэ? б) ' + nm[0] + ' сонгогдох; в) ' + nm[0] + ', ' + nm[1] + ' хоёулаа сонгогдох магадлалыг ол.',
      a: 'а) $\\dfrac{' + m + '\\cdot ' + (m - 1) + '}{2}=' + T + '$; б) $' + fr(m - 1, T) + '$; в) $' + fr(1, T) + '$' };
  }
];

CMX.exam({
  title: 'IV бүлэг — Шалгалтын материал',
  sub: 'Эсрэг үзэгдэл · нэгдсэн туршилт · санамсаргүй сонголтын магадлал',
  grade: '7-р анги',
  topic: 'Статистик',
  tests: TESTS,
  free: FREE
});
</script>
<script src="/eyesh-link.js?v=3"></script>
<script src="/ws-store.js?v=40"></script>
