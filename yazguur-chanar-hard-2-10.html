<script>
// ══════════ g10core.js — 10-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ 10-р анги · II БҮЛЭГ (ТООН БА ҮСЭГТ ИЛЭРХИЙЛЭЛ) ══════════
// ДАНДАА ХҮНД түвшний генераторууд. g10core.js-ийн дараа залгагдана.

// ───────── нийтлэг туслахууд ─────────
function sup(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function rexp(fr){if(fr.d===1)return ''+fr.n;return (fr.n<0?'-\\tfrac{'+(-fr.n)+'}{'+fr.d+'}':'\\tfrac{'+fr.n+'}{'+fr.d+'}');}
function supF(b,fr){if(fr.d===1)return sup(b,fr.n);return b+'^{'+rexp(fr)+'}';}
function fPow(fr,e){var n=fr.n,d=fr.d;if(e<0){var t=n;n=d;d=t;e=-e;}return Fr(Math.pow(n,e),Math.pow(d,e));}
function iroot(x,n){if(x<0){if(n%2===0)return null;var r=iroot(-x,n);return r===null?null:-r;}
 var r0=Math.round(Math.pow(x,1/n));for(var k=Math.max(0,r0-2);k<=r0+2;k++){if(Math.pow(k,n)===x)return k;}return null;}
function rootTex(idx,inner){return idx===2?('\\sqrt{'+inner+'}'):('\\sqrt['+idx+']{'+inner+'}');}
function nvEq(e,s,at,v){return {t:'eq',e:e,s:s,at:at,v:v||[]};}
function pw(x,y){return 'Math.pow('+x+','+y+')';}
function intVal(p,T){return T>=0?(''+Math.pow(p,T)):('\\dfrac{1}{'+Math.pow(p,-T)+'}');}
// (cn/cd)·x^P·y^Q хэлбэрийг бутархайгаар цэвэр бичих
function cmTex(cn,cd,vars){
 var num='',den='';
 if(cn===1)num=''; else if(cn===-1)num='-'; else num=''+cn;
 if(cd!==1)den=''+cd;
 vars.forEach(function(p){if(p[1]>0)num+=sup(p[0],p[1]);else if(p[1]<0)den+=sup(p[0],-p[1]);});
 if(num===''||num==='-')num+='1';
 if(den==='')return num;
 return '\\dfrac{'+num+'}{'+den+'}';
}
function monoRaw(vars){var s='';vars.forEach(function(p){if(p[1]!==0)s+=sup(p[0],p[1]);});return s===''?'1':s;}

// ══════════════════════════════════════════════════════════════
//  2.1 ТЭГ БА СӨРӨГ ИЛТГЭГЧТЭЙ ЗЭРЭГ
// ══════════════════════════════════════════════════════════════
var P1K={2:[1,2,3,4],3:[1,2,3],5:[1,2,3]};

function g_p1_chain(){
 for(var att=0;att<300;att++){
  var p=pick([2,3,5]),ks=P1K[p],f=[],i;
  for(i=0;i<4;i++)f.push({k:pick(ks),m:pick([-3,-2,-1,2,3])});
  var sg=[1,1,-1,-1],T=0;
  for(i=0;i<4;i++)T+=sg[i]*f[i].k*f[i].m;
  if(T===0||Math.abs(T)>6)continue;
  var B=f.map(function(o){return Math.pow(p,o.k);});
  var e=f.map(function(o){return o.k*o.m;});
  var s1=e[0]+e[1],s2=e[2]+e[3];
  var q='$\\dfrac{'+sup(B[0],f[0].m)+'\\cdot '+sup(B[1],f[1].m)+'}{'+sup(B[2],f[2].m)+'\\cdot '+sup(B[3],f[3].m)+'}$';
  var at=intVal(p,T);
  var a='$=\\dfrac{'+sup(p,e[0])+'\\cdot '+sup(p,e[1])+'}{'+sup(p,e[2])+'\\cdot '+sup(p,e[3])+'}'+
        '=\\dfrac{'+sup(p,s1)+'}{'+sup(p,s2)+'}='+sup(p,T)+'='+at+'$';
  var je='('+pw(B[0],f[0].m)+'*'+pw(B[1],f[1].m)+')/('+pw(B[2],f[2].m)+'*'+pw(B[3],f[3].m)+')';
  return {q:q,a:a,key:'ch:'+p+':'+f.map(function(o){return o.k+','+o.m;}).join(';'),
          nv:nvEq(je,pw(p,T),at)};
 }
 return null;
}

var P1R=[[3,2],[4,3],[5,3],[5,4],[7,4],[5,2],[7,5],[8,5],[7,6],[6,5],[9,5],[9,7]];
function g_p1_mixed(){
 for(var att=0;att<300;att++){
  var ad=pick([2,3,4,5,6,7,8]),af=rnd(1,ad-1);
  if(gcd(af,ad)!==1)continue;
  var aw=rnd(1,3),A=Fr(aw*ad+af,ad);
  var r0=pick(P1R),R=Fr(r0[0],r0[1]),B=fMul(A,R);
  if(B.d===1||B.d>12||B.n>140||B.n<=B.d)continue;
  var n=pick([2,3]),val=fPow(R,n);
  if(Math.abs(val.n)>3000||val.d>3000)continue;
  var q='$\\bigl('+fMix(A)+'\\bigr)^{-'+n+'}\\cdot\\bigl('+fMix(B)+'\\bigr)^{'+n+'}$';
  var at=fTex(val);
  var a='$=\\bigl(\\dfrac{'+A.d+'}{'+A.n+'}\\bigr)^{'+n+'}\\cdot\\bigl(\\dfrac{'+B.n+'}{'+B.d+'}\\bigr)^{'+n+'}'+
        '=\\bigl(\\dfrac{'+A.d+'}{'+A.n+'}\\cdot\\dfrac{'+B.n+'}{'+B.d+'}\\bigr)^{'+n+'}'+
        '=\\bigl('+fTex(R)+'\\bigr)^{'+n+'}='+at+'$';
  return {q:q,a:a,key:'mx:'+A.n+'/'+A.d+':'+r0[0]+'/'+r0[1]+':'+n,
          nv:nvEq(pw('('+A.n+'/'+A.d+')',-n)+'*'+pw('('+B.n+'/'+B.d+')',n),'('+val.n+'/'+val.d+')',at)};
 }
 return null;
}

function g_p1_factor(){
 for(var att=0;att<400;att++){
  var p=pick([2,3,5]);
  var i=pick([1,2,3]),j=pick([1,2,3]),l=pick([1,2,3]);
  if(i===1&&j===1&&l===1)continue;
  var L=lcm(lcm(i,j),l),E=L*rnd(1,3);
  if(Math.pow(p,E)>3.2e6)continue;
  if(E/i>9||E/j>9||E/l>9||E/i<2||E/j<2||E/l<2)continue;
  var a=rnd(2,12),b=rnd(2,12),sgn2=pick([1,-1]);
  var res=a+sgn2*b;
  if(res===0)continue;
  var B1=Math.pow(p,i),B2=Math.pow(p,j),B3=Math.pow(p,l);
  var PE=Math.pow(p,E);

function g_p1_compare(){

  var p=pr[0],q=pr[1];
  var m=rnd(2,5),n=rnd(2,5);
  if(m===n)continue;
  var flip=pick([0,1]);
  var Atex,Btex,rb;      // rb = хамтын суурь (Fr)
  if(flip===0){Atex='\\bigl(\\dfrac{'+p+'}{'+q+'}\\bigr)^{-'+m+'}';Btex='\\bigl(\\dfrac{'+q+'}{'+p+'}\\bigr)^{'+n+'}';rb=Fr(q,p);}
  else {Atex='\\bigl(\\dfrac{'+q+'}{'+p+'}\\bigr)^{-'+m+'}';Btex='\\bigl(\\dfrac{'+p+'}{'+q+'}\\bigr)^{'+n+'}';rb=Fr(p,q);}
  var rv=rb.n/rb.d;
  var Av=Math.pow(rv,m),Bv=Math.pow(rv,n);
  if(Math.abs(Av-Bv)<1e-12)continue;
  var rel=Av>Bv?'\\gt':'\\lt';

  var a='$A=\\bigl('+fTex(rb)+'\\bigr)^{'+m+'},\\ B=\\bigl('+fTex(rb)+'\\bigr)^{'+n+'}$. '+
        'Суурь нь ижил, $'+fTex(rb)+(rv>1?'\\gt':'\\lt')+' 1$ тул илтгэгчийг жиших нь хангалттай: $'+m+(m>n?'\\gt':'\\lt')+n+'$. Иймд $'+at+'$.';
  return {q:'$A='+Atex+',\\ B='+Btex+'$',a:a,key:'cp:'+p+'/'+q+':'+m+':'+n+':'+flip,
          nv:{t:'cmp',v:[],e:[pw(rv,m)],s:[pw(rv,n)],rel:[rel],at:at}};
 }

}

function g_p2_prodRoot(){
 for(var att=0;att<400;att++){
  var n=pick([3,3,4,5]);
  var T=(n%2===1)?nz(-6,6):rnd(2,6);
  if(Math.abs(T)<2)continue;
  var PW=Math.pow(Math.abs(T),n);
  if(PW>4200)continue;
  var cnt=pick([2,2,3]),bk=[],i;
  for(i=0;i<cnt;i++)bk.push(1);
  shuffle(primeFactors(PW)).forEach(function(f){bk[rnd(0,cnt-1)]*=f;});
  var okb=true;bk.forEach(function(b){if(b===1)okb=false;});
  if(!okb)continue;
  if(T<0)bk[rnd(0,cnt-1)]*=-1;
  var qs=bk.map(function(b){return rootTex(n,b<0?'-'+(-b):''+b);}).join('\\cdot ');
  var prod=bk.map(function(b){return paren(b);}).join('\\cdot ');
  var at=''+T;
  var a='$='+rootTex(n,prod)+'='+rootTex(n,(T<0?'\\bigl('+T+'\\bigr)':''+T)+'^{'+n+'}')+'='+at+'$';
  var je=bk.map(function(b){return 'R('+b+','+n+')';}).join('*');
  return {q:'$'+qs+'$',a:a,key:'pr:'+n+':'+bk.join(','),nv:nvEq(je,''+T,at)};
 }
 return null;
}

   sj='R('+c+'*'+pw(v,n)+','+n+')';}

     key:'cb1:'+a,nv:{t:'eq',v:[],e:['Math.sqrt('+S2+'/6)',''+(a*a*a)],s:[''+a,''+V2],at:at2}};

var P2RAT=[[1,2,4],[1,2,3],[2,3,4],[1,3,9],[1,4,2],[2,3,6],[1,2,5],[3,4,2],[1,5,2],[2,5,3]];

function g_p2_cmpRoots(){

//  НЭМЭЛТ ХҮНД ГЕНЕРАТОРУУД (2.1 нэмэлт, 2.3, 2.4)

var RF=[[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,6],[5,6],[2,7],[3,7],[5,8],[3,8]];

function linN(a,b,v){
 var s='';
 if(a===1)s=v; else if(a===-1)s='-'+v; else s=a+v;
 if(b>0)s+='+'+b; else if(b<0)s+='-'+(-b);
 return s;
}
function ipow(b,e){var r=1;for(var i=0;i<e;i++)r*=b;return r;}
function rootForm(v,fr){
 if(fr.d===1){
  if(fr.n===0)return '1';
  if(fr.n>0)return powTex(v,fr.n);
  return '\\dfrac{1}{'+powTex(v,-fr.n)+'}';
 }
 if(fr.n>0)return rootTex(fr.d,powTex(v,fr.n));
 return '\\dfrac{1}{'+rootTex(fr.d,powTex(v,-fr.n))+'}';
}
var DECDEN={2:1,4:1,5:1,8:1,10:1,16:1,20:1,25:1,32:1,40:1,50:1,64:1,100:1,125:1,1000:1};
function expDisp(a,n){
 var f=Fr(a,n);
 if(f.d===1)return ''+f.n;
 if(DECDEN[f.d])return decStr(f.n/f.d,8);
 return rexp(f);
}
function baseDisp(fr){
 if(fr.d===1)return ''+fr.n;
 if(DECDEN[fr.d])return decStr(fr.n/fr.d,8);
 return '\\dfrac{'+fr.n+'}{'+fr.d+'}';
}
// (n/d)^(a/b)-ийг ЯГ тооцоолно; болохгүй бол null
function fracPow(fr,a,b){
 if(b===1)return fPow(fr,a);
 var r1=iroot(fr.n,b),r2=iroot(fr.d,b);
 if(r1===null||r2===null||r1===0)return null;
 return fPow(Fr(r1,r2),a);
}

// ════════ 2.1 нэмэлт 1: илтгэгчийн тэгшитгэл (урвуу) ════════
function g_p1_expEq(){
 for(var att=0;att<600;att++){
  var pr=pick([[2,3],[3,4],[2,5],[3,5],[4,5],[5,6],[3,7],[5,8],[2,7],[7,9],[4,9],[5,9],[7,10],[3,8],[2,9],[4,7]]);
  var p=pr[0],q=pr[1];
  var A=nz(-3,3),C=nz(-3,3);
  if(A-C===0)continue;
  var B=nz(-6,6),D=nz(-6,6);
  var n=nz(-5,5);
  var K=(A-C)*n+(B-D);
  if(Math.abs(K)<2||Math.abs(K)>10)continue;
  var q1='$\\bigl(\\dfrac{'+p+'}{'+q+'}\\bigr)^{'+linN(A,B,'n')+'}\\cdot\\bigl(\\dfrac{'+q+'}{'+p+'}\\bigr)^{'+linN(C,D,'n')+'}=\\bigl(\\dfrac{'+p+'}{'+q+'}\\bigr)^{'+K+'}$';
  var at='n='+n;
  var a='$\\bigl(\\dfrac{'+q+'}{'+p+'}\\bigr)^{'+linN(C,D,'n')+'}=\\bigl(\\dfrac{'+p+'}{'+q+'}\\bigr)^{'+linN(-C,-D,'n')+'}$ тул зүүн тал нь '+
        '$\\bigl(\\dfrac{'+p+'}{'+q+'}\\bigr)^{'+linN(A-C,B-D,'n')+'}$ болно. Суурь нь нэгээс ялгаатай эерэг тоо тул илтгэгчүүд тэнцүү: '+
        '$'+linN(A-C,B-D,'n')+'='+K+'$, эндээс $'+at+'$.';
  return {q:q1,a:a,key:'ee:'+p+'/'+q+':'+A+','+B+','+C+','+D};
 }
 return null;
}

// ════════ 2.1 нэмэлт 2: тэгийн илтгэгчийн урхи ════════
function g_p1_zeroTrap(){
 for(var att=0;att<600;att++){
  var b1=pick([2,3,5,7,11]),e1=pick([2,3]),c1=rnd(2,60);
  if(Math.pow(b1,e1)===c1)continue;
  var F=[[1,2],[2,3],[1,3],[3,4],[2,5],[3,5],[1,4],[4,5],[5,6],[1,5],[2,7],[3,7],[1,6],[5,7]];
  var f1=pick(F),f2=pick(F),f3=pick(F);
  var m=rnd(2,3),n=rnd(2,3),k=rnd(2,3);
  var T1=fPow(Fr(f1[0],f1[1]),-m);
  var T2=fPow(Fr(f2[0],f2[1]),n);
  var T3=fPow(Fr(f3[0],f3[1]),-k);
  if(Math.abs(T1.n)>2500||T1.d>2500||T2.d>2500||Math.abs(T3.n)>2500||T3.d>2500)continue;
  var res=fSub(fAdd(T1,T2),T3);
  if(res.n===0||Math.abs(res.n)>60000||res.d>6000)continue;
  var q='$\\bigl('+sup(b1,e1)+'-'+c1+'\\bigr)^{0}\\cdot\\bigl(\\dfrac{'+f1[0]+'}{'+f1[1]+'}\\bigr)^{-'+m+'}'+
        '+\\dfrac{1}{\\bigl(\\dfrac{'+f2[0]+'}{'+f2[1]+'}\\bigr)^{-'+n+'}}-\\bigl(\\dfrac{'+f3[0]+'}{'+f3[1]+'}\\bigr)^{-'+k+'}$';
  var at=fTex(res);
  var a='Тэгээс ялгаатай тооны тэг зэрэг нь $1$ тул эхний үржигдэхүүн $1$. '+
        '$\\dfrac{1}{u^{-'+n+'}}=u^{'+n+'}$ дүрмээр хоёрдугаар гишүүн $\\bigl(\\dfrac{'+f2[0]+'}{'+f2[1]+'}\\bigr)^{'+n+'}$ болно. '+
        'Иймд $='+fTex(T1)+'+'+fTex(T2)+'-'+fTex(T3)+'='+at+'$.';
  return {q:q,a:a,key:'zt:'+b1+e1+':'+c1+':'+f1.join('/')+m+':'+f2.join('/')+n+':'+f3.join('/')+k};
 }
 return null;
}

// 1. Ижил суурьтай зэргүүдийн үйлдэл → язгуур хэлбэрт
function g_p3_sameBase(){
 for(var att=0;att<600;att++){
  var v=pick(['x','y','a','b']);
  var g1=pick(RF),g2=pick(RF),g3=pick(RF),g4=pick(RF),g5=pick(RF);
  var f1=Fr(g1[0],g1[1]),f2=Fr(pick([1,-1])*g2[0],g2[1]),f3=Fr(pick([1,-1])*g3[0],g3[1]),
      f4=Fr(g4[0],g4[1]),f5=Fr(pick([1,-1])*g5[0],g5[1]);
  var m12=fMul(f1,f2),m45=fMul(f4,f5);
  var R=fSub(fAdd(m12,f3),m45);
  if(R.n===0||R.d===1)continue;
  if(R.d>12||Math.abs(R.n)>15)continue;
  var q='$\\bigl('+v+'^{'+rexp(f1)+'}\\bigr)^{'+rexp(f2)+'}\\cdot '+v+'^{'+rexp(f3)+'}:'+
        '\\bigl('+v+'^{'+rexp(f4)+'}\\bigr)^{'+rexp(f5)+'},\\ '+v+'\\gt 0$';
  var at=rootForm(v,R);
  var a='$='+supF(v,m12)+'\\cdot '+supF(v,f3)+':'+supF(v,m45)+'='+
        supF(v,R)+'='+at+'$';
  return {q:q,a:a,key:'sb:'+v+':'+[f1.n,f1.d,f2.n,f2.d,f3.n,f3.d,f4.n,f4.d,f5.n,f5.d].join(',')};
 }
 return null;
}

// 2. (C·v^k)^(±a/b) хэлбэрийг хялбарчлах
function g_p3_monoRat(){
 for(var att=0;att<600;att++){
  var p=pick([2,3,5]),bd=pick([2,3,4,5]),a=rnd(1,5);
  if(gcd(a,bd)!==1)continue;
  var C=Math.pow(p,bd);
  if(C>1000)continue;
  var v=pick(['x','y','c','t']);
  var k=bd*rnd(1,3);
  var sIn=pick([1,-1]),sOut=pick([1,-1]);
  var pe=sOut*a,ve=sIn*k*sOut*a/bd;
  if(ve===0||Math.abs(ve)>14)continue;
  if(Math.pow(p,Math.abs(pe))>5000)continue;
  var E=Fr(sOut*a,bd);
  var q='$\\bigl('+C+powTex(v,sIn*k)+'\\bigr)^{'+rexp(E)+'}$';
  var cn=pe>0?Math.pow(p,pe):1,cd=pe>0?1:Math.pow(p,-pe);
  var at=cmTex(cn,cd,[[v,ve]]);
  var a2='$=\\bigl('+powTex(''+p,bd)+'\\cdot '+powTex(v,sIn*k)+'\\bigr)^{'+rexp(E)+'}='+
         powTex(''+p,pe)+'\\cdot '+powTex(v,ve)+'='+at+'$';
  return {q:q,a:a2,key:'mr:'+p+':'+bd+':'+a+':'+k+':'+sIn+':'+sOut+':'+v};
 }
 return null;
}

// 3. Тоон илэрхийллийн утга (рационал илтгэгч)
function g_p3_numEval(){
 for(var att=0;att<900;att++){
  var PR=[2,3,5,7],ps=[],ns=[],as=[],i,ok=true;
  for(i=0;i<5;i++){
   var p=pick(PR),n=pick([2,3,4,5]),a=nz(-4,4);
   if(Math.pow(p,n)>2600){ok=false;break;}
   if(Math.pow(p,Math.abs(a))>3000){ok=false;break;}
   ps.push(p);ns.push(n);as.push(a);
  }
  if(!ok)continue;
  var nonInt=0,one=0;
  for(i=0;i<5;i++){if(Fr(as[i],ns[i]).d!==1)nonInt++;if(expDisp(as[i],ns[i])==='1')one++;}
  if(nonInt<3||one)continue;
  function tv(i){return as[i]>=0?Fr(Math.pow(ps[i],as[i]),1):Fr(1,Math.pow(ps[i],-as[i]));}
  var G1=fMul(tv(0),tv(1)),G2=fMul(tv(2),tv(3)),G3=tv(4);
  var s2=pick([1,-1]),s3=pick([1,-1]);
  var res=fAdd(fAdd(G1,s2>0?G2:fMul(G2,Fr(-1,1))),s3>0?G3:fMul(G3,Fr(-1,1)));
  if(res.n===0||Math.abs(res.n)>200000||res.d>4000)continue;
  if(G1.d>3000||G2.d>3000||G3.d>3000)continue;
  var B=[];for(i=0;i<5;i++)B.push(Math.pow(ps[i],ns[i]));
  var q='$'+B[0]+'^{'+expDisp(as[0],ns[0])+'}\\cdot '+B[1]+'^{'+expDisp(as[1],ns[1])+'}'+
        (s2>0?'+':'-')+B[2]+'^{'+expDisp(as[2],ns[2])+'}\\cdot '+B[3]+'^{'+expDisp(as[3],ns[3])+'}'+
        (s3>0?'+':'-')+B[4]+'^{'+expDisp(as[4],ns[4])+'}$';
  var rw=[];for(i=0;i<5;i++)rw.push('\\bigl('+powTex(''+ps[i],ns[i])+'\\bigr)^{'+expDisp(as[i],ns[i])+'}');
  var pv=[];for(i=0;i<5;i++)pv.push(powTex(''+ps[i],as[i]));
  var at=fTex(res);
  var a='$='+rw[0]+'\\cdot '+rw[1]+(s2>0?'+':'-')+rw[2]+'\\cdot '+rw[3]+(s3>0?'+':'-')+rw[4]+
        '='+pv[0]+'\\cdot '+pv[1]+(s2>0?'+':'-')+pv[2]+'\\cdot '+pv[3]+(s3>0?'+':'-')+pv[4]+
        '='+fTex(G1)+(s2>0?'+':'-')+fTex(G2)+(s3>0?'+':'-')+fTex(G3)+'='+at+'$';
  return {q:q,a:a,key:'ne:'+ps.join('')+':'+ns.join('')+':'+as.join(',')+':'+s2+s3};
 }
 return null;
}

// 4. Давхар язгуурыг рационал илтгэгчээр хялбарчлах
function g_p3_nestedRat(){
 for(var att=0;att<600;att++){
  var v=pick(['a','b','x','y']);
  var n1=pick([2,3,4,5,6]),n2=pick([2,3,4,5]);
  var k1=nz(-5,6),k2=nz(-6,6);
  var dg=pick(RF),dExp=Fr(pick([1,-1])*dg[0],dg[1]);
  var inner=fAdd(Fr(k1,1),Fr(k2,n2));
  var R=fSub(fDiv(inner,Fr(n1,1)),dExp);
  if(R.n===0)continue;
  if(R.d>12||Math.abs(R.n)>14)continue;
  var q='$\\dfrac{'+rootTex(n1,powTex(v,k1)+'\\cdot '+rootTex(n2,powTex(v,k2)))+'}{'+v+'^{'+rexp(dExp)+'}},\\ '+v+'\\gt 0$';
  var at=rootForm(v,R);
  var a='$'+rootTex(n2,powTex(v,k2))+'='+supF(v,Fr(k2,n2))+'$ тул язгуур доторх нь $'+supF(v,inner)+'$ болно. '+
        'Иймд $=\\dfrac{'+supF(v,fDiv(inner,Fr(n1,1)))+'}{'+supF(v,dExp)+'}='+supF(v,R)+'='+at+'$.';
  return {q:q,a:a,key:'nr:'+v+':'+n1+':'+n2+':'+k1+':'+k2+':'+dExp.n+'/'+dExp.d};
 }
 return null;
}

// 5. Хоёр анхны тоонд задалж хялбарчлах
var TP=[[2,3],[2,5],[3,5],[2,7],[3,7],[5,7],[2,11],[3,11],[5,11],[2,13],[3,13]];
function g_p3_twoPrime(){
 for(var att=0;att<1500;att++){
  var pr=pick(TP),P=pr[0],Q=pr[1];
  var VEC=[[1,0],[0,1],[1,1],[2,1],[1,2],[2,0],[0,2]];
  var D=pick([3,4,6,8]);
  var vecs=[],bases=[],num=[],i,ok=true;
  for(i=0;i<4;i++){
   var vv=pick(VEC),Bb=Math.pow(P,vv[0])*Math.pow(Q,vv[1]);
   if(Bb>250||Bb===1){ok=false;break;}
   vecs.push(vv);bases.push(Bb);num.push(nz(-7,7));
  }
  if(!ok)continue;
  var sg=[1,1,-1,-1],eP=Fr(0,1),eQ=Fr(0,1);
  for(i=0;i<4;i++){
   eP=fAdd(eP,Fr(sg[i]*num[i]*vecs[i][0],D));
   eQ=fAdd(eQ,Fr(sg[i]*num[i]*vecs[i][1],D));
  }
  if(eP.d!==1||eQ.d!==1)continue;
  if(Math.abs(eP.n)>3||Math.abs(eQ.n)>3)continue;
  if(eP.n===0&&eQ.n===0)continue;
  var frCount=0,one4=0;
  for(i=0;i<4;i++){if(Fr(num[i],D).d!==1)frCount++;if(expDisp(num[i],D)==='1')one4++;}
  if(frCount<3||one4)continue;
  function ed(i){return expDisp(num[i],D);}
  var q='$\\bigl('+bases[0]+'^{'+ed(0)+'}\\cdot '+bases[1]+'^{'+ed(1)+'}\\bigr):'+
        '\\bigl('+bases[2]+'^{'+ed(2)+'}\\cdot '+bases[3]+'^{'+ed(3)+'}\\bigr)$';
  var rw=[];
  for(i=0;i<4;i++){
   var t=(vecs[i][0]?powTex(''+P,vecs[i][0]):'')+(vecs[i][0]&&vecs[i][1]?'\\cdot ':'')+(vecs[i][1]?powTex(''+Q,vecs[i][1]):'');
   rw.push('\\bigl('+t+'\\bigr)^{'+ed(i)+'}');
  }
  var val=Fr(ipow(P,Math.max(eP.n,0))*ipow(Q,Math.max(eQ.n,0)),
             ipow(P,Math.max(-eP.n,0))*ipow(Q,Math.max(-eQ.n,0)));
  var at=fTex(val);
  var a='Суурь бүрийг $'+P+'$ ба $'+Q+'$-ын зэрэг болгон бичвэл $\\bigl('+rw[0]+'\\cdot '+rw[1]+'\\bigr):\\bigl('+rw[2]+'\\cdot '+rw[3]+'\\bigr)$. '+
        '$'+P+'$-ын илтгэгчүүдийн нийлбэр $'+eP.n+'$, $'+Q+'$-ынх $'+eQ.n+'$ тул илэрхийлэл нь '+
        '$'+powTex(''+P,eP.n)+'\\cdot '+powTex(''+Q,eQ.n)+'='+at+'$ болно.';
  return {q:q,a:a,key:'tp:'+P+'-'+Q+':'+D+':'+vecs.map(function(x){return x.join('');}).join('|')+':'+num.join(',')};
 }
 return null;
}

// 6. Илтгэгч олох (урвуу)
function g_p3_findR(){
 for(var att=0;att<600;att++){
  var v=pick(['a','x','y','b']);
  var pq=pick(RF);
  var n=pick([2,3,4,5]),k=nz(-6,6);
  var m=pick([2,3,4,5]),j=nz(-6,6);
  var t=fMul(fSub(Fr(j,m),Fr(k,n)),Fr(pq[1],pq[0]));
  if(t.n===0||Math.abs(t.n)>24||t.d>12)continue;
  var pe=Fr(pq[0],pq[1]);
  var q='$\\bigl('+v+'^{t}\\bigr)^{'+rexp(pe)+'}\\cdot '+rootTex(n,powTex(v,k))+'='+rootTex(m,powTex(v,j))+',\\ '+v+'\\gt 0$';
  var at='t='+fTex(t);
  var a='$'+rootTex(n,powTex(v,k))+'='+supF(v,Fr(k,n))+'$, $'+rootTex(m,powTex(v,j))+'='+supF(v,Fr(j,m))+'$. '+
        'Суурь ижил тул илтгэгчүүд тэнцүү: $t\\cdot '+rexp(pe)+(k<0?'-'+fTex(Fr(-k,n)):'+'+fTex(Fr(k,n)))+'='+fTex(Fr(j,m))+'$, эндээс $'+at+'$.';
  return {q:q,a:a,key:'fr:'+v+':'+pq.join('/')+':'+n+':'+k+':'+m+':'+j};
 }
 return null;
}

// 7. Рационал илтгэгчтэй зэргүүдийг жиших
function g_p3_cmpRat(){
 for(var att=0;att<900;att++){
  var A=rnd(2,40),B=rnd(2,40);
  var f1=pick(RF),f2=pick(RF);
  var D=lcm(f1[1],f2[1]);
  if(D>20)continue;
  var eA=f1[0]*D/f1[1],eB=f2[0]*D/f2[1];
  if(eA>26||eB>26||eA<2||eB<2)continue;
  var X=ipow(A,eA),Y=ipow(B,eB);
  if(!isFinite(X)||!isFinite(Y)||X>1e13||Y>1e13||X===Y)continue;
  if(Math.abs(Math.log(X)-Math.log(Y))<0.004)continue;
  var rel=X>Y?'\\gt':'\\lt';
  var at='M'+rel+' N';
  var q='$M='+A+'^{'+rexp(Fr(f1[0],f1[1]))+'},\\ N='+B+'^{'+rexp(Fr(f2[0],f2[1]))+'}$';
  var a='Хоёулаа эерэг тул $'+D+'$ зэрэг дэвшүүлье: $M^{'+D+'}='+A+'^{'+eA+'}='+X+'$, $N^{'+D+'}='+B+'^{'+eB+'}='+Y+'$. '+
        '$'+X+rel+' '+Y+'$ тул $'+at+'$.';
  return {q:q,a:a,key:'cq:'+A+':'+f1.join('/')+':'+B+':'+f2.join('/')};
 }
 return null;
}

// 8. Язгууртай тоон нийлбэр
function g_p3_rootSum(){

  var at=fMix(res);

        powTex(''+c2,k2)+'='+t2+'$; $\\bigl('+rootTex(n3,Cv)+'\\bigr)^{'+j3+'}='+powTex(''+c3,j3)+'='+t3+'$. '+
        'Иймд $=\\dfrac{1}{'+c1+'}+'+t2+'-'+t3+'='+at+'$.';

}

// 9. Аравтын бутархай суурьтай зэргийн гинж
var DECF=[[1,2],[1,4],[1,8],[1,16],[1,5],[1,25],[1,125],[3,10],[27,1000],[9,4],[4,9],[16,9],[25,4],[8,27],[4,25],[9,25],[1,32],[49,4],[27,8],[1,64],[8,125],[1,1000]];
function g_p3_decChain(){
 for(var att=0;att<1500;att++){
  var T=[],i,ok=true;
  for(i=0;i<4;i++){
   var bf=pick(DECF),fb=Fr(bf[0],bf[1]);
   var bd=pick([1,1,2,3,4]),an=nz(-4,4);
   if(gcd(Math.abs(an),bd)!==1&&bd!==1)continue;
   var val=fracPow(fb,an,bd);
   if(val===null||Math.abs(val.n)>4000||val.d>4000){ok=false;break;}
   T.push({fb:fb,a:an,b:bd,v:val});
  }
  if(!ok||T.length<4)continue;
  var fr=0,one2=0;for(i=0;i<4;i++){if(T[i].b>1)fr++;if(expDisp(T[i].a,T[i].b)==='1')one2++;}
  if(fr<2||one2)continue;
  var s2=pick([1,-1]),s3=pick([1,-1]);
  var G2=fMul(T[1].v,T[2].v);
  var res=fAdd(fAdd(T[0].v,s2>0?G2:fMul(G2,Fr(-1,1))),s3>0?T[3].v:fMul(T[3].v,Fr(-1,1)));
  if(res.n===0||Math.abs(res.n)>200000||res.d>4000)continue;
  if(Math.abs(G2.n)>200000||G2.d>4000)continue;
  function bt(i){var s=baseDisp(T[i].fb);return '\\bigl('+s+'\\bigr)^{'+expDisp(T[i].a,T[i].b)+'}';}
  var q='$'+bt(0)+(s2>0?'+':'-')+bt(1)+'\\cdot '+bt(2)+(s3>0?'+':'-')+bt(3)+'$';
  var at=fTex(res);
  var a='$='+fTex(T[0].v)+(s2>0?'+':'-')+fTex(T[1].v)+'\\cdot '+fTex(T[2].v)+(s3>0?'+':'-')+fTex(T[3].v)+
        '='+fTex(T[0].v)+(s2>0?'+':'-')+fTex(G2)+(s3>0?'+':'-')+fTex(T[3].v)+'='+at+'$';
  return {q:q,a:a,key:'dc:'+T.map(function(t){return t.fb.n+'/'+t.fb.d+'^'+t.a+'/'+t.b;}).join('|')+':'+s2+s3};
 }
 return null;
}

//  2.4 СТАНДАРТ ХЭЛБЭРЭЭР БИЧСЭН ТООНЫ ҮЙЛДЭЛ
// ══════════════════════════════════════════════════════════════
function snPair(M,p){
 var neg=M<0;M=Math.abs(M);
 var s=String(M);
 while(s.length>1&&s.charAt(s.length-1)==='0'){s=s.slice(0,-1);p++;}
 return {neg:neg,s:s,e:p+s.length-1};
}
function snTex(M,p){
 if(M===0)return '0';
 var o=snPair(M,p);
 var mant=o.s.length>1?(o.s.charAt(0)+'.'+o.s.slice(1)):o.s;
 return (o.neg?'-':'')+mant+'\\cdot 10^{'+o.e+'}';
}
function snE(M,p){return snPair(M,p).e;}
function snOK(M,p){
 if(M===0)return false;
 var e=snPair(M,p).e;
 if(e===0||e===1)return false;
 if(Math.abs(e)>17)return false;
 if(snPair(M,p).s.length>4)return false;
 return true;
}
function plainNum(M,p){
 var neg=M<0;M=Math.abs(M);
 var s=String(M);
 if(p>=0){s=s+new Array(p+1).join('0');}
 else{
  var k=-p;
  if(s.length>k)s=s.slice(0,s.length-k)+'.'+s.slice(s.length-k);
  else s='0.'+new Array(k-s.length+1).join('0')+s;
  s=s.replace(/0+$/,'');
  if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);
 }
 return (neg?'-':'')+s;
}

// 1. Нэмэх ба хасах
function g_p4_addSub(){
 for(var att=0;att<800;att++){
  var M1=rnd(11,999),p1=nz(-13,10),s1=pick([1,1,-1]);
  var M2=rnd(11,999),p2=p1+rnd(-3,3),s2=pick([1,-1]);
  if(!snOK(M1,p1)||!snOK(M2,p2))continue;
  var e1=snE(M1,p1),e2=snE(M2,p2);
  if(e1===e2)continue;
  var pm=Math.min(p1,p2);
  if(p1-pm>7||p2-pm>7)continue;
  var M=s1*M1*Math.pow(10,p1-pm)+s2*M2*Math.pow(10,p2-pm);
  if(M===0)continue;
  if(Math.abs(M)>2e9)continue;
  if(!snOK(M,pm))continue;
  var E=Math.max(e1,e2);
  var d1=plainNum(s1*M1,p1-E),d2=plainNum(M2,p2-E);
  if(d1.replace('-','').length>8||d2.length>8)continue;
  var q='$'+(s1<0?'-':'')+snTex(M1,p1)+(s2>0?'+':'-')+snTex(M2,p2)+'$';
  var at=snTex(M,pm);
  var a='Хамгийн өндөр эрэмбийг хаалтнаас гаргая: $=\\bigl('+d1+(s2>0?'+':'-')+d2+'\\bigr)\\cdot 10^{'+E+'}='+
        plainNum(M,pm-E)+'\\cdot 10^{'+E+'}='+at+'$';
  return {q:q,a:a,key:'as:'+s1+M1+':'+p1+':'+s2+M2+':'+p2};
 }
 return null;
}

  var at=snTex(M,pm);
  var a='$=\\bigl('+d1+(s2>0?'+':'-')+d2+(s3>0?'+':'-')+d3+'\\bigr)\\cdot 10^{'+E+'}='+
        plainNum(M,pm-E)+'\\cdot 10^{'+E+'}='+at+'$';

// 3. Үржүүлэх ба хуваах
function g_p4_mulDiv(){
 for(var att=0;att<900;att++){
  var mode=pick([0,1]);
  if(mode===0){
   var M1=rnd(11,999),p1=nz(-12,9),M2=rnd(11,999),p2=nz(-12,9);
   if(!snOK(M1,p1)||!snOK(M2,p2))continue;
   var M=M1*M2,p=p1+p2;
   if(!snOK(M,p))continue;
   var q='$'+snTex(M1,p1)+'\\cdot '+snTex(M2,p2)+'$';
   var a1=snPair(M1,p1),a2=snPair(M2,p2);
   var m1=a1.s.length>1?(a1.s.charAt(0)+'.'+a1.s.slice(1)):a1.s;
   var m2=a2.s.length>1?(a2.s.charAt(0)+'.'+a2.s.slice(1)):a2.s;
   var prodE=a1.e+a2.e;
   if(prodE===0||prodE===1)continue;
   var prodM=plainNum(Number(a1.s)*Number(a2.s),-(a1.s.length-1)-(a2.s.length-1));
   var at=snTex(M,p);
   var a='Мантиссуудыг үржүүлж, $10$-ын зэргүүдийг нэмнэ: $=\\bigl('+m1+'\\cdot '+m2+'\\bigr)\\cdot 10^{'+prodE+'}='+
         prodM+'\\cdot 10^{'+prodE+'}='+at+'$';
   return {q:q,a:a,key:'md0:'+M1+p1+':'+M2+p2};
  }
  var Mq=rnd(11,999),pq=nz(-10,8),Md=rnd(11,999),pd=nz(-10,8);
  var Mn=Mq*Md,pn=pq+pd;
  if(!snOK(Md,pd)||!snOK(Mn,pn)||!snOK(Mq,pq))continue;
  var b1=snPair(Mn,pn),b2=snPair(Md,pd);
  if(b1.s.length>4)continue;
  var n1=b1.s.length>1?(b1.s.charAt(0)+'.'+b1.s.slice(1)):b1.s;
  var n2=b2.s.length>1?(b2.s.charAt(0)+'.'+b2.s.slice(1)):b2.s;
  var qE=b1.e-b2.e;
  if(qE===0||qE===1)continue;
  var qM=plainNum(Mq,pq-snE(Mq,pq));
  var qt='$'+snTex(Mn,pn)+':\\bigl('+snTex(Md,pd)+'\\bigr)$';
  var at2=snTex(Mq,pq);
  var a2='Мантиссуудыг хувааж, $10$-ын зэргүүдийг хасна: $=\\dfrac{'+n1+'}{'+n2+'}\\cdot 10^{'+qE+'}$, '+
         'эндээс $='+at2+'$';
  return {q:qt,a:a2,key:'md1:'+Mq+pq+':'+Md+pd};
 }
 return null;
}

// 8. Хэрэглээний бодлого
var P4S=[
 {op:'div',eq:[2,5],ed:[7,8],t:function(A,B){return 'Сансрын хөлгийн туулах зам $'+A+'$ м. Хөлөг нэг секундэд $'+B+'$ м явдаг бол энэ замыг хэдэн секундэд туулах вэ?';},u:'с',w:'хугацаа'},
 {op:'div',eq:[18,22],ed:[-27,-24],t:function(A,B){return 'Бодисын нийт масс $'+A+'$ кг, нэг молекулын масс $'+B+'$ кг. Хэдэн молекул байгаа вэ?';},u:'ширхэг',w:'ширхгийн тоо'},
 {op:'div',eq:[2,3],ed:[12,13],t:function(A,B){return 'Нэгдүгээр од хүртэлх зай $'+A+'$ км, хоёрдугаар од хүртэлх зай $'+B+'$ км. Эхнийх нь хоёр дахиасаа хэдэн дахин хол вэ?';},u:'дахин',w:'харьцаа'},
 {op:'mul',eq:[-12,-10],ed:[6,8],t:function(A,B){return 'Нэг эсийн масс $'+A+'$ г бөгөөд эрхтэнд $'+B+'$ ширхэг эс байв. Нийт масс хэд вэ?';},u:'г',w:'нийт масс'},
 {op:'mul',eq:[3,4],ed:[2,5],t:function(A,B){return 'Хиймэл дагуул секундэд $'+A+'$ м явдаг. $'+B+'$ секундэд хэдэн метр замыг туулах вэ?';},u:'м',w:'зам'}
];
function mkMant(eT){
 var s=String(rnd(11,999));
 while(s.length>1&&s.charAt(s.length-1)==='0')s=s.slice(0,-1);
 return {M:Number(s),p:eT-(s.length-1)};
}
function g_p4_word(){
 for(var att=0;att<900;att++){
  var sc=pick(P4S);
  var o1=mkMant(rnd(sc.eq[0],sc.eq[1])),o2=mkMant(rnd(sc.ed[0],sc.ed[1]));
  var Mq=o1.M,pq=o1.p,Md=o2.M,pd=o2.p;
  if(sc.op==='div'){
   var Mn=Mq*Md,pn=pq+pd;
   if(!snOK(Md,pd)||!snOK(Mn,pn)||!snOK(Mq,pq))continue;
   var at=snTex(Mq,pq);
   var q=sc.t(snTex(Mn,pn),snTex(Md,pd));
   var a='$'+snTex(Mn,pn)+':\\bigl('+snTex(Md,pd)+'\\bigr)='+at+'$ '+sc.u+'.';
   return {q:q,a:a,key:'wd:'+sc.w+':'+Mq+pq+':'+Md+pd};
  }
  var M=Mq*Md,p=pq+pd;
  if(!snOK(Mq,pq)||!snOK(Md,pd)||!snOK(M,p))continue;
  var at2=snTex(M,p);
  var q2=sc.t(snTex(Mq,pq),snTex(Md,pd));
  var a2='$'+snTex(Mq,pq)+'\\cdot '+snTex(Md,pd)+'='+at2+'$ '+sc.u+'.';
  return {q:q2,a:a2,key:'wm:'+sc.w+':'+Mq+pq+':'+Md+pd};
 }
 return null;
}
var WSPEC={"title":"Язгуур доорх хувиргалт ба тодорхойлогдох муж — хүнд","sub":"n зэргийн язгуурын чанарууд · II бүлэг · 10-р анги","rule":"<b>Санамж:</b> Тэгш зэргийн язгуур зөвхөн $\\sqrt[2k]{u}$-ийн $u\\ge 0$ үед тодорхойлогдоно, сондгой зэргийн язгуур бүх бодит тоонд тодорхойлогдоно. Үржигдэхүүнийг язгуур доор оруулахдаа тэмдгийг нь заавал шалгана: $n$ тэгш ба $c\\lt 0$ бол $c\\sqrt[n]{u}=-\\sqrt[n]{c^{n}u}$. Бутархайн хуваарийг язгуураас чөлөөлөхдөө хүртвэр, хуваарийг тохирох илэрхийллээр үржүүлнэ. Кубын эзлэхүүн $V=a^{3}$, бүтэн гадаргуу $S=6a^{2}$.","ref":"","tasks":[{"label":"Язгуураас бүтэн зэргийг гаргаж хялбарчил.","fn":"g_p2_factorOut","cap":4,"cols":2,"wk":28},{"label":"Үржигдэхүүнийг язгуурын тэмдэг доор оруул. Тэмдгийг заавал шалга.","fn":"g_p2_intoRoot","cap":4,"cols":2,"wk":28},{"label":"Бутархайн хуваарийг язгуураас чөлөөл.","fn":"g_p2_freeDen","cap":3,"cols":2,"wk":28},{"label":"Илэрхийлэл тодорхойлогдох $x$-ийн бүх утгыг ол.","fn":"g_p2_domain","cap":3,"cols":2,"wk":28}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
