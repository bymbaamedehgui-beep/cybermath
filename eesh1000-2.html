<script>
/* ЭЕШ 1000 1-2 — ЭЕШ-ийн 1000 бодлого, 1-р хэсэг (26–50-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 26. R радиустай тойрогт багтсан гурвалжны суурийн өнцгүүд α, β → хажуу талууд 2R·sin β, 2R·sin α
//     (синусын теорем; эх: R=5, 45° ба 60° → 5√2 ба 5√3). Хариуг өсөх дарааллаар.
var p26_S = { 30: 1, 45: 2, 60: 3 };   // 2·sin α = √s
var p26_SIN = { 30: '\\dfrac{1}{2}', 45: '\\dfrac{\\sqrt{2}}{2}', 60: '\\dfrac{\\sqrt{3}}{2}' };
function p26() {
  var R = rnd(2, 10), pr = shuffle([30, 45, 60]).slice(0, 2), al = pr[0], be = pr[1];
  var s = [al, be].sort(function (x, y) { return x - y; }).map(function (t) { return rt(R, p26_S[t]); });
  // Бодолт (гар бичмэл): синусын теорем a/sin α = 2R → хажуу тал = 2R·(эсрэг орших суурийн өнцгийн синус).
  // Зураг: R = 1 тойрог, AB суурь доор; AB нумын төв өнцөг 2γ, BC нум 2α.
  var gm = 180 - al - be, aA = 270 - gm, aB = 270 + gm, aC = 270 + gm + 2 * al;
  var pt26 = function (d) { return [Math.cos(d * Math.PI / 180), Math.sin(d * Math.PI / 180)]; };
  var A = pt26(aA), B = pt26(aB), C = pt26(aC), f = Fig({ w: 150, pad: 20 });
  // 30°-ын өнцгийн нум/бичгийг томруулж бичиг хажуу талд хүрэхгүй байлгана
  var arc = function (d) { return d === 30 ? { r: 19, loff: 9 } : { r: 15, loff: 0 }; };
  f.circle([0, 0], 1, { c: '#8a8a8a', w: 1.1 }).poly([A, B, C])
    .angle(A, B, C, { r: arc(al).r, loff: arc(al).loff, label: al + '°', size: 11 }).angle(B, C, A, { r: arc(be).r, loff: arc(be).loff, label: be + '°', size: 11 })
    .text(A, 'A', { pos: aA }).text(B, 'B', { pos: aB }).text(C, 'C', { pos: aC });
  // Хажуу талын бичиг: хөвч ба нумын зай их (эсрэг өнцөг 60°, ≈0.5R) бол хөвчийн дунд цэгийн гадна талд, бусад үед тойргийн гадна
  var sideLab = function (P, Q, mid, half, nm) {   // mid — нумын дунд цэгийн чиглэл (°), half — нумын хагас = эсрэг өнцөг
    if (half >= 60) f.text([(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2], nm, { pos: mid, size: 12 });
    else f.text(pt26(mid), nm, { pos: mid, size: 12 });
  };
  sideLab(B, C, (aB + aC) / 2, al, 'a');
  sideLab(A, C, (aA + aC + 360) / 2, be, 'b');
  var side = function (nm, ang) { return nm + '&=2R\\sin ' + ang + DEG + '=2\\cdot ' + R + '\\cdot ' + p26_SIN[ang] + '=' + rt(R, p26_S[ang]); };
  return {
    q: R + ' радиустай тойрогт багтсан гурвалжны суурийн өнцгүүд $' + al + DEG + '$ ба $' + be + DEG + '$ байв. Энэ гурвалжны хажуу талуудын урт хэд вэ?',
    a: '$' + s[0] + '$ ба $' + s[1] + '$', wk: 28,
    s: [
      'Гурвалжны суурь $AB$, $\\angle A=' + al + DEG + '$, $\\angle B=' + be + DEG + '$ гэе. Хажуу талууд $a=BC$, $b=AC$ нь $A$, $B$ өнцгүүдийн эсрэг оршино.',
      'Синусын теоремоор $\\dfrac{a}{\\sin A}=\\dfrac{b}{\\sin B}=2R$ тул $$\\begin{aligned}' + side('a', al) + ',\\\\ ' + side('b', be) + '.\\end{aligned}$$'
    ],
    sfig: f.svg(),
    t: { R: R, al: al, be: be }
  };
}

// 27. Дөрвөн тэнцэтгэл бишийн шийдийн огтлолцол (эх: x≥1, −2<x≤3, 2≤x<4, x<2.5 → 2≤x<2.5).
//     0: x ≥ c (доод), 1–2: давхар, 3: x < c (дээд). Хязгаарлагч доод хил L ба дээд хил U нь хоёр өөр
//     тэнцэтгэл бишээс; бусад хил нь L-ээс (U-ээс) дор хаяж 0.5-аар сул тул хариуны хатуу/сул нь тодорхой.
function p27_s(o) {
  if (o.l != null && o.u != null) return dec(o.l) + (o.ls ? '\\lt ' : '\\le ') + 'x' + (o.us ? '\\lt ' : '\\le ') + dec(o.u);
  if (o.l != null) return 'x' + (o.ls ? '\\gt ' : '\\ge ') + dec(o.l);
  return 'x' + (o.us ? '\\lt ' : '\\le ') + dec(o.u);
}
function p27() {
  var L = rnd(-6, 6) / 2, U = L + rnd(1, 6) / 2, lo = rnd(0, 2), hi = rnd(1, 3), I = [{}, {}, {}, {}], i;
  if (lo === hi) return null;
  for (i = 0; i <= 2; i++) { I[i].l = i === lo ? L : L - rnd(1, 8) / 2; I[i].ls = rnd(0, 1) === 1; }
  for (i = 1; i <= 3; i++) { I[i].u = i === hi ? U : U + rnd(1, 8) / 2; I[i].us = rnd(0, 1) === 1; }
  if (I[0].l < -7 || I[1].l < -7 || I[2].l < -7 || I[1].u > 8 || I[2].u > 8 || I[3].u > 8) return null;
  var order = rnd(0, 1) ? [0, 1, 2, 3] : shuffle([0, 1, 2, 3]), S = order.map(function (j) { return p27_s(I[j]); });
  if (S[0] === S[1] || S[0] === S[2] || S[0] === S[3] || S[1] === S[2] || S[1] === S[3] || S[2] === S[3]) return null;
  var ans = dec(L) + (I[lo].ls ? '\\lt ' : '\\le ') + 'x' + (I[hi].us ? '\\lt ' : '\\le ') + dec(U);
  // Бодолт (гар бичмэл): шийдүүдийг тоон шулуун дээр дүрсэлж, давхацсан хэсгийг авна.
  var Q = order.map(function (j) { return I[j]; });
  var uq = function (a) { return a.filter(function (z, i) { return a.indexOf(z) === i; }); };
  var lows = uq(Q.filter(function (o) { return o.l != null; }).map(function (o) { return dec(o.l); }));
  var ups = uq(Q.filter(function (o) { return o.u != null; }).map(function (o) { return dec(o.u); }));
  return {
    q: 'Дөрвөн тэнцэтгэл бишийн шийд ' + S.map(function (s) { return '$' + s + '$'; }).join(', ') + ' гарчээ. Эдгээрийн огтлолцлыг ол.',
    a: '$' + ans + '$', wk: 22,
    s: [
      'Шийдүүдийг тоон шулуун дээр дүрсэлье (зураг). Огтлолцолд бүх тэнцэтгэл бишийг зэрэг хангах $x$ орно.',
      'Доод хилүүд: $' + lows.join(',\\ ') + '$, хамгийн их нь $' + dec(L) + '$ тул $x' + (I[lo].ls ? '\\gt ' : '\\ge ') + dec(L) + '$. Дээд хилүүд: $'
        + ups.join(',\\ ') + '$, хамгийн бага нь $' + dec(U) + '$ тул $x' + (I[hi].us ? '\\lt ' : '\\le ') + dec(U) + '$.',
      'Иймд огтлолцол $' + ans + '$.'
    ],
    sfig: p27_fig(Q, L, U, I[lo].ls, I[hi].us),
    t: { I: Q }
  };
}
// Бодолтын зураг: тоон шулуун (хилүүд тэнцүү зайтай, масштабгүй), тэнцэтгэл биш бүр өөр түвшинд, огтлолцол будсан
function p27_fig(Q, L, U, Ls, Us) {
  var vals = [];
  Q.forEach(function (o) { [o.l, o.u].forEach(function (v) { if (v != null && vals.indexOf(v) < 0) vals.push(v); }); });
  vals.sort(function (a, b) { return a - b; });
  var m = vals.length, X = function (v) { return vals.indexOf(v) + 1; }, x0 = 0.25, x1 = m + 0.75, K = '#5a32d6';
  var f = Fig({ free: true, w: 220, h: 128, view: [0, m + 1, -0.7, 4.5], pad: 12, padB: 22 });
  f.rect(X(L), 0, X(U), 4.35, { fill: K, op: 0.12, c: 'none' });
  Q.forEach(function (o, i) {
    var y = 4 - i, a = o.l != null ? X(o.l) : x0, b = o.u != null ? X(o.u) : x1;
    f.seg([a, y], [b, y], { w: 1.5 });
    if (o.l != null) f.seg([a, 0], [a, y], { w: 0.8, dash: '3 3', c: '#777' }).dot([a, y], { r: 2.6, open: o.ls });
    if (o.u != null) f.seg([b, 0], [b, y], { w: 0.8, dash: '3 3', c: '#777' }).dot([b, y], { r: 2.6, open: o.us });
  });
  f.seg([X(L), 0], [X(U), 0], { w: 4, c: K }).arrow([0, 0], [m + 1, 0], { w: 1.2, h: 7 }).text([m + 1, 0], 'x', { pos: 'se', size: 12 })
    .ticks(vals.map(function (v) { return [X(v), dec(v)]; }), [], { size: 11 })
    .dot([X(L), 0], { r: 2.8, open: Ls, c: K }).dot([X(U), 0], { r: 2.8, open: Us, c: K });
  return f.svg();
}

// 28. (p·a + q·b)·(r·a + s·b) скаляр үржвэр (эх: a=(3,2), b=(−1,2); (a+b)·(2a−b) = 22).
function p28() {
  var a = [rnd(-5, 5), rnd(-5, 5)], b = [rnd(-5, 5), rnd(-5, 5)];
  if (a[0] * b[1] - a[1] * b[0] === 0) return null;
  var C = [1, 1, 2, 3, -1, -2], p = pick([1, 1, 2, 3]), q = pick(C), r = pick([1, 2, 2, 3]), s = pick(C);
  if (p * s - q * r === 0) return null;
  var u = [p * a[0] + q * b[0], p * a[1] + q * b[1]], w = [r * a[0] + s * b[0], r * a[1] + s * b[1]], v = u[0] * w[0] + u[1] * w[1];
  if (v === 0 || Math.abs(v) > 150) return null;
  var cb = function (x, y) { return tm(x, '\\vec a', true) + tm(y, '\\vec b'); }, P = cb(p, q), Q = cb(r, s);
  // Бодолт (гар бичмэл): хоёр векторын координатыг олж, скаляр үржвэр = x₁x₂ + y₁y₂.
  var co = function (k1, k2) { return '(' + p28_lin(k1, a[0], k2, b[0]) + ',\\ ' + p28_lin(k1, a[1], k2, b[1]) + ')'; };
  var vc = function (z) { return '(' + z[0] + ',' + z[1] + ')'; }, pr = [], sm = [];
  [0, 1].forEach(function (i) { if (u[i] && w[i]) { pr.push(par(u[i]) + '\\cdot ' + par(w[i])); sm.push(u[i] * w[i]); } });
  var dot = pr.join('+') + (sm.length > 1 ? '=' + sm[0] + sgn(sm[1]) : '') + '=' + v;
  return {
    q: '$\\vec a=(' + a[0] + ',' + a[1] + '),\\ \\vec b=(' + b[0] + ',' + b[1] + ')$ векторууд өгчээ. $' + P + '$ ба $' + Q + '$ векторуудын скаляр үржвэрийг ол.',
    a: '$(' + P + ')\\cdot(' + Q + ')=' + v + '$', wk: 22,
    s: [
      'Векторуудын координатыг олъё: $$' + P + '=' + co(p, q) + '=' + vc(u) + ',$$ $$' + Q + '=' + co(r, s) + '=' + vc(w) + '.$$',
      'Скаляр үржвэр нь харгалзах координатуудын үржвэрийн нийлбэр: $$' + vc(u) + '\\cdot ' + vc(w) + '=' + dot + '.$$'
    ],
    t: { a: a, b: b, p: p, q: q, r: r, s: s }
  };
}
// k₁·x + k₂·y-ийн бичлэг (гар бичмэлийн «3−1», «6+1» маягаар): ±1 коэффициенттэй гишүүнийг шууд тоогоор, 0-ийг алгасна
function p28_lin(k1, x, k2, y) {
  var out = '';
  [[k1, x], [k2, y]].forEach(function (t) {
    var c = t[0], z = t[1], neg, body;
    if (!z) return;
    if (Math.abs(c) === 1) { neg = c * z < 0; body = String(Math.abs(z)); }
    else { neg = c < 0; body = Math.abs(c) + '\\cdot ' + par(z); }
    out += neg ? '-' + body : (out ? '+' : '') + body;
  });
  return out || '0';
}

// 29. Шоо хаях туршилтын давтамжийн хүснэгт, нэг давтамж x; арифметик дундаж M өгөгдсөн → x
//     (эх: 5, x, 2, 8, 6, 1; M = 3.4 → x = 3). M — 1 (заримдаа 2) аравтын оронтой, M ≠ j (x цор ганц).
function p29() {
  var F = [1, 2, 3, 4, 5, 6].map(function () { return rnd(1, 9); }), j = rnd(1, 6), x = rnd(1, 9), S = 0, N = 0;
  F[j - 1] = x;
  F.forEach(function (f, i) { S += f * (i + 1); N += f; });
  if (N < 15 || S === j * N) return null;
  if ((10 * S) % N !== 0 && !((100 * S) % N === 0 && rnd(0, 3) === 0)) return null;
  var M = S / N, row = ['Давтамж'].concat(F.map(function (f, i) { return i === j - 1 ? '$x$' : f; }));
  // Бодолт (гар бичмэл): дундаж = Σ(тоо·давтамж) / Σ давтамж → x-ийн шугаман тэгшитгэл.
  var S0 = S - j * x, N0 = N - x, MN = +(M * N0).toFixed(6);
  var cf = +Math.abs(M - j).toFixed(6), rh = +Math.abs(S0 - MN).toFixed(6);
  var num = F.map(function (f, i) { return (i + 1) + '\\cdot ' + (i === j - 1 ? 'x' : f); }).join('+');
  var den = F.map(function (f, i) { return i === j - 1 ? 'x' : f; }).join('+');
  return {
    q: 'Шоо хаях туршилтын үр дүнг хүснэгтэд үзүүлжээ. Хэрэв нийт буусан тоонуудын арифметик дундаж ' + dec(M) + ' бол $x$-ийг ол.',
    a: '$x=' + x + '$', fig: tbl([['Тоо', 1, 2, 3, 4, 5, 6], row]), wk: 26,
    s: [
      'Арифметик дундгийн томьёогоор $$\\dfrac{' + num + '}{' + den + '}=' + dec(M) + '.$$',
      'Эндээс $' + S0 + tm(j, 'x') + '=' + dec(M) + '\\cdot(' + N0 + '+x)$, өөрөөр хэлбэл $' + S0 + tm(j, 'x') + '=' + dec(MN) + '+' + dec(M) + 'x$.',
      'Иймд $' + (cf === 1 ? '' : tm(cf, 'x', true) + '=' + dec(rh) + '\\Rightarrow ') + 'x=' + x + '$.'
    ],
    t: { F: F, j: j }
  };
}

// 30. Хуримтлагдсан давтамжийн муруй (огив), n = 4k − 1: Q1 = k-р утга, Q3 = 3k-р утга → IQR = x(3k) − x(k)
//     (эх: n = 27 → Q1 = 33, Q3 = 69, IQR = 36). Зангилаа бүр торын цэг дээр (x — 3-ын үржвэр, y — бүхэл),
//     муруй — монотон сплайн; эхээс бусад зангилаа бүрт тэнхлэг хүртэл тасархай зураас (квартилиудыг ялгахгүй).
function p30() {
  var n = pick([23, 27, 27, 31, 35, 39]), k = (n + 1) / 4, pool = [], y, t;
  var ia = rnd(4, 8), ya = rnd(1, 3), i1 = ia + rnd(2, 5), nm = rnd(1, 2);
  for (y = k + 2; y <= 3 * k - 2; y++) pool.push(y);
  var ym = shuffle(pool).slice(0, nm).sort(function (a, b) { return a - b; });
  if (nm === 2 && ym[1] - ym[0] < 2) return null;
  var K = [[0, 0], [3 * ia, ya], [3 * i1, k]], ii = i1;
  ym.forEach(function (yy) { ii += rnd(1, 5); K.push([3 * ii, yy]); });
  var i3 = ii + rnd(1, 5), ib = i3 + rnd(2, 6), imax = rnd(28, 30);
  if (ib >= imax) return null;
  K.push([3 * i3, 3 * k], [3 * ib, n - rnd(1, 2)], [3 * imax, n]);
  for (t = 1; t < K.length; t++) { var s = (K[t][1] - K[t - 1][1]) / ((K[t][0] - K[t - 1][0]) / 3); if (s < 0.15 || s > 4) return null; }
  var S = spline(K), X1 = 3 * i1, X3 = 3 * i3, VX = 96, VY = n + 3, cy = Math.min(9.5, Math.max(6.8, 260 / VY));
  var f = Fig({ free: true, w: 320, h: 52 + VY * cy, view: [0, VX, 0, VY], padL: 46, padR: 16, padT: 12, padB: 40 });
  f.grid({ x: 3, y: 1 }, { c: '#c4c4c4', w: 0.6 });
  K.slice(1).forEach(function (p) { f.seg([0, p[1]], p, { dash: '6 4', w: 1.3 }).seg(p, [p[0], 0], { dash: '6 4', w: 1.3 }); });
  f.curve(S, 0, K[K.length - 1][0], { w: 2.2 }, 500);
  f.axes({ x: false, y: false, o: false });
  var yt = [];
  for (y = 5; y <= n - 2; y += 5) yt.push(y);
  yt.push(n);
  f.ticks([15, 30, 45, 60, 75, 90], yt, { size: 11 });
  f.text([VX / 2, 0], 'Хугацаа', { plain: true, pos: 's', off: 21, size: 12 });
  f.text([0, VY / 2], 'Хуримтлагдсан давтамж', { plain: true, pos: 'w', off: 27, size: 11.5, anchor: 'middle', rot: -90 });
  // Бодолт (гар бичмэл): Q₁ = (n+1)/4-р, Q₃ = 3(n+1)/4-р утга; графикаас хугацааг уншина.
  return {
    q: 'Зурагт өгөгдсөн хуримтлагдсан давтамжийн график ашиглан квартил хоорондын далайцыг ол.',
    a: '$IQR=Q_3-Q_1=' + X3 + '-' + X1 + '=' + (X3 - X1) + '$', fig: f.svg(), wk: 30,
    s: [
      'Хуримтлагдсан давтамжийн хамгийн их утга $n=' + n + '$ нь нийт өгөгдлийн тоо. Эрэмбэлсэн өгөгдлийн $Q_1$ нь $' + k + '$-р, $Q_3$ нь $' + 3 * k + '$-р утга:'
        + ' $$\\dfrac{n+1}{4}=\\dfrac{' + n + '+1}{4}=' + k + ',\\qquad \\dfrac{3(n+1)}{4}=\\dfrac{3\\cdot ' + (n + 1) + '}{4}=' + 3 * k + '.$$',
      'Босоо тэнхлэгийн $' + k + '$ ба $' + 3 * k + '$ утгаас хэвтээ шулуун татаж, муруйтай огтлолцсон цэгээс хэвтээ тэнхлэгт буулгавал $$Q_1=' + X1 + ',\\qquad Q_3=' + X3 + '.$$',
      'Иймд $IQR=Q_3-Q_1=' + X3 + '-' + X1 + '=' + (X3 - X1) + '$.'
    ],
    t: { n: n, K: K }
  };
}

// 31. P(x) = kx³ + ax² + b нь (x − r)²-д хуваагдана ⇔ P(r) = P'(r) = 0 → a = −3kr/2, b = kr³/2
//     (эх: P = 2x³ + ax² + b, (x+2)² → a = 6, b = −8, ab = −48). kr тэгш байх ёстой (a, b бүхэл).
function p31() {
  var k = rnd(1, 4), r = pick([-3, -2, -1, 1, 2, 3]);
  if ((k * r) % 2 !== 0) return null;
  var a = -3 * k * r / 2, b = k * r * r * r / 2, ask = pick(['ab', 'ab', 'a+b']), v = ask === 'ab' ? a * b : a + b;
  if (Math.abs(a * b) > 400) return null;
  // Бодолт (гар бичмэл): Безугийн теоремоор P(r) = 0; (x − r)² | P → (x − r) | P' → P'(r) = 0 → a, дараа нь b.

        + anc + '" fill="#1b1b1b">' + nm + ' <tspan font-style="italic">x</tspan></text>';
    };
  };
  f.axes({ ext: 6 }).arc([0, 0], 1, 0, 90, { w: 1.1, c: '#888' }).seg([0, 0], [1.18, 1.18], { dash: '5 3', w: 1 })
    .arc([0, 0], 1, low ? 0 : 45, low ? 45 : 90, { w: 3.2, c: K })
    .seg([0, 0], M, { w: 1 }).seg(M, [M[0], 0], { dash: '3 2', w: 0.9 }).seg(M, [0, M[1]], { dash: '3 2', w: 0.9 }).dot(M, { r: 2.4 })
    .text(M, 'M', { pos: low ? 'e' : 'ne', size: 12 }).text([1.16, 1.16], 'y=x', { pos: 'w', size: 11 })
    .raw(fx([M[0], 0], 'cos', 'middle', 0, 13)).raw(fx([0, M[1]], 'sin', 'end', -4, 4));
  return f.svg();
}

// 35. Бичлэгт нь d цифр яг k удаа орсон (тэгш / сондгой / 5-д хуваагддаг) гурван оронтой тоо хэд вэ?
//     Нэгжийн цифр u (нөхцөлөөр) бүрд: (зуут 1–9, аравт 0–9) хосод d яг (k − [u = d]) удаа орох тоог нэмнэ.
function p35() {
  var d = rnd(0, 9), k = rnd(1, 4) === 4 ? 2 : 1, pr = rnd(0, 5);
  pr = pr < 3 ? 0 : pr < 5 ? 1 : 2;   // тэгш (эх) илүү олон
  var W = ['тэгш', 'сондгой', sfx(5, 'д') + ' хуваагддаг'], U = [[0, 2, 4, 6, 8], [1, 3, 5, 7, 9], [0, 5]][pr];
  var hd = d >= 1 ? 1 : 0, hn = 9 - hd;           // зуутын оронд d байх / байхгүй сонголт
  var ways = [hn * 9, hd * 9 + hn * 1, hd * 1];  // (зуут, аравт)-д d яг 0, 1, 2 удаа
  var N = 0;
  U.forEach(function (u) { var need = k - (u === d ? 1 : 0); if (need >= 0 && need <= 2) N += ways[need]; });
  if (N < 4) return null;
  // Бодолт (гар бичмэл): d цифр аль оронд (зуут, аравт, нэгж) орсноор ангилж, бусад оронд d-ээс ялгаатай цифрийн сонголтыг үржүүлнэ.
  var inU = U.indexOf(d) >= 0, Uo = U.filter(function (z) { return z !== d; });
  var ch = [9 - hd, 9, Uo.length];                // d-ээс ялгаатай цифрийн сонголт: зуут, аравт, нэгж
  var pats = k === 1 ? [[0], [1], [2]] : [[0, 1], [0, 2], [1, 2]], lines = [], sum = [];
  pats.forEach(function (ps) {
    var L = 'ab', li = 0, nm = '', f = [];
    for (var i = 0; i < 3; i++) { if (ps.indexOf(i) >= 0) nm += '{' + d + '}'; else { nm += L[li++]; f.push(ch[i]); } }
    var o = '$\\overline{' + nm + '}$';
    if (ps.indexOf(0) >= 0 && d === 0) lines.push(o + ' — зуутын цифр $0$ байж болохгүй');
    else if (ps.indexOf(2) >= 0 && !inU) lines.push(o + ' — ' + ['тэгш биш', 'сондгой биш', sfx(5, 'д') + ' хуваагдахгүй'][pr]);
    else { var c = f.reduce(function (x, y) { return x * y; }, 1); sum.push(c); lines.push(o + ': $' + (f.length > 1 ? f.join('\\cdot ') + '=' : '') + c + '$'); }
  });
  var Ud = Uo.join(',\\ ');
  return {
    q: 'Бичлэгт нь ' + sfx(d, 'ын') + ' цифр яг ' + k + ' удаа орсон ' + W[pr] + ' гурван оронтой тоо хичнээн байх вэ?',
    a: '$' + N + '$',
    wk: 26,
    s: [
      '$' + d + '$ цифр аль оронд орсноор ангилъя. ' + (k === 1 ? '$a$, $b$' : '$a$') + ' нь $' + d + '$-' + suf(d, 'аас') + ' ялгаатай цифр бөгөөд зуутын оронд $' + ch[0] + '$ ('
        + (d ? '$0$ ба $' + d + '$-' + suf(d, 'аас') + ' бусад' : '$0$-ээс бусад') + '), аравтын оронд $' + ch[1] + '$, нэгжийн оронд $' + ch[2] + '$ ($' + Ud + '$) янзаар орно.',
      lines.join('; ') + '.',
      sum.length > 1 ? 'Нийт $' + sum.join('+') + '=' + N + '$.' : 'Иймд $' + N + '$ тоо байна.'
    ],
    t: { d: d, k: k, pr: pr, N: N }
  };
}

// 36. P төгрөгийг m сар тутам r% (нийлмэл) хүүтэй жил хадгалуулах нь жилийн n·r% (n = 12/m) хүүтэйгээс хэдээр илүү:
//     P·((1 + r/100)^n − 1 − n·r/100) = P·((100+r)^n − 100^n − n·r·100^(n−1)) / 100^n. Бүхэл бус бол төгрөгөөр тоймлоно (≈).
var p36_P = [[5e5, '500 мянган'], [1e6, '1 сая'], [1e6, '1 сая'], [2e6, '2 сая'], [3e6, '3 сая'], [5e6, '5 сая']];
function p36_th(n) {   // 2727 → 2\,727 (мянгатыг зайгаар)
  var s = String(n), out = '';
  while (s.length > 3) { out = '\\,' + s.slice(-3) + out; s = s.slice(0, -3); }
  return s + out;
}
function p36() {
  var P = pick(p36_P), m = pick([3, 4, 4, 6]), n = 12 / m, r = rnd(1, 5);
  var D = Math.pow(100, n), num = P[0] * (Math.pow(100 + r, n) - D - n * r * Math.pow(100, n - 1));
  var v = Math.floor(num / D), rem = num - v * D;
  if (rem < 0) { v--; rem += D; } else if (rem >= D) { v++; rem -= D; }
  var approx = rem !== 0;
  if (approx) {
    if (Math.abs(rem / D - 0.5) < 0.05) return null;   // тоймлоход хоёрдмол
    if (rem / D > 0.5) v++;
  }
  if (v < 100) return null;
  // Бодолт (гар бичмэл): нийлмэл хүү P·(1 + r/100)^n, энгийн жилийн хүү P·(1 + n·r/100), ялгавар. (n = 12/m — жилд хүү бодогдох тоо)
  var A1 = P[0] * Math.pow(100 + r, n), A2 = P[0] * (100 + n * r) / 100;   // A1 = (жилийн эцсийн дүн)·100^n — бүхэл, яг
  var P0 = p36_th(P[0]), g1 = dec(1 + r / 100), g2 = dec(1 + n * r / 100);
  return {
    q: P[1] + ' төгрөгийг ' + m + ' сар тутам $' + r + '\\%$ хүүтэйгээр жил хадгалуулах нь жилийн $' + n * r
      + '\\%$ хүүтэйгээр жил хадгалуулахаас хэдэн төгрөгөөр илүү ашигтай вэ?',
    a: '$' + (approx ? '\\approx ' : '') + p36_th(v) + '$ төгрөг',
    wk: 30,
    s: [
      'Жилд $12:' + m + '=' + n + '$ удаа $' + r + '\\%$-ийн хүү бодогдож, хүү нь мөнгөн дээр нэмэгдэнэ. Нийлмэл хүүгийн томьёогоор жилийн эцэст $$'
        + P0 + '\\cdot ' + g1 + '^' + n + '=' + p36_dn(A1, D) + '\\text{ төг}.$$',
      'Жилийн $' + n * r + '\\%$-ийн хүүтэй бол жилийн эцэст $' + P0 + '\\cdot ' + g2 + '=' + p36_th(A2) + '$ төг.',
      'Иймд $' + p36_dn(A1, D) + '-' + p36_th(A2) + '=' + p36_dn(A1 - A2 * D, D) + (approx ? '\\approx ' + p36_th(v) : '') + '$ төгрөгөөр илүү ашигтай.'
    ],
    t: { P: P[0], m: m, r: r }
  };
}
// num/den (den = 100^n, num бүхэл) → аравтын бутархай, бүхэл хэсгийг мянгатаар: 1\,125\,508.81
function p36_dn(num, den) {
  var ip = Math.floor(num / den), fp = num - ip * den, s = p36_th(ip);
  if (fp) { var fs = String(fp); while (fs.length < String(den).length - 1) fs = '0' + fs; s += '.' + fs.replace(/0+$/, ''); }
  return s;
}

// 37. c·x² ± k·a·x (≤ | < | ≥ | >) 0 тэнцэтгэл биш (a — параметр). Язгуурууд 0 ба ρ = κ·a, κ = ∓k/c.
//     a > 0, a = 0, a < 0 гурван тохиолдол: завсар / гаднах хэсэг; a = 0 үед c·x² (≤ → x = 0, < → шийдгүй, ≥ → ℝ, > → x ≠ 0).
function p37_m(n, d) {   // (n/d)·a → a, -a, 2a, \dfrac{3a}{2}, -\dfrac{a}{2}
  var g = gcd(n, d); n /= g; d /= g;
  var s = n < 0 ? '-' : '', A = Math.abs(n);
  if (d === 1) return s + (A === 1 ? '' : A) + 'a';
  return s + '\\dfrac{' + (A === 1 ? '' : A) + 'a}{' + d + '}';
}
function p37() {
  var ck = pick([[1, 1], [1, 1], [1, 1], [1, 2], [1, 2], [1, 3], [1, 3], [2, 1], [2, 3], [3, 1], [3, 2]]), c = ck[0], k = ck[1];
  var s = pick([-1, -1, 1]), rel = pick(['\\le', '\\le', '\\lt', '\\ge', '\\gt']);
  var lhs = (c === 1 ? '' : c) + 'x^2' + (s < 0 ? '-' : '+') + (k === 1 ? '' : k) + 'ax';
  var kn = -s * k, R = p37_m(kn, c);          // ρ = (kn/c)·a
  var strict = rel === '\\lt' || rel === '\\gt', inside = rel === '\\le' || rel === '\\lt';
  function part(lo, hi) {
    if (inside) { var o = strict ? '\\lt' : '\\le'; return '$' + lo + o + ' x' + o + ' ' + hi + '$'; }
    return '$x' + (strict ? '\\lt' : '\\le') + ' ' + lo + '$ эсвэл $x' + (strict ? '\\gt' : '\\ge') + ' ' + hi + '$';
  }
  // a > 0: ρ-ийн тэмдэг = kn-ийн тэмдэг; a < 0: эсрэг
  var pos = kn > 0 ? part('0', R) : part(R, '0'), neg = kn > 0 ? part(R, '0') : part('0', R);
  var zero = { '\\le': '$x=0$', '\\lt': 'шийдгүй', '\\ge': '$x\\in\\mathbb{R}$', '\\gt': '$x\\ne 0$' }[rel];
  // Бодолт (гар бичмэл): x-ийг хаалтнаас гаргаж x(cx ± ka) ≤ 0; язгуурууд 0 ба ρ; a-гийн тэмдгээр язгууруудын байрлал өөрчлөгдөнө.
  // (Гар бичмэлд a = 0 тохиолдол орхигдсон — нэмж бичив.)
  var fac = 'x(' + (c === 1 ? '' : c) + 'x' + (s < 0 ? '-' : '+') + (k === 1 ? '' : k) + 'a)', cx2 = (c === 1 ? '' : c) + 'x^2';
  // ρ-ийн тэмдэг (a > 0 үед kn-ийн тэмдэгтэй ижил); ρ = a бол давтахгүй
  var rs = function (sg) { return R === 'a' ? '' : '$' + R + (sg > 0 ? '\\gt' : '\\lt') + ' 0$ тул '; };
  var z0 = { '\\le': '$' + cx2 + '\\le 0\\Rightarrow x=0$', '\\lt': '$' + cx2 + '\\lt 0$ — шийдгүй (учир нь $' + cx2 + '\\ge 0$)',
    '\\ge': '$' + cx2 + '\\ge 0$ — бүх $x$-д биелнэ, $x\\in\\mathbb{R}$', '\\gt': '$' + cx2 + '\\gt 0\\Rightarrow x\\ne 0$' }[rel];
  return {
    q: '$' + lhs + rel + ' 0$ тэнцэтгэл бишийг бод.',
    a: '$a\\gt 0$ үед ' + pos + '; $a=0$ үед ' + zero + '; $a\\lt 0$ үед ' + neg,
    wide: true, wk: 32,
    s: [
      '$' + lhs + rel + ' 0\\Rightarrow ' + fac + rel + ' 0$. Язгуурууд нь $x=0$ ба $x=' + R + '$. $y=' + lhs + '$ парабол дээшээ салаатай тул шийд нь язгууруудын '
        + (inside ? 'хоорондох завсар' : 'гадна талын хэсэг') + (strict ? ' (язгуурууд орохгүй)' : ' (язгуурууд орно)') + '.',
      '$a\\gt 0$ үед ' + rs(kn) + pos + '.',
      '$a=0$ үед ' + z0 + '.',
      '$a\\lt 0$ үед ' + rs(-kn) + neg + '.'
    ],
    t: { c: c, k: k, s: s, rel: rel }
  };
}

// 38. Куб функцийн бүх минимумын цэг. y' = k(x − p)(x − q), p < q:
//     y = (k/3)x³ − (k(p+q)/2)x² + kpq·x + c; k > 0 бол минимум x = q, k < 0 бол x = p.  (6y-ээр бүхэл тооцоолно)
function p38() {
  var k = pick([2, 2, -2, 3, -3, 6, -6]), p = rnd(-3, 4), q = rnd(-3, 5), c = nz(-6, 9);
  if (p >= q || p + q === 0 || p * q === 0) return null;
  if (Math.abs(k) === 3 && (p + q) % 2) return null;          // x²-ийн коэффициент бүхэл байх
  var c3 = [2 * k, 6], c2 = [-3 * k * (p + q), 6], c1 = k * p * q;
  if (Math.abs(c1) > 40 || Math.abs(c2[0] / 6) > 24) return null;
  var xm = k > 0 ? q : p, Y6 = 2 * k * xm * xm * xm - 3 * k * (p + q) * xm * xm + 6 * k * p * q * xm + 6 * c;
  if (Math.abs(Y6) > 6 * 70) return null;
  if (Y6 % 6 && rnd(1, 20) > 7) return null;                 // бүхэл y_min илүү олон (эх: 10)
  // Бодолт (гар бичмэл): y' = k(x² − (p+q)x + pq) = 0 → D → x₁, x₂; тэмдгийн шугам → «−»-аас «+» болох цэг минимум; y_min-ийг орлуулж олно
  var S = p + q, Pq = p * q, X = par(xm), mx = k > 0 ? p : q;
  var terms = [[[2 * k, 6], 3], [[-3 * k * S, 6], 2], [[k * Pq, 1], 1], [[c, 1], 0]];
  var sub = terms.map(function (o, i) { return p38_m(o[0][0], o[0][1], X, o[1], !i); }).join('');
  var vals = terms.map(function (o, i) { return p38_v(o[0][0] * Math.pow(xm, o[1]), o[0][1], !i); }).join('');
  return {
    q: '$y=' + poly([c3, c2, c1, c]) + '$ функцийн бүх минимумын цэгийг ол.',
    a: '$x_{min}=' + xm + '$, $y_{min}=' + fr(Y6, 6) + '$',
    wk: 32,
    s: [
      'Уламжлалыг олбол $$y\'=' + poly([k, -k * S, k * Pq]) + '=' + k + '(' + poly([1, -S, Pq]) + ').$$',
      '$y\'=0$ үед $' + poly([1, -S, Pq]) + '=0$, $D=' + S * S + '-4\\cdot ' + par(Pq) + '=' + (S * S - 4 * Pq) + '$, $$x_{1,2}=\\dfrac{' + S + '\\pm ' + (q - p)
        + '}{2}\\Rightarrow x_1=' + p + ',\\ x_2=' + q + '.$$',
      'Уламжлалын тэмдгийг тоон шулуун дээр тэмдэглэе (зураг). $x=' + xm + '$ цэгийг дайрахад $y\'$-ийн тэмдэг «−»-аас «+» болж өөрчлөгдөх тул $x=' + xm
        + '$ нь минимумын цэг, харин $x=' + mx + '$ цэгт «+»-ээс «−» болж өөрчлөгдөх тул максимумын цэг байна.',
      '$$y_{min}=y(' + xm + ')=' + sub + '=' + vals + '=' + fr(Y6, 6) + '.$$'
    ],
    sfig: signLine({ pts: [String(p), String(q)], sg: k > 0 ? ['+', '-', '+'] : ['-', '+', '-'], arr: true, tag: k > 0 ? { 0: 'max', 1: 'min' } : { 0: 'min', 1: 'max' } }),
    t: { k: k, p: p, q: q, c: c }
  };
}
// Орлуулалтын гишүүн: (n/d)·X^e (X — хаалттай тоо), тэмдэгтэй; |n/d| = 1 бол коэффициентийг бичихгүй
function p38_m(n, d, X, e, first) {
  var g = gcd(n, d), a = Math.abs(n / g), b = d / g, co = a === 1 && b === 1 && e ? '' : (b === 1 ? String(a) : '\\frac{' + a + '}{' + b + '}') + (e ? '\\cdot ' : '');
  return (n < 0 ? '-' : first ? '' : '+') + co + (e ? X + (e > 1 ? '^' + e : '') : '');
}
// Утга n/d (хураасан), эхнийхээс бусдад тэмдэгтэй
function p38_v(n, d, first) { var t = fr(n, d); return first || t[0] === '-' ? t : '+' + t; }

// 39. A(x, A₂, A₃), B(B₁, y, B₃), k·AB⃗ = a⃗ → x = B₁ − a₁/k, y = A₂ + a₂/k, x + y = B₁ + A₂ + (a₂ − a₁)/k.
//     Гуравдахь координат нийцтэй: a₃ = k(B₃ − A₃).
function p39() {
  var k = pick([2, 2, 2, -2, 3, -3]);
  var B1 = rnd(-3, 6), A2 = rnd(-3, 6), A3 = rnd(-4, 9), dz = nz(-8, 9), a1 = nz(-9, 9), a2 = nz(-9, 9);
  var B3 = A3 + dz, a3 = k * dz;
  if (Math.abs(a3) > 20 || B3 === 0 || Math.abs(B3) > 15) return null;
  if (a1 % k === 0 && a2 % k === 0) return null;          // x, y хоёул бүхэл байхгүй (эх: 3.5)
  var sN = (B1 + A2) * k + a2 - a1;                       // x + y = sN / k
  var sum = Math.abs(k) === 2 ? dec(sN / k) : fr(sN, k);
  if (Math.abs(sN / k) > 15) return null;
  // Бодолт (гар бичмэл): k·AB⃗-ийн координатыг a⃗-ийнхтэй тэнцүүлж x, y-г олно
  var v = function (n) { return Math.abs(k) === 2 ? dec(n / k) : fr(n, k); };
  var xs = v(k * B1 - a1), ys = v(a2 + k * A2);
  var ab = '(' + (B1 ? B1 + '-x' : '-x') + ',\\,' + (A2 ? 'y' + sgn(-A2) : 'y') + ',\\,' + dz + ')';
  var e1 = (k * B1 ? String(k * B1) : '') + tm(-k, 'x', !(k * B1)), e2 = tm(k, 'y', true) + (A2 ? sgn(-k * A2) : '');
  return {
    q: '$A(x,\\,' + A2 + ',\\,' + A3 + '),\\ B(' + B1 + ',\\,y,\\,' + B3 + ')$ цэгүүд ба $\\vec a=(' + a1 + ',\\,' + a2 + ',\\,' + a3
      + ')$ вектор өгөв. $' + k + '\\cdot\\overrightarrow{AB}=\\vec a$ бол $x+y$ нийлбэрийг ол.',
    a: '$x+y=' + sum + '$',
    wk: 24,
    s: [
      '$\\overrightarrow{AB}$-ийн координатыг $B$ цэгийн координатаас $A$ цэгийнхийг хасаж олно: $$' + k + '\\cdot\\overrightarrow{AB}=' + k + '\\cdot' + ab
        + '=(' + e1 + ',\\,' + e2 + ',\\,' + a3 + ')=(' + a1 + ',\\,' + a2 + ',\\,' + a3 + ').$$',
      'Харгалзах координатуудыг тэнцүүлбэл $$' + e1 + '=' + a1 + '\\Rightarrow x=' + xs + ',\\qquad ' + e2 + '=' + a2 + '\\Rightarrow y=' + ys + '.$$',
      'Иймд $x+y=' + (ys === '0' ? '' : xs + (ys[0] === '-' ? ys : '+' + ys) + '=') + sum + '$.'
    ],
    t: { k: k, A: [null, A2, A3], B: [B1, null, B3], a: [a1, a2, a3] }
  };
}

// 40. Координатын эх дээр төвтэй θ өнцгийн эргүүлэлтийн матриц R(θ)-ийн урвуу: R⁻¹ = R(−θ) = Rᵀ.
//     Утгууд яг: 1/√2 (45°, 135°), √3/2 ба 1/2 (30°, 60°, 120°, 150°), 0 ба 1 (90°). Цагийн зүүний эсрэг/дагуу.
function p40_cs(deg) {   // [cos, sin] TeX (яг утга), deg — 15-ын үржвэр
  var B = { 0: ['1', '0'], 30: ['\\frac{\\sqrt{3}}{2}', '\\frac{1}{2}'], 45: ['\\frac{1}{\\sqrt{2}}', '\\frac{1}{\\sqrt{2}}'],
    60: ['\\frac{1}{2}', '\\frac{\\sqrt{3}}{2}'], 90: ['0', '1'] };
  var a = ((deg % 360) + 360) % 360, q = Math.floor(a / 90), b = a - 90 * q, cs = B[b];
  var neg = function (t) { return t === '0' ? '0' : t[0] === '-' ? t.slice(1) : '-' + t; };
  if (q === 0) return [cs[0], cs[1]];
  if (q === 1) return [neg(cs[1]), cs[0]];
  if (q === 2) return [neg(cs[0]), neg(cs[1])];

        + (sw ? v2 + '+' + v1 : v1 + '+' + v2) + '}=\\sqrt{' + d2 + '}' + (S.k > 1 ? '=' + S.tex : '') + '.$$'
    ],
    t: { a: a, b: b, c: c }
  };
}

// 45. A (m×n), B (p×q) матрицуудын хувьд A+B, AB, BA, A², B² үйлдлүүдээс аль нь гүйцэтгэгдэх вэ?
//     A+B: хэмжээ ижил; AB: n = p; BA: q = m; A²: m = n; B²: p = q.  (эхэд жагсаалт алга — бид нэмэв)
var p45_S = [[2, 2], [2, 2], [2, 1], [1, 2], [2, 3], [3, 2], [3, 1], [1, 3]];
function p45_M(r, c) { var M = [], i, j; for (i = 0; i < r; i++) { M.push([]); for (j = 0; j < c; j++) M[i].push(nz(-6, 7)); } return M; }
function p45() {
  var sa = pick(p45_S), sb = pick(p45_S), A = p45_M(sa[0], sa[1]), B = p45_M(sb[0], sb[1]);
  var ok = [
    ['A+B', sa[0] === sb[0] && sa[1] === sb[1]], ['AB', sa[1] === sb[0]], ['BA', sb[1] === sa[0]],
    ['A^2', sa[0] === sa[1]], ['B^2', sb[0] === sb[1]]
  ].filter(function (o) { return o[1]; }).map(function (o) { return '$' + o[0] + '$'; });
  if (!ok.length || ok.length === 5) return null;
  if (sa[0] * sa[1] + sb[0] * sb[1] > 12) return null;   // хэт том биш
  var ans = ok.length === 1 ? ok[0] : ok.slice(0, -1).join(', ') + ' ба ' + ok[ok.length - 1];
  // Бодолт (гар бичмэл нэг мөр: «AB үржих үйлдлийг гүйцэтгэж болно») — хэмжээсээр үйлдэл бүрийг шалгана
  var m = sa[0], n = sa[1], p = sb[0], q = sb[1], sz = function (r, c) { return '(' + r + '\\times ' + c + ')'; };
  var mul = function (X, Y, s1, s2) {   // X·Y: X-ийн баганын тоо = Y-ийн мөрийн тоо
    return '$' + X + Y + '$: $' + sz(s1[0], s1[1]) + '\\cdot' + sz(s2[0], s2[1]) + '$, ' + (s1[1] === s2[0] ? '$' + s1[1] + '=' + s2[0] + '$ тул болно'
      : '$' + s1[1] + '\\ne ' + s2[0] + '$ тул болохгүй');
  };
  var sq = function (X, s) { return '$' + X + '^2$: $' + X + '$ ' + (s[0] === s[1] ? 'квадрат матриц тул болно' : 'квадрат матриц биш тул болохгүй'); };
  return {
    q: '$A=' + mat(A) + '\\quad B=' + mat(B) + '$ матрицуудын хувьд дараах үйлдлүүдээс алийг нь гүйцэтгэж болох вэ?'
      + '<br>$A+B,\\quad AB,\\quad BA,\\quad A^2,\\quad B^2$',
    a: ans,
    wk: 24,
    s: [
      '$A$ матриц $' + m + '\\times ' + n + '$, $B$ матриц $' + p + '\\times ' + q + '$ хэмжээтэй (мөрийн тоо $\\times$ баганын тоо).',
      'Ижил хэмжээтэй матрицуудыг л нэмж болно. $XY$ үржвэр нь $X$-ийн баганын тоо $Y$-ийн мөрийн тоотой тэнцүү үед л олдоно.'
        + ' $X^2=X\\cdot X$ тул зөвхөн квадрат матрицыг квадрат зэрэгт дэвшүүлж болно.',
      ['$A+B$: хэмжээ нь ' + (m === p && n === q ? 'ижил тул болно' : 'ялгаатай тул болохгүй'), mul('A', 'B', sa, sb), mul('B', 'A', sb, sa), sq('A', sa), sq('B', sb)].join(';<br>') + '.',
      'Иймд ' + ans + ' үйлдлийг гүйцэтгэж болно.'
    ],
    t: { A: A, B: B }
  };
}

// 46. f'(a)-ийн утга. Хэлбэрүүд (a = s² язгууртайд):
//     k/√x → −k/(2s³);  k√x → k/(2s);  k·x√x → 3ks/2;  k/x² → −2k/a³ (a бүхэл).
function p46() {
  var f = pick([0, 0, 1, 2, 3]), k = rnd(1, 6), s, a, n, d, tex;
  if (f === 0) { s = rnd(1, 3); a = s * s; n = -k; d = 2 * s * s * s; tex = '\\dfrac{' + k + '}{\\sqrt{x}}'; }
  else if (f === 1) { s = rnd(1, 5); a = s * s; n = k; d = 2 * s; tex = (k === 1 ? '' : k) + '\\sqrt{x}'; }
  else if (f === 2) { s = rnd(1, 4); a = s * s; n = 3 * k * s; d = 2; tex = (k === 1 ? '' : k) + 'x\\sqrt{x}'; }
  else { a = pick([1, 2, 3, -1, -2]); n = -2 * k; d = a * a * a; tex = '\\dfrac{' + k + '}{x^2}'; }
  if (Math.abs(d) / gcd(n, d) > 64) return null;
  if (a === 1 && f !== 3 && k === 1) return null;
  // Бодолт (гар бичмэл): зэрэгт хэлбэрт шилжүүлээд (x^n)' = n·x^(n−1), дараа нь x = a-г орлуулна
  var K = k === 1 ? '' : k + '\\cdot ', g = gcd(k, 2), kn = k / g, kd = 2 / g, ch, at;
  if (f === 0) {
    ch = '\\left(' + tex + '\\right)\'=\\left(' + K + 'x^{-0.5}\\right)\'=' + K + '(-0.5)\\cdot x^{-1.5}=-\\dfrac{' + kn + '}{' + (kd === 1 ? '' : kd) + 'x\\sqrt{x}}';
    at = '-\\dfrac{' + kn + '}{' + (kd === 1 ? '' : kd + '\\cdot ') + a + '\\cdot\\sqrt{' + a + '}}';
  } else if (f === 1) {
    ch = '\\left(' + tex + '\\right)\'=\\left(' + K + 'x^{0.5}\\right)\'=' + K + '0.5\\cdot x^{-0.5}=\\dfrac{' + kn + '}{' + (kd === 1 ? '' : kd) + '\\sqrt{x}}';
    at = '\\dfrac{' + kn + '}{' + (kd === 1 ? '' : kd) + '\\sqrt{' + a + '}}' + (kd === 1 ? '' : '=\\dfrac{' + kn + '}{' + kd + '\\cdot ' + s + '}');
  } else if (f === 2) {
    ch = '\\left(' + tex + '\\right)\'=\\left(' + K + 'x^{1.5}\\right)\'=' + K + '1.5\\cdot x^{0.5}=' + tm([3 * k, 2], '\\sqrt{x}', true);
    at = tm([3 * k, 2], '', true) + '\\cdot\\sqrt{' + a + '}=' + tm([3 * k, 2], '', true) + '\\cdot ' + s;
  } else {
    ch = '\\left(' + tex + '\\right)\'=\\left(' + K + 'x^{-2}\\right)\'=' + K + '(-2)\\cdot x^{-3}=-\\dfrac{' + 2 * k + '}{x^3}';
    at = '-\\dfrac{' + 2 * k + '}{' + par(a) + '^3}';
  }
  return {
    q: '$f(x)=' + tex + '$ функцийн хувьд $f\'(' + a + ')$-' + suf(a, 'ын') + ' утгыг ол.',
    a: '$f\'(' + a + ')=' + fr(n, d) + '$',
    wk: 22,
    s: [
      'Функцийг зэрэгт хэлбэрт шилжүүлж $(x^n)\'=nx^{n-1}$ томьёогоор уламжлалыг олбол $$f\'(x)=' + ch + '.$$',
      '$$f\'(' + a + ')=' + (a === 1 ? '' : at + '=') + fr(n, d) + '.$$'
    ],
    t: { f: f, k: k, a: a }
  };
}

// 47. Бүхэл, аравтын бутархай, энгийн бутархай, π-тэй тоо — 4 тоо √n-ийн ойролцоо (≥ 0.01 зайтай);
//     √n-ээс бага (эсвэл их) тоонуудыг ялгана. Дор хаяж нэг нь тохирно, нэг нь тохирохгүй.
var p47_PI = [[1, 1], [1, 2], [1, 3], [1, 4], [1, 6], [2, 3], [3, 4], [5, 6], [3, 2], [4, 3], [5, 4], [7, 6], [5, 3], [7, 4], [11, 6], [2, 1]];
function p47() {
  var n = pick([2, 2, 3, 5, 6, 7, 10]), R = Math.sqrt(n), far = function (v) { return Math.abs(v - R) >= 0.01; };
  var pools = [[], [], [], []], i, p, q;
  [Math.floor(R), Math.ceil(R)].forEach(function (v) { pools[0].push({ v: v, t: String(v) }); });
  for (i = Math.round(R * 10) - 5; i <= Math.round(R * 10) + 5; i++) if (i % 10 && far(i / 10)) pools[1].push({ v: i / 10, t: dec(i / 10) });
  for (q = 2; q <= 9; q++) for (p = Math.ceil((R - 0.5) * q); p <= (R + 0.5) * q; p++) {
    if (gcd(p, q) === 1 && p % q && far(p / q)) pools[2].push({ v: p / q, t: '\\dfrac{' + p + '}{' + q + '}' });
  }
  p47_PI.forEach(function (km) {
    var v = km[0] * Math.PI / km[1];
    if (Math.abs(v - R) <= 0.8 && far(v)) pools[3].push({ v: v, t: km[1] === 1 ? (km[0] === 1 ? '' : km[0]) + '\\pi' : '\\dfrac{' + (km[0] === 1 ? '' : km[0]) + '\\pi}{' + km[1] + '}' });
  });
  if (pools.some(function (P) { return !P.length; })) return null;
  var xs = shuffle(pools.map(function (P) { return pick(P); }));
  for (i = 0; i < 4; i++) for (p = i + 1; p < 4; p++) if (Math.abs(xs[i].v - xs[p].v) < 0.02) return null;
  var less = rnd(1, 3) !== 1, sel = xs.filter(function (x) { return less ? x.v < R : x.v > R; });
  if (!sel.length || sel.length === 4) return null;
  // Бодолт (гар бичмэл): √n ≈ (аравтын бутархай); тоо бүрийг аравтын бутархайгаар илэрхийлж √n-тэй харьцуулна.
  //   2 оронгоор харьцуулахад тэнцүү/эргэлзээтэй гарвал 3 орон авна (тоонууд √n-ээс ≥ 0.01 зайтай тул хангалттай)
  var dg = xs.every(function (x) { var u = +x.v.toFixed(2), w = +R.toFixed(2); return u !== w && (u < w) === (x.v < R); }) ? 2 : 3;
  var cmp = xs.map(function (x) {
    var mid = /^\d+(\.\d+)?$/.test(x.t) ? '' : Math.abs(x.v * 1000 - Math.round(x.v * 1000)) < 1e-9 ? '=' + dec(x.v) : '\\approx ' + dec(x.v, dg);
    return x.t + mid + (x.v < R ? '\\lt' : '\\gt') + '\\sqrt{' + n + '}';
  });
  var st = sel.map(function (x) { return '$' + x.t + '$'; }), lst = st.length === 1 ? st[0] : st.slice(0, -1).join(', ') + ' ба ' + st[st.length - 1];
  return {
    q: '$' + xs.map(function (x) { return x.t; }).join(',\\ ') + '$ тоонуудаас $\\sqrt{' + n + '}$-' + suf(n, 'аас') + ' '
      + (less ? 'бага' : 'их') + ' байх бүх тоог ялган бич.',
    a: '$' + sel.map(function (x) { return x.t; }).join(',\\ ') + '$',
    wk: 18,
    s: [
      '$\\sqrt{' + n + '}\\approx ' + dec(R, dg) + '$ гэдгийг ашиглан тоо бүрийг $\\sqrt{' + n + '}$-' + suf(n, 'тай') + ' харьцуулбал $$' + cmp.join(',\\qquad ') + '.$$',
      'Иймд $\\sqrt{' + n + '}$-' + suf(n, 'аас') + ' ' + (less ? 'бага' : 'их') + ' тоо нь ' + lst + '.'
    ],
    t: { n: n, less: less }
  };
}

// 48. √((a−u)²) ± √(a² − 2va + v²) = |a − u| ± |a − v|, {u, v} = {p, q}, p < q; мужаас (p<a<q, a>q, a<p) хамаарч модулийг задлана.
function p48() {
  var p = nz(-4, 5), q = nz(-3, 8);
  if (q - p < 2) return null;
  var sw = rnd(1, 4) === 1, u = sw ? q : p, v = sw ? p : q;
  var reg = pick([0, 0, 0, 1, 2]), plus = rnd(1, 10) <= 7;   // 0: p<a<q, 1: a>q, 2: a<p
  var cond = reg === 0 ? p + '\\lt a\\lt ' + q : reg === 1 ? 'a\\gt ' + q : 'a\\lt ' + p;
  // мужид: |a − w| = σ_w·(a − w)
  var sg = function (w) { return reg === 0 ? (w === p ? 1 : -1) : reg === 1 ? 1 : -1; };
  var su = sg(u), sv = (plus ? 1 : -1) * sg(v);
  var ca = su + sv, c0 = -su * u - sv * v;                   // ca·a + c0
  var first = '\\sqrt{' + (u ? '(a' + sgn(-u) + ')^2' : 'a^2') + '}';
  var second = '\\sqrt{' + poly([1, -2 * v, v * v], 'a') + '}';
  // Бодолт (гар бичмэл): a² − 2va + v² = (a − v)², √(t²) = |t| → мужид модулийг тэмдгээр нь задлана
  var op = plus ? '+' : '-', lin = function (w) { return 'a' + (w ? sgn(-w) : ''); };   // a − w
  var ab = function (w) { return '|' + lin(w) + '|'; };
  var opn = function (w) { return sg(w) > 0 ? '(' + lin(w) + ')' : '(' + (w ? w + '-a' : '-a') + ')'; };   // |a − w| мужид
  var sgnTxt = function (w) { return '$' + lin(w) + (sg(w) > 0 ? '\\gt 0' : '\\lt 0') + '$'; };
  var opnEq = function (w) { return '$' + ab(w) + '=' + opn(w).slice(1, -1) + '$'; };
  return {
    q: '$' + cond + '$ үед $' + first + (plus ? '+' : '-') + second + '$ илэрхийллийг хялбарчил.',
    a: '$' + poly([ca, c0], 'a') + '$',
    wk: 24,
    s: [
      '$' + poly([1, -2 * v, v * v], 'a') + '=(' + lin(v) + ')^2$ ба $\\sqrt{t^2}=|t|$ тул $$' + first + op + second + '=' + ab(u) + op + ab(v) + '.$$',
      '$' + cond + '$ үед ' + sgnTxt(u) + ', ' + sgnTxt(v) + ' тул ' + opnEq(u) + ', ' + opnEq(v) + '. Иймд $$' + ab(u) + op + ab(v) + '='
        + opn(u) + op + opn(v) + '=' + poly([ca, c0], 'a') + '.$$'
    ],
    t: { u: u, v: v, reg: reg, plus: plus }
  };
}

// 49. 2×2 матрицын урвуу: M = (a b; c d), det = ad − bc ∈ {±1, ±2} → M⁻¹ = (1/det)·(d −b; −c a).
function p49_mx(rows) {   // бутархайтай матрицад мөр хооронд зай (бутархайнууд наалдахгүй)
  if (!/frac/.test(rows.join())) return mat(rows);
  return '\\begin{pmatrix}' + rows.map(function (r) { return r.join('&'); }).join('\\\\[6pt]') + '\\end{pmatrix}';
}
function p49() {
  var a = nz(-6, 6), b = nz(-6, 6), c = nz(-6, 6), d = nz(-6, 6), D = a * d - b * c;
  if ([1, -1, 2, -2, 2, -2].indexOf(D) < 0) return null;
  if (Math.abs(D) === 1 && rnd(1, 2) === 1) return null;   // det = ±2 (бутархайтай) илүү олон
  var inv = [[frs(d, D), frs(-b, D)], [frs(-c, D), frs(a, D)]];
  // Бодолт (гар бичмэл): |M| = ad − bc → M⁻¹ = (1/|M|)·(d −b; −c a)
  var adj = mat([[d, -b], [-c, a]]), res = p49_mx(inv);
  var pre = D === 1 ? '' : D === -1 ? '-' : (D < 0 ? '-' : '') + '\\dfrac{1}{' + Math.abs(D) + '}';
  return {
    q: '$M=' + mat([[a, b], [c, d]]) + '$ бол $M^{-1}$ матрицыг олоорой.',
    a: '$M^{-1}=' + p49_mx(inv) + '$',
    wk: 24,
    s: [
      'Тодорхойлогч: $$|M|=' + a + '\\cdot ' + par(d) + '-' + par(b) + '\\cdot ' + par(c) + '=' + a * d + sgn(-b * c) + '=' + D + '.$$',
      '$A=\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}$ бол $A^{-1}=\\dfrac{1}{|A|}\\begin{pmatrix}d&-b\\\\-c&a\\end{pmatrix}$ тул $$M^{-1}='
        + (D === 1 ? '' : pre + adj + '=') + res + '.$$'
    ],
    t: { M: [[a, b], [c, d]] }
  };
}

// 50. x − y = d, b^(x+p) = (b^k)^y → x + p = k·y → y = (d + p)/(k − 1), x = y + d; x + y = 2y + d.
var p50_B = [[2, 2, 4], [2, 3, 8], [3, 2, 9], [3, 3, 27], [5, 2, 25], [2, 2, 4]];   // [суурь, k, суурь^k]
function p50() {
  var B = pick(p50_B), b = B[0], k = B[1], d = nz(-5, 5), p = nz(-4, 4);
  if ((d + p) % (k - 1)) return null;
  var y = (d + p) / (k - 1), x = y + d;
  if (Math.abs(x) > 9 || Math.abs(y) > 9) return null;
  // Бодолт (гар бичмэл): b^k-г b суурьт шилжүүлж илтгэгчүүдийг тэнцүүлнэ → шугаман систем; x-ийг хоёр тэгшитгэлээс илэрхийлж тэнцүүлнэ
  var ey = tm(k, 'y', true), e1 = 'y' + sgn(d), e2 = ey + sgn(-p);
  return {
    q: '$\\begin{cases}x-y=' + d + '\\\\' + b + '^{x' + sgn(p) + '}=' + B[2] + '^{y}\\end{cases}$ систем тэгшитгэлээс $x+y$-ийг олоорой.',
    a: '$x+y=' + (x + y) + '$',
    wk: 26,
    s: [
      '$' + B[2] + '^{y}=\\left(' + b + '^{' + k + '}\\right)^{y}=' + b + '^{' + ey + '}$ тул $' + b + '^{x' + sgn(p) + '}=' + b + '^{' + ey + '}$.'
        + ' Суурь нь тэнцүү тул илтгэгч нь тэнцүү: $x' + sgn(p) + '=' + ey + '$.',
      '$$\\begin{cases}x-y=' + d + '\\\\x' + sgn(p) + '=' + ey + '\\end{cases}\\Rightarrow\\begin{cases}x=' + e1 + '\\\\x=' + e2 + '\\end{cases}\\Rightarrow '
        + e1 + '=' + e2 + (k === 2 ? '' : '\\Rightarrow ' + (k - 1) + 'y=' + (d + p)) + '\\Rightarrow y=' + y + '.$$',
      '$x=' + y + sgn(d) + '=' + x + '$ тул $x+y=' + (y ? x + (y < 0 ? '' : '+') + y + '=' : '') + (x + y) + '$.'
    ],
    t: { b: b, k: k, d: d, p: p }
  };
}
