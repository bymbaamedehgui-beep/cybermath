<script>
/* ЭЕШ 1000 — Интеграл-1 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Тодорхой бус интеграл, эх функц, дифференциал тэгшитгэл.
   Эх: 3.40, 2.49, 1.24, 2.9, 2.48, 3.44, 3.49, 3.75, 3.67, 3.43, 1.54, 2.53, 2.54, 2.55, 2.56, 2.57, 2.58, 4.73, 4.82 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 3.40 */
var e3_40 = (function () {
// 40. Хялбар интеграл ↔ эх функц харгалзуулах: 7 бүлгээс (лог, сөрөг зэрэг, экспонент, зэрэг, тригонометр, язгуур, 1/cos²)
//     4 өөр бүлэг сонгож бүлэг бүрээс нэг интеграл; дараалал ба үсгийг (A–D) холино. Хариу «1–C, 2–A, 3–D, 4–B».
//     [ЗАС] ∫x⁻¹dx = ln|x| + C (модультай). Эх: x⁻¹, x⁻², e⁻ˣ, x² → 1–C, 2–A, 3–D, 4–B.
var p40_P = {
  L: [['x^{-1}', '\\ln|x|'], ['\\dfrac{1}{x}', '\\ln|x|'], ['\\dfrac{1}{x+1}', '\\ln|x+1|'], ['\\dfrac{1}{x-2}', '\\ln|x-2|'], ['\\dfrac{1}{x+3}', '\\ln|x+3|']],
  N: [['x^{-2}', '-\\dfrac{1}{x}'], ['x^{-3}', '-\\dfrac{1}{2x^2}'], ['\\dfrac{1}{x^2}', '-\\dfrac{1}{x}']],
  E: [['e^{-x}', '-e^{-x}'], ['e^{2x}', '\\dfrac{1}{2}e^{2x}'], ['e^{3x}', '\\dfrac{1}{3}e^{3x}'], ['e^{-2x}', '-\\dfrac{1}{2}e^{-2x}'], ['e^x', 'e^x']],
  P: [['x^2', '\\dfrac{1}{3}x^3'], ['x^3', '\\dfrac{1}{4}x^4'], ['x^4', '\\dfrac{1}{5}x^5'], ['x^5', '\\dfrac{1}{6}x^6']],
  T: [['\\sin x', '-\\cos x'], ['\\cos x', '\\sin x'], ['\\sin 2x', '-\\dfrac{1}{2}\\cos 2x'], ['\\cos 2x', '\\dfrac{1}{2}\\sin 2x'], ['\\cos 3x', '\\dfrac{1}{3}\\sin 3x']],
  R: [['\\sqrt{x}', '\\dfrac{2}{3}x\\sqrt{x}'], ['\\dfrac{1}{\\sqrt{x}}', '2\\sqrt{x}']],
  C: [['\\dfrac{1}{\\cos^2 x}', '\\operatorname{tg}x'], ['\\dfrac{1}{\\sin^2 x}', '-\\operatorname{ctg}x']]
};
function p40() {
  var fams = shuffle(['L', 'L', 'L', 'N', 'E', 'P', 'T', 'R', 'C']), sel = [];
  fams.forEach(function (f) { if (sel.length < 4 && sel.indexOf(f) < 0) sel.push(f); });
  var items = shuffle(sel.map(function (f) { return pick(p40_P[f]); }));
  var let = 'ABCD', perm = shuffle([0, 1, 2, 3]);                   // items[i] → үсэг let[perm[i]]
  var right = [];
  items.forEach(function (it, i) { right[perm[i]] = it[1]; });
  var td = '<td style="padding:2px 34px 2px 0;white-space:nowrap">', td2 = '<td style="padding:2px 0;white-space:nowrap">';
  var rows = items.map(function (it, i) {
    return '<tr>' + td + (i + 1) + '. $\\displaystyle\\int ' + it[0] + '\\,dx=$</td>' + td2 + let[i] + '. $F(x)=' + right[i] + '+C$</td></tr>';
  }).join('');
  return {
    q: 'Дараах хялбар интегралуудыг эх функцтэй нь зөв харгалзуул.<table style="border-collapse:collapse;margin:4px 0 0 14px">' + rows + '</table>',
    a: '<span class="nw">' + items.map(function (it, i) { return (i + 1) + '–' + let[perm[i]]; }).join(', ') + '</span>',
    wk: 20,
    s: p40_sol(items, perm),
    t: { perm: perm }
  };
}
// Бодолт: интеграл бүрийг үндсэн томьёогоор (ln|x|, зэрэг, e^{kx}, sin/cos kx, язгуур = бутархай зэрэг, 1/cos², 1/sin²) бодож
// эх функцийг олоод үсэгтэй нь харгалзуулна. p40_W[интеграл доорх функц] = [ашигласан томьёо (текст), завсрын алхам].
var p40_PW = 'Зэргийн функцийн интеграл $\\int x^n\\,dx=\\dfrac{x^{n+1}}{n+1}+C$ ';
var p40_EK = '$\\int e^{kx}\\,dx=\\dfrac{1}{k}e^{kx}+C$ томьёогоор ';
var p40_W = {
  'x^{-1}': ['$\\int\\dfrac{dx}{x}=\\ln|x|+C$ томьёогоор:', '\\int\\dfrac{dx}{x}'],
  '\\dfrac{1}{x}': ['$\\int\\dfrac{dx}{x}=\\ln|x|+C$ томьёогоор:', ''],
  '\\dfrac{1}{x+1}': ['$\\int\\dfrac{dx}{x+a}=\\ln|x+a|+C$ томьёогоор:', ''],
  '\\dfrac{1}{x-2}': ['$\\int\\dfrac{dx}{x+a}=\\ln|x+a|+C$ томьёогоор:', ''],
  '\\dfrac{1}{x+3}': ['$\\int\\dfrac{dx}{x+a}=\\ln|x+a|+C$ томьёогоор:', ''],
  'x^{-2}': [p40_PW + '($n=-2$):', '\\dfrac{x^{-1}}{-1}+C'],
  'x^{-3}': [p40_PW + '($n=-3$):', '\\dfrac{x^{-2}}{-2}+C'],
  '\\dfrac{1}{x^2}': [p40_PW + '($n=-2$):', '\\int x^{-2}\\,dx=\\dfrac{x^{-1}}{-1}+C'],
  'e^{-x}': [p40_EK + '($k=-1$):', ''],
  'e^{2x}': [p40_EK + '($k=2$):', ''],
  'e^{3x}': [p40_EK + '($k=3$):', ''],
  'e^{-2x}': [p40_EK + '($k=-2$):', ''],
  'e^x': ['$(e^x)\'=e^x$ тул', ''],
  'x^2': [p40_PW + '($n=2$):', '\\dfrac{x^3}{3}+C'],
  'x^3': [p40_PW + '($n=3$):', '\\dfrac{x^4}{4}+C'],
  'x^4': [p40_PW + '($n=4$):', '\\dfrac{x^5}{5}+C'],
  'x^5': [p40_PW + '($n=5$):', '\\dfrac{x^6}{6}+C'],
  '\\sin x': ['$(\\cos x)\'=-\\sin x$ тул', ''],
  '\\cos x': ['$(\\sin x)\'=\\cos x$ тул', ''],
  '\\sin 2x': ['$\\int\\sin kx\\,dx=-\\dfrac{1}{k}\\cos kx+C$ ($k=2$):', ''],
  '\\cos 2x': ['$\\int\\cos kx\\,dx=\\dfrac{1}{k}\\sin kx+C$ ($k=2$):', ''],
  '\\cos 3x': ['$\\int\\cos kx\\,dx=\\dfrac{1}{k}\\sin kx+C$ ($k=3$):', ''],
  '\\sqrt{x}': ['$\\sqrt{x}=x^{\\frac{1}{2}}$ тул зэргийн функцийн интегралаар ($n=\\dfrac{1}{2}$):', '\\int x^{\\frac{1}{2}}\\,dx=\\dfrac{x^{\\frac{3}{2}}}{\\frac{3}{2}}+C'],
  '\\dfrac{1}{\\sqrt{x}}': ['$\\dfrac{1}{\\sqrt{x}}=x^{-\\frac{1}{2}}$ тул зэргийн функцийн интегралаар ($n=-\\dfrac{1}{2}$):', '\\int x^{-\\frac{1}{2}}\\,dx=\\dfrac{x^{\\frac{1}{2}}}{\\frac{1}{2}}+C'],
  '\\dfrac{1}{\\cos^2 x}': ['$\\operatorname{tg}x$ функцийн уламжлал нь $\\dfrac{1}{\\cos^2x}$ тул', ''],
  '\\dfrac{1}{\\sin^2 x}': ['$\\operatorname{ctg}x$ функцийн уламжлал нь $-\\dfrac{1}{\\sin^2x}$ тул', '']
};
function p40_sol(items, perm) {
  var sol = items.map(function (it, i) {
    var w = p40_W[it[0]];
    return '<b>' + (i + 1) + '.</b> ' + w[0] + ' $$\\int ' + it[0] + '\\,dx=' + (w[1] ? w[1] + '=' : '') + it[1] + '+C\\ \\Rightarrow\\ \\text{' + 'ABCD'[perm[i]] + '}.$$';
  });
  sol.push('Иймд <span class="nw">' + items.map(function (it, i) { return (i + 1) + '–' + 'ABCD'[perm[i]]; }).join(', ') + '</span>.');
  return sol;
}
return p40;
})();

/* 2.49 */
var e2_49 = (function () {
// 49. ∫ k/(α + βx) dx = (k/β)·ln|α + βx| + C  (эх: ∫ 1/(1 − 3x) dx = −(1/3)·ln|1 − 3x| + C).
function p49() {
  var be = pick([-3, -2, -4, -5, -1, 2, 3, 4, 5, 6, 7]), al = be < 0 ? rnd(1, 9) : nz(-9, 9), k = pick([1, 1, 1, 1, 2, 3, 4, 5, 6]);
  if (gcd(al, be) > 1) return null;                                     // 7x − 7 г.м. хуваарийг хасна
  var u = be < 0 ? al + tm(be, 'x') : poly([be, al]);
  // Бодолт: t = α + βx орлуулга, dt = β·dx → ∫k/(α + βx)dx = (k/β)∫dt/t = (k/β)·ln|t| + C
  var D = function (z) { return z.replace(/\\frac\{/g, '\\dfrac{'); }, B = Math.abs(be);
  var dtx = be === -1 ? 'dt=-dx' : 'dt=' + be + '\\,dx', dxt = be === -1 ? 'dx=-dt' : 'dx=' + (be < 0 ? '-' : '') + '\\dfrac{dt}{' + B + '}';
  var dxf = be === -1 ? '(-dt)' : be < 0 ? '\\left(-\\dfrac{dt}{' + B + '}\\right)' : '\\dfrac{dt}{' + B + '}';
  var sol = [
    'Интегралыг $I$ гэж тэмдэглээд $t=' + u + '$ орлуулга хийе: $' + dtx + '$, эндээс $' + dxt + '$.',
    '$\\int\\dfrac{dt}{t}=\\ln|t|+C$ тул $$I=\\int\\dfrac{' + k + '}{t}\\cdot ' + dxf + '=' + D(tm([k, be], '\\int\\dfrac{dt}{t}', true)) + '$$ $$=' + D(tm([k, be], '\\ln|t|', true)) + '+C.$$',
    '$t=' + u + '$ гэж буцааж орлуулбал $$I=' + D(tm([k, be], '\\ln|' + u + '|', true)) + '+C.$$'
  ];
  return {
    q: '$\\displaystyle\\int\\dfrac{' + k + '}{' + u + '}\\,dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm([k, be], '\\ln|' + u + '|', true) + '+C$',
    wk: 20,
    s: sol,
    t: { k: k, al: al, be: be }
  };
}
return p49;
})();

/* 1.24 */
var e1_24 = (function () {
// 24. ∫ k/√(px+q) dx = (2k/p)·√(px+q) + C  (эх: ∫ 1/√(3−x) dx = −2√(3−x) + C).
function p24() {
  var p = pick([-1, -1, -2, -3, 1, 1, 2, 3, 4]), k = pick([1, 1, 1, 2, 3, 4, 5, 6]), q = p < 0 ? rnd(1, 9) : nz(-9, 9);
  var inner = p < 0 ? q + tm(p, 'x') : poly([p, q]);
  // Бодолт (гар бичмэл): ∫dt/√t = ∫t^(−1/2)dt = 2√t + C; орлуулга t = px + q, dx = dt/p
  var dtx = p === 1 ? 'dt=dx' : p === -1 ? 'dt=-dx' : 'dt=' + p + '\\,dx';
  var dxt = p === 1 ? 'dx=dt' : p === -1 ? 'dx=-dt' : 'dx=' + (p < 0 ? '-' : '') + '\\dfrac{dt}{' + Math.abs(p) + '}';
  var mid = Math.abs(k) === Math.abs(p) ? '' : tm([k, p], '\\cdot 2\\sqrt{t}', true) + '+C=';
  return {
    q: '$\\displaystyle\\int\\dfrac{' + k + '}{\\sqrt{' + inner + '}}\\,dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm([2 * k, p], '\\sqrt{' + inner + '}', true) + '+C$', wk: 22,
    s: [
      'Зэрэгт функцийн интегралаар $$\\int\\dfrac{dt}{\\sqrt{t}}=\\int t^{-\\frac{1}{2}}\\,dt=\\dfrac{t^{\\frac{1}{2}}}{\\frac{1}{2}}+C=2\\sqrt{t}+C.$$',
      '$t=' + inner + '$ гэж орлуулъя: ' + (p === 1 ? '$dt=dx$.' : '$' + dtx + '$, эндээс $' + dxt + '$.'),
      'Иймд $$\\int\\dfrac{' + k + '}{\\sqrt{' + inner + '}}\\,dx=' + tm([k, p], '\\int\\dfrac{dt}{\\sqrt{t}}', true) + '=' + mid + tm([2 * k, p], '\\sqrt{t}', true) + '+C='
        + tm([2 * k, p], '\\sqrt{' + inner + '}', true) + '+C.$$'
    ],
    t: { p: p, q: q, k: k, inner: inner }
  };
}
return p24;
})();

/* 2.9 */
var e2_9 = (function () {
// 9. ∫ k/((x − p)(x − q)) dx = k/(p − q) · ln|(x − p)/(x − q)| + C  (хуваарийг задалж бичнэ; хялбар бутархайд задлах:
//    k/((x−p)(x−q)) = k/(p−q)·(1/(x−p) − 1/(x−q))). p > q байхаар эрэмбэлж коэффициентийг эерэг болгоно.
//    (эх: ∫ 1/(x² + x) dx = ln|x/(x + 1)| + C)
function p9() {
  var p = rnd(-5, 5), q = rnd(-5, 5);
  if (p === q) return null;
  if (rnd(1, 5) <= 2) { if (rnd(0, 1)) p = 0; else q = 0; }     // эх шиг x² + bx хэлбэр
  if (p === q) return null;
  if (p < q) { var t = p; p = q; q = t; }
  var k = pick([1, 1, 1, 1, 2, 3, 4, 5, 6]), d = p - q;
  if (d / gcd(k, d) > 8 || Math.abs(p * q) > 24) return null;
  var den = poly([1, -(p + q), p * q]);
  // Бодолт: хялбар бутархайд задлах k/((x−p)(x−q)) = A/(x−p) + B/(x−q) → k = A(x − q) + B(x − p): x = p → A = k/(p − q),
  //         x = q → B = −k/(p − q); ∫ dx/(x − a) = ln|x − a| + C; ln|u| − ln|w| = ln|u/w|.
  var Lp = poly([1, -p]), Lq = poly([1, -q]), I0 = '\\int\\dfrac{' + k + '}{' + den + '}\\,dx';
  var fac = q === 0 ? 'x(' + Lp + ')' : p === 0 ? 'x(' + Lq + ')' : '(' + Lp + ')(' + Lq + ')';
  var mul = function (L, v) { return v === 0 ? L : '(' + L + ')'; };
  var fA = d === 1 ? '$A=' + k + '$' : '$' + k + '=' + tm(d, 'A', true) + '$, $A=' + fr(k, d) + '$';
  return {
    q: '$\\displaystyle\\int\\dfrac{' + k + '}{' + den + '}\\,dx$ тодорхой бус интегралыг бод.',
    a: '$' + tm([k, d], '\\ln\\left|\\dfrac{' + poly([1, -p]) + '}{' + poly([1, -q]) + '}\\right|', true) + '+C$',
    wk: 26,
    s: [
      'Хуваарийг задалбал $' + den + '=' + fac + '$. Интегралын доорх бутархайг хялбар бутархайд задалъя: $$\\dfrac{' + k + '}{' + fac + '}=\\dfrac{A}{' + Lp + '}+\\dfrac{B}{' + Lq + '}.$$',
      'Ерөнхий хуваарьт шилжүүлж хүртвэрүүдийг тэнцүүлбэл $' + k + '=A' + mul(Lq, q) + '+B' + mul(Lp, p) + '$. Эндээс $x=' + p + '$ гэвэл ' + fA
        + '; $x=' + q + '$ гэвэл $' + k + '=' + tm(-d, 'B', true) + '$, $B=' + fr(-k, d) + '$.',
      '$\\int\\frac{dx}{x-a}=\\ln|x-a|+C$ тул $$' + I0 + '=' + tm([k, d], '\\int\\dfrac{dx}{' + Lp + '}', true) + tm([-k, d], '\\int\\dfrac{dx}{' + Lq + '}')
        + '$$ $$=' + tm([k, d], '\\ln|' + Lp + '|', true) + tm([-k, d], '\\ln|' + Lq + '|') + '+C.$$',
      'Логарифмын $\\ln a-\\ln b=\\ln\\dfrac{a}{b}$ чанараар $$' + I0 + '=' + tm([k, d], '\\ln\\left|\\dfrac{' + Lp + '}{' + Lq + '}\\right|', true) + '+C.$$'
    ],
    t: { p: p, q: q, k: k }
  };
}
return p9;
})();

/* 2.48 */
var e2_48 = (function () {
// 48. ∫(p·sin(ax + b) + q·cos(ax + b))dx = −(p/a)·cos(ax + b) + (q/a)·sin(ax + b) + C
//     (эх: ∫(sin(2x + 1) − cos(2x + 1))dx = −½cos(2x + 1) − ½sin(2x + 1) + C). Заримдаа cos гишүүн эхэнд.
function p48() {
  var a = pick([2, 2, 3, 3, 4, 5, -2, -3]), b = a > 0 ? nz(-5, 5) : rnd(1, 5), p = pick([1, 1, 1, -1, 2, -2, 3, 4]), q = pick([1, -1, -1, 2, -2, 3, -3, 4]);
  if (gcd(a, b) > 1) return null;                                       // 3x + 3 г.м. ерөнхий үржигдэхүүнгүй
  var u = a > 0 ? poly([a, b]) : b + tm(a, 'x'), S = '\\sin(' + u + ')', Co = '\\cos(' + u + ')';
  var T = [{ c: p, f: S, F: [-p, a], G: Co }, { c: q, f: Co, F: [q, a], G: S }];
  if (rnd(0, 3) === 0) T.reverse();
  // Бодолт: t = ax + b орлуулга, dt = a·dx → I = (1/a)∫(p·sin t + q·cos t)dt = (1/a)(−p·cos t + q·sin t) + C; хаалт задалж буцааж орлуулна
  var D = function (z) { return z.replace(/\\frac\{/g, '\\dfrac{'); }, A = Math.abs(a), K1 = (a < 0 ? '-' : '') + '\\dfrac{1}{' + A + '}';
  var fT = function (o) { return o.f === S ? '\\sin t' : '\\cos t'; }, gT = function (o) { return o.f === S ? '\\cos t' : '\\sin t'; };
  var ig = tm(T[0].c, fT(T[0]), true) + tm(T[1].c, fT(T[1])), an = tm(T[0].f === S ? -T[0].c : T[0].c, gT(T[0]), true) + tm(T[1].f === S ? -T[1].c : T[1].c, gT(T[1]));
  var sol = [
    'Интегралыг $I$ гэж тэмдэглээд $t=' + u + '$ орлуулга хийе: $dt=' + a + '\\,dx$, эндээс $dx=' + (a < 0 ? '-' : '') + '\\dfrac{dt}{' + A + '}$.',
    '$\\int\\sin t\\,dt=-\\cos t+C$, $\\int\\cos t\\,dt=\\sin t+C$ тул $$I=' + K1 + '\\int\\left(' + ig + '\\right)dt$$ $$=' + K1 + '\\left(' + an + '\\right)+C.$$',
    'Хаалтыг задалбал $$I=' + D(tm(T[0].F, gT(T[0]), true) + tm(T[1].F, gT(T[1]))) + '+C.$$',
    '$t=' + u + '$ гэж буцааж орлуулбал $$I=' + D(tm(T[0].F, T[0].G, true) + tm(T[1].F, T[1].G)) + '+C.$$'
  ];
  return {
    q: '$\\displaystyle\\int\\left(' + tm(T[0].c, T[0].f, true) + tm(T[1].c, T[1].f) + '\\right)dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm(T[0].F, T[0].G, true) + tm(T[1].F, T[1].G) + '+C$',
    wk: 24,
    s: sol,
    t: { a: a, b: b, p: p, q: q }
  };
}
return p48;
})();

/* 3.44 */
var e3_44 = (function () {
// 44. tg²u = 1/cos²u − 1, ctg²u = 1/sin²u − 1 ⇒
//     ∫a·tg²kx dx = (a/k)·tg kx − ax + C,   ∫a·ctg²kx dx = −(a/k)·ctg kx − ax + C,
//     ∫(a·tg²kx + m)dx = (a/k)·tg kx + (m − a)x + C,   ∫(m − a·tg²x)dx = (m + a)x − a·tg x + C  (ctg-д tg/ctg гишүүний тэмдэг эсрэг).
//     (эх: ∫tg²x dx = tg x − x + C)
// Бодолт: 1 + tg²u = 1/cos²u (1 + ctg²u = 1/sin²u) адилтгалаар интегралын доорх функцийг хувиргаж,
//   ∫dx/cos²kx = (1/k)·tg kx + C (∫dx/sin²kx = −(1/k)·ctg kx + C) ба ∫c dx = cx + C-ээр интегралчилна.
function p44_sol(f, T, k, a, m, F) {
  var tg = T === 'tg', fn = '\\operatorname{' + T + '}', tr = tg ? '\\cos' : '\\sin', sg = tg ? 1 : -1;
  var arg = k === 1 ? 'x' : k + 'x', sq = tr + '^2' + (k === 1 ? 'x' : ' ' + k + 'x'), t1 = fn + arg, t2 = fn + '^2' + (k === 1 ? 'x' : ' ' + k + 'x');
  var Q = function (c, first) { return (c < 0 ? '-' : first ? '' : '+') + '\\dfrac{' + Math.abs(c) + '}{' + sq + '}'; };   // c/cos²kx
