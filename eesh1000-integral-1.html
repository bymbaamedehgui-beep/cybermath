<script>
/* ЭЕШ 1000 — Интеграл-1 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Тодорхой бус интеграл, эх функц, дифференциал тэгшитгэл.
   Эх: 3.40, 2.49, 1.24, 2.9, 2.48, 3.44, 3.49, 3.75, 3.67, 3.43, 1.54, 2.53, 2.54, 2.55, 2.56, 2.57, 2.58, 4.73, 4.82 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 3.40 */
var e3_40 = (function () {
// 40. Хялбар интеграл ↔ эх функц харгалзуулах: 7 бүлгээс (лог, сөрөг зэрэг, экспонент, зэрэг, тригонометр, язгуур, 1/cos²)
//     4 өөр бүлэг сонгож бүлэг бүрээс нэг интеграл; дараалал ба үсгийг (A–D) холино. Хариу «1–C, 2–A, 3–D, 4–B».
//     [ЗАС] ∫x⁻¹dx = ln|x| + C (модультай). Эх: x⁻¹, x⁻², e⁻ˣ, x² → 1–C, 2–A, 3–D, 4–B.
var p40_P = {
  L: [['x^{-1}', '\\ln|x|'], ['\\dfrac{1}{x}', '\\ln|x|'], ['\\dfrac{1}{x+1}', '\\ln|x+1|'], ['\\dfrac{1}{x-2}', '\\ln|x-2|'], ['\\dfrac{1}{x+3}', '\\ln|x+3|']],
  N: [['x^{-2}', '-\\dfrac{1}{x}'], ['x^{-3}', '-\\dfrac{1}{2x^2}'], ['\\dfrac{1}{x^2}', '-\\dfrac{1}{x}']],
  E: [['e^{-x}', '-e^{-x}'], ['e^{2x}', '\\dfrac{1}{2}e^{2x}'], ['e^{3x}', '\\dfrac{1}{3}e^{3x}'], ['e^{-2x}', '-\\dfrac{1}{2}e^{-2x}'], ['e^x', 'e^x']],
  P: [['x^2', '\\dfrac{1}{3}x^3'], ['x^3', '\\dfrac{1}{4}x^4'], ['x^4', '\\dfrac{1}{5}x^5'], ['x^5', '\\dfrac{1}{6}x^6']],
  T: [['\\sin x', '-\\cos x'], ['\\cos x', '\\sin x'], ['\\sin 2x', '-\\dfrac{1}{2}\\cos 2x'], ['\\cos 2x', '\\dfrac{1}{2}\\sin 2x'], ['\\cos 3x', '\\dfrac{1}{3}\\sin 3x']],
  R: [['\\sqrt{x}', '\\dfrac{2}{3}x\\sqrt{x}'], ['\\dfrac{1}{\\sqrt{x}}', '2\\sqrt{x}']],
  C: [['\\dfrac{1}{\\cos^2 x}', '\\operatorname{tg}x'], ['\\dfrac{1}{\\sin^2 x}', '-\\operatorname{ctg}x']]
};
function p40() {
  var fams = shuffle(['L', 'L', 'L', 'N', 'E', 'P', 'T', 'R', 'C']), sel = [];
  fams.forEach(function (f) { if (sel.length < 4 && sel.indexOf(f) < 0) sel.push(f); });
  var items = shuffle(sel.map(function (f) { return pick(p40_P[f]); }));
  var let = 'ABCD', perm = shuffle([0, 1, 2, 3]);                   // items[i] → үсэг let[perm[i]]
  var right = [];
  items.forEach(function (it, i) { right[perm[i]] = it[1]; });
  var td = '<td style="padding:2px 34px 2px 0;white-space:nowrap">', td2 = '<td style="padding:2px 0;white-space:nowrap">';
  var rows = items.map(function (it, i) {
    return '<tr>' + td + (i + 1) + '. $\\displaystyle\\int ' + it[0] + '\\,dx=$</td>' + td2 + let[i] + '. $F(x)=' + right[i] + '+C$</td></tr>';
  }).join('');
  return {
    q: 'Дараах хялбар интегралуудыг эх функцтэй нь зөв харгалзуул.<table style="border-collapse:collapse;margin:4px 0 0 14px">' + rows + '</table>',
    a: '<span class="nw">' + items.map(function (it, i) { return (i + 1) + '–' + let[perm[i]]; }).join(', ') + '</span>',
    wk: 20,
    t: { perm: perm }
  };
}
return p40;
})();

/* 2.49 */
var e2_49 = (function () {
// 49. ∫ k/(α + βx) dx = (k/β)·ln|α + βx| + C  (эх: ∫ 1/(1 − 3x) dx = −(1/3)·ln|1 − 3x| + C).
function p49() {
  var be = pick([-3, -2, -4, -5, -1, 2, 3, 4, 5, 6, 7]), al = be < 0 ? rnd(1, 9) : nz(-9, 9), k = pick([1, 1, 1, 1, 2, 3, 4, 5, 6]);
  if (gcd(al, be) > 1) return null;                                     // 7x − 7 г.м. хуваарийг хасна
  var u = be < 0 ? al + tm(be, 'x') : poly([be, al]);
  return {
    q: '$\\displaystyle\\int\\dfrac{' + k + '}{' + u + '}\\,dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm([k, be], '\\ln|' + u + '|', true) + '+C$',
    wk: 20,
    t: { k: k, al: al, be: be }
  };
}
return p49;
})();

/* 1.24 */
var e1_24 = (function () {
// 24. ∫ k/√(px+q) dx = (2k/p)·√(px+q) + C  (эх: ∫ 1/√(3−x) dx = −2√(3−x) + C).
function p24() {
  var p = pick([-1, -1, -2, -3, 1, 1, 2, 3, 4]), k = pick([1, 1, 1, 2, 3, 4, 5, 6]), q = p < 0 ? rnd(1, 9) : nz(-9, 9);
  var inner = p < 0 ? q + tm(p, 'x') : poly([p, q]);
  // Бодолт (гар бичмэл): ∫dt/√t = ∫t^(−1/2)dt = 2√t + C; орлуулга t = px + q, dx = dt/p
  var dtx = p === 1 ? 'dt=dx' : p === -1 ? 'dt=-dx' : 'dt=' + p + '\\,dx';
  var dxt = p === 1 ? 'dx=dt' : p === -1 ? 'dx=-dt' : 'dx=' + (p < 0 ? '-' : '') + '\\dfrac{dt}{' + Math.abs(p) + '}';
  var mid = Math.abs(k) === Math.abs(p) ? '' : tm([k, p], '\\cdot 2\\sqrt{t}', true) + '+C=';
  return {
    q: '$\\displaystyle\\int\\dfrac{' + k + '}{\\sqrt{' + inner + '}}\\,dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm([2 * k, p], '\\sqrt{' + inner + '}', true) + '+C$', wk: 22,
    s: [
      'Зэрэгт функцийн интегралаар $$\\int\\dfrac{dt}{\\sqrt{t}}=\\int t^{-\\frac{1}{2}}\\,dt=\\dfrac{t^{\\frac{1}{2}}}{\\frac{1}{2}}+C=2\\sqrt{t}+C.$$',
      '$t=' + inner + '$ гэж орлуулъя: ' + (p === 1 ? '$dt=dx$.' : '$' + dtx + '$, эндээс $' + dxt + '$.'),
      'Иймд $$\\int\\dfrac{' + k + '}{\\sqrt{' + inner + '}}\\,dx=' + tm([k, p], '\\int\\dfrac{dt}{\\sqrt{t}}', true) + '=' + mid + tm([2 * k, p], '\\sqrt{t}', true) + '+C='
        + tm([2 * k, p], '\\sqrt{' + inner + '}', true) + '+C.$$'
    ],
    t: { p: p, q: q, k: k, inner: inner }
  };
}
return p24;
})();

/* 2.9 */
var e2_9 = (function () {
// 9. ∫ k/((x − p)(x − q)) dx = k/(p − q) · ln|(x − p)/(x − q)| + C  (хуваарийг задалж бичнэ; хялбар бутархайд задлах:
//    k/((x−p)(x−q)) = k/(p−q)·(1/(x−p) − 1/(x−q))). p > q байхаар эрэмбэлж коэффициентийг эерэг болгоно.
//    (эх: ∫ 1/(x² + x) dx = ln|x/(x + 1)| + C)
function p9() {
  var p = rnd(-5, 5), q = rnd(-5, 5);
  if (p === q) return null;
  if (rnd(1, 5) <= 2) { if (rnd(0, 1)) p = 0; else q = 0; }     // эх шиг x² + bx хэлбэр
  if (p === q) return null;
  if (p < q) { var t = p; p = q; q = t; }
  var k = pick([1, 1, 1, 1, 2, 3, 4, 5, 6]), d = p - q;
  if (d / gcd(k, d) > 8 || Math.abs(p * q) > 24) return null;
  var den = poly([1, -(p + q), p * q]);
  return {
    q: '$\\displaystyle\\int\\dfrac{' + k + '}{' + den + '}\\,dx$ тодорхой бус интегралыг бод.',
    a: '$' + tm([k, d], '\\ln\\left|\\dfrac{' + poly([1, -p]) + '}{' + poly([1, -q]) + '}\\right|', true) + '+C$',
    wk: 26,
    t: { p: p, q: q, k: k }
  };
}
return p9;
})();

/* 2.48 */
var e2_48 = (function () {
// 48. ∫(p·sin(ax + b) + q·cos(ax + b))dx = −(p/a)·cos(ax + b) + (q/a)·sin(ax + b) + C
//     (эх: ∫(sin(2x + 1) − cos(2x + 1))dx = −½cos(2x + 1) − ½sin(2x + 1) + C). Заримдаа cos гишүүн эхэнд.
function p48() {
  var a = pick([2, 2, 3, 3, 4, 5, -2, -3]), b = a > 0 ? nz(-5, 5) : rnd(1, 5), p = pick([1, 1, 1, -1, 2, -2, 3, 4]), q = pick([1, -1, -1, 2, -2, 3, -3, 4]);
  if (gcd(a, b) > 1) return null;                                       // 3x + 3 г.м. ерөнхий үржигдэхүүнгүй
  var u = a > 0 ? poly([a, b]) : b + tm(a, 'x'), S = '\\sin(' + u + ')', Co = '\\cos(' + u + ')';
  var T = [{ c: p, f: S, F: [-p, a], G: Co }, { c: q, f: Co, F: [q, a], G: S }];
  if (rnd(0, 3) === 0) T.reverse();
  return {
    q: '$\\displaystyle\\int\\left(' + tm(T[0].c, T[0].f, true) + tm(T[1].c, T[1].f) + '\\right)dx$ тодорхой биш интегралыг бод.',
    a: '$' + tm(T[0].F, T[0].G, true) + tm(T[1].F, T[1].G) + '+C$',
    wk: 24,
    t: { a: a, b: b, p: p, q: q }
  };
}
return p48;
})();

/* 3.44 */
var e3_44 = (function () {
// 44. tg²u = 1/cos²u − 1, ctg²u = 1/sin²u − 1 ⇒
//     ∫a·tg²kx dx = (a/k)·tg kx − ax + C,   ∫a·ctg²kx dx = −(a/k)·ctg kx − ax + C,
//     ∫(a·tg²kx + m)dx = (a/k)·tg kx + (m − a)x + C,   ∫(m − a·tg²x)dx = (m + a)x − a·tg x + C  (ctg-д tg/ctg гишүүний тэмдэг эсрэг).
//     (эх: ∫tg²x dx = tg x − x + C)
function p44() {
  var f = pick([0, 0, 0, 1, 1, 1, 2, 2]), T = rnd(0, 3) ? 'tg' : 'ctg', fn = '\\operatorname{' + T + '}', sg = T === 'tg' ? 1 : -1;
  var k = rnd(0, 2) ? 1 : rnd(2, 4), a = pick([1, 1, 1, 2, 3, 4, 5]), m = 0, I, F;
  var t2 = fn + '^2' + (k === 1 ? 'x' : ' ' + k + 'x'), t1 = fn + (k === 1 ? 'x' : k + 'x');   // tg²kx, tg kx
  if (f === 0) {                                  // a·tg²kx
    if (a === 1 && k === 1 && rnd(0, 2)) return null;
    I = tm(a, t2, true);
    F = tm([sg * a, k], t1, true) + tm(-a, 'x');
  } else if (f === 1) {                           // (a·tg²kx + m)
    m = pick([1, 2, 3, 4, 5, 6, -1, -2, -3]);
    if (m === a && rnd(0, 1)) return null;        // m = a ⇒ x-гүй хариу (заримдаа)
    I = '\\left(' + tm(a, t2, true) + sgn(m) + '\\right)';
    F = tm([sg * a, k], t1, true) + tm(m - a, 'x');
  } else {                                        // (m − a·tg²x)
    m = rnd(1, 6); k = 1; t1 = fn + 'x';
    I = '\\left(' + m + tm(-a, fn + '^2x') + '\\right)';
    F = tm(m + a, 'x', true) + tm(-sg * a, t1);
  }
  return {
    q: 'Интеграл бод. $\\int ' + I + '\\,dx=$',
    a: '$' + F + '+C$',
    wk: 24,
    t: { f: f, T: T, k: k, a: a, m: m }
  };
}
return p44;
})();

/* 3.49 */
var e3_49 = (function () {
// 49. ∫ f'(x)/f(x) dx = ln|f(x)| + C, f — илтгэгч функцтэй (эх: ∫ eˣ/(eˣ + 1) dx = ln(eˣ + 1) + C).
//     A: A·e^{mx}/(s·e^{mx} + c) ⇒ A/(ms)·ln|…|;  B: (e^{mx} ∓ e^{−mx})/(e^{mx} ± e^{−mx}) ⇒ ±(1/m)·ln|…|;
//     C: A(2e^{2x} + k·eˣ)/(e^{2x} + k·eˣ + c) ⇒ A·ln|…|.  f > 0 (бүх x-д) бол ln(…), тэмдэг солигдох бол ln|…|.
function p49_E(m) { return m === 1 ? 'e^x' : 'e^{' + tm(m, 'x', true) + '}'; }   // e^x, e^{2x}, e^{-x}
function p49() {
  var r = rnd(1, 20), num, den, K, pos, t;
  if (r <= 13) {                                             // A: эх бодлогын хэлбэр
    var m = pick([1, 1, 1, 1, 2, 2, 3, -1, -2]), s = pick([1, 1, 1, 1, 1, 1, 2, 3, -1, -1, -2]);
    var c = s < 0 ? rnd(1, 9) : rnd(0, 3) ? rnd(1, 9) : -rnd(1, 9), A = pick([1, 1, 1, 1, 2, 3, 4, 5, 6]);
    if (gcd(s, c) > 1) return null;                           // 2e^x + 4 г.м. ерөнхий үржигдэхүүнгүй
    var E = p49_E(m);
    num = (A === 1 ? '' : A) + E;
    den = s > 0 ? tm(s, E, true) + sgn(c) : c + tm(s, E);    // 2e^{3x}+5, e^x-3, 4-e^{-x}
    K = [A, m * s]; pos = s > 0 && c > 0;
    t = { f: 'A', A: A, m: m, s: s, c: c };
  } else if (r <= 16) {                                      // B: гиперболын хос
    var m2 = pick([1, 1, 2, 3]), hyp = rnd(0, 2) > 0, flip = rnd(0, 3) === 0, P = p49_E(m2), Q = p49_E(-m2);
    if (hyp) { den = P + '+' + Q; num = flip ? Q + '-' + P : P + '-' + Q; K = [flip ? -1 : 1, m2]; pos = true; }
    else { den = flip ? Q + '-' + P : P + '-' + Q; num = P + '+' + Q; K = [flip ? -1 : 1, m2]; pos = false; }
    t = { f: 'B', m: m2, hyp: hyp, flip: flip };
  } else {                                                   // C: квадрат гурван гишүүнт eˣ-ээс
    var k = rnd(1, 6), c3 = rnd(0, 3) ? rnd(1, 9) : -rnd(1, 9), A3 = pick([1, 1, 1, 2, 3]);
    den = 'e^{2x}' + tm(k, 'e^x') + sgn(c3);
    num = tm(2 * A3, 'e^{2x}', true) + tm(A3 * k, 'e^x');
    K = [A3, 1]; pos = c3 > 0;
    t = { f: 'C', k: k, c: c3, A: A3 };
  }
  var L = pos ? '\\ln(' + den + ')' : '\\ln|' + den + '|';
  return {
    q: '$\\displaystyle\\int\\dfrac{' + num + '}{' + den + '}\\,dx=$',
    a: '$' + tm(K, L, true) + '+C$',
    wk: 22,
    t: t
  };
}
return p49;
})();

/* 3.75 */
var e3_75 = (function () {
// 75. ∫ f'(x)/f(x) dx = ln|f(x)| + C, f — тригонометр функцтэй (эх: ∫ cos x/(sin x + 1) dx = ln(1 + sin x) + C).
//     A: A·cos mx/(s·sin mx + c) ⇒ A/(ms)·ln|…|;  A·sin mx/(s·cos mx + c) ⇒ −A/(ms)·ln|…|;
//     B: sin 2x/(sin²x + c) ⇒ ln(…);  sin 2x/(cos²x + c) ⇒ −ln(…);  (cos x ∓ sin x)/(sin x ± cos x) ⇒ ln|…|.
//     c ≥ |s| бол аргумент сөрөг биш ⇒ ln(…) (эх шиг: sin x + 1 ≥ 0), c < |s| бол тэмдэг солигдоно ⇒ ln|…|.
function p75_T(fn, m) { return '\\' + fn + ' ' + (m === 1 ? '' : m) + 'x'; }   // \sin x, \cos 2x
function p75() {
  var r = rnd(1, 20), num, den, K, pos, t;
  if (r <= 15) {
    var sd = r <= 9, m = pick([1, 1, 1, 1, 2, 2, 3]), s = pick([1, 1, 1, 1, 2, 3, -1, -1, -2, -3]);
    var c = rnd(1, 6), A = pick([1, 1, 1, 1, 2, 3, 4, 6]);
    if (gcd(s, c) > 1) return null;                          // 2\sin x + 4 г.м. ерөнхий үржигдэхүүнгүй
    var Fd = p75_T(sd ? 'sin' : 'cos', m), Fn = p75_T(sd ? 'cos' : 'sin', m);
    num = (A === 1 ? '' : A) + Fn;
    den = s > 0 ? tm(s, Fd, true) + '+' + c : c + tm(s, Fd);   // \sin x+1, 2\sin 3x+5, 3-\cos x
    K = [sd ? A : -A, m * s]; pos = c >= Math.abs(s);
    t = { f: 'A', sd: sd, m: m, s: s, c: c, A: A };
  } else {
    var v = rnd(1, 4), c2 = rnd(1, 5);
    if (v === 1) { num = '\\sin 2x'; den = '\\sin^2 x+' + c2; K = [1, 1]; pos = true; }
    else if (v === 2) { num = '\\sin 2x'; den = '\\cos^2 x+' + c2; K = [-1, 1]; pos = true; }
    else if (v === 3) { num = '\\cos x-\\sin x'; den = '\\sin x+\\cos x'; K = [1, 1]; pos = false; }
    else { num = '\\cos x+\\sin x'; den = '\\sin x-\\cos x'; K = [1, 1]; pos = false; }
    t = { f: 'B', v: v, c: c2 };
  }
  var L = pos ? '\\ln(' + den + ')' : '\\ln|' + den + '|';
  return {
    q: '$\\displaystyle\\int\\dfrac{' + num + '}{' + den + '}\\,dx=$',
    a: '$' + tm(K, L, true) + '+C$',
    wk: 22,
    t: t
  };
}
return p75;
})();

/* 3.67 */
var e3_67 = (function () {
// 67. dy/dx-ийн эх функц гишүүн бүрээр: ∫a dx = ax, ∫b·sin x dx = −b·cos x, ∫b·cos x dx = b·sin x, ∫c·eˣ dx = c·eˣ,
//     ∫c·xⁿ dx = c/(n+1)·xⁿ⁺¹;  y = F(x) + C.   (эх: dy/dx = 1 − sin x → y = x + cos x + C)
function p67_tx(T, first) {   // dy/dx-ийн гишүүн [төрөл 'k'|'s'|'c'|'e'|'p', коэф, n] → TeX
  var c = T[1];
  if (T[0] === 'k') return first ? dec(c) : sgn(c);
  return tm(c, T[0] === 's' ? '\\sin x' : T[0] === 'c' ? '\\cos x' : T[0] === 'e' ? 'e^x' : T[2] === 1 ? 'x' : 'x^' + T[2], first);
}
function p67_ix(T, first) {   // эх функцийн гишүүн → TeX
  var c = T[1];
  if (T[0] === 'k') return tm(c, 'x', first);
  if (T[0] === 's') return tm(-c, '\\cos x', first);
  if (T[0] === 'c') return tm(c, '\\sin x', first);
  if (T[0] === 'e') return tm(c, 'e^x', first);
  return tm([c, T[2] + 1], 'x^' + (T[2] + 1), first);
}
function p67() {
  var f = pick([0, 0, 0, 1, 1, 2, 2, 3, 4, 5, 6]), A = pick([1, 1, 2, 3, 4, 5, -1, -2]), B = pick([1, 1, 2, 3, 4, -1, -1, -2, -3]);
  var tr = pick(['s', 'c']), n = pick([1, 1, 2, 2, 3]), C = pick([1, 2, 3, 4, 6, -1, -2, -3]), L;
  if (f === 0) L = [['k', A], ['s', B]];                              // эх хэлбэр: a ± b·sin x
  else if (f === 1) L = [['k', A], ['c', B]];
  else if (f === 2) { L = [['p', C, n], [tr, B]]; if (rnd(0, 2) === 0) L.push(['k', A]); }
  else if (f === 3) { L = [['e', pick([1, 1, 2, 3, -1])], ['k', A]]; if (rnd(0, 1)) L.reverse(); }
  else if (f === 4) { L = [['s', B], ['c', pick([1, 2, -1, -2, 3])]]; if (rnd(0, 1)) L.reverse(); }
  else if (f === 5) { L = [['e', pick([1, 2, -1, 3])], ['p', C, n]]; if (rnd(0, 1)) L.reverse(); }
  else L = [[tr, B], ['e', pick([1, 2, -1])]];
