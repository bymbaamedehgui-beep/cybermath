<script>
/* ЭЕШ 1000 бодлого-8 — ЭЕШ-ийн 1000 бодлого, 2-р хэсэг (76–100-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 76. (a − √b·i)(a + √b·i) ± (c + di)·i = a² + b ∓ d ± c·i  (эх: (1−√2i)(1+√2i)+(1+3i)i = i).
//     30%-д эх шиг бодит хэсэг 0 (d = ±(a² + b)); хүчин зүйлсийн дараалал, i-ийн байрлал (урд/ард), тэмдэг санамсаргүй.
function p76_c(re, im) {
  var s = re !== 0 ? String(re) : '';
  if (im !== 0) { var ab = Math.abs(im), body = (ab === 1 ? '' : ab) + 'i'; s += im < 0 ? '-' + body : (s ? '+' : '') + body; }
  return s || '0';
}
function p76() {
  var a = rnd(1, 4), b = pick([2, 3, 5, 6, 7]), s = rnd(0, 3) ? 1 : -1, c = nz(-4, 5), d;
  if (rnd(1, 10) <= 3) { d = s * (a * a + b); if (Math.abs(d) > 12) return null; }
  else d = nz(-6, 6);
  var re = a * a + b - s * d, im = s * c;
  var f1 = '\\left(' + a + '-\\sqrt{' + b + '}i\\right)', f2 = '\\left(' + a + '+\\sqrt{' + b + '}i\\right)';
  var t2 = rnd(1, 5) === 1 ? 'i(' + p76_c(c, d) + ')' : '(' + p76_c(c, d) + ')i';
  return {
    q: '$' + (rnd(0, 3) ? f1 + f2 : f2 + f1) + (s > 0 ? '+' : '-') + t2 + '$ илэрхийллийг хялбарчил.',
    a: '$' + p76_c(re, im) + '$',
    wk: 20,
    t: { a: a, b: b, c: c, d: d, s: s }
  };
}

// 77. Комплекс тоонуудын шугаман эвлүүлэг: p(a+bi) ± q(c+di) = (pa ± qc) + (pb ± qd)i  (эх: 2(1+i) − (1−i) = 1+3i).
function p77_c(re, im) {
  var s = re !== 0 ? String(re) : '';
  if (im !== 0) { var ab = Math.abs(im), body = (ab === 1 ? '' : ab) + 'i'; s += im < 0 ? '-' + body : (s ? '+' : '') + body; }
  return s || '0';
}
function p77() {
  var a = nz(-4, 4), b = nz(-4, 4), c = nz(-4, 4), d = nz(-4, 4), p = rnd(1, 3), q = rnd(1, 3), s = rnd(0, 2) ? -1 : 1;
  if (p === q) return null;
  var re = p * a + s * q * c, im = p * b + s * q * d;
  if ((re === 0 && im === 0) || Math.abs(re) > 12 || Math.abs(im) > 12) return null;
  var t1 = (p === 1 ? '' : p) + '(' + p77_c(a, b) + ')', t2 = (q === 1 ? '' : q) + '(' + p77_c(c, d) + ')';
  return {
    q: '$' + t1 + (s < 0 ? '-' : '+') + t2 + '$ илэрхийллийг хялбарчлах.',
    a: '$' + p77_c(re, im) + '$',
    wk: 16,
    t: { p: p, q: s * q, z: [a, b], w: [c, d] }
  };
}

// 78. Комплекс тооны аргумент (гол утга −π < arg z ≤ π):  ±k ± ki → ±π/4, ±3π/4;  ±k√3 ± ki → ±π/6, ±5π/6;
//     ±k ± k√3 i → ±π/3, ±2π/3;  тэнхлэг дээрх k, −k, ki, −ki → 0, π, π/2, −π/2.  (эх: z = 1+i → π/4)
// k·(√3) хэсгийн TeX: p78_p(-2, true) → '-2\sqrt{3}', p78_p(1, false) → '1'
function p78_p(k, r3) { var a = Math.abs(k); return (k < 0 ? '-' : '') + (r3 ? (a === 1 ? '' : a) + '\\sqrt{3}' : String(a)); }
function p78() {
  var T = rnd(1, 100), k = rnd(1, 3), sx = rnd(0, 1) ? 1 : -1, sy = rnd(0, 1) ? 1 : -1, z, n, d;   // arg = nπ/d
  if (T <= 15) {
    var j = rnd(0, 3), m = rnd(1, 6);
    z = [String(m), '-' + m, (m === 1 ? '' : m) + 'i', '-' + (m === 1 ? '' : m) + 'i'][j];
    n = [0, 1, 1, -1][j]; d = [1, 1, 2, 2][j];
  } else {
    var fam = T <= 50 ? 4 : T <= 75 ? 6 : 3, re, im;
    if (fam === 4) { k = rnd(1, 4); re = p78_p(sx * k, false); im = p78_p(k, false); }
    else if (fam === 6) { re = p78_p(sx * k, true); im = p78_p(k, false); }
    else { re = p78_p(sx * k, false); im = p78_p(k, true); }
    if (im === '1') im = '';
    z = re + (sy < 0 ? '-' : '+') + im + 'i';
    // I мөчийн өнцөг π/d; x < 0 бол π − π/d; y < 0 бол тэмдэг сөрөг
    n = sx > 0 ? 1 : fam - 1; d = fam;
    if (sy < 0) n = -n;
  }
  var g = gcd(Math.abs(n), d); if (n !== 0) { n /= g; d /= g; }
  var ang = n === 0 ? '0' : d === 1 ? (n < 0 ? '-' : '') + '\\pi' : (n < 0 ? '-' : '') + '\\dfrac{' + (Math.abs(n) === 1 ? '' : Math.abs(n)) + '\\pi}{' + d + '}';
  return {
    q: '$z=' + z + '$ бол $\\arg z=?$',
    a: '$\\arg z=' + ang + '$',
    wk: 18,
    t: { z: z, n: n, d: d }
  };
}

// 79. i-ийн зэрэг: i^m нь m mod 4-өөр 1, i, −1, −i; (−i)^m = (−1)^m·i^m.  p·b₁^m ± q·b₂^n (b ∈ {i, −i}, m, n — хоёр оронтой)
//     (эх: i^21 − 3(−i)^45 = i + 3i = 4i).  Хариу 0 биш.
function p79_c(re, im) {
  var s = re !== 0 ? String(re) : '';
  if (im !== 0) { var ab = Math.abs(im), body = (ab === 1 ? '' : ab) + 'i'; s += im < 0 ? '-' + body : (s ? '+' : '') + body; }
  return s || '0';
}
// (±i)^m → [re, im]
function p79_pw(neg, m) { var v = [[1, 0], [0, 1], [-1, 0], [0, -1]][m % 4], sg = neg && m % 2 ? -1 : 1; return [sg * v[0], sg * v[1]]; }
function p79() {
  var m = rnd(11, 99), n = rnd(11, 99), n1 = rnd(1, 3) === 1, n2 = rnd(1, 3) > 1, p = pick([1, 1, 1, 2, 3]), q = rnd(1, 5), s = rnd(0, 2) ? -1 : 1;
  if (m === n || (n1 === n2 && p === q)) return null;
  var A = p79_pw(n1, m), B = p79_pw(n2, n), re = p * A[0] + s * q * B[0], im = p * A[1] + s * q * B[1];
  if (re === 0 && im === 0) return null;
  var T = function (neg, e) { return (neg ? '(-i)' : 'i') + '^{' + e + '}'; };
  return {
    q: '$' + (p === 1 ? '' : p) + T(n1, m) + (s < 0 ? '-' : '+') + (q === 1 ? '' : q) + T(n2, n) + '$ илэрхийллийг хялбарчил.',
    a: '$' + p79_c(re, im) + '$',
    wk: 20,
    t: { m: m, n: n, n1: n1, n2: n2, p: p, q: s * q }
  };
}

// 80. Комплекс шугаман тэгшитгэл: α ± k(z + β) = γ  ⇒  z = (γ − α)/(±k) − β  (эх: i − 3(z − i + 1) = 5 ⇒ z = −8/3 + 4/3·i).
//     α, β, γ — бүхэл бодит/хуурмаг хэсэгтэй; k = 2..5; ихэнхдээ бутархай хариу (эх шиг).
function p80_c(re, im) {
  var s = re !== 0 ? String(re) : '';
  if (im !== 0) { var ab = Math.abs(im), body = (ab === 1 ? '' : ab) + 'i'; s += im < 0 ? '-' + body : (s ? '+' : '') + body; }
  return s || '0';
}
// бутархай хэсэгтэй комплекс тоо: rn/rd + (jn/jd)i
function p80_cf(rn, rd, jn, jd) {
  var re = rn === 0 ? '' : fr(rn, rd), im = '';
  if (jn !== 0) {
    if (jd < 0) { jn = -jn; jd = -jd; }
    var g = gcd(jn, jd), n = Math.abs(jn) / g, d = jd / g;
    im = (jn < 0 ? '-' : re ? '+' : '') + (d === 1 ? (n === 1 ? '' : n) : '\\dfrac{' + n + '}{' + d + '}') + 'i';
  }
  return re + im || '0';
}
function p80() {
  var T = rnd(1, 10), al = T <= 4 ? [0, nz(-3, 3)] : T <= 7 ? [nz(-5, 5), 0] : [nz(-4, 4), nz(-3, 3)];
  var be = [nz(-4, 4), nz(-3, 3)], ga = rnd(0, 1) ? [nz(-6, 8), 0] : [nz(-5, 6), nz(-4, 4)], k = rnd(2, 5), s = rnd(1, 10) <= 7 ? -1 : 1;
  var rn = ga[0] - al[0] - s * k * be[0], jn = ga[1] - al[1] - s * k * be[1], d = s * k;     // z = (rn + jn·i)/d
  if (rn === 0 && jn === 0) return null;
  var whole = rn % k === 0 && jn % k === 0;
  if (whole && rnd(1, 10) <= 7) return null;                                             // ихэнхдээ бутархай
  var iFirst = rnd(0, 1) === 1, bi = (be[1] < 0 ? '-' : '+') + (Math.abs(be[1]) === 1 ? '' : Math.abs(be[1])) + 'i', br = sgn(be[0]);
  var lhs = p80_c(al[0], al[1]) + (s < 0 ? '-' : '+') + k + '(z' + (iFirst ? bi + br : br + bi) + ')';
  return {
    q: '$' + lhs + '=' + p80_c(ga[0], ga[1]) + '$ тэгшитгэлийг бод.',
    a: '$z=' + p80_cf(rn, d, jn, d) + '$',
    wk: 22,
    t: { al: al, be: be, ga: ga, k: s * k }
  };
}

// 81. Сөрөг дискриминанттай квадрат тэгшитгэл x² + px + q = 0 ⇒ x = −p/2 ± (√(4q − p²)/2)·i  (эх: x² + 2x + 10 = 0 ⇒ −1 ± 3i).
//     65%: бүхэл язгуур a ± bi;  20%: p тэгш, хуурмаг хэсэг k√r;  15%: p сондгой (−p/2 ± (k√r/2)i).
function p81() {
  var T = rnd(1, 100), p, q;
  if (T <= 65) { var a = rnd(-5, 5), b = rnd(1, 6); p = -2 * a; q = a * a + b * b; }
  else if (T <= 85) { var h = rnd(-4, 4), m = rnd(2, 12); if (surd(m).r === 1) return null; p = -2 * h; q = h * h + m; }
  else { p = pick([-5, -3, -1, 1, 3, 5]); q = rnd(Math.floor(p * p / 4) + 1, Math.floor(p * p / 4) + 8); }
  var D = 4 * q - p * p;                       // −дискриминант > 0
  if (D <= 0 || q > 40) return null;
  var sd = surd(D), k = sd.k, r = sd.r, den = 2, g = gcd(k, 2);
  k /= g; den /= g;
  var imc = r === 1 ? String(k) : (k === 1 ? '' : k) + '\\sqrt{' + r + '}';
  if (den === 1 && imc === '1') imc = '';
  var im = den === 1 ? imc + 'i' : '\\dfrac{' + (r === 1 ? k : imc) + '}{' + den + '}i';
  var re = p === 0 ? '' : fr(-p, 2);
  return {
    q: '$' + poly([1, p, q]) + '=0$ тэгшитгэлийг бод.',
    a: '$x=' + re + '\\pm ' + im + '$',
    wk: 20,
    t: { p: p, q: q }
  };
}

// 82. Гурван олонлогийн Венн диаграм: өгөгдсөн олонлогийг будаж дүрслэх (эх: A′∩(B∪C), зураггүй).
//     Асуултад хоосон A, B, C диаграм (сурагч будна), хариунд илэрхийлэл + будсан диаграм.
//     15 загвар × үсгийн сэлгэлт (солигдох хосыг цагаан толгойн дарааллаар) ≈ 53 хувилбар; гүйцээлтийг эх шиг ′-ээр.
//     8 хэсгийн (a, b, c ∈ {0, 1}) будгийг mask-аар: U → A → B → C → A∩B → A∩C → B∩C → A∩B∩C дарааллаар будна.
var p82_T = [   // [TeX(X, Y, Z), гишүүнчлэл(x, y, z), эрэмбэлэх хос]
  [function (X, Y, Z) { return X + "'\\cap(" + Y + '\\cup ' + Z + ')'; }, function (x, y, z) { return !x && (y || z); }, [1, 2]],
  [function (X, Y, Z) { return '(' + X + '\\cap ' + Y + ')\\cup ' + Z + "'"; }, function (x, y, z) { return (x && y) || !z; }, [0, 1]],
  [function (X, Y, Z) { return X + '\\setminus(' + Y + '\\cup ' + Z + ')'; }, function (x, y, z) { return x && !(y || z); }, [1, 2]],
  [function (X, Y, Z) { return '(' + X + '\\cup ' + Y + ')\\cap ' + Z + "'"; }, function (x, y, z) { return (x || y) && !z; }, [0, 1]],
  [function (X, Y, Z) { return X + '\\cap ' + Y + '\\cap ' + Z + "'"; }, function (x, y, z) { return x && y && !z; }, [0, 1]],
  [function (X, Y, Z) { return X + '\\cap(' + Y + '\\cup ' + Z + ')'; }, function (x, y, z) { return x && (y || z); }, [1, 2]],
  [function (X, Y, Z) { return X + '\\cup(' + Y + '\\cap ' + Z + ')'; }, function (x, y, z) { return x || (y && z); }, [1, 2]],
  [function (X, Y, Z) { return '(' + X + '\\cup ' + Y + ')\\setminus ' + Z; }, function (x, y, z) { return (x || y) && !z; }, [0, 1]],
  [function (X, Y, Z) { return '(' + X + '\\cap ' + Y + ")'\\cap " + Z; }, function (x, y, z) { return !(x && y) && z; }, [0, 1]],
  [function (X, Y, Z) { return X + "'\\cap " + Y + "'\\cap " + Z; }, function (x, y, z) { return !x && !y && z; }, [0, 1]],
  [function (X, Y, Z) { return X + "'\\cup(" + Y + '\\cap ' + Z + ')'; }, function (x, y, z) { return !x || (y && z); }, [1, 2]],
  [function (X, Y, Z) { return '(' + X + '\\cup ' + Y + ")'\\cup " + Z; }, function (x, y, z) { return !(x || y) || z; }, [0, 1]],
  [function (X, Y, Z) { return X + '\\cap(' + Y + '\\cup ' + Z + ")'"; }, function (x, y, z) { return x && !(y || z); }, [1, 2]],
  [function (X, Y) { return X + '\\setminus ' + Y; }, function (x, y) { return x && !y; }, null],
  [function (X, Y) { return X + '\\cap ' + Y + "'"; }, function (x, y) { return x && !y; }, null],
  [function () { return "(A\\cup B\\cup C)'"; }, function (x, y, z) { return !(x || y || z); }, null],
  [function () { return 'A\\cap B\\cap C'; }, function (x, y, z) { return x && y && z; }, null]
];
var p82_R = ['000', '100', '010', '001', '110', '101', '011', '111'];
// Венн диаграм: S = { '101': true, … } будах хэсгүүд (null бол хоосон)
function p82_fig(w, S) {
  var f = Fig({ w: w }), W = 10, H = 8.6, r = 2.3, CA = [3.7, 5.2], CB = [6.3, 5.2], CC = [5, 3];
  if (S) {
    var mk = f.uid(), ca = f.uid(), cb = f.uid();
    f.raw(function (T) {
      var x0 = T.X(0), y0 = T.Y(H), ww = W * T.sx, hh = H * T.sy, R = (r * T.sx).toFixed(2);
      var col = function (k) { return S[k] ? '#fff' : '#000'; };
      var el = function (C, fill, extra) { return '<ellipse cx="' + T.X(C[0]).toFixed(2) + '" cy="' + T.Y(C[1]).toFixed(2) + '" rx="' + R + '" ry="' + R + '" fill="' + fill + '"' + (extra || '') + '/>'; };
      var g = function (id, inner) { return '<g clip-path="url(#' + id + ')">' + inner + '</g>'; };
      var rc = function (fill, extra) { return '<rect x="' + x0.toFixed(2) + '" y="' + y0.toFixed(2) + '" width="' + ww.toFixed(2) + '" height="' + hh.toFixed(2) + '" fill="' + fill + '"' + (extra || '') + '/>'; };
      return '<defs><clipPath id="' + ca + '">' + el(CA, '#000') + '</clipPath><clipPath id="' + cb + '">' + el(CB, '#000') + '</clipPath>'
        + '<mask id="' + mk + '" maskUnits="userSpaceOnUse" x="' + (x0 - 2).toFixed(2) + '" y="' + (y0 - 2).toFixed(2) + '" width="' + (ww + 4).toFixed(2) + '" height="' + (hh + 4).toFixed(2) + '">'
        + rc(col('000')) + el(CA, col('100')) + el(CB, col('010')) + el(CC, col('001'))
        + g(ca, el(CB, col('110'))) + g(ca, el(CC, col('101'))) + g(cb, el(CC, col('011')))
        + g(ca, el(CC, col('111'), ' clip-path="url(#' + cb + ')"')) + '</mask></defs>'
        + rc('#9ec5e8', ' mask="url(#' + mk + ')"');
    });
  }
  f.rect(0, 0, W, H, { w: 1.2 }).circle(CA, r, { w: 1.3 }).circle(CB, r, { w: 1.3 }).circle(CC, r, { w: 1.3 });
  var sz = w < 170 ? 12 : 13;
  f.text([0.8, 5.9], 'A', { size: sz, plain: true }).text([9.2, 5.9], 'B', { size: sz, plain: true }).text([7.65, 1.2], 'C', { size: sz, plain: true })
    .text([0.25, H - 0.2], 'U', { pos: 'se', size: sz - 1, plain: true });
  return f.svg();
}
function p82() {
  var t = p82_T[rnd(0, p82_T.length - 1)], L = shuffle(['A', 'B', 'C']);
  if (t[2]) { var i = t[2][0], j = t[2][1]; if (L[i] > L[j]) { var tmp = L[i]; L[i] = L[j]; L[j] = tmp; } }
  var tex = t[0](L[0], L[1], L[2]), S = {}, n = 0;
  p82_R.forEach(function (k) {
    var v = { A: k[0] === '1', B: k[1] === '1', C: k[2] === '1' };
    S[k] = !!t[1](v[L[0]], v[L[1]], v[L[2]]);
    if (S[k]) n++;
  });
  if (n === 0 || n === 8) return null;
  return {
    q: '$' + tex + '$ олонлогийг дүрсэл.',
    a: '$' + tex + '$<br>' + p82_fig(150, S),
    fig: p82_fig(190, null), side: true, wk: 15,
    t: { tex: tex, S: S }
  };
}

// 83. Дөрвөн өнцөгтүүд: par% параллелограмм, rect% тэгш өнцөгт, rh% ромбо, s ширхэг квадрат = sq%.
//     Нийт N = s/(sq/100); тэгш өнцөгт ∩ ромбо = квадрат ⇒ тэгш өнцөгт ч, ромбо ч биш параллелограмм
//     = N(par − rect − rh + sq)/100  (эх: 80, 40, 30, 3 ширхэг = 5% ⇒ N = 60, хариу 9).
//     N ∈ {20, 40, …, 120}, хувиуд 5-ийн үржвэр ⇒ бүх тоо бүхэл; квадрат < тэгш өнцөгт, ромбо; хариу ≥ 1.
function p83() {
  var N = 20 * rnd(1, 6), sq = 5 * rnd(1, 3), rect = 5 * rnd(sq / 5 + 1, 10), rh = 5 * rnd(sq / 5 + 1, 10), par = 5 * rnd(10, 18);
  var s = N * sq / 100, ans = N * (par - rect - rh + sq) / 100;
  if (s < 2 || s > 12 || rect + rh - sq >= par || ans < 1 || par >= 100) return null;
  if (rect === rh && rnd(0, 2)) return null;
  return {
    q: 'Сурагчид дөрвөн өнцөгтүүд зуржээ. Тэдгээрийн ' + par + '% нь параллелограмм, ' + rect + '% нь тэгш өнцөгт, ' + rh + '% нь ромбо байв. '
      + s + ' ширхэг квадрат байгаа нь ' + sq + '% нь болж байв. Тэгш өнцөгт болон ромбо болж чадахгүй хэдэн параллелограмм зурсан бэ?',
    a: '$' + ans + '$',
    wk: 26,
    t: { N: N, par: par, rect: rect, rh: rh, sq: sq }
  };
}

// 84. Факториалтай илэрхийлэл: ((n+a)! ± k·(n+b)!)/(n+c)!,  c ≤ b < a,  a − c ≤ 2.
//     (n+a)!/(n+c)! = ∏_{j=c+1..a}(n+j),  (n+b)!/(n+c)! = ∏_{j=c+1..b}(n+j)  ⇒ олон гишүүнт (зэрэг ≤ 2).
//     Хариу: бүхэл язгууртай бол үржвэрээр (n², n(n+2), (n−1)(n+3), (n+1)²), үгүй бол задалсан (n²+n−1)  (эх: ((n+1)! − n!)/(n−1)! = n²).
function p84_f(k) { return k === 0 ? 'n!' : '(n' + (k > 0 ? '+' : '-') + Math.abs(k) + ')!'; }
// олон гишүүнтүүдийн үржвэр [их зэргээс]
function p84_mul(P, Q) { var R = []; for (var i = 0; i < P.length + Q.length - 1; i++) R.push(0); P.forEach(function (p, i) { Q.forEach(function (q, j) { R[i + j] += p * q; }); }); return R; }

function p84_tex(P) {
  if (P.length === 2) return poly(P, 'n');
  var B = P[1], C = P[2], D = B * B - 4 * C, sd = Math.round(Math.sqrt(Math.max(D, 0)));
  if (D < 0 || sd * sd !== D) return poly(P, 'n');
  var r1 = (-B - sd) / 2, r2 = (-B + sd) / 2;                                   // n² + Bn + C = (n − r1)(n − r2)
  if (r1 === r2) return r1 === 0 ? 'n^2' : p84_lin(r1) + '^2';
  if (r2 === 0) return 'n' + p84_lin(r1);
  if (r1 === 0) return 'n' + p84_lin(r2);
  return p84_lin(r2) + p84_lin(r1);
}
function p84() {
  var T = pick([[1, 0, -1], [1, 0, -1], [1, 0, -1], [2, 1, 0], [2, 1, 0], [0, -1, -2], [0, -1, -2], [1, -1, -1], [1, -1, -1], [2, 0, 0], [0, -2, -2], [1, 0, 0], [2, 1, 1], [0, -1, -1]]);
  var a = T[0], b = T[1], c = T[2], s = rnd(0, 2) ? -1 : 1, k = pick([1, 1, 1, 2, 3]);
  var A = p84_prod(c, a), Bp = p84_prod(c, b), R = A.slice();
  for (var i = 0; i < Bp.length; i++) R[R.length - Bp.length + i] += s * k * Bp[i];     // A ± k·B
  while (R.length > 1 && R[0] === 0) R.shift();
  if (R.length < 2) return null;
  var num = p84_f(a) + (s < 0 ? '-' : '+') + (k > 1 ? k + '\\cdot ' : '') + p84_f(b);
  return {
    q: '$\\dfrac{' + num + '}{' + p84_f(c) + '}$ илэрхийллийг хялбарчилсан нь аль вэ?',
    a: '$' + p84_tex(R) + '$',
    wk: 22,
    t: { a: a, b: b, c: c, s: s, k: k }
  };
}

// 85. n сурагч дараалан зогсох: X нь Y-ээс урд → n!/2 (тэгш хэм);  X, Y зэрэгцэж → 2·(n−1)!;
//     зэрэгцээгүй → n! − 2·(n−1)! = (n−2)·(n−1)!   (эх: 20 сурагч, Болд Тулгаас урд → 20!/2).  n ≤ 8 бол тоон утгыг нэмж бичнэ.
var p85_N = [   // [нэр, -аас, -тай]
  ['Болд', 'Болдоос', 'Болдтой'], ['Тулга', 'Тулгаас', 'Тулгатай'], ['Бат', 'Батаас', 'Баттай'], ['Дорж', 'Доржоос', 'Доржтой'],
  ['Сүх', 'Сүхээс', 'Сүхтэй'], ['Энх', 'Энхээс', 'Энхтэй'], ['Мөнх', 'Мөнхөөс', 'Мөнхтэй'], ['Төмөр', 'Төмөрөөс', 'Төмөртэй'],
  ['Ганаа', 'Ганаагаас', 'Ганаатай'], ['Сараа', 'Сараагаас', 'Сараатай'], ['Анар', 'Анараас', 'Анартай'], ['Цэцэг', 'Цэцэгээс', 'Цэцэгтэй'],
  ['Нараа', 'Нараагаас', 'Нараатай'], ['Оюу', 'Оюугаас', 'Оюутай'], ['Золбоо', 'Золбоогоос', 'Золбоотой'], ['Дулмаа', 'Дулмаагаас', 'Дулмаатай']

  else { q = X[0] + ' ' + Y[2] + ' зэрэгцэж зогсоогүй байх'; a = n + '!-2\\cdot ' + (n - 1) + '!=' + (n - 2) + '\\cdot ' + (n - 1) + '!' + (n <= 8 ? '=' + (n - 2) * p85_f(n - 1) : ''); }
  return {

// 86. Дэд олонлогийн тоо.  Эх: 2n+1 элементтэй олонлогийн n-ээс олон элементтэй дэд олонлог → 2^{2n} = 4^n (тэгш хэм: k ↔ m−k).
//     Хувилбарууд: эх (тэмдэгтээр); m = 2t+1 (5…11): t-ээс олон / (t+1)-ээс цөөн → 2^{m−1};  яг k → C_m^k;
//     k-аас цөөнгүй / k-аас олон → C_m^j-ийн нийлбэр (≤ 4 гишүүн).
function p86_C(n, k) { var r = 1; for (var i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
function p86_sum(m, lo) {   // Σ_{j=lo..m} C_m^j
  var terms = [], v = 0;
  for (var j = lo; j <= m; j++) { terms.push('C_{' + m + '}^{' + j + '}'); v += p86_C(m, j); }
  return terms.join('+') + '=' + v;

function p86() {
  var T = rnd(1, 100), m, q, a;
  if (T <= 15) {
    return { q: '$2n+1$ элементтэй олонлогийн $n$-ээс олон элементтэй дэд олонлог хэд байх вэ?', a: '$2^{2n}=4^n$', wk: 20, t: { m: 0 } };
  }
  if (T <= 45) {
    var t = rnd(2, 5); m = 2 * t + 1;
    q = rnd(0, 3) ? sfx(t, 'аас') + ' олон' : sfx(t + 1, 'аас') + ' цөөн';
    a = '2^{' + (m - 1) + '}=' + Math.pow(2, m - 1);
  } else if (T <= 70) {
    m = rnd(5, 12); var k = rnd(2, m - 2);
    q = 'яг ' + k; a = 'C_{' + m + '}^{' + k + '}=' + p86_C(m, k);
  } else if (T <= 85) {
    m = rnd(5, 10); var k2 = rnd(m - 3, m - 1);
    q = sfx(k2, 'аас') + ' цөөнгүй'; a = p86_sum(m, k2);
  } else {
    m = rnd(5, 10); var k3 = rnd(m - 4, m - 2);
    if (m % 2 === 1 && k3 === (m - 1) / 2) return null;

  }
  return {
    q: m + ' элементтэй олонлогийн ' + q + ' элементтэй дэд олонлог хэд байх вэ?',
    a: '$' + a + '$',
    wk: 20,
    t: { m: m }
  };
}

// 87. Нийцгүй (үл нийцэх) үзэгдэл: K хүүхэд (3 эсвэл 4) сонгоход үр дүнг хүүгийн тоо b ∈ {0..K}-оор илэрхийлнэ (охин = K − b).
//     Суурь үзэгдэл ба I–IV үзэгдэл нь b-ийн олонлог; нийцгүй ⇔ огтлолцол хоосон. Нийцгүй нь 1–3 ширхэг.
//     (эх: K = 3, «Ядаж хоёр нь охин байх»; I. Яг нэг нь хүү, II. Ядаж нэг нь хүү, III. Ядаж хоёр нь хүү, IV. Гурвуул хүү → III ба IV)
var p87_W = { 1: 'нэг', 2: 'хоёр', 3: 'гурав', 4: 'дөрөв' }, p87_RM = ['I', 'II', 'III', 'IV'];
// үзэгдлүүдийн сан: [бичиг, b → bool]
function p87_pool(K) {
  var P = [], j;
  [['хүү', false], ['охин', true]].forEach(function (sx) {
    var cnt = function (b) { return sx[1] ? K - b : b; };
    for (j = 1; j < K; j++) (function (j) {
      P.push(['Яг ' + p87_W[j] + ' нь ' + sx[0] + ' байх', function (b) { return cnt(b) === j; }]);
      P.push(['Ядаж ' + p87_W[j] + ' нь ' + sx[0] + ' байх', function (b) { return cnt(b) >= j; }]);
      P.push(['Хамгийн ихдээ ' + p87_W[j] + ' нь ' + sx[0] + ' байх', function (b) { return cnt(b) <= j; }]);
    })(j);
    P.push([(K === 3 ? 'Гурвуул ' : 'Дөрвүүл ') + sx[0] + ' байх', function (b) { return cnt(b) === K; }]);
  });
  return P;
}
function p87_set(K, f) { var s = ''; for (var b = 0; b <= K; b++) s += f(b) ? '1' : '0'; return s; }
function p87() {
  var K = rnd(1, 3) === 1 ? 4 : 3, P = p87_pool(K);
  var base = pick(P.filter(function (e) { return /^(Ядаж|Яг|Хамгийн ихдээ)/.test(e[0]); })), bs = p87_set(K, base[1]);
  var seen = {}, list = [];
  seen[bs] = 1;
  shuffle(P).forEach(function (e) {
    var s = p87_set(K, e[1]);
    if (list.length >= 4 || seen[s] || s.indexOf('0') < 0) return;   // давхардал, суурьтай ижил, бүх орчин — алгасна
    seen[s] = 1; list.push(e);
  });
  if (list.length < 4) return null;
  var bad = [];
  list.forEach(function (e, i) { var ok = false; for (var b = 0; b <= K; b++) if (base[1](b) && e[1](b)) ok = true; if (!ok) bad.push(p87_RM[i]); });
  if (bad.length < 1 || bad.length > 3) return null;
  var ans = bad.length === 1 ? bad[0] : bad.slice(0, -1).join(', ') + ' ба ' + bad[bad.length - 1];
  return {
    q: 'Ангиас ' + (K === 3 ? 'гурван' : 'дөрвөн') + ' хүүхэд сонгов. Дараах үзэгдлүүдээс аль нь “' + base[0] + '” үзэгдэлтэй нийцгүй байна вэ?'
      + '<div style="margin:2px 0 0 2.4em;line-height:1.5">' + list.map(function (e, i) { return '<div>' + p87_RM[i] + '. ' + e[0] + '</div>'; }).join('') + '</div>',
    a: '<span>' + ans + '</span>',
    wk: 18,
    t: { K: K, base: base[0], list: list.map(function (e) { return e[0]; }) }
  };
}

// 88. Чанар шалгагч машины 2×2 хүснэгт: гэмтэлтэй/гэмтэлгүй бараа × «гэмтэлтэй гэж оношлогдсон»/«өнгөрүүлсэн».
//     Асуулт: P(оношлогдсон) (эх: (18+6)/200 = 3/25), P(гэмтэлтэй), P(зөв оношилсон),
//     P(гэмтэлтэй | оношлогдсон), P(гэмтэлтэй | өнгөрүүлсэн).  Хариу: эх шиг хураагаагүй = хураасан.
function p88() {
  var TP = rnd(8, 36), FN = rnd(1, 8), FP = rnd(2, 15), N = 10 * rnd(10, 30), TN = N - TP - FN - FP, T = rnd(1, 100), q, n, d;

  else if (T <= 55) { q = 'Эдгээрээс санамсаргүй сонгосон бараа гэмтэлтэй байх магадлалыг ол.'; n = TP + FN; d = N; }
  else if (T <= 70) { q = 'Эдгээрээс санамсаргүй сонгосон барааг машин зөв оношилсон байх магадлалыг ол.'; n = TP + TN; d = N; }
  else if (T <= 85) { q = 'Гэмтэлтэй гэж оношлогдсон бараанаас санамсаргүй сонгосон бараа үнэхээр гэмтэлтэй байх магадлалыг ол.'; n = TP; d = TP + FP; }
  else { q = 'Өнгөрүүлсэн бараанаас санамсаргүй сонгосон бараа гэмтэлтэй байх магадлалыг ол.'; n = FN; d = FN + TN; }

    a: '$P=' + (red === raw ? raw : raw + '=' + red) + '$',
    fig: tbl([['', 'Гэмтэлтэй гэж оношлогдсон', 'Өнгөрүүлсэн'], ['Гэмтэлтэй бараа', TP, FN], ['Гэмтэлгүй бараа', FP, TN]]),

// 89. Гипергеометр магадлал: N компаниас D нь дампуурсан, k өөр компаний хувьцаа авсан.
//     Ядаж 1: 1 − C_{N−D}^k / C_N^k (эх: N = 20, D = 4, k = 3 → 29/57);  яг 1: D·C_{N−D}^{k−1} / C_N^k;
//     ядаж 2: 1 − (C_{N−D}^k + D·C_{N−D}^{k−1}) / C_N^k;  аль нь ч биш: C_{N−D}^k / C_N^k.
function p89_C(n, k) { var r = 1; for (var i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
function p89_c(n, k) { return k === 1 ? String(n) : 'C_{' + n + '}^{' + k + '}'; }   // C_n^1 = n
function p89() {
  var N = rnd(10, 30), D = rnd(2, 6), k = rnd(2, 4), T = rnd(1, 100), G = N - D, tot = p89_C(N, k), q, f, num;
  if (D * 2 > N) return null;
  var z0 = p89_C(G, k), z1 = D * p89_C(G, k - 1);
  if (T <= 50) { q = 'Ядаж 1 компаний хувьцаа нь дампуурсан компанийх байх'; f = '1-\\dfrac{' + p89_c(G, k) + '}{' + p89_c(N, k) + '}'; num = tot - z0; }
  else if (T <= 75) { q = 'Яг 1 компаний хувьцаа нь дампуурсан компанийх байх'; f = '\\dfrac{' + D + '\\cdot ' + p89_c(G, k - 1) + '}{' + p89_c(N, k) + '}'; num = z1; }
  else if (T <= 88 || k < 3) { q = 'Авсан хувьцаануудын аль нь ч дампуурсан компанийх биш байх'; f = '\\dfrac{' + p89_c(G, k) + '}{' + p89_c(N, k) + '}'; num = z0; }
  else { q = 'Ядаж 2 компаний хувьцаа нь дампуурсан компанийх байх'; f = '1-\\dfrac{' + p89_c(G, k) + '+' + D + '\\cdot ' + p89_c(G, k - 1) + '}{' + p89_c(N, k) + '}'; num = tot - z0 - z1; }
  if (num <= 0 || num >= tot) return null;
  return {
    q: 'Хөрөнгийн зах дээр хувьцаагаа гаргасан ' + N + ' компаний ' + D + ' нь дампуурав. Иргэн ' + k + ' өөр компаний хувьцаа авсан байжээ. ' + q + ' магадлалыг ол.',
    a: '$P=' + f + '=' + fr(num, tot) + '$',
    wk: 24,
    t: { N: N, D: D, k: k }
  };
}

// 90. Хүмүүсийн p% нь өвчтэй; шинжилгээ өвчгүй хүний s%-ийг, өвчтэй хүний e%-ийг зөв оношилдог.
//   Бүтэн магадлалын томьёо: P(онош зөв) = p·e + (1−p)·s (эх: 0.08·0.95 + 0.92·0.98 = 0.9776).
//   Хувилбар: P(онош буруу) = p(1−e) + (1−p)(1−s); P(өвчтэй гэж оношлогдох) = p·e + (1−p)(1−s);
//   Байес: P(өвчтэй | өвчтэй гэж оношлогдсон) = p·e / (p·e + (1−p)(1−s)) → хураасан бутархай ≈ 2 оронтой.
function p90_d(n) { return dec(n / 100); }   // 8 → 0.08
function p90() {
  var p = rnd(2, 20), s = rnd(85, 99), e = rnd(85, 99), kind = pick(['ok', 'ok', 'ok', 'ok', 'bad', 'pos', 'bayes', 'bayes']);
  var P = p90_d(p), Q = p90_d(100 - p), E = p90_d(e), E1 = p90_d(100 - e), S = p90_d(s), S1 = p90_d(100 - s);
  var ask, a, num, den;
  if (kind === 'ok') {
    num = p * e + (100 - p) * s;
    ask = 'Шинжилгээнд орсон хүмүүсээс санамсаргүй сонгосон хүний онош зөв байх магадлал аль вэ?';
    a = '$P=' + P + '\\cdot ' + E + '+' + Q + '\\cdot ' + S + '=' + dec(num / 10000) + '$';
  } else if (kind === 'bad') {
    num = p * (100 - e) + (100 - p) * (100 - s);
    ask = 'Шинжилгээнд орсон хүмүүсээс санамсаргүй сонгосон хүний онош буруу байх магадлал аль вэ?';
    a = '$P=' + P + '\\cdot ' + E1 + '+' + Q + '\\cdot ' + S1 + '=' + dec(num / 10000) + '$';
  } else if (kind === 'pos') {
    num = p * e + (100 - p) * (100 - s);
    ask = 'Шинжилгээнд орсон хүмүүсээс санамсаргүй сонгосон хүн чихрийн шижинтэй гэж оношлогдох магадлал аль вэ?';
    a = '$P=' + P + '\\cdot ' + E + '+' + Q + '\\cdot ' + S1 + '=' + dec(num / 10000) + '$';
  } else {
    num = p * e; den = p * e + (100 - p) * (100 - s);
    var g = gcd(num, den), n1 = num / g, d1 = den / g, v = n1 / d1, exact = Math.abs(v * 100 - Math.round(v * 100)) < 1e-12;
    if (d1 === 1) return null;
    ask = 'Шинжилгээгээр чихрийн шижинтэй гэж оношлогдсон хүн үнэхээр өвчтэй байх магадлал аль вэ?';
    a = '$P=\\dfrac{' + P + '\\cdot ' + E + '}{' + P + '\\cdot ' + E + '+' + Q + '\\cdot ' + S1 + '}=' + fr(n1, d1) + (exact ? '=' + dec(v, 2) : '\\approx ' + v.toFixed(2)) + '$';
  }
  var q = 'Хүмүүсийн $' + p + '\\%$ нь чихрийн шижинтэй гэсэн тооцоо гарчээ. Лабораторийн шинжилгээгээр чихрийн шижингүй хүмүүсийн $'
    + s + '\\%$, өвчтэй хүмүүсийн $' + e + '\\%$-ийг зөв оношилдог. ' + ask;
  return { q: q, a: a, wk: 26, t: { p: p, s: s, e: e, kind: kind } };
}

// 100. (2-р хэсэг) f(x) = x² + Bx + C (бүх x-д эерэг, орой x = −B/2 ≥ 1), x₀ дахь шүргэгч y = mx − b (m = 2x₀ + B ∈ {2, 3}, b > 0).
//   Шүргэгч Ox-ийг 0 < x_t = b/m < x₀ цэгт огтолно → дүрс: x ∈ [0; x₀], доороосоо Ox (x ≤ x_t) ба шүргэгчээр, дээрээсээ f-ээр:

function p100() {
  var m = pick([2, 2, 3]), x0 = rnd(2, 8), y0 = rnd(1, 8), B = m - 2 * x0, C = y0 - m * x0 + x0 * x0;

    '$f(x)$ функцийн ${x_0=' + x0 + '}$ абсцисстай $M$ цэгт татсан шүргэгч шулууны тэгшитгэл ${y=' + b('A', m) + 'x-' + b('B', bb) + '}$ байна.',
    '$f(x)$ функцийн график, шүргэгч шулуун болон координатын тэнхлэгүүдээр хашигдах дүрсийн талбай нь $\\dfrac{' + b('S', N) + '}{3}$ байна.',
    '$f(x)$ функцийн графикийг $M$ цэгт шүргэх, төв нь $Ox$ тэнхлэг дээр орших тойргийн тэгшитгэл ${(x-' + b('E', e) + ')^2+y^2=' + b('R', r2) + '}$ байна.'

  return { q: q, a: b.key(), wide: true, wk: 55, t: { B: B, C: C, x0: x0 } };
}
