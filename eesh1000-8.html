<script>
/* ЭЕШ 1000 2-4 — ЭЕШ-ийн 1000 бодлого, 2-р хэсэг (76–100-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 76. (a − √b·i)(a + √b·i) ± (c + di)·i = a² + b ∓ d ± c·i  (эх: (1−√2i)(1+√2i)+(1+3i)i = i).
//     30%-д эх шиг бодит хэсэг 0 (d = ±(a² + b)); хүчин зүйлсийн дараалал, i-ийн байрлал (урд/ард), тэмдэг санамсаргүй.
function p76_c(re, im) {
  var s = re !== 0 ? String(re) : '';
  if (im !== 0) { var ab = Math.abs(im), body = (ab === 1 ? '' : ab) + 'i'; s += im < 0 ? '-' + body : (s ? '+' : '') + body; }
  return s || '0';
}
function p76() {
  var a = rnd(1, 4), b = pick([2, 3, 5, 6, 7]), s = rnd(0, 3) ? 1 : -1, c = nz(-4, 5), d;
  if (rnd(1, 10) <= 3) { d = s * (a * a + b); if (Math.abs(d) > 12) return null; }
  else d = nz(-6, 6);
  var re = a * a + b - s * d, im = s * c;
  var f1 = '\\left(' + a + '-\\sqrt{' + b + '}i\\right)', f2 = '\\left(' + a + '+\\sqrt{' + b + '}i\\right)';
  var t2 = rnd(1, 5) === 1 ? 'i(' + p76_c(c, d) + ')' : '(' + p76_c(c, d) + ')i';
  // Бодолт: хосмог тоонуудын үржвэр (a − √b·i)(a + √b·i) = a² − (√b·i)² = a² + b;  (c + di)·i = ci + di² = −d + ci;  нэгтгэх
  var A2 = a * a + b, X = p76_c(-d, c);
  return {
    q: '$' + (rnd(0, 3) ? f1 + f2 : f2 + f1) + (s > 0 ? '+' : '-') + t2 + '$ илэрхийллийг хялбарчил.',
    a: '$' + p76_c(re, im) + '$',
    wk: 20,
    s: [
      'Хосмог тоонуудын үржвэрт квадратуудын ялгаврын томьёо ба $i^2=-1$-ийг хэрэглэвэл: $$' + f1 + f2 + '=' + (a === 1 ? '1' : a + '^2') + '-\\left(\\sqrt{' + b + '}i\\right)^2$$ $$='
        + a * a + '-' + b + 'i^2=' + a * a + '+' + b + '=' + A2 + '.$$',
      'Хоёр дахь гишүүнд мөн $i^2=-1$: $$' + t2 + '=' + tm(c, 'i', true) + tm(d, 'i^2') + '=' + X + '.$$',
      'Иймд илэрхийллийн утга $$' + A2 + (s > 0 ? '+' : '-') + '(' + X + ')=' + A2 + tm(-s * d, '') + tm(s * c, 'i') + '=' + p76_c(re, im) + '.$$'
    ],
    t: { a: a, b: b, c: c, d: d, s: s }
  };
}

// 77. Комплекс тоонуудын шугаман эвлүүлэг: p(a+bi) ± q(c+di) = (pa ± qc) + (pb ± qd)i  (эх: 2(1+i) − (1−i) = 1+3i).
function p77_c(re, im) {
  var s = re !== 0 ? String(re) : '';
  if (im !== 0) { var ab = Math.abs(im), body = (ab === 1 ? '' : ab) + 'i'; s += im < 0 ? '-' + body : (s ? '+' : '') + body; }
  return s || '0';
}
function p77() {
  var a = nz(-4, 4), b = nz(-4, 4), c = nz(-4, 4), d = nz(-4, 4), p = rnd(1, 3), q = rnd(1, 3), s = rnd(0, 2) ? -1 : 1;
  if (p === q) return null;
  var re = p * a + s * q * c, im = p * b + s * q * d;
  if ((re === 0 && im === 0) || Math.abs(re) > 12 || Math.abs(im) > 12) return null;
  var t1 = (p === 1 ? '' : p) + '(' + p77_c(a, b) + ')', t2 = (q === 1 ? '' : q) + '(' + p77_c(c, d) + ')';
  // Бодолт: хаалт задлаад бодит хэсгүүдийг, хуурмаг хэсгүүдийг тус тусад нь нэмнэ
  var opn = tm(p * a, '', true) + tm(p * b, 'i') + tm(s * q * c, '') + tm(s * q * d, 'i');
  return {
    q: '$' + t1 + (s < 0 ? '-' : '+') + t2 + '$ илэрхийллийг хялбарчлах.',
    a: '$' + p77_c(re, im) + '$',
    wk: 16,
    s: [
      'Хаалтыг задалъя: $$' + t1 + (s < 0 ? '-' : '+') + t2 + '=' + opn + '.$$',
      'Бодит хэсгүүдийг, хуурмаг хэсгүүдийг тус тусад нь нэмбэл: $$(' + p * a + sgn(s * q * c) + ')+(' + p * b + sgn(s * q * d) + ')i=' + p77_c(re, im) + '.$$'
    ],
    t: { p: p, q: s * q, z: [a, b], w: [c, d] }
  };
}

// 78. Комплекс тооны аргумент (гол утга −π < arg z ≤ π):  ±k ± ki → ±π/4, ±3π/4;  ±k√3 ± ki → ±π/6, ±5π/6;
//     ±k ± k√3 i → ±π/3, ±2π/3;  тэнхлэг дээрх k, −k, ki, −ki → 0, π, π/2, −π/2.  (эх: z = 1+i → π/4)
// k·(√3) хэсгийн TeX: p78_p(-2, true) → '-2\sqrt{3}', p78_p(1, false) → '1'
function p78_p(k, r3) { var a = Math.abs(k); return (k < 0 ? '-' : '') + (r3 ? (a === 1 ? '' : a) + '\\sqrt{3}' : String(a)); }
// Бодолт: x, y → |z| = √(x² + y²) → cos φ = x/|z|, sin φ = y/|z| → мөч ба хурц өнцөг α → гол утга (−π; π].
//   o: тэнхлэг дээр { j, m } эсвэл { fam, k, sx, sy };  ang — хариуны TeX, t = arg z / π.  sfig: комплекс хавтгай дээр z ба φ.
function p78_sol(o, ang, t) {
  var s = [], X, Y, xl, yl;
  if (o.j != null) {
    var m = o.m, j = o.j;
    X = [m, -m, 0, 0][j]; Y = [0, 0, m, -m][j];
    s.push('$z=x+yi$ хэлбэрт $x=' + X + '$, $y=' + Y + '$ тул $z$ цэг ' + ['бодит тэнхлэгийн эерэг', 'бодит тэнхлэгийн сөрөг', 'хуурмаг тэнхлэгийн эерэг',
      'хуурмаг тэнхлэгийн сөрөг'][j] + ' хагас дээр оршино (зураг), $|z|=' + m + '$.');
    s.push('Иймд $\\cos\\varphi=\\dfrac{x}{|z|}=' + [1, -1, 0, 0][j] + '$, $\\sin\\varphi=\\dfrac{y}{|z|}=' + [0, 0, 1, -1][j] + '$ ба гол утга $(-\\pi;\\,\\pi]$ завсарт тул $$\\arg z=' + ang + '.$$');
    xl = j < 2 ? String(X) : null; yl = j < 2 ? null : (Y < 0 ? '-' : '') + m;
  } else {
    var fam = o.fam, k = o.k, sx = o.sx, sy = o.sy, r3x = fam === 6, r3y = fam === 3, S3 = Math.sqrt(3);
    X = sx * k * (r3x ? S3 : 1); Y = sy * k * (r3y ? S3 : 1);
    var xT = p78_p(sx * k, r3x), yT = p78_p(sy * k, r3y), N2 = fam === 4 ? 2 * k * k : 4 * k * k, mod = fam === 4 ? rt(k, 2) : String(2 * k);
    var sq = function (T, neg, r3) { return r3 ? '\\left(' + T + '\\right)^2' : (neg ? '(' + T + ')' : T) + '^2'; };
    s.push('$z=x+yi$ хэлбэрт $x=' + xT + '$, $y=' + yT + '$. Модуль $|z|=\\sqrt{x^2+y^2}$: $$|z|=\\sqrt{' + sq(xT, sx < 0, r3x) + '+' + sq(yT, sy < 0, r3y) + '}=\\sqrt{' + N2 + '}'
      + (mod === '\\sqrt{' + N2 + '}' ? '' : '=' + mod) + '.$$');
    var cA = fam === 4 ? '\\dfrac{\\sqrt{2}}{2}' : fam === 6 ? '\\dfrac{\\sqrt{3}}{2}' : '\\dfrac{1}{2}', sA = fam === 4 ? cA : fam === 6 ? '\\dfrac{1}{2}' : '\\dfrac{\\sqrt{3}}{2}';
    var raw = fam === 4 || k > 1, al = '\\dfrac{\\pi}{' + fam + '}';
    s.push('$$\\cos\\varphi=\\dfrac{x}{|z|}=' + (raw ? '\\dfrac{' + xT + '}{' + mod + '}=' : '') + (sx < 0 ? '-' : '') + cA + ',$$ $$\\sin\\varphi=\\dfrac{y}{|z|}='
      + (raw ? '\\dfrac{' + yT + '}{' + mod + '}=' : '') + (sy < 0 ? '-' : '') + sA + '.$$');
    var qd = sx > 0 ? (sy > 0 ? 'I' : 'IV') : (sy > 0 ? 'II' : 'III');
    s.push('$\\cos\\varphi' + (sx > 0 ? '\\gt ' : '\\lt ') + '0$, $\\sin\\varphi' + (sy > 0 ? '\\gt ' : '\\lt ') + '0$ тул $z$ цэг ' + qd + ' мөчид оршино (зураг). $\\cos\\alpha=' + cA
      + '$ байх хурц өнцөг $\\alpha=' + al + '$.');
    s.push('Гол утга $-\\pi\\lt \\varphi\\le\\pi$ тул $$\\arg z=' + (qd === 'I' ? '\\alpha=' : qd === 'II' ? '\\pi-\\alpha=\\pi-' + al + '=' : qd === 'III'
      ? '-(\\pi-\\alpha)=-\\left(\\pi-' + al + '\\right)=' : '-\\alpha=') + ang + '.$$');
    xl = xT.replace('\\sqrt{3}', '√3'); yl = yT.replace('\\sqrt{3}', '√3');
  }
  return { s: s, fig: p78_fig(X, Y, t, xl, yl) };
}
// Комплекс хавтгай: тэнхлэг, z цэг рүү вектор, проекц (тасархай), x/y хуваарь, φ = arg z нум (сумтай)
function p78_fig(X, Y, t, xl, yl) {
  var M = Math.max(Math.abs(X), Math.abs(Y)), L = M * 1.32, R = Math.hypot(X, Y), K = '#5a32d6', f = Fig({ view: [-L, L, -L, L], w: 180 });
  // O-ийн бичиг вектор ба нумтай давхцахгүй мөчид: III мөч / сөрөг хуурмаг тэнхлэг → nw, сөрөг бодит тэнхлэг → se
  f.axes({ ext: 8, o: false }).text([0, 0], 'O', { pos: X < 0 && Y === 0 ? 'se' : Y < 0 && X <= 0 ? 'nw' : 'sw', size: 12, halo: true });
  if (X && Y) f.seg([X, 0], [X, Y], { dash: '3 3', w: 0.9, c: '#666' }).seg([0, Y], [X, Y], { dash: '3 3', w: 0.9, c: '#666' });
  if (xl != null) f.seg([X, -M * 0.04], [X, M * 0.04], { w: 1.1 }).text([X, 0], xl, { pos: Y < 0 ? 'n' : 's', size: 11, halo: true, off: 4 });
  if (yl != null) f.seg([-M * 0.04, Y], [M * 0.04, Y], { w: 1.1 }).text([0, Y], yl, { pos: X < 0 ? 'e' : 'w', size: 11, halo: true, off: 5 });
  var deg = t * 180, rr = R * 0.34;
  if (deg) {
    var e = deg * Math.PI / 180, e0 = (deg - (deg > 0 ? 14 : -14)) * Math.PI / 180, mid = deg / 2;
    f.arc([0, 0], rr, 0, deg, { c: K, w: 1.4 }).arrow([rr * Math.cos(e0), rr * Math.sin(e0)], [rr * Math.cos(e), rr * Math.sin(e)], { c: K, w: 1.4, h: 6 });
    if (Math.abs(Math.abs(mid) - 90) < 20) mid -= (mid > 0 ? 35 : -35);           // y тэнхлэгээс зайлуулна
    f.text([rr * 1.5 * Math.cos(mid * Math.PI / 180), rr * 1.5 * Math.sin(mid * Math.PI / 180)], 'φ', { size: 13, c: K });
  }
  f.arrow([0, 0], [X, Y], { w: 1.6 }).dot([X, Y], { r: 2.6 })
    .text([X, Y], 'z', { pos: X === 0 ? 'e' : Y === 0 ? 'n' : (Y > 0 ? 'n' : 's') + (X > 0 ? 'e' : 'w'), size: 13 });
  return f.svg();
}
function p78() {
  var T = rnd(1, 100), k = rnd(1, 3), sx = rnd(0, 1) ? 1 : -1, sy = rnd(0, 1) ? 1 : -1, z, n, d;   // arg = nπ/d
  if (T <= 15) {
    var j = rnd(0, 3), m = rnd(1, 6);
    z = [String(m), '-' + m, (m === 1 ? '' : m) + 'i', '-' + (m === 1 ? '' : m) + 'i'][j];
    n = [0, 1, 1, -1][j]; d = [1, 1, 2, 2][j];
  } else {
    var fam = T <= 50 ? 4 : T <= 75 ? 6 : 3, re, im;
    if (fam === 4) { k = rnd(1, 4); re = p78_p(sx * k, false); im = p78_p(k, false); }
    else if (fam === 6) { re = p78_p(sx * k, true); im = p78_p(k, false); }
    else { re = p78_p(sx * k, false); im = p78_p(k, true); }
    if (im === '1') im = '';
    z = re + (sy < 0 ? '-' : '+') + im + 'i';
    // I мөчийн өнцөг π/d; x < 0 бол π − π/d; y < 0 бол тэмдэг сөрөг
    n = sx > 0 ? 1 : fam - 1; d = fam;
    if (sy < 0) n = -n;
  }
  var g = gcd(Math.abs(n), d); if (n !== 0) { n /= g; d /= g; }
  var ang = n === 0 ? '0' : d === 1 ? (n < 0 ? '-' : '') + '\\pi' : (n < 0 ? '-' : '') + '\\dfrac{' + (Math.abs(n) === 1 ? '' : Math.abs(n)) + '\\pi}{' + d + '}';
  var sol = p78_sol(T <= 15 ? { j: j, m: m } : { fam: fam, k: k, sx: sx, sy: sy }, ang, n / d);
  return {
    q: '$z=' + z + '$ бол $\\arg z=?$',
    a: '$\\arg z=' + ang + '$',
    wk: 18,
    s: sol.s,
    sfig: sol.fig,
    t: { z: z, n: n, d: d }
  };
}

// 79. i-ийн зэрэг: i^m нь m mod 4-өөр 1, i, −1, −i; (−i)^m = (−1)^m·i^m.  p·b₁^m ± q·b₂^n (b ∈ {i, −i}, m, n — хоёр оронтой)
//     (эх: i^21 − 3(−i)^45 = i + 3i = 4i).  Хариу 0 биш.
function p79_c(re, im) {
  var s = re !== 0 ? String(re) : '';
  if (im !== 0) { var ab = Math.abs(im), body = (ab === 1 ? '' : ab) + 'i'; s += im < 0 ? '-' + body : (s ? '+' : '') + body; }
  return s || '0';
}
// (±i)^m → [re, im]
function p79_pw(neg, m) { var v = [[1, 0], [0, 1], [-1, 0], [0, -1]][m % 4], sg = neg && m % 2 ? -1 : 1; return [sg * v[0], sg * v[1]]; }
// Бодолтын мөр: (±i)^e = … = утга;  i^{4·Q+r} = i^r,  (−i)^e = ±i^e (e тэгш/сондгой)
function p79_pt(neg, e) {
  var r = e % 4, Q = (e - r) / 4, ex = 'i^{4\\cdot ' + Q + (r ? '+' + r : '') + '}', v = ['1', 'i', '-1', '-i'][r];
  if (!neg) return 'i^{' + e + '}=' + ex + '=' + v;
  if (e % 2 === 0) return '(-i)^{' + e + '}=i^{' + e + '}=' + ex + '=' + v;
  return '(-i)^{' + e + '}=-i^{' + e + '}=-' + ex + '=' + (v[0] === '-' ? '-(' + v + ')=' + v.slice(1) : '-' + v);
}
function p79() {
  var m = rnd(11, 99), n = rnd(11, 99), n1 = rnd(1, 3) === 1, n2 = rnd(1, 3) > 1, p = pick([1, 1, 1, 2, 3]), q = rnd(1, 5), s = rnd(0, 2) ? -1 : 1;
  if (m === n || (n1 === n2 && p === q)) return null;
  var A = p79_pw(n1, m), B = p79_pw(n2, n), re = p * A[0] + s * q * B[0], im = p * A[1] + s * q * B[1];
  if (re === 0 && im === 0) return null;
  var T = function (neg, e) { return (neg ? '(-i)' : 'i') + '^{' + e + '}'; };
  // Бодолт: i⁴ = 1 ⇒ i^{4k+r} = i^r;  (−i)^n = (−1)^n·i^n;  зэрэг бүрийг олоод орлуулна
  var qx = (p === 1 ? '' : p) + T(n1, m) + (s < 0 ? '-' : '+') + (q === 1 ? '' : q) + T(n2, n), vA = p79_c(A[0], A[1]), vB = p79_c(B[0], B[1]);
  var wrap = function (v) { return v[0] === '-' ? '(' + v + ')' : v; };
  var sub = (p === 1 ? vA : p + '\\cdot ' + wrap(vA)) + (s < 0 ? '-' : '+') + (q === 1 ? wrap(vB) : q + '\\cdot ' + wrap(vB));
  var opn = tm(p * A[0], '', true) + tm(p * A[1], 'i', !(p * A[0])) + tm(s * q * B[0], '') + tm(s * q * B[1], 'i'), res = p79_c(re, im);
  if ((A[0] !== 0) !== (B[0] !== 0)) opn = sub;            // нэг нь бодит, нөгөө нь хуурмаг — шууд эцсийн хэлбэр
  return {
    q: '$' + (p === 1 ? '' : p) + T(n1, m) + (s < 0 ? '-' : '+') + (q === 1 ? '' : q) + T(n2, n) + '$ илэрхийллийг хялбарчил.',
    a: '$' + p79_c(re, im) + '$',
    wk: 20,
    s: [
      '$i^2=-1$, $i^3=-i$, $i^4=1$ тул $i$-ийн зэрэг $4$ тутамд давтагдана: $i^{4k+r}=i^r$. Мөн $(-i)^n=(-1)^n\\cdot i^n$.',
      'Илтгэгчийг $4$-т хуваасан үлдэгдлээр: $$' + p79_pt(n1, m) + ',$$ $$' + p79_pt(n2, n) + '.$$',
      'Иймд $$' + qx + '=' + sub + (opn === sub ? '' : '=' + opn) + (res === opn ? '' : '=' + res) + '.$$'
    ],
    t: { m: m, n: n, n1: n1, n2: n2, p: p, q: s * q }
  };
}

// 80. Комплекс шугаман тэгшитгэл: α ± k(z + β) = γ  ⇒  z = (γ − α)/(±k) − β  (эх: i − 3(z − i + 1) = 5 ⇒ z = −8/3 + 4/3·i).
//     α, β, γ — бүхэл бодит/хуурмаг хэсэгтэй; k = 2..5; ихэнхдээ бутархай хариу (эх шиг).
function p80_c(re, im) {
  var s = re !== 0 ? String(re) : '';
  if (im !== 0) { var ab = Math.abs(im), body = (ab === 1 ? '' : ab) + 'i'; s += im < 0 ? '-' + body : (s ? '+' : '') + body; }
  return s || '0';
}
// бутархай хэсэгтэй комплекс тоо: rn/rd + (jn/jd)i
function p80_cf(rn, rd, jn, jd) {
  var re = rn === 0 ? '' : fr(rn, rd), im = '';
  if (jn !== 0) {
    if (jd < 0) { jn = -jn; jd = -jd; }
    var g = gcd(jn, jd), n = Math.abs(jn) / g, d = jd / g;
    im = (jn < 0 ? '-' : re ? '+' : '') + (d === 1 ? (n === 1 ? '' : n) : '\\dfrac{' + n + '}{' + d + '}') + 'i';
  }
  return re + im || '0';
}
function p80() {
  var T = rnd(1, 10), al = T <= 4 ? [0, nz(-3, 3)] : T <= 7 ? [nz(-5, 5), 0] : [nz(-4, 4), nz(-3, 3)];
  var be = [nz(-4, 4), nz(-3, 3)], ga = rnd(0, 1) ? [nz(-6, 8), 0] : [nz(-5, 6), nz(-4, 4)], k = rnd(2, 5), s = rnd(1, 10) <= 7 ? -1 : 1;
  var rn = ga[0] - al[0] - s * k * be[0], jn = ga[1] - al[1] - s * k * be[1], d = s * k;     // z = (rn + jn·i)/d
  if (rn === 0 && jn === 0) return null;
  var whole = rn % k === 0 && jn % k === 0;
  if (whole && rnd(1, 10) <= 7) return null;                                             // ихэнхдээ бутархай
  var iFirst = rnd(0, 1) === 1, bi = (be[1] < 0 ? '-' : '+') + (Math.abs(be[1]) === 1 ? '' : Math.abs(be[1])) + 'i', br = sgn(be[0]);
  var lhs = p80_c(al[0], al[1]) + (s < 0 ? '-' : '+') + k + '(z' + (iFirst ? bi + br : br + bi) + ')';

// 84. Факториалтай илэрхийлэл: ((n+a)! ± k·(n+b)!)/(n+c)!,  c ≤ b < a,  a − c ≤ 2.
//     (n+a)!/(n+c)! = ∏_{j=c+1..a}(n+j),  (n+b)!/(n+c)! = ∏_{j=c+1..b}(n+j)  ⇒ олон гишүүнт (зэрэг ≤ 2).

  var inF = !lin ? '\\,\\big(' + br + '\\big)' : '\\cdot ' + (IN[1] === 0 ? 'n' : '(' + inP + ')');
  var sol = ['Факториалын $m!=m\\cdot(m-1)!$ чанараар $$' + Fa + '=' + fac.join('\\cdot ') + '\\cdot ' + Fb + '.$$',
    'Хүртвэрээс $' + Fb + '$-ыг хаалтны гадна гаргая: $$' + num + '=' + Fb + (lin && br !== inP ? '\\,\\big(' + br + '\\big)=' + Fb : '') + inF + '.$$'];

// 85. n сурагч дараалан зогсох: X нь Y-ээс урд → n!/2 (тэгш хэм);  X, Y зэрэгцэж → 2·(n−1)!;
//     зэрэгцээгүй → n! − 2·(n−1)! = (n−2)·(n−1)!   (эх: 20 сурагч, Болд Тулгаас урд → 20!/2).  n ≤ 8 бол тоон утгыг нэмж бичнэ.
var p85_N = [   // [нэр, -аас, -тай]

  ['Ганаа', 'Ганаагаас', 'Ганаатай'], ['Сараа', 'Сараагаас', 'Сараатай'], ['Анар', 'Анараас', 'Анартай'], ['Цэцэг', 'Цэцэгээс', 'Цэцэгтэй'],

  else if (T <= 75) { q = X[0] + ' ' + Y[2] + ' зэрэгцэж зогссон байх'; a = '2\\cdot ' + (n - 1) + '!' + (n <= 8 ? '=' + 2 * p85_f(n - 1) : ''); }
  else { q = X[0] + ' ' + Y[2] + ' зэрэгцэж зогсоогүй байх'; a = n + '!-2\\cdot ' + (n - 1) + '!=' + (n - 2) + '\\cdot ' + (n - 1) + '!' + (n <= 8 ? '=' + (n - 2) * p85_f(n - 1) : ''); }
  // Бодолт: нийт n! сэлгэлт. «Урд» — X, Y-ийн байрыг солих нь «урд» ↔ «хойно» харгалзаа ⇒ тал нь.
  //   «Зэрэгцэж» — хоёрыг нэг элемент гэж (n−1)!, дотроо 2! ⇒ 2·(n−1)!.  «Зэрэгцээгүй» — эсрэг үзэгдэл: n! − 2·(n−1)! = (n−2)·(n−1)!.
  var m1 = n - 1, pair = X[0] + ', ' + Y[0] + ' хоёрыг нэг элемент гэж үзвэл бусад $' + (n - 2) + '$ сурагчтай нийт $' + m1 + '$ элементийг $' + m1 + '!$ янзаар дараалуулна.', sol;
  if (T <= 50) sol = [
    'Нийт $' + n + '$ сурагчийг дараалуулах боломжийн тоо (сэлгэлт) $' + n + '!$.',

    'Үржвэрийн зарчмаар $$2\\cdot ' + m1 + '!' + (n <= 8 ? '=2\\cdot ' + p85_f(m1) + '=' + 2 * p85_f(m1) : '') + '.$$'

// 86. Дэд олонлогийн тоо.  Эх: 2n+1 элементтэй олонлогийн n-ээс олон элементтэй дэд олонлог → 2^{2n} = 4^n (тэгш хэм: k ↔ m−k).
//     Хувилбарууд: эх (тэмдэгтээр); m = 2t+1 (5…11): t-ээс олон / (t+1)-ээс цөөн → 2^{m−1};  яг k → C_m^k;

function p86() {

      s: ['Олонлогоо $M$ гэе: $|M|=2n+1$. Бүх дэд олонлогийн тоо $2^{2n+1}$.',
        '$B\\subset M$ бүрийг $M\\setminus B$-тэй хослуулъя: $|B|+|M\\setminus B|=2n+1$ тул $|B|\\ge n+1$ бол $|M\\setminus B|\\le n$, мөн эсрэгээр. '
          + 'Иймд хос бүрийн яг нэг нь $n$-ээс олон элементтэй.',
        'Иймд хайж буй тоо бүх дэд олонлогийн тал нь: $$\\dfrac{2^{2n+1}}{2}=2^{2n}=4^n.$$'],
      t: { m: 0 } };
  }
  if (T <= 45) {
    var t = rnd(2, 5); m = 2 * t + 1;
    q = rnd(0, 3) ? sfx(t, 'аас') + ' олон' : sfx(t + 1, 'аас') + ' цөөн';
    a = '2^{' + (m - 1) + '}=' + Math.pow(2, m - 1);
  } else if (T <= 70) {
    m = rnd(5, 12); var k = rnd(2, m - 2);

  } else if (T <= 85) {

  } else {
    m = rnd(5, 10); var k3 = rnd(m - 4, m - 2);
    if (m % 2 === 1 && k3 === (m - 1) / 2) return null;
    q = sfx(k3, 'аас') + ' олон'; a = p86_sum(m, k3 + 1);

  // Бодолт: тэгш хэм — B ↔ M∖B хослол (|B| + |M∖B| = m сондгой) ⇒ 2^m-ийн тал;  яг k — хэсэглэл C_m^k = m!/(k!(m−k)!);
  //   «цөөнгүй/олон» — нэмэхийн зарчмаар C_m^j-ийн нийлбэр, C_m^j = C_m^{m−j} чанараар бодно.

    for (i = 0; i < jj; i++) { nu.push(m - i); de.push(i + 1); }
    var h = 'C_{' + m + '}^{' + jv + '}';

        + (olon ? '$' + t + '$-' + suf(t, 'аас') + ' олон' : '$' + (t + 1) + '$-' + suf(t + 1, 'аас') + ' цөөн') + ' элементтэй.',
      'Иймд хайж буй тоо бүх дэд олонлогийн тал нь: $$\\dfrac{2^{' + m + '}}{2}=2^{' + (m - 1) + '}=' + Math.pow(2, m - 1) + '.$$'];

  } else {

    var rows = big.map(function (jv) { return cv(jv, true); });
    if (sm.length) rows.push(sm.map(function (jv, i) { return cv(jv, i === 0); }).join(',\\quad '));
    sol = ['«$' + (T <= 85 ? k2 : k3) + '$-' + suf(T <= 85 ? k2 : k3, 'аас') + ' ' + (T <= 85 ? 'цөөнгүй' : 'олон') + '» гэдэг нь ' + sz.slice(0, -1).join(', ') + ' эсвэл ' + sz[sz.length - 1]

// 87. Нийцгүй (үл нийцэх) үзэгдэл: K хүүхэд (3 эсвэл 4) сонгоход үр дүнг хүүгийн тоо b ∈ {0..K}-оор илэрхийлнэ (охин = K − b).
//     Суурь үзэгдэл ба I–IV үзэгдэл нь b-ийн олонлог; нийцгүй ⇔ огтлолцол хоосон. Нийцгүй нь 1–3 ширхэг.
//     (эх: K = 3, «Ядаж хоёр нь охин байх»; I. Яг нэг нь хүү, II. Ядаж нэг нь хүү, III. Ядаж хоёр нь хүү, IV. Гурвуул хүү → III ба IV)
var p87_W = { 1: 'нэг', 2: 'хоёр', 3: 'гурав', 4: 'дөрөв' }, p87_RM = ['I', 'II', 'III', 'IV'];
// үзэгдлүүдийн сан: [бичиг, b → bool]

// 88. Чанар шалгагч машины 2×2 хүснэгт: гэмтэлтэй/гэмтэлгүй бараа × «гэмтэлтэй гэж оношлогдсон»/«өнгөрүүлсэн».

  else if (T <= 55) { q = 'Эдгээрээс санамсаргүй сонгосон бараа гэмтэлтэй байх магадлалыг ол.'; n = TP + FN; d = N; }
  else if (T <= 70) { q = 'Эдгээрээс санамсаргүй сонгосон барааг машин зөв оношилсон байх магадлалыг ол.'; n = TP + TN; d = N; }
  else if (T <= 85) { q = 'Гэмтэлтэй гэж оношлогдсон бараанаас санамсаргүй сонгосон бараа үнэхээр гэмтэлтэй байх магадлалыг ол.'; n = TP; d = TP + FP; }

// 89. Гипергеометр магадлал: N компаниас D нь дампуурсан, k өөр компаний хувьцаа авсан.
//     Ядаж 1: 1 − C_{N−D}^k / C_N^k (эх: N = 20, D = 4, k = 3 → 29/57);  яг 1: D·C_{N−D}^{k−1} / C_N^k;
//     ядаж 2: 1 − (C_{N−D}^k + D·C_{N−D}^{k−1}) / C_N^k;  аль нь ч биш: C_{N−D}^k / C_N^k.

  else { q = 'Ядаж 2 компаний хувьцаа нь дампуурсан компанийх байх'; f = '1-\\dfrac{' + p89_c(G, k) + '+' + D + '\\cdot ' + p89_c(G, k - 1) + '}{' + p89_c(N, k) + '}'; num = tot - z0 - z1; }
  if (num <= 0 || num >= tot) return null;
  // Бодолт: нийт боломж C_N^k; «аль нь ч биш» — бүгдийг G = N − D сайн компаниас: C_G^k; «яг 1» — D·C_G^{k−1};

  var cv = function (n, kk) {   // C_n^k = n(n−1)…/1·2·… = утга (kk ≥ 2)

    + ' сонгоно: $$' + D + '\\cdot ' + p89_c(G, k - 1) + '=' + (k > 2 ? D + '\\cdot ' + cv(G, k - 1).replace(/^C_\{\d+\}\^\{\d+\}=/, '').replace(/=(\d+)$/, '=' + D + '\\cdot $1') + '=' : '') + z1 + '.$$';

  if (T <= 50) sol.push(s0, 'Эсрэг үзэгдлийн магадлалаар $$P=1-\\dfrac{' + z0 + '}{' + tot + '}=' + frs2(num, tot) + '.$$');

// 90. Хүмүүсийн p% нь өвчтэй; шинжилгээ өвчгүй хүний s%-ийг, өвчтэй хүний e%-ийг зөв оношилдог.
//   Бүтэн магадлалын томьёо: P(онош зөв) = p·e + (1−p)·s (эх: 0.08·0.95 + 0.92·0.98 = 0.9776).
//   Хувилбар: P(онош буруу) = p(1−e) + (1−p)(1−s); P(өвчтэй гэж оношлогдох) = p·e + (1−p)(1−s);

    a = '$P=' + P + '\\cdot ' + E + '+' + Q + '\\cdot ' + S + '=' + dec(num / 10000) + '$';
  } else if (kind === 'bad') {
    num = p * (100 - e) + (100 - p) * (100 - s);
    ask = 'Шинжилгээнд орсон хүмүүсээс санамсаргүй сонгосон хүний онош буруу байх магадлал аль вэ?';
    a = '$P=' + P + '\\cdot ' + E1 + '+' + Q + '\\cdot ' + S1 + '=' + dec(num / 10000) + '$';
  } else if (kind === 'pos') {
    num = p * e + (100 - p) * (100 - s);
    ask = 'Шинжилгээнд орсон хүмүүсээс санамсаргүй сонгосон хүн чихрийн шижинтэй гэж оношлогдох магадлал аль вэ?';

    a = '$P=\\dfrac{' + P + '\\cdot ' + E + '}{' + P + '\\cdot ' + E + '+' + Q + '\\cdot ' + S1 + '}=' + fr(n1, d1) + (exact ? '=' + dec(v, 2) : '\\approx ' + v.toFixed(2)) + '$';
  }
  var q = 'Хүмүүсийн $' + p + '\\%$ нь чихрийн шижинтэй гэсэн тооцоо гарчээ. Лабораторийн шинжилгээгээр чихрийн шижингүй хүмүүсийн $'
    + s + '\\%$, өвчтэй хүмүүсийн $' + e + '\\%$-ийг зөв оношилдог. ' + ask;
  // Бодолт: H₁ — өвчтэй, H₂ — эрүүл (таамаглал); A-ийн нөхцөлт магадлал → бүтэн магадлалын томьёо; bayes — Байесын томьёо.

  else {

    sol.push('Байесын томьёогоор $$P(H_1|A)=\\dfrac{P(H_1)P(A|H_1)}{P(A)}=\\dfrac{' + D4(t1) + '}{' + D4(t1 + t2) + '}$$ $$=' + fr(n1, d1) + (exact ? '=' + dec(v, 2) : '\\approx ' + v.toFixed(2)) + '.$$');
  }

// 100. (2-р хэсэг) f(x) = x² + Bx + C (бүх x-д эерэг, орой x = −B/2 ≥ 1), x₀ дахь шүргэгч y = mx − b (m = 2x₀ + B ∈ {2, 3}, b > 0).
