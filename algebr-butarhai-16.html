<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Алгебрын бутархай хураах — заавартай</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .guide{background:#f6f2ff;border:1px solid #e2d6ff;border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .gtext{flex:1;min-width:250px;font-size:12px}.gtext h3{font-size:13px;color:#5a32d6;margin-bottom:6px}
  .gtext ol{margin:0 0 0 18px}.gtext li{margin:3px 0}
  .exwrap{background:#fff;border:1px dashed #d8ccff;border-radius:8px;padding:8px 12px;font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:8px 4px 9px;border-bottom:1px dashed #efeaff}
  .qh{display:flex;gap:8px;align-items:center}.qn{font-weight:800;color:var(--purple);min-width:24px}.qm{font-size:15px}
  .bl{margin:12px 0 2px 30px;border-bottom:1.4px solid #b9accf;height:1.05em}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:center}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function gcd(x,y){x=Math.abs(x);y=Math.abs(y);while(y){var t=y;y=x%y;x=t;}return x||1;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function bx(e){return e===0?'':(e===1?'x':'x^{'+e+'}');}          // x-ийн зэрэг
function sterm(c,e,first){var s=first?(c<0?'-':''):(c<0?' - ':' + ');var m=Math.abs(c),b=bx(e),cp=(m===1&&e!==0)?'':m;return s+cp+b;}
function mono(c,e){if(e===0)return ''+c;var b=bx(e);if(c===1)return b;if(c===-1)return '-'+b;return c+b;}

var FORMS=[
  function(){ // нэг гишүүнт: c1x^p / c2x^q
    var c1=rnd(2,12),c2=rnd(2,12),p=rnd(2,5),q=rnd(1,p-1),g=gcd(c1,c2),r1=c1/g,r2=c2/g,e=p-q;
    var qq='\\dfrac{'+c1+'x^{'+p+'}}{'+c2+'x^{'+q+'}}';
    var numA=mono(r1,e), ans=(r2===1?numA:'\\dfrac{'+numA+'}{'+r2+'}');
    return {q:qq,a:ans};
  },
  function(){ // нийтлэг үржигдэхүүн хураах
    var fc=rnd(2,6),fp=rnd(0,1),a=rnd(1,6),b=rnd(1,9);
    var inner=sterm(a,1,true)+sterm(b,0,false);
    var den=(fp===1?mono(fc,1):''+fc);
    var num=sterm(fc*a,1+fp,true)+sterm(fc*b,fp,false);
    return {q:'\\dfrac{'+num+'}{'+den+'}',a:inner};
  },
  function(){ // квадратуудын ялгавар
    var n=rnd(2,9),minus=rnd(0,1)===0;
    var den='x'+(minus?' - ':' + ')+n, ans='x'+(minus?' + ':' - ')+n;
    return {q:'\\dfrac{x^{2} - '+(n*n)+'}{'+den+'}',a:ans};
  },
  function(){ // (x²−n²)/(x²+nx) = (x−n)/x
    var n=rnd(2,9);
    return {q:'\\dfrac{x^{2} - '+(n*n)+'}{x^{2} + '+n+'x}',a:'\\dfrac{x - '+n+'}{x}'};
  }
];

function build(){
  var N=16, order=[]; for(var i=0;i<N;i++)order.push(i%FORMS.length);
  for(var s=order.length-1;s>0;s--){var j=rnd(0,s);var t=order[s];order[s]=order[j];order[j]=t;}
  var probs='',answs='',ITEMS=[];
  order.forEach(function(fi,idx){
    var it=FORMS[fi](); var n=idx+1;
    probs+='<div class="q"><div class="qh"><span class="qn">'+n+'.</span><span class="qm">$'+it.q+'=$</span></div><div class="bl"></div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>$'+it.a+'$</span></div>';
    ITEMS.push({q:it.q+'=',a:it.a});
  });
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Алгебрын бутархайг хураах</h1><div class="sub">Хүртвэр, хуваарийг задалж нийтлэг үржигдэхүүнийг хураа · 16 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="guide">'
    + '<div class="gtext"><h3>📋 Алхмууд</h3><ol>'
    +   '<li>Хүртвэр ба хуваарийг <b>үржигдэхүүнд задал</b>.</li>'
    +   '<li><b>Нийтлэг үржигдэхүүнийг хорого</b> (хураа).</li>'
    +   '<li>Дүрмүүд: $\\dfrac{x^{m}}{x^{n}}=x^{m-n}$, &nbsp; $x^{2}-a^{2}=(x-a)(x+a)$, &nbsp; $\\dfrac{a\\,c}{b\\,c}=\\dfrac{a}{b}$.</li>'
    + '</ol></div>'
    + '<div class="exwrap"><b>Жишээ:</b>'
    +   '<div>$\\dfrac{x^{2}-9}{x+3}=\\dfrac{(x-3)(x+3)}{x+3}=x-3$</div>'
    +   '<div style="margin-top:4px">$\\dfrac{6x^{3}}{9x}=\\dfrac{2x^{2}}{3}$</div>'
    + '</div>'
    +'</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=ITEMS; window.WS_TITLE='Алгебрын бутархайг хураах';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=25"></script>
</body>
</html>
