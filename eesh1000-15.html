<script>
/* ЭЕШ 1000 4-3 — ЭЕШ-ийн 1000 бодлого, 4-р хэсэг (55–80-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 55. Тойрогт багтсан ABCD: хөвч (зэргэлдээ хоёр оройн хэрчим) ба түүнд тулсан багтсан өнцөг (нөгөө оройноос) өгөгдөнө.
//     Синусын теорем: R = (хөвч)/(2·sin θ), θ ∈ {30°, 45°, 60°} ⇒ хөвч = p√q үед R = p√(q·k)/k (2 sin θ = √k) — хялбарчилсан.
var p55_O = [['CD', 'CAD'], ['CD', 'CBD'], ['AB', 'ACB'], ['AB', 'ADB'], ['BC', 'BAC'], ['BC', 'BDC'], ['AD', 'ABD'], ['AD', 'ACD']];
function p55() {
  var o = rnd(1, 4) === 1 ? p55_O[0] : pick(p55_O), th = pick([30, 45, 45, 60, 60]), k = { 30: 1, 45: 2, 60: 3 }[th];
  var qq = pick([1, 1, 2, 2, 3, 3, 6]), pp = rnd(1, 6);
  if (pp === 1 && qq === 1 && rnd(0, 1)) return null;
  var S = surd(qq * k), nn = pp * S.k, g = gcd(nn, k), num = nn / g, den = k / g;      // R = p√q/√k = p√(qk)/k
  var val = den === 1 ? rt(num, S.r) : '\\dfrac{' + rt(num, S.r) + '}{' + den + '}';
  // Бодолт: өнцгийн орой ба хөвчийн төгсгөлүүдээс тогтох гурвалжинд тойрог мөн багтаасан тойрог → синусын теорем R = хөвч/(2 sin θ); рационалчилна
  var tri = o[1].split('').sort().join(''), sd = rt(pp, qq), sinT = { 30: '\\dfrac{1}{2}', 45: '\\dfrac{\\sqrt{2}}{2}', 60: '\\dfrac{\\sqrt{3}}{2}' }[th];
  var ch = k === 1 ? 'R=' + o[0] + '=' + sd : 'R=\\dfrac{' + sd + '}{\\sqrt{' + k + '}}' + (S.r > 1 && g > 1 ? '=\\dfrac{' + rt(nn, S.r) + '}{' + k + '}' : '') + '=' + val;
  return {
    q: 'Тойрогт багтсан $ABCD$ дөрвөн өнцөгтийн $' + o[0] + '=' + rt(pp, qq) + '$ ба $\\angle ' + o[1] + '=' + th + '^\\circ$ бол багтаасан тойргийн радиусыг олоорой.',
    a: '$R=' + val + '$',
    wk: 22,
    s: [
      '$' + tri + '$ гурвалжны гурван орой тойрог дээр байрлах тул энэ тойрог нь $' + tri + '$ гурвалжны багтаасан тойрог. Энэ гурвалжинд $' + o[0] + '$ тал нь $' + o[1].charAt(1)
        + '$ оройн эсрэг орших тал.',
      'Синусын теоремоор $$\\dfrac{' + o[0] + '}{\\sin\\angle ' + o[1] + '}=2R\\ \\Rightarrow\\ R=\\dfrac{' + o[0] + '}{2\\sin\\angle ' + o[1] + '}.$$',
      '$2\\sin ' + th + '^\\circ=2\\cdot ' + sinT + '=' + (k === 1 ? '1' : '\\sqrt{' + k + '}') + '$ тул $$' + ch + '.$$'
    ],
    t: { o: o, th: th, pp: pp, qq: qq }
  };
}

// 56. Тэнцүү харьцаа: a/p = b/q = c/r = k ⇒ a = pk, b = qk, c = rk  (эсвэл p/a = q/b = r/c = k ⇒ a = p/k, …).
//     a, b, c-ийн тэмдгийн нөхцөл (сөрөг/эерэг) ба хуваарийн тэмдгээс k-ийн тэмдэг гарна:
//     k > 0 бол a, b, c нь p, q, r-тэй ижил эрэмбэтэй, k < 0 бол эсрэг эрэмбэтэй.
//     Хуваарийн модулиуд ялгаатай (2..9), бүгд нэг тэмдэгтэй (эсрэг тэмдэгтэй бол a, b, c нэг тэмдэгтэй байж чадахгүй).
function p56() {
  var M = shuffle([2, 3, 4, 5, 6, 7, 8, 9]).slice(0, 3), sd = rnd(1, 10) <= 7 ? -1 : 1, neg = rnd(1, 10) <= 7, inv = rnd(1, 10) <= 3;
  var P = M.map(function (m) { return sd * m; }), N = ['a', 'b', 'c'];
  var k = (neg ? -1 : 1) * sd;                       // a = p·k (эсвэл p/k) нь нөхцөлийн тэмдэгтэй байх k-ийн тэмдэг
  var V = P.map(function (p) { return inv ? p / k : p * k; });
  var ord = [0, 1, 2].sort(function (i, j) { return V[i] - V[j]; });
  var eq = P.map(function (p, i) { return inv ? '\\frac{' + p + '}{' + N[i] + '}' : '\\frac{' + N[i] + '}{' + p + '}'; }).join('=');
  // Бодолт: тэнцүү харьцааг k гэвэл a = pk (эсвэл p/k); a-гийн тэмдгээс k-ийн тэмдэг → эрэмбэ хадгалагдах/солигдох
  var EX = P.map(function (p) { return inv ? (p < 0 ? '-' : '') + '\\dfrac{' + Math.abs(p) + '}{k}' : tm(p, 'k', true); });
  return {
    q: '$' + eq + '$ байх ' + (neg ? 'сөрөг' : 'эерэг') + ' бодит $a,b,c$ тоонуудыг өсөх эрэмбээр бичээрэй.',
    a: '$' + ord.map(function (i) { return N[i]; }).join('\\lt ') + '$',
    wk: 18,
    s: [
      'Тэнцүү харьцааг $k$ гэж тэмдэглэе: $$a=' + EX[0] + ',\\quad b=' + EX[1] + ',\\quad c=' + EX[2] + '.$$',
      '$a$ ' + (neg ? 'сөрөг' : 'эерэг') + ' тул $' + EX[0] + (neg ? '\\lt 0' : '\\gt 0') + '$, өөрөөр хэлбэл $k' + (k > 0 ? '\\gt 0' : '\\lt 0') + '$.',
      '$k' + (k > 0 ? '\\gt 0' : '\\lt 0') + '$ үед $$' + ord.map(function (i) { return EX[i]; }).join('\\lt ') + '$$ $$\\Rightarrow\\ '
        + ord.map(function (i) { return N[i]; }).join('\\lt ') + '.$$'
    ],
    t: { P: P, neg: neg, inv: inv }
  };
}

// 57. Натурал a, b, c-ийн хувьд нэг хувьсагч хоёр тэгшитгэлд хоёуланд нь орно: uv = P, uw = Q.
//     u нь P ба Q-ийн нийтлэг хуваагч; ХИЕХ(P, Q) = 1 тул u = 1 ⇒ v = P, w = Q ⇒ x² − (P + Q)x + PQ.
//     Нийтлэг хувьсагч a (эх шиг), b эсвэл c байж болно; язгуур нь нөгөө хоёр хувьсагч.
function p57() {
  var P = rnd(2, 12), Q = rnd(2, 12);
  if (P === Q || gcd(P, Q) !== 1) return null;
  var com = pick(['a', 'a', 'a', 'b', 'c']), oth = ['a', 'b', 'c'].filter(function (v) { return v !== com; });
  var pr = function (u, v) { return u < v ? u + v : v + u; };
  // Бодолт: нийтлэг хувьсагч P, Q-г хоёуланг нь хуваана; P, Q харилцан анхны ⇒ тэр нь 1 ⇒ бусад хоёр нь P, Q ⇒ Виетийн теорем
  return {
    q: '$a,b,c\\in\\mathbb{N}$ тоонуудын хувьд $\\begin{cases}' + pr(com, oth[0]) + '=' + P + '\\\\' + pr(com, oth[1]) + '=' + Q + '\\end{cases}$ байх $'
      + oth[0] + ',' + oth[1] + '$ язгууруудтай квадрат гурван гишүүнтийг бичээрэй.',
    a: '$' + poly([1, -(P + Q), P * Q]) + '$',
    wk: 22,
    s: [
      '$' + pr(com, oth[0]) + '=' + P + '$ ба $' + pr(com, oth[1]) + '=' + Q + '$ тул натурал $' + com + '$ тоо нь $' + P + '$ ба $' + Q + '$-' + suf(Q, 'ын')
        + ' нийтлэг хуваагч болно.',
      '$' + P + '$ ба $' + Q + '$ харилцан анхны тоонууд (нийтлэг натурал хуваагч нь зөвхөн $1$) тул $' + com + '=1$. Иймд $$' + oth[0] + '=' + P + ',\\qquad '
        + oth[1] + '=' + Q + '.$$',
      'Язгуурууд нь $' + P + '$ ба $' + Q + '$ тул Виетийн теоремоор (тэргүүлэх коэффициент $1$): $$x^2-(' + P + '+' + Q + ')x+' + P + '\\cdot ' + Q + '='
        + poly([1, -(P + Q), P * Q]) + '.$$'
    ],
    t: { P: P, Q: Q, com: com }
  };
}

// 58. Коллинеар векторууд: координат бүр тэгээс ялгаатай тул a ∥ b ⇔ a = λb (λ ≠ 0).
//     Хоёулаа мэдэгдэх координатын хосоос λ-г олж, x = λ·b_i, y = a_j/λ.  Урвуугаар: w (тэггүй бүхэл), a = m·w, b = n·w.
//     x нь a-ийн i-р, y нь b-ийн j-р координат (i ≠ j); асуулт: xy (эх шиг) эсвэл x + y.
function p58() {
  var w = [nz(-4, 4), nz(-4, 4), nz(-4, 4)], m = nz(-3, 3), n = nz(-3, 3);
  if (m === n || gcd(m, n) !== 1) return null;
  var A = w.map(function (v) { return m * v; }), B = w.map(function (v) { return n * v; });
  var i = rnd(0, 2), j = rnd(0, 2);
  if (i === j) return null;
  var x = A[i], y = B[j];
  if (Math.abs(x) === 1 && Math.abs(y) === 1) return null;
  var sum = rnd(1, 10) <= 3;
  var vec = function (V, k, nm) { return '(' + V.map(function (v, t) { return t === k ? nm : String(v); }).join(',\\,') + ')'; };
  // Бодолт: a = λb — координат бүрээр систем; хоёулаа мэдэгдэх k-р координатаас λ = m/n, дараа нь x = λ·b_i, a_j = λ·y
  var k = 3 - i - j, lam = fr(m, n), neg = m * n < 0, lamP = Math.abs(n) === 1 ? par(m * n) : neg ? '\\left(' + lam + '\\right)' : lam;
  var lamY = Math.abs(n) === 1 ? tm(m * n, 'y', true) : (neg ? '-' : '') + '\\dfrac{' + Math.abs(m) + '}{' + Math.abs(n) + '}y';
  var cL = function (c) { return tm(c, '\\lambda', true); };
  var rows = [0, 1, 2].map(function (t) { return (t === i ? 'x' : String(A[t])) + '=' + (t === j ? '\\lambda y' : cL(B[t])); });
  var ORD = ['Эхний', 'Хоёр дахь', 'Гурав дахь'];
  return {
    q: '$\\vec a=' + vec(A, i, 'x') + '$; $\\vec b=' + vec(B, j, 'y') + '$ векторууд коллинеар байх <span class="nw">$x,y$-ийн</span> ' + (sum ? 'нийлбэрийг' : 'үржвэрийг') + ' олоорой.',
    a: '$x=' + x + ',\\ y=' + y + '$; $' + (sum ? 'x+y=' + (x + y) : 'xy=' + x * y) + '$',
    wk: 22,
    s: [
      'Коллинеар векторуудын хувьд $\\vec a=\\lambda\\vec b$ ($\\lambda\\ne 0$). Координат бүрээр: $$\\begin{cases}' + rows.join('\\\\') + '\\end{cases}$$',
      ORD[k] + ' тэгшитгэлээс ' + (B[k] === 1 ? '$\\lambda=' + lam + '$.' : '$' + A[k] + '=' + cL(B[k]) + '$, эндээс $\\lambda=' + lam + '$.'),
      'Эндээс $$x=' + cL(B[i]) + (Math.abs(B[i]) === 1 ? '' : '=' + B[i] + '\\cdot ' + lamP) + '=' + x + ',\\qquad ' + A[j] + '=' + lamY + '\\ \\Rightarrow\\ y=' + y + '.$$',
      'Иймд $' + (sum ? 'x+y=' + x + sgn(y) + '=' + (x + y) : 'xy=' + x + '\\cdot ' + par(y) + '=' + x * y) + '$.'
    ],
    t: { A: A, B: B, i: i, j: j }
  };
}

// 59. Куб функцийн монотон завсар: f'(x) = 3A(x − p)(x − q), p < q  ⇒  A > 0 бол [p; q]-д буурч, түүний гадна өснө (A < 0 бол эсрэгээр).
//     f(x) = Ax³ − (3A/2)(p + q)x² + 3Apq·x + d (коэффициент бүхэл, A ∈ {1, 2, 1/3, −1}).
//     [L; R] завсар дахь хариу = буурах (өсөх) олонлог ∩ [L; R] — нэг хэрчим (урт ≥ 1); [L; R] дээр f монотон биш.
function p59_fx(r) { return r === 0 ? 'x' : '(x' + sgn(-r) + ')'; }   // (x − r) хүчин зүйл
function p59() {
  var p = rnd(-6, 5), q = p + rnd(1, 6), Ao = pick([[1, 1], [1, 1], [1, 1], [2, 1], [1, 3], [-1, 1]]), an = Ao[0], ad = Ao[1];
  var c2n = -3 * an * (p + q), c2d = 2 * ad, c1n = 3 * an * p * q, c1d = ad;
  if (c2n % c2d || c1n % c1d) return null;
  var c2 = c2n / c2d, c1 = c1n / c1d, d = nz(-9, 9);
  if (Math.abs(c2) > 30 || Math.abs(c1) > 60) return null;
  var L = rnd(p - 4, q - 1), R = rnd(L + 3, L + 10);
  var inLo = Math.max(L, p), inHi = Math.min(R, q);
  if (inHi - inLo < 1) return null;                                   // дотоод хэсэг (f' тэмдэг нэг) — урт ≥ 1
  var outs = [];
  if (p - L >= 1) outs.push([L, p]);
  if (R - q >= 1) outs.push([q, R]);
  if (!outs.length) return null;                                      // [L; R] дээр монотон биш байх
  var inner = rnd(1, 10) <= 7 || outs.length > 1, dec = (an > 0) === inner;   // дотоод хэсэг: A > 0 бол буурах
  var ans = inner ? [inLo, inHi] : outs[0];
  if (an < 0 && rnd(0, 1)) return null;                               // сөрөг тэргүүлэх коэффициент цөөн
  // Бодолт: f'(x) = K(x − p)(x − q), K = 3A; тэмдгийн шугамаар A > 0 бол [p; q]-д буурч гадна нь өснө; [L; R]-тэй огтлолцол.
  //   (энэ функцийн доторх dec нь логик хувьсагч — dec() туслахыг энд дуудахгүй)
  var K = 3 * an / ad, kS = K === 1 ? '' : String(K), up = an > 0, fac = q === 0 ? 'x' + p59_fx(p) : p59_fx(p) + p59_fx(q);
  var bnd = [L].concat([p, q].filter(function (z) { return z > L && z < R; })).concat([R]), inPts = bnd.slice(1, -1), sgs = [];
  for (var z = 0; z + 1 < bnd.length; z++) { var zm = (bnd[z] + bnd[z + 1]) / 2; sgs.push(K * (zm - p) * (zm - q) > 0 ? '+' : '-'); }
  return {
    q: '$f(x)=' + poly([[an, ad], c2, c1, d]) + '$ функц $[' + L + ';\\,' + R + ']$ завсрын аль хэсэгт ' + (dec ? 'буурахыг' : 'өсөхийг') + ' тодорхойлоорой.',
    a: '$[' + ans[0] + ';\\,' + ans[1] + ']$',
    wk: 26,
    s: [
      'Уламжлал: $$f\'(x)=' + poly([K, -K * (p + q), K * p * q]) + (K === 1 ? '' : '=' + kS + '\\left(' + poly([1, -(p + q), p * q]) + '\\right)') + '=' + kS + fac + '.$$',
      '$f\'(x)=0$ үед сэжигтэй цэгүүд $x=' + p + '$, $x=' + q + '$. Тэмдгийн шугамаар $' + p + '\\lt x\\lt ' + q + '$ үед $f\'(x)' + (up ? '\\lt 0' : '\\gt 0')
        + '$, харин $x\\lt ' + p + '$ ба $x\\gt ' + q + '$ үед $f\'(x)' + (up ? '\\gt 0' : '\\lt 0') + '$.',
      'Иймд $f(x)$ функц $[' + p + ';\\,' + q + ']$ хэрчимд ' + (up ? 'буурч' : 'өсөж') + ', $(-\\infty;\\,' + p + ']$ ба $[' + q + ';\\,+\\infty)$ завсарт '
        + (up ? 'өснө' : 'буурна') + '.',
      '$[' + L + ';\\,' + R + ']$ завсартай огтлолцлыг авбал функцийн ' + (dec ? 'буурах' : 'өсөх') + ' хэсэг: $$[' + ans[0] + ';\\,' + ans[1] + '].$$'
    ],
    sfig: signLine({ pts: inPts.map(String), sg: sgs, arr: true, ends: [String(L), String(R)], fill: inPts.map(function (u, t) { return t; }) }),
    t: { p: p, q: q, A: [an, ad], d: d, L: L, R: R }
  };
}

// 60. [ЗАС] Нэг диагональ дундаж шугамыг хоёр хэсэгт хуваана: хэсгүүд нь хоёр гурвалжны дундаж шугам —
//     богино суурийн хагас m ба урт суурийн хагас n (m < n) ⇒ суурь 2m, 2n; хажуу талын проекц (2n − 2m)/2 = n − m.
//     cos(хурц өнцөг) = (n − m)/хажуу тал: хажуу = 2(n − m) → 60°, (n − m)√2 → 45°, 2(n − m)/√3 → 30°.
// Бодолтын зураг (схем, тоогүй): AD = 10, BC = 4.4 (BH өндөр K-ээс зүүн талд), хурц өнцөг жинхэнэ; MN дундаж шугам, AC диагональ
function p60_fig(ang) {
  var AD = 10, BC = 4.4, pr = (AD - BC) / 2, h = pr * Math.tan(ang * Math.PI / 180);
  var A = [0, 0], D = [AD, 0], B = [pr, h], C = [pr + BC, h], H = [pr, 0], M = [pr / 2, h / 2], N = [AD - pr / 2, h / 2], K = [(pr + BC) / 2, h / 2];
  var f = Fig({ w: 220, pad: 16 });
  f.poly([A, B, C, D], { w: 1.4 }).seg(A, C, { w: 1.1 }).seg(M, N, { w: 1.4 }).seg(B, H, { dash: '4 3', w: 1.1 })
    .right(H, B, D, { s: 6 }).angle(A, D, B, { r: 13 })
    .dot(M, { r: 1.8 }).dot(N, { r: 1.8 }).dot(K, { r: 1.8 })
    .text(A, 'A', { pos: 'sw' }).text(D, 'D', { pos: 'se' }).text(B, 'B', { pos: 'nw' }).text(C, 'C', { pos: 'ne' })
    .text(M, 'M', { pos: 90 + ang }).text(N, 'N', { pos: 90 - ang }).text(K, 'K', { pos: 'se', size: 11 }).text(H, 'H', { pos: 's' });   // M, N — хажуу талын гадна (перпендикуляр)
  return f.svg();
}
function p60() {
  var m = rnd(1, 8), n = m + rnd(1, 9), pr = n - m, ang = pick([60, 60, 60, 45, 45, 30]), sd;
  if (ang === 60) sd = [2 * pr, 1];
  else if (ang === 45) sd = [pr, 2];
  else { if (pr % 3) return null; sd = [2 * pr / 3, 3]; }
  var segs = rnd(1, 4) <= 3 ? [m, n] : [n, m];
  // Бодолт: MK, KN — ABC, ACD гурвалжны дундаж шугам ⇒ BC = 2m, AD = 2n; BH өндөр ⇒ AH = (AD − BC)/2 = n − m; cos A = AH/AB
  var leg = rt(sd[0], sd[1]), cs = ang === 60 ? ['\\dfrac{1}{2}'] : ang === 45 ? ['\\dfrac{1}{\\sqrt{2}}', '\\dfrac{\\sqrt{2}}{2}'] : ['\\dfrac{3}{2\\sqrt{3}}', '\\dfrac{\\sqrt{3}}{2}'];
  var c0 = '\\dfrac{' + pr + '}{' + leg + '}';
  if (cs[0] === c0) cs.shift();                                          // ижил бутархайг давхар бичихгүй (ж: 1/√2, 3/(2√3))
  return {
    q: 'Адил хажуут трапецын дундаж шугам нь диагоналиар $' + segs[0] + '$ см, $' + segs[1] + '$ см урттай хоёр хэсэгт хуваагдах ба хажуу тал нь $'
      + rt(sd[0], sd[1]) + '$ см бол трапецын хурц өнцгийг олоорой.',
    a: '$' + ang + '^\\circ$',
    wk: 28,
    s: [

// 65. 1-р машин v, 2-р машин v + d хурдтай, t₀ цагийн дараа гарна. Гүйцэх хугацаа T: (v + d)T = v(T + t₀) ⇒ T = vt₀/d.

    s: (function () {

      return [

// 66. ctg θ = 1/tg θ тул тэгш хэмтэй (палиндром) коэффициенттэй олон гишүүнтийн харьцаа:
//     (a + b·t + a·t²)/(a + b/t + a/t²) = t²(a + bt + at²)/(at² + bt + a) = t²;  3-р зэрэгт (a, b, b, a) ⇒ t³.
//     Хүртвэрт tg (эх шиг) эсвэл ctg; аргумент α, 2α, 3α, α/2, x, 2x, β …; ХИЕХ(a, b) = 1.
var p66_ARG = ['\\alpha', '2\\alpha', '2\\alpha', '3\\alpha', '4\\alpha', '\\frac{\\alpha}{2}', 'x', '2x', '3x', '\\beta', '2\\beta'];
function p66() {
  var arg = pick(p66_ARG), top = rnd(1, 10) <= 7 ? 'tg' : 'ctg', bot = top === 'tg' ? 'ctg' : 'tg';
  var deg = rnd(1, 10) <= 8 ? 2 : 3, a = pick([1, 1, 1, 1, 2, 3]), b = pick([1, 1, 1, -1, -1, 2, -2, 3, -3, 4]);

  // Бодолт: t = top(θ) ⇒ bot(θ) = 1/t; хуваарийг ерөнхий хуваарь t^deg-д оруулахад хүртвэр нь тэгш хэмт коэффициенттэй ижил олон гишүүнт ⇒ t^deg
  var T = function (i) { return i === 0 ? '' : i === 1 ? 't' : 't^{' + i + '}'; }, numT = String(a), denT = String(a), desc = poly(cs, 't');
  for (var i = 1; i < cs.length; i++) { numT += tm(cs[i], T(i)); denT += (cs[i] < 0 ? '-' : '+') + '\\dfrac{' + Math.abs(cs[i]) + '}{' + T(i) + '}'; }
  return {
    q: '$\\dfrac{' + F(top) + '}{' + F(bot) + '}$ илэрхийллийг хялбарчлаарай.',
    a: '$\\operatorname{' + top + '}^{' + deg + '}' + arg + '$',
    wk: 22,
    s: [
      'Нэг өнцгийн тангенс ба котангенс нь урвуу тоонууд тул $$t=\\operatorname{' + top + '}' + arg + '\\ \\Rightarrow\\ \\operatorname{'
        + bot + '}' + arg + '=\\dfrac{1}{t}.$$ Хүртвэр нь $' + numT + '$ болно.',
      'Хуваарийг ерөнхий хуваарьт оруулъя: $$' + denT + '=\\dfrac{' + desc + '}{' + T(deg) + '}.$$',
      'Коэффициентүүд тэгш хэмтэй тул $' + desc + '=' + numT + '$ — хүртвэртэй ижил. Иймд $$\\dfrac{' + numT + '}{\\dfrac{' + desc + '}{' + T(deg) + '}}=' + T(deg)
        + '=\\operatorname{' + top + '}^{' + deg + '}' + arg + '.$$'
    ],
    t: { arg: arg, top: top, cs: cs }
  };
}

// 67. Виетийн теорем: px² + qx + r = 0-ийн шийд a, b ⇒ s = a + b = −q/p, P = ab = r/p (D > 0).
//     Тэгш хэмт илэрхийлэл: kab² + ka²b = kPs;  a² + m·ab + b² = s² + (m − 2)P;  a³ + b³ = s(s² − 3P).
//     Хэлбэр: (kab² + ka²b)/(b² + m·ab + a²) (эх шиг), урвуу нь, эсвэл (a³ + b³)/(ka²b + kab²). Хариу хураасан бутархай.
function p67() {
  var p = rnd(1, 6), q = nz(-9, 9), r = nz(-9, 9), D = q * q - 4 * p * r;
  if (D <= 0 || gcd(gcd(p, q), r) !== 1) return null;
  var sq = Math.round(Math.sqrt(D));
  if (sq * sq === D && rnd(1, 10) <= 7) return null;                 // ихэнхдээ иррационал шийд (Виет хэрэгтэй)
  var fam = pick([1, 1, 1, 2, 3]), k = pick([1, 2, 2, 3]), m = nz(-5, 5), num, den, N, Dn;
  var K = tm(k, 'ab^2', true) + tm(k, 'a^2b');
  if (fam === 1) { num = -k * q * r; den = q * q + (m - 2) * r * p; N = K; Dn = 'b^2' + tm(m, 'ab') + '+a^2'; }
  else if (fam === 2) { num = q * q + (m - 2) * r * p; den = -k * q * r; N = 'a^2' + tm(m, 'ab') + '+b^2'; Dn = K; }

  //   a³ + b³ = (a + b)((a + b)² − 3ab) — a + b ≠ 0 (q ≠ 0) тул хураана; утгуудыг орлуулж хураасан бутархай
  // pv — үржвэр дэх утга (сөрөг бол хаалттай), pq2 — квадратлах утга (бутархай бол үргэлж хаалттай)
  var pv = function (n, d) { return n % d === 0 ? par(n / d) : n * d < 0 ? '\\left(' + fr(n, d) + '\\right)' : fr(n, d); };

      + (m2 === 0 ? '' : (m2 * r < 0 ? '' : '+') + fr(m2 * r, p) + '=' + SQV) + '.$$';
  };
  var X, Y, sol = ['Дискриминант $D=' + D + '\\gt 0$ тул тэгшитгэл ялгаатай бодит хоёр шийдтэй. Виетийн теоремоор $$a+b=' + sT + ',\\qquad ab=' + PT + '.$$'];
  if (fam === 1) { sol.push('Хүртвэр: ' + sKV, 'Хуваарь: ' + sSQ(Dn)); X = KV; Y = SQV; }
  else if (fam === 2) { sol.push('Хүртвэр: ' + sSQ(N), 'Хуваарь: ' + sKV); X = SQV; Y = KV; }

      'Хүртвэр: $$(a+b)^2-3ab=' + sQ + '^2-3\\cdot ' + PP + '$$ $$=' + fr(q * q, pp) + (r < 0 ? '+' : '') + fr(-3 * r, p) + '=' + X + '.$$'
        + (k === 1 ? '' : ' Хуваарь: $$' + k + 'ab=' + k + '\\cdot ' + PP + '=' + Y + '.$$'));
  }

    q: '$a$ ба $b$ нь $' + poly([p, q, r]) + '=0$ тэгшитгэлийн шийдүүдтэй тэнцүү бол $\\dfrac{' + N + '}{' + Dn + '}$ илэрхийллийн утгыг олоорой.',

// 68. Суурь ногооны жин x: нэг нь p%-иар илүү (x(1 + p/100)), нөгөө нь q%-иар бага (x(1 − q/100)) ⇒ нийт x(3 + (p − q)/100).

var p68_V = { L: ['лууван', 'Луувангийн', 'луувангийнхаас'], T: ['төмс', 'Төмсний', 'төмснийхөөс'], B: ['байцаа', 'Байцааны', 'байцааныхаас'] };

// 69. ABC гурвалжин: B оройд тэгш өнцөг, AB = BC = a, E нь BC тал дээр; будсан AEC гурвалжны талбай S өгөгдсөн → AB.
//     S(AEC) = ½·EC·AB = ½·k·a², k = EC/BC ⇒ a = √(2S/k). BE:EC = m:n (m + n ≤ 6) ⇒ k = n/(m + n);
//     харьцааг EC/BC (голдуу, эх шиг), BE/BC эсвэл BE:EC хэлбэрээр өгнө. a, S бүхэл: эхлээд a-г (тэгш магадлалтай), дараа нь
//     S бүхэл байх харьцааг сонгоно (p69_V[a] — тохирох (m, n) хосууд).
var p69_V = (function () {
  var MN = [[1, 1], [1, 2], [2, 1], [1, 3], [3, 1], [1, 4], [2, 3], [3, 2], [4, 1], [1, 5], [5, 1]], V = {};   // BE:EC
  for (var a = 4; a <= 24; a++) MN.forEach(function (p) {

})();
function p69() {
  var a = +pick(Object.keys(p69_V)), mn = pick(p69_V[a]), m = mn[0], n = mn[1], q = m + n, form = pick([0, 0, 0, 0, 1, 2]);
  var S = n * a * a / (2 * q);

// 70. y = ax² + bx + c параболын (x₀; y₀) цэгт татсан шүргэгч y = mx + n (m = 2ax₀ + b, n = c − ax₀²)

// Бодолт: y' = 2ax + b ⇒ налалт k = y'(x₀); шүргэгч y = y₀ + k(x − x₀) = kx + n; тэнхлэгүүдтэй огтлолцол (0; n), (−n/k; 0)

// 71. Рационал илтгэгчтэй зэрэг: (b^α)^β × N^γ / b^δ, N = b^k (4, 8, 9, 25, 27 … тоогоор бичнэ) ⇒ b^E, E = αβ + kγ − δ.

// 72. lg-ийн ойролцоо утга (4 орон) өгөгдсөн: lg 5, lg 2, lg 3, lg 7 эсвэл lg 2 ба lg 3. N = 5^k·10^d (2^k·10^d, 3^k·10^d,

// Бодолт: N = Π pᵏ·10ᵈ (сөрөг зэрэгтэй хүчин зүйлс хуваарьт) ⇒ lg N = Σ k·lg p + d (логарифмын чанар) ⇒ өгсөн утгаар орлуулна.

      why = '$' + W.L + ver.L + '\\parallel Oy$ ба $' + W.L + hor.L + '\\parallel Ox$ тул $' + ang + '$.';
    } else {
      var vc = function (x, y) { var f = x % 2 || y % 2; return (f ? '\\left(' : '(') + fr(x, 2) + ';\\,' + fr(y, 2) + (f ? '\\right)' : ')'); };
      var pf = function (v) { return v >= 0 ? fr(v, 2) : v % 2 ? '\\left(' + fr(v, 2) + '\\right)' : '(' + v / 2 + ')'; };
      var v1 = '\\overrightarrow{' + W.L + U.L + '}=' + vc(ux, uy), v2 = '\\overrightarrow{' + W.L + V.L + '}=' + vc(vx, vy);
      why = (v1.length > 40 || v2.length > 40 ? 'Векторууд $$' + v1 + ',\\quad ' + v2 + '$$' : '$' + v1 + '$, $' + v2 + '$') + ' тул '   // бутархай координаттай бол тусдаа мөрөнд
        + '$$\\overrightarrow{' + W.L + U.L + '}\\cdot\\overrightarrow{' + W.L + V.L + '}=' + pf(ux) + '\\cdot ' + pf(vx) + '+' + pf(uy) + '\\cdot ' + pf(vy) + '=0,$$ өөрөөр хэлбэл $' + ang + '$.';
    }
    var hx = V.X - U.X, hy = V.Y - U.Y, Hn = hx * hx + hy * hy, hyp = U.L + V.L, Ht = p76_sq(Hn, 4);
    var parts = [hx ? sqT(hx) : '', hy ? sqT(hy) : ''].filter(Boolean);
    var hv = parts.length === 1 ? Ht : '\\sqrt{' + parts.join('+') + '}' + ('\\sqrt{' + fr(Hn, 4) + '}' !== Ht ? '=\\sqrt{' + fr(Hn, 4) + '}' : '') + '=' + Ht;
    var half = /dfrac/.test(Ht) ? '' : '\\dfrac{' + Ht + '}{2}=';
    if (half.slice(0, -1) === Rt) half = '';
    return [s1, why,
      'Тэгш өнцөгт гурвалжныг багтаасан тойргийн төв нь гипотенузын дундаж цэг тул $R=\\dfrac{' + hyp + '}{2}$: $$' + hyp + '=' + hv + ',$$ $$R=\\dfrac{' + hyp + '}{2}=' + half + Rt + '.$$'];
  }
  // ерөнхий: дундаж перпендикулярууд (O₁P² = O₁Q²) → 4(Q−P)·(x, y) = |Q|² − |P|² (давхарласан)
  var bis = [[0, 1], [1, 2], [0, 2]].map(function (e) {
    var p = pts[e[0]], q = pts[e[1]], al = 4 * (q.X - p.X), be = 4 * (q.Y - p.Y), ga = q.X * q.X + q.Y * q.Y - p.X * p.X - p.Y * p.Y;
    var g = [al, be, ga].reduce(function (u, w) { return w ? (u ? gcd(u, w) : ab(w)) : u; }, 0);
    if (al < 0 || (!al && be < 0)) g = -g;
    al /= g; be /= g; ga /= g;
    return { p: p, q: q, al: al, be: be, ga: ga, sc: !al || !be ? 0 : ab(al) + ab(be) + ab(ga) };
  });
  var srt = bis.slice().sort(function (u, w) { return u.sc - w.sc; }), E1 = srt[0], E2 = srt[1];
  var sqv = function (v, c2) { return !c2 ? v + '^2' : c2 % 2 ? '\\left(' + v + '-' + fr(c2, 2) + '\\right)^2' : '(' + v + '-' + c2 / 2 + ')^2'; };
  var eqT = function (E) {
    if (!E.al) return 'y=' + fr(E.ga, E.be);
    if (!E.be) return 'x=' + fr(E.ga, E.al);
    return E.al === 1 && E.be === -1 && !E.ga ? 'x=y' : tm(E.al, 'x', true) + tm(E.be, 'y') + '=' + E.ga;
  };
  var line = function (E) { return '$O_1' + E.p.L + '=O_1' + E.q.L + '$: $$' + sqv('x', E.p.X) + '+' + sqv('y', E.p.Y) + '=' + sqv('x', E.q.X) + '+' + sqv('y', E.q.Y) + '\\Rightarrow ' + eqT(E) + '.$$'; };
  var det = E1.al * E2.be - E2.al * E1.be, X0 = p76_rq(E1.ga * E2.be - E2.ga * E1.be, det), Y0 = p76_rq(E1.al * E2.ga - E2.al * E1.ga, det);
  // радиус: хамгийн энгийн цэгээс
  var bestP = null;
  pts.forEach(function (p) {
    var dx = p76_rq(2 * X0[0] - p.X * X0[1], 2 * X0[1]), dy = p76_rq(2 * Y0[0] - p.Y * Y0[1], 2 * Y0[1]);
    var sc = (dx[0] ? 1 : 0) + (dy[0] ? 1 : 0) + (dx[1] > 1 ? 2 : 0) + (dy[1] > 1 ? 2 : 0) + (p.X ? 0.5 : 0) + (p.Y ? 0.5 : 0);
    if (!bestP || sc < bestP.sc) bestP = { p: p, dx: dx, dy: dy, sc: sc };
  });
  var dT = function (c0, c2) {   // (x₀ − c)²: c = c2/2
    if (!c2) return c0[1] === 1 ? (c0[0] < 0 ? '(' + c0[0] + ')^2' : c0[0] + '^2') : '\\left(' + fr(c0[0], c0[1]) + '\\right)^2';
    var both = c0[1] === 1 && c2 % 2 === 0;
    return (both ? '(' : '\\left(') + fr(c0[0], c0[1]) + '-' + fr(c2, 2) + (both ? ')' : '\\right)') + '^2';
  };
  var B0 = bestP, terms = [B0.dx[0] ? dT(X0, B0.p.X) : '', B0.dy[0] ? dT(Y0, B0.p.Y) : ''].filter(Boolean);
  var Hn2 = B0.dx[0] * B0.dx[0] * B0.dy[1] * B0.dy[1] + B0.dy[0] * B0.dy[0] * B0.dx[1] * B0.dx[1], Hd2 = B0.dx[1] * B0.dx[1] * B0.dy[1] * B0.dy[1];
  var hS = '\\sqrt{' + fr(Hn2, Hd2) + '}', rv;
  if (terms.length === 1) {   // төвтэй нэг хэвтээ/босоо шулуун дээр: R = |x₀ − c|
    var c0 = B0.dx[0] ? X0 : Y0, cc = B0.dx[0] ? B0.p.X : B0.p.Y, pos = c0[0] * 2 - cc * c0[1] > 0, zt = fr(c0[0], c0[1]);
    if (c0[0] < 0) zt = c0[1] === 1 ? '(' + zt + ')' : '\\left(' + zt + '\\right)';   // сөрөг хасагдагч хаалтад
    rv = !cc ? Rt : (pos ? fr(c0[0], c0[1]) + '-' + fr(cc, 2) : fr(cc, 2) + '-' + zt) + '=' + Rt;
  } else rv = '\\sqrt{' + terms.join('+') + '}' + (hS !== Rt ? '=' + hS : '') + '=' + Rt;
  var c2 = function (r) { return fr(r[0], r[1]); };
  return [s1,
    'Тойргийн төвийг $O_1(x;\\,y)$ гэвэл тэр нь гурван цэгээс ижил зайтай. ' + line(E1),
    line(E2) + ' Эндээс $x=' + c2(X0) + '$, $y=' + c2(Y0) + '$.',
    'Иймд $$R=O_1' + B0.p.L + '=' + rv + '.$$'];
}

// 77. Холимог: p%-ийн m гр уусмал дээр r%-ийн x гр уусмал нэмж концентрацийг d хувиар (p ± d хүртэл) өөрчилнө:
//     p·m + r·x = (p ± d)(m + x) ⇒ x = d·m / |r − (p ± d)|. Ихэнхдээ нэмэгдүүлэх (эх шиг), заримдаа бууруулах; x бүхэл.
function p77() {
  var up = rnd(0, 3) > 0, p = pick([5, 8, 10, 12, 15, 16, 18, 20, 24, 25, 30, 35, 40, 45]), d = rnd(2, 10), r;
  var m = pick([10, 12, 15, 16, 18, 20, 24, 25, 27, 30, 32, 36, 40, 45, 48, 50, 54, 60, 64, 72, 75, 80, 90, 96, 100, 120, 150, 200]);
  var t = up ? p + d : p - d;
  if (up) { if (t >= 90) return null; r = rnd(t + 1, Math.min(95, t + 30)); }
  else { if (t < 3) return null; r = rnd(Math.max(1, t - 30), t - 1); }
  var den = Math.abs(r - t);
  if ((d * m) % den) return null;
  var x = d * m / den;
  if (x < 5 || x > 300 || x > 4 * m || x === m && rnd(0, 1)) return null;
  return {
    q: '$' + p + '\\%$-ийн концентрацитай $' + m + '$ гр уусмал дээр концентрацийг нь $' + d + '$ хувиар ' + (up ? 'нэмэгдүүлэхийн' : 'бууруулахын')
      + ' тулд $' + r + '$ хувийн концентрацитай хэчнээн грамм уусмал нэмж хийх шаардлагатай вэ?',
    a: '$' + x + '$ гр',
    wk: 26,
    // Бодолт: цэвэр бодисын масс хадгалагдана: p·m + r·x = t·(m + x) → |r − t|·x = d·m
    s: [
      'Шинэ концентраци $' + p + '\\%' + (up ? '+' : '-') + d + '\\%=' + t + '\\%$ болно. Нэмэх уусмалыг $x$ гр гэе.',
      'Холиход цэвэр бодисын масс нийлж нэмэгдэнэ: $$' + dec(p / 100) + '\\cdot ' + m + '+' + dec(r / 100) + 'x=' + dec(t / 100) + '\\,(' + m + '+x).$$',
      'Хаалтыг задалж бодъё: $$' + dec(p * m / 100) + '+' + dec(r / 100) + 'x=' + dec(t * m / 100) + '+' + dec(t / 100) + 'x$$ $$\\Rightarrow\\ ' + dec(den / 100) + 'x='
        + dec(d * m / 100) + '\\ \\Rightarrow\\ x=' + x + '.$$',
      'Шалгалт: $\\dfrac{' + dec(p * m / 100) + '+' + dec(r * x / 100) + '}{' + (m + x) + '}=' + dec(t / 100) + '$, өөрөөр хэлбэл $' + t + '\\%$.'
    ],
    t: { p: p, m: m, d: d, r: r, up: up }
  };
}

// 78. f(x) = ax² + bx + c ⇒ f(x+1) − f(x) = 2ax + (a + b). Өгсөн: ялгавар Px + Q, f(x₀) = v.
//     Ихэнхдээ f(x₀ + 1) = v + (Px₀ + Q) (эх шиг), заримдаа f(x₀ + 2), f(x₀ + 3), f(x₀ − 1) эсвэл f(x)-ийг өөрийг нь асууна.
function p78() {
  var a = nz(-4, 4), b = rnd(-8, 8), c = rnd(-10, 12), P = 2 * a, Q = a + b;
  if (a < 0 && rnd(0, 1)) return null;                                  // эерэг тэргүүлэх коэффициент голдуу
  var x0 = pick([0, 1, 1, 1, 2, 2, -1, 3]), f = function (x) { return a * x * x + b * x + c; }, v = f(x0);
  var mode = rnd(1, 10), x1 = mode <= 6 ? x0 + 1 : mode === 7 ? x0 + 2 : mode === 8 ? x0 + pick([3, -1]) : null;
  if (x1 !== null && x1 === 0 && rnd(0, 1)) return null;
  var w = x1 === null ? null : f(x1);
  if (Math.abs(v) > 60 || (w !== null && Math.abs(w) > 99)) return null;
  var head = '$f(x)$ нь хоёр зэргийн олон гишүүнт $f(x+1)-f(x)=' + poly([P, Q]) + '$ ба $f(' + x0 + ')=' + v + '$ бол ';
  return {
    q: head + (x1 === null ? '$f(x)$-ийг олоорой.' : '$f(' + x1 + ')=?$'),
    a: x1 === null ? '$f(x)=' + poly([a, b, c]) + '$' : '$f(' + x1 + ')=' + w + '$',
    wk: 24,
    s: p78_sol(a, b, c, P, Q, x0, v, x1),
    t: { a: a, b: b, c: c, x0: x0, x1: x1 }
  };
}
// Бодолт: f(k) мэдэгдэх бол тэнцэтгэлд x = k орлуулж f(k + 1) = f(k) + (Pk + Q) — алхам алхмаар (x₁ < x₀ бол x = x₁ орлуулж хасна).
//   f(x)-ийг асуувал f(x) = ax² + bx + c гэж f(x+1) − f(x) = 2ax + a + b ⇒ коэффициентууд тэнцүү ⇒ a, b; f(x₀) = v ⇒ c.
function p78_sol(a, b, c, P, Q, x0, v, x1) {
  var dt = function (x) { return P + '\\cdot ' + par(x) + (Q ? sgn(Q) : ''); };
  var st = [], k, fk = v;
  if (x1 !== null && x1 > x0) {
    for (k = x0; k < x1; k++) {
      var d = P * k + Q;
      st.push((k === x0 ? 'Өгсөн тэнцэтгэлд $x=' + k + '$ гэж орлуулбал' : '$x=' + k + '$ гэж орлуулбал')
        + ' $$f(' + (k + 1) + ')-f(' + k + ')=' + dt(k) + '=' + d + '\\ \\Rightarrow\\ f(' + (k + 1) + ')=' + fk + sgn(d) + '=' + (fk + d) + '.$$');
      fk += d;
    }
    return st;
  }
  if (x1 !== null) {   // x₁ = x₀ − 1
    var d1 = P * x1 + Q;
    return ['Өгсөн тэнцэтгэлд $x=' + x1 + '$ гэж орлуулбал $$f(' + x0 + ')-f(' + x1 + ')=' + dt(x1) + '=' + d1 + '.$$',
      '$f(' + x0 + ')=' + v + '$ тул $$f(' + x1 + ')=' + v + sgn(-d1) + '=' + (v - d1) + '.$$'];
  }
  // f(x)-ийг олох
  var aT = (a === 1 ? '' : a === -1 ? '-' : a + '\\cdot ') + par(x0) + '^2', bT = b ? (b < 0 ? '-' : '+') + (Math.abs(b) === 1 ? '' : Math.abs(b) + '\\cdot ') + par(x0) : '';
  var K = a * x0 * x0 + b * x0;
  return [
    '$f(x)=ax^2+bx+c$ гэвэл $$f(x+1)-f(x)=a(x+1)^2+b(x+1)+c-ax^2-bx-c$$ $$=2ax+a+b.$$',
    'Үүнийг өгсөн $' + poly([P, Q]) + '$ илэрхийлэлтэй тэнцүүлбэл ижил зэргийн гишүүдийн коэффициентууд тэнцүү: $$2a=' + P + ',\\quad a+b=' + Q
      + '\\ \\Rightarrow\\ a=' + a + ',\\quad b=' + Q + sgn(-a) + '=' + b + '.$$',
    x0 ? '$f(' + x0 + ')=' + v + '$ нөхцөлөөс $$' + aT + bT + '+c=' + v + '\\ \\Rightarrow\\ c=' + v + (K ? sgn(-K) + '=' + c : '') + '.$$'
      : '$f(0)=c$ тул $c=' + v + '$.',
    'Иймд $f(x)=' + poly([a, b, c]) + '$.'
  ];
}

// 79. a ба b талтай тэгш өнцөгтийг a талыг нь тойруулбал V₁ = πb²a, b талыг нь тойруулбал V₂ = πa²b ⇒ V₁ : V₂ = b : a.
//     b/a — бүхэл (голдуу) эсвэл хагас бүхэл (2.5, 1.5 …); нэгж см/дм/м; талуудын дараалал заримдаа их нь эхэндээ.
function p79() {
  var rn = pick([2, 2, 3, 3, 4, 4, 5, 6, 3, 5, 7]), rd = rnd(0, 4) ? 1 : 2, t = rnd(1, 10);
  if (gcd(rn, rd) !== 1 || rn <= rd) return null;
  var a = rd * t, b = rn * t;
  if (b > 60 || (rd === 1 && a === 1 && rnd(0, 2))) return null;
  var u = pick(['см', 'см', 'см', 'см', 'дм', 'м']), sw = rnd(0, 3) === 0, x = sw ? b : a, y = sw ? a : b;
  // Бодолт: x талыг тойруулбал өндөр x, радиус y ⇒ V₁ = π·y²·x; y талыг тойруулбал V₂ = π·x²·y; их нь / бага нь = их тал / бага тал
  var Vx = '\\pi\\cdot ' + y + '^2\\cdot ' + x, Vy = '\\pi\\cdot ' + x + '^2\\cdot ' + y, big = x < y;   // big: V₁ их
  var rt = fr(Math.max(x, y), Math.min(x, y)), rv = dec(rn / rd);
  // харьцааны гинж: \dfrac{их}{бага} (бага = 1 бол алгасна) = хураасан (өөр бол) = аравтын (өөр бол) — давхардалгүй
  var ch = Math.min(x, y) === 1 ? [] : ['\\dfrac{' + Math.max(x, y) + '}{' + Math.min(x, y) + '}'];
  if (ch[ch.length - 1] !== rt) ch.push(rt);
  if (ch[ch.length - 1] !== rv) ch.push(rv);
  return {
    q: '$' + x + '$ ' + u + ' ба $' + y + '$ ' + u + ' талтай тэгш өнцөгтийг талыг нь тойруулан эргүүлэхэд үүсэх хоёр цилиндрийн эзлэхүүнүүд нэг нь нөгөөгөөсөө хэд дахин их байх вэ?',
    a: '$' + dec(rn / rd) + '$ дахин',
    wk: 20,
    s: [
      '$' + x + '$ ' + u + ' талыг тойруулан эргүүлэхэд өндөр нь $' + x + '$ ' + u + ', суурийн радиус нь $' + y + '$ ' + u + ' цилиндр үүснэ: $$V_1=\\pi r^2h=' + Vx + '.$$',
      '$' + y + '$ ' + u + ' талыг тойруулбал өндөр нь $' + y + '$ ' + u + ', радиус нь $' + x + '$ ' + u + ': $$V_2=' + Vy + '.$$',
      'Радиус нь их тал болсон цилиндрийн эзлэхүүн их: $$\\dfrac{V_' + (big ? 1 : 2) + '}{V_' + (big ? 2 : 1) + '}=\\dfrac{' + (big ? Vx : Vy) + '}{' + (big ? Vy : Vx) + '}='
        + ch.join('=') + '.$$ Иймд нэг нь нөгөөгөөсөө $' + rv + '$ дахин их.'
    ],
    t: { a: a, b: b }
  };
}

// 80. Хайрцагт T (2 эсвэл 3) төрлийн чихэр, i-р төрлийнх nᵢ ширхэг (N = Σnᵢ); таамгаар 2 ширхгийг авах C_N^2 боломж.
//     Өөр өөр төрлийн: Σ_{i<j} nᵢ·nⱼ;  ижил төрлийн: Σ C_{nᵢ}^2 (= C_N^2 − өөр өөр).  P = таатай/C_N^2 — хураасан бутархай.
function p80() {
  var T = rnd(1, 10) <= 7 ? 2 : 3, n = [], N = 0, i, j;
  for (i = 0; i < T; i++) { n.push(T === 2 ? rnd(3, 12) : rnd(2, 9)); N += n[i]; }
  if (T === 2 && n[0] === n[1] && rnd(0, 3)) return null;            // тэнцүү тоо — ховор
  if (T === 3 && N > 24) return null;
  var diff = rnd(1, 10) <= 6, tot = N * (N - 1) / 2, good = 0;
  for (i = 0; i < T; i++) for (j = i + 1; j < T; j++) good += n[i] * n[j];
  if (!diff) good = tot - good;
  if (good <= 0 || good >= tot) return null;
  // Бодолт: бүх боломж C_N^2; өөр өөр төрөл — хоёр төрлөөс нэг нэгийг (nᵢ·nⱼ-ийн нийлбэр), ижил төрөл — нэг төрлөөс хоёрыг (C_{nᵢ}^2-ийн нийлбэр)
  var pr = [], pv = [];
  for (i = 0; i < T; i++) for (j = i + 1; j < T; j++) { pr.push(n[i] + '\\cdot ' + n[j]); pv.push(n[i] * n[j]); }
  var cs = n.map(function (v) { return 'C_{' + v + '}^{2}'; }), cv = n.map(function (v) { return v * (v - 1) / 2; });
  var fav = diff ? pr.join('+') + (T > 2 ? '=' + pv.join('+') : '') : cs.join('+') + '=' + cv.join('+');
  var sol = [
    'Нийт $N=' + n.join('+') + '=' + N + '$ чихрээс $2$-ыг сонгох бүх боломжийн тоо $$C_{' + N + '}^{2}=\\dfrac{' + N + '\\cdot ' + (N - 1) + '}{2}=' + tot + '.$$',
    (diff ? 'Өөр өөр төрлийн $2$ чихэр гэдэг нь ' + (T > 2 ? 'аль нэг хоёр төрлөөс' : 'хоёр төрлөөс') + ' тус бүр нэг ширхэг авах явдал. Таатай боломжийн тоо'
      : 'Ижил төрлийн $2$ чихэр гэдэг нь нэг төрлөөс хоёуланг нь авах явдал. Таатай боломжийн тоо') + ' $$' + fav + '=' + good + '.$$',
    'Сонгодог магадлалын томьёогоор $$P=\\dfrac{' + good + '}{' + tot + '}' + (gcd(good, tot) > 1 ? '=' + fr(good, tot) : '') + '.$$'
  ];
  return {
    q: 'Хайрцагт ' + T + ' төрлийн чихэр байв. ' + n.map(function (v, k) { return (k + 1) + '-р төрлийн чихэр ' + v + ' ширхэг'; }).join(', ')
      + ' байсан. Таамгаар 2 ширхгийг сонгон авахад ' + (diff ? 'өөр өөр' : 'ижил') + ' төрлийн чихэр байх үзэгдлийн магадлалыг олоорой.',
    a: '$P=' + fr(good, tot) + '$',
    wk: 24,
    s: sol,
    t: { n: n, diff: diff }
  };
}
