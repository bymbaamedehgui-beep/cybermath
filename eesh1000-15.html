<script>
/* ЭЕШ 1000 4-3 — ЭЕШ-ийн 1000 бодлого, 4-р хэсэг (55–80-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 55. Тойрогт багтсан ABCD: хөвч (зэргэлдээ хоёр оройн хэрчим) ба түүнд тулсан багтсан өнцөг (нөгөө оройноос) өгөгдөнө.
//     Синусын теорем: R = (хөвч)/(2·sin θ), θ ∈ {30°, 45°, 60°} ⇒ хөвч = p√q үед R = p√(q·k)/k (2 sin θ = √k) — хялбарчилсан.
var p55_O = [['CD', 'CAD'], ['CD', 'CBD'], ['AB', 'ACB'], ['AB', 'ADB'], ['BC', 'BAC'], ['BC', 'BDC'], ['AD', 'ABD'], ['AD', 'ACD']];
function p55() {
  var o = rnd(1, 4) === 1 ? p55_O[0] : pick(p55_O), th = pick([30, 45, 45, 60, 60]), k = { 30: 1, 45: 2, 60: 3 }[th];
  var qq = pick([1, 1, 2, 2, 3, 3, 6]), pp = rnd(1, 6);
  if (pp === 1 && qq === 1 && rnd(0, 1)) return null;
  var S = surd(qq * k), nn = pp * S.k, g = gcd(nn, k), num = nn / g, den = k / g;      // R = p√q/√k = p√(qk)/k
  var val = den === 1 ? rt(num, S.r) : '\\dfrac{' + rt(num, S.r) + '}{' + den + '}';
  return {
    q: 'Тойрогт багтсан $ABCD$ дөрвөн өнцөгтийн $' + o[0] + '=' + rt(pp, qq) + '$ ба $\\angle ' + o[1] + '=' + th + '^\\circ$ бол багтаасан тойргийн радиусыг олоорой.',
    a: '$R=' + val + '$',
    wk: 22,
    t: { o: o, th: th, pp: pp, qq: qq }
  };
}

// 56. Тэнцүү харьцаа: a/p = b/q = c/r = k ⇒ a = pk, b = qk, c = rk  (эсвэл p/a = q/b = r/c = k ⇒ a = p/k, …).
//     a, b, c-ийн тэмдгийн нөхцөл (сөрөг/эерэг) ба хуваарийн тэмдгээс k-ийн тэмдэг гарна:
//     k > 0 бол a, b, c нь p, q, r-тэй ижил эрэмбэтэй, k < 0 бол эсрэг эрэмбэтэй.
//     Хуваарийн модулиуд ялгаатай (2..9), бүгд нэг тэмдэгтэй (эсрэг тэмдэгтэй бол a, b, c нэг тэмдэгтэй байж чадахгүй).
function p56() {
  var M = shuffle([2, 3, 4, 5, 6, 7, 8, 9]).slice(0, 3), sd = rnd(1, 10) <= 7 ? -1 : 1, neg = rnd(1, 10) <= 7, inv = rnd(1, 10) <= 3;
  var P = M.map(function (m) { return sd * m; }), N = ['a', 'b', 'c'];
  var k = (neg ? -1 : 1) * sd;                       // a = p·k (эсвэл p/k) нь нөхцөлийн тэмдэгтэй байх k-ийн тэмдэг
  var V = P.map(function (p) { return inv ? p / k : p * k; });
  var ord = [0, 1, 2].sort(function (i, j) { return V[i] - V[j]; });
  var eq = P.map(function (p, i) { return inv ? '\\frac{' + p + '}{' + N[i] + '}' : '\\frac{' + N[i] + '}{' + p + '}'; }).join('=');
  return {
    q: '$' + eq + '$ байх ' + (neg ? 'сөрөг' : 'эерэг') + ' бодит $a,b,c$ тоонуудыг өсөх эрэмбээр бичээрэй.',
    a: '$' + ord.map(function (i) { return N[i]; }).join('\\lt ') + '$',
    wk: 18,
    t: { P: P, neg: neg, inv: inv }
  };
}

// 57. Натурал a, b, c-ийн хувьд нэг хувьсагч хоёр тэгшитгэлд хоёуланд нь орно: uv = P, uw = Q.
//     u нь P ба Q-ийн нийтлэг хуваагч; ХИЕХ(P, Q) = 1 тул u = 1 ⇒ v = P, w = Q ⇒ x² − (P + Q)x + PQ.
//     Нийтлэг хувьсагч a (эх шиг), b эсвэл c байж болно; язгуур нь нөгөө хоёр хувьсагч.
function p57() {
  var P = rnd(2, 12), Q = rnd(2, 12);
  if (P === Q || gcd(P, Q) !== 1) return null;
  var com = pick(['a', 'a', 'a', 'b', 'c']), oth = ['a', 'b', 'c'].filter(function (v) { return v !== com; });
  var pr = function (u, v) { return u < v ? u + v : v + u; };
  return {
    q: '$a,b,c\\in\\mathbb{N}$ тоонуудын хувьд $\\begin{cases}' + pr(com, oth[0]) + '=' + P + '\\\\' + pr(com, oth[1]) + '=' + Q + '\\end{cases}$ байх $'
      + oth[0] + ',' + oth[1] + '$ язгууруудтай квадрат гурван гишүүнтийг бичээрэй.',
    a: '$' + poly([1, -(P + Q), P * Q]) + '$',
    wk: 22,
    t: { P: P, Q: Q, com: com }
  };
}

// 58. Коллинеар векторууд: координат бүр тэгээс ялгаатай тул a ∥ b ⇔ a = λb (λ ≠ 0).
//     Хоёулаа мэдэгдэх координатын хосоос λ-г олж, x = λ·b_i, y = a_j/λ.  Урвуугаар: w (тэггүй бүхэл), a = m·w, b = n·w.
//     x нь a-ийн i-р, y нь b-ийн j-р координат (i ≠ j); асуулт: xy (эх шиг) эсвэл x + y.
function p58() {
  var w = [nz(-4, 4), nz(-4, 4), nz(-4, 4)], m = nz(-3, 3), n = nz(-3, 3);
  if (m === n || gcd(m, n) !== 1) return null;
  var A = w.map(function (v) { return m * v; }), B = w.map(function (v) { return n * v; });
  var i = rnd(0, 2), j = rnd(0, 2);
  if (i === j) return null;
  var x = A[i], y = B[j];
  if (Math.abs(x) === 1 && Math.abs(y) === 1) return null;
  var sum = rnd(1, 10) <= 3;
  var vec = function (V, k, nm) { return '(' + V.map(function (v, t) { return t === k ? nm : String(v); }).join(',\\,') + ')'; };
  return {
    q: '$\\vec a=' + vec(A, i, 'x') + '$; $\\vec b=' + vec(B, j, 'y') + '$ векторууд коллинеар байх <span class="nw">$x,y$-ийн</span> ' + (sum ? 'нийлбэрийг' : 'үржвэрийг') + ' олоорой.',
    a: '$x=' + x + ',\\ y=' + y + '$; $' + (sum ? 'x+y=' + (x + y) : 'xy=' + x * y) + '$',
    wk: 22,
    t: { A: A, B: B, i: i, j: j }
  };
}

// 59. Куб функцийн монотон завсар: f'(x) = 3A(x − p)(x − q), p < q  ⇒  A > 0 бол [p; q]-д буурч, түүний гадна өснө (A < 0 бол эсрэгээр).
//     f(x) = Ax³ − (3A/2)(p + q)x² + 3Apq·x + d (коэффициент бүхэл, A ∈ {1, 2, 1/3, −1}).
//     [L; R] завсар дахь хариу = буурах (өсөх) олонлог ∩ [L; R] — нэг хэрчим (урт ≥ 1); [L; R] дээр f монотон биш.
function p59() {
  var p = rnd(-6, 5), q = p + rnd(1, 6), Ao = pick([[1, 1], [1, 1], [1, 1], [2, 1], [1, 3], [-1, 1]]), an = Ao[0], ad = Ao[1];
  var c2n = -3 * an * (p + q), c2d = 2 * ad, c1n = 3 * an * p * q, c1d = ad;
  if (c2n % c2d || c1n % c1d) return null;
  var c2 = c2n / c2d, c1 = c1n / c1d, d = nz(-9, 9);
  if (Math.abs(c2) > 30 || Math.abs(c1) > 60) return null;
  var L = rnd(p - 4, q - 1), R = rnd(L + 3, L + 10);
  var inLo = Math.max(L, p), inHi = Math.min(R, q);
  if (inHi - inLo < 1) return null;                                   // дотоод хэсэг (f' тэмдэг нэг) — урт ≥ 1
  var outs = [];
  if (p - L >= 1) outs.push([L, p]);
  if (R - q >= 1) outs.push([q, R]);
  if (!outs.length) return null;                                      // [L; R] дээр монотон биш байх
  var inner = rnd(1, 10) <= 7 || outs.length > 1, dec = (an > 0) === inner;   // дотоод хэсэг: A > 0 бол буурах
  var ans = inner ? [inLo, inHi] : outs[0];
  if (an < 0 && rnd(0, 1)) return null;                               // сөрөг тэргүүлэх коэффициент цөөн
  return {
    q: '$f(x)=' + poly([[an, ad], c2, c1, d]) + '$ функц $[' + L + ';\\,' + R + ']$ завсрын аль хэсэгт ' + (dec ? 'буурахыг' : 'өсөхийг') + ' тодорхойлоорой.',
    a: '$[' + ans[0] + ';\\,' + ans[1] + ']$',
    wk: 26,
    t: { p: p, q: q, A: [an, ad], d: d, L: L, R: R }
  };
}

// 60. [ЗАС] Нэг диагональ дундаж шугамыг хоёр хэсэгт хуваана: хэсгүүд нь хоёр гурвалжны дундаж шугам —
//     богино суурийн хагас m ба урт суурийн хагас n (m < n) ⇒ суурь 2m, 2n; хажуу талын проекц (2n − 2m)/2 = n − m.
//     cos(хурц өнцөг) = (n − m)/хажуу тал: хажуу = 2(n − m) → 60°, (n − m)√2 → 45°, 2(n − m)/√3 → 30°.
function p60() {
  var m = rnd(1, 8), n = m + rnd(1, 9), pr = n - m, ang = pick([60, 60, 60, 45, 45, 30]), sd;
  if (ang === 60) sd = [2 * pr, 1];
  else if (ang === 45) sd = [pr, 2];
  else { if (pr % 3) return null; sd = [2 * pr / 3, 3]; }
  var segs = rnd(1, 4) <= 3 ? [m, n] : [n, m];
  return {
    q: 'Адил хажуут трапецын дундаж шугам нь диагоналиар $' + segs[0] + '$ см, $' + segs[1] + '$ см урттай хоёр хэсэгт хуваагдах ба хажуу тал нь $'
      + rt(sd[0], sd[1]) + '$ см бол трапецын хурц өнцгийг олоорой.',
    a: '$' + ang + '^\\circ$',
    wk: 28,
    t: { m: m, n: n, side: sd }
  };
}

// 61. (ax^p + b/x^q)^n задаргааны ерөнхий гишүүн: C(n, k)·a^{n−k}·b^k·x^{p(n−k) − qk}.
//     Зэрэг e = p(n − k) − qk (k-ээр хатуу буурах тул k цорын ганц) ⇒ коэффициент C(n, k)·a^{n−k}·b^k.
//     e ≠ 0 (сул гишүүн биш), 1 ≤ k ≤ n − 1, |коэффициент| ≤ 10000.
function p61_C(n, k) { var c = 1; for (var i = 1; i <= k; i++) c = c * (n - k + i) / i; return Math.round(c); }
function p61() {
  var n = rnd(4, 12), p = pick([1, 1, 1, 2, 2, 3]), q = pick([1, 1, 1, 2, 2, 3]), a = pick([1, 1, 1, 1, 2, 2, 3]), b = pick([1, 1, 1, -1, -1, 2, -2, 3, -3]);
  if (gcd(a, b) !== 1) return null;
  var k = rnd(1, n - 1), e = p * (n - k) - q * k;
  if (e === 0 || Math.abs(e) > 16) return null;
  var c = p61_C(n, k) * Math.pow(a, n - k) * Math.pow(b, k);
  if (Math.abs(c) > 10000) return null;
  var t1 = tm(a, p === 1 ? 'x' : 'x^{' + p + '}', true), t2 = (b < 0 ? '-' : '+') + '\\frac{' + Math.abs(b) + '}{' + (q === 1 ? 'x' : 'x^{' + q + '}') + '}';
  var X = e === 1 ? 'x' : 'x^{' + e + '}', su = e === 1 ? 'ийг' : suf(Math.abs(e), 'ыг');
  return {
    q: '$\\left(' + t1 + t2 + '\\right)^{' + n + '}$ задаргааны <span class="nw">$' + X + '$-' + su + '</span> агуулсан гишүүний коэффициент хэд вэ?',
    a: '$' + c + '$',
    wk: 26,
    t: { a: a, b: b, p: p, q: q, n: n, k: k, e: e }
  };
}

// 62. lg(x + α) + lg(x + β) = lg M + lg(x + γ)  ⇒  (x + α)(x + β) = M(x + γ), муж: x + α, x + β, x + γ > 0.
//     lg M нь k·lg c (M = cᵏ), lg 6, lg 12 эсвэл 1 (= lg 10) хэлбэртэй.
//     Урвуугаар: язгуур r₁ < r₂ = r₁ + δ, y = x − r₁ орлуулбал u = r₁ + α, v = r₁ + β, w = r₁ + γ:
//     (y + u)(y + v) = M(y + w) язгуур y = 0, δ ⇔ uv = Mw, u + v = M − δ.
//     y = 0 мужид ⇔ u, v, w > 0 (тэгвэл y = δ ч мужид) ⇒ хоёр шийд (эх шиг, ~60%); үгүй бол зөвхөн r₂ (нөгөө нь гадны шийд).
var p62_M = [[6, '\\lg 6'], [8, '3\\lg 2'], [8, '3\\lg 2'], [10, '1'], [12, '\\lg 12'], [16, '4\\lg 2'], [25, '2\\lg 5'], [27, '3\\lg 3'], [32, '5\\lg 2'], [36, '2\\lg 6'],
  [4, '2\\lg 2'], [9, '2\\lg 3'], [5, '\\lg 5'], [7, '\\lg 7']];
function p62_L(c) { return c ? '\\lg(x' + sgn(c) + ')' : '\\lg x'; }
function p62() {
  var both = rnd(1, 10) <= 6, Mo = pick(p62_M), M = Mo[0], C = [];
  for (var d = 1; d <= 14; d++) for (var u = -12; u <= 30; u++) {
    var v = M - d - u;
    if (v <= u || (u * v) % M) continue;
    var w = u * v / M;
    if (w === u || w === v) continue;                                   // lg(x + γ) нь зүүн талын логарифмтай давхцахгүй
    var ok0 = u > 0 && v > 0 && w > 0, ok1 = d + u > 0 && d + v > 0 && d + w > 0;
    if (!ok1 || ok0 !== both) continue;
    for (var r1 = -6; r1 <= 20; r1++) {
      var al = u - r1, be = v - r1, ga = w - r1;
      if (Math.abs(al) > 9 || Math.abs(be) > 9 || Math.abs(ga) > 9 || r1 + d > 22) continue;
      C.push([al, be, ga, r1, r1 + d]);
    }
  }
  if (!C.length) return null;
  var c = pick(C), lhs = rnd(1, 4) === 1 ? [c[1], c[0]] : [c[0], c[1]], ok = both ? [c[3], c[4]] : [c[4]];
  return {
    q: '$' + p62_L(lhs[0]) + '+' + p62_L(lhs[1]) + '=' + Mo[1] + '+' + p62_L(c[2]) + '$ тэгшитгэлийг бодоорой.',
    a: ok.map(function (r) { return '$x=' + r + '$'; }).join('; '),
    wk: 28,
    t: { M: M, al: c[0], be: c[1], ga: c[2], r: [c[3], c[4]], both: both }
  };
}

// 63. lo ⋖ sin x ⋖ hi (эсвэл cos x) тэнцэтгэл бишийг f монотон байх [A; B] завсарт бодно (хил нь стандарт утгууд).
//     f монотон тул шийд нэг завсар: хил нь f = lo, f = hi цэгүүд (⋖ = ≤ бол орно) эсвэл [A; B]-ийн ирмэг (тэнцэтгэл биш биелбэл орно).
//     Тооцоо: 7.5° алхамтай цэгүүдэд гишүүнчлэлийг яг (стандарт өнцөгт индексээр) шалгаж, хил 15°-ын үржвэр дээр байдгийг ашиглан
//     нээлттэй/хаалттай төгсгөлийг тогтооно. Шийдийн нэг төгсгөл нь [A; B]-ийн дотор байна (бүх завсар биш).
var p63_V = [['-1', -1], ['-\\frac{\\sqrt{3}}{2}', -Math.sqrt(3) / 2], ['-\\frac{\\sqrt{2}}{2}', -Math.SQRT2 / 2], ['-\\frac{1}{2}', -0.5], ['0', 0],
  ['\\frac{1}{2}', 0.5], ['\\frac{\\sqrt{2}}{2}', Math.SQRT2 / 2], ['\\frac{\\sqrt{3}}{2}', Math.sqrt(3) / 2], ['1', 1]];
var p63_S = { 0: 4, 30: 5, 45: 6, 60: 7, 90: 8, 120: 7, 135: 6, 150: 5, 180: 4, 210: 3, 225: 2, 240: 1, 270: 0, 300: 1, 315: 2, 330: 3 };
var p63_I = { s: [[-90, 90], [90, 270], [0, 90], [90, 180], [90, 180], [180, 270], [270, 360], [-90, 0], [-180, -90]],
  c: [[0, 180], [180, 360], [0, 90], [90, 180], [180, 270], [270, 360], [-180, 0], [-90, 0], [-180, -90]] };
function p63_idx(f, t) { var u = f === 's' ? t : 90 - t; u = ((u % 360) + 360) % 360; return u in p63_S ? p63_S[u] : -1; }
function p63_in(f, t, lo, sl, hi, sh) {
  var i = p63_idx(f, t), v;
  if (i >= 0) return (sl ? i > lo : i >= lo) && (sh ? i < hi : i <= hi);
  v = f === 's' ? Math.sin(t * Math.PI / 180) : Math.cos(t * Math.PI / 180);   // стандарт биш өнцөгт хилтэй тэнцэхгүй
  return v > p63_V[lo][1] && v < p63_V[hi][1];
}
function p63_ang(t, cmd) {
  if (t === 0) return '0';
  var g = gcd(t, 180), n = t / g, d = 180 / g, s = n < 0 ? '-' : '', a = Math.abs(n), num = (a === 1 ? '' : a) + '\\pi';
  return d === 1 ? s + num : s + '\\' + cmd + '{' + num + '}{' + d + '}';
}
function p63() {
  var f = rnd(1, 10) <= 7 ? 's' : 'c', I = pick(p63_I[f]), A = I[0], B = I[1];
  var lo = rnd(0, 7), hi = rnd(lo + 1, 8), sl = rnd(1, 3) > 1, sh = rnd(1, 3) > 1;   // true → хатуу (<)
  if ((lo === 0 && !sl) || (hi === 8 && !sh)) return null;                       // −1 ≤ f, f ≤ 1 — үргэлж үнэн
  var pts = [], mem = [], t, i;
  for (t = A; t <= B; t += 7.5) { pts.push(t); mem.push(p63_in(f, t, lo, sl, hi, sh)); }
  var i0 = mem.indexOf(true), i1 = mem.lastIndexOf(true);
  if (i0 < 0) return null;
  for (i = i0; i <= i1; i++) if (!mem[i]) return null;
  var Lo = pts[i0] % 15 !== 0, Ro = pts[i1] % 15 !== 0, Lv = Lo ? pts[i0] - 7.5 : pts[i0], Rv = Ro ? pts[i1] + 7.5 : pts[i1];
  if (!(Lv < Rv) || (Lv === A && Rv === B)) return null;
  var fx = f === 's' ? '\\sin x' : '\\cos x', S = function (st) { return st ? '\\lt ' : '\\le '; };
  return {
    q: '$' + p63_V[lo][0] + S(sl) + fx + S(sh) + p63_V[hi][0] + '$ тэнцэтгэл бишийн $\\left[' + p63_ang(A, 'frac') + ';\\,' + p63_ang(B, 'frac')
      + '\\right]$ завсар дахь шийдийн олонлогийг олоорой.',
    a: '$' + p63_ang(Lv, 'dfrac') + S(Lo) + 'x' + S(Ro) + p63_ang(Rv, 'dfrac') + '$',
    wk: 24,
    t: { f: f, A: A, B: B, lo: lo, hi: hi, sl: sl, sh: sh }
  };
}

// 64. Катетууд m:n ⇒ mt, nt;  S = mnt²/2 ⇒ t² = 2S/(mn);  гипотенуз c² = (m² + n²)t² — багтаасан тойргийн диаметр.
//     Дугуйн талбай πc²/4 = π(m² + n²)S/(2mn): S-ийг 2mn/ХИЕХ(m² + n², 2mn)-ийн үржвэрээр сонгож хариуг бүхэл·π болгоно.
function p64() {
  var m = rnd(1, 5), n = rnd(m + 1, 7);
  if (gcd(m, n) !== 1) return null;

// 74. 3 үл мэдэгдэгчтэй шугаман систем (Гауссын арга): бүхэл шийд (x; y; z) ∈ [−5; 5]³, коэффициент ±1..±4 (заримдаа нэг нь 0),
//     тодорхойлогч ≠ 0 (|det| ≤ 60), мөр бүрт ±1 коэффициент (арилгахад хялбар), баруун тал |b| ≤ 20.
//     Гишүүдийн дараалал мөр бүрт санамсаргүй — эх шиг холимог (ядаж 2 мөр x, y, z дараалалгүй).

// 75. Хагас өнцгийн томьёо: θ = arcsin s (cos θ = p/q ≥ 0, s = ±√(q² − p²)/q) эсвэл θ = arccos c (c = ±p/q).

//     arcsin-ийн үед θ/2 ∈ [−π/4; π/4] (sin, tg-ийн тэмдэг = s-ийн тэмдэг), arccos-ийн үед θ/2 ∈ [0; π/2] (эерэг).

  var L = [], p, q;

// 76. ABCD квадрат (заримдаа тэгш өнцөгт) — оройнууд, талуудын дундаж цэгүүд, төвөөс 3 цэг (нэг шулуун дээр биш) сонгож,
//     тэдгээрийг дайрсан тойргийн радиус R = abc/(4S)-ийг координатаар (давхарласан бүхэл координат, яг бутархай R²) олно.

//     Жагсаалтын сүүлийн нэрийг заахын тийн ялгалтай (оройг, төвийг, дундаж цэгийг) бичнэ.
var p76_V = ['A', 'B', 'C', 'D'], p76_S = ['AB', 'BC', 'CD', 'DA'];
function p76_pts(a, b) {   // давхарласан координат: A(0;0), B(2a;0), C(2a;2b), D(0;2b), талын дундаж, төв O(a;b)
  var P = { A: [0, 0], B: [2 * a, 0], C: [2 * a, 2 * b], D: [0, 2 * b], O: [a, b] };
  p76_S.forEach(function (s) { var u = P[s[0]], v = P[s[1]]; P[s] = [(u[0] + v[0]) / 2, (u[1] + v[1]) / 2]; });
  return P;
}
function p76() {
  var sq = rnd(0, 3) > 0, a = pick([2, 4, 4, 6, 6, 8, 8, 10, 12, 3, 5, 9]), b = sq ? a : pick([2, 3, 4, 5, 6, 8, 10, 12]), names;

  var fig = sq ? 'квадратын' : 'тэгш өнцөгтийн', mids = names.filter(function (n) { return n.length === 2; }), ver = names.filter(function (n) { return n.length === 1 && n !== 'O'; });
  var items = [], tx = function (L) { return L.map(function (n) { return '$' + n + '$'; }).join(', '); };
  if (mids.length) items.push(mids.length === 1 ? [tx(mids) + ' талын дундаж', tx(mids) + ' талын дундаж цэгийг'] : [tx(mids) + ' талуудын дундаж цэгүүд', tx(mids) + ' талуудын дундаж цэгүүдийг']);
  if (names.indexOf('O') >= 0) items.push(items.length ? [fig + ' төв', fig + ' төвийг'] : ['төв', 'төвийг']);   // эхэнд бол «квадратын» давтахгүй

    q: head + list + ' дайрсан тойргийн радиусыг олоорой.',

// 77. Холимог: p%-ийн m гр уусмал дээр r%-ийн x гр уусмал нэмж концентрацийг d хувиар (p ± d хүртэл) өөрчилнө:

function p77() {
  var up = rnd(0, 3) > 0, p = pick([5, 8, 10, 12, 15, 16, 18, 20, 24, 25, 30, 35, 40, 45]), d = rnd(2, 10), r;
  var m = pick([10, 12, 15, 16, 18, 20, 24, 25, 27, 30, 32, 36, 40, 45, 48, 50, 54, 60, 64, 72, 75, 80, 90, 96, 100, 120, 150, 200]);

// 78. f(x) = ax² + bx + c ⇒ f(x+1) − f(x) = 2ax + (a + b). Өгсөн: ялгавар Px + Q, f(x₀) = v.

  return {
    q: head + (x1 === null ? '$f(x)$-ийг олоорой.' : '$f(' + x1 + ')=?$'),

}

// 79. a ба b талтай тэгш өнцөгтийг a талыг нь тойруулбал V₁ = πb²a, b талыг нь тойруулбал V₂ = πa²b ⇒ V₁ : V₂ = b : a.

// 80. Хайрцагт T (2 эсвэл 3) төрлийн чихэр, i-р төрлийнх nᵢ ширхэг (N = Σnᵢ); таамгаар 2 ширхгийг авах C_N^2 боломж.
