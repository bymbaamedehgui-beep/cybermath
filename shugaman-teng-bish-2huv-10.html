<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Хоёр хувьсагчтай шугаман тэнцэтгэл биш ба систем (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:10px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
  .g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px}
  .card{break-inside:avoid;page-break-inside:avoid;border:1px solid #eee7fb;border-radius:9px;padding:7px 8px;background:linear-gradient(#fff,#fcfbff)}
  .card .cn{font-weight:800;color:var(--purple);font-size:12.5px;margin-bottom:3px}
  .gsvg{width:100%;height:auto;display:block}
  .aline{margin-top:5px;font-size:11px;color:var(--soft)}.aline b{color:var(--ink);border-bottom:1px solid #cdbff0;padding:0 34px}
  .sys{font-size:14px;margin:2px 0 6px;text-align:center}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  .ans-sys{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:12px}
  .ans-sys .card{max-width:70mm}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
// ---- график тохиргоо ----
var VB=210,P=10,W={x0:-6,x1:6,y0:-6,y1:6};
function Xc(w,x){return P+(x-w.x0)/(w.x1-w.x0)*(VB-2*P);}
function Yc(w,y){return VB-P-(y-w.y0)/(w.y1-w.y0)*(VB-2*P);}
function boxPoly(w){return [[w.x0,w.y0],[w.x1,w.y0],[w.x1,w.y1],[w.x0,w.y1]];}
function sideVal(hp,x,y){return hp.A*x+hp.B*y-hp.C;}
function clipPoly(poly,hp){var res=[];for(var i=0;i<poly.length;i++){var A=poly[i],B=poly[(i+1)%poly.length];var sa=sideVal(hp,A[0],A[1]),sb=sideVal(hp,B[0],B[1]);var ina=hp.ge?sa>=-1e-9:sa<=1e-9;var inb=hp.ge?sb>=-1e-9:sb<=1e-9;if(ina)res.push(A);if(ina!==inb&&sa!==sb){var t=sa/(sa-sb);res.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}}return res;}
function areaP(poly){var a=0;for(var i=0;i<poly.length;i++){var A=poly[i],B=poly[(i+1)%poly.length];a+=A[0]*B[1]-B[0]*A[1];}return Math.abs(a)/2;}
function gridSvg(w){var s='',x,y,x0=Xc(w,0),y0=Yc(w,0);
  for(x=Math.ceil(w.x0);x<=Math.floor(w.x1);x++){var xp=Xc(w,x).toFixed(1);s+='<line x1="'+xp+'" y1="'+Yc(w,w.y0).toFixed(1)+'" x2="'+xp+'" y2="'+Yc(w,w.y1).toFixed(1)+'" stroke="#e7e1f5" stroke-width="0.6"/>';}
  for(y=Math.ceil(w.y0);y<=Math.floor(w.y1);y++){var yp=Yc(w,y).toFixed(1);s+='<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+yp+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+yp+'" stroke="#e7e1f5" stroke-width="0.6"/>';}
  s+='<line x1="'+Xc(w,w.x0).toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+Xc(w,w.x1).toFixed(1)+'" y2="'+y0.toFixed(1)+'" stroke="#4a4470" stroke-width="1.3"/>';
  s+='<line x1="'+x0.toFixed(1)+'" y1="'+Yc(w,w.y0).toFixed(1)+'" x2="'+x0.toFixed(1)+'" y2="'+Yc(w,w.y1).toFixed(1)+'" stroke="#4a4470" stroke-width="1.3"/>';
  s+='<polygon points="'+Xc(w,w.x1).toFixed(1)+','+y0.toFixed(1)+' '+(Xc(w,w.x1)-5).toFixed(1)+','+(y0-3).toFixed(1)+' '+(Xc(w,w.x1)-5).toFixed(1)+','+(y0+3).toFixed(1)+'" fill="#4a4470"/>';
  s+='<polygon points="'+x0.toFixed(1)+','+Yc(w,w.y1).toFixed(1)+' '+(x0-3).toFixed(1)+','+(Yc(w,w.y1)+5).toFixed(1)+' '+(x0+3).toFixed(1)+','+(Yc(w,w.y1)+5).toFixed(1)+'" fill="#4a4470"/>';
  for(x=w.x0+2;x<=w.x1-1;x+=2){if(x===0)continue;s+='<text x="'+Xc(w,x).toFixed(1)+'" y="'+(y0+8).toFixed(1)+'" font-size="6.5" fill="#8a83a5" text-anchor="middle">'+x+'</text>';}
  for(y=w.y0+2;y<=w.y1-1;y+=2){if(y===0)continue;s+='<text x="'+(x0-4).toFixed(1)+'" y="'+(Yc(w,y)+2.3).toFixed(1)+'" font-size="6.5" fill="#8a83a5" text-anchor="end">'+y+'</text>';}
  s+='<text x="'+(Xc(w,w.x1)-1).toFixed(1)+'" y="'+(y0+9).toFixed(1)+'" font-size="7" fill="#4a4470" font-style="italic">x</text>';
  s+='<text x="'+(x0+4).toFixed(1)+'" y="'+(Yc(w,w.y1)+7).toFixed(1)+'" font-size="7" fill="#4a4470" font-style="italic">y</text>';
  return s;}
function shadeSvg(w,hps){var poly=boxPoly(w);for(var i=0;i<hps.length;i++)poly=clipPoly(poly,hps[i]);if(poly.length<3)return '';
  return '<polygon points="'+poly.map(function(p){return Xc(w,p[0]).toFixed(1)+','+Yc(w,p[1]).toFixed(1);}).join(' ')+'" fill="rgba(123,82,238,0.20)"/>';}
function lineSvg(w,hp){var box=boxPoly(w),pts=[];for(var i=0;i<4;i++){var A=box[i],B=box[(i+1)%4];var sa=sideVal(hp,A[0],A[1]),sb=sideVal(hp,B[0],B[1]);if(sa===sb)continue;if((sa<=0&&sb>=0)||(sa>=0&&sb<=0)){var t=sa/(sa-sb);pts.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}}if(pts.length<2)return '';
  var d=hp.strict?' stroke-dasharray="4 2.5"':'';
  return '<line x1="'+Xc(w,pts[0][0]).toFixed(1)+'" y1="'+Yc(w,pts[0][1]).toFixed(1)+'" x2="'+Xc(w,pts[1][0]).toFixed(1)+'" y2="'+Yc(w,pts[1][1]).toFixed(1)+'" stroke="#7B52EE" stroke-width="1.7"'+d+'/>';}
function svgWrap(inner){return '<svg class="gsvg" viewBox="0 0 '+VB+' '+VB+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';}
// ---- тэнцэтгэл бишийн текст ----
function opTex(ge,strict){return ge?(strict?'\\gt':'\\geq'):(strict?'\\lt':'\\leq');}
function mterm(m){return m===1?'x':(m===-1?'-x':m+'x');}
function bterm(b){return b===0?'':(b>0?'+'+b:'-'+(-b));}
function coefT(k,v){return k===1?v:(k===-1?'-'+v:k+v);}
function addT(k,v){if(k>0)return '+'+(k===1?'':k)+v;return '-'+(k===-1?'':-k)+v;}
function supPick(){var s=pick(['gt','lt','ge','le']);return {ge:(s==='gt'||s==='ge'),strict:(s==='gt'||s==='lt')};}
function gSlope(){var m=pick([-2,-1,1,2]),b=nz(-4,4),o=supPick();
  return {hp:{A:-m,B:1,C:b,ge:o.ge,strict:o.strict},tex:'y '+opTex(o.ge,o.strict)+' '+mterm(m)+bterm(b)};}
function gHoriz(){var c=nz(-4,4),o=supPick();return {hp:{A:0,B:1,C:c,ge:o.ge,strict:o.strict},tex:'y '+opTex(o.ge,o.strict)+' '+c};}
function gVert(){var c=nz(-4,4),o=supPick();return {hp:{A:1,B:0,C:c,ge:o.ge,strict:o.strict},tex:'x '+opTex(o.ge,o.strict)+' '+c};}
function gStd(){var xi=nz(-5,5),yi=nz(-5,5),A=yi,B=xi,C=xi*yi,g=gcd(gcd(A,B),C)||1;A/=g;B/=g;C/=g;if(A<0){A=-A;B=-B;C=-C;}var o=supPick();
  return {hp:{A:A,B:B,C:C,ge:o.ge,strict:o.strict},tex:coefT(A,'x')+addT(B,'y')+' '+opTex(o.ge,o.strict)+' '+C};}
function build(){
  var seen={},read=[],pool=[[gSlope,2],[gStd,2],[gHoriz,1],[gVert,1]];
  pool.forEach(function(pr){var fn=pr[0],n=pr[1],c=0,tr=0;while(c<n&&tr++<400){var f=fn();if(seen[f.tex])continue;seen[f.tex]=1;read.push(f);c++;}});
  // холих
  for(var i=read.length-1;i>0;i--){var j=rnd(0,i),t=read[i];read[i]=read[j];read[j]=t;}
  // системүүд
  var sys=[],st=0;
  while(sys.length<2&&st++<3000){var a=pick([gSlope,gHoriz,gVert])(),b=pick([gSlope,gHoriz,gVert])();
    if(a.tex===b.tex)continue;var poly=clipPoly(clipPoly(boxPoly(W),a.hp),b.hp),ar=areaP(poly);
    if(poly.length<3||ar<14||ar>120)continue;
    var a1=areaP(clipPoly(boxPoly(W),a.hp)),a2=areaP(clipPoly(boxPoly(W),b.hp));
    if(ar>a1-2||ar>a2-2)continue; // хоёул идэвхтэй байх
    sys.push({a:a,b:b});}
  var K=0;window.__A=[];
  var c1=read.map(function(f){var k=K++;window.__A.push({tex:f.tex,k:k});
    return '<div class="card"><div class="cn">'+(k+1)+'.</div>'+svgWrap(gridSvg(W)+shadeSvg(W,[f.hp])+lineSvg(W,f.hp))+'<div class="aline">Тэнцэтгэл биш: <b>&nbsp;</b></div></div>';}).join('');
  var c2=sys.map(function(s){var k=K++;
    return '<div class="card"><div class="cn">'+(k+1)+'.</div><div class="sys">$\\begin{cases}'+s.a.tex+'\\\\ '+s.b.tex+'\\end{cases}$</div>'+svgWrap(gridSvg(W))+'</div>';}).join('');
  var ansI='<div class="ans-grid">'+window.__A.map(function(a){return '<div class="a"><span class="an">'+(a.k+1)+'.</span><span>$'+a.tex+'$</span></div>';}).join('')+'</div>';
  var ansS='<div class="ans-sys">'+sys.map(function(s,idx){var k=read.length+idx;
    return '<div class="card"><div class="cn">'+(k+1)+'.</div>'+svgWrap(gridSvg(W)+shadeSvg(W,[s.a.hp,s.b.hp])+lineSvg(W,s.a.hp)+lineSvg(W,s.b.hp))+'</div>';}).join('')+'</div>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Хоёр хувьсагчтай шугаман тэнцэтгэл биш ба систем</h1><div class="sub">Хагас хавтгай · шийдийн муж · тэнцэтгэл бишийн систем · 6.4 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Хатуу тэнцэтгэл бишид ($\\lt,\\gt$) хилийн шугамыг тасархайгаар, хатуу бус ($\\leq,\\geq$)-д битүү шугамаар зурна. $y\\gt mx+c$ дээш, $y\\lt mx+c$ доош хагас хавтгай.</div>'
    +'<div class="task">1. Зураг дээрх будсан хагас хавтгайг илэрхийлэх тэнцэтгэл бишийг бич.</div><div class="g3">'+c1+'</div>'
    +'<div class="task">2. Дараах системийн шийдийн мужийг координатын хавтгайд дүрсэл.</div><div class="g2">'+c2+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2>'+ansI+ansS+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Хоёр хувьсагчтай шугаман тэнцэтгэл биш ба систем (10-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=39"></script>
</body>
</html>
