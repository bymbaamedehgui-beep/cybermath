<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Рационал илтгэгчтэй алгебрын илэрхийлэл — Түвшин 2 (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
  .grid.cols2{grid-template-columns:1fr 1fr;gap:9px 18px}
  /* Бодолттой үед: trim хийсний дараа 2 багана болгож нягт багцлана (эхний багана нэгээр илүү) */
  .grid.packed{display:flex;gap:18px;align-items:flex-start}
  .grid.packed .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:15px}
  .work{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff)}
  .work.md{height:20mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
window.WS_HAS_WORK=true;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var LAB=['а','б','в','г','д','е','ё','ж','з','и','й','к','л','м','н','о','п','р','с','т'];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function frac(p,q){if(q<0){p=-p;q=-q;}var g=gcd(Math.abs(p),q)||1;return {p:p/g,q:q/g};}
function fv(f){return f.p/f.q;}
function ftx(f){if(f.q===1)return ''+f.p;return (f.p<0?'-':'')+'\\tfrac{'+Math.abs(f.p)+'}{'+f.q+'}';}
// рационал илтгэгчийг язгуураар бичнэ: 1/2→√, 1/3→∛, 3/2→v√v гэх мэт
function vp(v,f){if(f.p===0)return '1';var neg=f.p<0,p=Math.abs(f.p),q=f.q,body;
  if(q===1){body=(p===1)?v:(v+'^{'+p+'}');}
  else{var whole=Math.floor(p/q),rem=p-whole*q,inside=(rem===1)?v:(v+'^{'+rem+'}'),radp=(q===2)?('\\sqrt{'+inside+'}'):('\\sqrt['+q+']{'+inside+'}');body=(whole===0)?radp:((whole===1)?(v+radp):(v+'^{'+whole+'}'+radp));}
  return neg?('\\dfrac{1}{'+body+'}'):body;}
function cN(n,t){return (n===1?'':''+n)+t;}
function dbl(f){return frac(2*f.p,f.q);}
function trip(f){return frac(3*f.p,f.q);}
function rv(){return 1.25+Math.random()*3.2;}
function pair(){return pick([['x','y'],['a','b'],['u','v'],['m','n'],['p','q']]);}
function expH(){return frac(1,pick([2,2,3]));}

// 1) Хаалт задлаад ижил гишүүд нэгтгэ (хураагдана)
function gExpand(){
  var mode=pick(['cross','fiveM','inv']);
  if(mode==='cross'){
    var pr=pair(),u=pr[0],w=pr[1],p=expH(),q=expH(),k=nz(2,5);
    // (u^p - k w^q)^2 + 2k u^p w^q = u^{2p} + k^2 w^{2q}
    var qtx='\\left('+vp(u,p)+' - '+(k===1?'':k)+vp(w,q)+'\\right)^{2} + '+(2*k)+vp(u,p)+vp(w,q);
    var atx=vp(u,dbl(p))+' + '+(k*k)+vp(w,dbl(q));
    var qf=function(a,b){return Math.pow(Math.pow(a,fv(p))-k*Math.pow(b,fv(q)),2)+2*k*Math.pow(a,fv(p))*Math.pow(b,fv(q));};
    var af=function(a,b){return Math.pow(a,fv(dbl(p)))+k*k*Math.pow(b,fv(dbl(q)));};
    for(var t=0;t<4;t++){var a=rv(),b=rv();if(Math.abs(qf(a,b)-af(a,b))>1e-6*Math.max(1,Math.abs(qf(a,b))))return null;}
    return {q:qtx,a:atx,ok:true};
  }
  if(mode==='fiveM'){
    var v=pick(['x','y','a','z','t','m']),pp=expH(),C=nz(2,7);
    // 2C v^p + (C - v^p)^2 - v^{2p} = C^2
    var q2=(2*C)+vp(v,pp)+' + \\left('+C+' - '+vp(v,pp)+'\\right)^{2} - '+vp(v,dbl(pp));
    var a2=''+(C*C);
    var qf2=function(x){return 2*C*Math.pow(x,fv(pp))+Math.pow(C-Math.pow(x,fv(pp)),2)-Math.pow(x,fv(dbl(pp)));};
    for(var t2=0;t2<4;t2++){var x=rv();if(Math.abs(qf2(x)-C*C)>1e-6*Math.max(1,C*C))return null;}
    return {q:q2,a:a2,ok:true};
  }
  var v3=pick(['x','y','a','b','m','t']),p3=expH();
  // (v^p + 1/v^p)^2 - 2 = v^{2p} + 1/v^{2p}
  var q3='\\left('+vp(v3,p3)+' + \\dfrac{1}{'+vp(v3,p3)+'}\\right)^{2} - 2';
  var a3=vp(v3,dbl(p3))+' + \\dfrac{1}{'+vp(v3,dbl(p3))+'}';
  var qf3=function(x){var t=Math.pow(x,fv(p3));return Math.pow(t+1/t,2)-2;},af3=function(x){var t=Math.pow(x,fv(dbl(p3)));return t+1/t;};
  for(var t3=0;t3<4;t3++){var x3=rv();if(Math.abs(qf3(x3)-af3(x3))>1e-6*Math.max(1,Math.abs(qf3(x3))))return null;}
  return {q:q3,a:a3,ok:true};
}
// 2) Куб томьёо: (a±b)(a²∓ab+b²)=a³±b³, a=u^p, b=k·w^q
function gCubes(){
  var pr=pair(),u=pr[0],w=pr[1],p=frac(1,pick([2,3])),q=frac(1,pick([2,3])),k=pick([1,1,2,3]),s=pick([1,-1]);
  var f1='\\left('+vp(u,p)+(s<0?' - ':' + ')+cN(k,vp(w,q))+'\\right)';
  var mid=cN(k,vp(u,p)+vp(w,q));
  var f2='\\left('+vp(u,dbl(p))+(s<0?' + ':' - ')+mid+' + '+cN(k*k,vp(w,dbl(q)))+'\\right)';
  var a=vp(u,trip(p))+(s<0?' - ':' + ')+cN(k*k*k,vp(w,trip(q)));
  var qf=function(av,bv){var A=Math.pow(av,fv(p)),B=k*Math.pow(bv,fv(q));return (A+s*B)*(A*A - s*A*B + B*B);};
  var af=function(av,bv){return Math.pow(av,fv(trip(p)))+s*(k*k*k)*Math.pow(bv,fv(trip(q)));};
  for(var t=0;t<4;t++){var a1=rv(),b1=rv();if(Math.abs(qf(a1,b1)-af(a1,b1))>1e-6*Math.max(1,Math.abs(qf(a1,b1))))return null;}
  return {q:f1+f2,a:a,ok:true};
}
// 3) Хуваарийг язгуураас чөлөөл (хосмогоор)
function gRat(){
  var mode=pick(['numVar','numConst','ratio']);
  if(mode==='numVar'){
    var pr=pair(),u=pr[0],w=pr[1],N=nz(2,9),s=pick([1,-1]);
    // N/(u^{1/2} ± w^{1/2}) = N(u^{1/2} ∓ w^{1/2})/(u-w)
    var h=frac(1,2);
    var q='\\dfrac{'+N+'}{'+vp(u,h)+(s<0?' - ':' + ')+vp(w,h)+'}';
    var a='\\dfrac{'+N+'\\left('+vp(u,h)+(s<0?' + ':' - ')+vp(w,h)+'\\right)}{'+u+' - '+w+'}';
    var qf=function(av,bv){return N/(Math.sqrt(av)+s*Math.sqrt(bv));},af=function(av,bv){return N*(Math.sqrt(av)-s*Math.sqrt(bv))/(av-bv);};
    for(var t=0;t<5;t++){var av=rv(),bv=rv();if(Math.abs(av-bv)<0.3){bv+=1;}if(Math.abs(qf(av,bv)-af(av,bv))>1e-6*Math.max(1,Math.abs(qf(av,bv))))return null;}
    return {q:q,a:a,ok:true};
  }
  if(mode==='numConst'){
    var v=pick(['x','y','a','b','p','q','t']),N2=nz(2,9),k=nz(2,6),s2=pick([1,-1]),h2=frac(1,2);
    // N/(v^{1/2} ± k) = N(v^{1/2} ∓ k)/(v - k^2)
    var q2='\\dfrac{'+N2+'}{'+vp(v,h2)+(s2<0?' - ':' + ')+k+'}';
    var a2='\\dfrac{'+N2+'\\left('+vp(v,h2)+(s2<0?' + ':' - ')+k+'\\right)}{'+v+' - '+(k*k)+'}';
    var qf2=function(x){return N2/(Math.sqrt(x)+s2*k);},af2=function(x){return N2*(Math.sqrt(x)-s2*k)/(x-k*k);};
    for(var t2=0;t2<5;t2++){var x=rv()+k*k*Math.random();if(Math.abs(x-k*k)<0.3)x+=1;if(Math.abs(qf2(x)-af2(x))>1e-6*Math.max(1,Math.abs(qf2(x))))return null;}
    return {q:q2,a:a2,ok:true};
  }
  var pr3=pair(),u3=pr3[0],w3=pr3[1],h3=frac(1,2),s3=pick([1,-1]);
  // (u^{1/2}+w^{1/2})/(u^{1/2}-w^{1/2}) = (u + 2 u^{1/2}w^{1/2} + w)/(u-w)  (s3=+ дээд)
  var top='\\dfrac{'+vp(u3,h3)+(s3<0?' - ':' + ')+vp(w3,h3)+'}{'+vp(u3,h3)+(s3<0?' + ':' - ')+vp(w3,h3)+'}';
  var a3='\\dfrac{'+u3+(s3<0?' - ':' + ')+'2'+vp(u3,h3)+vp(w3,h3)+' + '+w3+'}{'+u3+' - '+w3+'}';
  var qf3=function(av,bv){return (Math.sqrt(av)+s3*Math.sqrt(bv))/(Math.sqrt(av)-s3*Math.sqrt(bv));};
  var af3=function(av,bv){return (av+s3*2*Math.sqrt(av)*Math.sqrt(bv)+bv)/(av-bv);};
  for(var t3=0;t3<5;t3++){var av=rv(),bv=rv();if(Math.abs(av-bv)<0.3)bv+=1;if(Math.abs(qf3(av,bv)-af3(av,bv))>1e-6*Math.max(1,Math.abs(qf3(av,bv))))return null;}
  return {q:top,a:a3,ok:true};
}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var qs=sheet.querySelectorAll('.grid .q');for(var i=0;i<qs.length;i++){var el=qs[i].querySelector('.ql');if(el)el.textContent=(i+1)+'.';}var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var e2=as[j].querySelector('.an');if(e2)e2.textContent=(j+1)+'.';}}
function trimToFitBalanced(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<300){var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>4){bestN=n;best=s;}}if(best<0)break;var qs=grids[best].querySelectorAll('.q'),last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function packColumns(sheet){
  [].forEach.call(sheet.querySelectorAll('.grid'),function(g){
    if(g.classList.contains('packed'))return;
    var qs=[].slice.call(g.children).filter(function(c){return c.classList&&c.classList.contains('q');});
    if(qs.length<2)return;
    var half=Math.ceil(qs.length/2),c1=document.createElement('div'),c2=document.createElement('div');
    c1.className='col';c2.className='col';
    qs.forEach(function(q,i){(i<half?c1:c2).appendChild(q);});
    g.appendChild(c1);g.appendChild(c2);g.classList.add('packed');
  });
}
function build(){
  var WORK=!!window.WS_WORK;
  var S=[[],[],[]],seen={};window.__PROB=[];
  function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<1600){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;S[idx].push(f);c++;}}
  var per=WORK?10:14;
  fill(0,gExpand,per);fill(1,gCubes,per);fill(2,gRat,per);
  var gcls='',K=0;   // үргэлж 2 багана
  function block(arr,sec){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'" data-sec="'+sec+'"><div class="qeq"><span class="ql"></span><span class="qm">$'+f.q+'$</span></div>'+(WORK?'<div class="work md"></div>':'')+'</div>';}).join('');}
  var b1=block(S[0],1),b2=block(S[1],2),b3=block(S[2],3);
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>$'+p.f.a+'$</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Рационал илтгэгчтэй алгебрын илэрхийлэл — Түвшин 2</h1><div class="sub">Хаалт задлаад нэгтгэх · куб томьёо · хуваарийг чөлөөлөх · 3.1 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$(a\\pm b)^{2}=a^{2}\\pm2ab+b^{2}$ &nbsp;·&nbsp; $a^{3}\\pm b^{3}=(a\\pm b)(a^{2}\\mp ab+b^{2})$ &nbsp;·&nbsp; хосмог үржүүлж хуваарийг чөлөөл &nbsp;·&nbsp; $x,y>0$</div>'
    +'<div class="task">1. Хаалтыг задалж, ижил гишүүдийг нэгтгэн хялбарчил.</div>'
    +'<div class="grid'+gcls+'" data-sec="1">'+b1+'</div>'
    +'<div class="task">2. Куб томьёо ашиглан үржвэрийг ол.</div>'
    +'<div class="grid'+gcls+'" data-sec="2">'+b2+'</div>'
    +'<div class="task">3. Бутархайн хуваарийг язгуураас чөлөөл.</div>'
    +'<div class="grid'+gcls+'" data-sec="3">'+b3+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Рационал илтгэгчтэй алгебрын илэрхийлэл — Түвшин 2 (10-р анги)';
  relabel(document.getElementById('sheet'));
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFitBalanced(document.getElementById('sheet'),1035);}catch(e){}
  try{packColumns(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=38"></script>
</body>
</html>
