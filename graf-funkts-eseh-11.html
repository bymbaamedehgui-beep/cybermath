<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Муруй функцийн график мөн эсэхийг тогтоох (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px 14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:12.5px}
  .gc{text-align:center;margin-top:4px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:16mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function drawCurve(type){var W=126,H=114,U=15,cx=W/2,cy=H/2;function PX(x){return cx+x*U;}function PY(y){return cy-y*U;}
  var g='<line x1="2" y1="'+cy+'" x2="'+(W-2)+'" y2="'+cy+'" stroke="#999" stroke-width="1"/><line x1="'+cx+'" y1="2" x2="'+cx+'" y2="'+(H-2)+'" stroke="#999" stroke-width="1"/>';
  function plot(f,xmin,xmax){var d='',pen=false;for(var i=0;i<=90;i++){var x=xmin+(xmax-xmin)*i/90,y=f(x);if(!isFinite(y)||Math.abs(y)>3.4){pen=false;continue;}d+=(pen?'L':'M')+PX(x).toFixed(1)+' '+PY(y).toFixed(1)+' ';pen=true;}return d;}
  function param(fx,fy,t0,t1){var d='';for(var i=0;i<=90;i++){var t=t0+(t1-t0)*i/90;d+=(i?'L':'M')+PX(fx(t)).toFixed(1)+' '+PY(fy(t)).toFixed(1)+' ';}return d;}
  var vx=1,dots=[],isFunc,path='';
  if(type==='parabola'){path=plot(function(x){return x*x-1.4;},-2,2);vx=0.9;isFunc=true;dots=[[0.9,0.9*0.9-1.4]];}
  else if(type==='cubic'){path=plot(function(x){return x*x*x;},-1.55,1.55);vx=1;isFunc=true;dots=[[1,1]];}
  else if(type==='line'){var k=pick([0.8,-0.8,1.1]);path=plot(function(x){return k*x+0.4;},-3,3);vx=1.3;isFunc=true;dots=[[1.3,k*1.3+0.4]];}
  else if(type==='sqrt'){path=plot(function(x){return Math.sqrt(x)-0.7;},0,3.3);vx=1.6;isFunc=true;dots=[[1.6,Math.sqrt(1.6)-0.7]];}
  else if(type==='hyper'){path=plot(function(x){return 1/x;},0.34,3)+plot(function(x){return 1/x;},-3,-0.34);vx=1.3;isFunc=true;dots=[[1.3,1/1.3]];}
  else if(type==='circle'){var R=1.7;g+='<circle cx="'+PX(0)+'" cy="'+PY(0)+'" r="'+(R*U).toFixed(1)+'" fill="none" stroke="#16a34a" stroke-width="1.9"/>';vx=0.8;isFunc=false;var yy=Math.sqrt(R*R-0.64);dots=[[0.8,yy],[0.8,-yy]];}
  else if(type==='sideparab'){path=param(function(t){return t*t-1.4;},function(t){return t;},-1.9,1.9);vx=0.5;isFunc=false;var yy2=Math.sqrt(1.9);dots=[[0.5,yy2],[0.5,-yy2]];}
  else if(type==='ellipse'){var rx=2.1,ry=1.3;g+='<ellipse cx="'+PX(0)+'" cy="'+PY(0)+'" rx="'+(rx*U).toFixed(1)+'" ry="'+(ry*U).toFixed(1)+'" fill="none" stroke="#16a34a" stroke-width="1.9"/>';vx=0.7;isFunc=false;var yy3=ry*Math.sqrt(1-0.7*0.7/(rx*rx));dots=[[0.7,yy3],[0.7,-yy3]];}
  else{g+='<line x1="'+PX(1)+'" y1="6" x2="'+PX(1)+'" y2="'+(H-6)+'" stroke="#16a34a" stroke-width="2"/>';vx=1;isFunc=false;dots=[];}
  if(path)g+='<path d="'+path+'" fill="none" stroke="#16a34a" stroke-width="1.9"/>';
  g+='<line x1="'+PX(vx).toFixed(1)+'" y1="4" x2="'+PX(vx).toFixed(1)+'" y2="'+(H-4)+'" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2"/>';
  dots.forEach(function(p){g+='<circle cx="'+PX(p[0]).toFixed(1)+'" cy="'+PY(p[1]).toFixed(1)+'" r="2.5" fill="#dc2626"/>';});
  g+='<text x="'+(W-8)+'" y="'+(cy-3)+'" font-size="8" fill="#999" font-style="italic">x</text>';
  return {svg:'<svg width="'+W+'" height="'+H+'">'+g+'</svg>',isFunc:isFunc,type:type};}
var FTYPES=['parabola','cubic','line','sqrt','hyper'],NTYPES=['circle','sideparab','ellipse','vline'];
function g_vert(){var isF=pick([true,true,false,false]);var type=isF?pick(FTYPES):pick(NTYPES);var c=drawCurve(type);
  var a=c.isFunc?'Босоо шулуун бүр муруйг <b>нэг</b> цэгт огтолно — функцийн график <b>мөн</b>.':(type==='vline'?'Босоо шулуунтай давхцаж <b>олон</b> цэгт огтолно — функцийн график <b>биш</b>.':'Босоо шулуун муруйг <b>хоёр</b> цэгт огтолно — функцийн график <b>биш</b>.');
  return {q:'Доорх муруй функцийн график мөн үү? Босоо шулуунаар шалга.<div class="gc">'+c.svg+'</div>',a:a,key:'v'+type+rnd(1,99999)};}
// Графикаас функцийн утга унших (шугаман)
function lineGraph(k,b,ax){var W=126,H=114,U=13,cx=W/2,cy=H/2;function PX(x){return cx+x*U;}function PY(y){return cy-y*U;}
  var g='<line x1="2" y1="'+cy+'" x2="'+(W-2)+'" y2="'+cy+'" stroke="#999" stroke-width="1"/><line x1="'+cx+'" y1="2" x2="'+cx+'" y2="'+(H-2)+'" stroke="#999" stroke-width="1"/>';
  var d='',pen=false;for(var i=0;i<=60;i++){var x=-4+8*i/60,y=k*x+b;if(Math.abs(y)>3.9){pen=false;continue;}d+=(pen?'L':'M')+PX(x).toFixed(1)+' '+PY(y).toFixed(1)+' ';pen=true;}
  g+='<path d="'+d+'" fill="none" stroke="#16a34a" stroke-width="1.9"/>';
  var yv=k*ax+b;g+='<line x1="'+PX(ax)+'" y1="'+PY(0)+'" x2="'+PX(ax)+'" y2="'+PY(yv)+'" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 2"/><line x1="'+PX(0)+'" y1="'+PY(yv)+'" x2="'+PX(ax)+'" y2="'+PY(yv)+'" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 2"/><circle cx="'+PX(ax)+'" cy="'+PY(yv)+'" r="2.5" fill="#dc2626"/>';
  g+='<text x="'+PX(ax)+'" y="'+(PY(0)+9)+'" font-size="8" fill="#b91c1c" text-anchor="middle">'+ax+'</text>';
  return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';}
function g_read(){var k=pick([1,-1,2,-2]),b=nz(-2,2),ax=nz(-2,2);var yv=k*ax+b;if(Math.abs(yv)>3)return null;
  return {q:'Доорх шулуун $y=f(x)$-ийн графикаас $f('+ax+')$-г ол.<div class="gc">'+lineGraph(k,b,ax)+'</div>',a:'Графикаас $f('+ax+')='+yv+'$ (шулуун $y='+(k===1?'x':k===-1?'-x':k+'x')+(b>0?'+'+b:b<0?''+b:'')+'$).',key:'r'+k+b+ax};}
function gen(fn){for(var t=0;t<200;t++){var f=fn();if(f)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р'];
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid,.grid3'),map={};for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid,.grid3'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>3){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var P=[[],[]];var seen={};function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<3000){tr++;var f=gen(fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[idx].push(f);c++;}}
  fill(0,g_vert,9);fill(1,g_read,6);return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,cls){var use=WK?arr.slice(0,cap):arr;return '<div class="'+cls+'">'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(WK&&cls==='grid'?'<div class="wk"></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Муруй функцийн график мөн эсэхийг тогтоох</h1><div class="sub">Босоо шулууны шалгуур · III бүлэг · 3.2 · 11-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule"><b>Босоо шулууны шалгуур:</b> Муруй нь функцийн график болох нь — $x=a$ хэлбэрийн <b>босоо шулуун бүр</b> муруйг <b>хамгийн ихдээ нэг</b> цэгт огтолж байвал функцийн график мөн. Хэрэв ямар нэг босоо шулуун <b>2 буюу түүнээс олон</b> цэгт огтолвол функцийн график <b>биш</b>.</div>'
    +'<div class="task">1. Дараах муруйнууд функцийн график мөн эсэхийг босоо шулуунаар тогтоо.</div>'+block(S[0],6,'grid3')
    +'<div class="task">2. Графикаас функцийн утгыг ол.</div>'+block(S[1],4,'grid')
    +'<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Муруй функцийн график мөн эсэхийг тогтоох';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
