<title>III бүлэг — Жишиг даалгавар 1 (6-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 6-р анги · III бүлэг. Харьцаа, пропорц — Жишиг даалгавар 1 (3.1 Тоог өгсөн харьцаагаар хуваах · 3.2 Пропорцын үндсэн чанар) */
function cop(a, b) { return a !== b && gcd(a, b) === 1; }

// 1. Харьцааг хялбарчлах (бүхэл тоо, нэгжтэй, аравтын бутархай)
function g1() {
  var t = rnd(1, 3);
  if (t === 1) {
    var a = rnd(1, 9), b = rnd(2, 9), k = rnd(3, 12); if (!cop(a, b)) return null;
    if (a * k > 120 || b * k > 120) return null;
    return { stem: '$' + (a * k) + ':' + (b * k) + '$', a: a + ':' + b };
  }
  if (t === 2) {
    var U = pick([['м', 'см', 100, 10], ['кг', 'г', 1000, 50], ['цаг', 'минут', 60, 5]]);
    var big = rnd(1, 4), A = big * U[2], B = U[3] * rnd(1, Math.floor(U[2] / U[3]) - 1), g = gcd(A, B);
    if (A / g > 40 || B / g > 40 || A === B) return null;
    return { stem: '$' + big + '$ ' + U[0] + ' $:$ $' + B + '$ ' + U[1], a: (A / g) + ':' + (B / g) };
  }
  var p = rnd(1, 9), q = rnd(2, 9), K = rnd(1, 5); if (!cop(p, q)) return null;
  var x = p * K, y = q * K; if (x % 10 === 0 && y % 10 === 0) return null;
  return { stem: '$' + dFmt(x, 1) + ':' + dFmt(y, 1) + '$', a: p + ':' + q };
}
// 2. Тоог өгсөн харьцаагаар хуваах (2 ба 3 хэсэг)
function g2() {
  if (rnd(0, 1)) {
    var a = rnd(1, 7), b = rnd(2, 9), k = rnd(3, 15); if (!cop(a, b)) return null;
    return { stem: '$' + ((a + b) * k) + '$ тоог $' + a + ':' + b + '$ харьцаагаар хуваа.', a: '$' + (a * k) + '$ ба $' + (b * k) + '$' };
  }
  var x = rnd(1, 5), y = rnd(1, 6), z = rnd(2, 7), m = rnd(2, 10);
  if (x === y && y === z) return null; if (gcd(gcd(x, y), z) !== 1) return null;
  return { stem: '$' + ((x + y + z) * m) + '$ тоог $' + x + ':' + y + ':' + z + '$ харьцаагаар хуваа.', a: '$' + (x * m) + '$; $' + (y * m) + '$; $' + (z * m) + '$' };
}
// 3. Пропорцын мэдэгдэхгүй гишүүн (байрлал санамсаргүй)
function g3() {
  var p = rnd(1, 9), q = rnd(2, 9), s = rnd(2, 6), t = rnd(2, 7); if (!cop(p, q) || s === t) return null;
  var v = [p * s, q * s, p * t, q * t], at = rnd(0, 3), ans = v[at];
  var c = v.map(function (n, i) { return i === at ? 'x' : String(n); });
  var stem = rnd(0, 1) ? '$' + c[0] + ':' + c[1] + '=' + c[2] + ':' + c[3] + '$' : '$\\dfrac{' + c[0] + '}{' + c[1] + '}=\\dfrac{' + c[2] + '}{' + c[3] + '}$';
  return { stem: stem, a: 'x=' + ans };
}
// 4. Харьцаагаар хуваах өгүүлбэртэй бодлого
function g4() {
  var t = rnd(1, 4);
  if (t === 1) {
    var a = rnd(2, 7), b = rnd(2, 8), k = rnd(3, 6); if (!cop(a, b)) return null;
    return { stem: 'Ангийн охид, хөвгүүдийн тооны харьцаа $' + a + ':' + b + '$, нийт $' + ((a + b) * k) + '$ сурагчтай. Охид, хөвгүүд тус бүр хэд вэ?', a: 'охид $' + (a * k) + '$, хөвгүүд $' + (b * k) + '$' };
  }
  if (t === 2) {
    var A = rnd(2, 5), B = rnd(3, 7), K = 500 * rnd(2, 12); if (!cop(A, B)) return null;
    return { stem: 'Ах, дүү хоёр $' + th((A + B) * K) + '$ төгрөгийг $' + B + ':' + A + '$ харьцаагаар хуваан авчээ. Хүн бүр хэдэн төгрөг авсан бэ?', a: 'ах $' + th(B * K) + '$, дүү $' + th(A * K) + '$ төгрөг' };
  }
  if (t === 3) {
    var S = pick([[1, 2, 3], [2, 3, 4], [1, 3, 5], [2, 3, 5], [1, 2, 6], [3, 4, 5], [4, 5, 6], [2, 5, 8], [1, 4, 7], [3, 5, 7]]), s = S[0] + S[1] + S[2];
    if (180 % s) return null;
    var u = 180 / s;
    return { stem: 'Гурвалжны өнцгүүд $' + S[0] + ':' + S[1] + ':' + S[2] + '$ харьцаатай. Өнцгүүдийг ол.', a: '$' + (S[0] * u) + '^\\circ$, $' + (S[1] * u) + '^\\circ$, $' + (S[2] * u) + '^\\circ$' };
  }
  var c = rnd(1, 2), e = rnd(3, 5), sand = (c + e) * rnd(4, 12); if (!cop(c, e)) return null;
  var kk = sand / (c + e);
  return { stem: 'Зуурмагт цемент, элсний харьцаа $' + c + ':' + e + '$. $' + sand + '$ кг зуурмагт хэдэн кг цемент, хэдэн кг элс орох вэ?', a: 'цемент $' + (c * kk) + '$ кг, элс $' + (e * kk) + '$ кг' };
}

CMX.jishig({
  title: 'III бүлэг — Жишиг даалгавар 1',
  sub: 'Харьцаа · тоог өгсөн харьцаагаар хуваах · пропорц',
  grade: '6-р анги',
  rule: '$a:b=\\dfrac{a}{b}$ &nbsp;·&nbsp; $a:b=c:d \\;\\Leftrightarrow\\; a\\cdot d=b\\cdot c$ &nbsp;·&nbsp; $N$ тоог $a:b$ харьцаагаар: нэг хэсэг $=\\dfrac{N}{a+b}$',
  tasks: [
    { label: 'Харьцааг хялбар хэлбэрт бич.', gen: g1, n: 8, nw: 4, cols: 4, wk: 12 },
    { label: 'Тоог өгсөн харьцаагаар хуваа.', gen: g2, n: 6, nw: 4, cols: 2, wk: 16 },
    { label: 'Пропорцын мэдэгдэхгүй гишүүнийг ол.', gen: g3, n: 8, nw: 4, cols: 4, wk: 14 },
    { label: 'Бодлогыг бод.', gen: g4, n: 4, nw: 4, cols: 2, wk: 22 }
  ]
});
</script>
