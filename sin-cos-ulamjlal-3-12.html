}

// Дасгал 10, 12, 13, 34, 36, 37, 123, 132: экстремумын цэг
function g_48_extr() {
  var ty = rnd(0, 7), body, d, step, pts = [], a, b, c, k, n, p, q, key = null;
  var PT = function (tp, x, y) { pts.push((tp > 0 ? 'Максимумын' : 'Минимумын') + ' цэг: $x=' + x + '$, $y_{\\' + (tp > 0 ? 'max' : 'min') + '}=' + y + '$'); };
  if (ty === 0) {                                     // ln(x²+bx+c), D < 0
    b = nz(-5, 5); c = Math.floor(b * b / 4) + rnd(1, 4);
    var Q0 = h48_ptex([c, b, 1]), xm = Fr(-b, 2), ym = Fr(4 * c - b * b, 4);
    body = '\\ln(' + Q0 + ')'; d = '\\dfrac{' + h48_ptex([b, 2]) + '}{' + Q0 + '}';
    step = 'x=' + fTex(xm);
    PT(-1, fTex(xm), h48_lnQ(ym.n, ym.d));            // ln 4 = 2ln 2, ln(9/4) = 2ln(3/2)
  } else if (ty === 1) {                              // ln kx / xⁿ (n = 1, 2)
    n = rnd(1, 2); k = rnd(1, 3); var Lk = '\\ln ' + h48_arg(k);
    body = '\\dfrac{' + Lk + '}{' + h48_xp(n) + '}'; d = '\\dfrac{1-' + (n === 1 ? '' : n) + Lk + '}{' + h48_xp(n + 1) + '}';
    var R = n === 1 ? 'e' : '\\sqrt{e}', xs = k === 1 ? R : '\\dfrac{' + R + '}{' + k + '}';
    step = Lk + '=' + (n === 1 ? '1' : '\\dfrac{1}{2}') + '\\Rightarrow x=' + xs;
    PT(1, xs, h48_ePow(Fr(k * k, n === 1 ? k : 2), -1));
  } else if (ty === 2) {                              // (x−a)eˣ, (a−x)eˣ
    a = nz(-2, 4); var v = rnd(0, 1);
    if (v === 0) { body = h48_lE(1, -a, 'e^{x}'); d = h48_lE(1, 1 - a, 'e^{x}'); }
    else { body = h48_lE(-1, a, 'e^{x}'); d = h48_lE(-1, a - 1, 'e^{x}'); }
    step = 'x=' + (a - 1);
    PT(v === 0 ? -1 : 1, '' + (a - 1), h48_ePow(Fr(v === 0 ? -1 : 1, 1), a - 1));
    key = h48_kLE(v === 0 ? 1 : -1, v === 0 ? -a : a, 'e^{x}');   // g_48_crit, g_48_mono, g_48_curve-тэй нийтлэг
  } else if (ty === 3) {                              // a·x·e^{bx}
    a = pick([1, 2, -1, -2, 3]); b = pick([1, -1, 2, -2]);
    body = h48_join([h48_cT(a, 'x' + h48_ex(b))]);
    d = h48_join([h48_cT(a, '(' + h48_join([h48_cT(1, ''), h48_cT(b, 'x')]) + ')' + h48_ex(b))]);
    var x3 = Fr(-1, b); step = 'x=' + fTex(x3);
    PT((b < 0) === (a > 0) ? 1 : -1, fTex(x3), h48_ePow(Fr(-a, b), -1));
    key = h48_kLE(a, 0, h48_ex(b));                   // a-аас үл хамаарна
  } else if (ty === 4) {                              // ax − ln(bx+c), b = am, ЕХ(b, c) = 1
    a = rnd(1, 3); var m4 = rnd(1, 3); b = a * m4; do { c = nz(-3, 3); } while (gcd(b, c) !== 1);
    var L4 = h48_ptex([c, b]), x4 = Fr(m4 - c, b), y4 = fMul(Fr(a, 1), x4);
    body = h48_join([h48_cT(a, 'x'), h48_cT(-1, '\\ln(' + L4 + ')')]);
    d = h48_join([h48_cT(a, ''), h48_cD(-b, '', L4)]) + '=' + h48_fracP([a * c - b, a * b], L4);   // 4(x−1)/(2x−1)
    step = 'x=' + fTex(x4);
    PT(-1, fTex(x4), m4 === 1 ? fTex(y4) : (y4.n === 0 ? '' : fTex(y4)) + '-\\ln ' + m4);
  } else if (ty === 5) {                              // a·xⁿ·ln x (n = 1, 2)
    n = rnd(1, 2); a = pick([1, 2, 4, 3, -1, -2]);
    body = h48_join([h48_cT(a, h48_xp(n) + '\\ln x')]);
    d = n === 1 ? h48_join([h48_cT(a, '\\ln x'), h48_cT(a, '')]) : h48_join([h48_cT(a, 'x(2\\ln x+1)')]);
    var x5 = n === 1 ? '\\dfrac{1}{e}' : '\\dfrac{1}{\\sqrt{e}}';
    step = '\\ln x=' + (n === 1 ? '-1' : '-\\dfrac{1}{2}') + '\\Rightarrow x=' + x5;
    PT(a > 0 ? -1 : 1, x5, h48_ePow(Fr(-a, n), -1));
    key = 'g48fn:XL|' + n;                            // a нь пропорциональ үржигдэхүүн
  } else if (ty === 6) {                              // e^{(x²−2px+q)/k}
    p = nz(-3, 3); k = rnd(1, 3); var j = rnd(-2, 2); q = p * p + k * j;
    var P6 = h48_ptex([q, -2 * p, 1]);
    body = 'e^{' + (k === 1 ? P6 : '\\frac{' + P6 + '}{' + k + '}') + '}';
    d = h48_join([h48_cT(Fr(2, k), '(' + h48_xm(p) + ')' + body)]);
    step = 'x=' + p;
    PT(-1, '' + p, h48_ePow(1, j));
    key = 'g48fn:EQ|' + p + '|' + k;                  // q (e^{q/k} үржигдэхүүн)-ээс үл хамаарна; g_48_mono-той нийтлэг
  } else {                                            // ½e^{2x} − (p+q)eˣ + pqx (Дасгал 37)
    p = rnd(1, 3); q = rnd(p + 1, 4);
    body = '\\dfrac{1}{2}e^{2x}' + h48_join([h48_cT(-(p + q), 'e^{x}'), h48_cT(p * q, 'x')]).replace(/^(?!-)/, '+');
    d = 'e^{2x}' + h48_join([h48_cT(-(p + q), 'e^{x}'), h48_cT(p * q, '')]).replace(/^(?!-)/, '+') + '=(e^{x}-' + p + ')(e^{x}-' + q + ')';
    var lp = h48_kln(1, p), lq = h48_kln(1, q);       // ln 4 = 2ln 2
    step = 'x_1=' + lp + ',\\ x_2=' + lq;
    // y(ln t) = pq·ln t − (t² + 2pq)/2: логарифмтай гишүүнийг түрүүнд
    var yv = function (t) { var cst = fTex(Fr(-t * t - 2 * p * q, 2)); return t === 1 ? cst : h48_kln(p * q, t) + cst; };
    PT(1, lp, yv(p)); PT(-1, lq, yv(q));
  }
  return { q: '$y=' + body + '$', a: "$y'=" + d + "$, $y'=0\\Rightarrow " + step + '$<br>' + pts.join('<br>'), key: key || 'g48fn:' + body };
}

// Дасгал 32, 34, 35: тэнхлэгүүдтэй огтлолцох цэг, экстремум, шүргэгч
function g_48_curve() {
  var ty = rnd(0, 3), a = rnd(2, 6), body, d, A, B, M, tp, K, Bb;
  if (ty === 0) { body = '(' + a + '-x)e^{x}'; d = '(' + (a - 1) + '-x)e^{x}'; A = a; B = a; M = [a - 1, h48_ePow(1, a - 1)]; tp = 1; K = a - 1; Bb = a; }
  else if (ty === 1) { body = '(x-' + a + ')e^{x}'; d = '(x-' + (a - 1) + ')e^{x}'; A = a; B = -a; M = [a - 1, h48_ePow(-1, a - 1)]; tp = -1; K = 1 - a; Bb = -a; }
  else if (ty === 2) { body = '(x+' + a + ')e^{-x}'; d = '-(x+' + (a - 1) + ')e^{-x}'; A = -a; B = a; M = [1 - a, h48_ePow(1, a - 1)]; tp = 1; K = 1 - a; Bb = a; }
  else { body = '(' + a + '-x)e^{-x}'; d = '(x-' + (a + 1) + ')e^{-x}'; A = a; B = a; M = [a + 1, h48_ePow(-1, -(a + 1))]; tp = -1; K = -(a + 1); Bb = a; }
  var P = function (l, x, y) { return l + '\\left(' + x + ';\\ ' + y + '\\right)'; };
  return { q: '$y=' + body + '$',
    a: "$y'=" + d + '$<br>$' + P('A', A, 0) + '$, $' + P('B', 0, B) + '$, $' + P('M', M[0], M[1]) + '$ — ' + (tp > 0 ? 'максимумын' : 'минимумын') + ' цэг<br>Шүргэгч: $y=' + h48_line(h48_L(K), h48_L(Bb)) + '$',
    key: h48_kLE(ty === 0 || ty === 3 ? -1 : 1, ty === 2 ? a : ty === 1 ? -a : a, ty >= 2 ? 'e^{-x}' : 'e^{x}') };   // g_48_crit/mono/extr-тэй нийтлэг
}

// Дасгал 11: y = A·sin(kx+φ) (A·cos(kx+φ)) функцийн координатын эхэд хамгийн ойр максимумын цэг
function h48_nearMax() {
  var cs = rnd(0, 1), A = pick([1, 1, 2, 3, -1, -2]), k = rnd(1, 3), ph = pick([Fr(1, 6), Fr(-1, 6), Fr(1, 4), Fr(-1, 4), Fr(1, 3), Fr(-1, 3)]);
  // A > 0 бол sin t = 1 (t = π/2), cos t = 1 (t = 0); A < 0 бол sin t = −1 (t = −π/2), cos t = −1 (t = π)
  var tS = cs ? (A > 0 ? Fr(0, 1) : Fr(1, 1)) : (A > 0 ? Fr(1, 2) : Fr(-1, 2));
  var th = fSub(tS, ph);
  if (fVal(th) > 1) th = fSub(th, Fr(2, 1)); else if (fVal(th) <= -1) th = fAdd(th, Fr(2, 1));   // θ ∈ ]−π; π] — |x| хамгийн бага
  var x0 = fDiv(th, Fr(k, 1)), per = k === 1 ? '2\\pi n' : k === 2 ? '\\pi n' : '\\dfrac{2\\pi n}{3}';
  var arg = h48_arg(k) + (ph.n < 0 ? '-' : '+') + h48_piT(Fr(Math.abs(ph.n), ph.d));
  var body = h48_join([h48_cT(A, (cs ? '\\cos' : '\\sin') + '\\left(' + arg + '\\right)')]);
  var d = h48_join([h48_cT(cs ? -A * k : A * k, (cs ? '\\sin' : '\\cos') + '\\left(' + arg + '\\right)')]);
  var tt = (cs ? '\\cos' : '\\sin') + '\\left(' + arg + '\\right)=' + (A > 0 ? '1' : '-1');
  return { q: '$y=' + body + '$ функцийн координатын эхэд хамгийн ойрхон орших максимумын цэгийг ол.',
    a: "$y'=" + d + '$<br>Максимумын цэгүүд: $' + tt + '\\Rightarrow x=' + h48_piT(x0) + '+' + per + ',\\ n\\in\\mathbb{Z}$<br>Хамгийн ойр нь: $M\\left(' + h48_piT(x0) + ';\\ ' + Math.abs(A) + '\\right)$',
    key: 'g48b:SM|' + k + '|' + h48_ph1(ph, cs) };   // |A|, тэмдэг, sin/cos-оос үл хамаарна (ижил эсвэл эсрэг тэмдэгтэй функц)
}
// Дасгал 17: BC ∥ Oy хэрчмийн уртын хамгийн их утга; Дасгал 11
function g_48_BC() {
  var ty = rnd(0, 3), f1, f2, h, hd, step, mx, xt, dom = '', key;
  if (ty === 3) return h48_nearMax();
  if (ty === 0) {                                     // хоёр парабол
    var a1 = pick([Fr(-1, 2), Fr(-1, 1), Fr(-2, 1)]), a2 = pick([Fr(1, 1), Fr(1, 2), Fr(2, 1)]);
    var b1 = rnd(-2, 3), b2 = rnd(-3, 2), c1 = rnd(2, 6), c2 = rnd(-2, 1);
    var A = fSub(a1, a2), B = Fr(b1 - b2, 1), C = Fr(c1 - c2, 1);
    var xs = fDiv(fMul(B, Fr(-1, 1)), fMul(Fr(2, 1), A)), M = fSub(C, fDiv(fMul(B, B), fMul(Fr(4, 1), A)));
    if (fVal(M) <= 0) return null;
    f1 = h48_ptex([c1, b1, a1]); f2 = h48_ptex([c2, b2, a2]);
    var LP = function (s) { return /\\dfrac/.test(s) ? '\\left(' + s + '\\right)' : '(' + s + ')'; };
    h = LP(f1) + '-' + LP(f2) + '=' + h48_ptex([C, B, A]); hd = h48_ptex([B, fMul(Fr(2, 1), A)]);
    xt = fTex(xs); mx = fTex(M);
    key = 'g48b:P|' + xt;                             // BC'-ийн тэг (BC-ийн хэлбэр) давхцвал ойролцоо бодлого
  } else if (ty === 1) {                              // шулуун ба eˣ
    var k = rnd(1, 3), c = rnd(2, 5);
    f1 = h48_ptex([c, k]); f2 = 'e^{x}';
    h = h48_ptex([c, k]) + '-e^{x}'; hd = (k === 1 ? '1' : '' + k) + '-e^{x}';
    xt = h48_kln(1, k); mx = k === 1 ? '' + (c - 1) : h48_kln(k, k) + (c - k > 0 ? '+' : '') + (c - k === 0 ? '' : c - k);
    key = 'g48b:E|' + k;                              // c нь тогтмол шилжилт
  } else {                                            // a·ln x ба шулуун
    var a = rnd(1, 4), c3 = rnd(2, 5);
    f1 = h48_join([h48_cT(a, '\\ln x')]); f2 = h48_ptex([-c3, 1]);
    h = h48_join([h48_cT(a, '\\ln x'), h48_cT(-1, 'x'), h48_cT(c3, '')]); hd = h48_join([h48_cD(a, '', 'x'), h48_cT(-1, '')]);
    xt = '' + a; mx = a === 1 ? '' + (c3 - 1) : h48_kln(a, a) + (c3 - a > 0 ? '+' : '') + (c3 - a === 0 ? '' : c3 - a);   // 4ln 4 = 8ln 2
    dom = ' ($x\\gt 0$)';
    key = 'g48fn:LX|' + h48_nk(a, -1);                // g_48_crit-ийн a·ln x − bx + c-тэй нийтлэг
  }
  var q = '$B$ цэг $y=' + f1 + '$ функцийн график дээр, $C$ цэг $y=' + f2 + '$ функцийн график дээр оршино. $BC\\parallel Oy$ ба $B$ цэг $C$ цэгээс дээр байх үеийн $BC$ хэрчмийн уртын хамгийн их утгыг ол.';
  return { q: q, a: '$BC=' + h + '$' + dom + "<br>$BC'=" + hd + '=0\\Rightarrow x=' + xt + '$<br>$BC_{\\max}=' + mx + '$', key: key };
}
var WSPEC={"title":"y = sin x ба y = cos x функцийн уламжлал-3","sub":"Цэг дээрх уламжлал, шүргэгч шулуун · IV бүлэг · 12-р анги","rule":"<b>Санамж:</b> $f'(x_0)$ нь $x_0$ абсциссатай цэгт татсан шүргэгчийн налалт $k$. Шүргэгч шулууны тэгшитгэл: $y=f(x_0)+f'(x_0)(x-x_0)$. Тусгай утгууд: $\\sin\\dfrac{\\pi}{6}=\\cos\\dfrac{\\pi}{3}=\\dfrac{1}{2}$, $\\sin\\dfrac{\\pi}{4}=\\cos\\dfrac{\\pi}{4}=\\dfrac{\\sqrt{2}}{2}$, $\\sin\\dfrac{\\pi}{3}=\\cos\\dfrac{\\pi}{6}=\\dfrac{\\sqrt{3}}{2}$.","ref":"","tasks":[{"label":"Функцийн $x_0$ цэг дээрх уламжлалыг ол.","fn":"g_43_atPoint","cap":6,"cols":2,"wk":14},{"label":"Функцийн $x_0$ цэг дээрх уламжлалыг ол.","fn":"g_43_atPointC","cap":4,"cols":2,"wk":16},{"label":"Функцийн графикт $x_0$ абсциссатай цэгт татсан шүргэгч шулууны тэгшитгэлийг бич.","fn":"g_43_tangent","cap":4,"cols":2,"wk":18},{"label":"Функцийн графикт $x_0$ абсциссатай цэгт татсан шүргэгч шулууны тэгшитгэлийг бич.","fn":"g_43_tangentH","cap":6,"cols":2,"wk":22}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);var solo=blocks[g].getAttribute('data-solo')==='1';if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(solo&&qs2.length===1){if(ql)ql.textContent='';map[qs2[i].getAttribute('data-k')]=gr+')';}else{if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk, solo:t.solo};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.solo?' data-solo="1"':'')+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p||t.solo){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.solo?null:t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
