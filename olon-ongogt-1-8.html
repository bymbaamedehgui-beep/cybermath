<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Олон өнцөгтийн дотоод өнцөг (8-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:16mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
// ── 8-р анги VI бүлэг (Өнцөг, дүрс, байгуулалт) ──
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;return '\\dfrac{'+n+'}{'+d+'}';}
function sqSimp(N){if(N<0)return null;var out=1,r=N;for(var f=2;f*f<=r;f++){while(r%(f*f)===0){out*=f;r/=(f*f);}}if(r===1)return ''+out;return (out===1?'':out)+'\\sqrt{'+r+'}';}
// ── SVG зургууд ──
function rTri(bh,bv,lb,lv,lc){ // horizontal leg bh, vertical leg bv (drawing units), labels
 var W=170,H=140,ox=30,oy=110,sc=Math.min(110/Math.max(bh,1),80/Math.max(bv,1));var w=bh*sc,h=bv*sc;
 var A=[ox,oy],B=[ox+w,oy],C=[ox,oy-h];
 var g='<polygon points="'+A[0]+','+A[1]+' '+B[0]+','+B[1]+' '+C[0]+','+C[1]+'" fill="rgba(123,82,238,0.08)" stroke="#7B52EE" stroke-width="1.6"/>';
 g+='<rect x="'+A[0]+'" y="'+(A[1]-9)+'" width="9" height="9" fill="none" stroke="#7B52EE" stroke-width="1"/>';
 g+='<text x="'+(ox+w/2)+'" y="'+(oy+14)+'" font-size="10" fill="#333" text-anchor="middle">'+lb+'</text>';
 g+='<text x="'+(ox-8)+'" y="'+(oy-h/2)+'" font-size="10" fill="#333" text-anchor="end">'+lv+'</text>';
 g+='<text x="'+((ox+w/2)+6)+'" y="'+((oy-h/2)-4)+'" font-size="10" fill="#dc2626" text-anchor="start">'+lc+'</text>';
 return '<svg viewBox="0 0 '+W+' '+H+'" width="150">'+g+'</svg>';}
function circAng(deg,inscribed){var cx=75,cy=75,R=55;var g='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#7B52EE" stroke-width="1.5"/>';
 var aA=210*Math.PI/180, aB=(210-deg)*Math.PI/180;
 var A=[cx+R*Math.cos(aA),cy-R*Math.sin(aA)],B=[cx+R*Math.cos(aB),cy-R*Math.sin(aB)];
 g+='<circle cx="'+cx+'" cy="'+cy+'" r="2.5" fill="#333"/><text x="'+(cx-3)+'" y="'+(cy-6)+'" font-size="10" font-style="italic">O</text>';
 g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+A[0].toFixed(1)+'" y2="'+A[1].toFixed(1)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+B[0].toFixed(1)+'" y2="'+B[1].toFixed(1)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<text x="'+(A[0]-10).toFixed(1)+'" y="'+(A[1]+4).toFixed(1)+'" font-size="10" font-style="italic">A</text>';
 g+='<text x="'+(B[0]+2).toFixed(1)+'" y="'+(B[1]+4).toFixed(1)+'" font-size="10" font-style="italic">B</text>';
 if(inscribed){var aC=30*Math.PI/180;var C=[cx+R*Math.cos(aC),cy-R*Math.sin(aC)];g+='<line x1="'+C[0].toFixed(1)+'" y1="'+C[1].toFixed(1)+'" x2="'+A[0].toFixed(1)+'" y2="'+A[1].toFixed(1)+'" stroke="#dc2626" stroke-width="1.3"/><line x1="'+C[0].toFixed(1)+'" y1="'+C[1].toFixed(1)+'" x2="'+B[0].toFixed(1)+'" y2="'+B[1].toFixed(1)+'" stroke="#dc2626" stroke-width="1.3"/><text x="'+(C[0]+3).toFixed(1)+'" y="'+(C[1]).toFixed(1)+'" font-size="10" font-style="italic" fill="#b91c1c">C</text>';}
 return '<svg viewBox="0 0 150 150" width="140">'+g+'</svg>';}
function polyReg(n){var cx=75,cy=72,R=52;var pts=[];for(var i=0;i<n;i++){var a=(-90+i*360/n)*Math.PI/180;pts.push((cx+R*Math.cos(a)).toFixed(1)+','+(cy+R*Math.sin(a)).toFixed(1));}
 return '<svg viewBox="0 0 150 148" width="130"><polygon points="'+pts.join(' ')+'" fill="rgba(123,82,238,0.08)" stroke="#7B52EE" stroke-width="1.6"/></svg>';}

var PNAME={3:'гурвалжин',4:'дөрвөн өнцөгт',5:'таван өнцөгт',6:'зургаан өнцөгт',7:'долоон өнцөгт',8:'найман өнцөгт',9:'есөн өнцөгт',10:'арван өнцөгт',12:'арван хоёр өнцөгт'};
// ════════ 6.1 Олон өнцөгтийн өнцөг ════════
function g_polyAngleSum(){var n=pick([5,6,7,8,9,10,12]);var s=(n-2)*180;
 return {q:'Гүдгэр $'+n+'$ өнцөгтийн дотоод өнцгүүдийн нийлбэрийг ол.',a:'$(n-2)\\cdot180^\\circ=('+n+'-2)\\cdot180^\\circ='+s+'^\\circ$',key:'pas'+n,nv:s,fig:polyReg(n>10?10:n)};}
function g_regPolyInterior(){var n=pick([3,4,5,6,8,9,10,12]);var s=(n-2)*180,each=s/n;
 return {q:'Зөв $'+n+'$ өнцөгтийн нэг дотоод өнцгийг ол.',a:'$\\dfrac{(n-2)\\cdot180^\\circ}{n}=\\dfrac{'+s+'^\\circ}{'+n+'}='+each+'^\\circ$',key:'rpi'+n,nv:each,fig:polyReg(n>10?10:n)};}
function g_polyMissing(){var n=pick([4,5]);var s=(n-2)*180;var angs=[];var used=0;for(var i=0;i<n-1;i++){var a=rnd(70,140);angs.push(a);used+=a;}var miss=s-used;if(miss<20||miss>170)return null;
 return {q:'Гүдгэр $'+n+'$ өнцөгтийн $'+(n-1)+'$ өнцөг нь $'+angs.map(function(a){return a+'^\\circ';}).join(',\\ ')+'$ бол мэдэгдэхгүй өнцгийг ол.',a:'$'+s+'^\\circ-('+angs.join('+')+')^\\circ='+miss+'^\\circ$',key:'pm'+n+angs.join(),nv:miss};}
function g_regPolyExterior(){var n=pick([3,4,5,6,8,9,10,12,18,36]);var ext=360/n;
 return {q:'Зөв $'+n+'$ өнцөгтийн нэг гадаад өнцгийг ол.',a:'$\\dfrac{360^\\circ}{n}=\\dfrac{360^\\circ}{'+n+'}='+ext+'^\\circ$',key:'rpe'+n,nv:ext};}
function g_polyFromExt(){var n=pick([4,5,6,8,9,10,12]);var ext=360/n;
 return {q:'Зөв олон өнцөгтийн нэг гадаад өнцөг $'+ext+'^\\circ$ бол талын тоог ол.',a:'$n=\\dfrac{360^\\circ}{'+ext+'^\\circ}='+n+'$',key:'pfe'+n,nv:n};}

// ════════ 6.2 Гурвалжны шугамууд ════════
function g_midsegment(){var b=pick([8,10,12,14,16,6,18,20]);var mode=pick(['find','rev']);
 if(mode==='find')return {q:'Гурвалжны сууриа $'+b+'$ см. Уг суурьтай харгалзах дундаж шугамын уртыг ол.',a:'Дундаж шугам суурийн хагастай тэнцүү: $\\dfrac{'+b+'}{2}='+(b/2)+'$ см',key:'ms'+b,nv:b/2};
 return {q:'Гурвалжны дундаж шугам $'+(b/2)+'$ см бол харгалзах суурийн уртыг ол.',a:'Суурь дундаж шугамын хоёр дахин: $2\\cdot'+(b/2)+'='+b+'$ см',key:'msr'+b,nv:b};}
var TRILINE=[
 ['оройг эсрэг талын дунджтай холбосон хэрчмийг','медиан'],
 ['оройгоос эсрэг тал руу буулгасан перпендикулярыг','өндөр'],
 ['өнцгийг тэн хуваасан цацрагийн хэрчмийг','биссектрис'],
 ['хоёр талын дундыг холбосон хэрчмийг','дундаж шугам']];
function g_triLineType(){var t=pick(TRILINE);
 return {q:'Гурвалжны '+t[0]+' юу гэж нэрлэдэг вэ?',a:'Энэ нь <b>'+t[1]+'</b>.',key:'tlt'+t[1]};}

// ════════ 6.3 Пифагорын теорем ════════
var TRIP=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[20,21,29],[10,24,26],[9,40,41]];
function g_pythHyp(){var t=pick(TRIP),k=pick([1,1,2]);var a=t[0]*k,b=t[1]*k,c=t[2]*k;
 return {q:'Тэгш өнцөгт гурвалжны катетууд $'+a+'$ см, $'+b+'$ см бол гипотенузыг ол.',a:'$c=\\sqrt{a^2+b^2}=\\sqrt{'+(a*a)+'+'+(b*b)+'}=\\sqrt{'+(a*a+b*b)+'}='+c+'$ см',key:'ph'+a+b,nv:c,fig:rTri(b,a,b+' см',a+' см','c=?')};}
function g_pythLeg(){var t=pick(TRIP),k=pick([1,1,2]);var a=t[0]*k,b=t[1]*k,c=t[2]*k;
 return {q:'Тэгш өнцөгт гурвалжны гипотенуз $'+c+'$ см, нэг катет $'+a+'$ см бол нөгөө катетыг ол.',a:'$b=\\sqrt{c^2-a^2}=\\sqrt{'+(c*c)+'-'+(a*a)+'}=\\sqrt{'+(c*c-a*a)+'}='+b+'$ см',key:'pl'+a+c,nv:b,fig:rTri(b,a,'b=?',a+' см',c+' см')};}
function g_pythGeneral(){var a=pick([2,3,4,5,6]),b=pick([2,3,4,5,6]);var N=a*a+b*b;var s=sqSimp(N);
 return {q:'Катетууд нь $'+a+'$ см, $'+b+'$ см тэгш өнцөгт гурвалжны гипотенузыг ол.',a:'$c=\\sqrt{'+(a*a)+'+'+(b*b)+'}=\\sqrt{'+N+'}='+s+'$ см',key:'pg'+a+b,fig:rTri(b,a,b+' см',a+' см','c=?')};}
function g_isRight(){var mode=pick(['yes','no']);var t=pick(TRIP);var sides;
 if(mode==='yes')sides=[t[0],t[1],t[2]];else sides=[t[0],t[1],t[2]+pick([1,-1,2])];
 var mx=Math.max.apply(null,sides),a=sides.filter(function(x){return x!==mx;});if(a.length<2)a=[sides[0],sides[1]];
 var isR=(a[0]*a[0]+a[1]*a[1]===mx*mx);
 return {q:'$'+sides[0]+'$ см, $'+sides[1]+'$ см, $'+sides[2]+'$ см талтай гурвалжин тэгш өнцөгт мөн үү?',a:'$'+a[0]+'^2+'+a[1]+'^2='+(a[0]*a[0]+a[1]*a[1])+'$, $\\ '+mx+'^2='+(mx*mx)+'$. '+(isR?'Тэнцүү тул <b>тэгш өнцөгт мөн</b>.':'Тэнцүү биш тул <b>тэгш өнцөгт биш</b>.'),key:'ir'+sides.join()};}
function g_pythWord(){var t=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17]]);var wall=t[1],base=t[0],lad=t[2];
 return {q:'Шат хананд түшүүлэхэд доод үзүүр нь ханаас $'+base+'$ м зайд, дээд үзүүр нь $'+wall+'$ м өндөрт хүрэв. Шатны уртыг ол.',a:'$\\sqrt{'+base+'^2+'+wall+'^2}=\\sqrt{'+(base*base+wall*wall)+'}='+lad+'$ м',key:'pw'+base+wall,nv:lad,fig:rTri(base,wall,base+' м',wall+' м','?')};}

// ════════ 6.4 Тойрог ба шулууны байршил ════════
function g_circleLine(){var r=pick([5,6,8,10,4]),d=pick([r-2,r,r+3,r-3,r+1]);if(d<0)return null;
 var pos=d<r?'хоёр цэгээр огтолно (секанс)':d===r?'нэг цэгт шүргэнэ (шүргэгч)':'огтлолцохгүй';
 return {q:'Тойргийн радиус $R='+r+'$, төвөөс шулуун хүртэлх зай $d='+d+'$ бол тэдгээрийн харилцан байршлыг тодорхойл.',a:'$d='+d+(d<r?'\\lt ':d===r?'=':'\\gt ')+'R='+r+'$ тул шулуун тойргийг <b>'+pos+'</b>.',key:'cl'+r+d};}

// ════════ 6.5 Төв ба тойрогт багтсан өнцөг ════════
function g_centralArc(){var deg=pick([30,45,60,90,120,135,150]);var mode=pick(['toArc','toCentral']);
 if(mode==='toArc')return {q:'Тойргийн төв өнцөг $\\angle AOB='+deg+'^\\circ$ бол түүнд тулсан $AB$ нумын хэмжээг ол.',a:'Төв өнцөг тулсан нумтайгаа тэнцүү: $\\overparen{AB}='+deg+'^\\circ$',key:'ca'+deg,nv:deg,fig:circAng(deg,false)};
 return {q:'$AB$ нумын хэмжээ $'+deg+'^\\circ$ бол түүнд тулсан төв өнцгийг ол.',a:'$\\angle AOB=\\overparen{AB}='+deg+'^\\circ$',key:'cc'+deg,nv:deg,fig:circAng(deg,false)};}
function g_inscribed(){var mode=pick(['fromCentral','fromArc','semicircle']);
 if(mode==='semicircle')return {q:'Тойргийн диаметрт тулсан (хагас тойрогт багтсан) өнцгийг ол.',a:'Диаметр нь $180^\\circ$ нум тул багтсан өнцөг $\\dfrac{180^\\circ}{2}=90^\\circ$.',key:'ins90',nv:90,fig:circAng(180,true)};
 var deg=pick([40,60,80,100,120,140]);
 if(mode==='fromCentral')return {q:'$AB$ нумд тулсан төв өнцөг $'+deg+'^\\circ$ бол мөн нумд тулсан багтсан өнцгийг ол.',a:'Багтсан өнцөг төв өнцгийн хагас: $\\dfrac{'+deg+'^\\circ}{2}='+(deg/2)+'^\\circ$',key:'if'+deg,nv:deg/2,fig:circAng(deg,true)};
 return {q:'$AB$ нумын хэмжээ $'+deg+'^\\circ$ бол уг нумд тулсан багтсан өнцгийг ол.',a:'Багтсан өнцөг нумын хагас: $\\dfrac{'+deg+'^\\circ}{2}='+(deg/2)+'^\\circ$',key:'ia'+deg,nv:deg/2,fig:circAng(deg,true)};}

// ════════ 6.6 Төсөөтэй дүрсүүд ════════
function g_simRatio(){var k=pick([2,3,1.5,2.5]);var a=pick([4,6,8,10]);var b=a*k;if(b!==Math.round(b*10)/10)return null;
 return {q:'Хоёр төсөөтэй гурвалжны харгалзах талууд $'+a+'$ см ба $'+b+'$ см бол төсөөгийн коэффициентийг ол.',a:'$k=\\dfrac{'+b+'}{'+a+'}='+(Math.round(k*100)/100)+'$',key:'sr'+a+b,nv:k};}
function g_simMissing(){var k=pick([2,3,1.5]);var a=pick([4,6,8]),b=a*k,c=pick([5,7,9]),d=c*k;if(b!==Math.round(b*10)/10||d!==Math.round(d*10)/10)return null;
 return {q:'$ABC\\sim A_1B_1C_1$ бөгөөд $AB='+a+',\\ A_1B_1='+b+',\\ BC='+c+'$ бол $B_1C_1$-г ол.',a:'$k=\\dfrac{'+b+'}{'+a+'}='+(Math.round(k*100)/100)+'$; $\\ B_1C_1=BC\\cdot k='+c+'\\cdot'+(Math.round(k*100)/100)+'='+(Math.round(d*100)/100)+'$',key:'sm'+a+c+k,nv:d};}
function g_isSimilar(){var mode=pick(['yes','no']);var k=pick([2,3,1.5]);var a=pick([4,6]),b=pick([5,8]);
 var A=[a,b,a+b>10?a+2:a+3];var B;if(mode==='yes')B=A.map(function(x){return x*k;});else B=[a*k,b*k,(A[2]*k)+pick([1,2])];
 var ratios=A.map(function(x,i){return B[i]/x;});var allEq=Math.abs(ratios[0]-ratios[1])<1e-9&&Math.abs(ratios[1]-ratios[2])<1e-9;
 return {q:'Талууд нь $'+A.join(';\\ ')+'$ ба $'+B.map(function(x){return Math.round(x*100)/100;}).join(';\\ ')+'$ байх хоёр гурвалжин төсөөтэй эсэхийг шалга.',a:allEq?('Харгалзах талуудын харьцаа бүгд $'+ratios[0]+'$-тэй тэнцүү тул <b>төсөөтэй</b>.'):('Харгалзах талуудын харьцаа тэнцүү бус тул <b>төсөөтэй биш</b>.'),key:'is'+A.join()+B.join()};}
var WSPEC={"title":"Олон өнцөгтийн дотоод өнцөг","sub":"Гүдгэр олон өнцөгтийн дотоод ба гадаад өнцөг · VI бүлэг · 8-р анги","rule":"<b>Санамж:</b> Гүдгэр $n$ өнцөгтийн дотоод өнцгүүдийн нийлбэр $(n-2)\\cdot180^\\circ$. Зөв $n$ өнцөгтийн нэг дотоод өнцөг $\\dfrac{(n-2)\\cdot180^\\circ}{n}$; гадаад өнцгүүдийн нийлбэр $360^\\circ$, нэг гадаад өнцөг $\\dfrac{360^\\circ}{n}$.","ref":"","tasks":[{"label":"Дотоод өнцгүүдийн нийлбэрийг ол.","fn":"g_polyAngleSum","cap":4},{"label":"Зөв олон өнцөгтийн нэг дотоод өнцгийг ол.","fn":"g_regPolyInterior","cap":4},{"label":"Мэдэгдэхгүй өнцгийг ол.","fn":"g_polyMissing","cap":4}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={};for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap){var use=WK?arr.slice(0,cap):arr;return '<div class="grid">'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  TASKS.forEach(function(t,i){html+='<div class="task">'+(i+1)+'. '+t.label+'</div>'+block(S[i],t.cap);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
