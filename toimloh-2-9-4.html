<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тоймлолтой бодлого — 2 (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px}
  .grid.packed{display:flex;gap:20px;align-items:flex-start}
  .grid.packed .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:9px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:14px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:13mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;font-size:12px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:28px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="toggleWork()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function ipow(n){return Math.pow(10,n);}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function toggleWork(){layout();}
function fmtDec(m,dec){var neg=m<0;m=Math.abs(m);var s=''+m;if(dec===0)return (neg?'-':'')+s;while(s.length<=dec)s='0'+s;return (neg?'-':'')+s.slice(0,s.length-dec)+'.'+s.slice(s.length-dec);}
function roundMant(M,f,t){var div=ipow(f-t),q=Math.floor(M/div),rem=M-q*div;return q+(2*rem>=div?1:0);}
function roundPlace(N,place){var q=Math.floor(N/place),rem=N-q*place;return (q+(2*rem>=place?1:0))*place;}
function roundDiv(a,b,q){var q10=ipow(q),num=a*q10,quo=Math.floor(num/b),rem=num-quo*b;return quo+(2*rem>=b?1:0);}
function grp(s){s=''+s;if(s.indexOf('.')>=0)return s;var out='',c=0;for(var i=s.length-1;i>=0;i--){out=s[i]+out;if(++c%3===0&&i>0)out='\\,'+out;}return out;}
function precStr(q){return q===1?'0.1':q===2?'0.01':'0.001';}
// 1) Нийлбэр/ялгаврыг бод, 0.1 нарийвчлалаар тоймло
function gSum(){var Ma=rnd(100,9999),Mb=rnd(100,9999),op=pick(['+','-']);
  if(op==='-'&&Ma<Mb){var tmp=Ma;Ma=Mb;Mb=tmp;}
  var res=op==='+'?Ma+Mb:Ma-Mb,R=roundMant(res,2,1);
  return {q:'$'+fmtDec(Ma,2)+' '+op+' '+fmtDec(Mb,2)+'$ — 0.1',a:'$'+fmtDec(R,1)+'$',ok:true};}
// 2) Үржвэрийг бод, заасан нарийвчлалаар тоймло
function gMul(){var pa=pick([1,2]),pb=pick([1,2]),Ma=rnd(ipow(pa),ipow(pa+1)-1),Mb=rnd(ipow(pb),ipow(pb+1)-1);
  var P=pa+pb,prod=Ma*Mb,q=pick([1,2]);if(q>=P)q=1;var R=roundMant(prod,P,q);
  return {q:'$'+fmtDec(Ma,pa)+'\\times'+fmtDec(Mb,pb)+'$ — '+precStr(q),a:'$'+fmtDec(R,q)+'$',ok:true};}
// 3) Ноогдворыг бод, заасан нарийвчлалаар тоймло
function gDiv(){var a=rnd(50,9999),b=rnd(3,40),q=pick([1,2]),R=roundDiv(a,b,q);
  return {q:'$'+a+'\\div'+b+'$ — '+precStr(q),a:'$\\approx '+fmtDec(R,q)+'$',ok:true};}
// 4) Тэргүүлэх оронгоор багцаал
function gEst(){var x=rnd(21,999),y=rnd(21,999),dx=(''+x).length,dy=(''+y).length;
  var rx=roundPlace(x,ipow(dx-1)),ry=roundPlace(y,ipow(dy-1)),est=rx*ry;
  return {q:'$'+grp(x)+'\\times'+grp(y)+'$',a:'$\\approx '+grp(rx)+'\\times'+grp(ry)+'='+grp(est)+'$',ok:true};}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т','у','ү'];
function relabel(sheet){var grids=sheet.querySelectorAll('.grid'),map={};
  for(var g=0;g<grids.length;g++){var qs=grids[g].querySelectorAll('.q');
    for(var i=0;i<qs.length;i++){var letter=LET[i]||('#'+(i+1));var ql=qs[i].querySelector('.ql');if(ql)ql.textContent=letter+')';map[qs[i].getAttribute('data-k')]=(g+1)+letter+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFitBalanced(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<400){var grids=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=grids.length-1;s>=0;s--){var n=grids[s].querySelectorAll('.q').length;if(n>bestN&&n>3){bestN=n;best=s;}}if(best<0)break;var rm=function(){var qs=grids[best].querySelectorAll('.q');if(!qs.length)return;var last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);};rm();rm();relabel(sheet);h=probeH(sheet);}}
function packColumns(sheet){[].forEach.call(sheet.querySelectorAll('.grid'),function(g){if(g.classList.contains('packed'))return;var qs=[].slice.call(g.children).filter(function(c){return c.classList&&c.classList.contains('q');});if(qs.length<2)return;var half=Math.ceil(qs.length/2),c1=document.createElement('div'),c2=document.createElement('div');c1.className='col';c2.className='col';qs.forEach(function(q,i){(i<half?c1:c2).appendChild(q);});g.appendChild(c1);g.appendChild(c2);g.classList.add('packed');});}
function genPool(){var P=[[],[],[]];
  function fill(idx,fn,n){var seen={},c=0,tr=0;while(c<n&&tr<4000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;P[idx].push(f);c++;}}
  fill(0,gSum,14);fill(1,gMul,14);fill(2,gDiv,14);return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){
  var WK=document.getElementById('sw').checked;
  var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,work){return arr.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});
    return '<div class="q" data-k="'+k+'"><div class="qeq"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(work?'<div class="wk"></div>':'')+'</div>';}).join('');}
  var b=[block(S[0],WK),block(S[1],WK),block(S[2],WK)];
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span><span>'+p.f.a+'</span></div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тоймлолтой бодлого</h1><div class="sub">Бод, дараа нь тоймло · багцаалах · 9-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Эхлээд яг утгыг бод, дараа нь заасан нарийвчлалаар тоймло. Тоймлох орны дараах цифр $5$-аас бага бол хасна, $5$ буюу их бол нэгээр нэмнэ.</div>'
    +'<div class="task">1. Бод, дараа нь 0.1 нарийвчлалаар тоймло.</div><div class="grid">'+b[0]+'</div>'
    +'<div class="task">2. Үржвэрийг бод, дараа нь заасан нарийвчлалаар тоймло.</div><div class="grid">'+b[1]+'</div>'
    +'<div class="task">3. Ноогдворыг бод, дараа нь заасан нарийвчлалаар тоймло.</div><div class="grid">'+b[2]+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Тоог тоймлох-2';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{trimToFitBalanced(document.getElementById('sheet'),1035);}catch(e){}
  try{packColumns(document.getElementById('sheet'));}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
