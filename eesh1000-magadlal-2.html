<script>
/* ЭЕШ 1000 — Магадлал, статистик-2 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Үзэгдлийн магадлал, геометр магадлал, нөхцөлт ба бүтэн магадлал.
   Эх: 1.17, 4.80, 1.90, 2.68, 4.2, 4.47, 2.72, 2.73, 2.74, 2.87, 2.89, 2.88, 2.71, 2.90 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 1.17 */
var e1_17 = (function () {
// 17. {1, …, N}-ээс p эсвэл q-д хуваагдах тоо: ⌊N/p⌋ + ⌊N/q⌋ − ⌊N/ХБЕХ(p, q)⌋ (оруулах-хасах зарчим); P = тоо/N.
var p17_P = [[2, 3], [3, 4], [4, 6], [2, 5], [3, 5], [4, 5], [5, 6], [3, 7], [6, 9], [4, 10], [6, 8]];
function p17() {
  var N = pick([20, 24, 30, 36, 40, 50, 60]), pq = pick(p17_P), p = pq[0], q = pq[1];
  var cnt = Math.floor(N / p) + Math.floor(N / q) - Math.floor(N / lcm(p, q));
  // Бодолт (гар бичмэл): p-д хуваагдах ⌊N/p⌋, q-д ⌊N/q⌋, хоёуланд (ХБЕХ-д) ⌊N/L⌋ → хоёр удаа тоологдсоныг хасна
  var L = lcm(p, q), np = Math.floor(N / p), nq = Math.floor(N / q), nl = Math.floor(N / L);
  var K = function (d) {
    return N % d === 0 ? '\\dfrac{' + N + '}{' + d + '}=' + N / d : '\\left\\lfloor\\dfrac{' + N + '}{' + d + '}\\right\\rfloor=' + Math.floor(N / d);
  };
  var s1 = '1-ээс ' + N + ' хүртэлх тоонуудын дотор ' + sfx(p, 'д') + ' хуваагдах $' + K(p) + '$ тоо, ' + sfx(q, 'д') + ' хуваагдах $' + K(q) + '$ тоо байна.';
  var s2 = nl
    ? p + ' ба ' + sfx(q, 'д') + ' зэрэг хуваагдах тоо нь тэдгээрийн хамгийн бага ерөнхий хуваагдагч ' + sfx(L, 'д') + ' хуваагдана. Ийм $' + K(L) + '$ тоо байгаа бөгөөд ' + (nl === 1 ? 'түүнийг' : 'тэдгээрийг') + ' дээр хоёр удаа тоолсон.'
    : p + ' ба ' + sfx(q, 'д') + ' зэрэг хуваагдах тоо нь тэдгээрийн хамгийн бага ерөнхий хуваагдагч ' + sfx(L, 'д') + ' хуваагдах ёстой; ' + N + ' хүртэл ийм тоо байхгүй.';
  var fl = ' ($\\lfloor\\,\\rfloor$ — бүхэл хэсэг)';
  if (/lfloor/.test(s1)) s1 = s1.replace(/ байна\.$/, ' байна' + fl + '.');
  else if (/lfloor/.test(s2)) s2 = s2.replace(/ тоо байгаа/, ' тоо' + fl + ' байгаа');
  return {
    q: '$A=\\{1,2,3,\\ldots,' + N + '\\}$ олонлогоос нэг тоо сонгоход ' + sfx(p, 'д') + ' эсвэл ' + sfx(q, 'д') + ' хуваагдах магадлалыг ол.',
    a: '$P=' + fr(cnt, N) + '$',
    wk: 22,
    s: [
      s1, s2,
      'Иймд ' + p + ' эсвэл ' + sfx(q, 'д') + ' хуваагдах $' + np + '+' + nq + (nl ? '-' + nl : '') + '=' + cnt + '$ тоо байна. Нийт $' + N + '$ тооноос таатай нь $' + cnt + '$ тул '
        + '$$P=\\dfrac{' + cnt + '}{' + N + '}' + (fr(cnt, N) === '\\dfrac{' + cnt + '}{' + N + '}' ? '' : '=' + fr(cnt, N)) + '.$$'
    ],
    t: { N: N, p: p, q: q }
  };
}
return p17;
})();

/* 4.80 */
var e4_80 = (function () {
// 80. Хайрцагт T (2 эсвэл 3) төрлийн чихэр, i-р төрлийнх nᵢ ширхэг (N = Σnᵢ); таамгаар 2 ширхгийг авах C_N^2 боломж.
//     Өөр өөр төрлийн: Σ_{i<j} nᵢ·nⱼ;  ижил төрлийн: Σ C_{nᵢ}^2 (= C_N^2 − өөр өөр).  P = таатай/C_N^2 — хураасан бутархай.
function p80() {
  var T = rnd(1, 10) <= 7 ? 2 : 3, n = [], N = 0, i, j;
  for (i = 0; i < T; i++) { n.push(T === 2 ? rnd(3, 12) : rnd(2, 9)); N += n[i]; }
  if (T === 2 && n[0] === n[1] && rnd(0, 3)) return null;            // тэнцүү тоо — ховор
  if (T === 3 && N > 24) return null;
  var diff = rnd(1, 10) <= 6, tot = N * (N - 1) / 2, good = 0;
  for (i = 0; i < T; i++) for (j = i + 1; j < T; j++) good += n[i] * n[j];
  if (!diff) good = tot - good;
  if (good <= 0 || good >= tot) return null;
  return {
    q: 'Хайрцагт ' + T + ' төрлийн чихэр байв. ' + n.map(function (v, k) { return (k + 1) + '-р төрлийн чихэр ' + v + ' ширхэг'; }).join(', ')
      + ' байсан. Таамгаар 2 ширхгийг сонгон авахад ' + (diff ? 'өөр өөр' : 'ижил') + ' төрлийн чихэр байх үзэгдлийн магадлалыг олоорой.',
    a: '$P=' + fr(good, tot) + '$',
    wk: 24,
    t: { n: n, diff: diff }
  };
}
return p80;
})();

/* 1.90 */
var e1_90 = (function () {
// 90. Гурван хайрцгаас нэг нэг бөмбөг: яг хоёр бөмбөг нь ижил дугаартай байх магадлал.
//     Эх шиг нэг дугаар c гурван хайрцагт бүгдэд нь (давтамж k_A, k_B, k_C), заримдаа хоёр хайрцагт л
//     байх 2 дахь нийтлэг дугаар d; бусад дугаарууд давхцахгүй.
//     P = Σ_v [A(v)B(v)(n_C−C(v)) + A(v)C(v)(n_B−B(v)) + B(v)C(v)(n_A−A(v))] / (n_A·n_B·n_C).
var p90_W = { 3: 'гурван', 4: 'дөрвөн', 5: 'таван', 6: 'зургаан' };
function p90_cnt(arr, v) { var c = 0; arr.forEach(function (x) { if (x === v) c++; }); return c; }
function p90() {
  var n = [rnd(3, 6), rnd(3, 6), rnd(3, 6)], c = rnd(1, 9), bx = [[], [], []], i, j;
  for (i = 0; i < 3; i++) { var kk = rnd(1, n[i] === 3 ? 2 : n[i] - 2); for (j = 0; j < kk; j++) bx[i].push(c); }
  var pool = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9].filter(function (v) { return v !== c; }));
  if (rnd(1, 100) <= 18) {
    var d = pool.pop();
    pick([[0, 1], [0, 2], [1, 2]]).forEach(function (t) { bx[t].push(d); });
  }
  for (i = 0; i < 3; i++) {
    if (bx[i].length > n[i]) return null;
    while (bx[i].length < n[i]) { if (!pool.length) return null; bx[i].push(pool.pop()); }
    bx[i].sort(function (x, y) { return x - y; });
  }
  var vals = {}, good = 0, tot = n[0] * n[1] * n[2];
  bx.forEach(function (b) { b.forEach(function (v) { vals[v] = 1; }); });
  Object.keys(vals).forEach(function (s) {
    var v = +s, a = p90_cnt(bx[0], v), b = p90_cnt(bx[1], v), cc = p90_cnt(bx[2], v);
    good += a * b * (n[2] - cc) + a * cc * (n[1] - b) + b * cc * (n[0] - a);
  });
  if (good <= 0 || good >= tot) return null;
  var L = ['A', 'B', 'C'], parts = bx.map(function (b, t) { return L[t] + ' хайрцагт ' + b.join(', ') + ' дугаартай ' + p90_W[n[t]] + ' бөмбөг'; });
  // Бодолт (гар бичмэл): нийт n_A·n_B·n_C; ижил хоёр бөмбөг нь хоёр хайрцагт давхцсан дугаар (c, d) л байж болно;
  // хос хайрцаг бүрээр: (тэр дугаартай бөмбөг)·(тэр дугаартай бөмбөг)·(гурав дахь хайрцгийн өөр дугаартай бөмбөг)
  var nbx = function (v) { return [0, 1, 2].filter(function (t) { return p90_cnt(bx[t], v) > 0; }).length; };
  var shv = Object.keys(vals).map(Number).filter(function (v) { return nbx(v) >= 2; })
    .sort(function (x, y) { return nbx(y) - nbx(x) || x - y; });          // 3 хайрцагт байгаа дугаар эхэнд
  var lines = [], terms = [];
  shv.forEach(function (v) {
    [[0, 1, 2], [0, 2, 1], [1, 2, 0]].forEach(function (pr) {
      var f = [0, 0, 0];
      f[pr[0]] = p90_cnt(bx[pr[0]], v); f[pr[1]] = p90_cnt(bx[pr[1]], v); f[pr[2]] = n[pr[2]] - p90_cnt(bx[pr[2]], v);
      var w = f[0] * f[1] * f[2];
      if (!w) return;
      terms.push(w);
      lines.push(L[pr[0]] + ', ' + L[pr[1]] + '-ээс $' + v + '$, ' + L[pr[2]] + '-' + (pr[2] ? 'ээс' : 'аас') + ' өөр дугаар: $'
        + f.join('\\cdot ') + '=' + w + '$');
    });
  });
  var shTxt = shv.length === 1 ? 'зөвхөн $' + shv[0] + '$' : shv.map(function (v) { return '$' + v + '$'; }).join(' эсвэл ');
  return {
    q: parts.join(', ') + ' байв. Хайрцаг тус бүрээс санамсаргүйгээр нэг нэг бөмбөг сонгоход яг хоёр бөмбөг нь ижил дугаартай байх магадлалыг ол.',
    a: '$P=' + fr(good, tot) + '$', wk: 30,
    s: [
      'Нийт боломж: $' + n.join('\\cdot ') + '=' + tot + '$.',
      'Ижил дугаартай хоёр бөмбөг нь ' + shTxt + ' байж болох ба гурав дахь бөмбөг нь өөр дугаартай байна. Сонгогдох боломж:<br>'
        + lines.join(';<br>') + '.<br>Бүгд $' + terms.join('+') + '=' + good + '$ боломж.',
      'Иймд $P=\\dfrac{' + good + '}{' + tot + '}' + (gcd(good, tot) > 1 ? '=' + fr(good, tot) : '') + '$.'
    ],
    t: { bx: bx }
  };
}
return p90;
})();

/* 2.68 */
var e2_68 = (function () {
// 68. Зоосыг n удаа шидэхэд сүлдээр (эсвэл тоогоор) k-аас цөөнгүй / k-аас олонгүй / яг k удаа буух магадлал
//     = Σ C(n, i) / 2ⁿ  (эх: n = 3, 2-оос цөөнгүй сүлдээр → 1/2).
function p68_C(n, k) { var r = 1; for (var i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
function p68() {
  var n = rnd(3, 6), w = rnd(1, 10), side = rnd(1, 10) <= 7 ? 'сүлдээр' : 'тоогоор', k, cond, cnt = 0, i;
  if (w <= 5) { k = rnd(1, n - 1); cond = sfx(k, 'аас') + ' цөөнгүй ' + side; for (i = k; i <= n; i++) cnt += p68_C(n, i); }
  else if (w <= 8) { k = rnd(1, n - 1); cond = sfx(k, 'аас') + ' олонгүй ' + side; for (i = 0; i <= k; i++) cnt += p68_C(n, i); }
  else { k = rnd(1, n); cond = 'Яг ' + k + ' удаа ' + side; cnt = p68_C(n, k); }
  return {
    q: 'Зоос шидэх туршилт ' + n + ' удаа хийв. ' + cond + ' тусах магадлалыг ол.',
    a: '$P=' + fr(cnt, Math.pow(2, n)) + '$',
    wk: 20,
    t: { n: n, k: k, w: w }
  };
}
return p68;
})();

/* 4.2 */
var e4_2 = (function () {
// 2. N модтой хөзөр (36 эсвэл 52), «сайн» хөзөр K ширхэг: тамга/ноён/хатан — 4, улаан — N/2.
//    Буцааж хийлгүйгээр: хоёул K(K−1)/(N(N−1)), аль нь ч биш (N−K)(N−K−1)/(N(N−1)), ядаж нэг = 1 − (аль нь ч биш),
//    яг нэг 2K(N−K)/(N(N−1)), эхнийх X, хоёр дахь нь Y (өөр дүрс) 4·4/(N(N−1)). Буцааж хийвэл хуваарь N², тоологч K², …
var p2_C = [['тамга', 4], ['ноён', 4], ['хатан', 4], ['улаан', 0]];   // улаан: N/2
function p2() {
  var N = pick([36, 36, 52]), rep = rnd(1, 3) === 1, ev = pick(['both', 'both', 'both', 'both', 'any', 'any', 'one', 'none', 'xy']);
  var ci = rnd(0, ev === 'xy' ? 2 : 3), name = p2_C[ci][0], K = ci === 3 ? N / 2 : 4, L = N - K;
  var D = rep ? N * N : N * (N - 1), num, txt;
  if (ev === 'both') { num = rep ? K * K : K * (K - 1); txt = 'Уг 2 хөзөр хоёул ' + name + ' хөзөр байх'; }
  else if (ev === 'none') { num = rep ? L * L : L * (L - 1); txt = 'Уг 2 хөзрийн аль нь ч ' + name + ' хөзөр биш байх'; }
  else if (ev === 'any') { num = D - (rep ? L * L : L * (L - 1)); txt = 'Уг 2 хөзрийн ядаж нэг нь ' + name + ' хөзөр байх'; }
  else if (ev === 'one') { num = 2 * K * L; txt = 'Уг 2 хөзрийн яг нэг нь ' + name + ' хөзөр байх'; }
  else {
    var cj = (ci + rnd(1, 2)) % 3;
    num = 16; txt = 'Эхний хөзөр ' + name + ', хоёр дахь хөзөр ' + p2_C[cj][0] + ' байх';
  }
  if (N === 36 && !rep && ev === 'both' && ci === 0) return null;   // эх бодлогын тохиолдол тогтмол биш
  return {
    q: N + ' модтой хөзрөөс нэг хөзөр сугалж, буцааж ' + (rep ? 'хийгээд' : 'хийлгүйгээр') + ' дахин нэг хөзөр сугалав. ' + txt + ' магадлалыг олоорой.',
    a: '$P=' + fr(num, D) + '$',
    wk: 24,
    t: { N: N, rep: rep, ev: ev, ci: ci }
  };
}
return p2;
})();

/* 4.47 */
var e4_47 = (function () {
// 47. Бүх талс нь будагтай кубийг n³ (n = 3…10) тэнцүү кубэд хуваав. Будагтай талсын тоогоор:
//     3 талс — 8 (оройн), яг 2 — 12(n − 2) (ирмэгийн), яг 1 — 6(n − 2)² (талсын), будаггүй — (n − 2)³ (дотор).
//     Үзэгдэл: ядаж 2 / яг 2 / яг 1 / 3 талс / ядаж 1 / нэг ч талс будаггүй / ихдээ 1. P = тоо / n³ (хураасан).
var p47_E = [
  ['ядаж 2 талс нь будагтай', function (n) { return 8 + 12 * (n - 2); }],
  ['ядаж 2 талс нь будагтай', function (n) { return 8 + 12 * (n - 2); }],
  ['ядаж 2 талс нь будагтай', function (n) { return 8 + 12 * (n - 2); }],
  ['яг 2 талс нь будагтай', function (n) { return 12 * (n - 2); }],
  ['яг 1 талс нь будагтай', function (n) { return 6 * (n - 2) * (n - 2); }],
  ['3 талс нь будагтай', function () { return 8; }],
  ['ядаж 1 талс нь будагтай', function (n) { return n * n * n - (n - 2) * (n - 2) * (n - 2); }],
  ['нэг ч талс нь будаггүй', function (n) { return (n - 2) * (n - 2) * (n - 2); }],
  ['ихдээ 1 талс нь будагтай', function (n) { return 6 * (n - 2) * (n - 2) + (n - 2) * (n - 2) * (n - 2); }]
];
function p47() {
  var n = rnd(3, 10), E = pick(p47_E), N = n * n * n, c = E[1](n);
  return {
    q: 'Бүх талс нь будагтай кубийг ' + N + ' ширхэг тэнцүү кубэд хуваав. Эдгээр кубүүдээс таамгаар ' + sfx(1, 'ыг')
      + ' сонгоход ' + E[0] + ' куб таарах магадлалыг олоорой.',
    a: '$P=' + fr(c, N) + '$',
    wk: 26,
    t: { n: n, c: c }
  };
}
return p47;
})();

/* 2.72 */
var e2_72 = (function () {
// 72. Геометр магадлал: координатын эх дээр төвтэй R ба r (R > r) радиустай тойргууд; том тойргоос сонгосон цэг
//     цагираг дотор байх магадлал P = (πR² − πr²)/(πR²) = (R² − r²)/R².  Радиусуудыг заримдаа «бага, их» дарааллаар бичнэ.
function p72() {
  var R = rnd(2, 10), r = rnd(1, R - 1);
  if (R === 10 && r === 1) return null;
  var first = rnd(1, 4) === 1 ? [r, R] : [R, r];
  return {
    q: 'Координатын төв дээр эхтэй ' + first[0] + ' болон ' + first[1] + ' радиустай тойргууд зурав. Дурын цэгийг том тойрог дотроос сонгоход '
      + 'уг цэг нь энэхүү 2 тойргийн дунд үүсэх цагираг дотор байх магадлалыг ол.',
    a: '$P=' + fr(R * R - r * r, R * R) + '$',
    wk: 18,
    t: { R: R, r: r }
  };
}
return p72;
})();

/* 2.73 */
var e2_73 = (function () {
// 73. Геометр магадлал: [0; a]² квадратаас сонгосон A(x, y) цэг нөхцөл хангах магадлал = муж / a².
//     a ∈ {1, 2, 3} (эх: a = 1, y < x² → 1/3). Нөхцөлүүд (a-д тохируулж масштаблана):
//       y ≶ x^n/a^{n−1} (n = 2, 3) → 1/(n+1) | n/(n+1);  y ≶ √(ax) → 2/3 | 1/3;  y ≶ ∛(a²x) → 3/4 | 1/4;
//       y ≶ a − x²/a → 2/3 | 1/3;  x² + y² ≶ ρ² → πρ²/(4a²) | 1 − …;  x + y ≶ c;  y ≶ kx, y ≶ x/k;  |x − y| ≶ c.
function p73_cf(n, d) { var g = gcd(n, d); return [n / g, d / g]; }
function p73() {
  var a = pick([1, 1, 1, 1, 2, 2, 3]), lt = rnd(0, 1) === 1, op = lt ? '\\lt ' : '\\gt ', T = rnd(1, 100), lhs = 'y', rhs, P;   // P: [n, d] эсвэл {pi: [n, d], one: bool}
  if (T <= 30) {                                   // y = x^n / a^(n−1)
    var n = rnd(1, 3) === 1 ? 3 : 2;
    rhs = a === 1 ? 'x^' + n : tm([1, Math.pow(a, n - 1)], 'x^' + n, true);
    P = lt ? [1, n + 1] : [n, n + 1];
  } else if (T <= 45) {                            // y = √(ax) эсвэл ∛(a²x)
    if (rnd(1, 3) === 1) { rhs = '\\sqrt[3]{' + (a === 1 ? '' : a * a) + 'x}'; P = lt ? [3, 4] : [1, 4]; }
    else { rhs = '\\sqrt{' + (a === 1 ? '' : a) + 'x}'; P = lt ? [2, 3] : [1, 3]; }
  } else if (T <= 55) {                            // y = a − x²/a
    rhs = a + (a === 1 ? '-x^2' : tm([-1, a], 'x^2'));
    P = lt ? [2, 3] : [1, 3];
  } else if (T <= 65) {                            // x² + y² ≶ ρ²
