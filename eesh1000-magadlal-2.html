<script>
/* ЭЕШ 1000 — Магадлал, статистик-2 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Нөхцөлт магадлал, санамсаргүй хувьсагч, тархалт, математик дундаж, дисперс.
   Эх: 2.71, 2.87, 2.88, 2.89, 2.90, 3.45, 3.69, 2.60, 2.59, 3.46, 3.70, 2.66, 3.52, 3.78, 2.62, 2.64, 2.61, 3.53, 3.79, 1.7, 2.63, 2.65, 2.67 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 2.71 */
var e2_71 = (function () {
// 71. Хоёр цехтэй үйлдвэр: цехүүдийн гологдлын хувь p₁, p₂ (%), нэг цех нь нөгөөгөөсөө k дахин их бүтээгдэхүүн гаргана.
//     Бүтэн магадлалын томьёо: P = (k·p_их + p_бага) / (100(k+1)). Хариу: хураасан бутархай ба аравтын бутархай
//     (хуваарь нь зөвхөн 2, 5-тай бол яг утга «=», үгүй бол «≈» 3 оронтой — эх: 2/75 ≈ 0.027).
function p71() {
  var p1 = rnd(1, 6), p2 = rnd(1, 6), k = pick([2, 2, 3, 4]), big = rnd(1, 2);
  if (p1 === p2) return null;
  var pb = big === 1 ? p1 : p2, ps = big === 1 ? p2 : p1;
  var num = k * pb + ps, den = 100 * (k + 1), g = gcd(num, den), n = num / g, d = den / g, dd = d;
  while (dd % 2 === 0) dd /= 2;
  while (dd % 5 === 0) dd /= 5;
  var v = num / den, tail = dd === 1 ? '=' + dec(v) : '\\approx ' + dec(v, 3);
  return {
    q: 'Нэгэн үйлдвэр 2 цехтэй. 1-р цехийн бүтээгдэхүүн $' + p1 + '\\%$, 2-р цехийн бүтээгдэхүүн $' + p2 + '\\%$ гологдол бүтээгдэхүүн гаргадаг. '
      + 'Хэрэв ' + (big === 1 ? '1-р цех, 2-р цехээс' : '2-р цех, 1-р цехээс') + ' нэгж хугацаанд ' + k
      + ' дахин их бүтээгдэхүүн үйлдвэрлэдэг бол үйлдвэрээс гарч буй бүтээгдэхүүн гологдол байх магадлалыг ол.',
    a: '$P=' + fr(n, d) + tail + '$',
    wk: 24,
    t: { p1: p1, p2: p2, k: k, big: big }
  };
}
return p71;
})();

/* 2.87 */
var e2_87 = (function () {
// 87. Нийцгүй (үл нийцэх) үзэгдэл: K хүүхэд (3 эсвэл 4) сонгоход үр дүнг хүүгийн тоо b ∈ {0..K}-оор илэрхийлнэ (охин = K − b).
//     Суурь үзэгдэл ба I–IV үзэгдэл нь b-ийн олонлог; нийцгүй ⇔ огтлолцол хоосон. Нийцгүй нь 1–3 ширхэг.
//     (эх: K = 3, «Ядаж хоёр нь охин байх»; I. Яг нэг нь хүү, II. Ядаж нэг нь хүү, III. Ядаж хоёр нь хүү, IV. Гурвуул хүү → III ба IV)
var p87_W = { 1: 'нэг', 2: 'хоёр', 3: 'гурав', 4: 'дөрөв' }, p87_RM = ['I', 'II', 'III', 'IV'];
// үзэгдлүүдийн сан: [бичиг, b → bool]
function p87_pool(K) {
  var P = [], j;
  [['хүү', false], ['охин', true]].forEach(function (sx) {
    var cnt = function (b) { return sx[1] ? K - b : b; };
    for (j = 1; j < K; j++) (function (j) {
      P.push(['Яг ' + p87_W[j] + ' нь ' + sx[0] + ' байх', function (b) { return cnt(b) === j; }]);
      P.push(['Ядаж ' + p87_W[j] + ' нь ' + sx[0] + ' байх', function (b) { return cnt(b) >= j; }]);
      P.push(['Хамгийн ихдээ ' + p87_W[j] + ' нь ' + sx[0] + ' байх', function (b) { return cnt(b) <= j; }]);
    })(j);
    P.push([(K === 3 ? 'Гурвуул ' : 'Дөрвүүл ') + sx[0] + ' байх', function (b) { return cnt(b) === K; }]);
  });
  return P;
}
function p87_set(K, f) { var s = ''; for (var b = 0; b <= K; b++) s += f(b) ? '1' : '0'; return s; }
function p87() {
  var K = rnd(1, 3) === 1 ? 4 : 3, P = p87_pool(K);
  var base = pick(P.filter(function (e) { return /^(Ядаж|Яг|Хамгийн ихдээ)/.test(e[0]); })), bs = p87_set(K, base[1]);
  var seen = {}, list = [];
  seen[bs] = 1;
  shuffle(P).forEach(function (e) {
    var s = p87_set(K, e[1]);
    if (list.length >= 4 || seen[s] || s.indexOf('0') < 0) return;   // давхардал, суурьтай ижил, бүх орчин — алгасна
    seen[s] = 1; list.push(e);
  });
  if (list.length < 4) return null;
  var bad = [];
  list.forEach(function (e, i) { var ok = false; for (var b = 0; b <= K; b++) if (base[1](b) && e[1](b)) ok = true; if (!ok) bad.push(p87_RM[i]); });
  if (bad.length < 1 || bad.length > 3) return null;
  var ans = bad.length === 1 ? bad[0] : bad.slice(0, -1).join(', ') + ' ба ' + bad[bad.length - 1];
  return {
    q: 'Ангиас ' + (K === 3 ? 'гурван' : 'дөрвөн') + ' хүүхэд сонгов. Дараах үзэгдлүүдээс аль нь “' + base[0] + '” үзэгдэлтэй нийцгүй байна вэ?'
      + '<div style="margin:2px 0 0 2.4em;line-height:1.5">' + list.map(function (e, i) { return '<div>' + p87_RM[i] + '. ' + e[0] + '</div>'; }).join('') + '</div>',
    a: '<span>' + ans + '</span>',
    wk: 18,
    t: { K: K, base: base[0], list: list.map(function (e) { return e[0]; }) }
  };
}
return p87;
})();

/* 2.88 */
var e2_88 = (function () {
// 88. Чанар шалгагч машины 2×2 хүснэгт: гэмтэлтэй/гэмтэлгүй бараа × «гэмтэлтэй гэж оношлогдсон»/«өнгөрүүлсэн».
//     Асуулт: P(оношлогдсон) (эх: (18+6)/200 = 3/25), P(гэмтэлтэй), P(зөв оношилсон),
//     P(гэмтэлтэй | оношлогдсон), P(гэмтэлтэй | өнгөрүүлсэн).  Хариу: эх шиг хураагаагүй = хураасан.
function p88() {
  var TP = rnd(8, 36), FN = rnd(1, 8), FP = rnd(2, 15), N = 10 * rnd(10, 30), TN = N - TP - FN - FP, T = rnd(1, 100), q, n, d;
  if (TN < 60) return null;
  if (T <= 40) { q = 'Эдгээрээс санамсаргүй сонгосон бараа гэмтэлтэй гэж оношлогдсон байх магадлалыг ол.'; n = TP + FP; d = N; }
  else if (T <= 55) { q = 'Эдгээрээс санамсаргүй сонгосон бараа гэмтэлтэй байх магадлалыг ол.'; n = TP + FN; d = N; }
  else if (T <= 70) { q = 'Эдгээрээс санамсаргүй сонгосон барааг машин зөв оношилсон байх магадлалыг ол.'; n = TP + TN; d = N; }
  else if (T <= 85) { q = 'Гэмтэлтэй гэж оношлогдсон бараанаас санамсаргүй сонгосон бараа үнэхээр гэмтэлтэй байх магадлалыг ол.'; n = TP; d = TP + FP; }
  else { q = 'Өнгөрүүлсэн бараанаас санамсаргүй сонгосон бараа гэмтэлтэй байх магадлалыг ол.'; n = FN; d = FN + TN; }
  var red = fr(n, d), raw = '\\dfrac{' + n + '}{' + d + '}';
  return {
    q: 'Чанар шалгагч машины ажлын үр дүнг хүснэгтээр өгчээ. ' + q,
    a: '$P=' + (red === raw ? raw : raw + '=' + red) + '$',
    fig: tbl([['', 'Гэмтэлтэй гэж оношлогдсон', 'Өнгөрүүлсэн'], ['Гэмтэлтэй бараа', TP, FN], ['Гэмтэлгүй бараа', FP, TN]]),
    wk: 22,
    t: { TP: TP, FN: FN, FP: FP, TN: TN }
  };
}
return p88;
})();

/* 2.89 */
var e2_89 = (function () {
// 89. Гипергеометр магадлал: N компаниас D нь дампуурсан, k өөр компаний хувьцаа авсан.
//     Ядаж 1: 1 − C_{N−D}^k / C_N^k (эх: N = 20, D = 4, k = 3 → 29/57);  яг 1: D·C_{N−D}^{k−1} / C_N^k;
//     ядаж 2: 1 − (C_{N−D}^k + D·C_{N−D}^{k−1}) / C_N^k;  аль нь ч биш: C_{N−D}^k / C_N^k.
function p89_C(n, k) { var r = 1; for (var i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
function p89_c(n, k) { return k === 1 ? String(n) : 'C_{' + n + '}^{' + k + '}'; }   // C_n^1 = n
function p89() {
  var N = rnd(10, 30), D = rnd(2, 6), k = rnd(2, 4), T = rnd(1, 100), G = N - D, tot = p89_C(N, k), q, f, num;
  if (D * 2 > N) return null;
  var z0 = p89_C(G, k), z1 = D * p89_C(G, k - 1);
  if (T <= 50) { q = 'Ядаж 1 компаний хувьцаа нь дампуурсан компанийх байх'; f = '1-\\dfrac{' + p89_c(G, k) + '}{' + p89_c(N, k) + '}'; num = tot - z0; }
  else if (T <= 75) { q = 'Яг 1 компаний хувьцаа нь дампуурсан компанийх байх'; f = '\\dfrac{' + D + '\\cdot ' + p89_c(G, k - 1) + '}{' + p89_c(N, k) + '}'; num = z1; }
  else if (T <= 88 || k < 3) { q = 'Авсан хувьцаануудын аль нь ч дампуурсан компанийх биш байх'; f = '\\dfrac{' + p89_c(G, k) + '}{' + p89_c(N, k) + '}'; num = z0; }
  else { q = 'Ядаж 2 компаний хувьцаа нь дампуурсан компанийх байх'; f = '1-\\dfrac{' + p89_c(G, k) + '+' + D + '\\cdot ' + p89_c(G, k - 1) + '}{' + p89_c(N, k) + '}'; num = tot - z0 - z1; }
  if (num <= 0 || num >= tot) return null;
  return {
    q: 'Хөрөнгийн зах дээр хувьцаагаа гаргасан ' + N + ' компаний ' + D + ' нь дампуурав. Иргэн ' + k + ' өөр компаний хувьцаа авсан байжээ. ' + q + ' магадлалыг ол.',
    a: '$P=' + f + '=' + fr(num, tot) + '$',
    wk: 24,
    t: { N: N, D: D, k: k }
  };
}
return p89;
})();

/* 2.90 */
var e2_90 = (function () {
// 90. Хүмүүсийн p% нь өвчтэй; шинжилгээ өвчгүй хүний s%-ийг, өвчтэй хүний e%-ийг зөв оношилдог.
//   Бүтэн магадлалын томьёо: P(онош зөв) = p·e + (1−p)·s (эх: 0.08·0.95 + 0.92·0.98 = 0.9776).
//   Хувилбар: P(онош буруу) = p(1−e) + (1−p)(1−s); P(өвчтэй гэж оношлогдох) = p·e + (1−p)(1−s);
//   Байес: P(өвчтэй | өвчтэй гэж оношлогдсон) = p·e / (p·e + (1−p)(1−s)) → хураасан бутархай ≈ 2 оронтой.
function p90_d(n) { return dec(n / 100); }   // 8 → 0.08
function p90() {
  var p = rnd(2, 20), s = rnd(85, 99), e = rnd(85, 99), kind = pick(['ok', 'ok', 'ok', 'ok', 'bad', 'pos', 'bayes', 'bayes']);
  var P = p90_d(p), Q = p90_d(100 - p), E = p90_d(e), E1 = p90_d(100 - e), S = p90_d(s), S1 = p90_d(100 - s);
  var ask, a, num, den;
  if (kind === 'ok') {
    num = p * e + (100 - p) * s;
    ask = 'Шинжилгээнд орсон хүмүүсээс санамсаргүй сонгосон хүний онош зөв байх магадлал аль вэ?';
    a = '$P=' + P + '\\cdot ' + E + '+' + Q + '\\cdot ' + S + '=' + dec(num / 10000) + '$';
  } else if (kind === 'bad') {
    num = p * (100 - e) + (100 - p) * (100 - s);
    ask = 'Шинжилгээнд орсон хүмүүсээс санамсаргүй сонгосон хүний онош буруу байх магадлал аль вэ?';
    a = '$P=' + P + '\\cdot ' + E1 + '+' + Q + '\\cdot ' + S1 + '=' + dec(num / 10000) + '$';
  } else if (kind === 'pos') {
    num = p * e + (100 - p) * (100 - s);
    ask = 'Шинжилгээнд орсон хүмүүсээс санамсаргүй сонгосон хүн чихрийн шижинтэй гэж оношлогдох магадлал аль вэ?';
    a = '$P=' + P + '\\cdot ' + E + '+' + Q + '\\cdot ' + S1 + '=' + dec(num / 10000) + '$';
  } else {
    num = p * e; den = p * e + (100 - p) * (100 - s);
    var g = gcd(num, den), n1 = num / g, d1 = den / g, v = n1 / d1, exact = Math.abs(v * 100 - Math.round(v * 100)) < 1e-12;
    if (d1 === 1) return null;
    ask = 'Шинжилгээгээр чихрийн шижинтэй гэж оношлогдсон хүн үнэхээр өвчтэй байх магадлал аль вэ?';
    a = '$P=\\dfrac{' + P + '\\cdot ' + E + '}{' + P + '\\cdot ' + E + '+' + Q + '\\cdot ' + S1 + '}=' + fr(n1, d1) + (exact ? '=' + dec(v, 2) : '\\approx ' + v.toFixed(2)) + '$';
  }
  var q = 'Хүмүүсийн $' + p + '\\%$ нь чихрийн шижинтэй гэсэн тооцоо гарчээ. Лабораторийн шинжилгээгээр чихрийн шижингүй хүмүүсийн $'
    + s + '\\%$, өвчтэй хүмүүсийн $' + e + '\\%$-ийг зөв оношилдог. ' + ask;
  return { q: q, a: a, wk: 26, t: { p: p, s: s, e: e, kind: kind } };
}
return p90;
})();

/* 3.45 */
var e3_45 = (function () {
// 45. Тархалтын хүснэгтэд нэг магадлал a үл мэдэгдэх ⇒ Σ P = 1 ⇒ a = 1 − (бусад магадлалын нийлбэр)
//     (эх: x 1, 2, 3, 4; P 0.15, 0.25, a, 0.4 → a = 0.2). Магадлал 0.05-ын алхамтай (эх шиг), зууны нэгжээр бүхэл тооцоо;
//     x нь 1..n (голдуу), 0..n−1 эсвэл 2..n+1; баганын тоо 3–5, a-гийн байрлал санамсаргүй.  (Ихэр 69 — b, 0.12 мэт хоёр оронтой.)
function p45() {
  var n = pick([3, 4, 4, 4, 5]), T = rnd(1, 10), x0 = T <= 7 ? 1 : T <= 9 ? 0 : 2, u = rnd(0, n - 1), P = [], S = 0, t;
  for (t = 0; t < n; t++) {
    if (t === u) { P.push(null); continue; }
    var v = 5 * rnd(1, n === 3 ? 10 : 8);                    // 0.05 … 0.5 (0.4), зууны нэгжээр
    P.push(v); S += v;
  }
  var a = 100 - S;
  if (a < 5 || a > 60) return null;
  if (P.every(function (v) { return v == null || v % 10 === 0; }) && rnd(0, 2)) return null;   // эх шиг 0.15, 0.25 мэт утга голдуу
  var xs = [], row = ['$P(X=x)$'];
  for (t = 0; t < n; t++) { xs.push(x0 + t); row.push(P[t] == null ? '$a$' : dec(P[t] / 100)); }
  return {
    q: '$X$ санамсаргүй хувьсагчийн магадлалын тархалтыг хүснэгтээр өгсөн бол $a$ тоог олоорой.',
    a: '$a=' + dec(a / 100) + '$',
    fig: tbl([['$x$'].concat(xs), row]),
    wk: 16,
    t: { xs: xs, P: P, a: a }
  };
}
return p45;
})();

/* 3.69 */
var e3_69 = (function () {
// 69. (45-ын ихэр) Тархалтын хүснэгтэд нэг магадлал b үл мэдэгдэх ⇒ Σ P = 1 ⇒ b = 1 − (бусад магадлалын нийлбэр)
//     (эх: x 1, 2, 3, 4; P 0.12, 0.23, b, 0.4 → b = 0.25). Эх шиг хоёр оронтой магадлал (0.12, 0.23 мэт — хамгийн багадаа хоёр нь
//     0.05-д хуваагдахгүй), заримдаа 0.4 мэт нэг оронтой; зууны нэгжээр бүхэл тооцоо. x нь 1..n (голдуу), 0..n−1 эсвэл 2..n+1.
function p69() {
  var n = pick([3, 4, 4, 4, 5]), T = rnd(1, 10), x0 = T <= 7 ? 1 : T <= 9 ? 0 : 2, u = rnd(0, n - 1), P = [], S = 0, odd = 0, t;
  for (t = 0; t < n; t++) {
    if (t === u) { P.push(null); continue; }
    var v = rnd(1, 4) === 1 ? 10 * rnd(1, n === 3 ? 5 : 4) : rnd(3, n === 3 ? 48 : 38);   // зууны нэгжээр
    if (v % 5) odd++;
    P.push(v); S += v;
  }
  var b = 100 - S;
  if (b < 5 || b > 60 || odd < 2) return null;
  var xs = [], row = ['$P(X=x)$'];
  for (t = 0; t < n; t++) { xs.push(x0 + t); row.push(P[t] == null ? '$b$' : dec(P[t] / 100)); }
  return {
    q: '$X$ санамсаргүй хувьсагчийн магадлалын тархалтыг хүснэгтээр өгсөн бол $b$ тоог олоорой.',
    a: '$b=' + dec(b / 100) + '$',
    fig: tbl([['$x$'].concat(xs), row]),
    wk: 16,
    t: { xs: xs, P: P, b: b }
  };
}
return p69;
})();

/* 2.60 */
var e2_60 = (function () {
// 60. Тархалтын хуулийн хүснэгтэд нэг магадлал a үл мэдэгдэх → a = 1 − Σ (эх: 0.1, 0.2, a → 0.7).
//     X-ийн утга 1..n (голдуу), 0..n−1, −1..n−2 эсвэл 2, 4, 6, …; магадлал 0.1 эсвэл 0.05-ийн алхамтай.
function p60() {
  var n = pick([3, 3, 4, 4, 5]), ty = rnd(1, 10), xs = [], t;
  for (t = 0; t < n; t++) xs.push(ty <= 6 ? t + 1 : ty <= 8 ? t : ty === 9 ? t - 1 : 2 * (t + 1));
  var u = rnd(1, 10) <= 6 ? n - 1 : rnd(0, n - 1), step = rnd(1, 10) <= 6 ? 100 : 50, P = [], S = 0;
  for (t = 0; t < n; t++) {
    if (t === u) { P.push(null); continue; }
    var v = step * rnd(1, step === 100 ? 4 : 7);
    P.push(v); S += v;
  }

/* 3.79 */

/* 1.7 */
var e1_7 = (function () {
// 7. Гипергеометр тархалт: N = r + w бөмбөгнөөс n-ийг буцаалтгүй авахад X — тухайн өнгийн (K ширхэг) бөмбөгний тоо.

var p7_C = [['улаан', 'цагаан'], ['хар', 'цагаан'], ['улаан', 'хар'], ['шар', 'хөх'], ['улаан', 'ногоон']];
var p7_W = { 2: 'хоёр', 3: 'гурван' };
function p7() {
  var r = rnd(2, 5), w = rnd(2, 5), n = pick([2, 2, 3]), N = r + w;
  var col = rnd(0, 9) < 6 ? p7_C[0] : pick(p7_C), cnt = rnd(0, 9) < 7 ? 1 : 0;   // cnt: X нь аль өнгийг тоолох
  var K = cnt ? w : r;
  var num = n * K * (N - K) * (N - n), den = N * N * (N - 1);
  // Бодолт (гар бичмэл): нийт C_N^n боломж → X-ийн тархалт P(X=k) = C_K^k·C_{N−K}^{n−k}/C_N^n → E(X), E(X²), D = E(X²) − (E(X))².

    wk: 32,
    s: [
      'Нийт боломжийн тоо $C_{' + N + '}^{' + n + '}=\\dfrac{' + (n === 2 ? N + '\\cdot ' + (N - 1) + '}{2}' : N + '\\cdot ' + (N - 1) + '\\cdot ' + (N - 2) + '}{2\\cdot 3}') + '=' + CN + '$.',
      '$k$ ' + col[cnt] + ', $' + n + '-k$ ' + col[1 - cnt] + ' бөмбөг сонгох боломжийн тоо $C_{' + K + '}^{k}\\cdot C_{' + M + '}^{' + n + '-k}$ тул '
        + '$$\\begin{aligned}' + rows.join(',\\\\') + '.\\end{aligned}$$',
      '$$\\begin{aligned}E(X)&=' + e1.join('+') + '=' + EX + ',\\\\E(X^2)&=' + e2.join('+') + '=' + EX2 + '.\\end{aligned}$$',
      'Иймд $$D(X)=E(X^2)-\\big(E(X)\\big)^2=' + EX2 + '-' + sqE + '=' + fr(S2 * CN - S1 * S1, CN * CN) + '.$$'

})();
