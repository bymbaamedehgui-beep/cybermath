<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V бүлэг — Жишиг даалгавар 1 (6-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 6-р анги · V бүлэг. Алгебрын илэрхийлэл, тэгшитгэл — Жишиг даалгавар 1
   (5.1 Алгебрын илэрхийлэл зохиох, түүний утгыг олох · 5.2 Алгебрын илэрхийллийг хялбарчлах ·
    5.3 Гишүүнчлэн үржүүлэх ба хаалтаас ерөнхий үржигдэхүүн гаргах) */
// Гишүүн: c·v (1x→x, -1x→-x); v='' бол сул гишүүн
function tm(c, v) { if (v === '') return '' + c; if (c === 1) return v; if (c === -1) return '-' + v; return c + v; }
// [{c,v}] → '2x-3y+5' (тэг коэффициенттэйг алгасна)
function pl(ts) {
  var s = '';
  ts.forEach(function (t) { var c = t.c, v = t.v || ''; if (!c) return; var body = v === '' ? '' + Math.abs(c) : (Math.abs(c) === 1 ? '' : Math.abs(c)) + v; s += (s === '' ? (c < 0 ? '-' : '') : (c < 0 ? '-' : '+')) + body; });
  return s === '' ? '0' : s;
}
function br(k, inner) { return (k === 1 ? '' : k === -1 ? '-' : k) + '(' + inner + ')'; }   // k(…)
function pbr(k, inner) { return k < 0 ? '-' + br(-k, inner) : '+' + br(k, inner); }        // +k(…) / -k(…)
var PAIRS = [['a', 'b'], ['x', 'y'], ['m', 'n'], ['p', 'q']];
var TRIPLES = [['a', 'b', 'c'], ['x', 'y', 'z'], ['m', 'n', 'k'], ['p', 'q', 'r']];
var GOODS = [['дэвтэр', 'үзэг', 'үзгийн'], ['ном', 'харандаа', 'харандааны'], ['бал', 'баллуур', 'баллуурын'], ['алим', 'жүрж', 'жүржийн']];
var ANIM = [['тахиа', 'хонь', 'хонины'], ['галуу', 'ямаа', 'ямааны'], ['нугас', 'туулай', 'туулайн'], ['тахиа', 'үхэр', 'үхрийн']];
// Төрлийн уут: нэг хуудсанд даалгаврын бодлогууд өөр өөр төрлөөс (бүх төрөл гарсны дараа л давтагдана).
// Хөдөлгүүр даалгавруудыг дарааллаар нь үүсгэдэг тул 1-р даалгавар дахин эхлэхэд (шинэ хуудас) уутнуудыг шинэчилнэ.
var BAGS = [], LAST = 0;
function bag(n) {
  var o = { b: [] }; BAGS.push(o);
  return function () { if (!o.b.length) { for (var i = 0; i < n; i++) o.b.push(i); o.b = shuffle(o.b); } return o.b.pop(); };
}
function turn(id) { if (id === 1 && LAST !== 1) BAGS.forEach(function (o) { o.b = []; }); LAST = id; }
var B1 = bag(16), B2 = bag(4), B3 = bag(6), B4 = bag(5), B5 = bag(6);

// 1. Өгүүлбэрийг алгебрын илэрхийлэл болгох (5.1): нэмэх, хасах, дахин ихэсгэх/багасгах, хоёр үйлдэл, хоёр хувьсагч;
//    амьдралын нөхцөл — нийт үнэ, хөлийн тоо, нас, хариулт мөнгө, зам, периметр
function g1() {
  turn(1);
  var V = pick(['x', 'a', 'n', 'm', 'y']), n = rnd(2, 9), m = rnd(2, 15), t = B1();
  if (n === m) return null;
  if (t === 0) return { stem: '$' + V + '$ тоон дээр $' + m + '$ тоог нэмэв.', a: V + '+' + m };
  if (t === 1) return { stem: '$' + V + '$ тооноос $' + m + '$ тоог хасав.', a: V + '-' + m };
  if (t === 2) return { stem: '$' + V + '$ тоог $' + n + '$ дахин нэмэгдүүлэв.', a: n + V };
  if (t === 3) return { stem: '$' + V + '$ тоог $' + n + '$ дахин багасгав.', a: '\\dfrac{' + V + '}{' + n + '}' };
  if (t === 4) return { stem: '$' + V + '$ тоог $' + n + '$ дахин нэмэгдүүлээд, $' + m + '$ тоог нэмэв.', a: n + V + '+' + m };
  if (t === 5) return { stem: '$' + V + '$ тоог $' + n + '$ дахин нэмэгдүүлээд, $' + m + '$ тоог хасав.', a: n + V + '-' + m };
  if (t === 6) return { stem: '$' + V + '$ тоон дээр $' + m + '$ тоог нэмээд, $' + n + '$ дахин нэмэгдүүлэв.', a: n + '(' + V + '+' + m + ')' };
  if (t === 7) return { stem: '$' + V + '$ тооноос $' + m + '$ тоог хасаад, $' + n + '$ дахин багасгав.', a: '\\dfrac{' + V + '-' + m + '}{' + n + '}' };
  if (t === 8) return { stem: '$x$ ба $y$ тооны нийлбэрийг $' + n + '$ дахин нэмэгдүүлэв.', a: n + '(x+y)' };
  if (t === 9) return { stem: '$y$ тоог $' + n + '$ дахин нэмэгдүүлээд, $x$ тооноос хасав.', a: 'x-' + n + 'y' };
  if (t === 10) {
    var G = pick(GOODS), n2 = rnd(2, 9); if (n2 === n) return null;
    return { stem: 'Нэг ' + G[0] + ' $a$ төгрөг, нэг ' + G[1] + ' $b$ төгрөг бол $' + n + '$ ' + G[0] + ', $' + n2 + '$ ' + G[2] + ' нийт үнэ.', a: '$' + n + 'a+' + n2 + 'b$ төгрөг' };
  }
  if (t === 11) { var Z = pick(ANIM); return { stem: '$a$ ' + Z[0] + ', $b$ ' + Z[2] + ' хөлийн нийт тоо.', a: '2a+4b' }; }
  if (t === 12) {
    if (rnd(0, 1)) return { stem: 'Одоо $x$ настай хүүгийн $' + m + '$ жилийн дараах нас.', a: 'x+' + m };
    return { stem: 'Одоо $x$ настай ээжийн $' + m + '$ жилийн өмнөх нас.', a: 'x-' + m };
  }
  if (t === 13) {
    var N = 1000 * rnd(5, 20);
    return { stem: 'Нэг дэвтэр $x$ төгрөг. $' + n + '$ дэвтэр аваад $' + th(N) + '$ төгрөг өгөхөд авах хариулт мөнгө.', a: '$' + th(N) + '-' + n + 'x$ төгрөг' };
  }
  if (t === 14) return { stem: '$v$ км/ц хурдтай машины $' + n + '$ цагт туулах зам.', a: '$' + n + 'v$ км' };
  if (rnd(0, 1)) return { stem: 'Нэг тал нь $a$ см квадратын периметр.', a: '$4a$ см' };
  return { stem: 'Талууд нь $a$ см ба $b$ см тэгш өнцөгтийн периметр.', a: '$2(a+b)=2a+2b$ см' };
}

// 2. Илэрхийллийн тоон утгыг олох (5.1): kx+b, b−kx, k(x+b), kx²+c — орлуулалтыг хариунд харуулна
//    (илэрхийлэл ба утгыг {}-д хийнэ — KaTeX «=»-ийн дараа мөр таслахгүй)
function g2() {
  turn(2);
  var V = pick(['x', 'a', 'b', 'm', 'y', 'n']), t = B2(), v = nz(-9, 9), k, b, e, st, val;
  if (t === 0) {
    k = nz(-9, 9); b = nz(-20, 20); if (Math.abs(k) === 1) return null;
    e = pl([{ c: k, v: V }, { c: b, v: '' }]); val = k * v + b; st = k + '\\cdot ' + par(v) + sgn(b);
  } else if (t === 1) {
    k = rnd(2, 9); b = rnd(2, 30);
    e = b + '-' + k + V; val = b - k * v; st = b + '-' + k + '\\cdot ' + par(v);
  } else if (t === 2) {
    k = rnd(2, 9); b = nz(-12, 12); if (v + b === 0) return null;
    e = k + '(' + pl([{ c: 1, v: V }, { c: b, v: '' }]) + ')'; val = k * (v + b); st = k + '\\cdot ' + par(v + b);
  } else {
    k = rnd(1, 5); b = nz(-20, 20); v = nz(-6, 6);
    e = pl([{ c: k, v: V + '^{2}' }, { c: b, v: '' }]); val = k * v * v + b; st = (k === 1 ? '' : k + '\\cdot ') + par(v) + '^{2}' + sgn(b);
  }
  return { stem: '${' + e + '}$, ${' + V + '=' + v + '}$', a: st + '=' + val };
}

// 3. Илэрхийллийг хялбарчлах (5.2 төсөөтэй гишүүдийг эмхэтгэх · 5.3 гишүүнчлэн үржүүлж хаалт задлах)
function g3() {
  turn(3);
  var t = B3(), P = pick(PAIRS), V = P[0], W = P[1], ts, A, B, C0, i;
  if (t === 0) {                                   // нэг хувьсагчтай 3–4 гишүүн
    var cnt = rnd(3, 4); ts = []; A = 0;
    for (i = 0; i < cnt; i++) { ts.push({ c: nz(-12, 12), v: V }); A += ts[i].c; }
    if (A === 0 || Math.abs(A) > 20) return null;
    return { stem: '$' + pl(ts) + '$', a: tm(A, V) };
  }
  if (t === 1) {                                   // хоёр хувьсагчтай 4 гишүүн
    var a1 = nz(-9, 9), a2 = nz(-9, 9), b1 = nz(-9, 9), b2 = nz(-9, 9); A = a1 + a2; B = b1 + b2;
    if (A === 0 && B === 0) return null;
    ts = shuffle([{ c: a1, v: V }, { c: a2, v: V }, { c: b1, v: W }, { c: b2, v: W }]);
    return { stem: '$' + pl(ts) + '$', a: pl([{ c: A, v: V }, { c: B, v: W }]) };
  }
  if (t === 2) {                                   // сул гишүүнтэй 5 гишүүн
    var c1 = nz(-9, 9), c2 = nz(-9, 9), d1 = nz(-9, 9), d2 = nz(-9, 9), e1 = nz(-9, 9);
    A = d1 + d2; C0 = c1 + c2; if (A === 0 || C0 === 0) return null;
    ts = [{ c: c1, v: '' }, { c: d1, v: V }, { c: e1, v: W }, { c: d2, v: V }, { c: c2, v: '' }];
    return { stem: '$' + pl(ts) + '$', a: pl([{ c: A, v: V }, { c: e1, v: W }, { c: C0, v: '' }]) };
  }
  if (t === 3) {                                   // k(x+b) ± mx
    var k = nz(-9, 9), b = nz(-9, 9), m = nz(-9, 9); A = k + m;
    if (Math.abs(k) === 1 || A === 0) return null;
    return { stem: '$' + br(k, pl([{ c: 1, v: V }, { c: b, v: '' }])) + (m < 0 ? '-' : '+') + tm(Math.abs(m), V) + '$', a: pl([{ c: A, v: V }, { c: k * b, v: '' }]) };
  }
  if (t === 4) {                                   // k₁(x+a) ± k₂(x+b)
    var k1 = nz(-9, 9), k2 = nz(-9, 9), p = nz(-9, 9), q = nz(-9, 9);
    if (Math.abs(k1) === 1 || Math.abs(k2) === 1) return null;
    A = k1 + k2; C0 = k1 * p + k2 * q; if (A === 0 && C0 === 0) return null;
    return { stem: '$' + br(k1, pl([{ c: 1, v: V }, { c: p, v: '' }])) + pbr(k2, pl([{ c: 1, v: V }, { c: q, v: '' }])) + '$', a: pl([{ c: A, v: V }, { c: C0, v: '' }]) };
  }
  var K = nz(-9, 9), r1 = rnd(1, 9), r2 = nz(-9, 9), r0 = nz(-15, 15);   // гурван гишүүнт хаалт задлах
  if (Math.abs(K) === 1) return null;
  return { stem: '$' + br(K, pl([{ c: r1, v: V }, { c: r2, v: W }, { c: r0, v: '' }])) + '$', a: pl([{ c: K * r1, v: V }, { c: K * r2, v: W }, { c: K * r0, v: '' }]) };
}

// 4. Хаалтаас ерөнхий үржигдэхүүн гаргах (5.3): хоёр ба гурван гишүүнт; тоон илэрхийллийг ерөнхий үржигдэхүүн гаргаж хялбар бодох
function g4() {
  turn(4);
  var t = B4(), g = pick([2, 3, 4, 5, 6, 7, 8, 9, 10, 12]), T = pick(TRIPLES), a, b, c, w;
  if (t <= 1) {                                    // ga·x + gb·y  эсвэл  ga·x + gb
    a = rnd(1, 9); b = nz(-9, 9); if (gcd(a, b) !== 1) return null;
    w = t === 0 ? T[1] : '';
    return { stem: '$' + pl([{ c: g * a, v: T[0] }, { c: g * b, v: w }]) + '$', a: g + '(' + pl([{ c: a, v: T[0] }, { c: b, v: w }]) + ')' };
  }
  if (t <= 3) {                                    // гурван гишүүнт
    a = rnd(1, 7); b = nz(-7, 7); c = nz(-9, 9); if (gcd(gcd(a, b), c) !== 1) return null;
    w = t === 2 ? '' : T[2];
    return { stem: '$' + pl([{ c: g * a, v: T[0] }, { c: g * b, v: T[1] }, { c: g * c, v: w }]) + '$', a: g + '(' + pl([{ c: a, v: T[0] }, { c: b, v: T[1] }, { c: c, v: w }]) + ')' };
  }
  var d = pick([4, 5, 8, 12, 25]), m = rnd(11, 89);           // d·m ± d·n — хялбар аргаар
  if (rnd(0, 1)) {
    var n = 100 - m; if (n === m) return null;
    return { stem: '$' + d + '\\cdot ' + m + '+' + d + '\\cdot ' + n + '$', a: d + '\\cdot (' + m + '+' + n + ')=' + d + '\\cdot 100=' + (100 * d) };
  }
  var n2 = m - pick([10, 20, 30, 40]); if (n2 < 2) return null;
  return { stem: '$' + d + '\\cdot ' + m + '-' + d + '\\cdot ' + n2 + '$', a: d + '\\cdot (' + m + '-' + n2 + ')=' + d + '\\cdot ' + (m - n2) + '=' + (d * (m - n2)) };
}

// 5. Өгүүлбэртэй бодлого (5.1 · 5.3): илэрхийлэл зохиож утгыг олох (үнэ, хөл), периметр, талбай, зам, мод тарих
function g5() {
  turn(5);
  var t = B5();
  if (t === 0) {
    var G = pick(GOODS), n1 = rnd(2, 9), n2 = rnd(2, 9), A = 100 * rnd(3, 15), B = 100 * rnd(2, 12);
    if (n1 === n2 || A === B) return null;
    return { stem: 'Нэг ' + G[0] + ' $a$ төгрөг, нэг ' + G[1] + ' $b$ төгрөг. $' + n1 + '$ ' + G[0] + ', $' + n2 + '$ ' + G[2] + ' нийт үнийг илэрхийлж, ${a=' + A + '}$, ${b=' + B + '}$ үед утгыг ол.',
      a: '$' + n1 + 'a+' + n2 + 'b$; $' + n1 + '\\cdot ' + A + '+' + n2 + '\\cdot ' + B + '=' + th(n1 * A + n2 * B) + '$ төгрөг' };
  }
  if (t === 1) {
    var Z = pick(ANIM), x = rnd(5, 40), y = rnd(5, 40); if (x === y) return null;
    return { stem: 'Фермд $x$ ' + Z[0] + ', $y$ ' + Z[1] + ' бий. Тэдний хөлийн нийт тоог илэрхийлж, ${x=' + x + '}$, ${y=' + y + '}$ үед утгыг ол.',
      a: '$2x+4y$; $2\\cdot ' + x + '+4\\cdot ' + y + '=' + (2 * x + 4 * y) + '$' };
  }
  if (t === 2) {
    var s = [[rnd(1, 4), nz(-5, 9)], [rnd(1, 4), nz(-5, 9)], [rnd(1, 4), nz(-5, 9)]], SA = 0, SB = 0;
    s.forEach(function (p) { SA += p[0]; SB += p[1]; });
    if (SB === 0) return null;
    return { stem: 'Гурвалжны талууд $(' + pl([{ c: s[0][0], v: 'x' }, { c: s[0][1], v: '' }]) + ')$ см, $(' + pl([{ c: s[1][0], v: 'x' }, { c: s[1][1], v: '' }]) + ')$ см, $(' + pl([{ c: s[2][0], v: 'x' }, { c: s[2][1], v: '' }]) + ')$ см. Периметрийг илэрхийлж хялбарчил.',
      a: '$P=' + pl([{ c: SA, v: 'x' }, { c: SB, v: '' }]) + '$ см' };
  }
  if (t === 3) {
    var k = rnd(2, 9), m = rnd(1, 3), h = nz(-6, 9), inner = pl([{ c: m, v: 'x' }, { c: h, v: '' }]);
    return { stem: 'Тэгш өнцөгтийн урт $(' + inner + ')$ см, өргөн $' + k + '$ см. Талбайг илэрхийлж, хаалтыг задал.',
      a: '$S=' + k + '(' + inner + ')=' + pl([{ c: k * m, v: 'x' }, { c: k * h, v: '' }]) + '$ см$^{2}$' };
  }
  if (t === 4) {
    var v1 = rnd(6, 18), v2 = rnd(4, 15), dh = rnd(1, 3); if (v1 === v2) return null;
    return { stem: 'Морьтой хүн $' + v1 + '$ км/ц хурдтай $t$ цаг, дараа нь $' + v2 + '$ км/ц хурдтай $(t-' + dh + ')$ цаг явжээ. Нийт замыг илэрхийлж хялбарчил.',
      a: '$' + v1 + 't+' + v2 + '(t-' + dh + ')=' + pl([{ c: v1 + v2, v: 't' }, { c: -v2 * dh, v: '' }]) + '$ км' };
  }
  var d = rnd(3, 15), s0 = 5 * rnd(4, 20), t1 = rnd(2, 5), t2 = rnd(2, 5), t3 = rnd(1, 3);
  if (t1 === t2) return null;
  return { stem: '$x$ багш, $(x-' + d + ')$ ажилчин, $(x+' + s0 + ')$ сурагч мод тарьжээ. Багш бүр $' + t1 + '$, ажилчин бүр $' + t2 + '$, сурагч бүр $' + t3 + '$ мод тарьсан бол нийт модны тоог илэрхийлж хялбарчил.',
    a: '$' + t1 + 'x+' + t2 + '(x-' + d + ')' + (t3 === 1 ? '+(x+' : '+' + t3 + '(x+') + s0 + ')=' + pl([{ c: t1 + t2 + t3, v: 'x' }, { c: -t2 * d + t3 * s0, v: '' }]) + '$' };
}

CMX.jishig({
  title: 'V бүлэг — Жишиг даалгавар 1',
  sub: 'Илэрхийлэл зохиох, утгыг олох · хялбарчлах · гишүүнчлэн үржүүлэх · ерөнхий үржигдэхүүн',
  grade: '6-р анги',
  rule: 'Төсөөтэй гишүүд: $5x-2x+x=4x$ &nbsp;·&nbsp; $a(b+c)=ab+ac$, $\\ -(b-c)=-b+c$ &nbsp;·&nbsp; $ab+ac=a(b+c)$',
  tasks: [
    { label: 'Өгүүлбэрийг алгебрын илэрхийлэл болгож бич.', gen: g1, n: 8, nw: 2, cols: 2, wk: 10 },
    { label: 'Илэрхийллийн тоон утгыг ол.', gen: g2, n: 12, nw: 3, cols: 3, wk: 12 },
    { label: 'Илэрхийллийг хялбарчил.', gen: g3, n: 10, nw: 4, cols: 2, wk: 12 },
    { label: 'Ерөнхий үржигдэхүүнийг хаалтаас гарга.', gen: g4, n: 12, nw: 4, cols: 4, wk: 12 },
    { label: 'Бодлогыг бод.', gen: g5, n: 6, nw: 2, cols: 2, wk: 22 }
  ]
});
</script>
<script src="/ws-store.js?v=40"></script>
