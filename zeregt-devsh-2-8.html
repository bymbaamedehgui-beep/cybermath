<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}

  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:18mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}

<script>
// ══════════ g8core.js — 8-р ангийн нийтлэг хөдөлгүүр (бүлгийн сангийн ӨМНӨ залгагдана) ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ g8ch1.js — I БҮЛЭГ. ТООН ОЛОНЛОГ, ЗЭРЭГ ЯЗГУУР ══════════
// Сурах бичгийн 6–20 хуудасны ДАСГАЛУУДЫН хэлбэрээр зохиогдсон.
// ЗАРЧИМ: тооцооллын бодлогод q нь ЗӨВХӨН илэрхийлэл. Заавар нь plan.json дахь task.label-д ганц удаа.
// g8core.js доторх helper-үүд (rnd,nz,pick,shuffle,gcd,lcm,paren,Fr,fAdd,fSub,fMul,fDiv,fVal,fTex,fMix,pFr,
// decLatex,decPlain,repToFr,roundPlace,roundDec,fmtDec,sigRound,powClean,decStr,isqrt,icbrt,numline...) энэ файлын ӨМНӨ залгагдана.

// ═══════════ ЗУРГИЙН ТУСЛАХУУД (цэвэрхэн, хариу илчлэхгүй) ═══════════
// Хүснэгт: rows — мөр бүр нүдний массив; эхний мөр толгой.
function figTbl(rows){
 var h='<table style="border-collapse:collapse;margin:3px auto;font-size:12.5px;line-height:1.2">';
 for(var i=0;i<rows.length;i++){
  h+='<tr>';
  for(var j=0;j<rows[i].length;j++){
   var hd=(i===0||j===0);
   h+='<td style="border:1px solid #7B52EE;padding:3px 9px;text-align:center;min-width:30px;height:20px;'
     +(hd?'background:#f3f0ff;color:#4c2fb5;font-weight:600;':'color:#221;')+'">'+rows[i][j]+'</td>';
  }
  h+='</tr>';
 }
 return h+'</table>';
}
// Тоон шулуун дээр нэрлэсэн цэгүүд (утгыг НЬ БИЧИХГҮЙ — зөвхөн үсэг)
// pts: [{x:<байрлал>,l:'A'}] ; lo..hi бүхэл хуваарь
function figPts(lo,hi,pts,sub){
 var W=340,H=52,pad=20,u=(W-2*pad)/(hi-lo),g='';
 g+='<line x1="'+pad+'" y1="30" x2="'+(W-pad)+'" y2="30" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',30 '+(W-pad-7)+',26.5 '+(W-pad-7)+',33.5" fill="#555"/>';
 var step=(hi-lo)>12?2:1,v;
 for(v=lo;v<=hi;v++){var x=pad+(v-lo)*u;
  g+='<line x1="'+x.toFixed(1)+'" y1="26" x2="'+x.toFixed(1)+'" y2="34" stroke="#555" stroke-width="1"/>';
  if((v-lo)%step===0)g+='<text x="'+x.toFixed(1)+'" y="46" font-size="9.5" text-anchor="middle" fill="#555">'+v+'</text>';}
 if(sub){for(var k=0;k<(hi-lo)*sub;k++){var xs=pad+k*u/sub;g+='<line x1="'+xs.toFixed(1)+'" y1="28" x2="'+xs.toFixed(1)+'" y2="32" stroke="#aaa" stroke-width="0.7"/>';}}
 (pts||[]).forEach(function(p){var x=pad+(p.x-lo)*u;
  g+='<circle cx="'+x.toFixed(1)+'" cy="30" r="3.2" fill="#7B52EE"/>';
  g+='<text x="'+x.toFixed(1)+'" y="17" font-size="11" font-style="italic" font-weight="700" text-anchor="middle" fill="#5a32d6">'+p.l+'</text>';});
 return '<svg viewBox="0 0 '+W+' '+H+'" width="322">'+g+'</svg>';
}
// Хоосон тоон шулуун (тэмдэглэх даалгаварт)
function figBlankLine(lo,hi,sub){return figPts(lo,hi,[],sub);}
// Үүрлэсэн олонлогийн диаграм N ⊂ Z ⊂ Q (хоосон — элемент бичихгүй)
function figNZQ(){
 var g='';
 g+='<rect x="4" y="4" width="256" height="112" rx="9" fill="#faf8ff" stroke="#7B52EE" stroke-width="1.3"/>';
 g+='<ellipse cx="132" cy="66" rx="104" ry="42" fill="#f3efff" stroke="#8b5cf6" stroke-width="1.2"/>';
 g+='<ellipse cx="132" cy="72" rx="66" ry="28" fill="#ebe4ff" stroke="#a855f7" stroke-width="1.2"/>';
 g+='<text x="132" y="22" font-size="12" text-anchor="middle" fill="#4c2fb5">Рационал тоо ℚ</text>';
 g+='<text x="132" y="42" font-size="11" text-anchor="middle" fill="#5a32d6">Бүхэл тоо ℤ</text>';
 g+='<text x="132" y="78" font-size="11" text-anchor="middle" fill="#6d28d9">Натурал тоо ℕ</text>';
 return '<svg viewBox="0 0 264 120" width="234">'+g+'</svg>';
}
// Тоймлолын завсрын зураг (хоосон: зөвхөн тоймлосон утга голд)
function figRoundBand(R){
 var g='';
 g+='<line x1="20" y1="26" x2="300" y2="26" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="300,26 293,22.5 293,29.5" fill="#555"/>';
 g+='<line x1="160" y1="18" x2="160" y2="34" stroke="#7B52EE" stroke-width="1.8"/>';
 g+='<text x="160" y="46" font-size="10.5" text-anchor="middle" fill="#5a32d6">'+R+'</text>';
 g+='<line x1="70" y1="20" x2="70" y2="32" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 2"/>';
 g+='<line x1="250" y1="20" x2="250" y2="32" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 2"/>';
 g+='<text x="70" y="14" font-size="10" text-anchor="middle" fill="#999">?</text>';
 g+='<text x="250" y="14" font-size="10" text-anchor="middle" fill="#999">?</text>';
 return '<svg viewBox="0 0 312 52" width="286">'+g+'</svg>';
}
// Тэгш өнцөгт (хэмжээ бүхий) — талбай/эзлэхүүний бодлогод
function figRect(wLab,hLab){
 var g='';
 g+='<rect x="34" y="14" width="150" height="64" fill="#f7f5ff" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<text x="109" y="90" font-size="11.5" text-anchor="middle" fill="#221">'+wLab+'</text>';
 g+='<text x="24" y="50" font-size="11.5" text-anchor="end" fill="#221">'+hLab+'</text>';
 return '<svg viewBox="0 0 200 98" width="184">'+g+'</svg>';
}
// Тэгш өнцөгт параллелепипед (эзлэхүүн)

// ═══════════ НИЙТЛЭГ ТУСЛАХУУД ═══════════
function pw(base,e){return base+'^{'+e+'}';}
function pB(s){return '\\bigl('+s+'\\bigr)';}          // хаалт (\left/\right-гүй)
function pN(n){return n<0?'\\bigl('+n+'\\bigr)':''+n;} // сөрөг тоог хаалтад
function pF(a){var t=fMix(a);return a.n<0?'\\bigl('+t+'\\bigr)':t;}
function pFt(a){var t=fTex(a);return a.n<0?'\\bigl('+t+'\\bigr)':t;}
function xT(fr){if(fr.n<0)return '-'+fTex(Fr(-fr.n,fr.d));return '+'+fTex(fr);}
function okF(fr){return fr&&isFinite(fr.n)&&isFinite(fr.d)&&Math.abs(fr.n)<=99999&&fr.d<=9999;}
function rFrac(lo,hi,dens){return Fr(nz(lo,hi),pick(dens||[2,3,4,5,6,8,10]));}
function eq(x,y){return Math.abs(x-y)<1e-9;}

// Утгын нэгдсэн үүсгэгч: {tex,fr,form}
function numForm(fr,form){
 if(form==='mix')return fMix(fr);
 var d=decLatex(fr);
 if(form==='dec')return (d.indexOf('(')<0)?d:null;
 if(form==='rep')return (d.indexOf('(')>=0)?d:null;
 return null;
}
// нэг бүхэл хэсэгтэй хоёр өөр тоо (жиших дасгалд тохиромжтой)
function pairSameInt(){
 var s=pick([1,-1]),w=rnd(1,9);
 var D=[3,4,5,6,8,9,10,11,12,16,20,25];
 for(var t=0;t<40;t++){
  var d1=pick(D),d2=pick(D),n1=rnd(1,d1-1),n2=rnd(1,d2-1);
  var f1=Fr(n1,d1),f2=Fr(n2,d2);
  if(fVal(f1)===fVal(f2))continue;
  var v1=Fr(s*(w*f1.d+f1.n),f1.d),v2=Fr(s*(w*f2.d+f2.n),f2.d);
  if(fVal(v1)===fVal(v2))continue;
  return [v1,v2];
 }
 return null;
}
function anyForm(fr){
 var fs=shuffle(['mix','dec','rep']);
 for(var i=0;i<fs.length;i++){var t=numForm(fr,fs[i]);if(t)return {tex:t,form:fs[i]};}
 return null;
}

// [дасгал 3, Өөрийгөө сорих-1] Рационал тоо мөн үү? Ногдвор хэлбэрт бич.
var RATQ=[
 ['0.8',[4,5]],['0.125',[1,8]],['11',[11,1]],['3.77',[377,100]],['0.001',[1,1000]],
 ['-0.7',[-7,10]],['0',[0,1]],['-1',[-1,1]],['\\dfrac{3}{10}',[3,10]],['\\sqrt{16}',[4,1]],
 ['\\dfrac{7}{-9}',[-7,9]],['-0.9',[-9,10]],['0.45',[9,20]],['-0.258',[-129,500]],['-0.312',[-39,125]],
 ['\\sqrt{0.09}',[3,10]],['\\sqrt{1.44}',[6,5]],['-2\\dfrac{1}{3}',[-7,3]],['\\sqrt[3]{-8}',[-2,1]],
 ['4.05',[81,20]],['-0.024',[-3,125]],['\\sqrt{2.25}',[3,2]],['1.6',[8,5]],['-12.5',[-25,2]]
];
var IRRQ=['\\sqrt{2}','\\sqrt{5}','\\sqrt{10}','\\sqrt{0.5}','\\sqrt[3]{2}','\\sqrt{7}'];
function g_isRational(){
 if(rnd(1,6)===1){var s=pick(IRRQ);
  return {q:'$'+s+'$',a:'$'+s+'$ нь рационал тоо БИШ (ногдвор хэлбэрт бичигдэхгүй).',key:'ir-'+s};}
 var p=pick(RATQ),fr=Fr(p[1][0],p[1][1]);
 return {q:'$'+p[0]+'$',a:'$'+p[0]+'$ нь рационал тоо: $'+p[0]+'='+fTex(fr)+'$',key:'rq-'+p[0],nv:fVal(fr)};

// [Өөрийгөө сорих-1 №1] Аравтын бутархайг энгийн бутархай хэлбэрт бич.
function g_toQuotient(){
 var dec=rnd(1,3),s=pick([1,-1]),ip=rnd(0,4);
 var m=Math.pow(10,dec),fp=rnd(1,m-1);
 if(fp%10===0&&dec>1)return null;
 var fr=Fr(s*(ip*m+fp),m);
 var tex=decLatex(fr);
 if(tex.indexOf('(')>=0)return null;
 return {q:'$'+tex+'$',a:'$'+tex+'='+fTex(fr)+'$',key:'tq-'+fr.n+'/'+fr.d,nv:fVal(fr)};
}
// [дасгал 1] Тоон шулуун дээрх цэгүүдийг координаттай нь харгалзуул.
function g_numlineMatch(){
 var lo=-4,hi=4,LET=['A','B','C','D'],n=3,used={},pts=[],vals=[];
 for(var i=0;i<n;i++){
  for(var t=0;t<50;t++){
   var k=rnd(lo*4+1,hi*4-1);
   if(k%4===0||used[k])continue;
   used[k]=1;pts.push({x:k/4,l:LET[i]});vals.push(Fr(k,4));break;
  }
 }
 if(pts.length<n)return null;
 var idx=shuffle([0,1,2]);
 var shown=idx.map(function(j){return fMix(vals[j]);});
 var ans=pts.map(function(p,j){return p.l+'='+fMix(vals[j]);});
 return {q:'$'+shown.join(';\\quad ')+'$',
  fig:figPts(lo,hi,pts,4),
  a:'$'+ans.join(',\\quad ')+'$',
  key:'nm-'+vals.map(function(v){return v.n;}).join('_')+'-'+idx.join('')};
}
// [дасгал 2] Өгсөн тоонуудыг тоон шулуун дээр тэмдэглэ.
function g_markNumline(){
 var lo=-4,hi=4,arr=[],seen={};
 for(var i=0;i<5;i++){
  for(var t=0;t<50;t++){
   var k=rnd(lo*4+1,hi*4-1);if(seen[k])continue;seen[k]=1;arr.push(Fr(k,4));break;
  }
 }
 if(arr.length<5)return null;
 var forms=arr.map(function(f){var a=anyForm(f);return a?a.tex:fMix(f);});
 var sorted=arr.slice().sort(function(x,y){return fVal(x)-fVal(y);});
 return {q:'$'+forms.join(';\\quad ')+'$',
  fig:figBlankLine(lo,hi,4),
  a:'Өсөх эрэмбээр: $'+sorted.map(fMix).join('\\lt ')+'$',
  key:'mn-'+arr.map(function(f){return f.n;}).join('_')};
}
// [дасгал 5, 69] Энгийн бутархайг аравтын бутархайд шилжүүлж, үеийг тэмдэглэ.
function g_fracToDec(){
 var d=pick([3,6,7,9,11,12,15,18,22,30,33,45,90,99,111,333,999,990]);
 var w=rnd(0,3),n=rnd(1,d-1);
 var fr=Fr(w*d+n,d);
 if(fr.d===1)return null;
 var dl=decLatex(fr);
 if(dl.length>16)return null;
 return {q:'$'+fMix(fr)+'$',a:'$'+fMix(fr)+'='+dl+'$',key:'fd-'+fr.n+'/'+fr.d,dv:dl,nv:fVal(fr)};
}
// үет бутархайг "0.255555…" маягаар (хангалттай олон үе харуулна)
function repPlain(fr){
 var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.pStart<0)return null;
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 var tail=rep;
 while(tail.length<Math.max(6,rep.length*3))tail+=rep;
 return s+r.ip+'.'+nonrep+tail+'…';
}
// [дасгал 4, 68] Төгсгөлгүй аравтын бутархайг үеийн тэмдэглэгээгээр бич.
function g_periodNotation(){
 var d=pick([3,6,7,9,11,12,15,18,22,30,33,90,99,111,333]);
 var w=rnd(0,9),n=rnd(1,d-1);
 var fr=Fr(w*d+n,d);
 var dl=decLatex(fr);
 if(dl.indexOf('(')<0)return null;
 var pl=repPlain(fr);
 if(!pl||pl.length>20)return null;
 return {q:'$'+pl+'$',a:'$'+pl+'='+dl+'$',key:'pn-'+fr.n+'/'+fr.d};
}
// [дасгал 6, 71] Үет аравтын бутархайг энгийн бутархайгаар илэрхийл.
function g_repToFrac(){
 var ip=rnd(0,9),reps=['3','6','8','1','7','45','27','16','36','67','123','36','9','2'],
     rep=pick(reps),nonrep=pick(['','','','1','2','0','3','13','05']);
 if(rep==='9')return null;
 var fr=repToFr(ip,nonrep,rep);
 if(!okF(fr))return null;
 var disp=ip+'.'+nonrep+'('+rep+')';
 return {q:'$'+disp+'$',a:'$'+disp+'='+fMix(fr)+'$',key:'rf-'+ip+'.'+nonrep+'_'+rep,nv:fVal(fr),

// [дасгал 7] Тоонуудыг жиш (өөр хэлбэртэй тоонууд).
function g_compare(){
 var p=pairSameInt();if(!p)return null;
 var a=anyForm(p[0]),b=anyForm(p[1]);
 if(!a||!b)return null;
 var rel=fVal(p[0])<fVal(p[1])?'\\lt ':'\\gt ';
 return {q:'$'+a.tex+'\\ \\ldots\\ '+b.tex+'$',
  a:'$'+a.tex+rel+b.tex+'$',
  key:'cm-'+p[0].n+'/'+p[0].d+'_'+p[1].n+'/'+p[1].d+'-'+a.form+b.form,
  v1:fVal(p[0]),v2:fVal(p[1]),rel:rel.trim()};
}
// [дасгал 70] Тоонуудыг өсөх эрэмбээр бич.
function g_order(){
 var arr=[],texs=[],seen={};
 for(var i=0;i<4;i++){
  for(var t=0;t<60;t++){
   var s=pick([1,-1]),w=rnd(0,4),d=pick([2,3,4,5,6,8,9,10,11,20]),n=rnd(1,d-1);
   var fr=Fr(s*(w*d+n),d),k=fVal(fr).toFixed(6);
   if(seen[k])continue;

   seen[k]=1;arr.push(fr);texs.push(f.tex);break;

 var sorted=arr.slice().sort(function(x,y){return fVal(x)-fVal(y);});
 return {q:'$'+texs.join(';\\quad ')+'$',
  a:'$'+sorted.map(fMix).join('\\lt ')+'$',
  key:'or-'+arr.map(function(f){return f.n+'/'+f.d;}).join('_'),
  vals:arr.map(fVal)};
}

// [Өөрийгөө сорих-1 №3] Хүснэгтэн өгөгдлийг эрэмбэл (ХҮНД, зурагтай).
var TNAME=['А','Б','В','Г','Д','Е'];
function g_tableOrder(){
 var vals=[],texs=[],seen={};
 for(var i=0;i<5;i++){
  for(var t=0;t<60;t++){
   var w=rnd(0,2),d=pick([4,5,8,16,25,40]),n=rnd(1,d-1);
   var fr=Fr(-(w*d+n),d),k=fVal(fr).toFixed(6);
   if(seen[k])continue;
   var f=anyForm(fr);if(!f)continue;
   seen[k]=1;vals.push(fr);texs.push('$'+f.tex+'$');break;
  }
 }
 if(vals.length<5)return null;
 var order=vals.map(function(v,i){return {v:fVal(v),n:TNAME[i]};}).sort(function(a,b){return b.v-a.v;});
 return {q:'Хүснэгтэд тамирчдын барианаас хол байсан зайг (м) өгчээ. Барианд ойрхон байснаас нь эхлэн жагсаа.',
  fig:figTbl([['Тамирчин'].concat(TNAME.slice(0,5)),['Зай (м)'].concat(texs)]),
  a:'$'+order.map(function(o){return o.n;}).join('\\to ')+'$',
  key:'to-'+vals.map(function(f){return f.n+'/'+f.d;}).join('_'),
  vals:vals.map(fVal)};
}
// [Өөрийгөө сорих-1 №4] Хоёр тооны хооронд орших төгсгөлөг ба үет бутархай ол (ХҮНД).
function g_betweenDec(){
 var s=pick([1,-1]),d1=pick([2,3,4,5,6,8]),d2=pick([2,3,4,5,6,8]);
 if(d1===d2)return null;
 var A=Fr(s,d1),B=Fr(s,d2);
 var loV=Math.min(fVal(A),fVal(B)),hiV=Math.max(fVal(A),fVal(B));
 if(hiV-loV<0.02)return null;
 var t=null,k;
 for(k=Math.floor(loV*100)+1;k<hiV*100;k++){var v=k/100;if(v>loV&&v<hiV&&k%10!==0){t=decStr(v,3);break;}}
 if(!t)return null;
 var rep=null,dd=[3,9,11,6,12,7,15];
 for(var i=0;i<dd.length&&!rep;i++){
  for(var m=Math.floor(loV*dd[i])-1;m<=Math.ceil(hiV*dd[i])+1;m++){
   var fr=Fr(m,dd[i]),vv=fVal(fr);
   if(vv<=loV||vv>=hiV)continue;
   var dl=decLatex(fr);
   if(dl.indexOf('(')>=0){rep={tex:dl,fr:fr};break;}
  }
 }
 if(!rep)return null;
 return {q:'$'+fTex(A)+'$ ба $'+fTex(B)+'$',
  a:'Төгсгөлөг бутархай: $'+t+'$; үет бутархай: $'+rep.tex+'='+fTex(rep.fr)+'$',
  key:'bd-'+A.n+'/'+A.d+'_'+B.n+'/'+B.d,
  lo:loV,hi:hiV,tv:parseFloat(t),rv:fVal(rep.fr)};
}
// [дасгал 8] Үгэн бодлого: аль амжилт өндөр вэ (ХҮНД).
function g_wordCompareRatio(){
 var n1=pick([10,20,25,40,50]),m1=rnd(1,Math.round(n1*0.4));
 var n2=pick([15,30,45,60,75]),m2=rnd(1,Math.round(n2*0.4));
 var r1=Fr(n1-m1,n1),r2=Fr(n2-m2,n2);
 if(fVal(r1)===fVal(r2))return null;
 var win=fVal(r1)>fVal(r2)?'математик':'физик';
 return {q:'Сурагч математикийн шалгалтын $'+n1+'$ асуултын $'+m1+'$-ыг, физикийн шалгалтын $'+n2+'$ асуултын $'+m2+'$-ыг алдсан бол аль шалгалтад илүү өндөр амжилт үзүүлсэн бэ?',
  a:'Математик: $'+fTex(r1)+'\\approx '+decStr(fVal(r1),4)+'$; физик: $'+fTex(r2)+'\\approx '+decStr(fVal(r2),4)+'$ $\\Rightarrow$ '+win,
  key:'wc-'+n1+'_'+m1+'_'+n2+'_'+m2,v1:fVal(r1),v2:fVal(r2)};
}

var PLACES=[[10,'аравт'],[100,'зуут'],[1000,'мянгат'],[10000,'арван мянгат']];
function g_roundPlace(){

 if(r===0)return null;

}
// [дасгал 10, 11] Тоог өгсөн нарийвчлалтай тоймло.
function g_roundDec(){
 var dec=pick([1,2]),N=rnd(1000,999999);      // x = N/1000
 var x=N/1000;
 var r=dec===1?Math.round(N/100)/10:Math.round(N/10)/100;
 var xs=decStr(x,3),rs=r.toFixed(dec);
 if(xs===rs)return null;
 return {q:'$'+xs+'$ ($'+(dec===1?'0.1':'0.01')+'$)',a:'$'+xs+'\\approx '+rs+'$',
  key:'rd-'+N+'-'+dec,nv:parseFloat(rs),src:x,dec:dec};

// [дасгал 14] Нэгжийг шилжүүлж, бүхлээр тоймло (ХҮНД).
var CONV=[['см^{2}','м^{2}',10000],['м^{2}','см^{2}',1/10000],['см^{3}','м^{3}',1000000],
          ['м^{3}','см^{3}',1/1000000],['г','кг',1000],['мм','см',10],['км','м',1/1000],['мл','л',1000]];

// [дасгал 19, 20, 21] Тоог өгсөн тэмдэгтийн тоогоор тоймло.
// (float биш, ЦИФРИЙН МӨРӨӨР яг тоймлоно: дараагийн цифр >=5 бол дээш)
function g_sigFig(){

function g_estComplex(){
 var form=pick([1,2,3,4]),a=rnd(105,995)/100*pick([1,10]),b=rnd(105,995)/100,c=rnd(105,995)/100*pick([1,10]);
 a=Math.round(a*100)/100;c=Math.round(c*100)/100;
 var ra=Math.round(a),rb=Math.round(b),rc=Math.round(c),qs,as,v;
 if(form===1){qs='('+decStr(a,2)+'-'+decStr(b,2)+')^{2}';v=(ra-rb)*(ra-rb);as='('+ra+'-'+rb+')^{2}='+(ra-rb)+'^{2}='+v;}
 else if(form===2){qs=decStr(a,2)+'^{2}\\times('+decStr(c,2)+'-'+decStr(b,2)+')';v=ra*ra*(rc-rb);as=ra+'^{2}\\times('+rc+'-'+rb+')='+(ra*ra)+'\\times '+(rc-rb)+'='+v;}
 else if(form===3){qs='('+decStr(a,2)+'+'+decStr(b,2)+')\\times('+decStr(c,2)+'-'+decStr(b,2)+')';v=(ra+rb)*(rc-rb);as='('+ra+'+'+rb+')\\times('+rc+'-'+rb+')='+(ra+rb)+'\\times '+(rc-rb)+'='+v;}
 else {qs='\\sqrt{'+decStr(a,2)+'+'+decStr(c,2)+'}';var s=ra+rc;var iv=isqrt(s);if(iv===null)return null;v=iv;as='\\sqrt{'+ra+'+'+rc+'}=\\sqrt{'+s+'}='+v;}
 if(!isFinite(v)||Math.abs(v)>500000)return null;
 return {q:'$'+qs+'$',a:'$\\approx '+as+'$',key:'ec-'+form+'-'+a+'_'+b+'_'+c,nv:v,ea:a,eb:b,ec:c,form:form};
}

     a=rFrac(-8,8,[2,3,4,5,6,8]),b=rFrac(-8,8,[2,3,4,5,6,8]),
     c=rFrac(-6,6,[2,3,4,5,6]),d=rFrac(-6,6,[2,3,4,5,6]),res,qs;
 if(form===1){res=fAdd(a,fMul(b,c));qs=fMix(a)+'+'+pF(b)+'\\times '+pF(c);}
 else if(form===2){res=fSub(a,fMul(b,c));qs=fMix(a)+'-'+pF(b)+'\\times '+pF(c);}

// мантиссыг n орноор шилжүүлж энгийн тоо болгох (яг тодорхой, float алдаагүй)
function shiftDec(s,n){
 var neg=false;
 if(s.charAt(0)==='-'){neg=true;s=s.slice(1);}
 var dot=s.indexOf('.'),ints=dot<0?s:s.slice(0,dot),frac=dot<0?'':s.slice(dot+1);
 var digits=ints+frac,pos=ints.length+n,res,i,z;
 if(pos<=0){z='';for(i=0;i<-pos;i++)z+='0';res='0.'+z+digits;}
 else if(pos>=digits.length){z='';for(i=0;i<pos-digits.length;i++)z+='0';res=digits+z;}
 else res=digits.slice(0,pos)+'.'+digits.slice(pos);
 if(res.indexOf('.')>=0){res=res.replace(/0+$/,'');if(res.charAt(res.length-1)==='.')res=res.slice(0,-1);}
 res=res.replace(/^0+(\d)/,'$1');
 return (neg?'-':'')+res;
}
function mantissa(){
 var d=rnd(1,9),k=pick([0,0,1,1,2,3]),f='',i;
 for(i=0;i<k;i++)f+=rnd(0,9);
 f=f.replace(/0+$/,'');
 return f?(d+'.'+f):(''+d);
}
// [дасгал 63, 83] 10-ын зэргийн утгыг ол.
function g_pow10(){
 var mode=pick(['ten','tenth','neg']);
 if(mode==='ten'){var n=pick([0,2,3,4,5,6,7]);
  return {q:'$'+pw('10',n)+'$',a:'$'+pw('10',n)+'='+shiftDec('1',n)+'$',key:'p10a-'+n,nv:Math.pow(10,n),e:n};}
 if(mode==='tenth'){var k=rnd(2,6);
  return {q:'$0.1^{'+k+'}$',a:'$0.1^{'+k+'}=10^{-'+k+'}='+shiftDec('1',-k)+'$',key:'p10b-'+k,nv:Math.pow(10,-k),e:-k};}
 var m=rnd(2,7);
 return {q:'$10^{-'+m+'}$',a:'$10^{-'+m+'}=\\dfrac{1}{10^{'+m+'}}='+shiftDec('1',-m)+'$',key:'p10c-'+m,nv:Math.pow(10,-m),e:-m};
}
// [дасгал 64, 84] Илэрхийллийн утгыг энгийн тоогоор ол.
function g_fromStandard(){
 var a=pick([mantissa(),''+rnd(10,999),rnd(10,999)+'.'+rnd(1,99)]),n=nz(-6,9);
 if(Math.abs(n)===1)return null;
 var plain=shiftDec(a,n);
 if(plain.length>14)return null;
 return {q:'$'+a+'\\times 10^{'+n+'}$',a:'$'+a+'\\times 10^{'+n+'}='+plain+'$',
  key:'fs-'+a+'_'+n,mant:a,e:n,plain:plain};
}
// [дасгал 65, 85] Тоог стандарт хэлбэрт бич.
function g_toStandard(){
 var a=mantissa(),n=nz(-8,12);
 if(Math.abs(n)===1)return null;
 var plain=shiftDec(a,n);
 if(plain.length>15)return null;
 return {q:'$'+plain+'$',a:'$'+plain+'='+a+'\\times 10^{'+n+'}$',
  key:'ts-'+plain,mant:a,e:n,plain:plain};
}
// [дасгал 66] 10-ын зэргээр үржих/хуваах.
function g_mulDiv10(){
 var base=mantissa()+'',w=rnd(1,999);
 var s=pick([base,''+w,w+'.'+rnd(1,999)]);
 var mode=pick(['mul','div','muls']);
 if(mode==='mul'){var k=pick([10,100,1000,10000,1000000]),n=Math.round(Math.log(k)/Math.LN10);
  return {q:'$'+s+'\\times '+k+'$',a:'$='+shiftDec(s,n)+'$',key:'md1-'+s+'_'+k,src:s,e:n};}
 if(mode==='div'){var k2=pick([10,100,1000,10000,100000]),n2=Math.round(Math.log(k2)/Math.LN10);
  return {q:'$'+s+'\\div '+k2+'$',a:'$='+shiftDec(s,-n2)+'$',key:'md2-'+s+'_'+k2,src:s,e:-n2};}
 var f=pick([['0.1',1],['0.01',2],['0.001',3],['0.0001',4],['0.00001',5]]);
 return {q:'$'+s+'\\times '+f[0]+'$',a:'$='+shiftDec(s,-f[1])+'$',key:'md3-'+s+'_'+f[0],src:s,e:-f[1]};
}
// [дасгал 67] Хоосон нүдэнд тохирох тоог ол.
function g_fillBlank(){
 var s=mantissa()+'',w=rnd(1,3);
 var src=pick([s,''+rnd(10,9999),rnd(1,99)+'.'+rnd(1,99)]);
 var n=nz(-5,5),res=shiftDec(src,n);
 if(res.length>13)return null;
 var pos=pick([1,2,3]);
 var box='\\square';
 if(pos===1)return {q:'$'+src+'\\times '+box+'='+res+'$',a:'$'+box+'='+shiftDec('1',n)+'$',key:'fb1-'+src+'_'+n,ans:shiftDec('1',n),e:n};
 if(pos===2)return {q:'$'+box+'\\times '+shiftDec('1',n)+'='+res+'$',a:'$'+box+'='+src+'$',key:'fb2-'+src+'_'+n,ans:src,e:n};
 return {q:'$'+src+'\\times '+shiftDec('1',n)+'='+box+'$',a:'$'+box+'='+res+'$',key:'fb3-'+src+'_'+n,ans:res,e:n};
}
// [Өөрийгөө сорих-1 №7] Стандарт бус задаргаанд дутуу зэргийг ол (ХҮНД).
function g_fillStandard(){
 var a=mantissa(),n=nz(-7,11),shift=rnd(1,4)*pick([1,-1]);
 var plain=shiftDec(a,n);
 if(plain.length>15)return null;
 var a2=shiftDec(a,shift),n2=n-shift;
 if(a2.length>8||Math.abs(n2)===1)return null;
 return {q:'$'+plain+'='+a2+'\\times\\square$',a:'$\\square=10^{'+n2+'}$',
  key:'fst-'+plain+'_'+shift,ans:n2,mant2:a2,plain:plain};
}
// [дасгал 50] Стандарт хэлбэрийн тоонууд дээрх үйлдэл (ХҮНД).
function g_opStandard(){
 var a=mantissa(),b=mantissa(),m=nz(-5,9),n=nz(-5,9),op=pick(['\\times','\\div','+','-']);
 if(Math.abs(m)===1||Math.abs(n)===1)return null;
 var av=parseFloat(a),bv=parseFloat(b);
 if(op==='\\times'){
  var p=av*bv,e=m+n,ps=decStr(p,10);
  if(p>=10){ps=decStr(p/10,10);e+=1;}
  if(Math.abs(e)===1)return null;
  return {q:'$'+a+'\\times 10^{'+m+'}\\ \\times\\ '+b+'\\times 10^{'+n+'}$',
   a:'$=('+a+'\\times '+b+')\\times 10^{'+m+'+'+(n<0?'('+n+')':n)+'}='+ps+'\\times 10^{'+e+'}$',
   key:'os1-'+a+m+'_'+b+n,mant:ps,e:e,op:'mul',av:av,bv:bv,m:m,n:n};}
 if(op==='\\div'){
  var q2=av/bv,e2=m-n,qs=decStr(q2,10);
  if(q2<1){qs=decStr(q2*10,10);e2-=1;}
  if(Math.abs(e2)===1||qs.length>7)return null;
  return {q:'$'+a+'\\times 10^{'+m+'}\\ \\div\\ '+b+'\\times 10^{'+n+'}$',
   a:'$=('+a+'\\div '+b+')\\times 10^{'+m+'-'+(n<0?'('+n+')':n)+'}='+qs+'\\times 10^{'+e2+'}$',
   key:'os2-'+a+m+'_'+b+n,mant:qs,e:e2,op:'div',av:av,bv:bv,m:m,n:n};}
 if(m!==n)return null;
 var s=op==='+'?av+bv:av-bv;
 if(s===0)return null;
 var es=m,ss=decStr(Math.abs(s),10);
 if(Math.abs(s)>=10){ss=decStr(Math.abs(s)/10,10);es+=1;}
 else if(Math.abs(s)<1){ss=decStr(Math.abs(s)*10,10);es-=1;}
 if(Math.abs(es)===1||Math.abs(s)<0.1)return null;
 return {q:'$'+a+'\\times 10^{'+m+'}\\ '+op+'\\ '+b+'\\times 10^{'+n+'}$',
  a:'$=('+a+op+b+')\\times 10^{'+m+'}='+(s<0?'-':'')+ss+'\\times 10^{'+es+'}$',
  key:'os3-'+a+m+op+b+n,mant:(s<0?'-':'')+ss,e:es,op:op,av:av,bv:bv,m:m,n:n};
}
// [Дискний багтаамж] Үгэн бодлого — стандарт хэлбэр.
function g_wordStandard(){
 var mode=pick([1,2,3]);
 if(mode===1){var gb=pick([16,32,64,128,256,512]);
  return {q:'Компьютерын хатуу дискний багтаамж $'+gb+'$ ГБ. $1$ ГБ нь $2^{30}$ байттай тэнцүү бол багтаамжийг $2$-ын зэрэг хэлбэрээр илэрхийл.',
   a:'$'+gb+'=2^{'+Math.round(Math.log(gb)/Math.LN2)+'}$ тул $'+gb+'\\times 2^{30}=2^{'+(Math.round(Math.log(gb)/Math.LN2)+30)+'}$ байт',
   key:'ws1-'+gb,er:Math.round(Math.log(gb)/Math.LN2)+30};}
 if(mode===2){var dd=pick([['Дэлхийн масс','5.97',24],['Нарны масс','1.99',30],['Устөрөгчийн атомын масс','1.67',-27],['Вирусын хэмжээ','1.2',-7]]);
  var plain=shiftDec(dd[1],dd[2]);
  return {q:''+dd[0]+' нь $'+dd[1]+'\\times 10^{'+dd[2]+'}$ байв. Энэ тоог энгийн бичлэгээр бич.',
   a:'$'+dd[1]+'\\times 10^{'+dd[2]+'}='+plain+'$',key:'ws2-'+dd[0],plain:plain};}
 var n=pick([3,4,5,6,7]),c=rnd(2,9);
 var pop=c*Math.pow(10,n);
 return {q:'Хотын хүн ам $'+pop+'$ байв. Энэ тоог стандарт хэлбэрт бич.',
  a:'$'+pop+'='+c+'\\times 10^{'+n+'}$',key:'ws3-'+c+'_'+n,er:n,mant:c};
}
var WSPEC={"title":"Зэрэгт дэвшүүлэх-2","sub":"Зэргийн тэмдэг ба холимог тооцоолол · I бүлэг · 8-р анги","rule":"<b>Санамж:</b> Рационал тоог зэрэгт дэвшүүлэхдээ бүхэл/натурал ногдвор хэлбэрт шилжүүлж, хүртвэр хуваарийг тус тус зэрэгт дэвшүүлнэ: $\\left(\\dfrac{a}{b}\\right)^n=\\dfrac{a^n}{b^n}$.","ref":"","tasks":[{"label":"Утгыг ол.","fn":"g_evalPow","cap":5,"cols":4,"wk":9},{"label":"Үржвэрийг зэрэг хэлбэрт бич.","fn":"g_prodToPow","cap":2,"cols":3,"wk":11},{"label":"Хоёр илэрхийллийн утгыг тус тус олж, ялгааг тайлбарла.","fn":"g_signPow","cap":5,"cols":3,"wk":11},{"label":"Ногдвор хэлбэрт шилжүүлээд зэрэгт дэвшүүл.","fn":"g_powRational","cap":4,"cols":2,"wk":15},{"label":"Зэрэг, язгуур агуулсан илэрхийллийн утгыг ол.","fn":"g_mixedPowRoot","cap":6,"cols":2,"wk":16}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}

  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}

  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';

}
