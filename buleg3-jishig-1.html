<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>III бүлэг — Жишиг даалгавар 1 (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:6px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:3px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:2px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 22px 2px 4px}
  .col1{display:grid;grid-template-columns:1fr;gap:11px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:8px;align-items:baseline}
  .ql{font-weight:800;color:var(--purple);font-size:13.5px;min-width:20px}
  .qm{font-size:13.5px;flex:1}
  .pts{font-size:10.5px;font-weight:700;color:#16a34a;background:#eafaf0;border:1px solid #bff0d0;border-radius:6px;padding:1px 7px;white-space:nowrap;margin-left:auto}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:22mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5;overflow:hidden}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ хувилбар</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодох зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function co(a){return a===1?'':a===-1?'-':''+a;}
function scoef(b,term){if(b===0)return '';var s=b>0?'+':'-',m=Math.abs(b);return s+(m===1?'':m)+term;}
function lin(a,b){var t='';if(a===1)t+='x';else if(a===-1)t+='-x';else if(a!==0)t+=a+'x';if(b>0)t+=(t?'+':'')+b;else if(b<0)t+='-'+(-b);if(t==='')t='0';return t;}
function qs(a,b,c){var t=(a===1?'x^2':a===-1?'-x^2':a+'x^2');if(b===1)t+='+x';else if(b===-1)t+='-x';else if(b>0)t+='+'+b+'x';else if(b<0)t+='-'+(-b)+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+(-c);return t;}
// ── III бүлгийн генераторууд (3.1–3.7) ──
function j_domain(){var t=pick(['rat','sqrt','sqrtle']);
 if(t==='rat'){var a=nz(-5,5);return {q:'$y=\\dfrac{1}{'+lin(1,-a)+'}$ функцийн тодорхойлогдох мужийг ол.',a:'Хуваарь $\\ne0$: $'+lin(1,-a)+'\\ne0\\Rightarrow x\\ne'+a+'$. $D=\\mathbb{R}\\setminus\\{'+a+'\\}$'};}
 if(t==='sqrt'){var b=nz(-5,5);return {q:'$y=\\sqrt{'+lin(1,-b)+'}$ функцийн тодорхойлогдох мужийг ол.',a:'$'+lin(1,-b)+'\\ge0\\Rightarrow x\\ge'+b+'$. $D=['+b+';+\\infty[$'};}
 var c=nz(-5,5);return {q:'$y=\\sqrt{'+lin(-1,c)+'}$ функцийн тодорхойлогдох мужийг ол.',a:'$'+lin(-1,c)+'\\ge0\\Rightarrow x\\le'+c+'$. $D=]-\\infty;'+c+']$'};}
function j_powDR(){var c=pick([['x^2','\\mathbb{R}','[0;+\\infty['],['x^3','\\mathbb{R}','\\mathbb{R}'],['x^{-1}','\\mathbb{R}\\setminus\\{0\\}','\\mathbb{R}\\setminus\\{0\\}'],['x^{-2}','\\mathbb{R}\\setminus\\{0\\}',']0;+\\infty['],['x^{\\frac12}','[0;+\\infty[','[0;+\\infty[']]);
 return {q:'$y='+c[0]+'$ зэрэгт функцийн тодорхойлогдох муж $D$ ба утгын муж $E$-г ол.',a:'$D='+c[1]+',\\ E='+c[2]+'$'};}
function j_powCompare(){var m=rnd(2,6),n=rnd(2,6);while(n===m)n=rnd(2,6);
 if(pick([1,2])===1){var base=pick([2,3,10]);return {q:'$'+base+'^{'+m+'}$ ба $'+base+'^{'+n+'}$-ийг харьцуул.',a:'Суурь $'+base+'>1$ тул зэрэг ихсэхэд утга өснө: $'+base+'^{'+m+'}'+(m>n?'>':'<')+base+'^{'+n+'}$'};}
 return {q:'$\\left(\\tfrac12\\right)^{'+m+'}$ ба $\\left(\\tfrac12\\right)^{'+n+'}$-ийг харьцуул.',a:'Суурь $0<\\tfrac12<1$ тул зэрэг ихсэхэд утга буурна: $\\left(\\tfrac12\\right)^{'+m+'}'+(m>n?'<':'>')+'\\left(\\tfrac12\\right)^{'+n+'}$'};}
function j_oneToOne(){var c=pick([['x^3',1],['x^5',1],['2x-1',1],['x^2',0],['x^4',0],['|x|',0]]);
 return {q:'$f(x)='+c[0]+'$ функц харилцан нэг утгатай (урвуутай) юу?',a:c[1]?'<b>Тийм</b> — хатуу монотон; хэвтээ шулуун графикийг зөвхөн 1 цэгт огтолно.':'<b>Үгүй</b> — тэгш функц, $f(1)=f(-1)$; хэвтээ шулуун 2 цэгт огтолно.'};}
function j_comp(){var a=nz(-3,3),b=nz(-4,4),c=nz(-3,3),d=nz(-4,4);
 return {q:'$f(x)='+lin(a,b)+',\\ g(x)='+lin(c,d)+'$ бол $g(f(x))$ ба $f(g(x))$-г ол.',a:'$g(f(x))='+c+'('+lin(a,b)+')'+(d>0?'+'+d:d<0?''+d:'')+'='+lin(a*c,c*b+d)+'$;<br>$f(g(x))='+lin(a*c,a*d+b)+'$'};}
function j_compVal(){var a=nz(-3,3),b=nz(-4,4),k=nz(-4,4),m=nz(-3,3);var fm=a*m+b,gf=fm*fm+k;
 return {q:'$f(x)='+lin(a,b)+',\\ g(x)=x^2'+sg(k)+'$ бол $g\\big(f('+m+')\\big)$-г ол.',a:'$f('+m+')='+fm+'\\Rightarrow g('+fm+')=('+fm+')^2'+sg(k)+'='+gf+'$'};}
function j_compDomain(){var a=pick([1,-1]),r=nz(-4,4);var b=-a*r;
 return {q:'$f(x)=\\sqrt{x},\\ g(x)='+lin(a,b)+'$ бол $y=f(g(x))$-ийн тодорхойлогдох мужийг ол.',a:'$\\sqrt{'+lin(a,b)+'}$: $'+lin(a,b)+'\\ge0\\Rightarrow x'+(a>0?'\\ge':'\\le')+r+'$. $D='+(a>0?'['+r+';+\\infty[':']-\\infty;'+r+']')+'$'};}
function j_ffparam(){var a=pick([2,3,-2,-3]),b=nz(-4,4);var P=a*a,Q=(a+1)*b;var hint=a>0?'$f$ өсөх ($a>0$)':'$f$ буурах ($a<0$)';
 return {q:'$f(x)=ax+b$ функцийн $f\\big(f(x)\\big)='+lin(P,Q)+'$ ба '+hint+' бол $a,b$-г ол.',a:'$f(f(x))=a^2x+(a+1)b$; $a^2='+P+',\\ (a+1)b='+Q+'$; '+hint+' тул $a='+a+',\\ b='+b+'$'};}
function j_inverse(){var t=pick(['lin','cube','sqrt']);
 if(t==='lin'){var a=pick([2,-2,3,-3]),b=nz(-5,5);return {q:'$f(x)='+lin(a,b)+'$ функцийн урвуу функцийг ол.',a:'$x='+co(a)+'y'+sg(b)+'\\Rightarrow y=\\dfrac{'+lin(1,-b)+'}{'+a+'}$; $f^{-1}(x)=\\dfrac{'+lin(1,-b)+'}{'+a+'}$'};}
 if(t==='cube'){var b2=nz(-5,5);return {q:'$f(x)=x^3'+sg(b2)+'$ функцийн урвуу функцийг ол.',a:'$x^3='+lin(1,-b2)+'\\Rightarrow x=\\sqrt[3]{'+lin(1,-b2)+'}$; $f^{-1}(x)=\\sqrt[3]{'+lin(1,-b2)+'}$'};}
 var b3=nz(-5,5);return {q:'$f(x)=\\sqrt{x}'+sg(b3)+'\\ (x\\ge0)$ функцийн урвуу функцийг ол.',a:'$\\sqrt{x}='+lin(1,-b3)+'\\Rightarrow x=\\big('+lin(1,-b3)+'\\big)^2$; $f^{-1}(x)=\\big('+lin(1,-b3)+'\\big)^2$'};}
function j_invVal(){var a=pick([2,-2,3,-3]),b=nz(-5,5),k=nz(-3,3);var c=a*k+b;
 return {q:'$f(x)='+lin(a,b)+'$ бол $f^{-1}('+c+')$-г ол.',a:'$f^{-1}('+c+')='+k+'$, учир нь $f('+k+')='+a+'\\cdot('+k+')'+sg(b)+'='+c+'$'};}
function j_invFindAB(){for(var t=0;t<200;t++){var a=nz(-3,3),b=nz(-4,4),u=nz(-3,3),v=nz(-3,3);if(u===v)continue;var p=a*u+b,q=a*v+b;if(Math.abs(p)>20||Math.abs(q)>20)continue;
  return {q:'$f(x)=ax+b$ функцийн $f^{-1}('+p+')='+u+',\\ f^{-1}('+q+')='+v+'$ бол $a,b$-г ол.',a:'$f('+u+')='+p+',\\ f('+v+')='+q+'$; $\\begin{cases}'+u+'a+b='+p+'\\\\ '+v+'a+b='+q+'\\end{cases}\\Rightarrow a='+a+',\\ b='+b+'$'};}return null;}
function j_monoInterval(){var a=nz(-3,3),x0=nz(-4,4),c=nz(-5,5);var b=-2*a*x0;
 var body=a>0?'$]-\\infty;'+x0+']$-д буурах, $['+x0+';+\\infty[$-д өсөх':'$]-\\infty;'+x0+']$-д өсөх, $['+x0+';+\\infty[$-д буурах';
 return {q:'$y='+qs(a,b,c)+'$ функцийн өсөх ба буурах завсрыг ол.',a:'Орой $x_0=-\\dfrac{'+b+'}{'+(2*a)+'}='+x0+'$; $a='+a+'$ тул '+body};}
function j_range(){var a=nz(-3,3),b=nz(-4,4),p=rnd(-4,1),q=p+rnd(2,4);var fp=a*p+b,fq=a*q+b,lo=Math.min(fp,fq),hi=Math.max(fp,fq);
 return {q:'$y='+lin(a,b)+'$ функц $['+p+';'+q+']$ завсарт ямар утгын муж авах вэ?',a:'$a='+a+'$ ('+(a>0?'өсөх':'буурах')+'); $f('+p+')='+fp+',\\ f('+q+')='+fq+'$; $E=['+lo+';'+hi+']$'};}
function j_monoParam(){var a=nz(-3,3),c=nz(-5,5),p=rnd(-3,1),q=p+rnd(2,5);var fp=a*p+c,fq=a*q+c,lo=Math.min(fp,fq),hi=Math.max(fp,fq);var inc=a>0;
 return {q:'$y=ax+c$ функц $['+p+';'+q+']$ завсарт '+(inc?'өсөж':'буурч')+' $['+lo+';'+hi+']$ утгын муж авдаг бол $a,c$-г ол.',a:(inc?'$f('+p+')='+lo+',\\ f('+q+')='+hi+'$':'$f('+p+')='+hi+',\\ f('+q+')='+lo+'$')+'; системээс $a='+a+',\\ c='+c+'$'};}
function j_parity(){var kind=pick(['even','odd','none']);
 if(kind==='even'){var a=nz(-3,3),c=nz(-4,4),p=pick([2,4]);var e=co(a)+'x^{'+p+'}'+(c>0?'+'+c:c<0?''+c:'');return {q:'$f(x)='+e+'$ функцийн тэгш/сондгойг тодорхойл.',a:'$f(-x)='+e+'=f(x)$ тул <b>тэгш</b>'};}
 if(kind==='odd'){var A=nz(-3,3),b=nz(-3,3),q=pick([3,5]);var e2=co(A)+'x^{'+q+'}'+scoef(b,'x');return {q:'$f(x)='+e2+'$ функцийн тэгш/сондгойг тодорхойл.',a:'$f(-x)=-\\left('+e2+'\\right)=-f(x)$ тул <b>сондгой</b>'};}
 var a3=nz(-3,3),b3=nz(-3,3);var e3=co(a3)+'x^2'+scoef(b3,'x');return {q:'$f(x)='+e3+'$ функцийн тэгш/сондгойг тодорхойл.',a:'$f(-x)='+co(a3)+'x^2'+scoef(-b3,'x')+'\\ne\\pm f(x)$ тул <b>аль нь ч биш</b>'};}
function j_parityParam(){var t=pick(['odd','even']);
 if(t==='odd'){var k=nz(-5,5);return {q:'$y='+co(k)+'x+b$ функц сондгой бол $b$-г ол.',a:'Сондгой $\\Rightarrow f(0)=0\\Rightarrow b=0$'};}
 var a=nz(-3,3),c=nz(-5,5),x1=rnd(1,3),x2=rnd(1,3);while(x2===x1)x2=rnd(1,3);var y1=a*x1*x1+c,y2=a*x2*x2+c;
 return {q:'$y=ax^2+bx+c$ тэгш ба $('+x1+';'+y1+'),\\ ('+x2+';'+y2+')$ цэгээр дайрдаг бол $a,b,c$-г ол.',a:'Тэгш $\\Rightarrow b=0$; $\\begin{cases}'+(x1*x1)+'a+c='+y1+'\\\\ '+(x2*x2)+'a+c='+y2+'\\end{cases}\\Rightarrow a='+a+',\\ c='+c+'$; $b=0$'};}
// ── Жишиг даалгаврын бүтэц ──
var EXAM={title:'III бүлэг — Жишиг даалгавар 1',sub:'Функц ба график: тодорхойлогдох муж · зэрэгт · харилцан нэг утгатай · давхар · урвуу · монотон · тэгш/сондгой (3.1–3.7)',
  tasks:[j_domain,j_powDR,j_oneToOne,j_comp,j_compVal,j_inverse,j_monoInterval,j_parity],
  points:[12,12,13,13,12,13,13,12]};
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function build(){window.__P=EXAM.tasks.map(function(fn){return gen(fn);});layout();}
function layout(){var WK=document.getElementById('sw').checked;var P=window.__P||(window.__P=EXAM.tasks.map(function(fn){return gen(fn);}));
  var total=EXAM.points.reduce(function(a,b){return a+b;},0);
  var qs2=P.map(function(f,i){return '<div class="q"><div class="qh"><span class="ql">'+(i+1)+'.</span><span class="qm">'+f.q+'</span><span class="pts">'+EXAM.points[i]+' оноо</span></div>'+(WK?'<div class="wk"></div>':'')+'</div>';}).join('');
  var ans=P.map(function(f,i){return '<div class="a"><span class="an">'+(i+1)+'.</span>'+f.a+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>'+EXAM.title+'</h1><div class="sub">'+EXAM.sub+' · 11-р анги · Нийт '+total+' оноо</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="col1">'+qs2+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE=EXAM.title;
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
