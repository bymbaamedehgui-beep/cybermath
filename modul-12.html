<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тооны модул — 12-р анги</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:12px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13.5px;margin-bottom:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 18px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qeq{display:flex;gap:6px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:20px}.qm{font-size:15.5px}
  .wl{height:13mm;border:1.1px solid #e5ddf6;border-radius:6px;background:linear-gradient(#fff,#fbf9ff);margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 14px;font-size:13px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:20px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var LAB=['а','б','в','г','д','е','ё','ж','з','и','й','к','л','м','н','о','ө','п','р','с','т','у','ү','ф','х','ц','ч','ш'];
function money(c){var w=Math.floor(c/100),f=c%100,fs=''+f;while(fs.length<2)fs='0'+fs;fs=fs.replace(/0$/,'');return w+'.'+fs;}
// ─── Генераторууд: {inner, ans, key} буцаана. Дотоод илэрхийллийн тэмдгийг тоогоор шалгаж хариуг гаргана. null бол дахин сонгоно.
var GEN=[
 function(){var n=rnd(11,99);return {inner:'-'+n,ans:''+n,key:'N'+n};},
 function(){var c=rnd(115,3985);if(c%100===0)c++;var m=money(c);return {inner:m,ans:m,key:'D'+c};},
 function(){var w=rnd(1,9),d=rnd(2,9),nu=rnd(1,d-1);var mx=w+'\\tfrac{'+nu+'}{'+d+'}';return {inner:'-'+mx,ans:mx,key:'MX'+w+nu+d};},
 function(){var b=rnd(2,7),a=rnd(b*b-5,b*b+6);if(a<2)return null;var r=Math.round(Math.sqrt(a));if(r*r===a||a===b*b)return null;var v=Math.sqrt(a)-b;return {inner:'\\sqrt{'+a+'}-'+b,ans:v>0?'\\sqrt{'+a+'}-'+b:b+'-\\sqrt{'+a+'}',key:'SQ'+a+'_'+b};},
 function(){var b=rnd(2,4),a=rnd(b*b*b-6,b*b*b+7);if(a<2)return null;var r=Math.round(Math.cbrt(a));if(r*r*r===a)return null;var v=Math.cbrt(a)-b;return {inner:'\\sqrt[3]{'+a+'}-'+b,ans:v>0?'\\sqrt[3]{'+a+'}-'+b:b+'-\\sqrt[3]{'+a+'}',key:'CB'+a+'_'+b};},
 function(){var A=rnd(2,9),C=rnd(2,9);var v=Math.pow(A,0.25)-Math.pow(C,1/3);if(Math.abs(v)<0.05)return null;return {inner:'\\sqrt[4]{'+A+'}-\\sqrt[3]{'+C+'}',ans:v>0?'\\sqrt[4]{'+A+'}-\\sqrt[3]{'+C+'}':'\\sqrt[3]{'+C+'}-\\sqrt[4]{'+A+'}',key:'RR'+A+'_'+C};},
 function(){var b=pick([2,3,5]),m=rnd(2,26);return {inner:'\\log_{'+b+'}'+m,ans:'\\log_{'+b+'}'+m,key:'LP'+b+'_'+m};},
 function(){var b=pick([2,3,5]),k=rnd(2,26);return {inner:'\\log_{'+b+'}\\dfrac{1}{'+k+'}',ans:'\\log_{'+b+'}'+k,key:'LN'+b+'_'+k};},
 function(){var c=rnd(1,12);return {inner:'x^{2}+'+c,ans:'x^{2}+'+c,key:'Q'+c};},
 function(){var b=rnd(1,6),c=rnd(Math.floor(b*b/4)+1,b*b+6),s=rnd(0,1)?'+':'-';return {inner:'x^{2}'+s+b+'x+'+c,ans:'x^{2}'+s+b+'x+'+c,key:'QF'+b+s+c};},
 function(){var a=rnd(2,12),n=rnd(2,15);return {inner:'-'+a+'^{-'+n+'}',ans:a+'^{-'+n+'}',key:'NP'+a+'_'+n};},
 function(){var A=rnd(2,6),p=rnd(3,12),B=rnd(2,9),q=rnd(2,6);var d=p*Math.log(A)-q*Math.log(B);if(Math.abs(d)<0.06)return null;var x=A+'^{'+p+'}',y=B+'^{'+q+'}';return {inner:x+'-'+y,ans:d>0?x+'-'+y:y+'-'+x,key:'PD'+A+p+B+q};},
 function(){var al=rnd(1,6);var v=Math.cos(al)-Math.sin(al);if(Math.abs(v)<0.06)return null;return {inner:'\\cos '+al+'-\\sin '+al,ans:v>0?'\\cos '+al+'-\\sin '+al:'\\sin '+al+'-\\cos '+al,key:'CS'+al};},
 function(){var deg=rnd(1,35)*10;var v=Math.cos(deg*Math.PI/180);if(Math.abs(v)<0.04)return null;return {inner:'\\cos '+deg+'^{\\circ}',ans:v>0?'\\cos '+deg+'^{\\circ}':'-\\cos '+deg+'^{\\circ}',key:'CD'+deg};},
 function(){var deg=rnd(1,35)*10;if(deg%180===0)return null;var v=Math.sin(deg*Math.PI/180);if(Math.abs(v)<0.04)return null;return {inner:'\\sin '+deg+'^{\\circ}',ans:v>0?'\\sin '+deg+'^{\\circ}':'-\\sin '+deg+'^{\\circ}',key:'SD'+deg};},
 function(){var deg=rnd(1,8)*10;return {inner:'\\cos(-'+deg+'^{\\circ})',ans:'\\cos '+deg+'^{\\circ}',key:'NC'+deg};}
];
function build(){
  var N=24,items=[],seen={},probs='',ans='',i;
  for(i=0;i<N;i++){
    var g=null,tr=0;
    do{ g=pick(GEN)(); tr++; }while((!g||seen[g.key])&&tr<160);
    if(!g){ i--; continue; }
    seen[g.key]=1;
    var lb=LAB[i]||('#'+(i+1));
    probs+='<div class="q"><div class="qeq"><span class="ql">'+lb+')</span><span class="qm">$\\left|'+g.inner+'\\right|$</span></div><div class="wl"></div></div>';
    ans+='<div class="a"><span class="an">'+lb+')</span><span>$'+g.ans+'$</span></div>';
    items.push({q:g.inner,a:g.ans});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тооны модул</h1><div class="sub">Дотоод илэрхийллийн тэмдгийг тодорхойлж модулийн тэмдгийг ав · 12-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$|a|=a\\ (a\\ge 0)$, &nbsp; $|a|=-a\\ (a<0)$ · дотор нь эерэг үү, сөрөг үү гэдгийг эхлээд тогтоо</div>'
    +'<div class="task">1. Тооны модулыг ол.</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Тооны модул (12-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=32"></script>
</body>
</html>
