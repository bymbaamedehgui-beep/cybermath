<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЭЕШ 2024 — Сонгох даалгавар</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  /* «Эх хувилбар» — шинэ хувилбар дээр байхад л харагдана (.btn биш: ws-store хэвлэх товчийг .btn-ээр олдог) */
  .e24-orig{font-weight:800;border:1.4px solid #d9cff5;background:#faf7ff;color:#5a32d6;border-radius:999px;padding:.5rem 1rem;font-size:.85rem;cursor:pointer;font-family:inherit}
  .e24-orig[hidden]{display:none}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem;cursor:pointer}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}
  .e24-sub{font-size:11px;color:var(--soft);margin-top:2px}
  .e24-ver{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:800;color:#5a32d6;border:1.3px solid #d9cff5;border-radius:999px;padding:1px 11px;letter-spacing:.3px}
  .meta{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .e24-fbox{border:1px solid #e6ddfa;border-radius:9px;padding:7px 12px 8px;margin-bottom:9px;font-size:11.5px;line-height:1.55}
  .e24-fbox .e24-ft{font-weight:800;color:#5a32d6;text-align:center;font-size:12px;margin-bottom:3px}
  .e24-fbox ol{padding-left:20px}.e24-fbox li{margin:1px 0}
  .e24-ptab{border-collapse:collapse;margin:4px 0 3px;font-size:11px}
  .e24-ptab td{border:1px solid #cfc6ea;padding:1px 10px;text-align:center}
  .e24-note{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #c9b8f5;border-radius:8px;padding:7px 12px;margin-bottom:10px}
  .e24-note b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 4px;border-left:4px solid var(--purple2);padding-left:9px}
  .e24-q{break-inside:avoid;page-break-inside:avoid;padding:7px 0 8px;border-bottom:1px dashed #ece6fb}
  .e24-q:last-child{border-bottom:0}
  .qh{display:flex;gap:7px;align-items:baseline}
  .ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px;flex:0 0 auto}
  .qm{font-size:13px;flex:1 1 auto;min-width:0}
  .e24-pts{flex:0 0 auto;font-size:11px;color:var(--soft);font-weight:700;white-space:nowrap;margin-left:6px}
  .fig{text-align:center;margin:5px 0;max-width:100%;overflow-x:auto}
  /* Зураг/сонголтын SVG-г зөвхөн ШУУД хүүхдээр (>) сонгоно: KaTeX-ийн \sqrt г.м. дотоод <svg> (width=400em, viewBox 400000×1080)-д
     height:auto + max-width үйлчилбэл өндөр нь ≈0px болж язгуурын тэмдэг алга болно. */
  .fig>svg{max-width:100%;height:auto}
  .fig table{margin:0 auto}
  .e24-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--ow,118px)),1fr));gap:6px 12px;margin:5px 0 0 31px;font-size:13px}
  .e24-o{display:flex;gap:5px;align-items:baseline;min-width:0}
  .e24-L{font-weight:800;color:#5a32d6;flex:0 0 auto}
  .e24-ov{min-width:0}
  .e24-ov>svg{max-width:100%;height:auto;vertical-align:middle}
  .e24-err{color:#dc2626;font-weight:700}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:24mm;margin:6px 0 0 31px}
  /* Хариултын хуудас (1–36 × A–E) */
  .e24-bub{margin-top:9mm;border-top:2px dashed #ddd;padding-top:6mm}
  .e24-bh{font-size:14.5px;font-weight:800;color:#5a32d6;text-align:center}
  .e24-bs{font-size:11px;color:var(--soft);text-align:center;margin:2px 0 8px}
  .e24-bm{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;font-size:11.5px;margin:0 2px 10px}
  .e24-bm span{border-bottom:1px dotted #b3a9cf;padding:0 70px 2px 4px}
  .e24-bg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px}
  .e24-bc{border:1px solid #ece6fb;border-radius:8px;padding:5px 7px}
  .e24-br{display:flex;align-items:center;gap:5px;padding:2.5px 0}
  .e24-bn{min-width:20px;text-align:right;font-weight:800;font-size:11.5px;color:#5a32d6;margin-right:2px}
  .e24-bo{width:18px;height:18px;border:1.2px solid #a99ad0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#a99ad0;line-height:1}
  /* Хариу ба бодолт */
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  #answers{display:none}
  .e24-akey{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-bottom:12px}
  .e24-akey div{border:1px solid #e6ddfa;border-radius:6px;text-align:center;font-size:12px;padding:2px 0;background:#fbfaff}
  .e24-akey b{color:#5a32d6;margin-right:3px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:7px;font-size:12px}
  .ans-grid .a{padding:6px 10px 7px;background:#fbfaff;border:1px solid #ece6fb;border-radius:9px;break-inside:avoid;page-break-inside:avoid}
  .ans-grid .an{display:inline-block;min-width:26px;color:#5a32d6;font-weight:800}
  .e24-st{margin:2px 0;padding-left:9px;border-left:2px solid #e6ddfa}
  .e24-res{margin-top:4px;font-weight:800;color:#16a34a}
  .e24-res>svg{max-width:160px;height:auto;vertical-align:middle}
  /* Хуучин хувилбарын холбоосоор нээсэн үеийн сануулга (зөвхөн дэлгэцэнд) */
  .e24-stale{max-width:210mm;margin:0 auto 12px;font-size:13px;line-height:1.45;color:#7f1d1d;background:transparent;border-left:3px solid #dc2626;border-radius:8px;padding:8px 12px}
  .e24-stale[hidden]{display:none}
  /* «Ангиар хэвлэх»-ийн хариуны түлхүүр (зөвхөн хэвлэхэд гарна) */
  .e24-kt-h{font-size:15px;font-weight:800;color:#5a32d6;text-align:center}
  .e24-kt-s{font-size:11px;color:var(--soft);text-align:center;margin:2px 0 9px}
  .e24-kt-t{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
  .e24-kt-t th,.e24-kt-t td{border:1px solid #d9cff5;text-align:center;padding:2px 0;line-height:1.3}
  .e24-kt-t thead th{background:#f4f0ff;color:#5a32d6;font-weight:800;font-size:10px}
  .e24-kt-t thead{display:table-header-group}
  .e24-kt-t tbody{break-inside:avoid;page-break-inside:avoid}
  .e24-kt-t tbody:nth-of-type(even) td{background:#fbfaff}
  .e24-kt-t td.e24-kt-v{font-weight:800;color:#5a32d6;font-size:10.5px;padding:2px 4px;text-align:left;word-break:break-word}
  .e24-kt-t td.e24-kt-v span{display:block;font-weight:600;color:var(--ink);font-size:9.5px}
  .e24-kt-t td.e24-kt-L{font-weight:800;font-size:11.5px}
  .e24-kt-t col.e24-kt-c0{width:8mm}.e24-kt-t col.e24-kt-c1{width:30mm}
  html.cm-p12 .sheet .e24-opts{font-size:12pt}
  html.cm-p12 .sheet .e24-pts{font-size:10pt}
  @media screen and (max-width:560px){
    .e24-opts{margin-left:6px;gap:7px 10px}
    .wk{margin-left:0}
    .e24-akey{grid-template-columns:repeat(6,minmax(0,1fr))}
    .e24-bm span{padding-right:40px}
    /* бодлогын хүснэгт (ж: №31 давтамжийн хүснэгт) утсанд дотроо гүйлгэхгүйгээр багтана */
    .fig table{font-size:12px!important}
    .fig table td,.fig table th{padding:4px 5px!important}
  }
  @media print{
    body{background:#fff;padding:0}.bar,.e24-stale{display:none!important}
    .sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}
    @page{size:A4;margin:11mm}
    /* Олон хуудастай шалгалт: ws-store-ийн нэг хуудсанд шахах zoom-ыг цуцална (текст жижгэрэхгүй) */
    #sheet,.sheet{zoom:1!important}
    .qm,.e24-opts{font-size:11pt}
    .e24-bub{break-before:page;border-top:0;margin-top:0;padding-top:0}
    .ans-page{break-before:page;border-top:0;margin-top:0;padding-top:0}
    .e24-q{border-bottom-color:#f1edfb}
  }
  /* KaTeX язгуурын тэмдгийн SVG-г дээрх svg хэмжээний дүрмээс хамгаална */
  .katex svg{max-width:none!important;height:inherit!important}
</style>
</head>

<div class="bar">
  <button class="btn refresh" onclick="build()" title="Шинэ хувилбар үүсгэх"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ хувилбар</button>
  <button type="button" class="e24-orig" id="e24-orig" onclick="build('orig')" title="2024 оны эх даалгавар руу буцах" hidden>Эх хувилбар</button>
  <label><input type="checkbox" id="sw" onchange="layout()"> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <label><input type="checkbox" id="sbub" onchange="layout()"> Хариултын хуудас</label>

</div>
<div class="e24-stale" id="e24-stale" role="alert" hidden></div>
<div class="sheet" id="sheet"></div>
<!-- Эх шалгалтын томьёоны хуудас (Даалгаварт хэрэглэгдэх зарим томьёо) -->
<template id="e24-ftpl"><div class="e24-fbox"><div class="e24-ft">Даалгаварт хэрэглэгдэх зарим томьёо</div><ol>
<li>$(p,\,q)$ цэгт оройтой параболын тэгшитгэл: $y=a(x-p)^2+q$</li>
<li>Пирамидын эзлэхүүн: $V=\dfrac{1}{3}\cdot S_{\text{суурь}}\cdot h$</li>
<li>Конусын хажуу гадаргуун талбай: $S_{\text{х.г}}=\pi\cdot R\cdot l$</li>
<li>Математик дундаж: $X$ дискрет санамсаргүй хувьсагчийн магадлалын тархалтын хүснэгт нь
<table class="e24-ptab"><tr><td>$x$</td><td>$x_1$</td><td>$x_2$</td><td>$\ldots$</td><td>$x_n$</td></tr><tr><td>$P(X=x)$</td><td>$p_1$</td><td>$p_2$</td><td>$\ldots$</td><td>$p_n$</td></tr></table>
бол математик дундаж $E(X)=x_1\cdot p_1+x_2\cdot p_2+\cdots+x_n\cdot p_n$ байна. $p_1+p_2+\cdots+p_n=1$</li>
<li>Стандарт хазайлт: $\text{С.Х}=\sqrt{\dfrac{\sum x^2}{n}-\overline{x}^2}=\sqrt{\dfrac{\sum(x-\overline{x})^2}{n}}$. Энд $\overline{x}=\dfrac{\sum x}{n}$</li>
<li>$\displaystyle\int_{x_1}^{x_2}a(x-x_1)(x-x_2)\,dx=-\dfrac{a}{6}(x_2-x_1)^3$</li>
</ol></div></template>
<script>
// ЭЕШ ажлын хуудсын НИЙТЛЭГ туслахууд (jishig-daalgavar-1-11.html-ээс). Генераторууд эдгээрийг ашиглана — ДАХИН БҮҮ ТОДОРХОЙЛ.
// ══════════ g10core.js — 10-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}

function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
