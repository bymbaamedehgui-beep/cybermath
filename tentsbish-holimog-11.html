<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тэнцэтгэл биш — холимог дасгал (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:17px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .col1{display:grid;grid-template-columns:1fr;gap:10px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px}.qm{font-size:13.5px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:24mm;margin-top:5px}
  .wk.tall{height:30mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sg(n){return n>=0?'+'+n:''+n;}
function opD(op){return {'>':'>','<':'<','ge':'\\ge','le':'\\le'}[op];}
function flip(op){return {'>':'<','<':'>','ge':'le','le':'ge'}[op];}
function fmt(v){if(v===Math.round(v))return ''+v;var n=Math.round(v*2);return (n<0?'-':'')+'\\tfrac{'+Math.abs(n)+'}{2}';}
function half(op,v){var fv=fmt(v);if(op==='>')return ']'+fv+',{+}\\infty[';if(op==='ge')return '['+fv+',{+}\\infty[';if(op==='<')return ']{-}\\infty,'+fv+'[';return ']{-}\\infty,'+fv+']';}
function cf(m){return m===1?'':m===-1?'-':''+m;}
function lin(a,b){return (a===1?'x':a===-1?'-x':a+'x')+(b?sg(b):'');}
// 1a. Шугаман — энгийн
function g_lin(){for(var t=0;t<400;t++){var a=nz(-6,6),c=nz(-6,6);if(a===c)continue;var m=a-c;
  var x0=pick([-3,-2,-1,0,1,2,3,1.5,2.5,-1.5,-0.5,0.5]);var b=rnd(-8,8);var d=b+m*x0;if(d!==Math.round(d)||Math.abs(d)>45)continue;
  var op=pick(['>','<','ge','le']);var dir=(m<0)?flip(op):op;
  var q='$'+lin(a,b)+' '+opD(op)+' '+lin(c,d)+'$';
  var sol='Шилжүүлбэл $'+cf(m)+'x '+opD(op)+' '+(d-b)+'$'+(m<0?' ($'+m+'<0$ тул тэмдэг эргэнэ)':'')+'. $x'+opD(dir)+fmt(x0)+'$, $x\\in\\,'+half(dir,x0)+'$';
  return {q:q,a:sol,ok:true};}return null;}
// 1b. Шугаман — бутархай
function g_linf(){for(var t=0;t<400;t++){var p=nz(-5,5),D=pick([2,3,4,5]),x0=pick([-3,-2,-1,1,2,3]);var q=rnd(-6,6);
  var r=(p*x0+q)/D;if(r!==Math.round(r)||Math.abs(r)>14)continue;var op=pick(['>','<','ge','le']);var dir=(p<0)?flip(op):op;
  var num=lin(p,q);
  var qq='$\\dfrac{'+num+'}{'+D+'} '+opD(op)+' '+r+'$';
  var sol='$'+D+'$-ээр үржвэл $'+num+' '+opD(op)+' '+(r*D)+'$; $'+cf(p)+'x '+opD(op)+' '+(p*x0)+'$'+(p<0?' (тэмдэг эргэнэ)':'')+'. $x'+opD(dir)+x0+'$, $x\\in\\,'+half(dir,x0)+'$';
  return {q:qq,a:sol,ok:true};}return null;}
// 2. (x±a)^2 хэлбэр
function g_sq(){for(var t=0;t<300;t++){var a=nz(-4,4),op=pick(['>','<','ge','le']),coef=pick([1,1,2,3]);var perfect=pick([true,true,false]);
  var m=perfect?pick([1,4,9,16,25]):pick([2,3,5,7]);var rhs=coef*m;var base=(coef===1?'':coef)+'(x'+sg(-a)+')^2';
  var q='$'+base+' '+opD(op)+' '+rhs+'$';var incEq=(op==='ge'||op==='le'),gt=(op==='>'||op==='ge');var sol,rootTxt;
  if(perfect){var r=Math.sqrt(m),lo=a-r,hi=a+r;
    if(gt)sol='$x\\in\\,]{-}\\infty,'+lo+(incEq?']':'[')+'\\cup'+(incEq?'[':']')+hi+',{+}\\infty[$';
    else sol='$x\\in\\,'+(incEq?'[':']')+lo+','+hi+(incEq?']':'[')+'$';
    rootTxt='$x'+sg(-a)+'=\\pm'+r+'\\Rightarrow x='+lo+',\\ '+hi+'$';
  }else{var sLo=(a===0?'':a)+'-\\sqrt{'+m+'}',sHi=(a===0?'':a)+'+\\sqrt{'+m+'}';
    if(gt)sol='$x\\in\\,]{-}\\infty,'+sLo+(incEq?']':'[')+'\\cup'+(incEq?'[':']')+sHi+',{+}\\infty[$';
    else sol='$x\\in\\,'+(incEq?'[':']')+sLo+','+sHi+(incEq?']':'[')+'$';
    rootTxt='$x='+(a===0?'':a)+'\\pm\\sqrt{'+m+'}$';}
  var pre=coef===1?'':'$'+coef+'$-т хуваавал $(x'+sg(-a)+')^2 '+opD(op)+' '+m+'$. ';
  return {q:q,a:pre+'Язгуур '+rootTxt+'. '+sol,ok:true};}return null;}
// 3. Параметртэй — 2 ялгаатай шийдтэй
function g_par(){var tm=pick([1,2,3]);
  if(tm===1){var m=pick([2,3,4,5]),c=m*m;return {q:'$x^2+2kx+'+c+'=0$ тэгшитгэл хоёр ялгаатай бодит шийдтэй байх $k$-ийн утга?',a:'$D=(2k)^2-4\\cdot'+c+'=4(k^2-'+c+')>0\\Rightarrow k^2>'+c+'$. Шийд: $k\\in\\,]{-}\\infty,-'+m+'[\\cup]'+m+',{+}\\infty[$',ok:true};}
  if(tm===2){var m2=pick([2,3,4,5]),c2=m2*m2;return {q:'$x^2-2kx+'+c2+'=0$ тэгшитгэл хоёр ялгаатай бодит шийдтэй байх $k$-ийн утга?',a:'$D=(2k)^2-4\\cdot'+c2+'=4(k^2-'+c2+')>0\\Rightarrow k^2>'+c2+'$. Шийд: $k\\in\\,]{-}\\infty,-'+m2+'[\\cup]'+m2+',{+}\\infty[$',ok:true};}
  var b=pick([4,6,8]),lim=b*b/4;return {q:'$kx^2+'+b+'x+1=0$ тэгшитгэл хоёр ялгаатай бодит шийдтэй байх $k$-ийн утга?',a:'$k\\ne0$ ба $D='+b*b+'-4k>0\\Rightarrow k<'+lim+'$. Шийд: $k\\in\\,]{-}\\infty,0[\\cup]0,'+lim+'[$',ok:true};}
// 4. Өгүүлбэр бодлого
function g_word(){var tm=pick([1,1,2]);
  if(tm===1){var p=rnd(2,8),q=rnd(p+2,12);var d=q-p,A=p*q;
    return {q:'Тэгш өнцөгтийн урт нь өргөнөөсөө $'+d+'$-аар их. Талбай нь $'+A+'\\ \\text{м}^2$-аас бага байх өргөн $w$ (м)-ийн боломжит утгыг ол.',a:'$w(w+'+d+')<'+A+'\\Rightarrow w^2+'+d+'w-'+A+'<0\\Rightarrow (w-'+p+')(w+'+q+')<0\\Rightarrow -'+q+'<w<'+p+'$. Өргөн эерэг тул $0<w<'+p+'$',ok:true};}
  var t2=pick([2,3,4,5]),m=pick([6,7,8,9]);if(m<=t2)m=t2+3;var A2=m*m;
  return {q:'Квадратын талыг $'+t2+'$ см-ээр ихэсгэхэд талбай нь $'+A2+'\\ \\text{см}^2$-аас их болов. Анхны тал $x>0$ (см)-ийн утгыг ол.',a:'$(x+'+t2+')^2>'+A2+'\\Rightarrow x+'+t2+'>'+m+'\\Rightarrow x>'+(m-t2)+'$. Шийд: $x\\in\\,]'+(m-t2)+',{+}\\infty[$',ok:true};}
function gen(fn){for(var t=0;t<300;t++){var f=fn();if(f&&f.ok)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т','у','ү'];
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid,.col1'),map={};for(var g=0;g<blocks.length;g++){var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var lt=LET[i]||('#'+(i+1));var ql=qs2[i].querySelector('.ql');if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=(g+1)+lt+')';}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid,.col1'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var P=[[],[],[],[]];var seen={};function fill(idx,fn,n){var c=0,tr=0;while(c<n&&tr<4000){tr++;var f=gen(fn);if(!f||seen[f.q])continue;seen[f.q]=1;P[idx].push(f);c++;}}
  function fillMix(idx,fns,n){var c=0,tr=0,i=0;while(c<n&&tr<8000){tr++;var f=gen(fns[i%fns.length]);i++;if(!f||seen[f.q])continue;seen[f.q]=1;P[idx].push(f);c++;}}
  fillMix(0,[g_lin,g_linf],12);fill(1,g_sq,10);fill(2,g_par,6);fill(3,g_word,6);return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tall,col){var use=WK?arr.slice(0,cap):arr;return '<div class="'+(col||'grid')+'">'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(WK?'<div class="wk'+(tall?' tall':'')+'"></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тэнцэтгэл биш — холимог дасгал</h1><div class="sub">Шугаман · бүтэн квадрат · параметр · хэрэглээ · 11-р анги · I бүлэг 1.2</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule"><b>Санамж:</b> Шугаманд <b>сөрөг тоонд</b> хувааж/үржихэд тэмдэг эргэнэ. $(x-a)^2\\ge0$ тул $(x-a)^2>k$ бол $|x-a|>\\sqrt{k}$. Тэгшитгэл <b>2 ялгаатай шийдтэй</b> байх нөхцөл нь $D>0$. Өгүүлбэр бодлогод хэмжээ <b>эерэг</b> байх нөхцөлийг мартав.</div>'
    +'<div class="task">1. Шугаман тэнцэтгэл бишийг бод.</div>'+block(S[0],4,false)
    +'<div class="task">2. Бүтэн квадрат хэлбэрийн тэнцэтгэл бишийг бод.</div>'+block(S[1],4,false)
    +'<div class="task">3. Тэгшитгэл хоёр ялгаатай бодит шийдтэй байх параметрийг ол.</div>'+block(S[2],4,true)
    +'<div class="task">4. Өгүүлбэртэй бодлого.</div>'+block(S[3],4,true,'col1')
    +'<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Тэнцэтгэл биш — холимог дасгал';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
