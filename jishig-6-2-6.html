<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VI бүлэг — Жишиг даалгавар 2 (6-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="/cmx.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"></div>
<script>
/* 6-р анги · VI бүлэг. Дараалал, функц — Жишиг даалгавар 2
   (6.4 Координатын хавтгай · 6.5 Шулууны тэгшитгэл бичих · 6.6 Сонгон судлах — хүнд даалгавар, сүүлийн даалгаварт хөнгөн хэлбэрээр)
   Координатын бодлогод зураг оруулахгүй — хариуг илчлэхгүй. */
function pt(nm, x, y) { return nm + '(' + x + ';' + y + ')'; }                   // A(3;-2)
function kx(k) { return k === 1 ? 'x' : k === -1 ? '-x' : k + 'x'; }              // y=kx-ийн баруун тал
function seqT(arr) { return arr.map(function (v) { return th(v); }).join(';\\ ') + ';\\ \\ldots'; }
// Төрлийн уут: нэг хуудсанд даалгаврын бодлогууд өөр өөр төрлөөс (бүх төрөл гарсны дараа л давтагдана).
// Хөдөлгүүр даалгавруудыг дарааллаар нь үүсгэдэг тул 1-р даалгавар дахин эхлэхэд (шинэ хуудас) уутнуудыг шинэчилнэ.
var BAGS = [], LAST = 0;
function bag(n) {
  var o = { b: [] }; BAGS.push(o);
  return function () { if (!o.b.length) { for (var i = 0; i < n; i++) o.b.push(i); o.b = shuffle(o.b); } return o.b.pop(); };
}
function turn(id) { if (id === 1 && LAST !== 1) BAGS.forEach(function (o) { o.b = []; }); LAST = id; }
var B1 = bag(6), B2 = bag(4), B3 = bag(5), B4 = bag(8);
var PTN = ['A', 'B', 'C', 'D', 'E', 'K', 'M', 'N', 'P'];

// 1. Цэгийн координат (6.4): тэнхлэгүүд хүртэлх зай, x/y тэнхлэг ба координатын эхэд тэгш хэмтэй цэг, тэнхлэг дээрх цэг, абсцисс-ординатаар цэг бичих
function g1() {
  turn(1);
  var t = B1(), nm = pick(PTN), x = nz(-9, 9), y = nz(-9, 9);
  if (t === 0) return { stem: '$' + pt(nm, x, y) + '$ цэгээс $x$ ба $y$ тэнхлэг хүртэлх зайг ол.', a: '$x$ тэнхлэг хүртэл $' + Math.abs(y) + '$, $y$ тэнхлэг хүртэл $' + Math.abs(x) + '$ нэгж' };
  if (t <= 3) {
    var L = ['$x$ тэнхлэгт', '$y$ тэнхлэгт', 'координатын эхэд'][t - 1], X = t === 1 ? x : -x, Y = t === 2 ? y : -y;
    return { stem: '$' + pt(nm, x, y) + '$ цэгтэй ' + L + ' тэгш хэмтэй цэгийн координатыг бич.', a: pt(nm + '_1', X, Y) };
  }
  if (t === 4) {
    var v = nz(-9, 9);
    if (rnd(0, 1)) return { stem: '$' + pt(nm, v, 0) + '$ цэг аль тэнхлэг дээр орших вэ?', a: '$x$ тэнхлэг дээр (ординат нь $0$)' };
    return { stem: '$' + pt(nm, 0, v) + '$ цэг аль тэнхлэг дээр орших вэ?', a: '$y$ тэнхлэг дээр (абсцисс нь $0$)' };
  }
  return { stem: '$' + nm + '$ цэгийн абсцисс $' + x + '$, ординат $' + y + '$ бол координатыг бич.', a: pt(nm, x, y) };
}

// 2. Хэрчим ба дүрс (6.4): тэнхлэгтэй параллель хэрчмийн урт, тэгш өнцөгтийн 4 дэх орой, периметр ба талбай, тэгш өнцөгт гурвалжны талбай
function g2() {
  turn(2);
  var t = B2();
  if (t === 0) {
    var hor = rnd(0, 1), p = nz(-8, 8), q = rnd(-8, 8), r = rnd(-8, 8); if (q === r) return null;
    var A = hor ? pt('A', q, p) : pt('A', p, q), B = hor ? pt('B', r, p) : pt('B', p, r);
    return { stem: 'Төгсгөлүүд нь $' + A + '$, $' + B + '$ байх $AB$ хэрчмийн уртыг ол. Хэрчим аль тэнхлэгтэй параллель вэ?', a: '$AB=' + Math.abs(r - q) + '$; $' + (hor ? 'x' : 'y') + '$ тэнхлэгтэй параллель' };
  }
  var x1 = rnd(-8, 3), y1 = rnd(-8, 3), a = rnd(2, 7), b = rnd(2, 7), x2 = x1 + a, y2 = y1 + b;
  if (x2 > 9 || y2 > 9) return null;
  if (t === 1) return { stem: '$ABCD$ тэгш өнцөгтийн $' + pt('A', x1, y1) + '$, $' + pt('B', x2, y1) + '$, $' + pt('C', x2, y2) + '$ оройнууд өгөгдөв. $D$ оройн координатыг ол.', a: pt('D', x1, y2) };
  if (t === 2) return { stem: '$' + pt('A', x1, y1) + '$, $' + pt('B', x2, y1) + '$, $' + pt('C', x2, y2) + '$, $' + pt('D', x1, y2) + '$ оройтой тэгш өнцөгтийн периметр ба талбайг ол.',
    a: '$AB=' + a + '$, $BC=' + b + '$; $P=2\\cdot (' + a + '+' + b + ')=' + (2 * (a + b)) + '$, $S=' + a + '\\cdot ' + b + '=' + (a * b) + '$' };
  if ((a * b) % 2) return null;
  return { stem: '$' + pt('A', x1, y1) + '$, $' + pt('B', x2, y1) + '$, $' + pt('C', x1, y2) + '$ оройтой тэгш өнцөгт гурвалжны талбайг ол.',
    a: '$AB=' + a + '$, $AC=' + b + '$; $S=\\dfrac{' + a + '\\cdot ' + b + '}{2}=' + (a * b / 2) + '$' };
}

// 3. y=kx шулуун (6.5): утга олох, цэгээр дайрах шулууны тэгшитгэл, цэг шулуун дээр орших эсэх, мэдэгдэхгүй координат, хүснэгтээс тэгшитгэл
function g3() {
  turn(3);
  var t = B3(), k = nz(-6, 6), x = nz(-9, 9), y = k * x;
  if ((Math.abs(k) === 1 || Math.abs(x) === 1) && t <= 1) return null;
  if (t === 0) return { stem: '$y=' + kx(k) + '$, $x=' + x + '$ үед $y=?$', a: 'y=' + par(k) + '\\cdot ' + par(x) + '=' + y };
  if (t === 1) return { stem: '$' + pt('M', x, y) + '$ цэгийг дайрах $y=kx$ шулууны тэгшитгэлийг бич.', a: '$' + y + '=k\\cdot ' + par(x) + '$, $k=' + k + '$; $y=' + kx(k) + '$' };
  if (t === 2) {
    var on = rnd(0, 2) > 0, yy = on ? y : y + pick([-3, -2, -1, 1, 2, 3]);
    return { stem: '$' + pt('A', x, yy) + '$ цэг $y=' + kx(k) + '$ шулуун дээр орших уу?',
      a: on ? 'тийм: $' + par(k) + '\\cdot ' + par(x) + '=' + y + '$' : 'үгүй: $' + par(k) + '\\cdot ' + par(x) + '=' + y + '\\ne ' + yy + '$' };
  }
  if (t === 3) {
    if (rnd(0, 1)) return { stem: '$y=' + kx(k) + '$ шулуун дээрх $' + pt('A', '?', y) + '$ цэгийн абсциссыг ол.', a: '$' + y + '=' + kx(k) + '$, $x=' + x + '$' };
    return { stem: '$y=' + kx(k) + '$ шулуун дээрх $' + pt('A', x, '?') + '$ цэгийн ординатыг ол.', a: '$y=' + par(k) + '\\cdot ' + par(x) + '=' + y + '$' };
  }
  var xs = shuffle([-3, -2, -1, 1, 2, 3, 4, 5]).slice(0, 4).sort(function (p, q) { return p - q; });
  return { stem: 'Хүснэгтээр өгсөн хамаарлыг $y=kx$ хэлбэрээр бич: $\\begin{array}{c|c|c|c|c}x&' + xs.join('&') + '\\\\\\hline y&' + xs.map(function (v) { return k * v; }).join('&') + '\\end{array}$',
    a: '$k=' + k + '$; $y=' + kx(k) + '$' };
}

// 4. Бодлого: зам ба ус (y=kx хамаарал, 6.5); сонгон хөнгөн хэлбэрээр (6.6) — хоёр машины зай, дарааллын нийлбэр,
//    тоо дарааллын хэддүгээр гишүүн, зэргийн сүүлийн цифр, трапецийн талбай, хоёр дарааллын нийтлэг гишүүд
function g4() {
  turn(4);
  var t = B4();
  if (t === 0) {
    var v = pick([40, 45, 50, 55, 60, 65, 70, 75, 80, 90]), tt = rnd(2, 5), T = rnd(6, 12);
    return { stem: 'Машин $' + tt + '$ цагт $' + (v * tt) + '$ км замыг тогтмол хурдаар туулжээ. $x$ цагт туулах зам $y$ км бол $y=kx$ томьёог бичээд, $' + T + '$ цагт хэдэн км явахыг ол.',
      a: '$k=' + (v * tt) + '\\div ' + tt + '=' + v + '$, $y=' + v + 'x$; $' + v + '\\cdot ' + T + '=' + (v * T) + '$ км' };
  }
  if (t === 1) {
    var q0 = pick([200, 250, 300, 400, 500, 600, 800]), t1 = rnd(2, 4), m = rnd(5, 15), F = q0 * m;
    return { stem: 'Хоосон усан санд цаг тутам ижил хэмжээний ус орж, $' + t1 + '$ цагт $' + th(q0 * t1) + '$ литр ус оржээ. $x$ цагт орох ус $y$ литр бол $y=kx$ томьёог бичээд, $' + th(F) + '$ литр ус хэдэн цагт орохыг ол.',
      a: '$k=' + th(q0 * t1) + '\\div ' + t1 + '=' + q0 + '$, $y=' + q0 + 'x$; $' + th(F) + '\\div ' + q0 + '=' + m + '$ цаг' };
  }
  if (t === 2) {
    var v1 = pick([60, 70, 80, 90, 100]), v2 = pick([30, 40, 50]), h = rnd(2, 6), D = (v1 - v2) * h;
    return { stem: 'Хоёр машин нэг цэгээс нэг зүгт зэрэг хөдлөв. $x$ цагт тэдний туулах зам $y=' + v1 + 'x$ ба $y=' + v2 + 'x$ км. Хэдэн цагийн дараа тэдний хоорондох зай $' + D + '$ км болох вэ?',
      a: '$' + v1 + 'x-' + v2 + 'x=' + D + '$, $' + (v1 - v2) + 'x=' + D + '$; $x=' + h + '$ цаг' };
  }
  if (t === 3) {
    var a1 = rnd(1, 15), d = rnd(2, 9), n = pick([10, 12, 14, 16, 20]), an = a1 + (n - 1) * d;
    return { stem: '$' + seqT([a1, a1 + d, a1 + 2 * d, a1 + 3 * d]) + '$ дарааллын эхний $' + n + '$ гишүүний нийлбэрийг ол.',
      a: '$a_{' + n + '}=' + an + '$; хос бүрийн нийлбэр $' + a1 + '+' + an + '=' + (a1 + an) + '$, хосын тоо $' + (n / 2) + '$; $S=' + (a1 + an) + '\\cdot ' + (n / 2) + '=' + ((a1 + an) * n / 2) + '$' };
  }
  if (t === 4) {
    var a2 = rnd(2, 20), d2 = rnd(3, 12), pos = rnd(20, 80), M = a2 + (pos - 1) * d2;
    return { stem: '$' + M + '$ тоо $' + seqT([a2, a2 + d2, a2 + 2 * d2, a2 + 3 * d2]) + '$ дарааллын хэддүгээр гишүүн бэ?', a: '$(' + M + '-' + a2 + ')\\div ' + d2 + '+1=' + pos + '$' };
  }
  if (t === 5) {
    var bse = pick([2, 3, 4, 7, 8, 9, 12, 13]), e = rnd(11, 80), dd = bse % 10, cyc = [], cur = dd, i;
    for (i = 0; i < 4; i++) { cyc.push(cur); cur = (cur * dd) % 10; }
    var p = 1; while (p < 4 && cyc[p] !== cyc[0]) p++; cyc = cyc.slice(0, p);
    return { stem: '$' + bse + '^{' + e + '}$ тооны сүүлийн цифрийг ол.',
      a: 'сүүлийн цифр $' + cyc.join(',\\ ') + '$ гэж $' + p + '$ тутамд давтагдана; $' + e + '$ тоог $' + p + '$ тоонд хуваахад үлдэгдэл $' + (e % p) + '$ тул $' + cyc[(e - 1) % p] + '$' };
  }
  if (t === 6) {
    var X1 = rnd(-8, 0), w = rnd(2, 8), Y1 = rnd(-8, 0), h1 = rnd(2, 7), h2 = rnd(2, 7);
    if (h1 === h2 || ((h1 + h2) * w) % 2 || X1 + w > 9 || Y1 + Math.max(h1, h2) > 9) return null;
    return { stem: '$' + pt('A', X1, Y1) + '$, $' + pt('B', X1 + w, Y1) + '$, $' + pt('C', X1 + w, Y1 + h2) + '$, $' + pt('D', X1, Y1 + h1) + '$ оройтой трапецийн талбайг ол.',
      a: '$AD=' + h1 + '$, $BC=' + h2 + '$, өндөр $AB=' + w + '$; $S=\\dfrac{(' + h1 + '+' + h2 + ')\\cdot ' + w + '}{2}=' + ((h1 + h2) * w / 2) + '$' };
  }
  var aa = pick([3, 4, 6]), bb = pick([5, 8, 9, 10]), N = pick([100, 120, 150, 200, 240, 300]), Lc = lcm(aa, bb), cnt = Math.floor(N / Lc);
  return { stem: '$' + seqT([aa, 2 * aa, 3 * aa]) + '$ ба $' + seqT([bb, 2 * bb, 3 * bb]) + '$ дарааллын аль алинд нь орох, $' + N + '$ тооноос ихгүй натурал тоо хэд байх вэ?',
    a: 'ХБЕХ $=' + Lc + '$; $' + Lc + '\\cdot ' + cnt + '=' + (Lc * cnt) + '\\le ' + N + '$ тул $' + cnt + '$ тоо' };
}

CMX.jishig({
  title: 'VI бүлэг — Жишиг даалгавар 2',
  sub: 'Координатын хавтгай · хэрчим, тэгш өнцөгт · y = kx шулуун · сонгон даалгавар',
  grade: '6-р анги',
  rule: '$A(x;y)$: $x$ — абсцисс, $y$ — ординат &nbsp;·&nbsp; $y=kx$ шулуун $O(0;0)$ цэгийг дайрна, $k=\\dfrac{y}{x}$',
  tasks: [
    { label: 'Цэгийн координатын асуултад хариул.', gen: g1, n: 8, nw: 4, cols: 2, wk: 10 },
    { label: 'Хэрчим, тэгш өнцөгт, гурвалжны бодлогыг бод.', gen: g2, n: 6, nw: 2, cols: 2, wk: 16 },
    { label: '$y=kx$ шулууны асуултад хариул.', gen: g3, n: 8, nw: 4, cols: 2, wk: 12 },
    { label: 'Бодлогыг бод.', gen: g4, n: 6, nw: 2, cols: 2, wk: 22 }
  ]
});
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
