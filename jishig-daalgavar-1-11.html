<style>

  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:22mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}

  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}

<script>
// ══════════ g10core.js — 10-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';
 g+='<text x="'+(+X(0)+5)+'" y="'+(+Y(R)+8)+'" font-size="10" font-style="italic" fill="#555">y</text>';
 if(!opts.blank){
  (opts.lines||[]).forEach(function(L){var y1=L.k*(-R)+L.b,y2=L.k*R+L.b;g+='<line x1="'+X(-R)+'" y1="'+Y(y1)+'" x2="'+X(R)+'" y2="'+Y(y2)+'" stroke="'+(L.color||'#7B52EE')+'" stroke-width="2"/>';});
  (opts.pts||[]).forEach(function(p){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#dc2626"/>'+(p.l?'<text x="'+(+X(p.x)+4)+'" y="'+(+Y(p.y)-4)+'" font-size="9" font-weight="700" fill="#b91c1c">'+p.l+'</text>':'');});
 }
 return '<svg viewBox="0 0 '+W+' '+H+'" width="188">'+g+'</svg>';}
// ── Тооны шулуун (blank, зөвхөн хуваарь; цэгийг тэмдэглэхгүй тул хариу илчлэхгүй) ──
function numline(lo,hi){var W=320,H=44,pad=18,u=(W-2*pad)/(hi-lo);var g='<line x1="'+pad+'" y1="26" x2="'+(W-pad)+'" y2="26" stroke="#555" stroke-width="1.4"/>';
 g+='<polygon points="'+(W-pad)+',26 '+(W-pad-6)+',23 '+(W-pad-6)+',29" fill="#555"/>';
 for(var v=lo;v<=hi;v++){var x=pad+(v-lo)*u;g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="30" stroke="#555" stroke-width="1"/>';g+='<text x="'+x+'" y="41" font-size="9" text-anchor="middle" fill="#555">'+v+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" width="300">'+g+'</svg>';}
// ── Эйлер-Веннийн диаграм (2 олонлог, blank) ──
function venn2(la,lb){la=la||'A';lb=lb||'B';var g='<rect x="6" y="6" width="248" height="118" rx="6" fill="none" stroke="#b9b0d6"/>';
 g+='<circle cx="102" cy="65" r="50" fill="rgba(123,82,238,0.13)" stroke="#7B52EE" stroke-width="1.4"/>';
 g+='<circle cx="158" cy="65" r="50" fill="rgba(168,85,247,0.13)" stroke="#A855F7" stroke-width="1.4"/>';
 g+='<text x="70" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+la+'</text>';
 g+='<text x="186" y="70" font-size="14" font-style="italic" fill="#5a32d6">'+lb+'</text>';
 return '<svg viewBox="0 0 260 130" width="210">'+g+'</svg>';}
// ══════════ g11exam.v00.js — ЖИШИГ ДААЛГАВАР (11-р анги) нийтлэг туслахууд ══════════
// Энэ файл бүх хувилбарын ӨМНӨ залгагдана. Доорх функцүүдийг ДАХИН БҮҮ ТОДОРХОЙЛ.
// g11core.js-ийн туслахууд (rnd, pick, Fr, fTex, ...) энэ файлын өмнө байна.

// ─── Бодолтыг ЦЭГЦТЭЙ харуулах ───────────────────────────────────────
// steps: алхам бүрийн HTML мөр (массив). ans: эцсийн хариу (HTML).
// Алхам бүр тусдаа мөрөнд, зүүн талдаа нимгэн шугамтай; хариу нь ногооноор тодорно.
function x10_sol(steps, ans) {
  var body = (steps || []).filter(function (t) { return t != null && t !== ''; })
    .map(function (t) {
      return '<div style="margin:2px 0;padding-left:9px;border-left:2px solid #e6ddfa">' + t + '</div>';
    }).join('');
  return body + '<div style="margin-top:4px;font-weight:800;color:#16a34a">Хариу: ' + ans + '</div>';
}
// Богино бодолт — ганц мөр тайлбар + хариу
function x10_one(step, ans) { return x10_sol([step], ans); }
// Зөвхөн хариу (бодолт шаардлагагүй энгийн даалгаварт)
function x10_ans(ans) { return '<span style="font-weight:800;color:#16a34a">Хариу: ' + ans + '</span>'; }

// ─── Бодолтын хуудсыг цэвэрхэн болгох CSS (plan-ийн ref-д ордог) ────
var X10_REF = '<style>'
  + '#answers h2{font-size:15.5px}'
  + '#answers .ans-grid{gap:7px;font-size:12px}'
  + '#answers .ans-grid .a{padding:6px 10px 7px;background:#fbfaff;border:1px solid #ece6fb;'
  + 'border-radius:9px;border-bottom:1px solid #ece6fb;break-inside:avoid;page-break-inside:avoid}'
  + '#answers .ans-grid .an{display:inline-block;min-width:26px;color:#5a32d6}'
  + '</style>';

// ─── Түгээмэл жижиг туслахууд ───────────────────────────────────────
// Цэгийн координатыг бичих: (a; b)
function x10_pt(a, b) { return '(' + a + ';\\ ' + b + ')'; }
// Векторын тэмдэглэгээ: \vec{AB}
function x10_vec(s) { return '\\vec{' + s + '}'; }
// Бутархайг хамгийн хураангуй хэлбэрээр LaTeX болгох (бүхэл бол зөвхөн тоо)
function x10_fr(p, q) {
  var g = gcd(Math.abs(p), Math.abs(q)) || 1;
  p = p / g; q = q / g;
  if (q < 0) { p = -p; q = -q; }
  if (q === 1) return '' + p;
  return (p < 0 ? '-' : '') + '\\dfrac{' + Math.abs(p) + '}{' + q + '}';
}
// Язгуурыг хялбарчлах: sqrt(n) → [гадна, дотор]  (ж: 72 → [6,2])
function x10_sqSimp(n) {
  var out = 1;
  for (var d = 2; d * d <= n; d++) { while (n % (d * d) === 0) { n /= (d * d); out *= d; } }
  return [out, n];
}
// √-ийн LaTeX (дотор нь 1 бол зөвхөн коэффициент)
function x10_sqTex(k, r) {
  if (r === 1) return '' + k;
  return (k === 1 ? '' : k) + '\\sqrt{' + r + '}';
}
// Тэмдэгтэй нэмэлт: 5 → "+5", -3 → "-3"
function x10_pm(n) { return (n >= 0 ? '+' : '') + n; }
// ax^2+bx+c хэлбэрийн гурван гишүүнтийг цэвэрхэн бичих
function x10_quad(a, b, c, v) {
  v = v || 'x';
  var s = '';
  s += (a === 1 ? '' : a === -1 ? '-' : a) + v + '^2';
  if (b) s += (b > 0 ? '+' : '-') + (Math.abs(b) === 1 ? '' : Math.abs(b)) + v;
  if (c) s += (c > 0 ? '+' : '-') + Math.abs(c);
  return s;
}

// ══════════ g11exam.v01.js — ЖИШИГ ДААЛГАВАР ХУВИЛБАР №1 (11-р анги) ══════════
// g11core.js + g11exam.v00.js-ийн ДАРАА залгагдана. Эх сурвалж: 800 бодлого, х.1 (Хувилбар №1, зүүн багана).
// Бодлого бүр эх сурвалжтай ижил хэлбэртэй, зөвхөн тоо нь санамсаргүй өөрчлөгдөнө.

// ─── Туслахууд ──────────────────────────────────────────────────────
// kx+m шугаман илэрхийлэл (k=±1 бол коэффициентгүй, m=0 бол сул гишүүнгүй)
function e11v1_lin(k, m, v) {
  v = v || 'x';
  var s = (k === 1 ? '' : k === -1 ? '-' : '' + k) + v;
  if (m) s += (m > 0 ? '+' : '-') + Math.abs(m);
  return s;
}
// Бутархай коэффициент × хувьсагч: 1→v, -1→-v, 3→3v, 1/2→\dfrac{1}{2}v
function e11v1_cx(f, v) {
  if (f.d === 1) return (f.n === 1 ? '' : f.n === -1 ? '-' : '' + f.n) + v;
  return fTex(f) + v;
}
// Тэмдэгтэй гишүүн (эхнийх биш): +\dfrac{1}{2}x, -3x
function e11v1_sx(f, v) {
  var t = e11v1_cx(f, v);
  return (t.charAt(0) === '-' ? '' : '+') + t;
}
// Огторгуйн цэг/вектор (a;\ b;\ c)
function e11v1_p3(a, b, c) { return '(' + a + ';\\ ' + b + ';\\ ' + c + ')'; }
// Хагас бүхэл аравтын бичлэг (Fr, хуваарь 1 эсвэл 2): 3/2 → 1.5
function e11v1_dec(f) {
  if (f.d === 1) return '' + f.n;
  var neg = f.n < 0, N = Math.abs(f.n);
  return (neg ? '-' : '') + Math.floor(N / 2) + '.5';
}
function e11v1_C(n, k) { var r = 1; for (var i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }

// ══════════════════════════════════════════════════════════════════
// [№1 №1] 1-x^2 ≥ 0 тэнцэтгэл бишийг хангах хамгийн бага бүхэл тоо
function g_e11v1p1() {
  var c = rnd(1, 60), n = 0;
  while ((n + 1) * (n + 1) <= c) n++;
  var sq = n * n === c;
  var st = ['$' + c + '-x^2\\ge 0$ тул $x^2\\le ' + c + '$'];
  if (sq) st.push('$|x|\\le\\sqrt{' + c + '}=' + n + '$, өөрөөр хэлбэл $-' + n + '\\le x\\le ' + n + '$');
  else st.push('$|x|\\le\\sqrt{' + c + '}$; $' + n + '^2=' + (n * n) + '$, $' + (n + 1) + '^2=' + ((n + 1) * (n + 1))
    + '$ тул $' + n + '\\lt\\sqrt{' + c + '}\\lt ' + (n + 1) + '$');
  st.push('Шийд: $-\\sqrt{' + c + '}\\le x\\le\\sqrt{' + c + '}$ тул хамгийн бага бүхэл тоо $x=-' + n + '$');
  st.push('Шалгалт: $' + c + '-(-' + n + ')^2=' + (c - n * n) + '$ (сөрөг биш), $' + c + '-(-' + (n + 1) + ')^2='
    + (c - (n + 1) * (n + 1)) + '$ (сөрөг)');
  return {
    q: '$' + c + '-x^2\\ge 0$ тэнцэтгэл бишийг хангах хамгийн бага бүхэл тоог ол.',
    a: x10_sol(st, '$' + (-n) + '$'), nv: -n, key: 'p1_' + c
  };
}

// [№1 №2] Хоёр тооны нийлбэр 20, үржвэр нь -96 бол эдгээр тоог ол
function g_e11v1p2() {
  var x1, x2;
  do { x1 = rnd(3, 24); x2 = -rnd(1, x1 - 1); } while (x1 * -x2 > 300);
  var S = x1 + x2, P = x1 * x2, D = S * S - 4 * P, sd = x1 - x2;
  return {
    q: 'Хоёр тооны нийлбэр $' + S + '$, үржвэр нь $' + P + '$ бол эдгээр тоог ол.',
    a: x10_sol([
      'Тоонуудыг $t_1$, $t_2$ гэвэл $S=t_1+t_2=' + S + '$, $P=t_1t_2=' + P + '$; Виетийн теоремоор тэдгээр нь $t^2-St+P=0$ тэгшитгэлийн язгуурууд',
      '$' + x10_quad(1, -S, P, 't') + '=0$',
      '$D=' + S + '^2-4\\cdot(' + P + ')=' + (S * S) + '+' + (-4 * P) + '=' + D + '$, $\\sqrt{D}=' + sd + '$',
      '$t_1=\\dfrac{' + S + '+' + sd + '}{2}=' + x1 + '$, $t_2=\\dfrac{' + S + '-' + sd + '}{2}=' + x2 + '$',
      'Шалгалт: $' + x1 + '+(' + x2 + ')=' + S + '$, $' + x1 + '\\cdot(' + x2 + ')=' + P + '$'
    ], '$' + x1 + '$ ба $' + x2 + '$'),
    key: 'p2_' + x1 + '_' + x2
  };
}

// [№1 №3] f(x)=5/2·x^4-2 функцийн эх функц
function g_e11v1p3() {
  var n = rnd(2, 7), qd = pick([2, 3, 4, 5]), p;
  do { p = rnd(1, 9); } while (gcd(p, qd) !== 1);
  var c = nz(-9, 9), m = n + 1;
  var k = Fr(p, qd * m);
  var cs = (c > 0 ? '+' : '-') + Math.abs(c);
  var cx = (c > 0 ? '+' : '-') + (Math.abs(c) === 1 ? '' : Math.abs(c)) + 'x';
  var F = e11v1_cx(k, 'x^{' + m + '}') + cx + '+C';
  return {
    q: '$f(x)=\\dfrac{' + p + '}{' + qd + '}x^' + n + cs + '$ функцийн эх функцийг ол.',
    a: x10_sol([
      'Томьёо: $\\int x^n\\,dx=\\dfrac{x^{n+1}}{n+1}+C$, $\\int a\\,dx=ax+C$',
      'Эхний гишүүн: $\\dfrac{' + p + '}{' + qd + '}\\cdot\\dfrac{x^{' + m + '}}{' + m + '}=' + e11v1_cx(k, 'x^{' + m + '}') + '$',
      'Сул гишүүн: $' + (c > 0 ? c : '(' + c + ')') + '\\cdot x=' + (c === 1 ? '' : c === -1 ? '-' : c) + 'x$',
      'Эх функцүүдийн ерөнхий хэлбэр: $F(x)=' + F + '$'
    ], '$F(x)=' + F + '$'),
    key: 'p3_' + p + '_' + qd + '_' + n + '_' + c
  };
}

// [№1 №4] {x^2-5xy=-4; x-3y=1} системийн бүхэл тоон шийд
function g_e11v1p4() {
  for (var t = 0; t < 60; t++) {
    var A = rnd(2, 7), B = pick([-4, -3, -2, 2, 3, 4]), D = nz(-5, 5), y0 = nz(-4, 4);
    var x0 = B * y0 + D, C = x0 * x0 - A * x0 * y0;
    if (!C || Math.abs(C) > 80) continue;
    var a2 = B * B - A * B, b2 = 2 * B * D - A * D, c2 = D * D - C;
    if (!a2) continue;
    var y1 = Fr(-b2 - a2 * y0, a2);
    if (y1.d === 1) continue;
    var s = a2 < 0 ? -1 : 1, g = gcd(gcd(a2, b2), c2);
    var A2 = s * a2 / g, B2 = s * b2 / g, C2 = s * c2 / g;
    var Dq = B2 * B2 - 4 * A2 * C2, r = isqrt(Dq);
    if (r === null || r === 0) continue;
    var yp = Fr(-B2 + r, 2 * A2), ym = Fr(-B2 - r, 2 * A2);
    var lin = e11v1_lin(B, D, 'y');
    var line = 'x' + (B > 0 ? '-' + B : '+' + (-B)) + 'y=' + D;
    var nb = B2 ? '' + (-B2) : '';
    return {
      q: '$\\begin{cases}x^2-' + A + 'xy=' + C + '\\\\' + line + '\\end{cases}$ тэгшитгэлийн бүхэл тоон шийдийг ол.',
      a: x10_sol([
        'Хоёр дахь тэгшитгэлээс: $x=' + lin + '$',
        'Эхний тэгшитгэлд орлуулна: $(' + lin + ')^2-' + A + '(' + lin + ')y=' + C + '$',
        'Хаалтыг задалж эмхэтгэвэл: $' + x10_quad(a2, b2, c2, 'y') + '=0$',
        s * g === 1 ? '' : (s * g === -1 ? 'Хоёр талыг $-1$-ээр үржүүлбэл: $' : 'Хоёр талыг $' + (s * g) + '$ тоонд хуваавал: $')
          + x10_quad(A2, B2, C2, 'y') + '=0$',
        '$D=' + paren(B2) + '^2-4\\cdot ' + A2 + '\\cdot ' + paren(C2) + '=' + Dq + '$; $y_1=\\dfrac{' + nb + '+' + r + '}{' + (2 * A2) + '}='
          + fTex(yp) + '$, $y_2=\\dfrac{' + nb + '-' + r + '}{' + (2 * A2) + '}=' + fTex(ym) + '$',
        'Бүхэл утга нь $y=' + y0 + '$ (нөгөө нь бүхэл биш), $x=' + B + '\\cdot ' + paren(y0) + (D > 0 ? '+' : '-') + Math.abs(D) + '=' + x0 + '$'
      ], '$' + x10_pt(x0, y0) + '$'),
      key: 'p4_' + A + '_' + B + '_' + D + '_' + y0
    };
  }
  return null;
}

// [№1 №5] 2/3+2/9+2/27+…+2/3^n нийлбэр
function g_e11v1p5() {
  var b = pick([2, 3, 4, 5, 6, 7, 8, 9]), a;
  do { a = rnd(1, 9); } while (gcd(a, b) !== 1);
  var co = Fr(a, b - 1);
  var tail = '1-\\dfrac{1}{' + b + '^n}';
  var ans = (co.n === 1 && co.d === 1) ? tail : fTex(co) + '\\bigl(' + tail + '\\bigr)';
  return {
    q: '$\\dfrac{' + a + '}{' + b + '}+\\dfrac{' + a + '}{' + (b * b) + '}+\\dfrac{' + a + '}{' + (b * b * b)
      + '}+\\ldots+\\dfrac{' + a + '}{' + b + '^n}$ нийлбэрийг ол.',
    a: x10_sol([
      'Геометр прогрессийн эхний $n$ гишүүний нийлбэр: $b_1=\\dfrac{' + a + '}{' + b + '}$, $q=\\dfrac{1}{' + b + '}$',
      'Томьёо: $S_n=\\dfrac{b_1(1-q^n)}{1-q}$',
      '$1-q=1-\\dfrac{1}{' + b + '}=\\dfrac{' + (b - 1) + '}{' + b + '}$, $q^n=\\dfrac{1}{' + b + '^n}$',
      '$S_n=\\dfrac{' + a + '}{' + b + '}\\cdot ' + x10_fr(b, b - 1) + '\\bigl(' + tail + '\\bigr)=' + ans + '$'
    ], '$S_n=' + ans + '$'),
    key: 'p5_' + a + '_' + b
  };
}

// [№1 №6] (x+1/x)^10 задаргааны x^4-тэй гишүүний коэффициент
function g_e11v1p6() {
  for (var t = 0; t < 60; t++) {
    var n = rnd(5, 12), a = pick([1, 1, 1, 2, 3]), k = rnd(2, n - 1), m = n - 2 * k;
    if (m < 1) continue;
    var Cn = e11v1_C(n, k), coef = Cn * Math.pow(a, k);
    if (coef > 5000) continue;
    var xm = m === 1 ? 'x' : m < 10 ? 'x^' + m : 'x^{' + m + '}';
    var kk = Math.min(k, n - k), num = [], den = [];
    for (var i = 0; i < kk; i++) { num.push(n - i); den.push(kk - i); }
    var ke = k < 10 ? '^' + k : '^{' + k + '}';
    var cStep = kk === 1 ? '$C_{' + n + '}' + ke + '=' + Cn + '$'
      : '$C_{' + n + '}' + ke + '=\\dfrac{' + num.join('\\cdot ') + '}{' + den.join('\\cdot ') + '}=' + Cn + '$';
    var st = ['Биномын ерөнхий гишүүн: $T_{k+1}=C_n^k a^{n-k}b^k$'];
    if (a === 1) st.push('$T_{k+1}=C_{' + n + '}^k x^{' + n + '-k}\\bigl(\\dfrac{1}{x}\\bigr)^k=C_{' + n + '}^k x^{' + n + '-2k}$');
    else st.push('$T_{k+1}=C_{' + n + '}^k x^{' + n + '-k}\\bigl(\\dfrac{' + a + '}{x}\\bigr)^k=C_{' + n + '}^k\\cdot ' + a + '^k x^{' + n + '-2k}$');
    st.push('$' + n + '-2k=' + m + '$ тул $k=' + k + '$');
    st.push(cStep);
    if (a !== 1) st.push('$T_{' + (k + 1) + '}=' + Cn + '\\cdot ' + a + ke + '\\cdot ' + xm + '=' + coef + xm + '$');
    return {
      q: '$\\bigl(x+\\dfrac{' + a + '}{x}\\bigr)^{' + n + '}$ задаргааны $' + xm + '$-тэй гишүүний өмнөх коэффициентийг ол.',
      a: x10_sol(st, '$' + coef + '$'), nv: coef, key: 'p6_' + n + '_' + a + '_' + k
    };
  }
  return null;
}

// [№1 №7] (1-sin(-α))(1-sinα) илэрхийллийг хялбарчлах
function g_e11v1p7() {
  var f = 'sin', s1 = pick(['-', '+']), m = pick([1, 1, 2, 3, 4, 5, 6]), v = pick(['\\alpha', '\\beta', 'x']);
  var A = (m === 1 ? '' : '' + m) + v;
  function F(arg) { return '\\' + f + (arg.charAt(0) === '\\' ? '' : ' ') + arg; }
  function F2(g) { return '\\' + g + '^2 ' + A; }
  var o1 = s1 === '-' ? '+' : '-';
  var st = [], orig, ans;
  if (f === 'sin') {
    orig = '(1' + s1 + '\\sin(-' + A + '))(1' + s1 + F(A) + ')';
    st.push('Синус сондгой функц: $\\sin(-' + A + ')=-' + F(A) + '$');
    st.push('Иймд $' + orig + '=(1' + o1 + F(A) + ')(1' + s1 + F(A) + ')$');
    st.push('Квадратуудын ялгавар: $(1' + o1 + F(A) + ')(1' + s1 + F(A) + ')=1-' + F2('sin') + '$');
    st.push('Үндсэн адилтгал: $' + F2('sin') + '+' + F2('cos') + '=1$ тул $1-' + F2('sin') + '=' + F2('cos') + '$');
    ans = F2('cos');
  } else {
    orig = '(1' + s1 + '\\cos(-' + A + '))(1' + o1 + F(A) + ')';
    st.push('Косинус тэгш функц: $\\cos(-' + A + ')=' + F(A) + '$');
    st.push('Иймд $' + orig + '=(1' + s1 + F(A) + ')(1' + o1 + F(A) + ')$');
    st.push('Квадратуудын ялгавар: $(1' + s1 + F(A) + ')(1' + o1 + F(A) + ')=1-' + F2('cos') + '$');
    st.push('Үндсэн адилтгал: $' + F2('sin') + '+' + F2('cos') + '=1$ тул $1-' + F2('cos') + '=' + F2('sin') + '$');
    ans = F2('sin');
  }
  return {
    q: '$' + orig + '$ илэрхийллийг хялбарчил.',
    a: x10_sol(st, '$' + ans + '$'),
    key: 'p7_' + f + s1 + m + v
  };
}

// [№1 №8] 2sinα-1=0 биелэх α-ийн утгууд (ерөнхий шийд)
function g_e11v1p8() {
  var f = 'sin', r = pick(['1', '\\sqrt{2}', '\\sqrt{3}']), s = pick([1, -1]), k = pick([1, 1, 2, 3]);
  var v = pick(['\\alpha', 'x']), vq = v === 'x' ? 'x' : '\\alpha';
  var sp = v === 'x' ? ' ' : '';
  var kr = k === 1 ? r : (r === '1' ? '' + k : k + r);
  var eq = (2 * k) + '\\' + f + sp + v + (s > 0 ? '-' : '+') + kr + '=0';
  var valT = (s < 0 ? '-' : '') + '\\dfrac{' + r + '}{2}';
  // үндсэн өнцөг (эерэг утгын)
  var base = f === 'sin' ? { '1': [1, 6], '\\sqrt{2}': [1, 4], '\\sqrt{3}': [1, 3] }[r]
    : { '1': [1, 3], '\\sqrt{2}': [1, 4], '\\sqrt{3}': [1, 6] }[r];
  function ang(p, q) { return '\\dfrac{' + (p === 1 ? '' : p) + '\\pi}{' + q + '}'; }
  var st = [];
  st.push('$' + (2 * k) + '\\' + f + sp + v + '=' + (s < 0 ? '-' : '') + kr + '$ тул $\\' + f + sp + v + '=' + valT + '$');
  var ans;
  if (f === 'sin') {
    st.push('Томьёо: $\\sin ' + v + '=a$ бол $' + v + '=(-1)^k\\arcsin a+\\pi k,\\ k\\in\\mathbb{Z}$');
    if (s > 0) {
      st.push('$\\arcsin' + valT + '=' + ang(1, base[1]) + '$');
      ans = v + '=(-1)^k' + ang(1, base[1]) + '+\\pi k,\\ k\\in\\mathbb{Z}';
    } else {
      st.push('$\\arcsin\\bigl(' + valT + '\\bigr)=-\\arcsin\\dfrac{' + r + '}{2}=-' + ang(1, base[1]) + '$');
      st.push('$' + v + '=(-1)^k\\cdot\\bigl(-' + ang(1, base[1]) + '\\bigr)+\\pi k=(-1)^{k+1}' + ang(1, base[1]) + '+\\pi k$');
      ans = v + '=(-1)^{k+1}' + ang(1, base[1]) + '+\\pi k,\\ k\\in\\mathbb{Z}';
    }
  } else {
    st.push('Томьёо: $\\cos ' + v + '=a$ бол $' + v + '=\\pm\\arccos a+2\\pi k,\\ k\\in\\mathbb{Z}$');
    if (s > 0) {
      st.push('$\\arccos' + valT + '=' + ang(1, base[1]) + '$');
      ans = v + '=\\pm' + ang(1, base[1]) + '+2\\pi k,\\ k\\in\\mathbb{Z}';
    } else {
      var pp = base[1] - 1;
      st.push('$\\arccos\\bigl(' + valT + '\\bigr)=\\pi-\\arccos\\dfrac{' + r + '}{2}=\\pi-' + ang(1, base[1]) + '=' + ang(pp, base[1]) + '$');
      ans = v + '=\\pm' + ang(pp, base[1]) + '+2\\pi k,\\ k\\in\\mathbb{Z}';
    }
  }
  var a0 = f === 'sin' ? (s > 0 ? ang(1, base[1]) : '\\bigl(-' + ang(1, base[1]) + '\\bigr)')
    : (s > 0 ? ang(1, base[1]) : ang(base[1] - 1, base[1]));
  st.push('Шалгалт ($k=0$): $\\' + f + a0 + '=' + valT + '$');
  return {
    q: '$' + eq + '$ биелэх $' + vq + '$-ийн утгыг ол.',
    a: x10_sol(st, '$' + ans + '$'),
    key: 'p8_' + f + '_' + r + '_' + s + '_' + k + '_' + v
  };
}

// [№1 №9] u=(3;-1;2), v=(m;-0.5;1) коллинеар бол m

// Гистограмм (давтамжийн нягт) — моод бүлгийг тодруулахгүй
function e11v1_hist(x0, w, h2) {
  var nb = h2.length, maxV = Math.max.apply(null, h2) / 2, ymax = Math.max(5, Math.ceil(maxV));
  var L = 46, R = 18, Tp = 16, B = 42, W = 380, H = 240, pw = W - L - R, ph = H - Tp - B;
  var sx = pw / (nb + 1.4), sy = (ph - 10) / ymax, y0 = H - B;
  var g = '', i;
  for (i = 1; i <= ymax; i++) {
    var yy = (y0 - i * sy).toFixed(1);
    g += '<line x1="' + L + '" y1="' + yy + '" x2="' + (L + (nb + 1) * sx).toFixed(1) + '" y2="' + yy + '" stroke="#ece6fb" stroke-width="1"/>';
    g += '<line x1="' + (L - 4) + '" y1="' + yy + '" x2="' + L + '" y2="' + yy + '" stroke="#333" stroke-width="1"/>';
    g += '<text x="' + (L - 7) + '" y="' + (+yy + 3.5) + '" font-size="10" text-anchor="end" fill="#333">' + i + '</text>';
  }
  for (i = 0; i < nb; i++) {
    var hh = h2[i] / 2 * sy;
    g += '<rect x="' + (L + i * sx).toFixed(1) + '" y="' + (y0 - hh).toFixed(1) + '" width="' + sx.toFixed(1) + '" height="' + hh.toFixed(1)
      + '" fill="#e6ddfa" stroke="#5a32d6" stroke-width="1.3"/>';
  }
  for (i = 0; i <= nb + 1; i++) {
    var xx = (L + i * sx).toFixed(1);
    g += '<line x1="' + xx + '" y1="' + y0 + '" x2="' + xx + '" y2="' + (y0 + 4) + '" stroke="#333" stroke-width="1"/>';
    g += '<text x="' + xx + '" y="' + (y0 + 15) + '" font-size="10" text-anchor="middle" fill="#333">' + (x0 + i * w) + '</text>';
  }
  var xe = L + (nb + 1.3) * sx;
  g += '<line x1="' + L + '" y1="' + y0 + '" x2="' + xe.toFixed(1) + '" y2="' + y0 + '" stroke="#333" stroke-width="1.3"/>';
  g += '<polygon points="' + (xe + 6).toFixed(1) + ',' + y0 + ' ' + xe.toFixed(1) + ',' + (y0 - 3) + ' ' + xe.toFixed(1) + ',' + (y0 + 3) + '" fill="#333"/>';
  g += '<line x1="' + L + '" y1="' + y0 + '" x2="' + L + '" y2="' + (Tp - 2) + '" stroke="#333" stroke-width="1.3"/>';
  g += '<polygon points="' + L + ',' + (Tp - 8) + ' ' + (L - 3) + ',' + (Tp - 2) + ' ' + (L + 3) + ',' + (Tp - 2) + '" fill="#333"/>';
  g += '<text x="' + (L + pw / 2).toFixed(1) + '" y="' + (H - 8) + '" font-size="11" text-anchor="middle" fill="#333">масс (граммаар)</text>';
  g += '<text x="14" y="' + (Tp + ph / 2).toFixed(1) + '" font-size="11" text-anchor="middle" fill="#333" transform="rotate(-90 14 '
    + (Tp + ph / 2).toFixed(1) + ')">Давтамжийн нягт</text>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="360">' + g + '</svg>';
}

// [№1 №10] Гистограммаас моод бүлгийг олох
function g_e11v1p10() {

      + '<tr><td style="padding:2px 10px;border-right:2px solid #5a32d6;border-bottom:1px solid #d9d2ee;text-align:right;color:#5a32d6">Иш</td>'
      + '<td style="padding:2px 10px;border-bottom:1px solid #d9d2ee;color:#5a32d6">Навч</td></tr>' + rows + '</table>';
    var ex = so[0];
    fig += '<div style="text-align:left;margin:4px 0 0 8px;line-height:1.6">а. Өгөгдлүүдийг иш-навчны диаграмм дээр дүрсэл.<br>б. Моод, медиан, далайцыг ол.</div>';
    return {
      q: '8-р ангийн 18 сурагчийн өндрийг /м/ хэмжин тэмдэглэжээ.',
      fig: fig,
      a: x10_sol([
        'Өсөхөөр эрэмбэлбэл: ' + so.map(e11v1_m).join(', '),
        'а) Иш — метр ба аравтын орон, навч — зуутын орон (ж: ' + Math.floor(ex / 100) + '.' + (Math.floor(ex / 10) % 10) + ' | ' + (ex % 10) + ' нь ' + e11v1_m(ex) + ' м):' + tbl,
        'б) Моод: хамгийн олон ($' + cm + '$ удаа) давтагдсан утга $' + e11v1_m(vm) + '$ м',
        'Медиан: $n=18$ тэгш тул $M_e=\\dfrac{x_9+x_{10}}{2}=\\dfrac{' + e11v1_m(so[8]) + '+' + e11v1_m(so[9]) + '}{2}=' + med + '$ м',
        'Далайц: $R=x_{max}-x_{min}=' + e11v1_m(so[17]) + '-' + e11v1_m(so[0]) + '=' + e11v1_m(rg) + '$ м'
      ], 'моод $' + e11v1_m(vm) + '$ м, медиан $' + med + '$ м, далайц $' + e11v1_m(rg) + '$ м'),
      key: 'p20_' + so.join('.')
    };
  }
  return null;
}
var WSPEC={"title":"Жишиг даалгавар-1","sub":"ХУВИЛБАР №1 · Жишиг даалгавар · 11-р анги","rule":"<b>Санамж:</b> Эх функц $\\int x^n\\,dx=\\dfrac{x^{n+1}}{n+1}+C$, Ньютон–Лейбниц $\\int_a^b f(x)\\,dx=F(b)-F(a)$. Бином $T_{k+1}=C_n^k a^{n-k}b^k$. Геометр прогресс $S_n=\\dfrac{b_1(1-q^n)}{1-q}$. Нормаль $y-y_0=-\\dfrac{1}{f'(x_0)}(x-x_0)$. $\\sin x=a$ бол $x=(-1)^k\\arcsin a+\\pi k$, $\\cos x=a$ бол $x=\\pm\\arccos a+2\\pi k$, $k\\in\\mathbb{Z}$.","ref":"<style>#answers h2{font-size:15.5px}#answers .ans-grid{gap:7px;font-size:12px}#answers .ans-grid .a{padding:6px 10px 7px;background:#fbfaff;border:1px solid #ece6fb;border-radius:9px;border-bottom:1px solid #ece6fb;break-inside:avoid;page-break-inside:avoid}#answers .ans-grid .an{display:inline-block;min-width:26px;color:#5a32d6}</style>","tasks":[{"label":"Тэнцэтгэл бишийг бод.","fn":"g_e11v1p1","cap":1,"cols":1,"wk":18,"solo":true},{"label":"Тоонуудыг ол.","fn":"g_e11v1p2","cap":1,"cols":1,"wk":18,"solo":true},{"label":"Эх функцийг ол.","fn":"g_e11v1p3","cap":1,"cols":1,"wk":18,"solo":true},{"label":"Системийг бод.","fn":"g_e11v1p4","cap":1,"cols":1,"wk":26,"solo":true},{"label":"Нийлбэрийг ол.","fn":"g_e11v1p5","cap":1,"cols":1,"wk":20,"solo":true},{"label":"Коэффициентийг ол.","fn":"g_e11v1p6","cap":1,"cols":1,"wk":24,"solo":true},{"label":"Илэрхийллийг хялбарчил.","fn":"g_e11v1p7","cap":1,"cols":1,"wk":18,"solo":true},{"label":"Тэгшитгэлийг бод.","fn":"g_e11v1p8","cap":1,"cols":1,"wk":20,"solo":true},{"label":"Параметрийг ол.","fn":"g_e11v1p9","cap":1,"cols":1,"wk":18,"solo":true},{"label":"Моод бүлгийг ол.","fn":"g_e11v1p10","cap":1,"cols":1,"wk":24,"solo":true},{"label":"Зайг ол.","fn":"g_e11v1p11","cap":1,"cols":1,"wk":18,"solo":true},{"label":"Огтлолцлын цэгийг ол.","fn":"g_e11v1p12","cap":1,"cols":1,"wk":24,"solo":true},{"label":"Урвуу функцийг ол.","fn":"g_e11v1p13","cap":1,"cols":1,"wk":24,"solo":true},{"label":"Нормалийн тэгшитгэлийг бич.","fn":"g_e11v1p14","cap":1,"cols":1,"wk":26,"solo":true},{"label":"Э function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);var solo=blocks[g].getAttribute('data-solo')==='1';if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(solo&&qs2.length===1){if(ql)ql.textContent='';map[qs2[i].getAttribute('data-k')]=gr+')';}else{if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk, solo:t.solo};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.solo?' data-solo="1"':'')+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p||t.solo){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.solo?null:t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
