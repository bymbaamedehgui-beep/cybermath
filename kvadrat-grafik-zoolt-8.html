<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат график зөөлтийн аргаар — 10-р анги</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:6px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 28px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px}
  .rule b{color:#7a4f00}
  .grp{margin-top:8px}
  .gh{font-weight:800;color:#5a32d6;font-size:12.5px;margin:8px 0 2px;display:flex;align-items:center;gap:7px}
  .gh .tag{background:#efeaff;color:#5a32d6;border-radius:6px;font-size:10.5px;padding:1px 7px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:4px}
  .qh{display:flex;gap:6px;align-items:baseline;margin-bottom:3px}.qn{font-weight:800;color:var(--purple)}.qm{font-size:14px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:8px}
  .sol{break-inside:avoid;page-break-inside:avoid;display:flex;gap:10px;align-items:flex-start;padding:7px 9px;margin-bottom:8px;border:1px solid #eee;border-left:3px solid var(--purple);border-radius:8px;font-size:12px}
  .sol .sn{font-weight:800;color:var(--purple)}
  .sol .fin{color:var(--green);font-weight:700}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sgn(v,sym){ // "+ 3", "- 3x" хэлбэрийн нэмэлт гишүүн
  if(v===0)return '';
  var a=Math.abs(v),body=(sym==='')?(''+a):((a===1?'':a)+sym);
  return (v<0?' - ':' + ')+body;
}

/* ---------- координатын тор (SVG) ---------- */
function svgGraph(h,k,draw){
  var xmin=-6,xmax=6,ymin=-4,ymax=9,UN=11;
  var W=(xmax-xmin)*UN,H=(ymax-ymin)*UN;
  function PX(x){return ((x-xmin)*UN).toFixed(1);}
  function PY(y){return ((ymax-y)*UN).toFixed(1);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:'+W+'px">';
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff" stroke="#d9d2f0"/>';
  for(var gx=xmin;gx<=xmax;gx++){var X=PX(gx);s+='<line x1="'+X+'" y1="0" x2="'+X+'" y2="'+H+'" stroke="'+(gx===0?'#8f83c9':'#eee7fb')+'" stroke-width="'+(gx===0?1.2:1)+'"/>';}
  for(var gy=ymin;gy<=ymax;gy++){var Y=PY(gy);s+='<line x1="0" y1="'+Y+'" x2="'+W+'" y2="'+Y+'" stroke="'+(gy===0?'#8f83c9':'#eee7fb')+'" stroke-width="'+(gy===0?1.2:1)+'"/>';}
  for(var gx2=xmin+2;gx2<xmax;gx2+=2){if(gx2===0)continue;s+='<text x="'+PX(gx2)+'" y="'+(+PY(0)+9)+'" font-size="6" fill="#9a92b5" text-anchor="middle">'+gx2+'</text>';}
  for(var gy2=ymin+2;gy2<ymax;gy2+=2){if(gy2===0)continue;s+='<text x="'+(+PX(0)-3)+'" y="'+(+PY(gy2)+2)+'" font-size="6" fill="#9a92b5" text-anchor="end">'+gy2+'</text>';}
  s+='<text x="'+(W-6)+'" y="'+(+PY(0)-3)+'" font-size="7" fill="#6b5fb0">x</text>';
  s+='<text x="'+(+PX(0)+3)+'" y="9" font-size="7" fill="#6b5fb0">y</text>';
  if(draw){
    var pts='';
    for(var x=xmin;x<=xmax+0.001;x+=0.2){var y=(x-h)*(x-h)+k;if(y<ymin-0.4||y>ymax+0.4)continue;pts+=PX(x)+','+PY(y)+' ';}
    s+='<polyline points="'+pts+'" fill="none" stroke="#7B52EE" stroke-width="2"/>';
    s+='<circle cx="'+PX(h)+'" cy="'+PY(k)+'" r="2.4" fill="#e11d48"/>';
    s+='<text x="'+(+PX(h)+4)+'" y="'+(+PY(k)+(k<=0?-4:11))+'" font-size="6.5" fill="#e11d48">('+h+','+k+')</text>';
  }
  return s+'</svg>';
}

function dirText(h,k){
  var t=[];
  if(h>0)t.push('баруун '+h+' нэгж'); else if(h<0)t.push('зүүн '+(-h)+' нэгж');
  if(k>0)t.push('дээш '+k+' нэгж'); else if(k<0)t.push('доош '+(-k)+' нэгж');
  return t.join(', ');
}

/* ---------- 4 төрөл ---------- */
function tVert(){var k=nz(-3,4);
  return {func:'y = x^2'+sgn(k,''), h:0, k:k,
    sol:'Суурь $y=x^2$-ийг '+dirText(0,k)+' зөөв. Орой $(0,'+k+')$.'};}
function tHoriz(){var h=nz(-3,3);
  return {func:'y = (x'+sgn(-h,'')+')^2', h:h, k:0,
    sol:'Суурь $y=x^2$-ийг '+dirText(h,0)+' зөөв. Орой $('+h+',0)$.'};}
function tBoth(){var h=nz(-2,2),k=nz(-2,3);
  return {func:'y = (x'+sgn(-h,'')+')^2'+sgn(k,''), h:h, k:k,
    sol:'Суурь $y=x^2$-ийг '+dirText(h,k)+' зөөв. Орой $('+h+','+k+')$.'};}
function tComplete(){var h=nz(-2,2),k=rnd(-2,2),b=-2*h,c=k+h*h;
  return {func:'y = x^2'+sgn(b,'x')+sgn(c,''), h:h, k:k,
    sol:'Бүтэн квадрат ялгавал $x^2'+sgn(b,'x')+sgn(c,'')+'=(x'+sgn(-h,'')+')^2'+sgn(k,'')+'$. '
        +'Орой $('+h+','+k+')$, суурь параболыг '+dirText(h,k)+' зөөв.'};}

var TYPES=[
  {name:'Дээш · доош зөөх', note:'$y=x^2+k$: $k>0$ бол дээш, $k<0$ бол доош k нэгж. Орой $(0,k)$.', gen:tVert},
  {name:'Баруун · зүүн зөөх', note:'$y=(x-h)^2$: $h>0$ бол баруун, $h<0$ бол зүүн h нэгж. Орой $(h,0)$.', gen:tHoriz},
  {name:'Бүх тийш зөөх', note:'$y=(x-h)^2+k$: хэвтээгээр h, босоогоор k зөөв. Орой $(h,k)$.', gen:tBoth},
  {name:'Бүтэн квадрат ялгаж байгуулах', note:'$y=x^2+bx+c$-г $(x-h)^2+k$ болгож хувиргаад зөөв. Орой $(h,k)$.', gen:tComplete},
];

function build(){
  var groups='',sols='',WS=[],n=0;
  for(var t=0;t<TYPES.length;t++){
    var T=TYPES[t], qs='';
    for(var j=0;j<2;j++){
      n++; var p=T.gen();
      qs+='<div class="q"><div class="qh"><span class="qn">'+n+'.</span><span class="qm">$'+p.func+'$</span></div>'+svgGraph(p.h,p.k,false)+'</div>';
      sols+='<div class="sol"><div style="flex:1"><div><span class="sn">'+n+'.</span> $'+p.func+'$</div>'
        +'<div style="margin:3px 0">'+p.sol+'</div><div class="fin">Орой: ('+p.h+', '+p.k+')</div></div>'
        +'<div style="width:120px;flex-shrink:0">'+svgGraph(p.h,p.k,true)+'</div></div>';
      WS.push({q:'\\text{График байгуул: }'+p.func,a:'\\text{орой }('+p.h+','+p.k+')'});
    }
    groups+='<div class="grp"><div class="gh"><span class="tag">'+(t+1)+'</span>'+T.name+'</div>'
      +'<div class="rule" style="margin-bottom:6px">'+T.note+'</div><div class="grid">'+qs+'</div></div>';
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадрат график — зөөлтийн аргаар байгуулах</h1><div class="sub">10-р анги · $y=x^2$ параболыг зөөж байгуул · 4 төрөл · 8 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule"><b>Арга:</b> $y=x^2$ суурь параболыг зөөнө. $y=(x-h)^2+k$ хэлбэрийн орой нь $(h,k)$: '
    +'$h$ — хэвтээ (баруун+/зүүн−), $k$ — босоо (дээш+/доош−) зөөлт. Оройг тавьж, хажуугийн цэгүүдийг ($\\pm1{:}+1,\\ \\pm2{:}+4$) буулгаж байгуул.</div>'
    +groups
    +'<div class="ans-page" id="answers"><h2>Бодолт ба байгуулсан график</h2>'+sols+'</div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='Квадрат график зөөлтийн аргаар (10-р анги)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js"></script>
</body>
</html>
