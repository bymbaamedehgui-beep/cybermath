<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат график зөөлтийн аргаар — 10-р анги</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:6px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 28px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px}
  .rule b{color:#7a4f00}
  .grp{margin-top:8px}
  .gh{font-weight:800;color:#5a32d6;font-size:12.5px;margin:8px 0 2px;display:flex;align-items:center;gap:7px}
  .gh .tag{background:#efeaff;color:#5a32d6;border-radius:6px;font-size:10.5px;padding:1px 7px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:4px}
  .qh{display:flex;gap:6px;align-items:baseline;margin-bottom:3px}.qn{font-weight:800;color:var(--purple)}.qm{font-size:14px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:8px}
  .sol{break-inside:avoid;page-break-inside:avoid;display:flex;gap:10px;align-items:flex-start;padding:7px 9px;margin-bottom:8px;border:1px solid #eee;border-left:3px solid var(--purple);border-radius:8px;font-size:12px}
  .sol .sn{font-weight:800;color:var(--purple)}
  .sol .fin{color:var(--green);font-weight:700}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(arr){return arr[rnd(0,arr.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function sgn(v,sym){ // "+ 3", "- 3x" хэлбэрийн нэмэлт гишүүн
  if(v===0)return '';
  var a=Math.abs(v),body=(sym==='')?(''+a):((a===1?'':a)+sym);
  return (v<0?' - ':' + ')+body;
}

/* ---------- координатын хүрээг график бүрт тааруулах ---------- */
function computeRange(a,h,k){
  var aa=Math.abs(a);
  var Rx=Math.max(2,Math.min(5,Math.round(Math.sqrt(8/aa)))); // хажуу тийш алхам (мөчрийн өндөр ~8)
  var arm=k+a*Rx*Rx;                                          // мөчрийн өндөр
  var xmin=Math.min(h-Rx,0), xmax=Math.max(h+Rx,0);
  var ymin,ymax;
  if(a>0){ ymin=Math.min(k,0)-1; ymax=Math.max(arm,0)+1; }
  else   { ymax=Math.max(k,0)+1; ymin=Math.min(arm,0)-1; }
  ymin=Math.floor(ymin); ymax=Math.ceil(ymax);
  // хэвтээг босоотой ойролцоо болгож дөрвөлжиндүүлэн, зурахад тохиромжтой болгоно
  var xspan=xmax-xmin, yspan=ymax-ymin;
  if(xspan < yspan-2){ var p=Math.ceil((yspan-2-xspan)/2); xmin-=p; xmax+=p; }
  return {xmin:xmin,xmax:xmax,ymin:ymin,ymax:ymax};
}

/* ---------- координатын тор (SVG) — хүрээ нь график бүрээс хамаарна ---------- */
function svgGraph(a,h,k,draw){
  var R=computeRange(a,h,k), xmin=R.xmin,xmax=R.xmax,ymin=R.ymin,ymax=R.ymax;
  var xspan=xmax-xmin, yspan=ymax-ymin;
  var UN=Math.max(8,Math.min(15,Math.round(150/Math.max(xspan,yspan)))); // нэгжийн px, дөрвөлжин
  var W=xspan*UN,H=yspan*UN;
  var lstep=(Math.max(xspan,yspan)>10)?2:1;                    // тэнхлэгийн тоон алхам
  function PX(x){return ((x-xmin)*UN).toFixed(1);}
  function PY(y){return ((ymax-y)*UN).toFixed(1);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:'+W+'px">';
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff" stroke="#d9d2f0"/>';
  for(var gx=xmin;gx<=xmax;gx++){var X=PX(gx);s+='<line x1="'+X+'" y1="0" x2="'+X+'" y2="'+H+'" stroke="'+(gx===0?'#8f83c9':'#eee7fb')+'" stroke-width="'+(gx===0?1.2:1)+'"/>';}
  for(var gy=ymin;gy<=ymax;gy++){var Y=PY(gy);s+='<line x1="0" y1="'+Y+'" x2="'+W+'" y2="'+Y+'" stroke="'+(gy===0?'#8f83c9':'#eee7fb')+'" stroke-width="'+(gy===0?1.2:1)+'"/>';}
  for(var lx=xmin;lx<=xmax;lx++){if(lx===0||(lx%lstep)!==0)continue;s+='<text x="'+PX(lx)+'" y="'+(+PY(0)+9)+'" font-size="6" fill="#9a92b5" text-anchor="middle">'+lx+'</text>';}
  for(var ly=ymin;ly<=ymax;ly++){if(ly===0||(ly%lstep)!==0)continue;s+='<text x="'+(+PX(0)-3)+'" y="'+(+PY(ly)+2)+'" font-size="6" fill="#9a92b5" text-anchor="end">'+ly+'</text>';}
  s+='<text x="'+(W-6)+'" y="'+(+PY(0)-3)+'" font-size="7" fill="#6b5fb0">x</text>';
  s+='<text x="'+(+PX(0)+3)+'" y="9" font-size="7" fill="#6b5fb0">y</text>';
  if(draw){
    var pts='';
    for(var x=xmin;x<=xmax+0.001;x+=0.1){var y=a*(x-h)*(x-h)+k;if(y<ymin-0.3||y>ymax+0.3)continue;pts+=PX(x)+','+PY(y)+' ';}
    s+='<polyline points="'+pts+'" fill="none" stroke="#7B52EE" stroke-width="2"/>';
    s+='<circle cx="'+PX(h)+'" cy="'+PY(k)+'" r="2.4" fill="#e11d48"/>';
    var off=(a>0)?((k-ymin)<2?12:-4):((ymax-k)<2?-4:12);
    s+='<text x="'+(+PX(h)+4)+'" y="'+(+PY(k)+off)+'" font-size="6.5" fill="#e11d48">('+h+','+k+')</text>';
  }
  return s+'</svg>';
}

function dirText(h,k){
  var t=[];
  if(h>0)t.push('баруун '+h+' нэгж'); else if(h<0)t.push('зүүн '+(-h)+' нэгж');
  if(k>0)t.push('дээш '+k+' нэгж'); else if(k<0)t.push('доош '+(-k)+' нэгж');
  return t.join(', ');
}

/* ---------- тэргүүлэх коэффициент a ---------- */
var A_SET=[[1,1],[-1,1],[2,1],[-2,1],[1,2],[-1,2]];
var A_CS =[[1,1],[-1,1],[2,1],[-2,1],[1,2],[-1,2]];
function aTexMul(a){var n=a[0],d=a[1];if(d===1){if(n===1)return '';if(n===-1)return '-';return ''+n;}return (n<0?'-':'')+'\\frac{'+Math.abs(n)+'}{'+d+'}';}
function aTex(a){var n=a[0],d=a[1];if(d===1)return ''+n;return (n<0?'-':'')+'\\frac{'+Math.abs(n)+'}{'+d+'}';}
function aVal(a){return a[0]/a[1];}
function aEffect(a){var v=aVal(a);var dir=v<0?'доош нээлттэй (толилуулсан)':'дээш нээлттэй';var w=Math.abs(v)>1?'нарийссан':(Math.abs(v)<1?'өргөссөн':'$y=x^2$-тэй ижил өргөн');return dir+', '+w;}

/* ---------- 4 төрөл ---------- */
function tVert(){var a=pick(A_SET),k=nz(-3,4);
  return {a:a,av:aVal(a),func:'y = '+aTexMul(a)+'x^2'+sgn(k,''), h:0, k:k,
    sol:'$y=x^2$ суурь. $a='+aTex(a)+'$ тул '+aEffect(a)+'. Дараа нь '+dirText(0,k)+' зөөв. Орой $(0,'+k+')$.'};}
function tHoriz(){var a=pick(A_SET),h=nz(-3,3);
  return {a:a,av:aVal(a),func:'y = '+aTexMul(a)+'(x'+sgn(-h,'')+')^2', h:h, k:0,
    sol:'$a='+aTex(a)+'$ тул '+aEffect(a)+'. '+dirText(h,0)+' зөөв. Орой $('+h+',0)$.'};}
function tBoth(){var a=pick(A_SET),h=nz(-2,2),k=nz(-2,3);
  return {a:a,av:aVal(a),func:'y = '+aTexMul(a)+'(x'+sgn(-h,'')+')^2'+sgn(k,''), h:h, k:k,
    sol:'$a='+aTex(a)+'$ тул '+aEffect(a)+'. '+dirText(h,k)+' зөөв. Орой $('+h+','+k+')$.'};}
function tComplete(){var a=pick(A_CS),n=a[0],d=a[1],m=nz(-1,1),h=d*m,k=rnd(-2,2),b=-2*n*m,c=n*d+k;
  return {a:a,av:aVal(a),func:'y = '+aTexMul(a)+'x^2'+sgn(b,'x')+sgn(c,''), h:h, k:k,
    sol:'Бүтэн квадрат ялгавал $'+aTexMul(a)+'x^2'+sgn(b,'x')+sgn(c,'')+'='+aTexMul(a)+'(x'+sgn(-h,'')+')^2'+sgn(k,'')+'$. '
        +'Орой $('+h+','+k+')$, '+aEffect(a)+', '+dirText(h,k)+' зөөв.'};}

var TYPES=[
  {name:'Дээш · доош зөөх', note:'$y=ax^2+k$: $k>0$ дээш, $k<0$ доош. $a$ нээлт/өргөнийг өөрчилнө. Орой $(0,k)$.', gen:tVert},
  {name:'Баруун · зүүн зөөх', note:'$y=a(x-h)^2$: $h>0$ баруун, $h<0$ зүүн. Орой $(h,0)$.', gen:tHoriz},
  {name:'Бүх тийш зөөх', note:'$y=a(x-h)^2+k$: хэвтээгээр h, босоогоор k зөөв. Орой $(h,k)$.', gen:tBoth},
  {name:'Бүтэн квадрат ялгаж байгуулах', note:'$y=ax^2+bx+c$-г $a(x-h)^2+k$ болгож хувиргаад зөөв. Орой $(h,k)$.', gen:tComplete},
];

function build(){
  var groups='',sols='',WS=[],n=0;
  for(var t=0;t<TYPES.length;t++){
    var T=TYPES[t], qs='';
    for(var j=0;j<2;j++){
      n++; var p=T.gen();
      qs+='<div class="q"><div class="qh"><span class="qn">'+n+'.</span><span class="qm">$'+p.func+'$</span></div>'+svgGraph(p.av,p.h,p.k,false)+'</div>';
      sols+='<div class="sol"><div style="flex:1"><div><span class="sn">'+n+'.</span> $'+p.func+'$</div>'
        +'<div style="margin:3px 0">'+p.sol+'</div><div class="fin">Орой: ('+p.h+', '+p.k+')</div></div>'
        +'<div style="width:120px;flex-shrink:0">'+svgGraph(p.av,p.h,p.k,true)+'</div></div>';
      WS.push({q:'\\text{График байгуул: }'+p.func,a:'\\text{орой }('+p.h+','+p.k+')'});
    }
    groups+='<div class="grp"><div class="gh"><span class="tag">'+(t+1)+'</span>'+T.name+'</div>'
      +'<div class="rule" style="margin-bottom:6px">'+T.note+'</div><div class="grid">'+qs+'</div></div>';
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадрат график — зөөлтийн аргаар байгуулах</h1><div class="sub">10-р анги · $y=a(x-h)^2+k$ параболыг зөөж байгуул · $a=\\pm1,\\pm2,\\tfrac12,\\dots$ · 4 төрөл · 8 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule"><b>Арга:</b> $y=a(x-h)^2+k$ хэлбэрийн орой нь $(h,k)$: $h$ — хэвтээ (баруун+/зүүн−), $k$ — босоо (дээш+/доош−) зөөлт. '
    +'<b>$a$</b> нь нээлт ба өргөнийг тодорхойлно: $a>0$ дээш, $a<0$ доош нээлттэй; $|a|>1$ нарийн, $|a|<1$ өргөн. '
    +'Оройгоос хажуу тийш $\\pm1$ алхахад $a$, $\\pm2$ алхахад $4a$ өндөр өөрчлөгдөнө.</div>'
    +groups
    +'<div class="ans-page" id="answers"><h2>Бодолт ба байгуулсан график</h2>'+sols+'</div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='Квадрат график зөөлтийн аргаар (10-р анги)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=17"></script>
</body>
</html>
