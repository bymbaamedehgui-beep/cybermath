/* 3.8 */
var e3_8 = (function () {
// 8. Олон гишүүнт = x-ийн сөрөг биш бүхэл зэргүүдийн тогтмол коэффициенттэй нийлбэр (коэффициент нь аравтын,

/* 2.3 */

/* 3.9 */

// 9. p(x) − q(x), p(x) + q(x), 2p(x) − q(x): ижил зэргийн гишүүдийн коэффициентүүдийг нэмж/хасна.
