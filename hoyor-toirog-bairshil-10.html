<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Хоёр тойргийн харилцан байршил (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:10px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
  .dcard{break-inside:avoid;page-break-inside:avoid;border:1px solid #eee7fb;border-radius:9px;padding:6px 7px;background:linear-gradient(#fff,#fcfbff)}
  .dcard .dq{font-size:10.5px;margin-bottom:2px;min-height:15px}.dcard .dq b{color:var(--purple)}
  .dsvg{width:100%;height:auto;display:block}
  .aline{margin-top:3px;font-size:10.5px;color:var(--soft);text-align:center}.aline b{color:var(--ink);border-bottom:1px solid #cdbff0;padding:0 8px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function seg(a,b,col,w,dash){return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+col+'" stroke-width="'+(w||1.4)+'"'+(dash?' stroke-dasharray="3 2"':'')+'/>';}
function dot(p,col){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="1.6" fill="'+(col||'#4a4470')+'"/>';}
function txt(p,s,col,dx,dy){return '<text x="'+(p[0]+(dx||0)).toFixed(1)+'" y="'+(p[1]+(dy||0)+2).toFixed(1)+'" font-size="8.5" fill="'+(col||'#1a1030')+'" text-anchor="middle" font-weight="700">'+s+'</text>';}
function draw2C(r1,r2,d){var th=Math.random()*2*Math.PI,c=[d/2,0];
  function rp(p){var dx=p[0]-c[0],dy=p[1]-c[1],ct=Math.cos(th),st=Math.sin(th);return [c[0]+dx*ct-dy*st,c[1]+dx*st+dy*ct];}
  var O1=[0,0],O2=[d,0],perp=rp([c[0],c[1]+1]),pc=rp(c),pv=[perp[0]-pc[0],perp[1]-pc[1]];
  var O1r=rp(O1),O2r=rp(O2),E1=[O1r[0]+pv[0]*r1,O1r[1]+pv[1]*r1],E2=[O2r[0]+pv[0]*r2,O2r[1]+pv[1]*r2];
  var xs=[O1r[0]-r1,O1r[0]+r1,O2r[0]-r2,O2r[0]+r2],ys=[O1r[1]-r1,O1r[1]+r1,O2r[1]-r2,O2r[1]+r2];
  var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys),W=maxx-minx,H=maxy-miny,S=130,pad=13,sc=Math.min((S-2*pad)/W,(S-2*pad)/H),ex=(S-2*pad-W*sc)/2,ey=(S-2*pad-H*sc)/2;
  function M(p){return [pad+ex+(p[0]-minx)*sc,S-pad-ey-(p[1]-miny)*sc];}
  var A=M(O1r),B=M(O2r),Ea=M(E1),Eb=M(E2);
  var g='<circle cx="'+A[0].toFixed(1)+'" cy="'+A[1].toFixed(1)+'" r="'+(r1*sc).toFixed(1)+'" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.4"/>';
  g+='<circle cx="'+B[0].toFixed(1)+'" cy="'+B[1].toFixed(1)+'" r="'+(r2*sc).toFixed(1)+'" fill="rgba(224,86,45,0.05)" stroke="#e0562d" stroke-width="1.4"/>';
  if(d>0.01)g+=seg(A,B,'#16a34a',1.2);
  g+=seg(A,Ea,'#2563eb',1)+seg(B,Eb,'#e0562d',1)+dot(A,'#2563eb')+dot(B,'#e0562d');
  g+=txt(A,'O₁','#2563eb',(A[0]<B[0]?-6:6),4)+txt(B,'O₂','#e0562d',(B[0]<A[0]?-6:6),4);
  g+=txt([(A[0]+Ea[0])/2,(A[1]+Ea[1])/2],''+r1,'#2563eb',5,0)+txt([(B[0]+Eb[0])/2,(B[1]+Eb[1])/2],''+r2,'#e0562d',5,0);
  if(d>0.01)g+=txt([(A[0]+B[0])/2,(A[1]+B[1])/2],''+d,'#0f7a34',0,-3);
  return '<svg class="dsvg" viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';}
var CASES=[
 {n:'Огтлолцоогүй',mk:function(){var r1=rnd(3,6),r2=rnd(2,5),d=r1+r2+rnd(2,5);return [r1,r2,d];}},
 {n:'Гадаад шүргэлттэй',mk:function(){var r1=rnd(3,6),r2=rnd(2,5);return [r1,r2,r1+r2];}},
 {n:'Огтлолцсон',mk:function(){var r1=rnd(4,7),r2=rnd(3,6),lo=Math.abs(r1-r2),hi=r1+r2,d=rnd(lo+1,hi-1);return [r1,r2,d];}},
 {n:'Дотоод шүргэлттэй',mk:function(){var r1=rnd(5,8),r2=rnd(2,r1-2);return [r1,r2,r1-r2];}},
 {n:'Нэг нь нөгөөгийн дотор',mk:function(){var r1=rnd(6,9),r2=rnd(2,r1-3),d=rnd(1,r1-r2-1);return [r1,r2,d];}},
 {n:'Ерөнхий төвтэй',mk:function(){var r1=rnd(5,8),r2=rnd(2,r1-2);return [r1,r2,0];}}
];
function gPos(){var cs=pick(CASES),v=cs.mk();
  return {svg:draw2C(v[0],v[1],v[2]),q:'$r_1='+v[0]+',\\ r_2='+v[1]+',\\ d='+v[2]+'$. Харилцан байршил нь?',a:cs.n,key:'p'+v[0]+'-'+v[1]+'-'+v[2],ok:true};}
function build(){
  var seen={},K=0;window.__A=[];
  function fillD(fn,n){var arr=[],tr=0;while(arr.length<n&&tr++<600){var f=fn();if(!f||seen[f.key])continue;seen[f.key]=1;arr.push(f);}return arr;}
  var all=fillD(gPos,9);
  function card(f){var k=K++;window.__A.push({k:k,a:f.a});return '<div class="dcard"><div class="dq"><b>'+(k+1)+'.</b> '+f.q+'</div>'+f.svg+'<div class="aline">Байршил: <b>&nbsp;</b></div></div>';}
  var b=all.map(card).join('');
  var ans='<div class="ans-grid">'+window.__A.map(function(a){return '<div class="a"><span class="an">'+(a.k+1)+'.</span><span>'+a.a+'</span></div>';}).join('')+'</div>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Хоёр тойргийн харилцан байршил</h1><div class="sub">Радиусууд $r_1, r_2$ ба төвүүдийн зай $d$-ээр байршлыг тодорхойлох · 7.4 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$d\\gt r_1+r_2$ огтлолцоогүй · $d=r_1+r_2$ гадаад шүргэлт · $|r_1-r_2|\\lt d\\lt r_1+r_2$ огтлолцсон · $d=|r_1-r_2|$ дотоод шүргэлт · $d\\lt|r_1-r_2|$ дотор орших · $d=0$ ерөнхий төвтэй.</div>'
    +'<div class="task">Зураг ба өгөгдлийг ашиглан хоёр тойргийн харилцан байршлыг тодорхойл.</div><div class="dgrid">'+b+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2>'+ans+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Хоёр тойргийн харилцан байршил (10-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=37"></script>
</body>
</html>
