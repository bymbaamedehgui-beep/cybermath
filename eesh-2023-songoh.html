<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЭЕШ 2023 — Сонгох даалгавар</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem;cursor:pointer}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}
  .e23-sub{font-size:11px;color:var(--soft);margin-top:2px}
  .e23-ver{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:800;color:#5a32d6;border:1.3px solid #d9cff5;border-radius:999px;padding:1px 11px;letter-spacing:.3px}
  .meta{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .e23-fbox{border:1px solid #e6ddfa;border-radius:9px;padding:7px 12px 8px;margin-bottom:9px;font-size:11.5px;line-height:1.55}
  .e23-fbox .e23-ft{font-weight:800;color:#5a32d6;text-align:center;font-size:12px;margin-bottom:3px}
  .e23-fbox ol{padding-left:20px}.e23-fbox li{margin:1px 0}
  .e23-ptab{border-collapse:collapse;margin:4px 0 3px;font-size:11px}
  .e23-ptab td{border:1px solid #cfc6ea;padding:1px 10px;text-align:center}
  .e23-note{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #c9b8f5;border-radius:8px;padding:7px 12px;margin-bottom:10px}
  .e23-note b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 4px;border-left:4px solid var(--purple2);padding-left:9px}
  .e23-q{break-inside:avoid;page-break-inside:avoid;padding:7px 0 8px;border-bottom:1px dashed #ece6fb}
  .e23-q:last-child{border-bottom:0}
  .qh{display:flex;gap:7px;align-items:baseline}
  .ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px;flex:0 0 auto}
  .qm{font-size:13px;flex:1 1 auto;min-width:0}
  .e23-pts{flex:0 0 auto;font-size:11px;color:var(--soft);font-weight:700;white-space:nowrap;margin-left:6px}
  .fig{text-align:center;margin:5px 0;max-width:100%;overflow-x:auto}
  .fig svg{max-width:100%;height:auto}
  .fig table{margin:0 auto}
  .e23-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--ow,118px)),1fr));gap:6px 12px;margin:5px 0 0 31px;font-size:13px}
  .e23-o{display:flex;gap:5px;align-items:baseline;min-width:0}
  .e23-L{font-weight:800;color:#5a32d6;flex:0 0 auto}
  .e23-ov{min-width:0}
  .e23-ov svg{max-width:100%;height:auto;vertical-align:middle}
  .e23-err{color:#dc2626;font-weight:700}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:24mm;margin:6px 0 0 31px}
  /* Хариултын хуудас (1–36 × A–E) */
  .e23-bub{margin-top:9mm;border-top:2px dashed #ddd;padding-top:6mm}
  .e23-bh{font-size:14.5px;font-weight:800;color:#5a32d6;text-align:center}
  .e23-bs{font-size:11px;color:var(--soft);text-align:center;margin:2px 0 8px}
  .e23-bm{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;font-size:11.5px;margin:0 2px 10px}
  .e23-bm span{border-bottom:1px dotted #b3a9cf;padding:0 70px 2px 4px}
  .e23-bg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px}
  .e23-bc{border:1px solid #ece6fb;border-radius:8px;padding:5px 7px}
  .e23-br{display:flex;align-items:center;gap:5px;padding:2.5px 0}
  .e23-bn{min-width:20px;text-align:right;font-weight:800;font-size:11.5px;color:#5a32d6;margin-right:2px}
  .e23-bo{width:18px;height:18px;border:1.2px solid #a99ad0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#a99ad0;line-height:1}
  /* Хариу ба бодолт */
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  #answers{display:none}
  .e23-akey{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-bottom:12px}
  .e23-akey div{border:1px solid #e6ddfa;border-radius:6px;text-align:center;font-size:12px;padding:2px 0;background:#fbfaff}
  .e23-akey b{color:#5a32d6;margin-right:3px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:7px;font-size:12px}
  .ans-grid .a{padding:6px 10px 7px;background:#fbfaff;border:1px solid #ece6fb;border-radius:9px;break-inside:avoid;page-break-inside:avoid}
  .ans-grid .an{display:inline-block;min-width:26px;color:#5a32d6;font-weight:800}
  .e23-st{margin:2px 0;padding-left:9px;border-left:2px solid #e6ddfa}
  .e23-res{margin-top:4px;font-weight:800;color:#16a34a}
  .e23-res svg{max-width:160px;height:auto;vertical-align:middle}
  /* Хуучин хувилбарын холбоосоор нээсэн үеийн сануулга (зөвхөн дэлгэцэнд) */
  .e23-stale{max-width:210mm;margin:0 auto 12px;font-size:13px;line-height:1.45;color:#7f1d1d;background:transparent;border-left:3px solid #dc2626;border-radius:8px;padding:8px 12px}
  .e23-stale[hidden]{display:none}
  /* «Ангиар хэвлэх»-ийн хариуны түлхүүр (зөвхөн хэвлэхэд гарна) */
  .e23-kt-h{font-size:15px;font-weight:800;color:#5a32d6;text-align:center}
  .e23-kt-s{font-size:11px;color:var(--soft);text-align:center;margin:2px 0 9px}
  .e23-kt-t{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
  .e23-kt-t th,.e23-kt-t td{border:1px solid #d9cff5;text-align:center;padding:2px 0;line-height:1.3}
  .e23-kt-t thead th{background:#f4f0ff;color:#5a32d6;font-weight:800;font-size:10px}
  .e23-kt-t thead{display:table-header-group}
  .e23-kt-t tbody{break-inside:avoid;page-break-inside:avoid}
  .e23-kt-t tbody:nth-of-type(even) td{background:#fbfaff}
  .e23-kt-t td.e23-kt-v{font-weight:800;color:#5a32d6;font-size:10.5px;padding:2px 4px;text-align:left;word-break:break-word}
  .e23-kt-t td.e23-kt-v span{display:block;font-weight:600;color:var(--ink);font-size:9.5px}
  .e23-kt-t td.e23-kt-L{font-weight:800;font-size:11.5px}
  .e23-kt-t col.e23-kt-c0{width:8mm}.e23-kt-t col.e23-kt-c1{width:30mm}
  html.cm-p12 .sheet .e23-opts{font-size:12pt}
  html.cm-p12 .sheet .e23-pts{font-size:10pt}
  @media screen and (max-width:560px){
    .e23-opts{margin-left:6px;gap:7px 10px}
    .wk{margin-left:0}
    .e23-akey{grid-template-columns:repeat(6,minmax(0,1fr))}
    .e23-bm span{padding-right:40px}
    /* бодлогын хүснэгт (ж: №31 давтамжийн хүснэгт) утсанд дотроо гүйлгэхгүйгээр багтана */
    .fig table{font-size:12px!important}
    .fig table td,.fig table th{padding:4px 5px!important}
  }
  @media print{
    body{background:#fff;padding:0}.bar,.e23-stale{display:none!important}
    .sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}
    @page{size:A4;margin:11mm}
    /* Олон хуудастай шалгалт: ws-store-ийн нэг хуудсанд шахах zoom-ыг цуцална (текст жижгэрэхгүй) */
    #sheet,.sheet{zoom:1!important}
    .qm,.e23-opts{font-size:11pt}
    .e23-bub{break-before:page;border-top:0;margin-top:0;padding-top:0}
    .ans-page{break-before:page;border-top:0;margin-top:0;padding-top:0}
    .e23-q{border-bottom-color:#f1edfb}
  }
  /* KaTeX язгуурын тэмдгийн SVG-г дээрх svg хэмжээний дүрмээс хамгаална */
  .katex svg{max-width:none!important;height:inherit!important}
</style>
</head>

<div class="bar">
  <button class="btn refresh" onclick="build()" title="Шинэ хувилбар үүсгэх"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ хувилбар</button>

<!-- Эх шалгалтын томьёоны хуудас (Даалгаварт хэрэглэгдэх зарим томьёо) -->
<template id="e23-ftpl"><div class="e23-fbox"><div class="e23-ft">Даалгаварт хэрэглэгдэх зарим томьёо</div><ol>
<li>$\begin{pmatrix}a&amp;b\\c&amp;d\end{pmatrix}$ матрицын тодорхойлогч $\begin{vmatrix}a&amp;b\\c&amp;d\end{vmatrix}=ad-bc$ байна.</li>
<li>$(p,\,q)$ цэгт оройтой параболын тэгшитгэл: $y=a(x-p)^2+q$</li>
<li>Конусын эзлэхүүн: $V=\dfrac{1}{3}\cdot S_{\text{суурь}}\cdot h$</li>
<li>Өгөгдлийн дисперс: $D(X)=\dfrac{\sum(x-\bar{x})^2}{n}$. Энд $\bar{x}=\dfrac{\sum x}{n}$</li>
<li>Математик дундаж: $X$ дискрет санамсаргүй хувьсагчийн магадлалын тархалт нь
<table class="e23-ptab"><tr><td>$x$</td><td>$x_1$</td><td>$x_2$</td><td>$\ldots$</td><td>$x_n$</td></tr><tr><td>$P(X=x)$</td><td>$p_1$</td><td>$p_2$</td><td>$\ldots$</td><td>$p_n$</td></tr></table>
бол математик дундаж $E(X)=x_1\cdot p_1+x_2\cdot p_2+\ldots+x_n\cdot p_n$ байна. $p_1+p_2+\ldots+p_n=1$</li>
</ol></div></template>
<script>
// ЭЕШ ажлын хуудсын НИЙТЛЭГ туслахууд (jishig-daalgavar-1-11.html-ээс). Генераторууд эдгээрийг ашиглана — ДАХИН БҮҮ ТОДОРХОЙЛ.
// ══════════ g10core.js — 10-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}
function fMix(a){if(a.d===1)return ''+a.n;var neg=a.n<0,N=Math.abs(a.n),w=Math.floor(N/a.d),r=N%a.d;if(w===0)return (neg?'-':'')+'\\dfrac{'+r+'}{'+a.d+'}';if(r===0)return (neg?'-':'')+w;return (neg?'-':'')+w+'\\dfrac{'+r+'}{'+a.d+'}';}
function pFr(a){var t=fMix(a);return a.n<0?'\\left('+t+'\\right)':t;}
function frTeX(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(n,d);n/=g;d/=g;if(d===1)return ''+n;if(n<0)return '-\\dfrac{'+(-n)+'}{'+d+'}';return '\\dfrac{'+n+'}{'+d+'}';}
// ── Аравтын бутархай (урт хуваалт, үет илрүүлэх) ──
function longDiv(n,d){var ip=Math.floor(n/d),rem=n%d,digits=[],seen={},idx=0,pStart=-1;
 while(rem!==0){if(seen[rem]!==undefined){pStart=seen[rem];break;}seen[rem]=idx;rem*=10;digits.push(Math.floor(rem/d));rem%=d;idx++;if(idx>40)break;}
 return {ip:ip,digits:digits,pStart:pStart};}
function decLatex(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;

 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+'('+rep+')';}
function decPlain(fr){var neg=fr.n<0,r=longDiv(Math.abs(fr.n),fr.d),s=(neg?'-':'');
 if(r.digits.length===0)return s+r.ip;
 if(r.pStart<0)return s+r.ip+'.'+r.digits.join('');
 var nonrep=r.digits.slice(0,r.pStart).join(''),rep=r.digits.slice(r.pStart).join('');
 return s+r.ip+'.'+nonrep+rep+rep+'…';}
function repToFr(ip,nonrep,rep){var p=nonrep.length,q=rep.length;var Aint=nonrep===''?0:parseInt(nonrep,10);var ABint=parseInt((nonrep+rep)||'0',10);
 var den=(Math.pow(10,q)-1)*Math.pow(10,p);var num=ABint-Aint;var frac=Fr(num,den);var whole=Fr(ip,1);return fAdd(whole,frac);}
// ── Тоймлол ──
function roundPlace(n,place){return Math.round(n/place)*place;}
function roundDec(x,step){return Math.round(x/step)*step;}
function fmtDec(x,dec){return x.toFixed(dec);}
function sigRound(x,k){if(x===0)return {v:0,dec:0};var d=Math.floor(Math.log10(Math.abs(x)))+1;var p=k-d;var mag=Math.pow(10,p);var v=Math.round(x*mag)/mag;return {v:v,dec:Math.max(0,p)};}
// ── Зэрэг форматлах ──
function powClean(b,e){if(e===1)return ''+b;if(e===0)return '1';return b+'^{'+e+'}';}
function powTex(bTex,e){if(e===1)return bTex;if(e===0)return '1';return bTex+'^{'+e+'}';}
// ── Аравтын тоог хамгийн энгийн хэлбэрээр (0.50→0.5) ──
function trimZeros(s){if(s.indexOf('.')<0)return s;s=s.replace(/0+$/,'');if(s.charAt(s.length-1)==='.')s=s.slice(0,-1);return s;}
function decStr(x,maxdec){var s=x.toFixed(maxdec||6);return trimZeros(s);}
// ── 2D координатын зураг ──
function plane(opts){opts=opts||{};var W=200,H=200,pad=16,R=opts.xr||5,cx=W/2,cy=H/2,u=(W-2*pad)/(2*R);
 function X(x){return (cx+x*u).toFixed(1);}function Y(y){return (cy-y*u).toFixed(1);}
 var g='',i;
 for(i=-R;i<=R;i++){g+='<line x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'" stroke="#eef" stroke-width="1"/>';g+='<line x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'" stroke="#eef" stroke-width="1"/>';}
 g+='<line x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<line x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'" stroke="#555" stroke-width="1.3"/>';
 g+='<polygon points="'+X(R)+','+Y(0)+' '+(+X(R)-5)+','+(+Y(0)-3)+' '+(+X(R)-5)+','+(+Y(0)+3)+'" fill="#555"/>';
 g+='<polygon points="'+X(0)+','+Y(R)+' '+(+X(0)-3)+','+(+Y(R)+5)+' '+(+X(0)+3)+','+(+Y(R)+5)+'" fill="#555"/>';
 g+='<text x="'+(+X(R)-3)+'" y="'+(+Y(0)+12)+'" font-size="10" font-style="italic" fill="#555">x</text>';

// ═════════════ 1. Холимог тооны квадрат язгуур (1 оноо) ═════════════
// √(w r²/q²) = p/q,  p² = r² + w·q²   (w ≤ 20, q ≤ 24, p ≤ 32 → 29 бодлого; p² ≤ 1024, q² ≤ 576 — эх 17² = 289, 15² = 225-тай

// ═════ 20. A=(x b; c x+q) матриц урвуугүй байх x ═════
function e23_p20() {

    // Ганц утгууд: {r1, r2, −rj} эсвэл {−r1, −r2, rj} — «хоёр гишүүн нь ганцаар гарсан хос зөв» гэх таавар 50/50 болно
    var sg = Math.random() < 0.5

    return {

// ═════ 21. Косинусын теорем: cos∡A ═════
var E23G3_P21_SKIPMAX = 0.75, E23G3_P21_SKIPMIN = 0.5; // зөв хариу хамгийн их / бага бол алгасах магадлал
function e23_p21() {

      e23g3_cosP(Fr(a * a + b * b - c * c, 2 * a * b)), // cos∡C (өөр өнцөг)

    // түүн дээр мөн «2»-ын алдаа гаргасан 2w эсвэл w/2 → таавар ~50%.

        '$=\\dfrac{' + numS + '}{' + den + '}=' + fTex(cA) + '$'

      pts: 2,
      layout: 'row'

  }
  return null;

// ═════ 22. Хоёр цэгийг дайрах шулууны тэгшитгэл ═════

// Буруу сонголтын шулуун: сул гишүүнгүй (координатын эхийг дайрсан) бол хасна — зөв хариу үргэлж C≠0 тул

  for (var t = 0; t < 200; t++) {

    // −k-тай хоёр шулуун (A ба B цэгийг тус бүр дайрсан) — үргэлж байна (эх: 2x+3y+1=0, 2x+3y−11=0)

      // давтагдаж, «(A,B)-аараа ганцаараа» гэх таавар зөв хариуг заахгүй. 5 дахь нь өөр налуутай ГАНЦ шулуун.

  do { s = 1000 + Math.floor(Math.random() * 9000); } while (s === prev);
  return s;
}
function e23_syncUrl(st) {
  try {
    if (!window.history || !history.replaceState) return;
    var q = location.search.replace(/^\?/, '').split('&').filter(function (x) { return x && !/^[vg]=/.test(x); });
    q.push('v=' + st.seed);
    if (st.g) q.push('g=' + st.g);
    history.replaceState(history.state, '', location.pathname + '?' + q.join('&') + location.hash);
  } catch (e) {}
}
// Холбоосны g одоогийн E23_BUILD-тэй таарахгүй бол (генератор шинэчлэгдсэн) — бодлого/хариу өөр болсныг сануулна
function e23_showStale(st) {
  var el = document.getElementById('e23-stale');
  if (!el) return;
  var s = window.__E23_STALE;
  if (s && s.seed === st.seed && s.g !== st.g) {
    el.innerHTML = '<b>Анхаар:</b> Энэ холбоос (Хувилбар №' + s.seed + '·' + e23_esc(s.g) + ') хуудасны өмнөх хувилбараас үүссэн. '
      + 'Хуудас шинэчлэгдсэн тул одоо харагдаж буй бодлого, хариу (<b>Хувилбар №' + e23_esc(e23_vlabel(st)) + '</b>) тэр үеийнхээс өөр байж болно. '
      + 'Өмнө хэвлэсэн хуудсыг энэ хариугаар бүү шалгаарай.';
    el.hidden = false;
  } else { el.hidden = true; el.innerHTML = ''; }
}
function e23_fbox() { var t = document.getElementById('e23-ftpl'); return t ? t.innerHTML : ''; }
function e23_qHtml(it, WK) {
  var n = it.n, f = it.f, pts = it.pts;
  var head = '<div class="qh"><span class="ql">' + n + '.</span>';
  if (!f) return '<div class="e23-q" data-n="' + n + '">' + head + '<span class="qm e23-err">Энэ даалгаврыг үүсгэж чадсангүй — «Шинэ хувилбар» дарна уу.</span><span class="e23-pts">(' + pts + ' оноо)</span></div></div>';
  var opts = it.opts.map(function (o, i) {
    return '<div class="e23-o"><span class="e23-L">' + E23_LET[i] + '.</span><span class="e23-ov">' + o + '</span></div>';
  }).join('');
  return '<div class="e23-q" data-n="' + n + '">' + head + '<span class="qm">' + f.q + '</span><span class="e23-pts">(' + pts + ' оноо)</span></div>'
    + (f.fig ? '<div class="fig">' + f.fig + '</div>' : '')
    + '<div class="e23-opts e23-' + it.lay.kind + '" style="--ow:' + it.lay.ow + '">' + opts + '</div>'
    + (WK ? '<div class="wk" style="height:' + E23_WKH[pts] + 'mm"></div>' : '')
    + '</div>';
}
function e23_bubHtml(st) {
  var cols = '';
  for (var c = 0; c < 4; c++) {
    var rows = '';
    for (var n = c * 9 + 1; n <= c * 9 + 9; n++) {
      rows += '<div class="e23-br"><span class="e23-bn">' + n + '</span>'
        + E23_LET.map(function (L) { return '<span class="e23-bo">' + L + '</span>'; }).join('') + '</div>';
    }
    cols += '<div class="e23-bc">' + rows + '</div>';
  }
  return '<div class="e23-bub" id="e23bub"><div class="e23-bh">Хариултын хуудас — Хувилбар №' + e23_esc(e23_vlabel(st)) + '</div>'
    + '<div class="e23-bs">Нэгдүгээр хэсэг. Зөв хариултынхаа дугуйг бүрэн будна уу.</div>'
    + '<div class="e23-bm"><span>Нэр:</span><span>Анги:</span><span>Оноо:</span></div>'
    + '<div class="e23-bg">' + cols + '</div></div>';
}
function e23_ansHtml(st) {
  var key = st.items.map(function (it) {
    return '<div><b>' + it.n + '.</b>' + (it.f ? E23_LET[it.ci] : '—') + '</div>';
  }).join('');
  var sols = st.items.map(function (it) {
    if (!it.f) return '';
    var sol = it.f.sol;
    if (typeof sol === 'string') sol = [sol];
    var steps = (sol || []).filter(function (s) { return s != null && String(s).replace(/\s+/g, ''); })
      .map(function (s) { return '<div class="e23-st">' + s + '</div>'; }).join('');
    return '<div class="a" data-n="' + it.n + '"><span class="an">' + it.n + '.</span>' + steps
      + '<div class="e23-res">Хариу: ' + E23_LET[it.ci] + '. ' + it.opts[it.ci] + '</div></div>';
  }).join('');
  return '<div class="ans-page" id="answers"><h2>Хариу — Хувилбар №' + e23_esc(e23_vlabel(st)) + '</h2>'
    + '<div class="e23-akey">' + key + '</div><div class="ans-grid">' + sols + '</div></div>';
}
function toggleAns() {
  var el = document.getElementById('answers');
  if (el) el.style.display = e23_cb('sa') ? 'block' : 'none';
}
// ws-store-ийн «Ангиар хэвлэх» (runBatch) хуулбаруудаа #cm-batch-д угсарсны дараа дуудна.
// Сурагч бүр өөр хувилбартай, хариу хавсаргахгүй (sa=false) тул бүх хувилбарын хариуг сүүлийн хуудсанд нэгтгэнэ.
function e23_keyRow(label, sub, k, no) {
  var a = '', b = '';
  for (var i = 0; i < 36; i++) {
    var c = '<td class="e23-kt-L">' + e23_esc(k.charAt(i) === '-' ? '—' : (k.charAt(i) || '?')) + '</td>';
    if (i < 18) a += c; else b += c;
  }
  return '<tbody><tr><td rowspan="2">' + e23_esc(no) + '</td><td rowspan="2" class="e23-kt-v">№' + e23_esc(label)
    + (sub ? '<span>' + e23_esc(sub) + '</span>' : '') + '</td>' + a + '</tr><tr>' + b + '</tr></tbody>';
}
window.WS_BATCH_DONE = function (box) {
  try {
    if (!box || box.querySelector('.e23-kt')) return;
    var rows = [];
    [].forEach.call(box.querySelectorAll('.cm-batch-sheet'), function (sh, i) {
      var v = sh.querySelector('.e23-ver[data-e23v]');
      if (!v) return;
      var nf = sh.querySelector('.meta .cm-fill[data-ph="нэр…"]');
      var lab = v.getAttribute('data-e23v') || '';
      rows.push({ no: String(i + 1), name: nf ? (nf.textContent || '').replace(/\s+/g, ' ').trim() : '', v: lab, k: E23_KEYS[lab] || '' });
    });
    if (!rows.length) return;
    var uniq = {}, nu = 0;
    rows.forEach(function (r) { if (!uniq[r.v]) { uniq[r.v] = 1; nu++; } });
    var body = '';
    if (nu === 1) body = e23_keyRow(rows[0].v, 'бүх ' + rows.length + ' хуудас', rows[0].k, rows.length > 1 ? '1–' + rows.length : '1');
    else rows.forEach(function (r) { body += e23_keyRow(r.v, r.name, r.k, r.no); });
    var h1 = '', h2 = '';
    for (var n = 1; n <= 36; n++) { if (n <= 18) h1 += '<th>' + n + '</th>'; else h2 += '<th>' + n + '</th>'; }
    var cols = '<colgroup><col class="e23-kt-c0"><col class="e23-kt-c1">' + new Array(19).join('<col>') + '</colgroup>';
    var d = document.createElement('div');
    d.className = 'sheet cm-batch-sheet e23-kt';
    d.innerHTML = '<div class="e23-kt-h">Хариуны түлхүүр — ' + e23_esc(E23_TITLE) + '</div>'
      + '<div class="e23-kt-s">Ангиар хэвлэсэн ' + rows.length + ' хуудас · ' + nu + ' хувилбар. Сурагчийн хуудасны «Хувилбар №»-аар мөрөө олно.</div>'
      + '<table class="e23-kt-t">' + cols + '<thead><tr><th rowspan="2">#</th><th rowspan="2">Хувилбар</th>' + h1 + '</tr><tr>' + h2 + '</tr></thead>'
      + body + '</table>';
    box.appendChild(d);
  } catch (e) {}
};
function layout() {
  var st = window.__E23;
  if (!st) { build(); return; }
  var WK = e23_cb('sw'), BUB = e23_cb('sbub'), VL = e23_esc(e23_vlabel(st));
  var html = '<div class="head"><h1>' + E23_TITLE + '</h1><div class="e23-sub">' + E23_SUB + '</div>'
    + '<div class="e23-ver" data-e23v="' + VL + '">Хувилбар №' + VL + '</div></div>'
    + '<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    + e23_fbox()
    + '<div class="e23-note">' + E23_NOTE + '</div>'
    + '<div class="task">Нэгдүгээр хэсэг. СОНГОХ ДААЛГАВАР</div>'
    + '<div class="e23-list">' + st.items.map(function (it) { return e23_qHtml(it, WK); }).join('') + '</div>'
    + (BUB ? e23_bubHtml(st) : '')
    + e23_ansHtml(st);
  var sheet = document.getElementById('sheet');
  sheet.innerHTML = html;
  // «Тэмдэглэх»: ws-store гарчгийг h1-ээс авч (хэрэглэгч засварласан байж болно) ард нь WS_TITLE_SUFFIX залгана
  window.WS_TITLE = E23_TITLE;
  window.WS_TITLE_SUFFIX = ' · Хувилбар №' + e23_vlabel(st);
  try { window.WS_ITEMS = e23_items(st); } catch (e) { window.WS_ITEMS = []; }
  toggleAns();
  e23_showStale(st);
  try {
    renderMathInElement(sheet, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
  } catch (e) {}
}
// build() — шинэ хувилбар (үр өгөхгүй бол санамсаргүй); ws-store-ийн «Ангиар хэвлэх» ч үүнийг дууддаг
function build(seed) {
  var prev = window.__E23 ? window.__E23.seed : null;
  var s = (typeof seed === 'number' && seed >= 1000 && seed <= 9999) ? seed : e23_newSeed(prev);
  if (s !== seed) window.__E23_STALE = null;              // шинэ хувилбар — хуучин холбоосны сануулга хамаарахгүй
  var st = e23_generate(s, window);
  st.g = E23_BUILD;
  window.__E23 = st;
  E23_KEYS[e23_vlabel(st)] = e23_letters(st);
  e23_syncUrl(st);
  layout();
}
(function () {
  var s = e23_urlSeed(), g = e23_urlBuild();
  window.__E23_STALE = (s && g && g !== E23_BUILD) ? { seed: s, g: g } : null;
  build(s);
})();
</script>
