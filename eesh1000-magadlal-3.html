   Эх: 3.45, 3.69, 2.60, 2.59, 3.46, 3.70, 2.66, 3.52, 3.78, 2.62, 2.64, 2.61, 3.53, 3.79, 1.7, 2.63, 2.65, 2.67 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 3.45 */
var e3_45 = (function () {
// 45. Тархалтын хүснэгтэд нэг магадлал a үл мэдэгдэх ⇒ Σ P = 1 ⇒ a = 1 − (бусад магадлалын нийлбэр)
//     (эх: x 1, 2, 3, 4; P 0.15, 0.25, a, 0.4 → a = 0.2). Магадлал 0.05-ын алхамтай (эх шиг), зууны нэгжээр бүхэл тооцоо;
//     x нь 1..n (голдуу), 0..n−1 эсвэл 2..n+1; баганын тоо 3–5, a-гийн байрлал санамсаргүй.  (Ихэр 69 — b, 0.12 мэт хоёр оронтой.)
function p45() {
  var n = pick([3, 4, 4, 4, 5]), T = rnd(1, 10), x0 = T <= 7 ? 1 : T <= 9 ? 0 : 2, u = rnd(0, n - 1), P = [], S = 0, t;
  for (t = 0; t < n; t++) {
    if (t === u) { P.push(null); continue; }
    var v = 5 * rnd(1, n === 3 ? 10 : 8);                    // 0.05 … 0.5 (0.4), зууны нэгжээр
    P.push(v); S += v;
  }
  var a = 100 - S;
  if (a < 5 || a > 60) return null;
  if (P.every(function (v) { return v == null || v % 10 === 0; }) && rnd(0, 2)) return null;   // эх шиг 0.15, 0.25 мэт утга голдуу
  var xs = [], row = ['$P(X=x)$'];
  for (t = 0; t < n; t++) { xs.push(x0 + t); row.push(P[t] == null ? '$a$' : dec(P[t] / 100)); }
  return {
    q: '$X$ санамсаргүй хувьсагчийн магадлалын тархалтыг хүснэгтээр өгсөн бол $a$ тоог олоорой.',
    a: '$a=' + dec(a / 100) + '$',
    fig: tbl([['$x$'].concat(xs), row]),
    wk: 16,
    // Бодолт: тархалтын бүх магадлалын нийлбэр 1 ⇒ a = 1 − (бусдын нийлбэр)
    s: [
      'Тархалтын хүснэгтийн бүх магадлалын нийлбэр $1$-тэй тэнцүү: $$' + P.map(function (v) { return v == null ? 'a' : dec(v / 100); }).join('+') + '=1.$$',
      'Эндээс $$a=1-(' + P.filter(function (v) { return v != null; }).map(function (v) { return dec(v / 100); }).join('+') + ')=1-' + dec(S / 100) + '=' + dec(a / 100) + '.$$'
    ],
    t: { xs: xs, P: P, a: a }
  };
}
return p45;
})();

/* 3.69 */
var e3_69 = (function () {
// 69. (45-ын ихэр) Тархалтын хүснэгтэд нэг магадлал b үл мэдэгдэх ⇒ Σ P = 1 ⇒ b = 1 − (бусад магадлалын нийлбэр)
//     (эх: x 1, 2, 3, 4; P 0.12, 0.23, b, 0.4 → b = 0.25). Эх шиг хоёр оронтой магадлал (0.12, 0.23 мэт — хамгийн багадаа хоёр нь
//     0.05-д хуваагдахгүй), заримдаа 0.4 мэт нэг оронтой; зууны нэгжээр бүхэл тооцоо. x нь 1..n (голдуу), 0..n−1 эсвэл 2..n+1.
function p69() {
  var n = pick([3, 4, 4, 4, 5]), T = rnd(1, 10), x0 = T <= 7 ? 1 : T <= 9 ? 0 : 2, u = rnd(0, n - 1), P = [], S = 0, odd = 0, t;
  for (t = 0; t < n; t++) {
    if (t === u) { P.push(null); continue; }
    var v = rnd(1, 4) === 1 ? 10 * rnd(1, n === 3 ? 5 : 4) : rnd(3, n === 3 ? 48 : 38);   // зууны нэгжээр
    if (v % 5) odd++;
    P.push(v); S += v;
  }
  var b = 100 - S;
  if (b < 5 || b > 60 || odd < 2) return null;
  var xs = [], row = ['$P(X=x)$'];
  for (t = 0; t < n; t++) { xs.push(x0 + t); row.push(P[t] == null ? '$b$' : dec(P[t] / 100)); }
  // Бодолт: тархалтын бүх магадлалын нийлбэр 1 ⇒ b = 1 − (бусад магадлалын нийлбэр)
  var all = P.map(function (v) { return v == null ? 'b' : dec(v / 100); }), oth = P.filter(function (v) { return v != null; }).map(function (v) { return dec(v / 100); });

    q: '$X$ санамсаргүй хувьсагчийн магадлалын тархалтыг хүснэгтээр өгсөн бол $b$ тоог олоорой.',

    fig: tbl([['$x$'].concat(xs), row]),
    wk: 16,
    s: [
      'Магадлалын тархалтын бүх магадлалын нийлбэр $1$-тэй тэнцүү: $$' + all.join('+') + '=1.$$',
      'Иймд $$b=1-(' + oth.join('+') + ')=1-' + dec(S / 100) + '=' + dec(b / 100) + '.$$'

})();

/* 2.60 */
var e2_60 = (function () {
// 60. Тархалтын хуулийн хүснэгтэд нэг магадлал a үл мэдэгдэх → a = 1 − Σ (эх: 0.1, 0.2, a → 0.7).
//     X-ийн утга 1..n (голдуу), 0..n−1, −1..n−2 эсвэл 2, 4, 6, …; магадлал 0.1 эсвэл 0.05-ийн алхамтай.
function p60() {
  var n = pick([3, 3, 4, 4, 5]), ty = rnd(1, 10), xs = [], t;
  for (t = 0; t < n; t++) xs.push(ty <= 6 ? t + 1 : ty <= 8 ? t : ty === 9 ? t - 1 : 2 * (t + 1));
  var u = rnd(1, 10) <= 6 ? n - 1 : rnd(0, n - 1), step = rnd(1, 10) <= 6 ? 100 : 50, P = [], S = 0;
  for (t = 0; t < n; t++) {
    if (t === u) { P.push(null); continue; }
    var v = step * rnd(1, step === 100 ? 4 : 7);
    P.push(v); S += v;
  }
  var a = 1000 - S;
  if (a < 50) return null;
  if (step === 50 && P.every(function (v) { return v == null || v % 100 === 0; })) return null;   // 0.05-ын алхам харагдах
  var row = ['$P$'].concat(P.map(function (v) { return v == null ? '$a$' : dec(v / 1000); }));
  // Бодолт: тархалтын хуулийн магадлалын нийлбэр 1 → a = 1 − Σ(мэдэгдэх)
  var terms = P.map(function (v) { return v == null ? 'a' : dec(v / 1000); }), known = P.filter(function (v) { return v != null; }).map(function (v) { return dec(v / 1000); });
  return {
    q: 'Дискрет санамсаргүй хэмжигдэхүүн $X$-ийн тархалтын хууль өгөгдөв. $a=?$',
    a: '$a=' + dec(a / 1000) + '$',
    fig: tbl([['$X$'].concat(xs.map(function (x) { return x < 0 ? '−' + (-x) : x; })), row]),   // сөрөг утга: «−» (U+2212)
    wk: 16,
    s: [
      'Тархалтын хуулийн бүх магадлалын нийлбэр $1$-тэй тэнцүү ($X$-ийн утгууд нөлөөлөхгүй): $$' + terms.join('+') + '=1.$$',
      'Иймд $$a=1-' + (known.length > 1 ? '(' + known.join('+') + ')=1-' + dec(S / 1000) : known[0]) + '=' + dec(a / 1000) + '.$$'
    ],
    t: { xs: xs, P: P }
  };
}
return p60;
})();

/* 2.59 */
var e2_59 = (function () {
// 59. Тархалтын хуулийн хүснэгтэд хоёр үл мэдэгдэх магадлал, p_i = k·p_j, Σp = 1 → p_j = (1 − Σ мэдэгдэх)/(k + 1).
//     (эх: X 1..4; p₁, 0.2, 0.3, p₄; p₁ = 9p₄ → p₄ = 0.05). Мянганы нэгжээр бүхэл тооцоолно (≤ 3 аравтын орон).
function p59() {
  var n = pick([4, 4, 5]), i = rnd(1, n), j = rnd(1, n), k = rnd(2, 9), P = [], S = 0, t;
  if (i === j) return null;
  for (t = 1; t <= n; t++) {
    if (t === i || t === j) { P.push(null); continue; }
    var v = pick([50, 100, 100, 150, 200, 200, 250, 300, 300, 350, 400]);
    P.push(v); S += v;
  }
  var R = 1000 - S;
  if (R <= 0 || R % (k + 1)) return null;
  var pj = R / (k + 1), pi = k * pj;
  if (pj % 10 && (pj % 5 || rnd(0, 3))) return null;      // ихэвчлэн 2 орон, хааяа 0.025 мэт
  var ask = rnd(1, 4) === 1 ? i : j;                        // ихэвчлэн p_j (эх шиг)
  var xs = [], row = ['$P$'];
  for (t = 1; t <= n; t++) { xs.push(t); row.push(P[t - 1] == null ? '$p_' + t + '$' : dec(P[t - 1] / 1000)); }
  // Бодолт: Σp = 1 → p_i + p_j = 1 − Σ(мэдэгдэх) = R; p_i = k·p_j → (k + 1)p_j = R → p_j, p_i = k·p_j; шалгалт Σ = 1
  var sum = [], chk = [], lo = Math.min(i, j), hi = Math.max(i, j), Rd = dec(R / 1000), pjd = dec(pj / 1000), pid = dec(pi / 1000);
  for (t = 1; t <= n; t++) {
    sum.push(P[t - 1] == null ? 'p_' + t : dec(P[t - 1] / 1000));
    chk.push(t === i ? pid : t === j ? pjd : dec(P[t - 1] / 1000));
  }
  var sub = (i < j ? k + 'p_' + j + '+p_' + j : 'p_' + j + '+' + k + 'p_' + j);
  return {
    q: 'Дискрет санамсаргүй хэмжигдэхүүн $X$-ийн тархалтын хууль өгөгдөв. $p_' + i + '=' + k + 'p_' + j + '$ бол $p_' + ask + '=?$',
    a: '$p_' + ask + '=' + dec((ask === i ? pi : pj) / 1000) + '$',
    fig: tbl([['$X$'].concat(xs), row]),
    wk: 22,
    s: [
      'Тархалтын хуулийн бүх магадлалын нийлбэр $1$-тэй тэнцүү: $$' + sum.join('+') + '=1$$ $$\\Rightarrow\\ p_' + lo + '+p_' + hi + '=1-' + dec(S / 1000) + '=' + Rd + '.$$',
      '$p_' + i + '=' + k + 'p_' + j + '$ нөхцөлийг орлуулбал $$' + sub + '=' + Rd + '\\ \\Rightarrow\\ ' + (k + 1) + 'p_' + j + '=' + Rd + '$$ $$\\Rightarrow\\ p_' + j + '=\\dfrac{' + Rd + '}{' + (k + 1) + '}=' + pjd + '.$$',
      '$p_' + i + '=' + k + '\\cdot ' + pjd + '=' + pid + '$. Шалгалт: $' + chk.join('+') + '=1$. Иймд $p_' + ask + '=' + (ask === i ? pid : pjd) + '$.'
    ],
    t: { P: P, i: i, j: j, k: k }
  };
}
return p59;
})();

/* 3.46 */
var e3_46 = (function () {
// 46. P(Y=y) = k·f(y), y ∈ {y₀, …, y₁} ⇒ Σ P = 1 ⇒ k = 1/Σ f(y) ⇒ P(Y=j) = f(j)/Σ f(y)
//     (эх: k(4 − y), y ∈ {0,1,2,3} → 10k = 1, P(Y=2) = 2k = 0.2). f: k(m−y) (m > y₁), k(y+m), ky, ky², k(y²+m), k(2y+1);
//     хариу аравтын бутархай (≤ 2 орон) байх хувилбарыг л сонгоно — эх шиг.  (Ихэр 70 — энгийн бутархай хариутай.)
function p46_f(fam, m, y) { return [m - y, y + m, y, y * y, y * y + m, 2 * y + 1][fam]; }
// Бодолт: Σ P(Y=y) = k·Σ f(y) = 1 ⇒ k = 1/S;  P(Y=j) = k·f(j) = f(j)/S
function p46_sol(fam, m, ys, j, S) {
  var vals = ys.map(function (y) { return p46_f(fam, m, y); }), f = p46_f(fam, m, j);
  var ex = [m + '-y', 'y+' + m, 'y', 'y^2', 'y^2+' + m, '2y+1'][fam];
  // k·f(j) орлуулга (j = 0 үед «4−0» мэт хэлбэр гаргахгүй)
  var sub = fam === 2 || (fam === 0 && j === 0) ? '' : ['k(' + m + '-' + j + ')', 'k(' + j + '+' + m + ')', '', 'k\\cdot ' + j + '^2', 'k(' + j + '^2+' + m + ')', 'k(2\\cdot ' + j + '+1)'][fam] + '=';
  return [
    'Тархалтын бүх магадлалын нийлбэр $1$-тэй тэнцүү' + (fam === 2 ? ':' : '. $y=' + ys.join(',\\ ') + '$ үед $' + ex + '$ илэрхийлэл $' + vals.join(',\\ ') + '$ утгыг авах тул')
      + ' $$k(' + vals.join('+') + ')=' + S + 'k=1\\ \\Rightarrow\\ k=\\dfrac{1}{' + S + '}.$$',
    'Иймд $$P(Y=' + j + ')=' + sub + (f === 1 ? '' : f) + 'k=\\dfrac{' + f + '}{' + S + '}=' + dec(f / S) + '.$$'
  ];
}
function p46() {
  var T = rnd(1, 20), fam = T <= 8 ? 0 : T <= 13 ? 1 : T <= 15 ? 2 : T <= 17 ? 3 : T <= 19 ? 4 : 5;
  var n = rnd(2, 5), lo = fam === 2 || fam === 3 ? 1 : 0, m = 0, ys = [], S = 0, y;
  if (fam === 0) m = n + rnd(1, 12);                        // бүх магадлал эерэг
  else if (fam === 1) m = rnd(1, 12);
  else if (fam === 4) m = rnd(1, 15);
  for (y = lo; y <= n; y++) { ys.push(y); S += p46_f(fam, m, y); }
  if (ys.length < 3) return null;
  var j = pick(ys), f = p46_f(fam, m, j);
  if (f <= 0 || (100 * f) % S) return null;                // P(Y=j) = f/S — ≤ 2 оронтой аравтын бутархай
  var tex = ['k(' + m + '-y)', 'k(y+' + m + ')', 'ky', 'ky^2', 'k(y^2+' + m + ')', 'k(2y+1)'][fam];
  return {
    // {…} — KaTeX бүлэг дотор мөр таслахгүй («y ∈» мөрийн төгсгөлд үлдэхгүй); таслал хоёр томьёоны хооронд
    q: '$Y$ дискрет санамсаргүй хувьсагчийн магадлалын тархалт ${P(Y=y)=' + tex + '}$, ${y\\in\\{' + ys.join(',') + '\\}}$ томьёогоор өгөв. $P(Y=' + j + ')=?$',
    a: '$P(Y=' + j + ')=' + dec(f / S) + '$',
    wk: 20,
    s: p46_sol(fam, m, ys, j, S),
    t: { fam: fam, m: m, ys: ys, j: j, S: S }
  };
}
return p46;
})();

/* 3.70 */
var e3_70 = (function () {
// 70. (46-ийн ихэр) P(Y=y) = k·f(y), y ∈ {y₀, …, y₁} ⇒ Σ P = 1 ⇒ k = 1/Σ f(y) ⇒ P(Y=j) = f(j)/Σ f(y)
//     (эх: k(3 − y), y ∈ {0,1,2,3} → 6k = 1, P(Y=1) = 2k = 1/3; энд P(Y=3) = 0). f: k(m−y) (m ≥ y₁ — m = y₁ үед эх шиг
//     сүүлийн магадлал 0, түүнийг асуухгүй), k(y+m), ky, ky², k(y²+m), k·2^y; хариу энгийн бутархай (аравтын төгсгөлгүй) — эх шиг.
function p70_f(fam, m, y) { return [m - y, y + m, y, y * y, y * y + m, Math.pow(2, y)][fam]; }
function p70() {
  var T = rnd(1, 20), fam = T <= 8 ? 0 : T <= 12 ? 1 : T <= 14 ? 2 : T <= 16 ? 3 : T <= 18 ? 4 : 5;
  var n = rnd(2, fam === 5 ? 4 : 5), lo = fam === 2 || fam === 3 ? 1 : 0, m = 0, ys = [], S = 0, y;

  // Бодолт: P(Y=y) = k·f(y) утга бүрийг орлуулна; Σ P = S·k = 1 ⇒ k = 1/S ⇒ P(Y=j) = f(j)·k

  var sol = [
    'Томьёонд $y$-ийн утгуудыг орлуулбал ' + ys.map(function (y, i) { return '$P(Y=' + y + ')=' + (vs[i] ? tm(vs[i], 'k', true) : '0') + '$'; }).join(', ') + '.',

    'Иймд $$P(Y=' + j + ')=' + tm(f, 'k', true) + (f === 1 ? '' : '=' + f + '\\cdot\\dfrac{1}{' + S + '}') + '=' + fr(f, S) + '.$$'
  ];
  return {
    // {…} — KaTeX бүлэг дотор мөр таслахгүй («y ∈» мөрийн төгсгөлд үлдэхгүй); таслал хоёр томьёоны хооронд
    q: '$Y$ дискрет санамсаргүй хувьсагчийн магадлалын тархалт ${P(Y=y)=' + tex + '}$, ${y\\in\\{' + ys.join(',') + '\\}}$ томьёогоор өгөв. $P(Y=' + j + ')=?$',
    a: '$P(Y=' + j + ')=' + fr(f, S) + '$',

})();

/* 2.66 */
var e2_66 = (function () {
// 66. P(X = k) = C·f(k), k = k₀, …, k₁ → Σ P = 1 → C = 1/Σ f(k)  (эх: Ck², k = 1, 2, 3 → C = 1/14).
//     f ∈ {k², k, k³, k + 1, k + 2, 2^k, 3^k, 1/k}; k + 1, k + 2, 2^k, 3^k-д k₀ = 0 байж болно.
var p66_F = [['Ck^2', 1], ['Ck^2', 1], ['Ck', 1], ['Ck^3', 1], ['C(k+1)', 0], ['C(k+2)', 0], ['C\\cdot 2^k', 0], ['\\dfrac{C}{k}', 1], ['C\\cdot 3^k', 0]];
function p66_f(i, k) { return [k * k, k * k, k, k * k * k, k + 1, k + 2, Math.pow(2, k), 0, Math.pow(3, k)][i]; }
function p66() {
  var i = rnd(0, p66_F.length - 1), F = p66_F[i], lo = F[1] === 0 && rnd(0, 1) ? 0 : 1, hi = lo + pick([3, 3, 4, 4, 5]) - 1, ks = [], k, C;
  if ((i === 3 && hi > 4) || (i === 8 && hi > 3)) return null;   // k³, 3^k: нийлбэр хэт том биш
  for (k = lo; k <= hi; k++) ks.push(k);
  if (i === 7) {                                            // Σ 1/k = s/L → C = L/s
    var L = 1, s = 0;
