<style>

<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var OL=['А','Б','В','Г'];
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){var t=a%b;a=b;b=t;}return a;}
function fr(p,q){if(q<0){p=-p;q=-q;}var g=gcd(Math.abs(p),q)||1;return {p:p/g,q:q/g};}
function frTex(f){if(f.q===1)return ''+f.p;return (f.p<0?'-':'')+'\\dfrac{'+Math.abs(f.p)+'}{'+f.q+'}';}
function coefP(a,term){return a===1?term:(a===-1?'-'+term:a+term);}
function sgnc(c){return c>0?'+'+c:(c<0?'-'+(-c):'');}
function texOp(o){return {gt:'\\gt',lt:'\\lt',ge:'\\geq',le:'\\leq'}[o];}
function revOp(o){return {gt:'lt',lt:'gt',ge:'le',le:'ge'}[o];}
function holdsOp(o,l,r){return o==='gt'?l>r:(o==='lt'?l<r:(o==='ge'?l>=r:l<=r));}
function stdTex(a,b,c){var s=(a===1?'x^2':(a===-1?'-x^2':a+'x^2'));if(b!==0){var ab=Math.abs(b);s+=(b>0?'+':'-')+(ab===1?'':ab)+'x';}if(c!==0)s+=(c>0?'+':'-')+Math.abs(c);return s;}
function bqTex(b,c){var s='x^4';if(b!==0){var ab=Math.abs(b);s+=(b>0?'+':'-')+(ab===1?'':ab)+'x^2';}if(c!==0)s+=(c>0?'+':'-')+Math.abs(c);return s+'=0';}
function linExp(k,m){var s=(k===1?'x':(k===-1?'-x':k+'x'));if(m>0)s+='+'+m;else if(m<0)s+='-'+(-m);return s;}
function simpRad(N){var out=1,inn=N;for(var k=Math.floor(Math.sqrt(N));k>=2;k--){if(N%(k*k)===0){out=k;inn=N/(k*k);break;}}return {out:out,inn:inn};}
var FAM=[{a:2,pw:[1,2,3,4]},{a:3,pw:[1,2,3]},{a:5,pw:[1,2]}];
var TRIP=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20]];
// ── MCQ ──
function finishMC(opts){var sh=shuffle(opts),ci=-1;for(var i=0;i<sh.length;i++)if(sh[i].ok)ci=i;return {opts:sh,correct:ci};}
function C(t){return {t:t};}
function makeMC(cor,distr){var opts=[{tex:cor.t,ok:true}],used=[cor.t];
  for(var i=0;i<distr.length&&opts.length<4;i++){var d=distr[i];if(!d)continue;if(used.indexOf(d.t)>=0)continue;used.push(d.t);opts.push({tex:d.t,ok:false});}
  if(opts.length<4)return null;return finishMC(opts);}
// ── Тест (6.1–6.5) ──
function t61ineq(){var a=nz(-5,5),x0=nz(-6,6),b=nz(-9,9),c=a*x0+b,o=pick(['gt','lt','ge','le']),oo=a<0?revOp(o):o;
  var mc=makeMC(C('x'+texOp(oo)+' '+x0),[C('x'+texOp(o)+' '+x0),C('x'+texOp(oo)+' '+(-x0)),C('x'+texOp(revOp(oo))+' '+x0),C('x'+texOp(oo)+' '+(x0+1))]);if(!mc)return null;
  return {stem:'$'+coefP(a,'x')+sgnc(b)+' '+texOp(o)+' '+c+'$ тэнцэтгэл бишийн шийд:',mc:mc};}
function t61double(){var a=pick([1,2,3]),b=nz(-6,6),xlo=nz(-5,2),xhi=xlo+rnd(2,6),p=a*xlo+b,q=a*xhi+b,o1=pick(['lt','le']),o2=pick(['lt','le']);
  var mc=makeMC(C(''+xlo+' '+texOp(o1)+' x '+texOp(o2)+' '+xhi),[C(''+p+' '+texOp(o1)+' x '+texOp(o2)+' '+q),C(''+xhi+' '+texOp(o1)+' x '+texOp(o2)+' '+xlo),C(''+(xlo-1)+' '+texOp(o1)+' x '+texOp(o2)+' '+(xhi+1))]);if(!mc)return null;
  return {stem:'$'+p+' '+texOp(o1)+' '+coefP(a,'x')+sgnc(b)+' '+texOp(o2)+' '+q+'$ бол:',mc:mc};}
function t62roots(){var p=nz(-8,8),q=nz(-8,8);if(p===q)return null;var b=-(p+q),c=p*q,lo=Math.min(p,q),hi=Math.max(p,q);
  function pr(u,v){return 'x_1='+u+',\\ x_2='+v;}
  var mc=makeMC(C(pr(lo,hi)),[C(pr(-lo,-hi)),C(pr(lo,-hi)),C(pr(-lo,hi)),C(pr(lo+1,hi))]);if(!mc)return null;
  return {stem:'$'+stdTex(1,b,c)+'=0$ тэгшитгэлийн шийд:',mc:mc};}
function t62disc(){var a=nz(-4,4),b=nz(-8,8),c=nz(-8,8),D=b*b-4*a*c;
  var mc=makeMC(C(''+D),[C(''+(b*b+4*a*c)),C(''+(b*b-2*a*c)),C(''+(-D)),C(''+(b*b-4*a*c+1))]);if(!mc)return null;
  return {stem:'$'+stdTex(a,b,c)+'=0$ тэгшитгэлийн дискриминант $D$ =',mc:mc};}
function t62vieta(){var p=nz(-7,7),q=nz(-7,7);if(p===q)return null;var b=-(p+q),c=p*q,sum=p+q,prod=p*q;
  var mc=makeMC(C('x_1+x_2='+sum+',\\ x_1x_2='+prod),[C('x_1+x_2='+(-sum)+',\\ x_1x_2='+prod),C('x_1+x_2='+sum+',\\ x_1x_2='+(-prod)),C('x_1+x_2='+prod+',\\ x_1x_2='+sum)]);if(!mc)return null;
  return {stem:'$'+stdTex(1,b,c)+'=0$ бол Виетийн томьёогоор:',mc:mc};}
function t62inc(){var a=pick([1,2,3]),r=rnd(1,6),c=-a*r*r;
  var mc=makeMC(C('x=\\pm'+r),[C('x='+r),C('x=\\pm'+(r*r)),C('x=\\pm'+(r+1)),C('x='+(-r))]);if(!mc)return null;
  return {stem:'$'+stdTex(a,0,c)+'=0$ бол $x$ =',mc:mc};}
function t63biquad(){var t=pick(['full','two','none']),cor,stem;
  if(t==='full'){var p=rnd(1,5),q=rnd(1,5);if(p>=q)return null;stem=bqTex(-(p*p+q*q),p*p*q*q);cor='4';}
  else if(t==='two'){var p2=rnd(1,5),m=rnd(1,8);stem=bqTex(m-p2*p2,-p2*p2*m);cor='2';}
  else{var m1=rnd(1,5),n1=rnd(1,5);stem=bqTex(m1+n1,m1*n1);cor='0';}
  var mc=makeMC(C(cor),[C('1'),C('2'),C('3'),C('4'),C('0')].filter(function(o){return o.t!==cor;}));if(!mc)return null;
  return {stem:'$'+stem+'$ тэгшитгэл хэдэн бодит шийдтэй вэ?',mc:mc};}
function t64pt(){var m=pick([-2,-1,1,2]),b=nz(-3,3),o=pick(['gt','lt','ge','le']),sat=[],ns=[];
  for(var tries=0;tries<80&&(sat.length<1||ns.length<3);tries++){var px=nz(-4,4),py=nz(-5,5),h=holdsOp(o,py,m*px+b),pt='('+px+',\\ '+py+')';if(h){if(sat.indexOf(pt)<0)sat.push(pt);}else if(ns.indexOf(pt)<0)ns.push(pt);}
  if(sat.length<1||ns.length<3)return null;
  var mc=makeMC(C(sat[0]),ns.slice(0,3).map(function(p){return C(p);}));if(!mc)return null;
  return {stem:'Аль цэг $y'+texOp(o)+' '+coefP(m,'x')+sgnc(b)+'$ тэнцэтгэл бишийг хангах вэ?',mc:mc};}
function t65same(){var f=pick(FAM),a=f.a,p=pick(f.pw),q=pick(f.pw),k1=pick([1,2,-1]),k2=pick([1,2,-1]),x0=nz(-4,4);if(p*k1===q*k2)return null;
  for(var tr=0;tr<40;tr++){var m1=nz(-5,5),numr=p*(k1*x0+m1)-q*k2*x0;if(numr%q!==0)continue;var m2=numr/q;
    var mc=makeMC(C('x='+x0),[C('x='+(-x0)),C('x='+(x0+1)),C('x='+(x0-1)),C('x='+(x0+2))]);if(!mc)return null;
    return {stem:'$'+Math.pow(a,p)+'^{'+linExp(k1,m1)+'} = '+Math.pow(a,q)+'^{'+linExp(k2,m2)+'}$ бол $x$ =',mc:mc};}
  return null;}
function t65subst(){var a=pick([2,3,5]),mn=pick([[0,1],[0,2],[1,2]]),m=mn[0],n=mn[1],t1=Math.pow(a,m),t2=Math.pow(a,n),B=-(t1+t2),C2=t1*t2,lo=Math.min(m,n),hi=Math.max(m,n);
  var mid=(B<0?' - ':' + ')+(Math.abs(B)===1?'':Math.abs(B)+'\\cdot ')+a+'^{x}';
  var mc=makeMC(C('x_1='+lo+',\\ x_2='+hi),[C('x_1='+t1+',\\ x_2='+t2),C('x_1='+(-lo)+',\\ x_2='+(-hi)),C('x_1='+lo+',\\ x_2='+(hi+1))]);if(!mc)return null;
  return {stem:'$'+(a*a)+'^{x}'+mid+(C2<0?' - ':' + ')+Math.abs(C2)+' = 0$ бол $x$ =',mc:mc};}
var TESTS=[t61ineq,t61double,t62roots,t62disc,t62vieta,t62inc,t63biquad,t64pt,t65same,t65subst];
// ── Задгай ──
function free61(){var a=pick([1,2,3]),b=nz(-6,6),xlo=nz(-5,2),xhi=xlo+rnd(2,6),p=a*xlo+b,q=a*xhi+b,o1=pick(['lt','le']),o2=pick(['lt','le']);
  return {stem:'$'+p+' '+texOp(o1)+' '+coefP(a,'x')+sgnc(b)+' '+texOp(o2)+' '+q+'$ давхар тэнцэтгэл бишийг бод.',a:''+xlo+' '+texOp(o1)+' x '+texOp(o2)+' '+xhi};}
function free62(){var a=nz(1,3),b=nz(-9,9),c=nz(-9,9),D=b*b-4*a*c;if(D<=0)return null;a=Math.abs(a);var sq=Math.sqrt(D);if(sq===Math.floor(sq))return null;
  var s=simpRad(D),g=gcd(gcd(Math.abs(b),s.out),2*a),nb=(-b)/g,no=s.out/g,den=(2*a)/g;
  var radTex=(no===1?'':no)+'\\sqrt{'+s.inn+'}',numTex=(nb===0?'\\pm '+radTex:nb+'\\pm '+radTex),ansTex=(den===1?numTex:'\\dfrac{'+numTex+'}{'+den+'}');
  return {stem:'$'+stdTex(a,b,c)+'=0$ тэгшитгэлийг шийдийн томьёогоор бод.',a:'x='+ansTex};}
function free63word(){var t=pick(['consec','rect','legs']);
  if(t==='consec'){var n=rnd(6,20),P=n*(n+1);return {stem:'Дараалсан хоёр натурал тооны үржвэр нь $'+P+'$ болно. Тэдгээр тоог ол.',a:''+n+',\\ '+(n+1)};}
  if(t==='rect'){var w=rnd(5,15),d=rnd(2,9),A=w*(w+d);return {stem:'Тэгш өнцөгтийн урт нь өргөнөөсөө $'+d+'$ м-ээр их, талбай $'+A+'\\,\\text{м}^2$. Талуудыг ол.',a:''+w+'\\text{ м},\\ '+(w+d)+'\\text{ м}'};}
  var tr=pick(TRIP),d2=tr[1]-tr[0];return {stem:'Тэгш өнцөгт гурвалжны катетуудын зөрүү $'+d2+'$ см, гипотенуз нь $'+tr[2]+'$ см. Катетуудыг ол.',a:''+tr[0]+',\\ '+tr[1]+'\\text{ см}'};}
function free65(){var a=pick([2,3]),mn=pick([[0,1],[1,2]]),m=mn[0],n=mn[1],t1=Math.pow(a,m),t2=Math.pow(a,n),B=-(t1+t2),C2=t1*t2;
  var mid=(B<0?' - ':' + ')+(Math.abs(B))+'\\cdot '+a+'^{x}';
  return {stem:'$'+(a*a)+'^{x}'+mid+' + '+C2+' = 0$ тэгшитгэлийг орлуулга хийж бод.',a:'x_1='+Math.min(m,n)+',\\ x_2='+Math.max(m,n)};}
// ── График: 6.4 системийн шийдийн муж ──
var GVB=160;
function gX(w,x){return (x-w.xmin)/(w.xmax-w.xmin)*GVB;}
function gY(w,y){return GVB-(y-w.ymin)/(w.ymax-w.ymin)*GVB;}
function gGrid(w){var g='',i;for(i=Math.ceil(w.xmin);i<=w.xmax;i++){var px=gX(w,i);g+='<line x1="'+px.toFixed(1)+'" y1="0" x2="'+px.toFixed(1)+'" y2="'+GVB+'" stroke="'+(i===0?'#555':'#e8e2f7')+'" stroke-width="'+(i===0?1.2:0.6)+'"/>';}for(i=Math.ceil(w.ymin);i<=w.ymax;i++){var py=gY(w,i);g+='<line x1="0" y1="'+py.toFixed(1)+'" x2="'+GVB+'" y2="'+py.toFixed(1)+'" stroke="'+(i===0?'#555':'#e8e2f7')+'" stroke-width="'+(i===0?1.2:0.6)+'"/>';}var y0=gY(w,0),x0=gX(w,0);for(i=Math.ceil(w.xmin);i<=w.xmax;i++){if(i!==0&&i%2===0)g+='<text x="'+(gX(w,i)+1).toFixed(1)+'" y="'+(y0+8).toFixed(1)+'" font-size="7" fill="#999">'+i+'</text>';}for(i=Math.ceil(w.ymin);i<=w.ymax;i++){if(i!==0&&i%2===0)g+='<text x="'+(x0+2).toFixed(1)+'" y="'+(gY(w,i)+3).toFixed(1)+'" font-size="7" fill="#999">'+i+'</text>';}g+='<text x="'+(GVB-8)+'" y="'+(y0-2).toFixed(1)+'" font-size="9" font-style="italic" fill="#666">x</text><text x="'+(x0+3).toFixed(1)+'" y="10" font-size="9" font-style="italic" fill="#666">y</text>';return g;}
function boxPoly(w){return [[w.xmin,w.ymin],[w.xmax,w.ymin],[w.xmax,w.ymax],[w.xmin,w.ymax]];}
function sideVal(hp,x,y){return hp.A*x+hp.B*y-hp.C;}
function clipPoly(poly,hp){var res=[];for(var i=0;i<poly.length;i++){var A=poly[i],B=poly[(i+1)%poly.length],sa=sideVal(hp,A[0],A[1]),sb=sideVal(hp,B[0],B[1]),ina=hp.ge?sa>=-1e-9:sa<=1e-9,inb=hp.ge?sb>=-1e-9:sb<=1e-9;if(ina)res.push(A);if(ina!==inb&&sa!==sb){var t=sa/(sa-sb);res.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}}return res;}
function gShade(w,hps){var poly=boxPoly(w);for(var i=0;i<hps.length;i++)poly=clipPoly(poly,hps[i]);if(poly.length<3)return '';return '<polygon points="'+poly.map(function(p){return gX(w,p[0]).toFixed(1)+','+gY(w,p[1]).toFixed(1);}).join(' ')+'" fill="rgba(123,82,238,0.20)"/>';}
function gLineHP(w,hp){var box=boxPoly(w),pts=[];for(var i=0;i<4;i++){var A=box[i],B=box[(i+1)%4],sa=sideVal(hp,A[0],A[1]),sb=sideVal(hp,B[0],B[1]);if(sa===sb)continue;if((sa<=0&&sb>=0)||(sa>=0&&sb<=0)){var t=sa/(sa-sb);pts.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}}if(pts.length<2)return '';return '<line x1="'+gX(w,pts[0][0]).toFixed(1)+'" y1="'+gY(w,pts[0][1]).toFixed(1)+'" x2="'+gX(w,pts[1][0]).toFixed(1)+'" y2="'+gY(w,pts[1][1]).toFixed(1)+'" stroke="#7B52EE" stroke-width="1.5"/>';}
function ineqTex(A,B,C,ge){var p='';if(A!==0)p+=(A===1?'x':(A===-1?'-x':A+'x'));if(B!==0)p+=(p?((B>0?'+':'-')+(Math.abs(B)===1?'':Math.abs(B))+'y'):(B===1?'y':(B===-1?'-y':B+'y')));return p+(ge?'\\geq ':'\\leq ')+C;}
function buildTri(){var tr=0;while(tr++<800){var P=[nz(-5,5),nz(-5,5)],Q=[nz(-5,5),nz(-5,5)],R=[nz(-5,5),nz(-5,5)],ar=Math.abs((Q[0]-P[0])*(R[1]-P[1])-(R[0]-P[0])*(Q[1]-P[1]))/2;
  if(ar<7||ar>40)continue;var E=[[P,Q,R],[Q,R,P],[R,P,Q]],hps=[],texs=[],ok=true;

function genVariants(N){if(!N||N<1)return;if(N>16)N=16;var sheet=document.getElementById('sheet'),hug=getHug(),pts=snapPts(),sa=document.getElementById('sa');if(sa&&sa.checked){sa.checked=false;toggleAns();}var old=document.getElementById('cm-vbatch');if(old)old.remove();var box=document.createElement('div');box.id='cm-vbatch';box.style.display='none';var keys=[];
