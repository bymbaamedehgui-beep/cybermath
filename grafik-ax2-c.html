<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квадрат график: y = ax² + c</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--curve:#e11d48}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:12px;text-align:center}
  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;text-align:center}
  .qlabel{font-size:15px;margin-bottom:2px}.qn{font-weight:800;color:var(--purple)}
  .hint{font-size:10px;color:var(--soft);margin-bottom:3px}
  svg.gr{width:100%;max-width:58mm;aspect-ratio:1/1;height:auto;background:#fff;border:1px solid #e7ddff;border-radius:4px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .agrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:12px 14px}
  .a{text-align:center;font-size:11px}.a .af{font-size:13px;margin-bottom:1px}.a .ai{color:var(--soft);font-size:10px;margin-top:2px}
  svg.grs{width:100%;max-width:44mm;aspect-ratio:1/1;height:auto;background:#fff;border:1px solid #eee;border-radius:4px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(lo,hi){var v;do{v=rnd(lo,hi);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function coef(a){return a===1?'':a===-1?'-':(''+a);}
function sgn(c){return c>0?' + '+c:c<0?' - '+(-c):'';}
function sgnIn(h){return h>0?' - '+h:h<0?' + '+(-h):'';} /* (x - h) доторх тэмдэг */
/* ---- координатын тор (график бүрд тохирсон, x/y тэнцүү масштаб) ---- */
var VB=200;
function X(w,x){return (x-w.xmin)/(w.xmax-w.xmin)*VB;}
function Y(w,y){return VB-(y-w.ymin)/(w.ymax-w.ymin)*VB;}
/* Орой ба нумыг харуулах, тэнхлэгүүдийг багтаасан, ДӨРВӨЛЖИН (тэнцүү масштаб) цонх */
function win(f,vx,vy){
  var arcH=8,up=(f(vx+1)>=vy),wx=2,d;
  for(d=0.2;d<=15;d+=0.2){ if(Math.abs(f(vx+d)-vy)<=arcH)wx=d; else break; }
  var xmin=vx-wx,xmax=vx+wx,ymin,ymax;
  if(up){ymin=vy;ymax=vy+arcH;}else{ymax=vy;ymin=vy-arcH;}
  xmin=Math.min(xmin,0);xmax=Math.max(xmax,0);ymin=Math.min(ymin,0);ymax=Math.max(ymax,0);
  xmin-=1;xmax+=1;ymin-=1;ymax+=1;
  xmin=Math.floor(xmin);xmax=Math.ceil(xmax);ymin=Math.floor(ymin);ymax=Math.ceil(ymax);
  var rx=xmax-xmin,ry=ymax-ymin,S=Math.max(rx,ry);
  var ex=S-rx,ey=S-ry;
  xmin-=Math.floor(ex/2);xmax+=Math.ceil(ex/2);
  ymin-=Math.floor(ey/2);ymax+=Math.ceil(ey/2);
  return {xmin:xmin,xmax:xmax,ymin:ymin,ymax:ymax};
}
function grid(w){
  var g='',i,st=(w.xmax-w.xmin)>13?2:1;   /* том цонхонд шошго 2-оор */
  for(i=w.xmin;i<=w.xmax;i++){var px=X(w,i);g+='<line x1="'+px.toFixed(1)+'" y1="0" x2="'+px.toFixed(1)+'" y2="'+VB+'" stroke="'+(i===0?'#555':'#e8e2f7')+'" stroke-width="'+(i===0?1.3:0.6)+'"/>';}
  for(i=w.ymin;i<=w.ymax;i++){var py=Y(w,i);g+='<line x1="0" y1="'+py.toFixed(1)+'" x2="'+VB+'" y2="'+py.toFixed(1)+'" stroke="'+(i===0?'#555':'#e8e2f7')+'" stroke-width="'+(i===0?1.3:0.6)+'"/>';}
  var y0=Y(w,0),x0=X(w,0);
  for(i=w.xmin;i<=w.xmax;i++){if(i!==0&&i%st===0)g+='<text x="'+(X(w,i)+1).toFixed(1)+'" y="'+(y0+9).toFixed(1)+'" font-size="8" fill="#999">'+i+'</text>';}
  for(i=w.ymin;i<=w.ymax;i++){if(i!==0&&i%st===0)g+='<text x="'+(x0+3).toFixed(1)+'" y="'+(Y(w,i)+3).toFixed(1)+'" font-size="8" fill="#999">'+i+'</text>';}
  g+='<text x="'+(VB-9)+'" y="'+(y0-3).toFixed(1)+'" font-size="10" font-style="italic" fill="#666">x</text>';
  g+='<text x="'+(x0+4).toFixed(1)+'" y="11" font-size="10" font-style="italic" fill="#666">y</text>';
  return g;
}
function curve(w,f){
  var d='',pen=false,step=(w.xmax-w.xmin)/240;
  for(var x=w.xmin;x<=w.xmax+1e-9;x+=step){
    var y=f(x);
    if(y<w.ymin-1||y>w.ymax+1){pen=false;continue;}
    d+=(pen?'L':'M')+X(w,x).toFixed(1)+' '+Y(w,y).toFixed(1)+' ';pen=true;
  }
  return '<path d="'+d+'" fill="none" stroke="var(--curve)" stroke-width="2"/>';
}
function vdot(w,vx,vy){return '<circle cx="'+X(w,vx).toFixed(1)+'" cy="'+Y(w,vy).toFixed(1)+'" r="2.6" fill="var(--curve)"/>';}
/* ---- тохиолдол: y = ax² ---- */
function genOne(){
  var a=pick([-2,-1,1,2]);var c=nz(-5,5);
  var label='y = '+coef(a)+'x^2'+sgn(c);
  var f=function(x){return a*x*x+c;};
  return {label:label,f:f,vx:0,vy:c,dir:(a>0?'дээш':'доош'),
    info:'Орой (0, '+c+') · тэнхлэг x = 0 · '+(a>0?'дээш':'доош')};
}
function build(){
  var probs='',answs='',items=[];
  var seen={};
  for(var i=0;i<6;i++){
    var e,tr=0;do{e=genOne();tr++;}while(seen[e.label]&&tr<60);seen[e.label]=1;var n=i+1;var w=win(e.f,e.vx,e.vy);
    probs+='<div class="q"><div class="qlabel"><span class="qn">'+n+'.</span> $'+e.label+'$</div>'
      +'<div class="hint">Орой ( __ , __ ) · тэнхлэг x = __</div>'
      +'<svg class="gr" viewBox="0 0 '+VB+' '+VB+'">'+grid(w)+'</svg></div>';
    answs+='<div class="a"><div class="af"><span class="an">'+n+'.</span> $'+e.label+'$</div>'
      +'<svg class="grs" viewBox="0 0 '+VB+' '+VB+'">'+grid(w)+curve(w,e.f)+vdot(w,e.vx,e.vy)+'</svg>'
      +'<div class="ai">'+e.info+'</div></div>';
    items.push({q:e.label,a:e.info});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Квадрат функцийн график: y = ax² + c</h1><div class="sub">Босоо зөөлт · орой (0, c) дээр · 6 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">y = ax² графикийг босоогоор c нэгжээр зөөнө · Орой (0, c) · тэнхлэг x = 0 · c &gt; 0 дээш, c &lt; 0 доош</div>'
    +'<div class="pgrid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд (парабол ба орой)</h2><div class="agrid">'+answs+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Квадрат график: y = ax² + c';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=33"></script>
</body>
</html>
