<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Шулууны график — 8 бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .rule{font-size:12px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:14px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:6px 4px 8px;border-bottom:1px dashed #efeaff;display:flex;gap:12px;align-items:flex-start}
  .qL{flex:1}.qn{font-weight:800;color:var(--purple);margin-right:6px}.qm{font-size:15px}
  .tbl{margin:8px 0;font-size:11.5px}.tbl td{border:1px solid #ddd;padding:2px 7px;text-align:center;min-width:24px}
  .ans2{font-size:12px;font-weight:700;margin-top:6px}.ans2 .bl{display:inline-block;min-width:36px;border-bottom:1.4px solid #b9accf;height:1em;margin:0 10px 0 4px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:center}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(lo,hi){var v=0;while(v===0)v=rnd(lo,hi);return v;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
/* ---- Хэмжээст (тоотой) координатын хавтгай — шулуунаа дагаж хувирна ---- */
var VB=200, LC='#2563eb';
function X(w,x){return (x-w.xmin)/(w.xmax-w.xmin)*VB;}
function Y(w,y){return VB-(y-w.ymin)/(w.ymax-w.ymin)*VB;}
function grid(w){
  var g='',i,st=(w.xmax-w.xmin)>13?2:1;
  for(i=w.xmin;i<=w.xmax;i++){var px=X(w,i);g+='<line x1="'+px.toFixed(1)+'" y1="0" x2="'+px.toFixed(1)+'" y2="'+VB+'" stroke="'+(i===0?'#555':'#e8e2f7')+'" stroke-width="'+(i===0?1.3:0.6)+'"/>';}
  for(i=w.ymin;i<=w.ymax;i++){var py=Y(w,i);g+='<line x1="0" y1="'+py.toFixed(1)+'" x2="'+VB+'" y2="'+py.toFixed(1)+'" stroke="'+(i===0?'#555':'#e8e2f7')+'" stroke-width="'+(i===0?1.3:0.6)+'"/>';}
  var y0=Y(w,0),x0=X(w,0);
  for(i=w.xmin;i<=w.xmax;i++){if(i!==0&&i%st===0)g+='<text x="'+(X(w,i)+1).toFixed(1)+'" y="'+(y0+9).toFixed(1)+'" font-size="8" fill="#999">'+i+'</text>';}
  for(i=w.ymin;i<=w.ymax;i++){if(i!==0&&i%st===0)g+='<text x="'+(x0+3).toFixed(1)+'" y="'+(Y(w,i)+3).toFixed(1)+'" font-size="8" fill="#999">'+i+'</text>';}
  g+='<text x="'+(VB-9)+'" y="'+(y0-3).toFixed(1)+'" font-size="10" font-style="italic" fill="#666">x</text>';
  g+='<text x="'+(x0+4).toFixed(1)+'" y="11" font-size="10" font-style="italic" fill="#666">y</text>';
  return g;
}
function line(w,m,b){var d='',pen=false,step=(w.xmax-w.xmin)/240;
  for(var x=w.xmin;x<=w.xmax+1e-9;x+=step){var y=m*x+b;if(y<w.ymin-0.5||y>w.ymax+0.5){pen=false;continue;}d+=(pen?'L':'M')+X(w,x).toFixed(1)+' '+Y(w,y).toFixed(1)+' ';pen=true;}
  return '<path d="'+d+'" fill="none" stroke="'+LC+'" stroke-width="2"/>';}
function dot(w,x,y){return '<circle cx="'+X(w,x).toFixed(1)+'" cy="'+Y(w,y).toFixed(1)+'" r="2.8" fill="'+LC+'"/>';}
function svgOpen(sz){sz=sz||150;return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+VB+' '+VB+'" style="background:#fff;border:1px solid #e5e0f0;border-radius:6px">';}
function winLine(m,b){
  var xh=2;while(xh<6 && Math.abs(m*(xh+1)+b)<=8 && Math.abs(-m*(xh+1)+b)<=8)xh++;
  var ys=[b-m*xh,b+m*xh,0,b],ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys),xmin=-xh,xmax=xh;
  xmin-=1;xmax+=1;ymin=Math.floor(ymin)-1;ymax=Math.ceil(ymax)+1;
  var rx=xmax-xmin,ry=ymax-ymin,S=Math.max(rx,ry),ex=S-rx,ey=S-ry;
  xmin-=Math.floor(ex/2);xmax+=Math.ceil(ex/2);ymin-=Math.floor(ey/2);ymax+=Math.ceil(ey/2);
  return {xmin:xmin,xmax:xmax,ymin:ymin,ymax:ymax};
}
function eqStr(m,b){var s='y='+(m===1?'x':m===-1?'-x':m+'x');if(b>0)s+='+'+b;else if(b<0)s+='-'+(-b);return s;}
function build(){
  var probs='',answs='',ITEMS=[];
  var seen={};
  for(var i=0;i<8;i++){
    var m,b,tr=0;do{m=nz(-3,3);b=rnd(-4,4);tr++;}while(seen[m+','+b]&&tr<60);seen[m+','+b]=1;
    var n=i+1, eq=eqStr(m,b), w=winLine(m,b);
    probs+='<div class="q"><div class="qL"><div><span class="qn">'+n+'.</span><span class="qm">$'+eq+'$</span></div>'
      +'<table class="tbl"><tr><td>x</td><td>-1</td><td>0</td><td>1</td><td>2</td></tr><tr><td>y</td><td></td><td></td><td></td><td></td></tr></table>'
      +'<div class="ans2">налуу m:<span class="bl"></span> огтлол b:<span class="bl"></span></div></div>'
      +'<div>'+svgOpen()+grid(w)+'</svg></div></div>';
    answs+='<div class="a"><div class="af"><span class="an">'+n+'.</span> $'+eq+'$ · $m='+m+',\\ b='+b+'$</div>'
      +svgOpen(120)+grid(w)+line(w,m,b)+dot(w,0,b)+'</svg></div>';
    ITEMS.push({q:eq,a:'m='+m+',\\ b='+b});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Шулууны график</h1><div class="sub">Хүснэгтийг бөглөж, шулууныг сүлжээнд зур, налуу m ба огтлол b-г ол · 8 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$y=mx+b$ — $m$ нь <b>налуу</b>, $b$ нь <b>y тэнхлэгийн огтлол</b> ($x=0$ үеийн y)</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=ITEMS; window.WS_TITLE='Шулууны график';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=37"></script>
</body>
</html>
