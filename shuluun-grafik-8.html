<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Шулууны график — 8 бодлого</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .rule{font-size:12px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:14px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:6px 4px 8px;border-bottom:1px dashed #efeaff;display:flex;gap:12px;align-items:flex-start}
  .qL{flex:1}.qn{font-weight:800;color:var(--purple);margin-right:6px}.qm{font-size:15px}
  .tbl{margin:8px 0;font-size:11.5px}.tbl td{border:1px solid #ddd;padding:2px 7px;text-align:center;min-width:24px}
  .ans2{font-size:12px;font-weight:700;margin-top:6px}.ans2 .bl{display:inline-block;min-width:36px;border-bottom:1.4px solid #b9accf;height:1em;margin:0 10px 0 4px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:center}.ans-grid .an{color:var(--soft);font-weight:800;min-width:24px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(lo,hi){var v=0;while(v===0)v=rnd(lo,hi);return v;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gridSVG(){
  var u=11,O=72,sz=144,s='<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'">';
  s+='<rect x="0" y="0" width="'+sz+'" height="'+sz+'" fill="#fff" stroke="#ddd" rx="6"/>';
  for(var k=-6;k<=6;k++){var p=O+k*u;
    s+='<line x1="'+p+'" y1="6" x2="'+p+'" y2="'+(sz-6)+'" stroke="#ebebf4" stroke-width="1"/>';
    s+='<line x1="6" y1="'+p+'" x2="'+(sz-6)+'" y2="'+p+'" stroke="#ebebf4" stroke-width="1"/>';}
  s+='<line x1="6" y1="'+O+'" x2="'+(sz-6)+'" y2="'+O+'" stroke="#555" stroke-width="1.4"/>';
  s+='<line x1="'+O+'" y1="6" x2="'+O+'" y2="'+(sz-6)+'" stroke="#555" stroke-width="1.4"/>';
  s+='<text x="'+(sz-12)+'" y="'+(O-4)+'" font-size="9" fill="#888">x</text>';
  s+='<text x="'+(O+4)+'" y="14" font-size="9" fill="#888">y</text>';
  return s+'</svg>';
}
function eqStr(m,b){var s='y='+(m===1?'x':m===-1?'-x':m+'x');if(b>0)s+='+'+b;else if(b<0)s+='-'+(-b);return s;}
function build(){
  var probs='',answs='',ITEMS=[];
  for(var i=0;i<8;i++){
    var m=nz(-3,3), b=rnd(-4,4), n=i+1;
    var eq=eqStr(m,b);
    probs+='<div class="q"><div class="qL"><div><span class="qn">'+n+'.</span><span class="qm">$'+eq+'$</span></div>'
      +'<table class="tbl"><tr><td>x</td><td>-1</td><td>0</td><td>1</td><td>2</td></tr><tr><td>y</td><td></td><td></td><td></td><td></td></tr></table>'
      +'<div class="ans2">налуу m:<span class="bl"></span> огтлол b:<span class="bl"></span></div></div>'
      +'<div>'+gridSVG()+'</div></div>';
    answs+='<div class="a"><span class="an">'+n+'.</span><span>$'+eq+'$ → $m='+m+',\\ b='+b+'$</span></div>';
    ITEMS.push({q:eq,a:'m='+m+',\\ b='+b});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Шулууны график</h1><div class="sub">Хүснэгтийг бөглөж, шулууныг сүлжээнд зур, налуу m ба огтлол b-г ол · 8 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$y=mx+b$ — $m$ нь <b>налуу</b>, $b$ нь <b>y тэнхлэгийн огтлол</b> ($x=0$ үеийн y)</div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+answs+'</div></div>';
  toggleAns();
  window.WS_ITEMS=ITEMS; window.WS_TITLE='Шулууны график';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=5"></script>
</body>
</html>
