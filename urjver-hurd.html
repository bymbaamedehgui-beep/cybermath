<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Үржвэрийн хүрд — цээжлэх</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#16241c;--soft:#5a7064;--line:#cfe0d6;--forest:#13502e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:#e9f1ec;padding:16px;line-height:1.45}
  .bar{max-width:900px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-family:inherit;font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;color:#fff;font-size:.9rem;background:var(--forest)}
  .btn.ghost{background:#fff;color:var(--forest);box-shadow:inset 0 0 0 1.5px var(--line)}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.3)}
  .head{text-align:center;border-bottom:2.5px solid var(--forest);padding-bottom:8px;margin-bottom:10px}
  .head h1{font-size:21px;color:var(--forest);font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}

  /* Пифагорын хүснэгт */
  .pit{border-collapse:collapse;margin:0 auto 14px;font-family:'Roboto Mono',monospace;width:100%}
  .pit td,.pit th{border:1px solid #d6e4dc;text-align:center;width:7.6%;height:30px;font-size:13px;font-weight:700}
  .pit th{background:var(--forest);color:#fff;font-size:13px}
  .pit th.corner{background:#0c3a21}
  .pit .rh{background:var(--forest);color:#fff}
  .pit td.diag{outline:2px solid #13502e;font-weight:800}
  .legend{display:flex;gap:14px;justify-content:center;align-items:center;font-size:11px;color:var(--soft);margin-bottom:16px;flex-wrap:wrap}
  .legend .sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px}

  /* Хүрдний картууд (цээжлэх) */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .card{break-inside:avoid;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .card h3{font-size:13px;font-weight:800;color:#fff;text-align:center;padding:5px;background:var(--forest)}
  .row{display:flex;justify-content:space-between;font-family:'Roboto Mono',monospace;font-size:11.7px;padding:2.5px 9px;border-top:1px solid #eef4f0}
  .row b{color:var(--forest)}
  .tip{margin-top:14px;background:transparent;border-left:3px solid #d9cff5;border-radius:10px;padding:9px 14px;font-size:12px;color:#5a32d6}
  .tip b{color:#5a32d6}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
  <button class="btn ghost" onclick="setN(9)">1–9</button>
  <button class="btn ghost" onclick="setN(12)">1–12</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
// Утга бага → цайвар, их → тод ногоон. Цээжлэхэд өнгө тус болно.
function color(v,max){
  var t=v/max;                       // 0..1
  var l=92-Math.round(t*55);         // 92% → 37% гэрэлтүүлэг
  return 'hsl('+(140)+', 42%, '+l+'%)';
}
function tcolor(v,max){ return v/max>0.45?'#fff':'#16241c'; }

function build(N){
  // Пифагорын хүснэгт
  var max=N*N;
  var h='<table class="pit"><tr><th class="corner">×</th>';
  for(var c=1;c<=N;c++)h+='<th>'+c+'</th>';
  h+='</tr>';
  for(var r=1;r<=N;r++){
    h+='<tr><th class="rh">'+r+'</th>';
    for(var c=1;c<=N;c++){
      var v=r*c, diag=(r===c)?' diag':'';
      h+='<td class="'+diag.trim()+'" style="background:'+color(v,max)+';color:'+tcolor(v,max)+'">'+v+'</td>';
    }
    h+='</tr>';
  }
  h+='</table>';

  var legend='<div class="legend"><span><span class="sw" style="background:'+color(2,max)+'"></span>бага үр дүн</span>'
    +'<span><span class="sw" style="background:'+color(Math.round(max*0.5),max)+'"></span>дунд</span>'
    +'<span><span class="sw" style="background:'+color(max,max)+'"></span>их үр дүн</span>'
    +'<span>◻ диагональ = квадрат тоо (1, 4, 9, 16 …)</span></div>';

  // Цээжлэх картууд: 1..N тус бүрийн хүрд
  var cards='<div class="cards">';
  for(var n=1;n<=N;n++){
    cards+='<div class="card"><h3>'+n+'-ийн хүрд</h3>';
    for(var k=1;k<=N;k++){
      cards+='<div class="row"><span>'+n+' × '+k+'</span><b>'+(n*k)+'</b></div>';
    }
    cards+='</div>';
  }
  cards+='</div>';

  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Үржвэрийн хүрд</h1><div class="sub">Пифагорын хүснэгт ба '+N+' хүртэлх хүрд · цээжлэхэд зориулав</div></div>'
    +h+legend+cards
    +'<div class="tip"><b>Цээжлэх зөвлөмж:</b> хүснэгт нь толин тэгш — <b>'+'a × b = b × a'+'</b> тул нэг талыг л цээжилнэ. '
    +'Диагональ дээрх <b>квадрат тоонуудыг</b> (4, 9, 16, 25, 36 …) эхлээд тогтоо. '
    +'2, 5, 10-ийн хүрд хамгийн амар — тэднээс эхэл, дараа нь 9-ийн хүрд (оронгуудын нийлбэр үргэлж 9).</div>';
}
function setN(n){build(n);}
build(12);
</script>
</body>
</html>
