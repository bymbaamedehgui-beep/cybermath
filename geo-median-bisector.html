<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Гурвалжны медиан ба биссектрис — интерактив</title>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--purple-d:#5a32d6;--ink:#1a1030;--soft:#7c7596;--line:#e7ddff;
        --blue:#2563eb;--green:#16a34a;--orange:#f97316}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:
    radial-gradient(1000px 400px at 12% -6%,#efe7ff 0,rgba(239,231,255,0) 60%),#f1eef8;
    min-height:100vh;padding:16px;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto}
  .back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--purple-d);text-decoration:none;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:.45rem 1rem;font-size:.85rem;margin-bottom:12px}
  .head{text-align:center;margin-bottom:14px}
  .head h1{font-size:1.4rem;color:var(--purple-d);font-weight:900}
  .head p{color:var(--soft);font-size:.9rem;margin-top:3px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px -24px rgba(90,50,214,.6);overflow:hidden}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid #f1ecfb;background:#faf8ff}
  .tg{font-weight:800;font-size:.83rem;border:1.5px solid var(--line);background:#fff;color:var(--purple-d);border-radius:999px;padding:.45rem .9rem;cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:6px}
  .tg .dot{width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.35}
  .tg.on .dot{opacity:1}
  .tg.blue.on{background:#eaf1ff;color:var(--blue);border-color:#bcd2ff}
  .tg.green.on{background:#e6f7ec;color:var(--green);border-color:#b3e6c6}
  .tg.reset{margin-left:auto;color:#b3261e}
  svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;background:
    linear-gradient(#f6f3ff 1px,transparent 1px) 0 0/22px 22px,
    linear-gradient(90deg,#f6f3ff 1px,transparent 1px) 0 0/22px 22px,#fff}
  .vtx{cursor:grab}.vtx:active{cursor:grabbing}
  .readout{padding:13px 15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;font-size:.86rem}
  .ro{background:#f7f4ff;border-radius:10px;padding:8px 11px}
  .ro b{color:var(--purple-d)} .ro .v{font-weight:800;font-size:1rem}
  .ro.blue{background:#eef4ff}.ro.blue b{color:var(--blue)}
  .ro.green{background:#eafaf0}.ro.green b{color:var(--green)}
  .hint{text-align:center;color:var(--soft);font-size:.82rem;margin-top:10px}
  .prop{background:#fff7e6;border:1px solid #f3dca6;border-radius:10px;padding:9px 12px;margin:12px 15px 0;font-size:.85rem;color:#9a6300}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/worksheets.html">← Дасгалын төв</a>
  <div class="head">
    <h1>Гурвалжны медиан ба биссектрис</h1>
    <p>Оройг <b>чирж</b> хөдөлгөөд чанарууд хэрхэн хадгалагдахыг ажигла</p>
  </div>
  <div class="panel">
    <div class="toolbar">
      <button class="tg blue on" id="tgMed"><span class="dot"></span>Медиан ба төвийн цэг G</button>
      <button class="tg green" id="tgBis"><span class="dot"></span>Биссектрис ба багтсан тойрог</button>
      <button class="tg reset" id="tgReset">↺ Дахин</button>
    </div>
    <svg id="stage" viewBox="0 0 440 360" aria-label="Гурвалжин"></svg>
    <div class="prop" id="prop"></div>
    <div class="readout" id="readout"></div>
  </div>
  <div class="hint">💡 A, B, C оройнуудыг чирнэ үү · компьютер болон гар утсанд ажиллана</div>
</div>

<script>
var VBW=440,VBH=360;
var svg=document.getElementById('stage');
var P={A:{x:220,y:64},B:{x:80,y:290},C:{x:360,y:288}};
var show={med:true,bis:false};

function sub(u,v){return {x:u.x-v.x,y:u.y-v.y};}
function dist(u,v){return Math.hypot(u.x-v.x,u.y-v.y);}
function mid(u,v){return {x:(u.x+v.x)/2,y:(u.y+v.y)/2};}
function fmt(n){return (Math.round(n*10)/10).toFixed(1);}

function centroid(){return {x:(P.A.x+P.B.x+P.C.x)/3,y:(P.A.y+P.B.y+P.C.y)/3};}
function incenter(){
  var a=dist(P.B,P.C),b=dist(P.C,P.A),c=dist(P.A,P.B),s=a+b+c;
  return {x:(a*P.A.x+b*P.B.x+c*P.C.x)/s,y:(a*P.A.y+b*P.B.y+c*P.C.y)/s,a:a,b:b,c:c};
}
function inradius(I){
  var s=(I.a+I.b+I.c)/2;
  var area=Math.abs((P.B.x-P.A.x)*(P.C.y-P.A.y)-(P.C.x-P.A.x)*(P.B.y-P.A.y))/2;
  return area/s;
}
function bisFoot(V,U,W){ // V оройгоос эсрэг талын U-W хэрчим дээрх биссектрисийн хөл
  var u=dist(V,W),w=dist(V,U),t=w/(w+u); // BD:DC = AB:AC
  return {x:U.x+(W.x-U.x)*t,y:U.y+(W.y-U.y)*t};
}

function L(x1,y1,x2,y2,color,w,dash){
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="'+(w||2)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+' stroke-linecap="round"/>';
}
function dot(p,r,fill,stroke){return '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="2"':'')+'/>';}
function txt(p,s,color,dx,dy){return '<text x="'+(p.x+(dx||0))+'" y="'+(p.y+(dy||0))+'" fill="'+color+'" font-size="15" font-weight="800" font-family="Segoe UI,Arial">'+s+'</text>';}

function draw(){
  var g='';
  // талбай (гурвалжин)
  g+='<polygon points="'+P.A.x+','+P.A.y+' '+P.B.x+','+P.B.y+' '+P.C.x+','+P.C.y+'" fill="rgba(123,82,238,.06)" stroke="#5a32d6" stroke-width="2.4" stroke-linejoin="round"/>';

  var ro='',prop='';
  if(show.bis){
    var I=incenter(),r=inradius(I);
    g+='<circle cx="'+I.x+'" cy="'+I.y+'" r="'+r+'" fill="rgba(22,163,74,.10)" stroke="'+'#16a34a'+'" stroke-width="1.6" stroke-dasharray="4 3"/>';
    g+=L(P.A.x,P.A.y,bisFoot(P.A,P.B,P.C).x,bisFoot(P.A,P.B,P.C).y,'#16a34a',1.8,'6 4');
    g+=L(P.B.x,P.B.y,bisFoot(P.B,P.C,P.A).x,bisFoot(P.B,P.C,P.A).y,'#16a34a',1.8,'6 4');
    g+=L(P.C.x,P.C.y,bisFoot(P.C,P.A,P.B).x,bisFoot(P.C,P.A,P.B).y,'#16a34a',1.8,'6 4');
    g+=dot(I,5,'#16a34a')+txt(I,'I','#16a34a',9,5);
    ro+='<div class="ro green"><b>Багтсан тойргийн радиус r</b><div class="v">'+fmt(r)+'</div></div>';
    prop='🟢 <b>Биссектрисүүд нэг цэг I-д огтлолцоно.</b> I цэг гурван талаас ижил зайтай тул багтсан тойргийн төв болно.';
  }
  if(show.med){
    var Ma=mid(P.B,P.C),Mb=mid(P.C,P.A),Mc=mid(P.A,P.B),G=centroid();
    g+=L(P.A.x,P.A.y,Ma.x,Ma.y,'#2563eb',1.8,'6 4');
    g+=L(P.B.x,P.B.y,Mb.x,Mb.y,'#2563eb',1.8,'6 4');
    g+=L(P.C.x,P.C.y,Mc.x,Mc.y,'#2563eb',1.8,'6 4');
    g+=dot(Ma,3.5,'#2563eb')+dot(Mb,3.5,'#2563eb')+dot(Mc,3.5,'#2563eb');
    g+=dot(G,6,'#f97316','#fff')+txt(G,'G','#b45309',9,5);
    var ratio=dist(P.A,G)/dist(G,Ma);
    ro+='<div class="ro blue"><b>AG : GMₐ харьцаа</b><div class="v">'+fmt(ratio)+' : 1</div></div>';
    if(!prop)prop='🔵 <b>Медианууд нэг цэг G-д огтлолцоно.</b> G нь медиан бүрийг оройноос эхлэн <b>2 : 1</b> харьцаагаар хуваана.';
  }

  // оройнууд (чирэгддэг) — хамгийн дээр
  ['A','B','C'].forEach(function(k){
    g+='<circle class="vtx" data-pt="'+k+'" cx="'+P[k].x+'" cy="'+P[k].y+'" r="16" fill="transparent"/>';
    g+=dot(P[k],8,'#fff','#5a32d6');
  });
  g+=txt(P.A,'A','#5a32d6',-6,-14)+txt(P.B,'B','#5a32d6',-20,6)+txt(P.C,'C','#5a32d6',12,6);

  // талын урт
  var a=dist(P.B,P.C),b=dist(P.C,P.A),c=dist(P.A,P.B);
  ro+='<div class="ro"><b>Талууд (a·b·c)</b><div class="v" style="font-size:.9rem">'+fmt(a)+' · '+fmt(b)+' · '+fmt(c)+'</div></div>';

  svg.innerHTML=g;
  document.getElementById('readout').innerHTML=ro;
  document.getElementById('prop').innerHTML=prop;
}

/* ---- drag ---- */
function toSvg(e){var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var p=pt.matrixTransform(svg.getScreenCTM().inverse());return {x:p.x,y:p.y};}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
var drag=null;
svg.addEventListener('pointerdown',function(e){
  var t=e.target.closest('[data-pt]'); if(!t)return;
  drag=t.getAttribute('data-pt'); try{svg.setPointerCapture(e.pointerId);}catch(_){}
});
svg.addEventListener('pointermove',function(e){
  if(!drag)return; e.preventDefault();
  var p=toSvg(e);
  P[drag]={x:clamp(p.x,16,VBW-16),y:clamp(p.y,16,VBH-16)};
  draw();
});
function endDrag(){drag=null;}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);

/* ---- toggles ---- */
document.getElementById('tgMed').addEventListener('click',function(){show.med=!show.med;this.classList.toggle('on',show.med);draw();});
document.getElementById('tgBis').addEventListener('click',function(){show.bis=!show.bis;this.classList.toggle('on',show.bis);draw();});
document.getElementById('tgReset').addEventListener('click',function(){P={A:{x:220,y:64},B:{x:80,y:290},C:{x:360,y:288}};draw();});

draw();
</script>
</body>
</html>
