<style>

<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}

var OL=['А','Б','В','Г'];
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){var t=a%b;a=b;b=t;}return a;}

function lineEq(m,c){if(m.p===0)return 'y='+c;var ms;if(m.q===1){ms=(m.p===1?'':(m.p===-1?'-':''+m.p));}else{ms=(m.p<0?'-':'')+'\\tfrac{'+Math.abs(m.p)+'}{'+m.q+'}';}var t='y='+ms+'x';if(c>0)t+='+'+c;else if(c<0)t+='-'+Math.abs(c);return t;}
function lineK(m){var ms;if(m.q===1){ms=(m.p===1?'':(m.p===-1?'-':''+m.p));}else{ms=(m.p<0?'-':'')+'\\tfrac{'+Math.abs(m.p)+'}{'+m.q+'}';}return 'y='+ms+'x';}
function coefT(c){return c===1?'t':(c===-1?'-t':(c+'t'));}
function fmtT(co,v){if(co===0)return '';var s=co>0?'+':'-',m=Math.abs(co);return s+(m===1?'':''+m)+v;}

// ── MCQ (утга-сигнатураар давхцалгүй) ──
function finishMC(opts){var sh=shuffle(opts),ci=-1;for(var i=0;i<sh.length;i++)if(sh[i].ok)ci=i;return {opts:sh,correct:ci};}

function makeMC(cor,distr){

  var opts=[{tex:cor.t,ok:true}],used=[cor.t];

// ── Тест генераторууд (4.1–4.4) ──
// 4.1 Хоёр цэгийн зай
function tDist(){var x1=rnd(-7,7),y1=rnd(-7,7),x2=rnd(-7,7),y2=rnd(-7,7);if(x1===x2&&y1===y2)return null;var dx=x2-x1,dy=y2-y1,N=dx*dx+dy*dy,s2=Math.abs(dx)+Math.abs(dy);

  var cor=simpRad(N);
  var mc=makeMC(C('|AB|='+cor.tex,cor.val),[C('|AB|='+N,N),C('|AB|='+s2,s2),C('|AB|='+simpRad(2*N).tex,Math.sqrt(2*N)),C('|AB|='+simpRad(N+4).tex,Math.sqrt(N+4))]);

// 4.1 Хэрчмийн дундаж цэг
function tMid(){var x1=rnd(-8,8),x2=rnd(-8,8);if((x1+x2)%2)return null;var y1=rnd(-8,8),y2=rnd(-8,8);if((y1+y2)%2)return null;if(x1===x2&&y1===y2)return null;

  var mc=makeMC(C(pt2(mx,my),enc(mx,my)),[C(pt2((x2-x1)/2,(y2-y1)/2),enc((x2-x1)/2,(y2-y1)/2)),C(pt2(x1+x2,y1+y2),enc(x1+x2,y1+y2)),C(pt2(my,mx),enc(my,mx)),C(pt2(mx,my+1),enc(mx,my+1))]);

// 4.1 Гурвалжны талбай
function tArea(){var ax=rnd(-6,6),ay=rnd(-6,6),bx=rnd(-6,6),by=rnd(-6,6),cx=rnd(-6,6),cy=rnd(-6,6);var D=ax*(by-cy)+bx*(cy-ay)+cx*(ay-by);if(D===0)return null;var A=Math.abs(D);if(A>36)return null;

  var c0=ht(A),d1=ht(2*A),d2=ht(A+2),d3=ht(A>2?A-2:A+4),d4=ht(A+4);

// 4.2 Хоёр цэгээр налалт
function tSlope(){var x1=rnd(-7,7),y1=rnd(-7,7),x2=rnd(-7,7),y2=rnd(-7,7);if(x1===x2||y1===y2)return null;var m=frac(y2-y1,x2-x1);if(Math.abs(m.p)>12)return null;

  var inv=frac(x2-x1,y2-y1),neg=frac(-(y2-y1),x2-x1),num=frac(y2-y1,1);
  var mc=makeMC(C('m='+frTex(m),m.p/m.q),[C('m='+frTex(neg),neg.p/neg.q),C('m='+frTex(inv),inv.p/inv.q),C('m='+frTex(num),num.p),C('m='+frTex(frac(y2-y1+(y2>y1?1:-1),x2-x1)),(y2-y1+(y2>y1?1:-1))/(x2-x1))]);

// 4.3 ax+by+c=0 → налалт
function tSlopeEq(){var q=pick([1,1,2,3]),p=nz(-4,4);if(gcd(Math.abs(p),q)!==1)return null;var k=rnd(-5,5),a=p,b=-q,c=q*k;if(rnd(0,1)){a=-a;b=-b;c=-c;}var eq=fmtT(a,'x')+fmtT(b,'y')+fmtC(c);if(eq.charAt(0)==='+')eq=eq.slice(1);eq+='=0';var m=frac(p,q);
  var stem='$'+eq+'$ шулууны налалт:';
  var mc=makeMC(C('m='+frTex(m),m.p/m.q),[C('m='+frTex(frac(-p,q)),-p/q),C('m='+frTex(frac(q,p)),q/p),C('m='+frTex(frac(-q,p)),-q/p),C('m='+frTex(frac(p+(p>0?1:-1),q)),(p+(p>0?1:-1))/q)]);
  if(!mc)return null;return {stem:stem,mc:mc};}
// 4.3 Хоёр цэгээр шулууны тэгшитгэл
function tLineEq(){var q=pick([1,1,2]),p=nz(-4,4);if(gcd(Math.abs(p),q)!==1)return null;var kx=nz(-3,3),x1=q*kx,y1=rnd(-5,5),x2=x1+q,y2=y1+p,m=frac(p,q),c=y1-p*kx;if(c===0)return null;if(Math.abs(x1)>8||Math.abs(x2)>8||Math.abs(c)>10)return null;
  var stem='$A('+x1+',\\ '+y1+'),\\ B('+x2+',\\ '+y2+')$ цэгүүдийг дайрсан шулууны тэгшитгэл:';
  var mv=m.p/m.q;
  var mc=makeMC(C(lineEq(m,c),mv*1000+c),[C(lineEq(frac(-p,q),c),-mv*1000+c),C(lineEq(m,-c),mv*1000-c),C(lineEq(m,c+1),mv*1000+c+1),C(lineEq(frac(-p,q),-c),-mv*1000-c)]);

// 4.3 ax+by+c=0 → Oy огтлол
function tYIntercept(){var q=pick([1,1,2,3]),p=nz(-4,4);if(gcd(Math.abs(p),q)!==1)return null;var k=nz(-5,5),a=p,b=-q,c=q*k;if(rnd(0,1)){a=-a;b=-b;c=-c;}var eq=fmtT(a,'x')+fmtT(b,'y')+fmtC(c);if(eq.charAt(0)==='+')eq=eq.slice(1);eq+='=0';

// 4.3 Тэнхлэгтэй параллел шулууны тэгшитгэл
function tAxisLine(){if(rnd(0,1)){var a=nz(-6,6),y1=rnd(-7,7),y2=rnd(-7,7);if(y1===y2)return null;
    var stem='$A('+a+',\\ '+y1+'),\\ B('+a+',\\ '+y2+')$ цэгүүдийг дайрсан шулууны тэгшитгэл:';

  var b=nz(-6,6),x1=rnd(-7,7),x2=rnd(-7,7);if(x1===x2)return null;
  var stem2='$A('+x1+',\\ '+b+'),\\ B('+x2+',\\ '+b+')$ цэгүүдийг дайрсан шулууны тэгшитгэл:';
  var mc2=makeMC(C('y='+b,1000+b),[C('x='+b,b),C('y='+(-b),1000-b),C('x='+x1,x1),C('y='+(b>0?b-1:b+1),1000+(b>0?b-1:b+1))]);

// 4.4 Тойргийн тэгшитгэл (радиус / цэгээр)
function tCircleEq(){if(rnd(0,1)){var t=rnd(0,1),rtex,rsq;if(t===0){var r=rnd(2,9);rtex=''+r;rsq=r*r;}else{var n=pick([2,3,5,6,7,10,11,13]);rtex='\\sqrt{'+n+'}';rsq=n;}

    var mc=makeMC(C('x^2+y^2='+rsq,rsq),[C('x^2+y^2='+(t===0?(+rtex):rsq*rsq),t===0?(+rtex):rsq*rsq),C('x^2+y^2='+(2*rsq),2*rsq),C('x^2+y^2='+(rsq+ (t===0?(+rtex):1)),rsq+(t===0?(+rtex):1)),C('x^2-y^2='+rsq,rsq+0.3)]);

// 4.4 Тэгшитгэлээс радиус
function tCircleRadius(){if(rnd(0,1)){var R=pick([4,9,16,25,36,49]),r=Math.round(Math.sqrt(R));

// 10 ялгаатай төрөл — 4.1(×3) · 4.2(×2) · 4.3(×3) · 4.4(×2)
var TESTS=[tDist,tSlope,tMid,tLineEq,tSlopeEq,tArea,tYIntercept,tCircleEq,tAxisLine,tCircleRadius];
// ── Задгай даалгавар (4.1–4.4) ──
function free1(){var ax=rnd(-6,6),ay=rnd(-6,6),bx=rnd(-6,6),by=rnd(-6,6),cx=rnd(-6,6),cy=rnd(-6,6);var D=ax*(by-cy)+bx*(cy-ay)+cx*(ay-by);if(D===0)return null;var A=Math.abs(D);if(A>36)return null;var N=(bx-ax)*(bx-ax)+(by-ay)*(by-ay);if(N===0)return null;
  var areaTex=(A%2===0)?(''+(A/2)):('\\tfrac{'+A+'}{2}');
  return {stem:'$A('+ax+',\\ '+ay+'),\\ B('+bx+',\\ '+by+'),\\ C('+cx+',\\ '+cy+')$ гурвалжны талбай ба $AB$ талын уртыг ол.',a:'S='+areaTex+',\\ \\ |AB|='+simpRad(N).tex};}
function free2(){var t0=nz(-6,6),c1=nz(-4,4),c2=nz(-4,4);if(c1===c2)return null;var y1=rnd(-8,8),y2=rnd(-8,8);if(y1===y2)return null;var m=frac(y2-y1,(c2-c1)*t0);if(Math.abs(m.p)>16||m.q>16)return null;
  return {stem:'Налалт нь $m='+frTex(m)+'$ бүхий шулуун $('+coefT(c1)+',\\ '+y1+')$ ба $('+coefT(c2)+',\\ '+y2+')$ цэгүүдийг дайрдаг бол $t$-г ол.',a:'t='+t0};}
function free3(){var q=pick([1,2,3]),p=nz(-4,4);if(gcd(Math.abs(p),q)!==1)return null;var kx=nz(-3,3),x1=q*kx,y1=rnd(-6,6),x2=x1+q,y2=y1+p,m=frac(p,q),c=y1-p*kx;if(Math.abs(x1)>9||Math.abs(x2)>9||Math.abs(c)>12)return null;
  return {stem:'$A('+x1+',\\ '+y1+')$ ба $B('+x2+',\\ '+y2+')$ цэгүүдийг дайрсан шулууны тэгшитгэлийг $y=mx+c$ хэлбэрээр бич.',a:lineEq(m,c)};}
function free4(){var m=pick([-3,-2,2,3]),k=nz(-4,4),r2=pick([10,13,20,25,26,29]);if(k*k/(m*m+1)>=r2)return null;var slope=frac(-1,m);var line='y='+(m===1?'':(m===-1?'-':''+m))+'x'+(k>0?'+'+k:'-'+Math.abs(k));
  return {stem:'$'+line+'$ шулуун $x^2+y^2='+r2+'$ тойргийг $A,B$ цэгээр огтолно. $AB$ хөвчийн дундаж цэг ба тойргийн төвийг дайрсан шулууны тэгшитгэлийг ол.',a:lineK(slope)};}
var FREE=[free1,free2,free3,free4];
var TEST_PT=1,FREE_PT=[2,2,3,3],ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];

function adjustOpts(){[].forEach.call(document.querySelectorAll('#sheet .opts'),function(op){op.classList.remove('two');var cells=op.children;if(!cells.length)return;var cellW=cells[0].clientWidth,need2=false;[].forEach.call(cells,function(o){var prev=o.getAttribute('style')||'';o.style.position='absolute';o.style.whiteSpace='nowrap';o.style.width='auto';o.style.visibility='hidden';var w=o.offsetWidth;o.setAttribute('style',prev);if(w>cellW+1)need2=true;});if(need2)op.classList.add('two');});}
function gen(fn){for(var t=0;t<250;t++){var g=fn();if(g)return g;}return null;}
function build(){

    var opts=g.mc.opts.map(function(o,j){return '<div class="opt"><span class="ol">'+OL[j]+'.</span>$'+o.tex+'$</div>';}).join('');

  var gFree='<table class="gtbl"><tr><th>Задгай</th>'+FREE_PT.map(function(_,i){return '<td class="lab">2.'+(i+1)+'</td>';}).join('')+'</tr><tr><th>Оноо</th>'+FREE_PT.map(function(){return '<td></td>';}).join('')+'</tr></table>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>IV бүлэг — Шалгалтын материал</h1><div class="sub">Координатын арга: зай · дундаж · налалт · шулууны тэгшитгэл · тойрог · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Хугацаа: </span><div class="score-top">Хувилбар: <b class="varv" contenteditable="true" data-ph="А"></b> · Оноо: <b class="totmax">'+TOTAL+'</b></div></div>'
    +'<div class="task">I. Сонголттой тест. Зөв хариуг сонгоно уу. (1–10)</div>'+testHtml
    +'<div class="task">II. Задгай даалгавар. Бодолтоо дэлгэрэнгүй бичнэ үү. (11–14)</div>'+freeHtml
    +'<div class="grade"><div class="gtitle">Багшийн засах хүснэгт — авсан оноо</div>'+gRoman+gFree+'<div class="gtot">Нийт авсан оноо: <u></u> / <b class="totmax">'+TOTAL+'</b> оноо</div></div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ak"><span class="n">Тест:</span> '+akTest+'</div><div style="height:6px"></div><div class="ak" style="font-weight:800;color:#5a32d6">Задгай даалгавар:</div>'+akFree+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='IV бүлэг — Шалгалтын материал (10-р анги)';
  [].forEach.call(document.querySelectorAll('#sheet .ptv'),function(el){el.addEventListener('input',recomputeTotal);el.addEventListener('focus',function(){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);});});
  recomputeTotal();toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}

}
var VLET=['А','Б','В','Г','Д','Е','Ё','Ж','З','И','Й','К','Л','М','Н','О'];
function hugSpan(){return [].filter.call(document.querySelectorAll('#sheet .meta > span'),function(s){return /Хугацаа/.test(s.textContent);})[0]||null;}
function getHug(){var sp=hugSpan();if(!sp)return '';var f=sp.querySelector('.cm-fill');return ((f?f.textContent:sp.textContent.replace(/^[^:]*:?\s*/,''))||'').trim();}
function hugFill(){var sp=hugSpan();return sp?sp.querySelector('.cm-fill'):null;}
function snapPts(){return [].map.call(document.querySelectorAll('#sheet .ptv'),function(e){return e.textContent;});}
function injectVBatchCSS(){if(document.getElementById('cm-vbatch-css'))return;var st=document.createElement('style');st.id='cm-vbatch-css';st.textContent='@media print{body>*:not(#cm-vbatch){display:none!important}body>#cm-vbatch{display:block!important}.cm-vsheet{page-break-after:always;box-shadow:none!important;width:auto!important;min-height:auto!important;margin:0!important;padding:0!important;background:#fff;zoom:1!important}.cm-vsheet:last-child{page-break-after:auto}}';document.head.appendChild(st);}
function openVariantModal(){if(document.getElementById('cm-vmodal'))return;var o=document.createElement('div');o.id='cm-vmodal';o.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(20,15,40,.6);display:grid;place-items:center;padding:16px;font-family:"Segoe UI",Arial,sans-serif';
  o.innerHTML='<div style="background:#fff;border-radius:16px;max-width:410px;width:100%;padding:20px;box-shadow:0 24px 60px -18px rgba(0,0,0,.5)"><div style="font-weight:900;color:#5a32d6;font-size:1.06rem;margin-bottom:4px">Олон хувилбар гаргах</div><p style="color:#7a7390;font-size:.84rem;margin-bottom:12px;line-height:1.45">Одоогийн <b>загвараас</b> хэдэн хувилбар гаргах вэ? Бодлого нь өөр, харин <b>Хугацаа ба оноо хэвээр</b>. Хувилбар <b>А, Б, В…</b> автоматаар тавигдана. Төгсгөлд нь хариун түлхүүр гарна.</p><label style="display:block;font-size:.85rem;font-weight:700;color:#3a2d5e;margin-bottom:5px">Хувилбарын тоо</label><input id="cm-vcount" type="number" min="1" max="16" value="4" style="width:100%;box-sizing:border-box;border:1.6px solid #e7ddff;border-radius:10px;padding:.55rem .8rem;font-size:1rem;font-weight:700;outline:none;font-family:inherit;margin-bottom:14px"><div id="cm-vmsg" style="font-size:.82rem;color:#7a7390;margin-bottom:8px"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button id="cm-vcancel" style="border:1.4px solid #e7ddff;background:#faf7ff;color:#5a32d6;font-weight:800;border-radius:999px;padding:.5rem 1rem;cursor:pointer;font-family:inherit">Болих</button><button id="cm-vgo" style="border:0;background:linear-gradient(135deg,#7B52EE,#A855F7);color:#fff;font-weight:800;border-radius:999px;padding:.5rem 1.2rem;cursor:pointer;font-family:inherit">Гаргаж хэвлэх</button></div></div>';
  document.body.appendChild(o);var ci=o.querySelector('#cm-vcount');try{ci.focus();ci.select();}catch(e){}o.querySelector('#cm-vcancel').onclick=function(){o.remove();};o.querySelector('#cm-vgo').onclick=function(){var n=parseInt(ci.value,10);if(!n||n<1){o.querySelector('#cm-vmsg').style.color='#dc2626';o.querySelector('#cm-vmsg').textContent='Хувилбарын тоог зөв оруулна уу.';return;}o.remove();genVariants(n);};}
function genVariants(N){if(!N||N<1)return;if(N>16)N=16;var sheet=document.getElementById('sheet'),hug=getHug(),pts=snapPts(),sa=document.getElementById('sa');if(sa&&sa.checked){sa.checked=false;toggleAns();}var old=document.getElementById('cm-vbatch');if(old)old.remove();var box=document.createElement('div');box.id='cm-vbatch';box.style.display='none';var keys=[];
  for(var i=0;i<N;i++){build();try{if(window.cmApplyEdits)window.cmApplyEdits();}catch(e){}var tk=(window.__TEST||[]).map(function(g,idx){return (idx+1)+'-'+OL[g.mc.correct];}).join(', ');var fk=(window.__FREE||[]).map(function(f,idx){return {n:11+idx,a:f.a};});var clone=sheet.cloneNode(true);clone.removeAttribute('id');clone.classList.add('cm-vsheet');[].forEach.call(clone.querySelectorAll('.cm-ed'),function(e){e.removeAttribute('contenteditable');});var ap=clone.querySelector('#answers,.ans-page');if(ap)ap.parentNode.removeChild(ap);var cptv=clone.querySelectorAll('.ptv'),tot=0;for(var k=0;k<cptv.length;k++){if(pts[k]!=null)cptv[k].textContent=pts[k];var v=parseFloat((cptv[k].textContent||'').replace(',','.'));if(!isNaN(v))tot+=v;cptv[k].removeAttribute('contenteditable');}[].forEach.call(clone.querySelectorAll('.totmax'),function(e){e.textContent=ptFmt(tot);});var hs=[].filter.call(clone.querySelectorAll('.meta > span'),function(s){return /Хугацаа/.test(s.textContent);})[0];if(hs)hs.textContent='Хугацаа: '+hug;var vv=clone.querySelector('.varv');if(vv){vv.textContent=VLET[i]||('#'+(i+1));vv.removeAttribute('contenteditable');}box.appendChild(clone);keys.push({letter:VLET[i]||('#'+(i+1)),tk:tk,fk:fk});}
  var keyHtml='<div class="sheet cm-vsheet"><div class="head"><h1>Хариун түлхүүр — бүх хувилбар</h1><div class="sub">IV бүлэг — Шалгалтын материал · 10-р анги</div></div>';keys.forEach(function(kr){keyHtml+='<div style="margin:9px 0;break-inside:avoid;border-left:3px solid #A855F7;padding-left:9px"><div style="font-weight:800;color:#5a32d6;font-size:13.5px;margin-bottom:3px">Хувилбар '+kr.letter+'</div><div style="font-size:12px;margin-bottom:3px"><b>Тест:</b> '+kr.tk+'</div><div style="font-size:12px"><b>Задгай:</b> '+kr.fk.map(function(x){return x.n+') $'+x.a+'$';}).join(' &nbsp;·&nbsp; ')+'</div></div>';});keyHtml+='</div>';box.insertAdjacentHTML('beforeend',keyHtml);document.body.appendChild(box);injectVBatchCSS();
  try{renderMathInElement(box,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  function cleanup(){var b=document.getElementById('cm-vbatch');if(b)b.remove();window.removeEventListener('afterprint',cleanup);try{build();}catch(e){}var pv=document.querySelectorAll('#sheet .ptv');for(var k=0;k<pv.length;k++){if(pts[k]!=null)pv[k].textContent=pts[k];}try{recomputeTotal();}catch(e){}setTimeout(function(){var f=hugFill();if(f&&hug)f.textContent=hug;},80);}
  window.addEventListener('afterprint',cleanup);setTimeout(function(){window.print();},140);}
build();
