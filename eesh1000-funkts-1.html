<script>
/* ЭЕШ 1000 — Функц ба график-1 — ЭЕШ-ийн 1000 бодлого, агуулгаар: Харгалзаа, муж ба дүр, урвуу функц, квадрат ба бутархай функц, параметрт муруй.
   Эх: 1.20, 1.71, 1.83, 3.61, 3.87, 1.95, 2.94, 1.100, 2.10, 2.11, 2.12, 2.15, 4.45, 4.9 (хэсэг.бодлого). Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. */

/* 1.20 */
var e1_20 = (function () {
// 20. Функц болох харгалзааг дүрслэх: хоёр зууван (олонлог), зүүн олонлогийн элемент бүрээс яг нэг сум.
//     Хариу — санамсаргүй нэг зөв харгалзаа (жишээ).
var p20_L = [[1, 2, 3], [1, 2, 3], [-1, 0, 1], [-1, 0, 2], [0, 1, 2], [2, 4, 6], [1, 3, 5], [1, 2, 3, 4], [2, 4, 6, 8],
  [-2, -1, 0, 1], [0, 1, 4], [1, 4, 9], [3, 5, 7], [-1, 1, 3], [0, 2, 4], [5, 6, 7]];
var p20_R = [['a', 'b', 'c'], ['a', 'b', 'c'], ['a', 'b', 'c', 'd'], ['a', 'b'], ['p', 'q', 'r'], ['p', 'q'], ['a', 'b', 'c', 'd']];
function p20() {
  var L = pick(p20_L), R = pick(p20_R), map = L.map(function () { return pick(R); });
  var rx = 1.28, D = 3.9, sp = 0.75, ry = Math.max(L.length, R.length) === 4 ? 2.2 : 1.95;
  var f = Fig({ w: 230 });
  f.ext([-rx, -ry]).ext([D + rx, ry]);
  f.raw(function (T) {
    return [0, D].map(function (cx) {
      return '<ellipse cx="' + (+T.X(cx).toFixed(2)) + '" cy="' + (+T.Y(0).toFixed(2)) + '" rx="' + (+(rx * T.sx).toFixed(2)) + '" ry="' + (+(ry * T.sy).toFixed(2))
        + '" stroke="#1b1b1b" stroke-width="1.4" fill="none"/>';
    }).join('');
  });
  L.forEach(function (x, i) { var y = ((L.length - 1) / 2 - i) * sp; f.dot([0.42, y], { r: 3 }).text([0.17, y], dec(x), { anchor: 'end', size: 15 }); });
  R.forEach(function (s, i) { var y = ((R.length - 1) / 2 - i) * sp; f.dot([D - 0.48, y], { r: 3 }).text([D - 0.27, y], s, { anchor: 'start', size: 16 }); });
  var ans = 'Жишээ нь: $' + L.map(function (x, i) { return x + '\\to ' + map[i]; }).join(',\\ ') + '$ (зүүн талын элемент бүрээс яг нэг сум)';
  // Бодолт (гар бичмэлд «Өгөгдөл дутуу») — функцийн тодорхойлолтоор; зураг: хариуны жишээ харгалзааг сумаар
  var g = Fig({ w: 230 }), yL = function (i) { return ((L.length - 1) / 2 - i) * sp; }, yR = function (i) { return ((R.length - 1) / 2 - i) * sp; };
  g.ext([-rx, -ry]).ext([D + rx, ry]);
  g.raw(function (T) {
    return [0, D].map(function (cx) {
      return '<ellipse cx="' + (+T.X(cx).toFixed(2)) + '" cy="' + (+T.Y(0).toFixed(2)) + '" rx="' + (+(rx * T.sx).toFixed(2)) + '" ry="' + (+(ry * T.sy).toFixed(2))
        + '" stroke="#1b1b1b" stroke-width="1.4" fill="none"/>';
    }).join('');
  });
  L.forEach(function (x, i) { g.dot([0.42, yL(i)], { r: 3 }).text([0.17, yL(i)], dec(x), { anchor: 'end', size: 15 }); });
  R.forEach(function (s, i) { g.dot([D - 0.48, yR(i)], { r: 3 }).text([D - 0.27, yR(i)], s, { anchor: 'start', size: 16 }); });
  map.forEach(function (s, i) {
    var P1 = [0.42, yL(i)], P2 = [D - 0.48, yR(R.indexOf(s))], dx = P2[0] - P1[0], dy = P2[1] - P1[1], l = Math.sqrt(dx * dx + dy * dy);
    g.arrow([P1[0] + 0.13 * dx / l, P1[1] + 0.13 * dy / l], [P2[0] - 0.15 * dx / l, P2[1] - 0.15 * dy / l], { w: 1.3, h: 8 });
  });
  var sL = '$\\{' + L.join(',\\,') + '\\}$', sR = '$\\{' + R.join(',\\,') + '\\}$';
  return { q: 'Функц болох харгалзааг дүрслээрэй. (Энд $' + R.join(',') + '$ бодит тоо)', a: ans, fig: f.svg(), wk: 25,
    s: [
      'Функцийн тодорхойлолт: $X$ олонлогийн элемент бүрт $Y$ олонлогийн яг нэг элементийг харгалзуулсан харгалзааг функц гэнэ.',
      'Иймд ' + sL + ' олонлогийн элемент бүрээс ' + sR + ' олонлогийн аль нэг элемент рүү яг нэг сум татна. Нэг элементээс хоёр сум гарах, эсвэл сумгүй элемент үлдэх нь болохгүй. '
        + 'Харин баруун олонлогийн нэг элемент рүү хэд хэдэн сум орж болох ба сум ороогүй элемент байж болно.',
      'Ийм харгалзааны нэг жишээг зурагт үзүүлэв.'
    ],
    sfig: g.svg(),
    t: { L: L, R: R } };
}
return p20;
})();

/* 1.71 */
var e1_71 = (function () {
// 71. f(x) = kx² (0 ≤ x ≤ p), mx + c (p < x ≤ q), тасралтгүй: c = kp² − mp.
//     [0; p] дээр утга [0; kp²]; (p; q] дээр шулуун kp²-ээс f(q) хүртэл ⇒ E(f) = [0; max(kp², f(q))]  (f(q) ≥ 0).
function p71() {
  var k = pick([[1, 2], [1, 2], [1, 1], [1, 4]]), p = rnd(1, 3), m = pick([[1, 2], [1, 1], [-1, 2], [-1, 1], [2, 1], [3, 2]]);
  var q = rnd(Math.max(p + 2, 4), 7), K = k[0] / k[1], Mv = m[0] / m[1];
  var top = K * p * p, fq = top + Mv * (q - p);
  if (top < 0.9 || top > 5 || fq > 6.5 || fq < 0 || (fq > 0 && fq < 0.4)) return null;
  // c = kp² − mp (бутархай): нийтлэг хуваарь
  var cd = k[1] * m[1], cn = k[0] * p * p * m[1] - m[0] * p * k[1];
  var lo = Math.min(0, fq), hi = Math.max(top, fq);
  var frq = function (x) { return fr(Math.round(x * 4 * cd), 4 * cd); };
  var fx = function (x) { return x <= p ? K * x * x : Mv * x + cn / cd; };
  // Зураг (тэнхлэгийн масштаб ижил, y тэнхлэгт тоо бичихгүй — эх шиг)
  var Y0 = Math.min(0, fq) - 0.6, Y1 = Math.max(top, fq) + 0.9;
  var f = Fig({ view: [-0.7, q + 0.8, Y0, Y1], w: 260, h: 230 }), tx = [];
  for (var i = 1; i <= q; i++) tx.push(i);
  f.axes({ o: '0' }).ticks(tx, [], { size: 11, len: 3 }).curve(fx, 0, q, { w: 1.8 }, 400);
  var xl = q - 0.55, up = Mv > 0;
  f.text([xl, fx(xl)], 'f(x)', { pos: up ? 'nw' : 'ne', size: 13, off: 8 });
  // Бодолт (гар бичмэл): [0; p] дээр kx² өсөж 0 → kp²; (p; q] дээр шулуун kp²-ээс f(q) хүртэл → E(f) = [0; max(kp², f(q))].
  //   Зураг: график + тасархай шугамууд + y тэнхлэг дээр тодруулсан дүр.
  var topT = frq(top), fqT = frq(fq), lin = tm(m, 'x', true) + tm([cn, cd], '', false);
  var mq = (Mv === 1 ? '' : Mv === -1 ? '-' : fr(m[0], m[1]) + '\\cdot ') + q + (cn ? tm([cn, cd], '', false).replace(/\\frac/g, '\\dfrac') : '');
  var hd = 4 * cd, hn = Math.round(hi * hd), hg = gcd(hn, hd);
  hn /= hg; hd /= hg;
  var sg = Fig({ view: [-0.9, q + 0.7, -0.6, hi + 0.8], w: 200, h: 170, padR: 26 });
  sg.axes({ o: '0' }).curve(fx, 0, q, { w: 1.8 }, 300).seg([p, 0], [p, top], { dash: '4 3', w: 1 });
  if (fq) sg.seg([q, 0], [q, fq], { dash: '4 3', w: 1 });
  sg.seg([0, hi], [up ? q : p, hi], { dash: '4 3', w: 1 }).seg([0, 0], [0, hi], { w: 4, c: '#7B52EE' })
    .dot([p, top], { r: 2.2 }).dot([q, fq], { r: 2.2 }).ticks([p, q], [[hi, hd === 1 ? String(hn) : '']], { size: 11 });
  // бутархай утгыг y тэнхлэгийн хажууд босоо бутархайгаар (текст дэх \dfrac шиг)
  if (hd > 1) sg.raw(function (T) {
    var y = T.Y(hi), w = 6 * Math.max(String(hn).length, String(hd).length), xc = T.X(0) - 8 - w / 2;
    var tx = function (yy, s) { return '<text x="' + xc.toFixed(2) + '" y="' + yy.toFixed(2) + '" font-size="10.5" font-family="\'KaTeX_Main\',\'Times New Roman\',serif" text-anchor="middle" fill="#1b1b1b">' + s + '</text>'; };
    return tx(y - 2.6, hn) + '<line x1="' + (xc - w / 2 - 1).toFixed(2) + '" y1="' + y.toFixed(2) + '" x2="' + (xc + w / 2 + 1).toFixed(2) + '" y2="' + y.toFixed(2)
      + '" stroke="#1b1b1b" stroke-width="0.8"/>' + tx(y + 10, hd);
  });
  return {
    q: '$f(x)=\\begin{cases}' + tm(k, 'x^2', true) + ', & 0\\le x\\le ' + p + '\\\\ ' + tm(m, 'x', true) + tm([cn, cd], '', false) + ', & ' + p + '\\lt x\\le ' + q
      + '\\end{cases}$ функцийн дүрийг олоорой.',
    a: '$E(f)=\\left[' + frq(lo) + ';\\,' + frq(hi) + '\\right]$',
    fig: f.svg(), wk: 24,
    s: [
      '$0\\le x\\le ' + p + '$ үед $f(x)=' + tm(k, 'x^2', true) + '$ өснө: $f(0)=0$, $f(' + p + ')=' + (K === 1 ? '' : fr(k[0], k[1]) + '\\cdot ') + p + '^2=' + topT + '$.'
        + ' Утгууд нь $\\left[0;\\,' + topT + '\\right]$.',
      '$' + p + '\\lt x\\le ' + q + '$ үед $f(x)=' + lin + '$ шугаман функцийн өнцгийн коэффициент ' + (up ? 'эерэг тул өснө' : 'сөрөг тул буурна') + ':'
        + ' $f(' + q + ')=' + (mq === fqT ? '' : mq + '=') + fqT + '$. Утгууд нь $' + (up ? '\\left(' + topT + ';\\,' + fqT + '\\right]' : '\\left[' + fqT + ';\\,' + topT + '\\right)') + '$.',
      'Иймд $E(f)=\\left[0;\\,' + topT + '\\right]\\cup' + (up ? '\\left(' + topT + ';\\,' + fqT + '\\right]' : '\\left[' + fqT + ';\\,' + topT + '\\right)')
        + '=\\left[0;\\,' + frq(hi) + '\\right]$.'
    ],
    sfig: sg.svg(),
    t: { k: K, p: p, m: Mv, c: cn / cd, q: q }
  };
}
return p71;
})();

/* 1.83 */
var e1_83 = (function () {
// 83. f(x) = ax² + bx + c нь x ≥ m (x ≤ m) үед харилцан нэгэн утгатай ⇔ параболын орой x₀ = −b/(2a)
//     завсрын дотор орохгүй → m-ийн хамгийн бага (их) утга m = x₀.
// Бодолтын мөр доторх ($…$) томьёог мөр хооронд таслахгүй ($$…$$-д хүрэхгүй)
function p83_nw(s) { return s.split(/(\$\$[\s\S]*?\$\$)/).map(function (p, i) { return i % 2 ? p : p.replace(/\$[^$]+\$(-[А-Яа-яЁёӨөҮү]+)?[.,;:)]*/g, function (m) { return '<span class="nw">' + m + '</span>'; }); }).join(''); }
function p83() {
  var A = pick([1, 2, 3, 3, 4, -1, -2, -3]), xn, xd = 1;
  if (rnd(0, 3)) xn = nz(-4, 4);
  else { xd = pick([2, 3]); xn = nz(-5, 5); if (gcd(xn, xd) !== 1) return null; }
  var B = -2 * A * xn / xd, C = rnd(-6, 6);
  if (B !== Math.round(B) || Math.abs(B) > 16) return null;
  var ge = rnd(0, 2) > 0;
  // Бодолт (гар бичмэл): бүтэн квадрат ялгаж A(x − x₀)² + y₀ → x ≥ x₀ (x ≤ x₀) үед монотон → m = x₀.
  var xv = fr(xn, xd), yvN = C * xd * xd - A * xn * xn, yvT = yvN ? tm([yvN, xd * xd], '') : '';
  var inc = (ge && A > 0) || (!ge && A < 0), rel = ge ? '\\ge ' : '\\le ';
  return {
    q: '$x' + (ge ? '\\ge' : '\\le') + ' m$ үед $f(x)=' + poly([A, B, C]) + '$ гэж тодорхойлогдсон функц харилцан нэгэн утгатай бол $m$-ийн хамгийн ' + (ge ? 'бага' : 'их') + ' утгыг олоорой.',
    a: '$m=' + fr(xn, xd) + '$',
    wk: 22,
    s: [
      'Бүтэн квадрат ялгавал $$f(x)=' + poly([A, B, C]) + '=' + tm(A, '\\left(' + poly([1, [-2 * xn, xd], [xn * xn, xd * xd]]) + '\\right)', true) + yvT
        + '=' + tm(A, '\\left(' + poly([1, [-xn, xd]]) + '\\right)^2', true) + yvT + '.$$',
      'Параболын тэгш хэмийн тэнхлэг нь $x=' + xv + '$ шулуун. $x' + rel + xv + '$ үед функц ' + (inc ? 'өсөх' : 'буурах') + ' тул харилцан нэгэн утгатай. '
        + 'Харин $m' + (ge ? '\\lt ' : '\\gt ') + xv + '$ бол завсарт $x=' + xv + '$ шулууны хоёр талд тэгш хэмтэй цэгүүд орж, функц тэдгээрт ижил утга авах тул харилцан нэгэн утгатай биш.',
      'Иймд $m$-ийн хамгийн ' + (ge ? 'бага' : 'их') + ' утга $m=' + xv + '$.'
    ].map(p83_nw),
    t: { A: A, B: B, C: C, ge: ge }
  };
}
return p83;
})();

/* 3.61 */
var e3_61 = (function () {
// 61. f(x) = a^{x+p} + q ⇒ урвуу функц g(x) = log_a(x − q) − p (x > q).  g(g(x₀)) = z ⇔ x₀ = f(f(z)):
//     z-ээс эхэлж y₁ = f(z), x₀ = f(y₁); илтгэгч z + p ≥ 0, y₁ + p ≥ 0 тул y₁, x₀ бүхэл ба x₀, y₁ > q (g тодорхойлогдоно).
//     (эх: f(x) = 2^{x+1} − 2: g(6) = 2, g(2) = 1 ⇒ g(g(6)) = 1)
function p61() {
  var a = pick([2, 2, 2, 3, 3, 4, 5]), p, q, z, y1, x0, ok = false;   // суурийг эхэлж сонгоно (их суурьт тохирох хувилбар цөөн)
  for (var t = 0; t < 80 && !ok; t++) {
    p = pick([-2, -1, -1, 0, 1, 1, 2]); q = nz(-4, 4); z = rnd(-2, 3);
    if (z + p < 0) continue;
    y1 = Math.pow(a, z + p) + q;
    if (y1 + p < 0) continue;
    x0 = Math.pow(a, y1 + p) + q;
    ok = Math.abs(x0) <= 70 && y1 !== z && x0 !== y1 && x0 !== z;
  }
  if (!ok) return null;
  var fx = a + '^' + (p ? '{x' + sgn(p) + '}' : 'x') + sgn(q), G = 'g\\big(g(' + x0 + ')\\big)';
  return {
    q: '$f(x)=' + fx + '$ функцийн урвуу функц нь $y=g(x)$ бол $' + G + '=?$',
    a: '$' + G + '=' + z + '$',
    wk: 26,
    t: { a: a, p: p, q: q, x0: x0, y1: y1, z: z }
  };
}
return p61;
})();

/* 3.87 */
var e3_87 = (function () {
// 87. (61-ийн ихэр) f(x) = a^{x+p} + q ⇒ урвуу функц g(x) = log_a(x − q) − p (x > q).  g(g(x₀)) = z ⇔ x₀ = f(f(z)):
//     z-ээс эхэлж y₁ = f(z), x₀ = f(y₁); илтгэгч z + p ≥ 0, y₁ + p ≥ 0 тул y₁, x₀ бүхэл ба x₀, y₁ > q (g тодорхойлогдоно).
//     (эх: f(x) = 3^{x−1} + 1: g(4) = 2, g(2) = 1 ⇒ g(g(4)) = 1)
function p87() {
  var a = pick([3, 3, 3, 2, 2, 4, 5]), p, q, z, y1, x0, ok = false;   // суурийг эхэлж сонгоно (их суурьт тохирох хувилбар цөөн)
  for (var t = 0; t < 80 && !ok; t++) {
    p = pick([-1, -1, -2, 0, 1, 1, 2]); q = nz(-4, 4); z = rnd(-2, 3);
    if (z + p < 0) continue;
    y1 = Math.pow(a, z + p) + q;
    if (y1 + p < 0) continue;
    x0 = Math.pow(a, y1 + p) + q;
    ok = Math.abs(x0) <= 70 && y1 !== z && x0 !== y1 && x0 !== z;
  }
  if (!ok) return null;
  var fx = a + '^' + (p ? '{x' + sgn(p) + '}' : 'x') + sgn(q), G = 'g\\big(g(' + x0 + ')\\big)';
  return {
    q: '$f(x)=' + fx + '$ функцийн урвуу функц нь $y=g(x)$ бол $' + G + '=?$',
    a: '$' + G + '=' + z + '$',
    wk: 26,
    t: { a: a, p: p, q: q, x0: x0, y1: y1, z: z }
  };
}
return p87;
})();

/* 1.95 */
var e1_95 = (function () {
// 95. (2-р хэсэг) f(x)=x²−2kx+k²+αk+β = (x−k)²+α(k−kt), kt=−β/α → орой (k; α(k−kt)).
//   (1) k=k1 → орой (k1; α(k1−kt)) > 0; [u; v] завсарт (u<k1<v): хамгийн бага = оройн y, их = төгсгөлийн их утга.
//   (2) x тэнхлэгийг шүргэх: α(k−kt)=0 → k=kt, шүргэлтийн цэг (kt; 0).
//   (3) x тэнхлэгийн дагуу s нэгжээр зүүн, y тэнхлэгийн дагуу g нэгжээр доош: f(x+s)−g=(x−u0)²+v0 → k=u0+s, g=α(k−kt)−v0.
//       Эхийн (3) зөрүүтэй (k=5 үед 1 нэгжээр ДЭЭШ болдог) — энд g>0 бол «доош», g<0 бол |g| нэгжээр «дээш» (үргэлж тууштай).
//   Бүх нүд 0–9; хасах тэмдэг нүдний гадна.
// Бодолт (гар бичмэл): (1) бүтэн квадрат ялгаж орой, завсрын төгсгөлүүдийн утга; (2) оройн ординат 0; (3) оройг шилжүүлж шинэ оройтой тэнцүүлэнэ.
function p95_lin(al, be) { return al < 0 ? be + tm(al, 'k') : tm(al, 'k', true) + sgn(be); }                 // αk+β → «3-k», «2k-6»
function p95_linv(al, be, k) { var c = Math.abs(al) === 1 ? '' : Math.abs(al) + '\\cdot '; return al < 0 ? be + '-' + c + k : c + k + sgn(be); }
function p95_sq(c) { return '(x' + sgn(-c) + ')^2'; }                                                        // (x−c)²
function p95() {
  var al = pick([-1, -1, 1, -2, 2]), kt = rnd(1, 6), be = -al * kt;

/* 4.45 */
var e4_45 = (function () {
