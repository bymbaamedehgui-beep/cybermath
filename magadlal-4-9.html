<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Магадлал-4 (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:6px 0 9px;border-left:4px solid var(--purple2);padding-left:9px}
  .prob{break-inside:avoid;page-break-inside:avoid;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start}
  .pmain{flex:1 1 0;min-width:0}
  .pq{font-size:13px;margin-bottom:5px}.pn{font-weight:800;color:var(--purple);margin-right:6px}
  .ppie{flex:0 0 auto}
  .pw{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:16mm}
  .sols-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.sols-page h2{font-size:16px;color:#5a32d6;margin-bottom:12px}
  .sol{break-inside:avoid;page-break-inside:avoid;margin-bottom:11px;padding-bottom:8px;border-bottom:1px dashed #ece7fb}
  .sol .sq{font-size:12px;color:#42395e;margin-bottom:4px}.sol .sn{font-weight:800;color:var(--purple);margin-right:6px}
  .step{font-size:13px;margin:3px 0 3px 20px;color:#241a3d}
  .res{font-size:13px;font-weight:800;color:var(--green);margin:4px 0 0 20px}
  #solutions{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.sols-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="ss" onchange="toggleSol()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function fr(p,q){if(p===0)return {p:0,q:1};var g=gcd(p,q);return {p:p/g,q:q/g};}
function frT(f){return f.q===1?(''+f.p):('\\dfrac{'+f.p+'}{'+f.q+'}');}
function toggleSol(){var el=document.getElementById('solutions');if(el)el.style.display=document.getElementById('ss').checked?'block':'none';}
function step(t){return '<div class="step">'+t+'</div>';}
function res(t){return '<div class="res">Хариу: '+t+'</div>';}
var COL={'улаан':'#e11d48','хөх':'#2563eb','ногоон':'#16a34a','шар':'#eab308','ягаан':'#db2777'};
function pie(cols){var cx=52,cy=52,r=48,m=cols.length,sw=360/m,s='<svg viewBox="0 0 104 104" width="82" height="82" xmlns="http://www.w3.org/2000/svg">';
  function pt(a){return [(cx+r*Math.cos(a*Math.PI/180)).toFixed(2),(cy+r*Math.sin(a*Math.PI/180)).toFixed(2)];}
  for(var i=0;i<m;i++){var a0=i*sw,a1=(i+1)*sw,p0=pt(a0),p1=pt(a1);s+='<path d="M'+cx+','+cy+' L'+p0[0]+','+p0[1]+' A'+r+' '+r+' 0 0 1 '+p1[0]+','+p1[1]+' Z" fill="'+COL[cols[i]]+'" stroke="#fff" stroke-width="1.4"/>';}
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#8878b8" stroke-width="1.4"/><circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="#3a2d5e"/></svg>';return '<div class="ppie">'+s+'</div>';}
function spinner(){var m=pick([4,6,8]),names=Object.keys(COL),k=rnd(2,3),chosen=[];while(chosen.length<k){var c=pick(names);if(chosen.indexOf(c)<0)chosen.push(c);}
  var parts=[];for(var i=0;i<k;i++)parts.push(1);var rem=m-k;while(rem>0){parts[rnd(0,k-1)]++;rem--;}
  var cols=[];for(i=0;i<k;i++)for(var j=0;j<parts[i];j++)cols.push(chosen[i]);
  return {m:m,cols:cols,chosen:chosen,parts:parts};}
function cnt(sp,col){var c=0;for(var i=0;i<sp.cols.length;i++)if(sp.cols[i]===col)c++;return c;}
// A) Нэг эргүүлэлт
function gSpin1(){var sp=spinner(),col=pick(sp.chosen),k=cnt(sp,col),f=fr(k,sp.m);
  return {pie:pie(sp.cols),q:'Зургийн спиннерийг нэг удаа эргүүлэв. Зүү '+col+' секторт зогсох магадлалыг ол.',
    sol:step('Нийт сектор: $'+sp.m+'$; '+col+' сектор: $'+k+'$')+step('$P=\\dfrac{'+k+'}{'+sp.m+'}'+(f.q!==sp.m?'='+frT(f):'')+'$')+res('$'+frT(f)+'$')};}
// B) Хоёр эргүүлэлт
function gSpin2(){var sp=spinner(),col=pick(sp.chosen),k=cnt(sp,col),f=fr(k*k,sp.m*sp.m);
  return {pie:pie(sp.cols),q:'Спиннерийг хоёр удаа эргүүлэв. Хоёуланд нь '+col+' секторт зогсох магадлалыг ол.',
    sol:step('$P('+col+')=\\dfrac{'+k+'}{'+sp.m+'}$; үл хамаарах тул үржүүлнэ')+step('$\\dfrac{'+k+'}{'+sp.m+'}\\times\\dfrac{'+k+'}{'+sp.m+'}=\\dfrac{'+(k*k)+'}{'+(sp.m*sp.m)+'}'+(f.q!==sp.m*sp.m?'='+frT(f):'')+'$')+res('$'+frT(f)+'$')};}
// C) Харьцангуй давтамж
function gFreq(){var N=rnd(5,40)*10,k=rnd(1,N-1),f=fr(k,N);
  return {pie:'',q:'Спиннерийг $'+N+'$ удаа эргүүлэхэд улаан $'+k+'$ удаа гарав. Улаан гарахын харьцангуй давтамжийг ол.',
    sol:step('Харьцангуй давтамж $=\\dfrac{\\text{тохиолдсон тоо}}{\\text{нийт туршилт}}=\\dfrac{'+k+'}{'+N+'}'+(f.q!==N?'='+frT(f):'')+'$')+res('$'+frT(f)+(f.q<=100?'\\ ('+(Math.round(k/N*1000)/10)+'\\%)':'')+'$')};}
// D) Хүлээгдэх тоо
function gExpect(){var sp=spinner(),col=pick(sp.chosen),k=cnt(sp,col),N=sp.m*rnd(5,20),e=N*k/sp.m;
  return {pie:pie(sp.cols),q:'Спиннерийг $'+N+'$ удаа эргүүлбэл '+col+' сектор ойролцоогоор хэдэн удаа гарах вэ?',
    sol:step('$P('+col+')=\\dfrac{'+k+'}{'+sp.m+'}$')+step('Хүлээгдэх тоо: $'+N+'\\times\\dfrac{'+k+'}{'+sp.m+'}='+e+'$')+res('$'+e+'$ удаа')};}
function build(){
  var probs=[],seen={};
  function add(fn,cnt2){var c=0,tr=0;while(c<cnt2&&tr<400){tr++;var f=fn();if(!f||seen[f.q])continue;seen[f.q]=1;probs.push(f);c++;}}
  add(gSpin1,2);add(gSpin2,2);add(gFreq,2);add(gExpect,2);
  var pHtml=probs.map(function(p,i){return '<div class="prob"><div class="pmain"><div class="pq"><span class="pn">'+(i+1)+'.</span>'+p.q+'</div><div class="pw"></div></div>'+(p.pie||'')+'</div>';}).join('');
  var sHtml=probs.map(function(p,i){return '<div class="sol"><div class="sq"><span class="sn">'+(i+1)+'.</span>'+p.q+'</div>'+p.sol+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Спиннер ба харьцангуй давтамж</h1><div class="sub">Өнгийн сектор · нэг/хоёр эргүүлэлт · харьцангуй давтамж · хүлээгдэх тоо · 9-р анги · 3.1</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$P(\\text{өнгө})=\\dfrac{\\text{тухайн өнгийн сектор}}{\\text{нийт сектор}}$ · Харьцангуй давтамж $=\\dfrac{\\text{тохиолдсон тоо}}{\\text{нийт туршилт}}$ · Хүлээгдэх тоо $=N\\cdot P$.</div>'
    +'<div class="task">Бодлогуудыг бод. (Бодолтоо доор бич)</div>'+pHtml
    +'<div class="sols-page" id="solutions"><h2>Бодолт ба хариу</h2>'+sHtml+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Магадлал-4';
  toggleSol();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=38"></script>
</body>
</html>
