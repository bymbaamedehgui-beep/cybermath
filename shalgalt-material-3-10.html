<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var OL=['А','Б','В','Г'];
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){var t=a%b;a=b;b=t;}return a;}
function frac(p,q){if(q<0){p=-p;q=-q;}var g=gcd(Math.abs(p),q)||1;return {p:p/g,q:q/g};}
function subf(a,b){return frac(a.p*b.q-b.p*a.q,a.q*b.q);}
function fv(f){return f.p/f.q;}
function vp(v,f){if(f.p===0)return '1';var neg=f.p<0,p=Math.abs(f.p),q=f.q,body;
  if(q===1){body=(p===1)?v:(v+'^{'+p+'}');}
  else{var whole=Math.floor(p/q),rem=p-whole*q,inside=(rem===1)?v:(v+'^{'+rem+'}'),radp=(q===2)?('\\sqrt{'+inside+'}'):('\\sqrt['+q+']{'+inside+'}');body=(whole===0)?radp:((whole===1)?(v+radp):(v+'^{'+whole+'}'+radp));}
  return neg?('\\dfrac{1}{'+body+'}'):body;}
function dbl(f){return frac(2*f.p,f.q);}
function expH(){return frac(1,pick([2,2,3]));}
function pairv(){return pick([['x','y'],['a','b'],['u','v'],['m','n'],['p','q'],['s','t']]);}
var ORD='abcdmnpqrstuvwxyz';
function kv(v,f){var o={};o[v]=f;return o;}
function vkeys(vs){return Object.keys(vs).sort(function(a,b){return ORD.indexOf(a)-ORD.indexOf(b);});}
function varsTex(vs){var s='';vkeys(vs).forEach(function(k){var e=vs[k];if(e.p!==0)s+=vp(k,e);});return s;}
function coefVars(c,vs){var v=varsTex(vs);if(v==='')return ''+c;return (c===1?'':''+c)+v;}
function mTex(m){var vs=varsTex(m.vars),ac=Math.abs(m.c);if(vs==='')return ''+ac;return (ac===1?'':''+ac)+vs;}
function mpolyTex(ts){var out='';ts.forEach(function(t,i){var tx=mTex(t);if(i===0)out+=(t.c<0?'-':'')+tx;else out+=(t.c<0?' - ':' + ')+tx;});return out||'0';}
function mulMon(a,b){var vv={},k;for(k in a.vars)vv[k]=a.vars[k];for(k in b.vars)vv[k]=vv[k]?{p:vv[k].p*b.vars[k].q+b.vars[k].p*vv[k].q,q:vv[k].q*b.vars[k].q}:b.vars[k];for(k in vv)vv[k]=frac(vv[k].p,vv[k].q);return {c:a.c*b.c,vars:vv};}
function monEval(m,vals){var r=m.c;for(var k in m.vars)r*=Math.pow(vals[k],fv(m.vars[k]));return r;}
function mpolyEval(ts,vals){return ts.reduce(function(s,t){return s+monEval(t,vals);},0);}
function fracInputTex(f){return '\\dfrac{'+coefVars(f.num.c,f.num.vars)+'}{'+coefVars(f.den.c,f.den.vars)+'}';}
function fracAns(numM,denM){var vars={},k;for(k in numM.vars)vars[k]=1;for(k in denM.vars)vars[k]=1;var nv={},dv={};for(k in vars){var e=subf(numM.vars[k]||frac(0,1),denM.vars[k]||frac(0,1));if(e.p>0)nv[k]=e;else if(e.p<0)dv[k]=frac(-e.p,e.q);}var g=gcd(numM.c,denM.c)||1,nc=numM.c/g,dc=denM.c/g;var numT=coefVars(nc,nv),denT=coefVars(dc,dv);return {tex:(denT==='1')?numT:('\\dfrac{'+numT+'}{'+denT+'}'),eval:function(vals){var r=nc/dc,kk;for(kk in nv)r*=Math.pow(vals[kk],fv(nv[kk]));for(kk in dv)r/=Math.pow(vals[kk],fv(dv[kk]));return r;}};}
function fracIsOne(f){if(f.num.c!==f.den.c)return false;var kn=Object.keys(f.num.vars),kd=Object.keys(f.den.vars);if(kn.length!==kd.length)return false;for(var i=0;i<kn.length;i++){var k=kn[i];if(!f.den.vars[k]||f.num.vars[k].p!==f.den.vars[k].p||f.num.vars[k].q!==f.den.vars[k].q)return false;}return true;}
function monHasVar(numM,denM){var vs={},k;for(k in numM.vars)vs[k]=1;for(k in denM.vars)vs[k]=1;for(k in vs){var e=subf(numM.vars[k]||frac(0,1),denM.vars[k]||frac(0,1));if(e.p!==0)return true;}return false;}
function mkVars(n){var pool=['a','b','c','d','x','y','p','q','m','n'],vars=[],tr=0;while(vars.length<n&&tr++<60){var v=pick(pool);if(vars.indexOf(v)<0)vars.push(v);}return vars;}
function chkEq(vars,fa,fb){for(var i=0;i<4;i++){var vals={};vars.forEach(function(k){vals[k]=1.3+Math.random()*3;});var a=fa(vals);if(!isFinite(a)||Math.abs(a-fb(vals))>1e-6*Math.max(1,Math.abs(a)))return false;}return true;}
function pe(c,x){var r=0;for(var i=c.length-1;i>=0;i--)r=r*x+c[i];return r;}
function padd(a,b){var n=Math.max(a.length,b.length),r=[];for(var i=0;i<n;i++)r[i]=(a[i]||0)+(b[i]||0);return r;}
function psc(a,k){return a.map(function(c){return c*k;});}
function pmul(a,b){var r=[];for(var i=0;i<a.length;i++)for(var j=0;j<b.length;j++)r[i+j]=(r[i+j]||0)+a[i]*b[j];for(var k=0;k<r.length;k++)r[k]=r[k]||0;return r;}
function ptrim(a){a=a.slice();while(a.length>1&&Math.abs(a[a.length-1])<1e-7)a.pop();return a;}
function pdeg(a){return ptrim(a).length-1;}
function pdivroot(a,r){var A=a.slice().reverse(),out=[A[0]];for(var i=1;i<A.length;i++)out.push(A[i]+out[i-1]*r);out.pop();return out.reverse();}
function introots(a){a=ptrim(a);var rs=[],ch=true;while(ch&&pdeg(a)>=1){ch=false;for(var r=-15;r<=15;r++){if(pdeg(a)<1)break;if(Math.abs(pe(a,r))<1e-6){a=ptrim(pdivroot(a,r));rs.push(r);ch=true;break;}}}return {roots:rs,rest:a};}
function content(a){var g=0;a.forEach(function(c){g=gcd(g,c);});return g||1;}
function reduceFrac(num,den){var fn=introots(num),fd=introots(den),nr=fn.roots.slice(),dr=fd.roots.slice();for(var i=nr.length-1;i>=0;i--){var idx=dr.indexOf(nr[i]);if(idx>=0){dr.splice(idx,1);nr.splice(i,1);}}var np=fn.rest.slice(),dp=fd.rest.slice();nr.forEach(function(r){np=pmul(np,[-r,1]);});dr.forEach(function(r){dp=pmul(dp,[-r,1]);});var g=gcd(content(np),content(dp));if(g>1){np=psc(np,1/g);dp=psc(dp,1/g);}var dl=ptrim(dp);if(dl[dl.length-1]<0){np=psc(np,-1);dp=psc(dp,-1);}return {num:ptrim(np),den:ptrim(dp)};}
function cTex(c,v){c=ptrim(c);var out='',first=true;for(var i=c.length-1;i>=0;i--){var co=Math.round(c[i]);if(co===0)continue;var vpp=(i===0)?'':(i===1?v:v+'^{'+i+'}');var mag=Math.abs(co),t=(mag===1&&i>0)?vpp:(''+mag+vpp);if(first){out+=(co<0?'-':'')+t;first=false;}else out+=(co<0?' - ':' + ')+t;}return first?'0':out;}
function cfracTex(fr,v){var nt=cTex(fr.num,v);if(nt==='0')return '0';var dt=cTex(fr.den,v);return (dt==='1')?nt:('\\dfrac{'+nt+'}{'+dt+'}');}
function mulFrac2(f1,f2){return reduceFrac(pmul(f1.num,f2.num),pmul(f1.den,f2.den));}
function divFrac2(f1,f2){return reduceFrac(pmul(f1.num,f2.den),pmul(f1.den,f2.num));}
function chkFr(v,evalLHS,ans){for(var i=0;i<5;i++){var x=1.7+Math.random()*4,a=evalLHS(x),b=pe(ans.num,x)/pe(ans.den,x);if(!isFinite(a)||!isFinite(b)||Math.abs(a-b)>1e-6*Math.max(1,Math.abs(a)))return false;}return true;}
function linTex(v,r){if(r===0)return v;return v+(r<0?' + '+(-r):' - '+r);}
function quadTex(v,p,q){var B=-(p+q),C=p*q,s=v+'^{2}';if(B!==0)s+=(B<0?' - ':' + ')+(Math.abs(B)===1?'':Math.abs(B))+v;if(C!==0)s+=(C<0?' - ':' + ')+Math.abs(C);return s;}
function distinctRoots(n,lo,hi){var rs=[],tr=0;while(rs.length<n&&tr++<400){var r=nz(lo,hi);if(rs.indexOf(r)<0)rs.push(r);}return rs.length<n?null:rs;}
// ── MCQ (утга-функцээр давхцалгүй) ──
function finishMC(opts){var sh=shuffle(opts),ci=-1;for(var i=0;i<sh.length;i++)if(sh[i].ok)ci=i;return {opts:sh,correct:ci};}
function O(t,f){return {t:t,f:f};}
function makeMC(cor,distr){var xs=[1.7,2.3,3.1,4.2];function vals(o){return xs.map(function(x){return o.f(x);});}function near(a,b){for(var i=0;i<a.length;i++)if(!isFinite(a[i])||!isFinite(b[i])||Math.abs(a[i]-b[i])>1e-6*Math.max(1,Math.abs(a[i])))return false;return true;}
  var opts=[{tex:cor.t,ok:true}],used=[vals(cor)];
  for(var i=0;i<distr.length&&opts.length<4;i++){var d=distr[i];if(!d)continue;var dv=vals(d),dup=false;for(var j=0;j<used.length;j++)if(near(used[j],dv)){dup=true;break;}if(dup)continue;used.push(dv);opts.push({tex:d.t,ok:false});}
  if(opts.length<4)return null;return finishMC(opts);}
// ── Тест генераторууд ──
function tProduct(){var v=pick(['x','y','a','b','m']),k=nz(2,7);
  var stem='$\\left('+vp(v,frac(1,2))+' - '+k+'\\right)\\left('+vp(v,frac(1,2))+' + '+k+'\\right)$ илэрхийллийн утга:';
  var mc=makeMC(O(v+' - '+(k*k),function(x){return x-k*k;}),[O(v+' + '+(k*k),function(x){return x+k*k;}),O(v+' - '+k,function(x){return x-k;}),O(v+' - '+(2*k),function(x){return x-2*k;}),O(vp(v,frac(1,2))+' - '+(k*k),function(x){return Math.sqrt(x)-k*k;})]);
  if(!mc)return null;return {stem:stem,mc:mc};}
function tSquare(){var v=pick(['x','y','a','b','m']),k=nz(2,6),s=pick([1,-1]),sq=vp(v,frac(1,2));
  var stem='$\\left('+sq+(s<0?' - ':' + ')+k+'\\right)^{2}$ илэрхийллийг задал:';
  var cor=O(v+(s<0?' - ':' + ')+(2*k)+sq+' + '+(k*k),function(x){return x+s*2*k*Math.sqrt(x)+k*k;});
  var mc=makeMC(cor,[O(v+' + '+(k*k),function(x){return x+k*k;}),O(v+(s>0?' - ':' + ')+(2*k)+sq+' + '+(k*k),function(x){return x-s*2*k*Math.sqrt(x)+k*k;}),O(v+(s<0?' - ':' + ')+(2*k)+sq+' - '+(k*k),function(x){return x+s*2*k*Math.sqrt(x)-k*k;}),O((2)+v+(s<0?' - ':' + ')+(2*k)+sq+' + '+(k*k),function(x){return 2*x+s*2*k*Math.sqrt(x)+k*k;})]);
  if(!mc)return null;return {stem:stem,mc:mc};}
function tDiffSqFactor(){var v=pick(['x','y','a','b','m','t']),k=nz(2,7),sq=vp(v,frac(1,2));
  var stem='$'+v+' - '+(k*k)+'$ илэрхийллийг задал:';
  var cor=O('\\left('+sq+' - '+k+'\\right)\\left('+sq+' + '+k+'\\right)',function(x){return (Math.sqrt(x)-k)*(Math.sqrt(x)+k);});
  var mc=makeMC(cor,[O('\\left('+sq+' - '+k+'\\right)^{2}',function(x){return Math.pow(Math.sqrt(x)-k,2);}),O('\\left('+v+' - '+k+'\\right)\\left('+v+' + '+k+'\\right)',function(x){return (x-k)*(x+k);}),O('\\left('+sq+' - '+(k*k)+'\\right)\\left('+sq+' + '+(k*k)+'\\right)',function(x){return (Math.sqrt(x)-k*k)*(Math.sqrt(x)+k*k);})]);
  if(!mc)return null;return {stem:stem,mc:mc};}
function tFactorNum(){var v=pick(['x','y','a','m','t']),p=nz(-6,6),q=nz(-6,6);if(p===q)return null;var B=p+q,C=p*q;if(B===0)return null;
  var stem='$'+v+'^{2}'+(B<0?' - ':' + ')+(Math.abs(B)===1?'':Math.abs(B))+v+(C<0?' - ':' + ')+Math.abs(C)+'$ үржигдэхүүн болгон задал:';
  function fp(r1,r2){return '\\left('+v+(r1<0?' - ':' + ')+Math.abs(r1)+'\\right)\\left('+v+(r2<0?' - ':' + ')+Math.abs(r2)+'\\right)';}
  var cor=O(fp(p,q),function(x){return (x+p)*(x+q);});
  var mc=makeMC(cor,[O(fp(-p,-q),function(x){return (x-p)*(x-q);}),O(fp(p,-q),function(x){return (x+p)*(x-q);}),O(fp(-p,q),function(x){return (x-p)*(x+q);}),O(fp(p+1,q),function(x){return (x+p+1)*(x+q);})]);
  if(!mc)return null;return {stem:stem,mc:mc};}
function tFactorSqrt(){var v=pick(['x','y','a','m']),p=rnd(1,6),q=rnd(1,6);if(p===q)return null;var B=-(p+q),C=p*q,sq=vp(v,frac(1,2));
  var stem='$'+v+(B<0?' - ':' + ')+Math.abs(B)+sq+' + '+C+'$ үржигдэхүүн болгон задал:';
  function fp(r1,r2){return '\\left('+sq+' - '+r1+'\\right)\\left('+sq+' - '+r2+'\\right)';}
  var cor=O(fp(p,q),function(x){return (Math.sqrt(x)-p)*(Math.sqrt(x)-q);});
  var mc=makeMC(cor,[O('\\left('+sq+' + '+p+'\\right)\\left('+sq+' + '+q+'\\right)',function(x){return (Math.sqrt(x)+p)*(Math.sqrt(x)+q);}),O('\\left('+v+' - '+p+'\\right)\\left('+v+' - '+q+'\\right)',function(x){return (x-p)*(x-q);}),O(fp(p+1,q),function(x){return (Math.sqrt(x)-p-1)*(Math.sqrt(x)-q);})]);
  if(!mc)return null;return {stem:stem,mc:mc};}
var TESTS=[tProduct,tFactorNum,tSquare,tFactorSqrt,tDiffSqFactor,tFactorNum,tProduct,tFactorSqrt,tSquare,tFactorNum];
// ── Задгай даалгавар (III генераторууд) ──
function g31h(){var mode=pick(['cross','fiveM','inv']);
  if(mode==='cross'){var pr=pairv(),u=pr[0],w=pr[1],p=expH(),q=expH(),k=nz(2,5);
    var qtx='\\left('+vp(u,p)+' - '+(k===1?'':k)+vp(w,q)+'\\right)^{2} + '+(2*k)+vp(u,p)+vp(w,q),atx=vp(u,dbl(p))+' + '+(k*k)+vp(w,dbl(q));
    for(var t=0;t<4;t++){var a=1.3+Math.random()*3,b=1.3+Math.random()*3,lhs=Math.pow(Math.pow(a,fv(p))-k*Math.pow(b,fv(q)),2)+2*k*Math.pow(a,fv(p))*Math.pow(b,fv(q)),rhs=Math.pow(a,fv(dbl(p)))+k*k*Math.pow(b,fv(dbl(q)));if(Math.abs(lhs-rhs)>1e-6*Math.max(1,Math.abs(lhs)))return null;}
    return {q:qtx,a:atx};}
  if(mode==='fiveM'){var v=pick(['x','y','a','z','t','m']),pp=expH(),C=nz(2,7);
    var q2=(2*C)+vp(v,pp)+' + \\left('+C+' - '+vp(v,pp)+'\\right)^{2} - '+vp(v,dbl(pp)),a2=''+(C*C);
    for(var t2=0;t2<4;t2++){var x=1.3+Math.random()*3;if(Math.abs(2*C*Math.pow(x,fv(pp))+Math.pow(C-Math.pow(x,fv(pp)),2)-Math.pow(x,fv(dbl(pp)))-C*C)>1e-6*Math.max(1,C*C))return null;}
    return {q:q2,a:a2};}
  var v3=pick(['x','y','a','b','m','t']),p3=expH();
  var q3='\\left('+vp(v3,p3)+' + \\dfrac{1}{'+vp(v3,p3)+'}\\right)^{2} - 2',a3=vp(v3,dbl(p3))+' + \\dfrac{1}{'+vp(v3,dbl(p3))+'}';
  for(var t3=0;t3<4;t3++){var x3=1.3+Math.random()*3,tt=Math.pow(x3,fv(p3)),ttt=Math.pow(x3,fv(dbl(p3)));if(Math.abs((Math.pow(tt+1/tt,2)-2)-(ttt+1/ttt))>1e-6*Math.max(1,1))return null;}
  return {q:q3,a:a3};}
function g32h(){var mode=pick(['varConst','ab','ab']),half=frac(1,2);
  if(mode==='varConst'){var v=pick(['x','y','a','b','c','s','t']),n=pick([2,2,3,4]),k=nz(2,7);
    var expr=[{c:1,vars:kv(v,frac(2,n))},{c:-k*k,vars:{}}],f1=[{c:1,vars:kv(v,frac(1,n))},{c:-k,vars:{}}],f2=[{c:1,vars:kv(v,frac(1,n))},{c:k,vars:{}}];
    if(!chkEq([v],function(vl){return mpolyEval(expr,vl);},function(vl){return mpolyEval(f1,vl)*mpolyEval(f2,vl);}))return null;
    return {q:mpolyTex(expr),a:'\\left('+mpolyTex(f1)+'\\right)\\left('+mpolyTex(f2)+'\\right)'};}
  var pr=pick([['x','y'],['a','b'],['s','t'],['p','q'],['m','n']]),c1=pick([1,2,3,4]),c2=pick([1,2,3,4,5]);if(gcd(c1,c2)>1)return null;
  var expr2=[{c:c1*c1,vars:kv(pr[0],frac(1,1))},{c:-c2*c2,vars:kv(pr[1],frac(1,1))}],g1=[{c:c1,vars:kv(pr[0],half)},{c:-c2,vars:kv(pr[1],half)}],g2=[{c:c1,vars:kv(pr[0],half)},{c:c2,vars:kv(pr[1],half)}];
  if(!chkEq(pr,function(vl){return mpolyEval(expr2,vl);},function(vl){return mpolyEval(g1,vl)*mpolyEval(g2,vl);}))return null;
  return {q:mpolyTex(expr2),a:'\\left('+mpolyTex(g1)+'\\right)\\left('+mpolyTex(g2)+'\\right)'};}
function g33h(){var v=pick(['x','y','a','z','m','t','n']),rs=distinctRoots(6,-6,6);if(!rs)return null;
  var a=rs[0],b=rs[1],c=rs[2],d=rs[3],e=rs[4],f=rs[5];
  var F1='\\dfrac{'+quadTex(v,a,b)+'}{'+quadTex(v,c,d)+'}',F2='\\dfrac{'+quadTex(v,c,e)+'}{'+quadTex(v,b,f)+'}';
  var ans='\\dfrac{\\left('+linTex(v,a)+'\\right)\\left('+linTex(v,e)+'\\right)}{\\left('+linTex(v,d)+'\\right)\\left('+linTex(v,f)+'\\right)}';
  for(var i=0;i<6;i++){var x=8+Math.random()*7,f1=((x-a)*(x-b))/((x-c)*(x-d)),f2=((x-c)*(x-e))/((x-b)*(x-f)),av=((x-a)*(x-e))/((x-d)*(x-f));if(Math.abs(f1*f2-av)>1e-6*Math.max(1,Math.abs(av)))return null;}
  return {q:F1+'\\cdot '+F2,a:ans};}
function g34h(){var v=pick(['x','y','b','a','t','m','p']),a=nz(-6,6),b=nz(-6,6),op1=pick([1,-1]),mul=pick([true,false]);
  if(a===b)return null;var d1=[-a,1],N1=[nz(-5,5),1],N2=[rnd(2,6)];
  if(pe(N1,a)===0)return null;var innerNum=padd(N1,psc(N2,op1));if(cTex(innerNum,v)==='0'||pe(innerNum,a)===0)return null;
  var inner={num:innerNum,den:d1},f3=mul?{num:[-a,1],den:[-b,1]}:{num:[-b,1],den:[-a,1]},fin=mul?mulFrac2(inner,f3):divFrac2(inner,f3);
  if(cfracTex(fin,v)==='0')return null;
  var frac1='\\dfrac{'+cTex(N1,v)+'}{'+cTex(d1,v)+'}',frac2='\\dfrac{'+cTex(N2,v)+'}{'+cTex(d1,v)+'}',f3tex='\\dfrac{'+cTex(f3.num,v)+'}{'+cTex(f3.den,v)+'}';
