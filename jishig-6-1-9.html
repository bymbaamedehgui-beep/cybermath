function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
function fracStr(n,d){var sg=(n<0)!==(d<0);n=Math.abs(n);d=Math.abs(d);var g=gcd(n,d);n/=g;d/=g;if(d===1)return (sg?'-':'')+n;return (sg?'-':'')+'\\dfrac{'+n+'}{'+d+'}';}
var TRI=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[20,21,29],[10,24,26]];
function lineCircle(K,ang){var c=Math.cos(ang),s=Math.sin(ang);var b=2*(K[0]*c+K[1]*s);var cc=K[0]*K[0]+K[1]*K[1]-1;var disc=Math.sqrt(Math.max(0,b*b-4*cc));var t1=(-b+disc)/2,t2=(-b-disc)/2;return [[K[0]+t1*c,K[1]+t1*s],[K[0]+t2*c,K[1]+t2*s]];}

  var phi=pick([0,Math.PI/2,Math.PI,3*Math.PI/2,Math.PI/4,3*Math.PI/4,5*Math.PI/4,7*Math.PI/4]),dd=phi-Math.PI;

  function tx(p,ox,oy,t){return '<text x="'+(px(p[0])+ox).toFixed(1)+'" y="'+(py(p[1])+oy).toFixed(1)+'" font-size="11" font-weight="700">'+t+'</text>';}
  var Oc=[0,0];

  function px(p){return (pad+(p[0]-minX)*sc);}function py(p){return (H-pad-(p[1]-minY)*sc);}
  function line(p,q,col,w){return '<line x1="'+px(p).toFixed(1)+'" y1="'+py(p).toFixed(1)+'" x2="'+px(q).toFixed(1)+'" y2="'+py(q).toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+'"/>';}
  function dot(p){return '<circle cx="'+px(p).toFixed(1)+'" cy="'+py(p).toFixed(1)+'" r="2" fill="#111"/>';}
  function lab(p,t){var ox=px(p)-px(pO),oy=py(p)-py(pO),n=Math.max(1,Math.sqrt(ox*ox+oy*oy));return '<text x="'+(px(p)+ox/n*11).toFixed(1)+'" y="'+(py(p)+oy/n*11+4).toFixed(1)+'" font-size="11" font-weight="700" text-anchor="middle">'+t+'</text>';}
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="flex-shrink:0">'
   +'<circle cx="'+px(pO).toFixed(1)+'" cy="'+py(pO).toFixed(1)+'" r="'+sc.toFixed(1)+'" fill="none" stroke="#2b7fd4" stroke-width="1.4"/>'
   +line(pV,pP,'#7B52EE',1.5)+line(pV,pQ,'#7B52EE',1.5)+line(pP,pQ,'#16a34a',1.3)
   +dot(pV)+dot(pP)+dot(pQ)+lab(pV,'A')+lab(pP,'B')+lab(pQ,'C')
   +'</svg>';}

// ===== Chapter VI generators (plain client JS) =====
function ss(){return rnd(0,40);}
function triLegs(){var t=pick(TRI),i=rnd(0,1);return {R:t[i],MA:t[1-i],OM:t[2]};}
// ---------- NUMERIC {stem,a} ----------
function nTangent(){var t=triLegs();return {stem:'$R='+t.R+'$ см радиустай тойрог, гадна $M$ цэгээс $OM='+t.OM+'$ см. $MA$ шүргэгчийг ол.',a:'$MA=\\sqrt{OM^2-R^2}=\\sqrt{'+t.OM+'^2-'+t.R+'^2}='+t.MA+'$ см'};}
function nChord_d(){var t=triLegs(),c=2*t.R;return {stem:'$R='+t.OM+'$ см радиустай тойргийн $'+2*t.R+'$ см урттай хөвчийн төвөөс зайг ($OK$) ол.',a:'$OK=\\sqrt{R^2-(c/2)^2}=\\sqrt{'+t.OM+'^2-'+t.R+'^2}='+t.MA+'$ см'};}
function nChord_c(){var t=triLegs();return {stem:'$R='+t.OM+'$ см радиустай тойргийн төвөөс $'+t.MA+'$ см зайд орших хөвчийн уртыг ол.',a:'$AB=2\\sqrt{R^2-d^2}=2\\sqrt{'+t.OM+'^2-'+t.MA+'^2}='+2*t.R+'$ см'};}
function nIncircle(){var t=pick(TRI),a=t[0],b=t[1],c=t[2],r=(a+b-c)/2;return {stem:'Катетууд нь $'+a+'$ ба $'+b+'$ см тэгш өнцөгт гурвалжинд багтсан тойргийн радиусыг ол.',a:'$r=\\dfrac{a+b-c}{2}=\\dfrac{'+a+'+'+b+'-'+c+'}{2}='+r+'$ см'};}
function nIntersect(){for(var i=0;i<200;i++){var a=rnd(2,9),b=rnd(2,9),P=a*b,c=rnd(2,12);if(P%c)continue;var d=P/c;if(d<1||d>16||c===d)continue;return {stem:'$AB,\\ CD$ хөвчүүд $K$ цэгт огтлолцоно. $AK='+a+'$, $KB='+b+'$, $CK='+c+'$ бол $KD=?$',a:'$KD=\\dfrac{AK\\cdot KB}{CK}=\\dfrac{'+a+'\\cdot'+b+'}{'+c+'}='+d+'$'};}return null;}
function nTanSec(){for(var i=0;i<300;i++){var MA=rnd(6,15),sq=MA*MA,MB=rnd(2,MA-1);if(sq%MB)continue;var MC=sq/MB;if(MC<=MA||MC>70)continue;return {stem:'$M$ цэгээс шүргэгч $MA$ ба огтлогч татав. $MB='+MB+'$, $MC='+MC+'$ бол $MA=?$',a:'$MA=\\sqrt{MB\\cdot MC}=\\sqrt{'+MB+'\\cdot'+MC+'}='+MA+'$'};}return null;}
function nTwoSec(){for(var i=0;i<300;i++){var MA=rnd(3,10),MB=rnd(MA+2,20),P=MA*MB,MC=rnd(3,18);if(P%MC)continue;var MD=P/MC;if(MD<=MC||MD>44||MC===MA)continue;return {stem:'$M$ цэгээс хоёр огтлогч татав. $MA='+MA+'$, $MB='+MB+'$, $MC='+MC+'$ бол $MD=?$',a:'$MD=\\dfrac{MA\\cdot MB}{MC}=\\dfrac{'+MA+'\\cdot'+MB+'}{'+MC+'}='+MD+'$'};}return null;}
function nAltitude(){for(var i=0;i<300;i++){var h=rnd(2,12),p=rnd(1,2*h);if((h*h)%p)continue;var q=h*h/p;if(q<1||q>40||p===q)continue;return {stem:'Тэгш өнцөгт гурвалжны шулуун өнцгөөс татсан өндөр гипотенузыг $'+p+'$ ба $'+q+'$ см хэрчмүүдэд хуваав. Өндрийг ол.',a:'$h=\\sqrt{'+p+'\\cdot'+q+'}='+h+'$ см'};}return null;}
function nExt(){for(var i=0;i<200;i++){var near=pick([20,30,40,50,60,70]),ang=pick([15,20,25,30,35,40]),far=near+2*ang;if(far>200)continue;return {stem:'Гадна оройтой өнцөг: холын нум $'+far+'^\\circ$, ойрын нум $'+near+'^\\circ$ бол өнцгийг ол.',a:'$\\dfrac{'+far+'^\\circ-'+near+'^\\circ}{2}='+ang+'^\\circ$'};}return null;}
function nTanChord(){var arc=pick([40,50,60,70,80,90,100,110,120,130]),ang=arc/2;return {stem:'Шүргэгч ба хөвчийн хоорондох өнцгийн доторх нум $'+arc+'^\\circ$ бол өнцгийг ол.',a:'$\\dfrac{'+arc+'^\\circ}{2}='+ang+'^\\circ$'};}
function nInscribed(){var arc=pick([40,50,60,70,80,90,100,110,120,140]),ang=arc/2;return {stem:'Тойрогт багтсан өнцгийн тулсан нум $'+arc+'^\\circ$ бол багтсан өнцгийг ол.',a:'$\\dfrac{'+arc+'^\\circ}{2}='+ang+'^\\circ$'};}
function nThales(){for(var i=0;i<300;i++){var AD=rnd(2,9),DB=rnd(2,9),AE=rnd(2,12);if((DB*AE)%AD)continue;var EC=DB*AE/AD;if(EC<1||EC>30)continue;return {stem:'$DE\\parallel BC$. $AD='+AD+'$, $DB='+DB+'$, $AE='+AE+'$ бол $EC=?$',a:'$EC=\\dfrac{DB\\cdot AE}{AD}=\\dfrac{'+DB+'\\cdot'+AE+'}{'+AD+'}='+EC+'$'};}return null;}
// ---------- FIGURE {stem,a,fig} ----------
function fTangent(){var t=triLegs();return {stem:'Зурагт $R='+t.R+'$ см, $OM='+t.OM+'$ см. $MA$ шүргэгчийн уртыг ол.',fig:figTangent(t.R,t.OM),a:'$MA=\\sqrt{'+t.OM+'^2-'+t.R+'^2}='+t.MA+'$ см'};}
function fChord(){var t=triLegs();return {stem:'Зурагт $R='+t.OM+'$ см, хөвчийн урт $AB='+2*t.R+'$ см. Төвөөс зай $OK$-г ол.',fig:figChord(t.OM,t.R,t.MA),a:'$OK=\\sqrt{'+t.OM+'^2-'+t.R+'^2}='+t.MA+'$ см'};}
function fIntersect(){for(var i=0;i<200;i++){var a=rnd(2,9),b=rnd(2,9),P=a*b,c=rnd(2,12);if(P%c)continue;var d=P/c;if(d<1||d>16||c===d)continue;return {stem:'Зурагт $AK='+a+'$, $KB='+b+'$, $CK='+c+'$ бол $KD$-г ол.',fig:figIntersect(ss(),['A','B','C','D','K']),a:'$KD=\\dfrac{'+a+'\\cdot'+b+'}{'+c+'}='+d+'$'};}return null;}
function fTanChord(){var arc=pick([40,50,60,70,80,90,100,110,120]),ang=arc/2;return {stem:'Зурагт таслагдсан нум $\\overset{\\frown}{BC}='+arc+'^\\circ$ бол шүргэгч ба хөвчийн хоорондох $\\angle BCA$-г ол.',fig:figTanChord(arc),a:'$\\angle BCA=\\dfrac{'+arc+'^\\circ}{2}='+ang+'^\\circ$'};}
function fTwoSec(){for(var i=0;i<300;i++){var MA=rnd(3,10),MB=rnd(MA+2,20),P=MA*MB,MC=rnd(3,18);if(P%MC)continue;var MD=P/MC;if(MD<=MC||MD>44||MC===MA)continue;return {stem:'Зурагт $MA='+MA+'$, $MC='+MC+'$, $MD='+MD+'$ бол $MB$-г ол.',fig:figTwoSec(ss()),a:'$MB=\\dfrac{'+MC+'\\cdot'+MD+'}{'+MA+'}='+MB+'$'};}return null;}
function fIncircle(){var t=pick(TRI),a=t[0],b=t[1],c=t[2],r=(a+b-c)/2;return {stem:'Зурагт катетууд $AB='+b+'$ см, $BC='+a+'$ см. Багтсан тойргийн радиусыг ол.',fig:figIncircle(a,b),a:'$r=\\dfrac{'+a+'+'+b+'-'+c+'}{2}='+r+'$ см'};}
function fInscribed(){var arc=pick([50,60,70,80,90,100,110,120]),ang=arc/2;return {stem:'Зурагт $\\angle BAC$ багтсан өнцгийн тулсан нум $\\overset{\\frown}{BC}='+arc+'^\\circ$ бол $\\angle BAC$-г ол.',fig:figInscribed(arc,ss()),a:'$\\angle BAC=\\dfrac{'+arc+'^\\circ}{2}='+ang+'^\\circ$'};}
// ---------- WORD {stem,a} ----------
function wTower(){var t=triLegs();return {stem:'Дугуй цөөрмийн радиус $'+t.R+'$ м. Эргээс $'+t.OM+'$ м зайд ($OM$) орших цэгээс усны хашаанд шүргэж татсан замын уртыг ол.',a:'$\\sqrt{'+t.OM+'^2-'+t.R+'^2}='+t.MA+'$ м'};}
function wBridge(){var t=triLegs();return {stem:'Нумаг гүүрний нуман хаалганы радиус $'+t.OM+'$ м. Хаалганы $'+2*t.R+'$ м өргөн ёроолоос нумын төв хүртэлх зайг ол.',a:'$\\sqrt{'+t.OM+'^2-'+t.R+'^2}='+t.MA+'$ м'};}
function wWheel(){var t=pick(TRI),a=t[0],b=t[1],c=t[2],r=(a+b-c)/2;return {stem:'Катетууд нь $'+a+'$ м ба $'+b+'$ м тэгш өнцөгт цэцэрлэгт багтаах хамгийн том дугуй усан оргилуурын радиусыг ол.',a:'$r=\\dfrac{'+a+'+'+b+'-'+c+'}{2}='+r+'$ м'};}
function wRope(){for(var i=0;i<300;i++){var h=rnd(3,10),p=rnd(1,2*h);if((h*h)%p)continue;var q=h*h/p;if(q<1||q>30||p===q)continue;return {stem:'Тэгш өнцөгт дээвэрийн орой газарт татсан босоо тулгуур гипотенузыг $'+p+'$ м ба $'+q+'$ м хэрчмүүдэд хуваав. Тулгуурын өндрийг ол.',a:'$\\sqrt{'+p+'\\cdot'+q+'}='+h+'$ м'};}return null;}
// ---------- MC {stem,mc} ----------
function C(t){return {t:t};}
function finishMC(opts){var sh=shuffle(opts),ci=-1;for(var i=0;i<sh.length;i++)if(sh[i].ok)ci=i;return {opts:sh,correct:ci};}
function makeMC(cor,distr){var opts=[{tex:cor.t,ok:true}],used=[cor.t];for(var i=0;i<distr.length&&opts.length<4;i++){var d=distr[i];if(!d)continue;if(used.indexOf(d.t)>=0)continue;used.push(d.t);opts.push({tex:d.t,ok:false});}if(opts.length<4)return null;return finishMC(opts);}
function mTangent(){var t=triLegs();return {stem:'$R='+t.R+'$, $OM='+t.OM+'$ бол шүргэгч $MA=?$',mc:makeMC(C(''+t.MA),[C(''+(t.OM-t.R)),C(''+(t.MA+1)),C(''+t.R),C(''+t.OM)])};}
function mChord(){var t=triLegs();return {stem:'$R='+t.OM+'$, хөвч $'+2*t.R+'$ бол төвөөс зай $=?$',mc:makeMC(C(''+t.MA),[C(''+(t.MA+1)),C(''+t.R),C(''+(t.OM-t.R)),C(''+t.OM)])};}
function mIncircle(){var t=pick(TRI),a=t[0],b=t[1],c=t[2],r=(a+b-c)/2;return {stem:'Катет $'+a+',\\ '+b+'$ тэгш өнцөгт гурвалжинд багтсан тойргийн радиус $=?$',mc:makeMC(C(''+r),[C(''+(r+1)),C(''+(a+b-c)),C(''+Math.round(c/2)),C(''+(r+2))])};}
function mIntersect(){for(var i=0;i<200;i++){var a=rnd(2,9),b=rnd(2,9),P=a*b,c=rnd(2,12);if(P%c)continue;var d=P/c;if(d<1||d>16||c===d)continue;return {stem:'$AK='+a+',\\ KB='+b+',\\ CK='+c+'$ (огтлолцсон хөвч) бол $KD=?$',mc:makeMC(C(''+d),[C(''+(d+1)),C(''+(a+b-c)),C(''+Math.max(1,d-1)),C(''+(P))])};}return null;}
function mTanSec(){for(var i=0;i<300;i++){var MA=rnd(6,15),sq=MA*MA,MB=rnd(2,MA-1);if(sq%MB)continue;var MC=sq/MB;if(MC<=MA||MC>70)continue;return {stem:'Шүргэгч-огтлогч: $MB='+MB+',\\ MC='+MC+'$ бол $MA=?$',mc:makeMC(C(''+MA),[C(''+(MA+1)),C(''+(MC-MB)),C(''+MB),C(''+MC)])};}return null;}
function mTwoSec(){for(var i=0;i<300;i++){var MA=rnd(3,10),MB=rnd(MA+2,20),P=MA*MB,MC=rnd(3,18);if(P%MC)continue;var MD=P/MC;if(MD<=MC||MD>44||MC===MA)continue;return {stem:'Хоёр огтлогч: $MA='+MA+',\\ MB='+MB+',\\ MC='+MC+'$ бол $MD=?$',mc:makeMC(C(''+MD),[C(''+(MD+1)),C(''+Math.max(1,MD-1)),C(''+MC),C(''+MB)])};}return null;}
function mAltitude(){for(var i=0;i<300;i++){var h=rnd(2,12),p=rnd(1,2*h);if((h*h)%p)continue;var q=h*h/p;if(q<1||q>40||p===q)continue;return {stem:'Гипотенузыг $'+p+',\\ '+q+'$ хуваасан өндөр $h=?$',mc:makeMC(C(''+h),[C(''+(h+1)),C(''+Math.round((p+q)/2)),C(''+Math.max(1,h-1)),C(''+(p+q))])};}return null;}
function mExt(){for(var i=0;i<200;i++){var near=pick([20,30,40,50,60]),ang=pick([15,20,25,30,35]),far=near+2*ang;if(far>200)continue;return {stem:'Гадна оройтой өнцөг: нумууд $'+far+'^\\circ,\\ '+near+'^\\circ$ бол өнцөг $=?$',mc:makeMC(C(ang+'^\\circ'),[C((far-near)+'^\\circ'),C((ang+5)+'^\\circ'),C(((far+near)/2)+'^\\circ'),C((ang+10)+'^\\circ')])};}return null;}
function mTanChord(){var arc=pick([40,50,60,70,80,90,100,110,120]),ang=arc/2;return {stem:'Шүргэгч-хөвчийн өнцгийн нум $'+arc+'^\\circ$ бол өнцөг $=?$',mc:makeMC(C(ang+'^\\circ'),[C(arc+'^\\circ'),C((ang+10)+'^\\circ'),C((180-arc)+'^\\circ'),C((ang-5)+'^\\circ')])};}
function mInscribed(){var arc=pick([40,50,60,70,80,90,100,110,120]),ang=arc/2;return {stem:'Багтсан өнцгийн тулсан нум $'+arc+'^\\circ$ бол өнцөг $=?$',mc:makeMC(C(ang+'^\\circ'),[C(arc+'^\\circ'),C((ang+10)+'^\\circ'),C((2*arc)+'^\\circ'),C((ang-5)+'^\\circ')])};}
// ---------- FREE (exam, {stem,a}) ----------
function frFigTangent(){var g=fTangent();return {stem:g.stem+'<div style="margin-top:5px">'+g.fig+'</div>',a:g.a.replace(/^\$|\$$/g,'')};}
function frFigChord(){var g=fChord();return {stem:g.stem+'<div style="margin-top:5px">'+g.fig+'</div>',a:g.a.replace(/^\$|\$$/g,'')};}
function frFigIntersect(){var g=fIntersect();return {stem:g.stem+'<div style="margin-top:5px">'+g.fig+'</div>',a:g.a.replace(/^\$|\$$/g,'')};}
function frFigIncircle(){var g=fIncircle();return {stem:g.stem+'<div style="margin-top:5px">'+g.fig+'</div>',a:g.a.replace(/^\$|\$$/g,'')};}
function frFigTwoSec(){var g=fTwoSec();return {stem:g.stem+'<div style="margin-top:5px">'+g.fig+'</div>',a:g.a.replace(/^\$|\$$/g,'')};}
function frWordTower(){var g=wTower();return {stem:g.stem,a:g.a.replace(/^\$|\$$/g,'')};}
function frWordBridge(){var g=wBridge();return {stem:g.stem,a:g.a.replace(/^\$|\$$/g,'')};}
function frWordWheel(){var g=wWheel();return {stem:g.stem,a:g.a.replace(/^\$|\$$/g,'')};}
function frThales(){var g=nThales();return g?{stem:g.stem,a:g.a.replace(/^\$|\$$/g,'')}:null;}

var SEC1=[nTangent,nChord_d,nIncircle,nIntersect,nTanSec,nTwoSec,nExt,nTanChord],SEC2=[fTangent,fChord,fIntersect,fTanChord],SEC3=[wTower,wBridge,wWheel];
function gen(fn){for(var t=0;t<400;t++){var g=fn();if(g)return g;}return null;}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function build(){window.P1=SEC1.map(function(f){return gen(f);});window.P2=SEC2.map(function(f){return gen(f);});window.P3=SEC3.map(function(f){return gen(f);});layout();}
function layout(){var WK=document.getElementById('sw').checked;var P1=window.P1,P2=window.P2,P3=window.P3;var n=0,ak=[];
  function num(f){n++;ak.push(f?f.a:'');if(!f)return '';return '<div class="q"><div class="qh"><span class="qn">'+n+'.</span><span class="qm">'+f.stem+'</span></div>'+(WK?'<div class="wk"></div>':'')+'</div>';}
  function figq(f){n++;ak.push(f?f.a:'');if(!f)return '';return '<div class="q"><div class="qh"><span class="qn">'+n+'.</span><span class="qm">'+f.stem+'</span></div><div class="gfig">'+f.fig+(WK?'<div class="wk" style="margin-top:6px"></div>':'')+'</div></div>';}
  var b1=P1.map(num).join(''),b2=P2.map(figq).join(''),b3=P3.map(num).join('');
  var akh=ak.map(function(a,i){return '<div class="a"><span class="an">'+(i+1)+')</span><span>'+a+'</span></div>';}).join('');
  document.getElementById('sheet').innerHTML='<div class="head"><h1>VI бүлэг — Жишиг даалгавар 1</h1><div class="sub">Тойргийн чанарууд · шүргэгч · хөвч · багтсан тойрог · огтлолцсон хөвч · огтлогч · өнцгүүд · 9-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="task">I. Бод.</div><div class="grid">'+b1+'</div>'
    +'<div class="task">II. Зураг ашиглан бод.</div><div class="grid">'+b2+'</div>'
    +'<div class="task">III. Өгүүлбэр бодлого.</div><div>'+b3+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+akh+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='VI бүлэг — Жишиг даалгавар 1 (9-р анги)';toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();</script>
