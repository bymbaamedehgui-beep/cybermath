<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Хэмжигдэхүүнийг функцээр илэрхийлэх (11-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 7px;border-left:4px solid var(--purple2);padding-left:9px}
  .col1{display:grid;grid-template-columns:1fr;gap:11px}
  .q{break-inside:avoid;page-break-inside:avoid;overflow:hidden}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:13px;min-width:22px}.qm{font-size:13px;flex:1;overflow:hidden}
  .fig{float:right;margin:0 0 4px 12px}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:22mm;margin-top:5px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:12px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5;overflow:hidden}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  .ans-grid .a svg{float:right;margin:0 0 3px 8px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sw" onchange="layout()" checked> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
// Зургууд
function figRect2(top,left){var W=140,H=86,x=28,y=14,w=98,h=52;return '<svg width="'+W+'" height="'+H+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="'+(x+w/2)+'" y="'+(y-4)+'" font-size="11" text-anchor="middle" fill="#166534">'+top+'</text><text x="'+(x-5)+'" y="'+(y+h/2+4)+'" font-size="11" text-anchor="end" fill="#166534">'+left+'</text></svg>';}
function figBox(a){var W=150,H=118,S=82,ox=34,oy=12,c=17;var g='<rect x="'+ox+'" y="'+oy+'" width="'+S+'" height="'+S+'" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>';
  [[ox,oy],[ox+S-c,oy],[ox,oy+S-c],[ox+S-c,oy+S-c]].forEach(function(pt){g+='<rect x="'+pt[0]+'" y="'+pt[1]+'" width="'+c+'" height="'+c+'" fill="#c7f0d4" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 2"/>';});
  g+='<text x="'+(ox+c/2)+'" y="'+(oy+c-5)+'" font-size="8" text-anchor="middle" fill="#166534">x</text><text x="'+(ox+S-c/2)+'" y="'+(oy+c-5)+'" font-size="8" text-anchor="middle" fill="#166534">x</text>';
  g+='<text x="'+(ox+S/2)+'" y="'+(oy+S+13)+'" font-size="10" text-anchor="middle" fill="#166534">'+a+' см</text>';
  return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';}
function figParab(c){var W=150,H=112,cx=75,ax=52,padT=10,baseY=90;var sX=ax/Math.sqrt(c),sY=(baseY-padT)/c;
  function PX(x){return cx+x*sX;}function PY(y){return baseY-y*sY;}
  var g='<line x1="6" y1="'+baseY+'" x2="'+(W-6)+'" y2="'+baseY+'" stroke="#999" stroke-width="1"/><line x1="'+cx+'" y1="4" x2="'+cx+'" y2="'+(H-6)+'" stroke="#999" stroke-width="1"/>';
  var d='';for(var i=0;i<=40;i++){var x=-Math.sqrt(c)+2*Math.sqrt(c)*i/40;var y=c-x*x;d+=(i?'L':'M')+PX(x).toFixed(1)+' '+PY(y).toFixed(1)+' ';}
  g+='<path d="'+d+'" fill="none" stroke="#16a34a" stroke-width="1.8"/>';
  var x0=Math.sqrt(c)*0.62,yy=c-x0*x0;
  g+='<rect x="'+PX(-x0).toFixed(1)+'" y="'+PY(yy).toFixed(1)+'" width="'+(2*x0*sX).toFixed(1)+'" height="'+(yy*sY).toFixed(1)+'" fill="rgba(124,58,237,.12)" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="3 2"/>';
  g+='<text x="'+(W-9)+'" y="'+(baseY-4)+'" font-size="8" fill="#999" font-style="italic">x</text><text x="'+(cx+5)+'" y="12" font-size="8" fill="#999" font-style="italic">y</text>';
  return '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';}
// Генераторууд
function g_rectArea(){var d=rnd(2,6);return {q:'<span class="fig">'+figRect2('x','x-'+d)+'</span>Тэгш өнцөгтийн урт нь өргөнөөсөө $'+d+'$ см-ээр их. Урт нь $x$ см бол талбайг $x$-ээр илэрхийлж, тодорхойлогдох мужийг ол.',a:'Өргөн $=x-'+d+'$; $S=x(x-'+d+')=x^2-'+d+'x$; $D:\\ x>'+d+'$ (өргөн эерэг байх).'};}
function g_box(){var a=pick([10,12,16,20]);return {q:'<span class="fig">'+figBox(a)+'</span>$'+a+'\\times'+a+'$ см квадрат картны булан бүрээс $x$ талтай квадрат хайчилж, ирмэгийг нь нугалж таггүй хайрцаг хийв. Эзлэхүүнийг $x$-ээр илэрхийл.',a:'Ёроолын тал $'+a+'-2x$, өндөр $x$; $V=('+a+'-2x)^2\\cdot x=4x^3-'+(4*a)+'x^2+'+(a*a)+'x$; $D:\\ 0<x<'+(a/2)+'$.'};}
function g_circleArea(){var kind=pick(['circle','square']);
  if(kind==='circle')return {q:'Дугуйн радиус $r$ см. Дугуйн талбайг $r$-ээр илэрхийлж, тодорхойлогдох мужийг ол.',a:'$S=\\pi r^2$; $D:\\ r>0$.'};
  return {q:'Квадратын периметр $P$ см. Квадратын талбайг $P$-ээр илэрхийл.',a:'Тал $=\\dfrac{P}{4}$; $S=\\left(\\dfrac{P}{4}\\right)^2=\\dfrac{P^2}{16}$; $D:\\ P>0$.'};}
function g_phone(){var S0=pick([25000,30000,35000]),N=pick([300,500,600]),p=pick([40,50,60]);
  return {q:'Гар утасны сарын суурь хураамж $'+S0+'$₮, дотор нь $'+N+'$ минут үнэгүй, дараа нь минут бүрд $'+p+'$₮ төлдөг. Сарын нийт төлбөрийг ярьсан минут $x$-ээр илэрхийл.',a:'$y=\\begin{cases}'+S0+', & 0\\le x\\le '+N+'\\\\ '+S0+'+'+p+'(x-'+N+'), & x>'+N+'\\end{cases}$; $x>'+N+'$ үед $y='+p+'x+'+(S0-p*N)+'$.'};}
function g_pct(){var PR=pick([[7,'тэтгэврийн'],[8,'тэтгэмжийн'],[2,'эрүүл мэндийн'],[10,'нийт']]),q=PR[0],nm=PR[1];
  return {q:'Ажилтны сарын үндсэн цалин $x$ төгрөг. '+nm+' даатгалын шимтгэл нь цалингийн $'+q+'\\%$ бол шимтгэлийн дүнг $x$-ээр илэрхийл.',a:'$y=\\dfrac{'+q+'}{100}\\,x$ (шугаман функц); $D:\\ x>0$.'};}
function g_inscribed(){var c=pick([4,9,16]),r=Math.sqrt(c);return {q:'<span class="fig">'+figParab(c)+'</span>$y='+c+'-x^2$ параболд суурь нь $Ox$ тэнхлэг дээр орших тэгш өнцөгт багтжээ. Баруун доод оройн абсцисс $x$ бол талбайг $x$-ээр илэрхийл.',a:'Өргөн $2x$, өндөр $'+c+'-x^2$; $S=2x('+c+'-x^2)='+(2*c)+'x-2x^3$; $D:\\ 0<x<'+r+'$.'};}
var GENS=[g_rectArea,g_box,g_circleArea,g_phone,g_pct,g_inscribed];
function gen(fn){for(var t=0;t<200;t++){var f=fn();if(f)return f;}return null;}
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var qs=sheet.querySelectorAll('.col1 .q');for(var i=0;i<qs.length;i++){var ql=qs[i].querySelector('.ql');if(ql)ql.textContent=(i+1)+'.';}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=(j+1)+'.';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<40){var qs=sheet.querySelectorAll('.col1 .q');if(qs.length<=3)break;var last=qs[qs.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
function genPool(){var seen={},P=[],i=0,tr=0;while(P.length<12&&tr<600){tr++;var f=gen(GENS[i%GENS.length]);i++;if(!f||seen[f.q])continue;seen[f.q]=1;P.push(f);}return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());var K=0;
  var qs=S.map(function(f){var k=K++;return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(WK?'<div class="wk"></div>':'')+'</div>';}).join('');
  var ans=S.map(function(f,i){return '<div class="a" data-k="'+i+'"><span class="an"></span>'+f.a+'</div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Хэмжигдэхүүнийг функцээр илэрхийлэх</h1><div class="sub">III бүлэг · 3.1 Функц, функцийг өгөх арга — хэрэглээ · 11-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule"><b>Алхам:</b> 1) Хайх хэмжигдэхүүнийг $y$ (талбай, эзлэхүүн, төлбөр), хамаарах хувьсагчийг $x$ гэж тэмдэглэ. 2) Геометр/нөхцөлийн томьёогоор $y$-г $x$-ээр илэрхийл. 3) Утга нь <b>бодит утгатай</b> байх $x$-ийн муж ($D$)-ийг зааж өг.</div>'
    +'<div class="task">Дараах хэмжигдэхүүнийг функцээр (томьёогоор) илэрхийлж, тодорхойлогдох мужийг ол.</div>'
    +'<div class="col1">'+qs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ans+'</div></div>';
  window.WS_ITEMS=[];window.WS_TITLE='Хэмжигдэхүүнийг функцээр илэрхийлэх';
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=40"></script>
</body>
</html>
