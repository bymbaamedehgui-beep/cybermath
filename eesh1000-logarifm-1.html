// 21. f(x) = a^x: f(x₀) = k·f(m) ⇔ a^{x₀} = k·a^m ⇔ x₀ = m + log_a k.  k = a^j·r (r нь a-д хуваагдахгүй) гэвэл
//     x₀ = (m + j) + log_a r (r = 1 бол бүхэл);  s = m + j > 0 бол мөн x₀ = log_a(a^s·r), s < 0 бол log_a(r/a^{|s|}).
function p21() {
  var a = pick([2, 2, 2, 3, 3, 5]), m = rnd(-2, 5), k = rnd(2, 12);
  if (m === 0 && rnd(0, 2)) return null;
  var j = 0, r = k;
  while (r % a === 0) { r /= a; j++; }
  if (r === 1 && rnd(0, 1)) return null;                         // бүхэл хариу цөөн
  var s = m + j, L = '\\log_{' + a + '}', x0;
  if (r === 1) x0 = String(s);
  else if (s > 0) x0 = (Math.pow(a, s) * r <= 999 ? L + (Math.pow(a, s) * r) + '=' : '') + s + '+' + L + r;
  else if (s === 0) x0 = L + r;
  else x0 = L + '\\dfrac{' + r + '}{' + Math.pow(a, -s) + '}=' + L + r + '-' + (-s);
  return {
    q: '$f(x)=' + a + '^x$ ба $f(x_0)=' + k + 'f(' + m + ')$ бол $x_0$ утгыг олоорой.',
    a: '$x_0=' + x0 + '$',
    wk: 20,
    t: { a: a, k: k, m: m }
  };
}
return p21;
})();

/* 3.62 */
var e3_62 = (function () {
// 62. Илтгэгч тэгшитгэл: t = B^x > 0 гэвэл B^{2x+k} − m×B^x + n = 0 ⇔ B^k·t² − m·t + n = 0.
//     Язгуурууд t₁ = B^u, t₂ = B^v (u > v бүхэл) ⇒ x₁ + x₂ = u + v;  m = B^{k+u} + B^{k+v}, n = B^{k+u+v} (бүхэл: k + v ≥ 0, k + u + v ≥ 0).
//     (эх: 2^{2x+1} − 9×2^x + 4 = 0 → 2t² − 9t + 4 = 0 → t = 4; ½ → x = 2; −1 → нийлбэр 1)
function p62() {
  var B = rnd(1, 4) === 1 ? 3 : 2, k = B === 2 ? pick([0, 1, 1, 1, 2, 2, 3, -1]) : pick([0, 1, 1, 2, -1]);
  var v = rnd(-3, 2), u = v + rnd(1, B === 2 ? 4 : 3);
  if (k + v < 0 || k + u + v < 0) return null;
  var m = Math.pow(B, k + u) + Math.pow(B, k + v), n = Math.pow(B, k + u + v);
  if (m < 2 || m > 40 || n > 81) return null;
  return {
    q: '$' + B + '^{2x' + (k ? sgn(k) : '') + '}-' + m + '\\times ' + B + '^x+' + n + '=0$ тэгшитгэлийн шийдүүдийн нийлбэрийг олоорой.',
    a: '$x_1+x_2=' + (u + v) + '$',
    wk: 26,
    t: { B: B, k: k, m: m, n: n, u: u, v: v }
  };
}
return p62;
})();

/* 3.88 */
var e3_88 = (function () {
// 88. (62-ын ихэр) Илтгэгч тэгшитгэл: t = B^x > 0 гэвэл B^{2x+k} − m×B^{x+j} + n = 0 ⇔ B^k·t² − m·B^j·t + n = 0 (j ≠ 0).
//     Язгуурууд t₁ = B^u, t₂ = B^v (u > v бүхэл) ⇒ x₁ + x₂ = u + v;  m = B^{k−j+u} + B^{k−j+v}, n = B^{k+u+v}
//     (бүхэл: k − j + v ≥ 0, k + u + v ≥ 0).  (эх: 2^{2x+1} − 9×2^{x−1} + 1 = 0 → 4t² − 9t + 2 = 0 → t = 2; ¼ → x = 1; −2 → нийлбэр −1)

  var B = rnd(1, 4) === 1 ? 3 : 2;
  var k = B === 2 ? pick([1, 1, 1, 0, 2, 2, 3]) : pick([0, 1, 1, 2]), j = B === 2 ? pick([-1, -1, -1, -2, 1, 2]) : pick([-1, -1, 1]);
  var v = rnd(-3, 2), u = v + rnd(1, B === 2 ? 4 : 3);
  if (k - j + v < 0 || k + u + v < 0) return null;
  var m = Math.pow(B, k - j + u) + Math.pow(B, k - j + v), n = Math.pow(B, k + u + v);
  if (m < 2 || m > 40 || n > 81) return null;
  return {
    q: '$' + B + '^{2x' + (k ? sgn(k) : '') + '}-' + m + '\\times ' + B + '^{x' + sgn(j) + '}+' + n + '=0$ тэгшитгэлийн шийдүүдийн нийлбэрийг олоорой.',
    a: '$x_1+x_2=' + (u + v) + '$',
    wk: 26,
    t: { B: B, k: k, j: j, m: m, n: n, u: u, v: v }

return p88;
})();

/* 4.99 */
var e4_99 = (function () {
// 99. (x² − b)(c^x − c^k) = 0-ийг задалсан хэлбэрээр: c^x·x² − b·c^x + b·c^k = c^k·x² (b = c^j бол b·c^x = c^{x+j}).
//     Бүлэглэж үржигдэхүүн болгоход x² − b = 0 ⇒ x = ±√b,  c^x = c^k ⇒ x = k  (k² ≠ b — гурван ялгаатай шийд).
//     Асуулт голдуу шийдүүдийн квадратуудын нийлбэр 2b + k², заримдаа нийлбэр k эсвэл үржвэр −bk.
function p99() {
  var c = pick([2, 2, 3, 3, 4, 4, 5]), k = pick([1, 1, 2, 2, 3]), ck = Math.pow(c, k);
  var b = rnd(0, 9) < 6 ? Math.pow(rnd(1, 5), 2) : pick([2, 3, 5, 6, 7, 8, 10, 12]);
  if (ck > 64 || b === k * k || b * ck > 320) return null;
  var j = -1, t = 1, e;
  for (e = 0; e <= 8; e++) { if (t === b) j = e; t *= c; }
  var term = j === 0 ? c + '^x' : j > 0 ? c + '^{x+' + j + '}' : b + '\\times ' + c + '^x';
  var eq = c + '^x\\times x^2-' + term + '+' + b * ck + '=' + ck + 'x^2';
  var kind = pick(['sq', 'sq', 'sq', 'sq', 'sq', 'sum', 'prod']);
  var Q = { sq: 'квадратуудын нийлбэрийг', sum: 'нийлбэрийг', prod: 'үржвэрийг' }[kind];
  var A = { sq: 'x_1^2+x_2^2+x_3^2=' + (2 * b + k * k), sum: 'x_1+x_2+x_3=' + k, prod: 'x_1x_2x_3=' + (-b * k) }[kind];
  return {
    q: '$' + eq + '$ тэгшитгэлийн шийдүүдийн ' + Q + ' олоорой.',
    a: '$' + A + '$',
    wk: 28,
    t: { c: c, k: k, b: b, kind: kind }
  };
}
return p99;
})();
