<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Векторын координат · зурагнаас ол, хоёр цэгээр, урт (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--orange:#e0701a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:11mm 13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 24px 2px 4px}
  .rule{font-size:12px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center}
  .sec{font-size:12.5px;font-weight:800;color:#5a32d6;margin:6px 0 8px;display:flex;align-items:center;gap:7px}
  .sec b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;background:var(--purple);color:#fff;font-size:11px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px 12px;margin-bottom:12px}
  .cgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px 14px;margin-bottom:12px}
  .q{break-inside:avoid;page-break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:7px 8px;background:linear-gradient(#fff,#fbf9ff)}
  .q .qn{font-weight:800;color:var(--purple);font-size:12.5px}
  .dfig{display:flex;justify-content:center;margin-top:2px}.dfig svg{width:100%;max-width:118px;height:auto}
  .qm{font-size:13px}
  .ansl{font-size:12.5px;font-weight:700;margin-top:5px;color:var(--ink)}.ansl .bl{display:inline-block;min-width:60px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .wgrid{display:grid;grid-template-columns:1fr;gap:8px}
  .wq{break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:8px 11px;background:linear-gradient(#fff,#fbf9ff)}
  .wq .wn{font-weight:800;color:var(--purple);margin-right:5px}.wq .wt{font-size:13px}.wq .wt .ask{color:#5a32d6;font-weight:700}
  .wans{font-size:12px;font-weight:700;margin-top:5px}.wans .bl{display:inline-block;min-width:150px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  .ans-w{margin-top:8px;font-size:12.5px;display:grid;gap:5px}.ans-w .an{color:var(--soft);font-weight:800}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function simpRoot(N){var a=1;for(var d=2;d*d<=N;d++){while(N%(d*d)===0){N=N/(d*d);a*=d;}}return {a:a,b:N};}
function rootLatex(N){if(N===0)return '0';var s=simpRoot(N);if(s.b===1)return ''+s.a;return (s.a===1?'':s.a)+'\\sqrt{'+s.b+'}';}
function vec(x,y){return '\\dbinom{'+x+'}{'+y+'}';}

/* ── Зурагт вектор (эхний мужийн тор 0..6) ── */
var VB=160, GU=VB/6;
function gx(x){return x*GU;}
function gy(y){return VB-y*GU;}
function drawVec(A,B){
  var s='<svg viewBox="-8 -8 '+(VB+18)+' '+(VB+18)+'" xmlns="http://www.w3.org/2000/svg">';
  for(var i=0;i<=6;i++){s+='<line x1="'+gx(i)+'" y1="0" x2="'+gx(i)+'" y2="'+VB+'" stroke="#eceaf6" stroke-width="1"/>';
    s+='<line x1="0" y1="'+gy(i)+'" x2="'+VB+'" y2="'+gy(i)+'" stroke="#eceaf6" stroke-width="1"/>';}
  s+='<line x1="0" y1="'+VB+'" x2="'+(VB+8)+'" y2="'+VB+'" stroke="#555" stroke-width="1.3"/><path d="M'+(VB+8)+' '+VB+' l-5 -3 l0 6 Z" fill="#555"/>';
  s+='<line x1="0" y1="'+VB+'" x2="0" y2="-6" stroke="#555" stroke-width="1.3"/><path d="M0 -6 l-3 5 l6 0 Z" fill="#555"/>';
  s+='<text x="'+(VB+6)+'" y="'+(VB+11)+'" font-size="8" font-style="italic" fill="#666">x</text><text x="4" y="-1" font-size="8" font-style="italic" fill="#666">y</text>';
  for(var k=1;k<=5;k++){s+='<text x="'+(gx(k)-2)+'" y="'+(VB+10)+'" font-size="9" fill="#9a92b5">'+k+'</text>';
    s+='<text x="2" y="'+(gy(k)+3)+'" font-size="9" fill="#9a92b5">'+k+'</text>';}
  // вектор
  var ax=gx(A[0]),ay=gy(A[1]),bx=gx(B[0]),by=gy(B[1]);
  var dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux;
  s+='<line x1="'+ax.toFixed(1)+'" y1="'+ay.toFixed(1)+'" x2="'+bx.toFixed(1)+'" y2="'+by.toFixed(1)+'" stroke="#2f6cae" stroke-width="2.2"/>';
  s+='<path d="M'+bx.toFixed(1)+' '+by.toFixed(1)+' L'+(bx-9*ux+4.5*px).toFixed(1)+' '+(by-9*uy+4.5*py).toFixed(1)+' L'+(bx-9*ux-4.5*px).toFixed(1)+' '+(by-9*uy-4.5*py).toFixed(1)+' Z" fill="#2f6cae"/>';
  s+='<circle cx="'+ax.toFixed(1)+'" cy="'+ay.toFixed(1)+'" r="2" fill="#1a1030"/>';
  s+='<text class="vl" x="'+(ax-6)+'" y="'+(ay+11)+'" font-size="9" font-weight="700" font-style="italic" fill="#1a1030">A</text>';
  s+='<text class="vl" x="'+(bx+4)+'" y="'+(by-4)+'" font-size="9" font-weight="700" font-style="italic" fill="#1a1030">B</text>';
  s+='</svg>';return s;
}
function gen1(){
  var A=[rnd(1,5),rnd(1,5)],B=[rnd(1,5),rnd(1,5)];
  if(A[0]===B[0]&&A[1]===B[1])return gen1();
  return {A:A,B:B,x:B[0]-A[0],y:B[1]-A[1],sig:(B[0]-A[0])+','+(B[1]-A[1])};
}
function gen2(){
  var ax=nz(-6,6),ay=nz(-6,6),bx=nz(-6,6),by=nz(-6,6);
  if(ax===bx&&ay===by)return gen2();
  var x=bx-ax,y=by-ay,N=x*x+y*y;
  return {q:'A('+ax+',\\,'+ay+'),\\ B('+bx+',\\,'+by+')',x:x,y:y,len:rootLatex(N),sig:ax+','+ay+','+bx+','+by};
}
function wp(){
  return pick([
    (function(){var ax=nz(-5,5),ay=nz(-5,5),x=nz(-5,5),y=nz(-5,5);
      return {t:'$\\overrightarrow{AB}='+vec(x,y)+'$ вектор, эхлэл $A('+ax+',\\,'+ay+')$. <span class="ask">Төгсгөл $B$-ийн координатыг ол.</span>',
        a:'$B=('+(ax+x)+',\\ '+(ay+y)+')$  (B = A + вектор)'};})(),
    (function(){var a=nz(-5,5),b=nz(-5,5),c=nz(-5,5),d=nz(-5,5);
      return {t:'$\\overrightarrow{AB}='+vec(a,b)+'$, $\\overrightarrow{CD}='+vec(c,d)+'$. <span class="ask">$\\overrightarrow{AB}+\\overrightarrow{CD}$-ийг ол.</span>',
        a:'$'+vec(a+c,b+d)+'$'};})(),
    (function(){var x=nz(-8,8),y=nz(-8,8),N=x*x+y*y;
      return {t:'$\\overrightarrow{AB}='+vec(x,y)+'$ векторын <span class="ask">урт (модуль)-ийг ол.</span>',
        a:'$|\\overrightarrow{AB}|=\\sqrt{'+(x*x)+'+'+(y*y)+'}=\\sqrt{'+N+'}'+(simpRoot(N).b===1?'':'='+rootLatex(N))+'$'};})()
  ]);
}

function build(){
  var d1='',c2='',a1='',a2='',items=[],seen={},n=0,i,g;
  for(i=0;i<6;i++){var t=0;do{g=gen1();t++;}while(seen[g.sig]&&t<60);seen[g.sig]=1;n++;
    d1+='<div class="q"><div class="qn">'+n+'.</div><div class="dfig">'+drawVec(g.A,g.B)+'</div>'
      +'<div class="ansl">$\\overrightarrow{AB}=$<span class="bl"></span></div></div>';
    a1+='<div class="a"><span class="an">'+n+'.</span><span>$'+vec(g.x,g.y)+'$</span></div>';
    items.push({q:'Зургаас вектор',a:'('+g.x+','+g.y+')'});}
  for(i=0;i<12;i++){var t2=0;do{g=gen2();t2++;}while(seen[g.sig]&&t2<60);seen[g.sig]=1;n++;
    c2+='<div class="q"><span class="qn">'+n+'.</span> <span class="qm">$'+g.q+'$</span>'
      +'<div class="ansl">$\\overrightarrow{AB}=$<span class="bl"></span>, $|\\overrightarrow{AB}|=$<span class="bl"></span></div></div>';
    a2+='<div class="a"><span class="an">'+n+'.</span><span>$'+vec(g.x,g.y)+',\\ |\\overrightarrow{AB}|='+g.len+'$</span></div>';
    items.push({q:g.q,a:'('+g.x+','+g.y+'), урт '+g.len});}
  var W=(function(){var arr=[],s={},t=0;while(arr.length<3&&t<60){var w=wp(),k=w.t.slice(0,22);if(!s[k]){s[k]=1;arr.push(w);}t++;}while(arr.length<3)arr.push(wp());return arr;})();
  var wc='',wa='';
  for(i=0;i<W.length;i++){var w=W[i];n++;
    wc+='<div class="wq"><span class="wn">'+n+'.</span><span class="wt">'+w.t+'</span><div class="wans">Хариу:<span class="bl"></span></div></div>';
    wa+='<div><span class="an">'+n+'.</span> '+w.a+'</div>';
    items.push({q:'Бодлого '+n,a:w.a});}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Векторын координат</h1><div class="sub">Зургаас унших · хоёр цэгээр · векторын урт (модуль) · 9-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$\\overrightarrow{AB}=\\dbinom{x_2-x_1}{y_2-y_1}$ &nbsp;·&nbsp; урт: $|\\overrightarrow{AB}|=\\sqrt{x^2+y^2}$ &nbsp;·&nbsp; (x — хэвтээ, y — босоо шилжилт)</div>'
    +'<div class="sec"><b>1</b> Зургаас векторын координатыг ол</div><div class="dgrid">'+d1+'</div>'
    +'<div class="sec"><b>2</b> Хоёр цэгээр вектор ба уртыг ол</div><div class="cgrid">'+c2+'</div>'
    +'<div class="sec"><b>3</b> Бодлого</div><div class="wgrid">'+wc+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+a1+a2+'</div><div class="ans-w">'+wa+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Векторын координат';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=18"></script>
</body>
</html>
