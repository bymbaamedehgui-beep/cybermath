<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Векторын координат 1 · зургаас бич ба байгуул (9-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--orange:#e0701a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:11mm 13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 24px 2px 4px}
  .rule{font-size:12px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center}
  .sec{font-size:12.5px;font-weight:800;color:#5a32d6;margin:6px 0 8px;display:flex;align-items:center;gap:7px}
  .sec b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;background:var(--purple);color:#fff;font-size:11px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px;margin-bottom:12px}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:12px}
  .q{break-inside:avoid;page-break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:7px 8px;background:linear-gradient(#fff,#fbf9ff)}
  .q .qn{font-weight:800;color:var(--purple);font-size:12.5px}
  .q .give{font-size:13px;margin-left:4px}
  .rq{display:flex;gap:8px;align-items:center}.rq .rfig{flex:none}.rq .rt{flex:1}
  .dfig{display:flex;justify-content:center;margin-top:2px}.dfig svg{width:100%;max-width:128px;height:auto}
  .rfig svg{width:132px;height:132px}
  .ansl{font-size:12px;font-weight:700;margin-top:5px;color:var(--ink)}.ansl .bl{display:inline-block;min-width:56px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .vlist{font-size:12.5px;font-weight:700;display:grid;gap:6px}.vlist .bl{display:inline-block;min-width:52px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function vec(x,y){return '\\dbinom{'+x+'}{'+y+'}';}

var VB=160, GU=VB/6;
function gx(x){return x*GU;}
function gy(y){return VB-y*GU;}
function gridBase(){
  var s='';
  for(var i=0;i<=6;i++){s+='<line x1="'+gx(i)+'" y1="0" x2="'+gx(i)+'" y2="'+VB+'" stroke="#eceaf6" stroke-width="1"/>';
    s+='<line x1="0" y1="'+gy(i)+'" x2="'+VB+'" y2="'+gy(i)+'" stroke="#eceaf6" stroke-width="1"/>';}
  s+='<line x1="0" y1="'+VB+'" x2="'+(VB+8)+'" y2="'+VB+'" stroke="#555" stroke-width="1.3"/><path d="M'+(VB+8)+' '+VB+' l-5 -3 l0 6 Z" fill="#555"/>';
  s+='<line x1="0" y1="'+VB+'" x2="0" y2="-6" stroke="#555" stroke-width="1.3"/><path d="M0 -6 l-3 5 l6 0 Z" fill="#555"/>';
  s+='<text x="'+(VB+6)+'" y="'+(VB+11)+'" font-size="8" font-style="italic" fill="#666">x</text><text x="4" y="-1" font-size="8" font-style="italic" fill="#666">y</text>';
  for(var k=1;k<=5;k++){s+='<text x="'+(gx(k)-2)+'" y="'+(VB+10)+'" font-size="9" fill="#9a92b5">'+k+'</text>';
    s+='<text x="2" y="'+(gy(k)+3)+'" font-size="9" fill="#9a92b5">'+k+'</text>';}
  return s;
}
function svgOpen(){return '<svg viewBox="-8 -8 '+(VB+18)+' '+(VB+18)+'" xmlns="http://www.w3.org/2000/svg">';}
function arrowSvg(a,b){var dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux;
  return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="#2f6cae" stroke-width="2"/>'
    +'<path d="M'+b[0].toFixed(1)+' '+b[1].toFixed(1)+' L'+(b[0]-8*ux+4*px).toFixed(1)+' '+(b[1]-8*uy+4*py).toFixed(1)+' L'+(b[0]-8*ux-4*px).toFixed(1)+' '+(b[1]-8*uy-4*py).toFixed(1)+' Z" fill="#2f6cae"/>';}
function dotLbl(A,lbl,dxL,dyL){var ax=gx(A[0]),ay=gy(A[1]);
  return '<circle cx="'+ax.toFixed(1)+'" cy="'+ay.toFixed(1)+'" r="2.2" fill="#1a1030"/><text x="'+(ax+dxL)+'" y="'+(ay+dyL)+'" font-size="9" font-weight="700" font-style="italic" fill="#1a1030">'+lbl+'</text>';}
/* нэг буюу олон вектор: цэгүүдийг дараалан сумаар холбоно (closed бол сүүлээс эхэнд) */
function drawChain(pts,closed,labels){
  var sp=pts.map(function(p){return [gx(p[0]),gy(p[1])];});
  var cx=sp.reduce(function(s,p){return s+p[0];},0)/sp.length, cy=sp.reduce(function(s,p){return s+p[1];},0)/sp.length;
  var s=svgOpen()+gridBase(), m=closed?pts.length:pts.length-1, i;
  for(i=0;i<m;i++)s+=arrowSvg(sp[i],sp[(i+1)%pts.length]);
  for(i=0;i<pts.length;i++){var dx=sp[i][0]-cx,dy=sp[i][1]-cy,L=Math.hypot(dx,dy)||1;
    s+='<circle cx="'+sp[i][0].toFixed(1)+'" cy="'+sp[i][1].toFixed(1)+'" r="2.2" fill="#1a1030"/>';
    s+='<text x="'+(sp[i][0]+dx/L*11).toFixed(1)+'" y="'+(sp[i][1]+dy/L*11+3).toFixed(1)+'" font-size="9.5" font-weight="700" font-style="italic" fill="#1a1030" text-anchor="middle">'+labels[i]+'</text>';}
  return s+'</svg>';
}
function drawStart(A){return svgOpen()+gridBase()+dotLbl(A,'A',-8,11)+'</svg>';}

var LET='ABCDE';
function genSingle(){var A=[rnd(1,5),rnd(1,5)],B=[rnd(1,5),rnd(1,5)];if(A[0]===B[0]&&A[1]===B[1])return genSingle();
  return {pts:[A,B],labels:['A','B'],closed:false,vectors:[{name:'AB',x:B[0]-A[0],y:B[1]-A[1]}],sig:'s'+(B[0]-A[0])+','+(B[1]-A[1])};}
function genPoly(n){
  var pts,ok,g=0,i;
  while(g++<300){
    var used={};pts=[];
    for(i=0;i<n;i++){var p,h=0;do{p=[rnd(1,5),rnd(1,5)];h++;}while(used[p.join()]&&h<40);used[p.join()]=1;pts.push(p);}
    var cx=pts.reduce(function(s,q){return s+q[0];},0)/n, cy=pts.reduce(function(s,q){return s+q[1];},0)/n;
    pts.sort(function(a,b){return Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx);});
    ok=true;var area=0;
    for(i=0;i<n;i++){var A=pts[i],B=pts[(i+1)%n];if(Math.hypot(B[0]-A[0],B[1]-A[1])<1.4)ok=false;area+=A[0]*B[1]-B[0]*A[1];}
    if(Math.abs(area)/2 < n*0.9)ok=false;
    if(ok)break;
  }
  var labels=[],vectors=[];
  for(i=0;i<n;i++)labels.push(LET[i]);
  for(i=0;i<n;i++){var A2=pts[i],B2=pts[(i+1)%n];vectors.push({name:labels[i]+labels[(i+1)%n],x:B2[0]-A2[0],y:B2[1]-A2[1]});}
  return {pts:pts,labels:labels,closed:true,vectors:vectors,sig:'p'+pts.map(function(p){return p.join('_');}).join(',')};
}
function genRead(kind){return kind==='single'?genSingle():genPoly(kind==='tri'?3:4);}
function genBuild(){
  var A=[rnd(1,4),rnd(1,4)],vx=nz(-3,3),vy=nz(-3,3),B=[A[0]+vx,A[1]+vy];
  if(B[0]<0||B[0]>6||B[1]<0||B[1]>6)return genBuild();
  return {A:A,B:B,x:vx,y:vy,sig:'b'+A.join()+vx+vy};
}

function build(){
  var d1='',d2='',a1='',a2='',items=[],seen={},n=0,i,g;
  var RTYPES=['single','tri','quad','tri','single','quad'];
  for(i=0;i<RTYPES.length;i++){var t=0;do{g=genRead(RTYPES[i]);t++;}while(seen[g.sig]&&t<80);seen[g.sig]=1;n++;
    var vl=g.vectors.map(function(v){return '$\\overrightarrow{'+v.name+'}=$<span class="bl"></span>';}).join('');
    d1+='<div class="q"><div class="rq"><div class="rfig">'+drawChain(g.pts,g.closed,g.labels)+'</div>'
      +'<div class="rt"><span class="qn">'+n+'.</span> Векторуудыг бич:<div class="vlist">'+vl+'</div></div></div></div>';
    a1+='<div class="a"><span class="an">'+n+'.</span><span>'+g.vectors.map(function(v){return '$\\overrightarrow{'+v.name+'}='+vec(v.x,v.y)+'$';}).join(',&nbsp; ')+'</span></div>';
    items.push({q:'Векторуудын координат',a:g.vectors.map(function(v){return v.name+'('+v.x+','+v.y+')';}).join(' ')});}
  for(i=0;i<6;i++){var t2=0;do{g=genBuild();t2++;}while(seen[g.sig]&&t2<60);seen[g.sig]=1;n++;
    d2+='<div class="q"><span class="qn">'+n+'.</span><span class="give">$\\overrightarrow{AB}='+vec(g.x,g.y)+'$</span><div class="dfig">'+drawStart(g.A)+'</div>'
      +'<div class="ansl">B =<span class="bl"></span></div></div>';
    a2+='<div class="a"><span class="an">'+n+'.</span><span>B('+g.B[0]+', '+g.B[1]+')  (A-аас $'+vec(g.x,g.y)+'$ зур)</span></div>';
    items.push({q:'Вектор байгуул '+vec(g.x,g.y),a:'B('+g.B[0]+','+g.B[1]+')'});}
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Векторын координат 1</h1><div class="sub">Зургаас векторыг бич · өгсөн координатаар вектор байгуул · 9-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">$\\overrightarrow{AB}=\\dbinom{x_2-x_1}{y_2-y_1}$ &nbsp;·&nbsp; x — хэвтээ, y — босоо шилжилт &nbsp;·&nbsp; байгуулахдаа A-аас x нэгж хэвтээ, y нэгж босоо явж B-г тэмдэглэ</div>'
    +'<div class="sec"><b>1</b> Зургаас векторуудын координатыг бич</div><div class="rgrid">'+d1+'</div>'
    +'<div class="sec"><b>2</b> Өгсөн вектор байгуул (сум зурж, B-г ол)</div><div class="dgrid">'+d2+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+a1+a2+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Векторын координат 1';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=33"></script>
</body>
</html>
