<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Гурвалжны биссектрисийн чанар · зурагтай ажлын хуудас</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--orange:#e0701a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:11mm 13mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:7px 2px 9px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 22px 2px 4px}
  .rule{font-size:11.5px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .sec{font-size:12.5px;font-weight:800;color:#5a32d6;margin:4px 0 8px;display:flex;align-items:center;gap:7px}
  .sec b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;background:var(--purple);color:#fff;font-size:11px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px 12px;margin-bottom:11px}
  .q{break-inside:avoid;page-break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:6px 7px 7px;background:linear-gradient(#fff,#fbf9ff)}
  .qh{font-weight:800;color:var(--purple);font-size:12.5px;margin-bottom:1px}
  .dfig{display:flex;justify-content:center}
  .dfig svg{width:100%;max-width:180px;height:auto}
  .xline{font-size:12.5px;font-weight:700;margin-top:3px}.xline .bl{display:inline-block;min-width:66px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .wgrid{display:grid;grid-template-columns:1fr;gap:8px}
  .wq{break-inside:avoid;page-break-inside:avoid;border:1.2px solid #e7e0f7;border-radius:9px;padding:8px 11px;background:linear-gradient(#fff,#fbf9ff);display:flex;gap:9px}
  .wq .wn{font-weight:800;color:var(--purple);min-width:20px;font-size:13px}
  .wq .wt{font-size:12.7px}.wq .wt .ask{color:#5a32d6;font-weight:700}
  .wans{font-size:12px;font-weight:700;margin-top:5px}.wans .bl{display:inline-block;min-width:150px;border-bottom:1.3px solid #b9accf;height:1em;vertical-align:-2px;margin-left:4px}
  .ans-page{margin-top:8mm;border-top:2px dashed #ddd;padding-top:6mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:20px}
  .ans-w{margin-top:8px;font-size:12.5px;display:grid;gap:5px}.ans-w .an{color:var(--soft);font-weight:800}
  #answers{display:none}
  /* svg */
  .s-side{fill:none;stroke:#7B52EE;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .s-bis{fill:none;stroke:var(--orange);stroke-width:2;stroke-linecap:round}
  .s-arc{fill:none;stroke:var(--orange);stroke-width:1.3}
  .s-vtx{fill:#3a2d5e}
  .s-vl{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:11px;fill:#3a2d5e}
  .s-len{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;font-size:10.5px;fill:#6b6480}
  .s-x{fill:var(--orange);font-weight:800;font-style:italic;font-family:Georgia,serif;font-size:12px}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:10mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()">↻ Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()">🖨 Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}

/* ---- SVG туслах ---- */
function A2(V,P){return Math.atan2(P[1]-V[1],P[0]-V[0]);}
function PT(V,r,a){return [V[0]+r*Math.cos(a),V[1]+r*Math.sin(a)];}
function arcD(V,r,a1,a2){while(a2-a1>Math.PI)a2-=2*Math.PI;while(a2-a1<-Math.PI)a2+=2*Math.PI;var p1=PT(V,r,a1),p2=PT(V,r,a2),sw=a2>a1?1:0;return 'M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A'+r+' '+r+' 0 0 '+sw+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);}
function tickD(V,r,a){var i=PT(V,r-3.3,a),o=PT(V,r+3.3,a);return 'M'+i[0].toFixed(1)+' '+i[1].toFixed(1)+' L'+o[0].toFixed(1)+' '+o[1].toFixed(1);}
function midA(a1,a2){while(a2-a1>Math.PI)a2-=2*Math.PI;while(a2-a1<-Math.PI)a2+=2*Math.PI;return (a1+a2)/2;}

var RATIOS=[[2,3],[3,4],[3,5],[4,5],[2,5],[3,2],[4,3],[5,3],[5,4],[5,2],[2,7],[4,7]];
var NAMESETS=[['A','B','C'],['K','L','M'],['P','Q','R'],['M','N','L'],['E','F','G'],['A','B','C']];

/* нэг зурагтай бодлого үүсгэх */
function genDiag(){
  var r=pick(RATIOS),a=r[0],b=r[1];
  var k1=rnd(1,3),k2=rnd(1,3);
  var sL=a*k1,sR=b*k1,gL=a*k2,gR=b*k2;
  if(pick([0,1])){var t;t=sL;sL=sR;sR=t;t=gL;gL=gR;gR=t;} // толин ойлголт
  var tv={sL:sL,sR:sR,gL:gL,gR:gR};
  var unk=pick(['sL','sR','gL','gR']);
  var nm=pick(NAMESETS).slice(); var foot=(nm.indexOf('D')<0)?'D':'H';
  // координат
  var Bx=16,Cx=194,By=126,Cy=126;
  var ax=rnd(74,138),ay=rnd(15,25);
  var Dx=Bx+(gL/(gL+gR))*(Cx-Bx);
  return {a:a,b:b,tv:tv,unk:unk,nm:nm,foot:foot,
    A:[ax,ay],B:[Bx,By],C:[Cx,Cy],D:[Dx,By]};
}
function lab(v,isX){return isX?'x':(''+v);}
function drawTri(g){
  var A=g.A,B=g.B,C=g.C,D=g.D,t=g.tv,u=g.unk,nm=g.nm;
  var s='<svg viewBox="0 0 210 152" xmlns="http://www.w3.org/2000/svg">';
  s+='<path class="s-side" d="M'+A[0]+' '+A[1]+' L'+B[0]+' '+B[1]+' L'+C[0]+' '+C[1]+' Z"/>';
  s+='<path class="s-bis" d="M'+A[0]+' '+A[1]+' L'+D[0].toFixed(1)+' '+D[1]+'"/>';
  // тэнцүү өнцгийн нум
  var aB=A2(A,B),aD=A2(A,D),aC=A2(A,C),R=15;
  s+='<path class="s-arc" d="'+arcD(A,R,aB,aD)+'"/><path class="s-arc" d="'+arcD(A,R,aD,aC)+'"/>';
  s+='<path class="s-arc" d="'+tickD(A,R,midA(aB,aD))+'"/><path class="s-arc" d="'+tickD(A,R,midA(aD,aC))+'"/>';
  // оройнууд
  var pts=[[A,nm[0],A[0],A[1]-5,'middle'],[B,nm[1],B[0]-9,B[1]+9,'end'],[C,nm[2],C[0]+3,C[1]+9,'start'],[D,g.foot,D[0],D[1]+13,'middle']];
  for(var i=0;i<pts.length;i++){var p=pts[i];s+='<circle class="s-vtx" cx="'+p[0][0].toFixed(1)+'" cy="'+p[0][1]+'" r="2.4"/>';
    s+='<text class="s-vl" x="'+p[2].toFixed(1)+'" y="'+p[3]+'" text-anchor="'+p[4]+'">'+p[1]+'</text>';}
  // талын утга
  function txt(x,y,val,isX,anch){return '<text class="'+(isX?'s-x':'s-len')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+anch+'">'+lab(val,isX)+'</text>';}
  var mLx=(A[0]+B[0])/2,mLy=(A[1]+B[1])/2;
  var mRx=(A[0]+C[0])/2,mRy=(A[1]+C[1])/2;
  s+=txt(mLx-9,mLy,t.sL,u==='sL','end');
  s+=txt(mRx+9,mRy,t.sR,u==='sR','start');
  s+=txt((B[0]+D[0])/2,141,t.gL,u==='gL','middle');
  s+=txt((D[0]+C[0])/2,141,t.gR,u==='gR','middle');
  s+='</svg>';
  return s;
}
function solveDiag(g){ // x-ийн жинхэнэ утга ба пропорц
  var v=g.tv[g.unk];
  var nm=g.nm;
  var prop='\\dfrac{'+nm[0]+nm[1]+'}{'+nm[0]+nm[2]+'}=\\dfrac{'+nm[1]+g.foot+'}{'+g.foot+nm[2]+'}';
  return {x:v,prop:prop};
}

/* ---- Үг бодлого ---- */
function wpBiss(){
  var r=pick(RATIOS),a=r[0],b=r[1],s=rnd(2,5),t=rnd(2,5);
  var p=a*s,q=b*s,m=a*t,n=b*t;
  var nm=pick(NAMESETS);
  var txt='△'+nm[0]+nm[1]+nm[2]+'-д '+nm[0]+' өнцгийн биссектрис '+nm[1]+nm[2]+' талыг '+'D'+' цэгт огтолно. '
    +nm[0]+nm[1]+' = '+p+' см, '+nm[0]+nm[2]+' = '+q+' см, '+nm[1]+'D = '+m+' см. '
    +'<span class="ask">D'+nm[2]+'-ийн уртыг ол.</span>';
  return {t:txt,a:'D'+nm[2]+' = '+n+' см  ('+p+'/'+q+' = '+m+'/D'+nm[2]+')'};
}
function wpPerim(){
  var r=pick(RATIOS),a=r[0],b=r[1],k=rnd(2,4),j=rnd(2,4);
  var s1=a*k,s2=b*k,m=a*j,n=b*j,BC=m+n,P=s1+s2+BC;
  var txt='Нэгэн гурвалжны периметр '+P+' см. Нэг оройгоос татсан биссектрис эсрэг талыг '+m+' см ба '+n+' см урттай хоёр хэсэгт хуваадаг. '
    +'<span class="ask">Тухайн оройд залгах хоёр талын уртыг ол.</span>';
  return {t:txt,a:'талууд: '+s1+' см ба '+s2+' см  (эсрэг тал '+BC+', үлдэх '+(P-BC)+'-г '+a+':'+b+'-аар)'};
}
function wpAngle(){
  var C=pick([40,50,60,70,80,44,56,64]);
  var ang=90+C/2;
  var txt='Гурвалжны C оройн өнцөг '+C+'°. A ба B өнцгүүдийн биссектрисүүд гурвалжны дотор I цэгт огтлолцоно. '
    +'<span class="ask">∠AIB өнцгийг ол.</span>';
  return {t:txt,a:'∠AIB = 90° + C/2 = 90° + '+(C/2)+'° = '+ang+'°'};
}

function build(){
  var dcards='',dans='',items=[];
  var seen={};
  for(var i=0;i<6;i++){
    var g,sg,tr=0;do{g=genDiag();sg=g.tv.sL+'_'+g.tv.sR+'_'+g.tv.gL+'_'+g.tv.gR+'_'+g.unk;tr++;}while(seen[sg]&&tr<80);seen[sg]=1;
    var sol=solveDiag(g);var n=i+1;
    dcards+='<div class="q"><div class="qh">'+n+'.</div><div class="dfig">'+drawTri(g)+'</div>'
      +'<div class="xline">x =<span class="bl"></span></div></div>';
    dans+='<div class="a"><span class="an">'+n+'.</span><span>x = '+sol.x+'</span></div>';
    items.push({q:'Биссектрис: '+g.nm.join('')+' ('+g.a+':'+g.b+')',a:'x='+sol.x});
  }
  var W=[wpBiss(),wpPerim(),wpAngle()];
  var wcards='',wans='';
  for(var j=0;j<W.length;j++){var w=W[j];var n2=j+7;
    wcards+='<div class="wq"><div class="wn">'+n2+'.</div><div class="wt">'+w.t
      +'<div class="wans">Хариу:<span class="bl"></span></div></div></div>';
    wans+='<div><span class="an">'+n2+'.</span> '+w.a+'</div>';
    items.push({q:'Бодлого '+n2,a:w.a});
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Гурвалжны биссектрисийн чанар</h1><div class="sub">Өнцгийн биссектрисийн пропорц чанараар x-ийг ол · 9-р анги · зурагтай + бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Биссектрисийн чанар: $\\dfrac{AB}{AC}=\\dfrac{BD}{DC}$ &nbsp;·&nbsp; (эсрэг талыг зэргэлдээх хоёр талтай пропорциональ хуваана) &nbsp;·&nbsp; жиш: $\\dfrac{6}{4}=\\dfrac{x}{2}\\Rightarrow x=3$</div>'
    +'<div class="sec"><b>1</b> Мэдэгдэхгүй байгаа хэмжигдэхүүнийг ол</div>'
    +'<div class="dgrid">'+dcards+'</div>'
    +'<div class="sec"><b>2</b> Бодлого бод</div>'
    +'<div class="wgrid">'+wcards+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2><div class="ans-grid">'+dans+'</div><div class="ans-w">'+wans+'</div></div>';
  window.WS_ITEMS=items;window.WS_TITLE='Гурвалжны биссектрисийн чанар';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=38"></script>
</body>
</html>
