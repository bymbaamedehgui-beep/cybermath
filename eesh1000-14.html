<script>
/* ЭЕШ 1000 4-2 — ЭЕШ-ийн 1000 бодлого, 4-р хэсэг (28–54-р бодлого).
   Бодлого бүр өөрийн генератортой: «Шинэ бодлого» дарахад тоо нь өөрчлөгдөнө. Хөдөлгүүр: /e1k.js */

// 28. t = √v гэвэл v² + s·a³√v = t(t³ + s·a³) = t(t + s·a)(t² − s·a·t + a²),  v√v − s·a·v + a²√v = t(t² − s·a·t + a²)
//     ⇒ (v² + s·a³√v) : (v√v − s·a·v + a²√v) = √v + s·a.  Үлдсэн үржигдэхүүн √v − s·a бол хариу v − a² (эх шиг),
//     √v + s·a бол (√v + s·a)² = v + 2s·a√v + a².  Хувьсагчийн үсэг, a ∈ {1, 2, 3}, s = ±1, үржигдэхүүн, байрлал санамсаргүй
//     (гэр бүл нарийн — нийт ~140 ялгаатай хувилбар).  Муж: v > 0.
var p28_V = ['y', 'y', 'y', 'x', 'a', 'b', 'm', 't'];
function p28() {
  var v = pick(p28_V), a = pick([1, 1, 2, 2, 3]), s = pick([1, -1]), sq = rnd(1, 100) <= 30, R = '\\sqrt{' + v + '}';
  var N = v + '^2' + tm(s * a * a * a, R);                        // v² ± a³√v
  var D = v + R + tm(-s * a, v) + tm(a * a, R);                   // v√v ∓ a·v + a²√v
  var F = R + sgn(sq ? s * a : -s * a);                           // үржигдэхүүн √v ∓ a (эсвэл √v ± a)
  var E = rnd(1, 100) <= 70 ? '(' + N + ')\\times\\dfrac{' + F + '}{' + D + '}' : '\\dfrac{' + N + '}{' + D + '}\\times(' + F + ')';
  var ans = sq ? '(' + R + sgn(s * a) + ')^2=' + v + tm(2 * s * a, R) + sgn(a * a) : v + sgn(-a * a);
  // Бодолт: √v = u орлуулга; хүртвэр u⁴ ± a³u = u(u ± a)(u² ∓ au + a²) (кубуудын нийлбэр/ялгавар), хуваарь u(u² ∓ au + a²) → u ± a
  var Qu = 'u^2' + tm(-s * a, 'u') + sgn(a * a), Fu = 'u' + sgn(sq ? s * a : -s * a), Gu = 'u' + sgn(s * a);
  var sol = [
    'Муж: $' + v + '\\gt 0$. $' + R + '=u$ $(u\\gt 0)$ гэж орлуулбал $' + v + '=u^2$, $' + v + '^2=u^4$, $' + v + R + '=u^3$.',
    'Кубуудын ' + (s > 0 ? 'нийлбэрийн' : 'ялгаврын') + ' томьёогоор хүртвэр: $$' + N + '=u^4' + tm(s * a * a * a, 'u') + '=u\\left(u^3' + (s > 0 ? '+' : '-') + (a === 1 ? '1' : a + '^3') + '\\right)$$ $$=u(' + Gu + ')(' + Qu + ').$$',
    'Хуваарь: $$' + D + '=u^3' + tm(-s * a, 'u^2') + tm(a * a, 'u') + '=u(' + Qu + ').$$',
    'Хураавал ($u(' + Qu + ')\\ne 0$): $$\\dfrac{u(' + Gu + ')(' + Qu + ')}{u(' + Qu + ')}\\cdot(' + Fu + ')=(' + Gu + ')(' + Fu + ')$$ $$='
      + (sq ? '(' + Gu + ')^2=u^2' + tm(2 * s * a, 'u') + sgn(a * a) + '=' + v + tm(2 * s * a, R) + sgn(a * a) : 'u^2' + sgn(-a * a) + '=' + v + sgn(-a * a)) + '.$$'
  ];
  return {
    q: '$' + E + '$ илэрхийллийг хялбарчлаарай.',
    a: '$' + ans + '$',
    wk: 26,
    s: sol,
    t: { v: v, a: a, s: s, sq: sq }
  };
}

// 29. x² + (αa + β)x + γa + δ = 0 (α = ±1): Виетээр x₁ + x₂ = −(αa + β), x₁x₂ = γa + δ ⇒ S(a) = x₁² + x₂² = (αa + β)² − 2(γa + δ),
//     параболын орой a* = γ − αβ.  Язгуурууд бодит байх нөхцөл D(a) = (αa + β)² − 4(γa + δ) ≥ 0.
//     D(a*) ≥ 0 бол хариу a* (эх шиг, ~80%).  Эс бөгөөс D(a) = (a − a₁)(a − a₂), a₁ < a* < a₂ (бүхэл): D ≥ 0 муж дээр S нь a₁ хүртэл
//     буурч, a₂-оос өснө ⇒ хариу нь S(a₁) = (αa₁ + β)²/2, S(a₂)-ийн багад харгалзах ирмэг (давхар язгуур).
function p29() {
  var al = pick([1, 1, 1, -1]), be = nz(-6, 6), ga = pick([1, 1, 1, 2, 2, 3, -1, -2]), A = ga - al * be, de, ans;
  if (Math.abs(A) > 9) return null;
  if (rnd(1, 100) <= 80) {
    de = rnd(-12, 12);
    if ((al * A + be) * (al * A + be) - 4 * (ga * A + de) < 0) return null;
    if (A === 0 && rnd(0, 2)) return null;
    ans = A;
  } else {
    var sum = 4 * ga - 2 * al * be, a1 = rnd(-12, 12), a2 = sum - a1;     // D(a) = a² − (a₁ + a₂)a + a₁a₂
    if (!(a1 < A && A < a2) || (be * be - a1 * a2) % 4) return null;
    de = (be * be - a1 * a2) / 4;
    var s1 = Math.abs(al * a1 + be), s2 = Math.abs(al * a2 + be);
    if (s1 === s2) return null;
    ans = s1 < s2 ? a1 : a2;
  }
  if (Math.abs(de) > 15) return null;
  var xc;
  if (al === 1) xc = '+(a' + sgn(be) + ')x';
  else if (be > 0) xc = rnd(0, 1) ? '+(' + be + '-a)x' : '-(a-' + be + ')x';
  else xc = '-(a+' + (-be) + ')x';
  // Бодолт: Виет → S(a) = (a + αβ)² − 2(γa + δ) = (a − A)² + C; D(A) ≥ 0 бол a = A, эс бөгөөс D = (a − a₁)(a − a₂) ≥ 0 мужийн ирмэгүүдийг харьцуулна
  var sol = (function () {
    var ab = al * be, P = poly([ga, de], 'a'), C = be * be - 2 * de - A * A, Dp = poly([1, 2 * ab - 4 * ga, be * be - 4 * de], 'a');
    var sqa = function (u) { return u === 0 ? 'a^2' : '(a' + sgn(-u) + ')^2'; }, cst = C ? sgn(C) : '';
    var Sv = function (u) { return (A === 0 ? par(u) + '^2' : '(' + u + sgn(-A) + ')^2') + cst + '=' + ((u - A) * (u - A) + C); };
    var X = A + ab, Y = ga * A + de, DA = X * X - 4 * Y;
    var out = [
      'Виетийн теоремоор $x_1+x_2=' + poly([-al, -be], 'a') + '$, $x_1x_2=' + P + '$. Иймд $$S(a)=x_1^2+x_2^2=(x_1+x_2)^2-2x_1x_2$$ $$=(a' + sgn(ab) + ')^2-2(' + P + ')=' + poly([1, -2 * A, be * be - 2 * de], 'a') + '.$$',
      'Бүтэн квадрат ялгавал $$S(a)=' + sqa(A) + cst + '$$ тул $S(a)$ нь $a=' + A + '$ үед хамгийн бага утгаа авна.'
    ];
    if (DA >= 0) out.push('Гэхдээ язгуурууд бодит байх ёстой: $D=(a' + sgn(ab) + ')^2-4(' + P + ')\\ge 0$. $a=' + A + '$ үед $$D=' + par(X) + '^2-4\\cdot ' + par(Y) + '=' + DA + '\\ge 0$$ тул нөхцөл биелнэ. Иймд $a=' + A + '$.');
    else {
      var f1 = a1 === 0 ? 'a' : '(a' + sgn(-a1) + ')', f2 = a2 === 0 ? 'a' : '(a' + sgn(-a2) + ')';
      out.push('Язгуурууд бодит байх нөхцөл: $$D=(a' + sgn(ab) + ')^2-4(' + P + ')=' + Dp + '$$ $$=' + (a2 === 0 ? f2 + f1 : f1 + f2) + '\\ge 0\\ \\Rightarrow\\ a\\le ' + a1 + '\\ \\text{эсвэл}\\ a\\ge ' + a2 + '.$$ $a=' + A + '$ үед $D\\lt 0$ — бодит язгуургүй.');
      out.push('$a\\le ' + a1 + '$ үед $S(a)$ буурч, $a\\ge ' + a2 + '$ үед өсөх тул хамгийн бага утга нь хилийн цэгүүдийн аль нэгэнд: $$S(' + a1 + ')=' + Sv(a1) + ',\\qquad S(' + a2 + ')=' + Sv(a2) + '.$$ Иймд $a=' + ans + '$.');
    }
    return out;
  })();
  return {
    q: '$x^2' + xc + tm(ga, 'a') + (de ? sgn(de) : '') + '=0$ тэгшитгэлийн хоёр язгуурын квадратын нийлбэр нь хамгийн бага байхаар $a$ параметрийн утгыг олоорой.',
    a: '$a=' + ans + '$',
    wk: 30,
    s: sol,
    t: { al: al, be: be, ga: ga, de: de }
  };
}

// 30. Талууд u = √m + Q, v = √m − Q (Q = n эсвэл √k), c = √(2(m + Q²)): u² + v² = c² ⇒ тэгш өнцөгт, богино 2 тал нь катетууд.
//     v катетыг тойруулбал конус V_v = πu²v/3, u-г тойруулбал V_u = πv²u/3 ⇒ их : бага = u : v = (m + Q² + 2Q√m)/(m − Q²) (хураана),
//     бага : их = (m + Q² − 2Q√m)/(m − Q²).  m ≤ 23 (квадрат хуваагчгүй), хариу «гоё» (A ≤ 24, B ≤ 6, D ≤ 12, r ≤ 99) хослолуудаас:
//     ~40% бүхэл гипотенузтай, ~45% Q бүхэл (эх шиг √m ± n), үлдсэн нь аль ч; талуудын дараалал заримдаа холилдоно.
//     [ЗАС: эх «харьцаа аль байж болох вэ?» (сонголттой) — энд аль эзлэхүүнийг алинд харьцуулахыг зааж нээлттэй хариутай]
var p30_L = (function () {
  var SF = [2, 3, 5, 6, 7, 10, 11, 13, 14, 15, 17, 19, 21, 22, 23], L = [];
  SF.forEach(function (m) {
    var qs = [], n;
    for (n = 1; n * n < m; n++) qs.push([n * n, String(n)]);
    SF.forEach(function (k) { if (k < m) qs.push([k, '\\sqrt{' + k + '}']); });
    qs.forEach(function (q) {
      if (Math.sqrt(m) - Math.sqrt(q[0]) < 0.3) return;
      var S = surd(m * q[0]), A = m + q[0], B = 2 * S.k, D = m - q[0], g = gcd(gcd(A, B), D);
      if (A / g > 24 || B / g > 6 || D / g > 12 || S.r > 99) return;
      L.push({ m: m, Q2: q[0], Qt: q[1], A: A / g, B: B / g, D: D / g, r: S.r, ih: surd(2 * (m + q[0])).r === 1, iq: q[1].length < 3 });
    });
  });
  return [L.filter(function (o) { return o.ih; }), L.filter(function (o) { return o.iq; }), L];
})();
function p30() {
  var w = rnd(1, 100), o = pick(p30_L[w <= 40 ? 0 : w <= 85 ? 1 : 2]), C = surd(2 * (o.m + o.Q2));
  var big = rnd(1, 100) <= 65, num = o.A + (big ? '+' : '-') + rt(o.B, o.r);
  var u = '\\sqrt{' + o.m + '}+' + o.Qt, v = '\\sqrt{' + o.m + '}-' + o.Qt, sides = rnd(1, 100) <= 60 ? [u, C.tex, v] : shuffle([u, C.tex, v]);
  var res = o.D === 1 ? num : '\\dfrac{' + num + '}{' + o.D + '}';
  // Бодолт: a² + b² = c² → катетууд a, b; b-г тойруулбал V₁ = πa²b/3, a-г тойруулбал V₂ = πb²a/3 → V₁ : V₂ = a : b → иррационалаас чөлөөлнө
  var sol = (function () {
    var A0 = o.m + o.Q2, D0 = o.m - o.Q2, S = surd(o.m * o.Q2), sg = big ? '+' : '-', top = big ? u : v, bot = big ? v : u;
    var raw = o.Qt.length < 3 ? rt(2 * +o.Qt, o.m) : '2\\sqrt{' + o.m * o.Q2 + '}', simp = rt(2 * S.k, S.r);
    var cT = C.r === 1 ? String(C.k) : '\\left(' + C.tex + '\\right)';
    var ch = '';                                                                 // (top)²/(m − Q²)-аас цааших гинж (2 дахь мөр)
    if (D0 === 1) ch = '(' + top + ')^2=' + A0 + sg + raw + (raw !== simp ? '=' + A0 + sg + simp : '');
    else {
      ch = '\\dfrac{' + A0 + sg + raw + '}{' + D0 + '}';
      if (raw !== simp) ch += '=\\dfrac{' + A0 + sg + simp + '}{' + D0 + '}';
      if (A0 !== o.A || D0 !== o.D) ch += '=' + res;
    }
    return [
      '$a=' + u + '$, $b=' + v + '$, $c=' + C.tex + '$ гэвэл $$a^2+b^2=(' + u + ')^2+(' + v + ')^2$$ $$=2(' + o.m + '+' + o.Q2 + ')=' + 2 * A0 + '=' + cT + '^2.$$',
      'Пифагорын теоремын урвуугаар гурвалжин тэгш өнцөгт: $c$ — гипотенуз, богино хоёр тал нь $a$, $b$ катетууд. Катетыг тойруулан эргүүлэхэд нөгөө катет нь радиус болох конус үүснэ: $V=\\dfrac{1}{3}\\pi r^2h$.',
      '$b$-г тойруулбал $V_1=\\dfrac{1}{3}\\pi a^2b$, $a$-г тойруулбал $V_2=\\dfrac{1}{3}\\pi b^2a$. $a\\gt b$ тул $V_1\\gt V_2$ ба $$'
        + (big ? '\\dfrac{V_1}{V_2}=\\dfrac{a}{b}' : '\\dfrac{V_2}{V_1}=\\dfrac{b}{a}') + '=\\dfrac{' + top + '}{' + bot + '}.$$',
      'Хуваарийг иррационалаас чөлөөлье (хүртвэр, хуваарийг $' + top + '$ илэрхийллээр үржүүлнэ): $$\\dfrac{' + top + '}{' + bot + '}=\\dfrac{(' + top + ')^2}{' + o.m + '-' + o.Q2 + '}$$ $$=' + ch + '.$$'
    ];
  })();
  return {
    q: 'Талуудын урт нь $' + sides.join(';\\ ') + '$ байх гурвалжин байв. Эдгээрээс богино байх 2 талыг нь тойруулан эргүүлэхэд үүсэх 2 биетийн '
      + (big ? 'их эзлэхүүнийг бага эзлэхүүнд' : 'бага эзлэхүүнийг их эзлэхүүнд') + ' харьцуулсан харьцааг олоорой.',
    a: '$' + res + '$',
    wk: 30,
    s: sol,
    t: { m: o.m, Q2: o.Q2, big: big }
  };
}

// 31. sin3α = 3sinα − 4sin³α, cos3α = 4cos³α − 3cosα ⇒
//     sin³α·sin3α + cos³α·cos3α = 4(cos⁶α − sin⁶α) − 3(cos⁴α − sin⁴α) = cos2α·(1 − sin²2α) = cos³2α  (эх шиг, ~75%);
//     cos³α·cos3α − sin³α·sin3α = 4(cos⁶α + sin⁶α) − 3(cos⁴α + sin⁴α) = 1 − 1.5·sin²2α = (3cos²2α − 1)/2.
//     Өгөгдөл: cos2α = p/q (|p| < q ≤ 7, ~70%), заримдаа sin²α = (1 − cos2α)/2 эсвэл cos²α = (1 + cos2α)/2 (q ≤ 5). Хариу хураасан бутархай.
function p31() {
  var w = rnd(1, 100), q = w <= 70 ? pick([2, 3, 3, 3, 4, 4, 5, 5, 5, 6, 7]) : rnd(2, 5), p = nz(1 - q, q - 1), giv, E, n, d;
  if (gcd(p, q) !== 1) return null;
  if (w <= 70) giv = '\\cos 2\\alpha=' + fr(p, q);
  else if (w <= 85) giv = '\\sin^2\\alpha=' + fr(q - p, 2 * q);
  else giv = '\\cos^2\\alpha=' + fr(q + p, 2 * q);
  var T1 = '\\sin^3\\alpha\\cdot\\sin 3\\alpha', T2 = '\\cos^3\\alpha\\cdot\\cos 3\\alpha';
  if (rnd(1, 100) <= 75) { E = rnd(0, 2) ? T1 + '+' + T2 : T2 + '+' + T1; n = p * p * p; d = q * q * q; }
  else { E = T2 + '-' + T1; n = 3 * p * p - q * q; d = 2 * q * q; }
  // Бодолт: зэрэг бууруулах sin³α = (3sinα − sin3α)/4, cos³α = (3cosα + cos3α)/4 → cos(3α ∓ α), cos²3α ∓ sin²3α → cos2α-аар
  var sum = E.indexOf('+') >= 0, c2 = fr(p, q), c2p = '\\left(' + c2 + '\\right)', ss = [];   // төрлийг утгаар биш илэрхийллээр (cos2α = −1/2 үед хоёулаа −1/8)
  if (w > 70) ss.push((w <= 85 ? 'Давхар өнцгийн томьёогоор $$\\cos 2\\alpha=1-2\\sin^2\\alpha=1-2\\cdot ' + fr(q - p, 2 * q) : 'Давхар өнцгийн томьёогоор $$\\cos 2\\alpha=2\\cos^2\\alpha-1=2\\cdot ' + fr(q + p, 2 * q) + '-1')
    + '=' + c2 + '.$$');
  ss.push('Гурвалсан өнцгийн томьёо $\\sin 3\\alpha=3\\sin\\alpha-4\\sin^3\\alpha$, $\\cos 3\\alpha=4\\cos^3\\alpha-3\\cos\\alpha$-аас зэргийг бууруулбал $$\\sin^3\\alpha=\\dfrac{3\\sin\\alpha-\\sin 3\\alpha}{4},\\qquad \\cos^3\\alpha=\\dfrac{3\\cos\\alpha+\\cos 3\\alpha}{4}.$$');
  if (sum) {
    ss.push('Өгсөн илэрхийллийг $E$ гээд орлуулж бүлэглэвэл $$E=\\dfrac{3(\\cos 3\\alpha\\cos\\alpha+\\sin 3\\alpha\\sin\\alpha)+\\cos^2 3\\alpha-\\sin^2 3\\alpha}{4}$$ $$=\\dfrac{3\\cos 2\\alpha+\\cos 6\\alpha}{4}$$ (косинусын ялгаврын ба давхар өнцгийн томьёо).');
    ss.push('$\\cos 6\\alpha=4\\cos^3 2\\alpha-3\\cos 2\\alpha$ тул $$E=\\dfrac{3\\cos 2\\alpha+4\\cos^3 2\\alpha-3\\cos 2\\alpha}{4}=\\cos^3 2\\alpha$$ $$=' + c2p + '^3=' + fr(n, d) + '.$$');
  } else {
    ss.push('Өгсөн илэрхийллийг $E$ гээд орлуулж бүлэглэвэл $$E=\\dfrac{3(\\cos 3\\alpha\\cos\\alpha-\\sin 3\\alpha\\sin\\alpha)+\\cos^2 3\\alpha+\\sin^2 3\\alpha}{4}$$ $$=\\dfrac{3\\cos 4\\alpha+1}{4}$$ (косинусын нийлбэрийн томьёо ба $\\cos^2 3\\alpha+\\sin^2 3\\alpha=1$).');
    ss.push('$\\cos 4\\alpha=2\\cos^2 2\\alpha-1$ тул $$E=\\dfrac{6\\cos^2 2\\alpha-2}{4}=\\dfrac{3\\cos^2 2\\alpha-1}{2}$$ $$=\\dfrac{1}{2}\\left(3\\cdot ' + c2p + '^2-1\\right)=\\dfrac{1}{2}\\left(' + fr(3 * p * p, q * q) + '-1\\right)=' + fr(n, d) + '.$$');
  }
  return {
    q: '$' + giv + '$ бол $' + E + '$ илэрхийллийн утгыг олоорой.',
    a: '$' + fr(n, d) + '$',
    wk: 26,
    s: ss,
    t: { p: p, q: q }
  };
}

// 32. Мөч бүрт sin, cos монотон ⇒ a < f(x) < b тэнцэтгэл бишийн өгсөн (нээлттэй) мөч доторх шийд нь нэг нээлттэй завсар;
//     зааг нь f = a эсвэл f = b стандарт өнцөг (15°-ын үржвэр) эсвэл мөчийн зааг. Мөчийг 15°-ын 6 хэсэгт хувааж, хэсэг бүрийн
//     дунд цэг дээр шалгаж завсрыг олно. Хоосон/бүтэн мөч хасагдана; хоёр зааг нь дотоод цэг байх нь давамгай (эх шиг).
//     Хязгаарыг заримдаа хялбарчлаагүй хэлбэрээр (хуваарьт язгууртай г.м.) бичнэ.  Мөч: I, II голдуу, заримдаа III, IV.
//     [ЗАС: эх «… шийд аль нь вэ?» (сонголттой) — энд «… шийдийг олоорой»]

// Бодолт: хязгаарыг хялбарчлах → мөч дотор f монотон (утгын завсар) → f = хязгаар байх стандарт өнцөг → монотон чанараар x-ийн завсар.
// Хязгаар нь мөч дэх утгын завсраас гадна (эсвэл захад) бол тэр нөхцөл үргэлж биелнэ.

  '\\dfrac{3}{2\\sqrt{3}}': ['\\dfrac{3}{2\\sqrt{3}}', '\\dfrac{\\sqrt{3}\\cdot\\sqrt{3}}{2\\sqrt{3}}', '\\dfrac{\\sqrt{3}}{2}'],
  '\\dfrac{\\sqrt{6}}{2\\sqrt{2}}': ['\\dfrac{\\sqrt{6}}{2\\sqrt{2}}', '\\dfrac{\\sqrt{3}\\cdot\\sqrt{2}}{2\\sqrt{2}}', '\\dfrac{\\sqrt{3}}{2}'] };

// 33. y = c(x − r)(x² + px + q), p² − 4q < 0 ⇒ график абсцисс тэнхлэгийг зөвхөн (r; 0) цэгт огтолно.
//     y'(r) = c(r² + pr + q) = k ≠ 0 ⇒ шүргэгч y = k(x − r) = kx − kr.  Олон гишүүнтийг задалж эх шиг өсөх зэргээр (~60%),
//     заримдаа буурах зэргээр бичнэ; c = ±1 голдуу (заримдаа ±2), r = ±1..±3, коэффициент |·| ≤ 12.

  // y'(r) = k → шүргэгч y = k(x − r). Олон гишүүнт ба уламжлалыг асуултын дарааллаар (өсөх/буурах зэрэг) бичнэ.

        + (p ? '$ гурван гишүүнтийн дискриминант $D=' + par(p) + '^2-4\\cdot ' + q + '=' + DD + '\\lt 0$ тул өөр язгуургүй. ' : '\\gt 0$ тул өөр язгуургүй. ')

// [[коэф, зэрэг], …] → олон гишүүнт (өгсөн дарааллаар, тэг гишүүнийг алгасна)

// x = r орлуулга: 2+2+2^2-2^3, -3\cdot 2^2+2\cdot 2+1

// 34. AD = DB ⇒ △ABD адил хажуут: ∠BAD = ∠ABD; AD биссектрис тул ∠A = 2∠B ⇔ a² = b(b + c)  (a = BC, b = AC, c = AB).

//     Ихэнхдээ BC-г (эх шиг), заримдаа AB-г (c = a²/b − b) эсвэл AC-г (b² + bc − a² = 0) асууна.

      + (Sq.r === 1 ? Sq.k : '\\sqrt{' + N2 + '}' + (Sq.k > 1 ? '=' + Sq.tex : '')) + '.$$';
  } else if (ask === 'AB') {
    last = 'Мэдэгдэх талуудыг орлуулбал $$' + a + '^2=' + b + '^2+' + b + '\\cdot AB\\ \\Rightarrow\\ AB=\\dfrac{' + a + '^2-' + b + '^2}{' + b + '}=' + c + '.$$';

    q: '$' + giv[0] + '=' + giv[1] + '$ нэгж, $' + giv[2] + '=' + giv[3] + '$ нэгж урттай $ABC$ гурвалжны $A$ оройн дотоод өнцгийн биссектрис $AD=DB$ байхаар '
      + '$BC$ талтай $D$ цэгт огтлолцсон бол $' + ask + '$ талын уртыг олоорой.',

    s: [

      '$CAD$ ба $CBA$ гурвалжнуудад $\\angle C$ ерөнхий, $\\angle CAD=\\angle CBA$ тул тэд төсөөтэй: $$\\dfrac{CD}{CA}=\\dfrac{AD}{BA}=\\dfrac{CA}{CB}.$$'

// Бодолтын зураг (масштабтай): B(0; 0), C(a; 0), A — AB = c, AC = b; D — биссектрисийн суурь (BD = ac/(b + c) = AD).

function p34_sfig(a, b, c) {

    .angle(B, C, A, { r: 15 }).angle(A, B, D, { r: 17 }).angle(A, D, C, { r: 17 })
    .dot(D, { r: 2 })
    .text(A, 'A', { pos: 'n' }).text(B, 'B', { pos: 'sw' }).text(C, 'C', { pos: 'se' }).text(D, 'D', { pos: 's' });

// 35. Арифметик прогресс a₁ < 0, d > 0: aₙ = a₁ + (n − 1)d; сөрөг гишүүд бүгдийг нэмтэл нийлбэр буурч, дараа нь өснө

    a: '$' + S + '$',
    wk: 26,
    s: [
      (mx ? '$a_1\\gt 0$, $d\\lt 0$ тул прогресс буурна: эхэндээ гишүүд эерэг, дараа нь сөрөг. Эерэг гишүүдийг нэмэх хүртэл $S_n$ өсөж, дараа нь буурна. '
        + 'Иймд хамгийн их нь бүх эерэг гишүүдийн нийлбэр.'
        : '$a_1\\lt 0$, $d\\gt 0$ тул прогресс өснө: эхэндээ гишүүд сөрөг, дараа нь эерэг. Сөрөг гишүүдийг нэмэх хүртэл $S_n$ буурч, дараа нь өснө. '
        + 'Иймд хамгийн бага нь бүх сөрөг гишүүдийн нийлбэр.'),

        + ' Үнэхээр $a_{' + k + '}=' + tk(k - 1) + '=' + ak + (mx ? '\\gt 0' : '\\lt 0') + '$, $a_{' + (k + 1) + '}=' + tk(k) + '=' + ak1

// 37. L = log_B a: log_B(B·a) = 1 + L, log_B(a⁴) = 4L ⇒ √(log²_B(Ba) − log_B a⁴) = √((1 − L)²) = |1 − L|.

// 38. √(p² + rq² ± 2pq√r) = |p ± q√r|;  (X² − Y²)/Z = (X − Y)(X + Y)/Z = M² (X + Y — тоймтой тоо);  √(q²r) = q√r задлаагүй

// 39. a² − b² = (a − b)(a + b) = N, a, b ∈ ℕ.  N = p (сондгой анхны тоо, ~70%): a − b = 1, a + b = p ⇒ a = (p + 1)/2, b = (p − 1)/2;

// 48. y = Ax² + Bx + C ба y = mx + k шулуун x₁ < x₂ бүхэл цэгүүдэд огтлолцоно: m = B + A(x₁ + x₂), k = C − Ax₁x₂.

// Бодолт: огтлолцол (үржигдэхүүнд задлах) → салааны чиглэлээр аль нь дээр → S = ∫(дээд − доод)dx, Ньютон–Лейбниц; шалгалт |a|(x₂ − x₁)³/6

// 49. Тэгш өнцөгт гурвалжин — Пифагорын гурвал (a, b, c)·k: багтсан тойргийн радиус r = (a + b − c)/2,

// 50. Хялбарчлах (адилтгалын гэр бүл — хувилбар цөөн нь санаатай): F·(m² ± mn + n²) / (F·(m² + n²)) ÷ (m³ ∓ n³)/(m⁴ − n⁴)

    + l1 + '(' + tri + ')}{' + l1 + l2 + '(' + sqs + ')}=' + Qs + '.$$';

}

// 51. ABC гурвалжны нэг тал ба хоёр өнцөг (15°-ын үржвэр, тэгш өнцөггүй) өгөгдөнө; орто төв H.

      + ' ба орто төв нь $H$ бол $' + X + 'H$ хэрчмийн уртыг олоорой.',
    a: '$' + X + 'H=' + val + '$',

    s: p51_sol(an, X, Y, pp, qq, shown, val),

}
// Бодолт: (дутуу өнцөг) → синусын теоремоор 2R = тал / sin(эсрэг өнцөг) → орто төвийн чанар XH = 2·OM = 2R·|cos X|
var p51_SIN = { 30: '\\dfrac{1}{2}', 150: '\\dfrac{1}{2}', 45: '\\dfrac{\\sqrt{2}}{2}', 135: '\\dfrac{\\sqrt{2}}{2}', 60: '\\dfrac{\\sqrt{3}}{2}', 120: '\\dfrac{\\sqrt{3}}{2}' };

function p51_sol(an, X, Y, pp, qq, shown, val) {
  var miss = ['A', 'B', 'C'].filter(function (V) { return shown.indexOf(V) < 0; })[0], ss = [];
  if (miss === X || miss === Y) ss.push('Гурвалжны өнцгүүдийн нийлбэр $180^\\circ$ тул $$\\angle ' + p51_NM[miss] + '=180^\\circ-' + an[shown[0]] + '^\\circ-' + an[shown[1]] + '^\\circ=' + an[miss] + '^\\circ.$$');

    + (k2 === 1 ? '2\\cdot ' + sd : '\\dfrac{2\\cdot ' + sd + '}{\\sqrt{' + k2 + '}}') + '=' + twoR + '.$$');

    + '^\\circ=' + cv + '$ тул $$' + X + 'H=' + twoR + '\\cdot ' + cv.replace(/^-/, '') + '=' + val + '.$$');

// 52. R радиустай бөмбөрцөгт багтсан зөв дөрвөн өнцөгт призм (суурь a талтай квадрат, өндөр h): гол диагональ = 2R ⇒
//     2a² + h² = 4R². Өндөр h (тэгш) өгвөл a² = 2R² − h²/2 бүхэл; суурийн тал a (бүхэл эсвэл k√2) өгвөл h = √(4R² − 2a²) бүхэл.
//     V_б/V_п = (4/3)πR³ / (a²h) = 4R³π / (3a²h) — хураасан.
function p52() {
  var R = rnd(3, 15), giv, h, a2, cs = [], x;
  var byH = rnd(1, 10) <= 7;
  if (byH) { var t = rnd(1, R - 1); h = 2 * t; a2 = 2 * (R * R - t * t); giv = String(h); }
  else {
    for (x = 1; 2 * x * x < 4 * R * R; x++) {
      var hh = 4 * R * R - 2 * x * x, s = Math.round(Math.sqrt(hh));
      if (s * s === hh) cs.push([String(x), x * x, s]);                       // a = x
      var w = R * R - x * x, z = Math.round(Math.sqrt(w));
      if (w > 0 && z * z === w) cs.push(['$' + rt(x, 2) + '$', 2 * x * x, 2 * z]);   // a = x√2 ⇒ h = 2√(R² − x²)
    }
    if (!cs.length) return null;
    var c = pick(cs); giv = c[0]; a2 = c[1]; h = c[2];
  }
  var n = 4 * R * R * R, d = 3 * a2 * h, g = gcd(n, d);
  n /= g; d /= g;
  if (d > 400 || n > 999) return null;
  var val = d === 1 ? (n === 1 ? '' : n) + '\\pi' : '\\dfrac{' + (n === 1 ? '' : n) + '\\pi}{' + d + '}';
  return {
    q: R + ' радиустай бөмбөрцөгт багтсан <b><i>зөв дөрвөн өнцөгт призмийн ' + (byH ? 'өндөр' : 'суурийн тал') + '</i></b> ' + giv
      + ' бол бөмбөрцгийн эзлэхүүнийг призмийн эзлэхүүнд харьцуулсан харьцааг олоорой.',
    a: '$' + val + '$',
    wk: 30,
    s: p52_sol(R, h, a2, byH, giv, val),
    sfig: p52_fig(),
    t: { R: R, h: h, a2: a2 }
  };
}
// Бодолт: призмийн диагональ = бөмбөрцгийн диаметр; диагональ огтлол (a√2 × h тэгш өнцөгт) → 2a² + h² = (2R)² → дутуу хэмжээ;
//   V_б = (4/3)πR³, V_п = a²h → харьцаа (хураана). Зураг: диагональ огтлол (тоогүй, хэлбэр нь тогтмол)
function p52_fig() {
  var A = [-0.8, -0.6], B = [0.8, -0.6], C = [0.8, 0.6], D = [-0.8, 0.6], f = Fig({ w: 170, pad: 14 });
  f.circle([0, 0], 1, { w: 1.2 }).poly([A, B, C, D], { w: 1.4 }).seg(A, C, { w: 1.2, dash: '4 3' }).right(B, A, C, { s: 6 }).dot([0, 0], { r: 2 })
    .text([0.8, 0], 'h', { pos: 'w' }).text([0, -0.6], 'a√2', { pos: 'n' }).text([-0.36, -0.27], '2R', { pos: 127 }).text([0, 0], 'O', { pos: 'se', size: 12 });
  return f.svg();
}
function p52_sol(R, h, a2, byH, giv, val) {
  var D2 = 2 * R, V3 = 4 * R * R * R, Vp = a2 * h, s2;
  if (byH) s2 = '$h=' + h + '$ тул $$2a^2=' + D2 + '^2-' + h + '^2=' + (D2 * D2 - h * h) + '\\ \\Rightarrow\\ a^2=' + a2 + '.$$';
  else if (giv.charAt(0) === '$') {                                  // a = x√2
    var x = Math.round(Math.sqrt(a2 / 2));
    s2 = '$a=' + rt(x, 2) + '$ тул $a^2=2\\cdot ' + x + '^2=' + a2 + '$, $$h=\\sqrt{' + D2 + '^2-2\\cdot ' + a2 + '}=\\sqrt{' + h * h + '}=' + h + '.$$';
  } else s2 = '$a=' + giv + '$ тул $a^2=' + a2 + '$, $$h=\\sqrt{' + D2 + '^2-2\\cdot ' + giv + '^2}=\\sqrt{' + h * h + '}=' + h + '.$$';
  var Vs = V3 % 3 ? '\\dfrac{' + V3 + '\\pi}{3}' : V3 / 3 + '\\pi', rat = V3 % 3 ? '\\dfrac{' + V3 + '\\pi}{3\\cdot ' + Vp + '}' : '\\dfrac{' + V3 / 3 + '\\pi}{' + Vp + '}';
  return [

      + '($a$ — суурийн тал, $h$ — өндөр) тул Пифагорын теоремоор $$2a^2+h^2=' + D2 + '^2.$$',
    s2,
    'Эзлэхүүнүүд: $$V_{\\text{б}}=\\dfrac{4}{3}\\pi R^3=\\dfrac{4}{3}\\pi\\cdot ' + R + '^3=' + Vs + ',$$ $$V_{\\text{п}}=a^2h=' + a2 + '\\cdot ' + h + '=' + Vp + '.$$',

}

// 53. log_{1/c}(x − p) − log_{1/c²}(L) ∨ K,  L = q − rx (голдуу) эсвэл rx − q;  L(p) = s > 0.
//     log_{1/c}y = −log_c y, log_{1/c²}y = −½·log_c y ⇒ LHS = ½·log_c L − log_c t (t = x − p) ⇒ LHS > K ⇔ L > M·t²  (M = c^{2K}).
//     L = s ∓ rt ⇒ Mt² ± rt − s ⋚ 0, язгуурууд t₁ < 0 < t₂ (D бүтэн квадрат) ⇒ «>»: p < x < p + t₂; «<»: p + t₂ < x < q/r
//     (L = rx − q үед x > p + t₂); «≥, ≤» үед p + t₂ орно. Муж: x > p, L > 0.
function p53() {
  var c = pick([2, 3, 3]), K = c === 2 ? pick([1, 1, 0, 2, -1]) : pick([1, 1, 1, 0, -1]);
  var Mn = K >= 0 ? Math.pow(c, 2 * K) : 1, Md = K >= 0 ? 1 : Math.pow(c, -2 * K);
  var inc = rnd(1, 4) === 1, r = rnd(1, 5), s = rnd(1, 24), p = rnd(-3, 5);
  var D = r * r * Md * Md + 4 * Mn * Md * s, sq = Math.round(Math.sqrt(D));
  if (sq * sq !== D) return null;
  var tn = (inc ? r * Md : -r * Md) + sq, td = 2 * Mn, gt = gcd(tn, td);   // t₂ = tn/td > 0
  tn /= gt; td /= gt;
  var q = inc ? r * p - s : s + r * p;                                        // L(p) = s
  if (!inc && q <= 0 && rnd(0, 2)) return null;
  if (td > 30 || Math.abs(p + tn / td) > 25) return null;
  var rel = pick(['gt', 'gt', 'gt', 'gt', 'lt', 'ge', 'le']);
  var T = fr(p * td + tn, td), Q = fr(q, r), ans;
  if (rel === 'gt' || rel === 'ge') ans = p + '\\lt x\\' + (rel === 'gt' ? 'lt ' : 'le ') + T;
  else if (inc) ans = 'x\\' + rel.replace('l', 'g') + ' ' + T;                // x > p + t₂ (x ≥ …)
  else ans = T + '\\' + rel + ' x\\lt ' + Q;
  var L = inc ? poly([r, -q]) : q === 0 ? tm(-r, 'x', true) : q + tm(-r, 'x');
  var so = p53_sol(c, K, Mn, Md, inc, r, q, p, sq, rel, L, Q, ans);
  return {
    q: '$\\log_{\\frac{1}{' + c + '}}' + (p ? '(' + poly([1, -p]) + ')' : 'x') + '-\\log_{\\frac{1}{' + c * c + '}}(' + L + ')\\' + rel + ' ' + K
      + '$ тэнцэтгэл бишийг бодоорой.',
    a: '$' + ans + '$',
    wk: 32,
    s: so.s,
    sfig: so.fig,
    t: { c: c, K: K, inc: inc, r: r, s: s, p: p, rel: rel }
  };
}
// Бодолт: муж; log_{1/c}y = −log_c y, log_{1/c²}y = −½log_c y; 2-оор үржүүлж нэг логарифм; суурь c > 1 → L ⋚ c^{2K}(x − p)²;
//   квадрат тэнцэтгэл биш Mn(x − p)² − Md·L ⋚ 0 → үржигдэхүүнд задалж (язгуур x₁ < p < x₂) интервалын арга → мужтай огтлолцол
function p53_lab(t) { return t[1] === 1 ? String(t[0]) : t[0] + '/' + t[1]; }
function p53_sol(c, K, Mn, Md, inc, r, q, p, sq, rel, L, Q, ans) {
  var A1 = p ? poly([1, -p]) : 'x', arg = p ? '(' + A1 + ')' : 'x', sqT = p ? '(' + A1 + ')^2' : 'x^2', lg = '\\log_{' + c + '}';
  var R = '\\' + rel, RV = '\\' + { gt: 'lt', lt: 'gt', ge: 'le', le: 'ge' }[rel], KK = 2 * K, MM = Math.pow(c, Math.abs(KK));
  var red = function (n, d) { var g = gcd(n, d); return [n / g, d / g]; };
  var base = 2 * Mn * p + (inc ? Md * r : -Md * r), R1 = red(base - sq, 2 * Mn), R2 = red(base + sq, 2 * Mn), mu = Mn / (R1[1] * R2[1]);
  var fc = function (t) { return t[1] === 1 ? (t[0] === 0 ? 'x' : '(' + poly([1, -t[0]]) + ')') : '(' + poly([t[1], -t[0]]) + ')'; };
  var fac = (mu === 1 ? '' : mu) + (R2[0] === 0 ? fc(R2) + fc(R1) : fc(R1) + fc(R2));
  var Bq = -2 * Mn * p + (inc ? -Md * r : Md * r), Cq = Mn * p * p + (inc ? Md * q : -Md * q);
  var X1 = fr(R1[0], R1[1]), X2 = fr(R2[0], R2[1]), neg = rel === 'gt' || rel === 'ge', eq = rel === 'ge' || rel === 'le';
  var rhs = KK > 0 ? lg + '\\left(' + MM + sqT + '\\right)' : KK < 0 ? lg + '\\dfrac{' + sqT + '}{' + MM + '}' : lg + sqT;
  var Mx = KK > 0 ? MM + sqT : KK < 0 ? '\\dfrac{' + sqT + '}{' + MM + '}' : sqT;
  var iv = neg ? X1 + (eq ? '\\le ' : '\\lt ') + 'x' + (eq ? '\\le ' : '\\lt ') + X2 : 'x' + (eq ? '\\le ' : '\\lt ') + X1 + '\\ \\text{эсвэл}\\ x' + (eq ? '\\ge ' : '\\gt ') + X2;
  var s = [
    'Тодорхойлогдох муж: $$' + A1 + '\\gt 0,\\quad ' + L + '\\gt 0\\ \\Rightarrow\\ x\\gt ' + p + ',\\ x' + (inc ? '\\gt ' : '\\lt ') + Q + '$$ $$\\Rightarrow\\ '
      + (inc ? 'x\\gt ' + p : p + '\\lt x\\lt ' + Q) + '.$$',
    '$\\dfrac{1}{' + c + '}=' + c + '^{-1}$, $\\dfrac{1}{' + c * c + '}=' + c + '^{-2}$ ба $\\log_{a^k}y=\\dfrac{1}{k}\\log_a y$ тул тэнцэтгэл биш: $$\\dfrac{1}{2}' + lg + '(' + L + ')-' + lg + arg + R + ' ' + K + '.$$',
    'Хоёр талыг $2$-оор үржүүлье. $' + A1 + '\\gt 0$ тул $2' + lg + arg + '=' + lg + sqT + '$' + (KK ? ', мөн $' + KK + '=' + lg + (KK > 0 ? ' ' + MM : '\\dfrac{1}{' + MM + '}') + '$' : '')
      + ': $$' + lg + '(' + L + ')' + R + ' ' + rhs + '.$$',
    'Суурь $' + c + '\\gt 1$ тул логарифм өсөх функц — тэмдэг хадгалагдана: $$' + L + R + ' ' + Mx + '$$' + (Md > 1 ? ' $$\\Leftrightarrow\\ ' + Md + '(' + L + ')' + R + ' ' + sqT + '$$' : '')
      + ' $$\\Leftrightarrow\\ ' + poly([Mn, Bq, Cq]) + RV + ' 0\\ \\Leftrightarrow\\ ' + fac + RV + ' 0.$$',
    'Язгуурууд $x_1=' + X1 + '$, $x_2=' + X2 + '$. Интервалын аргаар (зураг) $$' + iv + '.$$ Мужтай огтлолцуулбал ($' + X1 + '\\lt ' + p + '$' + (inc ? '' : ', $' + X2 + '\\lt ' + Q + '$')

  return { s: s, fig: signLine({ pts: [p53_lab(R1), p53_lab(R2)], sg: ['+', '-', '+'], fill: eq ? [0, 1] : [] }) };
}

// 54. sinⁿy + cosⁿy = V (n = 8, 6, 4; y = x, 2x эсвэл x/2), u = sin²2y:  sin⁴ + cos⁴ = 1 − u/2,  sin⁶ + cos⁶ = 1 − 3u/4,
//     sin⁸ + cos⁸ = (1 − u/2)² − u²/8 = 1 − u + u²/8 (нөгөө язгуур нь 1-ээс их — хасагдана).
//     u ∈ {0, 1/4, 1/2, 3/4, 1} ⇒ cos 4y = 1 − 2u (стандарт утга) ⇒ y-ийн ерөнхий шийд (хүснэгт p54_U); x = y/m.
var p54_U = [[1, 4, 1, 12, true, 1, 2], [1, 2, 1, 8, false, 1, 4], [3, 4, 1, 6, true, 1, 2], [1, 1, 1, 4, false, 1, 2],
  [0, 1, 0, 1, false, 1, 2]];   // [u_n, u_d, a_n, a_d, ±, b_n, b_d]: y = ±aπ + bπk
function p54_pi(n, d, k) {   // (n/d)·π (k бол ·k)
  var g = gcd(n, d); n /= g; d /= g;
  var top = (n === 1 ? '' : n) + '\\pi' + (k ? ' k' : '');
  return d === 1 ? top : '\\dfrac{' + top + '}{' + d + '}';
}
function p54() {
  var n = pick([8, 8, 8, 6, 6, 4, 4]), U = pick(p54_U), m = pick([[1, 1], [1, 1], [1, 1], [2, 1], [2, 1], [3, 1], [1, 2]]);
  if (U[0] === 0 && rnd(0, 2)) return null;                       // sin 2y = 0 тохиолдол цөөн
  if (n === 8 && U[1] === 2 && m[0] === 1 && m[1] === 1 && rnd(0, 3)) return null;   // эх тэгшитгэл ховор
  var un = U[0], ud = U[1], vn, vd;
  if (n === 4) { vn = 2 * ud - un; vd = 2 * ud; }
  else if (n === 6) { vn = 4 * ud - 3 * un; vd = 4 * ud; }
  else { vn = 8 * ud * ud - 8 * un * ud + un * un; vd = 8 * ud * ud; }
  // x = y/m:  m = m₀/m₁ ⇒ x = y·m₁/m₀
  var an = U[2] * m[1], ad = U[3] * m[0], bn = U[5] * m[1], bd = U[6] * m[0];
  var arg = m[0] === 1 && m[1] === 1 ? 'x' : m[1] === 1 ? m[0] + 'x' : '\\dfrac{x}{' + m[1] + '}';
  var sol = 'x=' + (an ? (U[4] ? '\\pm' : '') + p54_pi(an, ad) + '+' : '') + p54_pi(bn, bd, true) + ',\\ k\\in\\mathbb{Z}';
  return {
    q: '$\\sin^' + n + ' ' + arg + '+\\cos^' + n + ' ' + arg + '=' + fr(vn, vd) + '$ тэгшитгэлийг бодоорой.',
    a: '$' + sol + '$',
    wk: 32,
    s: p54_sol(n, arg, m, un, ud, vn, vd, sol),
    t: { n: n, u: [un, ud], m: m }
  };
}
// Бодолт: a = sin²y, b = cos²y ⇒ a + b = 1, ab = sin²2y/4 = t/4; aⁿ + bⁿ-ийг a + b, ab-ээр илэрхийлж t-г олно (n = 8 үед t ≤ 1 язгуур);
//   зэрэг бууруулах томьёо cos 4y = 1 − 2t (стандарт утга) ⇒ 4y-ийн ерөнхий шийд ⇒ x
var p54_C = { '1/2': ['\\pm\\dfrac{\\pi}{3}+', '2\\pi k'], '0/1': ['\\dfrac{\\pi}{2}+', '\\pi k'], '-1/2': ['\\pm\\dfrac{2\\pi}{3}+', '2\\pi k'], '-1/1': ['\\pi+', '2\\pi k'], '1/1': ['', '2\\pi k'] };
function p54_sol(n, Y, m, un, ud, vn, vd, sol) {
  var kx = function (nu, de) { var g = gcd(nu, de); nu /= g; de /= g; return de === 1 ? (nu === 1 ? 'x' : nu + 'x') : '\\dfrac{' + (nu === 1 ? '' : nu) + 'x}{' + de + '}'; };
  var Y2 = kx(2 * m[0], m[1]), Y4 = kx(4 * m[0], m[1]), V = fr(vn, vd), Ut = fr(un, ud), cn = ud - 2 * un, g = gcd(cn, ud), CV = fr(cn, ud), B = p54_C[cn / g + '/' + ud / g];
  var tr = '\\sin^' + n + ' ' + Y + '+\\cos^' + n + ' ' + Y, s3;
  if (n === 4) s3 = 'Тэгшитгэл: $$1-\\dfrac{t}{2}=' + V + '\\ \\Rightarrow\\ t=2\\left(1-' + V + '\\right)=' + Ut + '.$$';
  else if (n === 6) s3 = 'Тэгшитгэл: $$1-\\dfrac{3t}{4}=' + V + '\\ \\Rightarrow\\ t=\\dfrac{4}{3}\\left(1-' + V + '\\right)=' + Ut + '.$$';
  else {
    var c0 = un * (8 * ud - un), big = 8 * ud - un, U1 = ud === 1 ? '' : ud;
    s3 = 'Тэгшитгэл: $$1-t+\\dfrac{t^2}{8}=' + V + '\\ \\Rightarrow\\ ' + poly([1, -8, [c0, ud * ud]], 't') + '=0$$ $$\\Rightarrow\\ '
      + (ud > 1 ? poly([ud * ud, -8 * ud * ud, c0], 't') + '=0\\ \\Rightarrow\\ ' : '') + (un ? '(' + U1 + 't-' + un + ')' : 't') + '(' + U1 + 't-' + big + ')=0.$$ $t='
      + fr(big, ud) + '\\gt 1$ тул тохирохгүй, иймд $t=' + Ut + '$.';
  }
  return [
    '$a=\\sin^2 ' + Y + '$, $b=\\cos^2 ' + Y + '$ гэвэл $a+b=1$ ба $$ab=\\dfrac{(2\\sin ' + Y + '\\cos ' + Y + ')^2}{4}=\\dfrac{\\sin^2 ' + Y2 + '}{4}=\\dfrac{t}{4},$$ энд $t=\\sin^2 ' + Y2
      + '$, $0\\le t\\le 1$.',
    n === 4 ? 'Тэгвэл $$' + tr + '=a^2+b^2=(a+b)^2-2ab=1-\\dfrac{t}{2}.$$'
      : n === 6 ? 'Тэгвэл $$' + tr + '=a^3+b^3=(a+b)^3-3ab(a+b)=1-\\dfrac{3t}{4}.$$'
        : 'Тэгвэл $a^2+b^2=(a+b)^2-2ab=1-\\dfrac{t}{2}$ ба $$' + tr + '=a^4+b^4=(a^2+b^2)^2-2a^2b^2$$ $$=\\left(1-\\dfrac{t}{2}\\right)^2-\\dfrac{t^2}{8}=1-t+\\dfrac{t^2}{8}.$$',
    s3,
    'Зэрэг бууруулах томьёогоор $\\sin^2 ' + Y2 + '=\\dfrac{1-\\cos ' + Y4 + '}{2}$ тул $$\\cos ' + Y4 + '=1-2t=1-2\\cdot ' + Ut + '=' + CV + '.$$ Эндээс $$' + Y4 + '=' + B[0] + B[1]
      + '\\ \\Rightarrow\\ ' + sol + '.$$'
  ];
}
