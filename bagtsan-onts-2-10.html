<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тойрогт багтсан өнцөг 2 — диаметр, дөрвөн өнцөгт, гурвалжин (10-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:18px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:8px;padding:7px 12px;margin-bottom:11px;text-align:center}
  .task{font-weight:800;color:#5a32d6;font-size:13px;margin:10px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
  .dcard{break-inside:avoid;page-break-inside:avoid;border:1px solid #eee7fb;border-radius:9px;padding:6px 7px;background:linear-gradient(#fff,#fcfbff)}
  .dcard .dq{font-size:10.5px;margin-bottom:2px;min-height:26px}.dcard .dq b{color:var(--purple)}
  .dsvg{width:100%;height:auto;display:block}
  .aline{margin-top:3px;font-size:10.5px;color:var(--soft);text-align:center}.aline b{color:var(--ink);border-bottom:1px solid #cdbff0;padding:0 22px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;font-size:12.5px}.ans-grid .a{display:flex;gap:6px;align-items:baseline}.ans-grid .an{color:var(--soft);font-weight:800;min-width:22px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
var CX=66,CY=62,R=47,VBW=134,VBH=124;
function pt(deg){var r=deg*Math.PI/180;return [CX+R*Math.cos(r),CY-R*Math.sin(r)];}
function circ(){return '<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="#4a4470" stroke-width="1.3"/>';}
function odot(){return '<circle cx="'+CX+'" cy="'+CY+'" r="1.8" fill="#4a4470"/><text x="'+(CX-2)+'" y="'+(CY+10)+'" font-size="9" fill="#4a4470" font-style="italic">O</text>';}
function dot(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="1.8" fill="#7B52EE"/>';}
function plabel(p,deg,txt){var r=deg*Math.PI/180,lx=CX+(R+10)*Math.cos(r),ly=CY-(R+10)*Math.sin(r);return '<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" font-size="9.5" fill="#1a1030" text-anchor="middle" font-weight="700">'+txt+'</text>';}
function seg(a,b,col,w){return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+(col||'#7B52EE')+'" stroke-width="'+(w||1.5)+'"/>';}
function rightMark(v,pa,pb){function u(p){var dx=p[0]-v[0],dy=p[1]-v[1],L=Math.hypot(dx,dy)||1;return [dx/L,dy/L];}var u1=u(pa),u2=u(pb),m=6;var p1=[v[0]+u1[0]*m,v[1]+u1[1]*m],p2=[v[0]+u1[0]*m+u2[0]*m,v[1]+u1[1]*m+u2[1]*m],p3=[v[0]+u2[0]*m,v[1]+u2[1]*m];return '<path d="M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' L '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+' L '+p3[0].toFixed(1)+' '+p3[1].toFixed(1)+'" fill="none" stroke="#16a34a" stroke-width="1.2"/>';}
function amark(v,pa,pb,rr,txt,col){function sa(p){return Math.atan2(p[1]-v[1],p[0]-v[0]);}
  var A1=sa(pa),A2=sa(pb),d=A2-A1;while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;var sweep=d>0?1:0;
  var s=[v[0]+rr*Math.cos(A1),v[1]+rr*Math.sin(A1)],e=[v[0]+rr*Math.cos(A2),v[1]+rr*Math.sin(A2)],mid=A1+d/2,lp=[v[0]+(rr+10)*Math.cos(mid),v[1]+(rr+10)*Math.sin(mid)];
  return '<path d="M'+s[0].toFixed(1)+' '+s[1].toFixed(1)+' A '+rr+' '+rr+' 0 0 '+sweep+' '+e[0].toFixed(1)+' '+e[1].toFixed(1)+'" fill="none" stroke="'+(col||'#e0562d')+'" stroke-width="1.4"/>'
    +'<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3).toFixed(1)+'" font-size="9" fill="'+(col||'#c2451f')+'" text-anchor="middle" font-weight="800">'+txt+'</text>';}
function dsvg(inner){return '<svg class="dsvg" viewBox="0 0 '+VBW+' '+VBH+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';}
var GRAY='#9a94b5',BLUE='#2563eb',RED='#c2451f';
// D) диаметрт багтсан өнцөг
function figD(){var g2=2*rnd(14,74),al=g2/2,A=pt(180),B=pt(0),Cc=pt(g2),O=[CX,CY];
  var g=circ()+seg(A,B,GRAY,1.2)+seg(A,Cc)+seg(B,Cc)+rightMark(Cc,A,B)+amark(A,B,Cc,15,al+'&#176;',RED)+amark(B,A,Cc,15,'?',BLUE)+dot(A)+dot(B)+dot(Cc)+odot()+plabel(A,180,'A')+plabel(B,0,'B')+plabel(Cc,g2,'C');
  return {q:'$AB$ диаметр, $\\angle CAB='+al+'^\\circ$. <b>$\\angle ABC=?$</b>',svg:dsvg(g),a:'$\\angle ABC='+(90-al)+'^\\circ$'};}
// Q) тойрогт багтсан дөрвөн өнцөгт
function figQuad(){for(var tr=0;tr<300;tr++){var x=2*rnd(22,58),y=2*rnd(22,58),z=2*rnd(22,58),w=360-x-y-z;if(w<70||w>150||w%2)continue;
  var d0=rnd(72,104),dA=d0,dB=d0+x,dC=d0+x+y,dD=d0+x+y+z,A=pt(dA),B=pt(dB),C=pt(dC),D=pt(dD),angA=(y+z)/2,angC=(w+x)/2;
  var g=circ()+seg(A,B)+seg(B,C)+seg(C,D)+seg(D,A)+amark(A,D,B,13,angA+'&#176;',RED)+amark(C,B,D,13,'?',BLUE)+dot(A)+dot(B)+dot(C)+dot(D)+plabel(A,dA,'A')+plabel(B,dB,'B')+plabel(C,dC,'C')+plabel(D,dD,'D');
  return {q:'Багтсан $ABCD$-д $\\angle A='+angA+'^\\circ$. Эсрэг <b>$\\angle C=?$</b>',svg:dsvg(g),a:'$\\angle C='+angC+'^\\circ$'};}return null;}
// T) багтсан гурвалжин
function figT(){for(var tr=0;tr<300;tr++){var ab=2*rnd(30,70),bc=2*rnd(30,70),ca=360-ab-bc;if(ca<60||ca>160||ca%2)continue;
  var dA=rnd(84,108),dB=dA+ab,dC=dB+bc,A=pt(dA),B=pt(dB),C=pt(dC),angA=bc/2,angB=ca/2,angC=ab/2;
  var g=circ()+seg(A,B)+seg(B,C)+seg(C,A)+amark(A,B,C,12,angA+'&#176;',RED)+amark(B,C,A,12,angB+'&#176;','#16a34a')+amark(C,A,B,12,'?',BLUE)+dot(A)+dot(B)+dot(C)+plabel(A,dA,'A')+plabel(B,dB,'B')+plabel(C,dC,'C');
  return {q:'Багтсан гурвалжинд $\\angle A='+angA+'^\\circ,\\ \\angle B='+angB+'^\\circ$. <b>$\\angle C=?$</b>',svg:dsvg(g),a:'$\\angle C='+angC+'^\\circ$'};}return null;}
function fillSec(fn,n,seen){var arr=[],tr=0;while(arr.length<n&&tr++<600){var f=fn();if(!f||seen[f.q])continue;seen[f.q]=1;arr.push(f);}return arr;}
function build(){
  var seen={},K=0;window.__A=[];
  var s1=fillSec(figD,3,seen),s2=fillSec(figQuad,3,seen),s3=fillSec(figT,3,seen);
  function card(f){var k=K++;window.__A.push({k:k,a:f.a});return '<div class="dcard"><div class="dq"><b style="color:#7B52EE">'+(k+1)+'.</b> '+f.q+'</div>'+f.svg+'<div class="aline">Хариу: <b>&nbsp;</b></div></div>';}
  var b1=s1.map(card).join(''),b2=s2.map(card).join(''),b3=s3.map(card).join('');
  var ans='<div class="ans-grid">'+window.__A.map(function(a){return '<div class="a"><span class="an">'+(a.k+1)+'.</span><span>'+a.a+'</span></div>';}).join('')+'</div>';
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Тойрогт багтсан өнцөг 2</h1><div class="sub">Диаметрт багтсан өнцөг · тойрогт багтсан дөрвөн өнцөгт · гурвалжин · 7.1 · 10-р анги</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="rule">Диаметрт багтсан өнцөг $=90^\\circ$. Тойрогт багтсан дөрвөн өнцөгтийн эсрэг өнцгүүдийн нийлбэр $180^\\circ$. Гурвалжны өнцгүүдийн нийлбэр $180^\\circ$.</div>'
    +'<div class="task">1. Диаметрт багтсан өнцгийг ашиглан ол.</div><div class="dgrid">'+b1+'</div>'
    +'<div class="task">2. Тойрогт багтсан дөрвөн өнцөгтийн эсрэг өнцгийг ол.</div><div class="dgrid">'+b2+'</div>'
    +'<div class="task">3. Багтсан гурвалжны гуравдахь өнцгийг ол.</div><div class="dgrid">'+b3+'</div>'
    +'<div class="ans-page" id="answers"><h2>Хариунууд</h2>'+ans+'</div>';
  window.WS_ITEMS=[];window.WS_TITLE='Тойрогт багтсан өнцөг 2 — диаметр, дөрвөн өнцөгт, гурвалжин (10-р анги)';
  toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=37"></script>
</body>
</html>
