<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЭЕШ 2022 — Сонгох ба нөхөх даалгавар</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  /* «Эх хувилбар» — шинэ хувилбар дээр байхад л харагдана (.btn биш: ws-store хэвлэх товчийг .btn-ээр олдог) */
  .e22-orig{font-weight:800;border:1.4px solid #d9cff5;background:#faf7ff;color:#5a32d6;border-radius:999px;padding:.5rem 1rem;font-size:.85rem;cursor:pointer;font-family:inherit}
  .e22-orig[hidden]{display:none}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem;cursor:pointer}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}
  .e22-sub{font-size:11px;color:var(--soft);margin-top:2px}
  .e22-ver{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:800;color:#5a32d6;border:1.3px solid #d9cff5;border-radius:999px;padding:1px 11px;letter-spacing:.3px}
  .meta{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .e22-fbox{border:1px solid #e6ddfa;border-radius:9px;padding:7px 12px 8px;margin-bottom:9px;font-size:11.5px;line-height:1.55}
  .e22-fbox .e22-ft{font-weight:800;color:#5a32d6;text-align:center;font-size:12px;margin-bottom:3px}
  .e22-fbox ol{padding-left:20px}.e22-fbox li{margin:1px 0}
  .e22-ptab{border-collapse:collapse;margin:4px 0 3px;font-size:11px}
  .e22-ptab td{border:1px solid #cfc6ea;padding:1px 10px;text-align:center}
  .e22-note{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #c9b8f5;border-radius:8px;padding:7px 12px;margin-bottom:10px}
  .e22-note b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:12.5px;margin:9px 0 4px;border-left:4px solid var(--purple2);padding-left:9px}
  /* ── 1-р хэсэг (сонгох) ── */
  .e22-q{break-inside:avoid;page-break-inside:avoid;padding:7px 0 8px;border-bottom:1px dashed #ece6fb}
  .e22-q:last-child{border-bottom:0}
  .qh{display:flex;gap:7px;align-items:baseline}
  .ql{font-weight:800;color:var(--purple);font-size:13px;min-width:24px;flex:0 0 auto}
  .qm{font-size:13px;flex:1 1 auto;min-width:0}
  .e22-pts{flex:0 0 auto;font-size:11px;color:var(--soft);font-weight:700;white-space:nowrap;margin-left:6px}
  .fig{text-align:center;margin:5px 0;max-width:100%;overflow-x:auto}
  /* Зураг/сонголтын SVG-г зөвхөн ШУУД хүүхдээр (>): KaTeX-ийн \sqrt-ийн дотоод <svg>-д height:auto үйлчилбэл язгуурын тэмдэг алга болно */
  .fig>svg{max-width:100%;height:auto}
  .fig table{margin:0 auto}
  .e22-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--ow,118px)),1fr));gap:6px 12px;margin:5px 0 0 31px;font-size:13px}
  .e22-o{display:flex;gap:5px;align-items:baseline;min-width:0}
  .e22-L{font-weight:800;color:#5a32d6;flex:0 0 auto}
  .e22-ov{min-width:0}
  .e22-ov>svg{max-width:100%;height:auto;vertical-align:middle}
  .e22-err{color:#dc2626;font-weight:700}
  .wk{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:24mm;margin:6px 0 0 31px}
  /* ── 2-р хэсэг (нөхөх) ── */
  .grid{display:grid;grid-template-columns:1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid;margin:12px 0 4px}
  .q .ql{min-width:30px}
  .stmt{display:flow-root;margin-bottom:3px}
  .pt{float:right;white-space:nowrap;margin-left:12px;color:#333}
  .sp{display:flex;gap:8px;align-items:baseline;margin:4px 0}
  .sp .sn{min-width:24px;flex-shrink:0}
  .sp .st{flex:1;min-width:0}
  .it{font-style:italic;margin-left:32px}
  .row{display:flex;gap:10px 16px;align-items:flex-start;flex-wrap:wrap}
  .row>.col{flex:1 1 300px;min-width:0}
  .row>.fig{flex:0 1 auto;margin:2px auto 0}
  .bx{display:inline-block;min-width:1.25em;padding:0 .2em;margin:0 .1em;border:1px solid #222;line-height:1.12;text-align:center;font-family:KaTeX_Math,'Times New Roman',serif;font-style:italic;font-size:1.12em;color:#111;white-space:nowrap}
  .nw{display:inline-block;white-space:nowrap}
  .pt2{white-space:nowrap;color:#555}
  .rt{display:inline-flex;align-items:flex-start;white-space:nowrap;vertical-align:middle;margin:0 .1em}
  .rt .rts{font-family:KaTeX_Main,'Times New Roman',serif;font-size:1.3em;line-height:1.05;margin-right:-1px}
  .rt .rtv{border-top:1.3px solid #222;padding:3px .12em 0;margin-top:.12em}
  .bf{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;line-height:1.15}
  .bf>.n{display:flex;align-items:baseline;justify-content:center;border-bottom:1px solid #222;padding:0 .15em 2px}
  .bf>.d{display:flex;align-items:baseline;justify-content:center;padding:2px .15em 0}
  .bf .bx{font-size:.98em}
  /* Бодолтын зай: 2-р хэсэгт .wz (өндрийг эх хуудаслалтаар энд тогтооно) */
  .wz{border:1.1px solid #e2daf5;border-radius:7px;background:linear-gradient(#fff,#fbf9ff);height:50mm;margin-top:6px}
  /* Эх шалгалтын 1-р хуудасны координатын тор: зөвхөн бодолтын зайтай хэвлэхэд (дэлгэцэнд харагдахгүй) */
  .cgrid{display:none;text-align:center}
  .cgrid .cg>svg{display:block;width:160mm;max-width:100%;height:auto;margin:0 auto}
  .cgrid .gl{margin-top:3mm;font-size:12px}
  /* ── Хариултын хуудас (1–36 × A–E) ── */
  .e22-bub{margin-top:9mm;border-top:2px dashed #ddd;padding-top:6mm}
  .e22-bh{font-size:14.5px;font-weight:800;color:#5a32d6;text-align:center}
  .e22-bs{font-size:11px;color:var(--soft);text-align:center;margin:2px 0 8px}
  .e22-bm{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;font-size:11.5px;margin:0 2px 10px}
  .e22-bm span{border-bottom:1px dotted #b3a9cf;padding:0 70px 2px 4px}
  .e22-bg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px}
  .e22-bc{border:1px solid #ece6fb;border-radius:8px;padding:5px 7px}
  .e22-br{display:flex;align-items:center;gap:5px;padding:2.5px 0}
  .e22-bn{min-width:20px;text-align:right;font-weight:800;font-size:11.5px;color:#5a32d6;margin-right:2px}
  .e22-bo{width:18px;height:18px;border:1.2px solid #a99ad0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#a99ad0;line-height:1}
  /* ── Хариу ба бодолт ── */
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:9px}
  .ans-page h3{font-size:13px;color:#5a32d6;margin:12px 0 7px}
  #answers{display:none}
  .e22-akey{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-bottom:12px}
  .e22-akey div{border:1px solid #e6ddfa;border-radius:6px;text-align:center;font-size:12px;padding:2px 0;background:#fbfaff}
  .e22-akey b{color:#5a32d6;margin-right:3px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:7px;font-size:12px}
  .ans-grid .a{padding:6px 10px 7px;background:#fbfaff;border:1px solid #ece6fb;border-radius:9px;break-inside:avoid;page-break-inside:avoid}
  .ans-grid .an{display:inline-block;min-width:26px;color:#5a32d6;font-weight:800}
  .e22-st{margin:2px 0;padding-left:9px;border-left:2px solid #e6ddfa}
  .e22-res{margin-top:4px;font-weight:800;color:#16a34a}
  .e22-res>svg{max-width:160px;height:auto;vertical-align:middle}
  .chips{display:inline-flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 4px;font-weight:700}
  .chips .ch{white-space:nowrap}
  .chips .ch b{color:#16a34a}
  .sl{margin:3px 0;padding-left:9px;border-left:2px solid #e6ddfa}
  .sl .sn{font-weight:700;color:#5a32d6;margin-right:4px}
  .sl .katex-html>.base{margin:3px 0}
  .katex .kp{font-family:'Segoe UI',Arial,sans-serif;font-size:.8264em;font-style:normal;font-weight:normal}
  /* Хуучин хувилбарын холбоосоор нээсэн үеийн сануулга (зөвхөн дэлгэцэнд) */
  .e22-stale{max-width:210mm;margin:0 auto 12px;font-size:13px;line-height:1.45;color:#7f1d1d;background:transparent;border-left:3px solid #dc2626;border-radius:8px;padding:8px 12px}
  .e22-stale[hidden]{display:none}
  /* «Ангиар хэвлэх»-ийн хариуны түлхүүр (зөвхөн хэвлэхэд гарна) */
  .e22-kt-h{font-size:15px;font-weight:800;color:#5a32d6;text-align:center}
  .e22-kt-s{font-size:11px;color:var(--soft);text-align:center;margin:2px 0 9px}
  .e22-kt-p{font-size:12px;font-weight:800;color:#5a32d6;margin:10px 0 4px}
  .e22-kt-t{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
  .e22-kt-t th,.e22-kt-t td{border:1px solid #d9cff5;text-align:center;padding:2px 0;line-height:1.3}
  .e22-kt-t thead th{background:#f4f0ff;color:#5a32d6;font-weight:800;font-size:10px}
  .e22-kt-t thead{display:table-header-group}
  .e22-kt-t tbody{break-inside:avoid;page-break-inside:avoid}
  .e22-kt-t tbody:nth-of-type(even) td{background:#fbfaff}
  .e22-kt-t td.e22-kt-v{font-weight:800;color:#5a32d6;font-size:10.5px;padding:2px 4px;text-align:left;word-break:break-word}
  .e22-kt-t td.e22-kt-v span{display:block;font-weight:600;color:var(--ink);font-size:9.5px}
  .e22-kt-t td.e22-kt-L{font-weight:800;font-size:11.5px}
  .e22-kt-t td.e22-kt-a{text-align:left;padding:3px 4px;word-break:break-word}
  .e22-kt-t td.e22-kt-a i{font-family:KaTeX_Math,'Times New Roman',serif;color:#5a32d6;margin-right:1px}
  .e22-kt-t td.e22-kt-a b{margin-right:6px;white-space:nowrap}
  .e22-kt-t col.e22-kt-c0{width:8mm}.e22-kt-t col.e22-kt-c1{width:30mm}
  html.cm-p12 .sheet .e22-opts{font-size:12pt}
  html.cm-p12 .sheet .e22-pts{font-size:10pt}
  @media screen and (max-width:560px){
    .e22-opts{margin-left:6px;gap:7px 10px}
    .wk{margin-left:0}
    .e22-akey{grid-template-columns:repeat(6,minmax(0,1fr))}
    .e22-bm span{padding-right:40px}
    .fig table{font-size:12px!important}
    .fig table td,.fig table th{padding:4px 5px!important}
    .it{margin-left:0}
  }
  @media print{
    body{background:#fff;padding:0}.bar,.e22-stale{display:none!important}
    .sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}
    @page{size:A4;margin:11mm}
    /* Олон хуудастай шалгалт: ws-store-ийн нэг хуудсанд шахах zoom-ыг цуцална (текст жижгэрэхгүй) */
    #sheet,.sheet{zoom:1!important}
    .qm,.e22-opts{font-size:11pt}
    .cgrid{display:block;break-inside:avoid;margin-top:4mm}
    .pgb{break-before:page;page-break-before:always}
    .e22-bub{break-before:page;border-top:0;margin-top:0;padding-top:0}
    .ans-page{break-before:page;border-top:0;margin-top:0;padding-top:0}
    .e22-q{border-bottom-color:#f1edfb}
    .task,.e22-note{break-after:avoid;page-break-after:avoid}
    /* ws-store-ийн хөл сүүлийн хуудсанд ганцаараа үлдэхгүй — сүүлийн даалгавартай хамт */
    .sheet>.cm-foot{break-before:avoid;page-break-before:avoid;margin-top:6px}
  }
  /* KaTeX язгуурын тэмдгийн SVG-г дээрх svg хэмжээний дүрмээс хамгаална */
  .katex svg{max-width:none!important;height:inherit!important}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()" title="Шинэ хувилбар үүсгэх (1 ба 2-р хэсэг хамт)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ хувилбар</button>
  <button type="button" class="e22-orig" id="e22-orig" onclick="build('orig')" title="2022 оны эх даалгавар руу буцах" hidden>Эх хувилбар</button>
  <label><input type="checkbox" id="sw" onchange="layout()"> Бодолтын зай</label>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Хариу хавсаргах</label>
  <label><input type="checkbox" id="sbub" onchange="layout()"> Хариултын хуудас</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="e22-stale" id="e22-stale" role="alert" hidden></div>
<div class="sheet" id="sheet"></div>
<!-- Эх шалгалтын томьёоны хуудас (Даалгаварт хэрэглэгдэх зарим томьёо, 2022) -->
<template id="e22-ftpl"><div class="e22-fbox"><div class="e22-ft">Даалгаварт хэрэглэгдэх зарим томьёо</div><ol>
<li>$A(x_1,y_1),\ B(x_2,y_2)$ цэгүүдийн хоорондох зай: $AB=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$</li>
<li>$(p,q)$ цэгт оройтой параболын тэгшитгэл: $y=a(x-p)^2+q$</li>
<li>Пирамидын эзлэхүүн: $V=\dfrac{1}{3}S_{\text{суурь}}\cdot h$</li>
<li>Өгөгдлийн стандарт хазайлт: $\text{С.Х}=\sqrt{\dfrac{\sum x^2}{n}-\overline{x}^2}$. Энд $\overline{x}=\dfrac{\sum x}{n}$</li>
<li>Математик дундаж: $X$ дискрет санамсаргүй хувьсагчийн магадлалын тархалт нь
<table class="e22-ptab"><tr><td>$x$</td><td>$x_1$</td><td>$x_2$</td><td>$\ldots$</td><td>$x_n$</td></tr><tr><td>$P(X=x)$</td><td>$p_1$</td><td>$p_2$</td><td>$\ldots$</td><td>$p_n$</td></tr></table>
бол математик дундаж $E(X)=x_1\cdot p_1+x_2\cdot p_2+\cdots+x_n\cdot p_n$ байна.</li>
</ol></div></template>

<script>
// ЭЕШ ажлын хуудсын НИЙТЛЭГ туслахууд (jishig-daalgavar-1-11.html-ээс). Генераторууд эдгээрийг ашиглана — ДАХИН БҮҮ ТОДОРХОЙЛ.
// ══════════ g10core.js — 10-р ангийн нийтлэг хөдөлгүүр ══════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function nz(a,b){var v;do{v=rnd(a,b);}while(v===0);return v;}
function pick(a){return a[rnd(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function sgn(n){return n>=0?'+'+n:''+n;}                 // +5, -3 (тэмдэгтэй)
function paren(n){return n<0?'('+n+')':''+n;}            // (-3), 5 (сөрөг бол хаалттай)
// ── Анхны тоо, задаргаа ──
function isPrime(n){n=Math.abs(n);if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function primeFactors(n){n=Math.abs(n);var f=[],d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);return f;} // [2,2,3]
function primeFactExp(n){var f=primeFactors(n),out=[],i=0;while(i<f.length){var p=f[i],e=0;while(i<f.length&&f[i]===p){e++;i++;}out.push({p:p,e:e});}return out;} // [{p:2,e:2},{p:3,e:1}]
function pfTex(n){var pe=primeFactExp(n);return pe.map(function(x){return x.e===1?''+x.p:x.p+'^{'+x.e+'}';}).join('\\cdot ');} // 2^{2}\cdot3
// ── Бүтэн квадрат/куб ──
function isqrt(n){if(n<0)return null;var r=Math.round(Math.sqrt(n));return r*r===n?r:null;}       // төгс квадрат бол язгуур, үгүй бол null
function icbrt(n){var s=n<0?-1:1;n=Math.abs(n);var r=Math.round(Math.cbrt(n));for(var k=r-1;k<=r+1;k++){if(k*k*k===n)return s*k;}return null;} // төгс куб бол куб язгуур, үгүй бол null
// ── Бутархайн exact хөдөлгүүр ──
function Fr(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function fAdd(a,b){return Fr(a.n*b.d+b.n*a.d,a.d*b.d);}
function fSub(a,b){return Fr(a.n*b.d-b.n*a.d,a.d*b.d);}
function fMul(a,b){return Fr(a.n*b.n,a.d*b.d);}
function fDiv(a,b){return Fr(a.n*b.d,a.d*b.n);}
function fVal(a){return a.n/a.d;}
function fTex(a){if(a.d===1)return ''+a.n;if(a.n<0)return '-\\dfrac{'+(-a.n)+'}{'+a.d+'}';return '\\dfrac{'+a.n+'}{'+a.d+'}';}

    + '$P(x)$ олон гишүүнтийг $(' + L + ')(' + Qd + ')$ олон гишүүнтэд хуваахад гарах үлдэгдлийг олоорой.';

    return '<div class="e22-o"><span class="e22-L">' + E22_LET[i] + '.</span><span class="e22-ov">' + o + '</span></div>';
  }).join('');
  return '<div class="e22-q" data-n="' + n + '">' + head + '<span class="qm">' + f.q + '</span><span class="e22-pts">(' + pts + ' оноо)</span></div>'
    + (f.fig ? '<div class="fig">' + f.fig + '</div>' : '')
    + '<div class="e22-opts e22-' + it.lay.kind + '" style="--ow:' + it.lay.ow + '">' + opts + '</div>'
    + (WK ? '<div class="wk" style="height:' + E22_WKH[pts] + 'mm"></div>' : '')
    + '</div>';
}
function e22n_qHtml(it, k, WK) {
  return '<div class="grid' + (WK && k === 2 ? ' pgb' : '') + '"><div class="q" data-k="' + k + '">'
    + '<div class="qh"><span class="ql">2.' + (k + 1) + '.</span><div class="qm">' + it.html + '</div></div>'
    + (WK ? '<div class="wz" style="height:' + E22N_WZ[k] + '"></div>' : '')
    + '</div></div>';
}
function e22_bubHtml(st) {
  var cols = '';
  for (var c = 0; c < 4; c++) {
    var rows = '';
    for (var n = c * 9 + 1; n <= c * 9 + 9; n++) {
      rows += '<div class="e22-br"><span class="e22-bn">' + n + '</span>'
        + E22_LET.map(function (L) { return '<span class="e22-bo">' + L + '</span>'; }).join('') + '</div>';
    }
    cols += '<div class="e22-bc">' + rows + '</div>';
  }
  return '<div class="e22-bub" id="e22bub"><div class="e22-bh">Хариултын хуудас — ' + e22_esc(e22_vtext(st)) + '</div>'
    + '<div class="e22-bs">Нэгдүгээр хэсэг. Зөв хариултынхаа дугуйг бүрэн будна уу.</div>'
    + '<div class="e22-bm"><span>Нэр:</span><span>Анги:</span><span>Оноо:</span></div>'
    + '<div class="e22-bg">' + cols + '</div></div>';
}
function e22n_chips(ans) {
  var s = '';
  for (var k in ans) if (Object.prototype.hasOwnProperty.call(ans, k)) s += '<span class="ch"><span class="bx">' + e22_esc(k) + '</span> = <b>' + e22_esc(ans[k]) + '</b></span>';
  return '<span class="chips">' + s + '</span>';
}
function e22_ansHtml(st, st2) {
  var key = st.items.map(function (it) {
    return '<div><b>' + it.n + '.</b>' + (it.f ? E22_LET[it.ci] : '—') + '</div>';
  }).join('');
  var sols = st.items.map(function (it) {
    if (!it.f) return '';
    var sol = it.f.sol;
    if (typeof sol === 'string') sol = [sol];
    var steps = (sol || []).filter(function (s) { return s != null && String(s).replace(/\s+/g, ''); })
      .map(function (s) { return '<div class="e22-st">' + s + '</div>'; }).join('');
    return '<div class="a" data-n="' + it.n + '"><span class="an">' + it.n + '.</span>' + steps
      + '<div class="e22-res">Хариу: ' + E22_LET[it.ci] + '. ' + it.opts[it.ci] + '</div></div>';
  }).join('');
  var p2 = st2.items.map(function (it, k) {
    return '<div class="a" data-k="' + k + '"><span class="an">2.' + (k + 1) + '.</span>' + e22n_chips(it.ans)
      + (it.sol || []).map(function (s) { return '<div class="sl">' + s + '</div>'; }).join('') + '</div>';
  }).join('');
  return '<div class="ans-page" id="answers"><h2>Хариу ба бодолт — ' + e22_esc(e22_vtext(st)) + '</h2>'
    + '<h3>Нэгдүгээр хэсэг</h3><div class="e22-akey">' + key + '</div><div class="ans-grid">' + sols + '</div>'
    + '<h3>Хоёрдугаар хэсэг</h3><div class="ans-grid">' + p2 + '</div></div>';
}
function toggleAns() {
  var el = document.getElementById('answers');
  if (el) el.style.display = e22_cb('sa') ? 'block' : 'none';
}
// Эх шалгалтын 1-р хуудасны координатын тор (x: −9…8, y: −8…8), бодолтын зайтай хэвлэхэд томьёоны доор
function cgridSVG() {
  var u = 20, X0 = 210, Y0 = 186, W = 432, H = 366, i;
  function X(x) { return +(X0 + u * x).toFixed(1); } function Y(y) { return +(Y0 - u * y).toFixed(1); }
  var g = '';
  for (i = -10; i <= 10; i++) g += 'M' + X(i) + ' ' + Y(8.5) + 'V' + Y(-8.5);
  for (i = -8; i <= 8; i++) g += 'M' + X(-10) + ' ' + Y(i) + 'H' + X(10);
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Координатын тор">'
    + '<path d="' + g + '" fill="none" stroke="#b5b5b5" stroke-width=".6"/>'
    + '<path d="M' + X(-10) + ' ' + Y(0) + 'H' + X(10.6) + 'M' + X(0) + ' ' + Y(-8.5) + 'V' + Y(9.1) + '" fill="none" stroke="#222" stroke-width="1.3"/>'
    + '<polygon points="' + X(10.95) + ',' + Y(0) + ' ' + X(10.5) + ',' + (Y(0) - 4) + ' ' + X(10.5) + ',' + (Y(0) + 4) + '" fill="#222"/>'
    + '<polygon points="' + X(0) + ',' + Y(9.45) + ' ' + (X(0) - 4) + ',' + Y(9) + ' ' + (X(0) + 4) + ',' + Y(9) + '" fill="#222"/>'
    + '<g font-family="Arial,Helvetica,sans-serif" font-size="8.5" font-weight="700" fill="#333" stroke="#fff" stroke-width="2.4" paint-order="stroke">';
  for (i = -10; i <= 10; i++) { if (i) s += '<text x="' + X(i) + '" y="' + (Y(0) + 11) + '" text-anchor="middle">' + (i < 0 ? '−' + (-i) : i) + '</text>'; }
  s += '<text x="' + (X(0) - 3) + '" y="' + (Y(0) + 11) + '" text-anchor="end">0</text>';
  for (i = -8; i <= 8; i++) { if (i) s += '<text x="' + (X(0) - 4) + '" y="' + (Y(i) + 3) + '" text-anchor="end">' + (i < 0 ? '−' + (-i) : i) + '</text>'; }
  s += '</g><g font-family="KaTeX_Math,\'Times New Roman\',serif" font-style="italic" font-weight="700" font-size="14" fill="#222">'
    + '<text x="' + X(10.6) + '" y="' + (Y(0) + 16) + '">x</text><text x="' + (X(0) + 7) + '" y="' + (Y(9) + 5) + '">y</text></g></svg>';
  return s;
}
// Томьёоны ард залгасан цэг/таслал ганцаараа дараагийн мөрөнд шилжихгүй: тэмдгийг томьёоны сүүлийн .base дотор оруулна
function gluePunct(root) {
  var ks = root.querySelectorAll('.katex');
  for (var i = 0; i < ks.length; i++) {
    var host = ks[i].parentNode, nx = host && host.nextSibling;
    if (!nx || nx.nodeType !== 3) continue;
    var m = /^[.,;:]+/.exec(nx.data); if (!m) continue;
    var bs = ks[i].querySelectorAll('.katex-html>.base'); if (!bs.length) continue;
    var p = document.createElement('span'); p.className = 'kp'; p.textContent = m[0];
    bs[bs.length - 1].appendChild(p);
    nx.data = nx.data.slice(m[0].length);
  }
}
// ws-store-ийн «Ангиар хэвлэх» (runBatch) хуулбаруудаа #cm-batch-д угсарсны дараа дуудна.
// Сурагч бүр өөр хувилбартай, хариу хавсаргахгүй тул бүх хувилбарын хариуг (1-р хэсгийн үсэг + 2-р хэсгийн нүд) сүүлийн хуудсанд нэгтгэнэ.
function e22_keyRow(label, sub, k, no) {
  var a = '', b = '';
  for (var i = 0; i < 36; i++) {
    var c = '<td class="e22-kt-L">' + e22_esc(k.charAt(i) === '-' ? '—' : (k.charAt(i) || '?')) + '</td>';
    if (i < 18) a += c; else b += c;
  }
  return '<tbody><tr><td rowspan="2">' + e22_esc(no) + '</td><td rowspan="2" class="e22-kt-v">' + (/^\d/.test(label) ? '№' : '') + e22_esc(label)
    + (sub ? '<span>' + e22_esc(sub) + '</span>' : '') + '</td>' + a + '</tr><tr>' + b + '</tr></tbody>';
}
function e22n_keyCell(ans) {
  var s = '';
  for (var k in ans) if (Object.prototype.hasOwnProperty.call(ans, k)) s += '<b><i>' + e22_esc(k) + '</i>=' + e22_esc(ans[k]) + '</b> ';
  return '<td class="e22-kt-a">' + s + '</td>';
}
function e22n_keyRow(label, sub, A, no) {
  var cells = '';
  for (var k = 0; k < 4; k++) cells += A && A[k] ? e22n_keyCell(A[k]) : '<td class="e22-kt-a">?</td>';
  return '<tbody><tr><td>' + e22_esc(no) + '</td><td class="e22-kt-v">' + (/^\d/.test(label) ? '№' : '') + e22_esc(label)
    + (sub ? '<span>' + e22_esc(sub) + '</span>' : '') + '</td>' + cells + '</tr></tbody>';
}
window.WS_BATCH_DONE = function (box) {
  try {
    if (!box || box.querySelector('.e22-kt')) return;
    var rows = [];
    [].forEach.call(box.querySelectorAll('.cm-batch-sheet'), function (sh, i) {
      var v = sh.querySelector('.e22-ver[data-e22v]');
      if (!v) return;
      var nf = sh.querySelector('.meta .cm-fill[data-ph="нэр…"]');
      var lab = v.getAttribute('data-e22v') || '', K = E22_KEYS[lab] || {};
      rows.push({ no: String(i + 1), name: nf ? (nf.textContent || '').replace(/\s+/g, ' ').trim() : '', v: lab, k: K.k || '', A: K.A || null });
    });
    if (!rows.length) return;
    var uniq = {}, nu = 0;
    rows.forEach(function (r) { if (!uniq[r.v]) { uniq[r.v] = 1; nu++; } });
    var one = nu === 1, no1 = rows.length > 1 ? '1–' + rows.length : '1', sub1 = 'бүх ' + rows.length + ' хуудас';
    var b1 = '', b2 = '';
    if (one) { b1 = e22_keyRow(rows[0].v, sub1, rows[0].k, no1); b2 = e22n_keyRow(rows[0].v, sub1, rows[0].A, no1); }
    else rows.forEach(function (r) { b1 += e22_keyRow(r.v, r.name, r.k, r.no); b2 += e22n_keyRow(r.v, r.name, r.A, r.no); });
    var h1 = '', h2 = '';
    for (var n = 1; n <= 36; n++) { if (n <= 18) h1 += '<th>' + n + '</th>'; else h2 += '<th>' + n + '</th>'; }
    var d = document.createElement('div');
    d.className = 'sheet cm-batch-sheet e22-kt';
    d.innerHTML = '<div class="e22-kt-h">Хариуны түлхүүр — ' + e22_esc(E22_TITLE) + '</div>'
      + '<div class="e22-kt-s">Ангиар хэвлэсэн ' + rows.length + ' хуудас · ' + nu + ' хувилбар. Сурагчийн хуудасны «Хувилбар №»-аар мөрөө олно.</div>'
      + '<div class="e22-kt-p">Нэгдүгээр хэсэг (сонгох)</div>'
      + '<table class="e22-kt-t"><colgroup><col class="e22-kt-c0"><col class="e22-kt-c1">' + new Array(19).join('<col>') + '</colgroup>'
      + '<thead><tr><th rowspan="2">#</th><th rowspan="2">Хувилбар</th>' + h1 + '</tr><tr>' + h2 + '</tr></thead>' + b1 + '</table>'
      + '<div class="e22-kt-p">Хоёрдугаар хэсэг (нөхөх) — нүд бүрийн хариу</div>'
      + '<table class="e22-kt-t"><colgroup><col class="e22-kt-c0"><col class="e22-kt-c1"><col><col><col><col></colgroup>'
      + '<thead><tr><th>#</th><th>Хувилбар</th><th>2.1</th><th>2.2</th><th>2.3</th><th>2.4</th></tr></thead>' + b2 + '</table>';
    box.appendChild(d);
  } catch (e) {}
};
// layout() — одоогийн хувилбарыг (1 ба 2-р хэсэг) зурна.
// «Бодолтын зай»: 1-р хэсэгт .wk, 2-р хэсэгт .wz, хэвлэхэд томьёоны доор координатын тор (эх шалгалтын 1-р хуудас шиг).
// «Бодолтын зай»-тай хэвлэхэд 2-р хэсэг эх шиг шинэ хуудаснаас; зайгүй бол үргэлжлүүлж (цаас хэмнэнэ).
function layout() {
  var st = window.__E22, st2 = window.__E22N;
  if (!st || !st2) { build(); return; }
  var WK = e22_cb('sw'), BUB = e22_cb('sbub'), VL = e22_esc(e22_vlabel(st)), orig = st.seed === 'orig';
  var html = '<div class="head"><h1>' + E22_TITLE + '</h1><div class="e22-sub">' + (orig ? E22_SUB0 : E22_SUB) + '</div>'
    + '<div class="e22-ver" data-e22v="' + VL + '">' + e22_esc(e22_vtext(st)) + '</div></div>'
    + '<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    + e22_fbox()
    + (WK ? '<div class="cgrid"><div class="cg">' + cgridSVG() + '</div><div class="gl">Эрхэм шалгуулагч танд амжилт хүсье!</div></div>' : '')
    + '<div class="task' + (WK ? ' pgb' : '') + '">Нэгдүгээр хэсэг. СОНГОХ ДААЛГАВАР</div>'
    + '<div class="e22-note">' + E22_NOTE1 + '</div>'
    + '<div class="e22-list">' + st.items.map(function (it) { return e22_qHtml(it, WK); }).join('') + '</div>'
    + '<div class="task' + (WK ? ' pgb' : '') + '">Хоёрдугаар хэсэг. НӨХӨХ ДААЛГАВАР</div>'
    + '<div class="e22-note">' + E22_NOTE2 + '</div>'
    + st2.items.map(function (it, k) { return e22n_qHtml(it, k, WK); }).join('')
    + (BUB ? e22_bubHtml(st) : '')
    + e22_ansHtml(st, st2);
  var sheet = document.getElementById('sheet');
  sheet.innerHTML = html;
  // «Тэмдэглэх»: ws-store гарчгийг h1-ээс авч (хэрэглэгч засварласан байж болно) ард нь WS_TITLE_SUFFIX залгана
  window.WS_TITLE = E22_TITLE;
  window.WS_TITLE_SUFFIX = orig ? '' : ' · Хувилбар №' + e22_vlabel(st);
  try { window.WS_ITEMS = e22_items(st).concat(e22n_items(st2)); } catch (e) { window.WS_ITEMS = []; }
  var ob = document.getElementById('e22-orig'); if (ob) ob.hidden = orig;
  toggleAns();
  e22_showStale(st);
  try {
    renderMathInElement(sheet, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
    gluePunct(sheet);
  } catch (e) {}
}
// build() — шинэ санамсаргүй хувилбар; build(1234) — тэр хувилбар; build('orig') — эх 2022. 1 ба 2-р хэсэг хамт.
// ws-store-ийн «Ангиар хэвлэх» ч build()-ийг дууддаг (сурагч бүрд шинэ хувилбар).
function build(seed) {
  var prev = window.__E22 ? window.__E22.seed : null;
  var s = seed === 'orig' ? 'orig' : ((typeof seed === 'number' && seed >= 1000 && seed <= 9999) ? seed : e22_newSeed(prev));
  if (s !== seed) window.__E22_STALE = null;              // шинэ хувилбар — хуучин холбоосны сануулга хамаарахгүй
  var st = e22_generate(s, window), st2 = e22n_generate(s, window);
  st.g = st2.g = s === 'orig' ? '' : E22_BUILD;
  window.__E22 = st; window.__E22N = st2;
  E22_KEYS[e22_vlabel(st)] = { k: e22_letters(st), A: st2.items.map(function (it) { return it.ans; }) };
  e22_syncUrl(st);
  layout();
}
window.WS_PAGED = 'e22-paged';                              // ws-store: олон хуудастай шалгалтыг нэг хуудсанд шахахгүй
(function () {
  var s = e22_urlSeed(), g = e22_urlBuild();
  window.__E22_STALE = (s && g && g !== E22_BUILD) ? { seed: s, g: g } : null;
  build(s || 'orig');                                      // URL параметргүй бол эх 2022 хувилбар
})();
</script>
