<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Шугаман бус тэгшитгэлийн систем — орлуулах ба график</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--amber:#9a6300;--green:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:20px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .grp{margin-top:12px}
  .gh{font-weight:800;color:#5a32d6;font-size:13.5px;margin:10px 0 3px;display:flex;align-items:center;gap:8px}
  .gh .tag{background:#efeaff;color:#5a32d6;border-radius:6px;font-size:11px;padding:2px 7px}
  .note{font-size:11px;color:var(--amber);background:#fff7e6;border:1px solid #f3dca6;border-radius:7px;padding:5px 10px;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:5px 4px 7px;border-bottom:1px dashed #efeaff}
  .qeq{display:flex;gap:6px;align-items:flex-start}.qn{font-weight:800;color:var(--purple);min-width:22px}.qm{font-size:14px}
  .bl{display:block;min-width:100px;border-bottom:1.4px solid #b9accf;height:1.05em;margin-top:16px}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .sol{break-inside:avoid;page-break-inside:avoid;padding:8px 10px;margin-bottom:8px;border:1px solid #eee;border-left:3px solid var(--purple);border-radius:8px;font-size:12.5px}
  .sol .sn{font-weight:800;color:var(--purple);margin-right:5px}
  .sol .st{margin:4px 0 2px;color:#2a2340}
  .sol .fin{color:var(--green);font-weight:800}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[rnd(0,a.length-1)];}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}

function termList(terms){var s='',first=true;for(var i=0;i<terms.length;i++){var co=terms[i][0],sym=terms[i][1];if(co===0)continue;var sign=co<0?'-':'+',a=Math.abs(co),body=(sym==='')?(''+a):((a===1?'':a)+sym);if(first){s+=(co<0?'-':'')+body;first=false;}else{s+=' '+sign+' '+body;}}return s===''?'0':s;}
function conicLatex(A,B,C,K){return termList([[A,'x^2'],[B,'xy'],[C,'y^2']])+' = '+K;}
function linLatex(iso,a,b){if(iso==='x')return termList([[1,'x'],[-a,'y']])+' = '+b;return termList([[a,'x'],[-1,'y']])+' = '+(-b);}
function sys(e1,e2){return '\\begin{cases}'+e1+' \\\\ '+e2+'\\end{cases}';}
function fmtSols(S){return S.map(function(s){return '('+s[0]+',\\ '+s[1]+')';}).join(',\\ ');}

/* ---------- A/B: конус = K + шугаман (орлуулах арга) ---------- */
function conicLinear(kind){
  var tries=0;
  while(tries++<9999){
    var iso=(rnd(0,1)?'x':'y');
    var A=1,B=rnd(-2,2),C=rnd(-2,2);
    if(kind==='circle'){A=1;B=0;C=1;}
    if(kind==='xy'){A=0;B=1;C=0;}
    var a=(iso==='y')?rnd(1,3):pick([-3,-2,-1,1,2,3]);
    var b=rnd(-4,5);
    var P,Q,R,subVar,isoVar,isoExpr;
    if(iso==='x'){P=A*a*a+B*a+C;Q=b*(2*A*a+B);R=A*b*b;subVar='y';isoVar='x';isoExpr=termList([[a,'y'],[b,'']]);}
    else {P=A+B*a+C*a*a;Q=b*(B+2*C*a);R=C*b*b;subVar='x';isoVar='y';isoExpr=termList([[a,'x'],[b,'']]);}
    if(P===0)continue; if(((-Q)%P)!==0)continue;
    var S=(-Q)/P, r1=rnd(-4,4), r2=S-r1; if(r1===r2)continue;
    var x1,y1,x2,y2;
    if(iso==='x'){y1=r1;y2=r2;x1=a*y1+b;x2=a*y2+b;}else{x1=r1;x2=r2;y1=a*x1+b;y2=a*x2+b;}
    var K=A*x1*x1+B*x1*y1+C*y1*y1;
    if(A*x2*x2+B*x2*y2+C*y2*y2!==K)continue;
    if(kind==='circle'&&K<=0)continue;
    if(Math.abs(K)>200)continue;
    if([x1,x2,y1,y2].some(function(v){return Math.abs(v)>14;}))continue;
    if(A===1&&B===0&&C===0)continue;
    return {kind:kind,A:A,B:B,C:C,K:K,iso:iso,a:a,b:b,sols:[[x1,y1],[x2,y2]],
            Psub:P,Qsub:Q,Rsub:R-K,subVar:subVar,isoVar:isoVar,isoExpr:isoExpr,roots:[r1,r2]};
  }
  return conicLinear(kind); // маш ховор дахин оролдоно
}
function conicProblem(kind){
  var o=conicLinear(kind);
  var eqTop=(kind==='circle')?('x^2 + y^2 = '+o.K):conicLatex(o.A,o.B,o.C,o.K);
  var q=sys(eqTop, linLatex(o.iso,o.a,o.b));
  var quad=termList([[o.Psub,o.subVar+'^2'],[o.Qsub,o.subVar],[o.Rsub,'']])+' = 0';
  var sol='Шугаман тэгшитгэлээс $'+o.isoVar+' = '+o.isoExpr+'$.'
    +'<div class="st">Эхний тэгшитгэлд орлуулж эмхэтгэвэл: $'+quad+'$.</div>'
    +'<div class="st">$'+o.subVar+' = '+o.roots[0]+'$ буюу $'+o.subVar+' = '+o.roots[1]+'$.</div>'
    +(kind==='circle'?'<div class="st">(Геометрээр: $'+o.K+'$ радиустай… $\\sqrt{'+o.K+'}$ радиустай тойрог ба шулууны огтлол.)</div>':'');
  return {q:q, ans:fmtSols(o.sols), sol:sol};
}

/* ---------- B: ялгаврын үржвэрт задлах ---------- */
function diff2Problem(){
  var p,q,x0,y0,m,n,K;
  while(true){
    p=rnd(1,3);q=rnd(1,3);x0=rnd(-4,4);y0=rnd(-4,4);
    m=p*x0+q*y0; if(m===0)continue;
    n=p*x0-q*y0; K=(p*x0)*(p*x0)-(q*y0)*(q*y0);
    if(Math.abs(K)>200||K===0)continue; break;
  }
  var f1=termList([[p,'x'],[-q,'y']]), f2=termList([[p,'x'],[q,'y']]);
  var eqTop=termList([[p*p,'x^2'],[-q*q,'y^2']])+' = '+K;
  var eqBot=termList([[p,'x'],[q,'y']])+' = '+m;
  var qtx=sys(eqTop,eqBot);
  var sol='Зүүн талыг ялгаврын үржвэрээр задал: $('+f1+')('+f2+') = '+K+'$.'
    +'<div class="st">$'+f2+' = '+m+'$ тул $'+f1+' = '+K+'\\div'+m+' = '+n+'$.</div>'
    +'<div class="st">Хоёр шугаман тэгшитгэлийг хамт бодвол $x = '+x0+',\\ y = '+y0+'$.</div>';
  return {q:qtx, ans:'('+x0+',\\ '+y0+')', sol:sol};
}

/* ---------- C: парабол + шулуун (график) ---------- */
function parabProblem(){
  var x1,x2,m,p,c,q,y1,y2;
  while(true){
    x1=rnd(-4,4);x2=rnd(-4,4); if(x1===x2)continue;
    m=rnd(-3,3); p=m-(x1+x2); c=rnd(-4,4); q=c+x1*x2;
    y1=m*x1+c; y2=m*x2+c;
    if([p,q,c].some(function(v){return Math.abs(v)>12;}))continue;
    if([y1,y2].some(function(v){return Math.abs(v)>40;}))continue; break;
  }
  var eqTop='y = '+termList([[1,'x^2'],[p,'x'],[q,'']]);
  var eqBot='y = '+termList([[m,'x'],[c,'']]);
  var qtx=sys(eqTop,eqBot);
  var quad=termList([[1,'x^2'],[p-m,'x'],[q-c,'']])+' = 0';
  var sol='Хоёр илэрхийллийг тэнцүүлбэл: $x^2'+(p?(p>0?'+':'')+p+'x':'')+' '+(q?((q>0?'+':'')+q):'')+' = '+termList([[m,'x'],[c,'']])+'$.'
    +'<div class="st">$'+quad+'$ буюу $(x-('+x1+'))(x-('+x2+'))=0$.</div>'
    +'<div class="st">$x = '+x1+',\\ '+x2+'$; $\\ y = '+m+'x'+(c?(c>0?'+':'')+c:'')+'$-д орлуулбал огтлолын цэгүүд: $'+fmtSols([[x1,y1],[x2,y2]])+'$.</div>'
    +'<div class="st"><b>График:</b> параболыг (орой, эргэлт) ба шулууныг байгуулж огтлолцлыг унш.</div>';
  return {q:qtx, ans:fmtSols([[x1,y1],[x2,y2]]), sol:sol};
}

var SECTIONS=[
  {name:'Орлуулах аргаар бод', note:'Шугаман тэгшитгэлээс нэг хувьсагчийг илэрхийлж, эхний тэгшитгэлд орлуулаад квадрат тэгшитгэл бод.', gens:[function(){return conicProblem(null);},function(){return conicProblem(null);},function(){return conicProblem('xy');}]},
  {name:'Тэгшитгэлийн системийг бод', note:'Орлуулах эсвэл ялгаврын үржвэрт задлах ($a^2-b^2=(a-b)(a+b)$) аргыг тохируулан хэрэглэ.', gens:[function(){return diff2Problem();},function(){return conicProblem(null);},function(){return diff2Problem();}]},
  {name:'Графикийн аргаар бод', note:'Хоёр муруйг (парабол/тойрог ба шулуун) координатын хавтгайд байгуулж, огтлолцлын цэгээр шийдийг ол.', gens:[function(){return parabProblem();},function(){return parabProblem();},function(){return conicProblem('circle');}]},
];

function build(){
  var groups='',sols='',WS=[],n=0;
  for(var s=0;s<SECTIONS.length;s++){
    var SEC=SECTIONS[s], qs='';
    for(var j=0;j<SEC.gens.length;j++){
      n++; var p=SEC.gens[j]();
      qs+='<div class="q"><div class="qeq"><span class="qn">'+n+'.</span><span class="qm">$'+p.q+'$</span></div><div class="bl"></div></div>';
      sols+='<div class="sol"><span class="sn">'+n+'.</span><span>$'+p.q+'$</span>'
        +'<div class="st">'+p.sol+'</div><div class="fin">Хариу: $'+p.ans+'$</div></div>';
      WS.push({q:p.q,a:p.ans});
    }
    groups+='<div class="grp"><div class="gh"><span class="tag">'+String.fromCharCode(65+s)+'</span>'+SEC.name+'</div>'
      +'<div class="note">'+SEC.note+'</div><div class="grid">'+qs+'</div></div>';
  }
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Шугаман бус тэгшитгэлийн систем</h1><div class="sub">Орлуулах арга · ялгаврын үржвэр · графикийн арга · 9 бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +groups
    +'<div class="ans-page" id="answers"><h2>Бодолт ба хариу</h2>'+sols+'</div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='Шугаман бус тэгшитгэлийн систем (3 арга)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=25"></script>
</body>
</html>
