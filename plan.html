<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Хичээлийн төлөвлөгөө — CyberMath</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--purple-d:#5a32d6;--ink:#211C54;--soft:#8a83a8;--line:#e7e0f7;--bg:#f4f2fb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  a{color:inherit}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .top .brand{font-weight:900;color:var(--purple-d);font-size:1.05rem;display:flex;align-items:center;gap:8px}
  .top .sp{flex:1}
  .lnk{display:inline-flex;align-items:center;gap:6px;border:1.4px solid var(--line);background:#fff;color:var(--purple-d);font-weight:800;font-size:.82rem;border-radius:999px;padding:.42rem .9rem;text-decoration:none;cursor:pointer}
  .lnk.pri{border:0;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff}
  .wrap{max-width:1100px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:260px 1fr;gap:16px}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px -22px rgba(90,50,214,.5)}
  .side{padding:12px}
  .side h3{font-size:.8rem;color:var(--soft);font-weight:800;letter-spacing:.4px;margin:2px 4px 8px}
  .plan-item{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;cursor:pointer;border:1px solid transparent}
  .plan-item:hover{background:#faf8ff}.plan-item.on{background:#f3eefe;border-color:#e0d4fb}
  .plan-item .t{font-weight:800;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plan-item .m{font-size:.7rem;color:var(--soft)}
  .newbtn{width:100%;border:0;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-weight:800;border-radius:11px;padding:.6rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.86rem;margin-bottom:10px}
  .ed{padding:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  @media (max-width:560px){.grid2{grid-template-columns:1fr}}
  label.f{display:block;font-size:.74rem;font-weight:800;color:var(--soft);margin:0 0 4px 2px}
  .in,textarea.in,select.in{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:.6rem .8rem;font-size:.9rem;outline:none;font-family:inherit;background:#fff;color:var(--ink)}
  textarea.in{resize:vertical;min-height:60px;line-height:1.5}
  .fg{margin-bottom:12px}
  .flab{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .auto-btn{border:1.3px solid #d9ccf7;background:#f3eefe;color:var(--purple-d);font-weight:800;font-size:.72rem;border-radius:999px;padding:.25rem .7rem;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .auto-btn:hover{background:#ece3fd}.auto-btn:disabled{opacity:.55;cursor:default}
  .sec-t{font-weight:900;color:var(--purple-d);font-size:.95rem;margin:16px 0 8px;display:flex;align-items:center;gap:7px}
  .wsrow{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:8px 11px;margin-bottom:7px;background:#faf9ff}
  .wsrow .wt{flex:1;font-weight:700;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wsrow select{border:1.3px solid var(--line);border-radius:8px;padding:4px 7px;font-size:.76rem;font-weight:700;color:var(--purple-d);background:#fff}
  .ico-btn{border:0;background:transparent;cursor:pointer;color:var(--soft);display:inline-flex;padding:3px}
  .ico-btn.del{color:#ef4444}
  .addws{border:1.5px dashed #cdbdf5;background:#faf7ff;color:var(--purple-d);font-weight:800;border-radius:11px;padding:.55rem;cursor:pointer;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.84rem}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
  .btn{border:0;cursor:pointer;font-weight:800;border-radius:11px;padding:.6rem 1.2rem;font-size:.88rem;display:inline-flex;align-items:center;gap:7px}
  .btn.save{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff}
  .btn.print{background:#eafff1;color:#16a34a;border:1px solid #b6f0cd}
  .btn.del{background:#fff;color:#ef4444;border:1.4px solid #f3c7c7;margin-left:auto}
  .msg{font-size:.82rem;font-weight:700}
  .modal{position:fixed;inset:0;z-index:200;background:rgba(20,15,40,.55);display:none;place-items:center;padding:16px}
  .modal.on{display:grid}
  .picker{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px -18px rgba(0,0,0,.5)}
  .picker .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .picker .ph .in{flex:1}
  .picker .pb{overflow-y:auto;padding:8px}
  .pk-grp{font-size:.72rem;font-weight:800;color:var(--soft);margin:9px 6px 4px}
  .pk-item{padding:8px 11px;border-radius:9px;cursor:pointer;font-size:.86rem;font-weight:600}
  .pk-item:hover{background:#f3eefe}
  .gate{max-width:440px;margin:60px auto;text-align:center;padding:28px}
  #app{display:none}
  /* дасгалын hover preview */
  #pkPreview{position:fixed;z-index:400;width:300px;height:412px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px -12px rgba(40,20,90,.5);overflow:hidden;display:none;pointer-events:none}
  #pkPreview iframe{position:absolute;top:0;left:0;border:0;width:794px;height:1090px;transform:scale(.378);transform-origin:top left;background:#fff}
  #pkPreview .pvl{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-size:.82rem}
  @media (max-width:820px){#pkPreview{display:none!important}}
  /* ── Хэвлэлт ── */
  #planDoc{display:none}
  @media print{
    body{background:#fff}
    .top,.wrap,.modal{display:none!important}
    #planDoc{display:block!important;padding:0;color:#000;font-size:12.5px}
    @page{size:A4;margin:14mm}
    #planDoc h1{font-size:19px;color:#000;text-align:center;margin-bottom:2px}
    #planDoc .pd-sub{text-align:center;color:#444;font-size:11px;margin-bottom:10px;border-bottom:1.5px solid #000;padding-bottom:7px}
    #planDoc table{width:100%;border-collapse:collapse;margin-bottom:9px}
    #planDoc td{border:1px solid #999;padding:5px 8px;vertical-align:top}
    #planDoc td.k{width:130px;font-weight:800;background:#f3f0fb}
    #planDoc .pd-sec{font-weight:800;margin:11px 0 4px;font-size:13px}
    #planDoc .pd-box{border:1px solid #999;border-radius:4px;padding:7px 9px;white-space:pre-wrap;min-height:14mm}
    #planDoc ul{margin:2px 0 0 18px}
    .cm-ws-page{page-break-before:always}
    .cm-ws-page .sheet{box-shadow:none!important;width:auto!important;min-height:auto!important;margin:0!important;padding:0!important}
  }
</style>
</head>
<body>
<div class="top">
  <span class="brand"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#5a32d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Хичээлийн төлөвлөгөө</span>
  <span class="sp"></span>
  <a class="lnk" href="/worksheets.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Дасгалын төв</a>
</div>

<div class="gate card" id="gate" style="display:none">
  <div style="font-size:2rem;margin-bottom:6px"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#7B52EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg></div>
  <h2 style="color:var(--purple-d)">Нэвтэрсэн байх шаардлагатай</h2>
  <p style="color:var(--soft);margin:8px 0 16px">Хичээлийн төлөвлөгөө нь зөвхөн танд харагдана. Дасгалын төвд нэвтэрч ороод эргэн орно уу.</p>
  <a class="lnk pri" href="/worksheets.html">Дасгалын төв рүү очих</a>
</div>

<div class="wrap" id="app">
  <div class="card side">
    <button class="newbtn" onclick="newPlan()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Шинэ төлөвлөгөө</button>
    <h3>МИНИЙ ТӨЛӨВЛӨГӨӨ</h3>
    <div id="planList"><div style="color:var(--soft);font-size:.82rem;padding:6px">Ачааллаж байна…</div></div>
  </div>

  <div class="card ed">
    <div class="grid2">
      <div class="fg" style="grid-column:1/-1"><label class="f">Хичээлийн сэдэв</label><input id="f_title" class="in" placeholder="Жнь: Тооны модул"></div>
      <div class="fg"><label class="f">Анги</label><select id="f_grade" class="in"></select></div>
      <div class="fg"><label class="f">Огноо</label><input id="f_date" type="date" class="in"></div>
      <div class="fg"><label class="f">Хугацаа</label><input id="f_dur" class="in" placeholder="40 мин"></div>
    </div>
    <div class="fg"><label class="f flab">Зорилго / зорилт (мэдлэг · чадвар · хандлага)<button type="button" class="auto-btn" onclick="genObjectives(false)"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Автоматаар бөглөх</button></label><textarea id="f_obj" class="in" rows="3"></textarea></div>
    <div class="fg"><label class="f flab">Хичээлийн явц (сэдэлжүүлэх → шинэ мэдлэг → бататгал → дүгнэлт)<button type="button" class="auto-btn" onclick="genFlow()"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Автоматаар бөглөх</button></label><textarea id="f_flow" class="in" rows="6"></textarea></div>
    <div class="fg"><label class="f">Гэрийн даалгавар</label><textarea id="f_hw" class="in" rows="2"></textarea></div>

    <div class="sec-t"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Хавсаргасан ажлын хуудас</div>
    <div id="wsList"></div>
    <button class="addws" onclick="openPicker()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Дасгал нэмэх</button>

    <div class="actions">
      <button class="btn save" onclick="savePlan()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Хадгалах</button>
      <button class="btn print" onclick="printPlan()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
      <span id="msg" class="msg"></span>
      <button class="btn del" onclick="delPlan()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Устгах</button>
    </div>
  </div>
</div>

<div class="modal" id="picker">
  <div class="picker">
    <div class="ph" style="flex-wrap:wrap"><input id="pkSearch" class="in" placeholder="Дасгал хайх…" oninput="renderPicker()"><select id="pkGrade" class="in" style="flex:0 0 auto;width:auto;min-width:120px" onchange="renderPicker()"></select><button class="ico-btn" onclick="closePicker()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="pb" id="pkBody"></div>
  </div>
</div>

<div id="pkPreview"><iframe id="pkPrevFrame" scrolling="no"></iframe></div>
<div id="planDoc"></div>

<script src="/catalog.js"></script>
<script src="/plan-objectives.js"></script>
<script>
function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(action,data){data=data||{};data.action=action;data.token=ls('cm_ws_token');
  return fetch('/api/worksheets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json();});}
var curId=null, curWs=[], FLAT=[];
// ── Локал бөглөгч: сэдвийн түлхүүр үгээр зорилго/зорилт, явцыг шууд бэлдэнэ ──
var THEMES=[
 {re:/модул/, know:'Тооны модул (абсолют утга)-ын тодорхойлолт, |a|=a (a≥0) ба |a|=−a (a<0) дүрмийг мэдэх.', skill:'Илэрхийллийн тэмдгийг тодорхойлж модулийг зөв нээх, модультай тэгшитгэл бодох.'},
 {re:/тэнцэтгэл ?биш|тэнцэт ?бус|тэнцшгүй/, know:'Тэнцэтгэл бишийн шинж чанар, шийдвэрлэх дүрмийг мэдэх.', skill:'Тэнцэтгэл бишийг зөв хувиргаж, шийдийн мужийг олох.'},
 {re:/тэгшитгэл/, know:'Тэгшитгэлийн ойлголт, шийд, шийдвэрлэх алхмуудыг мэдэх.', skill:'Тэгшитгэлийг зөв хувиргаж, шийдийг олох чадвартай болох.'},
 {re:/аравт/, know:'Аравтын бутархайн орон, үйлдлийн дүрмийг мэдэх.', skill:'Аравтын бутархайг зөв нэмэх, хасах, үржих, хуваах, шаардвал тоймлох.'},
 {re:/тоймло/, know:'Тоо тоймлох дүрэм, орны утгыг мэдэх.', skill:'Тоог заасан орон хүртэл зөв тоймлох чадвартай болох.'},
 {re:/бутархай/, know:'Бутархайн ойлголт, эквивалент болон үйлдлийн дүрмийг мэдэх.', skill:'Бутархай дээр үйлдэл хийж, хамгийн энгийн хэлбэрт хураах.'},
 {re:/вектор/, know:'Векторын ойлголт, координат, үйлдлийн дүрмийг мэдэх.', skill:'Векторыг координатаар илэрхийлж, нэмэх/хасах, урт олох.'},
 {re:/тригонометр|синус|косинус|тангенс|\bsin\b|\bcos\b|\btan\b/, know:'Тригонометрийн харьцаа, утгуудыг мэдэх.', skill:'Тригонометрийн харьцааг ашиглан тал, өнцөг олох.'},
 {re:/язгуур/, know:'Язгуурын ойлголт, шинж чанарыг мэдэх.', skill:'Язгуурт илэрхийллийг хялбарчлах, тооцоолох.'},
 {re:/зэрэг/, know:'Зэргийн ойлголт, шинж чанар, дүрмийг мэдэх.', skill:'Зэрэгт илэрхийллийг хувиргаж, тооцоолох.'},
 {re:/логарифм|\bлог\b/, know:'Логарифмын тодорхойлолт, шинж чанарыг мэдэх.', skill:'Логарифмт илэрхийллийг тооцоолж, хувиргах.'},
 {re:/матриц|тодорхойлогч|детерминант|крамер/, know:'Матриц, тодорхойлогчийн ойлголтыг мэдэх.', skill:'Матрицын үйлдэл хийж, системийг шийдэх.'},
 {re:/график|функц|налалт|парабол/, know:'Функц ба түүний графикийн ойлголтыг мэдэх.', skill:'Функцийн графикийг байгуулж, шинжийг тодорхойлох.'},
 {re:/координат/, know:'Координатын хавтгай, аргын ойлголтыг мэдэх.', skill:'Координатын аргаар геометрийн бодлого бодох.'},
 {re:/бисектрис|медиан|гурвалжин|өнцөг|олон ?өнцөгт|солбисон|гадаад|хамар|босоо/, know:'Гурвалжин/өнцгийн шинж чанар, теоремыг мэдэх.', skill:'Өнцөг, талыг тооцоолж, геометрийн бодлого бодох.'},
 {re:/прогресс|дараалал/, know:'Тоон дарааллын хууль, гишүүдийг мэдэх.', skill:'Дарааллын гишүүн, нийлбэрийг олох.'},
 {re:/процент|хувь/, know:'Хувь, харьцааны ойлголтыг мэдэх.', skill:'Хувь бодох, харьцуулах бодлого бодох.'},
 {re:/анхны|хуваагдах|хиех|хбех|үржигдэхүүн/, know:'Хуваагдах шинж, анхны тоо, ХИЕХ/ХБЕХ-ийн ойлголтыг мэдэх.', skill:'Тоог үржигдэхүүнд задлах, ХИЕХ/ХБЕХ олох.'},
 {re:/илэрхийлэл|хялбарчла|эмхэтгэ|задлах|хаалт|гишүүн/, know:'Алгебрийн илэрхийллийн хувиргалтын дүрмийг мэдэх.', skill:'Илэрхийллийг задлах, эмхэтгэх, хялбарчлах.'},
 {re:/үржих|үржвэр/, know:'Үржих үйлдлийн дүрмийг мэдэх.', skill:'Олон оронтой тоо/илэрхийллийг зөв үржүүлэх.'},
 {re:/хуваа/, know:'Хуваах үйлдлийн дүрмийг мэдэх.', skill:'Баганан хуваалт/хуваахыг зөв гүйцэтгэх.'},
 {re:/нэмэх|хасах/, know:'Нэмэх, хасах үйлдлийн дүрмийг мэдэх.', skill:'Нэмэх, хасах үйлдлийг зөв гүйцэтгэх.'}
];
function themeOf(t){t=(t||'').toLowerCase();for(var i=0;i<THEMES.length;i++){if(THEMES[i].re.test(t))return THEMES[i];}return null;}
function localObjectives(title){
  var th=themeOf(title);
  var know=th?th.know:(title+'-ын үндсэн ойлголт, дүрэм, томьёог мэдэх.');
  var skill=th?th.skill:(title+'-ын бодлого дасгалыг зөв, бие даан бодох чадвартай болох.');
  return 'Мэдлэг: '+know+'\nЧадвар: '+skill+'\nХандлага: Математик сэтгэлгээ хөгжүүлж, нямбай, тэвчээртэй, бие даан ажиллах хандлага төлөвшүүлэх.';
}
function localFlow(title){
  var prac=curWs.filter(function(w){return w.role!=='homework';}).map(function(w){return w.title;});
  var hw=curWs.filter(function(w){return w.role==='homework';}).map(function(w){return w.title;});
  var s='Сэдэлжүүлэх/сэргээн санах: Өмнөх мэдлэгийг асуулт, богино даалгавраар сэргээж, "'+title+'" сэдэвт хүргэнэ.\n'
   +'Шинэ мэдлэг: '+title+'-ын ойлголт, дүрэм, жишээг тайлбарлаж, хамтдаа жишээ бодно.\n'
   +'Бататгах дасгал: '+(prac.length?('«'+prac.join('», «')+'» ажлын хуудсаар бататгана.'):'Ажлын хуудас, дасгалаар сурагчид бие даан бодно.')+'\n'
   +'Дүгнэлт/үнэлгээ: Гол санааг нэгтгэж, сурагчдын гүйцэтгэлийг үнэлнэ.';
  if(hw.length)s+='\nГэрийн даалгавар: «'+hw.join('», «')+'».';
  return s;
}
function genObjectives(auto){
  var title=document.getElementById('f_title').value.trim();
  if(!title){ if(!auto)setMsg('Эхлээд сэдвээ бичнэ үү',false); return; }
  var ta=document.getElementById('f_obj');
  if(auto && ta.value.trim()) return;   // авто: бичсэн зорилгыг дарж бичихгүй
  ta.value=localObjectives(title);
}
function genFlow(auto){
  var title=document.getElementById('f_title').value.trim();
  if(!title){ if(!auto)setMsg('Эхлээд сэдвээ бичнэ үү',false); return; }
  var ta=document.getElementById('f_flow');
  if(auto && ta.value.trim()) return;
  ta.value=localFlow(title);
}
// каталогийг хавтгайруулах
(function(){
  function add(groups){(groups||[]).forEach(function(g){var grade=g[0];(g[1]||[]).forEach(function(w){FLAT.push({slug:w[0],title:w[1],grade:grade});});});}
  add(window.WS_LIST); add(window.WS_CAMB);
})();
// анги сонголт (төлөвлөгөөний талбар)
(function(){var sel=document.getElementById('f_grade');var o='<option value="">—</option>';for(var i=1;i<=12;i++)o+='<option value="'+i+'-р анги">'+i+'-р анги</option>';sel.innerHTML=o;})();
// picker дотор анги сонгох dropdown (каталогид байгаа бүх ангиар)
(function(){var sel=document.getElementById('pkGrade');if(!sel)return;var seen={},opts='<option value="">Бүх анги</option>';
  FLAT.forEach(function(w){if(w.grade&&!seen[w.grade]){seen[w.grade]=1;opts+='<option value="'+esc(w.grade)+'">'+esc(w.grade)+'</option>';}});
  sel.innerHTML=opts;})();

function init(){
  if(!ls('cm_ws_token')){ document.getElementById('gate').style.display='block'; return; }
  document.getElementById('app').style.display='grid';
  // Сэдэв бичиж дуусахад (focus алдахад) зорилго ба хичээлийн явц хоосон бол автоматаар бөглөнө
  document.getElementById('f_title').addEventListener('blur',function(){ genObjectives(true); genFlow(true); });
  loadPlans(); newPlan();
}
function loadPlans(){
  api('lp_list',{}).then(function(d){
    var el=document.getElementById('planList');
    if(!d||!d.ok){el.innerHTML='<div style="color:#ef4444;font-size:.82rem;padding:6px">'+((d&&d.error)||'Алдаа')+'</div>';return;}
    var ps=d.plans||[];
    if(!ps.length){el.innerHTML='<div style="color:var(--soft);font-size:.82rem;padding:6px">Одоогоор алга. “Шинэ төлөвлөгөө” дарж эхэл.</div>';return;}
    el.innerHTML=ps.map(function(p){
      return '<div class="plan-item'+(String(p.id)===String(curId)?' on':'')+'" onclick="openPlan(\''+p.id+'\')"><div style="flex:1;min-width:0"><div class="t">'+esc(p.title)+'</div><div class="m">'+esc(p.grade||'')+(p.ws_count?(' · '+p.ws_count+' дасгал'):'')+'</div></div></div>';
    }).join('');
  });
}
function setMsg(t,ok){var m=document.getElementById('msg');m.textContent=t;m.style.color=ok?'#16a34a':'#ef4444';setTimeout(function(){if(m.textContent===t)m.textContent='';},3000);}
function newPlan(){
  curId=null; curWs=[];
  ['f_title','f_date','f_dur','f_obj','f_flow','f_hw'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f_grade').value='';
  renderWs(); loadPlans();
}
function openPlan(id){
  api('lp_get',{id:id}).then(function(d){
    if(!d||!d.ok){setMsg((d&&d.error)||'Олдсонгүй',false);return;}
    var p=d.plan; curId=p.id;
    document.getElementById('f_title').value=p.title||'';
    document.getElementById('f_grade').value=p.grade||'';
    document.getElementById('f_date').value=p.ldate||'';
    document.getElementById('f_dur').value=p.duration||'';
    document.getElementById('f_obj').value=p.objectives||'';
    document.getElementById('f_flow').value=p.flow||'';
    document.getElementById('f_hw').value=p.homework||'';
    curWs=Array.isArray(p.worksheets)?p.worksheets:[];
    renderWs(); loadPlans();
  });
}
function gather(){
  return {id:curId||undefined,
    title:document.getElementById('f_title').value.trim(),
    grade:document.getElementById('f_grade').value,
    ldate:document.getElementById('f_date').value,
    duration:document.getElementById('f_dur').value.trim(),
    objectives:document.getElementById('f_obj').value,
    flow:document.getElementById('f_flow').value,
    homework:document.getElementById('f_hw').value,
    worksheets:curWs};
}
function savePlan(){
  var body=gather();
  if(!body.title){setMsg('Сэдэв оруулна уу',false);return;}
  api('lp_save',body).then(function(d){
    if(!d||!d.ok){setMsg((d&&d.error)||'Алдаа',false);return;}
    curId=d.id; setMsg('✓ Хадгаллаа',true); loadPlans();
  });
}
function delPlan(){
  if(!curId){newPlan();return;}
  if(!confirm('Энэ төлөвлөгөөг устгах уу?'))return;
  api('lp_delete',{id:curId}).then(function(){ newPlan(); });
}
function renderWs(){
  var el=document.getElementById('wsList');
  if(!curWs.length){el.innerHTML='<div style="color:var(--soft);font-size:.82rem;padding:2px 2px 8px">Дасгал хавсрагаагүй байна.</div>';return;}
  el.innerHTML=curWs.map(function(w,i){
    return '<div class="wsrow"><a class="wt" href="/'+esc(w.slug)+'" target="_blank" title="Нээх">'+esc(w.title)+'</a>'
      +'<select onchange="curWs['+i+'].role=this.value"><option value="practice"'+(w.role!=='homework'?' selected':'')+'>Бататгал</option><option value="homework"'+(w.role==='homework'?' selected':'')+'>Гэрийн даалгавар</option></select>'
      +'<a class="ico-btn" href="/'+esc(w.slug)+'" target="_blank" title="Нээх"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>'
      +'<button class="ico-btn del" onclick="curWs.splice('+i+',1);renderWs()" title="Хасах"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>';
  }).join('');
}
function openPicker(){document.getElementById('picker').classList.add('on');document.getElementById('pkSearch').value='';renderPicker();setTimeout(function(){document.getElementById('pkSearch').focus();},50);}
function closePicker(){document.getElementById('picker').classList.remove('on');hidePkPreview();}
// ── Дасгал дээр hover хийхэд preview ──
function showPkPreview(slug,itemEl){
  var pv=document.getElementById('pkPreview'),fr=document.getElementById('pkPrevFrame');
  if(pv._slug!==slug){ pv._slug=slug; fr.src='/'+slug; }
  var modal=document.querySelector('#picker .picker').getBoundingClientRect();
  var ir=itemEl.getBoundingClientRect(),w=300,h=412,gap=12;
  var left=modal.right+gap; if(left+w>window.innerWidth-8) left=modal.left-gap-w; if(left<8)left=8;
  var top=Math.min(Math.max(ir.top-40,8),window.innerHeight-h-8);
  pv.style.left=left+'px'; pv.style.top=top+'px'; pv.style.display='block';
}
function hidePkPreview(){var pv=document.getElementById('pkPreview');if(pv)pv.style.display='none';}
(function(){
  var pb=document.getElementById('pkBody'); if(!pb)return;
  pb.addEventListener('mouseover',function(e){var it=e.target.closest&&e.target.closest('.pk-item');if(it)showPkPreview(it.getAttribute('data-slug'),it);});
  pb.addEventListener('mouseleave',hidePkPreview);
})();
function renderPicker(){
  var q=(document.getElementById('pkSearch').value||'').toLowerCase().trim();
  var gsel=(document.getElementById('pkGrade')||{}).value||'';
  var body=document.getElementById('pkBody');
  var byGrade={},order=[];
  FLAT.forEach(function(w){
    if(gsel && w.grade!==gsel)return;
    if(q && (w.title.toLowerCase().indexOf(q)<0 && w.slug.toLowerCase().indexOf(q)<0 && (w.grade||'').toLowerCase().indexOf(q)<0))return;
    if(!byGrade[w.grade]){byGrade[w.grade]=[];order.push(w.grade);}
    byGrade[w.grade].push(w);
  });
  if(!order.length){body.innerHTML='<div style="color:var(--soft);padding:14px;text-align:center">Олдсонгүй</div>';return;}
  var h='';
  order.forEach(function(g){
    h+='<div class="pk-grp">'+esc(g)+'</div>';
    byGrade[g].forEach(function(w){
      h+='<div class="pk-item" data-slug="'+esc(w.slug)+'" onclick="addWs(\''+esc(w.slug)+'\',\''+esc(w.title).replace(/'/g,"\\'")+'\')">'+esc(w.title)+'</div>';
    });
  });
  body.innerHTML=h;
}
function addWs(slug,title){
  if(curWs.some(function(w){return w.slug===slug;})){setMsg('Аль хэдийн нэмэгдсэн',false);return;}
  var first=(curWs.length===0);
  curWs.push({slug:slug,title:title,role:'practice'});
  // Эхний дасгал нэмэхэд төлөвлөгөөний талбарууд хоосон бол тухайн хуудасны мэдээллээр автоматаар бөглөнө
  var meta=FLAT.filter(function(w){return w.slug===slug;})[0];
  var fTitle=document.getElementById('f_title'), fGrade=document.getElementById('f_grade'),
      fObj=document.getElementById('f_obj'), fFlow=document.getElementById('f_flow');
  var fDate=document.getElementById('f_date');
  if(!fTitle.value.trim() && title) fTitle.value=title;
  if(!fGrade.value && meta && meta.grade){ for(var i=0;i<fGrade.options.length;i++){ if(fGrade.options[i].value===meta.grade){ fGrade.value=meta.grade; break; } } }
  if(!fDate.value){ var d=new Date(); fDate.value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  if(!fObj.value.trim()){ var o=(window.WS_OBJECTIVES||{})[slug]; fObj.value = o || localObjectives(fTitle.value.trim()||title); }
  if(!fFlow.value.trim()) fFlow.value=localFlow(fTitle.value.trim()||title);
  renderWs(); closePicker();
}
function printPlan(){
  var b=gather();
  var doc='<h1>Ээлжит хичээлийн төлөвлөгөө</h1><div class="pd-sub">CyberMath · cyber-math.com</div>';
  doc+='<table>'
    +'<tr><td class="k">Хичээлийн сэдэв</td><td>'+esc(b.title)+'</td></tr>'
    +'<tr><td class="k">Анги</td><td>'+esc(b.grade)+'</td></tr>'
    +'<tr><td class="k">Огноо</td><td>'+esc(b.ldate)+'</td></tr>'
    +'<tr><td class="k">Хугацаа</td><td>'+esc(b.duration||'40 мин')+'</td></tr>'
    +'</table>';
  function sec(t,v){return '<div class="pd-sec">'+t+'</div><div class="pd-box">'+esc(v)+'</div>';}
  doc+=sec('Зорилго / зорилт', b.objectives);
  doc+=sec('Хичээлийн явц', b.flow);
  if(curWs.length){
    var prac=curWs.filter(function(w){return w.role!=='homework';}), hw=curWs.filter(function(w){return w.role==='homework';});
    doc+='<div class="pd-sec">Ажлын хуудас</div><div class="pd-box">';
    if(prac.length){doc+='<b>Бататгал:</b><ul>'+prac.map(function(w){return '<li>'+esc(w.title)+' — cyber-math.com/'+esc(w.slug)+'</li>';}).join('')+'</ul>';}
    if(hw.length){doc+='<b>Гэрийн даалгавар:</b><ul>'+hw.map(function(w){return '<li>'+esc(w.title)+' — cyber-math.com/'+esc(w.slug)+'</li>';}).join('')+'</ul>';}
    doc+='</div>';
  }
  doc+=sec('Гэрийн даалгавар', b.homework);
  document.getElementById('planDoc').innerHTML=doc;
  // Хавсаргасан ажлын хуудсуудыг хэвлэлд оруулна (тус бүр 1+ хуудас)
  var slugs=curWs.map(function(w){return w.slug;});
  if(!slugs.length){ window.print(); return; }
  var pbtn=document.querySelector('.btn.print');
  if(pbtn){pbtn.disabled=true;} setMsg('Ажлын хуудсуудыг бэлдэж байна…',true);
  appendWorksheetPages(slugs,0,function(){ if(pbtn)pbtn.disabled=false; setMsg('',true); window.print(); });
}
function stripGlobalCss(css){ return String(css||'').replace(/@page[^{]*\{[^}]*\}/g,'').replace(/\bbody\s*\{[^}]*\}/g,''); }
function appendWorksheetPages(slugs,i,done){
  if(i>=slugs.length){ done(); return; }
  var ifr=document.createElement('iframe');
  ifr.style.cssText='position:fixed;left:-99999px;top:0;width:820px;height:1200px;border:0';
  ifr.src='/'+slugs[i];
  var finished=false;
  function grab(){
    if(finished)return; finished=true;
    try{
      var d=ifr.contentDocument, sheet=d&&d.getElementById('sheet');
      if(sheet){
        var css=''; [].forEach.call(d.querySelectorAll('style'),function(s){css+=stripGlobalCss(s.textContent);});
        var page=document.createElement('div'); page.className='cm-ws-page';
        page.innerHTML='<style>'+css+'</style>'+sheet.outerHTML;
        document.getElementById('planDoc').appendChild(page);
      }
    }catch(e){}
    try{ifr.remove();}catch(e){}
    appendWorksheetPages(slugs,i+1,done);
  }
  ifr.onload=function(){ setTimeout(grab,1200); };   // build() + KaTeX render хүлээнэ
  setTimeout(grab,6000);                              // fallback (ачаалагдаагүй бол алгасна)
  document.body.appendChild(ifr);
}
init();
</script>
