<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />

<title>Эгшгийн зохицол-2 (3-р анги)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">

<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:7px;margin-bottom:7px}
  .head h1{font-size:16px;color:#5a32d6;font-weight:800}.head .sub{font-size:11px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:8px 2px 10px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 26px 2px 4px}
  .rule{font-size:11px;color:var(--soft);background:transparent;border-left:3px solid #d9cff5;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .rule b{color:#5a32d6}
  .task{font-weight:800;color:#5a32d6;font-size:14px;margin:11px 0 8px;border-left:4px solid var(--purple2);padding-left:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:7px;align-items:baseline}.ql{font-weight:800;color:var(--purple);font-size:15px;min-width:22px}.qm{font-size:15px;line-height:1.75}
  .fig{text-align:center;margin:4px 0}
  .wk{border:1px solid #d9cff5;border-radius:4px;background-color:#fff;
    background-image:repeating-linear-gradient(to bottom,transparent,transparent calc(8mm - 1px),#cfc4ee calc(8mm - 1px),#cfc4ee 8mm);
    height:12mm;margin-top:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .ans-grid{display:grid;grid-template-columns:1fr;gap:9px;font-size:13.5px}.ans-grid .a{padding-bottom:8px;border-bottom:1px dotted #e6e0f5}.ans-grid .an{color:var(--purple);font-weight:800;margin-right:5px}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:11mm}.ans-page{break-before:page}}
</style>
</head>

</div>

<script>
// ══════════ Монгол хэл 3-р анги — нийтлэг туслахууд ══════════
// Математикийн g5core.js-ийн санамсаргүй сонголтын хэсгийг дахин ашиглаж,
// монгол хэлний эгшиг/үений үйлдлүүдийг нэмэв. Математикийн функц энд ОРООГҮЙ.

function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a) { return a[rnd(0, a.length - 1)]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(0, i), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
// Давхцалгүйгээр k ширхэг сонгоно
function take(a, k) { return shuffle(a).slice(0, k); }
function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function B(s) { return '<b>' + esc(s) + '</b>'; }
// Хоосон зай (сурагч бөглөх) — доогуур зураас
function gap(n) { return '<span style="display:inline-block;min-width:' + (n || 46) + 'px;border-bottom:1.6px solid #7b6ea8;margin:0 3px;"></span>'; }
// Сонголтын хувилбарууд: (ам / эм)
function opts(arr) { return '<span style="color:#6d5bb5;font-weight:700;">(' + arr.map(esc).join(' / ') + ')</span>'; }

// ── Эгшиг ──
var MN_ER = 'аоу';          // эр эгшиг
var MN_EM = 'эөү';          // эм эгшиг
var MN_NEU = 'и';           // саармаг эгшиг
var MN_VOW = 'аоуэөүи';     // энгийн эгшиг (богино)
// Үгэнд орсон эгшгүүдийг дарааллаар нь (я,е,ё,ю-г задлахгүй — корпуст оруулаагүй)
function mnVowels(w) { var out = []; for (var i = 0; i < w.length; i++) if (MN_VOW.indexOf(w[i]) >= 0) out.push(w[i]); return out; }
// Үгийн эгшгийн ангилал: 'эр' | 'эм' | 'саармаг' (зөвхөн и-тэй)
function mnClass(w) {
  var v = mnVowels(w), er = 0, em = 0;
  v.forEach(function (c) { if (MN_ER.indexOf(c) >= 0) er++; else if (MN_EM.indexOf(c) >= 0) em++; });
  if (er && em) return 'холимог';          // зохицол зөрчсөн — зөвхөн зориуд буруу бичсэн үгэнд гарна
  if (er) return 'эр';
  if (em) return 'эм';
  return 'саармаг';
}
// Үгийн эхний хүчтэй (саармаг бус) эгшиг — залгаврын хэлбэрийг тодорхойлоход
function mnFirstStrong(w) { var v = mnVowels(w); for (var i = 0; i < v.length; i++) if (v[i] !== MN_NEU) return v[i]; return null; }

// ── Үе ──
// Корпуст үеийг «сур-гууль» хэлбэрээр хадгална. Эндээс үеийн жагсаалт, тоог гаргана.
function mnSyl(split) { return split.split('-'); }
function mnSylCount(split) { return mnSyl(split).length; }
// Мөр шилжүүлэхэд зөвшөөрөгдөх таслалтын байрлалууд.
// Дүрэм: нэг үсгийг дангаар нь мөрөнд үлдээхгүй, дангаар нь шилжүүлэхгүй.
// (ь, ъ, й нь корпуст өмнөх үетэйгээ хамт бичигдсэн тул тусад нь шалгах шаардлагагүй.)
function mnBreaks(split) {
  var s = mnSyl(split), out = [];
  for (var k = 1; k < s.length; k++) {
    var left = s.slice(0, k).join(''), right = s.slice(k).join('');
    if (left.length >= 2 && right.length >= 2) out.push({ k: k, left: left, right: right });
  }
  return out;
}
function mnCanBreak(split) { return mnBreaks(split).length > 0; }
// «сур-гууль» → «сургууль»
function mnPlain(split) { return split.split('-').join(''); }
// ══════════ Монгол хэл 3-р анги — ҮГИЙН САН (корпус) ══════════
// ЧУХАЛ: Бүх хариу ЭНЭ ФАЙЛААС гарна. Генератор нь дүрмийг өөрөө «бодохгүй»,
// зөвхөн эндээс сонгож эвлүүлнэ. Иймд алдаа гарвал энэ файлын нэг мөрийг засахад л хангалттай.
// Хэлний багш энэ файлыг ганцаараа уншаад бүх агуулгыг шалгаж болно.

// ─────────── 1. ГАРАХ ТИЙН ЯЛГАЛ (-аас / -оос / -ээс / -өөс) ───────────
// Эгшиг зохицлын сурах бичгийн сонгодог жишээ. Гээгдэх эгшигтэй (цэцэг→цэцгээс),
// -н, -ь, -й-ээр төгссөн тогтворгүй үг ЗОРИУД ОРУУЛААГҮЙ.
var MN_ABL = [
  // эр (а, у) → -аас
  ['гар', 'гараас'], ['зам', 'замаас'], ['мал', 'малаас'], ['тал', 'талаас'], ['цаг', 'цагаас'],
  ['нар', 'нараас'], ['ам', 'амаас'], ['уул', 'уулаас'], ['гал', 'галаас'], ['шар', 'шараас'],
  ['хар', 'хараас'], ['багш', 'багшаас'], ['сар', 'сараас'], ['аав', 'ааваас'], ['ах', 'ахаас'],
  // эр (о) → -оос
  ['ном', 'номоос'], ['мод', 'модоос'], ['хот', 'хотоос'], ['бор', 'бороос'], ['том', 'томоос'],
  ['тор', 'тороос'], ['гол', 'голоос'], ['ор', 'ороос'], ['тос', 'тосоос'], ['хог', 'хогоос'],
  // эм (э, ү) → -ээс
  ['гэр', 'гэрээс'], ['нэр', 'нэрээс'], ['эм', 'эмээс'], ['хүн', 'хүнээс'], ['эгч', 'эгчээс'],
  ['ээж', 'ээжээс'], ['эх', 'эхээс'], ['хэл', 'хэлээс'], ['үүл', 'үүлээс'], ['сүх', 'сүхээс'],
  ['дэлгүүр', 'дэлгүүрээс'], ['түлхүүр', 'түлхүүрээс'], ['жил', 'жилээс'], ['хивс', 'хивсээс'],
  // эм (ө) → -өөс
  ['хөл', 'хөлөөс'], ['мөр', 'мөрөөс'], ['төр', 'төрөөс'], ['хөх', 'хөхөөс'], ['бөмбөг', 'бөмбөгөөс'],
  ['хөрш', 'хөршөөс'], ['өр', 'өрөөс'], ['төв', 'төвөөс'], ['өвс', 'өвсөөс'],
];

// ─────────── 2. ЭР / ЭМ ангилах үгс ───────────
// (я, е, ё, ю-гүй, нэг ангилалтай тодорхой үгс)
var MN_ER_WORDS = ['гар', 'ном', 'уул', 'мод', 'хот', 'нар', 'цаг', 'зам', 'мал', 'багш', 'сар',
  'аав', 'ах', 'ус', 'гал', 'шар', 'бор', 'сандал', 'харандаа', 'монгол', 'малчин', 'сургууль',
  'улаан', 'ургамал', 'адуу', 'сурагч', 'зурагт', 'морь', 'хонь', 'ам',
  'ажилчин', 'сургалт', 'талбай', 'багана', 'халуун', 'ногоон', 'уншлага'];
var MN_EM_WORDS = ['гэр', 'нэр', 'эм', 'хүн', 'эгч', 'ээж', 'эх', 'хэл', 'үүл', 'сүх', 'хөл',
  'мөр', 'төр', 'хөх', 'бөмбөг', 'хөрш', 'өр', 'төв', 'өвс', 'үс', 'дэвтэр', 'эрдэм', 'тэнгэр',
  'цэцэг', 'хөдөө', 'ширээ', 'тэмээ', 'үхэр', 'дэлгүүр', 'гэрэл',
  'хичээл', 'хөгжим', 'эрүүл', 'төмөр', 'өндөр', 'хүүхэд', 'дүрэм', 'тэмдэг'];

// ─────────── 3. УТГА ЯЛГАХ ЭР / ЭМ ЭГШИГ (хос үг) ───────────
// [эр үг, утга, эр үгийн өгүүлбэр, эм үг, утга, эм үгийн өгүүлбэр]
// Өгүүлбэр дэх ___ байранд зөвхөн НЭГ нь тохирохоор бичив.
var MN_PAIRS = [
  ['ам', 'хоол иддэг эрхтэн', 'Хүний ___ хоол идэхэд хэрэгтэй',
    'эм', 'өвчин эмчилдэг зүйл', 'Өвчтэй хүн ___ уудаг'],
  ['ах', 'өөрөөс ах хүү', 'Манай ___ арван настай',
    'эх', 'ээж', '___ хүүхдээ энхрийлэн асардаг'],
  ['ус', 'уудаг шингэн', 'Цэвэр ___ уугаарай',
    'үс', 'толгой дээрх', 'Түүний ___ урт хар байна'],
  ['уул', 'өндөр газар', 'Өндөр ___ цаснаа бүрхэв',
    'үүл', 'тэнгэрт хөвдөг', 'Тэнгэрт цагаан ___ хөвнө'],
  ['нар', 'тэнгэрт гэрэлтдэг', 'Өглөө ___ мандана',
    'нэр', 'хүнийг дууддаг үг', 'Таны ___ хэн бэ'],
  ['цаг', 'хугацаа', 'Одоо хэдэн ___ болж байна',
    'цэг', 'жижиг дугуй тэмдэг', 'Өгүүлбэрийн төгсгөлд ___ тавина'],
  ['хол', 'ойрын эсрэг', 'Манай сургууль гэрээс ___ байна',
    'хөл', 'алхдаг эрхтэн', 'Гутлыг ___ дээр өмсдөг'],
  ['тор', 'нүх сүвтэй нэхээс', 'Цонхонд шумуулын ___ хийв',
    'төр', 'улсын засаглал', 'Улсын ___ ард түмнээ хамгаална'],
  ['ор', 'унтдаг тавилга', 'Унтахдаа ___ дээрээ хэвтэнэ',
    'өр', 'төлөх ёстой мөнгө', 'Зээлсэн мөнгөө ___ гэнэ'],
  ['гар', 'барьдаг эрхтэн', 'Хүний ___ таван хуруутай',
    'гэр', 'монголчуудын орон сууц', 'Монгол ___ дугуй хэлбэртэй'],
  ['бал', 'бичдэг хэрэгсэл', 'Зурахдаа ___ хэрэглэнэ',
    'бэл', 'уулын доод хэсэг', 'Уулын ___ ногоорчээ'],
  ['бар', 'судалтай том араатан', 'Ойд ___ амьдардаг',
    'бэр', 'хүүгийн эхнэр', 'Ахын эхнэрийг ___ гэнэ'],
  ['хан', 'эртний хаан, ноён', 'Эртний ___ улсаа тэтгэдэг байв',
    'хэн', 'хүнийг асуух үг', '___ хамгийн түрүүнд ирэв'],
  ['од', 'шөнийн тэнгэрт гялалздаг', 'Шөнийн тэнгэрт ___ гялалзана',
    'өд', 'шувууны зөөлөн бүрхүүл', 'Шувууны ___ зөөлөн байдаг'],
  ['хун', 'цагаан өнгийн том шувуу', 'Нуурын дээгүүр цагаан ___ нислээ',
    'хүн', 'хүн төрөлхтөн', 'Манай ангид хорин ___ байна'],
  ['сум', 'нумаар харвадаг зүйл', 'Нум ___ хоёрыг хамт хэрэглэнэ',
    'сүм', 'шашны барилга', 'Хуучин ___ хотын төвд байдаг'],
  ['дуу', 'дуулдаг аялгуу', 'Багш бидэнд шинэ ___ заав',
    'дүү', 'өөрөөс бага ах эгч', 'Манай ___ бага ангид сурдаг'],
  ['нуур', 'том устай газар', 'Хөвсгөл бол тунгалаг ___',
    'нүүр', 'толгойн урд тал', 'Хүний ___ дээр нүд, хамар байна'],
];

// ─────────── 4. ҮЕИЙН ХУВААЛТ ───────────
// [үг, үеийн задаргаа]. Нэг үетэй үгийг задаргаагүйгээр бичив.
// ь, ъ, й нь өмнөх үетэйгээ ХАМТ (морь, амь-тан, ан-гийн).
var MN_SYL_WORDS = [
  // 1 үе — таслах, шилжүүлэх боломжгүй
  ['ном', 'ном'], ['багш', 'багш'], ['цонх', 'цонх'], ['ээж', 'ээж'], ['аав', 'аав'],
  ['эгч', 'эгч'], ['найз', 'найз'], ['морь', 'морь'], ['хонь', 'хонь'], ['гүйх', 'гүйх'],
  // 2 үе — эхний үе нэг үсэгтэй тул МӨР ШИЛЖҮҮЛЖ БОЛОХГҮЙ
  ['ажил', 'а-жил'], ['улаан', 'у-лаан'], ['үхэр', 'ү-хэр'], ['адуу', 'а-дуу'],
  ['ямаа', 'я-маа'], ['усан', 'у-сан'], ['инээх', 'и-нээх'], ['ярих', 'я-рих'],
  // 2 үе — шилжүүлж болно
  ['сургууль', 'сур-гууль'], ['монгол', 'мон-гол'], ['эрдэм', 'эр-дэм'], ['сурагч', 'су-рагч'],
  ['хичээл', 'хи-чээл'], ['дэвтэр', 'дэв-тэр'], ['малчин', 'мал-чин'], ['байшин', 'бай-шин'],
  ['сандал', 'сан-дал'], ['тэнгэр', 'тэн-гэр'], ['амьтан', 'амь-тан'], ['цэцэг', 'цэ-цэг'],
  ['хөдөө', 'хө-дөө'], ['ширээ', 'ши-рээ'], ['гэрэл', 'гэ-рэл'], ['модон', 'мо-дон'],
  ['сургалт', 'сур-галт'], ['зурагт', 'зу-рагт'], ['номын', 'но-мын'], ['ангийн', 'ан-гийн'],
  ['бичиг', 'би-чиг'], ['тэмээ', 'тэ-мээ'], ['сонсох', 'сон-сох'], ['унших', 'ун-ших'],
  ['бичих', 'би-чих'], ['сурах', 'су-рах'], ['дуулах', 'дуу-лах'], ['ойлгох', 'ойл-гох'],
  // 3 үе
  ['харандаа', 'ха-ран-даа'], ['тэмдэглэл', 'тэм-дэг-лэл'], ['ургамал', 'ур-га-мал'],
  ['хэрэгсэл', 'хэ-рэг-сэл'], ['сурагчид', 'су-раг-чид'], ['хичээлүүд', 'хи-чээ-лүүд'],
  ['ургамлууд', 'ур-гам-лууд'], ['эрдэмтэн', 'эр-дэм-тэн'], ['багачууд', 'ба-га-чууд'],
  ['халуухан', 'ха-луу-хан'], ['ногоохон', 'но-гоо-хон'], ['улаахан', 'у-лаа-хан'],
  ['өвөлжөө', 'ө-вөл-жөө'], ['аяархан', 'а-яар-хан'],
];

// ─────────── 5. ЦЭГ ТАСЛАЛ ───────────
// Төгсгөлийн тэмдэг: өгүүлбэрийг тэмдэггүйгээр хадгалав.
var MN_SENT_DOT = [

// Анхаарлын тэмдэг — аялга үг (Хөөх, Ай, Өө, Аан) эсвэл ерөөл тул эргэлзээгүй

// ─────────── 6. ТООЧСОН ГИШҮҮД (таслал) ───────────
// Хэсгүүдийн хооронд таслал тавина; сүүлийн хэсэг нь өгүүлбэрийг дуусгана.
var MN_ENUM = [
  ['Ангид ном', 'дэвтэр', 'харандаа байна'],
  ['Хавар', 'зун', 'намар', 'өвөл гэсэн дөрвөн улирал бий'],

// ══════════ Монгол хэл 3-р анги — I бүлэг: эгшиг, үе, цэг таслал ══════════
// Бүх хариу mn3data.js-ийн корпусаас гарна. Генератор дүрмийг «бодохгүй».

// Нэг хуудсан дээр нэг үг давтагдахгүйн тулд key-г үгээр нь өгнө.
function h_mn_try(n, fn) { for (var i = 0; i < 80; i++) { var r = fn(); if (r) return r; } return null; }

// ─────────────── 1.1 Эгшиг зохицол ───────────────

// Үгийг эр / эм гэж ангилах
function g_mn_class() {
  var er = rnd(0, 1);
  var w = pick(er ? MN_ER_WORDS : MN_EM_WORDS);
  return {
    q: B(w) + ' — ' + gap(72),
    a: B(w) + ' — ' + (er ? 'эр' : 'эм'),
    key: 'mnv:' + w, noWk: true,
  };
}

// Үгийн эгшгүүдийг ялгаж бичээд ангиллыг нь тэмдэглэх
function g_mn_vowels() {
  var er = rnd(0, 1);
  var w = pick(er ? MN_ER_WORDS : MN_EM_WORDS);
  var v = mnVowels(w);
  if (v.length < 2) return null;
  return {
    q: B(w) + ' — ' + gap(110),
    a: B(w) + ' — ' + v.join(', ') + ' (' + (er ? 'эр' : 'эм') + ')',
    key: 'mnv:' + w, noWk: true,
  };
}

// Эгшгийн зохицол зөрчсөн (буруу бичсэн) үгийг олох.
// Буруу үгийг ҮНЭН үгийн нэг эгшгийг эсрэг ангиллын эгшгээр сольж үүсгэнэ →
// эр, эм эгшиг зэрэг орсон тул монгол үг байх БОЛОМЖГҮЙ.
var MN_FLIP = { 'а': 'э', 'о': 'ө', 'у': 'ү', 'э': 'а', 'ө': 'о', 'ү': 'у' };
function g_mn_odd() {
  return h_mn_try(0, function () {
    var er = rnd(0, 1);
    var pool = (er ? MN_ER_WORDS : MN_EM_WORDS).filter(function (w) { return mnVowels(w).length >= 2 && w.length >= 5; });
    if (pool.length < 4) return null;
    var four = take(pool, 4), bad = four[0], rest = four.slice(1);
    // Эгшгийн БҮЛГИЙГ (аа, ээ, оо…) бүтнээр нь эсрэгээр солино — ингэснээр
    // «хичаэл» гэх мэт хиймэл биш, «хичаал» гэх бодит алдаа шиг харагдана.
    var runs = [], i = 0;
    while (i < bad.length) {
      if (MN_FLIP[bad[i]]) { var j = i; while (j + 1 < bad.length && bad[j + 1] === bad[i]) j++; runs.push([i, j]); i = j + 1; }
      else i++;
    }
    if (!runs.length) return null;
    var r = pick(runs), rep = '';
    for (var k = r[0]; k <= r[1]; k++) rep += MN_FLIP[bad[k]];
    var wrong = bad.slice(0, r[0]) + rep + bad.slice(r[1] + 1);
    if (mnClass(wrong) !== 'холимог') return null;          // хольцгүй бол дасгал утгагүй
    var shown = shuffle(rest.concat([wrong]));
    return {
      q: shown.map(function (x) { return esc(x); }).join(' · '),
      a: B(wrong) + ' → зөв нь ' + B(bad),
      key: 'mno:' + bad, noWk: true,
    };
  });
}

// Гарах тийн ялгалын нөхцөл (-аас / -оос / -ээс / -өөс) залгах
function g_mn_abl() {
  var e = pick(MN_ABL);
  return {
    q: B(e[0]) + ' ' + opts(['-аас', '-оос', '-ээс', '-өөс']) + ' → ' + gap(96),
    a: B(e[1]),
    key: 'mnv:' + e[0],
  };
}

// ─────────────── 1.2 Утга ялгах эр, эм эгшиг ───────────────

// Өгүүлбэрт тохирох үгийг сонгох
function g_mn_pairPick() {
  var p = pick(MN_PAIRS), first = rnd(0, 1);
  var w = first ? p[0] : p[3], sent = first ? p[2] : p[5];
  var ch = shuffle([p[0], p[3]]);
  return {
    q: esc(sent).replace('___', gap(64)) + '. ' + opts(ch),
    a: esc(sent.replace('___', w)) + '.',
    key: 'mnp:' + w,
  };
}

// Үгийн утгыг таних
function g_mn_pairMean() {
  var p = pick(MN_PAIRS), first = rnd(0, 1);
  var w = first ? p[0] : p[3], m = first ? p[1] : p[4];
  return {
    q: esc(m) + ' — ' + gap(72),
    a: esc(m) + ' — ' + B(w),
    key: 'mnp:' + w, noWk: true,
  };
}

// Эгшгийг эсрэгээр нь сольж утга өөрчлөх
function g_mn_pairFlip() {
  var p = pick(MN_PAIRS), first = rnd(0, 1);
  var from = first ? p[0] : p[3], to = first ? p[3] : p[0], mean = first ? p[4] : p[1];
  return {
    q: B(from) + ' → ' + gap(64) + ' <span style="color:#6d5bb5;">(' + esc(mean) + ')</span>',
    a: B(from) + ' → ' + B(to),
    key: 'mnp:' + to, noWk: true,
  };
}

// ─────────────── 2. Үений хуваалт, мөр шилжүүлэг ───────────────

// Үгийг үеэр нь хуваах
function g_mn_sylSplit() {
  var e = pick(MN_SYL_WORDS);
  if (mnSylCount(e[1]) !== 2) return null;
  return { q: B(e[0]) + ' → ' + gap(110), a: B(e[1]), key: 'mnw:' + e[0] };
}

// Гурван үетэй урт үгийг үеэр нь хуваах (хүнд түвшин)
function g_mn_syl3() {
  return h_mn_try(0, function () {
    var pool = MN_SYL_WORDS.filter(function (e) { return mnSylCount(e[1]) >= 3; });
    if (!pool.length) return null;
    var e = pick(pool);
    return {
      q: B(e[0]) + ' → ' + gap(130),
      a: B(e[1]) + ' — ' + mnSylCount(e[1]) + ' үе',
      key: 'mnw:' + e[0],
    };
  });
}

// Хэдэн үетэй вэ
function g_mn_sylCount() {
  var e = pick(MN_SYL_WORDS);
  if (mnSylCount(e[1]) > 2) return null;
  return {
    q: B(e[0]) + ' — ' + gap(48) + ' үе',
    a: B(e[0]) + ' — ' + mnSylCount(e[1]) + ' үе (' + esc(e[1]) + ')',
    key: 'mnw:' + e[0], noWk: true,
  };
}

// Мөр шилжүүлэхэд хаана таслахыг олох
function g_mn_wrap() {
  var e = pick(MN_SYL_WORDS), br = mnBreaks(e[1]);
  var a = br.length
    ? br.map(function (b) { return esc(b.left) + '-' + esc(b.right); }).join(' , ')
    : 'шилжүүлж болохгүй';
  return { q: B(e[0]) + ' → ' + gap(120), a: B(e[0]) + ' → ' + a, key: 'mnw:' + e[0] };
}

// Мөр шилжүүлж болох эсэх (тийм / үгүй) — шалтгаантай нь
function g_mn_wrapYN() {
  var e = pick(MN_SYL_WORDS), ok = mnCanBreak(e[1]), n = mnSylCount(e[1]);
  var why = ok ? 'тийм' : (n < 2 ? 'үгүй — нэг үетэй' : 'үгүй — нэг үсэг дангаараа үлдэнэ');
  return {
    q: B(e[0]) + ' — ' + gap(64),
    a: B(e[0]) + ' — ' + why,
    key: 'mnw:' + e[0], noWk: true,
  };
}

// Алдаатай шилжүүлгийг олж засах: зөв үеийн зааг БИШ газар таслав
function g_mn_wrapErr() {
  return h_mn_try(0, function () {
    var e = pick(MN_SYL_WORDS), w = e[0], br = mnBreaks(e[1]);
    if (!br.length) return null;
    var good = {}; br.forEach(function (b) { good[b.left.length] = 1; });
    var cand = [];
    for (var i = 2; i <= w.length - 2; i++) if (!good[i]) cand.push(i);
    if (!cand.length) return null;
    var p = pick(cand);
    return {
      q: esc(w.slice(0, p)) + '-' + esc(w.slice(p)) + ' → ' + gap(110),
      a: '<s>' + esc(w.slice(0, p)) + '-' + esc(w.slice(p)) + '</s> → ' + B(br.map(function (b) { return b.left + '-' + b.right; }).join(' , ')),
      key: 'mnw:' + w,
    };
  });
}

// ─────────────── 3. Цэг таслал ───────────────

function h_mn_sent(kind) {
  if (kind === 'q') return { s: pick(MN_SENT_Q), m: '?', t: 'асуух' };
  if (kind === 'x') return { s: pick(MN_SENT_EX), m: '!', t: 'хүсэх' };
  return { s: pick(MN_SENT_DOT), m: '.', t: 'өгүүлэх' };
}

// Төгсгөлийн тэмдэг тавих
function g_mn_endMark() {
  var o = h_mn_sent(pick(['d', 'd', 'q', 'q', 'x']));
  return {
    q: esc(o.s) + ' ' + gap(34),
    a: esc(o.s) + B(o.m),
    key: 'mns:' + o.s, noWk: true,
  };
}

// Өгүүлбэрийн төрөл
function g_mn_sentType() {
  var o = h_mn_sent(pick(['d', 'q', 'x']));
  return {
    q: esc(o.s) + esc(o.m) + ' — ' + gap(80),
    a: esc(o.s) + esc(o.m) + ' — ' + B(o.t),
    key: 'mns:' + o.s, noWk: true,
  };
}

// Тоочсон гишүүдийн хооронд таслал тавих
function g_mn_enum() {
  var e = pick(MN_ENUM);
  return {
    q: esc(e.join(' ')) + ' ' + gap(28),
    a: esc(e.join(', ')) + B('.'),
    key: 'mne:' + e[0],
  };
}

// Том үсэг + төгсгөлийн тэмдэг: жижиг үсгээр, тэмдэггүй бичсэнийг зөв болгох
function g_mn_capDot() {
  var o = h_mn_sent(pick(['d', 'd', 'q', 'x']));
  var low = o.s.charAt(0).toLowerCase() + o.s.slice(1);
  return {
    q: esc(low),
    a: esc(cap1(o.s)) + B(o.m),
    key: 'mns:' + o.s,
  };
}
var WSPEC={"title":"Эгшгийн зохицол-2","sub":"Гарах тийн ялгалын нөхцөл -аас, -оос, -ээс, -өөс · Монгол хэл · 3-р анги","rule":"<b>Санамж:</b> Гарах тийн ялгалын нөхцөл үгийн эгшигтэйгээ зохицоно: а, у-тай үгэнд <b>-аас</b> (гар → гараас), о-той үгэнд <b>-оос</b> (ном → номоос), э, ү-тэй үгэнд <b>-ээс</b> (гэр → гэрээс), ө-тэй үгэнд <b>-өөс</b> (хөл → хөлөөс).","ref":"","tasks":[{"label":"Үг эр, эм аль нь болохыг бичээрэй.","fn":"g_mn_class","cap":6,"cols":3,"wk":null},{"label":"Гарах тийн ялгалын зөв нөхцөлийг залгаарай.","fn":"g_mn_abl","cap":8,"cols":2,"wk":9},{"label":"Эгшгийн зохицол зөрчсөн үгийг олж, зөвөөр нь бичээрэй.","fn":"g_mn_odd","cap":5,"cols":2,"wk":null}]};

function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}
function gen(fn){for(var t=0;t<700;t++){var f=fn();if(f)return f;}return null;}
var LET=['а','б','в','г','д','е','ё','ж','з','и','к','л','м','н','о','ө','п','р','с','т'];
function probeH(sheet){var pr=sheet.cloneNode(true);pr.removeAttribute('id');pr.style.cssText='position:absolute;left:-99999px;top:0;width:210mm;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1';var a=pr.querySelector('#answers,.ans-page');if(a)a.remove();document.body.appendChild(pr);var h=pr.scrollHeight;document.body.removeChild(pr);return h;}
function relabel(sheet){var blocks=sheet.querySelectorAll('.grid'),map={},cnt={};for(var g=0;g<blocks.length;g++){var gr=blocks[g].getAttribute('data-gr')||(g+1);var solo=blocks[g].getAttribute('data-solo')==='1';if(cnt[gr]===undefined)cnt[gr]=0;var qs2=blocks[g].querySelectorAll('.q');for(var i=0;i<qs2.length;i++){var ix=cnt[gr]++;var lt=LET[ix]||('#'+(ix+1));var ql=qs2[i].querySelector('.ql');if(solo&&qs2.length===1){if(ql)ql.textContent='';map[qs2[i].getAttribute('data-k')]=gr+')';}else{if(ql)ql.textContent=lt+')';map[qs2[i].getAttribute('data-k')]=gr+lt+')';}}}
  var as=sheet.querySelectorAll('#answers .a');for(var j=0;j<as.length;j++){var an=as[j].querySelector('.an');if(an)an.textContent=map[as[j].getAttribute('data-k')]||'';}}
function trimToFit(sheet,target){var guard=0,h=probeH(sheet);while(h>target&&guard++<90){var blocks=sheet.querySelectorAll('.grid'),best=-1,bestN=-1;for(var s=blocks.length-1;s>=0;s--){var n=blocks[s].querySelectorAll('.q').length;if(n>bestN&&n>2){bestN=n;best=s;}}if(best<0)break;var qs2=blocks[best].querySelectorAll('.q');var last=qs2[qs2.length-1],k=last.getAttribute('data-k');var ans=sheet.querySelector('#answers .a[data-k="'+k+'"]');if(ans)ans.parentNode.removeChild(ans);last.parentNode.removeChild(last);relabel(sheet);h=probeH(sheet);}}
var TASKS=WSPEC.tasks.map(function(t){return {label:t.label, fn:eval(t.fn), cap:t.cap, cols:t.cols, wk:t.wk, solo:t.solo};});
function genPool(){var P=TASKS.map(function(){return[];});var seen={};TASKS.forEach(function(t,i){var c=0,tr=0,need=t.cap+3;while(c<need&&tr<9000){tr++;var f=gen(t.fn);if(!f||seen[f.key])continue;seen[f.key]=1;P[i].push(f);c++;}});return P;}
function build(){window.__POOL=genPool();layout();}
function layout(){var WK=document.getElementById('sw').checked;var S=window.__POOL||(window.__POOL=genPool());window.__PROB=[];var K=0;
  function block(arr,cap,tk,gno){var use=WK?arr.slice(0,cap):arr;return '<div class="grid" data-gr="'+gno+'"'+(tk&&tk.solo?' data-solo="1"':'')+(tk&&tk.cols?' style="grid-template-columns:repeat('+tk.cols+',1fr)"':'')+'>'+use.map(function(f){var k=K++;window.__PROB.push({f:f,k:k});return '<div class="q" data-k="'+k+'"><div class="qh"><span class="ql"></span><span class="qm">'+f.q+'</span></div>'+(f.fig?'<div class="fig">'+f.fig+'</div>':'')+((WK&&!f.noWk)?'<div class="wk"'+(tk&&tk.wk?' style="height:'+tk.wk+'mm"':'')+'></div>':'')+'</div>';}).join('')+'</div>';}
  function ansAll(){return window.__PROB.map(function(p){return '<div class="a" data-k="'+p.k+'"><span class="an"></span>'+p.f.a+'</div>';}).join('');}
  var html='<div class="head"><h1>'+WSPEC.title+'</h1><div class="sub">'+WSPEC.sub+'</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Анги: </span><span>Огноо: </span></div>'
    +'<div class="rule">'+WSPEC.rule+'</div>'+(WSPEC.ref||'');
  var __g=0,__p=null;TASKS.forEach(function(t,i){if(t.label!==__p||t.solo){__g++;html+='<div class="task">'+__g+'. '+t.label+'</div>';__p=t.solo?null:t.label;}html+=block(S[i],t.cap,t,__g);});
  html+='<div class="ans-page" id="answers"><h2>Хариу ба бодолт</h2><div class="ans-grid">'+ansAll()+'</div></div>';
  document.getElementById('sheet').innerHTML=html;
  window.WS_ITEMS=[];window.WS_TITLE=WSPEC.title;
  relabel(document.getElementById('sheet'));toggleAns();
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  try{if(!WK)trimToFit(document.getElementById('sheet'),1035);}catch(e){}
  try{relabel(document.getElementById('sheet'));}catch(e){}
}
build();
