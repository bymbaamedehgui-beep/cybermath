<script>
/* 7-р анги · V бүлэг. Алгебрын илэрхийлэл, тэгшитгэл (5.1 Илэрхийлэл хялбарлах · 5.2 Натурал илтгэгчтэй зэргийн чанарууд · 5.3 Нэг гишүүнтүүдийг үржүүлэх, хуваах ·
   5.4 Нэг гишүүнтээр үржүүлэх, ерөнхий үржигдэхүүн гаргах · 5.5 Шугаман тэгшитгэл · 5.6 Тэгшитгэл зохиож бодлого бодох) */
function vp(v, e) { return e === 0 ? '' : e === 1 ? v : v + '^{' + e + '}'; }                     // хувьсагчийн зэрэг
function co(c, w) { if (w === '') return '' + c; if (c === 1) return w; if (c === -1) return '-' + w; return c + w; }   // эхний гишүүн
function coS(c, w) { if (w === '') return (c > 0 ? '+' : '') + c; if (c === 1) return '+' + w; if (c === -1) return '-' + w; return (c > 0 ? '+' : '') + c + w; }
function poly(ts) { var s = ''; ts.forEach(function (t) { if (t.c === 0) return; s += s === '' ? co(t.c, t.w) : coS(t.c, t.w); }); return s === '' ? '0' : s; }   // [{c,w}] → TeX
function lin(a, b, v) { return poly([{ c: a, w: v }, { c: b, w: '' }]); }                                  // ax+b
function wrapNeg(s) { return s.charAt(0) === '-' ? '(' + s + ')' : s; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
// Алгебрын сонголт: {t: TeX, f: (x, y) → утга}; зөвтэй утгаараа тэнцүү (өөр хэлбэрээр бичсэн) төөрөгдүүлэгчийг хасна
var PTS = [[2, 3], [3, 5], [-2, 7], [5, -3], [7, 2]];
function AMC(ok, cands) {
  var seen = {}, out = []; seen[ok.t] = 1;
  cands.forEach(function (d) {
    if (!d || seen[d.t]) return;
    var same = PTS.every(function (p) { var u = ok.f(p[0], p[1]); return Math.abs(d.f(p[0], p[1]) - u) < 1e-6 * (1 + Math.abs(u)); });
    if (same) return; seen[d.t] = 1; out.push(C(d.t));
  });
  return makeMC(C(ok.t), out);
}
// Тоон сонголт: [TeX, утга]; утгаараа давхцахыг хасна
function VMC(ok, cands) {
  var seenT = {}, vals = [ok[1]], out = []; seenT[ok[0]] = 1;
  cands.forEach(function (c) {
    if (!c || c[0] == null || !isFinite(c[1])) return;
    if (seenT[c[0]] || vals.some(function (v) { return Math.abs(v - c[1]) < 1e-9; })) return;
    seenT[c[0]] = 1; vals.push(c[1]); out.push(C(c[0]));
  });
  return makeMC(C(ok[0]), out);
}
function NV(v) { return [th(v), v]; }                                        // бүхэл тоо
function QV(n, d) { return d === 0 ? null : [fr(n, d), n / d]; }            // бутархай
function NI(n, d) { return d !== 0 && n % d === 0 && n / d > 0 ? NV(n / d) : null; }   // зөвхөн эерэг бүхэл бол

/* ── I. Тест (10) ── */
var TESTS = [
  // 1. [хялбар] Төсөөтэй гишүүдийг эмхэтгэх (5.1); төөрөгдүүлэгч: тэмдэг андуурах, бүх гишүүнийг нэгтгэх
  function () {
    var v = pick(['x', 'a', 'y', 'm']), a1 = nz(-9, 9), a2 = nz(-9, 9), b1 = nz(-9, 9), b2 = nz(-9, 9), A = a1 + a2, B = b1 + b2;
    if (A === 0) return null;
    function L(p, q) { return { t: lin(p, q, v), f: function (x) { return p * x + q; } }; }
    var items = shuffle([{ c: a1, w: v }, { c: a2, w: v }, { c: b1, w: '' }, { c: b2, w: '' }]);
    return { stem: '$' + poly(items) + '$ илэрхийллийг хялбарчилбал аль нь гарах вэ?',
      mc: AMC(L(A, B), [L(a1 - a2, B), L(A, b1 - b2), L(A, -B), L(-A, B), L(A + B, 0), L(A, B + 1)]) };
  },
  // 2. [хялбар] Зэргийн чанар: a^m·a^n, a^m:a^n, (a^m)^n (5.2); төөрөгдүүлэгч: илтгэгчийг үржүүлэх ↔ нэмэх андуурах
  function () {
    var v = pick(['a', 'x', 'y', 'b', 'c']), t = rnd(1, 3), m, n, ok, st, d;
    if (t === 1) { m = rnd(2, 7); n = rnd(2, 6); st = vp(v, m) + '\\cdot ' + vp(v, n); ok = m + n; d = [m * n, m + n + 1, m - n, n - m, m + n - 1]; }
    else if (t === 2) { n = rnd(2, 5); m = n + rnd(2, 6); st = '\\dfrac{' + vp(v, m) + '}{' + vp(v, n) + '}'; ok = m - n; d = [m % n === 0 ? m / n : m + n, m + n, m * n, m - n + 1]; }
    else { m = rnd(2, 5); n = rnd(2, 4); st = '(' + vp(v, m) + ')^{' + n + '}'; ok = m * n; d = [m + n, Math.pow(m, n) <= 99 ? Math.pow(m, n) : m * n + 1, m * n - 1, m * n + n]; }
    var c = d.filter(function (e) { return e >= 2 && e !== ok; }).map(function (e) { return C(vp(v, e)); });
    c.push(C('2' + vp(v, ok)));
    return { stem: '$' + st + '$ илэрхийллийг зэрэг хэлбэрт бичвэл аль нь вэ?', mc: makeMC(C(vp(v, ok)), c) };
  },
  // 3. [хялбар] ax+b=c тэгшитгэл (5.5); төөрөгдүүлэгч: хуваахаа мартах, тэмдэг андуурах
  function () {
    var a = rnd(2, 9), x = nz(-9, 12), b = nz(-20, 20), c = a * x + b;
    if (Math.abs(c) > 99) return null;
    return { stem: '$' + lin(a, b, 'x') + '=' + c + '$ тэгшитгэлийн шийд аль нь вэ?',
      mc: VMC(NV(x), [NV(c - b), QV(c + b, a), NV(-x), NV(a * (c - b)), NV(x + 1), NV(x - 1)]) };
  },
  // 4. [дунд] Хаалт задалж хялбарчлах A(bx+c)±D(ex+f) (5.1); төөрөгдүүлэгч: хаалтын өмнөх хасах тэмдэг, тоог үржүүлэхээ мартах
  function () {
    var v = pick(['x', 'a', 'y']), A = rnd(2, 7), D = rnd(2, 7), b = rnd(1, 5), e = rnd(1, 5), c = nz(-9, 9), f = nz(-9, 9), s = pick([1, -1]);
    var X = A * b + s * D * e, S = A * c + s * D * f; if (X === 0) return null;
    function L(p, q) { return { t: lin(p, q, v), f: function (x) { return p * x + q; } }; }
    return { stem: '$' + A + '(' + lin(b, c, v) + ')' + (s > 0 ? '+' : '-') + D + '(' + lin(e, f, v) + ')$ илэрхийллийг хялбарчилбал аль нь гарах вэ?',
      mc: AMC(L(X, S), [L(X, A * c - s * D * f), L(X, c + s * f), L(A * b - s * D * e, S), L(X, A * c + s * f), L(X, S + D)]) };
  },
  // 5. [дунд] Зэргийн чанаруудыг хослуулах: (a^m)^n·a^p : a^q эсвэл (k·a^m)^n (5.2)
  function () {
    var v = pick(['a', 'x', 'y', 'b']);
    if (rnd(0, 1)) {
      var m = rnd(2, 4), n = rnd(2, 3), p = rnd(1, 5), q = rnd(2, 6), e = m * n + p - q; if (e < 2) return null;
      var d = [m + n + p - q, m * n * p - q, m * n + p + q, m * n - p - q, e + 1].filter(function (x) { return x >= 1 && x !== e; });
      return { stem: '$\\dfrac{(' + vp(v, m) + ')^{' + n + '}\\cdot ' + vp(v, p) + '}{' + vp(v, q) + '}$ илэрхийллийг хялбарчил.',
        mc: makeMC(C(vp(v, e)), d.map(function (x) { return C(vp(v, x)); })) };
    }
    var k = rnd(2, 5), m2 = rnd(2, 4), n2 = rnd(2, 3), K = Math.pow(k, n2);
    function M(c, ex) { return C(co(c, vp(v, ex))); }
    return { stem: '$(' + k + vp(v, m2) + ')^{' + n2 + '}$ илэрхийллийг хялбарчил.',
      mc: makeMC(M(K, m2 * n2), [M(k * n2, m2 * n2), M(k, m2 * n2), M(K, m2 + n2), M(k * n2, m2 + n2), M(K, m2 * n2 + 1)]) };
  },
  // 6. [дунд] Нэг гишүүнтүүдийг үржүүлэх, хуваах (5.3); төөрөгдүүлэгч: тэмдэг, коэффициентийг нэмэх/хасах, илтгэгчийг үржүүлэх
  function () {
    var P = pick([['a', 'b'], ['x', 'y'], ['m', 'n']]);
    function mono(k, p, q) { return co(k, vp(P[0], p) + vp(P[1], q)); }
    function M(k, p, q) { return { t: mono(k, p, q), f: function (x, y) { return k * Math.pow(x, p) * Math.pow(y, q); } }; }
    if (rnd(0, 1)) {
      var k1 = nz(-6, 6), k2 = nz(-6, 6), p1 = rnd(1, 4), q1 = rnd(1, 3), p2 = rnd(1, 3), q2 = rnd(1, 4);
      if (Math.abs(k1) === 1 || Math.abs(k2) === 1) return null;
      return { stem: '$' + wrapNeg(mono(k1, p1, q1)) + '\\cdot ' + wrapNeg(mono(k2, p2, q2)) + '$ үржвэр аль нь вэ?',
        mc: AMC(M(k1 * k2, p1 + p2, q1 + q2), [M(-k1 * k2, p1 + p2, q1 + q2), M(k1 + k2, p1 + p2, q1 + q2), M(k1 * k2, p1 * p2, q1 * q2), M(k1 * k2, p1 + p2, q1 * q2), M(-k1 * k2, p1 * p2, q1 * q2)]) };
    }
    var g = rnd(2, 6), r = nz(-6, 6), a1 = rnd(3, 7), b1 = rnd(2, 5), a2 = rnd(1, a1 - 1), b2 = rnd(1, b1 - 1);
    if (Math.abs(r) === 1) return null;
    return { stem: '$\\dfrac{' + mono(g * r, a1, b1) + '}{' + mono(g, a2, b2) + '}$ илэрхийллийг хялбарчил.',
      mc: AMC(M(r, a1 - a2, b1 - b2), [M(g * r - g, a1 - a2, b1 - b2), M(r, a1 + a2, b1 + b2), M(-r, a1 - a2, b1 - b2), M(r, a1 - a2, b1), M(g * r * g, a1 - a2, b1 - b2)]) };
  },
  // 7. [дунд] Ерөнхий үржигдэхүүнийг хаалтнаас гаргах (5.4); утгаараа тэнцүү (бүрэн бус задаргаа) сонголтыг AMC хасна
  function () {
    var v = pick(['x', 'a', 'y', 'm']), g = rnd(2, 9), i1 = rnd(1, 7), i2 = nz(-7, 7), e2 = rnd(1, 3), dd = rnd(1, 2), e1 = e2 + dd;
    if (gcd(i1, i2) !== 1 || (i1 === 1 && Math.abs(i2) === 1)) return null;
    function F(G, ge, a, ae, b, be) {   // G·v^ge·(a·v^ae + b·v^be)
      return { t: co(G, vp(v, ge)) + '(' + poly([{ c: a, w: vp(v, ae) }, { c: b, w: vp(v, be) }]) + ')',
        f: function (x) { return G * Math.pow(x, ge) * (a * Math.pow(x, ae) + b * Math.pow(x, be)); } };
    }
    return { stem: '$' + poly([{ c: g * i1, w: vp(v, e1) }, { c: g * i2, w: vp(v, e2) }]) + '$ илэрхийллийн ерөнхий үржигдэхүүнийг хаалтнаас гаргавал аль нь вэ?',
      mc: AMC(F(g, e2, i1, dd, i2, 0), [F(g, e2, i1, dd, -i2, 0), F(g, e1, i1, 0, i2, dd), F(g, e2, i1, e1, i2, e2), F(g, e2, g * i1, dd, g * i2, 0), F(g, e2, i1, dd + 1, i2, 0)]) };
  },
  // 8. [хүнд] Нэг гишүүнтээр олон гишүүнтийг гишүүнчлэн үржүүлэх (5.4); төөрөгдүүлэгч: тэмдэг, сул гишүүнийг үржүүлэхээ мартах, хувьсагчаар үржүүлэхээ мартах
  function () {
    var v = pick(['x', 'a', 'y']), k = nz(-5, 5), e = rnd(1, 2), p2 = rnd(1, 5), p1 = nz(-7, 7), p0 = nz(-9, 9);
    if (Math.abs(k) === 1) return null;
    function P3(a, ea, b, eb, c, ec) { return { t: poly([{ c: a, w: vp(v, ea) }, { c: b, w: vp(v, eb) }, { c: c, w: vp(v, ec) }]), f: function (x) { return a * Math.pow(x, ea) + b * Math.pow(x, eb) + c * Math.pow(x, ec); } }; }
    var st = co(k, vp(v, e)) + '(' + poly([{ c: p2, w: vp(v, 2) }, { c: p1, w: v }, { c: p0, w: '' }]) + ')';
    return { stem: '$' + st + '$ илэрхийллийн хаалтыг задалбал аль нь гарах вэ?',
      mc: AMC(P3(k * p2, e + 2, k * p1, e + 1, k * p0, e), [P3(k * p2, e + 2, -k * p1, e + 1, k * p0, e), P3(k * p2, e + 2, k * p1, e + 1, p0, 0),
        P3(k * p2, 2, k * p1, 1, k * p0, 0), P3(-k * p2, e + 2, -k * p1, e + 1, -k * p0, e), P3(k * p2, e + 2, k * p1, e + 1, -k * p0, e)]) };
  },
  // 9. [хүнд] Хоёр талдаа хаалттай шугаман тэгшитгэл a(bx+c)=d(ex+f) (5.5); төөрөгдүүлэгч: тоог үржүүлэхээ мартах, шилжүүлэхэд тэмдэг андуурах
  function () {
    var x0 = nz(-8, 9), a = rnd(2, 7), d = rnd(2, 7), b = rnd(1, 4), e = rnd(1, 4), c = nz(-9, 9);
    if (a * b === d * e) return null;
    var num = a * (b * x0 + c) - d * e * x0; if (num % d !== 0) return null;
    var f = num / d; if (f === 0 || Math.abs(f) > 15) return null;
    var L = a * b - d * e, R = d * f - a * c;   // L·x = R
    return { stem: '$' + a + '(' + lin(b, c, 'x') + ')=' + d + '(' + lin(e, f, 'x') + ')$ тэгшитгэлийн шийд аль нь вэ?',
      mc: VMC(NV(x0), [NV(-x0), QV(d * f + a * c, L), QV(f - c, L), QV(R, a * b + d * e), NV(x0 + 1), NV(x0 - 2)]) };
  },
  // 10. [хүнд] Бодлогыг тэгшитгэл зохиож бодох (5.6): толгой-хөл, санасан тоо, үнийн харьцаа
  function () {
    var t = rnd(1, 3);
    if (t === 1) {
      var P = pick([['тахиа', 'хонь'], ['нугас', 'ямаа'], ['галуу', 'туулай']]), c = rnd(4, 20), r = rnd(3, 15), H = c + r, L = 2 * c + 4 * r;
      if (c === r) return null;
      return { stem: 'Хашаанд ' + P[0] + ', ' + P[1] + ' нийт $' + H + '$ толгой, $' + L + '$ хөлтэй. ' + cap(P[1]) + ' хэд вэ?',
        mc: VMC(NV(r), [NV(c), NV(L - 2 * H), NI(L, 4), NI(H, 2), NV(r + 2), NV(r - 1)]) };
    }
    if (t === 2) {
      var x = rnd(2, 15), a = rnd(3, 9), c2 = rnd(2, a - 1), b = rnd(1, 20), d = (a - c2) * x + b;
      if (d > 60) return null;
      return { stem: 'Нэг тоог $' + a + '$ дахин ихэсгээд $' + b + '$ нэмбэл, уг тоог $' + c2 + '$ дахин ихэсгээд $' + d + '$ нэмсэнтэй тэнцүү. Тоо хэд вэ?',
        mc: VMC(NV(x), [QV(d + b, a - c2), QV(d - b, a + c2), NV(d - b), NV(x + 1), NV(x - 1)]) };
    }
    var P2 = pick([['Ширээ', 'сандлаас', 'Сандал'], ['Хөргөгч', 'зурагтаас', 'Зурагт'], ['Компьютер', 'утаснаас', 'Утас']]), k = rnd(2, 5), sp = 1000 * rnd(3, 25), D = (k - 1) * sp;
    return { stem: P2[0] + ' ' + P2[1] + ' $' + k + '$ дахин үнэтэй бөгөөд $' + th(D) + '$ төгрөгөөр илүү. ' + P2[2] + ' хэдэн төгрөг вэ?',
      mc: VMC(NV(sp), [NV(k * sp), NI(D, k), NV(D), NI(D, k + 1), NV(sp + 1000), NV(sp - 1000)]) };
  }
];

/* ── II. Задгай (5) ── */
var FREE = [
  // 11. [2 оноо] Хаалт задалж хялбарчлаад утгыг олох (5.1)
  function () {
    var v = pick(['a', 'x', 'm']), A = rnd(2, 6), D = rnd(2, 6), b = rnd(1, 5), e = rnd(1, 4), c = nz(-9, 9), f = nz(-9, 9), s = pick([1, -1]), v0 = nz(-5, 5);
    var X = A * b + s * D * e, S = A * c + s * D * f; if (X === 0) return null;
    return { stem: '$' + A + '(' + lin(b, c, v) + ')' + (s > 0 ? '+' : '-') + D + '(' + lin(e, f, v) + ')$ илэрхийллийг хялбарчлаад $' + v + '=' + v0 + '$ үеийн утгыг ол.',
      a: '$' + lin(X, S, v) + '$; утга нь $' + (X * v0 + S) + '$' };
  },
  // 12. [2 оноо] а) (k·a^m)^n·c·a^p — зэргийн чанар; б) нэг гишүүнтийг нэг гишүүнтэд хуваах (5.2–5.3)
  function () {
    var v = pick(['a', 'x', 'y']), k = rnd(2, 4), m = rnd(2, 4), n = rnd(2, 3), c = rnd(2, 5), p = rnd(1, 4);
    var P = pick([['x', 'y'], ['a', 'b'], ['m', 'n']]), g = rnd(2, 6), r = nz(-5, 5), a1 = rnd(3, 7), b1 = rnd(2, 5), a2 = rnd(1, a1 - 1), b2 = rnd(1, b1 - 1);
    if (Math.abs(r) === 1 || (k === 4 && n === 3)) return null;
    function mono(K, p1, q1) { return co(K, vp(P[0], p1) + vp(P[1], q1)); }
    return { stem: 'Хялбарчил: а) $(' + k + vp(v, m) + ')^{' + n + '}\\cdot ' + c + vp(v, p) + '$; б) $\\dfrac{' + mono(g * r, a1, b1) + '}{' + mono(g, a2, b2) + '}$',
      a: 'а) $' + Math.pow(k, n) * c + vp(v, m * n + p) + '$; б) $' + mono(r, a1 - a2, b1 - b2) + '$' };
  },
  // 13. [3 оноо] Бутархай коэффициенттэй шугаман тэгшитгэл (5.5)
  function () {
    var D = pick([[2, 3], [3, 4], [4, 6], [2, 5], [3, 6], [4, 3], [6, 4], [2, 4], [5, 3]]), p = D[0], q = D[1], s = pick([1, -1]), m = nz(-7, 7), n = nz(-7, 7), x0 = nz(-9, 14);
    if (q + s * p === 0) return null;
    var top = q * (x0 + m) + s * p * (x0 + n); if (top % (p * q) !== 0) return null;
    var R = top / (p * q); if (Math.abs(R) > 15) return null;
    return { stem: 'Тэгшитгэлийг бод: $\\dfrac{' + lin(1, m, 'x') + '}{' + p + '}' + (s > 0 ? '+' : '-') + '\\dfrac{' + lin(1, n, 'x') + '}{' + q + '}=' + R + '$',
