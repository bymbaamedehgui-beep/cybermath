var INK = '#1a1030';
function r1(v) { return Math.round(v * 10) / 10; }

  var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;

  // 1. гүдгэр олон өнцөгтийн дотоод өнцгүүдийн нийлбэр (6.1) — хялбар
