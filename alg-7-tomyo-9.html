<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>9-р анги — 7 томьёо, олон үйлдэлт илэрхийлэл</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--purple:#7B52EE;--purple2:#A855F7;--ink:#1a1030;--soft:#7a7390;--line:#e7ddff;--green:#16a34a;--amber:#9a6300}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:#eceaf3;padding:16px;line-height:1.5}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-weight:800;border:0;cursor:pointer;border-radius:999px;padding:.6rem 1.3rem;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 6px 16px -6px rgba(123,82,238,.6)}
  .btn:hover{filter:brightness(1.06)} .btn.refresh{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .bar label{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;font-size:.88rem}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 12px 44px -18px rgba(0,0,0,.35)}
  .head{text-align:center;border-bottom:2.5px solid var(--purple);padding-bottom:8px;margin-bottom:8px}
  .head h1{font-size:19px;color:#5a32d6;font-weight:800}.head .sub{font-size:11.5px;color:var(--soft);margin-top:2px}
  .meta{display:flex;justify-content:space-between;font-size:12px;margin:8px 2px 12px}.meta span{border-bottom:1px dotted #b3a9cf;padding:0 30px 2px 4px}
  .formulas{background:#f7f4ff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}
  .formulas h3{font-size:12px;color:#5a32d6;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  .fg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 22px;font-size:12.5px}
  .fg .fi{display:flex;gap:7px}.fg .fn{color:var(--purple);font-weight:800;min-width:16px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 20px}
  .q{break-inside:avoid;page-break-inside:avoid;padding:6px 4px 8px;border-bottom:1px dashed #efeaff}
  .qt{display:flex;gap:6px;align-items:baseline;font-size:15px}.qn{font-weight:800;color:var(--purple);min-width:22px}
  .work{margin-top:6px;height:24mm;border:1.2px solid #ddd3f7;border-radius:6px;background-image:linear-gradient(#f0ecfb 1px,transparent 1px);background-size:100% 6mm}
  .ans-page{margin-top:9mm;border-top:2px dashed #ddd;padding-top:7mm}.ans-page h2{font-size:15px;color:#5a32d6;margin-bottom:10px}
  .sol{break-inside:avoid;page-break-inside:avoid;margin-bottom:11px;padding-bottom:8px;border-bottom:1px dashed #eee}
  .sol .sh{font-weight:800;color:var(--purple);font-size:13px;margin-bottom:2px}
  .sol .step{font-size:13.5px;margin:1px 0 1px 14px}
  .sol .fin{font-size:13.5px;margin:2px 0 0 14px;color:var(--green);font-weight:700}
  #answers{display:none}
  @media print{body{background:#fff;padding:0}.bar{display:none}.sheet{box-shadow:none;width:auto;min-height:auto;padding:0;margin:0}@page{size:A4;margin:12mm}.ans-page{break-before:page}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn refresh" onclick="build()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Шинэ бодлого</button>
  <label><input type="checkbox" id="sa" onchange="toggleAns()"> Бодолт хавсаргах</label>
  <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Хэвлэх / PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function toggleAns(){var el=document.getElementById('answers');if(el)el.style.display=document.getElementById('sa').checked?'block':'none';}

// Товчилсон үржихийн 7 томьёог ашигласан олон үйлдэлт илэрхийллүүд.
// Тус бүр {q, steps[], ans} буцаана. a нь 2..9 бүхэл тоо.
var TEMPLATES=[
  function(a){var a2=a*a; return {
    q:'(x+'+a+')^{2}+(x-'+a+')^{2}',
    steps:['=(x^{2}+'+(2*a)+'x+'+a2+')+(x^{2}-'+(2*a)+'x+'+a2+')',
           '=2x^{2}+'+(2*a2)],
    ans:'2x^{2}+'+(2*a2)};},

  function(a){var a2=a*a; return {
    q:'(x+'+a+')^{2}-(x-'+a+')^{2}',
    steps:['=(x^{2}+'+(2*a)+'x+'+a2+')-(x^{2}-'+(2*a)+'x+'+a2+')',
           '=x^{2}+'+(2*a)+'x+'+a2+'-x^{2}+'+(2*a)+'x-'+a2,
           '='+(4*a)+'x'],
    ans:''+(4*a)+'x'};},

  function(a){var a2=a*a; return {
    q:'(x-'+a+')(x+'+a+')+'+a2,
    steps:['=(x^{2}-'+a2+')+'+a2,
           '=x^{2}'],
    ans:'x^{2}'};},

  function(a){var a2=a*a; return {
    q:'(x+'+a+')^{2}-'+(2*a)+'x',
    steps:['=x^{2}+'+(2*a)+'x+'+a2+'-'+(2*a)+'x',
           '=x^{2}+'+a2],
    ans:'x^{2}+'+a2};},

  function(a){var a2=a*a,a3=a*a*a; return {
    q:'(x+'+a+')^{3}-(x-'+a+')^{3}',
    steps:['=(x^{3}+'+(3*a)+'x^{2}+'+(3*a2)+'x+'+a3+')-(x^{3}-'+(3*a)+'x^{2}+'+(3*a2)+'x-'+a3+')',
           '='+(6*a)+'x^{2}+'+(2*a3)],
    ans:''+(6*a)+'x^{2}+'+(2*a3)};},

  function(a){var a2=a*a,a3=a*a*a; return {
    q:'(x+'+a+')^{3}+(x-'+a+')^{3}',
    steps:['=(x^{3}+'+(3*a)+'x^{2}+'+(3*a2)+'x+'+a3+')+(x^{3}-'+(3*a)+'x^{2}+'+(3*a2)+'x-'+a3+')',
           '=2x^{3}+'+(6*a2)+'x'],
    ans:'2x^{3}+'+(6*a2)+'x'};},

  function(a){var a2=a*a,a3=a*a*a; return {
    q:'(x+'+a+')(x^{2}-'+a+'x+'+a2+')',
    steps:['\\text{— энэ нь } a^{3}+b^{3} \\text{ томьёоны баруун тал}',
           '=x^{3}+'+a3],
    ans:'x^{3}+'+a3};},

  function(a){var a2=a*a,a3=a*a*a; return {
    q:'(x-'+a+')(x^{2}+'+a+'x+'+a2+')',
    steps:['\\text{— энэ нь } a^{3}-b^{3} \\text{ томьёоны баруун тал}',
           '=x^{3}-'+a3],
    ans:'x^{3}-'+a3};},

  function(a){var a2=a*a,a3=a*a*a; return {
    q:'\\dfrac{x^{3}-'+a3+'}{x-'+a+'}',
    steps:['=\\dfrac{(x-'+a+')(x^{2}+'+a+'x+'+a2+')}{x-'+a+'}',
           '=x^{2}+'+a+'x+'+a2],
    ans:'x^{2}+'+a+'x+'+a2};},

  function(a){var a2=a*a; return {
    q:'(x+'+a+')^{2}+(x+'+a+')(x-'+a+')',
    steps:['=(x^{2}+'+(2*a)+'x+'+a2+')+(x^{2}-'+a2+')',
           '=2x^{2}+'+(2*a)+'x',
           '=2x(x+'+a+')'],
    ans:'2x(x+'+a+')'};},

  function(a){var a2=a*a; return {
    q:'(x+'+a+')^{2}-(x-'+a+')^{2}+(x-'+a+')(x+'+a+')',
    steps:['='+(4*a)+'x+(x^{2}-'+a2+')',
           '=x^{2}+'+(4*a)+'x-'+a2],
    ans:'x^{2}+'+(4*a)+'x-'+a2};},
];

var FORMULAS=[
  '(a+b)^{2}=a^{2}+2ab+b^{2}',
  '(a-b)^{2}=a^{2}-2ab+b^{2}',
  'a^{2}-b^{2}=(a-b)(a+b)',
  '(a+b)^{3}=a^{3}+3a^{2}b+3ab^{2}+b^{3}',
  '(a-b)^{3}=a^{3}-3a^{2}b+3ab^{2}-b^{3}',
  'a^{3}+b^{3}=(a+b)(a^{2}-ab+b^{2})',
  'a^{3}-b^{3}=(a-b)(a^{2}+ab+b^{2})',
];

var N=9; // бодлогын тоо

function build(){
  // томьёонуудыг холиод N ширхгийг сонгоно
  var order=[];for(var i=0;i<TEMPLATES.length;i++)order.push(i);
  for(var i=order.length-1;i>0;i--){var j=rnd(0,i);var t=order[i];order[i]=order[j];order[j]=t;}
  var probs='',sols='',WS=[];
  for(var i=0;i<N;i++){
    var ti=order[i%order.length];
    var a=rnd(2,9);
    var pr=TEMPLATES[ti](a);
    var k=i+1;
    probs+='<div class="q"><div class="qt"><span class="qn">'+k+'.</span><span>$'+pr.q+'=$</span></div><div class="work"></div></div>';
    var stepHtml=pr.steps.map(function(s){return '<div class="step">$'+s+'$</div>';}).join('');
    sols+='<div class="sol"><div class="sh">'+k+'-р бодлого</div>'
      +'<div class="step">$'+pr.q+'$</div>'+stepHtml
      +'<div class="fin">$\\Rightarrow\\ '+pr.ans+'$</div></div>';
    WS.push({q:pr.q,a:pr.ans});
  }
  var fg=FORMULAS.map(function(f,i){return '<div class="fi"><span class="fn">'+(i+1)+'.</span><span>$'+f+'$</span></div>';}).join('');
  document.getElementById('sheet').innerHTML=
    '<div class="head"><h1>Товчилсон үржихийн 7 томьёо — олон үйлдэлт илэрхийлэл</h1>'
    +'<div class="sub">9-р анги · ахисан түвшин · хялбарчлах · бодолттой · '+N+' бодлого</div></div>'
    +'<div class="meta"><span>Нэр: </span><span>Огноо: </span><span>Оноо: </span></div>'
    +'<div class="formulas"><h3>Товчилсон үржихийн 7 томьёо</h3><div class="fg">'+fg+'</div></div>'
    +'<div class="grid">'+probs+'</div>'
    +'<div class="ans-page" id="answers"><h2>Бодолт</h2>'+sols+'</div>';
  toggleAns();
  window.WS_ITEMS=WS; window.WS_TITLE='7 томьёо — олон үйлдэлт илэрхийлэл (9-р анги)';
  try{renderMathInElement(document.getElementById('sheet'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
}
build();
</script>
<script src="/ws-store.js?v=14"></script>
</body>
</html>
